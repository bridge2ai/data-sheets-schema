notes: >-
  Instrument finding: the coverage receipt's external_resources paths were written
  against the pre-reconciliation ordering, and Phase 4 reordered that list, so the
  receipt's slot paths are one index off (the portal snippet receipted under
  external_resources[8] attests today's [7]) — slot-009's unsupported verdict is that
  path-shift artifact, not laundering; the value it sits under is genuinely attested at
  bundle lines 1429–1432. The same run has 21 adjacent and 5 elsewhere snippets per the
  validator, and three of the sampled receipted items (slot-011, slot-018, slot-025,
  slot-029) cite a chunk one off from where their passage lives; support held in every
  case. Un-sampled disagreement: the tier-2 portal data-releases page states "IF images
  for 523 proteins" for TNBC (line 4433), a third figure in the 563-vs-464 imaged-protein
  conflict that instances[0].source_caveats does not mention; the same page dates the
  June 2026 release "June 17, 2025" (4445–4446), a source typo the record silently
  corrects via the Dataverse publication date. Two c004 receipt snippets ("the node2vec",
  "to represent each protein") sit near the 8-character attestation floor and two
  snippets were flagged no_value_overlap by the validator.
