  evidence: "fifteen Creator objects, one per named investigator (full record lines 70-117); five purposes, five prohibited_uses, four addressing_gaps each one entity per object. Borderline, not a collapse of entities: distribution_dates[0].release_dates packs six dated releases into one string element"
- id: rule-06
