  evidence: "one referent held throughout: the adult PhysioNet release pinned at 3.1.0 (id doi:10.13026/8xbn-nq66, line 15), the pediatric release expressed as related_datasets[0] exactly as the manifest scope declares (express_as: related_datasets); reconciliation report section 1 states the identity choice"
