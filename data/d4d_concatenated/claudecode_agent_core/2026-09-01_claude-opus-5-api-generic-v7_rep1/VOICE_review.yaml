- id: rule-08
  verdict: violated
  evidence: "creators[*].principal_investigator is declared range Person (declared fields id/name/orcid/affiliation; Person.id is a uriorcurie identifier), but Phase 4 deliberately flattened all fifteen from {name: ...} to bare name strings (full record line 71 'principal_investigator: Yael Bensoussan'; reconciliation report section 5 records the conversion). The declared field that was populated (name) is now abandoned, and the name string sits where a Person reference (uriorcurie id) belongs"
- id: rule-09
  verdict: followed
  evidence: "every uriorcurie slot holds a CURIE, not a resolver URL: id doi:10.13026/8xbn-nq66 (line 15), related_datasets targets doi:10.13026/h995-bt35 and doi:10.57764/qb6h-em84 (lines 965, 974), latest_version_doi doi:10.13026/37yb-1t42 (line 889), data_topic/data_substrate B2AI CURIEs; the doi slot holds the bare DOI (line 51) and access_urls (range uri) hold URLs"
- id: rule-10
  verdict: followed
  evidence: "every world-facing identifier is in the bundle: 10.13026/8xbn-nq66 (line 4831), 37yb-1t42 (5140), h995-bt35 (5494), qb6h-em84 (3781), 249v-w155 (3621), k81f-qr68 (4162), mf9s-5r03 (5659), zenodo 10.5281/zenodo.12760724 (1447) and 13834653 (5727), RRID:SCR_007345 inside the quoted citation (4820-4823). B2AI_TOPIC/B2AI_SUBSTRATE local parts are schema-directed vocabulary (values_from B2AI_TOPIC), noted in notes"
- id: rule-11
  verdict: not_applicable
  evidence: "the pack's id_slots block lists no entries: the record mints no urn and no fragment; its own id is the evidence-attested DOI CURIE (line 15)"
- id: rule-12
  verdict: followed
  evidence: "American English throughout ('standardized', 'organized', 'license', 'authorized', 'de-identification'); a grep for licence/organisation/standardise/behaviour/colour/analyse finds none; the quoted title keeps its source form 'ethically-sourced' (line 17)"
- id: rule-13
  verdict: followed
  evidence: "the manifest's source_priority ranks data resource (PhysioNet pages) tier 1 above documentation tier 2 and publications tier 3; the record prefers PhysioNet and says so with both sides recorded (content_warnings[0].source_caveats, the counts sentence in source_caveats); where sources share rank the caveat leaves it unsettled (collection_timeframes[0].source_caveats: 'the sources do not settle whether the 12 months are a subset')"
- id: rule-14
  verdict: not_applicable
  evidence: "no fragment identifiers exist to judge (id_slots entries empty); parts such as the phenotype folder and feature files are described in prose, not labeled"
- id: rule-15
  verdict: violated
  evidence: "the receipt was emitted, well-formed and validated (bundle_md5 dcd71717... matches, 22/22 chunks reviewed, statuses from the closed set), but it covers 120 of 287 slot values: the rule says a value with no receipt is one the record must not carry, and many receiptless values are bundle-supplied and untouched by later phases - sensitive_elements[2]/[3] (lines 2086, 1938), creators[2..14] (line 2028), tasks[1]/[2] (lines 2024, 2022), variables[1] (line 4950). Phase-4 rewrites (doi, id) legitimately lack a receipt route (#742), but the phase-1 receipt under-covered the record it accompanied"
- id: rule-16
  verdict: followed
  evidence: "no object sits in a scalar-ranged slot: grantor (range string) holds 'National Institutes of Health Common Fund' (line 119), instance_type holds a string, created_by holds the consortium name; the one scalar-vs-class defect runs the other way and is recorded under rule-08"
notes: >-
  Instrument findings, not verdicts: (1) the receipt validator already reports the six
  adjacent/elsewhere snippet attributions I confirmed (slot-004 c002->c003 line 524,
  slot-006 c014->c013 lines 3453-3457, slot-012 c013 snippet verbatim at line 2201 in
  c009); support holds in every case. (2) Receipt coverage is inconsistent in kind:
  sensitive_elements[1].sensitivity_details is receipted while the identically shaped
  [2] and [3] are not - this is the substance of the rule-15 verdict. (3) The
  B2AI_TOPIC:36 / B2AI_TOPIC:25 / B2AI_SUBSTRATE:30 local parts cannot be verified
  against the bundle or the schema (the registry behind the schema-declared prefix is
  external); if the registry resolves them to non-audio concepts the values would be
  wrong in a way this review cannot detect. (4) The reconciliation report itself states
  that the schema declares principal_investigator with range Person and then records
  the flattening to a scalar as a normalization - the rule-08 violation was introduced
  deliberately in Phase 4, not by the generation phase.
