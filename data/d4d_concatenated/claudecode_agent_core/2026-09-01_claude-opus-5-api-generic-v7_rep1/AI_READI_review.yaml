notes: >-
  Three instrument observations. (1) Reshape artifacts surfaced as receipted items: the
  c015 accessType receipt under regulatory_restrictions.other_compliance (slot-008)
  describes the pre-reconciliation value that finding 12 moved into source_caveats -
  the post-receipt rewrite path (#742) rather than laundering. (2) The coverage
  receipt's variables[22]-[26] paths are one higher than the final record (receipt
  c002 variables[25] = monofilament test; final monofilament is variables[24]) -
  index drift from the reconciliation's variable edits; the sampled items did not hit
  these paths, but the path_off_by_one class is doing work here. (3) The pack's
  id_slots marks file_collections[*].id minted: false because the flag keys on the
  record's own doi, yet these ids are constructed fragment labels on the attested
  fairhub page URL that no bundle line states as composites; they therefore fall to
  the receiptless track, where I read them as exempt-by-nature fragments (slot-045) -
  a classification edge the pack schema might want to name. Also worth noting:
  instances[0].data_topic (B2AI_TOPIC:43) is checkable against neither the bundle nor
  the pack's schema files - only the external standards registry can confirm the code
  denotes diabetes.
