  receipt attributes the MIT and Apache-2.0 snippets to license_and_use_terms.license_terms
  while the record carries those facts in license_and_use_terms.notes — an attribution
  imprecision the deterministic validator cannot see since it checks only snippet-in-chunk;
  (3) the claim-receipt sidecar is null in the pack (records.claims: null). The rule-15
  violation should be read with #742 in mind: an unknown share of the 111 receiptless slots
  are Phase 4 reshapes with no receipt route, but at least page and tasks[2] predate Phase 4
  and are bundle-stated yet unreceipted.
