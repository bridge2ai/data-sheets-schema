    conforms_to_standard:
      - CDS
      - OPEN_MHEALTH
    notes: >-
      15,245 files. Data from the Garmin Vivosmart 5 wearable fitness tracker, organized
      into seven modality directories: heart_rate, oxygen_saturation, physical_activity,
      physical_activity_calorie, respiratory_rate, sleep and stress, each containing a
      garmin_vivosmart5 device directory.
  - path: wearable_blood_glucose
    bytes: 4169006971
    conforms_to: >-
      Clinical Dataset Structure (CDS) v0.1.1 for naming and organization; Open mHealth for
      all data files.
    conforms_to_standard:
      - CDS
      - OPEN_MHEALTH
    notes: >-
      2,246 files. Continuous glucose monitoring data under the modality directory
      continuous_glucose_monitoring and device directory dexcom_g6.
  - path: /
    conforms_to: Clinical Dataset Structure (CDS) v0.1.1
    conforms_to_standard:
      - CDS
    notes: >-
      9 root-level metadata files distributed with the release, all following the Clinical
      Dataset Structure (CDS) v0.1.1: CHANGELOG.md, dataset_description.json,
      dataset_structure_description.json, healthsheet.md, LICENSE.txt, participants.json,
      participants.tsv, README.md and study_description.json. The whole release comprises
      356,343 files totaling 3,815,969,779,678 bytes (approximately 3.82 TB).

