      JSON (dataset_description.json, dataset_structure_description.json,
      study_description.json, participants.json, dqd_omop.json)
    media_type: application/json
  - format: Markdown (README.md, CHANGELOG.md, healthsheet.md)
    media_type: text/markdown
  - format: >-
      Tab-separated values (participants.tsv at the root and manifest.tsv within each
      datatype directory)
  - format: >-
      WaveForm DataBase (WFDB) signal and annotation files for the twelve-lead
      electrocardiography data

