purposes:
  - response: >-
      To enable future generations of artificial intelligence and machine learning
      research to provide critical insights into type 2 diabetes mellitus, including
      salutogenic pathways to return to health.
  - response: >-
      To collect and publicly share a multimodal, AI-ready dataset for studying the
      pathogenesis and salutogenesis of type 2 diabetes mellitus.
  - response: >-
      To develop a foundational dataset in type 2 diabetes that is agnostic to existing
      classification criteria or biases and that can be used to reconstruct a temporal
      atlas of disease development and reversal toward health.
  - response: >-
      To create a model for developing large, scalable, ethically sourced datasets, and
      to establish standards, best practices and guidelines for the collection,
      preparation and sharing of data for artificial intelligence and machine learning,
      following the Findable, Accessible, Interoperable and Reusable principles.
  - response: >-
      To increase access to and quality of artificial intelligence and machine learning
      research by recruiting and training personnel, including through a year-long
      AI-READI research internship program.

addressing_gaps:
  - response: >-
      A major barrier to the use of artificial intelligence in diabetes research has been
      the lack of diverse datasets that are AI ready for training AI models; the AI-READI
      dataset is intended to fill this gap.
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases
      such as type 2 diabetes has been limited by a lack of well-designed, high quality,
      large and inclusive multimodal datasets.
  - response: >-
      Existing large datasets used for AI and machine learning training lack racial and
      ethnic diversity. A meta-epidemiological review of type 2 diabetes studies published
      between 2000 and 2020 found that samples lacked racial and ethnic diversity, and
      the deleterious consequences of the disease are exacerbated in populations that
      bear a higher burden of it.
  - response: >-
      The multi-domain acquisition protocol was designed to enable downstream analyses
      that may not be feasible with existing data sources such as claims data or
      electronic health records data.
  - response: >-
      Current understanding of type 2 diabetes, especially in the context of
      salutogenesis, is limited, and no comparable large publicly accessible dataset with
      many multidomain variables relevant to the disease was available.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis, an approach used to predict disease
      trajectories by collecting and learning from complex, multimodal data from
      participants with differing disease severity, from normal to insulin-dependent type
      2 diabetes.
  - response: >-
      Development of artificial intelligence and machine learning models of type 2
      diabetes salutogenesis, the pathway from disease back to health.
  - response: >-
      Definition of disease trajectories and underlying genetic links across different
      racial and ethnic cohorts.
  - response: >-
      Multimodal model development combining survey, clinical, imaging, waveform,
      wearable and environmental sensor data for a single cohort.

instances:
  - instance_type: >-
      An individual study participant. Each instance consists of all of the data
      available for one individual participating in the study, organized as a
      participant-level directory beneath each datatype, modality and device directory.
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    label_description: >-
      No explicit label or target is associated with each data instance. The dataset is
      hypothesis-agnostic and no labeling was performed, so no gold-standard, proxy or
      human-assigned labels are provided.
    notes: >-
      Earlier releases contained 204 instances (version 1.0.0, pilot data collection
      phase) and 1,067 instances (version 2.0.0). All instances are part of the same
      prospective data generation project (AI-READI) and there is currently only one study
      visit per participant, so instances are not linked to one another by repeated
      measurement; records for a single participant are linked across datatypes,
      modalities and devices by the participant identifier used as the directory name, and
      are summarized in the participants.tsv metadata file.

subpopulations:
  - identification: >-
      Diabetes status group assigned at enrollment and recorded in the participants.tsv
      metadata file: no diabetes; pre-diabetes or type 2 diabetes controlled by lifestyle
      adjustments; type 2 diabetes controlled by oral or non-insulin injectable
      medications; type 2 diabetes controlled by insulin.
    distribution: >-
      Across the 2,280 participants in release 3.0.0: no diabetes 776; lifestyle
      controlled 560; oral or non-insulin injectable medication controlled 686; insulin
      controlled 258.
    subpopulation_elements_present: true
  - identification: >-
      Self-reported race and ethnicity collected at screening. Individual-level values are
      withheld from the public release and held under controlled access; only aggregate
      counts accompanying the recommended data split are published.
    distribution: >-
      Across the 2,280 participants in release 3.0.0: Hispanic 380; Asian 545; Black 519;
      White 836.
    subpopulation_elements_present: false
  - identification: >-
      Self-reported biological sex collected at screening. Individual-level values are
      withheld from the public release and held under controlled access; only aggregate
      counts accompanying the recommended data split are published.
    distribution: >-
      Across the 2,280 participants in release 3.0.0: male 951; female 1,329.
    subpopulation_elements_present: false
  - identification: >-
      Age at enrollment. All participants are adults aged 40 years or older.
    distribution: >-
      Mean age across the 2,280 participants is 60.8 years with a standard deviation of
      11.3 years; the training, validation and test partitions have mean ages of
      61.1 (SD 11.3), 60.3 (SD 10.8) and 60.5 (SD 11.4) years respectively.
    subpopulation_elements_present: true
  - identification: >-
      Data collection site. Participants were recruited at three geographically distinct
      sites, selected for geographic variability across the United States and to obtain
      representation across racial and ethnic groups.
    distribution: >-
      Three sites contributed participants: the University of Alabama at Birmingham
      (Birmingham, Alabama), the University of California San Diego (San Diego,
      California) and the University of Washington (Seattle, Washington). Per-site counts
      are not reported in the sources.
    subpopulation_elements_present: true

anomalies:
  - anomaly_details: >-
      In survey data, skipped questions and incomplete responses are expected.
  - anomaly_details: >-
      In data collected with wearables, improper use and technical failures such as
      battery failure or system malfunction are expected. In a few cases the data
      collection device had no stored results or was returned too late for the results to
      be retrieved, for example because the battery died or the data were lost.
  - anomaly_details: >-
      In imaging data, participant uncooperation, noise that may obscure the images, and
      technical failures such as system malfunction or data transfer failure are expected.
  - anomaly_details: >-
      In a few cases there may have been a data collision at some point in the processing
      pipeline and data have been lost.
  - anomaly_details: >-
      Fluorescence lifetime imaging ophthalmoscopy is highly sensitive to movement: the
      device cannot tolerate more than one centimeter of movement during image
      acquisition, and unwanted signals such as background light or fluorescence from the
      lens cannot simply be subtracted because they are part of the same Poisson
      distribution as the useful photon data. Because the FLIO scan takes longer than a
      standard OCT and exposes participants to uncomfortable light levels, it was
      performed last in the visit, when participant compliance may be lower.
  - anomaly_details: >-
      Optomed Aurora fundus photographs are acquired undilated with a handheld camera, so
      image quality varies from participant to participant and within the same
      participant.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, so the study is subject to volunteer bias, which may
      limit the generalizability of results to those who are not represented in the study
      population.
    mitigation_strategy: >-
      Recruitment proceeds in waves whose composition and size are influenced by observed
      participation characteristics of race/ethnicity, gender, severity of type 2 diabetes
      and site; composition is monitored for diversity and inclusion as recruitment
      progresses and adjusted by under- and oversampling groups as needed.
  - bias_type: sampling_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based: contact pools are identified
      by screening the electronic health records of three academic health systems for
      patients aged 40 or older who had an encounter within those systems, using ICD-10
      diagnosis codes R73.09 for pre-diabetes and E11.X for type 2 diabetes. This may not
      fully capture all possible cultural and socioeconomic backgrounds.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic variability across
      the United States and to obtain representation across racial and ethnic groups, and
      individuals from all demographic backgrounds were recruited at all three sites.
      Uniform data collection protocols were implemented for all participants irrespective
      of race/ethnicity, biological sex or diabetes severity across all sites.
  - bias_type: representation_bias
    bias_description: >-
      Although the study ultimately aims for balance across race/ethnicity, biological sex
      and diabetes presence and severity, enrollment is ongoing and the periodic data
      releases may not have achieved a balanced distribution across groups. The cohort
      does not include other races and ethnicities such as Pacific Islanders and Native
      Americans.
    mitigation_strategy: >-
      Triple-balanced recruitment targets of equal proportions across four race/ethnic
      groups, four diabetes categories and biological sex; new recruitment strategies were
      to be implemented if balancing on race and ethnicity emerged as a challenge. A
      recommended data split whose validation and test partitions are balanced across
      these groups is distributed with the release.
    affected_subsets:
      - >-
        The release as a whole, most visibly the recommended training partition, which was
        not balanced. Aggregate counts across all 2,280 participants are Hispanic 380,
        Asian 545, Black 519 and White 836, and male 951 against female 1,329, while the
        validation and test partitions were deliberately balanced at 88 participants per
        race/ethnic group and 176 per sex.
  - bias_type: selection_bias
    bias_description: >-
      Eligible participants are required to speak, read and understand English, which the
      protocol authors note may have created challenges in recruiting Hispanic and Asian
      persons. Recruiting Black men into health research is documented as more difficult
      than recruiting other populations even though that population bears a
      disproportionate share of the burden of type 2 diabetes, and similar trends for
      under-recruitment have been reported for Hispanic and Asian persons.
    mitigation_strategy: >-
      Recruitment materials were personalized and the online REDCap recruitment interface
      offered a call-back option; a Community Advisory Board of eleven persons from the
      three sites, including diversity in race and ethnicity as represented in the AI-READI
      sample, contributed to the development of the protocol.
  - bias_type: measurement_bias
    bias_description: >-
      Several instruments require operator involvement, so operator-induced variation is
      possible: Heidelberg Spectralis acquisition is not fully automated and quality issues
      may lead to a modality being skipped and data being missing, whereas Topcon Triton
      and Maestro2 acquisition is largely automatic with minimal operator involvement.
    mitigation_strategy: >-
      All research personnel who recruited, enrolled and collected data underwent training
      by the data manager and worked from a detailed Manual of Procedures; a certification
      process was required for all coordinators, including mandatory institutional
      compliance training for human subject research and successful administration of all
      protocol elements to at least three volunteer practice subjects before enrolling
      participants. Device make, model and scan modality were documented to support
      repeatability, and multiple devices were included for a single measure to enhance
      generalizability.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population.
      Recruitment was predominantly urban and hospital-based and may not fully capture all
      possible cultural and socioeconomic backgrounds.
    scope_impact: >-
      Limits the generalization of models derived from the dataset.
    recommended_mitigation: >-
      Three geographically distinct recording sites were used and information on device
      make and model was documented; users should nevertheless account for the recruitment
      base when assessing external validity.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The cohort does not include other races and ethnicities such as Pacific Islanders
      and Native Americans.
    scope_impact: >-
      Conclusions cannot be extended to groups absent from the cohort.
  - limitation_type: scope_limitation
    limitation_description: >-
      Eligibility is restricted to adults aged 40 years and older who are able to provide
      consent and who can read and speak English; pregnancy, gestational diabetes and type
      1 diabetes are exclusion criteria.
    scope_impact: >-
      The dataset carries no information about type 1 diabetes, gestational diabetes,
      pregnancy, younger adults or non-English speakers.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The study is cross-sectional and there is currently only one visit per participant.
      A longitudinal arm inviting approximately ten percent of the cohort back for a
      follow-up examination in year four of the project is planned but is not represented
      in this release.
    scope_impact: >-
      Disease trajectories must be inferred across participants of differing severity
      rather than followed within individuals.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Enrollment is ongoing and the pilot data release and periodic updates to data
      releases may not have achieved balanced distribution across groups, even though the
      completed study is designed to be triple-balanced.
    recommended_mitigation: >-
      Use the recommended train/validation/test split, whose validation and test sets are
      balanced as far as possible for sex, race/ethnicity and diabetes status.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Snellen visual acuity variables that were present in the previous release were
      dropped in release 3.0.0, so only logMAR visual acuity measurements are available.
    scope_impact: >-
      Analyses relying on Snellen notation must convert from logMAR or use an earlier
      release.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels, targets or human-level performance benchmarks accompany the dataset, and
      no formal guidelines are in place for researchers who wish to create new labels or
      define new tasks.
    recommended_mitigation: >-
      Users defining new tasks should document their own label definitions; the dataset
      documentation at docs.aireadi.org describes each data domain, its clinical context
      and its acquisition.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The dataset creators state that the dataset contains no data that, if viewed
      directly, might be offensive, insulting, threatening, or otherwise pose a safety
      risk such as psychological safety or anxiety.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The dataset creators state that the dataset contains no data that might be
      considered confidential and that no personally identifiable information is included.
      Data that are considered sensitive personal health data are withheld from the public
      release and are obtainable only under a data use agreement. The RO-Crate metadata
      assigns the release a confidentiality level of HL7:2N (normal).

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The RO-Crate metadata for release 3.0.0 flags the following as personal or sensitive
      information categories carried by the dataset: electronic health record data,
      wearable monitoring data, electrocardiography, environmental sensor data, continuous
      glucose monitor data and wearable accelerometer data.
    source_caveats: >-
      Two tier-one sources disagree. The RO-Crate lists these personal and sensitive
      information categories, while the FAIRhub healthsheet states that the public dataset
      does not contain data considered sensitive and that only the controlled-access
      dataset holds sensitive variables. Both statements are recorded because the sources
      are of equal rank.
  - sensitive_elements_present: false
    sensitivity_details: >-
      Variables treated as sensitive are withheld from this public release and held under
      controlled access, obtainable only by entering into a data use agreement: 5-digit
      zip code, sex, race, ethnicity, genetic sequencing data, past health records,
      medications, and traffic and accident reports. Information on sex and race/ethnicity
      was removed from the public set specifically to prevent stigmatization of findings.
      The boolean is false because these elements are absent from the release this
      datasheet describes.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    Removal of protected health information as defined by the HIPAA Privacy Rule using the
    Safe Harbor method, followed by verification that no data identifiable per US HIPAA
    were present.
  identifiers_removed: >-
    All direct identifiers and HIPAA protected health information; in addition, information
    related to participant sex and race/ethnicity and to medications used was removed from
    the public release.
  deidentification_details: >-
    The dataset metadata records that no identifiers were collected, so no active
    de-identification was necessary, but that the data were checked to confirm that no
    identifiable data per US HIPAA were present. Dates were not shifted, non-arrayed
    identifiers were not perturbed and k-anonymity was not applied. The RO-Crate records
    the release as de-identified. A theoretical risk of future re-identification is
    acknowledged, since AI algorithms can infer individual patient characteristics; the
    project's countermeasures are a robust data dissemination system, a strict license
    agreement, and static data watermarking of both the public and controlled sets.
  source_caveats: >-
    The FAIRhub de-identification block is internally inconsistent: it records a
    de-identification type of "NoDeIdentification" while simultaneously asserting that
    direct-identifier and HIPAA de-identification were applied, and the accompanying free
    text explains this as "no identifiers were collected so no active de-identification was
    necessary". The Nature Metabolism comment describes the public set as stripped of
    protected health information via the HIPAA Safe Harbor method. Two healthsheet
    questions on de-identification measures were left blank.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Period during which the data included in release 3.0.0 were collected. Preliminary
      pilot enrollment ran from July 2023 to 30 November 2023 and the formal data
      collection process began on 1 December 2023; pilot data were included in the first
      released dataset.
    source_caveats: >-
      FAIRhub gives the collection period as 2023-07-19 to 2025-05-01; the BMJ Open
      protocol paper gives 18 July 2023 as the start of pilot enrollment. The
      higher-ranked FAIRhub date is used.
  - start_date: '2023-07-19'
    timeframe_details: >-
      Overall study collection period. The study started on 2023-07-19 (actual) with an
      anticipated completion date of 2027-01-01; the protocol publication states that
      enrollment will continue until 30 November 2026. The project timeline spans four
      years, with one year for protocol development and training and years two to four for
      recruitment and data collection, and approximately four percent of participants are
      expected to undergo a follow-up examination in year four.

acquisition_methods:
  - was_directly_observed: true
    was_validated_verified: true
    acquisition_details: >-
      Directly observable data acquired by study staff during the in-person visit,
      including vitals and physical measurements, blood and urine laboratory results,
      twelve-lead electrocardiography, vision testing, monofilament testing and retinal
      imaging. Verification of data entry was performed where possible, for example by
      cross-referencing entered medications against medications physically brought in or
      photographed by the participant.
  - was_reported_by_subjects: true
    acquisition_details: >-
      Participant-reported data acquired through self-administered questionnaires
      completed in REDCap before, during or after the visit, covering screening
      eligibility, demographics, depressive symptoms, diabetes-related distress and
      self-care, diet, ophthalmic history, smoking, alcohol, vaping and marijuana use,
      general health history, social determinants of health, and current medications.
  - was_directly_observed: true
    acquisition_details: >-
      Instrument-recorded data captured autonomously by devices sent home with the
      participant for ten continuous days: continuous glucose measurements every five
      minutes from a Dexcom G6, physical activity and physiological measures at a five
      second sampling interval from a Garmin Vivosmart 5 worn on the wrist, and indoor
      environmental measurements from a custom LeeLab Anura sensor placed in a frequently
      used area of the home.
  - was_inferred_derived: true
    acquisition_details: >-
      Derived values calculated from directly measured quantities, including body mass
      index and waist-to-hip ratio from measured height, weight and circumferences,
      calculated low-density lipoprotein cholesterol, calculated total globulin and
      albumin/globulin ratio, and the blood urea nitrogen to creatinine ratio.

collection_mechanisms:
  - mechanism_details: >-
      REDCap electronic data capture, used for participant-reported questionnaire data and
      for clinical data recorded during the visit including the medications assessment,
      vitals, visual acuity, contrast sensitivity, monofilament test results and complete
      blood count results. REDCap also hosted the recruitment interface, the screening
      survey and the electronic consent workflow.
  - mechanism_details: >-
      Retinal imaging devices. Optomed Aurora IQ handheld non-mydriatic fundus camera
      (Optomed, Oulu, Finland) for undilated color fundus photography; iCare EIDON
      widefield TrueColor confocal fundus system (iCare USA, Raleigh, North Carolina) for
      dilated widefield color, infrared and fundus autofluorescence imaging including
      mosaics; Heidelberg Spectralis HRA OCT and OCTA (Heidelberg Engineering, Heidelberg,
      Germany); Topcon Maestro2 3D OCT-1 and Topcon Triton DRI swept-source OCT (Topcon
      Healthcare, Tokyo, Japan); Carl Zeiss Meditec Cirrus 5000 AngioPlex (Jena, Germany);
      and Heidelberg fluorescence lifetime imaging ophthalmoscopy. All retinal images were
      collected under dilated conditions except those from the Optomed device.
  - mechanism_details: >-
      Twelve-lead electrocardiography using a Philips PageWriter TC30 Cardiograph
      (Amsterdam, The Netherlands), performed while the participant sits in a reclining
      chair or lies supine, with the recline position recorded relative to supine at 0, 30,
      60 or 90 degrees.
  - mechanism_details: >-
      Dexcom G6 real-time integrated continuous glucose monitoring system (Dexcom, San
      Diego, California), a subcutaneous glucose sensor with a transmitter worn on the
      skin, recording blood glucose every five minutes for ten days. Participants were
      masked to the results during the monitoring period.
  - mechanism_details: >-
      Garmin Vivosmart 5 physical activity monitor (Garmin, Schaffhausen, Switzerland),
      worn on the wrist for ten consecutive days at a five second sampling interval,
      recording steps, heart rate, sleep phases, oxygen saturation, respiratory rate,
      stress and calorie expenditure. Participants returned a data sheet recording which
      wrist the tracker was worn on and their dominant hand.
  - mechanism_details: >-
      LeeLab Anura, a custom-designed indoor environmental sensor unit built for the
      AI-READI project at the Karalis Johnson Retina Center, University of Washington,
      placed in a frequently used area of the participant's home for ten days and recording
      ambient temperature, relative humidity, nitrogen oxides, volatile organic compounds,
      particulate matter counts at PM1.0, PM2.5, PM4 and PM10, and eleven multi-spectral
      light intensity measurements. Component datasheets referenced are the ams-OSRAM
      AS7431, the DS3231 precision real-time clock and the Sensirion SEN5x.
  - mechanism_details: >-
      Vision testing instruments. M&S Technologies Electronic Visual Acuity tester (Niles,
      Illinois) at four meters for best-corrected photopic and mesopic letter acuity, the
      latter through a 2.0 neutral density filter; Mars Letter Contrast Sensitivity chart
      (Mars Perceptrix, Chappaqua, New York) read monocularly at approximately 50 cm under
      photopic and mesopic conditions with background luminance of 60 to 120 cd/m2;
      Topcon KR 800 autorefractor and keratometer (Topcon Healthcare, Oakland, New Jersey);
      and lensometers, namely the NIDEK LM-600P, Topcon CL-200 and Topcon CL-300.
  - mechanism_details: >-
      Physical assessment instruments. Height, weight and waist and hip circumference
      measurement; blood pressure and heart rate measured twice, two minutes apart, with an
      automatic oscillometric medically approved device, using the OMRON HEM 907XL, the
      Medline MDS4001 automatic digital blood pressure monitor or the Welch Allyn 6000
      series vital signs monitor with a Welch Allyn FlexiPort reusable cuff; and a 10 g
      monofilament applied to three locations on the plantar surface of each foot, ten
      times per location, with eyes closed.
  - mechanism_details: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA
      Duo application (MoCA Cognition, Quebec, Canada), capturing responses interactively
      and exporting the total score, section subscores, Memory Index Score and task
      completion times.
  - mechanism_details: >-
      Biospecimen collection and laboratory assay. Approximately 53 mL of non-fasting blood
      and a urine specimen were collected during the visit into EDTA vacutainers, serum
      separator vacutainers, CPT mononuclear cell preparation tubes and PAXgene RNA
      vacutainers. Complete blood counts were performed on fresh whole blood by Clinical
      Laboratory Improvement Amendments-certified laboratories local to each site; all
      other assays were performed on stored frozen samples by the University of Washington
      Nutrition and Obesity Research Center testing facility, with samples first stored
      locally at minus 70 degrees Celsius and batch-shipped on dry ice approximately once
      per quarter.

data_collectors:
  - role: Clinical research coordinators and research assistants
    collector_details: >-
      Site staff who contacted and consented participants, ushered them through the
      research visit, conducted study procedures including ophthalmic imaging, trained
      participants on continuous glucose monitoring and the fitness tracker, and ensured
      the return of all study materials. All research personnel at the three data sites who
      recruited, enrolled and collected data underwent training by the data manager and
      worked from a detailed Manual of Procedures; a certification process was required,
      including mandatory institutional compliance training for human subject research and
      successful administration of all protocol elements to at least three volunteer
      practice subjects. Their effort was supported by NIH award OT2OD032644 in proportion
      to percentage of effort, at salaries aligned with the funding guidelines at each site.
  - role: Site data managers
    collector_details: >-
      Data managers at each site oversaw the data collection process, reviewed REDCap
      reports of flagged values with the coordinators, and were responsible for quality
      control of all data before uploading to the FAIRhub platform.
  - role: Phlebotomists and laboratory assistants
    collector_details: >-
      Staff responsible for blood collection from research participants and for local
      processing, storage and shipping of plasma, serum, buffy coats, peripheral blood
      mononuclear cells and PAXgene RNA tubes.
  - role: Central project team
    collector_details: >-
      Software engineers, cloud engineers, research and data scientists, project managers
      and domain experts who received data from the study sites, mapped it to standardized
      terminologies, ran the curation pipelines and prepared each release for dissemination
      on FAIRhub.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling from a defined study base. The study base is all patients
      aged 40 years or older who had a medical encounter within each health system site
      between 2020 and 2025; patients with type 2 diabetes and pre-diabetes were identified
      by screening electronic health records for ICD-10 codes E11.X and R73.09
      respectively, and patients without diabetes were identified as those without
      encounters carrying those codes. Participants were recruited in waves whose
      composition and size were influenced by observed participation characteristics of
      race/ethnicity, gender, severity of type 2 diabetes and site, and were adjusted by
      under- and oversampling groups as needed. Rather than targeting the demographic
      distribution of the United States population, the design recruits four race/ethnic
      groups, four categories of type 2 diabetes and biological males and females in equal
      proportions.
    source_data: >-
      Electronic health records of the University of Alabama at Birmingham, the University
      of California San Diego and the University of Washington health systems.
    why_not_representative: >-
      The cohort is deliberately triple-balanced by self-reported race/ethnicity, type 2
      diabetes presence and severity, and biological sex rather than matched to the
      demographic distribution of the United States population, because balanced datasets
      are held to be critical for the development of unbiased machine learning models.
      Recruitment is additionally urban and hospital-based, requires English literacy, and
      excludes groups such as Pacific Islanders and Native Americans.
    source_caveats: >-
      The dataset healthsheet answers the question of whether the dataset is a sample by
      stating that it "contains all possible instances", meaning all participants enrolled
      to date, and answers the sampling-strategy question with "N/A", while the same
      release metadata describes the study sampling method as a non-probability sample
      drawn from the health-system study base. The design-level description is recorded
      here.

raw_sources:
  - raw_data_details: >-
      Raw device and system exports retained by the project but not shared outside the
      project team, because they have not been mapped to standardized terminologies and
      because they may accidentally include personal health information or personally
      identifiable information, for example in free-text fields. Exports include
      electrocardiography in .xml, MoCA Duo application output in .csv, retinal imaging in
      native device formats such as Topcon .fda and Heidelberg .sdt, Garmin activity data
      in .FIT, Dexcom continuous glucose data in .csv, environmental sensor data in .csv,
      and laboratory results from the NORC facility in .csv. There is a possibility that
      raw data may be included in future releases of the controlled-access dataset.

raw_data_sources:
  - source_description: >-
      REDCap electronic data capture instance holding participant-reported questionnaire
      responses and clinical data entered during the visit, including the medications
      assessment, vitals, visual acuity, contrast sensitivity, monofilament results and
      complete blood count results.
    source_type: Electronic data capture system
    raw_data_format: REDCap database export
    access_details: >-
      Not publicly released; the exported content is mapped to the OMOP Common Data Model
      and published as the clinical_data directory.
  - source_description: >-
      Native exports from the retinal imaging devices used in the protocol.
    source_type: Medical imaging device export
    raw_data_format: >-
      Native DICOM from Optomed Aurora, iCare EIDON, Heidelberg Spectralis and Zeiss
      Cirrus; Topcon .fda files from the Maestro2 and Triton devices; Heidelberg .sdt files
      from the FLIO device.
    access_details: >-
      Not publicly released; .fda and .sdt files were converted to DICOM for the dataset.
  - source_description: >-
      Twelve-lead electrocardiography recordings from the Philips PageWriter TC30
      Cardiograph.
    source_type: Clinical device export
    raw_data_format: .xml
    access_details: >-
      Not publicly released; converted to WaveForm DataBase format for the dataset.
  - source_description: >-
      Continuous glucose monitoring records from the Dexcom G6 transmitter and the Dexcom
      Clarity application.
    source_type: Wearable device export
    raw_data_format: .csv
    access_details: >-
      Not publicly released; converted to the Open mHealth standard for the dataset.
  - source_description: >-
      Physical activity, heart rate, oxygen saturation, respiratory rate, sleep and stress
      records from the Garmin Vivosmart 5 fitness tracker.
    source_type: Wearable device export
    raw_data_format: .FIT
    access_details: >-
      Not publicly released; converted to the Open mHealth standard for the dataset.
  - source_description: >-
      Indoor environmental measurements from the custom LeeLab Anura sensor unit.
    source_type: Custom sensor export
    raw_data_format: .csv
    access_details: >-
      Not publicly released; reformatted to follow the NASA ASCII File Format Guidelines
      for Earth Science Data for the dataset.
  - source_description: >-
      Blood and urine assay results from the University of Washington Nutrition and Obesity
      Research Center testing facility and complete blood count results from CLIA-certified
      laboratories local to each data collection site.
    source_type: Clinical laboratory
    raw_data_format: .csv
    access_details: >-
      Not publicly released; mapped to the OMOP Common Data Model for the dataset.
  - source_description: >-
      Electronic health records of the University of Alabama at Birmingham, the University
      of California San Diego and the University of Washington health systems, used to
      screen for eligibility and to build recruitment contact pools, and as the source of
      past health records held under controlled access.
    source_type: Electronic health record system
    access_details: >-
      Not released; used for recruitment and eligibility screening. Past health records
      form part of the controlled-access dataset only.

preprocessing_strategies:
  - preprocessing_details: >-
      Mapping to standardized terminologies. All data were mapped to applicable standards
      where possible: clinical data to the Observational Medical Outcomes Partnership
      Common Data Model, with each CSV file in the clinical_data directory being a
      one-to-one mapping to an OMOP CDM table, and retinal imaging to DICOM.
  - preprocessing_details: >-
      Format conversion prior to upload. Topcon .fda files from the Maestro2 and Triton
      devices and Heidelberg .sdt files from the FLIO device were converted to DICOM;
      Garmin .FIT files were converted to the Open mHealth standard; electrocardiography
      exports were converted to the WaveForm DataBase format; environmental sensor output
      was formatted to follow the NASA ASCII File Format Guidelines for Earth Science Data.
  - preprocessing_details: >-
      Structural organization following the Clinical Dataset Structure (CDS) v0.1.1: one
      directory per datatype at the root, one directory per modality within each datatype,
      one directory per device within each modality, and one directory per participant
      within each device, with a manifest.tsv metadata file in each datatype directory and
      a fixed set of root-level metadata files.
  - preprocessing_details: >-
      Removal of protected health information from the release, together with removal of
      information related to participant sex and race/ethnicity and to medications used,
      before publication of the public set.
  - preprocessing_details: >-
      Processing approach by release. Version 1.0.0 was processed by custom and ad hoc
      means; versions 2.0.0 and 3.0.0 used a combination of automated pipelines and custom
      processing.
  - preprocessing_details: >-
      Application of static watermarking to the data for security purposes, allowing a
      licensee to be identified; licensees are contractually prohibited from removing,
      obscuring, altering or masking it.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the point of data entry. Clinical data outside expected minimum
      and maximum ranges were flagged in REDCap and surfaced in reports viewed by clinical
      research coordinators and data managers, who examined the participant records and
      determined whether an error was likely. Data were checked for credibility against
      pre-specified reasonable ranges, for incorrect flow through prescribed skip patterns,
      for missing data that could be directly filled from other portions of an individual's
      record, and for the omission or duplication of records.
  - cleaning_details: >-
      Editing governance. Editing was performed only under the guidance and approval of the
      site principal investigator. Where corrected data were available elsewhere in the
      respondent's answers, the error was corrected; where there was no logical or
      appropriate way to correct the data, the site principal investigator reviewed the
      values and decided whether they should be removed.
  - cleaning_details: >-
      Site-level quality control before upload. The data manager at each data site was
      responsible for the quality control of all data before uploading to FAIRhub.
  - cleaning_details: >-
      Internal review of the assembled release. The dataset has not undergone any formal
      external audit, but it was reviewed internally by AI-READI team members for quality
      checks and to ensure that no personally identifiable information was accidentally
      included.
  - cleaning_details: >-
      Automated data quality assessment of the clinical tables. A dqd_omop.json file is
      distributed in the clinical_data directory to support analysis with the OMOP CDM Data
      Quality Dashboard, which runs a set of more than 3,500 data quality checks against an
      OMOP CDM instance.
  - cleaning_details: >-
      No instances were excluded from the dataset at the time of preprocessing; exclusion
      operated only through the study eligibility criteria applied at recruitment.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants; the dataset is complete only
      in the sense that it contains every participant enrolled within the collection window.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements. In a few cases
      the data collection device had no stored results or was returned too late for the
      results to be retrieved, for example because the battery died or the data were lost.
      In a few cases a data collision occurred at some point in the process and data were
      lost. Survey questions were skipped or responses left incomplete. Imaging modalities
      requiring operator involvement were sometimes skipped because of quality problems.
      Garmin recording has gaps because the battery had to be charged every two to three
      days.
    handling_strategy: >-
      Missing data that could be directly filled from other portions of an individual's
      record were completed during the cleaning process under site principal investigator
      approval; no imputation was performed and remaining values are absent from the
      release.

