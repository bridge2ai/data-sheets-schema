      - >-
        AI-READI dataset documentation, https://docs.aireadi.org, with a documentation set
        for each dataset version (see "Dataset v3.0.0" for this release). It complements the
        dataset landing page and describes each data domain's clinical context, acquisition,
        individual variables, file formats, data standards, metadata and example outputs.
    archival: false
    restrictions:
      - >-
        None; the documentation is shared under the CC BY 4.0 license.
    future_guarantees: >-
      No guarantee of persistence or constancy over time is stated. The dataset itself is
