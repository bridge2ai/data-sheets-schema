    target_dataset: 10.60775/fairhub.2
    notes: >-
      Version 2.0.0, released 8 November 2024, contained 1,067 participants; the FAIRhub
      landing page for that version states it is no longer accessible.
  - relationship_type: is_source_of
    target_dataset: https://fairhub.io/datasets/4
    notes: >-
      A smaller mini-subset of AI-READI release 3.0.0 made available for pipeline
      development. The FAIRhub API for release 3.0.0 records it as "child": 4; the landing
      page notes that "A smaller version is available for pipeline development". No DOI for
      the subset is given in the sources, so the FAIRhub dataset URL is used as the
      identifier.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset; it is hosted on FAIRhub through
      Microsoft Azure. Contact information is provided in the README file included with the
      dataset, at https://aireadi.org/contact and at
      https://docs.aireadi.org/docs/3/contact, and the central study contact address is
      contact@aireadi.org. The study_description.json and dataset_description.json metadata
      files included in the dataset carry additional information about the contact person or
      entity, authors and contributors.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset is released as static versions and is not updated in place. Rather than
    correcting or amending an existing release, new versions are released with additional
    instances as more study participants complete the study visit, approximately once a
    year, with additional data from participants enrolled since the last version. Changes
    between the current version and the previous one are described in detail in the
    CHANGELOG file included in the dataset and visible at docs.aireadi.org. Further versions
    are expected because enrollment is ongoing.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
    - >-
      1.0.0 (DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants); 2.0.0 (DOI
      10.60775/fairhub.2, released 8 November 2024, 1,067 participants, no longer
      accessible); 3.0.0 (DOI 10.60775/fairhub.3, released 17 November 2025, 2,280
      participants, current).
  version_details: >-
    Each version carries its own DOI and its own documentation set, navigable from a version
    dropdown at docs.aireadi.org. Documentation for superseded versions remains published
    even where the data themselves are no longer accessible; the documentation pages for
    versions 1.0.0 and 2.0.0 remain online and the version 2.0.0 page states that the
    version is no longer accessible. Datasheets in healthsheet form were created for version
    1.0.0 and version 2.0.0 as well as for this version. Release 3.0.0 added three imaging
    devices relative to the year-two data and introduced a recommended data split; the
    Snellen visual acuity variables present in the previous release were dropped.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances.
    Participants were not told that their data would be retained for a fixed period and then
    deleted. Raw data are expected to be preserved by the project at least for the duration
    of the project. Older versions of the dataset are not maintained as accessible
    downloads; instead new versions are released.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset
    outside of those who are involved in the project. Contributions are limited to members
    of the AI-READI Consortium, and the dataset itself is not updated in place; additions
    reach users only through subsequent static releases.

external_resources:
