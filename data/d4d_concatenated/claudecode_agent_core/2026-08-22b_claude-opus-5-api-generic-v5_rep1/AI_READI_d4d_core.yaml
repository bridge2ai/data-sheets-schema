description: >-
  The Flagship Dataset of Type 2 Diabetes from the AI-READI Project is a multimodal,
  AI-ready dataset collected from individuals with and without type 2 diabetes mellitus
  (T2DM) and harmonized across three data collection sites in the United States: the
  University of Alabama at Birmingham, the University of California San Diego, and the
  University of Washington. Release 3.0.0 contains data from 2,280 participants
  collected between 19 July 2023 and 1 May 2025, and comprises 356,343 files totaling
  approximately 3.82 TB (3,815,969,779,678 bytes). The data span survey responses, blood
  and urine laboratory results, physical measurements and vitals, clinical assessments
  such as monofilament testing for peripheral neuropathy and Montreal Cognitive
  Assessment cognitive screening, vision testing, twelve-lead electrocardiography,
  retinal photography, optical coherence tomography, optical coherence tomography
  angiography, fluorescence lifetime imaging ophthalmoscopy, continuous glucose
  monitoring, wearable activity monitoring, and home environmental sensing. The
  composition of the dataset was designed with future studies using artificial
  intelligence and machine learning in mind, including recruitment sampling procedures
  aimed at achieving approximately equal distribution of participants across diabetes
  severity, and a data acquisition protocol across multiple domains intended to enable
  downstream analyses that may not be feasible with existing data sources such as claims
  or electronic health records data. The overarching scientific goal is to better
  understand salutogenesis, the pathway from disease to health, in T2DM. This public
  release contains no protected health information; information related to participant
  sex and race/ethnicity and to medications used has also been removed. A
  controlled-access version, obtainable by entering into a data use agreement,
  additionally holds 5-digit zip code, sex, race, ethnicity, genetic sequencing data,
  past health records, medications, and traffic and accident reports. AI-READI is one of
  four Data Generation Projects funded by the National Institutes of Health Common Fund
  Bridge2AI program under award OT2OD032644, "Bridge2AI: Salutogenesis Data Generation
  Project"; the protocol publication additionally reports NIH grants P30DK035816 and
  UL1TR003096 and support from Research to Prevent Blindness. The study as a whole
  targets enrollment of 4,000 participants aged 40 and older, triple-balanced by
  self-reported race/ethnicity, T2DM presence and severity, and biological sex, with
  enrollment ongoing and new static versions of the dataset released approximately once
  a year. Release 3.0.0 is accompanied by a recommended 70/15/15 train, validation and
  test split, distributed in the participants.tsv metadata file. The training partition
  holds 1,576 participants (Hispanic 204, Asian 369, Black 343, White 660; male 599,
  female 977; no diabetes 600, lifestyle controlled 384, oral medication controlled 487,
  insulin controlled 105; mean age 61.1 years, SD 11.3). The validation and test
  partitions hold 352 participants each and are balanced as far as possible for sex,
  race/ethnicity and diabetes status: validation comprises Hispanic 88, Asian 88, Black
  88, White 88; male 176, female 176; no diabetes 88, lifestyle controlled 88, oral
  medication controlled 109, insulin controlled 67; mean age 60.3 years (SD 10.8), and
  test comprises Hispanic 88, Asian 88, Black 88, White 88; male 176, female 176; no
  diabetes 88, lifestyle controlled 88, oral medication controlled 90, insulin
  controlled 86; mean age 60.5 years (SD 11.4). Named variables carried in the release
  include the study participant identifier; hemoglobin A1c (percent, reference range
  4.0-6.0), serum glucose (mg/dL, reference range 62-125), insulin (ng/mL, 0.0-24.9) and
  C-peptide (ng/mL, 1.1-4.4) as markers of diabetes; NT-pro-BNP (pg/mL, reference varies
  by age) and troponin-T (ng/L, female under 11, male under 16) as cardiac markers;
  high-sensitivity C-reactive protein (mg/L, 0.0-10.0); the lipid panel of total
  cholesterol (mg/dL, under 200), triglycerides (mg/dL, under 150), HDL cholesterol
  (mg/dL, above 39) and calculated LDL cholesterol (mg/dL, under 130); creatinine (mg/dL,
  female 0.38-1.02, male 0.51-1.18) and blood urea nitrogen (mg/dL, 8.0-21.0); urine
  albumin and urine creatinine (mg/dL, no reference range supplied) as biomarkers of
  early diabetic nephropathy; continuous glucose (mg/dL, recorded every five minutes);
  MoCA total score (0-30, higher better); logMAR best-corrected visual acuity (lower
  better) and Mars log contrast sensitivity (higher better), each under photopic and
  mesopic conditions; systolic and diastolic blood pressure (mm Hg) and heart rate (beats
  per minute); calculated body mass index (kg/m2) and waist-hip ratio; the categorical
  monofilament response (felt or insensate); and from the wearable and environmental
  devices, oxygen saturation (percent), step count, sleep duration, respiratory rate,
  ambient temperature, relative humidity, particulate matter at PM1.0, PM2.5, PM4 and
  PM10, nitrogen oxides, volatile organic compounds and eleven multi-spectral light
  intensity measurements.

notes: >-
  Both the FAIRhub dataset landing pages and the docs.aireadi.org documentation site
  carried the statement "This repository is under review for potential modification in
  compliance with Administration directives" at the time the sources were captured. The
  FAIRhub API reports a view count of 24,636 and zero recorded citations for release
  3.0.0. Onward sharing by a licensee is restricted: data or derivative works may be
  conveyed only to another licensee bound by an agreement with the licensor on identical
  terms, and only for the purpose of collaborating on one or more projects involving the
  data; sharing or distributing the data with any third-party model vendor or developer
  for training or development purposes is prohibited even where that vendor has a
  Business Associate Agreement with the licensee's institution.

source_caveats: >-
  Institutional attribution is inconsistent across sources of equal rank. The FAIRhub
  structured metadata names Washington University in St. Louis (ROR 01yc7t268) as the
  managing organization and lead sponsor and as the affiliation of the responsible-party
  principal investigator Aaron Lee, and the version 2.0 license agreement names
  Washington University in St. Louis as Licensor; the RO-Crate metadata for the same
  release describes the principal investigator as "Aaron Lee, Department of
  Ophthalmology, University of Washington", the IRB address given in the RO-Crate is the
  University of Washington Human Subjects Division, and both publications and the NIH
  RePORTER record place the award and the lead investigator at the University of
  Washington (ROR 00cvxb145, itself listed among the FAIRhub study locations). The two
  tier-one sources cannot be ranked against each other, so both attributions are
  recorded in the affiliation-level caveats; no source states that the investigator holds
  both affiliations simultaneously. The same FAIRhub records list every named study
  principal investigator's affiliation for Aaron Lee and Cecilia Lee as Washington
  University in St. Louis, whereas the Nature Metabolism author affiliations place both
  at the University of Washington; the higher-ranked FAIRhub value is stated. The
  expanded project title also differs between sources: "Artificial Intelligence Ready and
  Equitable Atlas for Diabetes Insights" in the BMJ Open protocol paper against
  "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights" in the
  FAIRhub study description, the dataset README and the NIH RePORTER record. Target
  enrollment is given as 4,000 by FAIRhub, both publications and the dataset README, as
  "4,000+" by NIH RePORTER, and as 4,600 in the IRB protocol form (which elsewhere in
  the same document states approximately 1,000 participants in each of four groups). An
  upper age limit of 85 years appears in the FAIRhub eligibility module as both a
  maximum age and an exclusion criterion, and in the IRB protocol exclusion list, but
  the BMJ Open protocol paper and the dataset healthsheet state only that participants
  must be aged 40 and older. Where the study enrollment start date is concerned,
  FAIRhub gives 2023-07-19 and the BMJ Open paper gives 18 July 2023 for the start of
  pilot enrollment; the higher-ranked FAIRhub date is used. The scope of release 3.0.0 is
  described inconsistently within the tier-one and tier-two sources: the FAIRhub
  healthsheet and the RO-Crate both say the release consists of data collected "up
  through the end of the second year of the study, i.e. between July 19, 2023 and May
  1st, 2025", while the README changelog attributes the same 2,280 participants to three
  tranches labelled v1.0.0 pilot (204), year 2 data (863) and year 3 data (1,213). The
  collection window of 2023-07-19 to 2025-05-01 is stated consistently by every source
  that gives one and is the value recorded here; the year-labelling of the tranches is
  not resolvable from the bundle.

