conforms_to: >-
  The dataset as a whole is organized following the Clinical Dataset Structure (CDS)
  v0.1.1, with one directory per datatype at the root, one directory per modality within
  each datatype, one directory per device within each modality, and one directory per
  participant within each device. Per-datatype file standards are the WaveForm DataBase
  (WFDB) format for cardiac_ecg, the Observational Medical Outcomes Partnership Common
  Data Model for clinical_data, the NASA ASCII File Format Guidelines for Earth Science
  Data for environment, Digital Imaging and Communications in Medicine (DICOM) for
  retinal_flio, retinal_oct, retinal_octa and retinal_photography, and Open mHealth for
  wearable_activity_monitor and wearable_blood_glucose. Release 3.0.0 is additionally
  packaged as an RO-Crate conforming to RO-Crate 1.2-DRAFT and the FAIRscape profile
  0.1, with one subcrate per datatype directory.

