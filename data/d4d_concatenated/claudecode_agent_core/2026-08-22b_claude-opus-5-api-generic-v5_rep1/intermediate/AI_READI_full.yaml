description: >-
  The Flagship Dataset of Type 2 Diabetes from the AI-READI Project is a multimodal,
  AI-ready dataset collected from individuals with and without type 2 diabetes mellitus
  (T2DM) and harmonized across three data collection sites in the United States: the
  University of Alabama at Birmingham, the University of California San Diego, and the
  University of Washington. Release 3.0.0 contains data from 2,280 participants
  collected between 19 July 2023 and 1 May 2025, and comprises 356,343 files totaling
  approximately 3.82 TB. The data span survey responses, blood and urine laboratory
  results, physical measurements and vitals, clinical assessments such as monofilament
  testing for peripheral neuropathy and Montreal Cognitive Assessment cognitive
  screening, vision testing, twelve-lead electrocardiography, retinal photography,
  optical coherence tomography, optical coherence tomography angiography, fluorescence
  lifetime imaging ophthalmoscopy, continuous glucose monitoring, wearable activity
  monitoring, and home environmental sensing. The composition of the dataset was
  designed with future studies using artificial intelligence and machine learning in
  mind, including recruitment sampling procedures aimed at achieving approximately
  equal distribution of participants across diabetes severity, and a data acquisition
  protocol across multiple domains intended to enable downstream analyses that may not
  be feasible with existing data sources such as claims or electronic health records
  data. The overarching scientific goal is to better understand salutogenesis, the
  pathway from disease to health, in T2DM. This public release contains no protected
  health information; information related to participant sex and race/ethnicity and to
  medications used has also been removed. A controlled-access version, obtainable by
  entering into a data use agreement, additionally holds 5-digit zip code, sex, race,
  ethnicity, genetic sequencing data, past health records, medications, and traffic
  and accident reports. AI-READI is one of four Data Generation Projects funded by the
  National Institutes of Health Common Fund Bridge2AI program under award OT2OD032644,
  "Bridge2AI: Salutogenesis Data Generation Project"; the protocol publication
  additionally reports NIH grants P30DK035816 and UL1TR003096 and support from Research
  to Prevent Blindness. The study as a whole targets enrollment of 4,000 participants
  aged 40 and older, triple-balanced by self-reported race/ethnicity, T2DM presence and
  severity, and biological sex, with enrollment ongoing and new static versions of the
  dataset released approximately once a year.

notes: >-
  Both the FAIRhub dataset landing pages and the docs.aireadi.org documentation site
  carried the statement "This repository is under review for potential modification in
  compliance with Administration directives" at the time the sources were captured. The
  FAIRhub API reports a view count of 24,636 and zero recorded citations for release
  3.0.0.

source_caveats: >-
  Institutional attribution is inconsistent across sources of equal rank. The FAIRhub
  structured metadata names Washington University in St. Louis (ROR 01yc7t268) as the
  managing organization and lead sponsor and as the affiliation of the responsible-party
  principal investigator Aaron Lee, and the version 2.0 license agreement names
  Washington University in St. Louis as Licensor; the RO-Crate metadata for the same
  release describes the principal investigator as "Aaron Lee, Department of
  Ophthalmology, University of Washington", the IRB address given in the RO-Crate is the
  University of Washington Human Subjects Division, and both publications and the NIH
  RePORTER record place the award and the lead investigator at the University of
  Washington (ROR 00cvxb145, itself listed among the FAIRhub study locations). The two
  tier-one sources cannot be ranked against each other, so both attributions are
  recorded where they apply. The same FAIRhub records list every named study principal
  investigator's affiliation for Aaron Lee and Cecilia Lee as Washington University in
  St. Louis, whereas the Nature Metabolism author affiliations place both at the
  University of Washington; the higher-ranked FAIRhub value is stated. The expanded
  project title also differs between sources: "Artificial Intelligence Ready and
  Equitable Atlas for Diabetes Insights" in the BMJ Open protocol paper against
  "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights" in the
  FAIRhub study description, the dataset README and the NIH RePORTER record. Target
  enrollment is given as 4,000 by FAIRhub, both publications and the dataset README, as
  "4,000+" by NIH RePORTER, and as 4,600 in the IRB protocol form (which elsewhere in
  the same document states approximately 1,000 participants in each of four groups). An
  upper age limit of 85 years appears in the FAIRhub eligibility module as both a
  maximum age and an exclusion criterion, and in the IRB protocol exclusion list, but
  the BMJ Open protocol paper and the dataset healthsheet state only that participants
  must be aged 40 and older. Where the study enrollment start date is concerned,
  FAIRhub gives 2023-07-19 and the BMJ Open paper gives 18 July 2023 for the start of
  pilot enrollment; the higher-ranked FAIRhub date is used. The dataset healthsheet
  describes release 3.0.0 as containing data collected "up through the end of the second
  year of the study" while the README changelog attributes the 2,280 participants to a
  pilot tranche of 204, a year-two tranche of 863 and a year-three tranche of 1,213.

