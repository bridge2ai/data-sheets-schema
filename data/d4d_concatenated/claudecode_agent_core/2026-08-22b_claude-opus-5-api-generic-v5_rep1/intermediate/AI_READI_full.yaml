third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed publicly through the FAIRhub platform. Onward sharing by a
      licensee is restricted: data or derivative works may be conveyed only to another
      licensee bound by an agreement with the licensor on identical terms, and only for the
      purpose of collaborating on one or more projects involving the data. Sharing or
      distributing the data with any third-party model vendor or developer for training or
      development purposes is prohibited even where that vendor has a Business Associate
      Agreement with the licensee's institution.

license: >-
  AI-READI custom license v2.0 (AI-READI Data License Agreement, Version 2.0),
  https://doi.org/10.5281/zenodo.17555036

license_and_use_terms:
  data_use_permission: disease_specific_research
  license_terms: >-
    A custom license developed for the project, tailored to enable reuse of the AI-READI
    dataset for commercial or research purposes while placing strong requirements around
    data usage, security and secondary sharing to protect study participants, especially
    where data are reused for artificial intelligence and machine learning applications.
    The licensor grants a non-exclusive, non-transferable license to download, reproduce
    and use the data and to create derivative works, for research and for commercial and
    non-commercial purposes. Licensees are either individuals or an authorized group within
    a named institution or employer, and the licensee is fully liable for the acts and
    omissions of every authorized user. Derivative data, including synthetic data generated
    from the data, are themselves treated as data subject to all the restrictions.
    Acknowledgement of the licensor, the source and any funder is required in any papers
    reporting use of the data. Licensees must comply with the data security and privacy
    standards established by the NIH under its Genomic Data Sharing Policy. The agreement
    terminates automatically on any breach, whereupon all copies must be deleted and all
    use ceased. The data are provided on an "as is" basis without warranty of any kind, the
    licensor's aggregate liability is capped at one US dollar, and the licensee indemnifies
    the licensor. Access to the release additionally requires logging in through a verified
    ID system and agreeing to use the data only for type 2 diabetes related research.

ip_restrictions:
  restrictions:
  - >-
    Title to the data, and all industrial and intellectual property rights in it, remain
    solely and exclusively with the licensor and its suppliers; the licensee must take no
    action inconsistent with that ownership and any rights not expressly granted are
    reserved. Data may not be reproduced in papers, articles, presentations, analyses,
    reports or publications except that small representative samples may be reproduced in
    up to five images or figures per paper for illustrative purposes only; larger amounts
    may not be published, posted or otherwise made available via supplemental files, zip
    archives, code packages or other means, notwithstanding journal or conference
    requirements, and publishers or conference organizers wishing to do so must obtain a
    separate license. Licensees are permitted to make, reproduce and distribute models,
    algorithms and programs developed, trained or adapted using the data provided those
    models do not themselves contain the data or any modified version of it, and provided
    that before dissemination the licensee undertakes all reasonable efforts to minimize the
    likelihood that data can be memorized, derived, reconstructed or reconstituted through
    the use or construction of such models.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - >-
    Licensees must comply with all data security and privacy standards established from time
    to time by the US National Institutes of Health under its Genomic Data Sharing Policy,
    the current version being the NIH Security Best Practices for Controlled-Access Data
    Subject to the NIH Genomic Data Sharing Policy, and with all applicable laws,
    regulations and restrictions relating to the distribution and use of the data and of
    models derived from it. The data may be statically watermarked to identify the licensee
    for security purposes and the licensee must take no action to remove, obscure, alter or
    mask that watermarking.
  other_compliance: >-
    Storage is limited to servers and devices maintained by and located within the
    licensee's institution or employer, or to cloud or remote storage and backup services
    that have a HIPAA-approved Business Associate Agreement in place with that institution
    or employer. The study is recorded as not FDA-regulated for either drug or device and as
    having no Data Monitoring Committee.
  source_caveats: >-
    The RO-Crate records a confidentiality level of "HL7:2N (normal)" and the FAIRhub access
    type is "PublicDownloadSelfAttestationRequired"; these are mapped here to "restricted"
    because access requires verified-identity login, a self-attestation limiting use to type
    2 diabetes related research, and acceptance of the custom license.

data_governance:
  committee_name: Data Access Committee
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  committee_contact:
    id: ORCID:0000-0002-7452-1648
    name: Aaron Lee
  access_review_process: >-
    Accessing the released dataset requires logging in through a verified ID system,
    agreeing to use the data only for type 2 diabetes related research, and agreeing to the
    license terms, which set restrictions and obligations for data usage. The full dataset,
    including the variables withheld from the public release, is accessible only by entering
    into a data use agreement; requirements for the controlled-access dataset were being
    developed by the Data Access Committee at the time the protocol paper was written. The
    conditions of access are published at https://fairhub.io/datasets/3/access.
  stewardship_roles:
  - >-
    The AI-READI team supports and maintains the dataset, which is hosted on FAIRhub through
    Microsoft Azure. The data manager at each data collection site is responsible for the
    quality control of all data before uploading to FAIRhub. The RO-Crate names the AI-READI
    Consortium as the data governance committee. Biobanked specimens are held at the
    University of Alabama at Birmingham Center for Clinical and Translational Science, and
    procedures for reviewing and prioritizing written requests for them were still to be
    developed.
  source_caveats: >-
    The accountable organization is recorded from the FAIRhub managing organization and lead
    sponsor fields and from the license agreement, both of which name Washington University
    in St. Louis. The RO-Crate for the same release names the AI-READI Consortium as
    publisher and places the principal investigator at the University of Washington; see the
    record-level source caveats.

human_subject_research:
  involves_human_subjects: true
  ethics_review_board: >-
    Institutional Review Board of the University of Washington (Human Subjects Division),
    with reliance agreements covering the Institutional Review Boards of the University of
    Alabama at Birmingham and the University of California San Diego. The RO-Crate names the
    reviewing body "Washington University IRB" but gives a University of Washington Human
    Subjects Division address in Seattle and the contact hsdrely@uw.edu.
  irb_approval:
  - >-
    Protocol STUDY00016228. Initial IRB approval was received on 20 December 2022; an annual
    renewal application reporting the status and progress of the study is required and is
    due within 90 days of expiration. The human subject review status is recorded as
    "Submitted, approved". Written informed consent is provided by all participants.
  regulatory_compliance:
  - >-
    The public release is stripped of protected health information as defined by the HIPAA
    Privacy Rule using the Safe Harbor method. Licensees must comply with the NIH Genomic
    Data Sharing Policy security best practices. The study is recorded as not regulated by
    the FDA as either a drug or a device study and as having no Data Monitoring Committee.
    The study is registered on ClinicalTrials.gov as NCT06002048.
  special_populations:
  - >-
    Eligibility is restricted to adults aged 40 years and older who are able to provide
    consent; pregnancy, gestational diabetes and type 1 diabetes are exclusion criteria, so
    no children, pregnant women, neonates or fetuses are enrolled. Separately, through
    engagement with the Native Biodata Consortium, the project planned a tribal consultation
    to address barriers and facilitators of participation with a view to collecting similar
    data within a Native American cohort in an ethical and respectful manner; that cohort is
    not part of this dataset.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    Enrollment is limited to adults aged 40 and older who are able to provide consent;
    pregnant individuals, those with gestational diabetes and those with type 1 diabetes are
    excluded. The home monitoring devices were specifically chosen with participant privacy
    as a primary concern: they do not capture video or audio, are not equipped with GPS
    location monitoring, and are not synced with participant-owned devices. Transportation
    assistance in the form of rideshare services was offered to participants who reported
    barriers to travelling to study visits.

ethical_reviews:
  - reviewing_organization: >-
      Institutional Review Board of the University of Washington (Human Subjects Division),
      with IRB reliance agreements covering the University of Alabama at Birmingham and the
      University of California San Diego
    review_details: >-
      Approved under protocol STUDY00016228; initial approval letter dated 20 December 2022
      and published with the dataset documentation. Annual continuing review is required
      within 90 days of expiration. The approved consent form for the principal project
      site, the University of Washington, is published with the dataset documentation; the
      other clinical sites operated under IRB reliance and used the same consent form with
      minor institution-specific language.
    source_caveats: >-
      The RO-Crate names the reviewing body "Washington University IRB" while giving the
      University of Washington Human Subjects Division address in Seattle and the contact
      hsdrely@uw.edu; the BMJ Open protocol paper and the dataset healthsheet both identify
      the University of Washington IRB.
  - reviewing_organization: AI-READI Consortium ethics and ELSI team
    review_details: >-
      Ethical, legal and social implications were considered at every stage of the project
      cycle, with guidance from bioethicists. The RO-Crate for release 3.0.0 records the
      ethical review as being carried out by Camille Nebeker, Debra Mathews, Kadija Ferryman
      and Nicholas Evans. Documentation approaches such as datasheets and healthsheets were
      reviewed to identify the most suitable one for biomedical data, and a healthsheet is
      distributed with the dataset. A Community Advisory Board of eleven persons from the
      three sites, including diversity in race and ethnicity as represented in the AI-READI
      sample, contributed to the development of the protocol.

collection_consents:
  - consent_details: >-
      Informed consent to participate was required before participation in any part of the
      protocol, including questionnaires. Potential participants were given the option to
      read all consent documentation electronically before their visit and to give consent
      with an electronic signature without verbal communication with a clinical research
      coordinator; they could access the e-consent documentation in REDCap and decide at
      that point not to participate or to request additional information. For most
      participants informed consent was performed remotely by computer, tablet or smart
      phone through a link in the hardcopy invitation letter or the invitation email; for
      those who did not select electronic consent it was performed in person at the start of
      the visit, followed by completion of all questionnaires. Those without internet access
      could call research staff for alternative methods of enrollment.
  - consent_details: >-
      Consent scope for reuse. The public version of the dataset can be used only for type 2
      diabetes related research; a private version is intended to allow more generic use.
      The consent is categorized in the release metadata as "consent specified, not elsewhere
      categorised", without non-commercial, geographic, research-type, genetic-only or
      no-methods restrictions attached at the consent level.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either electronically as an e-signature in REDCap
      before the visit or in person at the start of the visit.
    consent_documentation: >-
      The IRB-approved consent form used at the principal project site, the University of
      Washington, is published with the version 3.0.0 dataset documentation. The other
      clinical sites operated under IRB reliance and used the same consent form with minor
      institution-specific language incorporated according to individual institutional
      requirements.
    consent_scope: >-
      Consent covers participation in the study protocol and the placement of the resulting
      de-identified data in an open-source repository, together with the transfer of
      biospecimens to the study sample repository for use in future research. Reuse of the
      public dataset is limited to type 2 diabetes related research.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and to cease study
      participation.

consent_revocations:
  - revocation_details: >-
      Participants may withdraw consent at any time and cease study participation. However,
      any data that had been shared or used up to that point remain in the dataset. This
      limitation is clearly communicated in the consent document.

collection_notifications:
  - notification_details: >-
      Each individual was aware of the data collection, as this was active data collection
      directly from participants rather than passive collection or secondary use of existing
      data. For each recruitment wave a contact pool was identified by screening electronic
      health records at each site; individuals in the pool were mailed a hardcopy invitation
      letter and sent an invitation email, both personalized and carrying links, access
      codes and QR codes directing them into an online REDCap recruitment interface. There
      they could read an overview of the research program, the expectations for
      participation and answers to frequently asked questions, download the informed consent
      document, request a call back from study staff, complete a screening survey for
      qualification, and enroll by signing the electronic consent.

participant_privacy:
  - anonymization_method: >-
      No direct identifiers were collected. The released data were checked against the US
      HIPAA identifier list and protected health information was removed using the Safe
      Harbor method. Information related to participant sex and race/ethnicity, and to
      medications used, was additionally removed from the public release to prevent
      stigmatization of findings.
    privacy_techniques: >-
      A robust data dissemination system, a strict license agreement, and static data
      watermarking applied to both the public and controlled sets; access gated behind a
      verified ID login and a self-attestation of type 2 diabetes related use; contractual
      restriction of storage to institutional servers or to cloud services covered by a
      HIPAA Business Associate Agreement; and a contractual prohibition on any attempt to
      identify or contact a data subject or to establish a subject's membership in a
      particular group.
    reidentification_risk: >-
      A theoretical risk of future re-identification remains. AI algorithms can infer
      individual patient characteristics and could facilitate individual-level
      identification, which the dissemination system, license and watermarking are intended
      to deter. American Indian and Alaska Native people are noted as unique and highly
      identifiable groups whose participation raises particular considerations.
    data_linkage: >-
      Records for a participant are linked across datatypes, modalities and devices by the
      study participant identifier used as a directory name and as the key of
      participants.tsv. Variables that would raise linkage risk, including 5-digit zip code,
      sex, race, ethnicity, genetic sequencing data, past health records, medications and
      traffic and accident reports, are held separately under controlled access and require
      a data use agreement.

participant_compensation:
  - compensation_provided: true
    compensation_amount: USD 200
    compensation_type: >-
      A stipend for the study visit, paid after the final data and the study devices were
      received, typically at least two weeks after the visit; the payment was not prorated.
      Reasonable costs for parking, public transit or rideshare related to the study visit
      were also covered, with the IRB protocol noting that transportation fees above USD 25
      would not be reimbursed. Transportation assistance in the form of rideshare services
      was offered to participants who reported barriers to travelling to visits.
    compensation_rationale: >-
      Compensation for participant time and burden across a study visit of two and a half to
      four hours plus a ten-day at-home monitoring period, funded through NIH award
      OT2OD032644. The same type and amount of compensation was planned for participants
      invited back for the year four follow-up visit.
    retention_incentives: >-
      Results were returned to participants as an incentive and courtesy: heart rate, blood
      pressure and visual acuity results were given on an exam card before they left the
      visit, with lay-language instructions for interpretation and any follow-up
      recommendations; a Dexcom report with average blood glucose levels and a Glucose
      Management Indicator was sent by encrypted email after the ten-day monitoring period;
      and laboratory test results with normative values were sent by HIPAA-compliant
      encrypted email at the time of the yearly data release.
    retention_incentive_rationale: >-
      Return of individual results was designed so that clinically actionable findings could
      reach participants and their care providers, including immediate referral for
      incidental findings such as retinal detachment, tumor or optic disc edema, and
      emergency-care recommendations for extreme blood pressure or heart rate readings.

intended_uses:
  - use_category: Artificial intelligence and machine learning research on type 2 diabetes
    examples:
    - >-
      Model development for salutogenesis in type 2 diabetes; pseudotime manifold analysis
      to reconstruct a temporal atlas of disease development and reversal; multimodal model
      development across imaging, waveform, wearable, environmental and tabular clinical
      data.
    usage_notes: >-
      Access to the public release is conditional on attesting that the data will be used
      only for type 2 diabetes related research.
  - use_category: Methodological and benchmarking research
    examples:
    - >-
      Development and evaluation of AI methods that must handle heterogeneous, partially
      missing multimodal records from a single cohort.
    usage_notes: >-
      The recommended 70/15/15 train/validation/test split distributed in participants.tsv
      balances the validation and test sets as far as possible for sex, race/ethnicity and
      diabetes status, and is intended to reduce disparities in models developed from the
      dataset given that demographic labels are not released.
  - use_category: Commercial research and development
    usage_notes: >-
      The license grants a non-exclusive, non-transferable right to download, reproduce and
      use the data and to create derivative works for research and for commercial and
      non-commercial purposes, subject to the sharing, storage, publication and model-training
      restrictions it imposes.
  - use_category: >-
      Exemplar and blueprint for the creation of AI-ready clinical research datasets
    examples:
    - >-
      Reuse of the Clinical Dataset Structure organization, of the project's guidelines for
      making data types FAIR, and of the project's ethics and team-science practices by
      other data generation projects.
    usage_notes: >-
      The project explicitly aims to share its blueprint so that future Data Generation
      Projects can follow it, through its Zenodo community, GitHub organization and website.

other_tasks:
  - task_details: >-
      The public release is restricted to type 2 diabetes related research, but a
      controlled-access version of the dataset is intended to allow more generic research
      use, which would broaden the range of tasks the data can support beyond the
      diabetes-specific applications the public set is licensed for.

discouraged_uses:
  - discouragement_details: >-
      Interim releases should not be treated as balanced across race/ethnicity, biological
      sex and diabetes severity. Enrollment is ongoing and the pilot data release and
      periodic updates may not have achieved the intended balanced distribution across
      groups, even though the completed study is designed to be triple-balanced.
  - discouragement_details: >-
      Models derived from the dataset should not be assumed to generalize beyond the
      represented groups. Recruitment was predominantly urban and hospital-based and may not
      fully capture all possible cultural and socioeconomic backgrounds; participants had to
      speak and read English; the cohort excludes people under 40, people with type 1
      diabetes, pregnant people and people with gestational diabetes; and racial and ethnic
      groups such as Pacific Islanders and Native Americans are not included.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the data is prohibited by the license,
      because the dataset is intended solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the data, alone or together with other information, to
      compromise or infringe the confidentiality of information about an individual who is
      the source of any data, to invade or compromise the privacy of any data subject, to
      attempt to identify or contact any data subject or group of data subjects, to extract
      or extrapolate identifying information, to establish a data subject's membership in a
      particular group of persons, or otherwise to cause harm or injury to any data subject,
      is prohibited by the license.
  - prohibition_reason: >-
      Sharing or distributing the data with any third-party model vendor or developer for
      training or development purposes, where training includes model weight modification
      and other adjustments to a model's logic or operation, is prohibited even where that
      vendor is party to a Business Associate Agreement with the licensee's institution.
      Short-term interaction such as prompting or querying a third-party model to analyze the
      data is permitted only where the vendor is party to such an agreement.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or
      otherwise conveying any portion of the data or any derivative work to any third party
      other than another licensee bound by identical terms is prohibited by the license.
  - prohibition_reason: >-
      Reproducing the data in papers, articles, presentations, analyses, reports or
      publications beyond small representative samples in up to five images or figures per
      paper is prohibited, including publication or posting via supplemental files, zip
      archives, code packages or other means, notwithstanding journal or conference
      requirements.
  - prohibition_reason: >-
      Removing, obscuring, altering or masking the static watermarking that may be applied to
      the data to identify the licensee is prohibited by the license for security reasons.
  - prohibition_reason: >-
      Storing the data anywhere other than on servers and devices maintained by and located
      within the licensee's institution or employer, or on cloud or remote storage and backup
      services covered by a HIPAA-approved Business Associate Agreement with that institution
      or employer, is prohibited by the license.
  - prohibition_reason: >-
      Using the public release for research unrelated to type 2 diabetes is prohibited by the
      access attestation that must be agreed to before download.

future_use_impacts:
  - impact_details: >-
      There is a theoretical risk of future re-identification. AI algorithms can infer
      individual patient characteristics and could facilitate individual-level
      identification; to prevent re-identification attempts the project implements a robust
      data dissemination system, a strict license agreement and data watermarking for both
      the public and controlled sets.
  - impact_details: >-
      Because the public release omits sex and race/ethnicity to prevent stigmatization of
      findings, users of the public set cannot directly audit derived models for disparities
      across those groups. The project's stated mitigation is the recommended
      train/validation/test split, whose validation and test sets are balanced as well as
      possible for sex, race/ethnicity and diabetes status, and which is intended to reduce
      disparities in models developed using this dataset.
  - impact_details: >-
      To the extent of the creators' knowledge, no uses of the dataset are currently
      anticipated that could result in unfair treatment of individuals or groups or other
      undesirable harms, beyond the theoretical re-identification risk noted above. Data used
      in developing AI systems are recognized as a frequent source of downstream ethical
      issues, which is why ethical, legal and social implications are considered at every
      stage of the project cycle.
  - impact_details: >-
      The dataset creators expect the flagship dataset to lead to novel discoveries into the
      pathogenesis and salutogenesis of type 2 diabetes while benefiting a broader population
      given the diversity of the study participants, and expect the project's blueprint to
      remove one of the major bottlenecks to the widespread use of AI in healthcare: the
      availability of data that are off-the-shelf ready for AI-based analysis.

related_datasets:
  - relationship_type: is_new_version_of
    target_dataset: 10.60775/fairhub.2
  - relationship_type: replaces
    target_dataset: 10.60775/fairhub.2
  - relationship_type: is_source_of
    target_dataset: >-
      FAIRhub dataset 4, the smaller mini-subset of AI-READI release 3.0.0 made available
      for pipeline development

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset; it is hosted on FAIRhub through
      Microsoft Azure. Contact information is provided in the README file included with the
      dataset, at https://aireadi.org/contact and at https://docs.aireadi.org/docs/3/contact,
      and the central study contact address is contact@aireadi.org. The study_description.json
      and dataset_description.json metadata files included in the dataset carry additional
      information about the contact person or entity, authors and contributors.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset is released as static versions and is not updated in place. Rather than
    correcting or amending an existing release, new versions are released with additional
    instances as more study participants complete the study visit, approximately once a year,
    with additional data from participants enrolled since the last version. Changes between
    the current version and the previous one are described in detail in the CHANGELOG file
    included in the dataset and visible at docs.aireadi.org. Further versions are expected
    because enrollment is ongoing.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - >-
    1.0.0 (DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants); 2.0.0 (DOI
    10.60775/fairhub.2, released 8 November 2024, 1,067 participants, no longer accessible);
    3.0.0 (DOI 10.60775/fairhub.3, released 17 November 2025, 2,280 participants, current).
  version_details: >-
    Each version carries its own DOI and its own documentation set, navigable from a version
    dropdown at docs.aireadi.org. Documentation for superseded versions remains published even
    where the data themselves are no longer accessible; the documentation pages for versions
    1.0.0 and 2.0.0 remain online and the version 2.0.0 page states that the version is no
    longer accessible. Datasheets in healthsheet form were created for version 1.0.0 and
    version 2.0.0 as well as for this version. Release 3.0.0 added three imaging devices
    relative to the year-two data and introduced a recommended data split; the Snellen visual
    acuity variables present in the previous release were dropped.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances.
    Participants were not told that their data would be retained for a fixed period and then
    deleted. Raw data are expected to be preserved by the project at least for the duration of
    the project. Older versions of the dataset are not maintained as accessible downloads;
    instead new versions are released.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset
    outside of those who are involved in the project. Contributions are limited to members of
    the AI-READI Consortium, and the dataset itself is not updated in place; additions reach
    users only through subsequent static releases.

