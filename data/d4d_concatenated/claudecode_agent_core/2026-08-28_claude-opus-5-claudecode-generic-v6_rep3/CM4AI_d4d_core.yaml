ethical_reviews:
- id: https://cm4ai.org/#ethics-review-ravitsky
  name: CM4AI ethical review contact - Vardit Ravitsky
  contact_person: Vardit Ravitsky
  review_details: Contact address ravitskyv@thehastingscenter.org, listed in the release author
    records with ORCID 0000-0002-7080-8801. Named under "Ethical Review" in the Data Governance
    and Ethics block of the June 2025, October 2025 and June 2026 Dataverse releases. The
    CM4AI Ethics team worked with the Data Acquisition, Tools and Standards Modules to develop
    a plan for ethical preparation, licensing, dissemination and Data Access supervision of
    CM4AI datasets, employing a methodology inspired by Value-Sensitive Design and formulating
    the CM4AI Life Cycle, a framework of governance milestones through data generation and
    AI system development.
  source_caveats: The bundle names no institutional review board or ethics committee for these
    data, consistent with its statement that the work involves no human subjects, so no reviewing
    organization is asserted here.
- id: https://cm4ai.org/#ethics-review-belisle-pipon
  name: CM4AI ethical review contact - Jean-Christophe Bélisle-Pipon
  contact_person: Jean-Christophe Bélisle-Pipon
  review_details: Contact address jean-christophe_belisle-pipon@sfu.ca, listed in the release
    author records with ORCID 0000-0002-8965-8153 and affiliation Simon Fraser University.
    Named under "Ethical Review" in the Data Governance and Ethics block of the June 2025,
    October 2025 and June 2026 Dataverse releases.
human_subject_research:
  id: https://cm4ai.org/#human-subject-research
  name: Human subjects status
  involves_human_subjects: false
  description: 'The Dataverse releases record Human Subjects: No. The CM4AI preprint states
    that CM4AI data are non-clinical, coming from tissue cultures, and are considered de-identified
    because they cannot be matched, with current knowledge, to a human subject.'
license_and_use_terms:
  id: https://cm4ai.org/#license-terms
  name: CC BY-NC-SA 4.0
  license_terms: Data packages are licensed under the Creative Commons Attribution-NonCommercial-ShareAlike
    4.0 International license (https://creativecommons.org/licenses/by-nc-sa/4.0/), recorded
    on each Dataverse release as "CC BY-NC-SA 4.0". The license permits sharing (copying and
    redistributing the material in any medium or format) and adaptation (remixing, transforming
    and building upon the material) provided that appropriate credit is given, a link to the
    license is provided and changes are indicated; that the material is not used for commercial
    purposes; and that contributions built upon the material are distributed under the same
    license. No additional legal terms or technological measures may be applied that legally
    restrict others from doing anything the license permits.
  data_use_permission: no_commercial_use
  description: Attribution is required to the copyright holders and the authors, and publications
    referencing the data or derived products should cite the related publication as well as
    the data collection itself. The Dataverse terms add that community norms and good scientific
    practice expect proper credit via citation using the data citation shown on the dataset
    page. Commercial use requires a separate license negotiation with the copyright holder
    - UCSD, Stanford and/or UCSF depending on the specific data package.
  contact_person: Trey Ideker
ip_restrictions:
  id: https://cm4ai.org/#ip-restrictions
  name: Copyright and commercial licensing
  restrictions:
  - Copyright in the datasets is held by the Regents of the University of California except
    where otherwise noted (stated as 2024 in the preprint and 2025 on the March 2025 release).
  - Spatial proteomics raw image data is copyright of the Board of Trustees of the Leland
    Stanford Junior University.
  - Commercial use requires a separate license negotiation with the copyright holder - UCSD,
    Stanford and/or UCSF depending on the specific data package in question - and a Data Access
    Committee supervises ethical matters related to dataset distribution and potential dual
    licensing for commercial use.
  - Under CC BY-NC-SA 4.0 no legal terms or technological measures may be applied that legally
    restrict others from doing anything the license permits.
  description: The CM4AI Ethics team's plan balances the openness of the data produced with
    protection of the intellectual property, and supervision and monitoring of potential efforts
    at commercialization.
regulatory_restrictions:
  id: https://cm4ai.org/#regulatory-restrictions
  name: Regulatory status
  confidentiality_level: unrestricted
  description: 'The Data Governance and Ethics block of the June 2025, October 2025 and June
    2026 releases records Human Subjects: No, De-identified Samples: Yes and FDA Regulated:
    No. All files in those releases are marked public.'
data_governance:
  id: https://cm4ai.org/#data-governance
  name: CM4AI Data Access Committee
  committee_name: Data Access Committee
  committee_contact: Jillian Parker
  description: The Data Governance and Ethics block of the June 2025, October 2025 and June
    2026 releases names Jillian Parker (jillianparker@health.ucsd.edu) as the Data Governance
    Committee contact, and the CM4AI preprint states that a Data Access Committee will supervise
    ethical matters related to dataset distribution and potential dual licensing for commercial
    use.
  source_caveats: The governance block names the contact without an identifier. The release
    author lists give ORCID 0000-0003-4535-3486 for "Parker J (University of California, San
    Diego)", whom this record takes to be the same person; the ORCID is therefore not asserted
    in an identifier slot here.
  access_review_process: The CM4AI Ethics team, working with the Data Acquisition, Tools and
    Standards Modules, developed a plan for ethical preparation, licensing, dissemination
    and Data Access supervision of CM4AI datasets. A Data Access Committee supervises ethical
    matters related to dataset distribution and potential dual licensing for commercial use.
    Beyond that supervision the released files themselves are public and require no access
    request. The Bridge2AI Ethics Working Group supported the Bridge2AI Data Sharing and Dissemination
    Working Group in developing a Code of Conduct that participants in the Bridge2AI Open
    House must attest and commit to before accessing B2AI data, including CM4AI datasets.
  stewardship_roles:
  - Standards Module - AI-readiness packaging of data, software, metadata and provenance graphs,
    performed by the FAIRSCAPE framework.
  - Tools Module - producing and maintaining the MuSIC dataset integration and map production
    system.
  - Ethics Module - ethical preparation, licensing, dissemination and Data Access supervision,
    and the CM4AI Life Cycle governance framework.
  - Teaming Module - open dissemination via the CM4AI web portal on the U-BRITE platform.
  accountable_organization:
    id: ROR:0153tk833
    name: University of Virginia
    description: Long-term preservation of the releases is stated to be in the University
      of Virginia Dataverse, supported by committed institutional funds.
