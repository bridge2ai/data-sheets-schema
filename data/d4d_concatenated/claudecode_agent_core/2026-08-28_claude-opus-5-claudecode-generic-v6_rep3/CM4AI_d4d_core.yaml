purposes:
- id: https://cm4ai.org/#purpose-ai-ready-cell-architecture
  name: Ethical, AI-ready datasets of cell architecture
  response: To produce ethical, AI-ready datasets of cell architecture, inferred from multimodal
    data collected for human cell lines, to enable transformative biomedical AI research.
- id: https://cm4ai.org/#purpose-spatiotemporal-architecture
  name: Map the spatiotemporal architecture of human cells
  response: To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning.
- id: https://cm4ai.org/#purpose-ai-readiness-framework
  name: Demonstrate an AI-readiness packaging framework
  response: To establish FAIR AI-readiness through rich metadata and persistent globally unique
    identifiers, a machine-readable provenance graph resolvable for all results, and validated
    datasets whose data elements are mapped to public ontology vocabularies.
tasks:
- id: https://cm4ai.org/#task-hierarchical-cell-maps
  name: Hierarchical cell map construction
  response: To deliver machine-readable hierarchical maps of cell architecture as AI-ready
    data from multimodal interrogation of chromatin modifiers, metabolic enzymes and other
    proteins in disease-relevant cell lines.
- id: https://cm4ai.org/#task-visible-machine-learning
  name: Visible machine learning
  response: To stimulate research and development in "visible" machine learning systems informed
    by multi-scale cell and tissue architecture, which are built directly on knowledge maps
    of cell and tissue architecture rather than being black boxes.
addressing_gaps:
- id: https://cm4ai.org/#gap-black-box-genotype-phenotype
  name: Uninterpretable genotype-phenotype models
  response: In genomics and precision medicine, machine learning models are often black boxes,
    predicting phenotypes from genotypes without revealing the mechanisms by which such translation
    occurs. CM4AI addresses this deficiency with a coordinated effort involving three complementary
    mapping approaches - proteomic mass spectrometry, cellular imaging and genetic perturbation
    via CRISPR/Cas9.
