title: Cell Maps for Artificial Intelligence (CM4AI) Data Releases
id: https://cm4ai.org/
name: CM4AI
description: CM4AI is the Functional Genomics Data Generation Project in the U.S. National
  Institutes of Health Bridge2AI program. Its stated objective is to deliver machine-readable
  hierarchical maps of cell architecture as AI-ready data, produced from multimodal interrogation
  of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric
  and cardiac disorders, in disease-relevant cell lines under perturbed and unperturbed conditions.
  The dataset is published as a series of quarterly data releases in LibraData, the University
  of Virginia's instance of Dataverse. Each release bundles protein-protein interaction data
  (size-exclusion chromatography mass spectrometry, and from the June 2026 release affinity
  purification mass spectrometry), spatial proteomics immunofluorescence images, and single-cell
  CRISPRi perturbation sequencing, acquired in the MDA-MB-468 triple-negative breast cancer
  line with and without paclitaxel or vorinostat treatment and in KOLF2.1J induced pluripotent
  stem cells and their neural progenitor, neuron and cardiomyocyte derivatives. Outputs are
  packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format
  using the FAIRSCAPE framework. The project web page reports cumulative figures of 1,374
  protein interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated,
  11,739 genes targeted and a data volume of 21.4 TB. Computed cell maps are stated not to
  be included in the releases captured here.
source_caveats: 'Two source disagreements are carried in this record. First, the CM4AI data
  releases page states that the June 2026 Data Release was "Released on: June 17, 2025", while
  the release''s own Dataverse landing page gives a publication date of 2026-06-17; the manifest
  ranks the Dataverse capture (data resource, tier 1) above the release page (documentation,
  tier 2), so 2026-06-17 is stated and the page''s date is recorded here. Second, the CM4AI
  data releases page advertises "IF images for 523 proteins" among the flagship TNBC datasets
  while the individual release pages state 563 proteins imaged (March 2025) and 464 proteins
  imaged (June 2025, October 2025 and June 2026); these describe different releases rather
  than one contested value, and each is stated where it applies. The ROR identifier ror.org/0153tk833
  is used for the University of Virginia: the June 2026 Dataverse capture prints it in place
  of the affiliation string that the March 2025, June 2025 and October 2025 captures print
  as "University of Virginia" for the same four authors. Every capture of the CM4AI Dataverse
  collection carries the banner "This collection is under review for potential modification
  in compliance with Administration directives", and the CM4AI web pages carry the same sentence;
  the bundle does not say what modification is contemplated or when.'
