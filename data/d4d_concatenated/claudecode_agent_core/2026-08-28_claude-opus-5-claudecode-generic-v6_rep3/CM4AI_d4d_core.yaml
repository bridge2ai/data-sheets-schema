external_resources:
- id: https://cm4ai.org/#external-cm4ai-preprint
  name: 'Cell Maps for Artificial Intelligence: AI-Ready Maps of Human Cell Architecture from
    Disease-Relevant Cell Lines'
  description: The CM4AI project preprint, describing the project's goals, methods, standards,
    current datasets, software tools, status and future directions. Posted on bioRxiv on May
    24, 2024 under a CC-BY-NC-ND 4.0 International license. It is named as the Related Publication
    of every CM4AI Dataverse release, and attribution requirements for the datasets include
    citing it.
  external_resources:
  - https://doi.org/10.1101/2024.05.21.589311
  - https://www.biorxiv.org/content/10.1101/2024.05.21.589311v1
- id: https://cm4ai.org/#external-nature-cell-maps
  name: Multimodal cell maps as a foundation for structural and functional genomics
  description: 'Nature 642, 222-231 (2025), received 03 June 2024, accepted 10 March 2025,
    published 09 April 2025, open access under CC BY 4.0. Reports a global map of human subcellular
    architecture built from joint measurement of biophysical interactions and immunofluorescence
    images for over 5,100 proteins in U2OS osteosarcoma cells: 2,174 proteins were tagged
    and analyzed by AP-MS, yielding 36,842 interactions among 7,543 proteins; confocal images
    were collected for 10,348 proteins (20,660 images), of which 3,292 were newly generated;
    5,147 proteins were well represented in both modalities; self-supervised multimodal integration
    resolved 275 protein assemblies, validated by SEC-MS of 40 chromatography fractions in
    triplicate. Acknowledged funding includes the Bridge2AI Program (NIH Common Fund; OT2
    OD032742), the Cancer Cell Map Initiative (U54 CA274502), Schmidt Futures and others.
    Author contributions record that L.V.S., M.H., E.L. and T.I. designed the study, E.L.H.,
    L.P.V., J.W.H. and S.P.G. generated and analyzed the AP-MS data, and K.-M.M. and L.J.F.
    generated and analyzed the SEC-MS data. Underlying data are deposited at MassIVE (AP-MS
    raw files, MSV000097168), ProteomeXchange (SEC-MS raw files and search results, PXD052362),
    NDEx (the U2OS cell map, uuid f693137a-d2d7-11ef-8e41-005056ae3c32; the AP-MS interaction
    data, uuid 95bc75d5-d1d1-11ee-8a40-005056ae23aa), the EBI Protein Complex Portal (query
    CLO:0009454), the ModelArchive (identifiers ma-idk-u2osmap and ma-m5og4) and the Human
    Protein Atlas v23 release, which contains the entire image dataset. A Publisher Correction
    was published on 02 October 2025, and an earlier change of 29 April 2025 restored a missing
    acknowledgement of the Knut and Alice Wallenberg Foundation, Goran Gustafsson Foundation,
    Stanford Institute for Human-Centered AI and Param Hansa Philanthropies. Supplementary
    Tables 1-10 accompany the article. One reported analysis removed 18 assemblies that lacked
    sufficient data in both cell lines. Third-party material in the article is covered by
    the article''s Creative Commons license unless a credit line indicates otherwise.'
  external_resources:
  - https://doi.org/10.1038/s41586-025-08878-3
  - https://doi.org/10.1038/s41586-025-09648-x
  restrictions:
  - Material not included in the article's Creative Commons license requires permission directly
    from the copyright holder.
- id: https://cm4ai.org/#external-perturbation-atlas-preprint
  name: A Perturbation Cell Atlas of Human Induced Pluripotent Stem Cells
  description: Nourreddine S, Doctor Y, Dailamy A, Forget A, Lee YH, Chinn B, Khaliq H, Polacco
    B, Muralidharan M, Pan E, Zhang Y, Sigaeva A, Hansen JN, Gao J, Parker JA, Obernier K,
    Clark T, Chen JY, Metallo C, Lundberg E, Ideker T, Krogan N, Mali P. bioRxiv, 2024 Nov
    4; 2024.11.03.621734. PMCID PMC11580897. Listed as a Related Publication on the CM4AI
    Dataverse releases.
  external_resources:
  - https://doi.org/10.1101/2024.11.03.621734
- id: https://cm4ai.org/#external-music-portal
  name: Multiscale Integrated Cell visualization portal
  description: An interactive portal combining a high-performance graphical web interface
    with the analysis functionality of the Cytoscape application, browsable as a tree view
    or a cell view of nested circles, providing per assembly the constituent proteins, estimated
    sizes in nanometres, links to confocal images, supporting subnetworks of biophysical and
    imaging evidence, search, and the LLM functional interpretations.
  external_resources:
  - http://musicmaps.ai/u2os-cellmap/
- id: https://cm4ai.org/#external-cellmaps-toolkit
  name: Cell Mapping Toolkit
  description: Open-source software for cell map construction, released as a series of Python
    PyPI packages implementing the end-to-end MuSIC pipeline, with full user documentation.
    The CM4AI preprint states that software comprising the Tools data integration pipeline
    is available under a BSD-3 open source license in GitHub for alpha-level tools, or in
    the Zenodo long-term archive for production-ready tools, with links packaged in RO-Crates
    as part of CM4AI provenance representations.
  external_resources:
  - https://github.com/idekerlab/cellmaps_pipeline
  - https://cellmaps-pipeline.readthedocs.io/
- id: https://cm4ai.org/#external-fairscape
  name: FAIRSCAPE AI-readiness framework
  description: The framework used for AI-readiness packaging of CM4AI data, software, metadata
    and provenance graphs, described with a tutorial and installation instructions on its
    documentation site. Both client-side and server-side packages are pip-installable and
    freely available under the MIT open source license; copyright is held by the Rector and
    Board of Visitors of the University of Virginia.
  external_resources:
  - https://fairscape.github.io
- id: https://cm4ai.org/#external-imp
  name: Integrative Modeling Platform (IMP)
  description: Open-source package, version 2.18, underlying the Python Modeling Interface
    used for integrative structure modeling of MuSIC communities.
  external_resources:
  - https://integrativemodeling.org
related_datasets:
- id: https://cm4ai.org/#related-u2os-cell-map
  name: MuSIC U2OS multiscale cell map
  target_dataset: https://ndexbio.org
  relationship_type: references
  description: The multiscale map of protein assemblies in U2OS osteosarcoma cells reported
    in the associated Nature publication and distributed through NDEx under uuid f693137a-d2d7-11ef-8e41-005056ae3c32,
