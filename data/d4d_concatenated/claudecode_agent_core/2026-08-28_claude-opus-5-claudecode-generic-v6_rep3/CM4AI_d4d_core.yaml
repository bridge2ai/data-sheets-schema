updates:
  id: https://cm4ai.org/#update-plan
  name: Quarterly release cadence
  frequency: quarterly
  update_details: CM4AI releases data quarterly, ensuring continuous updates to the cell maps
    and input data streams. The Dataverse maintenance plan states that the dataset will be
    regularly updated and augmented through the end of the project in November 2026, with
    updates on a quarterly basis. The preprint states that data presented will be augmented
    regularly through the end of the project, and that software packages will be versioned
    as the project progresses with the version used to produce each dataset referenced in
    the dataset's metadata.
retention_limit:
  id: https://cm4ai.org/#retention
  name: Long-term preservation
  retention_details: Long-term preservation in the University of Virginia Dataverse, supported
    by committed institutional funds. The Dataverse interface states that files will not be
    removed from previously published versions of a dataset.
