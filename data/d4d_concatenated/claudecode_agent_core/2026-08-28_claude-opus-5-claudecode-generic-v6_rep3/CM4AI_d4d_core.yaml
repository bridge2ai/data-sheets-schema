sampling_strategies:
- id: https://cm4ai.org/#sampling-target-protein-panel
  name: Targeted protein panel
  is_sample: true
  source_data: The human proteome, of which CM4AI interrogates a targeted panel rather than
    a complete survey; the CRISPRi Perturbation Cell Atlas is separately described as genome-scale,
    covering 11,739 targeted genes.
  strategies: Targeted selection of 100 chromatin modifiers and 100 metabolic enzymes involved
    in cancer, neuropsychiatric and cardiac disorders, interrogated in disease-relevant cell
    lines under perturbed and unperturbed conditions. Deep multi-modal data are generated
    for a shared list of proteins across all cell types and treatment conditions. For spatial
    proteomics the Year 1 plan was to map 100 chromatin regulators, their interactors and
    key signaling molecules involved in cancer, with another 500 proteins pending significant
    hits from the genetic perturbation and protein-protein interaction results.
preprocessing_strategies:
- id: https://cm4ai.org/#preprocessing-music-pipeline
  name: MuSIC data integration pipeline
  preprocessing_details: Input data streams are integrated via the Multi-Scale Integrated
    Cell (MuSIC) software pipeline, employing deep learning models and community detection
    algorithms. The pipeline downloads PPI networks from the Krogan Laboratory's deposition
    archive and IF images from the Lundberg Laboratory's deposition archive; generates embeddings,
    processing PPI networks with the node2vec deep learning model and IF images with a Human
    Protein Atlas deep learning model to reduce dimensionality; integrates the two embeddings
    into a per-protein co-embedding using contrastive deep learning so that the original embeddings
    can be reconstructed with minimal information loss; performs community detection on the
    all-by-all similarities of protein pairs in the co-embedding space to produce a hierarchy
    of protein communities as the final cell map; and evaluates the hierarchy against known
    resources. Each pipeline segment calls the FAIRSCAPE client package to validate inputs
    and create the output RO-Crate package.
  used_software:
  - id: https://github.com/idekerlab/cellmaps_pipeline
    name: Cell Mapping Toolkit
    description: A series of Python packages implementing the end-to-end pipeline, including
      cellmaps_imagedownloader, cellmaps_ppidownloader, cellmaps_image_embedding, cellmaps_ppi_embedding,
      cellmaps_coembedding, cellmaps_generate_hierarchy and cellmaps_hierarchyeval. Each package
      is pip-installable and linked to user documentation at https://cellmaps-pipeline.readthedocs.io/.
    license: BSD-3
    url: https://github.com/idekerlab/cellmaps_pipeline
  - id: https://github.com/eliorc/node2vec
    name: node2vec
    description: Deep learning model used to reduce the dimensionality of the protein-protein
      interaction networks.
    url: https://github.com/eliorc/node2vec
- id: https://cm4ai.org/#preprocessing-fairscape-packaging
  name: FAIRSCAPE AI-readiness packaging
  preprocessing_details: Output cell maps and input data are packaged with provenance graphs
    and rich metadata as AI-ready datasets in RO-Crate format using an extended, client-server
    version of the FAIRSCAPE framework. FAIRSCAPE-CLI is called when a computation or coherent
    set of computations completes and is passed metadata defining JSON-Schema schemas for
    the datasets in the computational unit as well as the inputs, computations, software,
    models and outputs; it creates an RO-Crate package with the datasets, metadata and software,
    or resolvable references to them, and unique stubs for identifier creation. RO-Crates
    are sent to the FAIRSCAPE server, where they are registered and assigned persistent, resolvable,
    globally unique identifiers under the ARK scheme, then decomposed into their individual
    components, which are also registered and assigned identifiers. The server computes end-to-end
    entailments on each RO-Crate's provenance expressed in the EVI Evidence Graph Ontology,
    and identifiers resolve to machine- and human-readable landing pages expressed in JSON-LD
    using vocabularies from Schema.org, EVI and other public ontologies.
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    description: Client-side Python3 application (FAIRSCAPE-CLI) and server application that
      perform AI-readiness packaging of data, software, metadata and provenance graphs. Both
      packages are pip-installable and freely available; copyright is held by the Rector and
      Board of Visitors of the University of Virginia.
    license: MIT
    url: https://fairscape.github.io
labeling_strategies:
- id: https://cm4ai.org/#labeling-hierarchy-evaluation
  name: Cell map hierarchy annotation
  data_annotation_protocol: Cell maps are annotated in a two-pronged approach. First, cell
    maps are aligned to known protein function and pathway resources, including the Gene Ontology
    and Reactome, to determine which protein assemblies overlap strongly with known cell biology.
    Second, assemblies in the cell maps are annotated using a large language model approach
    developed by the project, which names sets of proteins and assigns a name confidence score.
  source_caveats: This describes the annotation step of the MuSIC pipeline. The Dataverse
    releases captured here state that computed cell maps are not included in the release,
    so no annotated map is among the distributed files.
machine_annotation_tools:
- id: https://cm4ai.org/#annotation-tools-llm
  name: Large language model assembly naming
  tools:
  - GPT-4 v.gpt-4-1106-preview
  tool_descriptions: A Gene Set AI (GSAI) pipeline guides the GPT-4 model to annotate protein
    assemblies with a descriptive name, a confidence score and a detailed reasoning analysis
    of the assembly's protein members, using a prompt that follows chain-of-thought and one-shot
    strategies. A separate GPT-4-based citation module extracts gene symbols and functional
    keywords from each paragraph of the generated analysis, constructs and executes PubMed
    queries, and asks a further GPT-4 instance whether the top three publications support
    the factual statements in the paragraph.
  source_caveats: Described in the associated Nature publication on the U2OS multimodal cell
    map and, in summary form, in the CM4AI preprint. No annotated cell map is included in
    the Dataverse releases captured here.
existing_uses:
- id: https://cm4ai.org/#existing-use-codefest
  name: CodeFest training and tutorials
  examples:
  - Initial datasets, tools and standards associated with all three parallel mapping platforms
    were made available at the CM4AI CodeFest in March 2024, accompanied by detailed tutorials
    explaining how the data were derived and integrated and providing production-ready software
    for producing the datasets.
  - The CM4AI Standards Module's FAIR AI-readiness metadata and validation toolkits have been
    used to package and release the project's cell-line perturbation and measurement data.
future_use_impacts:
- id: https://cm4ai.org/#future-impact-visible-ml
  name: Stimulating visible machine learning research
  impact_details: NIH RePORTER records that these data will broadly stimulate research and
    development in "visible" machine learning systems informed by multi-scale cell and tissue
    architecture. The CM4AI preprint states the intention that CM4AI become a highly transformative
    platform for ethical, explainable and interpretable biomedical AI, deepen understanding
    of processes of human disease and health, help train a new generation of researchers,
    enable development of novel cures, and assist researchers and clinicians in equitably
    improving human lives. The Ethics Module's remit includes anticipating potential applications
    of the data and derived AI/ML systems and integrating them into data governance frameworks
    to optimize benefits and mitigate potential risks.
intended_uses:
- id: https://cm4ai.org/#intended-use-release-statement
  name: Intended uses stated on the data releases
  use_category: research
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - Cell architectural changes and interactions in presence of specific disease processes,
    treatment conditions, or genetic perturbations
  usage_notes: Attribution is required to the copyright holders and the authors, and any publications
    referencing this data or derived products should cite the related publication as well
    as directly citing the data collection. Under CC BY-NC-SA 4.0 users must give appropriate
    credit, provide a link to the license, and indicate if changes were made.
prohibited_uses:
