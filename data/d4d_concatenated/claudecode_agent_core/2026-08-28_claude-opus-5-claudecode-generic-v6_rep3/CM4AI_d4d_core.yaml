acquisition_methods:
- id: https://cm4ai.org/#acquisition-cell-lines
  name: Ethically sourced immortalized and stem cell lines
  was_directly_observed: true
  was_reported_by_subjects: false
  acquisition_details: CM4AI elected to use the cancer cell line MDA-MB-468 (with and without
    treatment with paclitaxel and vorinostat) and the iPSC line KOLF2.1J (with and without
    neuronal and cardiomyocytic differentiation), both of which the preprint states have been
    ethically sourced. MDA-MB-468 is available from ATCC; KOLF2.1J is available from the HipSci
    resource for not-for-profit organizations via a simple MTA. All data in the first release
    were generated in ethically sourced breast cancer cells and were to be extended to ethically
    sourced human induced pluripotent stem cells.
- id: https://cm4ai.org/#acquisition-production-sites
  name: Production sites
  acquisition_details: The Dataverse releases record the production location as University
    of California San Diego; University of California San Francisco; Stanford University;
    University of Virginia. The March 2025 capture lists University of California San Francisco
    twice.
collection_mechanisms:
- id: https://cm4ai.org/#mechanism-three-platforms
  name: Three complementary mapping approaches
  mechanism_details: CM4AI is a coordinated effort involving three complementary mapping approaches
    - proteomic mass spectrometry, cellular imaging, and genetic perturbation via CRISPR/Cas9
    - applied to disease-relevant cell lines under perturbed and unperturbed conditions.
- id: https://cm4ai.org/#mechanism-ap-ms
  name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details: AP-MS on endogenously tagged cell lines was used to map protein-protein
    interactions of 100 chromatin regulators under different conditions. At the time of the
    preprint, 17 genes had been endogenously tagged in MDA-MB-468 and AP-MS data acquired
    under three conditions (untreated, paclitaxel treated and vorinostat treated), with 34
    additional genes being tagged. AP-MS data for treated MDA-MB-468 cells first appear as
    files in the June 2026 release.
- id: https://cm4ai.org/#mechanism-sec-ms
  name: Size-exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details: SEC-MS was used for proteome-wide complex and interaction mapping. SEC-MS
    was performed on MDA-MB-468 cells under three conditions (untreated, paclitaxel and vorinostat
    treated), identifying 72 of 100 chromatin modifiers, 52 of them integral components of
    protein complexes, and detecting PPI profiles of over a thousand complexes with thousands
    of proteins showing differential elution profiles between control and treated cells. SEC-MS
    in KOLF2 iPSCs and derivatives uncovered more than 700 protein complexes in both parental
    iPSCs and differentiated neurons.
- id: https://cm4ai.org/#mechanism-if-imaging
  name: Immunofluorescence subcellular microscopy
  mechanism_details: Immunofluorescence (IF) subcellular microscopy provides the spatial proteomics
    data, using the Human Protein Atlas resource of antibodies. Automated fixation and permeabilization
    protocols were established for a pipetting robot for the MDA-MB-468 and KOLF2 cell lines.
    Images were acquired by immunofluorescence-based staining (ICC-IF) and confocal microscopy
    in the Lundberg Lab at Stanford University; nuclei were stained with DAPI, endoplasmic
    reticulum with a calreticulin antibody, microtubules with a tubulin antibody, and the
    protein of interest with its own antibody.
- id: https://cm4ai.org/#mechanism-crispr-perturbation
  name: Single-cell CRISPR perturbation screens
  mechanism_details: Single-cell CRISPR screens perturbing 100 chromatin regulators were performed
    in MDA-MB-468 cells under three conditions (no treatment, paclitaxel or vorinostat) and
    in undifferentiated KOLF2.1J iPSCs. A CRISPR lentiviral library targeting 100 chromatin
    factors with 6 guide RNAs per gene was designed, and MDA-MB-468 and KOLF2 CRISPR lines
    expressing inducible dCas9 were generated and characterized. The screens used the 10x
    Genomics 3'HT kit.
