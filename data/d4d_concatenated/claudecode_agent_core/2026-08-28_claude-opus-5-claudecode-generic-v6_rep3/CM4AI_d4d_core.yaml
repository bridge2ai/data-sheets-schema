  prohibition_reason: The Dataverse releases state that these laboratory data are not to be
    used in clinical decision-making or in any context involving patient care without appropriate
    regulatory oversight and approval.
- id: https://cm4ai.org/#prohibited-commercial-use
  name: Commercial use without a separate license
  prohibition_reason: The data packages are licensed under CC BY-NC-SA 4.0, under which material
    may not be used for commercial purposes; a commercial use is one primarily intended for
    commercial advantage or monetary compensation. Commercial use requires a separate license
    negotiation with the copyright holder - UCSD, Stanford and/or UCSF depending on the specific
    data package.
distribution_formats:
- id: https://cm4ai.org/#distribution-dataverse
  name: LibraData (University of Virginia Dataverse)
  format: ZIP Archive
  description: All CM4AI data releases are archived in LibraData, the University of Virginia's
    instance of Dataverse, an NIH-approved generalist repository, under the "Cell Maps for
    Artificial Intelligence" collection within the School of Medicine. Files are public and
    are distributed principally as ZIP archives, with RO-Crate metadata in JSON and provenance
    graphs and datasheets in HTML. The web interface reports that the datasets are too large
    to download in one operation, so individual files must be selected; the March and June
    2025 captures give a per-selection ZIP download limit of 953.7 MB and the October 2025
    and June 2026 captures give 1.9 GB.
  access_urls:
  - https://doi.org/10.18130/V3/HIGT4C
  - https://doi.org/10.18130/V3/K7TGEM
  - https://doi.org/10.18130/V3/F3TD5R
