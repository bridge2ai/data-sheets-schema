notes: >-
  Pack lists no gaps. The receipted sample has three weak receipts (slot-004, slot-015, slot-026)
  and no misread or unsupported one; in each weak case the bundle does support the value at a
  passage the receipt did not cite (lines 2983-2985 for slot-004; the per-directory relatedStandard
  blocks for slot-026), so these are attribution defects rather than fabrications. The receiptless
  sample has one not_in_bundle value (particulate-matter data_type float) and five inferred values,
  four of which are data_type/collection_type enums; the record's variables[*].data_type and
  file_collections[*].collection_type populations are systematically unattested and probably
  account for much of the 331-slot receiptless count. Rule violations are all rule-level rather
  than fact-level: an unused fragment set (rule-14), a return-of-results entry filed under
  collection_notifications (rule-07), and four British spellings (rule-12). Instrument note: the
  receipt validator accepted '"project_name": "AI READI"' as a receipt for
  license_and_use_terms.description (slot-004) - it is verbatim in c022 and passes the 8-character
  floor, but bears on nothing in the value; that is the laundering pattern the deterministic check
  cannot see, and it is the reason the weak verdict exists. Creator.principal_investigator is
  declared with range Person whose description asks for a name; the record's ORCID CURIE references
  validate as identifier references but read against the slot description - worth a schema issue,
  not a record defect.
