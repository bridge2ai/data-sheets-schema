notes: >-
  Instrument findings, not verdicts: (1) the run's provenance form check reported "0 British
  spellings" while metres/tumour/oedema stand in composed prose - the checker's word list misses
  these; worth an issue. (2) Creator.principal_investigator's schema description asks for "a
  person's name such as 'Aaron Lee'" while its range is Person, whose identifier resolves to an
  ORCID CURIE - the record follows the range; the description/range tension is a schema defect,
  not a record defect. (3) slot-004's receipt list includes two snippets that do not bear on the
  cited slot (the c012 storage clause, which supports license_terms, and c022 "project_name: AI
  READI"); support for the value holds in the same chunks, so this is attribution looseness in
  the receipt, not laundering. (4) The five inferred receiptless verdicts (three data_type, two
  collection_type) are honest compositions from stated facts, not fabrications; none contradicts
  the bundle.
