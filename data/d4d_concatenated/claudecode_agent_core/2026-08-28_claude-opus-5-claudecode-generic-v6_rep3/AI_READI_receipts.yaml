  description:
    receipts:
    - chunk: c002
      snippet: AI- READI is a cross- sectional study whose target enrollment is 4000
        people aged 40 and older, triple- balanced by self- reported race/ethnicity
    - chunk: c010
      snippet: The AI-READI is a dataset consisting of data collected from individuals
        with and without Type 2 Diabetes Mellitus (T2DM) and harmonized across 3 data
        collection sites
    - chunk: c010
      snippet: The public dataset will include survey data, blood and urine lab results,
        fitness activity levels, clinical measurements (e.g. monofilament and cognitive
        function testing), retinal images, ECG, blood sugar levels, and environmental
        variables such as home air quality
    - chunk: c011
      snippet: The composition of the dataset was designed with future studies using
        AI/Machine Learning in mind. This included recruitment sampling procedures
        aimed at achieving approximately equal distribution of participants across
        diabetes severity
    - chunk: c015
      snippet: This dataset contains data from 2280 participants that was collected
        between from July 19, 2023 and May 01, 2025. Data from multiple modalities
        are included. The data in this dataset contain no protected health information
        (PHI)
    - chunk: c019
      snippet: The dataset contains 356,343 files and is around 3.82 TB in size
    - chunk: c027
      snippet: There will be two databases for data distribution The first will be
        deidentified, which will be publicly available
    core_path: description
