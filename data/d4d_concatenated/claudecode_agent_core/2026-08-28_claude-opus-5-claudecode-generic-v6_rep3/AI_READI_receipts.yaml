slots:
  acquisition_methods[0].acquisition_details:
    receipts:
    - chunk: c002
      snippet: Data are collected in a multivariable protocol containing over 10 domains,
        including vitals, retinal imaging, electrocardiogram, cognitive function
    - chunk: c019
      snippet: some data were directly observable (such as labs, vitals, and retinal
        imaging), whereas other data were reported by subjects (e.g. survey responses).
        Verification of data entry was performed when possible
    - chunk: c027
      snippet: We will first screen for eligible participants using medical records
        data search from each institution including ICD diagnosis codes, race, and
        age
    core_path: acquisition_methods[0].acquisition_details
  acquisition_methods[1].acquisition_details:
    receipts:
    - chunk: c007
      snippet: The recruitment process consists of a selection of individuals based
        on the available clinical diagnosis using ICD-10 codes and demo
    core_path: acquisition_methods[1].acquisition_details
  acquisition_methods[2].acquisition_details:
    receipts:
    - chunk: c022
      snippet: '"rai:dataCollectionType": [ "Manual Human Curation" ]'
    core_path: acquisition_methods[2].acquisition_details
  addressing_gaps[1].description:
    receipts:
    - chunk: c018
      snippet: Given the complexity of T2DM, AI-based approaches may help with improving
        our understanding but a key issue is the lack of data ready for training AI
        models. The AI-READI dataset is intended to fill this gap
    core_path: addressing_gaps[1].description
  addressing_gaps[1].response:
    receipts:
    - chunk: c005
      snippet: A meta- epidemiological review of T2DM studies published from 2000
        to 2020 indicated that samples lacked racial and ethnic diversity
    - chunk: c009
      snippet: The ability to understand and affect the course of complex, multi-organ
        diseases such as T2DM has been limited by a lack of well-designed, high quality,
        and large multimodal datasets
    - chunk: c027
      snippet: The ability to understand and affect the course of complex, multisystem
        diseases has been limited by a lack of well-designed, high quality, large,
        and inclusive multimodal datasets
    core_path: addressing_gaps[1].response
  anomalies[0].anomaly_details:
    receipts:
    - chunk: c018
      snippet: In cases of survey data, skipped questions or incomplete responses
        are expected. In cases of using wearables, improper use, technical failure
        such as battery failure or system malfunction are expected
    - chunk: c022
      snippet: '"completeness": "In cases of survey data, skipped questions or incomplete
        responses are expected.'
    core_path: anomalies[0].anomaly_details
  anomalies[1].anomaly_details:
    receipts:
    - chunk: c024
      snippet: There are gaps in data collection as the battery had to be charged
        every 2-3 days. The sampling frequency of the Fitness tracker is 5 seconds
    core_path: anomalies[1].anomaly_details
  at_risk_populations.special_protections:
    receipts:
    - chunk: c007
      snippet: American Indians and Alaska Natives (AI/AN) are unique and highly identifiable
        groups that could benefit from precision health AI studies
    - chunk: c009
      snippet: The AI-READI project will also engage in a tribal consultation to address
        barriers and facilitators of participation
    - chunk: c019
      snippet: transportation assistance (rideshare services) was offered to study
        participants who endorsed barriers to transporting themselves to study visits
    - chunk: c027
      snippet: There will also be a community advisory board that evaluates the consent
        forms and research protocols and their feedback will be considered
    core_path: at_risk_populations.special_protections
  citation:
    receipts:
    - chunk: c022
      snippet: AI-READI Project (3.0.0) [Data set]. FAIRhub.
    core_path: citation
  cleaning_strategies[0].cleaning_details:
    receipts:
    - chunk: c004
      snippet: The Data Manager at each data site is responsible for the quality control
        of all data before uploading to FAIRhub
    - chunk: c018
      snippet: clinical data outside of expected min/max ranges were flagged in REDCap,
        which was visible in reports viewed by clinical research coordinators (CRCs)
        and Data Managers
    core_path: cleaning_strategies[0].cleaning_details
  cleaning_strategies[1].cleaning_details:
    receipts:
    - chunk: c018
      snippet: The dataset has not undergone any formal external audits. However,
        the dataset has been reviewed internally by AI-READI team members for quality
        checks
    core_path: cleaning_strategies[1].cleaning_details
  collection_consents[0].consent_details:
    receipts:
    - chunk: c015
      snippet: The public version of the dataset can only be used for type 2 diabetes
        related research. A private version will allow for more generic use
    core_path: collection_consents[0].consent_details
  collection_mechanisms[0].mechanism_details:
    receipts:
    - chunk: c002
      snippet: The protocol is performed as a single visit lasting between 2.5 and
        4 hours
    - chunk: c020
      snippet: '"interventionName": "AI-READI protocol", "interventionDescription":
        "Custom protocol followed for the AI-READI study.'
    - chunk: c027
      snippet: tudy visit will take approximately 3-4 hours. If requested by subjects,
        the visit can be performed over a couple of days instead of a single visit
    core_path: collection_mechanisms[0].mechanism_details
  collection_mechanisms[2].mechanism_details:
    receipts:
    - chunk: c018
      snippet: Blood pressure devices used for the study across the various data acquisition
        sites are OMRON HEM 907XL Blood Pressure Monitor, Medline MDS4001 Automatic
        Digital Blood Pressure Monitor
    core_path: collection_mechanisms[2].mechanism_details
  collection_mechanisms[3].mechanism_details:
    receipts:
    - chunk: c003
      snippet: A 12- lead ECG is performed (Philips Pagewriter TC30 Cardiograph, Amsterdam,
        The Netherlands)
    core_path: collection_mechanisms[3].mechanism_details
  collection_mechanisms[4].mechanism_details:
    receipts:
    - chunk: c003
      snippet: screener is carried out using the Montreal Cognitive Assessment12 (MoCA),
        administered electronically on an iPad
    - chunk: c004
      snippet: participants are sent home with three data monitoring devices as listed
        in table 4 (1) home environmental sensor, (2) Garmin fitness tracker and (3)
        Dexcom Continuous Glucose Monitor (CGM)
    core_path: collection_mechanisms[4].mechanism_details
  collection_mechanisms[5].mechanism_details:
    receipts:
    - chunk: c003
      snippet: The retinal imaging protocol is designed to capture imaging from multiple
        devices. Both eyes are imaged on each participant
    - chunk: c003
      snippet: data for each eye are obtained (spherical and cylindrical components
        expressed as diopter with cylin
    core_path: collection_mechanisms[5].mechanism_details
  collection_mechanisms[6].mechanism_details:
    receipts:
    - chunk: c027
      snippet: We will collect approximately 50-60 ml of blood (about 3-4 spoonfuls)
    core_path: collection_mechanisms[6].mechanism_details
  collection_mechanisms[7].mechanism_details:
    receipts:
    - chunk: c005
      snippet: Garmin VivoSmart 5 Physical Activity Monitor
    - chunk: c006
      snippet: Shaffer J, Gim N, Wei R, et al. Portable environmental sensor enabling
        studies of exposome on ocular health
    - chunk: c007
      snippet: post-visit data collection for 10 days using a Dexcom G6 for continuous
        glucose monitoring, Garmin Vivosmart 5 for physical activity monitoring
    - chunk: c018
      snippet: Participants will be sent home with an environmental sensor (a custom-designed
        sensor unit called the LeeLab Anura), which they will use for 10 continuous
        days
    - chunk: c023
      snippet: In the AI-READI program, we have asked the research participants to
        wear the Dexcom CGM for ten days concurrently with wearing the Garmin Activity
        Monitor and using the home environmental sensor
    - chunk: c027
      snippet: We will use Dexcom CGM devices that collect glucose data over a 10-day
        period
    core_path: collection_mechanisms[7].mechanism_details
  collection_mechanisms[8].mechanism_details:
    receipts:
    - chunk: c027
      snippet: We will be extracting medical records to obtain data on general health,
        eye health, medical and surgical history, diabetes, medications, laboratory
        records, and any previous medical imaging
    - chunk: c027
      snippet: We will also collect information about any car accidents they may have
        experienced and traffic tickets the participant has received in the last 3
        years
    core_path: collection_mechanisms[8].mechanism_details
  collection_mechanisms[9].mechanism_details:
    receipts:
    - chunk: c027
      snippet: Over the 3+ years of study recruitment, approximately 50,000 invitation
        letters from each site will be sent by both mail and email to participants
        identified through the electronic medical record search
    core_path: collection_mechanisms[9].mechanism_details
  collection_notifications[0].notification_details:
    receipts:
    - chunk: c019
      snippet: each individual was aware of the data collection, as this was not passive
        data collection or secondary use of existing data, but rather active data
        collection directly from participants
    core_path: collection_notifications[0].notification_details
  collection_notifications[1].name:
    receipts:
    - chunk: c028
      snippet: Results obtained during the study visit may be clinically actionable,
        such as blood pressure or visual acuity/eye exam data and will be shared with
        the study participants in real time
    core_path: collection_notifications[1].name
  collection_notifications[1].notification_details:
    receipts:
    - chunk: c004
      snippet: sure and visual acuity assessments are provided to the participant
        on an exam card before they leave the visit, along with instructions in lay
        language for interpreting the data
    - chunk: c004
      snippet: Retinal imaging technicians are trained to detect certain conditions
        that are potentially life or vision threatening (retinal detachment, tumour
        and optic disc oedema)
    - chunk: c028
      snippet: The laboratory testing results will be available to subjects through
        the study database that is updated and uploaded yearly. Each subject will
        receive an access code
    - chunk: c028
      snippet: we are not distributing any test results that do not have standard
        interpretation methods (e.g., retinal images, fitness tracking)
    core_path: collection_notifications[1].notification_details
  collection_timeframes[0].end_date:
    receipts:
    - chunk: c019
      snippet: '"completionDate": "2027-01-01", "completionDateType": "Anticipated"'
    core_path: collection_timeframes[0].end_date
  collection_timeframes[0].start_date:
    receipts:
    - chunk: c015
      snippet: '"dateValue": "2023-07-19/2025-05-01", "dateType": "Collected"'
    core_path: collection_timeframes[0].start_date
  collection_timeframes[0].timeframe_details:
    receipts:
    - chunk: c002
      snippet: Enrolment began on 18 July 2023 and will continue until 30 November
        2026
    - chunk: c007
      snippet: AI-READI is enrolling 4,000 participants at three study sites over
        4 years (2022–2026)
    - chunk: c019
      snippet: For this version of the dataset, the timeframe for data collection
        was July 19, 2023 to May 01, 2025
    core_path: collection_timeframes[0].timeframe_details
  confidential_elements[0].confidential_elements_present:
    receipts:
    - chunk: c018
      snippet: No, the dataset does not contain data that might be considered confidential.
        No personally identifiable information is included in the dataset
    core_path: confidential_elements[0].confidential_elements_present
  confidential_elements[0].confidentiality_details:
    receipts:
    - chunk: c004
      snippet: Deidentified data are released approximately yearly in two data sets
        a controlled access set and publicly accessible set with fewer requirements
        for access
    - chunk: c010
      snippet: Some data that are not considered to be sensitive personal health data
        will be available to the public for download upon agreement with a license
        that defines how the data can be used. The full dataset will be accessible
        by entering into a data use agreement
    core_path: confidential_elements[0].confidentiality_details
  conforms_to:
    receipts:
    - chunk: c007
      snippet: We are also developing new standards, such as the Clinical Dataset
        Structure (CDS), a simple and intuitive way to organize clinical research
