purposes:
- name: Ethically sourced datasets and tools for AI in health
  response: The goal is to work with projects to create ethically sourced datasets and tools
    around Artificial Intelligence and to create best practices for AI in health.
- name: A diverse, high-resolution, AI-ready critical care dataset
  response: To develop the most diverse, high-resolution, ethically sourced, AI-ready data
    set to answer the grand challenge of improving recovery from acute illness.
- name: Generating data for AI/ML applications in acute and critical care
  response: To meet the need of generating data for ML/AI applications aimed at characterizing
    acute and critical care illness, predicting complications, and measuring treatment response
    among patients with acute or critical illness.
tasks:
- name: Characterization, prediction and treatment response
  response: Characterizing acute and critical care illness, predicting complications, and
    measuring treatment response among patients with acute or critical illness.
- name: Model development for critical care
  response: Building machine-learning (ML) and artificial intelligence (AI)-derived models
    to improve the care and outcomes of patients requiring critical care.
- name: External validation of AI models
  response: Supporting external validation of models against a sequestered holdout test set,
    to aid marketplace adoption of AI-developed models for implementation in acute and critical
    care.
addressing_gaps:
- name: Infrastructure for AI/ML in critical care
  response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning (AI/ML) in critical care.
- name: High-resolution multi-center data
  response: Developing high-resolution multi-center data sets is a critical first step towards
    actionable and trustworthy AI.
