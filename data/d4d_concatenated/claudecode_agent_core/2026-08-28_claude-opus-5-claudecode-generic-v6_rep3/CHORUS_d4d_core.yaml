id: https://chorus4ai.org/
name: CHoRUS dataset
description: 'CHoRUS is one of four data generation projects in the NIH-funded Bridge2AI consortium,
  building a multimodal, high-resolution, ethically sourced, AI-ready dataset drawn from the
  care of critically ill patients. The dataset is assembled from multimodal data across 14
  data contributing hospitals within a collaboration spanning 20 academic centers, and is
  standardized to the OMOP Common Data Model with modality-specific standards for imaging,
  waveform and text. The currently released dataset covers 50,000 patient admissions from
  ICU, PICU and NICU settings, comprising 1.6 billion rows of EHR OMOP data, 7,642 admissions
  with radiology data and 23 Tb of waveform data. Nine data types are represented: demographics,
  medication administration, procedures, nursing flowsheets, diagnoses, clinical notes, imaging,
  waveform telemetry and waveform EEG. Published metadata schemas are declared for the OMOP
  representation (including an extended variant), the OHNLP open source schema, the DICOM
  schema, an extended PhysioNet schema and the open source EDF+ and Persyst schemas. Every
  data type is held under controlled access, and the data are worked with in the Bridge2AI
  AI/ML for Clinical Care Collaborative Cloud. Alongside the data, the project develops unified
  standards, semantic mappings, a visualization and annotation environment, and a program
  of ethics and workforce work.'
source_caveats: Three points about the evidence behind this record. First, the CHoRUS project
  site carries a site-wide banner reading "This repoitory is under review for potential modification
  in compliance with Administration directives" (misspelling in the original), so the highest-ranked
  source may not be stable. Second, the cohort 2 webinar presents the nine data types as a
  table whose columns are data type, data standard, access control, metadata and published
  metadata schema; PDF text extraction interleaved those columns, so the data standard and
  the uniformly Controlled access control could be aligned to individual rows with confidence
  but the per-row metadata and published metadata schema values could not. Those values are
  therefore reported at the dataset level in the description rather than assigned to individual
  data types. Third, the GitHub organization README states that "This project is licensed
  under the MIT License"; that statement governs the organization's software repositories,
  not the data, every type of which the same sources place under controlled access, so no
  license is recorded for the dataset itself.
