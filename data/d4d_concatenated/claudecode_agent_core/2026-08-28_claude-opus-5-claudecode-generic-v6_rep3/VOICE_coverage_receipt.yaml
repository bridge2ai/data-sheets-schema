- id: c019
  status: extracted
  extracted:
  - slot: file_collections[0].resources[0].description
    snippet: torchaudio_spectrograms.parquet (n=29278) contains spectrograms of dimension
      201xT generated using the short-time Fast Fourier Transform (FFT) with a 25ms
      window size, 10ms hop length, and a 400-point FFT
  - slot: file_collections[0].resources[4].description
    snippet: sparc_ema.parquet (n=28640) contains the estimated electromagnetic articulography
      (EMA) using a deep learning model with dimensions Tx12
  - slot: file_collections[0].resources[3].description
    snippet: torchaudio_pitch.parquet (n=32522) contains the detected pitch (fundamental
      frequency) over time and is of dimension T with a min and max pitch of 80 and
      500 respectively
  - slot: file_collections[0].resources[1].description
    snippet: torchaudio_mel_spectrograms.parquet (n=29278) contains Mel spectrograms
      of dimension 60xT
  - slot: file_collections[0].resources[2].description
    snippet: torchaudio_mfcc.parquet (n=29278) contains Mel-frequency cepstrum coefficients
      of dimension 60xT
  - slot: file_collections[0].resources[5].description
    snippet: sparc_loudness.parquet (n=31855) contains the estimated loudness based
      on the average absolute amplitude of the audio waveform of size T, using 20ms
      windows
  - slot: file_collections[0].resources[6].description
    snippet: sparc_periodicity.parquet (n=31872) contains the estimated periodicity
      (confidence of pitch presence)
  - slot: file_collections[0].resources[7].description
    snippet: sparc_pitch.parquet (n=31872) contains the estimated fundamental frequency
      (F0) of the audio signal using a different algorithm than before with a range
      of 50-550Hz
  - slot: file_collections[0].resources[8].description
    snippet: ppgs.parquet (n=29289) contains the phonetic posteriorgram probabilities
      across 40 phoneme categories giving a dimension of 40xT with a frame rate of
      100Hz
  - slot: file_collections[0].resources[10].description
    snippet: audio_quality_metrics.tsv - One feature per audio recording derived from
      the raw audio related to quality control metrics
  - slot: file_collections[0].resources[9].description
    snippet: static_features.tsv - Features derived from the raw audio, with one feature
      per audio recording
  - slot: cleaning_strategies[0].cleaning_details
    snippet: One feature per audio recording derived from the raw audio related to
      quality control metrics
  - slot: file_collections[2].description
    snippet: The metadata folder contains a binary file made available as Parquet and
      its corresponding data dictionary. This includes specific information about the
      recording, including task instructions and prompts, as well as information about
      the microphone used and its gain
  - slot: is_deidentified.deidentification_details
    snippet: Spectrograms and similar features were excluded if the audio contained
      free speech
  - slot: errata[2].erratum_details
    snippet: 'b2ai-voice v3.1.0: Minor update with no new participants, but some additional
      data released for certain participants. Fixed broken parquet files from previous
      release'
  - slot: keywords
    snippet: 'Topics: health biomarkers bridge2ai voice'
  - slot: license_and_use_terms.license_terms
    snippet: 'Required training: No training required'
  - slot: distribution_formats[0].format
    snippet: Binary files are made available as Parquet
  - slot: file_collections[1].description
    snippet: The values for each element provide detail of the column, including a description
      field which provides a one sentence summary of the respective column, the question
      (if any) that was asked the participant
