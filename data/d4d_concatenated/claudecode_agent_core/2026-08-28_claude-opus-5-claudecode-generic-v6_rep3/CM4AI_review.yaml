notes: >-
  Two receipted values are on-topic but answer a neighbouring question: the NIH
  project end read as collection end_date (slot-017) and donor descriptions in
  Subpopulation.distribution, which asks for counts/proportions (slot-018). The
  accountable_organization receipt (slot-028) is a bare ror.org line under an
  author name; the identification of that ROR as the University of Virginia is
  the record's own positional inference, disclosed in source_caveats. One
  receiptless label, creators[0].name 'CM4AI data generation team', is composed
  rather than stated. Schema observation, not a record defect: the reconciliation
  report says Creator.principal_investigator and DataGovernance.committee_contact
  are string-ranged; in data_sheets_schema_all.yaml both declare range Person
  while their descriptions ask for a person's name, and linkml-validate accepted
  the name strings. No receipt-validator defect found: every sampled snippet was
  at the cited chunk's lines.
