  evidence: "external_resources[5] ('Guarantees and archival status of linked resources') is an entry whose future_guarantees value is 'The healthsheet records \"NA\" both for guarantees … and for official archival versions' — a statement that the information is absent, in a slot that asks for the guarantee itself; the rule says to omit instead. labeling_strategies[0].inter_annotator_agreement 'Not computed…' is borderline but states a fact about single labelers"
- id: rule-07
  verdict: followed
  evidence: "distribution_formats[] carries formats (Parquet, TSV) with the access route in access_urls; updates.frequency carries the cadence and future_use_impacts carries impacts; raw_sources vs raw_data_sources are separately populated"
- id: rule-08
  verdict: followed
  evidence: "funders[0] populates grantor, grants[].grant_number and name; creators[] populate name, description, affiliations[].name; collection_timeframes[0] populates start_date/end_date; used_software[0] populates id, name, version, license, url"
- id: rule-09
  verdict: followed
  evidence: "id, version_access.latest_version_doi, related_datasets[0].target_dataset and the minted fragments use doi: CURIEs; doi (string) holds the bare DOI; access_urls, access_url and contribution_url (uri) hold URLs; used_software[].id is a GitHub URL with no declared prefix covering it"
- id: rule-10
  verdict: followed
  evidence: "no ROR/ORCID/RRID is supplied outside the bundle; RRID:SCR_007345 appears only inside the citation text, which is verbatim from line 4822; the pediatric DOIs (mf9s-5r03, h995-bt35) are at lines 5138–5140 region of the pediatric page; grant numbers are at lines 1991, 3766, and the RePORTER page"
- id: rule-11
  verdict: followed
  evidence: "the 14 fragments in file_collections are minted on doi:10.13026/37yb-1t42, the record's own id taken from line 3806/4470; no prefix is invented and no fragment is appended to an organisation identifier"
- id: rule-12
  verdict: followed
  evidence: "grep of the record for British spellings (organisation, standardis-, analyse, behaviour, licence, recognis-, characteris-, programme, enrolment, centre) finds none; 'standardized', 'organized', 'analyzed', 'license' are used"
- id: rule-13
  verdict: followed
  evidence: "creators[8].source_caveats and creators[14].source_caveats prefer the documentation (tier 2) over the publication (tier 3) and say so; creators[17].source_caveats prefers the PhysioNet data resource (tier 1) over documentation for the 'Siu'/'Sui' spelling; subpopulations[2].source_caveats declines to prefer between two same-tier sources; these match source_priority in the manifest (data resource 1, documentation/IRB 2, publication 3)"
- id: rule-14
  verdict: violated
  evidence: "file_collections[0].id, file_collections[1].id, file_collections[2].id and the eleven file_collections[0].resources[].id fragments (doi:10.13026/37yb-1t42#features, #phenotype, #metadata, #features/torchaudio_spectrogram.parquet …) are referenced by no other value in the record — grep finds each fragment exactly once, at its own id line; the rule says a part nothing points at is described in prose, not labeled"
- id: rule-15
  verdict: followed
  evidence: "scalar slots hold scalars: conforms_to is a string, license is a string, page/contribution_url/access_url are URLs, ethics_review_board is a string; no object was placed in a string-ranged slot and both files validated (reconciliation report)"
notes: >-
  One receipted value is a scope misread (slot-020, collaborators read as collection
  sites) and it recurs as an unreceipted claim in creators[0].affiliations, which lists
  the same collaborators as affiliations of the consortium — that use is defensible
  since the list is headed 'Collaborators'. slot-004's receipt cites only the 'Static'
  answer while most of the value comes from lines 2219–2221 in c009; attribution is
  thin but the support is real. The 1.1 page (line 3715) gives a 512-point FFT where
  the 3.0.0/3.1.0 pages give 400-point; the record states 400 without a caveat, which
  is the current release's value and not among the sampled items. No instrument
  defect observed: every sampled snippet was found verbatim in its cited chunk.
