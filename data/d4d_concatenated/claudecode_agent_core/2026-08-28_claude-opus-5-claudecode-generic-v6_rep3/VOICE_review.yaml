- id: rule-01
  verdict: violated
  evidence: "data_collectors[2].collector_details asserts data were collected at Oregon Health & Science University, Washington University in St. Louis and the University of Florida, which the bundle lists only as collaborators (lines 1996, 2003–2004), never as collection sites (lines 2971–2979 list nine; line 3720 says five recording sites); raw_data_sources[0].raw_data_format 'WAV audio' is inferred from a filename template (line 2411). Most other slots are grounded (e.g. instances[0].counts 833, doi, version_access)"
- id: rule-02
  verdict: followed
  evidence: "source_caveats (root) records the 10,000 vs 30,000 target disagreement; creators[8].source_caveats and creators[14].source_caveats record the Rudzicz and Ravitsky affiliation disagreements; funders[0].source_caveats lists five spellings of the award and keeps supplements as separate grants; instances[1].source_caveats declines to assert a single recording count"
- id: rule-03
  verdict: followed
  evidence: "reconciliation report 'Referent' section (lines 13–18) chooses the adult Bridge2AI-Voice PhysioNet dataset, id doi:10.13026/37yb-1t42 with version 3.1.0; the record's id, version, doi and related_datasets[0] (pediatric dataset held as a relation, not absorbed) are consistent with it"
- id: rule-04
  verdict: followed
  evidence: "the record omits slots the bundle does not answer (no creator identifiers, no ROR/ORCID, no funder ids) and does not pad; density follows the evidence"
- id: rule-05
  verdict: followed
  evidence: "creators is 18 separate objects (creators[1]..[17]) rather than one consortium blob; intended_uses has three entries; purposes has five; prohibited_uses four; grants three"
- id: rule-06
