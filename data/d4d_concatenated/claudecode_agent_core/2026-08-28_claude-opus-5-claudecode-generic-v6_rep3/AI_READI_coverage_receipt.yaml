  - slot: file_collections[7].description
    snippet: '"name": "AI READI Wearable Activity Monitoring Subcrate"'
  - slot: file_collections[7].description
    snippet: Participants were advised to wear the wristwatch on their non-dominant wrist for 10 consecutive
      days, but they were free to choose their preferred wrist for wearing the device
  - slot: anomalies[1].anomaly_details
    snippet: There are gaps in data collection as the battery had to be charged every 2-3 days. The sampling
      frequency of the Fitness tracker is 5 seconds
  - slot: file_collections[2].description
    snippet: '"name": "AI-READI Environmental Sensor Subcrate"'
  - slot: file_collections[2].description
    snippet: In the AI-READI study, a custom-designed sensor unit (LeeLab Anura) was utilized to obtain
      environmental sensor data from each subject's home for a period of 10 days
  - slot: variables[13].description
    snippet: The sensor then recorded particulate matter counts (PM 1.0, 2.5, 4, and 10), temperature,
      relative humidity, volatile organic compounds (VOCs), nitrogen oxides (NO and NO2), and 11 multi-spectral
      light intensity measurements
  - slot: file_collections[2].description
    snippet: Research indicates that environmental factors play a significant role in health outcomes,
      yet most of these studies have focused on outdoor conditions at a broad city or regional scale
