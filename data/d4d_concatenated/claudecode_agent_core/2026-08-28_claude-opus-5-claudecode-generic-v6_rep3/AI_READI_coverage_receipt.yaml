- id: c010
  status: extracted
  extracted:
  - slot: title
    snippet: This is the documentation for the AI-READI dataset called Flagship Dataset of Type 2 Diabetes
      from the AI-READI Project
  - slot: description
    snippet: The AI-READI is a dataset consisting of data collected from individuals with and without
      Type 2 Diabetes Mellitus (T2DM) and harmonized across 3 data collection sites
  - slot: description
    snippet: The public dataset will include survey data, blood and urine lab results, fitness activity
      levels, clinical measurements (e.g. monofilament and cognitive function testing), retinal images,
      ECG, blood sugar levels, and environmental variables such as home air quality
  - slot: sensitive_elements[0].sensitivity_details
    snippet: The data held under controlled access include 5-digit zip code, sex, race, ethnicity, genetic
      sequencing data, past health records, medications, and traffic and accident reports
  - slot: confidential_elements[0].confidentiality_details
    snippet: Some data that are not considered to be sensitive personal health data will be available
      to the public for download upon agreement with a license that defines how the data can be used.
      The full dataset will be accessible by entering into a data use agreement
  - slot: known_limitations[2].limitation_description
    snippet: As enrollment is ongoing, the pilot data release and periodic updates to data releases may
      not have achieved balanced distribution across groups
  - slot: version_access.version_details
    snippet: This documentation is for v 2.0.0 of the dataset, which is no longer accessible. Refer to
      the documentation for the latest version of the dataset v 3.0.0
  - slot: version_access.version_details
    snippet: This documentation is associated with v2.0 of the dataset, which contains data from the participants
      of the pilot study phase
  - slot: external_resources[0].description
    snippet: The Dataset Documentation section includes an overall description of the dataset using the
      Healthsheet template
  source_caveats: Superseded per the manifest by dataset_documentation_v3; retained here only as evidence
    about the v2.0.0 release.
