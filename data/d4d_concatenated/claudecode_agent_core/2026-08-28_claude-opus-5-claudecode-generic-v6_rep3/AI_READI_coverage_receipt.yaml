  - slot: purposes[1].response
    snippet: The primary goal of AI-READI is to collect and publicly share a multimodal, AI-ready dataset
      for studying the pathogenesis and salutogenesis (that is, the pathway from disease to health) of
      type 2 diabetes mellitus (T2DM)
  - slot: funders[0].description
    snippet: The AI-READI project is one of four Data Generation Projects (DGPs) funded by Bridge2AI (https://commonfund.nih.gov/bridge2ai),
      a new NIH Common Fund Program
  - slot: collection_timeframes[0].timeframe_details
    snippet: AI-READI is enrolling 4,000 participants at three study sites over 4 years (2022–2026)
  - slot: acquisition_methods[1].acquisition_details
    snippet: The recruitment process consists of a selection of individuals based on the available clinical
      diagnosis using ICD-10 codes and demo
  - slot: is_deidentified.method
    snippet: The public set is stripped of Protected Health Information (PHI), as defined by the HIPAA
      (Health Insurance Portability and Accountability Act) Privacy Rule via the “Safe Harbor” method
  - slot: is_deidentified.identifiers_removed
    snippet: as well as information related to the sex and race/ethnicity of the participants to prevent
      stigmatization of findings
  - slot: license_and_use_terms.license_terms
    snippet: The first version of the public set was recently shared using a new licence developed as
      part of this project that allows reuse for any purpose but includes restrictions to protect participant
      privacy
  - slot: participant_privacy[0].reidentification_risk
    snippet: attempts, we are implementing a robust data dissemination system, a strict licence agreement
