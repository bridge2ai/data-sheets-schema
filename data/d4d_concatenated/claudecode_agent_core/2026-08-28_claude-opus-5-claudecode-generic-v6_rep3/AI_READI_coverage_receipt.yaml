    snippet: '"metadataFileName": "healthsheet.md"'
  - slot: source_caveats
    snippet: The Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights (AI-READI)
      is a dataset consisting of data collected from individuals with and without “Type 2 Diabetes Mellitus
      (T2DM)”
  - slot: cleaning_strategies[1].cleaning_details
    snippet: The dataset has not undergone any formal external audits. However, the dataset has been reviewed
      internally by AI-READI team members for quality checks
  - slot: updates.update_details
    snippet: The dataset gets released as static versions. This is the third version of the dataset and
      consists of data collected up through the end of the second year of the study, i.e. between July
      19, 2023 and May 1st, 2025
  - slot: version_access.version_details
    snippet: There was a previous datasheet created for the first version of the dataset, which consisted
      of data collected during the pilot data collection phase. It is available here https://docs.aireadi.org/docs/1/dataset/healthsheet
  - slot: version_access.versions_available
    snippet: the first version of the dataset contains data from 204 participants, the second version
      contains additional data from 863 participants for a total of 1067 participants, and this version
      contains a total of 2280 participants
  - slot: updates.update_details
    snippet: the Snellen visual acuity variables were dropped in this version of the dataset, such that
      now only logMAR visual acuity measurements are available
  - slot: splits[0].split_details
    snippet: It does include a new recommended data split for the 2280 participants balancing training,
      validation, and testing sets for age, sex, races/ethnicities, and study group
  - slot: purposes[0].description
    snippet: The purpose for creating the dataset was to enable future generations of artificial intelligence/machine
      learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including
      salutogenic pathways to return to health
  - slot: addressing_gaps[1].description
    snippet: Given the complexity of T2DM, AI-based approaches may help with improving our understanding
      but a key issue is the lack of data ready for training AI models. The AI-READI dataset is intended
      to fill this gap
  - slot: license_and_use_terms.license_terms
    snippet: The AI READI dataset License imposes certain restrictions on the usage of the data. The restrictions
      are described in the License files available at https://doi.org/10.5281/zenodo.17555036
  - slot: creators[0].description
    snippet: This dataset was created by members of the AI-READI project, hereby referred to as the AI-READI
      Consortium. Details about each member and their institutions are available on the project website
      at https://aireadi.org
  - slot: instances[0].instance_type
    snippet: Each instance represents an individual patient
  - slot: instances[0].counts
    snippet: There are 2280 instances in this current version of the dataset (version 3, released fall
      2025)
  - slot: sampling_strategies[0].is_sample
    snippet: The dataset contains all possible instances. More specifically, the dataset contains data
      from all participants who have been enrolled during the first year of data collection for AI-READI
  - slot: instances[0].description
    snippet: Multiple modalities of data are collected for each participant, including survey data, clinical
      data, retinal imaging data, environmental sensor data, continuous glucose monitor data, and wearable
      activity monitor data
  - slot: missing_data_documentation[0].missing_data_causes
    snippet: not all modalities are available for all participants. Some participants elected not to participate
      in some study elements. In a few cases, the data collection device did not have any stored results
      or was returned too late to retrieve the results
  - slot: relationships[0].relationship_details
    snippet: all instances are part of the same prospective data generation project (AI-READI). There
      is currently only one visit per participant
  - slot: anomalies[0].anomaly_details
    snippet: In cases of survey data, skipped questions or incomplete responses are expected. In cases
      of using wearables, improper use, technical failure such as battery failure or system malfunction
      are expected
  - slot: external_resources[0].description
    snippet: The dataset is self-contained but does rely on the dataset documentation for users requiring
      additional information about the provenance of the dataset. The documentation is available at https://docs.aireadi.org
  - slot: confidential_elements[0].confidential_elements_present
    snippet: No, the dataset does not contain data that might be considered confidential. No personally
      identifiable information is included in the dataset
  - slot: content_warnings[0].content_warnings_present
    snippet: 'might be offensive, insulting, threatening, or might otherwise pose any safety risk (such
      as psychological safety and anxiety)? If so, please describe why.", "response": "No."'
  - slot: sensitive_elements[0].sensitivity_details
    snippet: the controlled access dataset will contain data regarding racial and ethnic origins, location
      (5-digit zip code), as well as motor vehicle accident reports
  - slot: collection_mechanisms[7].mechanism_details
    snippet: Participants will be sent home with an environmental sensor (a custom-designed sensor unit
      called the LeeLab Anura), which they will use for 10 continuous days
  - slot: collection_mechanisms[2].mechanism_details
    snippet: Blood pressure devices used for the study across the various data acquisition sites are OMRON
      HEM 907XL Blood Pressure Monitor, Medline MDS4001 Automatic Digital Blood Pressure Monitor
  - slot: known_biases[1].bias_description
    snippet: Factors influencing the generalization of derived models include the predominantly urban
      and hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic backgrounds
  - slot: known_limitations[0].limitation_description
    snippet: The study cohort may not provide a comprehensive representation of the population, as it
      does not include other races/ethnicities such as Pacific Islanders and Native Americans
  - slot: known_biases[3].mitigation_strategy
    snippet: Uniform data collection protocols were implemented for all subjects, irrespective of their
      race/ethnicity, biological sex, or diabetes severity, across all study sites
  - slot: cleaning_strategies[0].cleaning_details
    snippet: clinical data outside of expected min/max ranges were flagged in REDCap, which was visible
      in reports viewed by clinical research coordinators (CRCs) and Data Managers
  - slot: raw_sources[0].raw_data_details
    snippet: The raw data is saved and expected to be preserved by the AI-READI project at least for the
      duration of the project but is not anticipated to be shared outside the project team right now
  - slot: sampling_strategies[1].source_data
    snippet: Persons with or without type 2 diabetes
  - slot: labeling_strategies[0].labeling_details
    snippet: N/A - no labels are provided. No specific labeling was performed in the dataset, as the dataset
      is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML applications
  - slot: instances[0].label
    snippet: Is there an explicit label or target associated with each data instance?
  - slot: subpopulations[0].subpopulation_elements_present
    snippet: 'Does the dataset identify any demographic sub-populations (e.g., by age, gender, sex, ethnicity)?",
      "response": "No"'
  - slot: known_biases[1].mitigation_strategy
    snippet: Three recording sites were strategically selected to achieve diverse recruitment the University
      of Alabama at Birmingham (UAB), the University of California San Diego (UCSD), and the University
      of Washington (UW)
- id: c019
