  - slot: description
    snippet: There will be two databases for data distribution The first will be deidentified, which will
      be publicly available
  - slot: sensitive_elements[0].sensitivity_details
    snippet: The second one has some identifiable or sensitive information genomic data and race/ethnicity,
      and will require data user agreement between the researchers to obtain the data and approval process
      developed by the project committee
  - slot: external_resources[3].description
    snippet: Biobank blood specimens will be stored at UAB as a repository. During this project we will
      create an infrastructure to decide who is allowed to request and receive the specimen for future
      research
  - slot: informed_consent[0].consent_type
    snippet: Consent will be obtained in a private room by a study team member. Patients will be given
      opportunity to ask questions prior to signing the consent
  - slot: informed_consent[0].consent_documentation
    snippet: Participants will be directed to our study interface (REDCap) where they will have the opportunity
      to read the consent documentation and give e-consent
  - slot: known_limitations[1].limitation_description
    snippet: non-English speaking participants will not be initially enrolled and all patients will need
      to be proficient enough to understand instructions of the study procedures such as using fitness
      tracking and CGM
  - slot: participant_privacy[0].privacy_techniques
    snippet: All study data and identifiable information will be kept on encrypted servers, or in locked
      cabinets/room with restricted access (at all sites)
  - slot: participant_privacy[0].privacy_techniques
    snippet: Confidentiality breach – low risk – all identifiable information will be kept on encrypted
      computers/servers or in a locked cabinet/room with restricted access at all sites
  - slot: at_risk_populations.special_protections
    snippet: There will also be a community advisory board that evaluates the consent forms and research
      protocols and their feedback will be considered
  - slot: collection_mechanisms[7].mechanism_details
    snippet: We will use Dexcom CGM devices that collect glucose data over a 10-day period
  - slot: subpopulations[0].distribution
    snippet: No type 2 diabetes 1000 Type 2 diabetes controlled by diet/lifestyle
  - slot: known_biases[2].mitigation_strategy
    snippet: UW will concentrate in recruiting Asian>Hispanic>Black participants, while the University
      of California at San Diego site will prioritize Hispanic>Asian>Black participants
