- id: c027
  status: extracted
  extracted:
  - slot: source_caveats
    snippet: The study will collect a cross-sectional dataset of 4600 people across the US from diverse
      racial/ethnic groups
  - slot: ethical_reviews[0].review_details
    snippet: APPLICATION IRB Protocol AI Ready and Exploratory Atlas for Diabetes Insights (AI-READI)
      University of Washington
  - slot: addressing_gaps[1].response
    snippet: The ability to understand and affect the course of complex, multisystem diseases has been
      limited by a lack of well-designed, high quality, large, and inclusive multimodal datasets
  - slot: sampling_strategies[1].strategies
    snippet: rather than targeting the demographic distribution of the US population, we intentionally
      will recruit equal numbers of four racial/ethnic groups. The same rationale applies for balancing
      diabetic severity
  - slot: acquisition_methods[0].acquisition_details
    snippet: We will first screen for eligible participants using medical records data search from each
      institution including ICD diagnosis codes, race, and age
  - slot: collection_mechanisms[9].mechanism_details
    snippet: Over the 3+ years of study recruitment, approximately 50,000 invitation letters from each
      site will be sent by both mail and email to participants identified through the electronic medical
      record search
  - slot: participant_compensation[0].compensation_amount
    snippet: There will be a $200 stipend for participation, which will be provided when we receive the
      final data from participants and return of the study devices
  - slot: participant_compensation[0].compensation_rationale
    snippet: Study will cover reasonable costs for parking, public transit, or rideshare fees (e.g., Uber
      or Lyft) related to the study visit
  - slot: collection_mechanisms[0].mechanism_details
    snippet: tudy visit will take approximately 3-4 hours. If requested by subjects, the visit can be
      performed over a couple of days instead of a single visit
  - slot: collection_mechanisms[6].mechanism_details
    snippet: We will collect approximately 50-60 ml of blood (about 3-4 spoonfuls)
  - slot: collection_mechanisms[8].mechanism_details
    snippet: We will be extracting medical records to obtain data on general health, eye health, medical
      and surgical history, diabetes, medications, laboratory records, and any previous medical imaging
  - slot: collection_mechanisms[8].mechanism_details
    snippet: We will also collect information about any car accidents they may have experienced and traffic
      tickets the participant has received in the last 3 years
  - slot: raw_data_sources[3].source_description
    snippet: Driving and accident records will be obtained from the Department of Licensing (no additional
      approvals are required beyond the IRB approval)
  - slot: sensitive_elements[0].sensitivity_details
    snippet: Name, MRN, DOB, age, sex, race/ethnicity, address, phone number, driver’s license number,
      and email
