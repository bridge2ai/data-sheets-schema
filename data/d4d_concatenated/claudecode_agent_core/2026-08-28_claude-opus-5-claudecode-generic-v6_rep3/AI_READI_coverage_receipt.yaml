  - slot: file_collections[4].description
    snippet: Optical Coherence Tomography (OCT) is a non-invasive diagnostic technique that renders an
      in vivo cross-sectional view of the retina. OCT utilizes a concept known as interferometry to create
      a cross-sectional map of the retina
  - slot: file_collections[5].description
    snippet: '"name": "AI-READI Retinal OCTA Subcrate"'
  - slot: file_collections[5].description
    snippet: Optical coherence tomography angiography (OCTA) is a non-invasive imaging modality that permits
      visualization of retinal and inner choroidal circulation without the need for the dye injection
  - slot: file_collections[6].description
    snippet: '"name": "AI-READI Retinal Photography Subcrate"'
  - slot: file_collections[6].description
    snippet: Retinal photography is a non-invasive procedure that photographs the posterior segment of
      an eye, also known as the fundus
  - slot: file_collections[8].description
    snippet: '"name": "AI-READI Continuous Glucose Monitoring Subcrate"'
  - slot: file_collections[8].description
    snippet: The Dexcom G6 Continuous Glucose Monitor (CGM) captures blood glucose readings every five
      minutes using this sensor. A single sensor is designed to last for a maximum of ten days
  - slot: collection_mechanisms[7].mechanism_details
    snippet: In the AI-READI program, we have asked the research participants to wear the Dexcom CGM for
      ten days concurrently with wearing the Garmin Activity Monitor and using the home environmental
      sensor
