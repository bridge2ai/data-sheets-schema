notes: >-
  Adverse pattern in the receipted sample: five of 25 receipted values are 'weak'
  because the passage describes a plan or a repository rather than the procedure
  the slot asks for (cleaning_details, deidentification_details, review_details,
  license_terms, and the variable derivation/name pair). Three of these also
  render the sources' future tense ('will transform', 'will perform', 'will
  determine') as present tense; the released-data evidence at lines 1074–1082
  makes that defensible for OMOP standardization but not for the ethics and
  de-identification procedures. Entry `name` labels among the receiptless sample
  were judged bundle_supports where the wording paraphrases a bundle line and
  exempt_by_nature where the label is a composed heading (slot-044, slot-050).
  No instrument finding: every snippet in the sample is verbatim in the cited
  chunk, so nothing here is something the receipt validator should have caught.
