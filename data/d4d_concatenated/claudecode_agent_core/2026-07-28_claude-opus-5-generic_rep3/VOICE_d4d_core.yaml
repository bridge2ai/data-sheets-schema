id: https://doi.org/10.13026/37yb-1t42
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is an ethically sourced, demographically diverse dataset of voice, speech
  and respiratory sounds linked to multimodal health information, generated by the
  Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI program. Participants were
  recruited at specialty ("high volume expert") clinics across five sites in North America on
  the basis of membership in five predetermined disease cohort categories - voice disorders,
  neurological and neurodegenerative disorders, mood and psychiatric disorders, respiratory
  disorders, and pediatric voice and speech disorders - together with control participants
  without those conditions. Each participant completed a standardized protocol of acoustic
  tasks (sustained phonation, glides, diadochokinesis, breathing and cough sounds, read
  passages, free speech and cognitive-linguistic tasks), demographic and confounder surveys,
  and disease-specific validated questionnaires, delivered through a custom tablet
  application; diagnoses were validated by a qualified clinician against established gold
  standards or, for the psychiatric cohort, from the electronic health record or an active
  prescription. The public release is a feature-only ("AI-ready") derivation: raw audio
  waveforms are withheld and the distributed data comprise spectrograms, Mel spectrograms,
  MFCCs, pitch contours, articulatory (SPARC/EMA) features, phonetic posteriorgrams,
  openSMILE/Praat static features and audio-quality metrics in Parquet, alongside phenotype
  and task tables in TSV with JSON data dictionaries. The adult dataset is distributed
  through PhysioNet; release v3.1.0, published 2026-05-01, covers 833 participants. Raw audio
  is distributed separately under controlled access via Synapse.
version: 3.1.0
