preprocessing_strategies:
- id: d4d:voice_preprocessing_audio
  name: Audio standardization and feature derivation
  preprocessing_details:
  - "Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a Butterworth anti-aliasing filter applied."
  - "Spectrograms: time-frequency representations computed using the short-time Fast Fourier Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT, downsampled by a factor of two in the time domain after derivation, of dimension 201xT."
  - "Mel spectrograms of dimension 60xT computed with the same window, hop and FFT parameters and 60 Mel bins."
  - "Mel-frequency cepstral coefficients: 60 MFCCs extracted using the above spectrograms."
  - "Pitch: torchaudio pitch of dimension T with minimum and maximum pitch of 80 and 500 Hz."
  - "Articulatory features: Speech Articulatory Coding (SPARC) kinematic traces of vocal tract articulators and source features, giving estimated electromagnetic articulography of dimension Tx12 for X/Y positions of tongue dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip, plus loudness over 20 ms windows, periodicity, and fundamental frequency over a 50-550 Hz range; all features gathered at 50 Hz."
  - "Phonetic posteriorgrams: time-varying categorical distribution over 40 phoneme categories at a 100 Hz frame rate."
  - "Acoustic features extracted using openSMILE, including eGeMAPS features per audio file, capturing temporal dynamics and acoustic characteristics."
  - "Phonetic and prosodic features computed using Parselmouth and Praat, providing measures of fundamental frequency, formants and voice quality, and speech intelligibility metrics for speech tasks."
  - "Transcriptions generated using OpenAI's Whisper Large model."
  - "Waveform-derived features are stored in two formats: a fixed feature format with static features extracted from the entire waveform, and a temporal format that varies for each audio file depending on the length of the recording."
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
    description: >-
      Code used to organize and preprocess the dataset, converting raw audio waveforms into the
      parquet files and merging the source data into the phenotype files. Release v3.1.0 was
      generated with b2aiprep v3.0.0.
  - id: https://github.com/sensein/senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
    description: Toolkit for processing audio files for research tasks.
  - id: d4d:voice_software_opensmile
    name: openSMILE
    description: Speech and Music Interpretation by Large-space Extraction, used for acoustic feature extraction.
  - id: d4d:voice_software_praat
    name: Praat
    description: Phonetic analysis software used for prosodic and voice quality measures.
  - id: d4d:voice_software_parselmouth
    name: Parselmouth
    description: Python interface to Praat used for phonetic and prosodic feature computation.
  - id: d4d:voice_software_torchaudio
    name: torchaudio
    description: Used for pitch contours, spectrograms, Mel spectrograms and MFCCs.
  - id: d4d:voice_software_sparc
    name: Speech Articulatory Coding (sparc)
    description: Used to generate electromagnetic articulography estimates plus loudness, periodicity and pitch measures.
  - id: d4d:voice_software_ppgs
    name: ppgs
    description: Used to generate phonetic posteriorgrams.
  - id: d4d:voice_software_whisper
    name: OpenAI Whisper Large
    description: Automatic speech recognition model used to generate transcriptions.
- id: d4d:voice_preprocessing_structure
  name: Structural standardization and packaging
  preprocessing_details:
  - "The raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported from REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0."
  - "Pediatric data collected through ReproSchema-UI is extracted and transformed into REDCap format and subsequently converted to BIDS."
  - "Data were exported and converted from REDCap using an open source library developed by the team."
  - "Dense binary features are distributed as Parquet, an open-source column-oriented data file format, with each element carrying participant_id, session_id, task_name, n_frames and the feature tensor."
  - "Phenotype and task information are distributed as tab-separated value files, each with a JSON data dictionary of the same file stem describing every column, the question asked and the data type of the response."
- id: d4d:voice_preprocessing_deidentification
  name: De-identification preprocessing
  preprocessing_details:
  - "Pre-processing for de-identification was performed: the data were extracted from the raw audio to limit re-identification and only the extracted features are released with the dataset."
  - "All sensitive fields were removed from the dataset, corresponding to data elements encoded as sensitive (column name \"Identifier?\") in the REDCap data dictionary."
  - "All spectrograms, MFCCs, Mel spectrograms, transcriptions, EMAs and PPGs from open-response prompts are removed from the feature-only dataset."
  - "Spectrograms and similar features were excluded if the audio contained free speech; static and other features which do not encode the sensitive information were retained."

cleaning_strategies:
- id: d4d:voice_cleaning
  name: Cleaning and audit
  cleaning_details:
  - "The healthsheet records that there was no pre-processing for cleaning the data."
  - "No instances were excluded from the dataset at the time of preprocessing."
  - "An audit protocol is applied: generate missingness tables; check distributions and outliers; for categorical responses check against schema; for audio tasks run quality control metrics; for waveforms check amount of silence and duration; and for speech check produced speech relative to the intended passage."
  - "Release v2.0 reprocessed spectrograms to fix minor issues identified in the previous release; release v3.1.0 fixed broken parquet files from the previous release."
  - "The smartphone application for voice data collection includes models to ensure acoustic data quality, including volume standardization and noise cancellation."
  used_software:
  - id: d4d:voice_software_b2aiprep_audit
    name: b2aiprep
    url: https://github.com/sensein/b2aiprep
    description: Used for organizing and preprocessing the dataset and for audit outputs such as missingness tables.

