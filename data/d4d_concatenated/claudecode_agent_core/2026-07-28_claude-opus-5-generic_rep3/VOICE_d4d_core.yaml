  - "For augmentations to the code used to produce the data, the open-source repositories have discussion forums and issue pages allowing public discussion of data preprocessing, and a pull request mechanism for contributing improvements to the preprocessing code."

is_deidentified:
  id: d4d:voice_deidentification
  name: De-identification
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor identifier removal combined with expert removal of indirect identifiers and
    highly sensitive non-identifying elements, plus withholding of all raw audio.
  identifiers_removed:
  - "Names, civic addresses and social security numbers."
  - "Geographic locators; state and province removed, country of data collection retained."
  - "Date information at resolution finer than years; dates rebased or replaced by integers."
  - "Phone and fax numbers, email addresses, IP addresses, medical record numbers, health plan beneficiary numbers, device identifiers, license numbers, account numbers, vehicle identifiers, website URLs, full face photos, biometric identifiers and any unique identifiers."
  - "Select geographic or demographic identifiers and some information about household composition or cultural identity."
  - "Non-identifying but highly sensitive elements such as household income, mental health status and traumatic life experiences."
  - "Narrative text fields and transcripts of free speech audio."
  - "All raw voice data."
  deidentification_details:
  - "Level of de-identification for this dataset: identifiable information under HIPAA and the Common Rule, as well as data considered sensitive, have been removed."
  - "The dataset removes direct identifiers, applies the HIPAA de-identification rules, rebases or replaces dates by integers, removes or generalizes geographic information, and removes narrative text fields; it does not achieve k-anonymization at k greater than or equal to 2."
  - "Indirect identifiers were removed where these created a significant risk of participant re-identification, for example through combination with other public data available on social media, in government registries, or elsewhere."
  - "Raw audio transcripts were reviewed and any audio recordings that contained potentially identifying information or external voices were removed from the release."
  - "This dataset has been de-identified through removal of all audio data and certain sensitive fields identified by a team of ethicists."

