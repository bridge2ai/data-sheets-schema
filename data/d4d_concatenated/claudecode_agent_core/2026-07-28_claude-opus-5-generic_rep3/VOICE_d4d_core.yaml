instances:
- id: d4d:voice_instance_participant
  name: Participant
  instance_type: person
  counts: 833
  label: true
  label_description: >-
    Diagnostic labels are the result of a clinical assessment of the participant. At each site
    a local clinician provided the diagnosis based on a clinical interview and appropriate
    work-up. For the psychiatric disorders cohort, the assessment was determined using the
    participant's EHR record or an active prescription, done outside of data collection by an
    appropriately licensed clinician.
  description: >-
    Each instance represents a person. Adult release v3.1.0 contains data for 833 participants
    across five sites in North America; the healthsheet reports "around 833 instances" and 833
    patients/subjects. Because participants may have repeated visits, there may be more than
    one row per participant in the phenotype data files, and responses need not be identical
    across visits.
- id: d4d:voice_instance_recording
  name: Voice, speech and respiratory recording (derived features)
  instance_type: audio recording derivation
  description: >-
    Each recording is identified by participant_id, session_id and task_name. Project
    documentation reports approximately 61,937 voice-derived recordings from 833 adult
    participants for version 3.0. In adult release v3.1.0 the per-feature record counts are
    29,278 spectrograms, Mel spectrograms and MFCC tensors, 32,522 torchaudio pitch series,
    28,640 SPARC EMA traces, 31,855 SPARC loudness series, 31,872 SPARC periodicity and pitch
    series, and 29,289 phonetic posteriorgrams.
- id: d4d:voice_instance_session
  name: Recording session
  instance_type: session
  description: >-
    For most participants a single session was sufficient to collect all relevant data;
    a subset required multiple sessions, so there may be more than one session per participant.

