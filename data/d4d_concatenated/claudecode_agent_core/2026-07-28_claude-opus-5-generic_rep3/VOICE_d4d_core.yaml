resources:
- id: https://doi.org/10.13026/k81f-qr68
  name: Bridge2AI-Voice adult release v3.0.0
  title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
  version: 3.0.0
  doi: 10.13026/k81f-qr68
  issued: "2025-12-16T00:00:00Z"
  page: https://physionet.org/content/b2ai-voice/3.0.0/
  publisher: https://physionet.org/
  license: Bridge2AI Voice Registered Access License
  description: >-
    Credentialed-access release containing data for 833 participants across five sites in North
    America. A major update adding data for an additional 391 participants, separating the single
    phenotype file into individual files, adding SPARC and phonetic posteriorgram features, and
    reorganizing the file layout. Per-feature counts were 29,020 spectrogram, Mel spectrogram and
    MFCC records, 32,236 torchaudio pitch records, 31,616 SPARC EMA and loudness records, 31,633
    SPARC periodicity and pitch records, and 29,031 phonetic posteriorgram records.
- id: https://doi.org/10.13026/249v-w155
  name: Bridge2AI-Voice adult release v1.1
  title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
  version: "1.1"
  doi: 10.13026/249v-w155
  issued: "2025-01-17T00:00:00Z"
  page: https://physionet.org/content/b2ai-voice/1.1/
  publisher: https://physionet.org/
  license: Bridge2AI Voice Registered Access License
  description: >-
    Restricted-access release, accessible only to registered users who sign the specified data
    use agreement. It added Mel-frequency cepstral coefficients to the initial release and made
    the data available as spectrograms.parquet, mfcc.parquet, phenotype.tsv, phenotype.json,
    static_features.tsv and static_features.json. Only adult cohort data was available as of
    v1.1, and its files are no longer available for download.
- id: d4d:voice_release_v2_0_0
  name: Bridge2AI-Voice adult release v2.0.0
  version: 2.0.0
  issued: "2025-04-16T00:00:00Z"
  publisher: https://physionet.org/
  description: >-
    Release providing data for an additional 136 new participants, with spectrograms reprocessed
    to fix minor issues identified in the previous release and all spectrograms and MFCCs from
    free-speech-related files removed.
- id: d4d:voice_release_v2_0_1
  name: Bridge2AI-Voice adult release v2.0.1
  version: 2.0.1
  issued: "2025-08-18T00:00:00Z"
  publisher: https://physionet.org/
  description: Release consisting of corrections in the authorship list.
- id: https://doi.org/10.57764/qb6h-em84
  name: Bridge2AI-Voice adult release v1.0 (Health Data Nexus)
  version: "1.0"
  doi: 10.57764/qb6h-em84
  publisher: https://healthdatanexus.ai/
  page: https://healthdatanexus.ai/
  description: >-
    First release of the Bridge2AI voice as a biomarker of health dataset, published and made
    available at the end of November 2024 on the Health Data Nexus, which provides cloud compute
    alongside the dataset rather than allowing data downloads. The initial release provided
    12,523 recordings for 306 participants collected across five sites in North America and
    contained data considered low risk, including derivations such as spectrograms but not the
    original voice recordings.
- id: https://www.synapse.org/Synapse:syn72370534/
  name: Bridge2AI-Voice adult raw audio collection
  page: https://www.synapse.org/Synapse:syn72370534/
  description: >-
    Controlled-access distribution of the raw audio waveforms for the adult cohort. The published
    PhysioNet project contains derived features only; accessing raw audio is a more involved
    process requiring institutional sign-off through the Data Access Compliance Office.


dialect:
  delimiter: "\t"
  header: 'true'

distributions:
- id: d4d:voice_files_features
  name: features
  path: features
  description: >-
    Dense binary Parquet feature files - ppgs.parquet, sparc_ema.parquet,
    sparc_loudness.parquet, sparc_periodicity.parquet, sparc_pitch.parquet,
    torchaudio_spectrogram.parquet, torchaudio_mfcc.parquet, torchaudio_pitch.parquet and
    torchaudio_mel_spectrogram.parquet - together with plain-text audio_quality_metrics.tsv and
    static_features.tsv, each accompanied by a JSON data dictionary of the same file stem.
- id: d4d:voice_files_phenotype
  name: phenotype
  path: phenotype
  format: TSV
  media_type: text/tab-separated-values
  description: >-
    Organized information collected from the participant or another individual during their
    encounter, arranged into confounders, demographics, diagnosis, enrollment, questionnaire and
    task subfolders. Each TSV file is paired with a JSON data dictionary whose keys match the
    column names and whose values give the column description, the question asked and the data
    type of the response.
- id: d4d:voice_files_metadata
  name: metadata
  path: metadata
  description: >-
    A Parquet binary file and its corresponding data dictionary containing specific information
    about the recording, including task instructions and prompts as well as information about
    the microphone used and its gain. Introduced in adult release v3.1.0.
