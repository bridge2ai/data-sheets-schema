  - "The data provider provides no guarantees that the data is free of third-party intellectual property rights, database rights, and other related rights."
  - "Nothing in the agreement operates to transfer to the recipient any intellectual property rights in or relating to the data."
  - "Recipients agree not to use intellectual property protection, database rights, or related rights in a way that could prevent or limit access to, or use of, any element of the data or research conclusions derived from it."
  - "Neither party shall use the other party's name, trademarks, or other logos in any publicity, advertising, or news release without prior written approval."

regulatory_restrictions:
  id: d4d:voice_regulatory_restrictions
  name: Regulatory and compliance restrictions
  regulatory_restrictions:
  - "No export controls apply to the dataset."
  - "The data is Personally Identifiable Information as defined in OMB Memorandum M-07-16 and is not covered under HIPAA, FERPA, or similar laws requiring additional special terms beyond those in the agreement."
  - "The data is covered under a Certificate of Confidentiality, which must be asserted against compulsory legal demands such as court orders and subpoenas for identifying information or characteristics of a research participant."
  - "Recipients must store the data with security controls adequate to protect Personally Identifiable Information, including the administrative, physical and technical safeguards that covered entities and business associates must put in place to secure electronic protected health information."
  - "Recipients must notify the provider of any unauthorized use or disclosure no later than five business days after discovery."
  - "The provider may unilaterally amend the agreement should the federal sponsor require revision."
  hipaa_compliant: compliant
  other_compliance:
  - "HIPAA de-identification rules are applied to the dataset; direct identifiers are removed, dates are rebased or replaced by integers, geographic information is removed or generalized, and narrative text fields are removed."
  - "Identifiable information under HIPAA and the Common Rule, as well as data considered sensitive, have been removed from the dataset."
  - "K-anonymization at k greater than or equal to 2 is not achieved."
  - "NIH STRIDES partner agreements govern cloud hosting for HIPAA protection and participant safety."
  confidentiality_level: restricted
  governance_committee_contact: Bridge2AI-Voice Data Access Compliance Office (DACO@b2ai-voice.org)

maintainers:
- id: d4d:voice_maintainer_consortium
  name: Bridge2AI-Voice Consortium
  role: academic_institution
  maintainer_details:
