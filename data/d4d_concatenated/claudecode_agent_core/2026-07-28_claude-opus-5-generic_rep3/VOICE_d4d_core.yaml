purposes:
- id: d4d:voice_purpose_database
  name: Build an ethically sourced voice database linked to health biomarkers
  description: Primary objective of the Bridge2AI-Voice data generation project.
  response: >-
    To build a large multi-institutional database of human voices, speech and respiratory
    sounds that is ethically sourced, diverse, and linked to multimodal health biomarkers to
    fuel voice AI research. The consortium aims to integrate the use of voice as a biomarker
    of health in clinical care by generating a substantial multi-institutional, ethically
    sourced and diverse voice database linked to multimodal health biomarkers, and to build
    predictive models to assist in screening, diagnosis, and treatment of a broad range of
    diseases.
- id: d4d:voice_purpose_gap
  name: Address the absence of large, well-documented clinical voice data
  description: Purpose statement given in the dataset healthsheet.
  response: >-
    The Bridge2AI Voice dataset was created to address a gap in the availability of
    large-scale, diverse, and well-documented voice data for use in clinical machine-learning
    applications. Previous studies on machine learning-based voice diagnosis produced
    promising results, but their sample sizes were too small, or they lacked the key metadata
    needed for training robust, clinically useful models. The goal is to facilitate the use of
    voice as a non-invasive, cost-effective biomarker for the screening, diagnosis, and
    monitoring of a wide range of health conditions.
- id: d4d:voice_purpose_standards
  name: Establish standards and infrastructure for audiomics
  description: Secondary objectives spanning standards, tooling, ethics, teaming and training.
  response: >-
    To introduce the field of acoustic biomarkers by developing new standards of acoustic and
    voice data collection and analysis for voice AI research; to develop software and cloud
    infrastructure for automated voice data collection through a smartphone application; to
    implement federated learning technology allowing analysis of multi-institutional data while
    minimizing data sharing; to develop guidelines for consenting to voice data collection,
    sharing and utilization; to build bridges between medical voice research, acoustic
    engineering and the AI/ML world; and to develop curricula and a community of voice AI
    researchers, especially from underserved communities.

tasks:
- id: d4d:voice_task_disease_classification
  name: Disease detection and classification from voice
  description: Predefined tasks and labels shipped with the current dataset version.
  response: >-
    The tasks are primarily designed for training machine-learning models for disease
    detection and classification using voice data. Labels include diagnostic categories such
    as vocal pathologies, neurological disorders, psychiatric conditions, and respiratory
    disorders. There are no predefined recommended data splits for training, validation, or
    testing; researchers are encouraged to create their own data splits based on their
    specific requirements.
- id: d4d:voice_task_model_lifecycle
  name: Model pretraining, fine-tuning, benchmarking and validation
  description: Applications the dataset is meant to address.
  response: >-
    The dataset is primarily intended for research applications, specifically the development
    of AI and machine-learning models for healthcare, supporting clinical research in disease
    screening, diagnosis, and monitoring through voice biomarkers. It can be used for AI model
    pretraining, fine-tuning, benchmarking, or validation.

addressing_gaps:
- id: d4d:voice_gap_sample_size
  name: Small, non-comparable voice datasets
  description: Gap in the existing literature that motivated the dataset.
  response: >-
    Current literature has been studied only on small- to medium-sized data sets with limited
    data outside of acoustic measures and not linked to multi-modal health data. Comparing
    studies and pooling data is challenging due to a lack of existing standards in how voice
    and other acoustics are measured and collected. When machine-learning applications for
    screening and diagnosis of laryngeal cancer were reviewed, most studies reported training
    datasets of fewer than 300 patients and only two studies used more than one data modality.
- id: d4d:voice_gap_private_data
  name: Private industry datasets and lack of auditable clinical labels
  description: Gap addressed by publishing an open, clinically validated resource.
  response: >-
    Within industry, datasets are often private, limiting the ability to audit ML models and
    the accuracy of training data labels. Although industry has access to vast amounts of voice
    data from users, it lacks access to accurate clinical data or demographic information,
    which prevents annotation for AI training, comparison of algorithmic outputs with criterion
    standard medical assessment, and external auditing of training datasets for fair
    representation of diverse populations.
- id: d4d:voice_gap_standards
  name: Absence of audiomics standards
  description: Standards gap the consortium set out to close.
  response: >-
    For audiomics to reach its full public health potential, standards for audiomics data
    acquisition, interoperability, and AI readiness must be defined; diverse teams including
    clinicians, engineers, bioethicists and social scientists must collaborate; and the ethical
    and legal challenges linked to HIPAA, potential reidentification of patients by their
    voice, voice hacking, and data ownership call for a new governance framework.

