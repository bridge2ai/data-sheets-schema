  - "For any questions, suggestions, or feedback related to the dataset, users are directed to email the address given on the project documentation site."
  - "For questions regarding the dataset itself, PhysioNet directs users to contact the corresponding author listed on the project sidebar."
- id: d4d:voice_maintainer_physionet
  name: MIT Laboratory for Computational Physiology (PhysioNet)
  role: academic_institution
  maintainer_details:
  - "PhysioNet is maintained by the MIT Laboratory for Computational Physiology and supported by the National Institute of Biomedical Imaging and Bioengineering, the National Heart Lung and Blood Institute, and the NIH Office of the Director under NIH grant numbers U24EB037545 and R01EB030362."
  - "PhysioNet hosts the current adult and pediatric releases and enforces the credentialed access and data use agreement requirements."
- id: d4d:voice_maintainer_hdn
  name: Health Data Nexus, Temerty Centre for Artificial Intelligence Research and Education in Medicine (T-CAIREM)
  role: academic_institution
  maintainer_details:
  - "The dataset is hosted by the Health Data Nexus, a data publishing platform maintained by the Temerty Center for Artificial Intelligence Research and Education in Medicine based at the University of Toronto."
  - "The Health Data Nexus maintains the technical infrastructure hosting the dataset and provides continued access to interested researchers."
  - "The platform team may be contacted through the address published with the dataset."
- id: d4d:voice_maintainer_nih
  name: National Institutes of Health
  role: government_agency
  maintainer_details:
  - "The dataset is supported by the NIH via the Bridge2AI project."

errata:
- id: d4d:voice_erratum
  name: Errata and changelog
  erratum_details:
  - "There is no erratum. A changelog for each dataset version is published online with the dataset metadata."
  - "Release v2.0.1 consisted of corrections in the authorship list."
  - "Release v3.1.0 fixed broken parquet files from the previous release."

updates:
  id: d4d:voice_updates
  name: Update plan
  frequency: Semi-annual (twice a year)
  update_details:
  - "Further versions of the dataset will be released on a semi-annual basis; these updates will be distributed as new versions of the dataset on the hosting platform."
  - "Users will be notified through news items on the platform as well as through standard communication channels."
  - "The dataset is released as static versions rather than being dynamically updated."
  - "Further releases will contain additional data, including data collection in Spanish and expanded cohort coverage."

retention_limit:
  id: d4d:voice_retention
  name: Retention limits
  retention_period: >-
    Once data is contributed, the data will be retained as long as it is useful for research
    purposes, possibly indefinitely.
  retention_details:
  - "Identifiable data and datasheets linking participant numbers to participant information are kept at each institution on local cloud storage for a maximum of ten years after study completion and are then destroyed, under the responsibility of each local principal investigator."
  - "The USF IRB requires de-identified study data and original consent forms to be stored for a minimum of five years after the completion of the study."
  - "All entries to the REDCap recruitment screening system are deleted once patients are enrolled, or within 90 days of their submission, whichever comes first."
  - "Recipients under a Data Transfer and Use Agreement must destroy the data two years after the start date, upon completion of the project, upon termination, or upon expiration of the applicable ethics approval, whichever occurs first, retaining at most one archival copy as required by law or for research integrity and verification."

