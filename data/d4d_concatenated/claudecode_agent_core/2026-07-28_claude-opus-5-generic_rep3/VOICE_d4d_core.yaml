- id: d4d:voice_anomaly_site_variation
  name: Site and protocol variation
  anomaly_details:
  - "Different sites have different collection configurations."
  - "The collection protocol changed over the course of the study."
  - "Noise artifacts, variations in diagnostic practices, inaccurate questionnaire responses and underreporting are identified as confounding factors."
  - "The data were recorded with a head-mounted headset with a microphone that could be at slightly different distances."
  - "Distinct iPad devices were used at each site."
- id: d4d:voice_anomaly_machine_generated
  name: Unaudited machine-generated content
  anomaly_details:
  - "Certain aspects of the data (e.g., transcription) were generated using off-the-shelf models that have not been audited for correctness."
  - "Some files, whether due to length or other issues, could not generate certain features and so are not included in the bundled data."
  - "Release v3.1.0 fixed broken parquet files carried over from the previous release."

known_biases:
- id: d4d:voice_bias_selection
  name: Geographic and recruitment selection bias
  bias_type: selection_bias
  bias_description: >-
    The data are a sample of a larger, ongoing collection and are not representative because
    they were collected at a limited number of geographic locations (five recording sites).
    Groups that have less trust in the medical system or AI, or that are less proximal to the
    collection sites, would have been less likely to be recruited.
  mitigation_strategy: >-
    The consortium states that it hopes to make the dataset more representative by shifting to
    remote collection and designing the recruiting approach in a way that controls for more
    variables. Recruitment plans include community outreach clinics serving underserved and
    under-represented populations and a Plan for Enhancing Diverse Perspectives.
- id: d4d:voice_bias_representation
  name: Unequal representation of disease categories
  bias_type: representation_bias
  bias_description: >-
    The public data releases do not contain an equal distribution of the five disease cohort
    categories. The dataset has skews based on disorder category, site, and other demographic
    factors.
  mitigation_strategy: >-
    Users should consider the multivariate distribution when assessing utility for different
    questions. Further releases will contain additional data.
  affected_subsets:
  - Disease cohort categories
  - Recording sites
  - Demographic subgroups
- id: d4d:voice_bias_measurement
  name: Device and diagnostic measurement bias
  bias_type: measurement_bias
  bias_description: >-
    Participants were screened for different disorders based on site, so they also had their
    data collected with different devices. Recordings were made with a head-mounted headset
    whose microphone distance could vary. The clinical diagnosis, depending on the disorder,
    was performed by one clinician or based on an EHR record or prescription.
- id: d4d:voice_bias_annotation
  name: Single-labeler annotation bias
  bias_type: annotation_bias
  bias_description: >-
    A single labeler provided the label for each instance - typically the clinician at the site
    of data collection, or a clinician external to it for a prior diagnostic assessment - so no
    inter-annotator comparison is possible.

known_limitations:
- id: d4d:voice_limitation_language
  name: English-only data collection
  limitation_type: coverage_limitation
  limitation_description: >-
    English was used for communication with study participants and the only language option in
    the released protocol was English; participants who do not read or speak English were
    excluded. Spanish versions of the protocol are under development and Spanish data
    collection is planned for future releases.
  scope_impact: >-
    Models trained on the dataset may not generalize to speakers of other languages, and the
    demographic composition is shifted toward English speakers.
- id: d4d:voice_limitation_representativeness
  name: Non-representative sample
  limitation_type: representativeness_limitation
  limitation_description: >-
    The dataset is a sample of a larger, ongoing collection and is explicitly stated not to be
    representative, because it was collected at a limited number of geographic locations. The
    sampling method is a non-probability sample.
  recommended_mitigation: >-
    Consider the multivariate distribution of disorder category, site and demographic factors
    when assessing fitness for a given question.
- id: d4d:voice_limitation_no_raw_audio
  name: Raw audio withheld from the public release
  limitation_type: scope_limitation
  limitation_description: >-
    The published PhysioNet releases contain derived features from the audio waveforms and not
    the original recordings. All raw voice data was removed because it has the potential to
    cause individual re-identification or to be used for illicit or unauthorized purposes.
    Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive records and
    audio checks have been removed, and features were excluded where the audio contained free
    speech.
  scope_impact: >-
    Analyses requiring the original waveform, or features of free-speech audio, cannot be
    performed from the registered-access release alone.
  recommended_mitigation: >-
    Raw audio is available through a separate controlled-access process administered by the
    Data Access Compliance Office and distributed via Synapse.
- id: d4d:voice_limitation_no_splits
  name: No predefined data splits
  limitation_type: methodological_limitation
  limitation_description: >-
    The current version comes with predefined tasks and labeling but no recommended splits for
    training, development/validation or testing.
  recommended_mitigation: Researchers are encouraged to create their own data splits based on their specific requirements.
- id: d4d:voice_limitation_temporal
  name: Protocol drift and distribution shift over time
  limitation_type: temporal_limitation
  limitation_description: >-
    The collection protocol changed over the course of the study, and changes in diagnostic
    criteria or practices could be a source of distribution shift. Releases are static
    versions rather than a dynamically updated resource.
- id: d4d:voice_limitation_external_data
  name: Multimodal and external data not released
  limitation_type: integration_limitation
  limitation_description: >-
    Imaging, genomic, laryngoscopy and other EHR data are extracted at sites independently and
    uploaded through the REDCap database, but no external data was released in the v3.0.0
    release. Genomic collection was performed only at the University of Toronto and Mount Sinai
    Hospital under a separate research ethics board application.

