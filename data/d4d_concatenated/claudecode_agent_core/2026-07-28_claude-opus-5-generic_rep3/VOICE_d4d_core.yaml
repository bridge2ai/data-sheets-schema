- id: d4d:voice_collector_qc
  name: Acoustic and data science quality control staff
  role: Acoustic quality and machine-learning readiness review
  collector_details:
  - "The team hired two acoustic engineers and three AI data scientists to analyze all samples from the year 1 exploratory data collection phase to ensure acoustic quality and ML readiness."
  - "In each subsequent year of the study, 10% of the data is selected at random every month for quality control and ML readiness."

collection_timeframes:
- id: d4d:voice_timeframe_dataset
  name: Dataset collection timeframe
  timeframe_details:
  - "The data was collected over a period of 12 months."
  - "The IRB protocol describes a prospective cohort study over four years; it states both that the study involves 11 different academic sites across the US and that data will be collected at USF and 11 other participating institutions. Acquisition is phased: phase 1 exploratory (data collection for up to 180 participants, completed November 2023), phase 2 pilot (cumulatively up to 600 participants, begun November 2023 and ongoing in November 2024), phase 3 expansion (cumulatively up to 3,000 participants) and phase 4 outreach (cumulatively 5,000 participants)."
  - "The NIH RePORTER record gives a project start of 2022-09-01 and a project end of 2026-11-30."
  - "Anticipated enrollment by 2027 is 10,000 participants."
- id: d4d:voice_timeframe_feasibility
  name: Application feasibility study timeframe
  start_date: "2023-06-05"
  end_date: "2023-07-28"
  timeframe_details:
  - "The Bridge2AI-Voice application feasibility study was conducted at the University of South Florida Health Voice Center in Tampa, Florida between June 5, 2023 and July 28, 2023, enrolling 47 participants over a two-month period. Audio data was not collected at that stage of app development, so this study is separate from the dataset's own collection."

missing_data_documentation:
- id: d4d:voice_missing_data
  name: Missing data documentation
  missing_data_patterns:
  - "Some questions are optional, so information may be missing from individual instances."
  - "Each individual answered a common set of questions and then responded to additional questions relevant to their primary diagnostic category."
  - "Phenotype data files only contain rows for a participant if at least one column is not missing."
  - "Some audio files, whether due to length or other issues, could not generate certain features and are therefore absent from the bundled feature data."
  missing_data_causes:
  - "Optional questions."
  - "Data collection irregularities."
  - "Cohort-specific questionnaire routing."
  - "Removal of sensitive records, audio checks and free-speech-derived features during de-identification."
  handling_strategy: >-
    The dataset has been audited internally for missingness and consistency by the data release
    team, and a missingness table is included with the dataset. The audit protocol generates
    missingness tables, checks distributions and outliers, checks categorical responses against
    schema, and runs quality control metrics for audio tasks.

raw_data_sources:
- id: d4d:voice_raw_source_audio
  name: Raw audio waveforms
  source_description: >-
    Raw voice, speech, breathing and cough recordings captured by the Bridge2AI-Voice
    application on tablet devices, retained after de-identification but not distributed in the
    registered-access release.
  source_type:
  - Primary audio recording
  access_details: >-
    The raw data post de-identification is saved and is not accessible publicly. Users
    interested in accessing audio data from any Bridge2AI-Voice dataset request access from the
    Data Access Compliance Office; raw audio for the adult cohort is made available via Synapse
    at https://www.synapse.org/Synapse:syn72370534/ and for the pediatric cohort at
    https://www.synapse.org/Synapse:syn73617068.
  raw_data_format:
  - WAV audio
- id: d4d:voice_raw_source_redcap
  name: REDCap and ReproSchema questionnaire exports
  source_description: >-
    Demographic, confounder, diagnosis, enrollment and validated questionnaire responses
    captured through the Bridge2AI-Voice application and stored in REDCap, and, for pediatric
    participants, through ReproSchema-UI.
  source_type:
  - Questionnaire and case report form data
  access_details: >-
    The raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported
    from REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0.
    Pediatric data collected through ReproSchema-UI is extracted and transformed into REDCap
    format and subsequently converted to BIDS.
  raw_data_format:
  - REDCap export
  - ReproSchema
- id: d4d:voice_raw_source_ehr
  name: Electronic health record and imaging extracts
  source_description: >-
    Clinical data related to diagnosis, including disease type, severity, symptoms, management
    and validated questionnaire scores, together with previously completed imaging, extracted
    from participants' medical records for gold standard validation.
  source_type:
  - Electronic health record
  - Medical imaging
  access_details: >-
    Imaging is collected retrospectively from patient charts only; no additional imaging is
    performed for the study. No external data was released in the v3.0.0 release.
  raw_data_format:
  - DICOM imaging (chest X-ray, brain CT, brain MRI)
  - EHR extract

