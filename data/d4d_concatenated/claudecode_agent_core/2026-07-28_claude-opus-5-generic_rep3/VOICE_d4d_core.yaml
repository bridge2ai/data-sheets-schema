acquisition_methods:
- id: d4d:voice_acquisition
  name: Instance acquisition
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - "The data was directly observable and reported by subjects."
  - "Clinical diagnoses were verified by clinicians reviewing audio and/or imaging data, looking at electronic health records, or medication prescriptions."
  - "Clinical validation is performed by a qualified physician or practitioner based on established gold standards for diagnosis, including laryngoscopy images and stroboscopy videos for voice disorders, spirometry and flow-volume loops and CT for respiratory disorders, brain CT/MRI and whole genome sequencing for neurological disorders, and electronic health summary, psychiatrist diagnosis and medication history for mood and psychiatric disorders."
  - "The released features are derived from the raw audio rather than observed directly, and transcriptions were generated by an automatic speech recognition model."

collection_mechanisms:
- id: d4d:voice_collection_mechanism_app
  name: Bridge2AI-Voice application
  mechanism_details:
  - "The data were collected using an iPad app - the Bridge2AI-Voice App - hosting the data acquisition protocols for acoustic tasks, surveys, questionnaires and validated patient-reported outcomes."
  - "Data are collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an Avid AE-36 microphone and an Apple dongle to connect it to the iPad."
  - "Remote and in-clinic collection occur through two platforms, the Bridge2AI Voice Web app and the Bridge2AI Voice iOS app. No software is downloaded or installed for the web app, it stores data only during the collection phase, requires no login, and sends data over a secure HTTPS protocol to a HIPAA-compliant storage server."
  - "For pediatric participants all data is collected using reproschema-ui with the Bridge2AI-Voice pediatric protocol."
  - "A total of 22 acoustic tasks are recorded through the app for adults; the documented task table enumerates respiration, cough, breath sounds, prolonged vowel, maximum phonation time, glides, loudness, diadochokinesis, Rainbow Passage, Caterpillar Passage, CAPE-V sentences, free speech, picture description, story recall, animal fluency, open response questions, word-color Stroop, productive vocabulary, random item generation and Cinderella story, plus a separate pediatric task set."
  - "Clinical and questionnaire data are entered into a REDCap database as part of the Case Report Form; the supporting REDCap data dictionary, metadata and instrument PDFs are published at https://github.com/eipm/bridge2ai-redcap."
  - "A separate Bridge2AI Enrollment Web app, launched in a browser and HIPAA-compliant, is used for remote screening and enrollment."

sampling_strategies:
- id: d4d:voice_sampling
  name: Cohort sampling strategy
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - "Patients presenting at specialty clinics and institutions in North America, screened from clinic lists before their visit."
  - "Control participants without the conditions of interest."
  why_not_representative:
  - "The data is not representative because it was collected at a limited number of geographic locations."
  strategies:
  - "Sampling method: non-probability sample."
  - "Patients were selected based on membership to five predetermined groups (respiratory disorders, voice disorders, neurological disorders, mood disorders, pediatric) and screened for inclusion and exclusion criteria prior to their visit by the project investigators."
  - "Participants are recruited across different academic institutions from high volume expert clinics - outpatient clinics within hospital systems or academic institutions with expertise in a specific disease area, seeing more than 50 patients per month from the same disease category - based on diagnosis and documented inclusion/exclusion criteria."
  - "Pediatric participants are recruited strictly from the Hospital for Sick Children and are grouped by age."
  - "Recruitment also occurs through clinic appointments, flyers, QR-code linked REDCap screening surveys, social media platforms, the FlowTrials platform and participating institutions' websites."
  - "If specific diagnoses or severities are under-represented, participants are identified by medical record review based on voice-disorder related diagnostic codes."
  description: >-
    The consortium planned complete multimodal data acquisition for up to 5,000 participants per
    disease category and controls, with no sample size calculation applicable because the aim is
    to generate data rather than test a hypothesis. The sources give different overall enrollment
    targets and both are recorded rather than reconciled: the IRB protocol states a sample size
    of 30,000 participants, of which 5,000 are to be enrolled at USF with the remainder reached
    by collaboration with other participating institutions and existing cohorts, and the
    audiomics white paper likewise describes a primary deliverable of a publicly available
    database of 30,000 human voices; the project documentation instead describes a flagship
    dataset of 10,000 voices and an anticipated enrollment count by 2027 of 10,000.

