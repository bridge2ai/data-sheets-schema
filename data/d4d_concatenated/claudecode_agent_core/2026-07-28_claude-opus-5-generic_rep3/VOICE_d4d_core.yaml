  - "Recipients further agree to adhere to the specific requirements of PhysioNet.org, managed by the MIT Laboratory for Computational Physiology."
  - "Supporting materials carry their own licenses: the REDCap data dictionary and metadata are MIT licensed, the b2aiprep preprocessing library is Apache-2.0 licensed, and the documentation site source is MIT licensed."
