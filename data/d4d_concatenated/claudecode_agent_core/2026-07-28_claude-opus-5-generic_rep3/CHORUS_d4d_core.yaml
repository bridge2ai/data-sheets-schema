purposes:
- name: Generate an AI-ready critical care dataset
  response: The CHoRUS data generation project was created to meet the need of generating
    data for ML/AI applications aimed at characterizing acute and critical care illness, predicting
    complications, and measuring treatment response among patients with acute or critical
    illness. Its overarching goal is to develop a publicly available, AI-ready critical care
    dataset while ensuring the methods promote privacy, accountability, and clinical benefit.
- name: Answer the grand challenge of improving recovery from acute illness
  response: The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving recovery
    from acute illness.
- name: Provision a holdout test set for external validation
  response: The dataset also provisions a holdout test set, accessible for model external
    validation to aid marketplace adoption of AI-developed models for implementation in acute
    and critical care.
- name: Create ethically sourced datasets and best practices for AI in health
  response: The CHoRUS project is one data generation project of four in the National Institutes
    of Health (NIH) funded Bridge2AI consortium. The goal is to work with projects to create
    ethically sourced datasets and tools around artificial intelligence and to create best
    practices for AI in health.
- name: Build infrastructure for AI/ML in critical care
  response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning (AI/ML) in critical care; developing high-resolution multi-center
    data sets is a critical first step towards actionable and trustworthy AI.
- name: Support training and workforce development
  response: The dataset supports the AIM-AHEAD Bridge2AI for Clinical Care Training Program,
    which expands access to Bridge2AI CHoRUS data through engagement, AI training, and mentorship,
    equipping trainees to apply AI/ML methods to big data analysis using multi-modal datasets
    from a broad range of cohort participants.
tasks:
- name: Characterize acute and critical care illness
  response: ML/AI applications aimed at characterizing acute and critical care illness among
    patients with acute or critical illness.
- name: Predict complications
  response: ML/AI applications aimed at predicting complications among patients with acute
    or critical illness.
- name: Measure treatment response
  response: ML/AI applications aimed at measuring treatment response among patients with acute
    or critical illness.
- name: External validation of AI models
  response: A sequestered holdout test set supports external validation of AI-developed models
    to aid marketplace adoption for implementation in acute and critical care.
- name: Label data with prediction targets
  response: A visualization and annotation environment will label data with targets important
    for prediction.
addressing_gaps:
- name: Lack of infrastructure for AI/ML in critical care
  response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning in critical care. Developing high-resolution multi-center data sets
    is a critical first step towards actionable and trustworthy AI.
- name: Absence of diverse, high-resolution, ethically sourced critical care data
  response: The CHoRUS Network aims to develop the most diverse, high-resolution, ethically
    sourced, AI-ready data set for acute illness recovery, spanning 20 academic centers of
    which 14 contribute as Data Acquisition centers.
- name: Fragmented multi-modal clinical data standards
  response: Unified standards are needed to harmonize multi-modal EHR, waveform, imaging,
    and text data across a multi-center network, and to provide validated semantic mappings
    connecting clinical data in various source formats to international standards.
- name: Legal and ethical barriers to collecting clinical data at scale
  response: The project establishes a legal framework for collecting data at scale and performs
    community-facing ethics focus groups to determine what data is appropriate for public
    sharing, analyzing the existing legal and regulatory landscape.
- name: Missing contextual and social determinant factors
  response: The project ensures that data elements feature appropriate contextual factors
    such as geographic distance to the nearest hospital, and accounts for Social Determinants
    of Health.
- name: Insufficient AI expertise in the clinical workforce
  response: A comprehensive set of approaches develops the skills and workforce for a next
    generation of diverse academic and community AI scientists, and cultivates expertise in
    the lay and scientific community to improve AI literacy and utilization through multimodal
    educational approaches.
