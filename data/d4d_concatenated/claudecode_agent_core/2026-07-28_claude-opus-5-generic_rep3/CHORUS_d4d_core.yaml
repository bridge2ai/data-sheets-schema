subpopulations:
- name: Critical care unit populations
  subpopulation_elements_present: true
  identification:
  - The current released dataset is described as patient admissions from ICU, PICU, and NICU,
    which distinguishes adult, pediatric, and neonatal intensive care populations.
  distribution:
  - 50,000 patient admissions from ICU, PICU, and NICU are reported in the "Current Released
    Dataset" snapshot; per-unit counts are not reported in the source documents.
sensitive_elements:
- name: Sensitive clinical and contextual content
  sensitive_elements_present: true
  sensitivity_details:
  - Structured electronic health record data including demographics, diagnoses, procedures,
    medication administration, and nursing flowsheets.
  - Unstructured clinical notes, which are extracted and tokenized using the OHNLP toolkit.
  - Imaging drawn from hospital PACS systems.
  - Waveform telemetry from bedside monitors and gateway/middleware, and EEG waveforms from
    hospital databases.
  - Social determinants of health and contextual factors such as geographic distance to the
    nearest hospital.
confidential_elements:
- name: Controlled-access clinical content
  confidential_elements_present: true
  confidentiality_details:
  - Every data type listed in the CHoRUS dataset table is marked as under controlled access.
  - OMOP and telemetry data reside in the cloud enclave; clinical notes are stored locally
    at contributing sites except for tokens, which are the form present in the enclave.
  - Data are transformed using approaches that limit re-identification, and the project performs
    community-facing ethics focus groups to determine what data is appropriate for public
    sharing.
known_biases:
- name: Cohort balance, diversity, and social determinants
  bias_description: 'The project explicitly frames privacy and bias as issues to be managed:
    patient-focused efforts determine the ethical and legal approaches to manage privacy and
    bias while accounting for Social Determinants of Health. The source documents describe
    this as an active area of work and do not report measured bias in the released data.'
  mitigation_strategy: Sampling to ensure comprehensive sets of patient conditions and clinical
    treatment strategies; federated access enabling sampling methods to ensure a balanced
    and diverse cohort; inclusion of contextual factors such as geographic distance to the
    nearest hospital; acquisition across 14 data-contributing hospitals within a 20-centre
    collaboration.
known_limitations:
- name: Modality coverage still in progress
  limitation_type: coverage_limitation
  limitation_description: As of August 2025, imaging was limited to approximately 1000 images
    with de-identification in process for a larger cohort, EEG extraction was in process,
    and clinical notes were stored locally except for tokens.
  scope_impact: Analyses depending on imaging, EEG, or full clinical note text are constrained
    relative to the structured OMOP and telemetry content.
- name: Retrospective collection
  limitation_type: temporal_limitation
  limitation_description: The CHoRUS dataset is described as retrospective data collection,
    so it reflects care as documented in contributing hospital systems rather than prospectively
    instrumented measurement.
- name: Released dataset smaller than the anticipated final dataset
  limitation_type: scope_limitation
  limitation_description: The anticipated final dataset is described as 100,000 patient admissions
    across 9 modalities from 14 hospitals, while the current released dataset is described
    as 50,000 patient admissions. The released content is therefore a subset of the planned
    resource.
- name: Metadata publication incomplete across modalities
  limitation_type: methodological_limitation
  limitation_description: In the dataset table, metadata availability is recorded as "Yes"
    for some data types and "Planned" for others, while published metadata schemas are listed
    for all data types (OMOP schema, OMOP schema with extensions, OHNLP open source schema,
    DICOM schema, PhysioNet schema extended, and open source EDF+ and Persyst schema). The
    extracted table column alignment does not permit a reliable per-modality assignment of
    the metadata column.
- name: Repository under administrative review
  limitation_type: scope_limitation
  limitation_description: The project website displays the notice "This repoitory is under
    review for potential modification in compliance with Administration directives" (spelling
    as published), indicating that the availability or content of the published resource may
    change.
acquisition_methods:
- name: Acquisition from hospital clinical systems
  was_directly_observed: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - 'Structured EHR content is acquired as documented in hospital systems: procedures and
    diagnoses as documentation by providers, nursing flowsheets as high-frequency documentation,
    and medication administration with dosing time-stamped upon each infusion change or dose
    administration.'
  - Imaging is acquired from hospital PACS systems.
  - Waveform telemetry is acquired from bedside monitors and gateway/middleware; EEG waveforms
    are acquired from the hospital database.
  - Clinical notes are extracted and tokenized using the OHNLP toolkit, which produces derived
    token representations rather than raw text in the enclave.
  - Validated semantic mappings and an associated clinical validation SOP support verification
    of mapped content, and characterization reports are returned to sites following their
    data submissions.
collection_mechanisms:
- name: Multi-center acquisition and standardization workflow
  mechanism_details:
  - The project develops capabilities across a multi-center network to acquire, standardize,
    tokenize, store, visualize, and label data such as structured electronic health record
    data, tokenized unstructured electronic health record data, telemetry and EEG waveforms,
    imaging, and social determinants of health.
  - Data are acquired, standardized to the OMOP Common Data Model, and transformed using approaches
    that limit re-identification.
  - Data managers at contributing sites follow the Chorus_SOP interactive workflow diagram,
    which describes the step-by-step process for extracting and contributing clinical data
    to CHoRUS and links to SOP documents that have undergone internal validation and review.
  - Contributing sites create and upload a CHoRUS Data Extract using project tooling, and
    provide regular status updates either through the GitHub interface or by submitting a
    Google Form, whose submissions trigger a GoogleScript that calls the GitHub API to update
    status and issue information.
  - CHoRUS services are supported by dockerized container applications deployed on Azure.
  used_software:
  - id: https://github.com/chorus-ai/Chorus_SOP
    name: Chorus_SOP
    description: ChoRUS centralized SOP documentation site.
    license: Apache-2.0
  - id: https://github.com/chorus-ai/data_acq_SOP
    name: data_acq_SOP
    description: An online documentation SOP for the Data Acquisition Module.
  - id: https://github.com/chorus-ai/chorus-extract-upload
    name: chorus-extract-upload
    description: Repository with tools to create and upload a CHoRUS Data Extract.
    license: MIT
  - id: https://github.com/chorus-ai/chorus-container-apps
    name: chorus-container-apps
    description: Set of dockerized container applications and associated configurations to
      be deployed to support CHoRUS services on Azure.
sampling_strategies:
- name: Sampling for comprehensive and balanced cohorts
  is_sample: true
  source_data:
  - Clinical data held in the electronic health record, PACS, telemetry, and EEG systems of
    14 data-contributing hospitals within a 20-centre academic collaboration.
  strategies:
  - Establish a legal framework for collecting data at scale, sampling to ensure comprehensive
    sets of patient conditions and clinical treatment strategies.
  - Federated access enables sampling methods to ensure a balanced and diverse cohort.
data_collectors:
- name: Data acquisition centers
  role: data-contributing hospital site
  collector_details:
  - The collaboration spans 20 academic centers, of which 14 contribute as Data Acquisition
    centers; the project website reports 14 data contributing hospitals.
  - Data site managers at contributing sites are responsible for extracting and submitting
    their site's clinical data extract, following the Chorus_SOP workflow.
- name: CHoRUS consortium teams
  role: consortium sub-team
  collector_details:
  - Sub-teams within the CHoRUS data generation project include Standards, Data Acquisition,
    and Tooling, which compile recordings and documentation and maintain context-specific
    discussion locations.
  - Clinical collaborators contribute clinical expertise to semantic mapping and validation.
collection_timeframes:
- name: Retrospective collection during the award period
  timeframe_details:
  - The CHoRUS dataset is described as retrospective data collection.
  - As of August 2025, the dataset covered 14 different hospitals with over 45K unique admissions.
  - The NIH-funded data generation project runs from 2022-09-01 to 2026-11-30; the source
    documents do not state the calendar span of the clinical encounters included in the dataset.
missing_data_documentation:
- name: Modality availability gaps
  missing_data_patterns:
  - Clinical notes are not held centrally in full text; they are stored locally at sites,
    and only tokens are present in the enclave.
  - Imaging availability was limited to approximately 1000 images as of August 2025.
  - EEG waveform extraction was in process as of August 2025.
  - Metadata is recorded as "Planned" rather than available for part of the modality table.
  missing_data_causes:
  - De-identification of imaging for a larger cohort was in process at the time of the August
    2025 status report.
  - Clinical note text is retained locally to limit exposure of identifiable narrative content,
    with tokenization used for enclave content.
  handling_strategy: Ongoing extraction, de-identification, and standardization work expands
    modality coverage toward the anticipated final dataset; the published snapshots distinguish
    the current released dataset from the anticipated final dataset.
