id: https://chorus4ai.org/
name: CHoRUS
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable
  AI
description: 'The CHoRUS dataset is the multi-modal, high-resolution critical care dataset
  generated by the Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI project, one of four data generation projects in the NIH-funded Bridge2AI
  consortium. It assembles retrospectively collected clinical data from critically ill patients
  contributed by hospital sites and harmonized to community standards: OMOP for structured
  electronic health record data, the OHNLP toolkit for extracted and tokenized clinical notes,
  DICOM for imaging drawn from PACS, WFDB for waveform telemetry from bedside monitors and
  gateway/middleware, and EDF+ with Persyst for EEG waveforms from hospital databases. The
  project website describes an anticipated final dataset of 100,000 patient admissions covering
  9 data modalities from 14 data-contributing hospitals, and a current released dataset of
  50,000 patient admissions from ICU, PICU and NICU comprising 1.6 billion rows of EHR OMOP
  data, 7,642 admissions with radiology data, and 23 Tb of waveform data. Every listed modality
  is under controlled access. The dataset is intended to support machine learning and artificial
  intelligence applications that characterize acute and critical care illness, predict complications,
  and measure treatment response among patients with acute or critical illness, and the project
  also provisions a holdout test set accessible for external validation of models.'
page: https://chorus4ai.org/
conforms_to: OHDSI/OMOP Common Data Model (demographics, medication administration, procedures,
  nursing flowsheets, diagnoses); OHNLP open source schema (tokenized clinical notes); DICOM
  (imaging); PhysioNet WFDB schema, extended (waveform telemetry); EDF+ and Persyst (EEG waveforms)
