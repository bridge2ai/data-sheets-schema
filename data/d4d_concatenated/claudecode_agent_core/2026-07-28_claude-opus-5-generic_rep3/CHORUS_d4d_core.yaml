raw_sources:
- name: Locally retained source data
  raw_data_details:
  - Clinical notes remain stored locally at contributing sites, with only tokens available
    in the enclave, so the underlying raw note text is not distributed with the dataset.
  - Raw imaging, telemetry, and EEG originate in hospital PACS, monitoring, and EEG systems
    and are transformed before inclusion.
preprocessing_strategies:
- name: Standardization to the OMOP Common Data Model
  preprocessing_details:
  - The project acquires data, standardizes data to the OMOP Common Data Model, and transforms
    data using approaches that limit re-identification.
  - Unified standards harmonize multi-modal EHR, waveform, imaging, and text data, supported
    by validated semantic mappings that connect clinical data in various source formats to
    international standards.
- name: Clinical note extraction and tokenization
  preprocessing_details:
  - Clinical notes are extracted and tokenized using the OHNLP toolkit, and conform to the
    OHNLP open source schema.
  - The project describes tokenized unstructured electronic health record data as one of the
    data capabilities developed across the multi-center network.
  used_software:
  - id: https://chorus4ai.org/#software-ohnlp-toolkit
    name: OHNLP toolkit
    description: Toolkit used to extract and tokenize clinical notes for the CHoRUS dataset.
- name: Waveform conversion
  preprocessing_details:
  - Waveform documentation and various waveform conversion scripts are maintained by the project,
    alongside resources that support the preparation and release of waveforms.
  used_software:
  - id: https://github.com/chorus-ai/chorus_waveform
    name: chorus_waveform
    description: CHoRUS waveform documentation and various waveform conversion scripts.
    license: MIT
  - id: https://github.com/chorus-ai/chorus_waveform_resources
    name: chorus_waveform_resources
    description: Resources which support the preparation and release of waveforms.
- name: Geocoding of location entities
  preprocessing_details:
  - Open source code geocodes OMOP Location entities via DeGauss, supporting contextual factors
    such as geographic distance to the nearest hospital and social determinants of health.
  used_software:
  - id: https://github.com/chorus-ai/UF-Geocoding
    name: UF-Geocoding
    description: Open source code to geocode OMOP Location entities via DeGauss; forked from
      bihorac-LAB/Exposome.
    license: MIT
cleaning_strategies:
- name: Site characterization reporting and SOP validation
  cleaning_details:
  - Characterization reports are produced and returned to sites following their data submissions.
  - SOP documents linked from the Chorus_SOP workflow have undergone an internal validation
    and review process within the Chorus_SOP repository.
  - A clinical validation SOP accompanies the pooled tabular mappings in the chorus-mapping
    repository, so clinical expertise is applied to semantic mapping and validation.
  used_software:
  - id: https://github.com/chorus-ai/CHoRUSReports
    name: CHoRUSReports
    description: Repository dedicated to producing characterization reports to return to sites
      following their data submissions.
labeling_strategies:
- name: Visualization and annotation environment
  labeling_details:
  - A visualization and annotation environment will label data with targets important for
    prediction.
  - The project develops capabilities to acquire, standardize, tokenize, store, visualize,
    and label data across the multi-center network.
machine_annotation_tools:
- name: Automated clinical text processing
  tools:
  - OHNLP toolkit
  tool_descriptions:
  - The OHNLP toolkit is used to extract and tokenize clinical notes, which conform to the
    OHNLP open source schema. The source documents report no accuracy figures for this tooling.
ethical_reviews:
- name: Ethics pillar and community engagement
  review_details:
  - Ethics is one of the project's three pillars, framed as Ethical and Trustworthy AI alongside
    the Data and People pillars.
  - The project performs community-facing ethics focus groups to determine what data is appropriate
    for public sharing.
  - The CHoRUS consortium evaluates community perspectives on clinical care AI to find ways
    to increase trustworthiness of provenance and privacy in AI, and new approaches are created
    as the existing legal and regulatory landscape is analyzed.
  - Patient-focused efforts determine the ethical and legal approaches to manage privacy and
    bias while accounting for Social Determinants of Health.
data_protection_impacts:
- name: Re-identification and privacy risk management
  impact_details:
  - Data are transformed using approaches that limit re-identification as part of the standardization
    pipeline.
  - A privacy scan tool for medical records and a de-identification repository are maintained
    among the project's public repositories.
  - Imaging de-identification was in process for a larger cohort as of August 2025, and clinical
    note text is retained locally with only tokens placed in the enclave.
human_subject_research:
  involves_human_subjects: true
  special_populations:
  - Patients with acute or critical illness, described in the project as more than 100,000
    critically ill patients.
  - Pediatric and neonatal intensive care populations, since the current released dataset
    comprises admissions from ICU, PICU, and NICU.
  regulatory_compliance:
  - The project establishes a legal framework for collecting data at scale and analyzes the
    existing legal and regulatory landscape; the source documents do not name an IRB determination
    or approval number for the dataset.
  description: The dataset consists of clinical data describing critically ill patients retrospectively
    extracted from hospital systems at data-contributing sites.
at_risk_populations:
  at_risk_groups_included: true
  special_protections:
  - All listed data modalities are under controlled access.
  - Data are transformed using approaches that limit re-identification; clinical notes are
    tokenized and retained locally except for tokens; and imaging de-identification is performed
    before broader release.
  description: Critically ill adult, pediatric, and neonatal patients are represented, since
    the released dataset comprises ICU, PICU, and NICU admissions.
is_deidentified:
  name: De-identification approach
  method: Transformation of data using approaches that limit re-identification; tokenization
    of clinical notes with the OHNLP toolkit; de-identification of imaging prior to broader
    release.
  deidentification_details:
  - As of August 2025, imaging de-identification was in process for a larger cohort, with
    approximately 1000 images available.
  - Clinical notes are stored locally at contributing sites except for tokens, so identifiable
    narrative content is not distributed with the dataset.
  - The source documents do not enumerate which specific identifiers are removed.
existing_uses:
- name: Training activities and publications
  examples:
  - The datasets are being used for training activities and publications, as reported in the
    August 2025 CHoRUS dataset status.
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI
    CHoRUS data through engagement, AI training, and mentorship, with up to 30 trainees selected
    for cohort 2 (program start 2025-11-17, program end 2026-07-31).
  - Trainees receive hands-on training on the Bridge2AI AI/ML for Clinical Care Network and
    leverage the data and tools to create practical use cases, including workshops on the
    OHDSI/OMOP common data model and the OHDSI tool stack.
intended_uses:
- name: AI/ML development for acute and critical care
  examples:
  - Characterizing acute and critical care illness.
  - Predicting complications among patients with acute or critical illness.
  - Measuring treatment response among patients with acute or critical illness.
  - External validation of AI-developed models against the sequestered holdout test set.
  - Collaborative research on the Bridge2AI Clinical Care Cloud platform and development of
    practical clinical use cases by trainees.
  use_category:
  - machine learning and artificial intelligence model development
  - external model validation
  - education and workforce training
  usage_notes: Access is controlled. Training program participants complete a registration
    form with name, email, and institution, must sign a licensing agreement included in the
    registration form before gaining access, and need a ".edu" email address to gain access
    to the dataset; program administrators assist with this access if needed. Once access
    is granted and compute is provisioned, an email is sent.
other_tasks:
- name: Additional tasks described in the source documents
  task_details:
  - Labeling data with targets important for prediction using the project's visualization
    and annotation environment.
  - Semantic mapping and clinical validation of source-format clinical data against international
    standards.
  - Development of practical use cases suitable to apply in Bridge2AI Data Topics, and preparation
    of posters, conference abstracts, and manuscripts by trainees.
future_use_impacts:
- name: Anticipated impacts and availability caveats
  impact_details:
  - The holdout test set is intended to aid marketplace adoption of AI-developed models for
    implementation in acute and critical care.
  - The project intends to cultivate expertise in the lay and scientific community to improve
    AI literacy and utilization through multimodal educational approaches, and to develop
    the skills and workforce for a next generation of diverse academic and community AI scientists.
  - The project website carries a notice that the repository is under review for potential
    modification in compliance with Administration directives, which signals that the published
    resource may change.
distribution_formats:
- name: OMOP Common Data Model tables
  description: Demographics, medication administration, procedures, nursing flowsheets, and
    diagnoses are represented using the OMOP data standard, with published metadata schemas
    listed as the OMOP schema and, for at least one data type, the OMOP schema with extensions.
- name: OHNLP tokenized clinical notes
  description: Clinical notes are extracted and tokenized using the OHNLP toolkit and conform
    to the OHNLP open source schema.
- name: DICOM imaging
  description: Imaging obtained from PACS is distributed using the DICOM standard and conforms
    to the DICOM schema.
- name: WFDB waveform telemetry
  description: Waveform telemetry from bedside monitors and gateway/middleware uses the WFDB
    standard, with a published metadata schema described as the PhysioNet schema extended.
- name: EDF+ and Persyst EEG waveforms
  description: EEG waveforms from the hospital database use EDF+ and Persyst formats, with
    published metadata described as the open source EDF+ and Persyst schema.
license_and_use_terms:
  name: CHoRUS access and licensing terms
  license_terms:
  - All data types listed for the CHoRUS dataset are marked as controlled access.
  - All participants must sign a licensing agreement included in the registration form before
    gaining access to the dataset; this requirement is stated for the AIM-AHEAD Bridge2AI
    for Clinical Care training program and is described as not a barrier to acceptance into
    the program.
  - In order to gain access to the dataset, a ".edu" email address is required; program administrators
    will assist with this access if needed.
  - Access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
  - The CHoRUS GitHub organization states that "This project is licensed under the MIT License",
    which applies to the organization's software repositories rather than to the clinical
    dataset; individual repositories also carry MIT and Apache-2.0 licenses.
  contact_person: https://chorus4ai.org/#person-jared-houghtaling
  description: Access terms for the CHoRUS dataset. The named access-request contact is Jared
    Houghtaling (jared.houghtaling@tuftsmedicine.org), identified above by the reference https://chorus4ai.org/#person-jared-houghtaling.
regulatory_restrictions:
  name: Access and regulatory posture
  confidentiality_level: restricted
  regulatory_restrictions:
  - Every listed data modality is under controlled access, with access granted after registration,
    licensing agreement signature, and compute provisioning.
  - The project website displays the notice "This repoitory is under review for potential
    modification in compliance with Administration directives" (spelling as published).
  - The project establishes a legal framework for collecting data at scale and analyzes the
    existing legal and regulatory landscape as part of its ethics pillar.
  other_compliance:
  - Eligibility rules stated in the source documents (U.S. citizenship, permanent residency,
    or non-citizen national status, and a W-9 form) apply to the AIM-AHEAD Bridge2AI for Clinical
    Care training program, not to the dataset itself.
maintainers:
- name: Massachusetts General Hospital
  role: academic_institution
  maintainer_details:
  - Massachusetts General Hospital is the awardee organization for NIH award OT2OD032701 and
    hosts the project's principal investigator.
  - The project website lists Ciera McCrary, MGH, Program Manager, as the contact, with the
    email address cmccrary@mgh.havard.edu as published.
- name: CHoRUS consortium
  role: academic_institution
  maintainer_details:
  - 60+ CHoRUS consortium members across 20 different institutions maintain the project, with
    14 institutions contributing as Data Acquisition centers.
  - Data access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
  - The CHoRUS GitHub organization hosts 28 repositories providing software and tooling, validated
    semantic mappings, standard operating protocols, and project management overviews.
updates:
  name: Dataset expansion plan
  update_details:
  - The dataset is being expanded from the current released dataset of 50,000 patient admissions
    toward an anticipated final dataset of 100,000 patient admissions across 9 modalities
    from 14 data-contributing hospitals.
  - As of August 2025, imaging de-identification was in process for a larger cohort and EEG
    extraction was in process.
  - Contributing sites provide regular status updates on their progress in creating and curating
    a CHoRUS-specific clinical data extract, tracked in the Standards Project or the Data
    Acquisition Project.
  - The NIH-funded data generation project period runs to 2026-11-30.
version_access:
  name: Released and anticipated dataset snapshots
  versions_available:
  - 'Current Released Dataset: 50,000 patient admissions from ICU, PICU, and NICU; 1.6 billion
    rows of EHR OMOP data; 7,642 admissions with radiology data; 23 Tb waveform data.'
  - 'Anticipated Final Dataset: 100,000 patient admissions; 9 different data modalities; 14
    data contributing hospitals.'
  version_details:
  - The source documents describe the dataset in terms of released and anticipated snapshots
    rather than numbered versions, and do not report a dataset DOI or version identifier.
  - An August 2025 status describes coverage of 14 different hospitals with over 45K unique
    admissions.
extension_mechanism:
  name: Community contribution routes
  contribution_url: https://github.com/chorus-ai
  extension_details:
  - Clinical collaborators can contribute to mapping efforts through the chorus-mapping repository,
    which holds documentation, pooled tabular mappings, and an associated clinical validation
    SOP.
  - Software contributors and users are served by a web guide compiling documentation in the
    chorus-developer repository, and a package status page reports versions, maintainers,
    and other metadata about CHoRUS packages.
  - Data site managers raise issues in the Standards Discussions and Data Acquisition Discussions
    areas of the GitHub organization.
external_resources:
- name: CHoRUS project web and code resources
  external_resources:
  - https://chorus4ai.org/
  - https://github.com/chorus-ai
  - https://reporter.nih.gov/project-details/10472824
  - www.bridge2ai.org/chorus
  restrictions:
  - Dataset content referenced from these resources remains under controlled access; the public
    resources provide documentation, tooling, and project information rather than the data
    themselves.
  future_guarantees:
  - The project website states that the repository is under review for potential modification
    in compliance with Administration directives, so continued availability of the published
    material is not guaranteed by the source documents.
