preprocessing_strategies:
- name: MuSIC data integration and map production pipeline
  preprocessing_details:
  - The Tools Module of CM4AI produces and maintains the Multi-Scale Integrated Cell (MuSIC) pipeline,
    which produces integrated cell maps from the multiple, multi-modal input data streams. The pipeline
    is divided into multiple segments, each of which calls the FAIRSCAPE client package to validate inputs
    and create the output RO-Crate package for that segment.
  - Step a) Download PPI and Image Data - PPI networks for the cell line and conditions are downloaded
    from the Krogan Laboratory's deposition archive; IF images for the cell line and conditions are downloaded
    from the Lundberg Laboratory's deposition archive.
  - Step b) Generate embeddings - downloaded PPI networks are processed using the node2vec deep learning
    model to reduce dimensionality, producing a PPI embedding; IF images are processed using a Human Protein
    Atlas deep learning model to reduce dimensionality, producing an image embedding.
  - Step c) Co-Embedding - the PPI and image embeddings are integrated to obtain a co-embedding for each
    protein using contrastive deep learning, learning co-embeddings such that the original embeddings
    can be reconstructed with minimal information loss and proteins with similar PPI and image embeddings
    have similar co-embeddings.
  - Step d) Protein Community Detection and Hierarchy Creation - community detection is performed based
    on the all-by-all similarities of pairs of proteins in the co-embedding space; the resulting hierarchy
    of protein communities is output as the final cell map.
  - Step e) Hierarchy evaluation - cell maps are aligned to known protein function and pathway resources
    including the Gene Ontology and Reactome, and assemblies are annotated using a large language model
    approach that names sets of proteins and assigns a name confidence score.
  - Step f) Integrative structure modeling - a bioinformatics pipeline annotates MuSIC communities by
    available structural information (PDB, AlphaFold Protein Structure Database, crosslinking mass spectrometry,
    disordered-segment prediction), ranks communities by the amount of available structural information,
    and performs integrative structure modeling of top ranked communities using the Python Modeling Interface
    and the Integrative Modeling Platform (IMP) package version 2.18.
- name: AI-readiness packaging with FAIRSCAPE
  preprocessing_details:
  - FAIRSCAPE-CLI is called when any computation or coherent set of computations in the pipeline is completed
    and is passed metadata defining JSON-Schema schemas for the datasets in the computational unit as
    well as the inputs, computations, software, models, and outputs. It creates an RO-Crate package with
    the datasets, metadata, and software, or resolvable references to these components, and unique stubs
    for identifier creation.
  - The RO-Crates are sent to the FAIRSCAPE server where they are registered and assigned persistent,
    resolvable, globally unique persistent identifiers using the ARK scheme, then decomposed into their
    individual components - datasets, models, software - which are also registered and assigned PIDs.
  - The server computes end-to-end entailments on each RO-Crate's provenance as expressed in the EVI Evidence
    Graph Ontology and links them together where possible; JSON-LD and RDF-XML serializations are provided
    on the landing page.
- name: Release revision processing
  preprocessing_details:
  - The June 2025 release, version 2.1, is described as a revision that includes adding RGB immunofluorescent
    images, corrections to ro-crate metadata, and changes to naming conventions.
cleaning_strategies:
- name: Quality control of perturbation screen data
  cleaning_details:
  - The project article states that following the single-cell CRISPR screens of 100 chromatin regulators
    in MDA-MB-468 cells and undifferentiated KOLF2.1J iPSCs, "The resulting data are currently being QCed."
- name: Validation and characterization under the AI-readiness framework
  cleaning_details:
  - CM4AI's AI-readiness features include characterizing and validating all datasets and data elements,
    and mapping data elements to public ontology vocabularies where appropriate, using JSON-Schema mini-data-dictionary
    descriptions resolvable from the provenance graph metadata.
  - The Standards Module established FAIR AI-Readiness metadata and validation toolkits, which have been
    used to package and release the cell-line perturbation and measurement data.
labeling_strategies:
- name: Cell map assembly annotation
  description: Annotation approach applied to computed cell maps. The captured release metadata states
    that computed cell maps are not included in these releases.
  data_annotation_protocol:
  - Cell maps are annotated in a two-pronged approach. First, cell maps are aligned to known protein function
    and pathway resources, including the Gene Ontology (GO) and Reactome, to determine protein assemblies
    in the cell map with high overlap with known cell biology.
  - Second, assemblies in the cell maps are annotated using a large language model (LLM) approach developed
    by the project to name sets of proteins and assign a name confidence score.
  labeling_details:
  - Dataverse keyword terms for the releases are mapped to public ontology identifiers, including NCI
    Thesaurus (artificial intelligence, protein-protein interaction), BioAssay Ontology (affinity purification,
    CRISPR/Cas9), Software Ontology (AP-MS), LOINC (breast cancer), Cell Ontology (cardiomyocyte, neural
    progenitor cell, neuron), Experimental Factor Ontology (induced pluripotent stem cell, perturb-seq,
    single-cell RNA sequencing), Ontology of Biomedical Investigations (machine learning), MeSH (mass
    spectroscopy), Gene Ontology (protein localization), and ChEBI (paclitaxel, vorinostat).
machine_annotation_tools:
- name: CM4AI pipeline software
  tools:
  - node2vec
  - Human Protein Atlas deep learning image model
  - Contrastive deep learning co-embedding model
  - Community detection over the co-embedding space
  - Large language model assembly naming with confidence score
  - FAIRSCAPE-CLI and FAIRSCAPE server
  - Integrative Modeling Platform (IMP) version 2.18 with the Python Modeling Interface
  tool_descriptions:
  - node2vec is used to reduce the dimensionality of downloaded PPI networks, producing a PPI embedding
    that contains information about the protein's interactions.
  - A Human Protein Atlas deep learning model is used to reduce the dimensionality of IF images, producing
    an image embedding that contains information about protein localization.
  - PPI and image embeddings are integrated into a per-protein co-embedding using contrastive deep learning.
  - Community detection over all-by-all protein similarities in the co-embedding space produces the hierarchy
    of protein communities output as the cell map.
  - An LLM-based approach names sets of proteins and assigns a name confidence score during hierarchy
    evaluation.
  - FAIRSCAPE-CLI is a client-side Python3 application that creates RO-Crate packages; the FAIRSCAPE server
    registers them, assigns ARK persistent identifiers, and computes provenance entailments in the EVI
    Evidence Graph Ontology. Both packages are pip-installable and freely available under the MIT open-source
    license.
  - Integrative structure modeling uses the Python Modeling Interface package with the open-source Integrative
    Modeling Platform (IMP) package version 2.18, available at https://integrativemodeling.org.
existing_uses:
- name: CodeFest training and tutorials
  examples:
  - Initial datasets, tools and standards associated with all three parallel mapping platforms were made
    available at the CM4AI CodeFest in March 2024, accompanied by detailed tutorials explaining how the
    data were derived and integrated, and providing production ready software for producing the datasets.
  - The inaugural virtual CodeFest provided training to a total of 38 registrants.
- name: Perturbation Cell Atlas of human induced pluripotent stem cells
  examples:
  - 'The Dataverse release records list as a related publication: Nourreddine S, Doctor Y, Dailamy A,
    Forget A, Lee YH, Chinn B, Khaliq H, Polacco B, Muralidharan M, Pan E, Zhang Y, Sigaeva A, Hansen
    JN, Gao J, Parker JA, Obernier K, Clark T, Chen JY, Metallo C, Lundberg E, Ideker T, Krogan N, Mali
    P. A PERTURBATION CELL ATLAS OF HUMAN INDUCED PLURIPOTENT STEM CELLS. bioRxiv. 2024 Nov 4;2024.11.03.621734.
    PMCID: PMC11580897, doi:10.1101/2024.11.03.621734.'
- name: Dataset access metrics
  examples:
  - 'Recorded Dataverse dataset metrics at capture: March 2025 release, 302 downloads; June 2025 release,
    256 downloads; October 2025 release, 405 downloads; June 2026 release, 181 downloads. The Dataverse
    citation panels report "Sorry, no citations were found" for the March 2025 and June 2025 releases.'
use_repository:
- name: CM4AI web portal
  repository_url: https://cm4ai.org/
  repository_details:
  - Teaming supports open dissemination of CM4AI-generated data, maps, and tools via the CM4AI web portal
    (http://www.cm4ai.org), using the U-BRITE platform, to support open and trustworthy data management
    and sharing.
  - The portal hosts Data Releases, Tools, Product Documentation, Publications and Learning sections;
    the Publications section is described as covering how CM4AI is addressing the Bridge2AI Functional
    Genomics grand challenge.
other_tasks:
- name: Downstream genomic interpretation
  task_details:
  - Cell maps provide a foundation for downstream applications in human genomics, including interpretation
    of genetic variants and mutations.
  - As an example, cell maps have been used in AI tools for "visible machine learning" or "visible neural
    networks" (VNNs) to interrogate how protein assemblies in the cell affect cell-level phenotype predictions.
- name: Workforce training
  task_details:
  - The in-person internship hosted at Yale University and the University of California San Diego is designed
    so participants learn the impact of cell maps on biomedical research applications, how to interact
    with the data and standards used by CM4AI, how to develop a visible neural network using cell maps,
    and how to integrate external data into an existing cell map for the ethical development of AI/ML
    applications.
future_use_impacts:
- name: Interim status and quarterly change
  impact_details:
  - The releases are interim; content will be regularly updated and augmented through the end of the project
    in November 2026, with quarterly updates, and predicted cell maps will be added in future releases.
    Analyses should record the specific release DOI and version used.
- name: Repository review notice
  impact_details:
  - Both the CM4AI website and the University of Virginia Dataverse collection display the notice "This
    repository is under review for potential modification in compliance with Administration directives,"
    which bears on the future availability of the material.
- name: Software and identifier evolution
  impact_details:
  - '"Software packages will be versioned as the project progresses, and the version used to produce each
    dataset will be referenced in the dataset''s metadata."'
  - The persistent identifier system currently in use is the ARK scheme, with DOIs a future feature as
    supplementary PIDs for final-state publishable work.
discouraged_uses:
- name: Clinical and commercial constraints
  discouragement_details:
  - '"These laboratory data are not to be used in clinical decision-making or in any context involving
    patient care without appropriate regulatory oversight and approval."'
  - The data are licensed under CC BY-NC-SA 4.0, under which "You may not use the material for commercial
    purposes"; commercial use requires a separate license negotiation with the copyright holder (UCSD,
    Stanford, and/or UCSF depending upon the specific data package in question).
  - The release is described as most suitable for bioinformatics analysis of the individual datasets and
    as requiring domain expertise for meaningful analysis.
intended_uses:
- name: Stated intended uses
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - Cell architectural changes and interactions in presence of specific disease processes, treatment conditions,
    or genetic perturbations
  usage_notes: Taken verbatim from the "Intended Use" section of the June 2025, October 2025 and June
    2026 Dataverse release records.
prohibited_uses:
- name: Clinical decision-making and patient care
  prohibition_reason:
  - '"These laboratory data are not to be used in clinical decision-making or in any context involving
    patient care without appropriate regulatory oversight and approval."'
- name: Commercial use without separate licensing
  prohibition_reason:
  - The CC BY-NC-SA 4.0 license prohibits use of the material for commercial purposes; a commercial use
    is one primarily intended for commercial advantage or monetary compensation.
  - Commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question). A Data Access Committee will supervise
    ethical matters related to dataset distribution and potential dual licensing for commercial use.
- name: Application of additional legal or technological restrictions
  prohibition_reason:
  - Under CC BY-NC-SA 4.0, "You may not apply legal terms or technological measures that legally restrict
    others from doing anything the license permits."
