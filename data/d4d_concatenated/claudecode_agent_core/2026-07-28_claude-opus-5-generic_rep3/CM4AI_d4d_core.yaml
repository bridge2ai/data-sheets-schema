- name: CM4AI Ethics Module
  review_details:
  - The Ethics team worked closely with the Data Acquisition, Tools, and Standards Modules to develop
    a plan for ethical preparation, licensing, dissemination, and Data Access supervision of CM4AI datasets,
    balancing openness of the data produced with protection of intellectual property and supervision and
    monitoring of potential efforts at commercialization.
  - The Ethics team employs a methodology inspired by Value-Sensitive Design (VSD), creating an axiological
    repository - a repository of values - to guide the articulation of design standards and expectations.
  - The Ethics team is formulating the CM4AI Life Cycle, a framework designed to elucidate governance
    milestones throughout the data generation and AI system development processes.
  - The Ethics Pillar supported the Bridge2AI Ethics Working Group in supporting the Bridge2AI Data Sharing
    and Dissemination Working Group in developing a Code of Conduct, which outlines basic requirements
    for participants in the Bridge2AI Open House to access B2AI data (including CM4AI datasets), to attest
    and commit to prior to accessing the data.
data_protection_impacts:
- name: Ethical governance and dual-use supervision
  impact_details:
  - A Data Access Committee will supervise ethical matters related to dataset distribution and potential
    dual licensing for commercial use.
  - Comprehensive guidelines and best practices are being established for the ethical development of AI
    systems leveraging this data, including tools aimed at enhancing awareness and comprehension of the
    ethical, legal, and social ramifications associated with CM4AI data and the consequent AI systems.
  - The ethical criterion for AI-readiness requires anticipating potential applications of the data and
    derived AI/ML systems, integrating them into data governance frameworks to optimize benefits and mitigate
    potential risks, and promoting their use for the collective good.
