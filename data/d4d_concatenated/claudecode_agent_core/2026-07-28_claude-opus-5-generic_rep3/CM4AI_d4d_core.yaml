id: https://cm4ai.org/data-releases/
name: CM4AI_Data_Releases
title: Cell Maps for Artificial Intelligence (CM4AI) Data Release Programme
description: The Cell Maps for Artificial Intelligence (CM4AI) data release programme is the ongoing,
  quarterly series of AI-ready data releases produced by CM4AI, the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Bridge2AI program. CM4AI's stated objective is to
  deliver machine-readable hierarchical maps of cell architecture as AI-ready data, produced from multimodal
  interrogation of chromatin modifiers, metabolic enzymes, and other proteins involved in cancer, neuropsychiatric,
  and cardiac disorders in disease-relevant cell lines under treated and untreated conditions. The input
  data streams are generated by mass spectrometry based proteomics (affinity purification mass spectrometry,
  AP-MS, and size exclusion chromatography mass spectrometry, SEC-MS), spatial proteomics / immunofluorescence
  (IF) cell imaging, and genetic perturbation using CRISPR/Cas9 (perturb-seq). The two cell systems under
  investigation are the triple-negative breast cancer line MDA-MB-468 (untreated / DMSO control, paclitaxel-treated,
  vorinostat-treated) and the induced pluripotent stem cell line KOLF2.1J (undifferentiated parental cells
  and iPSC-derived neural progenitor cells, neurons, and cardiomyocytes). Outputs are packaged with provenance
  graphs and rich metadata as AI-ready datasets in RO-Crate format using an extended client-server version
  of the FAIRSCAPE framework, and are deposited in LibraData, the University of Virginia's Dataverse instance
  and an NIH-approved generalist repository. Individual quarterly releases are recorded as `resources`
  of this record; the June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C, is the current release named
  by the CM4AI data releases page. The CM4AI portal and data releases page report project-level "Data
  Insights" figures of 1,374 protein interactions, 53,788 immunofluorescent images, 7,023 total proteins
  investigated, 11,739 genes targeted, and a data volume of 21.4 TB.
