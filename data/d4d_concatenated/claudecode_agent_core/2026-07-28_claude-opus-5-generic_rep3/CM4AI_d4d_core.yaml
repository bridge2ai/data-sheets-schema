purposes:
- name: Interpretable genotype-phenotype learning
  description: Stated purpose of the CM4AI data generation project on both the NIH RePORTER project record
    and the CM4AI portal.
  response: As part of the NIH Common Fund's Bridge2AI program, the CM4AI data generation project seeks
    to map the spatiotemporal architecture of human cells and use these maps toward the grand challenge
    of interpretable genotype-phenotype learning. In genomics and precision medicine, machine learning
    models are often "black boxes," predicting phenotypes from genotypes without understanding the mechanisms
    by which such translation occurs.
- name: Production of ethical, AI-ready datasets of cell architecture
  description: Stated overarching mission of CM4AI in the project article.
  response: CM4AI's overarching mission is to produce ethical, AI-ready datasets of cell architecture,
    inferred from multimodal data collected for human cell lines, to enable transformative biomedical
    AI research. CM4AI's objective is to deliver machine-readable hierarchical maps of cell architecture
    as AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines
    under perturbed and unperturbed conditions.
- name: Enabling visible machine learning
  description: Stated purpose on the NIH RePORTER project record.
  response: These data will broadly stimulate research and development in "visible" machine learning systems
    informed by multi-scale cell and tissue architecture. This Bridge2AI data generation project will
    generate a resource of matched data and tools to enable the creation of "visible" ML systems, which
    are not black boxes but are built directly on knowledge maps of cell and tissue architecture.
- name: Demonstrating FAIR, provenanced, ethical AI-readiness practice
  description: Stated purpose in the project article and the NIH RePORTER project record.
  response: In addition to data and tools, this project will implement a standards data management approach
    based on FAIR access and software principles, with deep provenance and replication packages for representation
    of cell maps and their underlying datasets; initiate a research program in ethical AI, especially
    as it relates to how maps will be used in genomic medicine and model interpretation; and stimulate
    a diverse portfolio of training opportunities in the emerging field of biomachine learning.
tasks:
- name: Multimodal cell map construction
  description: Integration of protein-protein interaction and protein localization data into hierarchical
    maps of subcellular architecture.
  response: Cell maps are hierarchical directed acyclic graphs (DAG), where each node represents an assembly
    of proteins in proximity at a given scale, spanning from large assemblies representing cell compartments
    to small assemblies of proteins in close proximity. Cell maps are produced by integrating localization
    and interaction data using self-supervised embedding approaches from deep learning, followed by algorithmic
    community detection at multiple resolutions to generate a hierarchy of protein assemblies. The captured
    release metadata states that computed cell maps are not included in the releases described here.
- name: Mapping protein-protein interactions under perturbation
  description: AP-MS and SEC-MS mapping of protein interactions in treated and untreated cell lines.
  response: 'To map protein-protein interactions (PPIs) of 100 chromatin regulators under different conditions
    (cancer: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated, neurons and cardiomyocytes),
    CM4AI employed AP-MS on endogenously tagged cell lines and size-exclusion chromatography coupled to
    mass spectrometry (SEC-MS) for proteome-wide complex/interaction mapping as two orthogonal mass spectrometry-based
    approaches.'
- name: Spatial proteomics mapping
  description: Immunofluorescence subcellular imaging of chromatin regulators and related proteins.
  response: CM4AI proposed to map the spatial subcellular organization of key chromatin modifiers, their
    interactors and key signaling molecules involved in cancer using the Human Protein Atlas resource
    of antibodies, establishing automated fixation and permeabilization protocols for a pipetting robot
    for MDA-MB-468 and KOLF2 cell lines, and completing spatial proteomics mapping of 100 chromatin regulators
    in the MDA-MB-468 cells with and without paclitaxel or vorinostat.
- name: Genetic perturbation mapping
  description: Single-cell CRISPR perturbation screens by cell type and treatment condition.
  response: CM4AI performed single-cell CRISPR screens perturbing 100 chromatin regulators in the MDA-MB-468
    cells under 3 conditions (no treatment, paclitaxel or vorinostat) and KOLF2 iPSC in the undifferentiated
    state, using a CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene
    and the 10x Genomics 3'HT kit. A separate expressed-genome-scale CRISPRi Perturbation Cell Atlas in
    undifferentiated KOLF2.1J hiPSCs maps transcriptional and fitness phenotypes associated with 11,739
    targeted genes.
- name: AI-readiness packaging and provenance capture
  description: Packaging of data, software, metadata, and provenance graphs for AI readiness.
  response: The Standards Module of CM4AI is responsible for AI-Readiness packaging of data, software,
    metadata and provenance graphs, performed by the FAIRSCAPE framework. FAIRSCAPE-CLI creates an RO-Crate
    package with the datasets, metadata, and software, or resolvable references to these components; the
    RO-Crates are sent to the FAIRSCAPE server where they are registered and assigned persistent, resolvable,
    globally unique persistent identifiers, and the server computes end-to-end entailments on each RO-Crate's
    provenance as expressed in the EVI Evidence Graph Ontology.
addressing_gaps:
- name: Opacity of genotype-phenotype machine learning models
  description: The gap the project record states the data are intended to close.
  response: In genomics and precision medicine, machine learning models are often "black boxes," predicting
    phenotypes from genotypes without understanding the mechanisms by which such translation occurs. Machine
    learning models show great promise in analyzing the human genome to make predictions, but the inner
    workings of these models are typically difficult-to-interpret "black boxes." To address this challenge,
    this Bridge2AI data generation project will generate a resource of matched data and tools to enable
    the creation of "visible" ML systems.
- name: Incomplete knowledge of subcellular organization
  description: The scientific gap motivating systematic cell mapping.
  response: CM4AI's objective is to deliver machine-readable hierarchical maps of cell architecture as
    AI-Ready data produced from multimodal interrogation of proteins involved in cancer, neuropsychiatric,
    and cardiac disorders in disease-relevant cell lines under perturbed and unperturbed conditions. Cell
    maps provide a foundation for downstream applications in human genomics, including interpretation
    of genetic variants and mutations.
- name: Absence of ethical, FAIR, AI-ready biomedical data practice
  description: The data-practice gap CM4AI's AI-readiness framework addresses.
  response: As defined by CM4AI, AI-Ready biomedical data are fully characterized FAIR data of known provenance,
    which can be ethically and reliably processed by AI applications; whose models and software are available
    and well-described for validation and re-use; and whose predictions may be fully explained and interpreted
    to the user as needed. CM4AI uses an expanded version of the FAIRSCAPE framework to establish a basis
    for AI-readiness, comprising FAIRness with rich metadata and persistent globally unique identifiers,
    a machine-readable provenance graph resolvable as metadata for all results, and characterization and
    validation of all datasets and data elements with mapping to public ontology vocabularies.
