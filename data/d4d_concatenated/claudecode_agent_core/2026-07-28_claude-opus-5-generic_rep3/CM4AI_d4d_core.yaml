subpopulations:
- name: Cell line donor characteristics
  subpopulation_elements_present: true
  identification:
  - MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established from a metastatic
    site pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma, available
    from ATCC.
  - The KOLF2.1J (RRID:CVCL_B5P3) iPSC line was derived from a healthy male Northern European donor, available
    from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource.
  distribution:
  - All released data derive from these two donor-derived human cell lines and their differentiated derivatives;
    the release metadata states that the data "does not represent all biological variants which may be
    seen in the population at large."
sensitive_elements:
- name: Sensitivity assessment
  sensitive_elements_present: false
  sensitivity_details:
  - 'The Dataverse release records state Human Subjects: No; De-identified Samples: Yes; FDA Regulated:
    No.'
  - The project article states that CM4AI data are distinctive within Bridge2AI in that they are non-clinical
    (from tissue cultures) and are considered to be de-identified as they cannot be matched, with current
    knowledge, to a human subject.
acquisition_methods:
- name: Experimental acquisition from cultured human cell lines
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Data are generated directly by measurement of cultured human cell lines using immunofluorescence subcellular
    microscopy, AP-MS and SEC-MS mass spectrometry, and single-cell CRISPR-Cas perturbation screens.
  - Derived products are produced by the Multi-Scale Integrated Cell (MuSIC) pipeline, which computes
    embeddings and co-embeddings from the input data streams and applies community detection to build
    hierarchies.
  - The March 2025 release states that the CRISPRi Perturbation Cell Atlas findings were validated via
    phenotypic, protein-interaction, and metabolic tracing assays.
  - 'No data are reported by human subjects; the release records state Human Subjects: No.'
collection_mechanisms:
- name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details:
  - AP-MS performed on endogenously tagged cell lines to map protein-protein interactions of chromatin
    regulators. CM4AI endogenously tagged 17 genes in MDA-MB-468 and acquired AP-MS data under three conditions
    (untreated, paclitaxel and vorinostat treated), with 34 additional genes then in the process of being
    tagged.
  - AP-MS data for MDA-MB-468 with treatment are released in the June 2026 Data Release as cm4ai_apms_MDA-MB-468_paclitaxel.zip
    and cm4ai_apms_MDA-MB-468_vorinostat.zip.
- name: Size exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details:
  - SEC-MS used for proteome-wide complex and interaction mapping as an orthogonal mass spectrometry approach
    to AP-MS, performed in the Nevan Krogan laboratory at the University of California San Francisco.
  - SEC-MS has been performed on MDA-MB-468 cells under three conditions (untreated, paclitaxel and vorinostat
    treated) and on KOLF2 iPSCs and derivatives.
- name: Immunofluorescence subcellular confocal microscopy
  mechanism_details:
  - Immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford
    University, using the Human Protein Atlas resource of antibodies.
  - Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin antibody (yellow
    channel); microtubules with tubulin antibody (red channel); and antibody against protein of interest
    (green channel).
  - Automated fixation and permeabilization protocols were established for a pipetting robot for the MDA-MB-468
    and KOLF2 cell lines.
- name: Single-cell CRISPR perturbation screening (perturb-seq)
  mechanism_details:
  - A CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene was designed;
    MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were generated and characterized.
  - Single-cell CRISPR screens of 100 chromatin regulators with and without drug in MDA-MB-468 cells and
    in undifferentiated KOLF2.1J iPSCs were done using the 10x Genomics 3'HT kit.
  - An expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J hiPSCs maps transcriptional
    and fitness phenotypes for 11,739 targeted genes.
