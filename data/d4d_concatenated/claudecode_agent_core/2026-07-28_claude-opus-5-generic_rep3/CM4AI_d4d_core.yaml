status: Beta. All captured releases are labelled "(Beta)" and are described by the release metadata as
  interim; the maintenance plan states the dataset will be regularly updated and augmented through the
  end of the project in November 2026. Both cm4ai.org and the University of Virginia Dataverse collection
  carry the notice "This repository is under review for potential modification in compliance with Administration
  directives."
conforms_to: RO-Crate (Research Object Crate). CM4AI output data are packaged with provenance graphs and
  rich metadata as AI-ready datasets in RO-Crate format using an extended, client-server version of the
  FAIRSCAPE framework. FAIRSCAPE-generated persistent identifiers use the ARK scheme and resolve to machine-
  and human-readable landing pages expressed in JSON-LD.
conforms_to_schema: JSON-Schema mini-data-dictionary descriptions for datasets and data elements, resolvable
  from the provenance graph metadata; provenance expressed in the EVI Evidence Graph Ontology, with vocabularies
  from Schema.org and other public ontologies; alternate serializations provided in JSON-LD and RDF-XML.
