instances:
- name: Immunofluorescence subcellular images
  instance_type: Confocal immunofluorescence image sets of cultured human cells
  description: Immunofluorescence (ICC-IF) confocal images of the breast cancer cell line MDA-MB-468,
    imaged in the Lundberg Lab at Stanford University. Nuclei were stained with DAPI (blue channel); endoplasmic
    reticulum with a calreticulin antibody (yellow channel); microtubules with tubulin antibody (red channel);
    and antibody against protein of interest (green channel). Image sets are released per treatment condition
    (untreated, paclitaxel, vorinostat). The March 2025 release describes spatial localization of 563
    proteins of interest per condition; the June 2025, October 2025 and June 2026 releases describe 464
    proteins of interest per condition. The CM4AI portal reports a project-level total of 53,788 immunofluorescent
    images. The data releases page states that IF images for the iPSC-derived cell types are "coming soon".
  label: false
- name: SEC-MS protein interaction profiles
  instance_type: Size-exclusion chromatography mass spectrometry elution profiles
  description: Protein-protein interaction data generated by size exclusion chromatography-mass spectroscopy
    (SEC-MS) in the Nevan Krogan laboratory at the University of California San Francisco, on undifferentiated
    KOLF2.1J human induced pluripotent stem cells and on MDA-MB-468 human breast cancer cells following
    treatment with vorinostat or paclitaxel. The data releases page states that the curated iPSC and TNBC
    datasets each capture approximately 7,000 proteins by SEC-MS. The project article reports that SEC-MS
    in MDA-MB-468 cells identified 72 of 100 chromatin modifiers, 52 of them integral components of protein
    complexes, and detected PPI profiles of over a thousand complexes; SEC-MS in KOLF2 iPSCs and derivatives
    uncovered more than 700 protein complexes in both parental iPSCs and differentiated neurons.
  label: false
- name: AP-MS protein interaction data
  instance_type: Affinity purification mass spectrometry interaction data
  description: Affinity purification mass spectrometry data for MDA-MB-468 breast cancer cells with treatment,
    released per treatment condition (paclitaxel, vorinostat) in the June 2026 Data Release. The project
    article states that 17 genes had been endogenously tagged in MDA-MB-468 with AP-MS data acquired under
    three conditions (untreated, paclitaxel and vorinostat treated), with 34 additional genes then in
    the process of being tagged. Earlier captured releases list AP-MS interactomes as "coming soon".
  label: false
- name: CRISPRi perturb-seq single-cell transcriptional profiles
  instance_type: Single-cell CRISPR interference perturbation sequencing data
  description: An expressed genome-scale CRISPRi Perturbation Cell Atlas in undifferentiated KOLF2.1J
    human induced pluripotent stem cells (hiPSCs) mapping transcriptional and fitness phenotypes associated
    with 11,739 targeted genes, together with the corresponding raw sequence data. The March 2025 release
    notes that these findings were validated via phenotypic, protein-interaction, and metabolic tracing
    assays. The October 2025 and June 2026 releases additionally describe perturb-seq data for MDA-MB-468
    breast cancer cells with and without treatment. The data releases page describes perturb-seq of more
    than 11,000 genes (whole-genome) for the iPSC lineage and perturb-seq of 200 genes for the TNBC conditions.
  counts: 11739
  label: false
- name: RO-Crate metadata and provenance packages
  instance_type: RO-Crate metadata documents and provenance graph renderings
  description: Each release includes RO-Crate metadata (JSON / JSON-LD), release metadata archives, and
    HTML provenance graph renderings produced by the FAIRSCAPE framework. The June 2025 release includes
    a release RO-Crate with pointers to sub RO-Crates and an HTML datasheet summarizing key release information;
    the October 2025 and June 2026 releases bundle release metadata in cm4ai_release_metadata.zip.
  label: false
anomalies:
- name: Incomplete overlap across modalities
  anomaly_details:
  - '"Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq
    data interrogate sets of proteins which incompletely overlap."'
- name: Release page date inconsistency for the current release
  anomaly_details:
  - 'The CM4AI data releases page labels doi.org/10.18130/V3/HIGT4C as the "June 2026 Data Release (Beta)"
    but displays "Released on: June 17, 2025", while the Dataverse record for the same DOI gives Publication
    Date 2026-06-17 and version 2 released 2026-07-15T20:28:19Z.'
known_biases:
- name: Cell line representation bias
  bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified human cell
    lines and does not represent all biological variants which may be seen in the population at large.
  affected_subsets:
  - All released data streams (IF imaging, SEC-MS, AP-MS, perturb-seq)
- name: Targeted panel selection
  bias_type: selection_bias
  bias_description: The measured proteins and genes were chosen as targeted panels rather than sampled
    at random. CM4AI's design centres on 100 chromatin modifiers and 100 metabolic enzymes involved in
    cancer, neuropsychiatric, and cardiac disorders, with imaging extended to further proteins pending
    significant hits from genetic perturbation and PPI results.
  affected_subsets:
  - SEC-MS protein interaction data
  - AP-MS protein interaction data
  - Immunofluorescence imaging
known_limitations:
- name: Interim release
  limitation_type: scope_limitation
  limitation_description: The release metadata states "This is an interim release" and that the data are
    not yet in completed final form.
  scope_impact: 'Content is expected to change: the dataset will be regularly updated and augmented through
    the end of the project in November 2026, with quarterly updates.'
  recommended_mitigation: Users should cite the specific release DOI and version they used and check the
    CM4AI data releases page for the current release.
- name: Computed cell maps not included
  limitation_type: coverage_limitation
  limitation_description: '"Does not contain predicted cell maps, which will be added in future releases";
    the completeness statement likewise records "Computed cell maps not included in this release."'
  scope_impact: The releases provide the multimodal input data streams rather than the integrated hierarchical
    cell maps that are the project's headline product.
- name: Suitability limited to per-dataset bioinformatics analysis
  limitation_type: methodological_limitation
  limitation_description: '"The current release is most suitable for bioinformatics analysis of the individual
    datasets."'
  scope_impact: Cross-modality integration is constrained by the incomplete overlap between the protein
    and gene sets interrogated by each modality.
- name: Domain expertise required
  limitation_type: methodological_limitation
  limitation_description: '"Requires domain expertise for meaningful analysis."'
- name: Pre-publication embargo on some component datasets
  limitation_type: coverage_limitation
  limitation_description: '"Some datasets are under temporary pre-publication embargo." In the October
    2025 and June 2026 records, the external links for perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468
    breast cancer cells are marked "Embargoed".'
confidential_elements:
- name: Confidentiality assessment
  confidential_elements_present: false
  confidentiality_details:
  - 'The released files captured in the Dataverse records are all listed with File Access: Public.'
  - The release metadata notes that some datasets are under temporary pre-publication embargo; in the
    October 2025 and June 2026 records the external links for perturb-seq data in KOLF2.1J iPSCs and in
