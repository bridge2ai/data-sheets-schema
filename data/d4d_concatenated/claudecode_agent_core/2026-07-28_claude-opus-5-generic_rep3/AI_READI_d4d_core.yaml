name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship multimodal dataset produced by the Artificial Intelligence Ready and
  Equitable/Exploratory Atlas for Diabetes Insights (AI-READI) project, one of four Data Generation
  Projects of the NIH Common Fund Bridge2AI program. The dataset contains data from 2280 participants
  with and without type 2 diabetes mellitus (T2DM), collected between 19 July 2023 and 1 May 2025 at
  three US sites (University of Alabama at Birmingham, University of California San Diego, and University
  of Washington) and harmonized across sites. Modalities include REDCap survey and clinical data mapped
  to the OMOP Common Data Model, 12-lead electrocardiography, retinal photography, optical coherence
  tomography (OCT), OCT angiography (OCTA), fluorescence lifetime imaging ophthalmoscopy (FLIO), continuous
  glucose monitoring, wearable activity monitoring, and custom indoor environmental sensing. The release
  comprises 356,343 files totalling approximately 3.82 TB, organized following the Clinical Dataset
  Structure (CDS) v0.1.1. The dataset contains no protected health information; information on participant
  sex, race/ethnicity and medications used has been removed from this release. The stated goal is to
  enable AI/ML research into salutogenesis (the pathway from disease back to health) in T2DM.
