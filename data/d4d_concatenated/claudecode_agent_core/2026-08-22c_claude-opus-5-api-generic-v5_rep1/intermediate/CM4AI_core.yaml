source_caveats: >-
  Source disagreements resolved by the declared source ranking. (1) The CM4AI data releases
  page states that the June 2026 release was "Released on: June 17, 2025", while the
  University of Virginia Dataverse record for doi 10.18130/V3/HIGT4C gives a publication
  date of 2026-06-17; the Dataverse release is ranked above the project documentation and
  its date is used. (2) NIH RePORTER gives a project end date of 2026-08-31 for core project
  OT2OD032742, while the data release states that the dataset will be updated through the
  end of the project in November 2026; the release is preferred and both are recorded.
  (3) Protein coverage of the immunofluorescence archives differs between releases: the
  October 2025 release describes 464 proteins per condition, the March 2025 release describes
  563 proteins, and the CM4AI portal states IF images for 523 proteins in the triple-negative
  breast cancer line. The June 2026 release gives no per-file protein count, so no count
  is asserted for its immunofluorescence archives. (4) Andrej Sali's affiliation is given
  as University of California San Diego in the Dataverse author list but as University of
  California San Francisco in the CM4AI preprint; the Dataverse value is used. (5) The author
  "Parker J" and the named data governance contact "Jillian Parker" are recorded as their
  sources write them; the CM4AI preprint gives "Jillian Mohan" in the corresponding author
  position, and the two have not been merged here. (6) Cell-line provenance, per-modality
  method detail and pipeline description are drawn from the CM4AI preprint where the
  Dataverse release is silent. (7) The Nature article included in the source bundle reports
  a multimodal cell map of U2OS osteosarcoma cells produced with the same cell-mapping
  toolkit and acknowledging the same Bridge2AI award; it describes a different dataset and
  its measurements, counts and quality metrics are not attributed to CM4AI in this record.

