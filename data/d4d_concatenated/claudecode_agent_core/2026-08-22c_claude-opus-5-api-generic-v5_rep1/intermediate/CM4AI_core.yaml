updates:
  frequency: Quarterly
  update_details: >-
    The dataset will be regularly updated and augmented through the end of the project in November
    2026, with updates on a quarterly basis. CM4AI describes its output as machine-readable
    hierarchical maps of cell architecture delivered as AI-ready data together with quarterly data
    releases of map-input data streams. Future releases are expected to add the computed cell maps,
    which are not included in this release, and to lift temporary pre-publication embargoes on
    component datasets.

version_access:
  latest_version_doi: doi:10.18130/V3/HIGT4C
  versions_available:
    - >-
      The June 2026 release is at version 2.0. Earlier CM4AI data releases remain separately
      available and are listed in the archive section of the CM4AI data releases page: the May 2024
      release, the March 2025 release (version 1.4, doi 10.18130/V3/B35XWX), the June 2025 release
      (version 2.1, doi 10.18130/V3/F3TD5R) and the October 2025 release (version 2.1,
      doi 10.18130/V3/K7TGEM).
  version_details: >-
    Each quarterly CM4AI data release is deposited as a separate versioned Dataverse dataset with
    its own DOI, and the University of Virginia Dataverse retains version history within each
    release, supporting comparison of versions and export of metadata in OAI-ORE, DataCite,
    OpenAIRE, Schema.org JSON-LD, DDI Codebook, Dublin Core, Croissant and JSON serializations.

retention_limit:
  retention_period: >-
    Long term; no deletion schedule or end date is recorded for the released files.
  retention_details: >-
    CM4AI states that long-term preservation of the dataset is in the University of Virginia
    Dataverse, supported by committed institutional funds. The University of Virginia Dataverse
    collection holding CM4AI releases carries a notice that it is under review for potential
    modification in compliance with Administration directives.

extension_mechanism:
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details: >-
    The project releases the Cell Mapping Toolkit as a series of pip-installable Python packages
    with full user documentation and a step-by-step guide in the GitHub repository, providing a
    flexible and generalizable framework that enables researchers to integrate additional input
    modalities and construct new cell maps across cell subtypes and disease states. The FAIRSCAPE
    AI-readiness framework is likewise released as open-source, pip-installable client and server
    packages, so that others can package their own datasets to the same AI-readiness standard.

notes: >-
  The full record cites this release as: Clark T; Parker J; Al Manir S; Axelsson U;
  Ballllosero Navarro F; Chinn B; Churas CP; Dailamy A; Doctor Y; Fall J; Forget A; Gao J;
  Hansen JN; Hu M; Johannesson A; Khaliq H; Lee YH; Lenkiewicz J; Levinson MA; Marquez C;
  Metallo C; Muralidharan M; Nourreddine S; Niestroy J; Obernier K; Pan E; Polacco B; Pratt D;
  Qian G; Schaffer L; Sigaeva A; Thaker S; Zhang Y; Belisle-Pipon JC; Brandt C; Chen JY; Ding Y;
  Fodeh S; Krogan N; Lundberg E; Mali P; Payne-Foster P; Ratcliffe S; Ravitsky V; Sali A;
  Schulz W; Ideker T, 2026, "Cell Maps for Artificial Intelligence - June 2026 Data Release
  (Beta)", https://doi.org/10.18130/V3/HIGT4C, University of Virginia Dataverse, V2. The core
  schema declares no citation slot, and no data were collected directly from individuals: all
  measurements were made on established human cell lines obtained from third parties, MDA-MB-468
  (RRID:CVCL_0419) from the American Type Culture Collection and KOLF2.1J (RRID:CVCL_B5P3) from
  the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource, both described in the
  CM4AI preprint as ethically sourced. Component datasets are additionally shared with
  third-party repositories: MassIVE for the SEC-MS and AP-MS mass spectrometry deposits, Figshare
  for the CRISPRi Perturbation Atlas, the NCBI Sequence Read Archive for raw Perturb-seq reads,
  and the Network Data Exchange (NDEx) for cell maps produced by the project. The release
  comprises ten ZIP archives and the full record records five component file collections and
  five cell-line-and-condition subsets: MDA-MB-468 untreated, MDA-MB-468 paclitaxel-treated,
  MDA-MB-468 vorinostat-treated, KOLF2.1J iPSCs undifferentiated, and KOLF2.1J-derived
  differentiated cell types.