collection_timeframes:
  - timeframe_details: >-
      The University of Virginia Dataverse record gives a Data Creation Date of 2025-02-27 and a
      Deposit Date of 2025-02-27 for this release. Files in the June 2026 release were published on
      2026-06-17, with the three immunofluorescence image archives published on 2026-07-15. The
      underlying NIH project period is recorded by NIH RePORTER as 2022-09-01 to 2026-08-31, while
      the release states that data generation and augmentation continue through the end of the
      project in November 2026. Earlier releases in the series were published on 2025-03-03 (March
      2025), 2025-07-01 (June 2025) and 2025-10-31 (October 2025), with a May 2024 release also
      listed in the project archive.

acquisition_methods:
  - was_directly_observed: true
    acquisition_details: >-
      Affinity purification-mass spectrometry (AP-MS) on endogenously tagged cell lines, used as
      one of two orthogonal mass spectrometry approaches for protein-protein interaction mapping.
      The CM4AI preprint reports 17 genes endogenously tagged in MDA-MB-468 with AP-MS data
      acquired under untreated, paclitaxel-treated and vorinostat-treated conditions, with a
      further 34 genes being tagged. The June 2026 release distributes AP-MS data for MDA-MB-468
      cells treated with paclitaxel and for MDA-MB-468 cells treated with vorinostat.
  - was_directly_observed: true
    acquisition_details: >-
      Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide complex
      and interaction mapping. SEC-MS was performed on MDA-MB-468 cells under untreated,
      paclitaxel-treated and vorinostat-treated conditions, identifying 72 of the 100 chromatin
      modifiers of interest, 52 of them integral components of protein complexes, and detecting
      protein-protein interaction profiles of over a thousand complexes, with thousands of proteins
      showing differential elution profiles between control and treated cells. SEC-MS was also
      performed in KOLF2.1J iPSCs and their derivatives, uncovering more than 700 protein complexes
      in both parental iPSCs and differentiated neurons.
  - was_directly_observed: true
    acquisition_details: >-
      Immunofluorescence-based staining (ICC-IF) followed by confocal microscopy, performed in the
      Lundberg laboratory at Stanford University using the Human Protein Atlas resource of
      antibodies. Each image records nuclei stained with DAPI in the blue channel, endoplasmic
      reticulum with a calreticulin antibody in the yellow channel, microtubules with a tubulin
      antibody in the red channel, and the protein of interest in the green channel. Automated
      fixation and permeabilization protocols were established on a pipetting robot for the
      MDA-MB-468 and KOLF2 cell lines.
  - was_directly_observed: true
    was_validated_verified: true
    acquisition_details: >-
      Single-cell CRISPR interference perturbation screens. A CRISPR lentiviral library targeting
      100 chromatin factors with six guide RNAs per gene was used with MDA-MB-468 and KOLF2 lines
      engineered to express inducible dCas9, with single-cell readout on the 10x Genomics 3' HT kit,
      run in MDA-MB-468 cells under untreated, paclitaxel-treated and vorinostat-treated conditions
      and in undifferentiated KOLF2.1J iPSCs. Separately, an expressed genome-scale CRISPRi
      Perturbation Cell Atlas in KOLF2.1J iPSCs maps transcriptional and fitness phenotypes for
      11,739 targeted genes; those findings were validated via phenotypic, protein-interaction and
      metabolic tracing assays.
  - was_inferred_derived: true
    acquisition_details: >-
      Hierarchical cell maps are computed rather than observed. The Multi-Scale Integrated Cell
      (MuSIC) pipeline embeds the protein-protein interaction and imaging data separately, fuses
      them into a per-protein co-embedding using contrastive deep learning, and applies
      multi-resolution community detection to produce a hierarchy of protein assemblies. Computed
      cell maps are not included in the June 2026 release.

collection_mechanisms:
  - mechanism_details: >-
      Protein-protein interaction data were acquired using two orthogonal mass spectrometry
      instruments and workflows: affinity purification-mass spectrometry on endogenously tagged
      cell lines, and size-exclusion chromatography coupled to mass spectrometry for proteome-wide
      complex and interaction mapping.
  - mechanism_details: >-
      Spatial proteomics data were acquired using the Human Protein Atlas resource of antibodies,
      automated fixation and permeabilization protocols implemented on a pipetting robot for the
      MDA-MB-468 and KOLF2 cell lines, and confocal microscopy producing four-channel images.
  - mechanism_details: >-
      Genetic perturbation data were acquired using a CRISPR lentiviral library targeting 100
      chromatin factors with six guide RNAs per gene, MDA-MB-468 and KOLF2 CRISPR lines expressing
      inducible dCas9, and single-cell transcriptional readout on the 10x Genomics 3' HT kit.

data_collectors:
  - role: Protein-protein interaction data generation
    collector_details: >-
      Size-exclusion chromatography-mass spectrometry data for KOLF2.1J iPSCs and derivatives and
      for MDA-MB-468 cells, and affinity purification-mass spectrometry data, were generated in the
      Nevan Krogan laboratory at the University of California San Francisco.
  - role: Spatial proteomics imaging
    collector_details: >-
      Immunofluorescence subcellular images of MDA-MB-468 cells were generated in the Lundberg
      laboratory at Stanford University, using Human Protein Atlas antibodies and protocols.
  - role: Data integration and AI-readiness packaging
    collector_details: >-
      The Multi-Scale Integrated Cell (MuSIC) data integration pipeline and Cell Mapping Toolkit are
      developed and operated by the CM4AI Tools module, and AI-readiness packaging into RO-Crate
      form with persistent identifiers and provenance graphs is performed by the CM4AI Standards
      module using the FAIRSCAPE framework.
  - role: Production locations
    collector_details: >-
      The release lists production locations of University of California San Diego, University of
      California San Francisco, Stanford University and University of Virginia.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Targets were selected as a designed panel rather than sampled at random. CM4AI set out to
      interrogate 100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
      neuropsychiatric and cardiac disorders, with spatial proteomics mapping planned to extend to
      their interactors and to key signaling molecules involved in cancer. The expressed
      genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs is genome-scale over expressed
      genes, targeting 11,739 genes.
    source_data: >-
      Two human cell lines and their derivatives: MDA-MB-468 triple-negative breast cancer cells,
      untreated and treated with paclitaxel or vorinostat, and KOLF2.1J induced pluripotent stem
      cells, undifferentiated and differentiated into neural progenitor cells, neurons and
      cardiomyocytes.
    why_not_representative: >-
      The data derive from two commercially available de-identified human cell lines and do not
      represent all biological variants which may be seen in the population at large.

instances:
  - instance_type: >-
      A four-channel immunofluorescence confocal microscopy image of MDA-MB-468 cells showing the
      subcellular localization of one protein of interest, with reference markers for nucleus,
      endoplasmic reticulum and microtubules.
    data_substrate: B2AI_SUBSTRATE:56
    data_topic: B2AI_TOPIC:19
    label_description: >-
      Each image is associated with the protein of interest targeted by the primary antibody and
      with the treatment condition of the imaged cells (untreated, paclitaxel or vorinostat).
  - instance_type: >-
      An affinity purification-mass spectrometry protein-protein interaction record for a bait
      protein in treated MDA-MB-468 cells.
    data_substrate: B2AI_SUBSTRATE:58
    data_topic: B2AI_TOPIC:21
  - instance_type: >-
      A size-exclusion chromatography-mass spectrometry protein elution profile across
      chromatography size fractions, used to infer membership of protein complexes.
    data_substrate: B2AI_SUBSTRATE:59
    data_topic: B2AI_TOPIC:28
  - instance_type: >-
      A gene-level CRISPRi perturbation record in the KOLF2.1J Perturbation Cell Atlas, giving the
      transcriptional and fitness phenotype associated with knockdown of a targeted gene.
    counts: 11739
    data_substrate: B2AI_SUBSTRATE:64
    data_topic: B2AI_TOPIC:34
  - instance_type: >-
      A raw single-cell sequencing read set from a CRISPRi Perturb-seq screen in KOLF2.1J induced
      pluripotent stem cells.
    data_substrate: B2AI_SUBSTRATE:63
    data_topic: B2AI_TOPIC:34

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      The dataset comprises measurements on two human cell lines whose donors are described in the
      CM4AI preprint. MDA-MB-468 was established from a metastatic-site pleural effusion of a
      51-year-old Black female with metastatic mammary adenocarcinoma. KOLF2.1J was derived from a
      healthy male Northern European donor.
    distribution: >-
      Two donors are represented in total, one per cell line. The release records that the data
      derive from commercially available de-identified human cell lines and do not represent all
      biological variants which may be seen in the population at large.

missing_data_documentation:
  - missing_data_patterns: >-
      The protein sets interrogated by the three main modalities incompletely overlap: the SEC-MS
      protein-protein interaction data, the immunofluorescence protein localization data and the
      CRISPRi Perturb-seq data do not cover the same proteins.
    missing_data_causes: >-
      The release is an interim Beta release. Some component datasets remain under temporary
      pre-publication embargo, computed cell maps are not yet included, and the CM4AI portal records
      that immunofluorescence images for the iPSC-derived cell types were still forthcoming while
      AP-MS interactomes for the breast cancer line were likewise being completed.
    handling_strategy: >-
      The project states that the dataset will be regularly updated and augmented through the end of
      the project in November 2026, on a quarterly release cadence, so that missing modalities and
      the computed cell maps are added in later releases.

preprocessing_strategies:
  - preprocessing_details: >-
      Downloaded protein-protein interaction networks are processed with the node2vec deep learning
      model to reduce dimensionality, producing a PPI embedding for each protein that captures
      information about that protein's interactions.
  - preprocessing_details: >-
      Immunofluorescence images are processed with a Human Protein Atlas deep learning model to
      reduce dimensionality, producing an image embedding for each protein that captures information
      about its subcellular localization.
  - preprocessing_details: >-
      The PPI and image embeddings are integrated into a single co-embedding per protein using
      contrastive deep learning. The integration model learns co-embeddings such that the original
      embeddings can be reconstructed with minimal information loss and proteins with similar PPI
      and image embeddings receive similar co-embeddings.
  - preprocessing_details: >-
      Community detection is performed on the all-by-all similarities of protein pairs in the
      co-embedding space, and the resulting hierarchy of protein communities is output as the final
      cell map.
  - preprocessing_details: >-
      Each segment of the pipeline calls the FAIRSCAPE client to validate its inputs and to build an
      RO-Crate output package containing the datasets, metadata and software or resolvable
      references to them, which is then dispatched to the FAIRSCAPE server for persistent identifier
      creation and computation of the provenance graph entailments.

cleaning_strategies:
  - cleaning_details: >-
      Datasets and data elements are characterized and validated as part of AI-readiness packaging:
      complete schemas and validation procedures are supplied for all datasets in the provenance
      graph, data elements are described with JSON-Schema mini-data-dictionaries resolvable from the
      provenance graph metadata, and data elements are mapped to public ontology vocabularies where
      appropriate.
  - cleaning_details: >-
      Single-cell CRISPR screen data from MDA-MB-468 cells under three conditions and from
      undifferentiated KOLF2.1J iPSCs were subjected to quality control before release; the CM4AI
      preprint records these data as being under quality control at the time of writing.

labeling_strategies:
  - labeling_details: >-
      Cell maps are annotated in a two-pronged approach. First, cell maps are aligned to known
      protein function and pathway resources, including the Gene Ontology and Reactome, to determine
      which protein assemblies in the map have high overlap with known cell biology. Second,
      assemblies in the cell maps are annotated using a large language model approach developed by
      the project, which names sets of proteins and assigns a name confidence score to each proposed
      name.

machine_annotation_tools:
  - tools: >-
      node2vec; a Human Protein Atlas deep learning image model; the MuSIC contrastive co-embedding
      model; multi-resolution community detection; and a large language model naming approach
      developed by the project.
    tool_descriptions: >-
      node2vec produces a low-dimensional representation of each protein from its protein-protein
      interaction neighbourhood; the Human Protein Atlas deep learning model produces a
      low-dimensional representation of each protein from its four-channel immunofluorescence image;
      the contrastive deep learning model fuses these into a single co-embedding per protein;
      community detection over co-embedding similarities produces the hierarchy of protein
      assemblies; and the large language model names the resulting assemblies and assigns a
      confidence score to each name.

