purposes:
  - response: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready data,
      produced from multimodal interrogation of chromatin modifiers, metabolic enzymes and
      other proteins involved in cancer, neuropsychiatric and cardiac disorders in
      disease-relevant cell lines under perturbed and unperturbed conditions.
  - response: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the
      grand challenge of interpretable genotype-phenotype learning.
  - response: >-
      To produce a matched resource of data and tools that enables the creation of "visible"
      machine learning systems built directly on knowledge maps of cell and tissue
      architecture, rather than difficult-to-interpret black-box models.
  - response: >-
      To produce ethical, AI-ready datasets of cell architecture that can be reused by the
      research community under minimally restrictive terms consistent with ethical
      guidelines, researcher attribution and research integrity.

addressing_gaps:
  - response: >-
      In genomics and precision medicine, machine learning models are often black boxes that
      predict phenotypes from genotypes without conveying the mechanisms by which such
      translation occurs. CM4AI addresses this by supplying cell architecture maps on which
      interpretable models can be built.
  - response: >-
      Existing training resources for a biomedical workforce adept at both the data and life
      sciences are limited; CM4AI addresses this by broadly distributing its data and tools
      with accompanying training material.
  - response: >-
      Cell mapping technologies have typically been applied separately. CM4AI addresses the
      gap by generating matched protein-protein interaction, spatial localization and genetic
      perturbation data on the same cell lines and conditions so that the modalities can be
      integrated.

tasks:
  - response: >-
      Construct hierarchical maps of subcellular architecture, represented as directed acyclic
      graphs whose nodes are assemblies of proteins in proximity at a given scale, spanning
      large assemblies such as cell compartments down to small protein complexes and subunits.
  - response: >-
      Train and interrogate visible machine learning systems, including visible neural networks,
      that use cell maps to relate protein assemblies to cell-level phenotype predictions.
  - response: >-
      Analyze cell architectural changes and interactions in the presence of specific disease
      processes, treatment conditions or genetic perturbations.
  - response: >-
      Support interpretation of genetic variants and mutations in human genomics by mapping
      them onto protein assemblies.

intended_uses:
  - use_category: AI-ready datasets to support research in functional genomics
  - use_category: AI model training
  - use_category: Cellular process analysis
  - use_category: >-
      Cell architectural changes and interactions in presence of specific disease processes,
      treatment conditions, or genetic perturbations

other_tasks:
  - task_details: >-
      Integrative structure modeling of protein assemblies: the project reports a
      bioinformatics pipeline that annotates MuSIC communities with the available structural
      information about community members and their interactions, drawing on the Protein Data
      Bank, the AlphaFold Protein Structure Database, crosslinking mass spectrometry and
      prediction of disordered sequence segments, then ranks communities by the feasibility
      of integrative structure modeling.
  - task_details: >-
      Construction of new cell maps for other cell subtypes and disease states, using the
      released Cell Mapping Toolkit as a flexible and generalizable framework that lets
      researchers integrate additional input modalities.

existing_uses:
  - examples: >-
      The genome-scale CRISPRi perturbation data generated in KOLF2.1J induced pluripotent
      stem cells have been analyzed in "A Perturbation Cell Atlas of Human Induced Pluripotent
      Stem Cells" (Nourreddine S et al., bioRxiv 2024, doi 10.1101/2024.11.03.621734), which
      maps transcriptional and fitness phenotypes for 11,739 targeted genes and reports
      validation via phenotypic, protein-interaction and metabolic tracing assays.
  - examples: >-
      CM4AI datasets, tools and standards were distributed with detailed tutorials at a CM4AI
      CodeFest held in March 2024, which provided training to 38 registrants and served as an
      end-to-end demonstration of the platform from data generation to AI-readiness packaging.

discouraged_uses:
  - discouragement_details: >-
      Analyses that depend on integrated, computed cell maps are not supported by this release.
      Predicted cell maps are not included and will be added in future releases; the current
      release is most suitable for bioinformatics analysis of the individual datasets.
  - discouragement_details: >-
      Cross-modality integration should be undertaken with care. The SEC-MS protein-protein
      interaction data, the immunofluorescence protein localization data and the CRISPRi
      Perturb-seq data interrogate sets of proteins that incompletely overlap, so joint
      analyses will not cover the same proteins across modalities.

prohibited_uses:
  - prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.
  - prohibition_reason: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 license under which the data
      are distributed. The CM4AI preprint states that commercial use requires a separate license
      negotiation with the copyright holder, which is UCSD, Stanford and/or UCSF depending on
      the specific data package in question.

future_use_impacts:
  - impact_details: >-
      The project anticipates that its datasets and maps will underpin a new generation of
      interpretable, explainable biomedical AI, deepening understanding of processes of human
      disease and health, enabling development of novel cures, and assisting researchers and
      clinicians in equitably improving human lives.
  - impact_details: >-
      Because the released data derive from two commercially available de-identified human cell
      lines, models trained on them may not generalize to the biological variation present in
      the wider population; the release records this as a potential source of bias for users.
  - impact_details: >-
      The project states that its ethical obligations include anticipating potential applications
      of the data and derived AI/ML systems, integrating them into data governance frameworks to
      optimize benefits and mitigate potential risks, and promoting their use for the collective
      good.

known_limitations:
  - limitation_type: scope_limitation
    limitation_description: >-
      This is an interim Beta release. The data are not yet in completed final form and some
      component datasets remain under temporary pre-publication embargo.
    recommended_mitigation: >-
      Consult later quarterly releases; the dataset is updated and augmented through the end of
      the project in November 2026.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Computed cell maps are not included in this release; predicted cell maps will be added in
      future releases.
    scope_impact: >-
      Users cannot yet perform analyses that rely on the integrated hierarchical cell map output
      of the MuSIC pipeline.
  - limitation_type: integration_limitation
    limitation_description: >-
      The protein-protein interaction (SEC-MS), protein localization (immunofluorescence imaging)
      and CRISPRi Perturb-seq data interrogate sets of proteins which incompletely overlap.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The release requires domain expertise for meaningful analysis and is most suitable, in its
      current state, for bioinformatics analysis of the individual component datasets rather than
      for turnkey integrated use.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Data in this release were derived from commercially available de-identified human cell
      lines and do not represent all biological variants which may be seen in the population at
      large. Two donors are represented in total, one for each cell line.
    mitigation_strategy: >-
      The release documents this limitation explicitly so that users can scope conclusions and
      model claims accordingly.
  - bias_type: selection_bias
    bias_description: >-
      Molecular targets were chosen as a designed panel rather than sampled at random. CM4AI set
      out to interrogate 100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
      neuropsychiatric and cardiac disorders, with spatial proteomics mapping extended to their
      interactors and to key signaling molecules involved in cancer. The genome-scale CRISPRi
      Perturbation Cell Atlas in KOLF2.1J iPSCs is an exception, targeting 11,739 expressed genes.
    affected_subsets:
      - >-
        Affinity purification-mass spectrometry, immunofluorescence imaging and the 200-gene
        MDA-MB-468 Perturb-seq screen.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The release records that the work does not involve human subjects, that samples are
      de-identified and that the data are not FDA regulated. The CM4AI preprint states that the
      project's data are non-clinical, generated from tissue cultures, and are considered to be
      de-identified because they cannot be matched, with current knowledge, to a human subject.
      Donor-level descriptors of the source cell lines are published in the cell-line literature
      cited by the project but are not linkable to an identifiable individual through these data.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Some component datasets are under temporary pre-publication embargo rather than openly
      released. In the June 2026 release the external Perturb-seq deposits for KOLF2.1J iPSCs
      and for MDA-MB-468 cells are listed as embargoed instead of being linked to an open
      repository entry. All ten files distributed from the University of Virginia Dataverse in
      this release are marked as public.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    No de-identification procedure was applied to the released measurements because they were
    generated from commercially sourced, already de-identified immortalized and induced
    pluripotent human cell lines rather than from identifiable human subjects.
  deidentification_details: >-
    The release records "Human Subjects: No" and "De-identified Samples: Yes". The CM4AI preprint
    states that CM4AI data are distinctive within Bridge2AI in that they are non-clinical, coming
    from tissue cultures, and are considered to be de-identified as they cannot be matched, with
    current knowledge, to a human subject.

human_subject_research:
  involves_human_subjects: false
  irb_approval:
    - >-
      Not applicable; the release records that the work does not involve human subjects, so no
      institutional review board approval is recorded for the data generation.
  ethics_review_board: >-
    Ethical oversight for CM4AI is provided by the project's Ethics module. The release names
    Vardit Ravitsky and Jean-Christophe Belisle-Pipon as the ethical review contacts.
  regulatory_compliance:
    - >-
      The release records that the data are not FDA regulated and that samples are de-identified.

ethical_reviews:
  - reviewing_organization: CM4AI Ethics Module
    contact_person:
      id: ORCID:0000-0002-7080-8801
      name: Vardit Ravitsky
    review_details: >-
      Named as an ethical review contact for the CM4AI data release, reachable at
      ravitskyv@thehastingscenter.org.
    source_caveats: >-
      The Dataverse author list gives this person's affiliation as University of Montreal, while
      the governance contact email is at thehastingscenter.org; the CM4AI data releases page lists
      the Hastings Center among the collaborating institutions.
  - reviewing_organization: CM4AI Ethics Module
    contact_person:
      id: ORCID:0000-0002-8965-8153
      name: Jean-Christophe Belisle-Pipon
    review_details: >-
      Named as an ethical review contact for the CM4AI data release, at Simon Fraser University,
      reachable at jean-christophe_belisle-pipon@sfu.ca.
  - reviewing_organization: CM4AI Ethics Module
    review_details: >-
      The Ethics module works with the Data Acquisition, Tools and Standards modules on a plan for
      ethical preparation, licensing, dissemination and data access supervision that balances
      openness of the data with protection of intellectual property and supervision of potential
      commercialization. It employs a methodology inspired by Value-Sensitive Design, is building
      an axiological repository of values to guide design standards and expectations, and is
      formulating a CM4AI Life Cycle framework that sets out governance milestones through the
      data generation and AI system development processes.

data_governance:
  committee_name: Data Governance Committee
  committee_contact:
    name: Jillian Parker
  accountable_organization:
    name: University of California San Diego
  access_review_process: >-
    Files published in the University of Virginia Dataverse release are marked public and are
    downloadable without an access request under the CC BY-NC-SA 4.0 license, subject to the
    repository's per-download size limits and its Data Access API for programmatic retrieval. The
    CM4AI preprint states that a Data Access Committee supervises ethical matters related to
    dataset distribution and to potential dual licensing for commercial use, and that participants
