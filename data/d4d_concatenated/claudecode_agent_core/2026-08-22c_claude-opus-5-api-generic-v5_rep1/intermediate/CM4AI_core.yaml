distribution_formats:
  - format: ZIP archive
    media_type: application/zip
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    notes: >-
      All ten files in the June 2026 release are distributed as ZIP archives from the University of
      Virginia Dataverse. The repository states that the dataset as a whole is too large to download
      in a single operation, that individual files below the per-download size limit can be selected
      from the files table, and that the Dataverse Data Access API provides programmatic access to
      the files.
  - format: RO-Crate research object package
    media_type: application/json
    notes: >-
      Release metadata is packaged as RO-Crates containing datasets, metadata and software or
      resolvable references to them, with persistent identifiers assigned by the FAIRSCAPE server
      under the ARK scheme. Persistent identifiers resolve to machine- and human-readable landing
      pages carrying JSON-LD metadata expressed with vocabularies from Schema.org, the EVI Evidence
      Graph Ontology and other public ontologies, and provenance is additionally serialized as
      JSON-LD and RDF-XML.
    source_caveats: >-
      The schema's media_type enumeration has no term for JSON-LD; application/json is the nearest
      permitted value for these RO-Crate JSON-LD metadata packages.

distribution_dates:
  - release_dates: >-
      Files published 2026-06-17, with the three immunofluorescence image archives published
      2026-07-15; the Dataverse record gives a publication date of 2026-06-17 for the release.
    notes: >-
      Preceding releases in the series were published on 2025-03-03, 2025-07-01 and 2025-10-31, and
      a May 2024 release is listed in the project archive. CM4AI releases data quarterly.

raw_data_sources:
  - source_description: >-
      Raw immunofluorescence confocal microscopy images of MDA-MB-468 cells stained with Human
      Protein Atlas antibodies against a protein of interest together with reference markers for
      nucleus, endoplasmic reticulum and microtubules.
    source_type: Spatial proteomics imaging
    raw_data_format: Multi-channel confocal microscopy images distributed as ZIP archives
    access_details: >-
      Distributed directly in the University of Virginia Dataverse release as three public ZIP
      archives, one per treatment condition.
  - source_description: >-
      Raw mass spectrometry files from size-exclusion chromatography-mass spectrometry of KOLF2.1J
      iPSCs and iPSC-derived cell types and of MDA-MB-468 cells with and without treatment.
    source_type: Mass spectrometry
    access_details: >-
      Deposited in the MassIVE repository and linked from the release page; processed SEC-MS
      packages are distributed in the Dataverse release.
  - source_description: >-
      Raw mass spectrometry files from affinity purification-mass spectrometry of paclitaxel-treated
      and vorinostat-treated MDA-MB-468 cells.
    source_type: Mass spectrometry
    access_details: >-
      Deposited in the MassIVE repository as two separate deposits, one per treatment, and linked
      from the release page.
  - source_description: >-
      Raw single-cell sequencing reads from CRISPRi Perturb-seq screens in KOLF2.1J induced
      pluripotent stem cells and in MDA-MB-468 cells.
    source_type: Single-cell RNA sequencing
    raw_data_format: Sequence Read Archive submission
    access_details: >-
      The June 2026 release distributes a cm4ai_perturb-seq_KOLF2_raw_sra.zip package. The June 2025
      release linked raw sequence data to an NCBI BioProject in the Sequence Read Archive; in the
      June 2026 release the Perturb-seq deposits for KOLF2.1J iPSCs and for MDA-MB-468 cells are
      listed as embargoed.

