      Pluripotent Stem Cells", bioRxiv 2024, doi 10.1101/2024.11.03.621734, PMCID PMC11580897.
  - external_resources: >-
      Schaffer LV et al., "Multimodal cell maps as a foundation for structural and functional
      genomics", Nature 642:222-231 (2025), doi 10.1038/s41586-025-08878-3, with its Multiscale
      Integrated Cell visualization portal at http://musicmaps.ai/u2os-cellmap/.
    notes: >-
      This article reports a multimodal cell map of U2OS osteosarcoma cells built with the same
      cell-mapping approach and acknowledging the same Bridge2AI award (OT2 OD032742). It describes
      a dataset distinct from the CM4AI cell-line data releases described in this record.

