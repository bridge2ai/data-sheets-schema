      The CM4AI project portal at https://cm4ai.org, providing project documentation, data release
      listings, tools, product documentation, publications and training material. Project-related
      inquiries go to the program manager at snthaker@uab.edu; website support and updates to
      zsembay8@uab.edu.
    notes: >-
      The portal carries a notice that the repository is under review for potential modification in
      compliance with Administration directives.
  - external_resources: >-
      The Cell Mapping Toolkit, released as a series of pip-installable Python packages at
      https://github.com/idekerlab/cellmaps_pipeline with full user documentation at
      https://cellmaps-pipeline.readthedocs.io/, implementing the end-to-end cell mapping pipeline
      including image and protein-protein interaction download, embedding, co-embedding, hierarchy
      generation and hierarchy evaluation.
    restrictions:
      - >-
        Alpha-level tools are released in GitHub and production-ready tools in the Zenodo long-term
