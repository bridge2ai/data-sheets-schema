id: doi:10.18130/V3/HIGT4C
name: Cell Maps for Artificial Intelligence (CM4AI)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Bridge to Artificial Intelligence
  (Bridge2AI) program. Its quarterly data releases provide AI-ready, multimodal measurements
  of human cell architecture, generated so that machine-readable hierarchical maps of
  cell structure can be built and applied to the challenge of interpretable genotype-phenotype
  learning. This record describes the June 2026 Data Release (Beta), version 2.0, published
  in the University of Virginia Dataverse under doi 10.18130/V3/HIGT4C. The release covers
  two disease-relevant human cell lines under perturbed and unperturbed conditions: the
  triple-negative breast cancer line MDA-MB-468, untreated and treated with paclitaxel
  or with vorinostat, and the KOLF2.1J induced pluripotent stem cell line, undifferentiated
  and differentiated into neural progenitor cells, neurons and cardiomyocytes. Four measurement
  modalities are represented: single-cell CRISPRi Perturb-seq for MDA-MB-468 cells with
  and without treatment and for undifferentiated KOLF2.1J iPSCs; size-exclusion chromatography-mass
  spectrometry (SEC-MS) protein-protein interaction data for MDA-MB-468 cells with and
  without treatment and for undifferentiated KOLF2.1J iPSCs and iPSC-derived neural progenitor
  cells, neurons and cardiomyocytes; affinity purification-mass spectrometry (AP-MS) data
  for treated MDA-MB-468 cells; and immunofluorescence confocal images of MDA-MB-468 cells
  with and without treatment. Ten ZIP archives totalling approximately 12.6 GB are distributed
  from the repository, while larger raw mass spectrometry and sequencing deposits are held
  in external repositories. Release outputs are packaged with provenance graphs and rich
  metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework, and the
  integration pipeline that turns these input streams into hierarchical cell maps is the
  Multi-Scale Integrated Cell (MuSIC) toolkit. Computed cell maps are not included in this
  release. The CM4AI project portal reports cumulative project totals of 1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739
  genes targeted and 21.4 TB of data volume. CM4AI is a collaboration of the University
  of California San Diego, the University of California San Francisco, Stanford University,
  the University of Virginia, Yale University, the University of Texas at Austin, the University
  of Alabama at Birmingham, Simon Fraser University and the Hastings Center.
