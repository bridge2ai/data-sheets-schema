funders:
  - grantor: National Institutes of Health Common Fund
    grants:
      - name: OT2OD032720
        description: >-
          Bridge2AI: Voice as a Biomarker of Health - Building an ethically sourced, bioacoustic database
          to understand disease like never before. Core project number under the NIH Common Fund
          Bridge2AI program, awarded to the University of South Florida with Yael Bensoussan as
          principal investigator; project period 1 September 2022 to 30 November 2026, with a fiscal
          year 2025 award amount of 4,660,942 US dollars recorded for application 3OT2OD032720-01S3.
    notes: >-
      The PhysioNet releases acknowledge NIH project number 3OT2OD032720-01S1 as the funding source for
      the dataset itself.

purposes:
  - response: >-
      To create a flagship, standardized and ethically sourced dataset of 10,000 voices linked to health
      information to fuel research and discovery in voice biomarkers.
  - response: >-
      To generate a large multi-institutional, ethically sourced and diverse voice dataset linked to
      multimodal health biomarkers, so that voice can be integrated as a biomarker of health in clinical
      care.
  - response: >-
      To enable the development, benchmarking and validation of clinically applicable machine-learning
      models for diagnosing a wide range of health conditions using voice data, including vocal
      pathologies and neurological, psychiatric, respiratory and pediatric voice disorders.
  - response: >-
      To support the establishment of bioinformatic standards for voice data and an infrastructure for
      audiomic data storage and sharing within and across research institutions.

addressing_gaps:
  - response: >-
      A gap in the availability of large-scale, diverse and well-documented voice data for clinical
      machine-learning applications. Previous studies on machine-learning based voice diagnosis produced
      promising results, but their sample sizes were too small or they lacked the key metadata needed
      for training robust, clinically useful models.
  - response: >-
      A lack of standards for how voice and speech data are collected, which makes comparing studies and
      pooling data difficult and precludes meta-analysis.
  - response: >-
      The privacy of industry-held voice datasets, which limits the ability to audit machine-learning
      models and the accuracy of training data labels, and prevents external auditing of training data
      for fair representation of diverse populations.
  - response: >-
      The limited size, quality and diversity of existing open-source voice datasets, which contributes
      to the absence of validated and regulator-approved artificial intelligence algorithms for disease
      detection and monitoring from voice.

tasks:
  - response: >-
      Disease detection and classification from voice, using diagnostic labels spanning vocal
      pathologies, neurological disorders, psychiatric conditions and respiratory disorders.
  - response: >-
      Screening, diagnosis and monitoring of health conditions using voice as a non-invasive,
      cost-effective biomarker.
  - response: >-
      Pretraining, fine-tuning, benchmarking and validation of artificial intelligence and
      machine-learning models on acoustic and linked phenotypic data.

acquisition_methods:
  - acquisition_details: >-
      Acoustic tasks - voice, speech, breathing and cough - were recorded prospectively from
      participants in clinic using a custom application, and were directly observed by research staff.
    was_directly_observed: true
  - acquisition_details: >-
      Demographic information, voice confounders such as smoking and hydration status, and validated
      patient-reported outcome questionnaires were completed by the participants themselves.
    was_reported_by_subjects: true
  - acquisition_details: >-
      Clinical diagnoses were verified by clinicians reviewing audio and/or imaging data, consulting
      electronic health records, or checking active medication prescriptions, against gold-standard
      validation methods defined per cohort (for example laryngoscopy and stroboscopy for voice
      disorders, spirometry and flow volume loops for airway conditions, brain CT or MRI for
      neurological conditions, and psychiatrist diagnosis with medication history for psychiatric
      conditions).
    was_validated_verified: true
  - acquisition_details: >-
      All acoustic content in the public release is derived from the raw waveforms by computational
      feature extraction rather than distributed directly, including spectrograms, Mel spectrograms,
      Mel-frequency cepstral coefficients, pitch, articulatory estimates and phonetic posteriorgrams.
    was_inferred_derived: true

collection_mechanisms:
  - mechanism_details: >-
      A custom Bridge2AI-Voice smartphone/tablet application hosting the data acquisition protocols,
      used in clinic on study iPads (9th or 10th generation) and iPad Air (5th generation) with an Avid
      AE-36 microphone connected by an Apple dongle, with participants wearing a head-mounted headset
      with microphone where possible.
  - mechanism_details: >-
      ReproSchema-UI, used with the Bridge2AI-Voice pediatric protocol for pediatric data collection.
  - mechanism_details: >-
      REDCap, used for the data acquisition instruments, the shared data dictionary and metadata, and
      for uploading multimodal data extracted independently at each site.
  - mechanism_details: >-
      Bridge2AI Voice Web app and Bridge2AI Voice iOS app for remote data collection, and a Bridge2AI
      Enrollment Web app for remote enrollment. No software is downloaded or installed; data are held
      only during the collection phase and transmitted over a secure HTTPS protocol to a HIPAA-compliant
      storage server hosted by an NIH STRIDES partner.

collection_timeframes:
  - timeframe_details: >-
      The healthsheet accompanying the dataset states that the data was collected over a period of
      twelve months. Data collection is ongoing under a project period running from 1 September 2022 to
      30 November 2026.
    source_caveats: >-
      The twelve-month statement is drawn from the healthsheet published with the project documentation
      and describes an earlier release; no explicit collection start or end date is stated for version
      3.1.0.

data_collectors:
  - role: research team
    collector_details: >-
      Research teams, which may include medical, graduate or undergraduate students, coordinated with
      clinicians to identify appropriate participants and administered the collection protocol in
      clinic. Trained research assistants introduced the application, obtained consent and supervised
      task completion.
  - role: clinician
    collector_details: >-
      Clinicians and doctors listed as co-investigators under the IRB provided the clinical diagnoses
      used as gold-standard labels. They were not paid for this contribution but were added to the
      consortium so that their names are included on consortium-level publications arising from the
      research.
  - role: hospital staff
    collector_details: >-
      Hospital staff were not involved in scheduling but assisted with the logistics of coordinating
      data collection.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from the individuals in question. Acoustic and questionnaire data
      were captured from participants in clinic; clinical validation information was additionally
      extracted from the participants' electronic health records by site investigators under the
      consented protocol.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies:
      - >-
        Non-probability sampling. Participants were recruited at high-volume expert clinics within
        academic institutions on the basis of a known diagnosis in one of five cohort categories, and
        screened against per-diagnosis inclusion and exclusion criteria before their visit.
      - >-
        Participants without the conditions of interest were also recruited to serve as controls.
      - >-
        Recruitment additionally used flyers in well-trafficked areas, QR codes linking to a secure
        REDCap screening survey, approach of individuals in waiting rooms at approved facilities, social
        media platforms, the project websites, and the FlowTrials platform. Where specific diagnoses or
        severities were under-represented, participants were identified by medical record review.
    why_not_representative: >-
      The data is not representative because it was collected at a limited number of geographic
      locations. The consortium states it hopes to make the dataset more representative by shifting to
      remote collection and by designing recruitment to control for more variables.
    source_data: >-
      Patients and healthy volunteers presenting at specialty clinics and institutions participating in
      the Bridge2AI-Voice consortium in the United States and Canada.

instances:
  - instance_type: human participant
    counts: 833
    data_topic: B2AI_TOPIC:25
    label: true
    label_description: >-
      Each participant is associated with clinician-assigned diagnostic labels recorded in per-condition
      diagnosis tables, or is recorded in the control table. Labels follow the Bridge2AI protocols and
      ICD-10 codes.
    notes: >-
      Each instance represents a person. A participant may have more than one recording session, so
      there may be more than one row per participant in the session-level tables, and responses for the
      same data element may vary across sessions.
  - instance_type: acoustic recording represented by derived features
    data_substrate: B2AI_SUBSTRATE:49
    data_topic: B2AI_TOPIC:36
    notes: >-
      Voice, speech, breathing and cough recordings, released as derived feature tensors rather than as
      waveforms. Per-feature record counts in version 3.1.0 range from 28,640 for sparc electromagnetic
      articulography to 32,522 for torchaudio pitch; spectrograms, Mel spectrograms and Mel-frequency
      cepstral coefficients each cover 29,278 recordings and phonetic posteriorgrams 29,289.
  - instance_type: questionnaire and clinical record
    data_substrate: B2AI_SUBSTRATE:80
    data_topic: B2AI_TOPIC:31
    notes: >-
      Demographic, confounder, enrollment, per-condition diagnosis and validated questionnaire records
      held as tab-separated tables with accompanying JSON data dictionaries.

relationships:
  - relationship_details: >-
      The healthsheet states that individual instances are unrelated to one another. Within the file
      layout, feature, metadata and phenotype records are linked by a pseudonymous participant
      identifier and, where applicable, a session identifier and task name, so that all recordings and
      responses belonging to one participant can be assembled.

splits:
  - split_details: >-
      No recommended train, validation or test splits are provided. Researchers are encouraged to create
      their own data splits based on their specific requirements, and to consider the multivariate
      distribution of disorder category, site and demographic factors when doing so.

subsets:
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#cohort-voice-disorders
    name: Voice disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants recruited for laryngeal and phonatory conditions, comprising laryngeal cancer,
      laryngitis, pre-cancerous lesions, benign lesions of the vocal cord, muscle tension dysphonia,
      laryngeal dystonia and vocal tremor, unilateral vocal fold paralysis, and glottic
      insufficiency/presbyphonia. Gold-standard validation is by laryngoscopy images and stroboscopy
      videos, with CT and spirometry additionally used for vocal fold paralysis.
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#cohort-respiratory-disorders
    name: Respiratory disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants recruited for airway stenosis (bilateral vocal fold paralysis, supraglottic, glottic,
      posterior glottic, subglottic, tracheal and multi-level upper airway stenosis) and unexplained
      chronic cough, together with COPD and asthma. Gold-standard validation is by spirometry with flow
      volume loops and CT of the neck or chest.
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#cohort-neurological-disorders
    name: Neurological and neurodegenerative disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants aged 44 to 85 with a clinical diagnosis of mild cognitive impairment, Alzheimer's
      disease, other dementias, amyotrophic lateral sclerosis, or Parkinson's disease and related
      parkinsonian syndromes. Gold-standard validation is by brain CT, brain MRI and whole genome
      sequencing, with serum p-tau additionally used for Alzheimer's disease.
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#cohort-mood-psychiatric-disorders
    name: Mood and psychiatric disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with an existing clinical diagnosis of depression or major depressive disorder,
      anxiety disorder, or bipolar disorder, and participants with comorbid conditions including alcohol
      or substance use disorder, ADHD, autism spectrum disorder, borderline personality disorder, eating
      disorder, insomnia or sleep disorder, obsessive-compulsive disorder, panic disorder,
      post-traumatic stress disorder, schizophrenia and social anxiety disorder. Validation is by
      electronic health summary, clinical diagnosis from a psychiatrist, and medication history.
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#cohort-controls
    name: Controls
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants not diagnosed or treated for a voice, respiratory, mood or neurological disorder
      affecting voice, cough, breath or speech, who complete the same demographic, confounder and
      acoustic protocol and are recorded in the control table.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Demographic subpopulations are identified from self-reported responses to the demographics
      questionnaire, covering age, gender, sex, ethnicity and socioeconomic status.
    distribution: >-
      The distribution across these subpopulations is not quantified in the published documentation. The
      dataset is stated to have skews based on disorder category, site and other demographic factors,
      and users are advised to consider the multivariate distribution when assessing utility.
  - subpopulation_elements_present: true
    identification: >-
      Disease cohort membership is identified by the per-condition diagnosis tables and by the control
      table.
    distribution: >-
      The public data releases do not contain an equal distribution of the five disease cohort
      categories; further releases are stated to contain additional data.

anomalies:
  - anomaly_details: >-
      Different sites have different collection configurations, and the collection protocol changed over
      the course of the study. Distinct iPad devices were used at each site.
  - anomaly_details: >-
      Recordings were made with a head-mounted headset with a microphone that could be at slightly
      different distances from the mouth, introducing variation in level and signal characteristics
      between recordings.
  - anomaly_details: >-
      Noise artifacts, variations in diagnostic practices, inaccurate questionnaire responses and
      underreporting are named as confounding factors present in the data.
  - anomaly_details: >-
      Some audio files, whether because of length or other issues, could not generate certain features
      and are therefore absent from the corresponding feature bundles, so per-feature record counts
      differ across the released Parquet files.
  - anomaly_details: >-
      Transcriptions were generated using an off-the-shelf speech recognition model that has not been
      audited for correctness.
  - anomaly_details: >-
      Version 3.0.0 contained broken Parquet files, which were fixed in version 3.1.0; spectrograms in
      version 1.1 contained minor issues that were corrected by reprocessing for version 2.0.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset is a non-probability sample collected at a limited number of geographic locations and
      is not representative of a larger population. Groups with less trust in the medical system or in
      artificial intelligence, or who are less proximal to the collection sites, would have been less
      likely to be recruited.
    scope_impact: >-
      Models trained on the dataset may not generalize to populations, settings or recording conditions
      unlike those sampled.
    recommended_mitigation: >-
      Consider the multivariate distribution of disorder category, site and demographic factors when
      assessing the dataset's utility for a given question.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Data collection was conducted with fluent English speakers only; participants who did not read or
      speak English were excluded. Spanish protocols and Spanish-language data collection are under
      development and are not part of this release.
  - limitation_type: scope_limitation
    limitation_description: >-
      The public releases do not contain an equal distribution of the five disease cohort categories.
      Other multimodal data collected under the protocol - imaging, genomic data for the neurological
      cohort, laryngoscopy imaging and other electronic health record data - is not included in the
      releases described here.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Raw audio waveforms are not part of the public release; only derived features are distributed.
      Spectrograms, Mel spectrograms, Mel-frequency cepstral coefficients, phonetic posteriorgrams and
      electromagnetic articulography estimates for sensitive records, for audio checks and for
      free-speech tasks have been removed, so open-response speech cannot be reconstructed or analyzed
      at those representations.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Changes in diagnostic criteria or practices over the collection period could be a source of
      distribution shift within the dataset.
  - limitation_type: resolution_limitation
    limitation_description: >-
      Spectrograms were downsampled by a factor of two in the time domain after derivation, reducing the
      temporal resolution available relative to the underlying 10 ms hop length.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants were recruited from high-volume expert clinics at a small number of academic sites,
      so the dataset reflects patients who reach specialist care. Groups with less trust in the medical
      system or in artificial intelligence, or who live further from collection sites, were less likely
      to be recruited.
    mitigation_strategy: >-
      The consortium states it intends to shift to remote collection and to design its recruiting
      approach to control for more variables, and to expand to community outreach clinics representing
      underserved populations.
  - bias_type: sampling_bias
    bias_description: >-
      The sampling method is a non-probability sample of an ongoing larger collection, not a random
      sample of any defined population.
  - bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders based on site, so cohorts also had their data
      collected on different devices and with different collection configurations; recording distance
      varied with the head-mounted headset.
    affected_subsets:
      - Disease cohorts recruited predominantly at a single site
  - bias_type: representation_bias
    bias_description: >-
      The dataset has skews based on disorder category, site and other demographic factors, and includes
      only English-speaking participants for this release.
  - bias_type: annotation_bias
    bias_description: >-
      Diagnostic labels were assigned by a single clinician per participant, and the clinician was
      typically the one at the site of data collection or, for prior diagnostic assessments, external to
      it. Human-level performance in the applications the dataset addresses is stated to vary widely.
    mitigation_strategy: >-
      Labeling followed the Bridge2AI protocols and ICD-10 codes, with per-cohort gold-standard
      validation methods defined in the collection protocol.

content_warnings:
  - content_warnings_present: true
    warnings:
      - >-
        The dataset covers mental health conditions, including depression, bipolar disorder,
        post-traumatic stress disorder and substance use disorder, and includes responses to validated
        questionnaires on mood, anxiety and traumatic experience.
      - >-
        Free speech tasks are open-ended and their content cannot be fully controlled, because research
        participants are responsible for their choice of language; material that some readers would find
        offensive cannot be completely ruled out.
    source_caveats: >-
      The warning about free speech content is stated in the healthsheet with reference to transcriptions
      of free speech tasks. Transcripts of free speech audio were removed from the release from version
      1.1 onward, and features derived from free speech tasks were removed from version 2.0 onward.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet records that the released dataset does not contain data that might be considered
      confidential, such as data protected by legal privilege or by doctor-patient confidentiality, or
      the content of individuals' non-public communications.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes race and ethnic origin information.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes sexual orientation information.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes socioeconomic and health information, including clinical diagnoses across
      voice, respiratory, neurological and psychiatric conditions.
  - sensitive_elements_present: false
    sensitivity_details: >-
      Raw voice recordings, which are biometric data capable of identifying an individual, were removed
      from the public release. All sensitive fields encoded as identifiers in the REDCap data dictionary
      were removed at the de-identification stage, together with data revealing highly sensitive
      information such as household income, mental health status and traumatic life experiences.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor de-identification supplemented by ethicist-led removal of indirect identifiers and
    of highly sensitive non-identifying elements, and by withholding of all raw audio.
  identifiers_removed:
    - Names
    - Geographic locators, including state and province; country of data collection is retained
    - Date information at a resolution finer than years
    - Phone and fax numbers
    - Email addresses
    - IP addresses
    - Social Security Numbers
    - Medical record numbers
    - Health plan beneficiary numbers
    - Device identifiers
    - License numbers
    - Account numbers
    - Vehicle identifiers
    - Website URLs
    - Full face photographs
    - Biometric identifiers, including all raw voice recordings
    - Civic addresses
    - Narrative free-text fields
    - Selected indirect geographic and demographic identifiers, and information on household composition and cultural identity
    - Non-identifying but highly sensitive elements including household income, mental health status and traumatic life experiences
  deidentification_details: >-
    Direct identifiers were removed because they would reveal the identity of the research participant.
    Indirect identifiers were removed where they created a significant risk of re-identification, for
    example through combination with public data available on social media or in government registries.
    Raw audio transcripts were reviewed and any audio recordings containing potentially identifying
    information or external voices were removed from the release. All fields flagged as identifiers in
    the REDCap data dictionary were removed. Spectrograms, Mel spectrograms, Mel-frequency cepstral
    coefficients, transcriptions, electromagnetic articulography estimates and phonetic posteriorgrams
    derived from open-response prompts were removed from the feature-only dataset. The dataset removes
    direct identifiers, applies the HIPAA de-identification rules, rebases or replaces dates by integers,
    removes or generalizes geographic information and removes narrative text fields, but does not achieve
    K-anonymization at k greater than or equal to two.

cleaning_strategies:
  - cleaning_details: >-
      No pre-processing was performed for the purpose of cleaning the data. Quality control is instead
      applied through an audit protocol that generates missingness tables, checks distributions and
      outliers, validates categorical responses against the schema, and runs quality control metrics on
      audio tasks. For waveforms the audit checks the amount of silence and the duration, and for speech
      tasks it checks the produced speech against the intended passage. From version 3.1.0 the resulting
      audio quality metrics are released alongside the features. All processing is performed with the
      b2aiprep and SenseLab toolkits.
  - cleaning_details: >-
      No instances were excluded from the dataset at the time of preprocessing.

preprocessing_strategies:
  - preprocessing_details: >-
      Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a Butterworth
      anti-aliasing filter applied.
  - preprocessing_details: >-
      Spectrograms were computed from the standardized audio using the short-time Fast Fourier Transform
      with a 25 ms window size, 10 ms hop length and a 400-point FFT, then downsampled by a factor of two
      in the time domain.
  - preprocessing_details: >-
      Sixty Mel-frequency cepstral coefficients were extracted from the spectrograms, and Mel
      spectrograms were computed with the same window, hop and FFT parameters over 60 Mel bins.
  - preprocessing_details: >-
      Articulatory features were generated with the Speech Articulatory Coding (sparc) package, giving
      kinematic traces of vocal tract articulators and source features together with loudness,
      periodicity and pitch measures, all gathered at 50 Hz.
  - preprocessing_details: >-
      Acoustic features were extracted with openSMILE, capturing temporal dynamics and acoustic
      characteristics, including eGeMAPS features per audio file.
  - preprocessing_details: >-
      Phonetic and prosodic features were computed with Parselmouth and Praat, providing measures of
      fundamental frequency, formants and voice quality, along with speech intelligibility metrics for
      speech tasks.
  - preprocessing_details: >-
      Phonetic posteriorgrams, a time-varying categorical distribution over acoustic units of speech,
      were generated at 100 Hz via the ppgs package.
  - preprocessing_details: >-
      Transcriptions were generated using the OpenAI Whisper Large model.
  - preprocessing_details: >-
      Raw audio files and questionnaire data retrieved from ReproSchema-UI or exported from REDCap were
      converted to be compliant with the Brain Imaging Data Structure v1.9.0.
  - preprocessing_details: >-
      Waveform-derived features are stored in two formats: a fixed feature format holding static features
      extracted from the entire waveform, and a temporal format whose length varies with the duration of
      each recording.

labeling_strategies:
  - labeling_details: >-
      Diagnostic labels are the result of a clinical assessment of the participant. At each site a local
      clinician provided the diagnosis based on a clinical interview and appropriate work-up. For the
      psychiatric disorders cohort the assessment was determined from the participant's electronic health
      record or an active prescription, made outside of data collection by an appropriately licensed
      clinician. The labeling strategy is a gold-standard label available in the data.
    annotations_per_item: 1
    annotator_demographics:
    - >-
      Typically the clinician at the site of data collection, or a clinician external to the study who
      made the prior diagnostic assessment. No further demographic characterization of labelers is
      published.
    data_annotation_protocol: >-
      Labeling followed the Bridge2AI-Voice protocols and ICD-10 codes, with per-cohort gold-standard
      validation methods specified in the collection protocol.

machine_annotation_tools:
  - tools:
      - OpenAI Whisper Large
      - openSMILE
      - Praat
      - parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - ppgs
      - b2aiprep
      - SenseLab
    tool_descriptions: >-
      Whisper Large generated transcriptions. openSMILE produced eGeMAPS and other acoustic features.
      Praat, accessed through parselmouth, produced phonetic and prosodic measures. torchaudio produced
      pitch contours, spectrograms, Mel spectrograms and Mel-frequency cepstral coefficients. The sparc
      package produced electromagnetic articulography estimates together with loudness, periodicity and
      pitch. The ppgs package produced phonetic posteriorgrams. b2aiprep organized and preprocessed the
      dataset and merged source data into the phenotype files; SenseLab processed audio files for
      research tasks. Version 3.1.0 was generated with b2aiprep v3.0.0.
    tool_accuracy:
    - >-
      Certain aspects of the data, such as transcription, were generated using off-the-shelf models that
      have not been audited for correctness.

raw_sources:
  - raw_data_details: >-
      Raw audio waveforms in WAV format, captured through the Bridge2AI-Voice application. The raw data
      was saved after de-identification in addition to the preprocessed data, in order to support
      unanticipated future uses, but is not publicly accessible.
    access_url: https://www.synapse.org/Synapse:syn72370534/

raw_data_sources:
  - source_description: >-
      Voice, speech, breathing and cough recordings captured prospectively from participants performing
      the 22 acoustic tasks of the Bridge2AI-Voice protocol.
    source_type: prospective clinical data collection
    raw_data_format: WAV audio
    access_details: >-
      Controlled access only. Requests are made to the Data Access Compliance Office at
      DACO@b2ai-voice.org, and approved raw audio is made available through Synapse at
      https://www.synapse.org/Synapse:syn72370534/
  - source_description: >-
      Demographic surveys, voice confounder surveys and validated questionnaires completed by
      participants in the Bridge2AI-Voice application and recorded in REDCap.
    source_type: participant self-report
    raw_data_format: REDCap export
    access_details: >-
      Released in de-identified, tabular form in the phenotype folder of the public release. The
      supporting REDCap data dictionary, metadata and instrument PDFs are available at
      https://github.com/eipm/bridge2ai-redcap
  - source_description: >-
      Clinical validation information confirming diagnosis and treatment, extracted from electronic
      health records and clinical work-up at each participating site under the consented protocol.
    source_type: electronic health record extraction and clinician assessment
    access_details: >-
      Released in de-identified, tabular form as per-condition diagnosis tables in the phenotype folder.

missing_data_documentation:
  - missing_data_patterns:
      - >-
        Each participant answered a common set of questions and then responded to additional questions
        relevant to their primary diagnostic category, so cohort-specific instruments are missing for
        participants outside that cohort.
      - >-
        Phenotype data files contain a row for a participant only where at least one column is not
        missing.
      - >-
        Per-feature record counts differ across the released Parquet files because some recordings could
        not yield some features.
    missing_data_causes:
      - Some questionnaire items are optional
      - Data collection irregularities during sessions
      - Differences in collection configuration between sites and changes to the collection protocol over the study
      - Audio length or other issues preventing extraction of particular features
      - Removal of sensitive records, audio checks and free-speech-derived features during de-identification
    handling_strategy: >-
      A missingness table is generated as part of the audit protocol and included with the dataset. No
      imputation is applied to the released data.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    description: >-
      Pseudonymous unique identifier for the participant, used to link feature, metadata and phenotype
      records.
  - variable_name: session_id
    data_type: identifier
    is_identifier: true
    description: >-
      Unique identifier for the recording session. A participant may have more than one session, so more
      than one session identifier may be associated with a single participant.
  - variable_name: task_name
    data_type: categorical
    description: Name of the acoustic task performed during the recording.
  - variable_name: n_frames
    data_type: integer
    description: Number of time frames in the associated feature tensor.
  - variable_name: spectrogram
    data_type: array
    description: >-
      Short-time Fourier transform spectrogram of dimension 201 by T, stored in power representation.
    measurement_technique: >-
      Short-time Fast Fourier Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT,
      downsampled by a factor of two in the time domain after derivation.
  - variable_name: mel_spectrogram
    data_type: array
    description: Mel spectrogram of dimension 60 by T.
    measurement_technique: >-
      25 ms window size, 10 ms hop length, 400-point FFT and 60 Mel bins.

file_collections:
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#features
    name: Derived audio features
    collection_type: processed_data
    path: features/
    description: >-
      Dense derived representations of the audio, distributed as Apache Parquet files, each row carrying
      participant_id, session_id, task_name, n_frames and the feature tensor. The collection contains
      torchaudio_spectrogram.parquet (29,278 records, 201 by T), torchaudio_mel_spectrogram.parquet
      (29,278 records, 60 by T), torchaudio_mfcc.parquet (29,278 records, 60 by T),
      torchaudio_pitch.parquet (32,522 records, dimension T, pitch range 80 to 500 Hz),
      sparc_ema.parquet (28,640 records, T by 12, giving X and Y positions of tongue dorsum, tongue body,
      tongue tip, lower incisor, upper lip and lower lip), sparc_loudness.parquet (31,855 records,
      dimension T, 20 ms windows), sparc_periodicity.parquet (31,872 records, dimension T, 20 ms windows),
      sparc_pitch.parquet (31,872 records, dimension T, 50 to 550 Hz) and ppgs.parquet (29,289 records,
      40 by T at 100 Hz). The collection also contains static_features.tsv, holding one row per recording
      of features derived with openSMILE, Praat, parselmouth and torchaudio, and audio_quality_metrics.tsv,
      holding quality control metrics per recording. Each data file has a matching JSON data dictionary
      with the same file stem.
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#phenotype
    name: Phenotype data
    collection_type: processed_data
    path: phenotype/
    description: >-
      Tab-separated participant-level tables with matching JSON data dictionaries, organized into
      subfolders. The confounders subfolder holds voice confounder responses; demographics holds
      self-reported demographic data; diagnosis holds per-condition tables for airway stenosis,
      amyotrophic lateral sclerosis, anxiety, benign lesions, bipolar disorder, cognitive impairment,
      control, COPD and asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal dystonia,
      laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous lesions, unexplained
      chronic cough and unilateral vocal fold paralysis; enrollment holds eligibility, enrollment form
      and participant tables; questionnaire holds ADHD adult, custom affect scale, DSM-5 adult, dyspnea
      index, GAD-7 anxiety, Leicester cough questionnaire, PANAS, PHQ-9, productive vocabulary,
      psychiatric history, PTSD adult, VHI-10 and voice perception instruments; and task holds acoustic
      task, Harvard sentences, random item generation, recording, session, Stroop and Winograd tables.
      Each dictionary entry gives a one-sentence description, the question put to the participant where
      applicable, and the data type of the response.
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#metadata
    name: Per-recording metadata
    collection_type: metadata
    path: metadata/
    description: >-
      A Parquet file with its corresponding data dictionary, carrying specific information about each
      recording including the task instructions and prompts, the microphone used, and the microphone
      gain. Introduced in version 3.1.0.

distribution_formats:
  - format: Apache Parquet
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Open-source column-oriented data file format used for the dense derived audio features and for the
      per-recording metadata. Loadable with any Parquet-capable library, for example the HuggingFace
      Datasets library.
  - format: Tab-separated values
    media_type: text/tab-separated-values
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: Used for the phenotype tables, static features and audio quality metrics.
  - format: JSON
    media_type: application/json
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: Used for the data dictionaries accompanying every tabular and binary data file.
  - format: WAV audio
    media_type: audio/wav
    access_urls:
      - https://www.synapse.org/Synapse:syn72370534/
    notes: >-
      Raw audio waveforms are not part of the PhysioNet release; they are disseminated separately through
      Synapse under controlled access requiring institutional sign-off.

distribution_dates:
  - release_dates:
      - "Version 1.0: end of November 2024, on the Health Data Nexus"
      - "Version 1.1: 17 January 2025, on PhysioNet"
      - "Version 2.0.0: 16 April 2025"
      - "Version 2.0.1: 18 August 2025"
      - "Version 3.0.0: 16 December 2025"
      - "Version 3.1.0: 1 May 2026"
    notes: >-
      The pediatric companion dataset was released in version 1.0.0 on 17 December 2025 and version 1.1.0
      on 1 May 2026.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed broadly to individuals outside the entity that created it, through
      PhysioNet under registered and credentialed access, and previously through the Health Data Nexus.
      Raw audio is shared with authorized researchers through Synapse under controlled access. Under the
      Data Transfer and Use Agreement, a recipient may not disclose, release, sell, rent, lease, loan or
      otherwise grant access to the data to any third party other than Authorized Persons without the
      prior written consent of the provider; collaborators at other research organizations and other
      research teams at the same organization must apply independently and sign their own agreement.

version_access:
  versions_available:
    - "1.0 (Health Data Nexus, doi:10.57764/qb6h-em84)"
    - "1.1 (PhysioNet, doi:10.13026/249v-w155)"
    - "2.0.0"
    - "2.0.1"
    - "3.0.0 (doi:10.13026/k81f-qr68)"
    - "3.1.0 (doi:10.13026/8xbn-nq66)"
  latest_version_doi: doi:10.13026/37yb-1t42
  version_details: >-
    By default, older versions of the dataset continue to be supported, hosted and made available to
    researchers, and each version has a unique DOI; the dataset publishers reserve the right to remove
    access to older versions. Version 1.0 was published on the Health Data Nexus, which provides cloud
    compute alongside the dataset rather than allowing downloads. A changelog for each dataset version is
    published online with the dataset metadata.

updates:
  frequency: semi-annual
  update_details: >-
    Further versions of the dataset are released twice a year, distributed as new versions on the hosting
    platform. Users are notified through news items on the platform and through standard communication
    channels. Updates correct labeling errors, add new instances and reorganize the release; a changelog
    accompanies each version.

errata:
  - erratum_details: >-
      Version 2.0 reprocessed the spectrograms to fix minor issues identified in the previous release, and
      removed all spectrograms and Mel-frequency cepstral coefficients derived from free speech tasks.
  - erratum_details: Version 2.0.1 corrected errors in the authorship list.
  - erratum_details: >-
      Version 3.1.0 fixed broken Parquet files present in version 3.0.0, updated validated diagnosis
      information across conditions with back-filled information, rearranged some phenotype files and
      renamed certain gold-standard variable names.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The Bridge2AI-Voice consortium curates the dataset. The Data Access Compliance Office, reachable at
      DACO@b2ai-voice.org, handles access requests, including requests for the raw audio.
  - role: academic_institution
    maintainer_details: >-
      PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts the registered and
      credentialed access release and provides continued access to interested researchers.
  - role: academic_institution
    maintainer_details: >-
      The Health Data Nexus, a data publishing platform maintained by the Temerty Centre for Artificial
      Intelligence Research and Education in Medicine at the University of Toronto, hosts version 1.0 and
      maintains the technical infrastructure for it.
  - role: government_agency
    maintainer_details: The dataset is supported by the NIH via the Bridge2AI program.

extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    Others may publish a derivative dataset that references the original source; derivative datasets may
    be made available under the same conditions as the source data. For changes to the code used to
    produce the data, the open-source repositories have discussion forums and issue pages allowing public
    discussion of data preprocessing, and accept pull requests contributing improvements to the
    preprocessing code. Any new labels or newly defined tasks should be described alongside the release of
    a model or publication, including the exact variables used for the determination.

retention_limit:
  retention_period: indefinite
  retention_details: >-
    Once data is contributed, it will be retained as long as it is useful for research purposes, possibly
    indefinitely. Under the collection protocol, identifiable data and the datasheets linking participant
    numbers to participant information are kept within each collecting institution on local cloud storage
    for a maximum of ten years after study completion and are then destroyed, a responsibility of each
    local principal investigator. De-identified study data and original consent forms are retained for a
    minimum of five years after study completion. Under the Data Transfer and Use Agreement, a recipient
    must destroy the transferred data two years after the start date, on completion of the project, on
    expiration of the applicable ethics approval or on termination, whichever occurs first, and certify
    the destruction in writing within thirty days.

data_governance:
  committee_name: Data Access Compliance Office (DACO)
  accountable_organization:
    name: University of South Florida Board of Trustees
  access_review_process: >-
    Two distinct routes apply according to the sensitivity of the content. For the features-only data,
    registered access requires registration on PhysioNet, confirmation of identity under the Registered
    Access License, and signature of the Bridge2AI-Voice Registered Access Agreement; from version 3.0.0
    the release is under credentialed access, requiring the user to be a credentialed PhysioNet user and
    to sign the data use agreement, with no additional training required. For the raw audio data,
    controlled access requires completion of a Data Access Request Form and a Data Use Agreement,
    submission of the application to the Data Access Compliance Office for review, and, upon approval, a
    Data Use and Transfer Agreement signed by an authorized official at the applicant's institution.
    Requests are directed to DACO@b2ai-voice.org. A memorandum setting out the ethical justification for
    controlled access to raw voice data samples is published with the documentation.
  stewardship_roles:
    - The Bridge2AI-Voice consortium curates the dataset and responds to questions about it.
    - The Data Access Compliance Office reviews and approves controlled-access applications for raw audio.
    - PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts the release and administers credentialing and the data use agreement.
    - Each local principal investigator remains responsible for identifiable data held within their own institution.

license_and_use_terms:
  license_terms: >-
    Bridge2AI Voice Registered Access License. Users must sign the Bridge2AI Voice Registered Access
    Agreement, which sets out the terms and conditions for data use. Duplication as reasonably required to
    carry out the user's research project is permitted; sale of all or part of the data on any media is
    not. There are no fees associated with these restrictions.
  data_use_permission: general_research_use
  notes: >-
    The consent obtained from participants does not restrict use to non-commercial purposes, to a specific
    geographic location, to a specific type of research, to genetic research, or away from methods and
    algorithm development. The dataset is nonetheless intended solely for commercial and non-commercial
    research purposes by Authorized Researchers.

ip_restrictions:
  restrictions:
    - The data may be protected by copyright and other rights, including other intellectual property rights.
    - Duplication, as reasonably required to carry out the user's research project with the data, is permitted.
    - Sale of all or part of the data on any media is not permitted.
    - Nothing in the agreement operates to transfer to the user any intellectual property rights in or relating to the data.
    - Users agree not to make intellectual property claims on the data.
    - Users agree not to use intellectual property protection in ways that would prevent or block access to, or use of, any element of the data, or conclusions drawn directly from the data.
    - Users may perform further research adding intellectual and resource capital to the data and may obtain intellectual property rights on such downstream discoveries, but agree to implement licensing policies that will not obstruct further research.
    - Users agree to respect the Fort Lauderdale Agreement.
    - No intellectual-property-based or other restrictions have been imposed on the data by third parties.

regulatory_restrictions:
  regulatory_restrictions:
    - No export controls or other regulatory restrictions apply to the dataset or to individual instances.
  hipaa_compliant: compliant
  confidentiality_level: restricted
  other_compliance: >-
    The data is covered under a Certificate of Confidentiality, which must be asserted against compulsory
    legal demands such as court orders and subpoenas for identifying information or characteristics of a
    research participant. The data is not covered under the Federal Privacy Act of 1974. Collection was
    conducted under the Common Rule with single IRB oversight; Canadian sites operated under separate
    research ethics board approvals. The clinical study is not for a drug product or a medical device, and
    no data monitoring committee was appointed.
  source_caveats: >-
    The HIPAA compliance value reflects the project's own statement that the dataset applies the HIPAA
    de-identification rules and removes identifiable information under HIPAA and the Common Rule; no
    external certification of compliance is described in the sources.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    Data collection and sharing was approved by the University of South Florida Institutional Review
    Board. The protocol was submitted and approved by the USF Single IRB and by subsite IRBs through the
    Single IRB process; Canadian participating institutions applied separately to their own research
    ethics boards.
  ethics_review_board: University of South Florida Institutional Review Board
  regulatory_compliance:
  - >-
    HIPAA, the Common Rule, and a Certificate of Confidentiality. The study is observational, is not for a
    drug product or a medical device, and no data monitoring committee was appointed. Investigators and
    project personnel with data access complete HIPAA and privacy training at their local institution.
  special_populations:
    - >-
      Eligibility for the adult protocol is 18 to 120 years of age; participants unable to provide
      informed consent in English or unable to read English were excluded.
    - >-
      Pediatric participants are enrolled only at pediatric sites under a separate arrangement and are
      released as a separate dataset.
    - >-
      Cohorts include participants with mild cognitive impairment, dementia and psychiatric conditions,
      for whom the protocol restricts eligibility to those with an existing clinical diagnosis and, for
      the neurological cohort, to ages 44 to 85.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
    - >-
      The adult protocol restricts enrollment to participants 18 years and older; pediatric participants
      are enrolled only at pediatric sites and released as a separate dataset.
    - >-
      Participants who withdraw, decline participation or express initial hesitation may complete an
      optional satisfaction survey to help the team understand their reasons; completion is entirely
      optional and no protected health information is collected.
  guardian_consent:
  - >-
    Where children participate under the consortium protocol, parents or guardians provide consent and
    children provide verbal assent where appropriate. Parental permission may be obtained from one or
    both parents, since the research is minimal risk and does not require permission from both parents or
    legal guardians.
  assent_procedures: >-
    Assent is documented. Where young children cannot reasonably be asked to assent because of limitations
    in understanding due to age and development - typically children under seven years of age - they are
    not asked to do so.
  source_caveats: >-
    The guardian consent and assent provisions are drawn from the consortium's IRB protocol and govern the
    pediatric arm, which is published as a separate dataset. The adult dataset described here enrolls only
    participants 18 years and older.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Prospective written informed consent, obtained on paper, electronically through REDCap survey forms
      or within the application, or by video recording within the application.
    consent_scope: >-
      Consent covers all study procedures, including acoustic data collection, completion of demographic
      and clinical questionnaires, and investigator access to medical information through electronic
      health record platforms in order to perform gold-standard validation of diagnoses and symptoms.
      Participants are told that research data not containing their direct identifiers will be shared with
      external researchers for future research through a secure database, that data posing a low risk of
      re-identification will be shared in registered access with the general public, and that data posing
      a heightened risk of re-identification will be shared through a controlled access mechanism with
      authorized researchers. Consent to future contact for further voice data collection is optional.
    consent_documentation: >-
      Paper consent documents are uploaded and saved electronically in REDCap. All paper and electronic
      versions of consent are stored for a minimum of five years after completion of the study. Video
      consent, where used, records the participant reading a statement aloud and serves to verify that the
      acoustic data submitted belongs to the consented individual and to distinguish participants from
      automated agents. For longitudinal collection, electronic consent is administered before each
      subsequent data collection to confirm ongoing consent.
    withdrawal_mechanism: >-
      Participants are informed that they may withdraw from the study at any point. If a participant
      withdraws during or before the voice data collection, their data is not included in the database.
      Once the voice data collection process is completed, research data including voice recordings cannot
      be removed from the database.

collection_consents:
  - consent_details: >-
      All participants were duly informed and agreed to the collection and use of their data through
      prospective informed consent. Participants were explicitly informed about the data being collected,
      the methods used to secure it, and the information that would be used for the study.
  - consent_details: >-
      The consent obtained does not restrict the data to non-commercial use, to use in a specific
      geographic location, to a specific type of research, to genetic research, or away from research
      involving the development of methods or algorithms.

collection_notifications:
  - notification_details: >-
      Individuals were notified about the data collection. Participants went through an IRB-approved
      consent process in which the study, its purpose and the data being collected were explained in
      detail, with time for questions and comments, and potential participants were asked to explain what
      they had understood to confirm comprehension. Participants were informed that participation is
      voluntary and does not affect their medical care in any way.

consent_revocations:
  - revocation_details: >-
      Consenting participants are informed that they may withdraw from the study at any point. If a
      participant chooses to withdraw during or before the voice data collection, their data will not be
      included in the database. Participants are informed that research data, including voice recordings,
      cannot be removed from the database once the voice data collection process is completed. For
      longitudinal collection, participants may withdraw at any time during the study period, and data
      already collected is retained, with a single data collection time-point constituting study
      completion.

participant_privacy:
  - anonymization_method: >-
      Removal of HIPAA Safe Harbor identifiers, removal of state and province with only country of
      collection retained, removal of indirect identifiers judged to create significant re-identification
      risk, removal of narrative free-text fields, rebasing or replacement of dates by integers, and
      withholding of all raw audio waveforms. Raw audio transcripts were reviewed and recordings
      containing potentially identifying information or external voices were removed from the release.
    data_linkage: >-
      Records are linked across feature, metadata and phenotype files by pseudonymous participant and
      session identifiers. Identifiable data and the datasheets linking participant numbers to participant
      information are held within each collecting institution in password-protected REDCap databases and
      are not shared.
    privacy_techniques:
      - HIPAA Safe Harbor de-identification
      - Ethicist-led review and removal of indirect identifiers and highly sensitive fields
      - Removal of all fields encoded as identifiers in the REDCap data dictionary
      - Geographic generalization to country of collection
      - Withholding of raw audio waveforms from the public release
      - Removal of features derived from open-response and free-speech prompts
      - Controlled access, with institutional sign-off, for raw audio
      - Transmission over secure HTTPS to HIPAA-compliant storage hosted by an NIH STRIDES partner
      - Federated learning infrastructure allowing multi-institutional model training without transferring data between institutions
    reidentification_risk: >-
      K-anonymization at k greater than or equal to two is not achieved. The consortium states that even
      with all HIPAA-protected information removed, a person's voice is unique to them and to their health
      at that point in their life, so it is always possible, if unlikely, that someone could recognize a
      participant's voice; voice can never be fully de-identified. Raw voice data was therefore removed
      from the open release because of its potential to cause individual re-identification or to be used
      for illicit or unauthorized purposes.

participant_compensation:
  - compensation_provided: true
    compensation_type: electronic gift cards
    compensation_amount: >-
      40 US dollars for a data collection session lasting under 90 minutes and 80 US dollars for a session
      lasting over 90 minutes, for no more than three sessions and a maximum total compensation of 120 US
      dollars.

data_protection_impacts:
  - impact_details: >-
      A team of ethicists reviewed the data and identified for removal the direct identifiers, the
      indirect identifiers whose combination with other public data available on social media, in
      government registries or elsewhere would create a significant risk of participant re-identification
      - including select geographic and demographic identifiers and information about household
      composition or cultural identity - and the non-identifying elements revealing highly sensitive
      information such as household income, mental health status and traumatic life experiences.
  - impact_details: >-
      Raw voice data was withheld from open release on the assessment that it has the potential to cause
      individual re-identification or to be used for illicit or unauthorized purposes. A memorandum setting
      out the ethical justification for controlled access to raw voice data samples is published with the
      project documentation, explaining the reasoning behind the governance structure.

ethical_reviews:
  - reviewing_organization: University of South Florida Institutional Review Board
    contact_person:
      name: Yael Bensoussan
    review_details: >-
      Data collection and sharing was approved by the University of South Florida Institutional Review
      Board. The Bridge2AI Voice Data Acquisition protocol was submitted and approved by the USF Single
      IRB, with subsite IRBs approving through the Single IRB process. A partial HIPAA waiver was granted
      for recruitment and screening purposes, permitting review of electronic health record information
      for incoming clinic patients, limited to the study's inclusion criteria, with identifiers destroyed
      at the earliest opportunity consistent with the conduct of the research. No data monitoring
      committee was appointed.
  - reviewing_organization: Canadian participating institutions
    review_details: >-
      Canadian institutions - Mount Sinai Hospital, the Hospital for Sick Children and the University of
      Toronto - do not participate in the Single IRB process and applied separately for research ethics
      board approval in compliance with Canadian regulations, with copies of the approvals submitted to
      the USF IRB. Genomic data collection and analysis is covered by a separate protocol and approval at
      Mount Sinai Hospital and the University of Toronto.

existing_uses:
  - examples:
      - >-
        A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer
        School and hackathon.

intended_uses:
  - use_category: research
    examples:
      - Development, benchmarking and validation of clinically applicable machine-learning models for diagnosing health conditions from voice
      - Pretraining and fine-tuning of artificial intelligence models on acoustic and phenotypic data
    usage_notes: >-
      The dataset is intended solely for commercial and non-commercial research purposes by Authorized
      Researchers, and is structured to be Findable, Accessible, Interoperable and Reusable.
  - use_category: clinical research
    examples:
      - Disease screening, diagnosis and monitoring through voice biomarkers
      - Study of voice, speech and respiratory sound changes associated with vocal pathologies and with neurological, psychiatric and respiratory conditions
    usage_notes: >-
      The goal is to facilitate the use of voice as a non-invasive, cost-effective biomarker for the
      screening, diagnosis and monitoring of a wide range of health conditions.
  - use_category: cohort selection
    examples:
      - Selecting participants by diagnosis, demographics, confounders or questionnaire score using the phenotype tables
    usage_notes: >-
      The questionnaire features are collected and distributed in the phenotype folder format and can be
      used for cohort selection.

discouraged_uses:
  - discouragement_details: >-
      The dataset should not be used for non-research or non-clinical applications such as hiring
      decisions, insurance premium adjustments, or any form of surveillance that could lead to
      discrimination or harm. These limitations are intended to prevent unethical or biased outcomes that
      could negatively impact individuals based on their health conditions or voice characteristics.
  - discouragement_details: >-
      Uses that do not account for the dataset's skews by disorder category, site and demographic factors
      are discouraged; users should consider the multivariate distribution when assessing utility for
      different questions, to avoid unfair treatment of individuals or groups.

prohibited_uses:
  - prohibition_reason: >-
      Attempting to re-identify research participants, or taking any action that could reasonably lead to
      re-identification, is prohibited under the Registered Access Agreement, reflecting the consortium's
      commitment to respecting and protecting the rights and interests of research participants.
  - prohibition_reason: >-
      Any purpose that could foreseeably cause harm or stigmatization to research participants, their
      families, communities or specific populations is prohibited.
  - prohibition_reason: >-
      Intellectual property protections, database rights or related rights may not be used in a manner
      that restricts or limits access to any part of the dataset or to any conclusions derived from it,
      so that future use of the dataset remains unrestricted in alignment with Open Science principles.
  - prohibition_reason: >-
      Sale of all or part of the data on any media is not permitted under the data agreements.
  - prohibition_reason: >-
      Disclosure, release, sale, rental, lease, loan or other grant of access to the data to any third
      party other than Authorized Persons, without the prior written consent of the provider, is
      prohibited; collaborators at other organizations must apply independently and sign their own
      agreement.
  - prohibition_reason: >-
      Recipients may not use the data, alone or with any other information, to contact individuals who are
      the subjects of the data without appropriate Institutional Review Board approval, specific written
      approval from the provider, and informed consent from the individual where required.

future_use_impacts:
  - impact_details: >-
      The dataset has skews based on disorder category, site and other demographic factors. Future users
      should consider the multivariate distribution when assessing utility for different questions, since
      composition and collection practice may otherwise lead to unfair treatment of individuals or groups,
      stereotyping or quality-of-service issues.
  - impact_details: >-
      Because participants were screened for different disorders at different sites and with different
      devices, an interaction exists between the labels and the recording conditions; models may learn
      site or device characteristics rather than clinical signal.
  - impact_details: >-
      Voice is a biometric that cannot be fully de-identified, so downstream use of derived
      representations carries a residual re-identification risk; this is the stated reason the raw audio
      is disseminated only under controlled access.
  - impact_details: >-
      The consortium anticipates broad public health benefit from integrating voice-based assessments into
      digital health tools, including earlier disease detection, continuous disease monitoring and
      personalized treatment strategies, and from providing access to ethically sourced data for future
      generations of voice AI researchers, particularly those from underserved communities.

