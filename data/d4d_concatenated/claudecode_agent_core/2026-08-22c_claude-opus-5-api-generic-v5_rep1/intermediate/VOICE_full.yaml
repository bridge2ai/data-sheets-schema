  The project documentation publishes a self-assessed AI-readiness rating for the dataset against the
  Bridge2AI recommendations: FAIRness 100% (findable, accessible, interoperable, reusable all met);
  Provenance 100% (transparent, traceable, interpretable, key actors identified); Characterization 80%
  (semantics, statistics, standards and potential sources of bias met, data quality not met);
  Pre-model explainability 100% (data documentation templates, fit for purpose, verifiable); Ethics 100%
  (ethically acquired, managed, disseminated, secure); Sustainability 50% (persistent and well-governed
  met, domain-appropriate and associated not met); Computability 75% (standardized, computationally
  accessible and portable met, contextualized not met).
source_caveats: >-
  This record describes the adult flagship Bridge2AI-Voice dataset as published on PhysioNet. The
  Bridge2AI-Voice Pediatric Dataset is a distinct release with its own DOI, its own ethics approval and
  its own participant population; it is recorded here under related_datasets rather than merged into
  this record. Where the tier-1 PhysioNet v3.1.0 release and the tier-2 project documentation disagree,
  the release is preferred: the documentation reports approximately 61,937 voice-derived recordings for
  version 3.0, while the release states per-feature record counts ranging from 28,640 to 32,522 for
  v3.1.0, which suggests the documentation figure aggregates feature files across types. The
  documentation names a lead investigator as "Jennifer Sui" and "Frank Rudzizc" where the PhysioNet
  author list gives "Jennifer Siu" and "Frank Rudzicz"; the release spellings are used. The supporting
  award is cited variously as OT2OD032720 (core project), 3OT2OD032720-01S1 (PhysioNet
  acknowledgements), 3OT2OD032720-01S3 (NIH RePORTER application), and 1OT2OD032720-01 (feasibility
  publication); the core project number is used as the grant identifier. Version 3.0.0 of the PhysioNet
  release is superseded by version 3.1.0 and its statements are used only where 3.1.0 is silent.

