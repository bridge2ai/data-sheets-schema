id: doi:10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is a flagship, standardized, ethically sourced dataset of human voice, speech,
  breathing and cough recordings linked to health information, generated by the Bridge2AI-Voice
  consortium under the NIH Common Fund Bridge2AI program. Version 3.1.0 contains data for 833 adult
  participants collected across five sites in North America (United States and Canada). Participants
  were recruited from high-volume expert clinics on the basis of conditions understood to manifest in
  the voice waveform, organized into five cohort categories: voice disorders, respiratory disorders,
  neurological and neurodegenerative disorders, mood and psychiatric disorders, and controls. A
  pediatric cohort is released separately.

  The public release contains data considered low risk: derived acoustic representations rather than
  the original recordings. Released features include short-time Fourier transform spectrograms, Mel
  spectrograms, Mel-frequency cepstral coefficients, pitch contours, Speech Articulatory Coding
  (sparc) electromagnetic articulography estimates with loudness, periodicity and pitch measures,
  phonetic posteriorgrams, and static features from openSMILE, Praat/parselmouth and torchaudio.
  These are accompanied by detailed phenotype tables — demographics, voice confounders, per-condition
  diagnosis tables, enrollment records, validated questionnaires and per-task records — and by
  per-recording metadata including task prompts, microphone used and gain, together with JSON data
  dictionaries for every tabular and binary file. Raw audio waveforms are retained but are not part
  of this release; they are disseminated only through a controlled access mechanism.

  The consortium's stated target is a dataset of 10,000 voices, with anticipated enrollment of 10,000
  participants by 2027; the releases described here therefore represent an early portion of the
  planned collection and do not contain an equal distribution of the five disease cohort categories.
