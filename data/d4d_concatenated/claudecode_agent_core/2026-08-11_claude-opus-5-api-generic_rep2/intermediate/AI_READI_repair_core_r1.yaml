purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal dataset on
      type 2 diabetes mellitus that enables future generations of artificial intelligence and
      machine learning research, including research into salutogenic pathways back to health.
  - response: >-
      To build a foundational dataset in T2DM that is agnostic to existing classification criteria
      and biases, and that can be used to reconstruct a temporal atlas of T2DM development and
      reversal towards health.
  - response: >-
      To establish standards, best practices and guidelines for the collection, preparation and
      sharing of data intended for AI/ML, so that the project can serve as a blueprint for other
      data generation projects; this includes developing the Clinical Dataset Structure (CDS)
      specification and the FAIRhub curation and sharing platform.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel,
      including through a year-long AI-READI research internship programme.

addressing_gaps:
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as
      T2DM has been limited by the lack of well-designed, high-quality, large and inclusive
      multimodal datasets that are ready for training AI models.
  - response: >-
      Existing large datasets for AI/ML training are demographically narrow. A meta-epidemiological
      review of T2DM studies published from 2000 to 2020 found that samples lacked racial and
      ethnic diversity; AI-READI is designed to be approximately balanced across Asian, Black,
      Hispanic and White participants as a demographic improvement over prior epidemiological
      studies and clinical trials.
  - response: >-
      Downstream AI/ML analyses that are not feasible with existing data sources such as claims or
      electronic health record data are enabled by a purpose-built acquisition protocol spanning
      survey, physical measurement, clinical, imaging and wearable device domains.
  - response: >-
      Data used in developing AI systems are a frequent source of downstream ethical problems; the
      project addresses this by considering ethical, legal and social implications at every stage
      and by documenting dataset provenance and intended use.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis, an approach used to predict disease trajectories by
      learning from complex multimodal data collected from participants at differing disease
      severity (normal through insulin-dependent T2DM).
  - response: >-
      Development of AI/ML models on balanced multimodal health data, including multimodal model
      development for understanding T2DM pathogenesis and salutogenesis.
    notes: >-
      The healthsheet states that the dataset is hypothesis-agnostic and that no explicit labels or
      targets are associated with instances, so no supervised task is predefined by the dataset
      creators.

instances:
  - instance_type: Individual human research participant
    counts: 2280
    data_substrate: >-
      Multimodal per participant: tabular survey and clinical records, DICOM medical imaging
      (colour fundus photography, fundus autofluorescence, infrared reflectance, OCT, OCTA,
      FLIO), physiological waveform signal (12-lead ECG in WFDB), and sensor time series
      (continuous glucose monitoring, wearable activity monitoring, indoor environmental
      sensing). No unstructured text data are included.
    data_topic: >-
      Type 2 diabetes mellitus, its severity strata, and associated multi-system health domains
      including cardiac, renal, hepatic, metabolic, ocular, cognitive, neuropathic, behavioural,
      social-determinant and environmental-exposure measures.
    label_description: >-
      No explicit label or target is associated with each data instance. No labelling was
      performed; the dataset is hypothesis-agnostic and intended to support multiple potential
      downstream AI/ML applications.
    missing_information:
      - >-
        Not all modalities are available for all participants. Some participants elected not to
        participate in some study elements; in a few cases the data collection device had no
        stored results or was returned too late to retrieve results (for example battery failure
        or lost data); in a few cases a data collision during processing resulted in lost data.
        Skipped or incomplete survey responses also occur.
    notes: >-
      Version 1.0.0 contained 204 participants (pilot data collection phase), version 2.0.0
      contained 1,067 participants (pilot plus first study year) and version 3.0.0 contains 2,280
      participants. There is currently only one study visit per participant, and all instances are
      part of the same prospective cross-sectional data generation project; approximately 10% of
      the cohort is planned to be invited for a follow-up visit in project year 4.

subpopulations:
  - identification: >-
      Self-reported race/ethnicity, recorded in four groups: Asian, Black, Hispanic and White.
    distribution: >-
      Across the 2,280 participants in v3.0.0 the recommended-split summary table reports Hispanic
      380, Asian 545, Black 519 and White 836.
    subpopulation_elements_present: false
    notes: >-
      Race and ethnicity are withheld from the public release and are held under controlled
      access; the aggregate counts above are published in the dataset README split table. The
      healthsheet answers "No" to whether the dataset identifies demographic sub-populations,
      reflecting the public release.
  - identification: Biological sex (male, female), self-reported at screening.
    distribution: >-
      Across the 2,280 participants the split summary table reports 951 male and 1,329 female.
    subpopulation_elements_present: false
    notes: >-
      Sex is withheld from the public release and held under controlled access. The public set is
      also stripped of race/ethnicity information partly to prevent stigmatisation of findings.
  - identification: >-
      Diabetes status group: no diabetes; pre-diabetes or lifestyle-controlled T2DM; T2DM
      controlled by oral or non-insulin injectable medication; insulin-controlled T2DM.
    distribution: >-
      Across the 2,280 participants the split summary table reports no diabetes 776, lifestyle
      560, oral 686 and insulin 258.
    subpopulation_elements_present: true
  - identification: Age (adults aged 40 years and older at enrolment).
    distribution: >-
      Mean age across all 2,280 participants is 60.8 years (standard deviation 11.3); train 61.1
      +/- 11.3, validation 60.3 +/- 10.8, test 60.5 +/- 11.4.
    subpopulation_elements_present: true
  - identification: Data collection site (Birmingham AL, San Diego CA, Seattle WA).
    distribution: >-
      Not reported per site in the released summary tables. All study groups are recruited at each
      site, but the proportion of each group varies with the demographic prevalence of that group
      in the site's geographical area.
    subpopulation_elements_present: false

