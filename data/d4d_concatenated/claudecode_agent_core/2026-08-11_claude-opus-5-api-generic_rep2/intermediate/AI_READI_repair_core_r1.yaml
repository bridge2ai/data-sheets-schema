distribution_formats:
  - format: DICOM
    media_type: application/dicom
    notes: >-
      Used for all retinal photography, OCT, OCTA and FLIO data; native Topcon .fda and Heidelberg
      .sdt exports are converted to DICOM for the dataset.
  - format: CSV
    media_type: text/csv
    notes: >-
      Used for the clinical_data OMOP CDM tables and other tabular outputs; manifest files within
      each datatype directory are provided as manifest.tsv.
  - format: JSON
    media_type: application/json
    notes: >-
      Used for root metadata files including dataset_description.json,
      dataset_structure_description.json, participants.json and study_description.json, and for the
      OMOP data quality file dqd_omop.json.
  - format: Markdown
    media_type: text/markdown
    notes: Used for README.md, CHANGELOG.md and healthsheet.md.
  - format: FAIRhub platform download
    access_urls:
      - https://fairhub.io/datasets/3
      - https://docs.aireadi.org/
    notes: >-
      The full release comprises 356,343 files totalling 3,815,969,779,678 bytes (approximately
      3.82 TB). The FAIRhub access type is "PublicDownloadSelfAttestationRequired": access
      requires login through a verified ID system, agreement to use the data only for type 2
      diabetes related research, and agreement to the licence terms. The v3.0.0 documentation adds
      information about a mini-subset of the dataset for pipeline development and about Azure
      Storage access. All data files are in formats accessible with freely available software, so
      no specific software is required.

acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details: >-
      Acquisition varied by domain. Directly observable data include laboratory values, vitals,
      physical measurements, ECG, cognitive and vision testing, retinal imaging and wearable and
      environmental sensor readings. Subject-reported data include the pre-visit questionnaires
      and social determinants of health surveys. Verification of data entry was performed where
      possible; for example, entered medications were cross-referenced against medications
      physically brought in or photographed by the participant. Data were collected directly from
      participants at the three recruiting sites, with recruitment pools identified by screening
      electronic health records for ICD-10 codes (R73.09 for pre-diabetes, E11.X for T2DM).

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used for collecting patient-reported questionnaire data and the following clinical
      data from the visit: medications assessment, vitals, visual acuity, contrast sensitivity,
      monofilament test results and complete blood count results. Recruitment invitations were
      personalised with links, access codes and QR codes directing individuals into an online
      REDCap recruitment interface.
  - mechanism_details: >-
      Retinal imaging devices: Optomed Aurora IQ handheld undilated colour fundus camera (4 images
      per participant, DICOM); iCare EIDON widefield truecolor confocal fundus system (12 images:
      ultra-wide field central/nasal/temporal CFP, central IR, central FAF and a mosaic; DICOM);
      Heidelberg Spectralis HRA OCT/OCTA (6 images: optic nerve head radial circle high resolution,
      posterior pole macula HR 61 lines, macula 20x20 HS 512 lines OCTA; DICOM); Topcon Maestro2 3D
      OCT-1 (6 images: 3D wide 12x9, 3D macula 6x6, macula 6x6 OCTA; exported .fda, converted to
      DICOM); Topcon Triton DRI OCT (6 images: 3D(H)+Rad 12x9, macula 6x6 OCTA, macula 12x12 OCTA;
      exported .fda, converted to DICOM); Zeiss Cirrus 5000 (8 images: disc cube 200x200, macula
      cube 512x128, macula 6x6 OCTA, disc 6x6 OCTA; DICOM); Heidelberg FLIO (2 macula-centred
      images; exported .sdt, converted to DICOM). All retinal images are collected under dilated
      conditions except the Optomed.
  - mechanism_details: >-
      At-home monitoring devices issued at the end of the in-person visit and used continuously for
      10 days: a custom-designed home environmental sensor (LeeLab Anura, Karalis Johnson Retina
      Center, University of Washington) recording ambient temperature, relative humidity, nitrogen
      oxides, volatile organic compounds, particulate matter (PM1.0, PM2.5, PM4, PM10) and eleven
      multi-spectral light intensity measurements; a Garmin Vivosmart 5 physical activity monitor
      recording steps, heart rate, sleep duration and oxygen saturation; and a Dexcom G6 continuous
      glucose monitor recording blood glucose in mg/dL every 5 minutes. Devices were returned by
      overnight mail or in person. The environmental sensor and fitness tracker were specifically
      chosen with participant privacy in mind: they do not capture video or audio, have no GPS
      location monitoring, and are not synced with participant-owned devices. Participants are
      masked to the Dexcom results during the monitoring period.
  - mechanism_details: >-
      Clinical instrumentation at the visit: automatic oscillometric blood pressure devices (OMRON
      HEM 907XL, Medline MDS4001, Welch Allyn 6000 series); Philips PageWriter TC30 12-lead
      cardiograph with recorded chair position (0, 30, 60 or 90 degrees relative to supine); 10 g
      monofilament applied at three locations on each foot (10 times per location) with the
      participant's eyes closed, recorded as a yes/no perception response; MoCA Duo application on
      iPad yielding a total score out of 30 plus section subscores, Memory Index Score and task
      completion times; M&S Technologies Electronic Visual Acuity tester at 4 metres under photopic
      and mesopic (2.0 neutral density filter) conditions, reported as logMAR where lower is
      better; Mars Letter Contrast Sensitivity charts reported as log contrast sensitivity where
      higher is better; Topcon KR 800 autorefractor; NIDEK LM-600P and Topcon CL-200/CL-300
      lensometers.
  - mechanism_details: >-
      Biospecimen collection: approximately 53 mL of non-fasting blood plus a urine specimen per
      participant. EDTA vacutainers, serum separator vacutainers, CPT mononuclear cell preparation
      tubes and PAXgene RNA vacutainers are used; plasma, serum and buffy coats are processed
      locally on the day of collection using standardised operating procedures. CLIA-certified
      local laboratories perform complete blood counts on fresh whole blood (white blood cell
      count, red blood cell count, haemoglobin, haematocrit, MCV, MCH, MCHC, RDW, platelets); all
      other assays are performed by the University of Washington Nutrition and Obesity Research
      Center on stored frozen samples, including HbA1c (reference range 4.0-6.0%), glucose (62-125
      mg/dL), C-peptide (1.1-4.4 ng/mL), insulin (0.0-24.9 ng/mL), NT-proBNP (varies by age),
      troponin-T (female <11, male <16 ng/L), high-sensitivity C-reactive protein (0.0-10.0 mg/L),
      lipid panel, comprehensive metabolic panel, urine albumin and urine creatinine (no reference
      ranges given for the urine analytes).

data_collectors:
  - role: Clinical research coordinators and research assistants at the three data collection sites
    collector_details: >-
      All research personnel who recruited, enrolled and collected data underwent training by the
      data manager at UAB and worked from a detailed Manual of Procedures. A certification process
      is required for all coordinators, including mandatory institutional compliance training for
      human subject research, and each coordinator must successfully administer all protocol
      elements to at least three volunteer practice subjects before enrolling participants. Data
      managers at each site oversee the process and are responsible for quality control of all data
      before upload to FAIRhub.
  - role: Central laboratory and biorepository staff
    collector_details: >-
      CLIA-certified laboratories local to each site perform complete blood count testing on fresh
      whole blood. All other laboratory tests are performed by the University of Washington
      Nutrition and Obesity Research Center on stored frozen samples. Blood derivatives are sent to
      the biorepository at the University of Alabama at Birmingham Center for Clinical and
      Translational Science.
  - role: Central project data and engineering team
    collector_details: >-
      Software and cloud engineers, data scientists and database managers ingest, standardise and
      curate the data, map it to OMOP CDM and DICOM, and publish it through the FAIRhub platform.
    notes: >-
      Team effort was supported by NIH award OT2OD032644 based on percentage of effort, with
      salaries aligned to funding guidelines at each site. Study participants received a $200
      stipend for the study visit, also through the grant funding, paid after the final data were
      received and the study devices returned (typically at least two weeks after the visit) and
      not pro-rated; reasonable parking, public transit or rideshare costs associated with the
      visit were also covered.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      The FAIRhub metadata records the collection period for version 3.0.0 as 19 July 2023 to 1 May
      2025. Preliminary pilot enrolment occurred between 18 July 2023 and 30 November 2023 to allow
      coordinators to gain familiarity; formal data collection began on 1 December 2023. The
      overall project timeline spans four years: one year for protocol development and training,
      and years 2-4 for recruitment and data collection, with approximately 4-10% of participants
      expected to return for a follow-up examination in year 4.
    source_caveats: >-
      The BMJ Open protocol states that enrolment began on 18 July 2023 and will continue until 30
      November 2026, and the FAIRhub study record gives an anticipated completion date of 1 January
      2027; the collection window recorded here is that of the released v3.0.0 dataset only. The
      follow-up proportion is itself contested: the NIH abstract and IRB protocol say 10% of the
      cohort, while the healthsheet says approximately 4%.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      The study base is all patients aged 40 years and older who had a medical encounter within
      each health system site (UAB, UCSD, UW) between 2020 and 2025, identified by screening
      electronic health records for ICD-10 diagnosis codes and demographic data.
    strategies: >-
      Non-probability sampling with deliberate triple balancing. Participants are recruited in
      waves; the composition and size of each wave are influenced by the observed participation
      characteristics of race/ethnicity, gender, T2DM severity and site. Composition is monitored
      during recruitment and adjusted by under- and oversampling groups as needed. Contact pools
      are identified per wave by EHR screening; individuals receive a personalised hardcopy
      invitation letter and email directing them to an online REDCap interface. Rather than
      targeting the demographic distribution of the US population, the study recruits four
      race/ethnic groups, four T2DM categories and both biological sexes in approximately equal
      proportions. All study groups are recruited at each site, but group proportions vary with
      local demographic prevalence. Eligibility requires ability to consent, age 40 or older, and
      ability to speak and read English; pregnancy, gestational diabetes and type 1 diabetes are
      exclusionary.
    why_not_representative: >-
      The sample is intentionally balanced rather than demographically representative, because
      balanced datasets are held to be critical for developing unbiased machine learning models.
      Participants are volunteers, introducing volunteer bias. Recruitment is predominantly urban
      and hospital-based and so may not fully capture diverse cultural and socioeconomic
      backgrounds. The cohort does not include other races and ethnicities such as Pacific
      Islanders and Native Americans. Requiring participants to speak, read and understand English
      may have created challenges in recruiting Hispanic and Asian persons.
    source_caveats: >-
      The healthsheet answers that the dataset "contains all possible instances", meaning all
      participants enrolled to date, and answers "N/A" to the sampling strategy question, while the
      FAIRhub study_description records the sampling method as "Non-Probability Sample" and the BMJ
      Open protocol describes wave-based stratified sampling from an EHR-defined study base. Both
      characterisations are retained here.

raw_sources:
  - raw_data_details: >-
      Raw device exports before standardisation: ECG in .xml; MoCA Duo application output in .csv
      (total score, section subscores, Memory Index Score, task completion times); retinal imaging
      in native device formats including Topcon .fda and Heidelberg FLIO .sdt; at-home monitoring
      device exports including Garmin .FIT; NORC laboratory results in .csv; REDCap exports of
      questionnaire and clinical data.
    notes: >-
      The raw data are saved and expected to be preserved by the AI-READI project at least for the
      duration of the project, but are not currently shared outside the project team, because they
      have not been mapped to standardised terminologies and because they may inadvertently include
      personal health or personally identifiable information in free text fields. Raw data may be
      included in future releases of the controlled access dataset.

raw_data_sources:
  - source_description: >-
      Prospective in-person and at-home data collection from enrolled participants across three US
      sites, captured in REDCap and in device-native export formats.
    source_type: Primary prospective research data collection
    raw_data_format: 'REDCap exports (.csv), device-native formats (.xml, .fda, .sdt, .FIT, .csv)'
    access_details: >-
      Raw data are held by the project and are not released; only standardised data are distributed
      through FAIRhub.
  - source_description: >-
      Electronic health records at UAB, UCSD and UW, screened for ICD-10 diagnosis codes and
      demographic data to construct recruitment pools and, per the study protocol, to abstract
      general health, eye health, medical and surgical history, diabetes, medication, laboratory
      and prior imaging information.
    source_type: Electronic health records
    access_details: >-
      Past health records and medications are held under controlled access and are not part of the
      public release.
  - source_description: >-
      Driving and accident records obtained from the state Department of Licensing covering car
      accidents and traffic tickets in the preceding three years.
    source_type: Administrative government records
    access_details: >-
      Traffic and accident reports are held under controlled access and are not part of the public
      release.
  - source_description: >-
      Blood and urine specimens analysed by CLIA-certified local laboratories (complete blood
      count) and by the University of Washington Nutrition and Obesity Research Center (all other
      assays), with derivatives banked at the UAB Center for Clinical and Translational Science.
    source_type: Biospecimen analysis
    raw_data_format: Laboratory results in .csv
    access_details: >-
      Laboratory values are included in the clinical_data OMOP tables. Banked specimens (plasma,
      serum, buffy coats, genomic DNA, PAXgene RNA tubes, peripheral blood mononuclear cells) are
      held at UAB for future ancillary studies under procedures still in development.

preprocessing_strategies:
  - preprocessing_details: >-
      All data are mapped to applicable data standard formats: the Observational Medical Outcomes
      Partnership Common Data Model for clinical data, DICOM for retinal imaging, WFDB for ECG,
      Open mHealth for wearable activity and continuous glucose data, and the NASA ESDS ASCII
      format for environmental sensor data. Device-proprietary formats are transformed before
      upload to FAIRhub: Topcon .fda and Heidelberg .sdt files are converted to DICOM, and Garmin
      .FIT files are converted to the Open mHealth standard.
  - preprocessing_details: >-
      The dataset is organised according to the Clinical Dataset Structure (CDS) v0.1.1
      specification: one directory per datatype at the root, then one directory per modality, then
      one per device, then one per participant named with the participant's study ID number.
      Root-level metadata files accompany the data.
  - preprocessing_details: >-
      Data are uploaded at regular intervals by each site to FAIRhub, a Microsoft Azure cloud-based
      data management, curation and sharing platform developed for the project, and are stored and
      shared as "AI-ready" so as to enable AI/ML research without further reformatting and
      preprocessing. Processing moved from custom/ad hoc handling for v1.0.0 to a mix of automated
      and custom processing for the later versions.
  - preprocessing_details: >-
      The public release is stripped of Protected Health Information as defined by the HIPAA
      Privacy Rule via the Safe Harbor method, and additionally of sex, race/ethnicity and
      medication information; the stated rationale for removing sex and race/ethnicity is to
      prevent stigmatisation of findings.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the time of data entry and acquisition: clinical data outside expected
      minimum/maximum ranges were flagged in REDCap and surfaced in reports viewed by clinical
      research coordinators and data managers. Using these reports, records were examined for
      credibility (range checks), incorrect flow through prescribed skip patterns, missing data
      that could be filled directly from other portions of an individual's record, and omission or
      duplication of records. Editing was only done under the guidance and approval of the site
      principal investigator; where no logical or appropriate correction existed, the site PI
      reviewed the values and decided whether they should be removed.
  - cleaning_details: >-
      After data were sent from each study site to the central project team, additional processing
      was conducted in preparation for dissemination, including mapping to standardised
      terminologies and internal review by AI-READI team members for quality checks and to ensure
      that no personally identifiable information was accidentally included.

labeling_strategies:
  - labeling_details: >-
      No labelling or annotation was performed. The dataset is hypothesis-agnostic and is intended
      to facilitate multiple potential downstream AI/ML applications, so no gold-standard or proxy
      labels, annotator pool, annotation platform or inter-annotator agreement statistics exist.
      The healthsheet notes that no formal guidelines are in place for future researchers creating
      new labels or defining new tasks.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants; coverage varies by data domain and by
      device, as reflected in the differing per-directory file counts (for example 4,515 ECG files
      and 2,246 continuous glucose monitoring files across 2,280 participants).
    missing_data_causes: >-
      Participants electing not to take part in some study elements; devices returning no stored
      results or being returned too late to retrieve results (battery failure, lost data); data
      collisions during processing; skipped or incomplete survey responses; imaging modalities
      being skipped because of quality issues, patient discomfort or non-cooperation, or operator
      or system malfunction; and, for FLIO, reduced participant compliance because it is performed
      last and exposes participants to uncomfortable levels of light.
    handling_strategy: >-
      No imputation is applied. Missing modalities are simply absent from the participant
      directories. Records with values outside expected ranges were reviewed by data managers and
      site principal investigators and corrected or removed only where justified.

anomalies:
  - anomaly_details: Survey data may contain skipped questions or incomplete responses.
  - anomaly_details: >-
      Wearable and at-home device data may be affected by improper use, technical failure such as
      battery failure or system malfunction, and late device return.
  - anomaly_details: >-
      Imaging data may be affected by patient non-cooperation, noise obscuring the images, system
      malfunction and data transfer failures. Optomed Aurora images in particular are acquired
      undilated with a handheld camera, so image quality varies between participants and within the
      same participant.
  - anomaly_details: >-
      The Snellen visual acuity variables present in earlier versions were dropped in version
      3.0.0, leaving only logMAR visual acuity measurements; consumers comparing versions should
      expect this field to be absent.
    notes: >-
      Recorded here as a between-version data availability change. The declared bundle documents it
      in the healthsheet versioning section rather than as an erratum, and the healthsheet answers
      the erratum question with an empty response.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet states that the dataset does not contain data that might be considered
      confidential and that no personally identifiable information is included. The public release
      contains no protected health information.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      SCOPE: public release (the referent of this record). The public v3.0.0 release is stated not
      to contain sensitive data: it is stripped of PHI by the HIPAA Safe Harbor method and
      additionally of sex, race/ethnicity and medication information.
    notes: >-
      The following list entry records the separate controlled-access tier, which is not the
      referent of this record but which the declared bundle describes as containing sensitive
      elements. The two boolean values differ because they describe two different release tiers.
  - sensitive_elements_present: true
    sensitivity_details: >-
      SCOPE: controlled-access release (a separate distribution, not the referent of this record).
      The controlled-access release contains sensitive elements: 5-digit ZIP code, sex, race,
      ethnicity, genetic sequencing data, past health records, medications, and traffic and
      accident reports. Access requires the requesting scientist's institution to complete legal
      and privacy use agreements with the AI-READI research programme; requirements are set by a
      Data Access Committee.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor. No direct identifiers were collected into the released dataset, so no active
    de-identification was necessary; the team verified that no identifiable data per US HIPAA were
    present. Sex, race/ethnicity and medication information were additionally removed from the
    public release.
  identifiers_removed: >-
    Protected Health Information as defined by the HIPAA Privacy Rule (Safe Harbor method); Sex;
    Race and ethnicity; Medications used; 5-digit ZIP code (withheld to controlled access); Past
    health records (withheld to controlled access); Traffic and accident reports (withheld to
    controlled access); Genetic sequencing data (withheld to controlled access).
  deidentification_details: >-
    This assessment is scoped to the public v3.0.0 release, which is the referent of this record;
    identifiable_elements_present is false for that release. The separate controlled-access
    release, recorded under sensitive_elements, does retain 5-digit ZIP code, sex, race, ethnicity,
    genetic sequencing data, past health records, medications and traffic and accident reports, and
    is governed by institutional data use agreements rather than by Safe Harbor de-identification.
    To deter re-identification the project implements a robust data dissemination system, a strict
    licence agreement and data watermarking for both the public and controlled sets, and the
    licence forbids any attempt to identify or contact a data subject. The healthsheet nevertheless
    acknowledges a theoretical risk of future re-identification, noting that AI algorithms can
    infer individual patient characteristics and could facilitate individual-level identification.
  source_caveats: >-
    The FAIRhub datasetDeIdentLevel block records deIdentType as "NoDeIdentification" with
    deIdentDirect true, deIdentHIPAA true, deIdentDates false, deIdentNonarr false and deIdentKAnon
    false; the accompanying detail explains that no identifiers were collected so no active
    de-identification was necessary. Two healthsheet questions about de-identification
    pre-processing measures are left with empty responses.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers recruited from health-system electronic health records, giving
      rise to volunteer bias that may limit generalisability to those not represented in the study
      population. Recruitment is predominantly urban and hospital-based and may not fully capture
      diverse cultural and socioeconomic backgrounds.
    mitigation_strategy: >-
      Recruitment in waves with monitoring of composition, personalised invitation materials, and
      offers of transportation assistance (rideshare services) to participants reporting barriers
      to reaching study visits.
  - bias_type: representation_bias
    bias_description: >-
      The cohort covers only four self-reported race/ethnicity groups (Asian, Black, Hispanic,
      White) and does not include other groups such as Pacific Islanders and Native Americans.
      Eligibility requires the ability to speak and read English, which may have created challenges
      in recruiting Hispanic and Asian persons. Participants must be aged 40 or older.
    affected_subsets:
      - >-
        Groups absent from the cohort entirely, and non-English-speaking members of the
        represented groups.
    mitigation_strategy: >-
      Three geographically diverse sites were selected to broaden representation, with each site
      prioritising the groups most prevalent in its area; engagement with the Native Biodata
      Consortium provides a co-learning opportunity regarding American Indian and Alaska Native
      communities, and a tribal consultation is planned. The project states that new recruitment
      strategies will be implemented if race/ethnicity balancing emerges as a challenge.
  - bias_type: sampling_bias
    bias_description: >-
      Enrolment is ongoing and the interim releases, including this one, may not have achieved the
      intended balanced distribution across race/ethnicity, sex and diabetes severity groups. The
      recommended split table shows, for example, 836 White versus 380 Hispanic participants and
      1,329 female versus 951 male participants in the full v3.0.0 cohort.
    affected_subsets:
      - >-
        The training partition in particular is unbalanced; the validation and test partitions
        were constructed to be balanced.
    mitigation_strategy: >-
      A recommended 70/15/15 split was prepared centrally so that the validation and test sets are
      balanced as far as possible for sex, race/ethnicity and diabetes status; under- and
      oversampling of groups continues during ongoing recruitment.
  - bias_type: historical_bias
    bias_description: >-
      Recruitment of Black men into health research is well documented to be more difficult than
      for other populations, with medical mistrust and fear of safety stemming from historical
      events such as the Tuskegee syphilis study, even though this population bears a
      disproportionate burden of T2DM; similar under-recruitment trends have been reported for
      Hispanic and Asian persons.
    mitigation_strategy: >-
      Tailored printed materials and a personalised, participatory approach to recruitment; a
      Community Advisory Board of 11 persons drawn from the three sites, including diversity in
      race and ethnicity as represented in the AI-READI sample, contributes to protocol development.

known_limitations:
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset is cross-sectional with a single study visit per participant; only a small
      fraction of the cohort is planned to be invited for a follow-up visit in project year 4, so
      within-person trajectories are not directly observable in this release.
    scope_impact: >-
      Analyses of change over time must rely on cross-sectional pseudotime approaches rather than
      on repeated measures.
    source_caveats: >-
      The size of the follow-up subset is contested: the NIH abstract and IRB protocol state 10% of
      the study cohort, while the healthsheet states approximately 4% of participants.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Version 3.0.0 contains 2,280 of the target participants, and the public release omits sex,
      race/ethnicity, medications, ZIP code, genomic data, past health records and traffic and
      accident reports, all of which are held under controlled access.
    recommended_mitigation: >-
      Researchers requiring the withheld variables must enter into a data use agreement for the
      controlled-access release; the recommended data split is provided so that public-set users
      can train and evaluate models with demographically balanced validation and test partitions
      despite lacking the demographic labels.
    source_caveats: >-
      The target enrolment is contested: the BMJ Open protocol, Nature Metabolism comment, NIH
      abstract and FAIRhub enrollmentInfo all state 4,000, while the UW IRB protocol states 4,600.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Data in this version were collected between 19 July 2023 and 1 May 2025; the dataset is
      released as static versions and is not updated in place, so it will progressively lag ongoing
      enrolment until the next annual release.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The cohort is deliberately balanced rather than representative of the US population, and is
      drawn from three urban academic health systems, so prevalence estimates derived from it will
      not reflect any general population.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The biorepository holds a finite number of samples to share with scientists; procedures for
      reviewing and prioritising written requests were still being developed at the time the
      protocol was published. Eligibility requires participants to speak, read and understand
      English, and pregnancy, gestational diabetes and type 1 diabetes are exclusionary.
    recommended_mitigation: >-
      Biobanked samples will be made available according to procedures and policies still in
      development; a supplement was submitted to fund translation of study materials into Spanish.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels, targets or human-level performance benchmarks are provided, and no formal
      guidelines exist for researchers who wish to create new labels or define new tasks.
  - limitation_type: resolution_limitation
    limitation_description: >-
      Blood samples are non-fasting, and the at-home monitoring window is limited to 10 days per
      participant (with an optional retrospective window of up to 90 additional days only for
      participants who already wore a Dexcom G6 and consented to that download).

intended_uses:
  - use_category: Artificial intelligence and machine learning research on type 2 diabetes
    usage_notes: >-
      The dataset is optimised for downstream AI/ML research into T2DM pathogenesis and
      salutogenesis, including pseudotime manifold analysis and multimodal model development.
      Public-set access requires agreeing to use the data only for type 2 diabetes related
      research; a controlled/private version is described as allowing more generic use.
  - use_category: Methodological exemplar for AI-ready dataset creation
    usage_notes: >-
      The project intends its blueprint, standards (including the Clinical Dataset Structure
      specification), FAIRhub platform and documentation practices to be reused by other data
      generation projects preparing AI-ready clinical research datasets.
  - use_category: Research resource only
    usage_notes: >-
      The licence states that the data are intended solely as a research resource. Licensees may
      create derivative works and may make, reproduce and distribute models, algorithms and
      programs developed, trained or adapted using the data, provided those models do not
      themselves contain the data or a modified version of it, and provided reasonable efforts are
      undertaken before dissemination to minimise the likelihood that data can be memorised,
      derived, reconstructed or reconstituted through the models.

discouraged_uses:
  - discouragement_details: >-
      Use of the data to make clinical treatment decisions is not permitted; the licence states the
      data are intended solely as a research resource.
  - discouragement_details: >-
      The healthsheet points to the licence restrictions as the answer to what usage is
      discouraged, and states that the project does not currently anticipate uses that would result
      in unfair treatment or harm, while noting a theoretical risk of future re-identification that
      users should bear in mind.

prohibited_uses:
  - prohibition_reason: >-
      The licence prohibits using or attempting to use the data, alone or in concert with other
      information, to compromise or infringe the confidentiality or privacy of any data subject, to
      identify or contact any individual data subject or group of data subjects, to extract or
      extrapolate identifying information, to establish a data subject's membership in a particular
      group of persons, or otherwise to cause harm or injury to any data subject.
  - prohibition_reason: The licence prohibits making clinical treatment decisions based on the data.
  - prohibition_reason: >-
      The licence prohibits transferring, licensing, sublicensing, selling, assigning, displaying,
      sharing or otherwise conveying any portion of the data or any derivative work to any third
      party other than another licensee bound by an identical agreement with the licensor.
  - prohibition_reason: >-
      Access to the public release is conditioned on agreeing to use the data only for type 2
      diabetes related research, so uses outside that scope are not permitted under the public
      access terms.

other_tasks:
  - task_details: >-
      The FAIRhub consent metadata records that the public version of the dataset can only be used
      for type 2 diabetes related research, while a private (controlled-access) version will allow
      for more generic use, implying that broader research applications of the multimodal domains
      are possible under controlled access.
  - task_details: >-
      Engagement with the Native Biodata Consortium is intended to provide a co-learning
      opportunity for evaluating tools such as data usage agreements, contract negotiations,
      transparent access agreements and mechanisms for assured return of benefit and sustainable
      Tribal input, control and monitoring, with a goal of collecting similar data within a Native
      American cohort.

existing_uses:
  - examples:
      - >-
        None reported. The v3.0.0 healthsheet answers "No" to whether the dataset has been used for
        any tasks already, and the FAIRhub record shows a citation count of zero alongside 24,636
        views.

use_repository:
  - repository_details: >-
      No repository links to papers or systems that use the dataset. The healthsheet answers "No"
      to whether such a repository exists beyond Google Scholar. FAIRhub itself displays usage
      statistics (views, cited by, access approved) on the dataset landing page.
    repository_url: https://fairhub.io/datasets/3

future_use_impacts:
  - impact_details: >-
      A theoretical risk of future re-identification exists, since AI algorithms can infer
      individual patient characteristics and could facilitate individual-level identification.
      Mitigations in place are a robust data dissemination system, a strict licence agreement and
      data watermarking for both public and controlled sets.
  - impact_details: >-
      Because enrolment is ongoing, the pilot and interim releases may not have achieved balanced
      distribution across race/ethnicity, sex and diabetes severity groups; models trained on an
      interim release may inherit that imbalance.
  - impact_details: >-
      American Indian and Alaska Native communities are described as unique and highly identifiable
      groups that could benefit from precision health AI studies but that require specific
      safeguards; the project engages the Native Biodata Consortium to evaluate such safeguards
      before any comparable data collection.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      Approved under study number STUDY00016228, with initial approval on 20 December 2022 and
      reliance agreements with the IRBs of the University of Alabama at Birmingham and the
      University of California, San Diego. An annual renewal application reporting status and
      progress is required within 90 days of expiration. The initial approval letter is published
      with the dataset documentation. The FAIRhub oversight module records the human subject review
      status as "Submitted, approved", the study as not FDA-regulated for drug or device, and no
      Data Monitoring Committee. The study is registered on ClinicalTrials.gov as NCT06002048.
    notes: >-
      The BMJ Open protocol additionally states that the project aims to establish standards, best
      practices and guidelines for collection, preparation and sharing of data for AI/ML purposes
      with guidance from bioethicists, and that ethical, legal and social implications are
      considered at every stage of the project cycle.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      University of Washington IRB STUDY00016228; initial approval 20 December 2022; reliance
      agreements with UAB and UCSD IRBs; annual continuing review required.
  ethics_review_board: >-
    University of Washington Human Subjects Division / Institutional Review Board, serving as the
    single IRB of record for the three data collection sites.
  regulatory_compliance: >-
    HIPAA (public release stripped of PHI by the Safe Harbor method); licensees must comply with
    the NIH Genomic Data Sharing Policy security best practices for controlled-access data; the
    study is registered on ClinicalTrials.gov (NCT06002048) and is recorded as not FDA-regulated
    for drugs or devices; written informed consent is provided by all participants.
  special_populations: >-
    No protected population is deliberately targeted. Eligible participants are adults aged 40 and
    older; pregnancy, gestational diabetes and type 1 diabetes are exclusionary, and the FAIRhub
    eligibility module additionally records a maximum age of 85 years. The IRB protocol records
    that prisoners are not a target population and that no minors are enrolled.

at_risk_populations:
  special_protections:
    - >-
      Pregnant women, individuals with gestational diabetes and individuals with type 1 diabetes
      are excluded from participation. No minors are enrolled, so no parental permission or assent
      procedures apply. Participants must be able to provide consent themselves. Where a
      participant reports barriers to reaching a study visit, transportation assistance (rideshare
      services) is offered.
  notes: >-
    The IRB protocol notes that accessibility measurements were not specifically assessed. All
    communication with participants is in English; a supplement was submitted to fund translation
    of study materials so that Spanish-speaking participants who are not fluent in English could be
    enrolled.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either electronically (e-consent with electronic signature
      in REDCap) before the visit or in person at the start of the visit.
    consent_documentation: >-
      The approved consent form for the principal project site, the University of Washington, is
      published with the dataset documentation. The other clinical sites operated under IRB
      reliance and used the same consent form with minor institution-specific language, including
      the California Bill of Rights required at UCSD. Signed e-consent forms are automatically
      emailed to participants, who may request further copies from the study coordinator for the
      duration of the study. Consent was required before any part of the protocol, including
      questionnaires, with the exception of the screening questionnaire.
    consent_scope: >-
      Consent covers participation in the study protocol, banking of biospecimens for future
      research, and placement of the resulting data in an open-source repository. The FAIRhub
      consent metadata records the consent type as "ConsentSpecifiedNotElsewhereCategorised" and
      states that the public version can only be used for type 2 diabetes related research while a
      private version will allow more generic use; consentNoncommercial, consentGeogRestrict,
      consentResearchType, consentGeneticOnly and consentNoMethods are all recorded as false.
      Individuals were notified of the data collection through personalised invitation letters and
      emails directing them to a REDCap interface describing the programme, where they could read
      an overview, download the consent document, request a call back, complete a screening survey
      or enroll.
    withdrawal_mechanism: >-
      Participants may withdraw consent at any time and cease study participation; however, any
      data that had been shared or used up to that point remains in the dataset. This limitation is
      stated in the consent document. No mechanism is described for retracting data from releases
      already distributed.

data_protection_impacts:
  - impact_details: >-
      No data protection impact analysis has been conducted, per the v3.0.0 healthsheet.

license_and_use_terms:
  data_use_permission: disease_specific_research
  license_terms: >-
    Version 3.0.0 is released under the AI-READI custom license v2.0
    (https://doi.org/10.5281/zenodo.17555036), described as tailored to enable reuse of the
    AI-READI dataset for commercial or research purposes while imposing strong requirements around
    data usage, security and secondary sharing to protect study participants, especially when data
    are reused for AI and ML applications. Access requires logging in through a verified ID system,
    agreeing to use the data only for type 2 diabetes related research, and agreeing to the licence
    terms. The earlier University of Washington Data License Agreement v1.0 (Zenodo record
    10642459) grants a non-exclusive, non-transferable licence to download, reproduce and use the
    data and to create derivative works for research and commercial purposes, prohibits onward
    conveyance to non-licensees, permits distribution of models that do not contain the data
    subject to efforts to prevent memorisation or reconstruction, forbids clinical treatment
    decisions and any re-identification attempt, requires compliance with NIH Genomic Data Sharing
    security standards, requires acknowledgement of the source and funder in publications,
    terminates automatically on breach with deletion of all copies, disclaims all warranties, caps
    aggregate liability at one US dollar, and requires indemnification of the licensor.
  contact_person: contact@aireadi.org
  notes: >-
    The dataset documentation is shared separately under CC-BY 4.0. The FAIRhub access type is
    recorded as "PublicDownloadSelfAttestationRequired". Users are required by the licence and by
    the dataset documentation to follow the citation instructions published at
    https://docs.aireadi.org/docs/3/citation and to cite AI-READI Consortium, Flagship Dataset of
    Type 2 Diabetes from the AI-READI Project, version 3.0.0, FAIRhub, 2025,
    https://doi.org/10.60775/fairhub.3. The BMJ Open protocol article itself is published under CC
    BY-NC 4.0, which governs the article rather than the data.
  source_caveats: >-
    The declared bundle contains the full text of AI-READI custom license v1.0 (the University of
    Washington Data License Agreement, Zenodo 10642459) but only references, not the text, of the
    v2.0 licence cited in the v3.0.0 rights metadata (Zenodo 17555036). Terms attributed to v1.0
    above may or may not persist unchanged in v2.0.

ip_restrictions:
  restrictions:
    - >-
      Under the licence, title to the data and all industrial and intellectual property rights
      therein remain solely and exclusively with the licensor (University of Washington) and its
      suppliers; the licensee must not take any action inconsistent with that ownership and any
      rights not expressly granted are reserved. All full and partial copies made by a licensee
      are subject to the licence terms. Licensees may make, reproduce and distribute models,
      algorithms and programs developed, trained or adapted using the data, provided the models do
      not themselves contain the data or a modified version of it.
  notes: >-
    The healthsheet answers the question about third-party IP-based restrictions by referring to
    the licence. Several imaging devices were loaned or discounted by manufacturers, but no
    manufacturer IP restriction on the data is described.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
    - >-
      The healthsheet refers questions about export controls and other regulatory restrictions to
      the licence. The licence requires licensees to comply with all applicable laws, regulations
      and restrictions relating to the distribution and use of the data and of models derived from
      it, and to comply with the data security and privacy standards established by the NIH under
      its Genomic Data Sharing Policy, currently the NIH Security Best Practices for
      Controlled-Access Data Subject to the NIH GDS Policy.
  other_compliance: >-
    HIPAA Privacy Rule Safe Harbor de-identification for the public release; NIH Genomic Data
    Sharing Policy security best practices; study registration on ClinicalTrials.gov (NCT06002048);
    the study is recorded as not FDA-regulated for drug or device.
  governance_committee_contact: >-
    AI-READI Data Access Committee, contactable via https://aireadi.org/contact or
    contact@aireadi.org. Access to the controlled-access release requires the requesting
    scientist's institution to complete legal and privacy use agreements with the AI-READI research
    programme; the requirements are being developed by the Data Access Committee.

distribution_dates:
  - release_dates:
      - '2024-05-03'
      - '2024-11-08'
      - '2025-11-17'
    notes: >-
      Version 1.0.0 (DOI 10.60775/fairhub.1) released 3 May 2024 with pilot data; version 2.0.0
      (DOI 10.60775/fairhub.2) released 8 November 2024; version 3.0.0 (DOI 10.60775/fairhub.3)
      released 17 November 2025. Releases occur approximately annually. The dataset is distributed
      publicly to parties outside the creating organisations, subject to verified-ID login,
      self-attestation and licence acceptance; onward sharing by a licensee is restricted to other
      licensees bound by an identical agreement.
    source_caveats: >-
      The BMJ Open protocol describes the first public release as May 2024 and a subsequent release
      including all data collected through 31 July 2024 as planned for November 2024, which
      corresponds to v2.0.0; the healthsheet instead gives the v3.0.0 collection cut-off as 1 May
      2025.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. It is hosted on FAIRhub, which runs on
      Microsoft Azure. Contact information is provided in the README file included with the
      dataset; general project contact is via https://aireadi.org/contact and contact@aireadi.org,
      and the FAIRhub study record lists Aaron Lee as central contact.

updates:
  frequency: Approximately annually
  update_details: >-
    The dataset is released as static versions and is not updated in place. Rather than correcting
    or amending an existing release, new versions are published with additional instances as more
    study participants complete the study visit. Changes between versions are documented in the
    CHANGELOG file included with the dataset and visible at docs.aireadi.org. Version 1.0.0
    contained 204 pilot participants with 15+ data types processed by custom/ad hoc means; year 2
    added 863 participants and one imaging device; year 3 added 1,213 participants and three
    imaging devices; version 3.0.0 totals 2,280 participants with automated plus custom processing.

version_access:
  latest_version_doi: 10.60775/fairhub.3
  versions_available:
    - '1.0.0 (10.60775/fairhub.1, 3 May 2024, 204 participants)'
    - '2.0.0 (10.60775/fairhub.2, 8 November 2024, 1,067 participants, 2.01 TB, 165,051 files)'
    - '3.0.0 (10.60775/fairhub.3, 17 November 2025, 2,280 participants, 3.82 TB, 356,343 files)'
  version_details: >-
    Each version has its own DOI and its own documentation set at docs.aireadi.org, navigable via a
    version dropdown. The FAIRhub landing page for v2.0.0 states that that version of the dataset
    is no longer accessible and directs users to the latest version; the healthsheet states that
    older versions will not be updated but does not guarantee continued hosting. Version-specific
    healthsheets are published for v1.0.0 and v2.0.0 at
    https://docs.aireadi.org/docs/1/dataset/healthsheet and
    https://docs.aireadi.org/docs/2/dataset/healthsheet.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances; participants
    were not told that their data would be retained only for a fixed period. Raw data are expected
    to be preserved by the project at least for the duration of the project.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those involved in the project. Related project outputs are, however, developed openly:
    guidelines and materials are published through the Zenodo AI-READI community and the AI-READI
    GitHub organisation, and the Clinical Dataset Structure specification is published openly.
  contribution_url: https://github.com/AI-READI

external_resources:
  - external_resources:
      - 'Dataset documentation: https://docs.aireadi.org/ (see Dataset v3.0.0)'
      - 'Project website: https://aireadi.org/'
      - 'Zenodo community: https://zenodo.org/communities/aireadi'
      - 'GitHub organisation: https://github.com/AI-READI'
      - 'Clinical Dataset Structure specification: https://cds-specification.readthedocs.io'
      - 'Licence record: https://doi.org/10.5281/zenodo.17555036'
      - 'Data sharing policy: https://aireadi.org/goals/data-sharing'
      - 'NIH RePORTER project record: https://reporter.nih.gov/project-details/10471118'
      - 'ClinicalTrials.gov registration NCT06002048'
      - 'Prior dataset versions: 10.60775/fairhub.1 and 10.60775/fairhub.2'
    future_guarantees: >-
      The healthsheet states that the dataset is self-contained but relies on the documentation for
      users requiring additional information about provenance.
    restrictions:
      - >-
        The documentation is shared under the CC-BY 4.0 licence, so there are no restrictions
        associated with its use.
    notes: >-
      Both the FAIRhub landing pages and the documentation site carry the banner "This repository
      is under review for potential modification in compliance with Administration directives",
      which bears on the future availability of these resources.

notes: >-
  The recommended 70/15/15 train/validation/test split is delivered in the participants.tsv file
  included with the dataset. Composition per the README summary table: TRAIN, n=1,576 --
  race/ethnicity Hispanic 204, Asian 369, Black 343, White 660; sex male 599, female 977; diabetes
  status no diabetes 600, lifestyle 384, oral 487, insulin 105; mean age 61.1 +/- 11.3 years.
  VALIDATION, n=352 -- race/ethnicity 88 in each of the four groups; sex male 176, female 176;
  diabetes status no diabetes 88, lifestyle 88, oral 109, insulin 67; mean age 60.3 +/- 10.8 years.
  TEST, n=352 -- race/ethnicity 88 in each of the four groups; sex male 176, female 176; diabetes
  status no diabetes 88, lifestyle 88, oral 90, insulin 86; mean age 60.5 +/- 11.4 years. Because
  sex, race and ethnicity are not released with the public version, the splits were prepared
  centrally so that the validation and test sets are balanced as well as possible, with the stated
  rationale of reducing disparities in models developed using this dataset. A smaller "mini"
  version of the dataset is advertised on the FAIRhub landing page as available for pipeline
  development, and the FAIRhub API record for dataset 3 lists a child dataset with identifier 4 and
  a "mini" flag set to false for the parent; the v3.0.0 documentation describes the mini-subset
  under Preliminary Information. The FAIRhub API record also reports 24,636 views and zero
  citations at the time of capture, and gives internal identifiers dataset_id
  d894862f-0795-4ba6-b40b-fae14eb77813, study_id f5d4172f-b0fb-48c8-b545-0192d812b329 and
  version_id 504ba283-30fc-4a78-b2f9-857d3108a4ad. Results returned to participants during the
  study (heart rate, blood pressure and visual acuity on an exam card at the visit; a Dexcom report
  by encrypted email after the 10-day monitoring period; laboratory results with normative values
  at the time of the yearly data release) are part of the study protocol rather than of the
  released dataset. Incidental findings judged potentially life- or vision-threatening (retinal
  detachment, tumour, optic disc oedema) trigger immediate referral. Marijuana use was not assessed
  for participants living in Alabama because it is an illegal substance there, which introduces a
  site-specific gap in the substance-use questionnaire.

source_caveats: >-
  The declared bundle contains ten sources of differing dates and authority, and they disagree in
  several places. (1) Project name: the BMJ Open protocol and Nature Metabolism comment expand
  AI-READI as "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights", while NIH
  RePORTER, the FAIRhub study_description and the healthsheet expand it as "Artificial Intelligence
  Ready and Exploratory Atlas for Diabetes Insights". (2) Sponsoring institution: the FAIRhub
  study_description records the managing organization, lead sponsor and the affiliation of PIs
  Aaron Lee, Cecilia Lee and Sally Baxter variously as "Washington University in St. Louis" (ROR
  01yc7t268), whereas NIH RePORTER gives the awardee organization as University of Washington, the
  licence names the University of Washington as licensor, and the publications place Aaron and
  Cecilia Lee at the University of Washington and Sally Baxter at UC San Diego; the creators slot
  records the publication-supported affiliations and flags the FAIRhub values as an apparent
  metadata error. (3) Target enrolment: the IRB protocol states a cross-sectional dataset of 4,600
  people, while the publications, NIH abstract and FAIRhub enrollmentInfo state 4,000. (4)
  Longitudinal subset: the NIH abstract and IRB protocol say longitudinal data from 10% of the
  cohort, while the healthsheet says approximately 4% of participants are expected to undergo a
  follow-up examination in year 4. (5) Documentation versioning: the "About" pages for both
  documentation v2.0.0 and v3.0.0 state that the associated dataset version "contains data from the
  participants of the pilot study phase", which contradicts the README and healthsheet descriptions
  of v2.0.0 and v3.0.0 as containing first- and second-year main-study data; both docs pages also
  show a last-updated date of 4 June 2026, later than the release dates. (6) Diabetes prevalence:
  the BMJ Open protocol cites 10.5% of the world's adult population, while the Nature Metabolism
  comment says T2DM affects more than 6% of the world's population. (7) Public-release content: the
  healthsheet general summary lists the controlled-access items without medications, while the
  composition and dataset description sections and the docs pages include medications among the
  withheld items. (8) De-identification: the FAIRhub deIdentType is "NoDeIdentification" although
  HIPAA Safe Harbor treatment is asserted elsewhere, and two healthsheet de-identification
  questions have empty responses. (9) Licence: the bundle carries the full text of v1.0 of the
  licence but only a DOI reference for the v2.0 licence that governs v3.0.0. (10) The IRB protocol
  in the bundle is a form template with responses interleaved and, in places, describes earlier
  design intentions (for example 4,600 participants, PhenX survey selection, a stipend that "may be
  changed in future years") that may not match the executed protocol. Where sources conflict, both
  readings have been recorded in the relevant slot rather than one being silently selected.
  Separately, the identifiers on the ten entries in the resources slot are locally minted fragment
  URIs on the dataset DOI: the CoreDataset range requires an id, but the declared bundle assigns
  those directories no identifiers of their own, and the fragment URIs do not resolve. Creator
  affiliations and funder grant identifiers are recorded in the notes of their respective entries
  because those slots require structures the declared bundle cannot supply. This core record is a
  reduction of the corresponding full record and asserts nothing beyond it; per-variable metadata
  carried in the full record's variables slot has been folded into collection_mechanisms, and split
  composition into notes.