id: https://doi.org/10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship multimodal dataset generated by the AI-READI (Artificial
  Intelligence Ready and Equitable/Exploratory Atlas for Diabetes Insights) project, one of four
  Data Generation Projects of the NIH Common Fund Bridge2AI program. The dataset contains data
  from 2,280 adult participants with and without type 2 diabetes mellitus (T2DM), collected
  between 19 July 2023 and 1 May 2025 and harmonised across three US data collection sites
  (University of Alabama at Birmingham, University of California San Diego, and University of
  Washington). The study is cross-sectional, hypothesis-agnostic, and designed to be
  "triple-balanced" across self-reported race/ethnicity (Asian, Black, Hispanic, White), T2DM
  presence and severity (no diabetes; pre-diabetes or lifestyle-controlled; controlled by oral or
  non-insulin injectable medication; insulin-controlled), and biological sex, with the long-term
  aim of supporting downstream pseudotime manifold analysis of salutogenesis (the pathway from
  disease back to health) in T2DM. Each participant completed pre-visit questionnaires, a single
  in-person visit of roughly 2.5-4 hours, and a 10-day at-home monitoring period. Data domains
  include survey and social-determinants-of-health data, physical measurements and vitals,
  clinical laboratory tests on blood and urine, 12-lead electrocardiography, cognitive screening
  (MoCA), monofilament testing for peripheral neuropathy, visual function testing, retinal imaging
  (colour fundus photography, fundus autofluorescence, infrared reflectance, OCT, OCTA and
  fluorescence lifetime imaging ophthalmoscopy) from multiple device manufacturers, continuous
  glucose monitoring (Dexcom G6), wearable activity monitoring (Garmin Vivosmart 5), and indoor
  environmental sensing from a custom-built sensor. The released dataset comprises 356,343 files
  totalling approximately 3.82 TB (3,815,969,779,678 bytes), organised according to the Clinical
  Dataset Structure (CDS) v0.1.1 specification into one directory per datatype, then modality,
  then device, then participant. The public release contains no protected health information; sex,
  race/ethnicity and medication information have been withheld, and a controlled-access release
  holds the more sensitive elements. The dataset is distributed through the FAIRhub platform under
  a custom licence and is accompanied by a recommended 70/15/15 train/validation/test split
  (1,576 / 352 / 352 participants) balanced for age, sex, race/ethnicity and diabetes status.
