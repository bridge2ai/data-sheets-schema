source_caveats: 'The bundle disagrees with itself on several figures and these are reported rather than
  resolved. Target size: the project documentation states a flagship dataset of 10,000 voices and an anticipated
  enrollment of 10,000 by 2027, while the audiomics white paper and the IRB protocol state 30,000 voices;
  both are aims, and neither describes any release. Recording counts: the project documentation states
  that version 3.0 contains approximately 61,937 voice-derived recordings from 833 adult participants,
  whereas the PhysioNet v3.0.0 and v3.1.0 pages give per-feature record counts (for v3.1.0, 29,278 spectrogram
  records and 32,522 pitch records), and the two accounts are not reconciled anywhere in the bundle. Version
  currency: sections of the project documentation are written against v2.0.0 (study population, language
  options) and others against v3.0.0, while the PhysioNet pages carry v1.1, v3.0.0 and v3.1.0. Access
  tier: the v1.1 PhysioNet page is labelled "Restricted Access" with a registered-user policy, and the
  v3.0.0 and v3.1.0 pages are labelled "Credentialed Access". Distribution platform: the healthsheet describes
  distribution through Health Data Nexus, whereas versions 1.1 onward are published on PhysioNet. Award
  identifiers: two award strings in the project documentation ("3TF-OT2ActfOD032720Projectf01S1" and "Award
  #3Tf-OTOD03272001S2") are garbled in the captured text and are recorded under the funders entry as transcribed.'
purposes:
- id: d4d:voice_purpose_biomarker_database
  name: Establish a large, ethically sourced voice database for biomedical AI
  response: The Bridge2AI-Voice dataset was created to address a gap in the availability of large-scale,
    diverse and well-documented voice data for clinical machine-learning applications. Earlier studies
    of machine-learning voice diagnosis produced promising results but used sample sizes that were too
    small or lacked the metadata needed to train robust, clinically useful models. The dataset aims to
    bridge that gap by providing an ethically sourced, large and diverse resource with which to develop,
    benchmark or validate clinically applicable AI and ML models, so that voice can be used as a non-invasive,
    cost-effective biomarker for the screening, diagnosis and monitoring of a wide range of health conditions.
- id: d4d:voice_purpose_research_applications
  name: Support research applications rather than administrative ones
  response: The dataset is primarily intended for research applications, specifically the development
    of AI and machine-learning models for healthcare, and to support clinical research in disease screening,
    diagnosis and monitoring through voice biomarkers.
tasks:
- id: d4d:voice_task_data_acquisition_module
  name: Data acquisition module
  response: To build a multi-modal, multi-institutional, large-scale, diverse and ethically sourced human
    voice database linked to other biomarkers of health that is friendly to AI and ML methods.
- id: d4d:voice_task_standards_module
  name: Standards module
  response: To introduce the field of acoustic biomarkers by developing new standards for acoustic and
    voice data collection and analysis for voice AI research, and to create bioinformatics standards that
    make voice data interoperable.
- id: d4d:voice_task_tool_development
  name: Tool development and optimization
  response: To develop software and cloud infrastructure for automated voice data collection through a
    smartphone application allowing non-invasive, user-friendly, high-quality collection while minimising
    human manipulation, including integrated acoustic amplifiers and acoustic quality standardization,
    and to implement federated learning so that multi-institutional data can be analysed without data
    leaving each institution.
- id: d4d:voice_task_ethics_module
  name: Ethics module
  response: To integrate existing scholarship, tools and guidance with new normative insight for identifying,
    anticipating and addressing ethical and trustworthiness issues arising from voice data generation
    and voice AI research through to clinical adoption, and to develop new guidelines for consenting to
    voice data collection, sharing and use.
- id: d4d:voice_task_teaming_module
  name: Teaming module
  response: To build bridges between medical voice research, acoustic engineering and the AI/ML world
    so that voice AI algorithms acquire tangible clinical application.
- id: d4d:voice_task_workforce_module
  name: Skills and workforce development module
  response: To develop a curriculum on voice biomarkers of health and on the development, validation and
    implementation of AI models that are FAIR and CARE, and to create a community of voice AI researchers,
    especially from underserved communities.
- id: d4d:voice_task_ml_tasks
  name: Machine-learning tasks defined on the released data
  response: The current version comes with predefined tasks and labelling designed primarily for training
    machine-learning models for disease detection and classification from voice. Labels include diagnostic
    categories such as vocal pathologies, neurological disorders, psychiatric conditions and respiratory
    disorders.
addressing_gaps:
- id: d4d:voice_gap_small_datasets
  name: Small, non-standardised and private voice datasets
  response: Existing work on voice as a biomarker has been limited to small- and medium-sized datasets,
    often using voice as the only data type, and comparing studies or pooling data has been difficult
    because there are no standards for how voice and speech data are collected. Industry datasets are
    often private, which prevents auditing of models and of the accuracy of training labels. For machine-learning
    applications in laryngeal cancer screening and diagnosis, most reported training datasets contained
    fewer than 300 patients and only two studies used more than one data modality.
- id: d4d:voice_gap_linked_health_data
  name: Voice data unlinked to multimodal health information
  response: Current literature is largely restricted to acoustic measures not linked to multi-modal health
    data. Bridge2AI-Voice addresses this by linking acoustic data to demographics, confounders, validated
    questionnaires, clinician-validated diagnoses and, at some sites, imaging and genomic data, so that
    audiomics can be integrated into multi-omics analysis.
- id: d4d:voice_gap_ethics_and_diversity
  name: Ethical, legal and diversity gaps in voice AI
  response: The consortium set out to define ethical and legal norms that safeguard participants' data
    while supporting data sharing, to create benchmarks of diversity metrics and minimise the risk of
    algorithmic bias, and to address risks of voice re-identification, voice AI hacking, and the influence
    of gender and racial diversity on the development of these technologies.
