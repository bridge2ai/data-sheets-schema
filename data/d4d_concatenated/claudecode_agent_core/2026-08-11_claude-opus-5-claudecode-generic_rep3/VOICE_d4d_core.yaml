id: https://doi.org/10.13026/37yb-1t42
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: 'Bridge2AI-Voice is an ethically sourced, multi-institutional voice dataset linked to multimodal
  health information, generated by the Voice as a Biomarker of Health grand challenge of the NIH Common
  Fund Bridge2AI program. It pairs standardized acoustic recordings — voice, speech, breathing and cough
  tasks — with detailed demographics, confounder surveys, validated patient-reported questionnaires and
  clinician-validated diagnoses across four adult disease cohorts (voice disorders, neurological and neurodegenerative
  disorders, mood and psychiatric disorders, and respiratory disorders) together with controls. Version
  3.1.0, published on PhysioNet on 1 May 2026, contains data for 833 adult participants collected at five
  sites in North America. The public release carries derived audio features rather than the original waveforms:
  spectrograms, Mel spectrograms, MFCCs, pitch contours, articulatory (SPARC/EMA) traces, phonetic posteriorgrams,
  openSMILE, Praat and Parselmouth static features and audio-quality metrics, distributed as Parquet and
  tab-delimited files with JSON data dictionaries, alongside a phenotype tree of demographics, confounder,
  diagnosis, enrollment, questionnaire and task tables and a per-recording metadata file. Raw audio is
  withheld from this release and is disseminated only through a separate controlled-access process, because
  a voice recording cannot be fully de-identified.'
