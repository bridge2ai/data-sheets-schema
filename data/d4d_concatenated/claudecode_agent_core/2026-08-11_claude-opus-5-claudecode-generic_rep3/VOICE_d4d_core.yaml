instances:
- id: d4d:voice_instance_participant
  name: Participant
  instance_type: person
  counts: 833
  label: true
  label_description: Diagnostic labels are the result of a clinical assessment of the participant. At
    each site a local clinician provided the diagnosis based on a clinical interview and appropriate work-up.
    For the psychiatric disorders cohort the assessment was determined from the participant's electronic
    health record or an active prescription, established outside data collection by an appropriately licensed
    clinician.
  description: Each instance represents a person. Versions 3.0 and 3.1 contain data for 833 participants
    across five sites in North America; the initial v1.0 release provided 12,523 recordings for 306 participants;
    v2.0 added 136 participants and v3.0.0 added a further 391. Because participants may attend repeated
    visits, a participant may have more than one session and more than one row in a phenotype table.
- id: d4d:voice_instance_recording
  name: Audio recording
  instance_type: audio recording task performance
  description: Each recording is one participant's performance of one acoustic task in one session, identified
    by participant identifier, session identifier and task name. The released features are per-recording
    derivations rather than the waveform. In v3.1.0 the number of records differs by feature because some
    recordings could not generate every feature and because sensitive records and audio checks were removed.
  source_caveats: No single recording count is stated for v3.1.0. The project documentation gives approximately
    61,937 voice-derived recordings for v3.0, while the v3.1.0 page gives per-feature counts ranging from
    28,640 to 32,522; the counts are not reconciled in the bundle, so no value is entered in counts.
anomalies:
- id: d4d:voice_anomaly_site_configuration
  name: Site and protocol variation
  anomaly_details: Different sites have different collection configurations, and the collection protocol
    changed over the course of the study. Participants were screened for different disorders depending
    on site, so they also had their data collected with different devices. The head-mounted headset microphone
    could be at slightly different distances between recordings, and the clinical diagnosis, depending
    on the disorder, was performed by one clinician or based on an electronic health record or a prescription.
- id: d4d:voice_anomaly_unaudited_derivations
  name: Unaudited machine-generated derivations
  anomaly_details: Certain aspects of the data, for example transcription, were generated using off-the-shelf
    models that have not been audited for correctness.
- id: d4d:voice_anomaly_noise
  name: Noise and reporting artifacts
  anomaly_details: Confounding factors present in the data include noise artifacts, variations in diagnostic
    practices, inaccurate questionnaire responses and underreporting.
known_biases:
- id: d4d:voice_bias_selection
  bias_type: selection_bias
  name: Recruitment through high-volume expert clinics
  bias_description: Participants are recruited at academic high-volume expert clinics based on diagnosis
    and inclusion and exclusion criteria, and were collected at a limited number of geographic locations.
    Groups that have less trust in the medical system or in AI, or that are less proximal to the collection
    sites, would have been less likely to be recruited.
  mitigation_strategy: The consortium states that it hopes to make the data more representative by shifting
    to remote collection and by designing the recruiting approach to control for more variables, and that
    data acquisition is to be facilitated by partnerships with Community Outreach Clinics representing
    underserved populations under a Plan for Enhancing Diverse Perspectives.
- id: d4d:voice_bias_representation
  bias_type: representation_bias
  name: Uneven representation across cohorts and demographics
  bias_description: The public data releases do not contain an equal distribution of the disease categories,
    and the dataset has skews based on disorder category, site and other demographic factors. Users should
    consider the multivariate distribution when assessing utility for a given question.
  affected_subsets:
  - Disease cohort categories
  - Recording sites
  - Demographic subgroups
- id: d4d:voice_bias_measurement
  bias_type: measurement_bias
  name: Device and recording variation across sites
  bias_description: Distinct iPad devices were used at each site and recordings were made with a head-mounted
    headset microphone that could be at slightly different distances, so device and recording conditions
    are confounded with site and, because cohorts were screened by site, with diagnosis.
- id: d4d:voice_bias_sampling
  bias_type: sampling_bias
  name: Non-probability sampling
  bias_description: The sampling method is recorded as a non-probability sample; the dataset is a sample
    of a larger, ongoing collection and is stated not to be representative of it.
known_limitations:
- id: d4d:voice_limitation_representativeness
  limitation_type: representativeness_limitation
  name: Not representative of a broader population
  limitation_description: The data is not representative because it was collected at a limited number
    of geographic locations, across five recording sites in North America, in the United States and Canada.
  recommended_mitigation: The consortium intends to shift toward remote collection and to design recruitment
    so as to control for more variables.
- id: d4d:voice_limitation_language
  limitation_type: coverage_limitation
  name: English-language collection only
  limitation_description: Participants must read and speak English; the exclusion criteria exclude those
    who do not. The only language option in the release described by the study metadata is English. Spanish
    versions of the protocol are under development and the IRB protocol was amended in February 2025 to
    include collection from Spanish-language speakers.
  scope_impact: Findings and models derived from the dataset apply to English-speaking populations.
- id: d4d:voice_limitation_no_raw_audio
  limitation_type: scope_limitation
  name: Derived features released rather than raw audio
  limitation_description: The published dataset contains derived features from the audio waveforms and
    not the original recordings. Spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams and EMA
    traces for sensitive records and audio checks were removed, spectrograms and similar features were
    excluded where the audio contained free speech, and transcripts of free speech audio were removed.
    Some recordings could not generate certain features and are absent from the bundled data.
  recommended_mitigation: Access to raw audio can be requested through the controlled-access process operated
    by the Data Access Compliance Office.
- id: d4d:voice_limitation_labeling
  limitation_type: methodological_limitation
  name: Single-clinician labelling with heterogeneous work-up
  limitation_description: 'A single labeller provides one label per instance, and the basis of that label
    varies: for some disorders the diagnosis came from a clinician''s assessment, for others from an electronic
    health record entry or an active prescription. No inter-annotator agreement can therefore be computed.'
- id: d4d:voice_limitation_external_data
  limitation_type: integration_limitation
  name: Multimodal external data not released
  limitation_description: Imaging, genomic data for the neurological cohort, laryngoscopy imaging and
    other electronic health record data are extracted at each site and uploaded through the REDCap database,
    but the project documentation states that no external data is released in the v3.0.0 release.
confidential_elements:
- id: d4d:voice_confidentiality_public_release
  name: Confidentiality of the public feature release
  confidential_elements_present: false
  confidentiality_details: The dataset documentation answers "No" to whether the dataset contains data
    that might be considered confidential, such as data protected by legal privilege or by doctor-patient
    confidentiality, or the content of individuals' non-public communications.
- id: d4d:voice_confidentiality_transferred_data
  name: Confidentiality of data transferred under the Data Transfer and Use Agreement
  confidential_elements_present: true
  confidentiality_details: The Data Transfer and Use Agreement states that the Data is Personally Identifiable
    Information as defined in OMB Memorandum M-07-16 and is covered under a Certificate of Confidentiality,
    which must be asserted against compulsory legal demands such as court orders and subpoenas for identifying
    information or characteristics of a research participant. Recipients must store the data with security
    controls adequate to protect Personally Identifiable Information and must not contact the individuals
    who are the subjects of the data without IRB approval, written approval from the provider and informed
    consent.
  source_caveats: 'The two entries are not necessarily contradictory: the "No" answer is given in the
    healthsheet for the released feature-only dataset, whereas the Data Transfer and Use Agreement governs
    data transferred to a recipient institution under the controlled-access route. The bundle does not
    state which data elements the agreement''s Attachment 1 covers beyond a general description of the
    dataset.'
content_warnings:
- id: d4d:voice_content_warning_free_speech
  name: Free-speech content
  content_warnings_present: true
  warnings:
  - Free speech transcriptions may contain offensive, insulting or distressing language, because research
    participants are responsible for their choice of language.
  - Questions asked of participants in the mood, depression and anxiety cohorts can cause discomfort and
    may trigger negative emotions.
  description: The dataset documentation states that the dataset includes the transcription of free speech
    tasks and that, while the inclusion of offensive or threatening content is unlikely, it cannot be
    completely avoided.
  source_caveats: The scope of this warning changed across releases. Version 1.1 states that transcripts
    of free speech audio were removed, and versions 3.0.0 and 3.1.0 state that spectrograms and similar
    features were excluded where the audio contained free speech; the healthsheet answer describing included
    transcriptions is not restated against those releases.
subpopulations:
- id: d4d:voice_subpopulations
  name: Identified demographic sub-populations
  subpopulation_elements_present: true
  identification: Age, gender, sex, ethnicity and socioeconomic status are identified in the dataset.
    A detailed sociodemographic questionnaire collects age, sex at birth, gender identity, race and ethnicity,
    and languages spoken, together with confounders such as smoking and drinking history.
  distribution: The public data releases do not contain an equal distribution of the disease cohort categories,
    and further releases are stated to contain additional data. The dataset has skews based on disorder
    category, site and other demographic factors.
sensitive_elements:
- id: d4d:voice_sensitive_elements
  name: Sensitive data elements
  sensitive_elements_present: true
  sensitivity_details: 'The dataset documentation records that the data include racial or ethnic origins,
    sexual orientation, and socioeconomic and health information. Voice itself is a biometric characteristic:
    even after removing all HIPAA-protected information, each person''s voice is unique to them and to
    their health at that point in life, so it is always possible, if unlikely, that someone could recognise
    a participant''s voice.'
  description: Non-identifying elements of data that revealed highly sensitive information, such as household
    income, mental health status and traumatic life experiences, were removed from the release, and all
    fields encoded as sensitive in the REDCap data dictionary were removed at the v3.0.0 stage.
  source_caveats: The healthsheet answer enumerating sensitive content describes what the dataset collects,
    while the de-identification sections describe what was removed before release; the bundle does not
    state which sensitive elements survive into the published feature release.
acquisition_methods:
- id: d4d:voice_acquisition
  name: How instance data were acquired
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details: The data were directly observable and reported by subjects. Acoustic tasks were
    recorded directly; demographics, confounders and validated questionnaires were reported by participants.
    Clinical diagnoses were verified by clinicians reviewing audio or imaging data, consulting electronic
    health records, or checking medication prescriptions. The released feature values are derived from
    the raw waveforms by software rather than observed directly.
collection_mechanisms:
- id: d4d:voice_mechanism_app
  name: Bridge2AI-Voice application on tablet
  mechanism_details: Data were collected using a custom smartphone and tablet application, the Bridge2AI-Voice
    app, hosting the data acquisition protocols. Collection occurs through two platforms, the Bridge2AI
    Voice Web app, which runs in a browser on a computer, tablet or phone, and the Bridge2AI Voice iOS
    app, which is restricted to iOS-compatible devices. No software is downloaded or installed for the
    web app, no login is required, data are stored only during the collection phase and are removed as
    soon as the page is closed, and data are sent over a secure HTTPS protocol to a HIPAA-compliant storage
    server operated by an NIH STRIDES partner. A total of 22 acoustic tasks are recorded through the app,
    spanning non-voice/non-speech tasks (respiration, cough, breath sounds), voice/non-speech tasks (prolonged
    vowel, maximum phonation time, glides, loudness, diadochokinesis) and speech tasks (Rainbow Passage,
    Caterpillar Passage, CAPE-V sentences, free speech, picture description, story recall, animal fluency,
    open response questions, word-colour Stroop, productive vocabulary, random item generation and the
    Cinderella story).
- id: d4d:voice_mechanism_devices
  name: Recording hardware
  mechanism_details: Data are collected on iPads of the 9th or 10th generation and iPad Air of the 5th
    generation, using an Avid AE-36 microphone connected to the iPad through an Apple dongle. Participants
    are instructed to wear a headset with microphone when the task includes voice recording, as per the
    Bridge2AI-Voice suggested standards. Distinct iPad devices were used at each site.
- id: d4d:voice_mechanism_redcap
  name: REDCap database and clinical extraction
  mechanism_details: Clinical, imaging, genomic and other electronic health record data are extracted
    at each site independently and uploaded through a REDCap database as part of the case report form.
    Eligibility screening is performed against the site electronic health record, at the University of
    South Florida through the EPIC platform. Data were exported and converted from REDCap using an open-source
    library developed by the team.
collection_timeframes:
- id: d4d:voice_timeframe_collection
  name: Data collection period
  timeframe_details: The dataset documentation states that the data was collected over a period of twelve
    months. The governing IRB protocol describes a prospective cohort study over four years, with participants
    offered enrollment for single time-point or, for progressive and degenerative cohorts, longitudinal
    data collection at intervals of one to six months for a maximum of four years.
  source_caveats: The twelve-month figure is given in the healthsheet section of the project documentation,
    which elsewhere describes the v2.0.0 release, and is not restated for v3.0.0 or v3.1.0. No calendar
    start or end date for data collection appears anywhere in the bundle, so start_date and end_date are
    left absent.
data_collectors:
- id: d4d:voice_collector_research_teams
  name: Site research teams
  role: Recruitment, consent and supervised data collection
  collector_details: Research teams, which may include medical, graduate or undergraduate students, coordinated
    with clinicians and doctors to identify appropriate participants. Data are collected in the clinic
    with the assistance of a trained research assistant, who conducts the consent process and supervises
    task completion.
- id: d4d:voice_collector_clinicians
  name: Site clinicians and physicians
  role: Diagnosis, clinical validation and co-investigation
  collector_details: Clinicians and doctors were listed under the IRB as co-investigators and were added
    to the consortium so that their names are included on consortium-level publications emerging from
    the research; they were not otherwise compensated. Clinical validation is performed by a qualified
    physician or practitioner based on established gold standards for diagnosis.
- id: d4d:voice_collector_hospital_staff
  name: Hospital staff
  role: Logistics
  collector_details: Hospital staff were not involved in scheduling but assisted in the logistics of coordinating
    data collection.
missing_data_documentation:
- id: d4d:voice_missing_data
  name: Missingness in the released tables
  missing_data_patterns: Information is missing from individual instances. Each individual answered a
    common set of questions and then responded to additional questions relevant to their primary diagnostic
    category, so questions outside a participant's cohort are absent. Phenotype data files contain rows
    for a participant only if at least one column is non-missing. Some recordings could not generate certain
    features, whether due to length or other issues, and are not included in the bundled feature data.
  missing_data_causes: Some questions are optional, and there may have been data collection irregularities
    that caused information to be missing from individual instances.
  handling_strategy: A missingness table is included with the dataset, and generating missingness tables
    is the first step of the stated audit protocol. No imputation is described.
raw_data_sources:
- id: d4d:voice_raw_source_audio
  name: Raw audio waveforms
  source_description: The original voice, speech, breathing and cough recordings captured by the Bridge2AI-Voice
    application, from which every released feature is derived.
  source_type: audio waveform
  access_details: The raw data was saved after de-identification and is not accessible publicly. Access
    to raw audio requires institutional sign-off and is handled through the access committee at DACO@b2ai-voice.org;
    data are made available through Synapse at https://www.synapse.org/Synapse:syn72370534/.
  raw_data_format: WAV audio, paired with per-recording JSON metadata in the BIDS layout
- id: d4d:voice_raw_source_redcap
  name: REDCap and ReproSchema-UI exports
  source_description: Questionnaire, demographic, confounder, enrollment and diagnosis responses recorded
    in a REDCap database as part of the case report form, from which the released phenotype tables are
    produced.
  source_type: electronic data capture export
  access_details: Local access to identified data is restricted to approved study personnel through the
    password-protected REDCap database at the institution where the data were collected. The supporting
    data dictionary, metadata and instrument PDFs are public at https://github.com/eipm/bridge2ai-redcap.
  raw_data_format: REDCap export converted to tab-delimited values
- id: d4d:voice_raw_source_ehr
  name: Electronic health record and imaging extracts
  source_description: Existing clinical data reviewed within the site electronic health record, including
    disease type, severity, symptoms, management, validated questionnaires and scores, and previously
    completed imaging such as chest radiographs for the respiratory cohort and brain CT and MRI for the
    neurological cohort.
  source_type: clinical record extract
  access_details: Reviewed under the site protocol with a partial HIPAA waiver for recruitment screening;
    no additional imaging was performed for the study and only previously completed imaging was reviewed
    and collected. The project documentation states that no external data is released in the v3.0.0 release.
sampling_strategies:
- id: d4d:voice_sampling
  name: Sampling of a larger ongoing collection
  is_sample: true
  is_random: false
  is_representative: false
  source_data: Patients presenting at specialty clinics and academic institutions with expertise in the
    disease areas studied, screened for inclusion and exclusion criteria prior to their visit by the project
    investigators, together with individuals without the conditions of interest who serve as controls.
  why_not_representative: The data is not representative because it was collected at a limited number
    of geographic locations.
  representative_verification:
  - No verification of representativeness is reported; the sampling method is recorded as a non-probability
    sample.
  strategies: Participants are recruited from high-volume expert clinics, defined as outpatient clinics
    within hospital systems or academic institutions with expertise in a specific disease area seeing
    more than 50 patients per month from the same disease category, and from community outreach clinics
    serving underserved and under-represented populations. Where specific diagnoses or severities are
    under-represented in the dataset, participants are identified by medical record review based on voice-disorder-related
    diagnostic codes.
raw_sources:
- id: d4d:voice_rawdata_audio_access
  name: Raw audio under controlled access
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details: The published Bridge2AI-Voice adult dataset contains derived features from the audio
    waveforms; the PhysioNet project does not contain raw audio. Raw audio is saved and is not accessible
    publicly. Accessing it requires institutional sign-off, and requests go to the access committee at
    DACO@b2ai-voice.org; data are made available via Synapse. Users interested in audio data from any
    Bridge2AI-Voice dataset can request access by email, and raw audio is disseminated through controlled
    access only to protect participants' privacy.
preprocessing_strategies:
- id: d4d:voice_preprocessing_audio
  name: Audio standardization and feature extraction
  preprocessing_details: Raw audio was preprocessed by converting to monaural and resampling to 16 kHz
    with a Butterworth anti-aliasing filter applied. From this standardized audio the release derives
    spectrograms by short-time fast Fourier transform with a 25 ms window, 10 ms hop length and a 400-point
    FFT, further downsampled by a factor of two in the time domain; 60 Mel-frequency cepstral coefficients
    from those spectrograms; Mel spectrograms with 60 Mel bins; articulatory kinematic traces and source
    features with measures of loudness, periodicity and pitch at 50 Hz using the Speech Articulatory Coding
    package; acoustic features using openSMILE; phonetic and prosodic features using Parselmouth and Praat
    giving fundamental frequency, formants and voice quality; phonetic posteriorgrams at 100 Hz; and transcriptions
    using OpenAI's Whisper Large model. The v1.1 release used a 512-point FFT for spectrograms; from v3.0.0
    a 400-point FFT is used. The v3.1.0 release was generated with b2aiprep v3.0.0.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    url: https://github.com/sensein/b2aiprep
    license: Apache-2.0
    description: The Bridge2AI data processing library, used to organize and preprocess the dataset, to
      process the raw audio waveforms into the released features and to merge the source data into the
      phenotype files.
  - id: https://github.com/sensein/senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
    description: Toolkit for processing audio files for research tasks.
- id: d4d:voice_preprocessing_bids
  name: Conversion to the Brain Imaging Data Structure
  preprocessing_details: The raw audio files and the questionnaire data retrieved from ReproSchema-UI
    or exported from REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0.
    The resulting layout places CHANGES.md, README.md and dataset_description.json at the root, a phenotype
    tree of confounders, demographics, diagnosis, enrollment, questionnaire and task tables, and per-participant
    session folders holding audio files named sub-<participant_id>_ses-<session_id>_task-<task_name>.wav
    with a matching JSON sidecar.
cleaning_strategies:
- id: d4d:voice_cleaning
  name: Cleaning preprocessing
  cleaning_details: 'The dataset documentation states that no pre-processing was carried out for cleaning
    the data, and that no instances were excluded from the dataset at the time of preprocessing. Removals
    that did occur were made for de-identification rather than for cleaning: raw audio transcripts were
    reviewed and any recordings containing potentially identifying information or external voices were
    removed from the release, and where a caregiver''s voice is recorded inadvertently the clip can be
    discarded by re-recording during collection or during data audit and post-processing.'
- id: d4d:voice_audit_protocol
  name: Release audit protocol
  cleaning_details: 'Before release the data are audited by generating missingness tables, checking distributions
    and outliers, checking categorical responses against the schema, and running quality-control metrics
    for audio tasks, including the amount of silence and the duration of each waveform and, for speech,
    a comparison of produced speech against the intended passage. The dataset has been audited internally
    for missingness and consistency by the data release team. Quality control during collection is continuous:
    acoustic engineers and AI data scientists analysed all samples from the year-one exploratory collection
    phase, and in each subsequent year ten percent of the data is selected at random every month for quality
    control and ML-readiness review.'
labeling_strategies:
- id: d4d:voice_labeling
  name: Clinician gold-standard diagnostic labelling
  data_annotation_platform: Diagnoses and clinical validation are recorded through the Bridge2AI-Voice
    application and the REDCap case report form.
  data_annotation_protocol: A gold standard label is available in the data, diagnosed by a clinician.
    At each site a local clinician provided the diagnosis based on a clinical interview and appropriate
    work-up; for the psychiatric disorders cohort the assessment was determined from the participant's
    electronic health record or an active prescription, established outside data collection by an appropriately
    licensed clinician. Labellers followed the Bridge2AI protocols and ICD-10 codes, and the gold standard
    validation method is specified per diagnosis, for example laryngoscopy images and stroboscopy videos
    for voice disorders, spirometry and flow-volume loops for respiratory disorders, and brain CT or MRI
    for neurological disorders.
  annotations_per_item: 1
  inter_annotator_agreement: A single labeller provides one label per instance, so no inter-annotator
    agreement is computed or reported.
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to collection where
    a prior diagnostic assessment was used.
  labeling_details: Labels are diagnostic categories, including vocal pathologies, neurological disorders,
    psychiatric conditions and respiratory disorders. The dataset documentation recommends that the process
    for any new labels be described alongside any release of a model or publication, and that the description
    include the exact variables used for the determination.
annotation_analyses:
- id: d4d:voice_annotation_analysis
  name: Human-level performance on the labelling task
  annotation_quality_details: The dataset documentation states that human-level performance in the applications
    the dataset is meant to address varies widely.
machine_annotation_tools:
- id: d4d:voice_machine_annotation
  name: Machine-generated derivations and transcription
  tools:
  - OpenAI Whisper Large, for transcription of audio
  - openSMILE, for acoustic feature extraction
  - Praat and Parselmouth, for phonetic and prosodic features
  - torchaudio, for spectrograms, Mel spectrograms, MFCCs and pitch
  - Speech Articulatory Coding (sparc), for articulatory kinematics, loudness, periodicity and pitch
  - ppgs, for phonetic posteriorgrams
  tool_descriptions: All released feature values are produced by these open-source packages from the standardized
    16 kHz monaural audio; each feature file is accompanied by a JSON data dictionary describing the feature
    and the processing used to prepare it.
  tool_accuracy:
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf models
    that have not been audited for correctness.
existing_uses:
- id: d4d:voice_existing_uses
  name: Prior uses of the dataset
  examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School
    and hackathon.
  description: 'Use of the dataset calls for citation of the protocol development publication, Bensoussan
    et al., "Developing Multi-Disorder Voice Protocols: A team science approach involving clinical expertise,
    bioethics, standards, and DEI", Proc. Interspeech 2024.'
use_repository:
- id: d4d:voice_use_repository
  name: Repository of works using the dataset
  repository_details: The dataset documentation answers "No" to whether there is a repository linking
    to papers or systems that use the dataset, other than general scholarly search. Training opportunities
    for using the dataset are offered at https://www.b2aivoicescholars.org/.
future_use_impacts:
- id: d4d:voice_future_use_impact
  name: Composition effects on future use
  impact_details: The dataset has skews based on disorder category, site and other demographic factors.
    Users should consider the multivariate distribution when assessing utility for different questions.
    Because participants were screened for different disorders by site and collected on different devices,
    device and site are confounded with diagnosis, and changes in diagnostic criteria or practices could
    be a source of distribution shift over time.
discouraged_uses:
- id: d4d:voice_discouraged_uses
  name: Discouraged applications
  discouragement_details: The dataset should not be used for non-research and non-clinical applications
    such as hiring decisions, insurance premium adjustments, or any form of surveillance that could lead
    to discrimination or harm. These limitations are intended to prevent unethical or biased outcomes
    that could negatively affect individuals on the basis of their health conditions or voice characteristics.
    The dataset is intended strictly for research that prioritizes patient safety, privacy and ethical
    use.
intended_uses:
- id: d4d:voice_intended_uses
  name: Intended research uses
  use_category: research
  examples:
  - Development, benchmarking and validation of clinically applicable machine-learning models for diagnosing
    health conditions using voice, including vocal pathologies and neurological, psychiatric and respiratory
    disorders
  - Pretraining and fine-tuning of AI models on voice data
  - Clinical research into disease screening, diagnosis and monitoring through voice biomarkers
  - Cohort selection using the questionnaire features distributed in the phenotype folder
  usage_notes: The dataset is structured to be findable, accessible, interoperable and reusable. It is
    intended solely for commercial and non-commercial research purposes by Authorized Researchers, as
    set out in the Registered Access Agreement.
prohibited_uses:
- id: d4d:voice_prohibited_reidentification
  name: Re-identification of participants
  prohibition_reason: The dataset is not to be used to attempt to re-identify research participants, nor
    for any action that could reasonably lead to re-identification. Recipients under the Data Transfer
    and Use Agreement additionally may not use the data, alone or with other information, to contact the
    individuals who are the subjects of the data without IRB approval, specific written approval from
    the provider and, if required, informed consent.
- id: d4d:voice_prohibited_harm
  name: Uses that could cause harm or stigmatization
  prohibition_reason: The dataset is not to be used for any purpose that could foreseeably cause harm
    or stigmatization to research participants, their families, communities or specific populations.
- id: d4d:voice_prohibited_ip_blocking
  name: Intellectual property claims restricting access
  prohibition_reason: Intellectual property protections, database rights or related rights may not be
    used in a manner that restricts or limits access to any part of the dataset or to any conclusions
    derived from it, so that future use of the dataset remains unrestricted in alignment with the Open
    Science principles upheld by the consortium.
- id: d4d:voice_prohibited_sale
  name: Sale or redistribution of the data
  prohibition_reason: Sale of all or part of the data on any media is not permitted, and recipients may
    not disclose, release, sell, rent, lease, loan or otherwise grant access to the data to any third
    party other than Authorized Persons without the prior written consent of the provider.
distribution_formats:
- id: d4d:voice_distribution_physionet
  name: PhysioNet registered and credentialed access release
  download_url: https://physionet.org/content/b2ai-voice/3.1.0/
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
  - https://physionet.org/content/b2ai-voice/3.0.0/
  - https://physionet.org/content/b2ai-voice/1.1/
  format: Parquet, tab-separated values and JSON
  description: A derived dataset containing spectrograms, other extracted features and combined phenotypic
    data, published on PhysioNet under a permissioned access mechanism. Registration on PhysioNet, confirmation
    of identity and signing of the Bridge2AI-Voice Registered Access Agreement enable access; the v3.0.0
    and v3.1.0 pages state that only credentialed users who sign the data use agreement can access the
    files and that no training is required.
  source_caveats: No IANA media type is stated anywhere in the bundle, so no media_type is recorded here
    or on the individual files; Parquet is described only as "an open-source column-oriented data file
    format". The format value transcribes the file types the release contains.
- id: d4d:voice_distribution_synapse
  name: Controlled-access raw audio via Synapse
  download_url: https://www.synapse.org/Synapse:syn72370534/
  access_urls:
  - https://www.synapse.org/Synapse:syn72370534/
  format: WAV audio with JSON sidecars
  description: Raw audio for the adult cohort is disseminated through controlled access only. Applicants
    complete a Data Access Request Form and a Data Use Agreement, submit the application to the Data Access
    Compliance Office for review, and on approval ensure a Data Use and Transfer Agreement is signed by
    an authorized official at their institution. A memorandum setting out the ethical justification for
    controlled access to raw voice samples is published alongside the documentation.
- id: d4d:voice_distribution_hdn
  name: Health Data Nexus release of the earlier feature-only dataset
  download_url: https://healthdatanexus.ai/
  access_urls:
  - https://healthdatanexus.ai/
  description: An earlier version of the feature-only dataset is available on Health Data Nexus, a data
    publishing platform maintained by the Temerty Center for Artificial Intelligence Research and Education
    in Medicine at the University of Toronto, which provides cloud compute alongside the dataset rather
    than allowing data downloads. The platform provides publicly accessible metadata with a DOI for persistent
    resolution; the dataset itself requires registered access.
distribution_dates:
- id: d4d:voice_distribution_dates
  name: Release history
  release_dates:
  - 'v1.1: 17 January 2025'
  - 'v2.0.0: 16 April 2025'
  - 'v2.0.1: 18 August 2025'
  - 'v3.0.0: 16 December 2025'
  - 'v3.1.0: 1 May 2026'
  description: The dataset is released as static versions rather than dynamically updated, and each version
    has a unique DOI.
  source_caveats: The healthsheet states that the data was published and made available at the end of
    November 2024, which corresponds to the v1.0 release on Health Data Nexus; no release date for v1.0
    appears on the PhysioNet version list, which begins at v1.1.
maintainers:
- id: d4d:voice_maintainer_consortium
  name: Bridge2AI-Voice Consortium
  role: academic_institution
  maintainer_details: The consortium curates the dataset and prepares its releases; the curator of the
    data may be contacted through the address published in the dataset documentation. The dataset is supported
    by the NIH via the Bridge2AI project.
- id: d4d:voice_maintainer_physionet
  name: MIT Laboratory for Computational Physiology (PhysioNet)
  role: academic_institution
  maintainer_details: PhysioNet hosts the released versions and is maintained by the MIT Laboratory for
    Computational Physiology, supported by the National Institute of Biomedical Imaging and Bioengineering,
    the National Heart Lung and Blood Institute and the NIH Office of the Director under grant numbers
    U24EB037545 and R01EB030362.
- id: d4d:voice_maintainer_hdn
  name: Health Data Nexus, Temerty Center for Artificial Intelligence Research and Education in Medicine,
    University of Toronto
  role: academic_institution
  maintainer_details: Health Data Nexus hosts the earlier feature-only version, maintains the technical
    infrastructure and provides continued access to interested researchers; the platform team may be contacted
    through the address published in the dataset documentation.
  source_caveats: The contact addresses for the curator and the platform team are redacted as "[email
    protected]" in the captured documentation page and are therefore not recorded.
errata:
- id: d4d:voice_errata
  name: Errata and changelog
  erratum_details: There is no erratum. A changelog for each dataset version is published online with
    the dataset metadata, and each PhysioNet release carries release notes describing what changed.
updates:
  id: d4d:voice_update_plan
  name: Update plan
  frequency: Semi-annual (twice a year)
  update_details: Further versions of the dataset will be released on a semi-annual basis and distributed
    as new versions on the hosting platform. Users will be notified through news items on the platform
    as well as through standard communication channels. Updates have corrected labelling and authorship,
    added participants, added and reorganized features and files, and back-filled validated diagnosis
    information.
retention_limit:
  id: d4d:voice_retention
  name: Retention limits
  retention_period: Once data is contributed, the data will be retained as long as it is useful for research
    purposes, possibly indefinitely.
  retention_details: Identifiable data and datasheets linking participant numbers to participant information
    are kept at each institution on local cloud storage for a maximum of ten years after study completion
    and are then destroyed, which is the responsibility of each local principal investigator. De-identified
    study data and original consent forms must be stored for a minimum of five years after completion
    of the study. Under the Data Transfer and Use Agreement, a recipient must destroy or return the data
    two years after the start date, upon completion of the project, upon termination, or upon expiration
    of the applicable ethics approval, whichever occurs first, and must certify destruction in writing
    within thirty days, retaining at most one archival copy where required by law or for research integrity
    and verification.
version_access:
  id: d4d:voice_version_access
  name: Version access
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
  - 'v1.0: first release of the dataset, published on Health Data Nexus (DOI 10.57764/qb6h-em84)'
  - 'v1.1: added Mel-frequency cepstral coefficients (DOI 10.13026/249v-w155)'
  - 'v2.0: added 136 new participants; spectrograms reprocessed; spectrograms and MFCCs from free-speech
    files removed'
  - 'v2.0.1: corrections to the authorship list'
  - 'v3.0.0: added 391 participants; phenotype split into individual files; SPARC and PPG features added;
    files reorganized (DOI 10.13026/k81f-qr68)'
  - 'v3.1.0: no new participants; additional data for some participants; broken Parquet files fixed; audio
    quality metrics and per-recording metadata added; validated diagnosis information back-filled; some
    phenotype files rearranged and gold standard variable names renamed (DOI 10.13026/8xbn-nq66)'
  version_details: By default older versions of the dataset continue to be supported, hosted and made
    available to researchers, and each version has a unique DOI; the dataset publishers reserve the right
    to remove access to older versions. The files for version 1.1 are stated to be no longer available.
    The project-level DOI 10.13026/37yb-1t42 resolves to the latest version.
extension_mechanism:
  id: d4d:voice_extension_mechanism
  name: Extension and contribution mechanism
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: For dataset extensions and augmentations, others may publish a derivative dataset
    on the hosting platform that references the original source; derivative datasets may be made available
    under the same conditions as the source data. For augmentations to the code used to produce the data,
    the open-source repositories have discussion forums and issue pages allowing public discussion of
    data preprocessing, and a pull request mechanism for contributing improvements to the preprocessing
    code.
ethical_reviews:
- id: d4d:voice_ethical_review_usf
  name: University of South Florida single IRB
  reviewing_organization: University of South Florida Institutional Review Board
  contact_person: mailto:yaelbensoussan@usf.edu
  review_details: Data collection and sharing was approved by the University of South Florida Institutional
    Review Board. The clinical study was submitted to and approved by the USF single IRB and by subsite
    IRBs through the single IRB process. The protocol, titled "Bridge2AI Voice Data Acquisition", was
    first issued as V1 on 17 January 2023 and has been revised thirteen times through V13 of 11 July 2025,
    with revisions adding the pediatric cohort, participant compensation, electronic and remote consent,
    control participants, new disease categories, remote enrollment and data collection platforms, Spanish-language
    collection, additional recruitment sites and a satisfaction survey for participants who do not complete
    collection. The study is not for a drug product or a medical device, and no data monitoring committee
    was appointed.
- id: d4d:voice_ethical_review_canada
  name: Canadian research ethics board review
  reviewing_organization: Research ethics boards of the Canadian participating institutions
  review_details: Canadian institutions do not participate in the United States single IRB process and
    apply for a separate research ethics board approval to comply with Canadian regulations; a copy of
    each approved application is submitted to the USF IRB. Genomic data are collected and analysed only
    at the University of Toronto and Mount Sinai Hospital under a separate protocol and research ethics
    board approval.
data_protection_impacts:
- id: d4d:voice_dpia
  name: Impact analysis on data subjects
  impact_details: The dataset documentation answers "No" to whether an analysis of the potential impact
    of the dataset and its use on data subjects has been conducted.
human_subject_research:
  id: d4d:voice_human_subject_research
  name: Human subject research status
  involves_human_subjects: true
  ethics_review_board: University of South Florida Institutional Review Board
  irb_approval:
  - University of South Florida Institutional Review Board, acting as the single IRB of record, with subsite
    IRB approvals obtained through the single IRB process
  - Separate research ethics board approvals obtained by the Canadian participating institutions, which
    do not participate in the United States single IRB process
  - A separate research ethics board protocol at the University of Toronto and Mount Sinai Hospital covering
    genomic data collection and analysis
  special_populations:
  - Socially and economically disadvantaged and underserved populations, enrolled through community outreach
    clinics under a Plan for Enhancing Diverse Perspectives
  regulatory_compliance:
  - Health Insurance Portability and Accountability Act (HIPAA), including a partial HIPAA waiver for
    recruitment screening
  - Certificate of Confidentiality asserted against compulsory legal demands
  - NIH STRIDES agreements governing cloud storage of study data
  description: The project is a data generation study with no study intervention; the primary objective
    is to build a database rather than to analyse it. The protocol records no direct significant risks
    from the research beyond the risk of personal information being mistakenly released, and voice collection
    is described as a safe, non-invasive method with minimal risk. Investigators and project personnel
    with data access must complete HIPAA and privacy certification at their local institution.
informed_consent:
- id: d4d:voice_informed_consent
  name: Prospective informed consent
  consent_obtained: true
  consent_type: Prospective written informed consent, obtained on paper, electronically within the app
    or through a REDCap survey, or by video recording within the app; electronic consent is housed in
    REDCap and is HIPAA compliant, and electronic consent contains the same text as paper consent.
  consent_documentation: All paper and electronic versions of consent are stored for a minimum of five
    years after completion of the study; paper consent documents are uploaded and saved electronically
    in REDCap, and original paper consent documents cannot be destroyed until five years after study completion.
    At the University of South Florida, study material is stored through the Florence platform in accordance
    with USF and NIH regulations.
  withdrawal_mechanism: Participants are informed that they may withdraw from the study at any point.
  consent_scope: Research data that does not contain direct identifiers will be shared with external researchers
    for future research through a secure database. Data posing a low risk of individual re-identification
    will be shared in registered access with the general public, and data that would pose a heightened
    risk if shared in full open access will be shared through a controlled access mechanism with authorized
    researchers. Consent does not restrict the data to non-commercial use, to a specific geographic location,
    to a specific type of research, to genetic research, or to research that does not involve the development
    of methods or algorithms. Participants who consent also permit investigators to access medical information
    through electronic health record platforms in order to perform gold standard validation of diagnoses
    and symptoms, and are asked whether they agree to be contacted in future for further collection.
at_risk_populations:
  id: d4d:voice_at_risk_populations
  name: At-risk populations in this dataset
  description: Eligibility for this dataset is a minimum age of 18 years and a maximum of 120 years. The
    protocol's vulnerable-populations provisions concern pediatric patients, who are enrolled only through
    the pediatric sites and not at the University of South Florida, and whose data are not part of this
    dataset.
  special_protections:
  - A Plan for Enhancing Diverse Perspectives governs enrollment of participants from socially and economically
    disadvantaged and underserved populations so that the database is diverse and FAIR.
  - Students, employees and wards of the state are neither specifically included nor specifically excluded.
  - Collection accessibility was facilitated through the normal means of the collection sites, including
    reading questions to participants when needed, and the protocol asks about disabilities.
  assent_procedures: Where children participate under the pediatric arm of the protocol at other sites,
    parents or guardians provide consent and children provide verbal assent where appropriate; children
    who cannot reasonably be asked to assent because of age or development, typically those under seven,
    are not asked to do so, and assent is documented.
  guardian_consent:
  - Parental permission is obtained from one or both parents under the pediatric arm; the research is
    minimal risk and does not require permission from both parents or legal guardians.
  source_caveats: No at_risk_groups_included determination is entered. The only population the bundle
    characterises as vulnerable is pediatric patients, who are not part of this dataset; it does not say
    whether the adult cohorts, which include participants with cognitive impairment and neurodegenerative
    disease, are to be treated as at-risk, and inferring either answer would go beyond the evidence. The
    assent and guardian-consent provisions are recorded because they are part of the governing protocol,
    but they apply to the pediatric arm conducted at pediatric sites and not to this adult dataset.
license_and_use_terms:
  id: d4d:voice_license_and_use_terms
  name: Bridge2AI Voice Registered Access License and agreements
  license_terms: Files are released under the Bridge2AI Voice Registered Access License, and users must
    sign the Bridge2AI Voice Registered Access Agreement. The agreement's intellectual property clause
    states that the data may be protected by copyright and other rights; duplication as reasonably required
    to carry out the research project is permitted; sale of all or part of the data on any media is not
    permitted; nothing in the agreement transfers intellectual property rights in the data; users agree
    not to make intellectual property claims on the data and not to use intellectual property protection
    in ways that would prevent or block access to, or use of, any element of the data or conclusions drawn
    directly from it; users may obtain intellectual property rights on downstream discoveries but agree
    to implement licensing policies that do not obstruct further research, and to respect the Fort Lauderdale
    Agreement. There are no fees associated with these restrictions.
  data_use_permission: general_research_use
  contact_person: mailto:DACO@b2ai-voice.org
  description: 'The feature-only and raw audio datasets are available under distinct agreements appropriate
    to the sensitivity of their content: registered access for the feature-only data and controlled access
    for the raw audio. Consent does not restrict the data to non-commercial use, to a geographic location,
    to a specific type of research, to genetic research, or to research that excludes methods and algorithm
    development, and the dataset is stated to be intended for commercial and non-commercial research purposes
    by Authorized Researchers.'
ip_restrictions:
  id: d4d:voice_ip_restrictions
  name: Intellectual property restrictions
  restrictions:
  - Sale of all or part of the data on any media is not permitted.
  - Nothing in the agreement transfers any intellectual property rights in or relating to the data to
    the user.
  - Users agree not to make intellectual property claims on the data.
  - Users agree not to use intellectual property protection, database rights or related rights in a way
    that could prevent or limit access to, or use of, any element of the data or a research conclusion
    derived from it.
  - Users who obtain intellectual property rights on downstream discoveries agree to implement licensing
    policies that will not obstruct further research and to respect the Fort Lauderdale Agreement.
  - No IP-based restrictions have been imposed by third parties; the provider gives no guarantee that
    the data is free of third-party intellectual property rights, database rights or other related rights.
  description: Duplication of the data as reasonably required to carry out a recipient's research project
    is permitted, and recipients are encouraged to make the results of their project publicly available
    in open-access journals or on pre-print servers.
regulatory_restrictions:
  id: d4d:voice_regulatory_restrictions
  name: Regulatory and export restrictions
  regulatory_restrictions:
  - No export controls apply to the dataset.
  - The data transferred under the Data Transfer and Use Agreement is covered by a Certificate of Confidentiality,
    which must be asserted against compulsory legal demands such as court orders and subpoenas.
  - Recipients must use the data in compliance with all applicable laws, rules and regulations and with
    the professional standards applicable to the research, including any IRB review or approval required
    before use.
  - Recipients must notify the provider of any unauthorized use or disclosure no later than five business
    days after discovery and cooperate to investigate, correct and mitigate it.
  - Recipients must adhere to the specific requirements of PhysioNet.org, managed by the MIT Laboratory
    for Computational Physiology.
  hipaa_compliant: compliant
  other_compliance: The dataset applies the HIPAA de-identification rules and removes direct identifiers;
    the level of de-identification is stated as removal of identifiable information under HIPAA and the
    Common Rule together with data considered sensitive. The collection applications are themselves HIPAA
    compliant and transmit over HTTPS to HIPAA-compliant storage operated by an NIH STRIDES partner.
  confidentiality_level: restricted
  governance_committee_contact: mailto:DACO@b2ai-voice.org
  source_caveats: The Data Transfer and Use Agreement's Attachment 2 states that the transferred data
    is Personally Identifiable Information "not covered under HIPAA, FERPA, or similar laws", which sits
    alongside the project documentation's statement that the released dataset applies the HIPAA de-identification
    rules; the two describe different data under different access routes.
is_deidentified:
  id: d4d:voice_deidentification
  name: De-identification
  identifiable_elements_present: false
  method: HIPAA Safe Harbor identifier removal combined with review-based removal of indirect identifiers
    and of non-identifying but highly sensitive elements, and withholding of all raw audio.
  identifiers_removed: Direct identifiers including name, civic address and social security numbers; HIPAA
    Safe Harbor identifiers including geographic locators, date information at a resolution finer than
    years, phone and fax numbers, email addresses, IP addresses, medical record numbers, health plan beneficiary
    numbers, device identifiers, license numbers, account numbers, vehicle identifiers, website URLs,
    full-face photographs, biometric identifiers and other unique identifiers; state and province, with
    country of data collection retained; select geographic or demographic identifiers and information
    about household composition or cultural identity where their combination with public data created
    a significant re-identification risk; non-identifying but highly sensitive elements such as household
    income, mental health status and traumatic life experiences; narrative text fields and transcripts
    of free speech audio; all fields encoded as sensitive in the REDCap data dictionary; and all raw voice
    data.
  deidentification_details: The dataset removes direct identifiers, applies the HIPAA de-identification
    rules, rebases or replaces dates by integers, removes or generalizes geographic information and removes
    narrative text fields; it does not achieve k-anonymization with k of two or more. Raw audio transcripts
    were reviewed and any recordings containing potentially identifying information or external voices
    were removed from the release. Features were extracted from the raw audio to limit re-identification
    and only the extracted features are released. In v3.0 and v3.1, spectrograms, Mel spectrograms, MFCCs,
    phonetic posteriorgrams and EMA traces for sensitive records and audio checks were removed, and spectrograms
    and similar features were excluded where the audio contained free speech, while static features that
    do not encode the sensitive information were retained.
external_resources:
- id: d4d:voice_external_resources
  name: Supporting code, metadata and training resources
  description: 'The dataset is accompanied by open-source software and metadata repositories that are
    published separately from the data files: the b2aiprep library used to convert raw waveforms into
    the released features and to merge source data into the phenotype files; the senselab audio processing
    toolkit; the bridge2ai-redcap repository holding the REDCap data dictionary, metadata and instrument
    PDFs; the bridge2ai-docs repository behind the project documentation site; FHIR profiles for voice
    as a biomarker; and a scholars programme site offering training in the use of the dataset.'
  external_resources:
  - https://github.com/sensein/b2aiprep
  - https://github.com/sensein/senselab
  - https://github.com/eipm/bridge2ai-redcap
  - https://github.com/eipm/bridge2ai-docs
  - https://docs.b2ai-voice.org/
  - https://www.b2aivoicescholars.org/
  - https://zenodo.org/doi/10.5281/zenodo.12760724
  - https://zenodo.org/doi/10.5281/zenodo.13834653
  future_guarantees: The dataset documentation answers "NA" when asked whether there are guarantees that
    external resources will exist and remain constant over time and whether official archival versions
    exist, and states that the dataset itself is self-contained.
  restrictions:
  - The REDCap data dictionary and metadata repository is released under the MIT license.
  - The b2aiprep preparation library is released under the Apache-2.0 license.
  - The documentation and dashboard source is released under the MIT license.
  source_caveats: The documentation site notes that the repository "is under review for potential modification
    in compliance with Administration directives", so the availability of these resources is stated by
    the source to be under review.
distributions:
- id: d4d:voice_dist_features
  name: features
  path: features/
  description: Features derived from the raw audio waveforms, released in place of the waveforms themselves.
    Dense features are stored as Parquet; each Parquet element carries the participant identifier, session
    identifier, task name, number of time frames and the feature tensor. Static per-recording features
    and audio-quality metrics are stored as tab-delimited text. Every file has a JSON data dictionary
    with the same file stem describing the feature and the processing used to prepare it. Spectrograms,
    Mel spectrograms, MFCCs, phonetic posteriorgrams and EMA traces for sensitive records and audio checks
    were removed from v3.1, and some recordings could not generate certain features and are absent from
    the bundled data.
- id: d4d:voice_dist_phenotype
  name: phenotype
  path: phenotype/
  description: Information collected from the participant or another individual during the encounter,
    organised into confounders, demographics, diagnosis, enrollment, questionnaire and task subfolders.
    Every table is a tab-delimited file paired with a JSON data dictionary of the same file stem, whose
    keys match the column names and whose values give a one-sentence description of the column, the question
    asked to elicit the answer and the data type of the response. Rows appear for a participant only if
    at least one column is non-missing, and because participants may attend repeated visits there may
    be more than one row per participant, with no requirement that responses agree across visits. The
    diagnosis subfolder holds one table per condition (airway stenosis, amyotrophic lateral sclerosis,
    anxiety, benign lesions, bipolar disorder, cognitive impairment, control, COPD and asthma, depression,
    glottic insufficiency, laryngeal cancer, laryngeal dystonia, laryngitis, muscle tension dysphonia,
    Parkinson's disease, precancerous lesions, unexplained chronic cough and unilateral vocal fold paralysis);
    the questionnaire subfolder holds the validated instruments (ADHD adult, custom affect scale, DSM-5
    adult, dyspnea index, GAD-7, Leicester cough questionnaire, PANAS, PHQ-9, productive vocabulary, psychiatric
    history, PTSD adult, VHI-10 and voice perception); and the task subfolder holds acoustic task, Harvard
    sentences, random item generation, recording, session, Stroop and Winograd tables.
- id: d4d:voice_dist_metadata
  name: metadata
  path: metadata/
  description: A Parquet file and its data dictionary carrying information specific to each recording,
    including task instructions and prompts and information about the microphone used and its gain. Added
    in v3.1.0.
dialect:
  delimiter: "\t"
  header: 'true'
