id: https://doi.org/10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: The Artificial Intelligence Ready and Equitable/Exploratory Atlas for Diabetes Insights
  (AI-READI) dataset is a multimodal, cross-sectional dataset collected from individuals with and
  without type 2 diabetes mellitus (T2DM) and harmonized across three data collection sites (University
  of Alabama at Birmingham, University of California San Diego, and University of Washington). Version
  3.0.0 contains data from 2280 participants collected between July 19, 2023 and May 1, 2025, comprising
  356,343 files and approximately 3.82 TB. Modalities include REDCap survey data, physical measurements
  and vitals, blood and urine laboratory results, 12-lead electrocardiography, cognitive screening
  (MoCA), monofilament testing for peripheral neuropathy, visual function testing, retinal imaging
  (colour fundus photography, fundus autofluorescence, near-infrared reflectance, OCT, OCTA and fluorescence
  lifetime imaging ophthalmoscopy) from multiple devices, continuous glucose monitoring, wearable
  physical activity monitoring, and home environmental sensing. The dataset was designed to be AI/ML
  ready and hypothesis agnostic, with recruitment sampling aimed at an approximately equal distribution
  of participants across diabetes severity, self-reported race/ethnicity and biological sex, in order
  to support research into salutogenesis - the pathway from T2DM back to health. The dataset is organized
  following the Clinical Dataset Structure (CDS) v0.1.1 and is distributed through the FAIRhub platform.
  The public version carries no protected health information and omits participant sex, race/ethnicity
  and medication information; a controlled-access version holds the more sensitive elements.
notes: This record describes version 3.0.0 of the dataset (DOI 10.60775/fairhub.3), released 2025-11-17.
  Versions 1.0.0 (10.60775/fairhub.1) and 2.0.0 (10.60775/fairhub.2) are earlier releases of the same
  dataset and are represented through version_access and related_datasets rather than as separate
  datasets.
source_caveats: 'The declared bundle carries three spellings of the project name. The BMJ Open protocol
  and the Nature Metabolism comment expand AI-READI as "Artificial Intelligence Ready and Equitable
  Atlas for Diabetes Insights"; the NIH RePORTER project record, the FAIRhub healthsheet and the dataset
  README expand it as "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights";
  and the FAIRhub study description records the official study title as "AI Ready and Exploratory
  Atlas for Diabetes Insights". All three are retained above rather than one being selected. The bundle
  also disagrees about the organization responsible for the dataset: the FAIRhub metadata records
  a managing organization and lead sponsor of "Washington University in St. Louis" (ROR https://ror.org/01yc7t268),
  whereas the NIH RePORTER record gives the awardee organization as University of Washington, the
  data license agreement in the bundle names the University of Washington as Licensor, and the IRB
  of record is the University of Washington. Both are represented where they occur and neither has
  been substituted for the other.'
