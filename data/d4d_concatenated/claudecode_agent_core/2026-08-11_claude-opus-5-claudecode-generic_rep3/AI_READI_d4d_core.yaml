purposes:
- name: Enable AI/ML research into type 2 diabetes salutogenesis
  description: The dataset was created to enable future generations of artificial intelligence and
    machine learning research to provide critical insights into type 2 diabetes mellitus, including
    salutogenic pathways to return to health. T2DM is a growing public health threat and current understanding
    of it, especially in the context of salutogenesis, is limited; AI-based approaches may improve
    that understanding but a key barrier has been the lack of data ready for training AI models. The
    AI-READI dataset is intended to fill that gap.
  response: The purpose for creating the dataset was to enable future generations of artificial intelligence/machine
    learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including
    salutogenic pathways to return to health.
- name: Provide a blueprint for ethically sourced, AI-ready clinical datasets
  description: A stated aim of the AI-READI project is to establish and share standards, best practices
    and guidelines for the collection, preparation and sharing of data for AI/ML purposes, so that
    future data generation projects can follow them. This includes guidelines for project management,
    data collection, management and sharing, adherence to FAIR principles, and the development of
    new standards such as the Clinical Dataset Structure (CDS).
tasks:
- name: Downstream pseudotime manifold analysis
  description: Data collection was specifically designed to permit downstream pseudotime manifold
    analysis, an approach used to predict disease trajectories by collecting and learning from complex,
    multimodal data from participants with differing disease severity (normal to insulin-dependent
    T2DM). The long-term objective is a foundational dataset in T2DM, agnostic to existing classification
    criteria or biases, that can be used to reconstruct a temporal atlas of T2DM development and reversal
    towards health.
  response: The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
    manifolds and various applications in artificial intelligence.
- name: Hypothesis-agnostic multimodal AI/ML model development
  description: The protocol was designed to be agnostic to hypotheses; rather than targeting a specific
    prediction task, the team assembled a data collection protocol composed of assessments from many
    health domains likely to be impacted by T2DM. The dataset comes with no predefined labels and
    is intended to facilitate multiple potential downstream AI/ML applications.
addressing_gaps:
- name: Lack of large, diverse, AI-ready multimodal T2DM datasets
  description: The ability to understand and affect the course of complex, multi-organ diseases such
    as T2DM has been limited by a lack of well-designed, high quality, large and inclusive multimodal
    datasets. A major barrier to AI in this area has been the lack of diverse datasets that are AI
    ready for training AI models.
  response: The AI-READI dataset addresses the absence of a large, well-characterised, multimodal
    dataset that is ready off-the-shelf for AI/ML analysis of type 2 diabetes mellitus.
- name: Under-representation of racialised groups in T2DM research
  description: A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated
    that samples lacked racial and ethnic diversity. Certain populations experience a greater burden
    of T2DM, exacerbating health disparities. AI-READI recruits four race/ethnic groups (Asian, Black,
    Hispanic, white) in approximately equal proportions rather than targeting the demographic distribution
    of the US population, because building balanced datasets is critical for the development of unbiased
    machine learning models.
