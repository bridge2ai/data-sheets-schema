id: https://chorus4ai.org/
name: CHoRUS
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
description: 'CHoRUS is a multi-center, multimodal, high-resolution clinical dataset assembled by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI project,
  one of four data generation projects in the NIH Common Fund''s Bridge2AI consortium. The project''s
  stated goal is to develop a publicly available, AI-ready critical care dataset covering more than 100,000
  critically ill patients, together with the network, tools, standards, and educational programs needed
  to build machine-learning and artificial-intelligence models that improve the care and outcomes of patients
  requiring critical care. The CHoRUS Network describes its aim as developing "the most diverse, high-resolution,
  ethically sourced, AI-ready data set to answer the grand challenge of improving recovery from acute
  illness."

  Data are collected retrospectively from hospital systems at data-contributing sites and standardized
  to the OMOP Common Data Model, with modality-specific standards for non-tabular data: DICOM for imaging
  drawn from PACS, WFDB for bedside-monitor waveform telemetry, EDF+ and Persyst for EEG waveforms, and
  the OHNLP toolkit for extracted and tokenized clinical notes. Structured OMOP domains include demographics,
  medication administration (time-stamped at each infusion change or dose administration), procedures,
  nursing flowsheets (high-frequency documentation), and diagnoses. Access to all modalities is controlled.

  The project site reports a current released dataset of 50,000 patient admissions from ICU, PICU, and
  NICU containing 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of
  waveform data, against an anticipated final dataset of 100,000 patient admissions across 9 data modalities
  from 14 data-contributing hospitals. A September 2025 training webinar reports that, as of August 2025,
  the dataset covers 14 different hospitals with over 45,000 unique admissions. The collaboration spans
  20 academic centers, of which 14 contribute as Data Acquisition centers, and more than 60 consortium
  members across 20 institutions.

  The project is organized around three pillars: Data (standards, tool development and optimization, and
  data acquisition), Ethics (ethical and trustworthy AI), and People (team science, and skill and workforce
  development). It also plans to provision a holdout test set accessible for external validation of models.'
notes: The CHoRUS project website carries a site-wide banner reading "This repoitory is under review for
  potential modification in compliance with Administration directives" (spelling as published).
source_caveats: 'No DOI, dataset version identifier, or formal citation for the CHoRUS dataset appears
  in any document in this bundle; the project site URL is the identifier the sources themselves use. Two
  sources give different current sizes without stating that they measure the same thing: the Cohort 2
  informational webinar (September 2025) reports "over 45K unique admissions" as of August 2025 across
  14 hospitals, while the project website reports a "Current Released Dataset" of 50,000 patient admissions
  from ICU, PICU, and NICU; both are recorded here as stated rather than reconciled. The same two sources
  give different imaging figures - "currently 1000 images available with de-id in process for larger cohort"
  (webinar) versus "7,642 Admissions with Radiology Data" (website) - which are different units of count
  and are likewise recorded separately. The website''s "23 Tb Waveform data" is not recorded as a byte
  count because the source does not disambiguate terabits from terabytes. The webinar''s modality table
  was extracted from a PDF and its rows and columns are interleaved in the preprocessed text, so the pairing
  of each data type with its access control and metadata-schema status is reconstructed and should be
  treated as lower confidence than the modality and standard names themselves. The MIT license statement
  applies to the chorus-ai GitHub project ("This project is licensed under the MIT License"), not to the
  dataset; no license is stated for the data themselves. The bundle does not name an IRB, state IRB approval,
  or describe patient consent or notification mechanisms. The program manager contact address is transcribed
  verbatim from the project website, which prints "cmccrary@mgh.havard.edu"; the domain appears to be
  misspelled at the source.'
