purposes:
- name: Publicly available AI-ready critical care dataset
  response: The project's overarching goal is to develop a publicly available, AI-ready critical care
    dataset, while ensuring the methods promote privacy, accountability, and clinical benefit, and while
    promoting a new generation of AI clinicians and scientists.
- name: Generate data for ML/AI applications in acute and critical illness
  response: The CHoRUS data generation project was created to meet the need of generating data for ML/AI
    applications aimed at characterizing acute and critical care illness, predicting complications, and
    measuring treatment response among patients with acute or critical illness.
- name: Grand challenge of improving recovery from acute illness
  response: The goal of the CHoRUS Network is to develop the most diverse, high-resolution, ethically
    sourced, AI-ready data set to answer the grand challenge of improving recovery from acute illness.
- name: Holdout test set for external model validation
  response: The dataset will also provision a holdout test set, accessible for model external validation
    to aid marketplace adoption of AI-developed models for implementation in acute and critical care.
- name: Infrastructure and workforce for clinical care AI
  response: Beyond the data themselves, the project aims to develop the necessary network, tools, standards,
    data, and education to build ML- and AI-derived models to improve the care and outcomes of patients
    requiring critical care, including cultivating expertise in the lay and scientific community to improve
    AI literacy and utilization through multimodal educational approaches.
tasks:
- name: Characterizing acute and critical care illness
  response: Characterization of acute and critical care illness is named as a target application of the
    dataset.
- name: Predicting complications
  response: Prediction of complications among patients with acute or critical illness is named as a target
    application of the dataset.
- name: Measuring treatment response
  response: Measurement of treatment response among patients with acute or critical illness is named as
    a target application of the dataset.
- name: External validation of AI models
  response: A sequestered holdout test set is intended to support external validation of models developed
    by others, to aid marketplace adoption of AI-developed models for implementation in acute and critical
    care.
- name: Labeling data with prediction targets
  response: A visualization and annotation environment is being developed to label data with targets important
    for prediction.
addressing_gaps:
- name: Lack of AI/ML infrastructure in critical care
  response: '"There is an urgent need for infrastructure to support artificial intelligence and machine
    learning (AI/ML) in critical care. Developing high-resolution multi-center data sets is a critical
    first step towards actionable and trustworthy AI."'
- name: Absence of a legal framework for data collection at scale
  response: The project sets out to establish a legal framework for collecting data at scale, and to analyze
    the existing legal and regulatory landscape, as an unmet prerequisite for multi-center clinical data
    sharing.
- name: Unknown community expectations for public data sharing
  response: The project performs community-facing ethics focus groups to determine what data is appropriate
    for public sharing, addressing a gap in evidence about community perspectives on clinical care AI.
- name: Missing contextual and social determinants of health
  response: The project ensures that data elements feature appropriate contextual factors such as geographic
    distance to the nearest hospital, and accounts for Social Determinants of Health.
- name: Shortage of AI-literate clinicians and scientists
  response: A comprehensive set of approaches is intended to develop the skills and workforce for a next
    generation of diverse academic and community AI scientists, addressing limited AI literacy in the
    lay and scientific community.
