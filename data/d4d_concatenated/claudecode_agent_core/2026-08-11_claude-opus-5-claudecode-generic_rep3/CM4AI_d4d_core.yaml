acquisition_methods:
- id: cm4ai_acquisition_measured
  name: Direct laboratory measurement
  was_directly_observed: true
  was_reported_by_subjects: false
  acquisition_details: 'Data are generated by direct laboratory measurement on cultured human cell lines:
    affinity purification mass spectrometry and size-exclusion chromatography mass spectrometry for protein-protein
    interactions, immunofluorescence confocal microscopy for protein subcellular localization, and single-cell
    CRISPR/Cas9 perturbation screens for transcriptional and fitness phenotypes. There are no human subjects
    and no subject-reported data.'
- id: cm4ai_acquisition_derived_maps
  name: Computational integration into cell maps
  was_inferred_derived: true
  acquisition_details: Cell maps are derived from the measured input streams by self-supervised embedding
    of the protein imaging and interaction data followed by algorithmic community detection at multiple
    resolutions, producing a hierarchy of protein assemblies.
addressing_gaps:
- id: cm4ai_gap_black_box_models
  name: Uninterpretable genotype-phenotype models
  response: In genomics and precision medicine, machine learning models are often "black boxes", predicting
    phenotypes from genotypes without understanding the mechanisms by which such translation occurs. To
    address this deficiency the project launched a coordinated effort involving three complementary mapping
    approaches - proteomic mass spectrometry, cellular imaging and genetic perturbation via CRISPR/Cas9
    - creating a library of large-scale maps of cellular structure and function across demographic and
    disease contexts.
- id: cm4ai_gap_uncharted_cell_architecture
  name: Incomplete knowledge of subcellular organization
  response: Although the human genome sequence has been known for decades, knowledge of how proteins are
    organized within cells is still evolving; CM4AI addresses this by generating matched proteome-scale
    interaction, imaging and perturbation data in the same cellular contexts and integrating them into
    multiscale maps.
cleaning_strategies:
- id: cm4ai_cleaning_crispr_qc
  name: Quality control of single-cell CRISPR screen data
  cleaning_details: At the time of the CM4AI project description preprint (May 2024), the single-cell
    CRISPR screen data from MDA-MB-468 cells and undifferentiated KOLF2.1J iPSCs were reported as currently
    being quality controlled.
collection_mechanisms:
- id: cm4ai_collection_apms
  name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details: 'To map protein-protein interactions of 100 chromatin regulators under different
    conditions (cancer: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated, neurons and cardiomyocytes),
    AP-MS was employed on endogenously tagged cell lines. The project reported having endogenously tagged
    17 genes in MDA-MB-468 and acquired AP-MS data under three conditions (untreated, paclitaxel- and
    vorinostat-treated), with 34 additional genes in the process of being tagged.'
- id: cm4ai_collection_secms
  name: Size-exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details: SEC-MS was used for proteome-wide complex and interaction mapping as an orthogonal
    mass-spectrometry approach. SEC-MS was performed on MDA-MB-468 cells under three conditions (untreated,
    paclitaxel- and vorinostat-treated), identifying 72 of 100 chromatin modifiers with 52 of them integral
    components of protein complexes, and detecting PPI profiles of over a thousand complexes with thousands
    of proteins showing differential elution profiles between control and treated cells. SEC-MS was also
    performed in KOLF2 iPSCs and derivatives, uncovering more than 700 protein complexes in both parental
    iPSCs and differentiated neurons.
- id: cm4ai_collection_if_imaging
  name: Immunofluorescence spatial proteomics imaging
  mechanism_details: Spatial subcellular organization was mapped using the Human Protein Atlas resource
    of antibodies. Automated fixation and permeabilization protocols were established for a pipetting
    robot for the MDA-MB-468 and KOLF2 cell lines, and spatial proteomics mapping of 100 chromatin regulators
    was completed in MDA-MB-468 cells (+/- paclitaxel or vorinostat), with a further 500 proteins pending
    significant hits from the genetic perturbation and PPI results. Imaging was performed by immunofluorescence-based
    staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford University; nuclei were
    stained with DAPI (blue channel), endoplasmic reticulum with a calreticulin antibody (yellow channel),
    microtubules with a tubulin antibody (red channel), and the protein of interest with its antibody
    (green channel).
- id: cm4ai_collection_crispr_perturbation
  name: Single-cell CRISPR perturbation screens
  mechanism_details: Single-cell CRISPR screens perturbing 100 chromatin regulators were performed in
    MDA-MB-468 cells under three conditions (no treatment, paclitaxel or vorinostat) and in undifferentiated
    KOLF2 iPSCs. A CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene
    was designed, and MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were generated and
    characterized. Screens were performed using the 10x Genomics 3'HT kit. The released CRISPRi Perturbation
    Cell Atlas in undifferentiated KOLF2.1J hiPSCs maps transcriptional and fitness phenotypes associated
    with 11,739 targeted genes, validated via phenotypic, protein-interaction and metabolic tracing assays.
- id: cm4ai_collection_cell_lines
  name: Cell lines used for data generation
  mechanism_details: CM4AI elected to use the cancer cell line MDA-MB-468 (+/- treatment with paclitaxel
    and vorinostat) and the iPSC line KOLF2.1J (+/- neuronal and cardiomyocytic differentiation), both
    of which are described as ethically sourced. MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast
    cancer cell line established from a metastatic site pleural effusion of a 51-year-old black female
    with a metastatic mammary adenocarcinoma, available from ATCC. KOLF2.1J (RRID:CVCL_B5P3) was derived
    from a healthy male Northern European donor, is available from the Human Induced Pluripotent Stem
    Cells Initiative (HipSci) resource, and is available for access by not-for-profit organizations via
    a simple MTA.
collection_timeframes:
- id: cm4ai_timeframe_award_period
  name: Project award period
  start_date: '2022-09-01'
  end_date: '2026-08-31'
  timeframe_details: NIH RePORTER records the project start as 2022-09-01 and the project end as 2026-08-31
    for the CM4AI data generation project. The Dataverse release records give a data creation date of
    2025-02-27 and a deposit date of 2025-02-27, and state that the dataset will be updated and augmented
    through the end of the project in November 2026.
  source_caveats: The bundle does not state per-modality data collection start and end dates; the dates
    above are the award period from NIH RePORTER, not measured collection dates. The project end date
    in NIH RePORTER (2026-08-31) differs from the "end of the project in November 2026" stated in the
    release maintenance plan.
