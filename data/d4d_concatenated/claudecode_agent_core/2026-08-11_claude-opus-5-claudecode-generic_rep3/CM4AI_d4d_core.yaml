  description: The June 2026 Data Release of CM4AI, presented on the CM4AI data releases page as the latest
    data release. This Beta release includes perturb-seq data for MDA-MB-468 breast cancer cells +/- treatment
    and undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast cancer cells +/-
    treatment, undifferentiated KOLF2.1J iPSCs and iPSC-derived neuron progenitor cells, neurons and cardiomyocytes;
    AP-MS data for MDA-MB-468 breast cancer cells + treatment; and IF images in MDA-MB-468 breast cancer
    cells +/- treatment. It is the first release in the bundle to include AP-MS data. The record reports
    181 downloads and lists ten public archive files.
  source_caveats: 'The page header shows "Version 2.0" while the data citation on the same page gives
    V2. The CM4AI data releases page dates this release "Released on: June 17, 2025", one year earlier
    than the Dataverse publication date of 2026-06-17. The three IF image archives carry a publication
    date of Jul 15, 2026, later than the release publication date, and their MD5 checksums differ from
    the identically named archives in the October 2025 release. The structured governance and limitations
    statements on this record remain dated 2025-06-30.'
