description: Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Bridge2AI program. Its stated objective is to deliver
  machine-readable hierarchical maps of cell architecture as AI-ready data, produced from multimodal interrogation
  of chromatin modifiers, metabolic enzymes and other proteins involved in cancer, neuropsychiatric and
  cardiac disorders, together with quarterly data releases of the map-input data streams. The input data
  streams are protein-protein interaction data from affinity purification mass spectrometry (AP-MS) and
  size-exclusion chromatography mass spectrometry (SEC-MS), spatial proteomics from immunofluorescence
  (IF) confocal microscopy, and single-cell CRISPR/Cas9 genetic perturbation (perturb-seq) screens. Data
  are generated in the triple-negative breast cancer line MDA-MB-468 (untreated, paclitaxel-treated and
  vorinostat-treated) and in KOLF2.1J induced pluripotent stem cells (undifferentiated and differentiated
  to neural progenitor cells, neurons and cardiomyocytes). Input streams are integrated by the Multi-Scale
  Integrated Cell (MuSIC) software pipeline, and outputs are packaged with provenance graphs and rich
  metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework. Releases are deposited
  in LibraData, the University of Virginia's Dataverse instance. The CM4AI portal reports 1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739 genes targeted
  and a data volume of 21.4 TB. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin,
  UA Birmingham, Simon Fraser University and the Hastings Center.
distribution_dates:
- id: cm4ai_distribution_dates
  name: Data release dates
  release_dates:
  - May 2024 Data Release - listed in the archive on the CM4AI data releases page
  - 2025-03-03 - March 2025 Data Release (Beta), Dataverse publication date
  - 2025-07-01 - June 2025 Data Release (Beta), Dataverse publication date
  - 2025-10-31 - October 2025 Data Release (Beta), Dataverse publication date
  - 2026-06-17 - June 2026 Data Release (Beta), Dataverse publication date
  description: CM4AI states that it releases data quarterly, ensuring continuous updates to the cell maps
    and input data streams.
  source_caveats: 'The CM4AI data releases page states that the June 2026 Data Release was "Released on:
    June 17, 2025", while the Dataverse record for that release gives a publication date of 2026-06-17
    and a citation year of 2026. Individual files within a release may carry later publication dates than
    the release itself; for example, files in the June 2025 release are published Jul 1, 2025 and Oct
    22, 2025, and files in the June 2026 release Jun 17, 2026 and Jul 15, 2026.'
distribution_formats:
- id: cm4ai_distribution_format_zip
  name: ZIP archives
  format: ZIP
  media_type: application/zip
  description: Data files in the Dataverse releases are distributed as ZIP archives, each published with
    an MD5 checksum. The releases state that the dataset is too large to download as a whole and that
    files must be selected individually from the files table, with a 953.7 MB per-download ZIP limit and
    a Data Access API available for programmatic access.
- id: cm4ai_distribution_format_json
  name: RO-Crate metadata in JSON
  format: JSON
  media_type: application/json
  description: RO-Crate metadata files (ro-crate-metadata.json, release-ro-crate-metadata.json and per-modality
    RO-Crate metadata) are distributed as JSON, including a release-level RO-Crate with pointers to sub
    RO-Crates.
- id: cm4ai_distribution_format_html
  name: HTML datasheet and provenance graphs
  format: HTML
  media_type: text/html
  description: The June 2025 release distributes release-ro-crate-datasheet.html, an HTML datasheet summarizing
    key release information, and per-modality provenance graph HTML files, which the release notes state
    must be downloaded to view properly as they do not display in the Dataverse preview.
ethical_reviews:
- id: cm4ai_ethical_review_ravitsky
  name: CM4AI ethical review contact - Vardit Ravitsky
  reviewing_organization: The Hastings Center
  contact_person: mailto:ravitskyv@thehastingscenter.org
  review_details: The Dataverse release records name Vardit Ravitsky (ravitskyv@thehastingscenter.org)
    as an ethical review contact under "Data Governance & Ethics".
- id: cm4ai_ethical_review_belisle_pipon
  name: CM4AI ethical review contact - Jean-Christophe Belisle-Pipon
  reviewing_organization: Simon Fraser University
  contact_person: mailto:jean-christophe_belisle-pipon@sfu.ca
  review_details: The Dataverse release records name Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca)
    as an ethical review contact under "Data Governance & Ethics".
- id: cm4ai_ethics_module
  name: CM4AI Ethics Module
  reviewing_organization: Cell Maps for Artificial Intelligence (CM4AI)
  review_details: The Ethics team worked with the Data Acquisition, Tools and Standards modules to develop
    a plan for ethical preparation, licensing, dissemination and Data Access supervision of CM4AI datasets,
    balancing openness of the data with protection of intellectual property and supervision of potential
    commercialization. The team employs a methodology inspired by Value-Sensitive Design, is building
    an axiological repository of values, and formulated the CM4AI Life Cycle, a framework of governance
    milestones across data generation and AI system development. The Ethics pillar also supported the
    Bridge2AI Ethics Working Group's work with the Bridge2AI Data Sharing and Dissemination Working Group
    in developing a Code of Conduct, which participants in the Bridge2AI Open House must attest and commit
    to prior to accessing B2AI data, including CM4AI datasets.
