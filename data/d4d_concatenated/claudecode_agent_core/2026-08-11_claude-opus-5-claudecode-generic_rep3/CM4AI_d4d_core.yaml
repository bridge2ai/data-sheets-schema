publisher: https://dataverse.lib.virginia.edu/
purposes:
- id: cm4ai_purpose_interpretable_learning
  name: Interpretable genotype-phenotype learning
  response: The CM4AI data generation project seeks to map the spatiotemporal architecture of human cells
    and use these maps toward the grand challenge of interpretable genotype-phenotype learning. CM4AI's
    objective is to deliver machine-readable hierarchical maps of cell architecture as AI-ready data produced
    from multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
    neuropsychiatric and cardiac disorders in disease-relevant cell lines under perturbed and unperturbed
    conditions.
- id: cm4ai_purpose_ethical_ai_ready_data
  name: Ethical, FAIR, AI-ready data
  response: CM4AI's overarching mission is to produce ethical, AI-ready datasets of cell architecture,
    inferred from multimodal data collected for human cell lines, to enable transformative biomedical
    AI research. As defined by CM4AI, AI-ready biomedical data are fully characterized FAIR data of known
    provenance, which can be ethically and reliably processed by AI applications; whose models and software
    are available and well-described for validation and re-use; and whose predictions may be fully explained
    and interpreted to the user as needed. The project's stated AI-readiness criteria are FAIR, provenanced,
    characterized, explainable and ethical.
