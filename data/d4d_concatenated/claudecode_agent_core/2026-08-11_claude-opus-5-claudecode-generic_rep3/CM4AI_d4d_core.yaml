  - MassIVE Repository - SEC-MS data in MDA-MB-468 breast cancer cells (+/- treatment)
  - MassIVE Repository - AP-MS data in MDA-MB-468 breast cancer cells (treated with paclitaxel)
  - MassIVE Repository - AP-MS data in MDA-MB-468 breast cancer cells (treated with vorinostat)
  - Figshare - CRISPRi Perturbation Atlas of iPSCs
  - NCBI BioProject - Sequence Read Archive (SRA) data
