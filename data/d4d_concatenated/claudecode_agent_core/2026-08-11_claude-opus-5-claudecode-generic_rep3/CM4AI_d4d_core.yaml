name: CM4AI
page: https://cm4ai.org/
preprocessing_strategies:
- id: cm4ai_preprocessing_music_pipeline
  name: MuSIC data integration and map production pipeline
  preprocessing_details: 'Input data streams are integrated via the Multi-Scale Integrated Cell (MuSIC)
    software pipeline employing deep learning models and community detection algorithms. The pipeline
    steps are: (a) download PPI networks from the Krogan Laboratory''s deposition archive and IF images
    from the Lundberg Laboratory''s deposition archive; (b) generate embeddings, with PPI networks processed
    using the node2vec deep learning model and IF images processed using a Human Protein Atlas deep learning
    model, each reducing dimensionality; (c) co-embedding, in which the PPI and image embeddings are integrated
    using contrastive deep learning so that the original embeddings can be reconstructed with minimal
    information loss and proteins with similar PPI and image embeddings have similar co-embeddings; (d)
    protein community detection based on all-by-all similarities of protein pairs in the co-embedding
    space, outputting a hierarchy of protein communities as the final cell map; and (e) hierarchy evaluation,
    in which maps are aligned to known protein function and pathway resources including the Gene Ontology
    and Reactome, and assemblies are annotated using a large language model approach. Each pipeline segment
    calls the FAIRSCAPE client package to validate inputs and create the output RO-Crate package for that
    segment.'
  used_software:
  - id: cm4ai_software_music
    name: Multi-Scale Integrated Cell (MuSIC) pipeline
    license: BSD-3
    description: The Tools module's dataset integration and map production system. The project states
      that software comprising the Tools data integration pipeline is available under the BSD-3 open source
      license in GitHub for alpha-level tools, or in the Zenodo long-term archive for production-ready
      tools, and that links to these tools are packaged in RO-Crates as part of CM4AI provenance representations.
- id: cm4ai_preprocessing_fairscape_packaging
  name: FAIRSCAPE AI-readiness packaging
  preprocessing_details: Output data are packaged with provenance graphs and rich metadata as AI-ready
    datasets in RO-Crate format using an extended, client-server version of the FAIRSCAPE framework. The
    client-side package FAIRSCAPE-CLI is called when a computation or coherent set of computations in
    the pipeline completes and is passed metadata defining JSON-Schema schemas for the datasets in the
    computational unit as well as the inputs, computations, software, models and outputs; it creates an
    RO-Crate package with the datasets, metadata and software or resolvable references to them, plus unique
    stubs for identifier creation. RO-Crates are sent to the FAIRSCAPE server where they are registered
    and assigned persistent, resolvable, globally unique persistent identifiers, then decomposed into
    their individual components - datasets, models, software - which are also registered and assigned
    PIDs. The PID system in use is the ARK scheme, with DOIs a future feature as supplementary PIDs for
    final-state publishable work. The server computes end-to-end entailments on each RO-Crate's provenance
    expressed in the EVI Evidence Graph Ontology and links them together where possible; PIDs resolve
    to machine- and human-readable landing pages containing metadata expressed in JSON-LD using vocabularies
    from Schema.org, EVI and other public ontologies, with alternate views serialized in JSON-LD and RDF-XML.
  used_software:
  - id: cm4ai_software_fairscape
    name: FAIRSCAPE
    license: MIT
    url: https://fairscape.github.io
    description: Described with a tutorial and installation instructions at https://fairscape.github.io.
      Copyright to this software is held by the Rector and Board of Visitors of the University of Virginia
      and it is available under the open source MIT License. Both the client-side and server-side FAIRSCAPE
      packages are PIP-installable and freely available.
- id: cm4ai_preprocessing_characterization
  name: Characterization and validation of datasets and data elements
  preprocessing_details: CM4AI's stated AI-readiness features comprise establishing FAIRness including
    rich metadata and persistent, globally unique identifiers; computing a machine-readable provenance
    graph resolvable as metadata for all results, including inputs, computations, software and outputs;
    and characterizing and validating all datasets and data elements and mapping data elements to public
    ontology vocabularies, where appropriate, using JSON-Schema mini-data-dictionary descriptions resolvable
    from the provenance graph metadata. The Standards module established FAIR AI-readiness metadata and
    validation toolkits, including data dictionaries, formatting standards and a FAIRSCAPE metadata and
    provenance API implemented as a command line software package.
- id: cm4ai_preprocessing_integrative_structure_modeling
  name: Integrative structure modeling of MuSIC communities
  preprocessing_details: The project reported exploring the feasibility of integrative structure modeling
    of the MuSIC communities. A bioinformatics pipeline was developed to annotate MuSIC communities by
    available structural information about community members and their interactions, drawn from the Protein
    Data Bank, the AlphaFold Protein Structure Database, crosslinking mass spectrometry and prediction
    of disordered sequence segments; communities were ranked by the amount of available structural information
    as a proxy for modeling feasibility, and integrative structure modeling was performed for a few top-ranked
    communities using the standard four-stage integrative modeling framework scripted with the Python
    Modeling Interface package.
  used_software:
  - id: cm4ai_software_imp
    name: Integrative Modeling Platform (IMP)
    version: '2.18'
    url: http://integrativemodeling.org
    description: Open-source package used for integrative structure modeling of MuSIC communities.
