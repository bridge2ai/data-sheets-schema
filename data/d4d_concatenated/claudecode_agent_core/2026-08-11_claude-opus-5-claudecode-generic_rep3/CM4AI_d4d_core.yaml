  description: The June 2025, October 2025 and June 2026 release records list "External Data Links" to
    repositories holding related raw and processed data outside the Dataverse deposit. The NCBI BioProject/SRA
    link is listed on the June 2025 record and the Figshare link on the June 2026 record.
  source_caveats: The release pages carry these as link labels only; the bundle does not contain the resolved
    repository URLs or accession numbers for them.
