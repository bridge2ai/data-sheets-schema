sampling_strategies:
- id: cm4ai_sampling_strategy
  name: Protein and cell-line selection
  is_sample: true
  source_data: Cultured human cell lines MDA-MB-468 (RRID:CVCL_0419) and KOLF2.1J (RRID:CVCL_B5P3), under
    treated and untreated or undifferentiated and differentiated conditions.
  is_representative: false
  why_not_representative: The release records state that data were derived from commercially available
    de-identified human cell lines and do not represent all biological variants which may be seen in the
    population at large.
  strategies: Multimodal interrogation targets 100 chromatin modifiers and 100 metabolic enzymes involved
    in cancer, neuropsychiatric and cardiac disorders. Spatial proteomics mapping covered 100 chromatin
    regulators with a further 500 proteins pending significant hits from the genetic perturbation and
    PPI results. The CRISPRi perturbation atlas is genome-scale, targeting 11,739 genes. Deep multi-modal
    data are generated for a shared list of proteins across all cell types and treatment conditions.
source_caveats: The declared bundle also contains Schaffer et al., "Multimodal cell maps as a foundation
  for structural and functional genomics", Nature 642:222-231 (2025), doi 10.1038/s41586-025-08878-3.
  That paper acknowledges the same Bridge2AI programme award (OT2 OD032742) but reports a multimodal cell
  map of U2OS osteosarcoma cells, whose data are deposited at NDEx, MassIVE (MSV000097168), ProteomeXchange
  (PXD052362) and the ModelArchive. Those deposits are not listed among the CM4AI data releases in the
  bundle, and no source in the bundle states that they are part of this dataset, so they are not represented
  here as CM4AI dataset content. Reported counts and cell-line coverage differ between releases; those
  figures are recorded on the individual release records rather than merged into a single dataset-level
  claim.
status: Beta. The March 2025, June 2025, October 2025 and June 2026 data releases are each titled "(Beta)",
  and their completeness statements say that the data are not yet in completed final form.
tasks:
- id: cm4ai_task_visible_machine_learning
  name: Visible machine learning systems
  response: The data are intended to enable creation of "visible" machine learning systems, which are
    not black boxes but are built directly on knowledge maps of cell and tissue architecture. Cell maps
    have been used in AI tools for "visible machine learning" or "visible neural networks" (VNNs) to interrogate
    how protein assemblies in the cell affect cell-level phenotype predictions.
- id: cm4ai_task_cell_mapping
  name: Multiscale cell map construction
  response: Construction of hierarchical cell maps, represented as directed acyclic graphs in which each
    node is an assembly of proteins in proximity at a given scale, from large assemblies representing
    cell compartments to small assemblies such as protein complexes or subunits.
- id: cm4ai_task_genomic_interpretation
  name: Interpretation of genetic variants and mutations
  response: Cell maps provide a foundation for downstream applications in human genomics, including interpretation
    of genetic variants and mutations.
