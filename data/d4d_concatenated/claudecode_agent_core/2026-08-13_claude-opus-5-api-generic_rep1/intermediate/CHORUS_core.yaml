notes: >-
  The project website carried the banner "This repoitory is under review for potential
  modification in compliance with Administration directives" (spelling as printed) at the time of
  capture. The website also states that the content is solely the responsibility of the authors
  and does not necessarily represent the official views of the NIH.

source_caveats: >-
  Counts differ across sources and reflect different snapshot dates. The project website reports a
  current released dataset of 50,000 patient admissions from ICU, PICU, and NICU, 1.6 billion rows
  of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data, alongside an
  anticipated final dataset of 100,000 patient admissions, 9 data modalities, and 14 contributing
  hospitals; the September 2025 training webinar states that as of August 2025 the dataset covered
  14 hospitals with over 45,000 unique admissions and that only about 1,000 images were then
  available with de-identification in process. The NIH abstract describes acquiring an AI-ready
  data set from "more than 100,000 critically ill patients," which is a patient count rather than
  the admission count used on the website. The website lists nine data modalities and the webinar
  table enumerates nine data types. The program manager email is printed on the website as
  "cmccrary@mgh.havard.edu". The MIT License statement comes from the chorus-ai GitHub
  organization README and governs software, not the dataset. No DOI, dataset version identifier,
  recommended citation, IRB identifier, consent documentation, distribution file inventory, or
  dataset-level byte size is stated in the available sources.