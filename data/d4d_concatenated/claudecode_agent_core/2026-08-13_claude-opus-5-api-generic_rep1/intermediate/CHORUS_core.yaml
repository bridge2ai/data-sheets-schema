id: https://chorus4ai.org/
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is one of four data generation projects of the NIH Common Fund Bridge2AI consortium
  (award OT2OD032701). Its goal is a publicly available, AI-ready, multi-modal, high-resolution
  critical care dataset drawn from acutely and critically ill patients, together with the
  standards, tooling, ethical framework, and workforce needed to build machine learning and
  artificial intelligence models that improve recovery from acute illness. The collaboration
  spans 20 academic centers, of which 14 contribute as Data Acquisition centers, and includes
  more than 60 consortium members. Data are collected retrospectively from participating
  hospitals and harmonized to shared standards: structured electronic health record data
  (demographics, diagnoses, procedures, medication administration with time-stamped dosing,
  and high-frequency nursing flowsheets) standardized to the OMOP Common Data Model; clinical
  notes extracted and tokenized with the OHNLP toolkit and retained locally except for tokens;
  imaging from PACS in DICOM; bedside monitor and gateway/middleware telemetry waveforms in
  WFDB; and hospital EEG waveforms in EDF+ and Persyst formats. Social determinants of health
  and contextual factors such as geographic distance to the nearest hospital are included as
  data elements. The anticipated final dataset covers 100,000 patient admissions, nine data
  modalities, and 14 contributing hospitals. The currently released dataset comprises 50,000
  patient admissions from ICU, PICU, and NICU settings, 1.6 billion rows of OMOP EHR data,
  7,642 admissions with radiology data, and 23 terabytes of waveform data; a webinar snapshot
  dated August 2025 describes coverage of 14 hospitals and over 45,000 unique admissions, with
  1,000 images then available and de-identification of a larger imaging cohort and EEG
  extraction still in progress. OMOP and telemetry data reside in a cloud enclave. All
  modalities are controlled access. The project also sequesters a holdout test set, separate
  from the distributed data, to support external validation of AI models.
keywords:
  - critical care
  - intensive care unit
  - acute illness
  - electronic health records
  - OMOP Common Data Model
  - waveform data
  - electroencephalography
  - medical imaging
  - clinical notes
