    raw_data_format: Site-native EHR formats, transformed to the OMOP Common Data Model
    access_details: Controlled access; not distributed in raw site-native form.
  - id: https://chorus4ai.org/#raw-notes
    source_description: Unstructured clinical notes documented by providers.
    source_type: Hospital electronic health record systems
    raw_data_format: Free text, extracted and tokenized with the OHNLP toolkit
    access_details: >-
      Clinical notes are stored locally at the contributing site; only tokens are made available.
  - id: https://chorus4ai.org/#raw-imaging
    source_description: Imaging studies retrieved from hospital PACS.
    source_type: Picture archiving and communication systems (PACS)
    raw_data_format: DICOM
    access_details: Controlled access; de-identification in process for the larger cohort.
  - id: https://chorus4ai.org/#raw-telemetry
    source_description: >-
      Continuous physiologic waveform telemetry from bedside monitors, captured through
      gateway/middleware.
    source_type: Bedside monitoring systems
    raw_data_format: WFDB (PhysioNet schema, extended)
    access_details: Controlled access, held in the cloud enclave.
  - id: https://chorus4ai.org/#raw-eeg
    source_description: EEG waveform recordings held in hospital EEG databases.
    source_type: Hospital EEG databases
    raw_data_format: EDF+ and Persyst
    access_details: Controlled access; extraction in process.

preprocessing_strategies:
  - id: https://chorus4ai.org/#preproc-omop
    preprocessing_details: >-
      Standardization of structured EHR data to the OMOP Common Data Model, with OMOP schema
      extensions used for high-frequency nursing flowsheet documentation, supported by validated
      semantic mappings connecting site source formats to international standards.
  - id: https://chorus4ai.org/#preproc-tokenization
    preprocessing_details: >-
      Tokenization of unstructured electronic health record text using the OHNLP toolkit, so that
      tokens rather than note text are shared.
  - id: https://chorus4ai.org/#preproc-reidentification-limiting
    preprocessing_details: >-
      Transformation of data using approaches that limit re-identification, including
      de-identification of imaging prior to release.
  - id: https://chorus4ai.org/#preproc-waveform-conversion
    preprocessing_details: >-
      Conversion of waveform data using the CHoRUS waveform documentation and conversion scripts
      maintained in the chorus_waveform repository.
  - id: https://chorus4ai.org/#preproc-geocoding
    preprocessing_details: >-
      Geocoding of OMOP Location entities via DeGauss (UF-Geocoding repository) to support
      contextual and social determinants of health data elements such as geographic distance to
      the nearest hospital.

cleaning_strategies:
  - id: https://chorus4ai.org/#cleaning-characterization-reports
    cleaning_details: >-
      Characterization reports are produced and returned to contributing sites following their
      data submissions (CHoRUSReports repository), and data extracts are prepared under standard
      operating procedures that have undergone internal validation and review.

labeling_strategies:
  - id: https://chorus4ai.org/#labeling-annotation-environment
    labeling_details: >-
      A visualization and annotation environment is developed to label data with targets
      important for prediction. Clinical collaborators contribute to semantic mapping and
      validation through pooled tabular mappings and an associated clinical validation SOP.
    source_caveats: >-
      The sources do not report annotator numbers, annotations per item, or inter-annotator
      agreement.

machine_annotation_tools:
  - id: https://chorus4ai.org/#tools-machine-annotation
    tools:
      - OHNLP toolkit
      - DeGauss (via UF-Geocoding)
      - privacy_scan_tool
      - CTP-deid
    tool_descriptions: >-
      The OHNLP toolkit extracts and tokenizes clinical notes; DeGauss geocodes OMOP Location
      entities; privacy_scan_tool is a privacy scanning tool for medical records; CTP-deid is a
      de-identification repository within the chorus-ai GitHub organization.
    source_caveats: >-
      Tool accuracy or validation results for these tools are not reported in the available
      sources.

missing_data_documentation:
  - id: https://chorus4ai.org/#missing-modality-availability
    missing_data_patterns: >-
      Modality coverage is uneven and incomplete as of the August 2025 snapshot: imaging was
      limited to about 1,000 images with de-identification in process for a larger cohort, EEG
      extraction was in process, and metadata was listed as planned rather than available for
      clinical notes, imaging, and EEG waveforms.
    handling_strategy: >-
      Modalities are released progressively as extraction, de-identification, and metadata
      publication complete.

known_limitations:
  - id: https://chorus4ai.org/#limitation-coverage
    limitation_type: coverage_limitation
    limitation_description: >-
      The released dataset is a partial realization of the anticipated dataset: imaging is
      available for a subset of admissions, EEG extraction was still in process, and metadata
      for clinical notes, imaging, and EEG was listed as planned rather than published.
    scope_impact: >-
      Analyses requiring complete multi-modal coverage across all admissions cannot yet be
      supported.
  - id: https://chorus4ai.org/#limitation-notes-local
    limitation_type: integration_limitation
    limitation_description: >-
      Clinical notes are stored locally at contributing sites; only tokens are available in the
      enclave, so full note text cannot be analyzed centrally.
  - id: https://chorus4ai.org/#limitation-scope
    limitation_type: scope_limitation
    limitation_description: >-
      The dataset covers admissions to intensive care settings (ICU, PICU, NICU) at 14 hospitals
      participating as Data Acquisition centers within a United States academic consortium.
  - id: https://chorus4ai.org/#limitation-retrospective
    limitation_type: methodological_limitation
    limitation_description: >-
      Data collection is retrospective and derived from routine clinical documentation, so
      variable availability and granularity depend on site documentation practices.

known_biases:
  - id: https://chorus4ai.org/#bias-representation
    bias_type: representation_bias
    bias_description: >-
      The project treats cohort balance and diversity as an explicit risk to be managed:
      patient-focused efforts determine ethical and legal approaches to manage privacy and bias
      while accounting for social determinants of health, and federated access is intended to
      enable sampling methods that ensure a balanced and diverse cohort.
    mitigation_strategy: >-
      Sampling designed to cover comprehensive sets of patient conditions and treatment
      strategies; inclusion of social determinants of health and contextual data elements;
      community-facing ethics focus groups.
    source_caveats: >-
      The sources describe bias mitigation intent and design goals; they do not report a measured
      bias, a demographic audit, or quantitative representativeness results.

confidential_elements:
  - id: https://chorus4ai.org/#confidential-notes
    confidential_elements_present: true
    confidentiality_details: >-
      Clinical notes are treated as confidential and are stored locally at the contributing site;
      only tokenized representations are shared. All nine documented data types are listed as
      controlled access.

sensitive_elements:
  - id: https://chorus4ai.org/#sensitive-phi
    sensitive_elements_present: true
    sensitivity_details: >-
      The dataset comprises hospital records of critically ill patients, including demographics,
      diagnoses, procedures, medication administration, nursing flowsheets, clinical notes,
      imaging, telemetry and EEG waveforms, and social determinants of health with contextual
      geographic factors such as distance to the nearest hospital.

is_deidentified:
  id: https://chorus4ai.org/#deidentification
  identifiable_elements_present: true
  method: >-
    Tokenization of unstructured EHR text using the OHNLP toolkit; local retention of clinical
    notes with only tokens shared; de-identification of imaging prior to release; transformation
    of data using approaches that limit re-identification; supporting tooling includes CTP-deid
    and a privacy scanning tool for medical records.
  deidentification_details: >-
    As of August 2025, de-identification of a larger imaging cohort was in process, with about
    1,000 images then available. Controlled access and cloud-enclave storage of OMOP and
    telemetry data are used alongside these transformations.
  source_caveats: >-
    The sources do not name a formal de-identification standard (for example HIPAA Safe Harbor or
    expert determination) or report residual re-identification risk measurements.

at_risk_populations:
  id: https://chorus4ai.org/#at-risk-populations
  at_risk_groups_included: true
  notes: >-
    The released dataset includes admissions from pediatric (PICU) and neonatal (NICU) intensive
    care units, so minors are represented. The available sources do not describe assent
    procedures, guardian consent, or special protections applied to these groups.

human_subject_research:
  id: https://chorus4ai.org/#human-subject-research
  involves_human_subjects: true
  notes: >-
    The dataset consists of retrospectively collected hospital records of acutely and critically
    ill patients. The available sources do not state IRB approval numbers, the reviewing boards,
    or the regulatory determinations for the data acquisition.

ethical_reviews:
  - id: https://chorus4ai.org/#ethics-pillar
    reviewing_organization: CHoRUS consortium Ethics pillar (Ethical and Trustworthy AI)
    review_details: >-
      Ethics is one of the project's three pillars. The consortium evaluates community
      perspectives on clinical care AI to increase trustworthiness of provenance and privacy,
      analyzes the existing legal and regulatory landscape, establishes a legal framework for
      collecting data at scale, and performs community-facing ethics focus groups to determine
      what data is appropriate for public sharing.

data_protection_impacts:
  - id: https://chorus4ai.org/#dpia-community-review
    impact_details: >-
      Community-facing ethics focus groups are used to determine what data is appropriate for
      public sharing, and the project analyzes the existing legal and regulatory landscape while
      developing methods that promote privacy and accountability. A privacy scanning tool for
      medical records is maintained within the chorus-ai GitHub organization.
    source_caveats: >-
      The sources do not report a formal data protection impact assessment document or its
      findings.

data_governance:
  id: https://chorus4ai.org/#governance
  accountable_organization:
    id: https://chorus4ai.org/#org-chorus-consortium
    name: CHoRUS Consortium
  committee_contact:
    id: https://github.com/chorus-ai#contact-houghtaling
    name: Jared Houghtaling
  access_review_process: >-
    All data types are controlled access. Access requests are directed to dbold@emory.edu or
    jared.houghtaling@tuftsmedicine.org. For the AIM-AHEAD Bridge2AI for Clinical Care training
    program, participants complete a registration form with name, email, and institution, must
    sign a licensing agreement included in the registration form before gaining access, and need
    a ".edu" email address to gain access to the dataset; once access is granted and compute is
    provisioned, an email is sent to the participant. Program administrators assist with access
    where needed, and the access requirement is stated not to be a barrier to acceptance into the
    program.
  stewardship_roles: >-
    Data site managers at contributing sites curate and deliver extracts under validated SOPs;
    project managers track task and site status; software developers maintain the open-source
    tooling; clinical collaborators validate semantic mappings.
  notes: >-
    Program contact listed on the project website: Ciera McCrary, MGH, Program Manager
    (cmccrary@mgh.havard.edu, as printed).

license_and_use_terms:
  id: https://chorus4ai.org/#license-terms
  license_terms: >-
    Dataset access is controlled and conditioned on a signed licensing agreement; in the
    AIM-AHEAD Bridge2AI for Clinical Care training program this agreement is included in the
    registration form and must be signed before access is granted, and access additionally
    requires a ".edu" email address.
  source_caveats: >-
    The specific dataset license instrument is not named in the sources. The MIT License noted in
    the chorus-ai GitHub organization README applies to that project's software repositories, not
    to the clinical dataset; individual repositories also carry Apache-2.0 or MIT licenses.

ip_restrictions:
  id: https://chorus4ai.org/#ip-restrictions
  restrictions: >-
    Software in the chorus-ai GitHub organization is licensed under the MIT License (with some
    repositories under Apache-2.0). Dataset use is governed by a separate signed licensing
    agreement rather than by the software license.

regulatory_restrictions:
  id: https://chorus4ai.org/#regulatory-restrictions
  confidentiality_level: restricted
  regulatory_restrictions: >-
    All nine documented data types are controlled access. The project establishes a legal
    framework for collecting data at scale and analyzes the existing legal and regulatory
    landscape as part of its ethics pillar.
  source_caveats: >-
    No explicit HIPAA, GDPR, or export-control compliance determination for the dataset is stated
    in the sources; HIPAA/GDPR compliance appears only as a topic in the associated training
    curriculum.

distribution_formats:
  - id: https://chorus4ai.org/#dist-omop
    format: >-
      OMOP Common Data Model tables (demographics, diagnoses, procedures, medication
      administration, nursing flowsheets), with OMOP schema extensions for flowsheets; held in
      the cloud enclave under controlled access, with published metadata.
  - id: https://chorus4ai.org/#dist-notes
    format: >-
      Tokenized clinical notes following the OHNLP open source schema; notes themselves remain
      stored locally at contributing sites. Metadata publication planned.
  - id: https://chorus4ai.org/#dist-imaging
    format: >-
      DICOM imaging from PACS, controlled access, following the DICOM schema. Metadata
      publication planned.
  - id: https://chorus4ai.org/#dist-telemetry
    format: >-
      WFDB waveform telemetry following an extended PhysioNet schema, held in the cloud enclave
      under controlled access, with published metadata.
  - id: https://chorus4ai.org/#dist-eeg
    format: >-
      EEG waveforms in EDF+ and Persyst formats following the open source EDF+ and Persyst
      schemas, controlled access. Metadata publication planned.

distribution_dates:
  - id: https://chorus4ai.org/#dist-date-snapshot
    release_dates: >-
      A released dataset was available as of August 2025 (14 hospitals, over 45,000 unique
      admissions), and the project website reports a current released dataset of 50,000
      admissions. The funded project period runs to 2026-11-30.
    source_caveats: >-
      No formal release or version dates are given; the sources report status snapshots rather
      than dated releases.

existing_uses:
  - id: https://chorus4ai.org/#use-training-and-publications
    examples: >-
      The datasets are being used for training activities and publications, including the
      AIM-AHEAD Bridge2AI for Clinical Care Training Program, in which up to 30 trainees per
      cohort use the CHoRUS data and the Bridge2AI AI/ML for Clinical Care Collaborative Cloud
      for hands-on machine learning coursework, use case development, poster presentations, and
      manuscripts.

intended_uses:
  - id: https://chorus4ai.org/#intended-use-model-development
    use_category: Development of ML/AI models for acute and critical care
    examples: >-
      Building machine learning and AI-derived models to characterize acute and critical care
      illness, predict complications and deterioration, measure treatment response, and improve
      care and outcomes of patients requiring critical care.
  - id: https://chorus4ai.org/#intended-use-external-validation
    use_category: External validation of AI models
    examples: >-
      Using the sequestered holdout test set for external validation of models to aid marketplace
      adoption for implementation in acute and critical care.
  - id: https://chorus4ai.org/#intended-use-education
    use_category: Education and workforce development
    usage_notes: >-
      Hands-on training with the CHoRUS dataset supports development of translational AI in
      clinical care, including canonical Jupyter notebooks, the OHDSI tool stack, and the
      OHDSI/OMOP common data model.

other_tasks:
  - id: https://chorus4ai.org/#other-task-sdoh
    task_details: >-
      Because data elements include social determinants of health and contextual factors such as
      geographic distance to the nearest hospital (with OMOP Location entities geocoded via
      DeGauss), the dataset may support analyses of context and equity beyond bedside prediction
      tasks.

future_use_impacts:
  - id: https://chorus4ai.org/#future-impact-adoption
    impact_details: >-
      The holdout test set is intended to aid marketplace adoption of AI-developed models for
      implementation in acute and critical care, and the project aims to catalyze biomedical
      research and expertise promoting the patient-focused deployment of AI.
  - id: https://chorus4ai.org/#future-impact-privacy-bias
    impact_details: >-
      The project frames privacy and bias as the principal risks of future use: patient-focused
      legal and ethical work manages privacy and bias while accounting for social determinants of
      health, data are transformed with approaches that limit re-identification, and community
      ethics focus groups determine what data is appropriate for public sharing.

maintainers:
  - id: https://chorus4ai.org/#maintainer-consortium
    role: academic_institution
    maintainer_details: >-
      The CHoRUS Consortium, coordinated from Massachusetts General Hospital, maintains the
      dataset and its tooling. Program contact: Ciera McCrary, MGH, Program Manager
      (cmccrary@mgh.havard.edu, as printed). Access and data requests: dbold@emory.edu or
      jared.houghtaling@tuftsmedicine.org.
  - id: https://chorus4ai.org/#maintainer-github
    role: other
    maintainer_details: >-
      The chorus-ai GitHub organization (28 repositories, 37 followers as of 2025-11-14) houses
      software and tooling, validated semantic mappings, standard operating procedures, and
      project management overviews. Package versions, maintainers, and other metadata are tracked
      on a package status page, with documentation compiled in the chorus-developer repository.

updates:
  id: https://chorus4ai.org/#update-plan
  update_details: >-
    The dataset is growing toward an anticipated final total of 100,000 patient admissions, nine
    data modalities, and 14 contributing hospitals. Imaging de-identification for a larger cohort
    and EEG extraction were in process as of August 2025, and metadata publication is planned for
    clinical notes, imaging, and EEG waveforms. Contributing sites provide regular status updates
    on their extract creation and curation progress, submitted through the GitHub interface or a
    Google Form that triggers a script updating GitHub status and issue information; these
    statuses feed the Standards Project or the Data Acquisition Project boards.

extension_mechanism:
  id: https://chorus4ai.org/#extension
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Contributions are organized through the chorus-ai GitHub organization: data site managers
    follow the interactive workflow diagram and SOP documents in the Chorus_SOP repository and
    raise issues in the Standards Discussions or Data Acquisition Discussions; clinical
    collaborators contribute semantic mappings through the chorus-mapping repository and its
    clinical validation SOP; software developers contribute open-source tooling documented in the
    chorus-developer repository.

