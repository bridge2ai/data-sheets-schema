purposes:
  - id: https://chorus4ai.org/#purpose-ai-ready-critical-care-data
    response: >-
      Generate data for ML/AI applications aimed at characterizing acute and critical care
      illness, predicting complications, and measuring treatment response among patients with
      acute or critical illness, by developing a publicly available, AI-ready critical care
      dataset from more than 100,000 critically ill patients.
  - id: https://chorus4ai.org/#purpose-trustworthy-methods
    response: >-
      Ensure that the methods used to build the dataset promote privacy, accountability, and
      clinical benefit, including a legal framework for collecting data at scale and
      community-facing ethics focus groups to determine what data is appropriate for public
      sharing.
  - id: https://chorus4ai.org/#purpose-external-validation
    response: >-
      Provision a holdout test set accessible for model external validation, to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - id: https://chorus4ai.org/#purpose-workforce
    response: >-
      Cultivate expertise in the lay and scientific community to improve AI literacy and
      utilization through multimodal educational approaches, training engineers, data
      scientists, and clinicians in AI for clinical care.

addressing_gaps:
  - id: https://chorus4ai.org/#gap-infrastructure
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning in critical care; developing high-resolution multi-center data sets is described
      as a critical first step towards actionable and trustworthy AI.
  - id: https://chorus4ai.org/#gap-diversity-resolution
    response: >-
      Existing resources lack a dataset of the diversity and resolution CHoRUS targets; the
      project aims to acquire and standardize a dataset of unprecedented diversity and high
      resolution across a multi-center network.
  - id: https://chorus4ai.org/#gap-standards-tooling
    response: >-
      Multi-modal EHR, waveform, imaging, and text data are not harmonized across sites; CHoRUS
      develops unified standards, validated semantic mappings, and standard operating procedures
      so contributing sites can deliver interoperable datasets.

