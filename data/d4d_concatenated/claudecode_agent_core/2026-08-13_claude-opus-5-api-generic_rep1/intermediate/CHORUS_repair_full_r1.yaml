  - id: https://chorus4ai.org/#task-treatment-response
    response: Measuring treatment response among patients with acute or critical illness.
  - id: https://chorus4ai.org/#task-external-validation
    response: >-
      External validation of AI/ML models against a sequestered holdout test set.
  - id: https://chorus4ai.org/#task-labeling
    response: >-
      Labeling data with targets important for prediction via a visualization and annotation
      environment.

