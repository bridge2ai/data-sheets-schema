id: https://chorus4ai.org/
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is one of four data generation projects of the NIH Common Fund Bridge2AI consortium
  (award OT2OD032701). Its stated goal is a publicly available, AI-ready, multi-modal,
  high-resolution critical care dataset drawn from acutely and critically ill patients, together
  with the standards, tooling, ethical framework, and workforce needed to build machine learning
  and artificial intelligence models that improve recovery from acute illness. The collaboration
  spans 20 academic centers, of which 14 contribute as Data Acquisition centers, and the project
  website reports more than 60 consortium members across 20 institutions. Data are collected
  retrospectively from participating hospitals and harmonized to shared standards: structured
  electronic health record data (demographics, diagnoses, procedures, medication administration
  with dosing time-stamped at each infusion change or dose administration, and high-frequency
  nursing flowsheets) standardized to the OMOP Common Data Model; clinical notes extracted and
  tokenized with the OHNLP toolkit and retained locally at contributing sites except for tokens;
  imaging from PACS in DICOM; bedside monitor and gateway/middleware telemetry waveforms in WFDB;
  and hospital EEG waveforms in EDF+ and Persyst formats. Social determinants of health and
  contextual factors such as geographic distance to the nearest hospital are included as data
  elements. All nine documented data types are controlled access, and OMOP and telemetry data
  reside in a cloud enclave. The project also sequesters a holdout test set to support external
  validation of AI models. Reported scale differs by source and snapshot date: the project
  website describes an anticipated final dataset of 100,000 patient admissions, 9 data
  modalities, and 14 contributing hospitals, and a current released dataset of 50,000 patient
  admissions from ICU, PICU, and NICU settings, 1.6 billion rows of OMOP EHR data, 7,642
  admissions with radiology data, and 23 Tb of waveform data; a training webinar dated September
  2025 states that as of August 2025 the dataset covered 14 hospitals with over 45,000 unique
  admissions, with 1,000 images then available, de-identification in process for a larger imaging
  cohort, and EEG extraction in process. The NIH project abstract describes acquiring an AI-ready
  data set from more than 100,000 critically ill patients, a patient count rather than an
  admission count.
keywords:
  - critical care
  - acute illness
  - electronic health records
  - OMOP Common Data Model
  - waveform data
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - machine learning
  - artificial intelligence
  - Bridge2AI
  - multimodal data
page: https://chorus4ai.org/
conforms_to: >-
  OMOP Common Data Model (structured EHR: demographics, diagnoses, procedures, medication
  administration, nursing flowsheets, with OMOP schema extensions for flowsheets); DICOM for
  imaging from PACS; WFDB with an extended PhysioNet schema for telemetry waveforms; EDF+ and
  Persyst for EEG waveforms; OHNLP open source schema for extracted and tokenized clinical notes.
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset

