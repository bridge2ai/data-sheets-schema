extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Contributing sites add data by following the interactive Chorus_SOP workflow, which links step by step to
    validated standard operating procedures for extracting and contributing clinical data, and by submitting
    extracts with the chorus-extract-upload tooling. Issues encountered in creating or submitting an extract
    are posted to the Standards or Data Acquisition discussion spaces. Clinical collaborators contribute to
    semantic mapping through the chorus-mapping repository and its clinical validation SOP. Site status
    updates are submitted through the GitHub interface or a Google Form that updates GitHub issues
    automatically.

updates:
  update_details: >-
    The dataset is growing from the currently released 50,000 patient admissions toward an anticipated final
    dataset of 100,000 patient admissions across nine data modalities from 14 contributing hospitals. Imaging
    de-identification for a larger cohort and EEG extraction were in process, and published metadata schemas
    were planned for several modalities. Contributing sites provide regular status updates on progress in
    creating and curating their extracts, tracked in the Standards and Data Acquisition projects.