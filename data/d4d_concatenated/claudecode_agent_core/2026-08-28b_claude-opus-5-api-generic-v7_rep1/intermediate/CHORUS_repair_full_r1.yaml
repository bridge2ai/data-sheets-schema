id: https://chorus4ai.org/#chorus-dataset
name: CHoRUS Dataset
title: "Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards for Equitable AI) is one of
  four data generation projects in the NIH Bridge2AI consortium. It assembles a multicenter, multimodal,
  high-resolution, controlled-access dataset of retrospectively collected clinical data from patients with
  acute and critical illness, contributed by 14 hospitals within a collaboration spanning 20 academic
  centers and more than 60 consortium members. Structured electronic health record data (demographics,
  medication administration recorded at each infusion change or dose administration, provider-documented
  procedures and diagnoses, and high-frequency nursing flowsheets) are standardized to the OMOP Common Data
  Model. Unstructured clinical notes are extracted and tokenized with the OHNLP toolkit and remain stored
  locally at contributing sites except for the tokens. Imaging is drawn from hospital PACS in DICOM;
  telemetry waveforms from bedside monitors and gateway/middleware are held in WFDB; and EEG waveforms from
  hospital databases are held in EDF+ and Persyst formats. The currently released dataset comprises 50,000
  patient admissions from ICU, PICU and NICU settings, 1.6 billion rows of EHR OMOP data, 7,642 admissions
  with radiology data and 23 Tb of waveform data; the anticipated final dataset is 100,000 patient
  admissions across nine data modalities. OMOP and telemetry data are held in a cloud enclave, access to
  every data type is controlled, and a holdout test set is sequestered for external validation of models.
status: >-
  Partially released and expanding. A released dataset covering 14 hospitals was in place as of August 2025,
  with imaging de-identification and EEG extraction still in process toward the anticipated final dataset.
page: https://chorus4ai.org/
is_tabular: false
conforms_to: >-
  Structured electronic health record data are standardized to the OMOP Common Data Model (with extensions
  for nursing flowsheets); tokenized clinical notes follow the open-source OHNLP schema; imaging follows the
  DICOM schema; telemetry waveforms follow WFDB with the PhysioNet schema extended; EEG waveforms follow the
  open-source EDF+ and Persyst schemas.
conforms_to_standard:
- OMOP_CDM
- DICOM
- WFDB
- OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset
keywords:
- critical care
- critical illness
- acute care
- artificial intelligence
- machine learning
- electronic health record
- OMOP Common Data Model
- waveform telemetry
- electroencephalography
- medical imaging
- social determinants of health
- Bridge2AI
source_caveats: >-
  The sources disagree on the size of the released dataset. The project documentation at chorus4ai.org
  (tier 2) states a current released dataset of 50,000 patient admissions from ICU, PICU and NICU, with an
  anticipated final dataset of 100,000 patient admissions; the cohort_2_webinar (tier 4) states that, as of
  August 2025, the dataset covered 14 different hospitals with over 45K unique admissions; the NIH RePORTER
  abstract (tier 4) describes acquiring an AI-ready data set from more than 100,000 critically ill patients
  as the project target. The higher-ranked project documentation figures are used in this record and the
  lower-ranked figures are recorded alongside them. All sources agree on 14 data-contributing hospitals. The
  bundle states no DOI, no recommended citation, no dataset version identifier, no IRB determination and no
  human-subjects determination for the dataset itself. The dataset identifier above is a fragment minted on
  the project website URL, which is the only persistent locator the bundle supplies; the bare website URL is
  recorded separately as the landing page. At the time of capture the project website carried a banner
  reading "This repoitory is under review for potential modification in compliance with Administration
  directives." (spelling as in the source), so the described release state may change.

