purposes:
- response: >-
    To generate data for machine learning and artificial intelligence applications aimed at characterizing
    acute and critical care illness, predicting complications, and measuring treatment response among
    patients with acute or critical illness.
- response: >-
    To develop a publicly available, AI-ready critical care dataset while ensuring that the methods promote
    privacy, accountability and clinical benefit.
- response: >-
    To provision a holdout test set, accessible for model external validation, to aid marketplace adoption
    of AI-developed models for implementation in acute and critical care.
- response: >-
    To create ethically sourced datasets and tools around artificial intelligence and to create best
    practices for AI in health, as one of four data generation projects in the NIH Bridge2AI consortium.
- response: >-
    To develop the network, tools, standards, data and education needed to build machine learning and
    artificial intelligence models that improve the care and outcomes of patients requiring critical care,
    and to cultivate AI literacy in the lay and scientific community.

addressing_gaps:
- response: >-
    There is an urgent need for infrastructure to support artificial intelligence and machine learning in
    critical care; developing high-resolution multi-center data sets is a critical first step towards
    actionable and trustworthy AI.
- response: >-
    Existing resources lack a diverse, high-resolution, ethically sourced, AI-ready data set able to address
    the grand challenge of improving recovery from acute illness.
- response: >-
    Legal and ethical frameworks for collecting critical care data at scale, and for determining which data
    are appropriate for public sharing, were not established; the project establishes a legal framework and
    performs community-facing ethics work to close that gap.

tasks:
- response: Characterizing acute and critical care illness from multimodal clinical data.
- response: Predicting complications and clinical deterioration among patients with acute or critical illness.
- response: Measuring treatment response among patients with acute or critical illness.
- response: >-
    External validation of AI/ML models against a sequestered holdout test set, to support marketplace
    adoption of models for implementation in acute and critical care.
- response: >-
    Labeling data with targets important for prediction, using a visualization and annotation environment.

