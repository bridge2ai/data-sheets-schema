data_governance:
  committee_name: AI-READI Consortium
  access_review_process: 'Accessing the dataset requires several steps: logging in through
    a verified ID system, agreeing to use the data only for type 2 diabetes related research,
    and agreeing to the license terms, which set certain restrictions and obligations for
    data usage. Access conditions are published at https://fairhub.io/datasets/3/access. The
    full dataset is accessible by entering into a data use agreement; requirements for the
    controlled-access dataset were being developed by the AI-READI Data Access Committee,
    and use by scientists is contingent on their institutions completing legal and privacy
    use agreements with the AI-READI research programme.'
is_deidentified:
  identifiable_elements_present: false
  method: No active de-identification was applied because no direct identifiers were collected;
    the data were then checked to confirm that no identifiable data as defined by US HIPAA
    were present.
  identifiers_removed: Protected health information as defined by the HIPAA Privacy Rule;
    in addition, sex, race/ethnicity and medication information were removed from the public
    release.
  deidentification_details: The FAIRhub dataset description records the de-identification
    level as NoDeIdentification with direct-identifier and HIPAA checks applied and no date
    shifting, non-arrangement or k-anonymity transformations. The RO-Crate metadata records
    the release as deidentified.
  source_caveats: The FAIRhub dataset description (tier 1) states that no identifiers were
    collected so no active de-identification was necessary, while the Nature Metabolism comment
    (tier 3) states that the public set is stripped of Protected Health Information via the
    HIPAA Safe Harbor method. The higher-ranked FAIRhub statement is given here; the Safe
    Harbor description is recorded in this caveat.
