title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: Version 3.0.0 of the flagship, ethically sourced multimodal dataset generated
  by the AI-READI project (the Bridge2AI Salutogenesis Grand Challenge), one of four Data
  Generation Projects funded by the NIH Common Fund Bridge2AI program. The dataset holds data
  from 2,280 participants with and without type 2 diabetes mellitus (T2DM), collected between
  19 July 2023 and 1 May 2025 and harmonized across three US data collection sites (University
  of Alabama at Birmingham; University of California, San Diego; University of Washington).
  Recruitment sampling aimed at an approximately equal distribution of participants across
  diabetes severity, and the acquisition protocol spans multiple domains so as to support
  downstream AI/ML analyses that are not feasible with claims or electronic health record
  data alone. Modalities include survey and clinical data mapped to the OMOP Common Data Model,
  12-lead electrocardiography in WFDB format, retinal photography, optical coherence tomography,
  optical coherence tomography angiography and fluorescence lifetime imaging ophthalmoscopy
  in DICOM, continuous glucose monitoring and wearable activity monitoring in Open mHealth,
  and indoor environmental sensor readings. The release comprises 356,343 files totalling
  approximately 3.82 TB, organized following the Clinical Dataset Structure (CDS) v0.1.1.
  The public release contains no protected health information; information on sex, race/ethnicity
  and medications used is withheld and available only through a controlled-access version.
  The scientific goal is to better understand salutogenesis, the pathway from disease to health,
  in T2DM. The study principal investigator of record is Aaron Lee.
notes: 'Equipment support acknowledged by the project: Topcon Corporation (Tokyo, Japan),
  Optomed (Oulu, Finland), iCare World (Raleigh, NC) and Carl Zeiss (Oberkochen, Germany)
  loaned their devices for research purposes at no cost, and Heidelberg Engineering (Heidelberg,
  Germany), Dexcom (San Diego, CA) and Garmin (Olathe, KS) provided research discounts on
  study devices; the Microsoft AI for Good Lab supported the cloud services needed for the
  project. The AI-READI documentation site and the FAIRhub dataset pages both carry the statement,
  as captured in the source material, that "This repository is under review for potential
  modification in compliance with Administration directives."'
source_caveats: 'Several disagreements exist within the declared bundle and are resolved here
  by the source ranking. (1) Publisher: the FAIRhub dataset description records publisherName
  "FAIRhub" while the RO-Crate records publisher "AI-READI Consortium"; both are tier-1 sources,
  so neither settles the other. The FAIRhub value is used because it names the distributing
  platform in the dataset description metadata, and the RO-Crate value is recorded here. (2)
  Institutional attribution: the FAIRhub study description gives the managing organization,
  lead sponsor and the principal investigator''s affiliation as Washington University in St.
  Louis (ROR 01yc7t268), and the license names Washington University in St. Louis as Licensor,
  while the RO-Crate gives the principal investigator as "Aaron Lee, Department of Ophthalmology,
  University of Washington", the IRB address and contact are the University of Washington
  Human Subjects Division in Seattle, and the NIH RePORTER record gives the awardee organization
  as University of Washington. Both institution names appear in tier-1 sources and are not
  reconciled in the bundle. (3) Enrollment start: FAIRhub gives 2023-07-19 while the BMJ Open
  protocol gives 18 July 2023; the FAIRhub date is used. (4) De-identification: FAIRhub records
  "NoDeIdentification" on the grounds that no identifiers were collected, while the Nature
  Metabolism comment describes the public set as stripped of PHI via the HIPAA Safe Harbor
  method; the FAIRhub statement is preferred as the higher-ranked source. (5) Sampling: the
  healthsheet answers that the dataset contains all possible instances and records the sampling-strategy
  question as not applicable, while the registered study description records "Non-Probability
  Sample" and the protocol describes stratified wave-based recruitment. (6) Target enrollment:
  4,000 participants in FAIRhub, the Nature comment and the BMJ protocol, against 4,600 in
  the IRB protocol application narrative and "4,000+" in the NIH RePORTER abstract; 4,000
  is used. (7) The IRB protocol application states that the dataset "will be publicly available
  with a commercial-friendly open-source license", whereas the released dataset carries a
  bespoke, non-open license (AI-READI Data License Agreement v2.0) with substantial restrictions;
  the license document itself governs. (8) The healthsheet describes version 3.0.0 as containing
  data collected "up through the end of the second year of the study" while the README change
  table labels the additional 1,213 participants as "year 3 data"; the collection window of
  19 July 2023 to 1 May 2025 is consistent across both. (9) The three site-level ROR identifiers,
  ORCID identifiers and other registry identifiers present in the FAIRhub API record are not
  carried in this datasheet''s identifier slots because Person and Organization objects are
  not emitted here; the affiliations they name are given in prose.'
