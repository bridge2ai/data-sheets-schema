- sensitive_elements_present: false
  sensitivity_details: The public dataset does not contain data considered sensitive. Protected
    health information is absent, and information related to the sex and race/ethnicity of
    participants, as well as medications used, has been removed.
- sensitive_elements_present: true
  sensitivity_details: The controlled-access dataset contains data regarding racial and ethnic
    origins, location as a five-digit ZIP code, genetic sequencing data, past health records,
    medications, and motor vehicle traffic and accident reports.
acquisition_methods:
- was_directly_observed: true
  was_inferred_derived: false
  acquisition_details: Directly observable data include clinical laboratory tests on blood
    and urine, vital signs and physical measurements, 12-lead electrocardiography, retinal
    imaging, visual function testing, cognitive screening, monofilament testing, continuous
    glucose monitor readings, wearable activity monitor readings and indoor environmental
    sensor readings.
- was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: Self-reported data include the screening questionnaire, demographic
    information, depression, diabetes distress and diabetes self-care instruments, dietary
    assessment, ophthalmic survey, substance use history, general health history, social determinants
    of health surveys and the current medication list. Verification of data entry was performed
    where possible, for example by cross-referencing entered medications against medications
    that were physically brought in or photographed by each study participant.
collection_mechanisms:
- mechanism_details: REDCap electronic data capture was used for participant-reported questionnaire
    data and for clinical data from the visit including the medications assessment, vitals,
    visual acuity, contrast sensitivity, monofilament test results and complete blood count
    results.
- mechanism_details: Twelve-lead electrocardiography using a Philips PageWriter TC30 Cardiograph
    (Amsterdam, The Netherlands), performed with the participant in a reclining chair or supine,
    with the recline position recorded relative to supine; exported as .xml.
- mechanism_details: Undilated colour fundus photography using the Optomed Aurora IQ (Optomed,
    Oulu, Finland), a handheld non-mydriatic fundus camera with a 50-degree field of view
    and a 5 Mpix sensor, producing four images per participant in DICOM.
- mechanism_details: Dilated widefield colour, autofluorescence and infrared fundus imaging
    using the iCare EIDON widefield TrueColor confocal fundus system (iCare USA, Raleigh,
    North Carolina), operated in fully automated mode, producing twelve images per participant
    in DICOM.
- mechanism_details: Optical coherence tomography and OCT angiography using the Heidelberg
    Spectralis HRA (Heidelberg Engineering GmbH, Heidelberg, Germany) with optic nerve head
    radial circle high-resolution, posterior pole macula 61-line and 20x20 macula OCTA protocols,
    producing six acquisitions per participant in DICOM.
- mechanism_details: Optical coherence tomography and OCT angiography using the Topcon Maestro2
    3D OCT-1 (Topcon Healthcare, Tokyo, Japan), a robotic OCT and colour fundus camera acquiring
    12x9 widefield OCT, 6x6 3D macula OCT and 6x6 macula OCTA; exported as .fda and converted
    to DICOM for the dataset.
- mechanism_details: Swept-source optical coherence tomography and OCT angiography using the
    Topcon Triton DRI OCT (Topcon Healthcare, Tokyo, Japan) with a 1,050 nm light source and
    non-mydriatic colour fundus camera, acquiring 12x9x6 mm 3D horizontal and radial scans
    and 6x6 and 12x12 mm OCTA; exported as .fda and converted to DICOM for the dataset.
- mechanism_details: Optical coherence tomography and OCT angiography using the Zeiss Cirrus
    5000 AngioPlex (Carl Zeiss Meditec AG, Jena, Germany) with 200x200 disc cube, 512x128
    macula cube, and 6x6 macula and disc OCTA protocols, producing eight acquisitions per
    participant in DICOM.
- mechanism_details: Fluorescence lifetime imaging ophthalmoscopy using the Heidelberg FLIO
    (Heidelberg Engineering GmbH, Heidelberg, Germany), macula-centred, recording photon arrival
    times in a short (498-560 nm) and a long (560-720 nm) spectral channel; exported as .sdt
    and converted to DICOM for the dataset.
- mechanism_details: Continuous glucose monitoring using the Dexcom G6 (Dexcom, Inc., San
    Diego, California), a real-time integrated continuous glucose monitoring system worn continuously
    for ten days, recording blood glucose every five minutes; participants were masked to
    the results during the monitoring period.
- mechanism_details: Wearable physical activity monitoring using the Garmin Vivosmart 5 (Garmin
    Ltd), worn on the wrist for ten consecutive days at a 5-second sampling frequency, recording
    steps, heart rate, respiratory rate, oxygen saturation, stress and sleep; participants
    returned a form recording which wrist was used and their dominant hand.
- mechanism_details: Indoor environmental monitoring using the LeeLab Anura, a custom-designed
    sensor unit built at the Karalis Johnson Retina Center, University of Washington, placed
    in a frequently used area of the participant's home for ten days and recording ambient
    temperature, relative humidity, nitrogen oxides, volatile organic compounds, particulate
    matter (PM1.0, PM2.5, PM4, PM10) and eleven multi-spectral light intensity measurements.
- mechanism_details: Cognitive screening using the Montreal Cognitive Assessment administered
    electronically on an iPad with the MoCA Duo application (MoCA Cognition, Quebec, Canada);
    the total score, section subscores, Memory Index Score and task completion times were
    exported as .csv.
- mechanism_details: Peripheral neuropathy assessment using a 10 g monofilament applied to
    three locations on the plantar surface of each foot, ten times per location, with the
    participant's eyes closed and responding yes or no; insensate areas were retested for
    confirmation and results were recorded directly into REDCap.
- mechanism_details: Visual acuity testing using the M&S Technologies Electronic Visual Acuity
    tester (Niles, Illinois) at 4 metres under best-corrected photopic conditions and under
    mesopic conditions created with a 2.0 neutral density filter, expressed as logMAR.
- mechanism_details: Letter contrast sensitivity testing using the Mars chart (Mars Perceptrix,
    Chappaqua, New York), conducted monocularly under photopic conditions and under mesopic
    conditions with a neutral density occluder, expressed as log contrast sensitivity.
- mechanism_details: Autorefraction using the Topcon KR 800 auto keratometer/refractor (Topcon
    Healthcare), recording spherical and cylindrical components in dioptres with cylindrical
    axis for each eye.
- mechanism_details: Blood pressure and heart rate measurement with automatic oscillometric
    devices, measured twice two minutes apart; devices used across sites were the OMRON HEM
    907XL, the Medline MDS4001 Automatic Digital Blood Pressure Monitor, and the Welch Allyn
    6000 series vital signs monitor with FlexiPort reusable cuff.
- mechanism_details: 'Clinical laboratory testing of non-fasting blood and urine collected
    at the visit: Clinical Laboratory Improvement Amendments-certified laboratories local
    to each site performed complete blood counts on fresh whole blood, and all other assays
    were performed by the University of Washington Nutrition and Obesity Research Center on
    stored frozen samples batch-shipped on dry ice approximately quarterly; results were provided
    in .csv.'
collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: 'The data collection window covered by version 3.0.0 of the dataset.
    Preliminary pilot enrolment occurred between mid-July 2023 and 30 November 2023 in order
    to secure sufficient familiarity for all coordinators, and the formal data collection
    process began on 1 December 2023. Enrolment for the wider study was planned to continue
    until 30 November 2026, with a project timeline spanning four years: one year for protocol
    development and training and years two to four for subject recruitment and data collection.'
  source_caveats: The FAIRhub metadata gives the collection period as 2023-07-19 to 2025-05-01,
    while the BMJ Open protocol states that enrolment began on 18 July 2023. The higher-ranked
    FAIRhub date is used.
data_collectors:
- role: Clinical research coordinator
  collector_details: Clinical research coordinators contacted and consented research participants,
    ushered them through the research visit, conducted study visits including collection of
    ophthalmic images, and provided training on study procedures such as continuous glucose
    monitoring and the fitness tracker, ensuring return of all study materials. All research
    personnel at the three data sites who recruited, enrolled and collected data underwent
    training by the data manager at the University of Alabama at Birmingham and worked from
    a detailed Manual of Procedures. A certification process was required, including mandatory
    institutional compliance training for human subject research and successful administration
    of all protocol elements to at least three volunteer practice subjects.
- role: Data manager
  collector_details: Data managers at each site oversaw the enrollment and testing process,
    examined flagged participant records during quality control, and were responsible for
    the quality control of all data before uploading to FAIRhub. A database manager ingested
    data into the REDCap database and extracted it for processing.
- role: Laboratory and technical staff
  collector_details: Phlebotomists were responsible for blood collection from research participants
    and laboratory assistants for processing and shipping samples; research and data scientists
    processed data for release and developed standards, supported by software and cloud engineers
    responsible for the data curation pipelines and cloud infrastructure.
missing_data_documentation:
- missing_data_patterns: Not all modalities are available for all participants; missingness
    is at the level of whole modalities for a participant as well as at the level of individual
    survey items.
  missing_data_causes: Some participants elected not to participate in some study elements.
    In a few cases the data collection device did not have any stored results or was returned
    too late to retrieve the results, for example because the battery died or the data were
    lost, and in a few cases a data collision occurred at some point in the process and data
    were lost. Skipped questions and incomplete responses are expected in survey data, and
    imaging modalities were sometimes skipped because of quality problems during acquisition.
  handling_strategy: Missing data that could be directly filled from other portions of an
    individual's record were identified and completed during quality control at the sites.
    No imputation was applied and no instances were excluded from the dataset at the time
    of preprocessing.
sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  source_data: All patients aged 40 years and older who had a medical encounter within one
    of the three health system sites (University of Alabama at Birmingham, University of California
    San Diego, University of Washington).
  strategies: Non-probability sampling. Participants were recruited in waves; the composition
    and size of each wave were influenced by the observed participation characteristics of
    race/ethnicity, gender, severity of T2DM and site according to health records, and the
    composition of participants was monitored and adjusted by under- and oversampling groups
    as needed. Patients with T2DM and pre-diabetes were identified by screening electronic
    health records for ICD-10 diagnosis codes E11.X and R73.09 respectively.
  why_not_representative: The cohort is deliberately triple-balanced by recruiting four race/ethnic
    groups, four categories of T2DM severity, and biological males and females in equal proportions,
    rather than targeting the demographic distribution of the US population, because building
    balanced datasets is critical for the development of unbiased machine learning models.
  source_caveats: The healthsheet answers that the dataset contains all possible instances
    and records the sampling strategy question as not applicable, while the registered study
    description records the sampling method as "Non-Probability Sample" and the protocol describes
    wave-based stratified recruitment. Both readings are within the higher-ranked sources;
    the wave-based non-probability description is given here and the healthsheet reading is
    that the release withholds no enrolled participant.
raw_sources:
- raw_data_details: The raw data are saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but are not anticipated to be shared outside
    the project team at present, because they have not been mapped to standardized terminologies
    and because the raw data may accidentally include personal health information or personally
    identifiable information, for example in free text fields. There is a possibility that
    raw data may be included in future releases of the controlled-access dataset. Device-native
    raw formats include .xml for the ECG, .csv for the MoCA Duo application and the continuous
    glucose monitor and environmental sensor, .FIT for the Garmin fitness tracker, and .fda
    and .sdt for certain retinal imaging devices.
preprocessing_strategies:
- preprocessing_details: Once data were sent from each of the study sites to the central project
    team, all data were mapped to standardized terminologies where possible, including the
    Observational Medical Outcomes Partnership (OMOP) Common Data Model for observational
    and clinical data and Digital Imaging and Communications in Medicine (DICOM) for medical
    imaging data.
- preprocessing_details: 'Images exported from imaging devices in proprietary raw formats
    were converted for the dataset: Topcon Maestro2 and Triton .fda files and Heidelberg FLIO
    .sdt files were converted to DICOM.'
- preprocessing_details: Garmin Vivosmart 5 data exported in .FIT format were converted to
    the Open mHealth standard for the dataset, as were the Dexcom G6 continuous glucose monitoring
    data.
- preprocessing_details: 'The release is organized following the Clinical Dataset Structure
    (CDS) v0.1.1: at the root level one directory per datatype, within each datatype one directory
    per modality, within each modality one directory per device, and within each device one
    directory per participant named after the participant''s study ID number. Each datatype
    directory carries a manifest.tsv metadata file, and the dataset root carries CHANGELOG.md,
    dataset_description.json, dataset_structure_description.json, healthsheet.md, LICENSE.txt,
    participants.json, participants.tsv, README.md and study_description.json.'
- preprocessing_details: Data are stored and shared through FAIRhub as "AI-ready", which is
    intended to enable immediate AI/ML research without reformatting and preprocessing. Processing
    for this version was described as a mix of automated and custom steps, in contrast to
    the custom and ad hoc processing used for version 1.0.0.
cleaning_strategies:
- cleaning_details: Several quality control measures were used at the time of data entry and
    acquisition. Clinical data outside expected minimum and maximum ranges were flagged in
    REDCap and appeared in reports viewed by clinical research coordinators and data managers,
    who examined participant records and determined whether an error was likely. Data were
    checked for credibility against prespecified reasonable ranges, incorrect flow through
    prescribed skip patterns, missing data that could be directly filled from other portions
    of an individual's record, and the omission or duplication of records.
- cleaning_details: Editing was done only under the guidance and approval of the site principal
    investigator. Where corrected data were available elsewhere in the respondent's answers
    the error was corrected; where there was no logical or appropriate way to correct the
    data, the site principal investigator reviewed the values and decided whether they should
    be removed from the data.
- cleaning_details: The data manager at each data site was responsible for the quality control
    of all data before uploading to FAIRhub, and the dataset was reviewed internally by AI-READI
    team members for quality checks and to ensure that no personally identifiable information
    was accidentally included. The dataset has not undergone any formal external audit.
future_use_impacts:
- impact_details: To the extent of the creators' knowledge, no uses of the dataset are currently
    anticipated that could result in unfair treatment of individuals or groups or other undesirable
    harms; however, there is a theoretical risk of future re-identification, which the license
    terms, the dissemination system and data watermarking are intended to deter.
- impact_details: Because sex, race and ethnicity are not released with the public version
    of the dataset, users cannot directly audit derived models for disparities across these
    groups. To mitigate this, the project supplies a recommended train/validation/test split
    in which the validation and test sets are balanced as far as possible for sex, race/ethnicity
    and diabetes status, aimed at reducing disparities in models developed using the dataset.
- impact_details: The dataset creators state that they do not have formal guidelines in place
    for future researchers who wish to create new labels or define new tasks on the dataset,
    so downstream label definitions will vary between users and results may not be directly
    comparable.
intended_uses:
- use_category: Artificial intelligence and machine learning research on type 2 diabetes
  examples:
  - Development of multimodal AI/ML models to study T2DM pathogenesis and salutogenesis using
    balanced, harmonized data spanning survey, clinical, imaging, waveform, wearable and environmental
    modalities.
  usage_notes: The public version of the dataset may be used only for type 2 diabetes related
    research; a controlled-access version allows more generic use under a data use agreement.
- use_category: Pseudotime manifold analysis of disease trajectory
  examples:
  - Reconstructing a temporal atlas of T2DM development and reversal towards health from cross-sectional
    multimodal data spanning participants with differing disease severity, from normal to
    insulin-dependent T2DM.
- use_category: Pipeline and tooling development
  examples:
  - A smaller mini-subset version of the dataset is published alongside the full release for
    pipeline development, so that tooling can be built and tested without transferring the
    full 3.82 TB.
prohibited_uses:
- prohibition_reason: Licensees shall not make clinical treatment decisions based on the data,
    as it is intended solely as a research resource.
- prohibition_reason: Licensees shall not use or attempt to use the data, alone or in concert
    with other information, to compromise or otherwise infringe the confidentiality of information
    about a data subject, to invade or compromise the privacy of any data subject, to attempt
    to identify or contact any data subject or group of data subjects, to extract or extrapolate
    identifying information about a data subject, to establish a data subject's membership
    in a particular group of persons, or otherwise to cause harm or injury to any data subject.
- prohibition_reason: Licensees shall not share or distribute the data with any third-party
    model vendor or developer for training or development purposes, including model weight
    modification and other adjustments to a model's logic or operation, even where that vendor
    is a party to a HIPAA business associate agreement with the licensee's institution. Short-term
    interaction such as prompting or querying a third-party model under such an agreement
    to analyze the data is permitted.
- prohibition_reason: Licensees shall not transfer, license, sublicense, sell, assign, display,
    share or otherwise convey any portion of the data or any derivative work to any third
    party other than another licensee bound by an agreement on terms identical to the AI-READI
    Data License Agreement.
- prohibition_reason: Data may not be reproduced in papers, articles, presentations, analyses,
    reports or publications except that small representative samples may be reproduced in
    up to five images or figures per paper for illustrative purposes; larger amounts may not
    be published, posted or otherwise made available via supplemental files, zip archives,
    code packages or other means, notwithstanding journal or conference requirements.
- prohibition_reason: Licensees shall take no action to remove, obscure, alter or mask the
    static watermarking that may be applied to the data to identify the licensee for security
    purposes.
distribution_formats:
- format: DICOM
  media_type: application/dicom
  notes: Used for all retinal photography, OCT, OCTA and FLIO data files.
- format: CSV
  media_type: text/csv
  notes: Used for the clinical data directory, where each CSV file is a one-to-one mapping
    to an OMOP Common Data Model table, and for environmental sensor readings.
- format: JSON
  media_type: application/json
  notes: Used for the Open mHealth wearable activity monitor and continuous glucose monitoring
    files and for the CDS metadata files.
- format: Markdown
  media_type: text/markdown
  notes: Used for the README, CHANGELOG and healthsheet metadata files at the dataset root.
