maintainers:
- role: academic_institution
  maintainer_details: The AI-READI team supports and maintains the dataset, which is hosted
    on FAIRhub through Microsoft Azure. Contact information is provided in the README file
    included with the dataset, through https://aireadi.org/contact, and at https://docs.aireadi.org/docs/3/contact.
- role: academic_institution
  maintainer_details: Washington University in St. Louis is recorded as the managing organization
    of the dataset and as the Licensor of the AI-READI Data License Agreement, and as lead
    sponsor of the study.
updates:
  frequency: Approximately annually
  update_details: The dataset is released as static versions and is not updated in place;
    rather, new versions are released with additional instances as more study participants
    complete the study visit. There are plans to release new versions approximately once a
    year with additional data from participants enrolled since the last release. Changes between
    versions are recorded in detail in the CHANGELOG file included in the dataset and visible
    at docs.aireadi.org. In this version the Snellen visual acuity variables were dropped,
    so that only logMAR visual acuity measurements are available, and three additional imaging
    devices had been added across the year 2 and year 3 data relative to the pilot.
retention_limit:
  retention_details: There are no limits on the retention of the data associated with the
    instances; participants were not told that their data would be retained for a fixed period
    and then deleted.
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - Version 1.0.0 (DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants); version
    2.0.0 (DOI 10.60775/fairhub.2, released 8 November 2024, 1,067 participants, 165,051 files,
    2.01 TB); version 3.0.0 (DOI 10.60775/fairhub.3, released 17 November 2025, 2,280 participants,
    356,343 files, 3.82 TB).
  version_details: Each version has its own DOI on FAIRhub and its own documentation set,
    selectable from the version dropdown at https://docs.aireadi.org. Version 2.0.0 is marked
    on FAIRhub as no longer accessible. Older versions are not updated; new versions are released
    instead. A separate datasheet exists for each earlier version, at https://docs.aireadi.org/docs/1/dataset/healthsheet
    and https://docs.aireadi.org/docs/2/dataset/healthsheet.
ethical_reviews:
- reviewing_organization: Institutional Review Board of the University of Washington
  review_details: Approved under protocol STUDY00016228, with initial approval received on
    20 December 2022 and reliance agreements with the Institutional Review Boards of the University
    of Alabama at Birmingham and the University of California, San Diego. An annual renewal
    application to the IRB about the status and progress of the study is required and due
    within 90 days of expiration. The registered study record gives the human subject review
    status as "Submitted, approved". The contact of record is the University of Washington
    Human Subjects Division IRB Reliance Team at hsdrely@uw.edu.
  source_caveats: The RO-Crate metadata names the reviewing board "Washington University IRB"
    while giving a University of Washington Human Subjects Division address in Seattle and
    the uw.edu reliance contact; the IRB protocol application and the BMJ Open protocol both
    place review at the University of Washington IRB. The University of Washington reading
    is used here.
- review_details: Ethical review of the release was recorded in the RO-Crate metadata as provided
    by Camille Nebeker, Debra Mathews, Kadija Ferryman and Nicholas Evans. Ethical, legal
    and social implications were considered at every stage of the project cycle, with guidance
    from bioethicists.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - STUDY00016228
  ethics_review_board: University of Washington Human Subjects Division Institutional Review
    Board, IRB Reliance Team, hsdrely@uw.edu.
  regulatory_compliance:
  - The registered study record states that the study is not FDA-regulated for either drug
    or device and has no Data Monitoring Committee. Licensees of the dataset must comply with
    the data security and privacy standards established by the US National Institutes of Health
    under its Genomic Data Sharing Policy.
  special_populations:
  - Enrollment was restricted to adults aged 40 to 85 who could provide consent; pregnant
    people, people with gestational diabetes and people with type 1 diabetes were excluded,
    and healthy volunteers were not enrolled outside the defined no-diabetes study group.
informed_consent:
- consent_obtained: true
  consent_type: Written informed consent from each participant, obtained either electronically
    before the visit or in person at the start of the visit.
  consent_scope: The consent supports research use of the collected data and biospecimens.
    The FAIRhub consent record classifies the consent as ConsentSpecifiedNotElsewhereCategorised,
    with the public version of the dataset usable only for type 2 diabetes related research
    and a private version allowing more generic use.
  consent_documentation: The approved consent form for the principal project site, the University
    of Washington, is published at https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
    The other clinical sites operated under IRB reliance and used the same consent form with
    minor institution-specific language.
at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - No minors were enrolled, as eligibility required an age of at least 40 years. Pregnancy
    and gestational diabetes were exclusion criteria, so pregnant participants were not enrolled.
    All participants were required to be able to provide consent for themselves.
license_and_use_terms:
  data_use_permission: disease_specific_research
