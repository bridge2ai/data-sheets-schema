purposes:
- response: To create and publicly share a flagship, ethically sourced, AI-ready multimodal
    dataset on type 2 diabetes mellitus that enables future generations of artificial intelligence
    and machine learning research to provide critical insights into T2DM, including salutogenic
    pathways to return to health.
- response: To develop a foundational dataset in T2DM that is agnostic to existing classification
    criteria or biases and can be used to reconstruct a temporal atlas of T2DM development
    and reversal towards health.
- response: 'To establish and share a blueprint for future data generation projects: standards,
    best practices and guidelines for the collection, preparation and sharing of AI-ready
    clinical research datasets following the Findable, Accessible, Interoperable, Reusable
    (FAIR) principles.'
tasks:
- response: Downstream pseudotime manifold analysis, an approach used to predict disease trajectories
    by collecting and learning from complex multimodal data from participants with differing
    disease severity, from normal to insulin-dependent T2DM.
- response: Multimodal artificial intelligence and machine learning model development across
    tabular, imaging and physiological signal/waveform modalities collected under a single
    harmonized protocol.
addressing_gaps:
- response: The ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality, large and inclusive
    multimodal datasets; a major barrier has been the lack of diverse datasets that are AI
    ready for training AI models.
- response: Many existing large datasets for AI/ML training lack demographic balance. A meta-epidemiological
    review of T2DM studies published from 2000 to 2020 found that samples lacked racial and
    ethnic diversity, so the AI-READI cohort was designed to be balanced in race/ethnicity,
    T2DM severity and biological sex rather than matching the demographic distribution of
    the US population.
- response: Current understanding of T2DM, especially in the context of salutogenesis, is
    limited; the dataset is intended to fill the gap in data ready for training AI models
    on that question.
funders:
- grantor: National Institutes of Health
  notes: 'Supported through the NIH Common Fund Bridge2AI program under award OT2OD032644,
    "Bridge2AI: Salutogenesis Data Generation Project" (application 1OT2OD032644-01), with
    an award amount of USD 5,026,499 for fiscal year 2022 and a project period of 1 September
    2022 to 31 August 2025. The protocol publication additionally credits NIH grants P30DK035816
    and UL1TR003096.'
- grantor: Research to Prevent Blindness
  notes: Named alongside the NIH grants as a supporter of the research in the protocol publication.
instances:
- instance_type: Individual study participant
  counts: 2280
  data_topic: B2AI_TOPIC:43
  label: false
  notes: Each instance consists of all data available for an individual participating in the
    study. There is currently only one study visit per participant. No explicit label or target
    is associated with an instance; the dataset is hypothesis agnostic and no labeling was
    performed.
anomalies:
- anomaly_details: In survey data, skipped questions and incomplete responses are expected.
- anomaly_details: For wearable devices, improper use and technical failure such as battery
    failure or system malfunction are expected. In a few cases the data collection device
    had no stored results or was returned too late to retrieve the results. Gaps also occur
    in Garmin activity data because the battery had to be charged every two to three days.
- anomaly_details: In imaging data, participant non-cooperation, noise that may obscure the
    images, technical failure such as system malfunction, and data transfer failures are expected.
- anomaly_details: In a few cases there may have been a data collision at some point in the
    process and data have been lost.
- anomaly_details: Undilated handheld Optomed Aurora fundus imaging is harder to acquire well
    because the pupil is not dilated and the camera is handheld, so image quality varies from
    participant to participant and within the same participant. Fluorescence lifetime imaging
    ophthalmoscopy is performed last in the visit because it takes longer and exposes participants
    to uncomfortable light levels, so participant compliance may be lower for that modality.
known_biases:
- bias_type: selection_bias
  bias_description: Participants are volunteers, so there is selection bias known as volunteer
    bias, which may limit the generalisability of results to those who are not represented
    in the study population.
  mitigation_strategy: Participants were recruited in waves whose composition and size were
    adjusted in response to the observed participation characteristics of race/ethnicity,
    gender, T2DM severity and site.
- bias_type: sampling_bias
  bias_description: The sampling frame is patients aged 40 and older with a medical encounter
    in one of three academic health systems, identified by screening electronic health records
    for ICD-10 codes; people without such encounters cannot enter the cohort.
  mitigation_strategy: Uniform data collection protocols were implemented for all subjects
    irrespective of race/ethnicity, biological sex or diabetes severity across all study sites,
    and the three sites were selected for geographic variability across the United States
    and to ensure representation across various racial and ethnic groups.
  affected_subsets:
  - All modalities, because the sampling frame governs cohort composition as a whole.
- bias_type: representation_bias
  bias_description: The pilot and interim releases are not balanced across race/ethnicity,
    biological sex and diabetes presence and severity even though the completed study is designed
    to be, and recruiting Black men into health research is documented to be more difficult
    than recruiting other populations while that group bears a disproportionate burden of
    T2DM; similar trends for under-recruitment have been reported for Hispanic and Asian persons.
  mitigation_strategy: Under- and oversampling of groups as recruitment progresses, with new
    recruitment strategies to be implemented if sample balancing on race/ethnicity emerges
    as a challenge.
known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: Recruitment was predominantly urban and hospital-based, drawn from
    three academic health systems, which may not fully capture all possible cultural and socioeconomic
    backgrounds.
  scope_impact: May limit the generalization of models derived from the dataset to non-urban
    and non-health-system populations.
- limitation_type: coverage_limitation
  limitation_description: The study cohort does not provide a comprehensive representation
    of the population, as it does not include other races/ethnicities such as Pacific Islanders
    and Native Americans.
  scope_impact: Conclusions and models cannot be assumed to transfer to the excluded groups.
- limitation_type: scope_limitation
  limitation_description: Eligibility was restricted to adults aged 40 years and older (with
    an upper limit of 85 years in the registered protocol) who were able to provide consent
    and able to read and speak English. Pregnancy, gestational diabetes and type 1 diabetes
    were exclusionary.
  scope_impact: The dataset contains no data on younger adults, children, pregnant people,
    people with gestational or type 1 diabetes, or people who do not read and speak English.
  recommended_mitigation: The study team noted that requiring participants to speak, read
    and understand English may have created challenges in recruiting Hispanic and Asian persons,
    and planned Spanish translation of study materials if recruitment goals for Hispanic participants
    were not met.
- limitation_type: temporal_limitation
  limitation_description: This release is cross-sectional, with a single study visit per participant;
    a longitudinal arm covering approximately 10% of the cohort is planned for a later year
    of the project.
  scope_impact: Within-individual change over time cannot be estimated from this release.
- limitation_type: representativeness_limitation
  limitation_description: Enrollment is ongoing, and while the study ultimately aims to achieve
    balance across race/ethnicity, biological sex, and diabetes presence and severity, the
    interim data releases may not have achieved balanced distribution across groups.
  scope_impact: Group sizes in this release are unequal, most markedly for the insulin-controlled
    diabetes group.
