notes: >-
  Several pack receipts cite a chunk adjacent to where the snippet actually sits (slot-024 c008 -> lines
  2012-2016 are in c007; slot-028 c023 -> line 5670 is in c022); support holds and the validator already
  reports these as adjacent. The one validator mismatch (collection_notifications, snippet
  'vidually in each pool are mailed a hardcopy invitati') is a PDF line-break artifact, not a fabrication —
  the passage is in the BMJ protocol. Three receipted slots in the sample were sampled with a snippet that
  attests only part of the value (slot-022); the rest of that value is in the bundle. Rule findings
  concentrate on identifiers: one unattested ontology term (data_topic) and three minted fragments on
  identifiers of things outside the record (rule-09/10/11/14), plus pervasive British spelling (rule-12).
