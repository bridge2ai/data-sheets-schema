notes: >-
  Instrument findings: (1) the pack rendered slot-024 with value 'g' — the receipt path
  missing_data_documentation[0].missing_data_patterns[3] indexes a list that phase 4 collapsed into a
  single string (report section 4), and the pack indexed the string's characters; the same collapse
  affects sampling_strategies[0].strategies[0..1]. The reconciliation report calls these slots
  multivalued; the schema declares strategies, missing_data_patterns, privacy_techniques and
  tool_descriptions single-valued strings, so the collapse was correct and the report's self-criticism
  is misplaced. (2) Four receipted paths (at_risk_populations, human_subject_research,
  data_governance.committee_contact, instances[3].counts) point at content phase 4 removed; the
  reshaped vocabulary has no 'removed' verdict, so slot-052 and slot-060 are cannot_tell. (3) The
  receipt validator should have flagged the 'Program Start Date' snippet under third_party_sharing[0].notes
  (slot-026) as not bearing on its value; it is verbatim, so only a reader can. (4) The record's tier
  labels (project_documentation tier 2, cohort_2_webinar and NIH RePORTER tier 4) match the manifest's
  source_priority block (documentation=2, tutorial and NIH project page=4, historical documentation=5), so
  rule-13's preference for the chorus4ai.org figures is the manifest's ranking, not the record's own.
