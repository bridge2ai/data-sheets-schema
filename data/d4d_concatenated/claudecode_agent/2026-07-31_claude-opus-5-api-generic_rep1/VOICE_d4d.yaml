id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  The Bridge2AI-Voice dataset is a large, ethically sourced, and demographically diverse voice
  dataset linked to health information, released by the NIH Bridge2AI Common Fund program. The
  human voice contains complex acoustic markers which have been linked to important health
  conditions including dementia, mood disorders, and cancer; as a biomarker, voice is simple to
  collect, cost-effective, and has broad clinical utility. This record describes the adult
  registered/credentialed-access release version 3.1.0, published on PhysioNet on 1 May 2026, which
  contains data for 833 adult participants collected across five sites in North America.
  Participants were selected based on known conditions which manifest within the voice waveform,
  including voice disorders, neurological disorders, mood disorders, and respiratory disorders. The
  release contains data considered low risk, comprising derivations such as spectrograms, mel
  spectrograms, MFCCs, articulatory features, phonetic posteriorgrams and static acoustic features,
  but not the original voice recordings. Detailed demographic, clinical, and validated
  questionnaire data are also made available. Raw audio is disseminated separately through a
  controlled access mechanism.
