updates:
  update_details: >-
    The dataset is being expanded toward an anticipated final size of 100,000 patient
    admissions, nine data modalities and 14 data-contributing hospitals. As of August
    2025, imaging de-identification was in process for a larger cohort beyond the images
    then available, EEG extraction was in process, and the metadata status for clinical
    notes, imaging and EEG waveforms was listed as "Planned". Contributing sites provide
    regular status updates on their extract creation and curation progress.

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Data site managers begin from the Chorus_SOP page, which presents an interactive
    workflow diagram for extracting and contributing clinical data to CHoRUS with links
    to internally validated SOP documents, and raise problems in the Standards Discussions
    or Data Acquisition Discussions spaces. Clinical collaborators contribute to semantic
    mapping and validation through the chorus-mapping repository and its clinical validation
    SOP. Software developers contribute open-source tooling documented in the chorus-developer
    repository and tracked on a package status page. Contributing sites submit status
    updates through the GitHub interface or a Google Form that updates GitHub issues
    automatically.