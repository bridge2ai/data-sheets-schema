    data_substrate: OMOP structured EHR and waveform telemetry held in the cloud enclave
    data_topic: Acute and critical care illness

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Admissions are drawn from adult intensive care units (ICU), pediatric intensive
      care units (PICU) and neonatal intensive care units (NICU).
    distribution: >-
      The current released dataset comprises 50,000 patient admissions from ICU, PICU
      and NICU combined; no per-unit breakdown is reported in the available documentation.
  - subpopulation_elements_present: true
    identification: >-
      Admissions are distributed across 14 data-contributing hospitals drawn from a
      collaboration spanning 20 academic centers.
    distribution: >-
      Fourteen hospitals contribute data; per-hospital admission counts are not reported
      in the available documentation.

splits:
  - split_details: >-
      The project sequesters a holdout test set, provisioned and accessible for model
      external validation to aid marketplace adoption of AI-developed models for implementation
      in acute and critical care.

subsets:
  - id: https://chorus4ai.org/dataset/holdout-test-set
    name: CHoRUS holdout test set
    description: >-
      A sequestered holdout partition of the CHoRUS dataset, provisioned so that externally
      developed models can be validated against data not used in model development.
    is_data_split: true

file_collections:
  - id: https://chorus4ai.org/dataset/omop-ehr
    name: Structured electronic health record data (OMOP)
    description: >-
      Demographics, medication administration (dosing time-stamped upon each infusion
      change or dose administration), procedures documented by providers, high-frequency
      nursing flowsheet documentation, and diagnoses documented by providers. The current
      released dataset contains 1.6 billion rows of EHR OMOP data. Access is controlled;
      the September 2025 briefing table lists metadata as available for these data
      types, against the OMOP schema (with extensions for nursing flowsheets).
    conforms_to: OMOP Common Data Model
    collection_type: processed_data
  - id: https://chorus4ai.org/dataset/clinical-notes
    name: Tokenized clinical notes
    description: >-
      Unstructured clinical notes extracted and tokenized using the OHNLP toolkit.
      Notes are stored locally at contributing sites; only tokens are held centrally.
      Access is controlled; the September 2025 briefing table lists the metadata status
      for this data type as "Planned", against the OHNLP open source schema.
    conforms_to: OHNLP open source schema
    collection_type: processed_data
  - id: https://chorus4ai.org/dataset/imaging
    name: Imaging (DICOM)
    description: >-
      Imaging studies exported from hospital PACS. The September 2025 CHoRUS dataset
      briefing reported approximately 1,000 images available as of August 2025 with
      de-identification in process for a larger cohort; the CHoRUS project website
      reports 7,642 admissions with radiology data in the current released dataset.
      Access is controlled; the briefing table lists the metadata status for this data
      type as "Planned", against the DICOM schema.
    conforms_to: DICOM schema
    collection_type: raw_data
  - id: https://chorus4ai.org/dataset/waveform-telemetry
    name: Waveform telemetry
    description: >-
      Continuous physiological waveform telemetry captured from bedside monitors via
      gateway/middleware and held in the cloud enclave under controlled access. The
      CHoRUS project website reports 23 Tb of waveform data in the current released
      dataset.
    conforms_to: PhysioNet WFDB schema, extended
    collection_type: raw_data
    total_bytes: 23000000000000
  - id: https://chorus4ai.org/dataset/eeg
    name: EEG waveforms
    description: >-
      Electroencephalography waveforms drawn from hospital EEG databases. Extraction
      was in process as of August 2025. Access is controlled; the September 2025 briefing
      table lists the metadata status for this data type as "Planned", against the
      open source EDF+ and Persyst schema.
    conforms_to: EDF+ and Persyst open source schema
    collection_type: raw_data

raw_data_sources:
  - source_description: >-
      Structured electronic health record systems at 14 data-contributing hospitals
      (demographics, medication administration, procedures, nursing flowsheets, diagnoses).
    source_type: hospital electronic health record system
    raw_data_format: Site-native EHR extract, transformed to the OMOP Common Data Model
    access_details: Held under controlled access in the CHoRUS cloud enclave.
  - source_description: Unstructured clinical notes within hospital electronic health
      records.
    source_type: hospital electronic health record system
    raw_data_format: Free-text clinical notes, extracted and tokenized with the OHNLP
      toolkit
    access_details: >-
      Notes remain stored locally at the contributing site; only tokens are made available
      under controlled access.
  - source_description: Hospital picture archiving and communication systems (PACS).
    source_type: clinical imaging archive
    raw_data_format: DICOM
    access_details: Controlled access; de-identification in process for the larger imaging
      cohort.
  - source_description: >-
      Bedside physiological monitors, captured through telemetry gateway/middleware.
    source_type: bedside monitoring and telemetry infrastructure
    raw_data_format: WFDB
    access_details: Held under controlled access in the CHoRUS cloud enclave.
  - source_description: Hospital EEG databases.
    source_type: clinical neurophysiology database
    raw_data_format: EDF+ and Persyst
    access_details: Controlled access; extraction in process as of August 2025.

preprocessing_strategies:
  - preprocessing_details: >-
      Source clinical data are standardized to the OHDSI/OMOP Common Data Model using
      validated semantic mappings maintained in the chorus-mapping repository, with
      pooled tabular mappings and an associated clinical validation standard operating
      procedure.
  - preprocessing_details: >-
      Unstructured electronic health record text is extracted and tokenized using the
      OHNLP toolkit so that only tokens, rather than full note text, are transferred
      from contributing sites.
  - preprocessing_details: >-
      Data are transformed using approaches that limit re-identification, and a privacy
      scan tool for medical records is maintained within the CHoRUS software organization.
  - preprocessing_details: >-
      OMOP Location entities are geocoded via DeGauss, using the open source UF-Geocoding
      code maintained in the CHoRUS GitHub organization.
  - preprocessing_details: >-
      Physiological waveforms are converted and prepared for release using CHoRUS waveform
      conversion scripts and documentation (chorus_waveform, chorus_waveform_resources).

cleaning_strategies:
  - cleaning_details: >-
      Standard operating protocols (SOPs), maintained and internally validated in the
      Chorus_SOP repository, instruct data contributing sites on best practices for
      curating and delivering interoperable datasets, with a step-by-step extraction
      and contribution workflow.
  - cleaning_details: >-
      Characterization reports are produced and returned to contributing sites following
      each data submission (CHoRUSReports) so that issues in submitted extracts can
      be identified and resolved.
  - cleaning_details: >-
      Site status tracking, via the GitHub interface or a Google Form feeding the Standards
      and Data Acquisition projects, is used to identify and resolve blocking issues
      in extract creation and curation.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment is developed within CHoRUS to label
      data with targets important for prediction. Capabilities to acquire, standardize,
      tokenize, store, visualize and label data are built across the multi-center network.
    data_annotation_platform: CHoRUS visualization and annotation environment
  - labeling_details: >-
      Clinical collaborators contribute to semantic mapping and validation; pooled tabular
      mappings in the chorus-mapping repository are reviewed under a clinical validation
      standard operating procedure.
    data_annotation_protocol: CHoRUS clinical validation SOP for semantic mappings

machine_annotation_tools:
  - tools:
      - OHNLP toolkit
      - privacy_scan_tool
      - UF-Geocoding (DeGauss)
    tool_descriptions:
      - "OHNLP toolkit: used to extract and tokenize unstructured clinical notes; the
        resulting tokens conform to the OHNLP open source schema."
      - "privacy_scan_tool: a privacy scan tool for medical records, maintained as a
        Python repository in the chorus-ai GitHub organization."
      - "UF-Geocoding: open source code to geocode OMOP Location entities via DeGauss,
        maintained as a Python repository in the chorus-ai GitHub organization (forked
        from bihorac-LAB/Exposome, MIT licensed)."

missing_data_documentation:
  - missing_data_patterns: >-
      Coverage is uneven across the nine planned modalities. As of August 2025, clinical
      notes were absent from the enclave except as tokens; approximately 1,000 images
      were available; EEG had not yet been extracted; and the metadata status for clinical
      notes, imaging and EEG waveforms was listed as "Planned" rather than available.
    missing_data_causes: >-
      Imaging de-identification and EEG extraction workflows were still in process,
      and clinical notes are stored locally at contributing sites rather than in the
      enclave.
    handling_strategy: >-
      Tokenized representations are provided in place of full clinical note text; remaining
      imaging and EEG data are being added as de-identification and extraction complete,
      toward the anticipated final dataset of 100,000 patient admissions and nine modalities.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Instances are drawn from admissions at 14 data-acquisition hospitals within a
      collaboration of 20 academic centers in the United States, so the cohort reflects
      the case mix, documentation practices and technology of participating US academic
      centers.
    mitigation_strategy: >-
      Sampling is designed to ensure comprehensive sets of patient conditions and clinical
      treatment strategies, and federated access enables sampling methods to ensure
      a balanced and diverse cohort.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      The released resource is smaller and less complete than the anticipated final
      dataset. As of August 2025 it covered 14 hospitals and over 45,000 unique admissions
      against an anticipated 100,000 patient admissions, with only about 1,000 images
      available and EEG extraction still in process.
    scope_impact: >-
      Analyses relying on imaging or EEG modalities are constrained by the volume available
      at the time of access.
    recommended_mitigation: >-
      Confirm current per-modality coverage at the time of access, as de-identification
      and extraction are ongoing.
  - limitation_type: integration_limitation
    limitation_description: >-
      Clinical notes are stored locally at contributing sites and only tokens are available
      in the enclave, so full note text cannot be linked with the other modalities
      centrally.
    scope_impact: >-
      Limits natural language processing approaches that require untokenized clinical
      narrative.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset is restricted to retrospective records of critically ill patients
      admitted to ICU, PICU and NICU settings at participating hospitals.
    scope_impact: >-
      Findings may not generalize to non-critical-care settings or to prospective clinical
      workflows.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Contributing sites are academic centers, and the network spans 20 academic centers
      of which 14 contribute data.
    scope_impact: >-
      Community and non-academic hospital care may be under-represented.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The metadata status for clinical notes, imaging and EEG waveforms was still listed
      as "Planned" as of August 2025, while OMOP-based modalities were listed as having
      metadata available.
    scope_impact: >-
      Documentation depth differs by modality, complicating uniform programmatic use.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset consists of clinical records of critically ill patients, including
      demographics, diagnoses, procedures, medication administration and high-frequency
      nursing flowsheet documentation.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Free-text clinical notes are inherently identifiable; they are retained locally
      at contributing sites and only tokenized representations produced with the OHNLP
      toolkit are made available.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Radiology imaging from hospital PACS carries identifiable header and pixel information;
      de-identification was in process for the larger imaging cohort as of August 2025.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Social determinants of health and geographic contextual factors such as distance
      to the nearest hospital are included among the acquired data elements.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The cohort includes pediatric (PICU) and neonatal (NICU) admissions, and therefore
      data concerning minors.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Full clinical note text is not released; notes are stored locally at contributing
      sites and only tokens leave the site. Every data type in the resource (demographics,
      medication administration, procedures, nursing flowsheets, diagnoses, clinical
      notes, imaging, waveform telemetry and EEG) is designated controlled access,
      held in the CHoRUS cloud enclave.

is_deidentified:
  identifiable_elements_present: true
  method: >-
    Tokenization of unstructured electronic health record text using the OHNLP toolkit;
    de-identification of imaging; transformation of data using approaches that limit
    re-identification.
  deidentification_details: >-
    Data are transformed using approaches that limit re-identification. Unstructured
    electronic health record text is tokenized with the OHNLP toolkit; imaging de-identification
    was in process for the larger cohort as of August 2025; and a privacy scan tool
    for medical records is maintained within the CHoRUS software organization.

participant_privacy:
  - anonymization_method: >-
      Tokenization of unstructured EHR text using the OHNLP toolkit, de-identification
      of imaging, and transformation approaches that limit re-identification.
    privacy_techniques:
      - Tokenization of clinical narrative (OHNLP toolkit)
      - De-identification of imaging prior to release
      - Privacy scan tool for medical records
      - Local retention of full clinical notes at contributing sites
      - Controlled access to all data types within a cloud enclave
      - Federated access for cohort sampling
    reidentification_risk: >-
      Data are transformed using approaches that limit re-identification; imaging de-identification
      for the larger cohort was still in process as of August 2025.

human_subject_research:
  involves_human_subjects: true
  special_populations: >-
    The dataset includes admissions to pediatric intensive care units (PICU) and neonatal
    intensive care units (NICU), and therefore data concerning children and neonates,
    as well as critically ill adults.

at_risk_populations:
  at_risk_groups_included:
    - Critically ill and acutely ill patients
    - Children (pediatric intensive care unit admissions)
    - Neonates (neonatal intensive care unit admissions)

license_and_use_terms:
  license_terms: >-
    Access to the CHoRUS dataset is controlled. All participants must sign a licensing
    agreement, included in the registration form, before gaining access to the dataset.
    Separately, the CHoRUS software project hosted in the chorus-ai GitHub organization
    is licensed under the MIT License; this license applies to the software, not to
    the clinical dataset.
  contact_person: >-
    Request access: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org

regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions: >-
    Every data type in the dataset is designated controlled access. Users complete a
    registration form recording name, email and institution, sign a licensing agreement,
    and require a ".edu" email address; access and compute are provisioned by the program
    before the enclave can be used. The CHoRUS project website additionally notes that
    the repository is under review for potential modification in compliance with Administration
    directives.
  governance_committee_contact: dbold@emory.edu; jared.houghtaling@tuftsmedicine.org

