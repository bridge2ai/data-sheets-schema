id: https://chorus4ai.org/dataset
name: CHoRUS Dataset
title: 'Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards
  (CHoRUS) for Equitable AI'
description: >-
  CHoRUS is a multi-center, multi-modal, high-resolution critical care dataset produced
  by the Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI project, one of four data generation projects in the NIH Common
  Fund Bridge2AI consortium. The dataset is assembled retrospectively from 14 data-contributing
  hospitals within a 20-center academic network and is held under controlled access
  in a cloud enclave. It combines structured electronic health record data standardized
  to the OMOP Common Data Model (demographics, medication administration, procedures,
  nursing flowsheets, diagnoses), tokenized unstructured clinical notes, radiology
  imaging from hospital PACS, bedside waveform telemetry, EEG waveforms, and social
  determinants of health. The CHoRUS project website reports a current released dataset
  of 50,000 patient admissions from ICU, PICU and NICU, 1.6 billion rows of EHR OMOP
  data, 7,642 admissions with radiology data and 23 Tb of waveform data, against an
  anticipated final dataset of 100,000 patient admissions, 9 data modalities and 14
  contributing hospitals. A sequestered holdout test set is provisioned for external
  validation of models.
page: https://chorus4ai.org/
status: >-
  Active and partially released; further modalities and admissions are still being
  acquired. The CHoRUS project website carries the notice "This repoitory is under
  review for potential modification in compliance with Administration directives."
created_by: CHoRUS Consortium (60+ members across 20 different institutions)
was_derived_from: >-
  Electronic health record systems, PACS imaging archives, bedside monitor telemetry
  gateways/middleware and hospital EEG databases at 14 data-contributing hospitals
  in the CHoRUS network.
conforms_to: >-
  OMOP Common Data Model (structured EHR); OHNLP open source schema (tokenized clinical
  notes); DICOM (imaging); PhysioNet WFDB schema, extended (waveform telemetry); EDF+
  and Persyst (EEG)
conforms_to_schema: OHDSI/OMOP Common Data Model
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - electronic health record
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - DICOM
  - clinical notes
  - social determinants of health
  - artificial intelligence
  - machine learning
  - Bridge2AI
  - multimodal data
  - equitable AI

