purposes:
  - response: >-
      Develop a publicly available, AI-ready critical care dataset for machine learning
      and artificial intelligence applications, while ensuring the methods promote
      privacy, accountability and clinical benefit.
  - response: >-
      Meet the need of generating data for ML/AI applications aimed at characterizing
      acute and critical care illness, predicting complications, and measuring treatment
      response among patients with acute or critical illness.
  - response: >-
      Provision a holdout test set, accessible for model external validation, to aid
      marketplace adoption of AI-developed models for implementation in acute and
      critical care.
  - response: >-
      Develop the most diverse, high-resolution, ethically sourced, AI-ready data set
      to answer the grand challenge of improving recovery from acute illness.
  - response: >-
      As one of four data generation projects in the NIH-funded Bridge2AI consortium,
      work with the other projects to create ethically sourced datasets and tools around
      artificial intelligence and to create best practices for AI in health.
  - response: >-
      Cultivate expertise in the lay and scientific community to improve AI literacy
      and utilization through multimodal educational approaches, and promote a new
      generation of AI clinicians and scientists.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: Predicting complications among patients with acute or critical illness.
  - response: Measuring treatment response among patients with acute or critical illness.
  - response: >-
      External validation of AI/ML models against a sequestered holdout test set.
  - response: >-
      Labeling of data with targets important for prediction using a visualization
      and annotation environment.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support artificial intelligence
      and machine learning (AI/ML) in critical care; developing high-resolution multi-center
      data sets is a critical first step towards actionable and trustworthy AI.
  - response: >-
      Acquiring an AI-ready data set from more than 100,000 critically ill patients
      requires addressing challenges of data standards, tool development, data acquisition,
      ethics and workforce development that are not solved by existing resources.
  - response: >-
      Model external validation in acute and critical care lacks a sequestered holdout
      test set; CHoRUS provisions one to aid marketplace adoption of AI-developed models.
  - response: >-
      Existing legal and regulatory approaches to clinical care AI are being analyzed
      because community perspectives on provenance and privacy require new approaches
      to increase trustworthiness.

intended_uses:
  - use_category: Model development for acute and critical care
    examples:
      - Building machine learning and AI-derived models to improve the care and outcomes
        of patients requiring critical care
      - Characterizing acute and critical care illness
      - Predicting complications and deterioration
      - Measuring treatment response
    usage_notes: >-
      All data types are under controlled access within the CHoRUS cloud enclave.
  - use_category: External validation of AI/ML models
    examples:
      - Evaluating externally developed models against the sequestered CHoRUS holdout
        test set to support marketplace adoption
  - use_category: Education, training and workforce development
    examples:
      - Hands-on AI/ML training for trainees in the AIM-AHEAD Bridge2AI for Clinical
        Care Training Program using canonical Jupyter Notebooks
      - Workshops on the OHDSI/OMOP common data model and the OHDSI tool stack
      - Development of practical clinical AI use cases on the Bridge2AI AI/ML for Clinical
        Care Collaborative Cloud
    usage_notes: >-
      Trainee access requires a registration form (name, email, institution), a signed
      licensing agreement, and a ".edu" email address; compute is provisioned after
      access is granted.
  - use_category: Contextual and equity-oriented research
    examples:
      - Analyses using social determinants of health and contextual factors such as
        geographic distance to the nearest hospital

other_tasks:
  - task_details: >-
      Research on social determinants of health and contextual data elements included
      among the acquired data types.
  - task_details: >-
      Development and evaluation of standards, validated semantic mappings, and open-source
      tooling for transforming and interacting with multi-modal clinical data.
  - task_details: >-
      Generative AI use cases in clinical care, taught as part of the associated training
      curriculum.

existing_uses:
  - examples:
      - As of the September 2025 CHoRUS dataset briefing, the datasets are being used
        for training activities and publications.
  - examples:
      - "AIM-AHEAD Bridge2AI for Clinical Care Training Program, Cohort 2 (program
        start 2025-11-17, program end 2026-07-31): up to 30 selected trainees receive
        controlled access to the CHoRUS dataset and compute to develop use cases, posters,
        conference abstracts and manuscripts."

future_use_impacts:
  - impact_details: >-
      Patient-focused efforts determine the ethical and legal approaches to manage
      privacy and bias while accounting for Social Determinants of Health, so that
      downstream model development promotes privacy, accountability and clinical benefit.
  - impact_details: >-
      Federated access enables sampling methods to ensure a balanced and diverse cohort,
      intended to reduce inequity in models trained on the resource.
  - impact_details: >-
      Community-facing ethics focus groups determine what data is appropriate for public
      sharing, shaping which future uses are supported by the released resource.

acquisition_methods:
  - acquisition_details: >-
      Retrospective extraction of clinical data recorded during routine acute and critical
      care from electronic health records, PACS imaging archives, bedside monitor telemetry
      gateways/middleware, and hospital EEG databases at 14 data-contributing hospitals.
      Contributing sites create and upload a CHoRUS Data Extract following centralized
      standard operating protocols.
    was_directly_observed: true
  - acquisition_details: >-
      Derived data products: unstructured clinical notes are extracted and tokenized
      using the OHNLP toolkit, and source data are transformed to the OMOP Common Data
      Model via validated semantic mappings.
    was_inferred_derived: true

collection_mechanisms:
  - mechanism_details: >-
      Structured electronic health record extraction standardized to the OMOP Common
      Data Model, covering demographics, medication administration (dosing time-stamped
      upon each infusion change or dose administration), procedures documented by providers,
      high-frequency nursing flowsheet documentation, and diagnoses documented by providers.
  - mechanism_details: >-
      Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit.
  - mechanism_details: >-
      Export of imaging studies from hospital PACS in DICOM format.
  - mechanism_details: >-
      Capture of waveform telemetry from bedside monitors via gateway/middleware, stored
      in WFDB format.
  - mechanism_details: >-
      Extraction of EEG waveforms from hospital EEG databases in EDF+ and Persyst formats.
  - mechanism_details: >-
      CHoRUS software tooling supports collection and delivery, including chorus-extract-upload
      (tools to create and upload a CHoRUS Data Extract) and chorus-container-apps
      (dockerized container applications deployed to support CHoRUS services on Azure).

data_collectors:
  - collector_details: >-
      Fourteen data-acquisition centers within the 20-center CHoRUS academic network
      extract, curate and deliver interoperable clinical data extracts, and provide
      regular status updates on their progress.
    role: academic_institution
  - collector_details: >-
      The CHoRUS Standards, Data Acquisition and Tooling sub-teams within the CHoRUS
      data generation project define the workflow, standard operating protocols and
      software used for extraction and submission.
    role: academic_institution

direct_collection:
  - is_direct: false
    collection_details: >-
      Data are obtained retrospectively from hospital clinical systems (electronic
      health records, PACS, bedside telemetry gateways, EEG databases) at contributing
      hospitals rather than collected directly from patients.

collection_timeframes:
  - timeframe_details: >-
      Data collection is retrospective; the period covered by the underlying clinical
      records is not stated in the available documentation. The NIH award project period
      runs 2022-09-01 to 2026-11-30. As of August 2025 the dataset covered 14 different
      hospitals with over 45,000 unique admissions; the CHoRUS project website subsequently
      reports a current released dataset of 50,000 patient admissions.

sampling_strategies:
  - is_sample: true
    strategies:
      - Sampling to ensure comprehensive sets of patient conditions and clinical treatment
        strategies, supported by a legal framework for collecting data at scale.
      - Federated access enabling sampling methods to ensure a balanced and diverse
        cohort.
    source_data: >-
      Admissions of critically ill patients (ICU, PICU and NICU) at 14 data-contributing
      hospitals within the 20-center CHoRUS academic network.

