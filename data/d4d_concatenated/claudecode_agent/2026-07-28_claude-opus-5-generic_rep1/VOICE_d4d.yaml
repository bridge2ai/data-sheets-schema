purposes:
  - id: https://b2ai-voice.org/purpose/flagship-dataset
    name: Create a flagship ethically sourced voice dataset
    response: >-
      Bridge2AI-Voice seeks to create a flagship, standardized, and ethically sourced dataset of
      10,000 voices linked to health information to fuel research and discovery in voice
      biomarkers. The stated aim is to promote integration of voice as a biomarker of health in
      clinical care by generating a large multi-institutional, ethically sourced, and diverse
      voice dataset linked to multimodal health biomarkers to fuel voice AI research. The sources
      state different target sizes: the project documentation gives a flagship dataset of 10,000
      voices and the study metadata gives an enrollment count anticipated by 2027 of 10,000, while
      the audiomics white paper describes a primary deliverable of a publicly available database
      of 30,000 human voices and the IRB protocol gives a sample size of 30,000 participants, of
      which USF aims to enroll 5,000 with the remainder reached through collaboration with other
      participating institutions and existing cohorts. The IRB protocol separately states that
      complete multi-modal data acquisition will be performed for up to 5,000 participants per
      disease category and controls.
  - id: https://b2ai-voice.org/purpose/close-data-gap
    name: Address the gap in large-scale clinical voice data
    response: >-
      The Bridge2AI Voice dataset was created to address a gap in the availability of large-scale,
      diverse, and well-documented voice data for use in clinical machine-learning applications.
      Previous studies on machine learning-based voice diagnosis produced promising results, but
      their sample sizes were too small, or they lacked the key metadata needed for training
      robust, clinically useful models. The goal is to facilitate the use of voice as a
      non-invasive, cost-effective biomarker for the screening, diagnosis, and monitoring of a
      wide range of health conditions.
  - id: https://b2ai-voice.org/purpose/standards-and-ethics
    name: Establish acoustic standards and ethical governance
    response: >-
      Beyond data generation, the consortium's specific aims include introducing the field of
      acoustic biomarkers by developing new standards of acoustic and voice data collection and
      analysis for voice AI research; developing software and cloud infrastructure for automated
      voice data collection; implementing federated learning to allow analysis of
      multi-institutional data while preserving patient privacy; developing normative guidance for
      consenting to voice data collection, sharing and utilization; building bridges between
      medical voice research, acoustic engineering and the AI/ML world; and developing a
      curriculum and community for voice AI researchers, especially those from underserved
      communities.
  - id: https://b2ai-voice.org/purpose/pediatric-development
    name: Enable study of pediatric voice and speech development
    response: >-
      For the pediatric cohort, the stated purpose is that a robust multi-institutional dataset
      integrating pediatric voice data with demographic information would advance the
      understanding of voice and disease as well as early detection and intervention, enabling
      study of developmental norms, creation of AI-driven tools for early screening, and clinical
      insight. Pediatric and adult voice/speech production are described as fundamentally
      different because the respiratory system and larynx undergo rapid functional maturation
      throughout childhood, so normative data from adults cannot be generalized to pediatric
      populations.

tasks:
  - id: https://b2ai-voice.org/task/disease-classification
    name: Disease detection and classification from voice
    response: >-
      The current version of the dataset comes with predefined tasks and labeling. The tasks are
      primarily designed for training machine-learning models for disease detection and
      classification using voice data. Labels include diagnostic categories such as vocal
      pathologies, neurological disorders, psychiatric conditions, and respiratory disorders.
  - id: https://b2ai-voice.org/task/model-development
    name: Model pretraining, fine-tuning, benchmarking and validation
    response: >-
      The dataset aims to enable the development, benchmarking, or validation of clinically
      applicable machine-learning models for diagnosing a wide range of health conditions using
      voice data, including vocal pathologies, neurological, psychiatric, respiratory, and
      pediatric voice disorders. The dataset can be used for AI model pretraining, fine-tuning,
      benchmarking, or validation.
  - id: https://b2ai-voice.org/task/no-predefined-splits
    name: No predefined data splits
    response: >-
      There are no predefined recommended data splits for training, validation, or testing.
      Researchers are encouraged to create their own data splits based on their specific
      requirements. More details regarding task definitions and labeling can be found in the
      dataset.

addressing_gaps:
  - id: https://b2ai-voice.org/gap/small-samples
    name: Small and under-documented prior voice datasets
    response: >-
      Current literature had only been studied on small- to medium-sized data sets with limited
      data outside of acoustic measures not linked to multi-modal health data. Published AI/ML
      models linking voice to the studied disease categories consisted of datasets ranging from
      20-400 patients. In laryngeal cancer screening and diagnosis, most studies reported training
      datasets of fewer than 300 patients, and only two studies used more than one data modality
      to train their models, limiting generalization.
  - id: https://b2ai-voice.org/gap/standards
    name: Absence of standards for voice and speech data collection
    response: >-
      Comparing studies and pooling data is challenging due to a lack of existing standards in how
      voice and other acoustics are measured and collected. The consortium identifies the need to
      define and create standards for audiomics, the interdisciplinary field of audio analysis
      applied to biomedicine, covering data acquisition, interoperability and AI readiness.
  - id: https://b2ai-voice.org/gap/private-industry-data
    name: Private industry datasets that cannot be audited
    response: >-
      Within industry, datasets are often private, limiting the ability to audit ML models and the
      accuracy of training data labels. Although industry has access to vast amounts of voice data
      from users, it lacks access to accurate clinical data or demographic information, which
      prevents external auditing of training datasets to ensure fair representation of diverse
      populations.
  - id: https://b2ai-voice.org/gap/pediatric-data
    name: Scarcity of pediatric voice datasets
    response: >-
      The availability of large-scale pediatric databases remains limited despite the clinical
      importance of detecting pediatric communication disorders such as autism spectrum disorder
      and speech delays. Data collection in pediatric populations poses unique challenges such as
      privacy issues, consent processes, and the need for developmentally appropriate tasks, which
      have contributed to the lack of openly available pediatric datasets that enable machine
      learning for pediatric voice analysis.

