third_party_sharing:
  - id: https://b2ai-voice.org/third-party-sharing/broad
    name: Distribution outside the creating entity
    is_shared: true
    description: >-
      The dataset will be distributed broadly to individuals outside of the entity who created the
      dataset. Distribution is through data publishing platforms that provide publicly accessible
      metadata with a DOI for persistent resolution, while the dataset itself requires registered
      or credentialed access. Under the Data Transfer and Use Agreement, recipients agree to
      retain control over the Data and not to disclose, release, sell, rent, lease, loan or
      otherwise grant access to any third party except Authorized Persons without the prior
      written consent of the Provider.

license_and_use_terms:
  id: https://b2ai-voice.org/license
  name: Bridge2AI Voice access licences and agreements
  description: >-
    Both the adult and pediatric PhysioNet releases are distributed under the Bridge2AI Voice
    Registered Access License with the Bridge2AI Voice Registered Access Agreement as the data use
    agreement. No training is required for the credentialed-access releases.
  data_use_permission:
    - general_research_use
  license_terms:
    - >-
      Registered access (features-only data): register on PhysioNet and confirm your identity
      under the Registered Access License, then sign the Bridge2AI-Voice Registered Access
      Agreement, which outlines the terms and conditions for data use.
    - >-
      Controlled access (raw audio data): complete the Data Access Request Form (DARF), complete
      the Data Use Agreement (DUA), submit the application to the Data Access Compliance Office
      for review, and upon approval ensure a Data Use and Transfer Agreement (DTUA) is signed by
      an authorized official at your institution.
    - >-
      PhysioNet records the access policy for adult v1.1 as "Only registered users who sign the
      specified data use agreement can access the files", and for adult v3.0.0 and v3.1.0 and
      pediatric v1.1.0 as "Only credentialed users who sign the DUA can access the files".
    - >-
      Users of the dataset must agree to terms laid out in the registered access agreement. The
      intellectual property terms state that the Data may be protected by copyright and other
      rights; duplication as reasonably required to carry out the Research Project is permitted;
      sale of all or part of the Data on any media is not permitted; nothing in the Agreement
      transfers intellectual property rights in or relating to the Data; users agree not to make
      intellectual property claims on the Data or to use intellectual property protection in ways
      that would prevent or block access to, or use of, any element of the Data or conclusions
      drawn directly from it; users may obtain intellectual property rights on downstream
      discoveries but agree to implement licensing policies that will not obstruct further
      research; and users agree to respect the Fort Lauderdale Agreement.
    - There are no fees associated with these restrictions.
    - >-
      The Data Transfer and Use Agreement has a term ending two years after the start date, upon
      completion of the project, upon expiration of the applicable ethics approval, or upon
      termination by the Provider Institution, whichever occurs first, with the Provider
      Institution being the University of South Florida Board of Trustees. Data must then be
      destroyed in accordance with Provider instructions, with written certification of
      destruction submitted within thirty days, except for one archival copy retained as necessary
      for records retention, research integrity and verification.
    - >-
      Under the DTUA, recipients must reimburse the Provider for any costs associated with the
      preparation, compilation and transfer of the Data, which shall not include payments for
      research effort by the Provider.
    - >-
      Recipients are encouraged to make the results of the Project publicly available in
      open-access journals or preprint servers where possible, and agree to recognize the
      contribution of the Provider as the source of the Data in all written, visual or oral public
      disclosures.
    - >-
      Recipients further agree to adhere to the specific requirements of PhysioNet.org, managed by
      the MIT Laboratory for Computational Physiology.
    - >-
      The Data Transfer and Use Agreement document in the source bundle is a blank template with
      unfilled recipient, project and date fields, and every page carries the stamp "Approved for
      use through August 31, 2025", so its terms are recorded as the agreement's stated content
      rather than as an executed instrument.
    - >-
      Consent-derived permissions recorded in the healthsheet: the dataset does not allow only
      non-commercial use, does not restrict use to a specific geographic location, does not
      restrict use to a specific type of research, does not restrict use to genetic research, and
      does not restrict use to research that avoids the development of methods or algorithms.
    - >-
      Software released alongside the dataset carries its own licences: the REDCap data dictionary
      and metadata are MIT licensed, the prep library is Apache-2.0, and the documentation source
      is MIT.

ip_restrictions:
  id: https://b2ai-voice.org/ip-restrictions
  name: Intellectual property restrictions
  restrictions:
    - >-
      No IP-based restrictions have been imposed by third parties on the data associated with the
      instances.
    - >-
      The Data Provider provides no guarantees that the Data is free of third-party intellectual
      property rights, database rights, and other related rights.
    - >-
      Nothing in the agreements operates to transfer to the recipient any intellectual property
      rights in or relating to the Data, and recipients agree not to use intellectual property
      protection, database rights or related rights in a way that could prevent or limit access to,
      or use of, any element of the Data or research conclusions derived from it.
    - >-
      Neither party shall use the other party's name, trademarks or other logos in any publicity,
      advertising or news release without prior written approval of an authorized representative.

regulatory_restrictions:
  id: https://b2ai-voice.org/regulatory-restrictions
  name: Regulatory and compliance restrictions
  hipaa_compliant: compliant
  confidentiality_level: restricted
  regulatory_restrictions:
    - No export controls apply to the dataset.
    - >-
      Access is restricted: registered or credentialed access with a signed data use agreement for
      the feature-only releases, and controlled access with institutional sign-off for raw audio.
  other_compliance:
    - >-
      The dataset applies the HIPAA de-identification rules and removes direct identifiers;
      identifiable information under HIPAA and the Common Rule, as well as data considered
      sensitive, have been removed.
    - >-
      Data collection applications are HIPAA-compliant and transmit over secure HTTPS to
      HIPAA-compliant storage. Clinical data is hosted on cloud servers through NIH STRIDES
      partners (Amazon, Google, Microsoft) which have pre-negotiated agreements with the NIH to
      ensure HIPAA protection.
    - >-
      All investigators and project-related personnel with data access must follow the appropriate
      certification through their local institution, including HIPAA and privacy training.
    - >-
      A partial HIPAA waiver was requested for recruitment purposes, limited to inclusion-criteria
      PHI, to allow the study team to review EHR information for incoming clinic patients ahead of
      their appointments.
    - >-
      The transferred Data is covered under a Certificate of Confidentiality, which must be
      asserted against compulsory legal demands such as court orders and subpoenas.
    - >-
      Canadian institutions (Mount Sinai Hospital, SickKids and University of Toronto) do not
      follow the single IRB process and applied for separate research ethics board approvals to
      comply with Canadian regulations.
  governance_committee_contact: Data Access Compliance Office (DACO), DACO@b2ai-voice.org

human_subject_research:
  id: https://b2ai-voice.org/human-subject-research
  name: Human subjects research oversight
  description: >-
    The dataset derives from a prospective cohort study involving human participants. The clinical
    study was submitted to and approved by the USF Single IRB and subsite IRBs through the Single
    IRB process. The study is not for a drug product or a medical device, and no data monitoring
    committee was appointed.
  involves_human_subjects: true
  irb_approval:
    - >-
      Submitted and approved by the USF Single IRB and subsite IRBs through the Single IRB process.
    - >-
      Data collection and sharing for the adult PhysioNet releases was approved by the University
      of South Florida Institutional Review Board.
    - >-
      Data collection and sharing for the pediatric PhysioNet release was approved by the Research
      Ethics Board at the Hospital for Sick Children.
    - >-
      The separate app feasibility study was approved by the Institutional Review Board of the
      University of South Florida under IRB number 004890.
  ethics_review_board:
    - University of South Florida Institutional Review Board (single IRB of record for US sites).
    - Research Ethics Board, Hospital for Sick Children.
    - >-
      Separate Canadian research ethics boards at Mount Sinai Hospital, SickKids and the
      University of Toronto, including a separate protocol and REB approval for genomic data
      collection at the University of Toronto and Mount Sinai Hospital.
  special_populations:
    - >-
      Pediatric patients are enrolled only through the pediatric sites and not at USF. Checklist
      HRP-416 for children under 21 was completed and appended to the protocol.
    - >-
      The protocol states that students, employees, or wards of the state are neither specifically
      included nor excluded, and that there is a specific plan to enroll participants from
      socially and economically disadvantaged and underserved populations through the Plan for
      Enhancing Diverse Perspectives.
  regulatory_compliance:
    - >-
      The studies involving humans were conducted in accordance with the local legislation and
      institutional requirements, and participants provided written informed consent.
    - >-
      The PI and study team conduct the study using Good Clinical Practice guidelines.

ethical_reviews:
  - id: https://b2ai-voice.org/ethical-review/usf-single-irb
    name: USF Single IRB review
    reviewing_organization: University of South Florida Institutional Review Board
    review_details:
      - >-
        Asked whether the clinical study has been reviewed and approved by at least one human
        subjects' protection review board, the study metadata answers: submitted and approved by
        the USF Single IRB and subsite IRBs through the Single IRB process.
      - >-
        All US-based institutions abide by the single IRB process; once the protocol is approved at
        USF, each participating institution submits review based on the single IRB at USF.
      - >-
        The IRB protocol is titled "Bridge2AI Voice Data Acquisition", with principal investigator
        Yael Bensoussan, MD MSc, FRCSC, version V1 dated January 17, 2023, and a revision history
        through V13 dated July 11, 2025.
  - id: https://b2ai-voice.org/ethical-review/sickkids-reb
    name: Hospital for Sick Children Research Ethics Board review
    reviewing_organization: Research Ethics Board, Hospital for Sick Children
    review_details:
      - >-
        Data collection and sharing for the pediatric dataset was approved by the Research Ethics
        Board at the Hospital for Sick Children.
  - id: https://b2ai-voice.org/ethical-review/canadian-rebs
    name: Canadian research ethics board reviews
    reviewing_organization: Mount Sinai Hospital, SickKids and University of Toronto research ethics boards
    review_details:
      - >-
        Canadian institutions do not abide by the single IRB process and apply for a separate
        research ethics board application to comply with Canadian regulations; a copy of the
        approved application is submitted with the USF application.
      - >-
        Genomic data is collected and analyzed only at the University of Toronto and Mount Sinai
        Hospital under a separate protocol and REB approval, a copy of which is submitted to the
        USF IRB.

data_protection_impacts:
  - id: https://b2ai-voice.org/dpia/not-conducted
    name: Data protection impact assessment status
    impact_details:
      - >-
        Asked whether an analysis of the potential impact of the dataset and its use on data
        subjects has been conducted, the healthsheet answers "No".
      - >-
        A memorandum titled "Ethical Justification for Controlled Access to Raw Voice Data Samples"
        is published for download from the project documentation, explaining the reasoning behind
        the governance structure.

informed_consent:
  - id: https://b2ai-voice.org/informed-consent/main
    name: Informed consent procedures
    consent_obtained: true
    consent_type:
      - Prospective written informed consent.
      - Electronic consent housed in REDCap, which is HIPAA compliant.
      - In-app electronic consent.
      - Video-recorded consent within the application.
      - Parental permission with child assent for pediatric participants.
    consent_documentation:
      - >-
        Participants may consent by signing a physical paper copy, by indicating electronic consent
        within the app or through REDCap surveys, or through video recording within the app. Paper
        consent documents are uploaded and saved electronically in REDCap.
      - >-
        All paper and electronic versions of consent are stored for a minimum of 5 years after the
        completion of the study, following required USF procedure. Original paper consent documents
        cannot be destroyed until 5 years after study completion.
      - >-
        In some cases remote consent does not require the signature of the researcher; in this
        instance the consent form omits the final section (Statement of Person Obtaining Informed
        Consent) but is otherwise identical.
    withdrawal_mechanism:
      - >-
        Participants may withdraw from the study at any point. Withdrawal during or before voice
        data collection means the data will not be included in the database; after completion of
        voice data collection the data cannot be removed.
    consent_scope:
      - >-
        Consent covers the collection of voice, speech and respiratory sound data, questionnaire
        and demographic data, and access by investigators to medical information through EHR
        platforms in order to perform gold standard validation of diagnoses and symptoms.
      - >-
        Participants consent to provide a voice/speech sample for an open-sourced database and to
        de-identified voice and clinical data being uploaded to that database.
      - >-
        Within the consent process, individuals are asked whether they agree to be contacted in the
        future for further voice data collection if long-term follow-up is required; contact
        information provided for this purpose is stored within the institutional database only and
        is not shared with other centers or uploaded to the cloud.

at_risk_populations:
  id: https://b2ai-voice.org/at-risk-populations
  name: At-risk population protections
  description: >-
    The study includes minors in the pediatric cohort and includes participants with mood and
    psychiatric conditions for whom some questionnaire items may cause discomfort.
  at_risk_groups_included: true
  special_protections:
    - >-
      Pediatric patients are enrolled only through the pediatric sites and not at USF; checklist
      HRP-416 for children under 21 was completed and appended to the protocol.
    - >-
      Compensation is provided to the adult population only.
    - >-
      Recruitment takes place during typical patient care appointments and participants are made
      explicitly aware that participation is optional and voluntary and that declining will not
      interfere with their standard of care, so that no undue influence or coercion is possible.
  assent_procedures:
    - >-
      When children participate, children provide verbal assent where appropriate; assent is
      documented. Where young children cannot reasonably be asked to assent due to limitations in
      understanding related to age and development, they are not asked to do so, which typically
      holds for children under seven years of age.
  guardian_consent:
    - >-
      Parents or guardians provide consent for children. Parental permission is obtained from one
      or both parents; the research is minimal risk and does not require permission from both
      parents or legal guardians.
    - >-
      For pediatric data collection, parental or participant consent was obtained prior to data
      collection and data sharing. For participants without adequate comprehension and familiarity
      with their past medical history, parents or decision-makers completed the survey during the
      recording on a separate tablet.

participant_privacy:
  - id: https://b2ai-voice.org/privacy/deidentification-and-storage
    name: Privacy protections and storage controls
    anonymization_method:
      - >-
        All direct identifiers were removed, including name, civic address and social security
        numbers. Indirect identifiers were removed where these created a significant risk of
        participant re-identification, for example through combination with other public data
        available on social media, in government registries, or elsewhere; these include select
        geographic or demographic identifiers and some information about household composition or
        cultural identity.
      - >-
        Non-identifying elements of data that revealed highly sensitive information, such as
        household income, mental health status and traumatic life experiences, were also removed.
      - >-
        All raw voice data was removed from the feature-only release, as this data has the
        potential to cause individual re-identification or to be used for illicit or unauthorized
        purposes.
    reidentification_risk:
      - >-
        The dataset does not achieve k-anonymization with k greater than or equal to 2.
      - >-
        Even when removing all HIPAA-protected information, each person's voice is unique to them
        and their health at that time in their life, so it is always possible, even if unlikely,
        that someone could recognize a participant's voice; a voice can never be fully
        de-identified.
      - >-
        Measures taken to avoid re-identification include removal of all audio data and of certain
        sensitive fields identified by a team of ethicists.
    privacy_techniques:
      - >-
        Two levels of privacy are built into the study: a combined master de-identified database
        hosted through a HIPAA privacy-preserving NIH STRIDES partner with data sharing and data
        use agreements between participating institutions; and federated learning technology where
        each institution hosts its own data and models are trained without the data leaving the
        institution, with model updates shared to a central node.
      - >-
        Study data is uploaded to the password-protected REDCap network behind the HIPAA firewall.
        All users have individual usernames and passwords to access REDCap and the HIPAA-secure
        cloud server.
      - >-
        Each institution keeps its identified data within the institution; identifiable PHI is kept
        on REDCap databases with password-protected access only for investigators at the
        institution where the data is collected.
      - >-
        All entries to the REDCap recruitment screening system are deleted once patients are
        enrolled, or within 90 days of their submission, whichever comes first.
      - >-
        The de-identified dataset rebases and/or replaces dates by integers, removes or generalizes
        geographic information, and removes narrative text fields. State and province were removed
        while country of data collection was retained.
    data_linkage:
      - >-
        Participant numbers and institution numbers are created to allow institutions to track and
        have ownership of their institutional data.
      - >-
        Identifiable data and datasheets linking participant numbers to participant information are
        kept in each institution on local cloud storage for a maximum of 10 years after study
        completion and are then destroyed, which is the responsibility of each local PI.
      - >-
        The healthsheet states that PHI (identifiers plus health information) is not shared with
        anyone outside the USF research staff.

participant_compensation:
  - id: https://b2ai-voice.org/compensation/gift-cards
    name: Participant compensation
    compensation_provided: true
    compensation_type:
      - Electronic gift cards.
    compensation_amount:
      - >-
        Participants receive $40 for a data collection session that takes less than 90 minutes and
        $80 for a session that takes over 90 minutes, for no more than a total of 3 sessions and a
        maximum compensation of $120.
    compensation_rationale:
      - Compensation is provided to the adult population only.
      - >-
        In the separate app feasibility study, participants did not receive financial incentives
        for completion of the study.

is_deidentified:
  id: https://b2ai-voice.org/deidentification
  name: De-identification of the released dataset
  description: >-
    The level of de-identification for this dataset is stated as: identifiable information (under
    HIPAA and the Common Rule), as well as data considered sensitive, have been removed from this
    dataset.
  identifiable_elements_present: false
  method: >-
    Removal of HIPAA Safe Harbor identifiers, application of the HIPAA de-identification rules,
    removal of indirect identifiers that created a significant re-identification risk, removal of
    highly sensitive non-identifying elements, removal of fields encoded as sensitive in the REDCap
    data dictionary, and removal of all raw audio waveforms and of dense features derived from
    open-response prompts.
  identifiers_removed:
    - Names
    - Civic address and geographic locators
    - State and province (country of data collection retained)
    - Social security numbers
    - Date information at resolution finer than years; dates rebased or replaced by integers
    - Phone and fax numbers
    - Email addresses
    - IP addresses
    - Medical record numbers
    - Health plan beneficiary numbers
    - Device identifiers
    - License numbers
    - Account numbers
    - Vehicle identifiers
    - Website URLs
    - Full face photos
    - Biometric identifiers and any unique identifiers
    - Narrative text fields
    - Raw voice recordings
  deidentification_details:
    - The dataset removes direct identifiers and applies the HIPAA de-identification rules.
    - >-
      Raw audio transcripts were reviewed, and any audio recordings that contained potentially
      identifying information or external voices were removed from the release.
    - >-
      In addition, all spectrograms, MFCCs, Mel spectrograms, transcriptions, EMAs and PPGs from
      open-response prompts are removed from the feature-only dataset. Spectrograms and similar
      features were excluded if the audio contained free speech, while static and other features
      which do not encode the sensitive information were retained.
    - The dataset does not achieve k-anonymization with k greater than or equal to 2.

