    name: Bridge2AI-Voice adult dataset
    title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
    description: >-
      Adult cohort of the Bridge2AI-Voice dataset, distributed on PhysioNet. Version 3.1 contains
      data for 833 participants across five sites in North America. Participants were selected
      based on known conditions which manifest within the voice waveform including voice
      disorders, neurological disorders, mood disorders, and respiratory disorders. The release
      contains data considered low risk, including derivations such as spectrograms but not the
      original voice recordings. Detailed demographic, clinical, and validated questionnaire data
      are also made available. The project documentation states that version 3.0 contained
      approximately 61,937 voice-derived recordings from 833 adult participants.
