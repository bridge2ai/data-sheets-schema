    maintainer_details:
      - The platform team may be contacted through the address given in the project documentation.
  - id: https://b2ai-voice.org/maintainer/nih
    name: National Institutes of Health
    role: government_agency
    description: The dataset is supported by the NIH via the Bridge2AI project.

errata:
  - id: https://b2ai-voice.org/erratum/none
    name: Erratum status
    erratum_details:
      - >-
        There is no erratum. A changelog for each dataset version is published online with the
        dataset metadata.
      - >-
        Corrections made across releases are recorded in the PhysioNet release notes, including
        corrections in the authorship list at v2.0.1, reprocessing of spectrograms to fix minor
        issues at v2.0, and repair of broken parquet files at v3.1.0.

updates:
  id: https://b2ai-voice.org/update-plan
  name: Update and versioning plan
  frequency: >-
    The healthsheet states that further versions of the dataset will be released on a semi-annual
    (twice a year) basis.
  update_details:
    - >-
      Updates are distributed as new versions of the dataset on the hosting platform. Users are
      notified through news items on the platform as well as through standard communication
      channels.
    - >-
      The dataset is released as static versions rather than being dynamically updated.
    - >-
      Each version of the dataset has a unique DOI, and version-agnostic latest-version DOIs are
      also published.
    - >-
      The public data releases do not contain an equal distribution of the five disease categories;
      further releases will contain additional data. Spanish protocols and data collection will be
      included in future releases.

retention_limit:
  id: https://b2ai-voice.org/retention
  name: Retention limits
  retention_period: >-
    Once data is contributed, the data will be retained as long as it is useful for research
    purposes, possibly indefinitely.
  retention_details:
    - >-
      Identifiable data and datasheets linking participant numbers to participant information are
      kept in each institution on local cloud storage for a maximum of 10 years after study
      completion and are then destroyed.
    - >-
      The USF IRB requires de-identified study data and original consent forms to be stored for a
      minimum of 5 years after the completion of the study.
    - >-
      Under the Data Transfer and Use Agreement, recipient copies must be destroyed two years after
      the start date, upon completion of the project, upon termination, or upon expiration of the
      applicable ethics approval, whichever occurs first, with written certification of destruction
      submitted within thirty days.
    - >-
      By default, older versions of the dataset continue to be supported, hosted and made available
      to researchers, though the dataset publishers reserve the right to remove access to older
      versions. The files for adult version 1.1 are no longer available on PhysioNet.

version_access:
  id: https://b2ai-voice.org/version-access
  name: Version availability across components
  description: >-
    The dataset is released as static versions. Each version has a unique DOI, and older versions
    are by default retained, although the publishers reserve the right to remove access to them.
  versions_available:
    - 'Adult: v1.0 (Health Data Nexus, end of November 2024, DOI 10.57764/qb6h-em84)'
    - 'Adult: v1.1 (PhysioNet, January 17, 2025, DOI 10.13026/249v-w155)'
    - 'Adult: v2.0.0 (PhysioNet, April 16, 2025)'
    - 'Adult: v2.0.1 (PhysioNet, August 18, 2025)'
    - 'Adult: v3.0.0 (PhysioNet, December 16, 2025, DOI 10.13026/k81f-qr68)'
    - 'Adult: v3.1.0 (PhysioNet, May 1, 2026, DOI 10.13026/8xbn-nq66)'
    - 'Pediatric: v1.0.0 (PhysioNet, December 17, 2025)'
    - 'Pediatric: v1.1.0 (PhysioNet, May 1, 2026, DOI 10.13026/h995-bt35)'
  version_details:
    - >-
      The adult latest-version DOI is https://doi.org/10.13026/37yb-1t42 and the pediatric
      latest-version DOI is https://doi.org/10.13026/mf9s-5r03
    - >-
      The project documentation announces that the B2AI-Voice v3.1.0 adult dataset and v1.1.0
      pediatric dataset are now available, with voice available upon request.
    - >-
      The healthsheet study metadata describes the v2.0.0 dataset as containing only adult
      populations, stating that a pediatric cohort would be introduced as the study progressed and
      that inclusion/exclusion criteria and study metadata would be updated at that time.

extension_mechanism:
  id: https://b2ai-voice.org/extension-mechanism
  name: Extension and contribution mechanism
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
    - >-
      For dataset extensions and augmentations, it is possible for others to publish a derivative
      dataset on the Health Data Nexus which references the original source. These derivative
      datasets may be made available under the same conditions as the source data.
    - >-
      For augmentations to the code used to produce the data, the open-source repositories have
      discussion forums and issue pages which allow for public discussion of data preprocessing.
      The repository also has a mechanism, pull requests, for contributing improvements to the data
      preprocessing code.

external_resources:
  - id: https://b2ai-voice.org/external/self-contained
    name: Self-containment statement
    description: >-
      Asked whether the dataset is self-contained or relies on external resources, the healthsheet
      answers that it is self-contained, and answers "NA" both to whether there are guarantees that
      external resources will exist and remain constant over time and to whether there are official
      archival versions of the complete dataset including external resources.
    archival: false
    future_guarantees:
      - >-
        The healthsheet records "NA" for guarantees that external resources will exist and remain
        constant over time.
    restrictions:
      - >-
        The healthsheet records that the dataset is self-contained, so no external-resource
        restrictions are stated as applying to future users.
  - id: https://b2ai-voice.org/external/software-repositories
    name: Supporting software repositories
    description: >-
      Supporting materials listed in the project documentation: B2Ai-Voice REDCap, the Bridge2AI
      REDCap data dictionary and metadata, MIT licensed; B2Ai-Voice Prep Library, the code used to
      preprocess raw audio waveforms into parquet files and to merge source data into the phenotype
      files, Apache-2.0 licensed; B2Ai-Voice Docs, the source code for the docs and dashboard,
      MIT licensed; and B2Ai-Voice FHIR, FHIR profiles for voice as a biomarker.
    external_resources:
      - https://github.com/eipm/bridge2ai-redcap
      - https://github.com/sensein/b2aiprep
      - https://github.com/sensein/senselab
      - https://github.com/eipm/bridge2ai-docs
    restrictions:
      - >-
        The REDCap data dictionary and documentation source are MIT licensed; the prep library is
        Apache-2.0 licensed.
  - id: https://b2ai-voice.org/external/publications
    name: Associated publications and citation records
    description: >-
      Publications and archived records associated with the dataset and its protocols.
    external_resources:
      - https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html
      - https://doi.org/10.21437/Interspeech.2024-1926
      - https://zenodo.org/doi/10.5281/zenodo.12760724
      - https://zenodo.org/records/14989503
      - https://doi.org/10.5281/zenodo.14148755
      - https://zenodo.org/doi/10.5281/zenodo.13834653
      - https://doi.org/10.3389/fdgth.2025.1514971
      - https://doi.org/10.1001/jamaoto.2023.4807
    restrictions:
      - >-
        Using the dataset requires citation of the protocol development publication and, for the
        REDCap data dictionary and metadata, of the archived Zenodo record.
  - id: https://b2ai-voice.org/external/dashboards-and-training
    name: Dashboards, documentation and training resources
    description: >-
      The project publishes adult and pediatric dashboards, protocol pages per cohort, a
      healthsheet, and training opportunities for using the dataset.
    external_resources:
      - https://docs.b2ai-voice.org/
      - https://www.b2aivoicescholars.org/
      - https://bridge2ai.org/voice/
  - id: https://b2ai-voice.org/external/governance-memorandum
    name: Controlled access governance memorandum
    description: >-
      A memorandum titled "Ethical Justification for Controlled Access to Raw Voice Data Samples"
      is available for download from the project documentation and explains the reasoning behind
      the governance structure.
    restrictions:
      - >-
        Access to raw voice data samples requires the controlled access process described in the
        memorandum.
