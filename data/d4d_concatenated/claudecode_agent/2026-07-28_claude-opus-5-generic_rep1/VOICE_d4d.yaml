id: https://b2ai-voice.org/
name: Bridge2AI-Voice
title: Bridge2AI-Voice Dataset
description: >-
  The Bridge2AI-Voice (B2AI-Voice) dataset is a large, ethically sourced, and demographically
  diverse voice dataset linked to health information, released by the NIH's Bridge2AI initiative.
  It was generated by the Bridge2AI-Voice consortium, a Precision Public Health grand challenge
  project funded by the NIH Common Fund Bridge2AI Program, whose stated goal is a flagship,
  standardized, and ethically sourced dataset of 10,000 voices linked to health information to
  fuel research and discovery in voice biomarkers. The dataset couples acoustic recordings of
  voice, speech, breathing and cough tasks with detailed participant metadata: clinical
  diagnoses (voice, neurological, mood, respiratory and pediatric voice/speech disorders),
  validated questionnaires, and demographics. Public releases contain derived representations
  of the audio (spectrograms, Mel spectrograms, MFCCs, articulatory and phonetic features,
  pitch and loudness measures) rather than the original waveforms; access to raw audio is
  restricted to a separate controlled-access mechanism. Data are collected at multiple sites
  across North America. The dataset is distributed as two distinct PhysioNet projects: an adult
  cohort and a pediatric cohort, described as component resources of this record.
