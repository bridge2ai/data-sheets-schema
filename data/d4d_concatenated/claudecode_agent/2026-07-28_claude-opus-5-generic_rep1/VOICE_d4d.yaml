subsets:
  - id: https://b2ai-voice.org/cohort/voice-disorders
    name: Voice disorders cohort
    description: >-
      Participants with laryngeal cancer, laryngitis, pre-cancerous lesions, benign lesions of the
      vocal cord (nodule, polyp, cyst), muscle tension dysphonia, spasmodic dysphonia/laryngeal
      tremor, unilateral vocal fold paralysis, and glottic insufficiency/presbyphonia. Gold
      standard validation methods are laryngoscopy images and stroboscopy videos, with CT scan and
      spirometry additionally listed for unilateral vocal fold paralysis.
    is_subpopulation: true
    is_data_split: false
  - id: https://b2ai-voice.org/cohort/respiratory-disorders
    name: Respiratory disorders cohort
    description: >-
      Participants with airway stenosis (bilateral vocal fold paralysis, supraglottic, glottic,
      posterior glottic, subglottic, tracheal and multi-level upper airway stenosis) and chronic
      cough defined as bothersome cough over 8 weeks. Gold standard validation methods are
      spirometry and flow volume loops, and CT scan of neck/chest.
    is_subpopulation: true
    is_data_split: false
  - id: https://b2ai-voice.org/cohort/neurological-disorders
    name: Neurological and neurodegenerative disorders cohort
    description: >-
      Participants with mild cognitive impairment, Alzheimer's disease, other types of dementia,
      amyotrophic lateral sclerosis, and Parkinson's disease. Inclusion generally requires being
      over the age of 44 and under 85 and able to read and speak the English language. Gold
      standard validation methods are CT brain, MRI brain, whole genome sequencing, and for
      Alzheimer's disease serum p-tau protein blood markers.
    is_subpopulation: true
    is_data_split: false
  - id: https://b2ai-voice.org/cohort/mood-psychiatric-disorders
    name: Mood and psychiatric disorders cohort
    description: >-
      Participants with alcohol or substance use disorder, anxiety disorder, ADHD, autism spectrum
      disorder, bipolar disorder, borderline personality disorder, depression or major depressive
      disorder, eating disorder, insomnia/sleep disorder, obsessive-compulsive disorder, panic
      disorder, post-traumatic stress disorder, schizophrenia, social anxiety disorder, and other
      psychiatric disorders. Gold standard validation is by electronic health summary, clinical
      diagnosis from a psychiatrist, or medication history.
    is_subpopulation: true
    is_data_split: false
  - id: https://b2ai-voice.org/cohort/pediatric
    name: Pediatric voice and speech disorders cohort
    description: >-
      Pediatric participants aged 2-18 recruited strictly from the Hospital for Sick Children
      (SickKids) and grouped by age. Data are collected using reproschema-ui with the
      Bridge2AI-Voice pediatric protocol. Released separately as the Bridge2AI-Voice Pediatric
      Dataset on PhysioNet.
    is_subpopulation: true
    is_data_split: false
  - id: https://b2ai-voice.org/cohort/controls
    name: Controls cohort
    description: >-
      Participants who do not have the conditions of interest, included to serve as controls in
      the dataset. Control inclusion criteria require not being diagnosed or treated for a voice,
      respiratory, pediatric, mood, or neurological disorder affecting voice, cough, breath and/or
      speech, consenting to provide a voice/speech sample for an open-sourced database, being 18
      years old or older, and speaking the English or Spanish language.
    is_subpopulation: true
    is_data_split: false

instances:
  - id: https://b2ai-voice.org/instance/adult-participant
    name: Adult participant
    description: >-
      Each instance represents a person. The healthsheet states there are currently around 833
      instances and that the dataset represents 833 patients/subjects, matching the PhysioNet
      v3.0 and v3.1 participant count of 833 across five sites in North America. The initial
      release v1.0 provided data for 306 participants.
    instance_type: person
    counts: 833
    label: true
    label_description: >-
      Diagnostic labels are the result of a clinical assessment of the participant. At each site,
      a local clinician provided the diagnosis based on a clinical interview and appropriate
      work-up. For the psychiatric disorders cohort, this assessment was determined using the
      participant's EHR record or an active prescription, done outside of data collection by an
      appropriately licensed clinician.
  - id: https://b2ai-voice.org/instance/pediatric-participant
    name: Pediatric participant
    description: >-
      Pediatric participants aged 2-18 in the Bridge2AI-Voice Pediatric Dataset. The pediatric
      release v1.1.0 contains 300 participants; the project documentation states the pediatric
      dataset v1.0 is available containing data from 300 participants.
    instance_type: person
    counts: 300
    label: true
    label_description: >-
      Demographic information, voice and speech related questionnaires, and questionnaires
      inquiring about medical history were collected under an age-appropriate protocol.
  - id: https://b2ai-voice.org/instance/adult-recording
    name: Adult voice-derived recording
    description: >-
      Voice-derived recordings associated with adult participants. The project documentation
      states that version 3.0 contains approximately 61,937 voice-derived recordings from 833
      adult participants. The v1.0 release provided 12,523 recordings for 306 participants.
      Per-feature record counts in the v3.1.0 release range from 28,640 to 32,522 depending on
      the feature, because some files could not generate certain features and sensitive records
      and audio checks were removed.
    instance_type: voice-derived recording
    counts: 61937
  - id: https://b2ai-voice.org/instance/pediatric-recording
    name: Pediatric voice-derived recording
    description: >-
      The pediatric release v1.1.0 contains derived audio features for 23,533 recordings collected
      from 300 participants aged 2-18.
    instance_type: voice-derived recording
    counts: 23533
  - id: https://b2ai-voice.org/instance/data-modality
    name: Data modalities per participant
    description: >-
      Each participant's data consists of audio recordings and questionnaire responses. Each
      instance consists of raw audio and questionnaire response data, as well as extracted audio
      features. Other multimodal data collected across the project includes imaging, genomic data
      for the neurological cohort, laryngoscopy imaging, and other EHR data extracted from
      different sites independently and uploaded through the REDCap database; the documentation
      states that no external data is released in the v3.0.0 release.
    instance_type: multimodal record

relationships:
  - id: https://b2ai-voice.org/relationships/instances
    name: Relationships between instances
    relationship_details:
      - >-
        Asked whether relationships between individual instances are made explicit, the
        healthsheet answers "No, they are unrelated."
      - >-
        For most participants a single session was sufficient to collect all relevant data.
        However, a subset of participants required multiple sessions, so there may be more than
        one session per participant in the dataset, and more than one row per participant in the
        phenotype data files. There is no requirement that the participant provide the same
        response at each visit, so participant information for the same data element may vary
        across a data file.

splits:
  - id: https://b2ai-voice.org/splits/none
    name: No recommended splits
    split_details:
      - >-
        There are no predefined recommended data splits for training, validation, or testing.
        Researchers are encouraged to create their own data splits based on their specific
        requirements.
      - >-
        The questionnaire features are collected and distributed in the phenotype folder format
        and can be used for cohort selection.

subpopulations:
  - id: https://b2ai-voice.org/subpopulation/demographics
    name: Demographic subpopulations
    subpopulation_elements_present: true
    identification:
      - >-
        The dataset identifies demographic sub-populations by age, gender, sex, ethnicity and
        socioeconomic status.
      - >-
        Detailed demographic data collected through the smartphone application includes age, sex,
        gender, race and ethnicity, and language.
    distribution:
      - >-
        The public data releases do not contain an equal distribution of the five disease
        categories. Further releases will contain additional data.
      - >-
        The dataset has skews based on disorder category, site, and other demographic factors.
        Users should consider the multivariate distribution when assessing utility for different
        questions.
  - id: https://b2ai-voice.org/subpopulation/disease-cohorts
    name: Disease cohort subpopulations
    subpopulation_elements_present: true
    identification:
      - >-
        Five disease cohort categories were identified: voice disorders; neurological and
        neurodegenerative disorders; mood and psychiatric disorders; respiratory disorders; and
        pediatric voice and speech disorders. Participants without the identified conditions serve
        as controls.
    distribution:
      - >-
        Data is collected across five disease categories, and the initial data release contains
        data collected from four of the five categories.
      - >-
        The PhysioNet adult release states that participants were selected based on known
        conditions which manifest within the voice waveform including voice disorders,
        neurological disorders, mood disorders, and respiratory disorders.

sensitive_elements:
  - id: https://b2ai-voice.org/sensitive/categories
    name: Sensitive data categories present
    sensitive_elements_present: true
    sensitivity_details:
      - 'Racial or ethnic origins: the dataset includes race information.'
      - 'Sexual orientations: the dataset includes sexual orientation information.'
      - 'Financial or health data: the dataset includes socioeconomic and health information.'
      - >-
        Biometric considerations: voice itself is treated as potentially re-identifying. All raw
        voice data was removed from the released feature-only dataset because it has the potential
        to cause individual re-identification or to be used for illicit or unauthorized purposes.
      - >-
        Non-identifying elements of data that revealed highly sensitive information, such as
        household income, mental health status, and traumatic life experiences, were removed.
      - >-
        Fields encoded as sensitive in the REDCap data dictionary (column name "Identifier?") were
        removed from the dataset at the v3.0.0 de-identification stage.

confidential_elements:
  - id: https://b2ai-voice.org/confidentiality/released-dataset
    name: Confidentiality of the released dataset
    confidential_elements_present: false
    confidentiality_details:
      - >-
        Asked whether the dataset contains data that might be considered confidential, for example
        data protected by legal privilege or by doctor-patient confidentiality, or the content of
        individuals' non-public communications, the healthsheet answers "No".
  - id: https://b2ai-voice.org/confidentiality/transferred-data
    name: Confidentiality obligations on transferred data
    confidential_elements_present: true
    confidentiality_details:
      - >-
        The Data Transfer and Use Agreement states that the Data is Personally Identifiable
        Information as defined in OMB Memorandum M-07-16 and is covered under a Certificate of
        Confidentiality, which must be asserted against compulsory legal demands such as court
        orders and subpoenas for identifying information or characteristics of a research
        participant.
      - >-
        Recipients must bind Authorized Persons to hold the Data according to standards of
        confidentiality and security equivalent to those in the Agreement, and must not disclose,
        release, sell, rent, lease, loan, or otherwise grant access to the Data to any third party
        without prior written consent of the Provider.

content_warnings:
  - id: https://b2ai-voice.org/content-warning/free-speech
    name: Free speech transcription content
    content_warnings_present: true
    warnings:
      - >-
        The dataset includes the transcription of free speech tasks. While the inclusion of
        offensive, insulting or threatening information is unlikely, it cannot be completely
        avoided, as research participants are responsible for their choice of language.
      - >-
        Questions asked of participants from certain disease cohorts such as mood disorders,
        depression and anxiety can lead to possible discomfort and could trigger negative emotions
        for the participants.

anomalies:
  - id: https://b2ai-voice.org/anomaly/collection-heterogeneity
    name: Heterogeneous collection configurations
    anomaly_details:
      - >-
        Different sites have different collection configurations, and the collection protocol
        changed over the course of the study.
      - Distinct iPad devices were used at each site.
      - >-
        The data were recorded with a head-mounted headset with a microphone that could be at
        slightly different distances.
      - >-
        For the pediatric cohort, a headset was used to record for most participants, while the
        remaining recordings used the built-in tablet microphone due to low tolerance of wearing
        headphones or existing complex medical conditions.
  - id: https://b2ai-voice.org/anomaly/noise-and-reporting
    name: Noise and reporting irregularities
    anomaly_details:
      - >-
        Confounding factors that might be present in the data include noise artifacts, variations
        in diagnostic practices, inaccurate questionnaire responses, and underreporting.
      - >-
        The clinical diagnosis, depending on the disorder, was performed by one clinician or based
        on an EHR record or prescription.
      - Changes in diagnostic criteria or practices could be a source of distribution shift.
  - id: https://b2ai-voice.org/anomaly/unaudited-derivations
    name: Unaudited automated derivations
    anomaly_details:
      - >-
        The dataset has been audited internally for missingness and consistency by the data
        release team, and a missingness table is included with the dataset. Certain aspects of the
        data, for example transcription, were generated using off-the-shelf models that have not
        been audited for correctness.
      - >-
        Some files, whether due to length or other issues, could not generate certain features and
        so are not included in the bundled data, which is why per-feature record counts differ.
      - >-
        The v3.1.0 release notes state that broken parquet files from the previous release were
        fixed.

known_biases:
  - id: https://b2ai-voice.org/bias/selection
    name: Clinic-based recruitment selection bias
    bias_type: selection_bias
    bias_description: >-
      Participants are recruited across different academic institutions from high volume expert
      clinics based on diagnosis and inclusion/exclusion criteria. Groups that have less trust in
      the medical system or in AI, or who are less proximal to the collection sites, would have
      been less likely to be recruited.
    mitigation_strategy: >-
      The protocol describes partnerships with Community Outreach Clinics whose main mission is to
      provide health services to underserved and under-represented populations, and a Plan for
      Enhancing Diverse Perspectives to enroll participants from socially and economically
      disadvantaged and underserved populations.
    affected_subsets:
      - All disease cohorts recruited through high volume expert clinics
  - id: https://b2ai-voice.org/bias/sampling
    name: Non-probability sampling and limited geography
    bias_type: sampling_bias
    bias_description: >-
      The sampling method is recorded as a non-probability sample. The data is described as a
      sample of a larger, ongoing collection which is not representative because it was collected
      at a limited number of geographic locations; five recording sites are included in the
      dataset.
    mitigation_strategy: >-
      The team states the intent to make the dataset more representative by shifting to remote
      collection and designing the recruiting approach in a way that controls for more variables.
    affected_subsets:
      - Adult cohort across five North American sites
  - id: https://b2ai-voice.org/bias/representation
    name: Uneven representation across cohorts and sites
    bias_type: representation_bias
    bias_description: >-
      The public data releases do not contain an equal distribution of the five disease
      categories, and the dataset has skews based on disorder category, site, and other
      demographic factors.
    mitigation_strategy: >-
      Users should consider the multivariate distribution when assessing utility for different
      questions. Further releases will contain additional data.
    affected_subsets:
      - Disease cohort subsets
      - Site-level subsets
  - id: https://b2ai-voice.org/bias/measurement
    name: Device and label acquisition variability
    bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders based on site, so they also had their
      data collected with different devices, creating an interaction between labels and recording
      conditions. Diagnostic labels were assigned by a single labeler, typically the clinician at
      the site of data collection or a clinician external to it for a prior diagnostic assessment.
    mitigation_strategy: >-
      Data are collected on standardized hardware, iPads (9th or 10th generation) and iPad Air
      (5th generation) using an Avid AE-36 microphone with an Apple dongle, and the app includes
      models for volume standardization and noise cancellation. Version 3.1.0 adds audio quality
      metrics and per-recording metadata including microphone and gain information.
    affected_subsets:
      - Site-level subsets
      - Disease cohort subsets

known_limitations:
  - id: https://b2ai-voice.org/limitation/language
    name: English-only data collection
    limitation_type: coverage_limitation
    limitation_description: >-
      English language was used for communication with study participants, and the only language
      option stated for the v2.0.0 dataset is English. The exclusion criteria include not reading
      or speaking English. The current dataset contains fluent English speakers.
    scope_impact: >-
      Models trained on the dataset may not generalize to speakers of other languages, and
      non-English speakers are absent from the released cohorts.
    recommended_mitigation: >-
      Spanish versions of the protocol are under development and the documentation states that
      Spanish protocols and data collection will be included in future releases; the IRB protocol
      was updated in February 2025 to include data collection from Spanish language speakers.
  - id: https://b2ai-voice.org/limitation/representativeness
    name: Not representative of the larger population
    limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset is a sample of a larger, ongoing collection and is explicitly stated not to be
      representative because it was collected at a limited number of geographic locations.
    scope_impact: >-
      Limits the generalizability of derived models and of any population-level inference.
    recommended_mitigation: >-
      The team intends to shift to remote collection and to design recruiting in a way that
      controls for more variables.
  - id: https://b2ai-voice.org/limitation/no-raw-audio
    name: Raw audio absent from public releases
    limitation_type: scope_limitation
    limitation_description: >-
      In the public releases, audio waveforms are omitted and only derived features are made
      available. All raw voice data was removed from the feature-only release because it has the
      potential to cause individual re-identification. In addition, all spectrograms, MFCCs, Mel
      spectrograms, transcriptions, EMAs and PPGs from open-response prompts are removed from the
      feature-only dataset.
    scope_impact: >-
      Research requiring the original waveform, or requiring dense features of free-speech
      prompts, cannot be performed on the registered or credentialed access release alone.
    recommended_mitigation: >-
      Raw audio is disseminated through a controlled access mechanism; access can be requested
      from the Data Access Compliance Office at DACO@b2ai-voice.org, with distribution via Synapse.
  - id: https://b2ai-voice.org/limitation/no-external-modalities
    name: Multimodal data not released
    limitation_type: scope_limitation
    limitation_description: >-
      Other multimodal data, including imaging, genomic data for the neurological cohort,
      laryngoscopy imaging and other EHR data, is extracted from different sites independently and
      uploaded through REDCap, but the documentation states that no external data is released in
      the v3.0.0 release.
    scope_impact: >-
      Multi-omic and imaging-linked analyses anticipated by the project's aims are not supported by
      the current public release.
  - id: https://b2ai-voice.org/limitation/single-labeler
    name: Single labeler per instance
    limitation_type: methodological_limitation
    limitation_description: >-
      A single labeler provides a label per instance; the labeler is typically the clinician at
      the site of data collection, or a clinician external to it for a prior diagnostic
      assessment. Human-level performance in the applications the dataset is intended to address
      is reported to vary widely.
    scope_impact: >-
      Inter-annotator agreement cannot be computed from the released labels, and label quality
      depends on site-level clinical practice.
    recommended_mitigation: >-
      Labeling followed Bridge2AI protocols and ICD-10 codes, and gold standard validation methods
      are specified per diagnosis. Version 3.1.0 back-filled validated diagnosis information
      across conditions.
  - id: https://b2ai-voice.org/limitation/ai-readiness
    name: Self-assessed AI-readiness gaps
    limitation_type: integration_limitation
    limitation_description: >-
      In the project's AI-readiness self-rating against the Bridge2AI recommendations, four
      criteria are marked as not met: Data Quality (2.e), Domain-appropriate (5.b), Associated
      (5.d), and Contextualized (6.d). Category scores are reported as 100 percent for FAIRness,
      Provenance, Pre-model explainability and Ethics; 80 percent for Characterization; 50 percent
      for Sustainability; and 75 percent for Computability.
    scope_impact: >-
      Indicates residual gaps in data quality characterization, domain appropriateness, associated
      resources and contextualization at the time of the assessment.

missing_data_documentation:
  - id: https://b2ai-voice.org/missing-data/patterns
    name: Missing data patterns and handling
    missing_data_patterns:
      - >-
        Some questions are optional, so information may be missing from individual instances.
      - >-
        Each individual answered a common set of questions and then responded to additional
        questions relevant to their primary diagnostic category, so cohort-specific fields are
        absent for participants outside that cohort.
      - >-
        Phenotype data files only contain rows for a participant if at least one column is not
        missing.
      - >-
        Some files could not generate certain derived features due to length or other issues and
        are therefore not included in the bundled feature data.
    missing_data_causes:
      - Optional survey questions.
      - Data collection irregularities during the study.
      - >-
        Deliberate removal of sensitive records, audio checks, and free-speech-derived dense
        features during de-identification.
    handling_strategy: >-
      The dataset has been audited internally for missingness and consistency by the data release
      team, and a missingness table is included with the dataset. The audit protocol includes
      generating missingness tables, checking distributions and outliers, checking categorical
      responses against the schema, and running quality control metrics for audio tasks.

acquisition_methods:
  - id: https://b2ai-voice.org/acquisition/primary
    name: Direct observation, self-report and clinical verification
    was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - >-
        The data was directly observable and reported by subjects. Clinical diagnoses were
        verified by clinicians reviewing audio and/or imaging data, looking at electronic health
        records, or medication prescriptions.
      - >-
        Clinical validation is performed by a qualified physician or practitioner based on
        established gold standards for diagnosis.
      - >-
        Derived acoustic representations are computed from the raw waveform rather than observed
        directly; transcriptions were generated using OpenAI's Whisper Large model.

collection_mechanisms:
  - id: https://b2ai-voice.org/collection-mechanism/apps
    name: Bridge2AI-Voice applications
    mechanism_details:
      - >-
        The data were collected using an iPad app. Voice samples are collected prospectively using
        a custom software application, the Bridge2AI-Voice App, with the Bridge2AI-Voice protocols.
      - >-
        Data collection occurs through two platforms, the Bridge2AI Voice Web app and the
        Bridge2AI Voice iOS app. The iOS app is restricted to iOS-compatible devices, while the
        Web app can run on a computer, tablet, or phone device. No software is downloaded or
        installed; both apps are HIPAA-compliant, store data only during the collection phase,
        require no login, and send data over a secure HTTPS protocol to a HIPAA-compliant storage
        server.
      - >-
        For pediatrics, all data is collected using reproschema-ui with the Bridge2AI-Voice
        pediatric protocol, on tablets.
      - >-
        A separate Bridge2AI Enrollment Web app is launched in a browser on the participant's
        device for remote enrollment.
  - id: https://b2ai-voice.org/collection-mechanism/hardware
    name: Recording hardware
    mechanism_details:
      - >-
        Data is collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an
        Avid AE-36 microphone and an Apple dongle to connect it to the iPad.
      - >-
        Participants are instructed to wear a headset with microphone if the task includes voice
        recording, as per the Bridge2AI-Voice suggested standards.
      - >-
        The smartphone application for voice data collection includes models to ensure acoustic
        data quality, including volume standardization and noise cancellation.
  - id: https://b2ai-voice.org/collection-mechanism/redcap
    name: REDCap clinical data capture
    mechanism_details:
      - >-
        Existing clinical data within the EHR is reviewed and entered into a REDCap database as
        part of the Case Report Form. At USF this screening is conducted through the EPIC
        platform, and through local site EHR systems for other participating institutions.
      - >-
        The supporting REDCap data dictionary, metadata, and instrument PDFs are available at
        https://github.com/eipm/bridge2ai-redcap. Full data acquisition protocols will be
        available in the REDCap instrument Shared Library.
  - id: https://b2ai-voice.org/collection-mechanism/protocol-content
    name: Acoustic tasks and validated instruments
    mechanism_details:
      - >-
        A total of 22 acoustic tasks are recorded through the app. Tasks are grouped as non
        voice/non speech (respiration, cough, breath sounds, voluntary cough), voice/non speech
        (prolonged vowel, maximum phonation time, glides, loudness, diadochokinesis) and speech
        (Rainbow Passage, Caterpillar Passage, CAPE-V sentences, free speech, picture description,
        story recall, animal fluency, open response questions, word-color Stroop, productive
        vocabulary, random item generation, Cinderella story). Additional pediatric tasks include
        ABCs, ready for school, favorite show, favorite food, outside of school, months, counting,
        naming animals, naming food, identifying pictures, pediatric picture description, long
        sounds, noisy sounds, pediatric Caterpillar Passage, repeat words, role naming, repeat
        sentences, and silly sounds.
      - >-
        Validated questionnaires integrated into the app include the Voice Handicap Index-10
        (VHI-10), Patient Health Questionnaire (PHQ-9), General Anxiety Disorder (GAD-7), Positive
        and Negative Affect Schedule (PANAS), Custom Affect scale, PTSD Adult, ADHD-Adult, DSM-5
        Adult, Dyspnea Index (DI), Leicester Cough Questionnaire (LCQ), Winograd questionnaire,
        Montreal Cognitive Assessment (MOCA), Children's Voice Handicap Index-10 (C-VHI-10),
        Pediatric Voice Outcomes Survey (PVOS), Pediatric Voice-Related Quality-of-Life (PVRQOL),
        and the Patient Health Questionnaire modified for Adolescents (PHQ-A).
      - >-
        Detailed demographic data and surveys about confounding factors such as smoking and
        drinking history are collected through the smartphone application.
      - >-
        Protocol development is described in Bensoussan, Yael, et al. "Developing Multi-Disorder
        Voice Protocols: A team science approach involving clinical expertise, bioethics,
        standards, and DEI." Proc. Interspeech 2024,
        https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html

sampling_strategies:
  - id: https://b2ai-voice.org/sampling/adult
    name: Adult cohort sampling
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - >-
        Patients presenting at specialty clinics and institutions, screened for inclusion and
        exclusion criteria prior to their visit by the project investigators.
      - >-
        High Volume Expert Clinics, defined as outpatient clinics within hospital systems or
        academic institutions with expertise in a specific disease area seeing more than 50
        patients per month from the same disease category; the IRB protocol defines them as
        multidisciplinary programs with a volume of over 1000 patients per year.
      - >-
        Community Outreach Clinics, defined as clinics whose main mission is to provide health
        services to underserved and under-represented populations.
    why_not_representative:
      - >-
        The data is not representative because it was collected at a limited number of geographic
        locations.
    strategies:
      - The sampling method is recorded as a non-probability sample.
      - >-
        The study design is recorded as observational with a cohort observation model and a
        cross-sectional time perspective, under the official title Bridge2AI-Voice and
        organization study ID OT2OD032720. The anticipated enrollment count by 2027 is 10,000.
      - >-
        Eligibility recorded in the study metadata: sex all, not gender based, minimum age 18
        years (noted as subject to change when the pediatric cohort is introduced), maximum age
        120 years, healthy volunteers accepted. The stated exclusion criterion is not reading or
        speaking English, with Spanish protocols and data collection to be included in future
        releases; inclusion and exclusion criteria otherwise follow the per-diagnosis table.
      - >-
        Patients were selected based on membership in five predetermined groups: respiratory
        disorders, voice disorders, neurological disorders, mood disorders, and pediatric.
      - >-
        If specific diagnoses or severities are under-represented in the dataset, participants are
        identified by medical record review based on voice-disorder related diagnostic codes.
      - >-
        Recruitment occurs through clinic appointments, flyers, QR codes linked to a secure REDCap
        screening survey, waiting-room recruitment where approved, social media platforms
        (LinkedIn, X, Facebook, Instagram, YouTube, www.b2ai-voice.org and www.bridge2ai.org), and
        FlowTrials.
    representative_verification:
      - >-
        The healthsheet states the sample is not representative and does not report a
        representativeness verification procedure.
  - id: https://b2ai-voice.org/sampling/pediatric
    name: Pediatric cohort sampling
    is_sample: true
    is_random: false
    source_data:
      - >-
        Patients and healthy volunteers at the Hospital for Sick Children. Non-patients were
        recruited through research postings and evaluated for eligibility against the study's
        inclusion and exclusion criteria.
    strategies:
      - >-
        Inclusion criteria were 2 to 18 years of age and English proficiency. Exclusion criteria
        were participants over 18 years of age and individuals who were non-verbal.
      - Pediatric participants are recruited strictly from SickKids and are grouped by age.

data_collectors:
  - id: https://b2ai-voice.org/collector/research-teams
    name: Site research teams
    role: Data collection and participant coordination
    collector_details:
      - >-
        Research teams, which may include medical, graduate, or undergraduate students,
        coordinated with clinicians and doctors to identify appropriate participants.
      - >-
        Data is collected in the clinic with the assistance of a trained research assistant. A
        research member observed and timed participants during the feasibility study of the app.
      - >-
        Hospital staff were not involved in scheduling but assisted in the logistics of
        coordinating data collection.
  - id: https://b2ai-voice.org/collector/clinicians
    name: Site clinicians and physicians
    role: Diagnosis, clinical validation and oversight
    collector_details:
      - >-
        Clinicians and doctors were listed under the IRB as co-investigators and were added to the
        consortium so that their names are included on consortium-level publications that emerge
        from the research.
      - >-
        At each site, a local clinician provided the diagnosis based on a clinical interview and
        appropriate work-up.
  - id: https://b2ai-voice.org/collector/quality-team
    name: Acoustic engineering and data science team
    role: Quality control and machine learning readiness
    collector_details:
      - >-
        The team hired 2 acoustic engineers and 3 AI data scientists to analyze all samples from
        the Year 1 exploratory data collection phase to ensure acoustic quality and ML readiness
        in terms of data preparation.
      - >-
        In each subsequent year of the study, 10 percent of the data is selected at random every
        month for quality control and ML readiness.

collection_timeframes:
  - id: https://b2ai-voice.org/timeframe/dataset-collection
    name: Dataset collection period
    timeframe_details:
      - The healthsheet states that the data was collected over a period of 12 months.
      - >-
        The IRB protocol describes a prospective cohort study over 4 years, with study duration
        for individual participants of up to 4 years and a phased acquisition plan: Phase 1
        exploratory (completed November 2023), Phase 2 pilot (begun November 2023, ongoing in
        November 2024), Phase 3 expansion, and Phase 4 outreach.
  - id: https://b2ai-voice.org/timeframe/grant-period
    name: Funded project period
    start_date: '2022-09-01'
    end_date: '2026-11-30'
    timeframe_details:
      - >-
        NIH RePORTER records the project start as 2022-09-01 and the project end as 2026-11-30 for
        project number 3OT2OD032720-01S3, core project number OT2OD032720.
  - id: https://b2ai-voice.org/timeframe/app-feasibility-study
    name: App feasibility study period
    start_date: '2023-06-05'
    end_date: '2023-07-28'
    timeframe_details:
      - >-
        A separate feasibility study of the Bridge2AI-Voice application was conducted at the
        University of South Florida Health Voice Center in Tampa, Florida between June 5, 2023 and
        July 28, 2023, enrolling 47 participants over a two-month period. This study assessed the
        app rather than contributing to the released dataset; audio data was not collected at that
        stage of app development.

direct_collection:
  - id: https://b2ai-voice.org/direct-collection/participants
    name: Direct collection from individuals
    is_direct: true
    collection_details:
      - >-
        Asked whether the data was collected from the individuals in question directly or obtained
        via third parties or other sources, the healthsheet answers "Directly".
      - The data was collected in the USA and Canada.
      - >-
        Imaging and clinical data related to diagnosis are collected retrospectively from patient
        charts and the EHR; no additional imaging is performed in the context of the study.

collection_notifications:
  - id: https://b2ai-voice.org/notification/irb-consent-process
    name: Participant notification
    notification_details:
      - >-
        The individuals in question were notified about the data collection; participants went
        through an IRB-approved consent process.
      - >-
        Participants were explicitly informed about the data that was being collected, the methods
        used to secure these data, and the information that would be used for the study.
      - >-
        Where delays occur between consent and data collection, participants are notified of any
        changes to the study and re-consented before data collection.

collection_consents:
  - id: https://b2ai-voice.org/consent/collection
    name: Consent for collection and use
    consent_details:
      - >-
        All participants have been duly informed and agreed to the collection and the use of their
        data via prospective informed consent.
      - >-
        In most cases the consent process takes place in the clinic setting of the recruiting High
        Volume Expert Clinic and is conducted by research assistants; about 30 minutes is spent
        explaining the study and consent in detail, and potential participants are asked to
        explain what they have understood to confirm comprehension.
      - >-
        Consent may also take place remotely through REDCap survey forms, electronically within
        the app, on paper, or through video recording within the app. Video consent displays the
        standard consent document and asks the participant to record themselves reading a
        statement aloud; the recording is used to verify that the acoustic data submitted belongs
        to the consented individual and to distinguish participants from bots.
      - >-
        For longitudinal cohorts, an electronic consent through the app is administered before
        each subsequent data collection to ensure ongoing consent.
      - >-
        Consent details state that research data not containing direct identifiers will be shared
        with external researchers for future research through a secure database; data posing a low
        risk of re-identification will be shared in registered access with the general public; and
        data that would pose a heightened risk if shared in full open access will be shared
        through a controlled access mechanism with authorized researchers.

consent_revocations:
  - id: https://b2ai-voice.org/consent-revocation/withdrawal
    name: Withdrawal and revocation
    revocation_details:
      - >-
        Consenting participants are informed that they may withdraw from the study at any point.
        If a participant chooses to withdraw during or before the voice data collection, their
        data will not be included in the database.
      - >-
        Participants are informed that research data, including voice recordings, cannot be
        removed from the database once the voice data collection process is completed.
      - >-
        For longitudinal data collection, if participants withdraw at any time during the study
        process, the data they have completed will be used in the database, because the purpose of
        the data generation project is to provide a platform and open-source database for future
        research rather than to analyze the data. The minimal requirement for study completion is
        one data collection time-point.
      - >-
        Participants who withdraw have the option to complete a satisfaction survey to better
        understand their reasons for withdrawal; completion is entirely optional and no PHI is
        collected.

raw_data_sources:
  - id: https://b2ai-voice.org/raw-source/audio
    name: Raw audio recordings
    source_description: >-
      Raw audio waveforms captured by the Bridge2AI-Voice applications during acoustic tasks.
      The raw data, post de-identification, is saved in addition to the preprocessed data but is
      not accessible publicly.
    source_type:
      - participant recordings collected under study protocol
    access_details: >-
      Raw audio data is disseminated through controlled access only, to protect participants'
      privacy. Users interested in accessing the audio data from any Bridge2AI-Voice dataset can
      request access by emailing the Data Access Compliance Office at DACO@b2ai-voice.org.
      Institutional sign-off is required, and PhysioNet states that the data will be made
      available via Synapse at https://www.synapse.org/Synapse:syn72370534/ for the adult cohort
      and https://www.synapse.org/Synapse:syn73617068 for the pediatric cohort.
    raw_data_format:
      - >-
        WAV audio organized under a BIDS-style layout as
        sub-<participant_id>/ses-<participant_id>/audio/sub<participant_id>_ses<participant_id>_task-<task_name>.wav
        with an accompanying .json sidecar.
  - id: https://b2ai-voice.org/raw-source/redcap
    name: REDCap and ReproSchema source records
    source_description: >-
      Questionnaire, demographic, confounder, diagnosis and clinical validation records captured
      in REDCap for the adult cohort and in ReproSchema-UI for the pediatric cohort, together with
      clinical data reviewed from site electronic health records.
    source_type:
      - electronic data capture system
      - electronic health record extraction
    access_details: >-
      Identifiable PHI is kept on institutional REDCap databases with password-protected access,
      available only to investigators at the institution where the data was collected. The REDCap
      data dictionary, metadata and instrument PDFs are published at
      https://github.com/eipm/bridge2ai-redcap
    raw_data_format:
      - REDCap exports and ReproSchema-UI outputs, converted to tab-delimited values and to BIDS.

preprocessing_strategies:
  - id: https://b2ai-voice.org/preprocessing/audio-standardization
    name: Audio standardization
    preprocessing_details:
      - >-
        Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a
        Butterworth anti-aliasing filter applied.
  - id: https://b2ai-voice.org/preprocessing/feature-extraction
    name: Derived feature extraction
    preprocessing_details:
      - >-
        Spectrograms: time-frequency representations computed using the short-time Fast Fourier
        Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT, further
        downsampled by a factor of two in the time domain after derivation. Dimension 201xT.
      - >-
        Mel spectrograms of dimension 60xT generated with a 25 ms window, 10 ms hop, 400-point FFT
        and 60 Mel bins; 60 Mel-frequency cepstral coefficients extracted using the same
        parameters.
      - >-
        Articulatory features using the Speech Articulatory Coding (sparc) package, generating
        kinematic traces of vocal tract articulators and source features as well as measures of
        loudness, periodicity and pitch, all gathered at 50 Hz. EMA has dimensions Tx12
        corresponding to X/Y positions of six articulators: tongue dorsum, tongue body, tongue tip,
        lower incisor, upper lip, lower lip.
      - >-
        Phonetic posteriorgrams (PPGs): time-varying categorical distribution over 40 phoneme
        categories at 100 Hz, generated via the ppgs package.
      - >-
        Pitch: torchaudio pitch with min and max pitch of 80 and 500 Hz; sparc pitch estimated
        with a different algorithm over a range of 50-550 Hz.
      - >-
        Acoustic features extracted using OpenSMILE (eGeMAPS per audio file), and phonetic and
        prosodic features computed using Parselmouth and Praat, providing measures of fundamental
        frequency, formants and voice quality. Speech intelligibility metrics are computed for
        speech tasks.
      - >-
        Transcriptions were generated using OpenAI's Whisper Large model.
      - >-
        Waveform-derived features are stored in two formats: a fixed feature format including
        static features extracted from the entire waveform, and a temporal format that varies for
        each audio file depending on the length of the recording.
      - >-
        The v1.1 release used a 512-point FFT for spectrograms; later releases use a 400-point FFT.
  - id: https://b2ai-voice.org/preprocessing/structuring
    name: Structuring and conversion
    preprocessing_details:
      - >-
        The raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported
        from REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0.
      - >-
        Pediatric data collected through ReproSchema-UI is extracted and transformed into REDCap
        format, and subsequently converted to the Brain Imaging Data Structure.
      - >-
        Data were exported and converted from REDCap using an open source library developed by the
        team; the v3.0.0 release was generated with b2aiprep v3.0.0.
  - id: https://b2ai-voice.org/preprocessing/deidentification-preprocessing
    name: De-identification preprocessing
    preprocessing_details:
      - >-
        Asked whether there was any pre-processing for de-identification of patients, the
        healthsheet answers yes: the data were extracted from the raw audio to limit
        re-identification and only the extracted features are released with the dataset.
      - >-
        No instances were excluded from the dataset at the time of preprocessing.

cleaning_strategies:
  - id: https://b2ai-voice.org/cleaning/none-reported
    name: Data cleaning
    cleaning_details:
      - >-
        Asked whether there was any pre-processing for cleaning the data, the healthsheet answers
        "No".
  - id: https://b2ai-voice.org/cleaning/audit-protocol
    name: Audit and quality control protocol
    cleaning_details:
      - Generate missingness tables.
      - Check distributions and outliers.
      - For categorical responses, check against schema.
      - >-
        For audio tasks, run quality control metrics; for waveforms check the amount of silence and
        duration, and for speech check produced speech relative to the intended passage.
      - >-
        All processing is performed using b2aiprep for organizing and preprocessing the dataset and
        SenseLab for processing audio files for research tasks.
      - >-
        In the event that a caregiver's voice is recorded inadvertently, the clips can be discarded
        either by re-recording manually during data collection or during data audit and
        postprocessing.

labeling_strategies:
  - id: https://b2ai-voice.org/labeling/clinical-gold-standard
    name: Clinical gold standard labeling
    data_annotation_platform:
      - REDCap, used to record diagnosis, clinical validation and questionnaire data.
      - >-
        ReproSchema-UI, used for pediatric questionnaire and recording data collection.
    data_annotation_protocol:
      - >-
        Labels are diagnostic categories such as vocal pathologies, neurological disorders,
        psychiatric conditions and respiratory disorders.
      - >-
        The labeling strategy is a gold standard label available in the data, diagnosed by a
        clinician. At each site, a local clinician provided the diagnosis based on a clinical
        interview and appropriate work-up. For the psychiatric disorders cohort, the assessment
        was determined using the participant's EHR record or an active prescription, performed
        outside of data collection by an appropriately licensed clinician.
      - Labelers followed Bridge2AI protocols and ICD-10 codes.
      - >-
        Per-diagnosis gold standard validation methods are specified, including laryngoscopy
        images and stroboscopy videos for voice disorders, spirometry and flow volume loops and CT
        scans for respiratory disorders, CT brain, MRI brain and whole genome sequencing for
        neurological disorders, and electronic health summary, psychiatrist diagnosis or
        medication history for mood and psychiatric disorders.
    annotations_per_item: 1
    inter_annotator_agreement: >-
      A single labeler is used per data item, so no inter-annotator agreement statistic is
      reported.
    annotator_demographics:
      - >-
        Typically the clinician at the site of data collection, or a clinician external to the
        study for a prior diagnostic assessment.
    labeling_details:
      - >-
        Human-level performance in the applications the dataset is supposed to address is reported
        to vary widely.
      - >-
        The process for any new labels should be described alongside any release of a model or
        publication, and should include the exact variables used for that determination.

raw_sources:
  - id: https://b2ai-voice.org/raw-data/retained-audio
    name: Retained raw audio
    access_url: https://www.synapse.org/Synapse:syn72370534/
    raw_data_details:
      - >-
        The raw data, post de-identification, is saved in addition to the preprocessed and cleaned
        data; it is saved and is not accessible publicly.
      - >-
        Raw audio transcripts were reviewed and any audio recordings that contained potentially
        identifying information or external voices were removed from the release.
      - >-
        For the pediatric v1.1 release, audio features for all free speech tasks were manually
        checked for the presence of unconsented speakers and personally identifiable information
        before release.

machine_annotation_tools:
  - id: https://b2ai-voice.org/tools/processing-stack
    name: Automated processing and annotation tools
    tools:
      - b2aiprep
      - SenseLab
      - OpenAI Whisper Large
      - OpenSMILE
      - Praat
      - Parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - ppgs
    tool_descriptions:
      - >-
        b2aiprep organizes and preprocesses the dataset, converting raw audio waveforms into
        parquet files and merging source data into the phenotype files; available at
        https://github.com/sensein/b2aiprep and released as the B2Ai-Voice Prep Library under the
        Apache-2.0 license.
      - >-
        SenseLab processes audio files for research tasks; available at
        https://github.com/sensein/senselab
      - OpenAI Whisper Large generated the transcriptions.
      - >-
        OpenSMILE (Speech and Music Interpretation by Large-space Extraction) extracts acoustic
        features capturing temporal dynamics and acoustic characteristics, including eGeMAPS
        features per audio file.
      - >-
        Praat and Parselmouth compute phonetic and prosodic features providing measures of
        fundamental frequency, formants and voice quality.
      - >-
        torchaudio produces pitch contours, spectrograms, Mel spectrograms and MFCCs.
      - >-
        The sparc package generates kinematic traces of vocal tract articulators and source
        features including EMA estimates, loudness, periodicity and pitch.
      - >-
        The ppgs package generates phonetic posteriorgrams over 40 phoneme categories.
    tool_accuracy:
      - >-
        Certain aspects of the data, for example transcription, were generated using off-the-shelf
        models that have not been audited for correctness.
    used_software:
      - id: https://github.com/sensein/b2aiprep
        name: b2aiprep
        description: >-
          Bridge2AI data processing library used to organize and preprocess the dataset. Cited as
          Bevers, I., Ghosh, S., Johnson, A., Brito, R., Bedrick, S., Catania, F., & Ng, E.,
          b2aiprep library, and as Johnson, A., Bevers, I., Ng, E., Wilke, J., Brito, R., Bedrick,
          S., Catania, F. & Ghosh, S. (2025), Bridge2AI Data Processing Library.
        version: 3.0.0
        license: Apache-2.0
        url: https://github.com/sensein/b2aiprep
      - id: https://github.com/sensein/senselab
        name: SenseLab
        description: Library used for processing audio files for research tasks.
        url: https://github.com/sensein/senselab

existing_uses:
  - id: https://b2ai-voice.org/existing-use/summer-school
    name: Bridge2AI Summer School and hackathon
    examples:
      - >-
        A restricted version of the dataset containing raw audio has been used in the Bridge2AI
        Summer School and hackathon.
    description: >-
      This is the only prior use of the dataset reported in the project documentation at the time
      of the healthsheet.

use_repository:
  - id: https://b2ai-voice.org/use-repository/none
    name: Use-tracking repository
    repository_details:
      - >-
        Asked whether there is a repository that links to any or all papers or systems that use
        the dataset, besides Google Scholar, the healthsheet answers "No".
      - >-
        Use of the dataset requires citation: users are directed to cite Bensoussan, Yael, et al.
        "Developing Multi-Disorder Voice Protocols: A team science approach involving clinical
        expertise, bioethics, standards, and DEI." Proc. Interspeech 2024,
        https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html

other_tasks:
  - id: https://b2ai-voice.org/other-task/developmental-norms
    name: Study of pediatric developmental norms
    task_details:
      - >-
        Resources such as the pediatric project are intended to enable study of developmental
        norms, create AI-driven tools for early screening, and support clinical insight.
  - id: https://b2ai-voice.org/other-task/standards-development
    name: Bioinformatics standards and multi-omic integration
    task_details:
      - >-
        The consortium aims to create new bioinformatics standards for voice data to enable
        interoperability, to create benchmarks of diversity metrics and minimize risk of
        algorithmic bias, and to develop infrastructure for audiomics data storage and sharing
        within and across research institutions.
      - >-
        Audiomics is expected to be integrated in multi-omics efforts, in which audio data are
        analyzed together with other health data such as clinical, imaging and genomic data for
        improved accuracy.

future_use_impacts:
  - id: https://b2ai-voice.org/future-impact/skews
    name: Impact of dataset skews on future uses
    impact_details:
      - >-
        The dataset has skews based on disorder category, site, and other demographic factors.
        Users should consider the multivariate distribution when assessing utility for different
        questions.
      - >-
        Factors that might limit generalization of derived models include the number and diversity
        of devices, recording specificities, the number and diversity of recording sites (five),
        and distribution shifts over time from changes in diagnostic criteria or practices.
  - id: https://b2ai-voice.org/future-impact/reidentification
    name: Voice re-identification risk
    impact_details:
      - >-
        Even when removing all HIPAA-protected information associated with the participant who
        provides the voice sample, each person's voice is unique to them and their health at that
        time in their life, and it is always possible, even if unlikely, that someone could
        recognize the participant's voice, because a voice can never be fully de-identified.
      - >-
        The ethical and legal challenges in audiomics linked to the Health Insurance Portability
        and Accountability Act, potential reidentification of patients by their voice, voice
        hacking, and data ownership call for a new governance framework for issues concerning
        diversity, data handling, and privacy safeguards.

discouraged_uses:
  - id: https://b2ai-voice.org/discouraged/non-research-applications
    name: Non-research and adverse-decision applications
    discouragement_details:
      - >-
        The dataset should not be used for non-research or non-clinical applications such as
        hiring decisions, insurance premium adjustments, or any form of surveillance that could
        lead to discrimination or harm.
      - >-
        These discouraged uses are intended to prevent unethical or biased outcomes that could
        negatively impact individuals based on their health conditions or voice characteristics.
        The dataset is intended strictly for research that prioritizes patient safety, privacy,
        and ethical use.

intended_uses:
  - id: https://b2ai-voice.org/intended-use/clinical-ml
    name: Clinical machine-learning research
    use_category:
      - research
      - clinical machine-learning model development
    examples:
      - >-
        Development, benchmarking or validation of clinically applicable machine-learning models
        for diagnosing a wide range of health conditions using voice data, including vocal
        pathologies, neurological, psychiatric, respiratory and pediatric voice disorders.
      - AI model pretraining, fine-tuning, benchmarking, or validation.
      - >-
        Support for clinical research in disease screening, diagnosis and monitoring through voice
        biomarkers.
    usage_notes: >-
      The Bridge2AI Voice dataset is primarily intended for research applications, specifically in
      the development of AI and machine-learning models for healthcare. The dataset is intended
      solely for commercial and non-commercial research purposes by Authorized Researchers as
      defined in the Registered Data Access Agreement. This dataset contains voice recordings and
      key metadata and is structured to be Findable, Accessible, Interoperable, and Reusable
      (FAIR).

prohibited_uses:
  - id: https://b2ai-voice.org/prohibited/reidentification
    name: Re-identification of participants
    prohibition_reason:
      - >-
        The dataset is not to be used to attempt to re-identify research participants, nor for any
        actions that could reasonably lead to re-identification.
      - >-
        Under the Data Transfer and Use Agreement, the Recipient will not use the Data, either
        alone or in concert with any other information, to make any effort to contact individuals
        who are the subjects of the Data without appropriate IRB approval, specific written
        approval from the Provider, and informed consent from the individual, if required.
  - id: https://b2ai-voice.org/prohibited/harm-or-stigmatization
    name: Uses causing harm or stigmatization
    prohibition_reason:
      - >-
        The dataset is not to be used for any purpose that could foreseeably cause harm or
        stigmatization to research participants, their families, communities, or specific
        populations.
  - id: https://b2ai-voice.org/prohibited/access-restricting-ip
    name: Access-restricting intellectual property claims
    prohibition_reason:
      - >-
        Intellectual property protections, database rights, or related rights may not be used in a
        manner that restricts or limits access to any part of the dataset or to any conclusions
        derived from it. This restriction ensures that future use of the dataset remains
        unrestricted, in alignment with the Open Science principles upheld by the B2AI-Voice
        Consortium.
      - >-
        Users agree not to make intellectual property claims on the Data and to implement
        licensing policies that will not obstruct further research, and to respect the Fort
        Lauderdale Agreement.
  - id: https://b2ai-voice.org/prohibited/resale-and-redistribution
    name: Sale and unauthorized redistribution
    prohibition_reason:
      - >-
        Sale of all or part of the Data on any media is not permitted. Duplication, as reasonably
        required to carry out the Research Project with the Data, is nonetheless permitted.
      - >-
        Collaborators at other research organizations, and other research teams at the same
        organization, must apply independently for access to the Data and sign a Data Transfer and
        Use Agreement with the Provider before accessing the data.

