id: d4d:CM4AI
name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI) Data Releases
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project (also described in the source documents as the Functional Genomics Grand Challenge)
  of the U.S. National Institutes of Health Bridge to Artificial Intelligence (Bridge2AI)
  program. Its stated mission is "to produce ethical, AI-ready datasets of cell architecture,
  inferred from multimodal data collected for human cell lines, to enable transformative
  biomedical AI research." CM4AI's objective is to deliver machine-readable hierarchical maps
  of cell architecture as AI-Ready data produced from multimodal interrogation of 100 chromatin
  modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac
  disorders in disease-relevant cell lines under perturbed and unperturbed conditions, using
  mass spectrometry based proteomics, spatial proteomics / cell imaging, and genetic
  perturbations using CRISPR/Cas9.

  This record describes the CM4AI data release programme: the quarterly, publicly archived
  data releases deposited in LibraData, the University of Virginia's instance of Dataverse
  (an NIH-approved generalist repository). Each release is enumerated under `resources`.
  Input data streams comprise affinity purification mass spectrometry (AP-MS) and size
  exclusion chromatography mass spectrometry (SEC-MS) protein-protein interaction data,
  immunofluorescence (IF) subcellular imaging for spatial proteomics, and single-cell
  CRISPR/CRISPRi perturbation (perturb-seq) screens. Cell lines under investigation are the
  triple-negative breast cancer line MDA-MB-468 (treated with paclitaxel or vorinostat versus
  untreated) and the induced pluripotent stem cell line KOLF2.1J (undifferentiated versus
  iPSC-derived neural progenitor cells, neurons, and cardiomyocytes). Outputs are packaged
  with provenance graphs and rich metadata as AI-Ready datasets in RO-Crate format using an
  extended, client-server version of the FAIRSCAPE framework.

  The source documents give two different institutional lists for the collaboration. The CM4AI
  data-releases page states that CM4AI "is a collaboration of UCSD, UCSF, Stanford, UVA, Yale,
  UT Austin, UA Birmingham, Simon Fraser University, and the Hastings Center, as part of the
  NIH Bridge2AI program." The March 2025, June 2025 and later Dataverse release descriptions
  state "CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UA Birmingham, Simon
  Fraser University, and the Hastings Center" (without UT Austin). Both statements are
  recorded here as they appear.

  The CM4AI portal reports the following aggregate "Data Insights" figures: 1,374 protein
  interactions; 53,788 immunofluorescent images; 7,023 total proteins investigated; 11,739
  genes targeted; 21.4 TB data volume.

  Both the CM4AI portal and the University of Virginia Dataverse collection display the
  notice: "This repository is under review for potential modification in compliance with
  Administration directives."
