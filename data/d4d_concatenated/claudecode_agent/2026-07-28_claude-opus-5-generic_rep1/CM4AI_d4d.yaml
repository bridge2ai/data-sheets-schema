purposes:
  - id: d4d:CM4AI_purpose_mission
    name: CM4AI mission
    response: >-
      "Its overarching mission is to produce ethical, AI-ready datasets of cell architecture,
      inferred from multimodal data collected for human cell lines, to enable transformative
      biomedical AI research."
  - id: d4d:CM4AI_purpose_objective
    name: CM4AI objective
    response: >-
      "CM4AI's objective is to deliver machine-readable hierarchical maps of cell architecture
      as AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers and
      100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders in
      disease-relevant cell lines under perturbed and unperturbed conditions, utilizing
      state-of-the-art mass spectrometry based proteomics, spatial proteomics / cell imaging,
      and genetic perturbations using CRISPR."
  - id: d4d:CM4AI_purpose_nih_project
    name: NIH RePORTER project purpose
    response: >-
      "As part of the NIH Common Fund's Bridge2AI program, the CM4AI data generation project
      seeks to map the spatiotemporal architecture of human cells and use these maps toward the
      grand challenge of interpretable genotype-phenotype learning." The project also states it
      "will implement a standards data management approach based on FAIR access and software
      principles, with deep provenance and replication packages for representation of cell maps
      and their underlying datasets; initiate a research program in ethical AI, especially as it
      relates to how maps will be used in genomic medicine and model interpretation; and
      stimulate a diverse portfolio of training opportunities in the emerging field of
      biomachine learning."
  - id: d4d:CM4AI_purpose_strategic
    name: Strategic aim
    response: >-
      "At a strategic level, CM4AI - as do other Bridge2AI DGPs - aims to ethically leverage the
      most state-of-the art computational and experimental tools in biomedical science to enable
      a new generation of transformative artificial intelligence research to benefit humanity.
      Its datasets and software are available to the research community under minimally
      restrictive terms consistent with ethical guidelines, researcher attribution, and research
      integrity."

tasks:
  - id: d4d:CM4AI_task_genotype_phenotype
    name: Interpretable genotype-phenotype learning
    response: >-
      Supporting the "grand challenge of interpretable genotype-phenotype learning" by providing
      matched data and tools that enable "visible" machine learning systems built directly on
      knowledge maps of cell and tissue architecture, rather than difficult-to-interpret "black
      box" models.
  - id: d4d:CM4AI_task_cell_maps
    name: Construction of multiscale cell maps
    response: >-
      Producing hierarchical directed acyclic graph cell maps in which each node represents an
      assembly of proteins in proximity at a given scale, from large assemblies representing cell
      compartments (for example nucleus, mitochondria) to small assemblies of proteins in close
      proximity (for example protein complexes or subunits), by integrating localization and
      interaction data with self-supervised embedding and multi-resolution community detection.
  - id: d4d:CM4AI_task_ai_ready_packaging
    name: AI-readiness packaging
    response: >-
      Producing FAIR, provenanced, characterized, explainable and ethical AI-Ready data packages
      in RO-Crate format via the FAIRSCAPE framework, with persistent resolvable identifiers and
      machine-readable provenance graphs.

addressing_gaps:
  - id: d4d:CM4AI_gap_black_box
    name: Black-box machine learning in genomics
    response: >-
      "In genomics and precision medicine, machine learning models are often 'black boxes,'
      predicting phenotypes from genotypes without understanding the mechanisms by which such
      translation occurs. To address this deficiency, project will launch a coordinated effort
      involving three complementary mapping approaches - proteomic mass spectrometry, cellular
      imaging, and genetic perturbation via CRISPR/Cas9 - creating a library of large-scale maps
      of cellular structure/function across demographic and disease contexts."
  - id: d4d:CM4AI_gap_uncharted_architecture
    name: Incomplete knowledge of protein organization in cells
    response: >-
      "Although the basic sequence of the human genome has been known for over two decades,
      knowledge of how its proteins are organized within cells is still very much evolving."
  - id: d4d:CM4AI_gap_ai_ready_data
    name: Lack of ethical, FAIR, AI-ready biomedical data
    response: >-
      The project defines AI-Ready biomedical data as "fully characterized FAIR data of known
      provenance, which can be ethically and reliably processed by AI applications; whose models
      and software are available and well-described for validation and re-use; and whose
      predictions may be fully explained and interpreted to the user as needed", and builds an
      expanded FAIRSCAPE framework to supply the FAIRness, provenance and characterization that
      such data require.
  - id: d4d:CM4AI_gap_workforce
    name: Gaps in the biomedical AI/ML workforce
    response: >-
      "The Skills and Workforce Development module works to enhance the biomedical AI/ML
      workforce by recruiting and training a diverse group of participants in the scientific
      approach, data standards, and tools that can be used to accelerate innovation from CM4AI.
      To recruit and prepare a biomedical workforce that is adept at both the data and life
      sciences, new training that will allow researchers to leverage the data sets produced by
      Bridge2AI and other programs is needed."

