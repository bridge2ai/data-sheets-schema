    contact_person: https://orcid.org/0000-0002-8965-8153
    reviewing_organization: d4d:org_SFU
    review_details:
      - >-
        "Ethical Review: ... Jean-Christophe Belisle-Pipon
        (jean-christophe_belisle-pipon@sfu.ca)", listed in the Data Governance and Ethics section
        of the June 2025, October 2025 and June 2026 Dataverse releases. ORCID
        0000-0002-8965-8153; Simon Fraser University.
  - id: d4d:CM4AI_ethics_module
    name: CM4AI Ethics module and data governance
    review_details:
      - >-
        "The Ethics team worked closely with Data Acquisition, Tools, and Standards Modules to
        develop a plan for ethical preparation, licensing, dissemination, and Data Access
        supervision of CM4AI datasets. This plan balances the openness of the data produced, with
        protection of the intellectual property, and supervision and monitoring of potential
        efforts at commercialization."
      - >-
        "The Ethics team employs a methodology inspired by Value-Sensitive Design (VSD),
        facilitating the creation of normative standards and expectations aimed at ensuring the
        responsible design of datasets and AI technologies, in alignment with core values. This
        entails the Ethics team engaging in conceptual efforts to craft an axiological repository -
        a repository of values - to guide the articulation of design standards and expectations."
      - >-
        "the Ethics team is instrumental in formulating the CM4AI Life Cycle, a framework designed
        to elucidate governance milestones throughout the data generation and AI system development
        processes."
      - >-
        "The Ethics Pillar also supported the work initiated by the Bridge2AI Ethics Working Group
        for supporting the Bridge2AI Data Sharing and Dissemination Working Group in developing a
        Code of Conduct. The Code of Conduct outlines basic requirements for participants in the
        Bridge2AI Open House to access B2AI data (including CM4AI datasets), to attest and commit
        to it prior to accessing the data."
      - >-
        "A Data Access Committee will supervise ethical matters related to dataset distribution and
        potential dual licensing for commercial use."

