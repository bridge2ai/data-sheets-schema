    description: >-
      The source bundle includes the open-access publication Schaffer LV, Hu M, Qian G, et al.
      "Multimodal cell maps as a foundation for structural and functional genomics", Nature 642,
      222-231 (2025), https://doi.org/10.1038/s41586-025-08878-3 (received 03 June 2024, accepted
      10 March 2025, published 09 April 2025; a Publisher Correction was published 02 October 2025,
      https://doi.org/10.1038/s41586-025-09648-x). Its acknowledgements record funding from "the
      Bridge2AI Program (NIH Common Fund; OT2 OD032742; T.I., E.L., A.S.)", the same core award as
      CM4AI. That study constructs a map of human subcellular architecture in U2OS osteosarcoma
      cells and is a distinct resource from the CM4AI Dataverse data releases described in this
      record; its data are listed here as an external resource and are not merged into the CM4AI
      release descriptions. Its stated data availability is: the U2OS cell map at
      https://ndexbio.org under uuid f693137a-d2d7-11ef-8e41-005056ae3c32; protein assemblies at the
      EBI Protein Complex Portal under query CLO:0009454; AP-MS protein interaction data at
      https://ndexbio.org under uuid 95bc75d5-d1d1-11ee-8a40-005056ae23aa; AP-MS raw MS files at
      MassIVE under MSV000097168; the image dataset in the Human Protein Atlas v23 release; SEC-MS
      raw MS files and search results at ProteomeXchange under PXD052362; structural models at the
      ModelArchive Database with identifiers ma-idk-u2osmap and ma-m5og4. Its code availability
      statement gives the Cell Mapping Toolkit at https://github.com/idekerlab/cellmaps_pipeline,
      linked through the Multiscale Integrated Cell web portal at
      https://musicmaps.ai/u2os-cellmap. That article is licensed under a Creative Commons
      Attribution 4.0 International License.
    external_resources:
      - https://doi.org/10.1038/s41586-025-08878-3
      - http://musicmaps.ai/u2os-cellmap/
      - https://ndexbio.org
      - https://www.ebi.ac.uk/complexportal
      - https://modelarchive.org
      - https://github.com/idekerlab/cellmaps_pipeline
    archival: true

