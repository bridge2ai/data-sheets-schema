        Training and workforce development: the in-person internship is intended to teach "1) the
        impact of cell maps on biomedical research applications, 2) how to interact with the data
        and standards used by CM4AI, 3) how to develop a visible neural network using cell maps,
        and 4) how to integrate external data into an existing cell map for the ethical development
        of AI/ML applications."

