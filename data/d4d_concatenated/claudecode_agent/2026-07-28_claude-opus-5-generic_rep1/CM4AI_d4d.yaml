preprocessing_strategies:
  - id: d4d:CM4AI_preprocessing_music
    name: MuSIC data integration pipeline
    description: >-
      The Tools Module maintains the Multi-Scale Integrated Cell (MuSIC) pipeline, "which produces
      integrated cell maps from the multiple, multi-modal input data streams. The MuSIC pipeline is
      divided into multiple segments, each of which calls the FAIRSCAPE client package to validate
      inputs and create the output RO-Crate package for that segment."
    preprocessing_details:
      - >-
        "Download PPI and Image Data - PPI networks for the cell line and conditions are downloaded
        from the Krogan Laboratory's deposition archive and made available for further processing.
        IF images for the cell line and conditions are downloaded from the Lundberg Laboratory's
        deposition archive and made available for further processing."
      - >-
        "Generate embeddings - Downloaded PPI networks are processed using the node2vec deep
        learning model to reduce dimensionality, producing a PPI embedding that contains
        information about the protein's interactions. IF images are processed using a Human Protein
        Atlas deep learning model to reduce dimensionality, producing an image embedding that
        contains information about protein localization."
      - >-
        "Co-Embedding - The PPI and image embeddings are integrated to obtain a co-embedding for
        each protein using contrastive deep learning. This integration model learns co-embeddings
        such that the original embeddings can be reconstructed with minimal information loss and
        proteins with similar PPI and image embeddings have similar co-embeddings."
      - >-
        "Protein Community Detection and Hierarchy Creation - Community detection is performed
        based on the all-by-all similarities of pairs of proteins in the co-embedding space. The
        resulting hierarchy of protein communities is output as the final cell map."
      - >-
        "Hierarchy evaluation - Cell maps are annotated in a two pronged approach. First, cell maps
        are aligned to known protein function and pathway resources, including the Gene Ontology
        (GO) and Reactome, to determine protein assemblies in the cell map with high overlap with
        known cell biology. Second, assemblies in the cell maps are annotated using a large
        language model (LLM) approach that we developed to name sets of proteins and assign a name
        confidence score."
      - >-
        "Integrative structure modeling - We are currently exploring the feasibility of integrative
        structure modeling of the MuSIC communities", ranking communities by available structural
        information from the Protein Data Bank, AlphaFold Protein Structure Database, crosslinking
        mass spectrometry and disorder prediction, and modelling top-ranked communities with the
        Integrative Modeling Platform (IMP) version 2.18 via the Python Modeling Interface.
    used_software:
      - id: d4d:software_music_pipeline
        name: Multi-Scale Integrated Cell (MuSIC) pipeline
        description: >-
          CM4AI Tools Module dataset integration and map production system. "All CM4AI integration
          and packaging software is freely available and licensed under nonrestrictive open-source
          licenses." "Software comprising the Tools data integration pipeline is available under
          BSD-3 open source license in GitHub (for alpha level tools) or in the Zenodo long-term
          archive (for production-ready tools)."
        license: BSD-3
      - id: d4d:software_node2vec
        name: node2vec
        description: Deep learning model used to embed downloaded PPI networks.
      - id: d4d:software_hpa_image_model
        name: Human Protein Atlas image deep learning model
        description: >-
          Deep learning model used to reduce the dimensionality of IF images, producing an image
          embedding containing information about protein localization.
      - id: d4d:software_imp
        name: Integrative Modeling Platform (IMP)
        description: >-
          "our open-source Integrative Modeling Platform (IMP) package version 2.18
          (https://integrativemodeling.org)", scripted through the Python Modeling Interface
          package.
        version: '2.18'
        url: http://integrativemodeling.org
  - id: d4d:CM4AI_preprocessing_fairscape
    name: FAIRSCAPE AI-readiness packaging
    description: >-
      "The Standards Module of CM4AI is responsible for AI-Readiness packaging of data, software,
      metadata and provenance graphs. This task is performed by the FAIRSCAPE framework."
    preprocessing_details:
      - >-
        "The client-side package, FAIRSCAPE-CLI, is called when any computation or coherent set of
        computations in the pipeline is completed, and it is passed metadata which defines schemas
        in JSON-Schema for the datasets in the computational unit, as well as the inputs,
        computations, software, models, and outputs. FAIRSCAPE-CLI creates an RO-Crate package with
        the datasets, metadata, and software - or resolvable references to these components - and
        unique stubs for identifier creation on each of these components."
      - >-
        "The RO-Crates are then sent to the FAIRSCAPE server where they are registered and assigned
        persistent, resolvable, globally unique persistent identifiers (PIDs). The RO-Crates are
        then decomposed into their individual components - datasets, models, software - which are
        also registered and assigned PIDs. The PID system currently in use is the ARK scheme - with
        DOIs a future feature as supplementary PIDs for final-state publishable work."
      - >-
        "Lastly, the server computes end-to-end entailments on each RO-Crate's provenance as
        expressed in the EVI Evidence Graph Ontology and links them together where possible. ...
        Alternate views serialized in JSON-LD and in RDF-XML are also provided on the landing
        page."
      - >-
        Present AI-readiness features comprise "(a) establishing FAIRness including rich metadata
        and persistent, globally unique identifiers; (b) computing a machine-readable provenance
        graph, resolvable as metadata for all results, including inputs, computations, software,
        and outputs; and (c) characterizing and validating all datasets and data elements, and
        mapping data elements to public ontology vocabularies, where appropriate, using
        JSON-Schema mini-data-dictionary descriptions resolvable from the provenance graph
        metadata."
    used_software:
      - id: d4d:software_fairscape
        name: FAIRSCAPE
        description: >-
          "FAIRSCAPE consists of a client-side Python3 application, called either from the command
          line or as a set of Python functions by the Tools Module's data integration pipeline, and
          a server application, also in Python3, which completes the packaging." "The FAIRSCAPE
          AI-readiness framework is described with a tutorial and instructions for installation at
          https://fairscape.github.io. Copyright (c) 2024 to this software is held by the Rector
          and Board of Visitors of the University of Virginia. It is available under open source
          MIT License."
        license: MIT
        url: https://fairscape.github.io

cleaning_strategies:
  - id: d4d:CM4AI_cleaning_qc
    name: Quality control of perturbation screen data
    cleaning_details:
      - >-
        Of the Year 1 single-cell CRISPR screens in MDA-MB-468 and undifferentiated KOLF2.1J
        iPSCs, the project preprint states: "The resulting data are currently being QCed."
      - >-
        FAIRSCAPE-CLI "is called when any computation or coherent set of computations in the
        pipeline is completed", and the client package is used "to validate inputs and create the
        output RO-Crate package for that segment"; the Standards Module "established FAIR
        AI-Readiness metadata and validation toolkits, which have been used to package and release
        our cell-line perturbation and measurement data."

labeling_strategies:
  - id: d4d:CM4AI_labeling_llm
    name: LLM-assisted assembly annotation
    data_annotation_protocol:
      - >-
        "assemblies in the cell maps are annotated using a large language model (LLM) approach that
        we developed to name sets of proteins and assign a name confidence score."
    labeling_details:
      - >-
        Cell map annotation is described as a two-pronged approach: alignment to known protein
        function and pathway resources including the Gene Ontology (GO) and Reactome to identify
        assemblies with high overlap with known cell biology, followed by LLM-based naming with a
        confidence score.

machine_annotation_tools:
  - id: d4d:CM4AI_annotation_tools
    name: Machine annotation and integration tools
    tools:
      - node2vec
      - Human Protein Atlas image deep learning model
      - Contrastive deep learning co-embedding model
      - Multi-resolution community detection
      - Large language model assembly naming
      - FAIRSCAPE-CLI
    tool_descriptions:
      - >-
        node2vec is used to reduce the dimensionality of PPI networks into a protein interaction
        embedding.
      - >-
        A Human Protein Atlas deep learning model reduces IF images to an image embedding capturing
        protein localization.
      - >-
        A contrastive deep learning model integrates the two embeddings into a per-protein
        co-embedding, followed by community detection over all-by-all protein similarities to build
        the assembly hierarchy.
      - >-
        A large language model names sets of proteins and assigns a name confidence score during
        hierarchy evaluation.
      - >-
        FAIRSCAPE-CLI packages datasets, metadata and software into RO-Crates with JSON-Schema
        data dictionaries and identifier stubs.

