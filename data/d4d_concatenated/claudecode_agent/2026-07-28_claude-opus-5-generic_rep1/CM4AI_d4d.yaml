instances:
  - id: d4d:CM4AI_instance_if_images
    name: Immunofluorescence subcellular images
    instance_type: >-
      Confocal immunofluorescence (ICC-IF) image of a cultured human cell line, with four
      stained channels
    description: >-
      "This data set displays the spatial localization of ... proteins of interest in cells of
      the breast cancer cell line MDA-MB-468 ... as imaged by immunofluorescence-based staining
      (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford University, as part of the
      Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org) project. Nuclei were stained with
      DAPI (blue channel); endoplasmic reticulum with a calreticulin antibody (yellow channel);
      microtubules with tubulin antibody (red channel); and antibody against protein of interest
      (green channel)." The stated protein coverage differs between releases and between the
      portal and the archive: the March 2025 release file descriptions state 563 proteins of
      interest per treatment condition; the June 2025, October 2025 and June 2026 release file
      descriptions state 464 proteins of interest per treatment condition; the CM4AI
      data-releases page states "IF images for 523 proteins" among the curated TNBC datasets.
      The CM4AI portal reports 53,788 immunofluorescent images in total.
    counts: 53788
    label: false
  - id: d4d:CM4AI_instance_secms
    name: SEC-MS protein elution datasets
    instance_type: Size exclusion chromatography mass spectrometry (SEC-MS) protein dataset
    description: >-
      SEC-MS data "generated by size exclusion chromatography-mass spectroscopy (SEC-MS) on
      undifferentiated KOLF2.1J human induced pluripotent stem cells (hiPSCs), in the Nevan
      Krogan laboratory at the University of California San Francisco" and, for the cancer line,
      "generated by size exclusion chromatography-mass spectroscopy (SEC-MS) following the
      treatment of vorinostat or paclitaxel on MDA-MB468 human breast cancer cells, in the Nevan
      Krogan laboratory at the University of California San Francisco". The CM4AI data-releases
      page states SEC-MS captures approximately 7,000 proteins for both the iPSC-derived and the
      TNBC curated datasets. The project preprint reports that SEC-MS on MDA-MB-468 under three
      conditions identified 72 of 100 chromatin modifiers, 52 of them integral components of
      protein complexes, detected PPI profiles of over a thousand complexes, and that SEC-MS in
      KOLF2 iPSCs and derivatives uncovered more than 700 protein complexes in both parental
      iPSCs and differentiated neurons.
    label: false
  - id: d4d:CM4AI_instance_perturbseq
    name: CRISPRi perturb-seq single-cell transcriptomes
    instance_type: Single-cell CRISPRi perturbation sequencing (perturb-seq) dataset
    description: >-
      "This dataset represents an expressed genome-scale CRISPRi Perturbation Cell Atlas in
      undifferentiated KOLF2.1J human induced pluripotent stem cells (hiPSCs) mapping
      transcriptional and fitness phenotypes associated with 11,739 targeted genes, as part of
      the Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org) Functional Genomics Grand
      Challenge, a component of the U.S. National Institute of Health's (NIH) Bridge2AI program.
      We validated these findings via phenotypic, protein-interaction, and metabolic tracing
      assays." Raw sequence data for the same atlas are released separately. The CM4AI
      data-releases page states perturb-seq of more than 11,000 genes (whole-genome) for the
      iPSC-derived curated datasets and perturb-seq of 200 genes for the TNBC curated datasets.
      The project preprint describes single-cell CRISPR screens perturbing 100 chromatin
      regulators in MDA-MB-468 under three conditions and in undifferentiated KOLF2.1J iPSCs,
      using a CRISPR lentiviral library with 6 guide RNAs per gene and the 10x Genomics 3'HT kit.
    counts: 11739
    label: false
  - id: d4d:CM4AI_instance_apms
    name: AP-MS interactome datasets
    instance_type: Affinity purification mass spectrometry (AP-MS) protein interaction dataset
    description: >-
      AP-MS data for MDA-MB-468 breast cancer cells with treatment were added in the June 2026
      Data Release as cm4ai_apms_MDA-MB-468_paclitaxel.zip and
      cm4ai_apms_MDA-MB-468_vorinostat.zip. The project preprint states that 17 genes had been
      endogenously tagged in MDA-MB-468 with AP-MS data acquired under three conditions
      (untreated, paclitaxel and vorinostat treated), with 34 additional genes being tagged at
      the time of writing. The CM4AI portal reports 1,374 protein interactions and 7,023 total
      proteins investigated.
    label: false

relationships:
  - id: d4d:CM4AI_relationships_modalities
    name: Relationships between data modalities
    relationship_details:
      - >-
        Input data streams are integrated by the Multi-Scale Integrated Cell (MuSIC) software
        pipeline: protein-protein interaction and immunofluorescence image data are separately
        embedded, co-embedded by contrastive deep learning, and then subjected to multi-resolution
        community detection to produce a hierarchy of protein assemblies output as the final cell
        map.
      - >-
        The release metadata states that "Protein-protein interaction (SEC-MS), protein
        localization (IF imaging), and CRISPRi perturbSeq data interrogate sets of proteins which
        incompletely overlap."
      - >-
        Data are organized by cell line and treatment or differentiation condition: MDA-MB-468
        untreated, paclitaxel-treated and vorinostat-treated; KOLF2.1J undifferentiated
        (parental) and iPSC-derived neural progenitor cells, neurons and cardiomyocytes.

acquisition_methods:
  - id: d4d:CM4AI_acquisition
    name: Instance acquisition
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    acquisition_details:
      - >-
        All released instances are laboratory measurements generated by the CM4AI Data
        Acquisition module on cultured human cell lines: AP-MS and SEC-MS mass spectrometry,
        immunofluorescence confocal imaging, and single-cell CRISPR/CRISPRi perturbation
        sequencing.
      - >-
        Cell maps themselves are computationally derived from these measurements by the MuSIC
        pipeline; the release metadata states that "Computed cell maps not included in this
        release."

collection_mechanisms:
  - id: d4d:CM4AI_collection_ppi
    name: Protein-protein interaction mapping
    mechanism_details:
      - >-
        "To map protein-protein interactions (PPIs) of 100 chromatin regulators under different
        conditions (cancer: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated,
        neurons and cardiomyocytes), we employed AP-MS on endogenously tagged cell lines and
        size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide
        complex/interaction mapping as two orthogonal mass spectrometry-based approaches."
      - >-
        "We have endogenously tagged 17 genes in MDA-MB-468 and acquired AP-MS data under three
        conditions (untreated, paclitaxel and vorinostat treated). We are currently in the process
        of tagging 34 additional genes in MDA-MB-468 cells."
  - id: d4d:CM4AI_collection_spatial
    name: Spatial proteomics mapping
    mechanism_details:
      - >-
        "For Year 1, we proposed to map the spatial subcellular organization of key chromatin
        modifiers, their interactors and key signaling molecules involved in cancer using the
        Human Protein Atlas resource of antibodies. We established automated fixation and
        permeabilization protocols for the pipetting robot for MDA-MB-468 and KOLF2 cell lines,
        and completed spatial proteomics mapping of 100 chromatin regulators in the MDA-MB-468
        cells (+/- paclitaxel or vorinostat), with another 500 proteins pending significant hits
        from the genetic perturbations and PPI results."
      - >-
        Imaging was performed by immunofluorescence-based staining (ICC-IF) and confocal
        microscopy in the Lundberg Lab at Stanford University, with DAPI for nuclei, calreticulin
        antibody for endoplasmic reticulum, tubulin antibody for microtubules, and an antibody
        against each protein of interest.
  - id: d4d:CM4AI_collection_genetic
    name: Genetic perturbation mapping
    mechanism_details:
      - >-
        "For Year 1, we performed single-cell CRISPR screens perturbing 100 chromatin regulators
        in the MDA-MB-468 cells under 3 conditions (no treatment, paclitaxel or vorinostat) and
        KOLF2 iPSC in the undifferentiated state. We have designed a CRISPR lentiviral library
        targeting 100 chromatin factors with 6 guide RNAs per gene. We generated and characterized
        MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9. Single-cell CRISPR screens
        of 100 chromatin regulators (+/- drug) in MDA-MB-468 cells and in undifferentiated
        KOLF2.1J iPSCs were done using the 10x Genomics 3'HT kit."

