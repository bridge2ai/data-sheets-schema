        MDA-MB-468 (RRID:CVCL_0419), "a triple negative breast cancer cell line established from
        a metastatic site pleural effusion of a 51-year-old black female with a metastatic mammary
        adenocarcinoma, available from ATCC", with and without paclitaxel or vorinostat treatment.
      - >-
        KOLF2.1J (RRID:CVCL_B5P3), an iPSC line "derived from a healthy male Northern European
        donor, available from the Human Induced Pluripotent Stem Cells Initiative (HipSci)
        resource", with and without neuronal and cardiomyocytic differentiation.
    why_not_representative:
      - >-
        "Data in this release was derived from commercially available de-identified human cell
        lines" and "Does not represent all biological variants which may be seen in the population
        at large."
    strategies:
      - >-
        "CM4AI has elected to use the cancer cell line MDA-MB-468 (+/- treatment with paclitaxel
        and vorinostat) and the iPSC line KOLF2.1J (+/- neuronal and cardiomyocytic
        differentiation), both of which have been ethically sourced."
      - >-
        Target selection is centred on 100 chromatin modifiers and 100 metabolic enzymes involved
        in cancer, neuropsychiatric and cardiac disorders, extended in later releases to
        genome-scale CRISPRi perturbation (11,739 targeted genes).

