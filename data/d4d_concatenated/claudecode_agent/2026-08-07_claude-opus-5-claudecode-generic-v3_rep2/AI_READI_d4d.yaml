variables:
  - variable_name: NT-proBNP
    data_type: float
    description: >-
      N-terminal pro-B-type natriuretic peptide, in pg/mL. Reference range varies by age. Included as
      a "Severity and outcome predictor of heart failure".
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Troponin-T
    data_type: float
    description: >-
      In ng/L. Reference range female <11, male <16. Included as a "Marker of myocardial injury".
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: C-peptide
    data_type: float
    description: >-
      In ng/mL. Reference range 1.1-4.4. Included as an "Indicator of insulin production".
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Insulin
    data_type: float
    description: >-
      In ng/mL. Reference range 0.0-24.9. Included as a "Marker for diabetes".
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: C-reactive protein, high sensitivity
    data_type: float
    description: >-
      In mg/L. Reference range 0.0-10.0. Included as an "Inflammation marker; risk factor for T2DM".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Total cholesterol
    data_type: float
    description: >-
      In mg/dL. Reference range <200. Included as a "Cardiovascular disease risk factor".
    measurement_technique: Serum lipid panel performed by the UW Nutrition and Obesity Research Center
  - variable_name: Triglycerides
    data_type: float
    description: >-
      In mg/dL. Reference range <150. Included as a "Cardiovascular disease risk factor".
    measurement_technique: Serum lipid panel performed by the UW Nutrition and Obesity Research Center
  - variable_name: High-density lipoprotein cholesterol
    data_type: float
    description: >-
      In mg/dL. Reference range >39. Included as a "Cardiovascular disease risk factor".
    measurement_technique: Serum lipid panel performed by the UW Nutrition and Obesity Research Center
  - variable_name: Low-density lipoprotein cholesterol (calculated)
    data_type: float
    description: >-
      In mg/dL. Reference range <130. Included as a "Cardiovascular disease risk factor".
    derivation: Calculated rather than measured directly.
    measurement_technique: Serum lipid panel performed by the UW Nutrition and Obesity Research Center
  - variable_name: Glucose
    data_type: float
    description: >-
      In mg/dL. Reference range 62-125. Included as a "Marker for diabetes".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Blood urea nitrogen
    data_type: float
    description: >-
      In mg/dL. Reference range 8.0-21.0. Included as a "Marker for kidney and liver function".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Creatinine
    data_type: float
    description: >-
      In mg/dL. Reference range female 0.38-1.02, male 0.51-1.18. Included as a "Marker for kidney
      function".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Blood urea nitrogen/creatinine ratio
    data_type: float
    description: >-
      Unitless ratio. Included as an "Indicator of kidney function".
    derivation: Calculated from serum blood urea nitrogen and creatinine.
    measurement_technique: Derived from serum assays performed by the UW Nutrition and Obesity Research Center
  - variable_name: Sodium
    data_type: float
    description: >-
      In mEq/L. Reference range 135-145. Included as a "Marker of metabolic health".
    measurement_technique: Serum electrolyte panel performed by the UW Nutrition and Obesity Research Center
  - variable_name: Potassium
    data_type: float
    description: >-
      In mEq/L. Reference range 3.6-5.2. Included as a "Marker of metabolic health".
    measurement_technique: Serum electrolyte panel performed by the UW Nutrition and Obesity Research Center
  - variable_name: Chloride
    data_type: float
    description: >-
      In mEq/L. Reference range 98-108. Included as a "Marker of metabolic health".
    measurement_technique: Serum electrolyte panel performed by the UW Nutrition and Obesity Research Center
  - variable_name: Carbon dioxide, total
    data_type: float
    description: >-
      In mEq/L. Reference range 22-32. Included as a "Marker of metabolic health".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Calcium
    data_type: float
    description: >-
      In mg/dL. Reference range 8.9-10.2. Included as a "Marker of metabolic health".
    measurement_technique: Serum electrolyte panel performed by the UW Nutrition and Obesity Research Center
  - variable_name: Protein, total
    data_type: float
    description: >-
      In g/dL. Reference range 6.0-8.2. Included as a "Useful tool for overall health status".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Albumin
    data_type: float
    description: >-
      In g/dL. Reference range 3.5-5.2. Included as a "Useful tool for overall health status".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Globulin, total (calculated)
    data_type: float
    description: >-
      In g/dL. Included as a "Useful tool for overall health status".
    derivation: Calculated from total protein and albumin.
    measurement_technique: Derived from serum assays performed by the UW Nutrition and Obesity Research Center
  - variable_name: A/G ratio (calculated)
    data_type: float
    description: >-
      Albumin/globulin ratio, unitless. Included as a "Useful tool for overall health status".
    derivation: Calculated from serum albumin and total globulin.
    measurement_technique: Derived from serum assays performed by the UW Nutrition and Obesity Research Center
  - variable_name: Bilirubin, total
    data_type: float
    description: >-
      In mg/dL. Reference range 0.2-1.3. Included as a "Marker of liver health".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Alkaline phosphatase
    data_type: float
    description: >-
      In IU/L. Reference range varies by age. Included as a "Marker of liver health".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Aspartate aminotransferase
    data_type: float
    description: >-
      In IU/L. Reference range 9-38. Included as a "Marker of liver health".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Alanine aminotransferase
    data_type: float
    description: >-
      In IU/L. Reference range female age 7-33 and male age 0-49: 10-64; male age 50+: 10-48.
      Included as a "Marker of liver health".
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: HbA1c
    data_type: float
    description: >-
      Haemoglobin A1c, in %. Reference range 4.0-6.0. Included as a "Marker for diabetes".
    measurement_technique: Whole blood assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: White blood cell count
    data_type: float
    description: >-
      In x10E3/microlitre. Reference range 3.4-10.8. Included as a "Useful tool for overall health
      status".
    measurement_technique: >-
      Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each data
      collection site
  - variable_name: Red blood cell count
    data_type: float
    description: >-
      In x10E6/microlitre. Reference range 3.77-5.80.
    measurement_technique: >-
      Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each data
      collection site
  - variable_name: Haemoglobin
    data_type: float
    description: In g/dL. Reference range 11.1-17.7.
    measurement_technique: >-
      Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each data
      collection site
  - variable_name: Haematocrit
    data_type: float
    description: In %. Reference range 34.0-51.0.
    measurement_technique: >-
      Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each data
      collection site
  - variable_name: MCV
    data_type: float
    description: Mean corpuscular volume, in fL. Reference range 79-97.
    measurement_technique: >-
      Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each data
      collection site
  - variable_name: MCH
    data_type: float
    description: Mean corpuscular haemoglobin, in pg. Reference range 26.6-33.0.
    measurement_technique: >-
      Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each data
      collection site
  - variable_name: MCHC
    data_type: float
    description: Mean corpuscular haemoglobin concentration, in g/dL. Reference range 31.5-35.7.
    measurement_technique: >-
      Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each data
      collection site
  - variable_name: RDW
    data_type: float
    description: Red blood cell distribution width, in %. Reference range 11.6-15.4.
    measurement_technique: >-
      Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each data
      collection site
  - variable_name: Platelets
    data_type: float
    description: >-
      In x10E3/microlitre. Reference range 150-450. Included as a "Useful tool for overall health
      status".
    measurement_technique: >-
      Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each data
      collection site
  - variable_name: Urine creatinine
    data_type: float
    description: >-
      In mg/dL; no reference range given. Included as a "Urinary biomarker for early diabetic
      nephropathy".
    measurement_technique: Urine assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Urine albumin
    data_type: float
    description: >-
      In mg/dL; no reference range given. Included as a "Urinary biomarker for early diabetic
      nephropathy".
    measurement_technique: Urine assay performed by the UW Nutrition and Obesity Research Center
  - variable_name: Height
    data_type: float
    description: Physical measurement taken at the study visit.
    measurement_technique: Measured on site and entered into REDCap
  - variable_name: Weight
    data_type: float
    description: Physical measurement taken at the study visit.
    measurement_technique: Measured on site and entered into REDCap
  - variable_name: Waist circumference
    data_type: float
    description: Physical measurement taken at the study visit.
    measurement_technique: Measured on site and entered into REDCap
  - variable_name: Hip circumference
    data_type: float
    description: Physical measurement taken at the study visit.
    measurement_technique: Measured on site and entered into REDCap
  - variable_name: Waist-hip ratio
    data_type: float
    description: >-
      "Height, weight and waist and hip circumference are measured, followed by calculation of the
      waist-hip ratio and body mass index."
    derivation: Calculated from measured waist and hip circumference.
  - variable_name: Body mass index
    data_type: float
    description: >-
      "Height, weight and waist and hip circumference are measured, followed by calculation of the
      waist-hip ratio and body mass index."
    derivation: Calculated from measured height and weight.
  - variable_name: Systolic blood pressure
    data_type: float
    description: >-
      In mmHg. "Systolic blood pressure, diastolic blood pressure and heart rate were measured twice
      separated by 2 min with an automatic oscillometric, medically approved device."
    measurement_technique: >-
      OMRON HEM 907XL, Medline MDS4001 or Welch Allyn 6000-series monitor with FlexiPort reusable
      cuff, depending on site
  - variable_name: Diastolic blood pressure
    data_type: float
    description: >-
      In mmHg, measured twice separated by 2 minutes.
    measurement_technique: >-
      OMRON HEM 907XL, Medline MDS4001 or Welch Allyn 6000-series monitor with FlexiPort reusable
      cuff, depending on site
  - variable_name: Heart rate
    data_type: float
    description: >-
      In beats per minute, measured twice separated by 2 minutes. "Heart rate can be read from EKG or
      blood pressure measurement devices."
    measurement_technique: Automatic oscillometric blood pressure device or 12-lead ECG
  - variable_name: ECG recording position
    data_type: categorical
    description: >-
      "A 12-lead ECG is performed (Philips Pagewriter TC30 Cardiograph, Amsterdam, The Netherlands)
      while the participant sits in a reclining chair or lies supine; the position is recorded (0
      degrees, 30, 60 or 90) relative to the supine position."
    categories:
      - '0'
      - '30'
      - '60'
      - '90'
    measurement_technique: Recorded by the operator alongside the Philips PageWriter TC30 acquisition
  - variable_name: Monofilament test response
    data_type: boolean
    description: >-
      "Peripheral neuropathy is performed using the monofilament test assessing touch perception on
      both feet with shoes and socks removed. During testing, the participants' eyes are closed while
      responding yes/no whether they feel the 10 g filament in three locations on each foot (10 times
      per location)." Insensate areas are retested for confirmation, with the sequence repeated
      randomly at each testing site on each foot until results are obtained.
    measurement_technique: >-
      Standard 10 g monofilament, results recorded on an iPad, laptop or paper questionnaire and
      entered into REDCap
  - variable_name: MoCA total score
    data_type: integer
    maximum_value: 30.0
    description: >-
      Montreal Cognitive Assessment total score. "The total possible score is 30, with higher numbers
      representing better performance." A score of 26 and above is considered normal and anything
      below 24 is a sign of cognitive impairment. The MoCA evaluates memory, executive functioning,
      attention, language, visuospatial ability, orientation, visuoconstructional skills, conceptual
      thinking and calculations.
    measurement_technique: >-
      Administered electronically on an iPad using the MoCA Duo application (MoCA Cognition, Quebec,
      Canada)
    quality_notes: >-
      Stated disadvantages: professionals require training to score the test; a person's level of
      education may affect the test; socioeconomic factors may affect the test; and people living
      with depression or other mental health issues may score similarly to those with mild dementia.
  - variable_name: MoCA section subscores
    data_type: integer
    description: >-
      Six domain-specific index scores exported alongside the total score, together with the Memory
      Index Score and task completion times.
    measurement_technique: MoCA Duo application export in .csv format
  - variable_name: Photopic letter visual acuity
    data_type: float
    description: >-
      "Photopic letter visual acuity is measured with the Electronic Visual Acuity tester (M&S
      Technology, Niles, Illinois) using the instrument's routine protocol", right and left eyes
      tested separately, under best-corrected conditions and "expressed as the logarithm of the
      minimum angle of resolution. Lower numbers are better resolution." The test is administered at
      4 metres from a 12x20 inch touch-screen monitor. Snellen visual acuity variables were dropped
      in v3.0.0, leaving only logMAR.
    measurement_technique: M&S Technologies EVA electronic visual acuity tester, photopic conditions
  - variable_name: Mesopic letter visual acuity
    data_type: float
    description: >-
      "Mesopic acuity is measured by the participant viewing the display through a 2.0 neutral
      density (ND) filter which reduces the light level of the test to a mesopic level", expressed in
      logMAR. The ND filter is either added to trial frames or used as a handheld ND-occluder over the
      participant's glasses.
    measurement_technique: M&S Technologies EVA electronic visual acuity tester with a 2.0 ND filter
  - variable_name: Photopic letter contrast sensitivity
    data_type: float
    description: >-
      "Photopic letter contrast sensitivity is measured with the Mars chart (Mars Perceptrix,
      Chappaqua, New York) using the routine procedure. ... Contrast sensitivity is expressed as log
      sensitivity, with higher numbers meaning better sensitivity." Tested monocularly with a general
      occluder, standardised order Photopic OD then Photopic OS, at a designed viewing distance of 50
      cm (range 40-59 cm), chart background luminance 60-120 cd/m2 (optimum 85) and illuminance
      189-377 lux (optimum 267), with appropriate near correction and under undilated conditions.
    measurement_technique: Mars letter contrast sensitivity chart, photopic conditions
    quality_notes: >-
      "Testing was terminated either when the patient made two consecutive errors or reached the end
      of the chart. The log contrast sensitivity (log CS) values were recorded by multiplying the
      number of errors prior to the final correct letter by 0.04 and subtracting the result from the
      log CS value at the final correct letter."
  - variable_name: Mesopic letter contrast sensitivity
    data_type: float
    description: >-
      "Mesopic contrast sensitivity is assessed by viewing through the 2.0 [neutral density filter]",
      tested monocularly in the standardised order Mesopic OD then Mesopic OS, expressed as log
      sensitivity.
    measurement_technique: >-
      Mars letter contrast sensitivity chart with a neutral density occluder and low luminance filter
      lens
  - variable_name: Autorefraction
    data_type: float
    description: >-
      "Autorefraction data for each eye are obtained (spherical and cylindrical components expressed
      as diopter with cylindrical axis) using the autorefractor's standard protocol."
    measurement_technique: Topcon KR 800 auto keratometer/refractor
  - variable_name: Continuous glucose measurement
    data_type: float
    description: >-
      "Blood glucose measurements (mg/dL) every 5 min" over a 10-day at-home monitoring period.
      Participants are masked to the results during the monitoring period. For participants already
      wearing a Dexcom G6, up to 90 days of prior data may optionally be added, for up to 100 days in
      total.
    measurement_technique: >-
      Dexcom G6 continuous glucose monitor (Dexcom, Inc., San Diego, California), exported as .csv and
      distributed in the Open mHealth format
  - variable_name: Step count
    data_type: integer
    description: Number of steps recorded during the 10-day at-home monitoring period.
    measurement_technique: >-
      Garmin VivoSmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland), exported
      as .FIT and converted to the Open mHealth standard
  - variable_name: Wearable heart rate
