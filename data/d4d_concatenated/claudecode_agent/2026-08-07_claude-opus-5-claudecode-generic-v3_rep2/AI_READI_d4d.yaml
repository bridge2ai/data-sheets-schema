instances:
  - id: https://doi.org/10.60775/fairhub.3#instance-participant
    name: Individual study participant
    instance_type: individual study participant
    data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D003924
    counts: 2280
    label: false
    label_description: >-
      "N/A - no labels are provided. No specific labeling was performed in the dataset, as the
      dataset is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream
      AI/ML applications."
    description: >-
      "Each instance represents an individual patient." "Each instance consists of all of the data
      available for an individual participating in the study", spanning survey data, clinical data,
      retinal imaging data, environmental sensor data, continuous glucose monitor data and wearable
      activity monitor data - that is, tabular data, imaging data and physiological
      signal/waveform data. "There is no unstructured text data included in this dataset." Version
      3.0.0 holds 2,280 instances; version 1.0.0 held 204 and version 2.0.0 held 1,067.
    missing_information:
      - id: https://doi.org/10.60775/fairhub.3#instance-missing-modalities
        name: Modalities absent for some participants
        missing:
          - One or more data modalities for a given participant
        why_missing:
          - Some participants elected not to participate in some study elements
          - >-
            In a few cases the data collection device did not have any stored results or was
            returned too late to retrieve the results (for example the battery died, or data was
            lost)
          - >-
            In a few cases there may have been a data collision at some point in the process and
            data has been lost
          - >-
            Operator-dependent imaging modalities may have been skipped when quality issues arose,
            for example on the Heidelberg Spectralis

