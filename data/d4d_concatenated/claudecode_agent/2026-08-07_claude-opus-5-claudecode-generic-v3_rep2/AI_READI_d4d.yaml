    anomaly_details: >-
      "In cases of imaging data, patient uncooperation, noise that may obscure the images and
      technical failure such as system malfunction, and data transfer failures are expected."
  - id: https://doi.org/10.60775/fairhub.3#anomaly-optomed
    name: Variable quality of undilated handheld fundus photography
    anomaly_details: >-
      Optomed Aurora images are acquired undilated with a handheld camera: "As it becomes
      challenging to get a good view because of the patients not being dilated and the handheld
      nature of this imaging modality, the quality of the images vary from patient to patient and
      within the same patient."
  - id: https://doi.org/10.60775/fairhub.3#anomaly-flio-compliance
    name: Reduced participant compliance on the final imaging modality
    anomaly_details: >-
      FLIO "takes longer than a usual spectralis OCT and exposes patients to uncomfortable levels
      of light", so it is performed as the last modality of a visit; "Because of this patients may
      not be at their best possible compliance."
  - id: https://doi.org/10.60775/fairhub.3#anomaly-operator
    name: Operator-induced variability on manually operated devices
    anomaly_details: >-
      The Heidelberg Spectralis "is operated by the imaging team and is not fully automated, quality
      issues may arise, which may lead to skipping this modality and missing data", whereas the
      Topcon Triton and Maestro2 position automatically, "which leads to higher quality images with
      minimal operator induced error".
  - id: https://doi.org/10.60775/fairhub.3#anomaly-no-audit
    name: No formal external audit
    anomaly_details: >-
      "The dataset has not undergone any formal external audits. However, the dataset has been
      reviewed internally by AI-READI team members for quality checks and to ensure that no
      personally identifiable information was accidentally included."

known_biases:
  - id: https://doi.org/10.60775/fairhub.3#bias-volunteer
    name: Volunteer bias
    bias_type: selection_bias
    bias_description: >-
      "Participants are volunteers; therefore, there is selection bias known as volunteer bias
      which may limit the generalisability of the results among those who are not represented in
      the study population."
    mitigation_strategy: >-
      Recruitment proceeds in waves whose composition and size are adjusted by under- and
      oversampling groups as enrolment characteristics are monitored.
  - id: https://doi.org/10.60775/fairhub.3#bias-representation
    name: Groups absent from the cohort
    bias_type: representation_bias
    bias_description: >-
      "The study cohort may not provide a comprehensive representation of the population, as it
      does not include other races/ethnicities such as Pacific Islanders and Native Americans."
      Recruitment is "predominantly urban and hospital-based ... which may not fully capture
      diverse cultural and socioeconomic backgrounds."
    mitigation_strategy: >-
      "Three recording sites were strategically selected to achieve diverse recruitment ... chosen
      for geographic diversity across the United States and to ensure diverse representation across
      various racial and ethnic groups. Individuals from all demographic backgrounds were recruited
      at all 3 sites." The project separately engages the Native Biodata Consortium on approaches
      for collecting comparable data within an American Indian / Alaska Native cohort.
    affected_subsets:
      - Pacific Islander populations
      - Native American populations
      - Rural and non-hospital-affiliated populations
  - id: https://doi.org/10.60775/fairhub.3#bias-interim-imbalance
    name: Interim releases not yet balanced
    bias_type: sampling_bias
    bias_description: >-
      "While the AI-READI's cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
      balanced across these parameters." "As enrollment is ongoing, the pilot data release and
      periodic updates to data releases may not have achieved balanced distribution across groups."
    mitigation_strategy: >-
      "As recruitment progresses, the composition of participants is monitored in terms of
      diversity and inclusion and will be adjusted by under- and oversampling groups as needed."
      The recommended validation and test splits are balanced as far as possible for sex,
      race/ethnicity and diabetes status.
  - id: https://doi.org/10.60775/fairhub.3#bias-english
    name: English-language eligibility requirement
    bias_type: selection_bias
    bias_description: >-
      Participants "are required to speak, read and understand English". "Requiring that eligible
      participants speak, read and understand English may have created challenges in recruiting
      Hispanic and/or Asian persons."
    mitigation_strategy: >-
      An NIH supplement was submitted to fund translation of all study materials so that
      Spanish-speaking participants who are not fluent in English can be recruited; UCSD has
      native Spanish-speaking research staff and would use UCSD translation services for the
      consent form if Hispanic recruitment goals were not met.
    affected_subsets:
      - Participants who do not read and speak English
  - id: https://doi.org/10.60775/fairhub.3#bias-recruitment-difficulty
    name: Documented under-recruitment of specific groups in health research
    bias_type: selection_bias
    bias_description: >-
      "It is a well-documented observation in health research that recruiting black men into
      studies is more difficult than recruiting other populations, yet this population represents a
      disproportionate percentage of burden in T2DM. Factors such as medical mistrust and fear of
      safety stem from historical events such as the Tuskegee syphilis study." Similar trends for
      under-recruitment and disease burden have been reported for Hispanic and Asian persons.
    mitigation_strategy: >-
      "Researchers have identified strategies to encourage interest among black men to participate
      in research such as tailoring printed materials and using a personalised, participatory
      approach to recruitment. ... If sample balancing on race/ethnicity emerges as a challenge in
      AI-READI, we will implement new recruitment strategies to overcome the imbalance." Sites are
      also differentially prioritised by local demographics: UW concentrates on
      Asian>Hispanic>Black, UCSD on Hispanic>Asian>Black, and UAB on Black>Hispanic>Asian
      participants, with all sites recruiting White participants.
  - id: https://doi.org/10.60775/fairhub.3#bias-device-heterogeneity
    name: Device and site heterogeneity
    bias_type: measurement_bias
    bias_description: >-
      Data for a single measure are captured on several different device makes and models across
      three sites, and blood pressure and lensometer measurements in particular use different
      instruments at different sites.
    mitigation_strategy: >-
      "Information on device make and model, including specific modalities like macula scans or
      wide scans during OCT, were documented to ensure repeatability. Moreover, the study included
      multiple devices for one measure to enhance generalizability and represent the diverse range
      of equipment utilized in clinical settings." "Uniform data collection protocols were
      implemented for all subjects, irrespective of their race/ethnicity, biological sex, or
      diabetes severity, across all study sites."

known_limitations:
  - id: https://doi.org/10.60775/fairhub.3#limitation-representativeness
    name: Limited population representativeness
    limitation_type: representativeness_limitation
    limitation_description: >-
      Recruitment was predominantly urban and hospital-based and the cohort omits several
      populations, notably Pacific Islanders and Native Americans.
    scope_impact: >-
      "Factors influencing the generalization of derived models include the predominantly urban and
      hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
      backgrounds."
  - id: https://doi.org/10.60775/fairhub.3#limitation-coverage
    name: Incomplete modality coverage per participant
    limitation_type: coverage_limitation
    limitation_description: >-
      "Yes, not all modalities are available for all participants."
    scope_impact: >-
      Analyses requiring complete multimodal records will operate on a subset of the 2,280
      participants.
  - id: https://doi.org/10.60775/fairhub.3#limitation-withheld-variables
    name: Demographic and medication variables withheld from the public release
    limitation_type: coverage_limitation
    limitation_description: >-
      "The data in this dataset contain no protected health information (PHI). Information related
      to the sex and race/ethnicity of the participants as well as medication used has also been
      removed." The public set was stripped of these "to prevent stigmatization of findings".
    scope_impact: >-
      Fairness and subgroup analyses cannot be performed on the public release at the individual
      level; only the aggregate counts in the recommended-split table are available.
    recommended_mitigation: >-
      "Because sex, race, and ethnicity data are not being released with the public version of the
      dataset, the project team has prepared data splits into proportions (70%/15%/15%) that can be
      used for subsequent training/validation/testing where the validation and test sets are
      balanced as well as possible for sex, race/ethnicity and diabetes status." The withheld
      variables are available in the controlled-access set under a data use agreement.
  - id: https://doi.org/10.60775/fairhub.3#limitation-temporal
    name: Cross-sectional design with a single visit per participant
    limitation_type: temporal_limitation
    limitation_description: >-
      "There is currently only one visit per participant." The study is cross-sectional; a
      longitudinal arm invites approximately 10% of the cohort back for a follow-up visit in year 4,
      and approximately 4% of participants are expected to undergo a follow-up examination.
    scope_impact: >-
      Trajectory analyses must be inferred across participants of differing disease severity - the
      pseudotime manifold approach - rather than observed within participants over time.
  - id: https://doi.org/10.60775/fairhub.3#limitation-no-labels
    name: No labels or predefined tasks
    limitation_type: methodological_limitation
    limitation_description: >-
      "N/A - no labels are provided", and "we do not have formal guidelines in place" for future
      researchers creating new labels or defining new tasks.
    scope_impact: >-
      Supervised learning applications must define and derive their own targets from the released
      variables.
  - id: https://doi.org/10.60775/fairhub.3#limitation-biorepository
    name: Finite biorepository sample volume
    limitation_type: scope_limitation
    limitation_description: >-
      "A limitation of our biorepository is that there are a finite number of samples to share with
      scientists interested in using them in research."
    recommended_mitigation: >-
      "Procedures for reviewing and prioritising written requests will be developed before the
      biorepository is complete." Biobanked samples are not part of this dataset.
  - id: https://doi.org/10.60775/fairhub.3#limitation-snellen-dropped
    name: Snellen visual acuity variables removed in v3.0.0
    limitation_type: integration_limitation
    limitation_description: >-
      "The data fields/types are largely the same as the prior version of the dataset. However, the
      Snellen visual acuity variables were dropped in this version of the dataset, such that now
      only logMAR visual acuity measurements are available."
    scope_impact: >-
      Analyses pooling v3.0.0 with earlier versions cannot rely on a common Snellen visual acuity
      variable.
  - id: https://doi.org/10.60775/fairhub.3#limitation-raw-data
    name: Raw pre-standardisation data not distributed
    limitation_type: scope_limitation
    limitation_description: >-
      "The raw data is saved and expected to be preserved by the AI-READI project at least for the
      duration of the project but is not anticipated to be shared outside the project team right
      now, because it has not been mapped to standardized terminologies and because the raw data may
      accidentally include personal health information or personally identifiable information (e.g.
      in free text fields)."
    recommended_mitigation: >-
      "There is a possibility that raw data may be included in future releases of the controlled
      access dataset."

confidential_elements:
  - id: https://doi.org/10.60775/fairhub.3#confidentiality
    name: Confidential content in the released dataset
    confidential_elements_present: false
    confidentiality_details: >-
      "No, the dataset does not contain data that might be considered confidential. No personally
      identifiable information is included in the dataset."

content_warnings:
  - id: https://doi.org/10.60775/fairhub.3#content-warnings
    name: Offensive or distressing content
    content_warnings_present: false
    description: >-
      Asked whether the dataset contains data that "if viewed directly, might be offensive,
      insulting, threatening, or might otherwise pose any safety risk (such as psychological safety
      and anxiety)", the healthsheet answers "No."

subpopulations:
  - id: https://doi.org/10.60775/fairhub.3#subpopulation-diabetes-status
    name: Diabetes status groups
    subpopulation_elements_present: true
    identification: >-
      Participants are recruited into four study groups by diabetes status: no diabetes;
      pre-diabetes or type 2 diabetes controlled by lifestyle adjustments; type 2 diabetes
      controlled by oral or non-insulin injectable medications; and insulin-dependent type 2
      diabetes. Diabetes status is one of the variables the recommended splits are balanced on.
    distribution: >-
      Across the 2,280 participants of v3.0.0: no diabetes 776, lifestyle-controlled 560, oral or
      non-insulin injectable 686, insulin-controlled 258. Recruitment targets approximately 1,000
      participants in each of the four groups.
  - id: https://doi.org/10.60775/fairhub.3#subpopulation-sex-race
    name: Sex, race and ethnicity subpopulations
    subpopulation_elements_present: false
    identification: >-
      Asked "Does the dataset identify any demographic sub-populations (e.g., by age, gender, sex,
      ethnicity)?", the healthsheet answers "No", and no regulation prevented demographic data
      collection. Individual-level sex and race/ethnicity are removed from the public release and
      held in the controlled-access set.
    distribution: >-
      Only aggregate counts accompany the release, in the recommended-split table: by race and
      ethnicity, Hispanic 380, Asian 545, Black 519, White 836; by sex, male 951 and female 1,329;
      mean age 60.8 +/- 11.3 years. The study aims to recruit approximately 1,000 subjects from
      each of the White, Asian, Hispanic and Black groups, age- and sex-matched within and between
      groups.
    source_caveats: >-
      The healthsheet's "No" answer and the aggregate counts published in the dataset README are
      both reproduced here. They are not necessarily contradictory - individual-level demographic
      labels are withheld from the public set while aggregate counts are reported - but the
      distinction is inferred from the two statements rather than stated in either.

sensitive_elements:
  - id: https://doi.org/10.60775/fairhub.3#sensitive-public
    name: Sensitive content in the public dataset
    sensitive_elements_present: false
    sensitivity_details: >-
      "No, the public dataset will not contain data that is considered sensitive."
  - id: https://doi.org/10.60775/fairhub.3#sensitive-controlled
    name: Sensitive content in the controlled-access dataset
    sensitive_elements_present: true
    sensitivity_details: >-
      "However, the controlled access dataset will contain data regarding racial and ethnic
      origins, location (5-digit zip code), as well as motor vehicle accident reports." Elsewhere
      the controlled-access holdings are listed as "5-digit zip code, sex, race, ethnicity, genetic
      sequencing data, past health records, medications, and traffic and accident reports".

relationships:
  - id: https://doi.org/10.60775/fairhub.3#relationship-instances
    name: Relationships between instances
    relationship_details: >-
      "Yes - all instances are part of the same prospective data generation project (AI-READI).
      There is currently only one visit per participant."
  - id: https://doi.org/10.60775/fairhub.3#relationship-participant-folder
    name: Linkage of a participant's records across modalities
    relationship_details: >-
      Within each device folder there is one folder per participant, "named after the participant's
      ID number used in the study", so all records for a participant are linked by that identifier
      across datatypes, modalities and devices. A root-level participants.tsv with an accompanying
      participants.json data dictionary describes the participants.

splits:
  - id: https://doi.org/10.60775/fairhub.3#split-recommended
    name: Recommended training/validation/testing split
    split_details: >-
      "The current version of the dataset comes with recommended data splits. Because sex, race,
      and ethnicity data are not being released with the public version of the dataset, the project
      team has prepared data splits into proportions (70%/15%/15%) that can be used for subsequent
      training/validation/testing where the validation and test sets are balanced as well as
      possible for sex, race/ethnicity and diabetes status (no diabetes, prediabetes/lifestyle
      controlled, oral medication controlled, and insulin controlled)." The split assignment "is
      included in the participants.tsv file that will be included in the dataset". Sizes are 1,576
      training, 352 validation and 352 test, totalling 2,280. Validation and test sets carry 88
      participants from each of the four race/ethnicity groups and 176 of each sex; training
      carries Hispanic 204, Asian 369, Black 343, White 660 and male 599, female 977. Mean age is
      61.1 +/- 11.3 years in training, 60.3 +/- 10.8 in validation and 60.5 +/- 11.4 in test. The
      recommended split is new in v3.0.0: "This datasheet does not include new tasks or labeling.
      It does include a new recommended data split for the 2280 participants balancing training,
      validation, and testing sets for age, sex, races/ethnicities, and study group."

acquisition_methods:
  - id: https://doi.org/10.60775/fairhub.3#acquisition
    name: Mixed direct observation, self-report and derivation
    was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details: >-
      "The acquisition of data varied based on the domain; some data were directly observable (such
      as labs, vitals, and retinal imaging), whereas other data were reported by subjects (e.g.
      survey responses). Verification of data entry was performed when possible (e.g.
      cross-referencing entered medications with medications that were physically brought in or
      photographed by each study participant)." A number of released values are calculated rather
      than measured, including body mass index and the waist-hip ratio, calculated low-density
      lipoprotein cholesterol, calculated total globulin, the albumin/globulin ratio and the blood
      urea nitrogen / creatinine ratio.

collection_mechanisms:
  - id: https://doi.org/10.60775/fairhub.3#mechanism-redcap
    name: REDCap electronic data capture
    mechanism_details: >-
      "REDCap is used for collecting patient-reported data from questionnaires and the following
      clinical data from the visit: medications assessment, vitals, visual acuity, contrast
      sensitivity, monofilament test results and CBC test results." REDCap also hosts the
      recruitment interface, the screening survey and electronic consent. Data are housed in the
      University of Washington REDCap system.
  - id: https://doi.org/10.60775/fairhub.3#mechanism-devices
    name: Instrumented on-site and at-home devices
    mechanism_details: >-
      Data are exported from the devices in their raw formats to local storage: the 12-lead ECG as
      .xml, the MoCA Duo application as .csv (total score, section subscores, Memory Index Score
      and task completion times), retinal imaging in device-native formats, and the at-home
      environmental sensor, continuous glucose monitor and fitness tracker. Retinal imaging uses
      the Optomed Aurora IQ, iCare EIDON, Heidelberg Spectralis HRA (OCT, OCTA and FLIO), Topcon
      Maestro2 3D OCT-1, Topcon Triton DRI OCT and Zeiss Cirrus 5000 Angioplex; the ECG is recorded
      on a Philips PageWriter TC30 Cardiograph; at-home monitoring uses a Dexcom G6 continuous
      glucose monitor, a Garmin VivoSmart 5 physical activity monitor and a custom-designed
      environmental sensor (the LeeLab Anura, built at the Karalis Johnson Retina Center,
      University of Washington). Other instruments include the M&S Technologies EVA visual acuity
      tester, the Mars letter contrast sensitivity chart (Mars Perceptrix), a Topcon KR 800
      autorefractor/keratometer, NIDEK LM-600P and Topcon CL-200/CL-300 lensometers, OMRON HEM
      907XL, Medline MDS4001 and Welch Allyn 6000-series blood pressure monitors, a 10 g
      monofilament, and the MoCA Duo application on an iPad.
  - id: https://doi.org/10.60775/fairhub.3#mechanism-labs
    name: Clinical laboratory assay
    mechanism_details: >-
      "Clinical Laboratory Improvement Amendments-certified laboratories local to each data
      collection site perform complete blood count (CBC) testing on fresh whole blood samples; all
      other lab tests are performed by the University of Washington Nutrition and Obesity Research
      Center (NORC) testing facility using stored, frozen samples." Samples analysed by UW NORC are
      first stored locally at UAB and UCSD at -70 degrees C, then batch-shipped to UW on dry ice
      approximately once per quarter.
  - id: https://doi.org/10.60775/fairhub.3#mechanism-ehr
    name: Electronic health record screening and record extraction
    mechanism_details: >-
      Recruitment pools "were identified by screening Electronic Health Records (EHR) for diabetes
      and prediabetes ICD-10 codes for all patients who have had an encounter with the sites' health
      systems within the past 2 years". The BMJ Open protocol states that "Patients with T2DM and
      pre-diabetes are identified by screening electronic health records for ICD-10 diagnosis codes
      R73.09 and E11.X, respectively. Patients without diabetes will not have encounters with these
      ICD codes." The IRB application further states that medical
      records were extracted "to obtain data on general health, eye health, medical and surgical
      history, diabetes, medications, laboratory records, and any previous medical imaging such as
      eye imaging", along with car accidents and traffic tickets in the last three years.
    source_caveats: >-
      As written, the BMJ Open protocol's "respectively" assigns ICD-10 code R73.09 to T2DM and
      E11.X to pre-diabetes. The pairing is reproduced verbatim above and not silently reversed,
      but the reader should note that the two codes appear to be transposed relative to their
      conventional meanings.
  - id: https://doi.org/10.60775/fairhub.3#mechanism-validation
    name: Validation of the collection mechanisms
    mechanism_details: >-
      Asked how the collection mechanisms were validated, the healthsheet answers only that "The
      procedures for data collection and processing is available at https://docs.aireadi.org." All
      research personnel who recruited, enrolled and collected data underwent training by the data
      manager at UAB against a detailed Manual of Procedures; a certification process is required
      of all coordinators, including mandatory institutional compliance training for human subject
      research and successful administration of all protocol elements to at least three volunteer
      practice subjects before enrolling participants. Data managers at each site oversee the
      process.

sampling_strategies:
  - id: https://doi.org/10.60775/fairhub.3#sampling-recruitment
    name: Stratified non-probability recruitment from the health-system study base
    is_sample: true
    is_random: false
    source_data: >-
      "The study base is all patients aged >=40 years of age who had a medical encounter within each
      health system site (UAB, UCSD, UW) between 2020 and 2025."
    is_representative: false
    why_not_representative: >-
      "Building balanced data sets is critical for the development of unbiased machine learning
      models, so rather than targeting the demographic distribution of the US population, the study
      is triple-balanced by recruiting the following populations in equal proportions": four
      race/ethnic groups, four categories of T2DM, and biological males and females. The FAIRhub
      study description records the sampling method as "Non-Probability Sample".
    strategies: >-
      "Participants are recruited in waves to facilitate the efficient sampling of the study base.
      The composition and size of each wave are influenced by the observed participation
      characteristics of race/ethnicity, gender, severity of T2DM and site, according to health
      records." UW and UCSD supply lists of potential participants identified through the EHR search
      to UAB, which adds its own eligible patients and selects a stratified sample from the combined
      list; OHSU generates participant-specific REDCap survey links, and Adapt Inc., an SSAE16 SOC
      security-certified and HIPAA-compliant printing and fulfilment service, mails the recruitment
      letters. "The aforementioned process will occur on a recursive basis with UAB coordinating the
      selection of participants to achieve balancing of race/ethnicity, sex, and diabetes severity
      until the recruitment goals have been achieved." Approximately 50,000 invitation letters from
      each site are expected over the recruitment period, sent by both mail and email.
  - id: https://doi.org/10.60775/fairhub.3#sampling-release-coverage
    name: Coverage of enrolled participants within the release
    is_sample: false
    source_data: >-
      All AI-READI participants enrolled during the period covered by this release.
    strategies: >-
      "The dataset contains all possible instances. More specifically, the dataset contains data
      from all participants who have been enrolled during the first year of data collection for
      AI-READI." Asked separately what sampling strategy was used if the dataset is a sample from a
      larger set, the healthsheet answers "N/A".
    source_caveats: >-
      The healthsheet answer describing full coverage says "the first year of data collection",
      whereas the same healthsheet, the README and the FAIRhub dataset description all give the
      v3.0.0 collection window as 19 July 2023 to 1 May 2025 and the count as 2,280 participants -
      roughly the first two years. The "first year" wording appears to be carried over from an
      earlier version of the answer.

data_collectors:
  - id: https://doi.org/10.60775/fairhub.3#collector-crc
    name: Clinical research coordinators
    role: Clinical research coordinator / study coordinator
    collector_details: >-
      "Responsible for contacting and consenting the research participants, ushering participants
      through the research visit, conducting study visits including collection of ophthalmologic
      images, providing training on study procedures such as continuous glucose monitoring or
      fitness tracker, and ensuring the return of all study materials (ex. Environmental sensor)."
      Coordinators must complete a certification process including mandatory institutional
      compliance training for human subject research and must successfully administer all protocol
      elements to at least three volunteer practice subjects before enrolling participants.
  - id: https://doi.org/10.60775/fairhub.3#collector-ra
    name: Research assistants
    role: Research assistant
    collector_details: >-
      "Conduct study visits including collection of ophthalmologic images, provide training on study
      procedures such as continuous glucose monitoring or fitness tracker, ensure the return of all
      study materials (ex. Environmental sensor) under the direction of the study coordinator or
      project manager; responsible for data upload and management from each clinic visit."
  - id: https://doi.org/10.60775/fairhub.3#collector-data-manager
    name: Site data managers and database managers
    role: Data manager / database manager
    collector_details: >-
      "The Data Manager at each data site is responsible for the quality control of all data before
      uploading to FAIRhub." The database manager will "ingest data into the Redcap database and
      extract for processing". Data managers at each site oversee the coordinator training and
      certification process, and together with coordinators examine flagged participant records to
      determine whether an error is likely.
  - id: https://doi.org/10.60775/fairhub.3#collector-phlebotomy
    name: Phlebotomists and laboratory assistants
    role: Phlebotomist / lab assistant
    collector_details: >-
      The phlebotomist is "responsible for blood collection from research participants" and the lab
      assistant is "responsible for processing and shipping samples". Research study coordinators
      who draw blood are expected to be certified phlebotomists in Washington State.
  - id: https://doi.org/10.60775/fairhub.3#collector-technical
    name: Data science, software and cloud engineering staff
    role: Research/data scientist, software engineer, cloud engineer
    collector_details: >-
      Research and data scientists and postdoctoral fellows "process data for release in database
      and development of standards"; software engineers are "responsible for designing,
      implementing, and testing the different data curation pipelines"; cloud engineers are
      "responsible for cloud infrastructure customization, configuration and deployment including
      integrating, configuring, deploying, and managing centrally provided common cloud services".
  - id: https://doi.org/10.60775/fairhub.3#collector-compensation
    name: Compensation of the collection team
    role: All study personnel
    collector_details: >-
      "Details about the AI-READI team members involved in the data collection process are available
      at https://aireadi.org/team. Their effort was supported by the National Institutes of Health
      award OT2OD032644 based on the percentage of effort contributed, and salaries which aligned
      with the funding guidelines at each site."

collection_timeframes:
  - id: https://doi.org/10.60775/fairhub.3#timeframe-v3
    name: Collection window covered by version 3.0.0
    start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      "For this version of the dataset, the timeframe for data collection was July 19, 2023 to May
      01, 2025." The FAIRhub dataset description records the same period as a "Collected" date of
      2023-07-19/2025-05-01, and describes v3.0.0 as consisting "of data collected up through the
      end of the second year of the study".
  - id: https://doi.org/10.60775/fairhub.3#timeframe-pilot
    name: Pilot enrolment period
    start_date: '2023-07-18'
    end_date: '2023-11-30'
    timeframe_details: >-
      "Preliminary pilot enrolment occurred between 18 July 2023 and 30 November 2023 in order to
      secure sufficient familiarity for all coordinators. The formal data collection process began
      on 1 December 2023. Preliminary data from the pilot enrollment period were included in the
      first released data set released in May 2024."
    source_caveats: >-
      The BMJ Open protocol gives 18 July 2023 as the enrolment start date; the FAIRhub study
      description records an actual study start date of 2023-07-19.
  - id: https://doi.org/10.60775/fairhub.3#timeframe-study
    name: Overall study period
    start_date: '2023-07-19'
    end_date: '2027-01-01'
    timeframe_details: >-
      "Enrolment began on 18 July 2023 and will continue until 30 November 2026." The FAIRhub study
      description gives an actual start date of 2023-07-19 and an anticipated completion date of
      2027-01-01, with overall status "Enrolling by invitation". "The timeline for the overall
      project spans four years, encompassing one year dedicated to protocol development and
      training, and years 2-4 allocated for subject recruitment and data collection. Approximately
      4% of participants are expected to undergo a follow-up examination in Year 4." The Nature
      Metabolism comment describes enrolment of 4,000 participants "at three study sites over 4
      years (2022-2026)". The NIH award period recorded by RePORTER runs from 2022-09-01 to
      2025-08-31.

direct_collection:
  - id: https://doi.org/10.60775/fairhub.3#direct-collection
    name: Direct collection from participants
    is_direct: true
    collection_details: >-
      "The data was collected directly from participants across the three recruiting sites."
      Recruitment pools were identified by screening electronic health records, but the study data
      themselves are actively collected: "this was not passive data collection or secondary use of
      existing data, but rather active data collection directly from participants." Some elements
      are nevertheless obtained from third parties: driving and accident records are obtained from
      the Department of Licensing, and prior continuous glucose data may be obtained through the
      Dexcom Clarity application for participants who already wear a Dexcom G6.

collection_notifications:
  - id: https://doi.org/10.60775/fairhub.3#notification
    name: Notification of data collection
    notification_details: >-
      "Yes, each individual was aware of the data collection, as this was not passive data
      collection or secondary use of existing data, but rather active data collection directly from
      participants." Potential participants receive a hardcopy invitation letter and an invitation
      email, each personalised with links, access codes and QR codes directing them into the online
      REDCap recruitment interface, where they can read an overview of the research programme,
      expectations for participation and answers to frequently asked questions, download the
      informed consent document, request a call back from study staff, complete a screening survey
      and enroll. Those without internet access may call research staff for alternative methods of
      enrolment. Participants are also directed to the AI-READI website at https://aireadi.org.

collection_consents:
  - id: https://doi.org/10.60775/fairhub.3#collection-consent
    name: Consent obtained at collection
    consent_details: >-
      "Informed consent to participate was required before participation in any part of the protocol
      (including questionnaires). Potential participants were given the option to read all consent
      documentation electronically (e-consent) before their visit and give their consent with an
      electronic signature without verbal communication with a clinical research coordinator.
      Participants may access e-consent documentation in REDCap and decide at that point they do not
      want to participate or would like additional information. The approved consent form for the
      principal project site University of Washington is available [at
      https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf].
      The other clinical sites had IRB reliance and used the same consent form, with minor
      institution-specific language incorporated depending on individual institutional
      requirements." Where consent is taken in person it is obtained in a private room by a study
      team member, with opportunity to ask questions and to take additional time before signing;
      California requires the Bill of Rights to be included in the UCSD consent form. The consent
      form opens with a table clarifying which information will be publicly available and which
      requires an application and approval process.

consent_revocations:
  - id: https://doi.org/10.60775/fairhub.3#consent-revocation
    name: Withdrawal of consent
    revocation_details: >-
      "Participants were permitted to withdraw consent at any time and cease study participation.
      However, any data that had been shared or used up to that point would stay in the dataset.
      This is clearly communicated in the consent document." Study subjects "will have the
      opportunity to ask questions throughout the study and will be reminded that they have the
      right to change their mind about study participation".

missing_data_documentation:
  - id: https://doi.org/10.60775/fairhub.3#missing-data
    name: Missing data patterns, causes and handling
    missing_data_patterns: >-
      "Yes, not all modalities are available for all participants." Within surveys, "skipped
      questions or incomplete responses are expected".
    missing_data_causes: >-
      "Some participants elected not to participate in some study elements. In a few cases, the data
      collection device did not have any stored results or was returned too late to retrieve the
      results (e.g. battery died, data was lost). In a few cases, there may have been a data
      collision at some point in the process and data has been lost." Operator-dependent imaging may
      also be skipped when quality is inadequate.
    handling_strategy: >-
      No imputation is described. Quality control at entry flagged clinical values outside expected
      minimum/maximum ranges in REDCap for review, and records were checked for "Missing data that
      can be directly filed from other portions of an individual's record" and for "The omission
      and/or duplication of records". "If corrected data was available from elsewhere in the
      respondent's answers, the error was corrected. If there was no logical or appropriate way to
      correct the data, the Data site PI reviewed the values and made decisions about whether those
      values should be removed from the data."

raw_data_sources:
  - id: https://doi.org/10.60775/fairhub.3#raw-source-ehr
    source_description: >-
      Electronic health records of the three health systems (University of Washington, University of
      California San Diego, University of Alabama at Birmingham), screened for age, diabetes status
      and other eligibility criteria and for participant contact information.
    source_type: Electronic health record
    access_details: >-
      Accessed by study teams at each site under the UW IRB approval; PHI accessed by directly
      viewing electronic medical records. Screening data "may be retained as part of the study data
      to facilitate future screening efforts and/or to contribute to study procedures and reduce
      duplication efforts". Identifiers are not released in the public dataset.
    raw_data_format: Health-system EHR query results, transferred as structured lists
  - id: https://doi.org/10.60775/fairhub.3#raw-source-dol
    source_description: >-
      Driving and accident records obtained from the Department of Licensing, covering car accidents
      and traffic tickets in the last three years.
    source_type: Government licensing authority records
    access_details: >-
      "Driving and accident records will be obtained from the Department of Licensing (no additional
      approvals are required beyond the IRB approval)." Traffic and accident reports are held in the
      controlled-access dataset only.
  - id: https://doi.org/10.60775/fairhub.3#raw-source-devices
    source_description: >-
      Device-native exports from the study instruments, prior to conversion into the standardised
      formats that are distributed.
    source_type: Instrument export
    access_details: >-
      "The raw data is saved and expected to be preserved by the AI-READI project at least for the
      duration of the project but is not anticipated to be shared outside the project team right
      now." Raw exports are written to local storage at each site before upload to FAIRhub.
    raw_data_format: >-
      ECG as .xml; MoCA Duo application output as .csv; Topcon Maestro2 and Triton images as .fda;
      Heidelberg FLIO as .sdt; Garmin VivoSmart 5 as .FIT; Dexcom G6 and environmental sensor as
      .csv; other retinal images exported in device-native raw formats, some already DICOM.
  - id: https://doi.org/10.60775/fairhub.3#raw-source-clarity
    source_description: >-
      Historical continuous glucose monitoring data retrieved through the Dexcom Clarity application
      for participants already wearing a Dexcom G6 at the time of the visit.
    source_type: Device vendor cloud application
    access_details: >-
      Optional and consented: "Patients who already wear Dexcom G6 sensor at the time of the visit
      will be given an option to allow download of the previously collected glucose values for up to
      90 days prior to the study visit", giving up to 100 days of glucose data in total. The study
      clinic terminates data sharing after download, without disrupting sharing with any other
      clinic.

ethical_reviews:
  - id: https://doi.org/10.60775/fairhub.3#ethical-review-uw-irb
    name: University of Washington Institutional Review Board
    reviewing_organization: University of Washington Institutional Review Board (Human Subjects Division)
    review_details: >-
      "AI-READI was approved by the Institutional Review Board (IRB) of the University of Washington
      (approval number STUDY00016228), including reliance agreements with the IRBs of University of
      Alabama at Birmingham and University of California, San Diego. Written informed consent is
      provided by all participants." "The initial IRB approval at the University of Washington was
      received on December 20, 2022. The initial approval letter can be found [at
      https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf]. An annual renewal
      application to the IRB about the status and progress of the study is required and due within
      90 days of expiration." The FAIRhub study description records the human subject review status
      as "Submitted, approved", with no data monitoring committee and no FDA-regulated drug or
      device. The study is registered on ClinicalTrials.gov as NCT06002048. The IRB application
      records the data security level as Level 3 and the assessed confidentiality-breach risk as
      low.
    contact_person: https://orcid.org/0000-0002-7452-1648
    source_caveats: >-
      The BMJ Open abstract attaches the identifier STUDY00016228 to "Clinicaltrials. org approval
      number", while the same paper's Methods section attributes it to the University of Washington
      IRB and the FAIRhub metadata gives NCT06002048 as the ClinicalTrials.gov identifier. The
      Methods attribution is the one recorded here.
  - id: https://doi.org/10.60775/fairhub.3#ethical-review-cab
    name: Community Advisory Board
    reviewing_organization: AI-READI Community Advisory Board
    review_details: >-
      "A Community Advisory Board of 11 persons from the three sites including diversity in race and
      ethnicity as represented in the AI-READI sample contributes to the development of the
      protocol." "There will also be a community advisory board that evaluates the consent forms and
      research protocols and their feedback will be considered in the modifications of the IRB as
      needed." Feedback from this group led the study team to conclude that enrolling non-English
      speaking participants would require translating all study materials, not only the consent
      form.
  - id: https://doi.org/10.60775/fairhub.3#ethical-review-bioethics
    name: Embedded ethical, legal and social implications review
    reviewing_organization: AI-READI ethics and bioethics investigators
    review_details: >-
      "AI-READI aims to establish standards, best practices and guidelines for collection,
      preparation and sharing of the data for the purposes of AI/ML, including guidance from
      bioethicists." "To prevent such issues, ethical, legal and social implications are considered
      at every stage of the project cycle." The project also reviewed existing documentation
      approaches - datasheets and healthsheets - "to identify the most suitable one for biomedical
      data", and engages the Native Biodata Consortium to evaluate data usage agreements, contract
      negotiations, transparent access agreements and mechanisms for assured return of benefit and
      sustainable Tribal input, control and monitoring.
  - id: https://doi.org/10.60775/fairhub.3#ethical-review-hdoc
    name: UCSD Health Data Oversight Committee
    reviewing_organization: University of California, San Diego Health Data Oversight Committee
    review_details: >-
      "UCSD has a health Data Oversight Committee (HDOC) that oversees data sharing with other
      institutions. For sharing research data with another academic (i.e., non-profit/non-commercial)
      institution, this is typically a straightforward process that is expedited. Approval is
      contingent upon IRB approval and will be sought immediately after IRB approval is obtained."

data_protection_impacts:
  - id: https://doi.org/10.60775/fairhub.3#dpia
    name: Data protection impact analysis
    impact_details: >-
      "No, a data protection impact analysis has not been conducted."

human_subject_research:
  id: https://doi.org/10.60775/fairhub.3#human-subject-research
  name: Human subject research status
  involves_human_subjects: true
  ethics_review_board: University of Washington Institutional Review Board (Human Subjects Division)
  irb_approval:
    - >-
      STUDY00016228, University of Washington IRB; initial approval received 20 December 2022, with
      annual renewal required within 90 days of expiration
    - >-
      Reliance agreements with the IRBs of the University of Alabama at Birmingham and the
      University of California, San Diego
  regulatory_compliance:
    - >-
      The public release is stripped of Protected Health Information as defined by the HIPAA Privacy
      Rule via the Safe Harbor method
    - >-
      Licensees must comply with the data security and privacy standards established by the NIH
      under its Genomic Data Sharing (GDS) Policy
    - >-
      Not an FDA-regulated drug study and not an FDA-regulated device study, per the FAIRhub study
      description oversight module; no data monitoring committee
    - >-
      HIPAA authorization is obtained from subjects for all PHI accessed or collected following
      enrolment; for PHI obtained for prescreening, the minimum-necessary, no-reuse,
      accounting-for-disclosures and reasonable-safeguards assurances apply
  description: >-
    The study is an observational cohort study with a cross-sectional time perspective, described in
    the IRB application as a "Cross-sectional and longitudinal observational study with data and
    sample collections". Minors and pregnant women are not enrolled: pregnancy,
    gestational diabetes and type 1 diabetes are exclusion criteria, and eligibility is restricted to
    adults aged 40 years and older (the FAIRhub eligibility module gives a maximum age of 85 years
    and excludes "Adults older than 85 years of age"). Biospecimen retention is recorded as "Samples
    With DNA".

informed_consent:
  - id: https://doi.org/10.60775/fairhub.3#informed-consent
    name: Informed consent for participation and data sharing
    consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either as REDCap electronic consent with an electronic
      signature before the visit or in person at the start of the visit; the study's preferred
      method is e-consent so that surveys can be completed before the visit.
    consent_documentation: >-
      The approved University of Washington consent form is published at
      https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf. The
      other clinical sites operated under IRB reliance and used the same form with minor
      institution-specific language. Signed electronic consents are automatically emailed to
      subjects, who may request further copies from a study coordinator at any time during the
      study. For subjects who have difficulty viewing the consent, a study team member reads it
      aloud; for a functionally illiterate subject, a study team member signs and notes the reason
      in the presence of an impartial witness.
    withdrawal_mechanism: >-
      Participants may withdraw consent at any time and cease participation, but data already shared
      or used remain in the dataset; this is stated in the consent document.
    consent_scope: >-
      The FAIRhub dataset consent metadata records consentType
      "ConsentSpecifiedNotElsewhereCategorised" with the note that "The public version of the dataset
      can only be used for type 2 diabetes related research. A private version will allow for more
      generic use", and records no non-commercial, geographic, research-type, genetic-only or
      no-methods restriction flags. Consent covers secondary use, banking and future sharing:
      possible future uses recorded in the IRB application are "Manuscript and presentation
      preparations, grant preparations, future research studies, future AI/ML algorithms,
      repository/data sharing platform creations, future research using the stored specimen and
      data", with the corresponding language included in the consent form.

at_risk_populations:
  id: https://doi.org/10.60775/fairhub.3#at-risk-populations
  name: At-risk population involvement
  at_risk_groups_included: false
  source_caveats: >-
    at_risk_groups_included is recorded as false on the basis of the stated eligibility criteria and
    the absence of any protected population from them. The UW IRB application's questions about
    prisoners, protected populations and recruitment of indigenous populations appear in the source
    bundle as unfilled template text - the checkbox states did not survive extraction - so those
    answers are not available and are not asserted here.
  description: >-
    No protected or vulnerable population is purposefully included. Eligibility is restricted to
    consenting adults aged 40 and over; pregnancy, gestational diabetes and type 1 diabetes are
    exclusion criteria; and the research does not include minors, so no parental permission or
    assent procedures apply. The project separately engages the
    Native Biodata Consortium as a co-learning exercise on the governance challenges of AI research
    with American Indian and Alaska Native communities, and the NIH RePORTER abstract states that the
    project "will also engage in a tribal consultation to address barriers and facilitators of
    participation with the goal of collecting similar data within a Native American cohort in an
    ethical and respectful manner"; the current cohort does not include Native American
    participants. Accessibility measurements "were not specifically assessed",
    though transportation assistance (rideshare services) was offered to participants who reported
    barriers to travelling to study visits.

participant_privacy:
  - id: https://doi.org/10.60775/fairhub.3#privacy
    name: Participant privacy protections
    anonymization_method: >-
      The public set is stripped of Protected Health Information as defined by the HIPAA Privacy Rule
      via the Safe Harbor method, together with information related to participants' sex and
      race/ethnicity, and medication use. The FAIRhub metadata instead frames this as "No identifiers
      were collected so no active de-identification was necessary but we checked that no identifiable
      data per US HIPAA were present in the data."
    reidentification_risk: >-
      "There is a theoretical risk of future re-identification." The project notes that "AI algorithms
      can infer individual patient characteristics and could facilitate individual-level
      identification." The licence forbids attempts to identify or contact any Data Subject, to
      extract or extrapolate identifying information, or to establish a Data Subject's membership of
      a particular group.
    privacy_techniques: >-
      "To prevent reidentification attempts, we are implementing a robust data dissemination system,
      a strict licence agreement and data watermarking for both public and controlled sets." The
      at-home devices were selected with privacy in mind: "The environmental sensor and the Garmin
      fitness tracker were specifically chosen with participant privacy as a primary concern. These
      devices do not capture video or audio, are not equipped with GPS location monitoring and are
      not synced with participant-owned devices." All study procedures are conducted in private
      rooms, and "All study data and identifiable information will be kept on encrypted servers, or
      in locked cabinets/room with restricted access (at all sites)", accessible only to authorised
      research personnel. Results returned to participants are sent by HIPAA-compliant, encrypted
      email.
    data_linkage: >-
      Within the dataset, a participant's records are linked across datatypes, modalities and devices
      by the participant ID used as the folder name. Two distribution databases exist: "The first will
      be deidentified, which will be publicly available. The second one has some identifiable or
      sensitive information: genomic data and race/ethnicity, and will require data user agreement
      between the researchers to obtain the data and approval process developed by the project
      committee."

participant_compensation:
  - id: https://doi.org/10.60775/fairhub.3#participant-compensation
    name: Participant compensation
    compensation_provided: true
    compensation_type: Monetary stipend, plus reimbursement of reasonable travel costs
    compensation_amount: >-
      USD 200 per study visit; the same type and amount is offered for the year 4 follow-up visit.
    compensation_rationale: >-
      "Study subjects received a compensation of $200 for the study visit also through the grant
      funding." "There will be a $200 stipend for participation, which will be provided when we
      receive the final data from participants and return of the study devices. The timing of the
      payment will typically be at least 2 weeks after the study visit, taking into account 10 days
      of home-based data collection using the devices provided in the study and additional time for
      devices to be returned to the study team [by] mail. The payment will not be prorated. The
      amount may be changed in future years depending on the study funding." In addition, the
      "Study will cover reasonable costs for parking, public transit, or rideshare fees (e.g., Uber
      or Lyft) related to the study visit", though "Subjects may incur costs for transport that will
      not be reimbursed if transportation fees exceed $25."

preprocessing_strategies:
  - id: https://doi.org/10.60775/fairhub.3#preprocessing-standards
    name: Mapping to community data standards
    preprocessing_details: >-
      "Once data were sent from each of the study sites to the central project team, additional
      processing steps were conducted in preparation for dissemination. For example, all data were
      mapped to standardized terminologies when possible, such as the Observational Medical Outcomes
      Partnership (OMOP) Common Data Model, a common data model for observational health data, and
      the Digital Imaging and Communications in Medicine (DICOM), a commonly used standard for
      medical imaging data." Per datatype directory: cardiac_ecg follows the WaveForm DataBase
      (WFDB) standard; clinical_data follows the OMOP CDM, with each CSV file a one-to-one mapping
      to an OMOP CDM table; environment follows the NASA Earth Science Data Systems ASCII file
      format guidelines; retinal_flio, retinal_oct, retinal_octa and retinal_photography follow
      DICOM; and wearable_activity_monitor and wearable_blood_glucose follow Open mHealth.
  - id: https://doi.org/10.60775/fairhub.3#preprocessing-conversion
    name: Conversion from proprietary device formats
    preprocessing_details: >-
      "All participant images are exported from imaging devices in their raw format and some images
      required conversion to a DICOM standard format prior to upload to an external AI-READI data
      storage site." Topcon Maestro2 and Triton scans are "Exported in .fda file format; converted
      to DICOM for the data set"; Heidelberg FLIO is "Exported in .sdt file format; converted to
      DICOM for the data set"; Garmin VivoSmart 5 data are "Exported in .FIT file format; converted
      to mHealth standard for the data set". "For some devices, the data are transformed from its
      proprietary state into a standard model format prior to upload to FAIRhub."
  - id: https://doi.org/10.60775/fairhub.3#preprocessing-structure
    name: Organisation under the Clinical Dataset Structure specification
    preprocessing_details: >-
      "This dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1 ... data is
      organized at the root level into one directory per datatype. Within each datatype folder,
      there is one folder per modality. Within each modality folder, there is one folder per device
      used to collect that modality. Within each device folder, there is one folder per participant.
      Each datatype, modality, and device folder is named using a name that best defines it. Each
      participant folder is named after the participant's ID number used in the study." CDS is a new
      standard developed by the project, "a simple and intuitive way to organize clinical research
      datasets and include structured metadata". Each datatype directory carries a manifest.tsv
      metadata file, and the dataset root carries CHANGELOG.md, dataset_description.json,
      dataset_structure_description.json, healthsheet.md, LICENSE.txt, participants.json,
      participants.tsv, README.md and study_description.json.
  - id: https://doi.org/10.60775/fairhub.3#preprocessing-deidentification
    name: Removal of identifying and sensitive variables for public release
    preprocessing_details: >-
      "The public set is stripped of Protected Health Information (PHI), as defined by the HIPAA
      (Health Insurance Portability and Accountability Act) Privacy Rule via the 'Safe Harbor'
      method, as well as information related to the sex and race/ethnicity of the participants to
      prevent stigmatization of findings." Medication use is also removed. Asked directly whether
      there was any pre-processing for de-identification of patients, and whether measures were
      taken to avoid re-identification, the healthsheet leaves both answers blank.
  - id: https://doi.org/10.60775/fairhub.3#preprocessing-exclusions
    name: No instances excluded at preprocessing
    preprocessing_details: >-
      "No data were excluded from the dataset at the time of preprocessing." Exclusions operate only
      at recruitment, through the eligibility criteria: able to provide consent, aged 40 or over,
      persons with or without type 2 diabetes, and must speak and read English; and must not be
      pregnant, must not have gestational diabetes, must not have type 1 diabetes.

cleaning_strategies:
  - id: https://doi.org/10.60775/fairhub.3#cleaning-redcap-qc
    name: Quality control at data entry
    cleaning_details: >-
      "There were several quality control measures used at the time of data entry/acquisition. For
      example, clinical data outside of expected min/max ranges were flagged in REDCap, which was
      visible in reports viewed by clinical research coordinators (CRCs) and Data Managers. Using
      these REDCap reports as guides, Data Managers and CRCs examined participant records and
      determined if an error was likely. Data were checked for the following and edited if errors
      were detected: 1. Credibility, based on range checks to determine if all responses fall within
      a prespecified reasonable range; 2. Incorrect flow through prescribed skip patterns; 3.
      Missing data that can be directly filed from other portions of an individual's record; 4. The
      omission and/or duplication of records."
  - id: https://doi.org/10.60775/fairhub.3#cleaning-governance
    name: Governance of edits
    cleaning_details: >-
      "Editing was only done under the guidance and approval of the site PI. If corrected data was
      available from elsewhere in the respondent's answers, the error was corrected. If there was no
      logical or appropriate way to correct the data, the Data site PI reviewed the values and made
      decisions about whether those values should be removed from the data." "The Data Manager at
      each data site is responsible for the quality control of all data before uploading to
      FAIRhub."
  - id: https://doi.org/10.60775/fairhub.3#cleaning-dqd
    name: OMOP data quality checks
    cleaning_details: >-
      The clinical_data directory ships a dqd_omop.json file which "supports OMOP CDM data quality
      analysis using the OMOP CDM Data Quality Dashboard (DQD). The OMOP CDM DQD tool
      (https://ohdsi.github.io/DataQualityDashboard/) runs a set of > 3500 data quality checks
      against an OMOP CDM instance". FAIRhub also exposes a Dataset Quality Dashboard for the record.

labeling_strategies:
  - id: https://doi.org/10.60775/fairhub.3#labeling
    name: Labelling strategy
    labeling_details: >-
      "N/A - no labels are provided. No specific labeling was performed in the dataset, as the
      dataset is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream
      AI/ML applications." There is consequently no gold-standard or proxy label definition, no
      human labelling process and no rater agreement to report, and the software question - "Is the
      software used to preprocess/clean/label the instances available?" - is answered "N/A - no
      labeling was performed". For future researchers defining their own labels or tasks, "we do not
      have formal guidelines in place". Human-level performance for the applications the dataset is
      meant to address is likewise recorded as "N/A".

raw_sources:
  - id: https://doi.org/10.60775/fairhub.3#raw-data-retention
    name: Retained raw data
    raw_data_details: >-
      "The raw data is saved and expected to be preserved by the AI-READI project at least for the
      duration of the project but is not anticipated to be shared outside the project team right
      now, because it has not been mapped to standardized terminologies and because the raw data may
      accidentally include personal health information or personally identifiable information (e.g.
      in free text fields). There is a possibility that raw data may be included in future releases
      of the controlled access dataset." No access URL is provided.

existing_uses:
  - id: https://doi.org/10.60775/fairhub.3#existing-uses
    name: Prior uses of the dataset
    description: >-
      Asked "Has the dataset been used for any tasks already?", the healthsheet for v3.0.0 answers
      "No". The FAIRhub record reports 24,636 views and a citation count of zero at capture. The
      BMJ Open protocol notes only that "Those who download and use AI-READI data are encouraged to
      publish their results in the scientific literature."

use_repository:
  - id: https://doi.org/10.60775/fairhub.3#use-repository
    name: Repository of works using the dataset
    repository_details: >-
      Asked "Is there a repository that links to any or all papers or systems that use the dataset?",
      the healthsheet answers "No". FAIRhub displays "Cited by" and Dataset Impact panels on the
      record page, but no separate registry of downstream uses is named.

other_tasks:
  - id: https://doi.org/10.60775/fairhub.3#other-task-hypothesis-agnostic
    name: Open-ended downstream AI/ML applications
    task_details: >-
      "The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
      manifolds and various applications in artificial intelligence." The protocol was designed to be
      "agnostic to hypotheses": "the team assembled a data collection protocol composed of
      assessments from many health domains that are likely impacted by T2DM", so the dataset is
      intended to support tasks that were not specified in advance.
  - id: https://doi.org/10.60775/fairhub.3#other-task-biorepository
    name: Ancillary studies on the associated biorepository
    task_details: >-
      Biospecimens collected alongside the dataset - isolated plasma, serum, genomic DNA, buffy
      coats, PAXgene-stabilised RNA and peripheral blood mononuclear cells - are banked at the UAB
      Center for Clinical and Translational Science and "will be available to researchers for future
      ancillary studies", including whole genome sequencing, proteomics and metabolomics, gene
      expression studies, immunological studies and the generation of induced pluripotent stem cells.
      "Biobanked samples will eventually be available to scientists according to procedures and
      policies that are in development." These specimens are not part of this dataset.
  - id: https://doi.org/10.60775/fairhub.3#other-task-blueprint
    name: Methodological reuse of the AI-READI approach
    task_details: >-
      "An additional aim of the AI-READI project is to share our blueprint for collecting and sharing
      AI-ready datasets so that future DGPs can follow them ... including guidelines for project
      management, as well as data collection, management and sharing", published through
      https://zenodo.org/communities/aireadi, https://github.com/AI-READI and https://aireadi.org.
      "After testing FAIRhub for the AI-READI dataset, we anticipate making the platform available
      for future DGPs desiring to manage and share AI-ready clinical research datasets."

future_use_impacts:
  - id: https://doi.org/10.60775/fairhub.3#future-impact-harms
    name: Anticipated harms from future use
    impact_details: >-
      "No, to the extent of our knowledge, we do not currently anticipate any uses of the dataset
      that could result in unfair treatment or harm. However, there is a theoretical risk of future
      re-identification."
  - id: https://doi.org/10.60775/fairhub.3#future-impact-withheld-demographics
    name: Effect of withheld demographic variables on downstream analyses
    impact_details: >-
      Sex and race/ethnicity are removed from the public set "to prevent stigmatization of findings",
      so users cannot condition on or audit against those attributes at the individual level in the
      public release. The project's response is to supply a recommended split whose validation and
      test sets are balanced as far as possible on those attributes: "We are suggesting a split for
      training/validation/testing models that is aimed at reducing disparities in models developed
      using this dataset."
  - id: https://doi.org/10.60775/fairhub.3#future-impact-interim-balance
    name: Effect of incomplete balancing in interim releases
    impact_details: >-
      "Of note, the overall enrollment goal is to have balanced distribution between different racial
      groups. As enrollment is ongoing, the periodic updates to data releases may not have achieved
      balanced distribution across groups." Users of an interim release should not assume the target
      balance has been reached.
  - id: https://doi.org/10.60775/fairhub.3#future-impact-generalization
    name: Factors limiting generalisation of derived models
    impact_details: >-
      Generalisation may be limited by the number and diversity of devices, by device-specific
      recording characteristics, by the three recruitment sites being urban and hospital-based, and
      by the absence of some racial and ethnic groups from the cohort. Device make, model and scan
      protocol were documented "to ensure repeatability", and multiple devices were deliberately
      included for a single measure "to enhance generalizability and represent the diverse range of
      equipment utilized in clinical settings".

discouraged_uses:
  - id: https://doi.org/10.60775/fairhub.3#discouraged-license
    name: Uses restricted by the licence
    discouragement_details: >-
      "The AI READI dataset License imposes certain restrictions on the usage of the data. The
      restrictions are described in the License files available at
      https://doi.org/10.5281/zenodo.17555036." Asked whether there are tasks for which the dataset
      should not be used, the healthsheet refers back to those licence terms.
  - id: https://doi.org/10.60775/fairhub.3#discouraged-clinical
    name: Clinical decision-making
    discouragement_details: >-
      The licence states that the Licensee shall not "make clinical treatment decisions based on the
      Data, as it is intended solely as a research resource".
  - id: https://doi.org/10.60775/fairhub.3#discouraged-non-t2dm
    name: Research outside type 2 diabetes on the public release
    discouragement_details: >-
      Access to the public release requires "Agreeing to use the data only for type 2 diabetes
      related research"; the FAIRhub consent metadata records that "The public version of the dataset
      can only be used for type 2 diabetes related research. A private version will allow for more
      generic use."

intended_uses:
  - id: https://doi.org/10.60775/fairhub.3#intended-use
    name: Intended uses
    use_category: >-
      Research use, restricted on the public release to type 2 diabetes related research
    examples:
      - Development of artificial intelligence and machine learning models for type 2 diabetes
      - >-
        Pseudotime manifold analysis to predict disease trajectories from participants of differing
        disease severity
      - Study of salutogenesis, the pathway from type 2 diabetes back to health
      - >-
        Multimodal model development combining survey, clinical, laboratory, imaging, waveform,
        wearable and environmental data
      - >-
        Methodological work on making clinical research datasets FAIR and AI-ready, using the
        dataset as a worked example
    usage_notes: >-
      "The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
      manifolds and various applications in artificial intelligence." Public access requires logging
      in through a verified ID system, agreeing to use the data only for T2DM-related research, and
      agreeing to the licence terms; the fuller dataset requires a data use agreement. Use of the
      dataset requires citation of the resources specified at https://docs.aireadi.org, and licensees
      agree "to acknowledge the source and any funder of the Data in any publications reporting use
      of the Data".

prohibited_uses:
  - id: https://doi.org/10.60775/fairhub.3#prohibited-clinical-decisions
    name: Making clinical treatment decisions from the data
    prohibition_reason: >-
      Licence clause 3: Licensee shall not "make clinical treatment decisions based on the Data, as
      it is intended solely as a research resource".
  - id: https://doi.org/10.60775/fairhub.3#prohibited-reidentification
    name: Re-identification or contact of data subjects
    prohibition_reason: >-
      Licence clause 3: Licensee shall not "use or attempt to use the Data, alone or in concert with
      other information, to compromise or otherwise infringe the confidentiality of information on an
      individual person who is the source of any Data ... and their right to privacy, to identify or
      contact any individual Data Subject or group of Data Subjects, to extract or extrapolate any
      identifying information about a Data Subject, to establish a particular Data Subject's
      membership in a particular group of persons, or otherwise to cause harm or injury to any Data
      Subject."
  - id: https://doi.org/10.60775/fairhub.3#prohibited-onward-sharing
    name: Onward transfer of the data to unbound third parties
    prohibition_reason: >-
      Licence clause 2: "Licensee shall not transfer, license, sublicense, sell, assign, display,
      share or otherwise convey any portion of the Data or any derivative work to any third party
      other than another licensee ('Other Licensee') that is bound by the terms of an agreement with
      Licensor on terms identical to those contained in this Agreement."
  - id: https://doi.org/10.60775/fairhub.3#prohibited-memorising-models
    name: Releasing models without guarding against data reconstruction
    prohibition_reason: >-
      Licence clause 2 permits distribution of models, algorithms and programs trained on the Data
      that do not themselves contain it, "provided that Licensee, prior to dissemination of any such
      Models, undertakes all reasonable efforts to minimise the likelihood that Data can be
      memorized, derived, reconstructed or reconstituted through the use or construction of such
      Models."

