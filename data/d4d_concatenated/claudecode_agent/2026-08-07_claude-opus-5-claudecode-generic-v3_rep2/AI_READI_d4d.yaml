license_and_use_terms:
  id: https://doi.org/10.60775/fairhub.3#license-terms
  name: AI-READI data licence and terms of use
  data_use_permission: disease_specific_research
  license_terms: >-
    The FAIRhub record for v3.0.0 names the licence "AI-READI custom license v2.0" at
    https://doi.org/10.5281/zenodo.17555036 and displays it as the "Health Data License". "This work
    is licensed under a custom license specifically tailored to enable the reuse of the AI-READI
    dataset (and other clinical datasets) for commercial or research purposes while putting strong
    requirements around data usage, security, and secondary sharing to protect study participants,
    especially when data is reused for artificial intelligence (AI) and machine learning (ML)
    related applications." The licence text carried in the source bundle is the earlier
    AI-READI-LICENSE-v1.0 (https://doi.org/10.5281/zenodo.10642459), a University of Washington Data
    License Agreement whose principal terms are: a non-exclusive and non-transferable licence to
    download, reproduce and use the Data and to create derivative works, for research and commercial
    purposes (clause 1); no transfer, licensing, sublicensing, sale, assignment, display or sharing
    of any portion of the Data or any derivative work with a third party other than another licensee
    bound by identical terms, though models, algorithms and programs that do not themselves contain
    the Data may be distributed subject to reasonable efforts to minimise memorisation or
    reconstruction of the Data (clause 2); no clinical treatment decisions and no attempt to
    re-identify or contact Data Subjects, plus an obligation to acknowledge the source and any funder
    in publications (clause 3); compliance with NIH Genomic Data Sharing Policy security standards
    (clause 4); automatic termination on breach, with deletion of all copies (clause 5); retention of
    title and all intellectual property rights by the Licensor (clause 6); the Data provided "as is"
    with no warranty (clause 7); liability capped in the aggregate at one US dollar (clause 8);
    indemnification of the Licensor by the Licensee (clause 9); and compliance with all applicable
    laws (clause 10). Accessing the dataset requires logging in through a verified ID system,
    agreeing to use the data only for type 2 diabetes related research, and agreeing to the licence
    terms; the FAIRhub access type is "PublicDownloadSelfAttestationRequired". The full dataset is
    accessible only by entering into a data use agreement.
  contact_person: https://orcid.org/0000-0002-7452-1648
  source_caveats: >-
    The licence version named by the v3.0.0 metadata (v2.0, Zenodo 17555036) differs from the licence
    document included in the bundle (v1.0, Zenodo 10642459); the clause-level terms summarised here
    are from the v1.0 text and may not reflect v2.0. The bundled v1.0 text names the University of
    Washington as Licensor.

ip_restrictions:
  id: https://doi.org/10.60775/fairhub.3#ip-restrictions
  name: Intellectual property restrictions
  restrictions:
    - >-
      "Title to the Data, and all industrial and intellectual property rights therein, shall at all
      times remain solely and exclusively with Licensor and its suppliers, and Licensee shall not
      take any action inconsistent with such ownership."
    - '"Any rights not expressly granted herein are reserved to Licensor and its suppliers."'
    - >-
      Asked whether any third parties have imposed IP-based or other restrictions on the data
      associated with the instances, the healthsheet answers only "Refer to license
      (https://doi.org/10.5281/zenodo.17555036)".
    - >-
      "There are no plans for the researchers involved in collecting the data set to develop any
      commercial products or file for patents. However, the data set will be publicly available with
      a commercial-friendly open-source license and there may be products or patents that are
      developed from it in the future."

regulatory_restrictions:
  id: https://doi.org/10.60775/fairhub.3#regulatory-restrictions
  name: Regulatory and compliance restrictions
  hipaa_compliant: compliant
  confidentiality_level: restricted
  regulatory_restrictions:
    - >-
      "Licensee agrees to comply with all applicable laws, regulations and restrictions relating to
      the distribution and use of the Data and Models."
    - >-
      "Licensee agrees to comply with all data security and privacy standards established by the
      U.S. National Institutes of Health under its Genomic Data Sharing (GDS) Policy from time to
      time", specifically the NIH Security Best Practices for Controlled-Access Data Subject to the
      NIH GDS Policy.
    - >-
      Asked whether any export controls or other regulatory restrictions apply to the dataset or to
      individual instances, the healthsheet answers only "Refer to license
      (https://doi.org/10.5281/zenodo.17555036)".
  other_compliance: >-
    The public release contains no protected health information: PHI as defined by the HIPAA Privacy
    Rule is removed by the Safe Harbor method, and the FAIRhub de-identification metadata records
    deIdentHIPAA as true with the note that "we checked that no identifiable data per US HIPAA were
    present in the data". Access is not unrestricted: it requires login through a verified ID system,
    self-attestation that the data will be used only for type 2 diabetes related research, and
    acceptance of the licence, while the fuller dataset requires a data use agreement. The study is
    not FDA-regulated as a drug or device study.
  description: >-
    "The requirements for controlled access data sets are being currently developed by the Data
    Access Committee." The IRB application likewise records that the controlled database "will require
    data user agreement between the researchers to obtain the data and approval process developed by
    the project committee", and that the project would "create an infrastructure to decide who is
    allowed to request and receive the specimen for future research" from the biorepository.

is_deidentified:
  id: https://doi.org/10.60775/fairhub.3#deidentification
  name: De-identification of the released dataset
  identifiable_elements_present: false
  method: >-
    Removal of Protected Health Information as defined by the HIPAA Privacy Rule via the Safe Harbor
    method, followed by verification that no HIPAA-identifiable data remain.
  identifiers_removed: >-
    Protected Health Information as defined by the HIPAA Privacy Rule, plus information related to
    participants' sex and race/ethnicity and to medication use. Held in the controlled-access set
    rather than the public set: 5-digit zip code, sex, race, ethnicity, genetic sequencing data, past
    health records, medications, and traffic and accident reports.
  deidentification_details: >-
    "The data in this dataset contain no protected health information (PHI). Information related to
    the sex and race/ethnicity of the participants as well as medication used has also been removed."
    "The public set is stripped of Protected Health Information (PHI), as defined by the HIPAA
    (Health Insurance Portability and Accountability Act) Privacy Rule via the 'Safe Harbor' method,
    as well as information related to the sex and race/ethnicity of the participants to prevent
    stigmatization of findings." The FAIRhub dataset description records deIdentType
    "NoDeIdentification" with deIdentDirect true, deIdentHIPAA true, and deIdentDates,
    deIdentNonarr and deIdentKAnon all false, and explains: "No identifiers were collected so no
    active de-identification was necessary but we checked that no identifiable data per US HIPAA were
    present in the data."
  source_caveats: >-
    The two accounts differ in framing rather than in effect: FAIRhub records the de-identification
    type as "NoDeIdentification" on the grounds that no identifiers were collected, while the Nature
    Metabolism comment describes the public set as actively stripped of PHI by the Safe Harbor
    method. The IRB application meanwhile states that identifiers including name, MRN, date of birth,
    address, phone number, driver's licence number and email are collected during the study, so the
    "no identifiers were collected" statement applies to the released dataset rather than to the
    study record. Both statements are reproduced above. The healthsheet questions asking directly
    about de-identification pre-processing and about measures taken to avoid re-identification are
    left blank.

maintainers:
  - id: https://aireadi.org/#maintainer
    name: AI-READI team
    role: academic_institution
    maintainer_details: >-
      "The AI-READI team will be supporting and maintaining the dataset. The dataset is hosted on
      FAIRhub through Microsoft Azure." Asked how the owner, curator or manager can be contacted,
      the healthsheet answers: "We refer to the README file included with the dataset for contact
      information"; the README in turn directs enquiries to https://aireadi.org/contact and to the
      study_description.json and dataset_description.json metadata files. The FAIRhub central
      contact is Aaron Lee at contact@aireadi.org.

updates:
  id: https://doi.org/10.60775/fairhub.3#update-plan
  name: Update and versioning plan
  frequency: >-
    Approximately annually; "There are plans to release new versions of the dataset approximately
    once a year with additional data from participants who have been enrolled since the last dataset
    version release."
  update_details: >-
    "The dataset gets released as static versions." "The dataset will not be updated. Rather, new
    versions of the dataset will be released with additional instances as more study participants
    complete the study visit." "Yes, enrollment is ongoing, and future versions of the dataset will
    be released that will include larger numbers of subjects/patients as enrollment increases."
    Changes between versions are documented in the CHANGELOG file included in the dataset and visible
    at docs.aireadi.org. No mailing list or other notification channel for updates is named.

retention_limit:
  id: https://doi.org/10.60775/fairhub.3#retention
  name: Data retention limits
  retention_details: >-
    "There are no limits on the retention of the data associated with the instances." Raw data is
    "expected to be preserved by the AI-READI project at least for the duration of the project".

version_access:
  id: https://doi.org/10.60775/fairhub.3#version-access
  name: Version history and access
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  versions_available:
    - 'Version 3.0.0, DOI 10.60775/fairhub.3, released 2025-11-17, 2,280 participants, 3.82 TB, 356,343 files'
    - 'Version 2.0.0, DOI 10.60775/fairhub.2, released 2024-11-08, 1,067 participants, 2.01 TB, 165,051 files'
    - 'Version 1.0.0, DOI 10.60775/fairhub.1, released 2024-05-03, 204 participants (pilot data collection phase)'
  version_details: >-
    Versions are static, not dynamically updated, and one documentation set exists per version,
    selectable from the dropdown at docs.aireadi.org. Participant counts grow across versions: 204 in
    v1.0.0 from the pilot phase, 863 added in v2.0.0 for a total of 1,067, and 1,213 added in v3.0.0
    for a total of 2,280. The README summarises the same progression by data-collection year, with
    the v1.0.0 pilot processed "custom / ad hoc" and later years "automated + custom", and with data
    types growing from 15+ by one image device in year 2 and three image devices in year 3. Data
    fields are largely stable across versions, but the Snellen visual acuity variables were dropped
    in v3.0.0, leaving only logMAR measurements. Earlier versions are not maintained: "N/A - as
    mentioned in the response to question 4, the dataset will not be updated. Rather, new versions of
    the dataset will be released with additional instances as more study participants are enrolled."
    The FAIRhub page for v2.0.0 states "This version of the dataset is no longer accessible. Please
    refer to the latest version." Healthsheets exist for the earlier versions, at
    https://docs.aireadi.org/docs/1/dataset/healthsheet and
    https://docs.aireadi.org/docs/2/dataset/healthsheet.

extension_mechanism:
  id: https://doi.org/10.60775/fairhub.3#extension
  name: Mechanism for external contribution
  extension_details: >-
    "No, currently there is no mechanism for others to extend or augment the AI-READI dataset outside
    of those who are involved in the project."

external_resources:
  - id: https://doi.org/10.60775/fairhub.3#external-documentation
    name: AI-READI dataset documentation
    external_resources:
      - 'AI-READI dataset documentation: https://docs.aireadi.org'
      - 'AI-READI project website: https://aireadi.org'
      - 'Zenodo community of the AI-READI project: https://zenodo.org/communities/aireadi'
      - 'GitHub organization of the AI-READI project: https://github.com/AI-READI'
      - 'Clinical Dataset Structure specification: https://cds-specification.readthedocs.io'
    restrictions:
      - >-
        None on the documentation: "The documentation is shared under the CC-BY 4.0 license, so
        there are no restrictions associated with its use."
    description: >-
      "The dataset is self-contained but does rely on the dataset documentation for users requiring
      additional information about the provenance of the dataset. The documentation is available at
      https://docs.aireadi.org." The dataset description records both https://docs.aireadi.org/ and
      https://aireadi.org/ as related identifiers with relation type IsDocumentedBy.
    source_caveats: >-
      The healthsheet question that asks whether guarantees exist that the external resources will
      persist and whether official archival versions of the complete dataset exist is answered only
      in respect of the documentation's licence, so neither future_guarantees nor archival is
      populated here.

subsets:
  - id: https://doi.org/10.60775/fairhub.3#subset-public
    name: Publicly accessible dataset
    is_data_split: false
    is_subpopulation: false
    description: >-
      The publicly downloadable release, containing no protected health information. "The public
      dataset will include survey data, blood and urine lab results, fitness activity levels,
      clinical measurements (e.g. monofilament and cognitive function testing), retinal images, ECG,
      blood sugar levels, and environmental variables such as home air quality." Access requires
      login through a verified ID system, self-attestation that the data will be used only for type 2
      diabetes related research, and acceptance of the licence terms. This is the release described
      by the FAIRhub v3.0.0 record and therefore by the figures in this datasheet.
  - id: https://doi.org/10.60775/fairhub.3#subset-controlled-access
    name: Controlled-access dataset
    is_data_split: false
    is_subpopulation: false
    description: >-
      "The controlled access data set contains all data available in the publicly accessible set,
      plus more sensitive data that are only available for use by scientists whose institutions have
      completed legal and privacy use agreements with the AI-READI research programme." Its
      additional holdings are "5-digit zip code, sex, race, ethnicity, genetic sequencing data, past
      health records, medications, and traffic and accident reports". "The full dataset will be
      accessible by entering into a data use agreement", and the access requirements "are being
      currently developed by the Data Access Committee". No DOI, size or file count for this set
      appears in the sources.
