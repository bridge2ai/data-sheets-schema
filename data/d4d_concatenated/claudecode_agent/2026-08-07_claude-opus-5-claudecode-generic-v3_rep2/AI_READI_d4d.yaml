purposes:
  - id: https://doi.org/10.60775/fairhub.3#purpose-ai-ml-t2dm
    name: Enable AI/ML research into type 2 diabetes and salutogenesis
    response: >-
      "The purpose for creating the dataset was to enable future generations of artificial
      intelligence/machine learning (AI/ML) research to provide critical insights into type 2
      diabetes mellitus (T2DM), including salutogenic pathways to return to health." Salutogenesis
      here means the pathway from T2DM back to health, the inverse of studying how healthy people
      progress to T2DM.
  - id: https://doi.org/10.60775/fairhub.3#purpose-fill-ai-ready-gap
    name: Supply an AI-ready multimodal dataset where none existed
    response: >-
      "Given the complexity of T2DM, AI-based approaches may help with improving our understanding
      but a key issue is the lack of data ready for training AI models. The AI-READI dataset is
      intended to fill this gap." The data are stored and shared as "AI-ready", which "enables
      immediate AI/ML research without reformatting and preprocessing".
  - id: https://doi.org/10.60775/fairhub.3#purpose-balanced-cohort
    name: Provide a demographically and clinically balanced training cohort
    response: >-
      To address the inherent limitations of existing large AI/ML training sets, the cohort is
      designed to be balanced in race/ethnicity, T2DM severity and biological sex rather than
      matching the demographic distribution of the US population, because "Building balanced data
      sets is critical for the development of unbiased machine learning models".
  - id: https://doi.org/10.60775/fairhub.3#purpose-blueprint
    name: Establish a reusable blueprint for AI-ready data generation
    response: >-
      AI-READI "places special emphasis on establishing standards, best practices and guidelines
      for collection, preparation and sharing of the data that can be used for future efforts to
      develop other data sets targeted for AI/ML", following the FAIR principles, and "can be
      viewed as a model for future efforts to develop other medical/health data sets targeted for
      AI/ML".

tasks:
  - id: https://doi.org/10.60775/fairhub.3#task-pseudotime
    name: Pseudotime manifold analysis of disease trajectory
    response: >-
      "Data collection will be specifically designed to permit downstream pseudo-time manifold
      analysis, an approach used to predict disease trajectories by collecting and learning from
      complex, multimodal data from participants with differing disease severity (normal to
      insulin-dependent T2DM)." The approach relies on dimensionality reduction, is agnostic to
      existing classification criteria or biases, and has been used in developmental biology to
      identify differentiation pathways from single-cell gene expression data.
  - id: https://doi.org/10.60775/fairhub.3#task-temporal-atlas
    name: Reconstruction of a temporal atlas of T2DM development and reversal
    response: >-
      "The long-term objective for this project is to develop a foundational dataset in T2DM,
      agnostic to existing classification criteria or biases, which can be used to reconstruct a
      temporal atlas of T2DM development and reversal towards health (i.e., salutogenesis)."
  - id: https://doi.org/10.60775/fairhub.3#task-no-predefined-ml-task
    name: No predefined machine-learning task shipped with the dataset
    response: >-
      The dataset ships with no predefined task or label: "N/A - no labels are provided. No
      specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic
      dataset aimed at facilitating multiple potential downstream AI/ML applications." It does
      ship a recommended training/validation/testing split.

addressing_gaps:
  - id: https://doi.org/10.60775/fairhub.3#gap-multimodal-datasets
    name: Absence of large, high-quality, inclusive multimodal datasets
    response: >-
      "The ability to understand and affect the course of complex, multi-organ diseases such as
      T2DM has been limited by a lack of well-designed, high quality, large, and inclusive
      multimodal datasets."
  - id: https://doi.org/10.60775/fairhub.3#gap-diversity
    name: Lack of racial and ethnic diversity in prior T2DM research
    response: >-
      "A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated that
      samples lacked racial and ethnic diversity, thus making AI-READI an important step forward
      in addressing these demographic inequities in research." The prevalence of T2DM is higher in
      certain racial and ethnic populations and the deleterious consequences are exacerbated in
      those populations.
  - id: https://doi.org/10.60775/fairhub.3#gap-ai-readiness
    name: Lack of datasets that are AI ready without reprocessing
    response: >-
      "However, a major barrier has been the lack of diverse datasets that are AI ready for
      training AI models, which the AI-READI project is designed to address."
  - id: https://doi.org/10.60775/fairhub.3#gap-salutogenesis
    name: Limited understanding of salutogenesis in T2DM
    response: >-
      "T2DM is a growing public health threat. Yet, the current understanding of T2DM, especially
      in the context of salutogenesis, is limited."

