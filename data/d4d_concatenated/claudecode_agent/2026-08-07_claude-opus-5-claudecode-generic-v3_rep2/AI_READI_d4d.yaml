id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The flagship dataset of the Artificial Intelligence Ready and Equitable (also rendered
  "Exploratory") Atlas for Diabetes Insights (AI-READI) project, one of four Data Generation
  Projects of the NIH Common Fund Bridge2AI programme. Version 3.0.0 contains multimodal data
  from 2,280 participants with and without type 2 diabetes mellitus (T2DM), collected between
  19 July 2023 and 1 May 2025 at three US sites (University of Alabama at Birmingham,
  University of California San Diego, and University of Washington) and harmonised across
  them. The cohort was recruited so as to be approximately balanced across self-reported
  race/ethnicity (Asian, Black, Hispanic, White), biological sex, and four categories of
  diabetes status (no diabetes; pre-diabetes or lifestyle-controlled; controlled by oral or
  non-insulin injectable medication; insulin-controlled), the aim being to support unbiased
  AI/ML model development. Each instance is an individual participant. Modalities include
  survey and social-determinants-of-health data, physical measurements and vitals, clinical
  laboratory results from blood and urine, a 12-lead electrocardiogram, cognitive screening,
  visual function testing, retinal photography, OCT, OCTA and fluorescence lifetime imaging
  ophthalmoscopy, ten days of continuous glucose monitoring, ten days of wearable activity
  monitoring, and ten days of home environmental sensing. The release comprises 356,343 files
  totalling about 3.82 TB, organised following the Clinical Dataset Structure (CDS) v0.1.1 as
  one directory per datatype, then modality, then device, then participant, with the files in
  each datatype directory following a domain-appropriate standard (WFDB, OMOP CDM, DICOM,
  Open mHealth, and the NASA ESDS ASCII guidelines). The dataset is published on the FAIRhub
  platform under DOI 10.60775/fairhub.3 and is distributed as a publicly downloadable set
  that carries no protected health information, alongside a controlled-access set available
  under a data use agreement. The stated goal is to enable AI/ML research into salutogenesis
  in T2DM - the pathway from disease back to health - and to serve as a model for future
  ethically sourced, AI-ready biomedical datasets.
notes: >-
  AI-READI is organised as six cross-disciplinary project modules with teams at eight
  institutions, and its remit extends beyond the dataset itself to a reusable blueprint for
  AI-ready data generation (project management, data collection, management and sharing
  guidance published through the project's Zenodo community and GitHub organisation), the
  development of the FAIRhub platform and the Clinical Dataset Structure specification, a
  year-long research internship programme, and engagement with the Native Biodata Consortium
  on tools for American Indian and Alaska Native data governance.
source_caveats: >-
  The declared bundle carries two FAIRhub records for this dataset and they disagree: the
  v2.0.0 record reports 2.01 TB across 165,051 files and states that "This version of the
  dataset is no longer accessible", while the v3.0.0 record and its API metadata report
  3.82 TB across 356,343 files. This record describes v3.0.0; the v2.0.0 figures are retained
  only inside version_access as historical scope. Four further disagreements are left
  unresolved rather than merged. (1) Affiliation: the FAIRhub study description gives Aaron
  Lee's affiliation, the lead sponsor and the managing organization as "Washington University
  in St. Louis" (ROR 01yc7t268), whereas NIH RePORTER lists the awardee organization as
  University of Washington, the BMJ Open protocol places Aaron and Cecilia Lee at the
  University of Washington, Seattle, and the data licence is issued by the University of
  Washington as Licensor; both readings are recorded where they occur. (2) Licence version:
  the v3.0.0 metadata names "AI-READI custom license v2.0" at doi.org/10.5281/zenodo.17555036,
  but the licence text actually included in the bundle is AI-READI-LICENSE-v1.0 from Zenodo
  record 10642459; the terms quoted in this record are from the bundled v1.0 text. (3) Target
  enrolment: the BMJ Open protocol and the FAIRhub study description state 4,000 participants,
  the NIH RePORTER abstract states "4,000+", and the UW IRB application states 4,600.
  (4) Enrolment start: the BMJ Open protocol gives 18 July 2023 while the FAIRhub study
  description gives an actual start date of 2023-07-19. Two further points: the FAIRhub
  de-identification metadata records deIdentType "NoDeIdentification" on the grounds that no
  identifiers were collected, while the Nature Metabolism comment states the public set is
  stripped of PHI by the HIPAA Safe Harbor method - both statements are carried in
  is_deidentified. Finally, the BMJ Open Table 2 arrives in the extracted text with its
  columns split into separate runs; the analyte / unit / reference-range / rationale pairings
  in the variables section were reconstructed from the preserved row order, which is internally
  consistent across all four runs but is a reconstruction rather than a direct reading.
