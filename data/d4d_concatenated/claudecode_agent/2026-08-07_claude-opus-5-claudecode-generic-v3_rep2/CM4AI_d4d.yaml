      - Sequence Read Archive (SRA) data linked as an NCBI BioProject
    description: >-
      Listed among the external data links of the June 2025 Data Release for the raw sequencing
      data.
  - name: Figshare
    external_resources:
      - CRISPRi Perturbation Atlas of iPSCs
    description: >-
      Listed among the external data links of the June 2026 Data Release.
  - name: Embargoed perturb-seq data
    external_resources:
      - Perturb-seq data in KOLF2.1J iPSCs (undifferentiated)
      - Perturb-seq data in MDA-MB-468 breast cancer cells with and without treatment
    restrictions:
      - Embargoed - temporary pre-publication embargo
    description: >-
      The October 2025 and June 2026 releases record these two external data resources as
      "Embargoed" rather than providing a repository link.

maintainers:
  - name: Trey Ideker, University of California San Diego
    role: researcher
    maintainer_details: >-
      Recorded as the Point of Contact for every documented CM4AI Dataverse release, and the
      principal investigator of the CM4AI Data Generation Project. The Dataverse page directs
      enquiries through its Contact Owner email button.
  - name: Swathi Thaker, University of Alabama at Birmingham
    role: researcher
    maintainer_details: >-
      CM4AI Program Manager, listed on cm4ai.org as the contact for project-related inquiries at
      snthaker@uab.edu.
  - name: Zhandos Sembay, University of Alabama at Birmingham
    role: other
    maintainer_details: >-
      Listed on cm4ai.org as the contact for website support and updates at zsembay8@uab.edu.
  - name: University of Virginia Dataverse (LibraData)
    role: academic_institution
    maintainer_details: >-
      LibraData, the University of Virginia's archival data repository and its instance of
      Dataverse, hosts the releases and provides long-term preservation supported by committed
      institutional funds. It is an NIH-approved generalist repository.

errata:
  - name: June 2025 Data Release revision
    erratum_url: https://doi.org/10.18130/V3/F3TD5R
    erratum_details: >-
      The published June 2025 Data Release is a revision of the original June 2025 release. The
      revision adds RGB immunofluorescent images, corrects RO-Crate metadata, and changes naming
      conventions.

updates:
  name: CM4AI quarterly update plan
  frequency: Quarterly
  update_details: >-
    CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input data
    streams. The maintenance plan recorded on each release states that the dataset will be regularly
    updated and augmented through the end of the project in November 2026, with updates on a
    quarterly basis. Data presented in a release will be augmented regularly through the end of the
    project, and predicted cell maps will be added in future releases.

retention_limit:
  name: Long-term preservation commitment
  retention_period: Long term
  retention_details: >-
    Long term preservation in the University of Virginia Dataverse, supported by committed
    institutional funds, as stated in the maintenance plan of the June 2025, October 2025 and June
    2026 releases.

version_access:
  name: CM4AI release versions
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
    - May 2024 Data Release - doi:10.18130/V3/DXWOS5, V1
    - March 2025 Data Release (Beta) - doi:10.18130/V3/B35XWX, V1, page version 1.4
    - June 2025 Data Release (Beta) - doi:10.18130/V3/F3TD5R, V2, page version 2.1
    - October 2025 Data Release (Beta) - doi:10.18130/V3/K7TGEM, V2, page version 2.1
    - June 2026 Data Release (Beta) - doi:10.18130/V3/HIGT4C, V2, page version 2.0
  version_details: >-
    Each quarterly release is a separately versioned Dataverse dataset with its own DOI. The
    cm4ai.org Data Releases page presents the June 2026 release as the latest and lists May 2024,
    March 2025, June 2025 and October 2025 releases in its archive. Dataverse retains earlier
    versions of each release DOI and offers version comparison; the captured pages show no version
    note records.
  source_caveats: >-
    The Dataverse citation block and the page version indicator disagree in form for several
    releases: for example the June 2026 page shows "Version 2.0" while its citation reads "V2", and
    the March 2025 page shows "Version 1.4" while its citation reads "V1". Both forms are recorded
    here rather than reconciled.

related_datasets:
  - target_dataset: https://doi.org/10.1101/2024.05.21.589311
    relationship_type: is_described_by
    description: >-
      The CM4AI project preprint, "Cell Maps for Artificial Intelligence: AI-Ready Maps of Human
      Cell Architecture from Disease-Relevant Cell Lines" (Clark T et al., bioRxiv, May 2024), is
      recorded as the Related Publication of every documented release and is the article the
      attribution terms require to be cited. It is made available under a CC BY-NC-ND 4.0
      International license.
  - target_dataset: https://doi.org/10.1101/2024.11.03.621734
    relationship_type: is_described_by
    description: >-
      "A Perturbation Cell Atlas of Human Induced Pluripotent Stem Cells" (Nourreddine S et al.,
      bioRxiv, 4 November 2024, PMCID PMC11580897) is listed as a Related Publication in the
      Dataverse metadata of the March 2025, June 2025, October 2025 and June 2026 releases, and
      describes the CRISPRi perturbation cell atlas distributed in those releases.

