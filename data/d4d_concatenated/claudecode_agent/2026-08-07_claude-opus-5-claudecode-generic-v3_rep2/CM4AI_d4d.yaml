relationships:
  - name: Matched multimodal design across cell types and conditions
    relationship_details: >-
      CM4AI generates deep multi-modal data for a shared list of proteins across all cell types and
      treatment conditions, so instances relate to one another by protein or gene identity, by cell
      line (MDA-MB-468 or KOLF2.1J and its derivatives) and by treatment or differentiation
      condition. The release metadata records that the protein-protein interaction (SEC-MS), protein
      localization (IF imaging) and CRISPRi perturb-seq data interrogate sets of proteins which
      incompletely overlap.

sampling_strategies:
  - name: Targeted protein and gene panels in two disease-relevant cell lines
    is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      MDA-MB-468 (RRID:CVCL_0419), a triple-negative breast cancer cell line established from a
      metastatic site pleural effusion of a 51-year-old black female with a metastatic mammary
      adenocarcinoma, available from ATCC; and KOLF2.1J (RRID:CVCL_B5P3), an iPSC line derived from
      a healthy male Northern European donor and available from the Human Induced Pluripotent Stem
      Cells Initiative (HipSci) resource to not-for-profit organizations via a simple MTA.
    why_not_representative: >-
      Data in the releases were derived from commercially available de-identified human cell lines
      and do not represent all biological variants which may be seen in the population at large.
    strategies: >-
      Multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in
      cancer, neuropsychiatric and cardiac disorders, extended in the release documentation to other
      proteins involved in those disorders. A CRISPR lentiviral library was designed targeting 100
      chromatin factors with 6 guide RNAs per gene; single-cell CRISPR screens covered 100 chromatin
      regulators in MDA-MB-468 cells under three conditions and in undifferentiated KOLF2.1J iPSCs.
      Release-level figures give whole-genome perturb-seq of more than 11,000 genes for the iPSC
      lineage and perturb-seq of 200 genes for the TNBC line, SEC-MS capturing approximately 7,000
      proteins in both, and IF images for 523 proteins in the TNBC line.

acquisition_methods:
  - name: Direct laboratory measurement from cultured cell lines
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details: >-
      All released instances are directly measured in the laboratory from cultured human cell lines
      rather than reported by subjects or inferred. The CRISPRi Perturbation Cell Atlas findings
      were validated via phenotypic, protein-interaction and metabolic tracing assays. Computed cell
      maps, which would be derived rather than directly observed, are not included in these
      releases.

collection_mechanisms:
  - name: Affinity purification mass spectrometry (AP-MS)
    mechanism_details: >-
      AP-MS on endogenously tagged cell lines was used to map protein-protein interactions of 100
      chromatin regulators under different conditions (cancer: no treatment, paclitaxel or
      vorinostat; iPSC: undifferentiated, neurons and cardiomyocytes). As of the 2024 project
      preprint, 17 genes had been endogenously tagged in MDA-MB-468 and AP-MS data acquired under
      three conditions, with 34 additional genes in the process of being tagged. AP-MS data for
      MDA-MB-468 cells with treatment appear in the June 2026 release.
  - name: Size-exclusion chromatography mass spectrometry (SEC-MS)
    mechanism_details: >-
      SEC-MS was used for proteome-wide complex and interaction mapping as an orthogonal mass
      spectrometry approach, performed in the Nevan Krogan laboratory at the University of
      California San Francisco. SEC-MS on MDA-MB-468 cells under three conditions (untreated,
      paclitaxel and vorinostat treated) identified 72 of 100 chromatin modifiers, 52 of them
      integral components of protein complexes, and detected protein-protein interaction profiles of
      over a thousand complexes, with thousands of proteins showing differential elution profiles
      between control and treated cells. SEC-MS in KOLF2 iPSCs and derivatives uncovered more than
      700 protein complexes in both parental iPSCs and differentiated neurons.
  - name: Immunofluorescence subcellular imaging (ICC-IF) with confocal microscopy
    mechanism_details: >-
      Spatial localization of proteins of interest was imaged by immunofluorescence-based staining
      (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford University, using the Human
      Protein Atlas resource of antibodies. Nuclei were stained with DAPI (blue channel);
      endoplasmic reticulum with a calreticulin antibody (yellow channel); microtubules with tubulin
      antibody (red channel); and the protein of interest with its antibody (green channel).
      Automated fixation and permeabilization protocols were established for a pipetting robot for
      the MDA-MB-468 and KOLF2 cell lines.
  - name: Single-cell CRISPRi perturbation screens (perturb-seq)
    mechanism_details: >-
      Single-cell CRISPR screens perturbing chromatin regulators were performed in MDA-MB-468 cells
      under three conditions (no treatment, paclitaxel or vorinostat) and in KOLF2.1J iPSCs in the
      undifferentiated state. MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were
      generated and characterized, and the screens were run using the 10x Genomics 3'HT kit. The
      released CRISPRi Perturbation Cell Atlas maps transcriptional and fitness phenotypes
      associated with 11,739 targeted genes in undifferentiated KOLF2.1J human induced pluripotent
      stem cells.

data_collectors:
  - name: Lundberg Lab, Stanford University
    role: Generation of immunofluorescence subcellular imaging data
    collector_details: >-
      The spatial localization image sets released for MDA-MB-468 cells under untreated, paclitaxel
      and vorinostat conditions were imaged in the Lundberg Lab at Stanford University. The project
      preprint records that IF images for the cell line and conditions are downloaded from the
      Lundberg Laboratory's deposition archive for further processing.
  - name: Nevan Krogan laboratory, University of California San Francisco
    role: Generation of mass spectrometry protein-protein interaction data
    collector_details: >-
      The SEC-MS datasets released for undifferentiated KOLF2.1J human induced pluripotent stem
      cells and for MDA-MB-468 human breast cancer cells following treatment with vorinostat or
      paclitaxel were generated in the Nevan Krogan laboratory at the University of California San
      Francisco. The project preprint records that PPI networks for the cell line and conditions are
      downloaded from the Krogan Laboratory's deposition archive for further processing.
  - name: CM4AI Data Acquisition Module
    role: Coordination of the three parallel mapping platforms
    collector_details: >-
      The Data Acquisition Module of CM4AI completed parallel maps of protein-protein interactions,
      protein subcellular distributions and transcriptional states associated with a
      near-comprehensive set of chromatin regulators encoded by the human genome. The Dataverse
      production location recorded for the releases is University of California San Diego;
      University of California San Francisco; Stanford University; University of Virginia.

collection_timeframes:
  - name: NIH award period
    start_date: '2022-09-01'
    end_date: '2026-08-31'
    timeframe_details: >-
      NIH RePORTER records the CM4AI Data Generation Project (core project number OT2OD032742) as
      running from 2022-09-01 to 2026-08-31, with fiscal year 2025 shown for the recorded award
      amount.
  - name: Quarterly data release programme
    timeframe_details: >-
      Releases documented in the bundle run from the May 2024 Data Release through the June 2026
      Data Release, with the cm4ai.org archive additionally listing March 2025, June 2025 and
      October 2025 releases. Each release's maintenance plan states that the dataset will be
      regularly updated and augmented through the end of the project in November 2026, with updates
      on a quarterly basis. The Data Creation Date and Deposit Date recorded on the March 2025, June
      2025, October 2025 and June 2026 Dataverse records are all 2025-02-27.
    source_caveats: >-
      The November 2026 project end stated in the release maintenance plans does not agree with the
      2026-08-31 project end recorded by NIH RePORTER; both are reported rather than reconciled.

direct_collection:
  - name: Data generated directly by CM4AI laboratories
    is_direct: true
    collection_details: >-
      Data were generated directly by CM4AI laboratories from cultured cell lines obtained from
      ATCC (MDA-MB-468) and the HipSci resource (KOLF2.1J), rather than obtained from third parties
      or from human participants. Both cell lines were described by the project as ethically
      sourced.

missing_data_documentation:
  - name: Known gaps in the current release series
    missing_data_patterns: >-
      Computed cell maps are not included in the releases. The protein-protein interaction (SEC-MS),
      protein localization (IF imaging) and CRISPRi perturb-seq data interrogate sets of proteins
      which incompletely overlap. On the CM4AI Data Releases page, IF images for the iPSC lineage
      flagship dataset and AP-MS interactomes for the TNBC flagship dataset are marked "coming
      soon", although the June 2026 release does include AP-MS data for MDA-MB-468 cells with
      treatment.
    missing_data_causes: >-
      The release metadata states that these data are not yet in completed final form and that some
      datasets are under temporary pre-publication embargo. Perturb-seq data in KOLF2.1J iPSCs
      (undifferentiated) and in MDA-MB-468 cells with and without treatment are marked "Embargoed"
      in the external data links of the October 2025 and June 2026 releases.
    handling_strategy: >-
      Data are released as interim Beta releases and augmented on a quarterly basis through the end
      of the project, with predicted cell maps stated to be added in future releases.

raw_data_sources:
  - name: MassIVE Repository
    source_description: >-
      Mass spectrometry data are deposited in the MassIVE repository and linked from the Dataverse
      releases as external data resources.
    source_type: external mass spectrometry repository
    access_details: >-
      The June 2025 release links MassIVE entries for mass spectrometry data in human iPSCs and in
      human cancer cells. The October 2025 and June 2026 releases link MassIVE entries for SEC-MS
      data in KOLF2.1J iPSCs (undifferentiated, NPC, neuron and cardiomyocyte) and in MDA-MB-468
      breast cancer cells with and without treatment; the June 2026 release adds MassIVE entries for
      AP-MS data in MDA-MB-468 cells treated with paclitaxel and with vorinostat.
  - name: NCBI BioProject and Sequence Read Archive (SRA)
    source_description: >-
      Raw sequence data from the CRISPRi perturbation screens are linked to NCBI BioProject and the
      Sequence Read Archive.
    source_type: external sequence repository
    access_details: >-
      The June 2025 release lists "Sequence Read Archive (SRA) Data: NCBI BioProject" among its
      external data links.
  - name: Figshare
    source_description: >-
      The CRISPRi Perturbation Atlas of iPSCs is linked to Figshare from the June 2026 release.
    source_type: external generalist repository
    access_details: >-
      Listed among the external data links of the June 2026 Data Release.
  - name: Embargoed perturb-seq data
    source_description: >-
      Perturb-seq data in undifferentiated KOLF2.1J iPSCs and in MDA-MB-468 breast cancer cells with
      and without treatment are recorded as embargoed rather than linked to an external repository.
    source_type: temporary pre-publication embargo
    access_details: >-
      Marked "Embargoed" in the external data links of the October 2025 and June 2026 releases; the
      release completeness statement records that some datasets are under temporary pre-publication
      embargo.

raw_sources:
  - name: Raw CRISPRi perturbation sequence data in the releases
    access_url: https://doi.org/10.18130/V3/HIGT4C
    raw_data_details: >-
      Raw sequence data from the expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J
      human induced pluripotent stem cells are distributed within the releases: as the "CRISPR
      Perturbation RNA Sequences - Raw Sequences" RO-Crate in the March 2025 release, and as
      cm4ai_perturb-seq_KOLF2_raw_sra.zip in the October 2025 and June 2026 releases.
  - name: Raw immunofluorescence image data in the releases
    access_url: https://doi.org/10.18130/V3/HIGT4C
    raw_data_details: >-
      Raw immunofluorescence image data for MDA-MB-468 cells under untreated, paclitaxel and
      vorinostat conditions are distributed as ZIP archives in every documented release from March
      2025 onward. The June 2025 revision added RGB immunofluorescent images. Copyright in the
      spatial proteomics raw image data is held by The Board of Trustees of the Leland Stanford
      Junior University.

preprocessing_strategies:
  - name: AI-readiness packaging with FAIRSCAPE and RO-Crate
    preprocessing_details: >-
      CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets
      in RO-Crate format using an extended, client-server version of the FAIRSCAPE framework. The
      client-side FAIRSCAPE-CLI package is called when a computation or coherent set of computations
      in the pipeline completes and is passed metadata defining JSON-Schema schemas for the datasets
      in the computational unit as well as the inputs, computations, software, models and outputs.
      It creates an RO-Crate package containing the datasets, metadata and software, or resolvable
      references to them, plus unique stubs for identifier creation. RO-Crates are sent to the
      FAIRSCAPE server, registered, and assigned persistent, resolvable, globally unique identifiers
      using the ARK scheme; the crates are then decomposed into their individual components -
      datasets, models and software - which are also registered and assigned identifiers. The server
      computes end-to-end entailments on each RO-Crate's provenance expressed in the EVI Evidence
      Graph Ontology and links them together where possible.
  - name: MuSIC cell map integration pipeline
    preprocessing_details: >-
      The Multi-Scale Integrated Cell (MuSIC) pipeline produces integrated cell maps from the
      multiple multimodal input data streams in segments, each of which calls the FAIRSCAPE client
      package to validate inputs and create the output RO-Crate for that segment. The steps are:
      download PPI and image data from the Krogan and Lundberg laboratory deposition archives;
      generate embeddings, processing PPI networks with the node2vec deep learning model and IF
      images with a Human Protein Atlas deep learning model; co-embed the PPI and image embeddings
      using contrastive deep learning so the original embeddings can be reconstructed with minimal
      information loss; perform protein community detection on all-by-all co-embedding similarities
      to create the hierarchy; and evaluate the hierarchy by aligning cell maps to known protein
      function and pathway resources including the Gene Ontology and Reactome, and by annotating
      assemblies with a large language model approach that names protein sets and assigns a name
      confidence score. The computed cell maps this pipeline produces are not included in the
      releases documented here.
  - name: June 2025 release revision
    preprocessing_details: >-
      The June 2025 Data Release was revised to add RGB immunofluorescent images, to correct
      RO-Crate metadata, and to change naming conventions.

cleaning_strategies:
  - name: Quality control of single-cell CRISPR screen data
    cleaning_details: >-
      As reported in the CM4AI project preprint of May 2024, describing Year 1 status, the data
      resulting from the single-cell CRISPR screens of 100 chromatin regulators in MDA-MB-468 cells
      and in undifferentiated KOLF2.1J iPSCs were at that time undergoing quality control. This is a
      status statement of that date and is retained here with that scope; the bundle does not record
      a later quality-control status for those data.
  - name: Dataset characterization and validation under the AI-readiness framework
    cleaning_details: >-
      The Standards Module established FAIR AI-readiness metadata and validation toolkits which were
      used to package and release the cell-line perturbation and measurement data. AI-readiness
      features present at the time of the project preprint comprise establishing FAIRness including
      rich metadata and persistent globally unique identifiers; computing a machine-readable
      provenance graph resolvable as metadata for all results, including inputs, computations,
      software and outputs; and characterizing and validating all datasets and data elements and
      mapping data elements to public ontology vocabularies where appropriate, using JSON-Schema
      mini-data-dictionary descriptions resolvable from the provenance graph metadata.

machine_annotation_tools:
  - name: MuSIC hierarchy evaluation and LLM assembly naming
    tools:
      - Gene Ontology alignment
      - Reactome alignment
      - large language model assembly-naming approach with name confidence scores
    tool_descriptions: >-
      In the hierarchy evaluation step of the MuSIC pipeline, cell maps are annotated in a two
      pronged approach: first by aligning them to known protein function and pathway resources
      including the Gene Ontology and Reactome to determine protein assemblies with high overlap
      with known cell biology, and second by annotating assemblies using a large language model
      approach developed by the project to name sets of proteins and assign a name confidence score.
      These annotations apply to computed cell maps, which are not included in the releases
      documented here.

anomalies:
  - name: Identical image archive names and sizes with differing checksums between releases
    anomaly_details: >-
      The three MDA-MB-468 immunofluorescence image archives distributed in the June 2026 release
      carry the same file names and the same displayed sizes as those in the October 2025 and June
      2025 releases but different MD5 checksums, and are dated 15 July 2026 rather than 31 October
      2025. The bundle does not state what changed between the two sets of archives.

known_biases:
  - name: Cell-line derivation limits biological representation
    bias_type: representation_bias
    bias_description: >-
      Data in the releases were derived from commercially available de-identified human cell lines
      and do not represent all biological variants which may be seen in the population at large.
      The two lines used derive from two individuals: MDA-MB-468 from a 51-year-old black female
      with a metastatic mammary adenocarcinoma, and KOLF2.1J from a healthy male Northern European
      donor.
    mitigation_strategy: >-
      The release metadata states this limitation explicitly under Potential Sources of Bias so that
      users are aware of it; the bundle does not describe a mitigation beyond disclosure.
    affected_subsets:
      - iPSC lineage flagship dataset
      - Triple-negative breast cancer flagship dataset

known_limitations:
  - name: Interim release
    limitation_type: scope_limitation
    limitation_description: >-
      The releases are interim Beta releases and the data are not yet in completed final form.
    scope_impact: >-
      Content and metadata are expected to change as the release series continues; the data will be
      regularly updated and augmented through the end of the project.
    recommended_mitigation: >-
      Cite the specific release DOI and version used, and check the Dataverse collection for a later
      quarterly release.
  - name: Computed cell maps not included
    limitation_type: coverage_limitation
    limitation_description: >-
      The releases do not contain predicted cell maps, which the release notes state will be added
      in future releases.
    scope_impact: >-
      The current releases are most suitable for bioinformatics analysis of the individual datasets
      rather than for use of an integrated cell map.
  - name: Incomplete overlap between modalities
    limitation_type: integration_limitation
    limitation_description: >-
      The protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi
      perturb-seq data interrogate sets of proteins which incompletely overlap.
    scope_impact: >-
      Cross-modality analyses are restricted to the intersection of the interrogated protein sets.
  - name: Temporary pre-publication embargo on some datasets
    limitation_type: coverage_limitation
    limitation_description: >-
      Some datasets are under temporary pre-publication embargo; the perturb-seq data in
      undifferentiated KOLF2.1J iPSCs and in MDA-MB-468 cells with and without treatment are marked
      "Embargoed" in the external data links of the October 2025 and June 2026 releases.
    scope_impact: >-
      Those data cannot be obtained from the linked external repositories while the embargo is in
      force.
  - name: Domain expertise required
    limitation_type: methodological_limitation
    limitation_description: >-
      The release notes state that meaningful analysis of the data requires domain expertise.

confidential_elements:
  - name: Confidentiality of the released data
    confidential_elements_present: false
    confidentiality_details: >-
      The Data Governance & Ethics metadata of the June 2025, October 2025 and June 2026 releases
      records Human Subjects: No, De-identified Samples: Yes and FDA Regulated: No. The project
      states that CM4AI data are distinctive within Bridge2AI in being non-clinical, from tissue
      cultures, and are considered de-identified as they cannot be matched, with current knowledge,
      to a human subject. All files listed in the documented releases are marked Public access in
      Dataverse.

sensitive_elements:
  - name: Sensitivity of the released data
    sensitive_elements_present: false
    sensitivity_details: >-
      The releases contain laboratory measurements on cultured human cell lines rather than data
      about identifiable people. The release governance metadata records that the work does not
      involve human subjects and that samples are de-identified, and the project states that the
      data cannot be matched, with current knowledge, to a human subject. The bundle records donor
      characteristics for the two source cell lines (a 51-year-old black female for MDA-MB-468 and a
      healthy male Northern European donor for KOLF2.1J) as published cell-line provenance.

is_deidentified:
  name: De-identification status of CM4AI data
  identifiable_elements_present: false
  method: >-
    Data are derived from commercially available, de-identified human cell lines. CM4AI data are
    non-clinical, from tissue cultures, and are considered to be de-identified as they cannot be
    matched, with current knowledge, to a human subject.
  deidentification_details: >-
    The Data Governance & Ethics metadata of the June 2025, October 2025 and June 2026 releases
    records De-identified Samples: Yes and Human Subjects: No.

human_subject_research:
  name: Human subject research status
  involves_human_subjects: false
  regulatory_compliance:
    - Not FDA regulated
  description: >-
    The Data Governance & Ethics metadata of the June 2025, October 2025 and June 2026 releases
    records Human Subjects: No, De-identified Samples: Yes and FDA Regulated: No. The project
    describes its data as non-clinical, obtained from tissue cultures, and considered de-identified
    because they cannot be matched, with current knowledge, to a human subject. The two source cell
    lines are described as ethically sourced: MDA-MB-468 is available from ATCC, and KOLF2.1J is
    available from the HipSci resource for access by not-for-profit organizations via a simple MTA.
  source_caveats: >-
    The bundle does not report an IRB determination or an ethics review board of record for the
    CM4AI data generation work, so `irb_approval` and `ethics_review_board` are left unpopulated.

ethical_reviews:
  - name: CM4AI ethical review contact - Vardit Ravitsky
    reviewing_organization: CM4AI Ethics Module
    review_details: >-
      Vardit Ravitsky (ravitskyv@thehastingscenter.org, ORCID 0000-0002-7080-8801) is named under
      Ethical Review in the Data Governance & Ethics metadata of the June 2025, October 2025 and
      June 2026 Dataverse releases.
    contact_person: https://orcid.org/0000-0002-7080-8801
  - name: CM4AI ethical review contact - Jean-Christophe Bélisle-Pipon
    reviewing_organization: CM4AI Ethics Module
    review_details: >-
      Jean-Christophe Bélisle-Pipon of Simon Fraser University
      (jean-christophe_belisle-pipon@sfu.ca, ORCID 0000-0002-8965-8153) is named under Ethical
      Review in the Data Governance & Ethics metadata of the June 2025, October 2025 and June 2026
      Dataverse releases.
    contact_person: https://orcid.org/0000-0002-8965-8153
  - name: CM4AI Ethics Module governance programme
    reviewing_organization: CM4AI Ethics Module
    review_details: >-
      The Ethics team worked closely with the Data Acquisition, Tools and Standards Modules to
      develop a plan for ethical preparation, licensing, dissemination and Data Access supervision
      of CM4AI datasets, balancing openness of the data with protection of intellectual property and
      supervision and monitoring of potential efforts at commercialization. The team employs a
      methodology inspired by Value-Sensitive Design, creating an axiological repository of values
      to guide design standards and expectations, and is formulating the CM4AI Life Cycle, a
      framework elucidating governance milestones throughout data generation and AI system
      development. The Ethics Pillar also supported the Bridge2AI Ethics Working Group in helping
      the Bridge2AI Data Sharing and Dissemination Working Group develop a Code of Conduct, which
      outlines basic requirements that participants in the Bridge2AI Open House must attest and
      commit to before accessing B2AI data, including CM4AI datasets.

intended_uses:
  - name: Intended uses stated in the release metadata
    use_category: research
    examples:
      - AI-ready datasets to support research in functional genomics
      - AI model training
      - Cellular process analysis
      - >-
        Cell architectural changes and interactions in presence of specific disease processes,
        treatment conditions, or genetic perturbations
    usage_notes: >-
      The Intended Use statement appears in the Dataverse metadata of the June 2025, October 2025
      and June 2026 releases.

prohibited_uses:
  - name: Clinical decision-making and patient care
    prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.

discouraged_uses:
  - name: Commercial use without a separate licence
    discouragement_details: >-
      Data packages are licensed under Creative Commons CC BY-NC-SA 4.0, which does not permit use
      of the material for commercial purposes. Commercial use requires a separate license
      negotiation with the copyright holder (UCSD, Stanford and/or UCSF depending upon the specific
      data package in question), and a Data Access Committee supervises ethical matters related to
      dataset distribution and potential dual licensing for commercial use.
  - name: Use of an interim release as an integrated cell map resource
    discouragement_details: >-
      The release notes state that the current release is most suitable for bioinformatics analysis
      of the individual datasets and does not contain predicted cell maps, which will be added in
      future releases.

existing_uses:
  - name: Documented uses of the released data
    examples:
      - >-
        Made available at the CM4AI CodeFest in March 2024, accompanied by detailed tutorials
        explaining how the data were derived and integrated and providing production-ready software
        for producing the datasets.
      - >-
        Described and cited by the CM4AI project preprint, Clark T et al., "Cell Maps for Artificial
        Intelligence: AI-Ready Maps of Human Cell Architecture from Disease-Relevant Cell Lines",
        bioRxiv, May 2024, doi:10.1101/2024.05.21.589311.
      - >-
        Listed as a related publication of the releases: Nourreddine S et al., "A Perturbation Cell
        Atlas of Human Induced Pluripotent Stem Cells", bioRxiv, 4 November 2024, PMCID PMC11580897,
        doi:10.1101/2024.11.03.621734.

other_tasks:
  - name: Downstream applications of cell maps
    task_details: >-
      Cell maps built from these data streams provide a foundation for downstream applications in
      human genomics, including interpretation of genetic variants and mutations, and have been used
      in AI tools for visible machine learning or visible neural networks to interrogate how protein
      assemblies in the cell affect cell-level phenotype predictions. The project also states that
      the maps are intended to support development of a library of large-scale maps of cellular
      structure and function across demographic and disease contexts.

future_use_impacts:
  - name: Composition of the release will change over time
    impact_details: >-
      Data presented in a release will be augmented regularly through the end of the project, and
      predicted cell maps will be added in future releases, so analyses pinned to an interim release
      may not reflect later content. Software packages will be versioned as the project progresses,
      and the version used to produce each dataset will be referenced in the dataset's metadata,
      which allows a consumer to identify the software state behind a given release.
  - name: Repository under administrative review
    impact_details: >-
      Both the cm4ai.org site and the Cell Maps for Artificial Intelligence collection in the
      University of Virginia Dataverse display the notice that the repository or collection is under
      review for potential modification in compliance with Administration directives.

use_repository:
  - name: CM4AI web portal
    repository_url: https://cm4ai.org/
    repository_details: >-
      Data packages from CM4AI, including links to software used in preparing the data, input
      datasets, dataset schemas and deep provenance graphs, are available on the CM4AI web portal,
      which is built on the U-BRITE platform and supports open dissemination of CM4AI-generated
      data, maps and tools.
  - name: Cell Maps for Artificial Intelligence collection, University of Virginia Dataverse
    repository_url: https://dataverse.lib.virginia.edu/
    repository_details: >-
      Releases are published in the Cell Maps for Artificial Intelligence collection within School
      of Medicine, LibraData: UVa's Scholarly Research, in the University of Virginia Dataverse.
      LibraData is the University of Virginia's instance of Dataverse, an NIH-approved generalist
      repository. The current release is at
      https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C; the
      bundle gives no separate URL for the collection itself.

license_and_use_terms:
  name: CM4AI data licence and use terms
  data_use_permission: no_commercial_use
  license_terms: >-
    Data packages are licensed for reuse under the Creative Commons Attribution-NonCommercial-
    ShareAlike 4.0 International license (CC BY-NC-SA 4.0,
    https://creativecommons.org/licenses/by-nc-sa/4.0/). Under that licence a user is free to share
    (copy and redistribute the material in any medium or format) and to adapt (remix, transform and
    build upon the material), subject to: Attribution - appropriate credit must be given, a link to
    the license provided, and changes indicated; NonCommercial - the material may not be used for
    commercial purposes, a commercial use being one primarily intended for commercial advantage or
    monetary compensation; ShareAlike - contributions built upon the material must be distributed
    under the same license; and no additional restrictions - no legal terms or technological
    measures may be applied that legally restrict others from doing anything the license permits.
    Attribution requirements for CM4AI datasets include attribution to the copyright holders and the
    Cell Maps for Artificial Intelligence project as referenced in the datasets, and citation of the
    CM4AI project article. Dataverse Community Norms and good scientific practice additionally
    expect that proper credit is given via the data citation shown on the dataset page. Commercial
    use requires a separate license negotiation with the copyright holder.

ip_restrictions:
  name: Copyright and intellectual property restrictions
  restrictions:
    - >-
      Copyright in the March 2025 and later data releases is held by The Regents of the University
      of California, except where otherwise noted; the 2024 project preprint states the equivalent
      for the 2024 releases.
    - >-
      Copyright in the spatial proteomics raw image data is held by The Board of Trustees of the
      Leland Stanford Junior University.
    - >-
      Commercial use requires a separate license negotiation with the copyright holder - UCSD,
      Stanford and/or UCSF depending upon the specific data package in question.
    - >-
      A Data Access Committee supervises ethical matters related to dataset distribution and
      potential dual licensing for commercial use.
    - >-
      Software comprising the Tools data integration pipeline is available under the BSD-3 open
      source license in GitHub for alpha-level tools or in the Zenodo long-term archive for
      production-ready tools; the FAIRSCAPE AI-readiness framework is available under the MIT
      license, copyright held by the Rector and Board of Visitors of the University of Virginia.

regulatory_restrictions:
  name: Governance and regulatory status
  confidentiality_level: unrestricted
  regulatory_restrictions:
    - Not FDA regulated, as recorded in each release's Data Governance & Ethics metadata.
    - >-
      This repository is under review for potential modification in compliance with Administration
      directives - notice displayed on cm4ai.org and on the Cell Maps for Artificial Intelligence
      Dataverse collection.
  other_compliance: >-
    Participants in the Bridge2AI Open House must attest and commit to the Bridge2AI Code of
    Conduct, developed by the Bridge2AI Data Sharing and Dissemination Working Group with support
    from the Bridge2AI Ethics Working Group, before accessing B2AI data including CM4AI datasets.
  description: >-
    All files listed in the documented releases are marked Public access in Dataverse, with no
    request-access requirement. Some datasets linked as external resources are under temporary
    pre-publication embargo. The Data Governance Committee contact recorded in the Data Governance &
    Ethics metadata of the June 2025, October 2025 and June 2026 releases is Jillian Parker of the
    University of California, San Diego (jillianparker@health.ucsd.edu, ORCID 0000-0003-4535-3486).
  governance_committee_contact: https://orcid.org/0000-0003-4535-3486

third_party_sharing:
  - name: Distribution through third-party repositories
    is_shared: true
    description: >-
      Releases are distributed through the University of Virginia's LibraData Dataverse rather than
      by the generating institutions directly, and component data are additionally deposited in the
      MassIVE repository, NCBI BioProject and the Sequence Read Archive, and Figshare.

distribution_formats:
  - name: ZIP archives
    format: ZIP
    media_type: application/zip
    description: >-
      The bulk data in the October 2025 and June 2026 releases are distributed entirely as ZIP
      archives: immunofluorescence image sets, SEC-MS and AP-MS mass spectrometry data, perturb-seq
      cell atlas and raw SRA data, and release metadata. The March 2025 and June 2025 releases
      distribute the image sets as ZIP archives alongside uncompressed metadata files.
    access_urls:
      - https://dataverse.lib.virginia.edu/api/access/datafile/
  - name: RO-Crate metadata (JSON)
    format: JSON
    media_type: application/json
    description: >-
      RO-Crate metadata files accompany the data, expressed in JSON-LD using vocabularies from
      Schema.org, EVI and other public ontologies. The March 2025 release distributes a separate
      ro-crate-metadata.json for each data package; the June 2025 release adds a
      release-ro-crate-metadata.json with pointers to sub RO-Crates.
  - name: HTML datasheet and provenance graphs
    format: HTML
    media_type: text/html
    description: >-
      The June 2025 release distributes release-ro-crate-datasheet.html, an HTML datasheet
      summarizing key release information, and per-package provenance graph HTML files. The
      provenance graph files require download to view properly and do not display in the Dataverse
      preview.
  - name: Dataverse metadata export formats
    description: >-
      Dataverse offers metadata export for each release in OAI_ORE, DataCite, OpenAIRE, Schema.org
      JSON-LD, DDI Codebook v2, Dublin Core, DDI HTML Codebook and JSON; the October 2025 and June
      2026 releases additionally offer Croissant.

