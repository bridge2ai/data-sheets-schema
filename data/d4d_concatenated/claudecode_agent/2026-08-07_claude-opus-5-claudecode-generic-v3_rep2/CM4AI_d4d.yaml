    name: CM4AI March 2025 Data Release (Beta)
    title: Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta)
    doi: 10.18130/V3/B35XWX
    distribution_dates:
      - name: Dataverse publication date
        release_dates:
          - '2025-03-03'
    version: V1
    status: Beta
    license: CC BY-NC-SA 4.0
    publisher: https://dataverse.lib.virginia.edu/
    page: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
    description: >-
      The March 2025 Data Release of CM4AI. This Beta release includes perturb-seq data in
      undifferentiated KOLF2.1J iPSCs; SEC-MS data in undifferentiated KOLF2.1J iPSCs and
      iPSC-derived NPCs, neurons and cardiomyocytes; and IF images in MDA-MB-468 breast cancer cells
      in the presence and absence of chemotherapy (vorinostat and paclitaxel). Output data are
      packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format
      using the FAIRSCAPE framework. Data creation date 2025-02-27; deposited 2025-02-27 by Justin
      Niestroy; production location University of California San Diego; University of California San
      Francisco; University of California San Francisco; Stanford University; University of
      Virginia. The page reports 302 downloads and six files across archive and data types, all
      public. Subject: Medicine, Health and Life Sciences.
    source_caveats: >-
      The page displays "Version 1.4" while the citation reads V1. The production location field
      lists University of California San Francisco twice. The dataset description carries two
      trailing dates, "(2025-03-04)" and "(2025-03-07)", which the page does not explain.
  - id: https://doi.org/10.18130/V3/F3TD5R
    name: CM4AI June 2025 Data Release (Beta)
    title: Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta)
    doi: 10.18130/V3/F3TD5R
    distribution_dates:
      - name: Dataverse publication date
        release_dates:
          - '2025-07-01'
    version: V2
    status: Beta
    license: CC BY-NC-SA 4.0
    publisher: https://dataverse.lib.virginia.edu/
    page: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
    description: >-
      A revision of the June 2025 Data Release of CM4AI, adding RGB immunofluorescent images,
      correcting RO-Crate metadata and changing naming conventions. This Beta release includes
      perturb-seq data in undifferentiated KOLF2.1J iPSCs; SEC-MS data in undifferentiated KOLF2.1J
      iPSCs, iPSC-derived NPCs, neurons, cardiomyocytes, and treated and untreated MDA-MB-468 breast
      cancer cells; and IF images in MDA-MB-468 breast cancer cells in the presence and absence of
