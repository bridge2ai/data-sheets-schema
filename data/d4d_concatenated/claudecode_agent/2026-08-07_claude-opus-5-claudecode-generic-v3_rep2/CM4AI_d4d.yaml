id: https://cm4ai.org/data-releases/
name: CM4AI Data Releases
title: Cell Maps for Artificial Intelligence (CM4AI) Data Releases
description: >-
  The quarterly data release programme of Cell Maps for Artificial Intelligence (CM4AI), the
  Functional Genomics Grand Challenge and Data Generation Project of the NIH Common Fund's
  Bridge to Artificial Intelligence (Bridge2AI) program. CM4AI seeks to map the spatiotemporal
  architecture of human cells and to use those maps toward the grand challenge of interpretable
  genotype-phenotype learning, delivering machine-readable hierarchical maps of cell architecture
  as AI-ready data together with quarterly releases of the map-input data streams.


  The released input data streams are produced by three complementary mapping approaches:
  proteomic mass spectrometry for protein-protein interactions (affinity purification mass
  spectrometry, AP-MS, and size-exclusion chromatography mass spectrometry, SEC-MS); spatial
  proteomics by immunofluorescence (ICC-IF) staining and confocal microscopy; and genetic
  perturbation by CRISPR/Cas9, delivered as single-cell CRISPRi perturb-seq. Data are generated in
  two disease-relevant cell lines under perturbed and unperturbed conditions: the triple-negative
  breast cancer line MDA-MB-468 (untreated, paclitaxel-treated and vorinostat-treated) and the
  induced pluripotent stem cell line KOLF2.1J together with iPSC-derived neural progenitor cells,
  neurons and cardiomyocytes. Targets centre on chromatin modifiers, metabolic enzymes and other
  proteins involved in cancer, neuropsychiatric and cardiac disorders.


  Releases are published as Beta releases in the "Cell Maps for Artificial Intelligence" collection
  of LibraData, the University of Virginia's instance of Dataverse and an NIH-approved generalist
  repository. Each release is packaged with provenance graphs and rich metadata as AI-ready
  datasets in RO-Crate format, produced by an extended client-server version of the FAIRSCAPE
  framework, which assigns persistent, resolvable, globally unique ARK identifiers that resolve to
  human- and machine-readable JSON-LD landing pages using Schema.org, EVI (Evidence Graph Ontology)
  and other public vocabularies. Data integration into cell maps is performed by the Multi-Scale
  Integrated Cell (MuSIC) pipeline; computed cell maps are not included in the releases documented
  here.


  CM4AI is organised into three pillars (Data, People and Ethics) across six modules: Data
  Acquisition, Tools and Standards under Data; Skills and Workforce Development and Teaming under
  People; and Ethics. The project reports project-wide totals of 1,374 protein interactions, 53,788
  immunofluorescent images, 7,023 total proteins investigated, 11,739 genes targeted and 21.4 TB of
  data volume.
notes: >-
  CM4AI defines AI-ready biomedical data as fully characterized FAIR data of known provenance which
  can be ethically and reliably processed by AI applications, whose models and software are
  available and well-described for validation and re-use, and whose predictions may be fully
  explained and interpreted to the user as needed. The project sets out five interdependent
  criteria - FAIR, Provenanced, Characterized, Explainable and Ethical - and notes that ethical
  validation capability depends upon explainability and explainability depends upon provenance.


  A cell map, as the project defines it, is a hierarchical directed acyclic graph in which each node
  represents an assembly of proteins in proximity at a given scale, spanning from large assemblies
  representing cell compartments such as the nucleus and mitochondria to small assemblies of
  proteins in close proximity such as protein complexes or subunits. Cell maps are shared via the
  Network Data Exchange (NDEx) and can be visualized in a web browser or accessed via tools such as
  Cytoscape, HiView and the Python ndex2 library.
source_caveats: >-
  Referent: this record describes the CM4AI data release programme as an ongoing quarterly series,
  with the individual Dataverse releases enumerated under `resources`. The declared bundle also
  contains the Nature 2025 publication "Multimodal cell maps as a foundation for structural and
  functional genomics" (Schaffer et al., Nature 642:222-231), which reports a U2OS osteosarcoma
  cell map deposited in NDEx, the EBI Complex Portal, MassIVE (MSV000097168), ProteomeXchange
  (PXD052362) and ModelArchive. That map is a distinct dataset from the CM4AI Dataverse releases -
  a different cell line, different repositories and a partly different author set - even though its
  acknowledgements cite the same Bridge2AI award (OT2 OD032742). It has therefore not been merged
  into this record and no relationship type is asserted for it, because the bundle does not state
  one.


  Release-date discrepancy: the cm4ai.org Data Releases page labels DOI 10.18130/V3/HIGT4C the
  "June 2026 Data Release (Beta)" but displays "Released on: June 17, 2025"; the Dataverse record
  for that DOI gives publication date 2026-06-17, and the bundle's source metadata records version
  2 as released 2026-07-15T20:28:19Z.


  Project end date: NIH RePORTER gives the project period as 2022-09-01 to 2026-08-31, while every
  Dataverse release maintenance plan states that the dataset will be updated and augmented "through
  the end of the project in November 2026". Both statements are recorded under
  `collection_timeframes` rather than reconciled.


  Collaborating institutions: the cm4ai.org Data Releases page lists UCSD, UCSF, Stanford, UVA,
  Yale, UT Austin, UA Birmingham, Simon Fraser University and the Hastings Center; the Dataverse
  release descriptions give the same list without UT Austin. The bioRxiv preprint's affiliation
  list additionally names the University of Alabama and the University of Montreal and does not
  name the Hastings Center.


  Author affiliations: the Dataverse author list gives Sali A as University of California San
  Diego, whereas the bioRxiv preprint and the Nature publication give University of California San
  Francisco. Ravitsky V is listed as University of Montreal in the author list while the ethical
  review contact for the same person carries a Hastings Center address. On the June 2026 release
  page the affiliation field for Clark T, Al Manir S, Levinson MA, Niestroy J and Ratcliffe S shows
  the ROR identifier https://ror.org/0153tk833 in place of the institution name that the March
  2025, June 2025 and October 2025 pages give as University of Virginia; the named form is used
  here.


  Copyright year: the bioRxiv preprint states copyright 2024 for the datasets and for the Stanford
  raw image data, while the March 2025 and later Dataverse release descriptions state 2025 for the
  same statements.


  File sizes: Dataverse displays rounded file sizes only (for example "3.8 GB", "31.1 KB"), so no
  exact byte counts are recorded in this datasheet. The captured June 2025 release page reports 21
  files but lists only the first 10, so that release's file inventory here is partial.


  Protein counts for the immunofluorescence images disagree across sources and releases: the
  cm4ai.org Data Releases page states IF images for 523 proteins, the March 2025 release file
  descriptions state 563 proteins, and the June 2025, October 2025 and June 2026 release file
  descriptions state 464 proteins. The 2024 bioRxiv preprint describes spatial proteomics mapping
  of 100 chromatin regulators with another 500 proteins pending.
