      data as an NCBI BioProject and to MassIVE for mass spectrometry data in human iPSCs and human
      cancer cells. This is the earliest release in the bundle to carry the structured Data
      Governance & Ethics, Completeness, Maintenance Plan, Intended Use, Limitations, Prohibited
