purposes:
  - name: Deliver AI-ready maps of human cell architecture
    response: >-
      CM4AI's objective is to deliver machine-readable hierarchical maps of cell architecture as
      AI-ready data produced from multimodal interrogation of 100 chromatin modifiers and 100
      metabolic enzymes involved in cancer, neuropsychiatric and cardiac disorders in
      disease-relevant cell lines under perturbed and unperturbed conditions, using state-of-the-art
      mass spectrometry based proteomics, spatial proteomics / cell imaging, and genetic
      perturbations using CRISPR.
  - name: Enable interpretable genotype-phenotype learning
    response: >-
      The CM4AI data generation project seeks to map the spatiotemporal architecture of human cells
      and use these maps toward the grand challenge of interpretable genotype-phenotype learning,
      creating a library of large-scale maps of cellular structure and function across demographic
      and disease contexts.
  - name: Produce ethical, AI-ready datasets for biomedical AI research
    response: >-
      CM4AI's overarching mission is to produce ethical, AI-ready datasets of cell architecture,
      inferred from multimodal data collected for human cell lines, to enable transformative
      biomedical AI research. At a strategic level CM4AI aims to ethically leverage state-of-the-art
      computational and experimental tools in biomedical science to enable a new generation of
      transformative artificial intelligence research to benefit humanity.

tasks:
  - name: Support visible machine learning systems
    response: >-
      The project generates a resource of matched data and tools to enable the creation of "visible"
      machine learning systems, which are not black boxes but are built directly on knowledge maps
      of cell and tissue architecture. Cell maps have been used in AI tools for visible machine
      learning or visible neural networks (VNNs) to interrogate how protein assemblies in the cell
      affect cell-level phenotype predictions.
  - name: Interpret genetic variants and mutations
    response: >-
      Cell maps provide a foundation for downstream applications in human genomics, including
      interpretation of genetic variants and mutations.
  - name: Analyse cell architecture under disease, treatment and perturbation
    response: >-
      The releases are intended to support analysis of cellular processes and of cell architectural
      changes and interactions in the presence of specific disease processes, treatment conditions
      or genetic perturbations.

addressing_gaps:
  - name: Black-box machine learning in genomics and precision medicine
    response: >-
      In genomics and precision medicine, machine learning models are often "black boxes",
      predicting phenotypes from genotypes without understanding the mechanisms by which such
      translation occurs. CM4AI addresses this deficiency with a coordinated effort involving three
      complementary mapping approaches, producing data that broadly stimulate research and
      development in visible machine learning systems informed by multi-scale cell and tissue
      architecture.
  - name: Absence of standardised AI-readiness packaging for functional genomics data
    response: >-
      The project implements a standards-based data management approach founded on FAIR access and
      software principles, with deep provenance and replication packages for representation of cell
      maps and their underlying datasets, because AI-readiness requires datasets that are FAIR,
      provenanced, characterized, explainable and ethical.
  - name: Gaps in the biomedical AI/ML workforce
    response: >-
      The Skills and Workforce Development module identified gaps in training of the functional
      genomic and biomedical AI/ML workforce, and the project distributes its data and tools with
      broad training so that researchers can leverage datasets produced by Bridge2AI and other
      programs.

