id: d4d:chorus_dataset
name: CHoRUS Dataset
title: Bridge2AI for Clinical Care Dataset
description: >-
  A multicenter, multimodal, high-resolution clinical care dataset assembled by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for
  Equitable AI data generation project, one of four data generation projects in the
  NIH Common Fund Bridge2AI program. CHoRUS collects retrospective clinical data on
  critically and acutely ill patients from 14 data-contributing hospitals within a
  collaboration spanning 20 academic centers, harmonizes it to unified standards, and
  makes it available under controlled access in a cloud enclave. The project website
  describes a current released dataset of 50,000 patient admissions from ICU, PICU, and
  NICU settings, comprising 1.6 billion rows of EHR data in the OMOP Common Data Model,
  7,642 admissions with radiology data, and 23 Tb of waveform data, against an
  anticipated final dataset of 100,000 patient admissions covering 9 data modalities from
  14 contributing hospitals. Nine data types are documented: demographics, medication
  administration, procedures, nursing flowsheets, and diagnoses standardized to OMOP;
  clinical notes extracted and tokenized with the OHNLP toolkit; imaging from PACS in
  DICOM; waveform telemetry from bedside monitors and gateway middleware in WFDB; and
  waveform EEG from hospital databases in EDF+ and Persyst formats. The stated goal is a
  publicly available, AI-ready critical care dataset supporting the characterization of
  acute and critical care illness, the prediction of complications, and the measurement
  of treatment response, together with a sequestered holdout test set for external
  validation of models.
status: Released under controlled access; data acquisition ongoing toward the anticipated
  final dataset.
page: https://chorus4ai.org/
conforms_to: OMOP Common Data Model
keywords:
  - Critical Care
  - Critical Illness
  - acute care
  - Electronic Health Record
  - Electroencephalography
  - Telemetry
  - Artificial Intelligence
  - Machine Learning
  - Bridge to Artificial Intelligence
  - social health determinants
  - data standards
  - repository
  - multimodality
  - Image
source_caveats: >-
  Evidence notes for this record. (1) The nine-row data-type table in the AIM-AHEAD
  Cohort 2 informational webinar was recovered from PDF text extraction with its columns
  interleaved; the data-standard, access-control, and published-metadata-schema values
  reconstructed here follow the row order and the exact count of "Yes (OMOP schema)"
  entries, but the reconstruction of the per-row "Metadata" column is the least certain
  part of that table. (2) The webinar reports the dataset as of August 2025 covering 14
  hospitals with over 45,000 unique admissions and approximately 1,000 images available,
  while the project website reports a current released dataset of 50,000 admissions and
  7,642 admissions with radiology data; both figures are retained here as statements at
  different points in time rather than reconciled into one number. (3) The MIT License
  named in the CHoRUS GitHub organization README applies to that organization's software
  and repositories; the sources state no license for the dataset itself, only that a
  licensing agreement must be signed, so no dataset-level license is asserted. (4) The
  waveform volume is printed as "23 Tb" on the project website; the sources do not state
  whether this is terabytes or terabits, nor a base, so it is transcribed verbatim rather
  than converted to a byte count. (5) `conforms_to` records the OMOP Common Data Model
  because the sources state the dataset is standardized to it; non-tabular modalities are
  additionally carried in DICOM, WFDB, EDF+/Persyst, and OHNLP formats, recorded under
  distribution_formats. (6) The sources describe no IRB approval, no participant consent
  process, and no participant compensation for the patients whose records comprise the
  dataset, so those slots are omitted rather than inferred; the stipend and travel
  allowance described in the bundle belong to the AIM-AHEAD training program's trainees,
  not to data subjects. (7) The sources state no dataset DOI, version identifier, release
  date, or download URL.

external_resources:
  - id: d4d:chorus_ext_github
    name: CHoRUS GitHub organization
    description: >-
      The chorus-ai GitHub organization houses 28 repositories providing software and
      tooling to interact with and extract insight from clinical data in diverse formats,
      validated semantic mappings connecting clinical data in various source formats to
      international standards, standard operating protocols (SOPs) instructing data
      contributing sites on best practices for curating and delivering interoperable
      datasets, and project management overviews tracking data delivery status and task
      dependencies. The organization is licensed under the MIT License.
    external_resources:
      - https://github.com/chorus-ai
    used_software:
      - id: d4d:sw_chorus_container_apps
        name: chorus-container-apps
        description: >-
          Set of dockerized container applications and associated configurations deployed
          to support CHoRUS services on Azure.
        url: https://github.com/chorus-ai/chorus-container-apps
      - id: d4d:sw_chorus_extract_upload
        name: chorus-extract-upload
        description: Tools to create and upload a CHoRUS Data Extract.
        license: MIT
        url: https://github.com/chorus-ai/chorus-extract-upload
      - id: d4d:sw_chorus_sop
        name: Chorus_SOP
        description: >-
          Centralized SOP documentation site carrying an interactive workflow diagram of
          the step-by-step process for extracting and contributing clinical data to
          CHoRUS, with links to SOP documents that have undergone internal validation and
          review.
        license: Apache-2.0
        url: https://github.com/chorus-ai/Chorus_SOP
      - id: d4d:sw_chorus_reports
        name: CHoRUSReports
        description: >-
          Repository dedicated to producing characterization reports returned to sites
          following their data submissions.
        url: https://github.com/chorus-ai/CHoRUSReports
  - id: d4d:chorus_ext_website
    name: CHoRUS project website
    description: >-
      Public-facing project website describing the project, its progress, and its
      high-level aims, and carrying the dataset snapshot figures used in this record.
    external_resources:
      - https://chorus4ai.org/
      - https://www.bridge2ai.org/chorus
    restrictions:
      - >-
        The website carries a notice stating that the repository is under review for
        potential modification in compliance with Administration directives.
  - id: d4d:chorus_ext_enclave
    name: CHoRUS cloud enclave on Azure
    description: >-
      OMOP and telemetry data are held in a cloud enclave; clinical notes are stored
      locally at contributing sites except for tokens. CHoRUS services are supported by
      dockerized container applications deployed on Azure. Trainees are given hands-on
      training on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud and receive
      compute provisioned after access is granted.
  - id: d4d:chorus_ext_standards
    name: OHDSI/OMOP and allied data standards
    description: >-
      The dataset relies on externally maintained standards: the OHDSI/OMOP common data
      model for structured EHR data, the OHNLP toolkit and its open-source schema for
      tokenized clinical notes, DICOM for imaging, WFDB and an extended PhysioNet schema
      for waveform telemetry, and the open-source EDF+ and Persyst schemas for EEG.
  - id: d4d:chorus_ext_nih_reporter
    name: NIH RePORTER project record
    description: >-
      NIH RePORTER record for application ID 10472824, project number 1OT2OD032701-01,
      the source of the project abstract, award period, and award amount recorded here.
    external_resources:
      - https://reporter.nih.gov/project-details/10472824

purposes:
  - id: d4d:chorus_purpose_ai_ready_dataset
    name: Develop a publicly available, AI-ready critical care dataset
    response: >-
      The project's overarching goal is to develop a publicly available, AI-ready
      critical care dataset while ensuring the methods promote privacy, accountability,
      and clinical benefit. There is an urgent need for infrastructure to support
      artificial intelligence and machine learning in critical care, and developing
      high-resolution multi-center data sets is a critical first step towards actionable
      and trustworthy AI.
  - id: d4d:chorus_purpose_holdout
    name: Provision a holdout test set for external model validation
    response: >-
      The dataset will also provision a holdout test set, accessible for model external
      validation to aid marketplace adoption of AI-developed models for implementation in
      acute and critical care.
  - id: d4d:chorus_purpose_workforce
    name: Support AI/ML training and workforce development
    response: >-
      Through its People pillar the project cultivates expertise in the lay and
      scientific community to improve AI literacy and utilization through multimodal
      educational approaches, and promotes a new generation of AI clinicians and
      scientists. The datasets are being used for training activities and publications,
      including the AIM-AHEAD Bridge2AI for Clinical Care Training Program, which expands
      access to Bridge2AI CHoRUS data through engagement, AI training, and mentorship.

tasks:
  - id: d4d:chorus_task_characterize
    name: Characterize acute and critical care illness
    response: >-
      Generate data for ML/AI applications aimed at characterizing acute and critical
      care illness among patients with acute or critical illness.
  - id: d4d:chorus_task_predict_complications
    name: Predict complications
    response: >-
      Generate data for ML/AI applications aimed at predicting complications among
      patients with acute or critical illness.
  - id: d4d:chorus_task_treatment_response
    name: Measure treatment response
    response: >-
      Generate data for ML/AI applications aimed at measuring treatment response among
      patients with acute or critical illness.
  - id: d4d:chorus_task_recovery
    name: Improve recovery from acute illness
    response: >-
      The CHoRUS Network's stated grand challenge is improving recovery from acute
      illness, expanding artificial intelligence and machine learning to build models
      that improve the care and outcomes of patients requiring critical care.

addressing_gaps:
  - id: d4d:chorus_gap_infrastructure
    name: Absence of AI/ML infrastructure for critical care
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence and
      machine learning in critical care. Developing high-resolution multi-center data
      sets is a critical first step towards actionable and trustworthy AI, and the
      project addresses the challenges of acquiring an AI-ready data set from more than
      100,000 critically ill patients.
  - id: d4d:chorus_gap_legal_framework
    name: No legal framework for collecting critical care data at scale
    response: >-
      The project establishes a legal framework for collecting data at scale, sampling to
      ensure comprehensive sets of patient conditions and clinical treatment strategies,
      and performs community-facing ethics focus groups to determine what data is
      appropriate for public sharing.
  - id: d4d:chorus_gap_standards
    name: Multi-modal clinical data lacks unified standards
    response: >-
      Unified standards are needed to harmonize multi-modal EHR, waveform, imaging, and
      text data. The project develops capabilities across a multi-center network to
      acquire, standardize, tokenize, store, visualize, and label structured electronic
      health record data, tokenized unstructured electronic health record data, telemetry
      and EEG waveforms, imaging, and social determinants of health.
  - id: d4d:chorus_gap_contextual_factors
    name: Missing contextual factors in clinical datasets
    response: >-
      The project ensures that data elements feature appropriate contextual factors such
      as geographic distance to the nearest hospital, and accounts for Social
      Determinants of Health.

