maintainers:
- role: academic_institution
  maintainer_details: >-
    PhysioNet, maintained by the MIT Laboratory for Computational Physiology and supported by NIBIB,
    NHLBI and the NIH Office of the Director, hosts the current releases and provides continued
    access to credentialed researchers.
- role: academic_institution
  maintainer_details: >-
    The Bridge2AI-Voice consortium curates the dataset. Access requests and questions about raw
    audio are handled by the Data Access Compliance Office at DACO@b2ai-voice.org, and questions
    about the dataset itself go to the corresponding author listed on the release.
- role: academic_institution
  maintainer_details: >-
    Version 1.0 was hosted on the Health Data Nexus, a data publishing platform maintained by the
    Temerty Center for Artificial Intelligence Research and Education in Medicine (T-CAIREM) at the
    University of Toronto, which maintained the technical infrastructure and provided cloud compute
    alongside the dataset rather than allowing downloads.

updates:
  frequency: Semi-annual (twice a year)
  update_details: >-
    Further versions of the dataset are released as new versions on the hosting platform, and users
    are notified through news items on the platform and through standard communication channels.
    Updates have added participants, added derived features such as the Speech Articulatory Coding
    measures and phonetic posteriorgrams, corrected processing and authorship errors, and
    reorganized the files.

version_access:
  versions_available:
  - >-
    Version 1.0 (Health Data Nexus, November 2024), and versions 1.1, 2.0.0, 2.0.1, 3.0.0 and 3.1.0
    on PhysioNet.
  version_details: >-
    Older versions continue by default to be supported, hosted and made available to researchers,
    and each version has a unique DOI, although the publishers reserve the right to remove access to
    older versions. A changelog for each dataset version is published online with the dataset
    metadata. Version 1.0 provided 12,523 recordings for 306 participants; version 1.1 added
    mel-frequency cepstral coefficients; version 2.0 added 136 participants, reprocessed the
    spectrograms and removed all spectrograms and MFCCs derived from free speech; version 2.0.1
    corrected the authorship list; version 3.0.0 added 391 participants, split the single phenotype
    file into individual files and added sparc and ppgs features; and version 3.1.0 added no new
    participants but released further data for some participants, fixed broken Parquet files, added
    audio quality metrics and per-recording metadata, and back-filled validated diagnosis
    information.
  latest_version_doi: doi:10.13026/37yb-1t42

retention_limit:
  retention_period: Indefinite for the shared dataset; ten years for institution-held identifiable data.
  retention_details: >-
    Once data are contributed they are retained as long as they are useful for research purposes,
    possibly indefinitely. Identifiable data and the datasheets linking participant numbers to
    participant information are kept at each institution on local cloud storage for a maximum of ten
    years after study completion and then destroyed, under the responsibility of the local principal
    investigator. Recipients of raw audio under the Data Transfer and Use Agreement must destroy or
    return the data two years after the start date, on completion of the project, on termination, or
    on expiry of the applicable ethics approval, whichever occurs first, and must certify destruction
    in writing within thirty days, retaining at most one copy where records retention or research
    integrity requires it.

extension_mechanism:
  extension_details: >-
    Others may publish a derivative dataset on the hosting platform that references the original
    source; such derivative datasets may be made available under the same conditions as the source
    data. For the code that produces the data, the open-source repositories have discussion forums
    and issue pages for public discussion of data preprocessing, and accept pull requests
    contributing improvements.
  contribution_url: https://github.com/sensein/b2aiprep

errata:
- erratum_details: >-
    Version 2.0.0 reprocessed the spectrograms to fix minor issues identified in the previous
    release, and removed all spectrograms and mel-frequency cepstral coefficients derived from free
    speech files.
- erratum_details: Version 2.0.1 corrected the authorship list of the release.
- erratum_details: >-
    Version 3.1.0 fixed broken Parquet files carried in version 3.0.0, updated validated diagnosis
    information across conditions with back-filled information, rearranged some phenotype files and
    renamed certain gold-standard variable names.
- erratum_details: >-
    No formal erratum is published; a changelog for each dataset version is published online with the
    dataset metadata.