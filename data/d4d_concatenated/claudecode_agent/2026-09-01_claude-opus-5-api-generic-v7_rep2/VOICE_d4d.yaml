instances:
- instance_type: Study participant
  counts: 833
  data_topic: B2AI_TOPIC:4
  label: true
  label_description: >-
    Each participant carries a diagnostic label corresponding to one of the disease cohorts
    (voice disorders, neurological and neurodegenerative disorders, mood and psychiatric
    disorders, respiratory disorders) or to the control group, assigned by a clinician at the site
    of data collection.
  notes: >-
    Each instance represents a person. A participant may have more than one recording session, so
    phenotype and feature files may contain more than one row per participant, and responses need
    not agree across sessions. Participant-level information is distributed as tab-separated
    phenotype tables.
- instance_type: Derived feature record for a single audio recording
  data_substrate: B2AI_SUBSTRATE:30
  data_topic: B2AI_TOPIC:36
  label: false
  notes: >-
    Record counts differ by feature type in version 3.1.0: 29,278 records each for spectrograms,
    mel spectrograms and mel-frequency cepstral coefficients; 32,522 torchaudio pitch records;
    28,640 sparc electromagnetic articulography records; 31,855 sparc loudness records; 31,872
    sparc periodicity and sparc pitch records; and 29,289 phonetic posteriorgram records. Some
    recordings could not yield certain features because of length or other issues and are absent
    from those files.

subpopulations:
- subpopulation_elements_present: true
  identification: >-
    Disease cohort categories assigned at enrollment from a clinical diagnosis: voice disorders,
    neurological and neurodegenerative disorders, mood and psychiatric disorders, respiratory
    disorders, pediatric voice and speech disorders, and controls.
  distribution: >-
    The public releases do not contain an equal distribution of these disease categories, and the
    adult release contains no pediatric participants; the pediatric cohort is published as a
    separate dataset.
- subpopulation_elements_present: true
  identification: >-
    Demographic sub-populations recorded in the demographics phenotype table: age, gender, sex,
    ethnicity and socioeconomic status.
  distribution: >-
    The dataset is skewed by site and by demographic factors; users are advised to consider the
    multivariate distribution when assessing utility for a given question.

relationships:
- relationship_details: >-
    Relationships between individual instances are not made explicit; participants are unrelated
    to one another. Feature records are linked to their participant and recording session through
    the participant_id and session_id fields, and a participant may have several sessions.

splits:
- split_details: >-
    No recommended train, validation or test splits are provided. Researchers are encouraged to
    create their own splits according to their requirements, taking account of the skews in
    disorder category, site and demographics.

anomalies:
- anomaly_details: >-
    Different sites used different collection configurations, and the collection protocol changed
    over the course of the study.
- anomaly_details: >-
    Noise artifacts are present in the recordings; the head-mounted headset microphone could sit
    at slightly different distances from participant to participant.
- anomaly_details: >-
    Diagnostic practices vary between sites and clinicians, and questionnaire responses may be
    inaccurate or under-reported.
- anomaly_details: >-
    Some recordings could not produce particular features because of recording length or other
    issues and are therefore missing from the corresponding feature files, so record counts differ
    between feature types.
- anomaly_details: >-
    Some Parquet files distributed in version 3.0.0 were broken and were fixed in version 3.1.0.

missing_data_documentation:
- missing_data_patterns: >-
    Phenotype files contain a row for a participant only where at least one column is non-missing.
    Each participant answered a common set of questions and then additional questions relevant to
    their primary diagnostic category, so disease-specific instruments are absent for participants
    outside that cohort. Record counts also differ across the dense feature files.
  missing_data_causes: >-
    Some questions are optional; data collection irregularities caused information to be missing
    from individual instances; some recordings could not yield particular features; and dense
    features derived from free-speech audio, along with sensitive records and audio checks, were
    removed during de-identification.
  handling_strategy: >-
    No imputation is performed. A missingness table is included with the dataset, and generating
    missingness tables is the first step of the audit protocol applied before each release.

content_warnings:
- content_warnings_present: true
  warnings:
  - >-
    The collection includes free speech tasks whose transcription may contain offensive or
    distressing content, since participants are responsible for their choice of language; the
    documentation states that while such content is unlikely it cannot be completely avoided.
    Dense features and transcripts derived from free-speech prompts were removed from the released
    feature set, and audio recordings containing potentially identifying information or external
    voices were removed. Questionnaire content covers depression, anxiety, post-traumatic stress
    and other psychiatric symptoms.

confidential_elements:
- confidential_elements_present: false
  confidentiality_details: >-
    The healthsheet reports that the released dataset contains no data protected by legal
    privilege or doctor-patient confidentiality. Raw voice recordings, which carry re-identification
    risk, are withheld from this release and distributed only under controlled access.

sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The dataset includes race and ethnic origin information.
- sensitive_elements_present: true
  sensitivity_details: The dataset includes sexual orientation information.
- sensitive_elements_present: true
  sensitivity_details: >-
    The dataset includes socioeconomic and health information, including clinical diagnoses and
    validated psychiatric and respiratory questionnaire responses.
  notes: >-
    Fields encoded as sensitive in the REDCap data dictionary were removed before release, as were
    non-identifying elements revealing highly sensitive information such as household income,
    mental health status and traumatic life experiences.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor de-identification, removal of selected indirect identifiers and highly
    sensitive non-identifying elements, and withholding of all raw audio.
  identifiers_removed: >-
    Names, civic addresses and social security numbers; geographic locators, including state and
    province, with only country of collection retained; date information at any resolution finer
    than years; phone and fax numbers, email addresses, IP addresses, medical record numbers,
    health plan beneficiary numbers, device identifiers, license numbers, account numbers, vehicle
    identifiers, website URLs, full-face photographs, biometric identifiers and other unique
    identifiers; narrative free-text fields and transcripts of free speech; selected demographic
    identifiers and information about household composition or cultural identity; and all raw
    voice recordings.
  deidentification_details: >-
    Direct identifiers were removed; indirect identifiers were removed where they created a
    significant risk of re-identification through combination with public data. Dates were rebased
    or replaced by integers, geographic information was generalized, and narrative text fields were
    removed. Spectrograms, mel spectrograms, MFCCs, phonetic posteriorgrams and articulatory
    estimates were excluded where the audio contained free speech, and features for sensitive
    records and audio checks were removed; static features that do not encode sensitive content
    were retained. Raw audio transcripts were reviewed and recordings containing potentially
    identifying information or external voices were removed from the release. K-anonymization with
    k greater than or equal to two is not achieved, and voice itself can never be fully
    de-identified, which is why the waveforms are released only under controlled access.

acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  acquisition_details: >-
    Acoustic tasks were recorded directly from participants with a tablet application, while
    demographics, confounders and validated questionnaires were self-reported by participants or,
    where appropriate, by a parent or decision-maker.
- was_validated_verified: true
  acquisition_details: >-
    Clinical diagnoses were verified by clinicians reviewing audio and imaging data, electronic
    health records, or medication prescriptions, against cohort-specific gold standards such as
    laryngoscopy and stroboscopy, CT and MRI of the brain, and spirometry with flow-volume loops.
- was_inferred_derived: true
  acquisition_details: >-
    All released feature data were derived computationally from the raw waveforms with open-source
    toolkits, and transcriptions were generated with an automatic speech recognition model.

collection_mechanisms:
- mechanism_details: >-
    A custom Bridge2AI-Voice application running on a tablet collected acoustic tasks, surveys and
    validated questionnaires, and sent data over a secure HTTPS protocol to HIPAA-compliant cloud
    storage provided by NIH STRIDES partners.
- mechanism_details: >-
    Recordings were made on iPads (9th or 10th generation) and iPad Air (5th generation) with an
    Avid AE-36 head-mounted microphone connected through an Apple dongle; distinct iPad devices
    were used at each site.
- mechanism_details: >-
    Instruments, the data dictionary and metadata are maintained in REDCap and published openly;
    data were exported and converted from REDCap with the consortium's open-source library.

collection_timeframes:
- timeframe_details: >-
    The healthsheet states that the data were collected over a period of twelve months. Successive
    releases have added participants: 306 in version 1.0, a further 136 in version 2.0 and a
    further 391 in version 3.0.0, reaching 833 adult participants.

data_collectors:
- role: researcher
  collector_details: >-
    Research teams, which may include medical, graduate or undergraduate students, coordinated
    with clinicians to identify eligible participants and conducted the collection sessions with a
    trained research assistant present.
- role: researcher
  collector_details: >-
    Clinicians and doctors, listed as co-investigators on the IRB protocol, provided the diagnoses
    and gold-standard validation. They were not directly compensated but were added to the
    consortium so that their names appear on consortium-level publications arising from the
    research.
- role: other
  collector_details: >-
    Hospital staff were not involved in scheduling but assisted in the logistics of coordinating
    data collection.

direct_collection:
- is_direct: true
  collection_details: >-
    Data were collected directly from the individuals in question, in clinic, with the assistance
    of a trained research assistant. Future collection is planned to occur remotely, but remote
    collection did not contribute to the initial releases.

sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  strategies: >-
    Non-probability sampling. Participants were recruited at high-volume expert clinics and
    community outreach clinics within participating academic institutions on the basis of a
    confirmed diagnosis in one of five disease cohorts, or as controls, against published
    inclusion and exclusion criteria; charts were screened for eligibility before the clinic day.
  source_data: >-
    Patients and healthy volunteers presenting at participating specialty clinics in the United
    States and Canada.
  why_not_representative: >-
    The data were collected at a limited number of geographic locations. The sample is skewed by
    disorder category, site and demographics, and groups with less trust in the medical system or
    in artificial intelligence, or living further from the collection sites, were less likely to be
    recruited. The consortium intends to improve representativeness by shifting to remote
    collection and designing recruitment to control for more variables.

raw_data_sources:
- source_description: >-
    Raw voice, speech, breathing and cough audio recordings captured by the Bridge2AI-Voice
    application, together with the questionnaire and clinical responses recorded alongside them.
  source_type: Prospectively collected audio recordings and questionnaire responses
  raw_data_format: >-
    WAV audio, converted to monaural and resampled to 16 kHz before feature extraction; REDCap and
    ReproSchema exports converted to tab-delimited phenotype tables.
  access_details: >-
    Raw audio is not included in the PhysioNet release. Access requires a completed Data Access
    Request Form and Data Use Agreement, review by the Data Access Compliance Office
    (DACO@b2ai-voice.org) and a signed Data Transfer and Use Agreement from an authorized
    institutional official; approved users receive the adult cohort audio through Synapse at
    https://www.synapse.org/Synapse:syn72370534/. The de-identified raw data are retained but are
    not publicly accessible.

preprocessing_strategies:
- preprocessing_details: >-
    Raw audio was converted to monaural and resampled to 16 kHz with a Butterworth anti-aliasing
    filter applied.
- preprocessing_details: >-
    Spectrograms of dimension 201 by T were computed with a short-time fast Fourier transform
    using a 25 ms window, a 10 ms hop and a 400-point FFT, then downsampled by a factor of two in
    the time domain.
- preprocessing_details: >-
    Mel spectrograms with 60 mel bins and 60 mel-frequency cepstral coefficients were computed
    with the same window, hop and FFT settings.
- preprocessing_details: >-
    Articulatory features were produced with the Speech Articulatory Coding (sparc) package at
    50 Hz, giving electromagnetic articulography traces for six articulators (tongue dorsum,
    tongue body, tongue tip, lower incisor, upper lip and lower lip) together with loudness,
    periodicity and pitch estimates.
- preprocessing_details: >-
    Phonetic posteriorgrams over 40 phoneme categories were generated at 100 Hz with the ppgs
    package.
- preprocessing_details: >-
    Static acoustic, phonetic and prosodic features were extracted with openSMILE, Praat and
    parselmouth, and pitch contours with torchaudio, producing one row per recording in
    static_features.tsv.
- preprocessing_details: >-
    Raw audio files and questionnaire data retrieved from ReproSchema-UI or exported from REDCap
    were converted to a structure compliant with the Brain Imaging Data Structure v1.9.0, with
    phenotype tables grouped into confounders, demographics, diagnosis, enrollment, questionnaire
    and task folders.
- preprocessing_details: >-
    All processing was performed with the open-source b2aiprep library, which organizes and
    preprocesses the dataset, and senselab, which processes the audio files; version 3.1.0 was
    generated with b2aiprep v3.0.0.

cleaning_strategies:
- cleaning_details: >-
    No data cleaning was performed. An audit protocol was applied instead: missingness tables were
    generated, distributions and outliers checked, categorical responses checked against the
    schema, and quality control metrics run on the audio, including the amount of silence, the
    duration, and for speech tasks the agreement of the produced speech with the intended passage.
    From version 3.1.0 the resulting audio quality metrics are released alongside the features.

labeling_strategies:
- labeling_details: >-
    Diagnostic labels are the result of a clinical assessment of the participant. At each site a
    local clinician provided the diagnosis based on a clinical interview and appropriate work-up,
    using the gold-standard validation methods defined per cohort, such as laryngoscopy images and
    stroboscopy videos for voice disorders, CT and MRI of the brain for neurological disorders,
    and spirometry with flow-volume loops for airway conditions.
  annotations_per_item: 1
  data_annotation_protocol: Bridge2AI-Voice protocols and ICD-10 codes.
  annotator_demographics:
  - >-
    Typically the clinician at the site of data collection, or a clinician external to the study
    who had made a prior diagnostic assessment; a single labeler per instance.
- labeling_details: >-
    For the psychiatric disorders cohort the assessment was determined from the participant's
    electronic health record or from an active prescription, recorded outside the data collection
    session by an appropriately licensed clinician.

annotation_analyses:
- analysis_method: >-
    No inter-annotator agreement analysis was performed. A single labeler provided the diagnostic
    label for each instance, so no agreement statistic could be computed.
  annotation_quality_details: >-
    Labels are gold-standard clinical diagnoses provided by a clinician following the
    Bridge2AI-Voice protocols and ICD-10 codes. Human-level performance on the applications the
    dataset is intended to address is reported to vary widely. Certain machine-generated
    annotations, notably the Whisper transcriptions, were produced with off-the-shelf models that
    have not been audited for correctness.
  notes: >-
    The consortium recommends that any new labels or task definitions be described alongside the
    release of a model or publication, including the exact variables used for the determination.

machine_annotation_tools:
- tools:
  - OpenAI Whisper Large
  tool_descriptions: Used to generate transcriptions of the audio recordings.
  tool_accuracy:
  - >-
    Not audited. Certain aspects of the data, including transcription, were generated using
    off-the-shelf models that have not been audited for correctness.

variables:
- variable_name: participant_id
  data_type: identifier
  is_identifier: true
  notes: >-
    Unique identifier for the participant, present in every dense feature file and in the
    phenotype tables; it links feature records to phenotype rows.
- variable_name: session_id
  data_type: identifier
  is_identifier: true
  notes: >-
    Unique identifier for the recording session. A participant may have more than one session, so
    several sessions may share a participant_id.
- variable_name: task_name
  data_type: categorical
  notes: The acoustic task performed during the recording, drawn from the protocol's task inventory.
- variable_name: n_frames
  data_type: integer
  notes: >-
    The number of time frames associated with the feature stored in the record; feature tensors
    vary in length with the duration of the recording.
- variable_name: spectrogram
  data_type: array
  derivation: >-
    Short-time fast Fourier transform of the 16 kHz monaural waveform with a 25 ms window, a 10 ms
    hop and a 400-point FFT, downsampled by a factor of two in the time domain; dimension 201 by T.
  measurement_technique: torchaudio
  quality_notes: >-
    Absent for recordings that contain free speech, for sensitive records and for audio checks,
    and for recordings whose length or other properties prevented generation.
- variable_name: mel_spectrogram
  data_type: array
  derivation: >-
    Mel spectrogram with 60 mel bins computed with a 25 ms window, a 10 ms hop and a 400-point
    FFT; dimension 60 by T.
  measurement_technique: torchaudio
- variable_name: mfcc
  data_type: array
  derivation: >-
    Sixty mel-frequency cepstral coefficients computed from the mel spectrograms with the same
    window, hop and FFT parameters; dimension 60 by T.
  measurement_technique: torchaudio
- variable_name: pitch
  data_type: array
  derivation: >-
    Detected pitch (fundamental frequency) over time, of dimension T, with a minimum pitch of 80
    and a maximum of 500.
  measurement_technique: torchaudio
  minimum_value: 80.0
  maximum_value: 500.0
- variable_name: sparc_ema
  data_type: array
  derivation: >-
    Estimated electromagnetic articulography produced by a deep learning model at 50 Hz, of
    dimension T by 12, the twelve channels being the X and Y positions of six articulators: tongue
    dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip.
  measurement_technique: Speech Articulatory Coding (sparc)
- variable_name: sparc_loudness
  data_type: array
  derivation: >-
    Estimated loudness based on the average absolute amplitude of the audio waveform, of dimension
    T, computed with 20 ms windows.
  measurement_technique: Speech Articulatory Coding (sparc)
- variable_name: sparc_periodicity
  data_type: array
  derivation: >-
    Estimated periodicity, the confidence of pitch presence, derived from the audio with 20 ms
    windows, of dimension T.
  measurement_technique: Speech Articulatory Coding (sparc)
- variable_name: sparc_pitch
  data_type: array
  derivation: >-
    Estimated fundamental frequency of the audio signal computed with a different algorithm from
    the torchaudio pitch, over a range of 50 to 550 Hz, of dimension T.
  measurement_technique: Speech Articulatory Coding (sparc)
  unit: Hz
  minimum_value: 50.0
  maximum_value: 550.0
- variable_name: ppgs
  data_type: array
  derivation: >-
    Phonetic posteriorgram probabilities across 40 phoneme categories at a frame rate of 100 Hz,
    of dimension 40 by T.
  measurement_technique: ppgs package
  quality_notes: >-
    Removed for sensitive records and audio checks, and absent where the audio contained free
    speech.

distribution_formats:
- format: Apache Parquet
  notes: >-
    Dense per-recording feature tensors are distributed as Parquet files: ppgs.parquet,
    sparc_ema.parquet, sparc_loudness.parquet, sparc_periodicity.parquet, sparc_pitch.parquet,
    torchaudio_spectrogram.parquet, torchaudio_mfcc.parquet, torchaudio_pitch.parquet and
    torchaudio_mel_spectrogram.parquet, together with a per-recording metadata file.
- format: Tab-separated values
  notes: >-
    Static features (static_features.tsv), audio quality metrics (audio_quality_metrics.tsv) and
    the phenotype tables covering confounders, demographics, diagnosis, enrollment, questionnaires
    and tasks are distributed as TSV files.
- format: JSON
  notes: >-
    Every data file is accompanied by a JSON data dictionary with the same file stem, describing
    each column, the question asked of the participant where applicable, and the data type of the
    response.

distribution_dates:
- release_dates:
  - >-
    Version 1.0 was published on the Health Data Nexus at the end of November 2024; version 1.1 on
    17 January 2025, version 2.0.0 on 16 April 2025, version 2.0.1 on 18 August 2025, version
    3.0.0 on 16 December 2025 and version 3.1.0 on 1 May 2026, all on PhysioNet.

third_party_sharing:
- is_shared: true
  notes: >-
    The dataset is distributed broadly to individuals outside the entity that created it. The
    feature-only dataset is published on PhysioNet under credentialed access with a signed data use
    agreement; raw audio is distributed to approved institutions through Synapse under a Data
    Transfer and Use Agreement. Recipients may not pass the data to collaborators at other
    organizations, who must apply independently.

license_and_use_terms:
  license_terms: >-
    Bridge2AI Voice Registered Access License. Only credentialed PhysioNet users who sign the
    Bridge2AI Voice Registered Access Agreement may access the files; no additional training is
    required. Duplication as reasonably required to carry out the research project is permitted,
    but sale of all or part of the data on any media is not. Users agree not to make intellectual
    property claims on the data, not to use intellectual property protection in ways that would
    prevent or block access to any element of the data or to conclusions drawn from it, to
    implement licensing policies that will not obstruct further research, and to respect the Fort
    Lauderdale Agreement. There are no fees associated with these restrictions.
  data_use_permission: general_research_use

ip_restrictions:
  restrictions:
  - >-
    The data may be protected by copyright and other rights, including other intellectual property
    rights, and nothing in the agreement transfers those rights to the user. Users agree not to
    make intellectual property claims on the data and not to use intellectual property protection,
    database rights or related rights in ways that would prevent or limit access to any element of
    the data or to conclusions drawn directly from it. Users may obtain intellectual property
    rights on downstream discoveries provided they implement licensing policies that do not
    obstruct further research. No third party has imposed intellectual property based restrictions
    on the data.

regulatory_restrictions:
  regulatory_restrictions:
  - >-
    No export controls or other regulatory restrictions apply to the dataset or to individual
    instances.
  hipaa_compliant: compliant
  confidentiality_level: restricted
  other_compliance: >-
    The data are covered by a Certificate of Confidentiality, which must be asserted against
    compulsory legal demands such as court orders and subpoenas for identifying information or
    characteristics of a research participant. Collection and storage used NIH STRIDES cloud
    partners, which hold pre-negotiated agreements with the NIH for data privacy and HIPAA
    protection.

data_governance:
  committee_name: Data Access Compliance Office (DACO)
  accountable_organization:
    name: University of South Florida Board of Trustees
  access_review_process: >-
    Registered access to the feature-only dataset requires registration on PhysioNet, confirmation
    of identity and signature of the Bridge2AI-Voice Registered Access Agreement. Controlled access
    to raw audio requires a completed Data Access Request Form and Data Use Agreement, submission
    of the application to the Data Access Compliance Office for review at DACO@b2ai-voice.org and,
    on approval, a Data Transfer and Use Agreement signed by an authorized official at the
    applicant's institution; approved users then receive the data through Synapse.
  stewardship_roles:
  - >-
    The provider institution warrants that it has authority to share the data and that the project
    is consistent with the consents obtained from participants. Recipients must retain control of
    the data, restrict it to named authorized persons who are bound to equivalent confidentiality
    and security standards, establish administrative, technical and physical safeguards, notify the
    provider of any unauthorized use or disclosure within five business days, and destroy or return
    the data on expiry or termination.
  notes: >-
    A published memorandum, "Ethical Justification for Controlled Access to Raw Voice Data
    Samples", sets out the reasoning behind the governance structure.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    Data collection and sharing were approved by the University of South Florida Institutional
    Review Board. Participating United States institutions were covered through the single IRB
    process; Canadian institutions obtained separate research ethics board approvals, and genomic
    data collection at the Canadian sites is governed by a separate protocol.
  ethics_review_board: University of South Florida Institutional Review Board
  regulatory_compliance:
  - >-
    HIPAA, with a partial waiver of HIPAA authorization granted for screening and recruitment; a
    Certificate of Confidentiality; and storage on HIPAA-compliant infrastructure provided by NIH
    STRIDES partners.
  special_populations:
  - >-
    Adult enrollment is restricted to participants aged 18 and over who can provide informed
    consent in English. Cohorts include participants with mild cognitive impairment, Alzheimer's
    disease and other dementias, and psychiatric diagnoses. Pediatric participants are enrolled
    only at pediatric sites under separate approvals and are released as a separate dataset.

ethical_reviews:
- reviewing_organization: University of South Florida Institutional Review Board
  review_details: >-
    Reviewed and approved the Bridge2AI Voice Data Acquisition protocol and the sharing of the
    collected data. Subsites were approved through the single IRB process. The study is
    observational, is not for a drug product or a medical device, and no data monitoring committee
    was appointed.

informed_consent:
- consent_obtained: true
  consent_type: >-
    Prospective informed consent, obtained on paper, electronically within the application or
    through REDCap surveys, or by recorded video consent.
  consent_documentation: >-
    Paper consent documents are uploaded and saved electronically in REDCap; electronic consent is
    housed in REDCap and is HIPAA compliant. All paper and electronic versions of consent are
    stored for a minimum of five years after completion of the study. Where consent is recorded on
    video, the audio recording is used to verify that the acoustic data submitted belong to the
    consented individual.
  consent_scope: >-
    Consent covers collection of voice, speech and respiratory recordings and linked health
    information, access to medical records through electronic health record platforms for
    gold-standard validation of diagnoses and symptoms, and sharing of research data that does not
    contain direct identifiers with external researchers through registered access, with
    higher-risk data shared through a controlled access mechanism.
  withdrawal_mechanism: >-
    Participants are informed that they may withdraw from the study at any point. If a participant
    withdraws during or before the voice data collection their data are not included in the
    database; once the collection is complete, research data including voice recordings cannot be
    removed from the database. Participants who withdraw may optionally complete a satisfaction
    survey, which collects no protected health information.

collection_consents:
- consent_details: >-
    All participants were duly informed and agreed to the collection and use of their data through
    prospective informed consent under an IRB-approved process, in which they were told what data
    were being collected, how those data would be secured, and how they would be used.
- consent_details: >-
    Consent also covers dissemination: research data that do not contain direct identifiers are
    shared with external researchers through a secure database, data posing a low risk of
    re-identification are shared under registered access with the general public, and data posing a
    heightened risk if shared in full open access are shared through a controlled access mechanism
    with authorized researchers. The consent imposes no restriction to non-commercial use, to a
    geographic location, to a particular type of research, to genetic research, or against methods
    and algorithm development.

collection_notifications:
- notification_details: >-
    Individuals were notified about the data collection: participants went through an IRB-approved
    consent process and were explicitly informed about the data being collected, the methods used
    to secure those data, and the information that would be used for the study.

consent_revocations:
- revocation_details: >-
    Consenting participants are informed that they may withdraw from the study at any point. If a
    participant chooses to withdraw during or before the voice data collection, their data are not
    included in the database. Participants are informed that research data, including voice
    recordings, cannot be removed from the database once the voice data collection process is
    completed. For longitudinal collection, participants may withdraw at any time and the data
    already collected are retained.

data_protection_impacts:
- impact_details: >-
    No analysis of the potential impact of the dataset and its use on data subjects has been
    conducted. A team of ethicists identified the sensitive fields removed before release, and the
    consortium published a memorandum setting out the ethical justification for restricting raw
    voice samples to controlled access.

participant_privacy:
- anonymization_method: >-
    Removal of HIPAA Safe Harbor identifiers, removal of selected indirect identifiers and of
    highly sensitive non-identifying elements, removal of state and province with only country
    retained, rebasing of dates, removal of narrative text, and withholding of all raw voice
    recordings.
  privacy_techniques: >-
    Two levels of privacy were built into the program: a combined de-identified database hosted
    through a HIPAA-compliant NIH STRIDES partner, and federated learning, in which algorithms are
    run on data held at each institution and only model updates are shared to a central node, so
    that multi-institutional analysis is possible without the data leaving the institution.
    Identifiable protected health information is held only in institution-local, password-protected
    REDCap databases.
  reidentification_risk: >-
    Voice is inherently identifying: even with all HIPAA-protected information removed, a
    participant's voice cannot be fully de-identified and could in principle be recognized.
    K-anonymization with k greater than or equal to two is not achieved. Raw audio is therefore
    withheld from the open release and distributed only under controlled access, and users agree
    not to attempt re-identification.
  data_linkage: >-
    Participants who consent permit investigators to access medical information through electronic
    health record platforms in order to perform gold-standard validation of diagnoses and symptoms.
    Datasheets linking participant numbers to participant information are kept only at the
    collecting institution.

participant_compensation:
- compensation_provided: true
  compensation_type: Electronic gift cards
  compensation_amount: >-
    40 US dollars for a data collection session taking less than 90 minutes and 80 US dollars for a
    session taking over 90 minutes, for no more than three sessions and a maximum of 120 US dollars.

at_risk_populations:
  at_risk_groups_included: true
  special_protections:
  - >-
    Adult enrollment is restricted to participants aged 18 to 120 who can provide informed consent
    in English, and all participants were consented under an IRB-approved process and may withdraw
    at any time. Cohorts include participants with mild cognitive impairment, Alzheimer's disease
    and other dementias and with psychiatric diagnoses; the protocol notes that questions asked of
    the mood and psychiatric cohorts can cause discomfort or trigger negative emotions. No pediatric
    data collection was performed at the coordinating site, and the adult release contains only
    participants aged 18 and over.

known_biases:
- bias_type: selection_bias
  bias_description: >-
    Participants were recruited at a limited number of high-volume expert clinics in North America.
    Groups that have less trust in the medical system or in artificial intelligence, or that are
    less proximal to the collection sites, were less likely to be recruited.
  mitigation_strategy: >-
    The consortium intends to shift to remote collection and to design its recruitment approach so
    as to control for more variables.
- bias_type: representation_bias
  bias_description: >-
    The public data releases do not contain an equal distribution of the five disease categories,
    and the dataset is skewed by disorder category, site and other demographic factors.
  affected_subsets:
  - Disease cohorts and the demographic sub-populations recorded in the demographics table.
  mitigation_strategy: >-
    Users are advised to consider the multivariate distribution when assessing the dataset's
    utility for a given question; further releases are intended to add data.
- bias_type: measurement_bias
  bias_description: >-
    Participants were screened for different disorders by site, so cohorts also had their data
    collected on different devices and in different configurations. Recordings were made with a
    head-mounted headset whose microphone could sit at slightly different distances, and noise
    artifacts are present.
  affected_subsets:
  - Cohorts recruited at particular sites.
- bias_type: annotation_bias
  bias_description: >-
    Depending on the disorder, the clinical diagnosis was performed by a single clinician, taken
    from an electronic health record, or inferred from a prescription, and diagnostic practices vary
    between sites. Changes in diagnostic criteria or practices over time are a source of
    distribution shift.

known_limitations:
- limitation_type: coverage_limitation
  limitation_description: >-
    The dataset contains only fluent English speakers; participants who do not read or speak
    English were excluded.
  recommended_mitigation: >-
    Spanish versions of the protocol are under development and Spanish data collection is planned
    for future releases.
- limitation_type: representativeness_limitation
  limitation_description: >-
    The data are a sample of a larger, ongoing collection gathered at five recording sites in the
    United States and Canada, and are not representative of the wider population.
  scope_impact: >-
    Limits the generalization of models derived from the dataset to other geographies and
    populations.
- limitation_type: scope_limitation
  limitation_description: >-
    The published release contains derived features only. The original voice recordings are not
    included, and dense features derived from free-speech prompts, sensitive records and audio
    checks were removed.
  recommended_mitigation: >-
    Researchers requiring raw audio may apply for controlled access through the Data Access
    Compliance Office.
- limitation_type: coverage_limitation
  limitation_description: >-
    No external multimodal data are released. Imaging, genomic data for the neurological cohort,
    laryngoscopy images and other electronic health record data were extracted at sites and
    uploaded to REDCap, but are not part of these releases.
- limitation_type: temporal_limitation
  limitation_description: >-
    Data were collected over approximately twelve months during which the collection protocol
    changed, and site configurations differed; distribution shift over time should be expected.
- limitation_type: methodological_limitation
  limitation_description: >-
    A single labeler provided the diagnostic label for each participant, and for the psychiatric
    cohort the label was derived from an electronic health record entry or an active prescription
    rather than from an assessment made during the session.

intended_uses:
- use_category: research
  examples:
  - >-
    Development, benchmarking and validation of clinically applicable machine-learning models for
    diagnosing health conditions from voice, including vocal pathologies and neurological,
    psychiatric, respiratory and pediatric voice disorders.
  usage_notes: >-
    No recommended splits are supplied; researchers should construct their own and should account
    for the skews in disorder category, site and demographics.
- use_category: research
  examples:
  - Pretraining and fine-tuning of artificial intelligence models on voice and speech data.
- use_category: research
  examples:
  - >-
    Clinical research into the use of voice as a non-invasive, cost-effective biomarker for the
    screening, diagnosis and monitoring of a wide range of health conditions.

discouraged_uses:
- discouragement_details: >-
    Non-research applications such as hiring decisions, insurance premium adjustments, or any form
    of surveillance that could lead to discrimination or harm are discouraged, in order to prevent
    unethical or biased outcomes affecting individuals on the basis of their health conditions or
    voice characteristics.
- discouragement_details: >-
    Uses that assume the dataset is representative are discouraged: it has skews based on disorder
    category, site and other demographic factors, and users should consider the multivariate
    distribution before assessing its utility for a given question, to avoid unfair treatment of
    individuals or groups.

prohibited_uses:
- prohibition_reason: >-
    The Registered Access Agreement forbids attempting to re-identify research participants, or any
    action that could reasonably lead to re-identification.
- prohibition_reason: >-
    Any purpose that could foreseeably cause harm or stigmatization to research participants, their
    families, communities or specific populations is forbidden.
- prohibition_reason: >-
    Intellectual property protections, database rights or related rights may not be used in a manner
    that restricts or limits access to any part of the dataset or to any conclusions derived from
    it, so that future use of the dataset remains unrestricted in alignment with Open Science
    principles. Sale of all or part of the data on any media is not permitted.
- prohibition_reason: >-
    Recipients of the data may not use it, alone or with other information, to make any effort to
    contact the individuals who are its subjects without institutional review board approval,
    specific written approval from the provider, and informed consent from the individual.
- prohibition_reason: >-
    Recipients may not disclose, release, sell, rent, lease, loan or otherwise grant access to the
    data to any third party other than the named authorized persons, without prior written consent
    of the provider.

existing_uses:
- examples:
  - >-
    A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer
    School and hackathon.
- examples:
  - >-
    Training opportunities for using the dataset are offered through the Bridge2AI-Voice Scholars
    program at https://www.b2aivoicescholars.org/.

future_use_impacts:
- impact_details: >-
    The dataset has skews based on disorder category, site and other demographic factors, so models
    derived from it may not generalize and could treat groups unfairly; users should consider the
    multivariate distribution when assessing utility for different questions.
- impact_details: >-
    Certain aspects of the data, including transcription, were generated with off-the-shelf models
    that have not been audited for correctness, so downstream analyses may inherit their errors.
- impact_details: >-
    Because site configurations and the collection protocol changed over the study, and diagnostic
    criteria or practices may change over time, distribution shift should be anticipated in future
    comparisons and in models deployed later.

