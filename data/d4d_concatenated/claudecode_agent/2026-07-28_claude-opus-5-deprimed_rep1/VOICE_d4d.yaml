subsets:
  - id: b2ai:cohort-voice-disorders
    name: Voice disorders cohort
    description: >-
      Participants with laryngeal cancer (active T1-T4, biopsy proven), laryngitis
      (acute, chronic, bacterial, fungal or autoimmune, with evidence on laryngoscopy
      as well as dysphonia), pre-cancerous lesions (keratosis, leukoplakia),
      benign lesions of the vocal cord (nodules, polyps, cysts, Reinke's edema, vocal
      fold ulcers, recurrent respiratory papilloma, fibrous mass, rheumatoid nodules,
      recurrent laryngeal papilloma), muscle tension dysphonia, spasmodic
      dysphonia/laryngeal tremor (adductor and abductor laryngeal dystonia, vocal
      tremor, mixed and singer's laryngeal dystonia), unilateral vocal fold paralysis,
      and glottic insufficiency/presbyphonia. Exclusions include previously treated
      laryngeal cancer with no evidence of disease on scope, subjective laryngitis
      without evidence on scope, post-surgical patients without evidence of pathology
      when scoped or within 30 days of laryngeal surgery, vocal fold paresis, bilateral
      vocal fold paralysis, and glottic gap secondary to unilateral paresis or
      paralysis. Gold standard validation methods are laryngoscopy images and
      stroboscopy videos, with CT scan and spirometry additionally used for unilateral
      vocal fold paralysis.
    is_subpopulation: true
    is_data_split: false
  - id: b2ai:cohort-respiratory-disorders
    name: Respiratory disorders cohort
    description: >-
      Participants with airway stenosis (bilateral vocal fold paralysis,
      supraglottic, glottic, posterior glottic, subglottic, tracheal and multi-level
      upper airway stenosis; nasopharyngeal stenosis excluded) and unexplained chronic
      cough (bothersome cough longer than 8 weeks, negative for a defined list of
      exclusion criteria including current smoking, lung or laryngeal cancer, COPD,
      asthma, GERD, bronchiectasis, TB infection, pneumonia, pulmonary granuloma,
      idiopathic pulmonary fibrosis, ACE inhibitor use, eosinophilic bronchitis,
      tracheomalacia, upper airway cough syndrome, laryngitis, and chest imaging
      indicative of airway foreign body). Gold standard validation methods are
      spirometry and flow volume loops, with CT scan of neck/chest for airway stenosis.
    is_subpopulation: true
    is_data_split: false
  - id: b2ai:cohort-neurological-disorders
    name: Neurological and neurodegenerative disorders cohort
    description: >-
      Participants with mild cognitive impairment, Alzheimer's disease, other types of
      dementia (frontotemporal, Lewy body, vascular, mixed or alcohol-induced),
      amyotrophic lateral sclerosis, and Parkinson's disease (idiopathic PD, multiple
      system atrophy, progressive supranuclear palsy, corticobasal degeneration,
      dementia with Lewy bodies and other or atypical parkinsonism, including patients
      enrolled in deep brain stimulation studies). Inclusion requires a clinical
      diagnosis, age over 44 and under 85, and ability to read and speak English;
      exclusions include absence of a clinical diagnosis, age outside that range,
      inability to speak and read English, and surgical intervention significantly
      altering the symptoms of the disease studied. Gold standard validation methods
      are CT brain, MRI brain and whole genome sequencing, with serum p-tau protein
      biomarkers additionally listed for Alzheimer's disease.
    is_subpopulation: true
    is_data_split: false
  - id: b2ai:cohort-mood-psychiatric-disorders
    name: Mood and psychiatric disorders cohort
    description: >-
      Participants with alcohol or substance use disorder, anxiety disorder,
      attention-deficit/hyperactivity disorder, autism spectrum disorder, bipolar
      disorder, borderline personality disorder, depression or major depressive
      disorder, eating disorder, insomnia/sleep disorder, obsessive-compulsive
      disorder, panic disorder, post-traumatic stress disorder, schizophrenia, social
      anxiety disorder, and other psychiatric disorders. Gold standard validation is by
      electronic health summary, clinical diagnosis from a psychiatrist, and medication
      history.
    is_subpopulation: true
    is_data_split: false
  - id: b2ai:cohort-pediatric
    name: Pediatric voice and speech disorders cohort
    description: >-
      Pediatric participants are recruited strictly from the Hospital for Sick
      Children (SickKids) and are grouped by age. Protocols are provided for age bands
      Peds 10+, Peds 6-10, Peds 4-6 and Peds 2-4. All pediatric data are collected
      using reproschema-ui with the Bridge2AI-Voice pediatric protocol. This cohort is
      released as a separate PhysioNet project rather than as a version of the adult
      dataset.
    is_subpopulation: true
    is_data_split: false
  - id: b2ai:cohort-controls
    name: Control cohort
    description: >-
      In addition to patient cohort data, participants include individuals who do not
      have the conditions of interest, to serve as controls in the dataset. Control
      inclusion criteria are not being diagnosed and/or treated for a voice,
      respiratory, pediatric, mood or neurological disorder affecting voice, cough,
      breath and/or speech; consenting to provide a voice/speech sample for an
      open-sourced database; being 18 years old or older, with the exception of
      pediatric data collection; and speaking English or Spanish. The released
      phenotype folder includes a dedicated control diagnosis table.
    is_subpopulation: true
    is_data_split: false

instances:
  - name: Adult participant
    description: >-
      Each instance represents a person. The dataset documentation states that each
      individual answered a common set of questions and then responded to additional
      questions relevant to their primary diagnostic category.
    instance_type: person
    counts: 833
    label: true
    label_description: >-
      Diagnostic labels are the result of a clinical assessment of the participant. At
      each site a local clinician provided the diagnosis based on a clinical interview
      and appropriate work-up. For the psychiatric disorders cohort this assessment was
      determined by using the participant's EHR record or an active prescription, which
      was done outside of data collection by an appropriately licensed clinician.
  - name: Pediatric participant
    description: >-
      Pediatric participants aged 2-18 recruited at the Hospital for Sick Children,
      released as the separate Bridge2AI-Voice Pediatric Dataset.
    instance_type: person
    counts: 300
    label: true
    label_description: >-
      Demographic information, voice- and speech-related questionnaires, and
      questionnaires inquiring about medical history were collected under an
      age-appropriate protocol.
  - name: Voice-derived recording (adult)
    description: >-
      Derived representations of individual audio recordings, keyed by participant_id,
      session_id and task_name. The project documentation states that adult dataset
      version 3.0 contains approximately 61,937 voice-derived recordings from 833 adult
      participants. Per-feature record counts in the v3.1.0 release range from 28,640
      (sparc EMA) to 32,522 (torchaudio pitch), because some files could not generate
      certain features and because features for sensitive records and audio checks were
      removed.
    instance_type: audio-derived feature record
    counts: 61937
  - name: Voice-derived recording (pediatric)
    description: >-
      Derived audio features for pediatric recordings in release v1.1.0, keyed by
      participant_id, session_id and task_name.
    instance_type: audio-derived feature record
    counts: 23533
  - name: Recording session
    description: >-
      For most participants a single session was sufficient to collect all relevant
      data; a subset of participants required multiple sessions, so there may be more
      than one session per participant in the dataset and more than one row per
      participant in the phenotype files. There is no requirement that a participant
      provide the same response at each visit, so participant information for the same
      data element may vary across a data file. All pediatric participants completed
      the recording and demographic data collection in one session.
    instance_type: session

anomalies:
  - name: Site and protocol heterogeneity
    description: Errors, sources of noise and redundancies reported for the dataset.
    anomaly_details:
      - >-
        Different sites have different collection configurations. The collection
        protocol changed over the course of the study.
      - >-
        Noise artifacts, variations in diagnostic practices, inaccurate questionnaire
        responses and underreporting are identified as confounding factors present in
        the data.
      - >-
        The data were recorded with a head-mounted headset with a microphone that
        could be at slightly different distances. The clinical diagnosis, depending on
        the disorder, was performed by one clinician or based on an EHR record or
        prescription.
      - >-
        Distinct iPad devices were used at each site, and participants were screened
        for different disorders based on site, so they also had their data collected
        with different devices.
  - name: Unaudited automated derivations
    description: Quality caveat on machine-generated content.
    anomaly_details:
      - >-
        The dataset has been audited internally for missingness and consistency by the
        data release team and a missingness table is included with the dataset, but
        certain aspects of the data such as transcription were generated using
        off-the-shelf models that have not been audited for correctness.
  - name: Incomplete feature coverage and repaired release artifacts
    description: Known packaging defects and coverage gaps in the released feature files.
    anomaly_details:
      - >-
        Some files, whether due to length or other issues, could not generate certain
        features and so are not included in the bundled data.
      - >-
        Release v3.1.0 fixed broken parquet files from the previous release.
      - >-
        Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive
        records and audio checks have been removed from the adult v3.1 and pediatric
        v1.1 releases.

known_biases:
  - name: Recruitment from high-volume expert clinics at a limited number of sites
    bias_type: selection_bias
    bias_description: >-
      Participants are recruited across different academic institutions from high
      volume expert clinics based on diagnosis and inclusion/exclusion criteria, and
      pediatric participants are recruited strictly from the Hospital for Sick
      Children. Five recording sites are included in the adult dataset. Groups that
      have less trust in the medical system or in AI, or that are less proximal to the
      collection sites, would have been less likely to be recruited.
    mitigation_strategy: >-
      The project states an intention to make the data more representative by shifting
      to remote collection and by designing the recruiting approach in a way that
      controls for more variables. The IRB protocol describes partnerships with
      Community Outreach Clinics serving underserved and under-represented populations
      and a Plan for Enhancing Diverse Perspectives.
    affected_subsets:
      - Adult cohort
      - Pediatric cohort
  - name: Uneven representation across disease categories and demographics
    bias_type: representation_bias
    bias_description: >-
      The public data releases do not contain an equal distribution of the disease
      categories, and the dataset has skews based on disorder category, site and other
      demographic factors. The initial data release contained data collected from four
      of the five disease categories.
    mitigation_strategy: >-
      Users should consider the multivariate distribution when assessing utility for
      different questions. Further releases are stated to contain additional data.
  - name: Device and recording-condition confounding with diagnosis
    bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders based on site, so they also
      had their data collected with different devices; distinct iPad devices were used
      at each site, and head-mounted microphones could be at slightly different
      distances. For the pediatric cohort, a headset was used for most participants
      while the remaining recordings used the built-in tablet microphone because of low
      tolerance of wearing headphones or existing complex medical conditions.
    mitigation_strategy: >-
      Recording hardware is standardized as far as practical (iPads of specified
      generations with an Avid AE-36 microphone and an Apple dongle), the collection
      application includes models for volume standardization and noise cancellation,
      and audio quality control metrics are released alongside the features from adult
      v3.1.0 and pediatric v1.1.0.
  - name: Non-probability sampling of an ongoing collection
    bias_type: sampling_bias
    bias_description: >-
      The sampling method is recorded as a non-probability sample. The released data
      are a sample of a larger, ongoing collection and are not representative because
      they were collected at a limited number of geographic locations.
  - name: Single-labeler diagnostic assignment
    bias_type: annotation_bias
    bias_description: >-
      A single labeler provides the label per instance: typically the clinician at the
      site of data collection, or a clinician external to data collection for a prior
      diagnostic assessment. For the psychiatric disorders cohort, assessment was
      determined from the participant's EHR record or an active prescription.
    mitigation_strategy: >-
      Labeling follows the Bridge2AI protocols and ICD-10 codes, and cohort-specific
      gold standard validation methods are defined for each diagnosis.
  - name: Distribution shift from evolving diagnostic practice
    bias_type: historical_bias
    bias_description: >-
      Changes in diagnostic criteria or practices could be a source of distribution
      shift over time within the dataset.

known_limitations:
  - name: Not representative of a broader population
    limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset is a sample of a larger, ongoing collection. The data are not
      representative because they were collected at a limited number of geographic
      locations.
    scope_impact: >-
      Models trained on the release may not generalize to populations outside the
      contributing clinics and geographies.
    recommended_mitigation: >-
      Consider the multivariate distribution of disorder category, site and demographic
      factors when assessing utility for a given question.
  - name: Raw audio and several derived features withheld from the public releases
    limitation_type: coverage_limitation
    limitation_description: >-
      The published PhysioNet releases contain derived features from the audio
      waveforms and do not contain raw audio. Spectrograms and similar features were
      excluded where the audio contained free speech; all spectrograms, MFCCs, Mel
      spectrograms, transcriptions, EMAs and PPGs from open-response prompts were
      removed from the feature-only dataset; and features for sensitive records and
      audio checks were removed. Multimodal data collected outside the app, including
      imaging, genomic data for the neurological cohort, laryngoscopy imaging and other
      EHR data, was not released in the v3.0.0 release.
    scope_impact: >-
      Analyses requiring the original waveform, free-speech content or linked imaging
      and genomic modalities cannot be performed from the PhysioNet release alone.
    recommended_mitigation: >-
      Raw audio can be requested through the controlled access mechanism and is
      disseminated via Synapse after institutional sign-off.
  - name: English-only protocol and cohort-specific age eligibility
    limitation_type: scope_limitation
    limitation_description: >-
      The dataset contains fluent English speakers; participants who do not read or
      speak English are excluded, and Spanish versions of the protocol are under
      development for future releases. The adult study population minimum age is 18
      years and maximum 120 years; the pediatric project covers ages 2-18 under a
      separate protocol and excludes individuals who are non-verbal.
    scope_impact: >-
      Findings and models derived from the release are specific to English-language
      speech and to the age band of the cohort used.
  - name: No recommended data splits and no k-anonymization
    limitation_type: methodological_limitation
    limitation_description: >-
      There are no predefined recommended data splits for training, validation or
      testing; researchers are encouraged to create their own. The dataset does not
      achieve k-anonymization with k greater than or equal to 2.
    scope_impact: >-
      Benchmark comparability across studies depends on each user's own split
      construction, and residual re-identification risk is managed by access control
      rather than by formal anonymity guarantees.
  - name: Criteria unmet in the project's own AI-readiness self-assessment
    limitation_type: methodological_limitation
    limitation_description: >-
      The project publishes a Precision Public Health (Voice) rating against the
      Bridge2AI AI-readiness criteria. FAIRness, Provenance, Pre-model explainability
      and Ethics score 100 percent, but Characterization scores 80 percent because the
      Data Quality criterion (2.e) is not met; Sustainability scores 50 percent because
      the Domain-appropriate (5.b) and Associated (5.d) criteria are not met, with
      Persistent and Well-governed met; and Computability scores 75 percent because the
      Contextualized criterion (6.d) is not met, with Standardized, Computational
      Accessibility and Portable met.
    scope_impact: >-
      Users should not assume that data quality, domain-appropriate sustainability,
      association with related resources, or contextualization have been formally
      established for this release.
    recommended_mitigation: >-
      Consult the AI-readiness for Biomedical Data: Bridge2AI Recommendations referenced
      by the project for detailed descriptions of each criterion.
  - name: Collection protocol evolved during the study
    limitation_type: temporal_limitation
    limitation_description: >-
      The collection protocol changed over the course of the study and different sites
      have different collection configurations. Changes in diagnostic criteria or
      practices could be a source of distribution shift over time.
    recommended_mitigation: >-
      Consult the release notes and the versioned REDCap data dictionary when combining
      data collected at different points in the study.

confidential_elements:
  - name: Confidentiality of the released feature dataset
    confidential_elements_present: false
    confidentiality_details:
      - >-
        The project's documentation answers "No" to whether the dataset contains data
        that might be considered confidential, such as data protected by legal
        privilege or by doctor-patient confidentiality, or non-public communications.
      - >-
        Identifiable information under HIPAA and the Common Rule, as well as data
        considered sensitive, have been removed from the released dataset.
  - name: Confidentiality obligations attached to transferred data
    confidential_elements_present: true
    confidentiality_details:
      - >-
        The Data Transfer and Use Agreement records that the Data is Personally
        Identifiable Information as defined in OMB Memorandum M-07-16 and is not
        covered under HIPAA, FERPA or similar laws requiring additional special terms.
      - >-
        The Data is covered under a Certificate of Confidentiality, which must be
        asserted against compulsory legal demands such as court orders and subpoenas
        for identifying information or characteristics of a research participant.
      - >-
        Recipients must establish appropriate administrative, technical and physical
        safeguards, must bind Authorized Persons to equivalent standards of
        confidentiality and security, and must not disclose, release, sell, rent,
        lease, loan or otherwise grant access to the Data to any third party without
        prior written consent of the Provider.

content_warnings:
  - name: Potentially sensitive free-speech content
    content_warnings_present: true
    warnings:
      - >-
        The dataset documentation notes that the dataset includes the transcription of
        free speech tasks; while the inclusion of offensive, insulting, threatening or
        otherwise unsafe material is unlikely, it cannot be completely avoided, as
        research participants are responsible for their choice of language.
      - >-
        This risk is mitigated in the released feature-only datasets: transcripts of
        free speech audio were removed from the earliest PhysioNet release, and all
        spectrograms, MFCCs, Mel spectrograms, transcriptions, EMAs and PPGs from
        open-response prompts were removed from the feature-only dataset. Raw audio
        transcripts were reviewed and any audio recordings that contained potentially
        identifying information or external voices were removed from the release. For
        the pediatric v1.1 release, audio features for all free speech tasks were
        manually checked for the presence of unconsented speakers and personally
        identifiable information before release.
      - >-
        Participants in the mood disorders cohorts are asked questions about
        depression, anxiety and related conditions; the IRB protocol records that
        answering some of these questions can lead to possible discomfort and could
        trigger negative emotions for the participants.

subpopulations:
  - name: Demographic and clinical subpopulations
    subpopulation_elements_present: true
    identification:
      - Age
      - Gender
      - Sex
      - Ethnicity
      - Socioeconomic status
      - >-
        Primary diagnostic category, assigned from the five disease cohort categories
        plus controls
      - >-
        Pediatric participants are additionally grouped by age band (Peds 2-4, 4-6,
        6-10 and 10+)
    distribution:
      - >-
        The public data releases do not contain an equal distribution of the disease
        categories; further releases will contain additional data.
      - >-
        The initial data release contained data collected from four of the five
        categories.
      - >-
        The dataset has skews based on disorder category, site and other demographic
        factors.

sensitive_elements:
  - name: Sensitive data elements retained in the release
    sensitive_elements_present: true
    sensitivity_details:
      - "Racial or ethnic origins: the dataset includes race information."
      - "Sexual orientations: the dataset includes sexual orientation information."
      - >-
        Financial or health data: the dataset includes socioeconomic and health
        information.
      - >-
        Non-identifying elements of data that revealed highly sensitive information,
        such as information about household income, mental health status and traumatic
        life experiences, were removed during de-identification.
      - >-
        All raw voice data was removed from the released feature datasets, as this data
        has the potential to cause individual re-identification or to be used for
        illicit or unauthorized purposes.

relationships:
  - name: Relationships between instances
    relationship_details:
      - >-
        Relationships between individual instances are not made explicit; the
        documentation states that instances are unrelated.
      - >-
        Participants may have repeated visits in order to collect data, so there may be
        more than one session per participant and more than one row per participant in
        the phenotype data files. There is no requirement that a participant provide the
        same response for each visit, so participant information for the same data
        element may vary across a data file.
      - >-
        Feature records are linked to participants and sessions through the
        participant_id, session_id and task_name identifiers carried in every Parquet
        feature file.

splits:
  - name: Recommended data splits
    split_details:
      - >-
        There are no predefined recommended data splits for training, validation or
        testing. Researchers are encouraged to create their own data splits based on
        their specific requirements.
      - >-
        The questionnaire features are collected and distributed in the phenotype
        folder format and can be used for cohort selection.

acquisition_methods:
  - name: Prospective observation, self-report and clinician validation
    was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - >-
        The data was directly observable and reported by subjects. Clinical diagnoses
        were verified by clinicians reviewing audio and/or imaging data, looking at
        electronic health records, or medication prescriptions.
      - >-
        Voice samples are collected prospectively using a custom software application
        (the Bridge2AI-Voice app) with the Bridge2AI-Voice protocols; for pediatrics,
        all data is collected using reproschema-ui with the Bridge2AI-Voice pediatric
        protocol.
      - >-
        Clinical validation is performed by a qualified physician or practitioner based
        on established gold standards for diagnosis defined per disease cohort.
      - >-
        The released feature values are derived from the raw audio waveforms by
        automated signal-processing and machine-learning tooling rather than observed
        directly.
      - >-
        Detailed demographic data and surveys about confounding factors such as smoking
        and drinking history are collected through the smartphone application, and the
        Bridge2AI-Voice protocols contain validated tools and questionnaires for each
        disease category.

collection_mechanisms:
  - name: Data acquisition applications and recording hardware
    mechanism_details:
      - >-
        The data were collected using an iPad app. Voice, breathing, cough and speech
        data are recorded with the app for adults and with reproschema-ui for
        pediatrics. A total of 22 acoustic tasks are recorded through the app.
      - >-
        Data is collected on iPads (9th or 10th generation) and iPad Air (5th
        generation) using an Avid AE-36 microphone and an Apple dongle to connect it to
        the iPad. Participants are instructed to wear a headset with microphone if the
        task includes voice recording, as per the Bridge2AI-Voice suggested standards.
      - >-
        HVEC and remote data collection occur through two platforms, the Bridge2AI Voice
        Web app and the Bridge2AI Voice iOS app. The iOS app is restricted to
        iOS-compatible devices, while the Web app can run on a computer, tablet or phone
        device; no software is downloaded or installed. Both apps are themselves
        HIPAA-compliant and only store data during the collection phase; the data are
        removed as soon as the page is closed and no login is required. The data are sent
        over a secure https protocol to a HIPAA-compliant storage server hosted by an NIH
        STRIDES partner (Amazon, Google or Microsoft).
      - >-
        Other multimodal data, including imaging, genomic data for the neuro cohort,
        laryngoscopy imaging and other EHR data, is extracted from different sites
        independently and uploaded through the REDCap database.
      - >-
        The smartphone application for voice data collection includes models to ensure
        acoustic data quality including volume standardization and noise cancellation.
      - >-
        Data were exported and converted from REDCap using an open source library
        developed by the team. Full data acquisition protocols are available in the
        REDCap instrument Shared Library and for download from the project's REDCap
        repository.
    used_software:
      - id: https://github.com/eipm/bridge2ai-redcap
        name: eipm/bridge2ai-redcap
        description: >-
          Bridge2AI REDCap data dictionary, metadata and instrument PDFs. Cited as
          Bridge2AI Voice REDCap; versions v3.20.0 and v3.23.0 are referenced by the
          PhysioNet releases.
        license: MIT
        url: https://github.com/eipm/bridge2ai-redcap
      - id: b2ai:software-reproschema-ui
        name: reproschema-ui
        description: >-
          Customized software used on tablets to administer the Bridge2AI-Voice
          pediatric protocol and collect all pediatric data.
  - name: Validation of the acquisition application through a feasibility study
    description: >-
      Evidence bearing on how the collection mechanism was assessed before broad data
      collection.
    mechanism_details:
      - >-
        A pilot feasibility study of the Bridge2AI-Voice application was conducted at
        the University of South Florida Health Voice Center in Tampa, Florida between 5
        June 2023 and 28 July 2023, enrolling 47 participants with and without voice
        disorders on a study iPad. It assessed task performance metrics and participant
        feedback using the Plan-Do-Study-Act model over three cycles.
      - >-
        Overall task completion rate was 68 percent (46 of 68 attempted tasks), with
        acoustic tasks successfully recorded in 41 percent of cases (13 of 32).
        Participants requested assistance in 41.2 percent of tasks; the Glides task
        required assistance 100 percent of the time. The summed average completion time
        for all tasks then available on the app was approximately 51 minutes 30 seconds.
      - >-
        Audio data was not collected at that stage of the app development, and the study
        was conducted at a single site without a control arm, so its findings describe
        the acquisition tool rather than the released dataset. Following the study a
        UX/UI expert was added to the team for further iterations of the app.
      - >-
        The application undergoes ongoing alpha- and beta-testing, so tasks may be
        altered, added or removed based on patient feedback, auditing and validation
        experiments conducted by the group.

sampling_strategies:
  - name: Non-probability clinic-based sampling
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - >-
        Patients presenting at specialty clinics and academic institutions in North
        America, screened for inclusion and exclusion criteria prior to their visit by
        the project investigators.
      - >-
        High Volume Expert Clinics, defined as outpatient clinics within hospital
        systems or academic institutions that have developed expertise in a specific
        disease area and see more than 50 patients per month from the same disease
        category; the IRB protocol defines them as clinics or programs with a volume of
        over 1000 patients per year.
      - >-
        Community Outreach Clinics, defined as clinics within or outside academic
        institutions whose main mission is to provide health services to underserved and
        under-represented populations.
      - >-
        Pediatric patients and healthy volunteers at the Hospital for Sick Children,
        with non-patients recruited through research postings.
    why_not_representative:
      - >-
        The data is not representative because it was collected at a limited number of
        geographic locations.
    representative_verification:
      - >-
        No representativeness validation is reported; the documentation states an
        intention to make the data more representative by shifting to remote collection
        and designing the recruiting approach to control for more variables.
    strategies:
      - "Sampling method recorded as: Non-Probability Sample."
      - >-
        Participants are identified based on membership of five predetermined disease
        groups plus controls, using cohort-specific inclusion and exclusion criteria.
      - >-
        If specific diagnoses or severities are under-represented in the dataset,
        participants are identified by medical record review based on voice-disorder
        related diagnostic codes.
      - >-
        Enrollment is anticipated to reach 10,000 participants by 2027; the IRB protocol
        describes a phased approach targeting up to 5,000 participants per disease
        category and controls and a total of 30,000 participants through collaboration
        with participating institutions and existing cohorts.

data_collectors:
  - name: Site research teams and clinicians
    role: Research staff, clinicians and study coordinators at participating sites
    collector_details:
      - >-
        Research teams, which may include medical, graduate or undergraduate students,
        coordinated with clinicians and doctors to identify appropriate participants.
      - >-
        These clinicians and doctors were listed under the IRB as co-investigators and
        were added to the consortium so that their names are included on
        consortium-level publications that emerge from the research. Hospital staff were
        not involved in scheduling but assisted in the logistics of coordinating data
        collection.
      - >-
        Data is collected in the clinic with the assistance of a trained research
        assistant. Part of the data collection takes place in High Volume Expert Clinics
        across the participating institutions during clinic visits, performed by the
        research team including the investigator and research coordinators or research
        assistants.
      - >-
        Future data collection will also occur remotely; however, remote data collection
        did not occur for the initial dataset release.

collection_timeframes:
  - name: Collection window for the released data
    timeframe_details:
      - "The data was collected over a period of 12 months."
  - name: Overall study period
    start_date: "2022-09-01"
    end_date: "2026-11-30"
    timeframe_details:
      - >-
        The NIH RePORTER record gives a project start of 1 September 2022 and a project
        end of 30 November 2026.
      - >-
        The IRB protocol describes a prospective cohort study over 4 years involving 11
        different academic sites across the US, with the potential to add extra data
        collection sites in phases 3-4. Phase 1 (exploratory, data collection for up to
        180 participants at main sites) was completed in November 2023; phase 2 (pilot,
        cumulatively up to 600 participants) began in November 2023 and was ongoing in
        November 2024; phase 3 (expansion, cumulatively up to 3,000 participants) and
        phase 4 (outreach, cumulatively up to 5,000 participants) follow.
      - >-
        Study duration for individual participants is up to 4 years. Participants may
        contribute single time-point data or, for progressive or degenerative cohorts
        such as Alzheimer's and Parkinson's disease, longitudinal data collected in
        clinic during regular follow-up visits or at home at intervals of 1-6 months.

direct_collection:
  - name: Direct collection from participants
    is_direct: true
    collection_details:
      - >-
        Data was collected from the individuals in question directly, rather than
        obtained via third parties or other sources.
      - "The data was collected in the USA and Canada."
      - >-
        Existing clinical data within the electronic health record is additionally
        reviewed and collected for diagnosis validation, including demographics,
        imaging previously acquired for clinical purposes, and clinical data related to
        diagnosis; no additional imaging is performed for the study.

collection_notifications:
  - name: Notification of participants
    notification_details:
      - >-
        The individuals in question were notified about the data collection; participants
        went through an IRB-approved consent process.
      - >-
        An informed consent process takes place in which the participant and/or
        consenting parent or guardian is made aware that participation is fully
        voluntary, that no undue influence or coercion is possible, and that declining
        does not interfere with their normal standard of care.

collection_consents:
  - name: Consent to collection and use
    consent_details:
      - >-
        All participants have been duly informed and agreed to the collection and the
        use of their data via prospective informed consent.
      - >-
        In most cases the consent or assent process takes place in the clinic setting of
        the recruiting High Volume Expert Clinic and is conducted by research
        assistants. About 30 minutes is spent explaining the study and consent in
        detail, with time for questions, and potential participants are asked to explain
        what they have understood to the research assistant to confirm their
        understanding.
      - >-
        Participants may consent by signing a physical paper copy, by indicating
        electronic consent within the app or through REDCap surveys, or through video
        recording within the app. Where video consent is used, the standard consent
        document is displayed on the app and participants are instructed to start
        recording, read a statement out loud and send it; the audio recording from the
        consent is used to verify that the acoustic data submitted by the participant
        belongs to the consented individual and to distinguish participants from bots.
      - >-
        Electronic consent is housed in REDCap and is HIPAA compliant. Where consent and
        data collection are separated in time, participants are notified of any changes
        to the study and re-consented before data collection. For longitudinal
        collection, an electronic consent through the app is administered before each
        subsequent data collection to ensure ongoing consent.
      - >-
        Consent language records that research data not containing direct identifiers
        will be shared with external researchers for future research through a secure
        database; that data posing a low risk of causing individual re-identification
        will be shared in registered access with the general public; and that data that
        would pose a heightened risk of re-identification if shared in full open access
        will be shared through a controlled access mechanism with authorized
        researchers.
      - >-
        Consent type constraints recorded for the dataset: it does not allow only
        non-commercial use, does not restrict use to a specific geographic location,
        does not restrict use to a specific type of research, does not restrict use to
        genetic research, and does not exclude research that involves the development of
        methods or algorithms.

consent_revocations:
  - name: Withdrawal and revocation
    revocation_details:
      - >-
        Consenting participants are informed that they may withdraw from the study at
        any point. If a participant chooses to withdraw during or before the voice data
        collection, their data will not be included in the database.
      - >-
        Participants are informed that research data, including voice recordings, cannot
        be removed from the database once the voice data collection process is
        completed. If participants withdraw after completing voice data collection, the
        data they have provided will be kept until completion of the study.
      - >-
        For longitudinal data collection, if participants withdraw at any time during
        the study process the data they have completed will be used in the database,
        because the purpose of the data generation project is to provide a platform and
        open-source database for future research rather than to analyse the data. The
        minimal requirement for study completion is one data collection time point.
      - >-
        Participants who withdraw have the option to complete a satisfaction survey to
        help understand their reasons for withdrawal; completion is entirely optional
        and no protected health information is collected.

missing_data_documentation:
  - name: Missingness in the released tables
    missing_data_patterns:
      - >-
        Some questions are optional, and there may be data collection irregularities
        that caused some information to be missing from individual instances.
      - >-
        Each individual answered a common set of questions and then responded to
        additional questions relevant to their primary diagnostic category, so
        cohort-specific questionnaire tables are populated only for the relevant
        participants.
      - >-
        Some audio files, whether due to length or other issues, could not generate
        certain features and so are not included in the bundled feature data, producing
        differing record counts across feature files.
    missing_data_causes:
      - Optional survey items left unanswered by participants.
      - Data collection irregularities during clinic sessions.
      - >-
        Deliberate removal of features for sensitive records, audio checks and
        free-speech prompts during de-identification.
    handling_strategy: >-
      Phenotype data files only contain rows for a participant if at least one column is
      not missing. The dataset has been audited internally for missingness and
      consistency by the data release team, and a missingness table is included with the
      dataset. Generating missingness tables is the first step of the stated audit
      protocol.

raw_data_sources:
  - name: Raw audio waveforms and source questionnaire exports
    source_description: >-
      The primary raw material is the set of audio waveforms recorded through the
      Bridge2AI-Voice applications (adults) and reproschema-ui (pediatrics), together
      with questionnaire and clinical data captured in REDCap or ReproSchema-UI. Raw
      audio was preprocessed by converting to monaural and resampling to 16 kHz with a
      Butterworth anti-aliasing filter applied, and the released feature files are
      derived from that standardized audio.
    source_type:
      - Prospectively recorded acoustic task audio
      - Participant-completed demographic, confounder and validated questionnaire data
      - Clinician-entered diagnosis and gold standard validation forms
      - Electronic health record extracts used for diagnosis validation
    access_details: >-
      The raw data was saved in addition to the preprocessed data and is not accessible
      publicly. Raw audio is disseminated through controlled access only, to protect
      participants' privacy. Users interested in accessing the audio data from any
      Bridge2AI-Voice dataset can request access from the project's data access
      committee; accessing raw audio requires institutional sign-off, and the data are
      made available via Synapse (syn72370534 for the adult cohort and syn73617068 for
      the pediatric cohort) rather than through PhysioNet.
    raw_data_format:
      - WAV audio
      - REDCap and ReproSchema-UI exports converted to tab-delimited values
      - >-
        BIDS-organised directory tree with per-participant, per-session audio and JSON
        sidecars

ethical_reviews:
  - name: University of South Florida single IRB review
    reviewing_organization: b2ai:org-usf
    contact_person: b2ai:person-yael-bensoussan
    review_details:
      - >-
        The clinical study has been reviewed and approved by at least one human
        subjects' protection review board: it was submitted and approved by the USF
        Single IRB and subsite IRBs through the Single IRB process.
      - >-
        Data collection and sharing was approved by the University of South Florida
        Institutional Review Board.
      - >-
        The governing protocol is "Bridge2AI Voice Data Acquisition", principal
        investigator Yael Bensoussan, MD MSc, FRCSC, Department of Otolaryngology-Head
        and Neck Surgery. Version 1 is dated 17 January 2023, and the revision history
        runs through V13 dated 11 July 2025, covering the addition of the pediatric
        cohort under the single IRB (V2), compensation for participating adults (V3),
        electronic consent (V4), controls and new disease categories (V5), remote and
        e-consent options and revised compensation (V7, V8), the Bridge2AI Voice Web
        app and iOS app platforms (V10), Spanish-language data collection and additional
        recruitment platforms and sites (V11), and recruitment flyers and additional
        Vanderbilt sites (V13).
      - >-
        A partial HIPAA waiver was requested for recruitment purposes to allow the study
        team to review EHR information for incoming clinic patients ahead of their
        appointments; the PHI collected under the waiver is limited to the study's
        inclusion criteria and is destroyed at the earliest opportunity consistent with
        the conduct of the research.
      - >-
        The study is not for a drug product and is not for a medical device, and no data
        monitoring committee was appointed for this study.
  - name: Hospital for Sick Children Research Ethics Board review
    reviewing_organization: b2ai:org-sickkids
    review_details:
      - >-
        Pediatric data collection and sharing was approved by the Research Ethics Board
        at the Hospital for Sick Children.
      - >-
        Canadian institutions (Mount Sinai Hospital, SickKids and the University of
        Toronto) do not follow the US single IRB process and apply for a separate
        research ethics board application to comply with Canadian regulations; a copy of
        the approved application is submitted to the USF IRB.
  - name: Separate ethics review for genomic data collection
    reviewing_organization: b2ai:org-uoft
    review_details:
      - >-
        No genetic information is collected at the USF site. Genomic data collection is
        performed only at the University of Toronto and Mount Sinai Hospital, which
        submit a separate research ethics proposal to their respective institutions; all
        genomic information is collected, managed and analysed at those sites, and the
        REB approvals are sent to the USF IRB once approved.
  - name: Institutional review of the application feasibility study
    reviewing_organization: b2ai:org-usf
    review_details:
      - >-
        The separate pilot feasibility study of the Bridge2AI-Voice application was
        approved by the Institutional Review Board of the University of South Florida
        under IRB number 004890, and all participants provided written informed consent
        for all study procedures. This approval covers the app feasibility study rather
        than the released dataset.

data_protection_impacts:
  - name: Data protection impact analysis
    impact_details:
      - >-
        An analysis of the potential impact of the dataset and its use on data subjects
        has not been conducted.

human_subject_research:
  name: Human subjects research status
  description: >-
    Bridge2AI-Voice is a prospective human subjects data generation project with no
    study intervention; the primary objective is to build a large multi-institutional
    database and no intervention is involved.
  involves_human_subjects: true
  irb_approval:
    - >-
      University of South Florida single IRB approval of the "Bridge2AI Voice Data
      Acquisition" protocol, with subsite IRBs joining through the single IRB process.
    - >-
      Research Ethics Board approval at the Hospital for Sick Children for the pediatric
      cohort.
    - >-
      Separate research ethics board approvals at the University of Toronto and Mount
      Sinai Hospital for genomic data collection.
    - >-
      Partial HIPAA waiver for recruitment and screening purposes only.
  ethics_review_board:
    - University of South Florida Institutional Review Board (single IRB of record)
    - Hospital for Sick Children Research Ethics Board
    - Mount Sinai Hospital and University of Toronto research ethics boards
  special_populations:
    - >-
      Pediatric participants aged 2-18, enrolled only through the pediatric sites and
      not at USF; a checklist for children under 21 was completed and appended to the
      protocol.
    - >-
      Participants with mild cognitive impairment, Alzheimer's disease, other dementias
      and other neurodegenerative conditions.
    - >-
      Participants with mood and psychiatric disorders, for whom some questionnaire
      items may cause discomfort or trigger negative emotions.
    - >-
      Participants from socially or economically disadvantaged and underserved
      populations, recruited through Community Outreach Clinics under a Plan for
      Enhancing Diverse Perspectives. Students, employees and wards of the state are
      neither specifically included nor excluded.
  regulatory_compliance:
    - >-
      HIPAA: the collection applications are HIPAA-compliant and transmit over a secure
      https protocol to HIPAA-compliant storage hosted by NIH STRIDES partners (Amazon,
      Google, Microsoft) that have pre-negotiated agreements with the NIH for data
      privacy and HIPAA protection.
    - >-
      Common Rule: identifiable information under HIPAA and the Common Rule has been
      removed from the released dataset.
    - >-
      Certificate of Confidentiality covering the data transferred under the Data
      Transfer and Use Agreement.
    - >-
      Good Clinical Practice guidelines are followed by the PI and study team, and all
      investigators and project personnel with data access must complete appropriate
      certification through their local institution including HIPAA and privacy
      training.

informed_consent:
  - name: Adult informed consent
    consent_obtained: true
    consent_type:
      - Written informed consent on paper
      - Electronic consent within the data collection application
      - Electronic consent through REDCap survey forms
      - Video-recorded consent within the application
      - Ongoing electronic re-consent before each subsequent longitudinal collection
    consent_documentation:
      - >-
        Paper consent documents are uploaded and saved electronically in REDCap. All
        paper and electronic versions of consent are stored for a minimum of 5 years
        after completion of the study, following required USF procedure.
      - >-
        Where remote consent does not require the signature of the researcher, the
        consent form omits the final Statement of Person Obtaining Informed Consent
        section but is otherwise identical. Electronic consent contains the same text as
        paper consent.
    withdrawal_mechanism:
      - >-
        Participants may withdraw from the study at any point; withdrawal during or
        before voice data collection means their data are not included in the database.
        Data cannot be removed once the voice data collection process is completed.
    consent_scope:
      - >-
        Consent covers collection of acoustic, demographic, questionnaire and clinical
        data; access by investigators to medical information through EHR platforms in
        order to perform gold standard validation of diagnoses and symptoms; and
        deposition of de-identified voice and clinical data in an open-sourced database
        for future research.
      - >-
        During the consent process participants are told they may be asked to provide
        longitudinal data for some diseases, and are counselled on how to download the
        application on their personal phones or tablets for further data collection from
        home.
      - >-
        Within the consent process individuals are asked whether they agree to be
        contacted in the future for further voice data collection; contact details
        provided under that option are stored within the institutional database only and
        are not shared with other centres or uploaded to the cloud.
  - name: Pediatric consent and assent
    consent_obtained: true
    consent_type:
      - Parental permission or permission from a legal guardian
      - Verbal assent from the child where appropriate
      - Participant consent where the participant is able to provide it
    consent_documentation:
      - >-
        Assent is documented on a dedicated form. Parental permission is obtained from
        one or both parents; the research is minimal risk and does not require permission
        from both parents or legal guardians.
    withdrawal_mechanism:
      - >-
        The same withdrawal provisions apply as for adult participants; participation is
        voluntary throughout.
    consent_scope:
      - >-
        Parental or participant consent was obtained prior to data collection and data
        sharing. Exclusion applies where consent is not received from a parent or
        guardian for voice and clinical de-identified data being uploaded to an
        open-sourced database.

at_risk_populations:
  name: Protections for at-risk populations
  description: >-
    The study enrols children and adults with cognitive, psychiatric and
    neurodegenerative conditions, and specifically seeks to enrol participants from
    socially and economically disadvantaged and underserved populations.
  at_risk_groups_included: true
  special_protections:
    - >-
      Pediatric patients are enrolled only through the pediatric sites and not at USF.
      Checklist HRP-416 for children under 21 was completed and appended to the protocol.
    - >-
      Voice collection is described as a safe, non-invasive collection method with
      minimal risk; the principal residual risk is to data privacy, which is managed by
      strict adherence to confidentiality rules, restricted access to medical records and
      REDCap records, and de-identification before sharing.
    - >-
      Where a caregiver's voice is recorded inadvertently, the clips can be discarded by
      re-recording manually during data collection or during data audit and
      post-processing. For the pediatric v1.1 release, audio features for free speech
      tasks were manually checked for the presence of unconsented speakers.
    - >-
      A specific plan is in place to enrol participants from socially and economically
      disadvantaged and underserved populations through the Plan for Enhancing Diverse
      Perspectives, so that the database is diverse and FAIR while representing the
      population.
  assent_procedures:
    - >-
      When children participate, parents or guardians provide consent and children
      provide verbal assent where appropriate. Where young children cannot reasonably be
      asked to assent because of limitations in understanding due to age and development
      they are not asked to do so; this typically holds for children under seven years of
      age. Assent is documented on a form.
  guardian_consent:
    - >-
      Parental permission is obtained from one or both parents. Because the research is
      minimal risk, permission from both parents or legal guardians is not required.
    - >-
      For pediatric participants who lack adequate comprehension or familiarity with
      their past medical history, parents or decision-makers completed the medical
      history survey on a separate tablet during the recording.

participant_privacy:
  - name: Privacy protections and re-identification risk
    anonymization_method:
      - >-
        All direct identifiers were removed, including name, civic address and social
        security numbers. Indirect identifiers were removed where these created a
        significant risk of participant re-identification, for example through
        combination with other public data available on social media, in government
        registries or elsewhere; these include select geographic or demographic
        identifiers and some information about household composition or cultural
        identity.
      - >-
        HIPAA Safe Harbor identifiers were removed. State and province were removed and
        the country of data collection was retained.
      - >-
        All raw voice data was removed from the released feature datasets because it has
        the potential to cause individual re-identification or to be used for illicit or
        unauthorized purposes.
    reidentification_risk:
      - >-
        The dataset does not achieve k-anonymization with k greater than or equal to 2.
      - >-
        The IRB protocol notes that even when all HIPAA-protected information associated
        with a participant is removed, each person's voice is unique to them and their
        health at that time in their life, so it is always possible, even if unlikely,
        that someone could recognize a participant's voice; voice can never be fully
        de-identified.
      - >-
        The consortium is addressing ethical, legal and social challenges surrounding
        voice AI including risks of voice re-identification and vulnerabilities such as
        voice AI hacking.
    privacy_techniques:
      - >-
        Tiered dissemination: data posing a low risk of re-identification is shared under
        registered or credentialed access, while data that would pose a heightened risk
        if shared in full open access is shared through a controlled access mechanism
        with authorized researchers.
      - >-
        Dates are rebased and/or replaced by integers, geographic information is removed
        or generalized, and narrative text fields are removed.
      - >-
        Federated learning is used so that algorithms are run on data at each institution
        and only model updates are shared to a central node, allowing multi-institutional
        analysis without the data leaving the institution.
      - >-
        Identifiable PHI is kept on institutional REDCap databases with password-protected
        access limited to investigators at the institution where the data was collected;
        all users have individual usernames and passwords for REDCap and the HIPAA-secure
        cloud server.
    data_linkage:
      - >-
        Participant numbers and institution numbers are created to allow institutions to
        track and retain ownership of their institutional data within the joint
        de-identified meta-database.
      - >-
        Participants who consent permit investigators to access medical information
        through EHR platforms in order to perform gold standard validation of diagnoses
        and symptoms.
      - >-
        Recipients of transferred data must not use the Data, alone or in concert with
        any other information, to make any effort to contact individuals who are the
        subjects of the Data without appropriate IRB approval, specific written approval
        from the Provider and informed consent from the individual where required.

participant_compensation:
  - name: Participant compensation
    compensation_provided: true
    compensation_type:
      - Electronic gift cards
    compensation_amount:
      - >-
        Participants currently receive 40 US dollars for a data collection session that
        takes less than 90 minutes and 80 US dollars for a session that takes over 90
        minutes, for no more than a total of 3 sessions and a maximum compensation of 120
        US dollars.
    compensation_rationale:
      - >-
        Compensation is provided to the adult population only. Participants in the
        separate app feasibility study did not receive financial incentives for
        completion of that study.

preprocessing_strategies:
  - name: Audio standardization and derived feature extraction
    description: >-
      Preprocessing applied to raw waveforms to produce the released feature-only
      datasets.
    preprocessing_details:
      - >-
        Raw audio was preprocessed by converting to monaural and resampling to 16 kHz
        with a Butterworth anti-aliasing filter applied.
      - >-
        Spectrograms are time-frequency representations computed using the short-time
        Fast Fourier Transform with a 25 ms window size, 10 ms hop length and a 400-point
        FFT; spectrograms were further downsampled by a factor of two in the time domain
        after derivation. The earliest release used a 512-point FFT.
      - >-
        Sixty Mel-frequency cepstral coefficients were extracted using the spectrograms,
        and Mel spectrograms were computed with the same parameters and 60 Mel bins.
      - >-
        Articulatory features were generated with the Speech Articulatory Coding (sparc)
        package, producing kinematic traces of vocal tract articulators and source
        features as well as measures of loudness, periodicity and pitch, all gathered at
        50 Hz.
      - >-
        Acoustic features were extracted using OpenSMILE, capturing temporal dynamics and
        acoustic characteristics, and phonetic and prosodic features were computed using
        Parselmouth and Praat, providing measures of fundamental frequency, formants and
        voice quality.
      - >-
        Phonetic posteriorgrams, a time-varying categorical distribution over acoustic
        units of speech at 100 Hz, were generated via the ppgs package.
      - >-
        Transcriptions were generated using OpenAI's Whisper Large model.
      - >-
        Waveform-derived features are stored in two formats: a fixed feature format that
        includes static features extracted from the entire waveform, and a temporal
        format that varies for each audio file depending on the length of the recording.
        Speech intelligibility metrics are computed for speech tasks.
      - >-
        The raw audio files and the questionnaire data retrieved from ReproSchema-UI or
        exported from REDCap were converted to be compliant with the Brain Imaging Data
        Structure v1.9.0. Pediatric data collected through ReproSchema-UI is extracted
        and transformed into REDCap format and subsequently converted to BIDS.
      - >-
        The adult v3.0.0 and v3.1.0 releases were generated with b2aiprep v3.0.0.
    used_software:
      - id: https://github.com/sensein/b2aiprep
        name: b2aiprep
        description: >-
          The Bridge2AI data processing library used to organize and preprocess the
          dataset, to process the raw audio into the released features and to merge the
          source data into the phenotype files.
        version: 3.0.0
        license: Apache-2.0
        url: https://github.com/sensein/b2aiprep
      - id: https://github.com/sensein/senselab
        name: SenseLab
        description: Library used for processing audio files for research tasks.
        url: https://github.com/sensein/senselab
      - id: b2ai:software-opensmile
        name: openSMILE
        description: >-
          Speech and Music Interpretation by Large-space Extraction; used to extract
          eGeMAPS and other acoustic features per audio file.
      - id: b2ai:software-praat
        name: Praat
        description: >-
          Used together with parselmouth to compute phonetic and prosodic features
          including fundamental frequency, formants and voice quality.
      - id: b2ai:software-parselmouth
        name: parselmouth
        description: A Python interface to Praat used for speech feature extraction.
      - id: b2ai:software-torchaudio
        name: torchaudio
        description: >-
          Used to compute pitch contours, spectrograms, Mel spectrograms and MFCCs.
      - id: b2ai:software-sparc
        name: Speech Articulatory Coding (sparc)
        description: >-
          Used to generate electromagnetic articulography estimates plus loudness,
          periodicity and pitch measures.
      - id: b2ai:software-ppgs
        name: ppgs
        description: >-
          Used to generate phonetic posteriorgrams across 40 phoneme categories at 100
          Hz.
      - id: b2ai:software-whisper-large
        name: OpenAI Whisper Large
        description: Used to generate transcriptions of the audio recordings.

cleaning_strategies:
  - name: Cleaning of the phenotype data
    cleaning_details:
      - >-
        The project documentation answers "No" to whether there was any pre-processing
        for cleaning the data, for both the preliminary and the current version of the
        dataset. Instances were not excluded from the dataset at the time of
        preprocessing.
  - name: Removal of sensitive and low-quality records from the released features
    cleaning_details:
      - >-
        Raw audio transcripts were reviewed and any audio recordings that contained
        potentially identifying information or external voices were removed from the
        release.
      - >-
        All sensitive fields were removed from the dataset, corresponding to data
        elements encoded as sensitive under the "Identifier?" column of the REDCap data
        dictionary.
      - >-
        Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive
        records and audio checks were removed from adult v3.1 and pediatric v1.1, and
        spectrograms and similar features were excluded where the audio contained free
        speech.
      - >-
        The stated audit protocol is to generate missingness tables; check distributions
        and outliers; check categorical responses against the schema; and, for audio
        tasks, run quality control metrics checking the amount of silence and duration of
        waveforms and, for speech, checking the produced speech relative to the intended
        passage.

labeling_strategies:
  - name: Clinician-assigned gold standard diagnostic labeling
    data_annotation_platform:
      - >-
        Clinical validation forms within the Bridge2AI-Voice protocols, entered into the
        REDCap database as part of the Case Report Form.
    data_annotation_protocol:
      - "Labelers followed the Bridge2AI protocols and ICD-10 codes."
      - >-
        Clinical validation is performed by a qualified physician or practitioner based
        on established gold standards for diagnosis, which are defined per disease
        cohort: laryngoscopy images and stroboscopy videos for the voice disorders
        cohort, with CT and spirometry added for unilateral vocal fold paralysis;
        spirometry and flow volume loops, with CT of neck and chest, for the respiratory
        cohort; CT brain, MRI brain and whole genome sequencing, with serum p-tau
        biomarkers for Alzheimer's disease, for the neurological cohort; and electronic
        health summary, clinical diagnosis from a psychiatrist and medication history for
        the mood and psychiatric cohort.
      - >-
        The labeling strategy is described as a gold standard label available in the data
        and diagnosed by a clinician.
    annotations_per_item: 1
    inter_annotator_agreement: >-
      Not computed: a single labeler provides the label per instance, so no
      inter-annotator agreement statistic is reported.
    annotator_demographics:
      - >-
        Typically the clinician at the site of data collection, or a clinician external
        to data collection for a prior diagnostic assessment. For the psychiatric
        disorders cohort the assessment was determined from the participant's EHR record
        or an active prescription by an appropriately licensed clinician outside of data
        collection.
    labeling_details:
      - >-
        There is an explicit label associated with each data instance: diagnostic
        categories such as vocal pathologies, neurological disorders, psychiatric
        conditions and respiratory disorders.
      - >-
        Human-level performance in the applications the dataset is intended to address
        varies widely.
      - >-
        The recommended guideline for future researchers is that the process for any new
        labels should be described alongside any release of a model or publication, and
        should include the exact variables used for that determination.
      - >-
        The v3.1.0 release back-filled updated validated diagnosis information across
        conditions and renamed certain gold standard variables.
    used_software:
      - id: https://github.com/eipm/bridge2ai-redcap
        name: eipm/bridge2ai-redcap
        description: >-
          REDCap data dictionary and metadata defining the clinical validation
          instruments and the sensitivity flags used during de-identification.
        license: MIT
        url: https://github.com/eipm/bridge2ai-redcap

raw_sources:
  - name: Adult raw audio archive
    access_url: https://www.synapse.org/Synapse:syn72370534/
    raw_data_details:
      - >-
        The raw data, post de-identification, was saved in addition to the preprocessed
        data; it is saved and is not accessible publicly.
      - >-
        The published Bridge2AI-Voice adult dataset contains derived features from the
        audio waveforms and the PhysioNet project does not contain raw audio. Accessing
        raw audio is a more involved process and requires institutional sign-off through
        the project's access committee, and the data are made available via Synapse.
  - name: Pediatric raw audio archive
    access_url: https://www.synapse.org/Synapse:syn73617068
    raw_data_details:
      - >-
        The published Bridge2AI-Voice Pediatric Dataset contains derived features from
        the audio waveforms; the PhysioNet project does not contain raw audio, which is
        distributed via Synapse after institutional sign-off through the access
        committee.

annotation_analyses:
  - name: Annotation quality assessment
    analysis_method: >-
      No inter-annotator agreement analysis was performed, because a single labeler
      provides the label per instance. Quality assurance instead relies on cohort-specific
      gold standard validation methods, on internal auditing of the release for
      missingness and consistency, and on audio quality control metrics.
    annotation_quality_details:
      - >-
        The determination of diagnosis, depending on the disorder, was performed by one
        clinician or based on an EHR record or prescription, which is identified as a
        factor that may limit generalization of derived models.
      - >-
        Certain aspects of the data, such as transcription, were generated using
        off-the-shelf models that have not been audited for correctness.
      - >-
        The team hired 2 acoustic engineers and 3 AI data scientists to analyse all
        samples from the year 1 exploratory data collection phase to ensure acoustic
        quality and ML readiness; in each subsequent year of the study, 10 percent of the
        data is selected at random every month for quality control and ML readiness.

machine_annotation_tools:
  - name: Automated derivation and transcription tooling
    tools:
      - OpenAI Whisper Large
      - openSMILE
      - Praat and parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - ppgs
      - b2aiprep
      - SenseLab
    tool_descriptions:
      - "Whisper Large was used to generate transcriptions of the recordings."
      - >-
        openSMILE produced eGeMAPS and other acoustic features per audio file; Praat and
        parselmouth produced phonetic and prosodic measures; torchaudio produced pitch
        contours, spectrograms, Mel spectrograms and MFCCs; sparc produced
        electromagnetic articulography estimates plus loudness, periodicity and pitch;
        ppgs produced phonetic posteriorgrams across 40 phoneme categories.
      - >-
        b2aiprep organizes and preprocesses the dataset and merges source data into the
        phenotype files; SenseLab processes audio files for research tasks.
    tool_accuracy:
      - >-
        Certain aspects of the data, for example transcription, were generated using
        off-the-shelf models that have not been audited for correctness.

existing_uses:
  - name: Prior uses of the dataset
    examples:
      - >-
        A restricted version of the dataset containing raw audio has been used in the
        Bridge2AI Summer School and hackathon.
      - >-
        Training opportunities for using the dataset are offered through the Bridge2AI
        Voice Scholars programme at https://www.b2aivoicescholars.org/ .

use_repository:
  - name: Registry of downstream uses
    description: >-
      The project documentation states that there is no repository, besides Google
      Scholar, that links to papers or systems that use the dataset.
    repository_details:
      - >-
        There is no dedicated repository linking to papers or systems that use the
        dataset.
      - >-
        Use of the dataset requires citation of the protocol development publication,
        which is accessible through the ISCA archive.

other_tasks:
  - name: Additional applications the dataset can support
    task_details:
      - >-
        The dataset can be used for AI model pretraining, fine-tuning, benchmarking or
        validation.
      - >-
        The questionnaire features distributed in the phenotype folder can be used for
        cohort selection.
      - >-
        The pediatric resource is intended to enable study of developmental norms, create
        AI-driven tools for early screening and support clinical insight.
      - >-
        The project intends the resource to support the development of predictive models
        to assist in screening, diagnosis and treatment of a broad range of diseases, and
        to serve as a model for creating bioinformatics standards for voice data.

future_use_impacts:
  - name: Composition and collection effects on future use
    impact_details:
      - >-
        The dataset has skews based on disorder category, site and other demographic
        factors. Users should consider the multivariate distribution when assessing
        utility for different questions.
      - >-
        Factors that may limit the generalization of derived models include the number
        and diversity of devices in the dataset, the recording conditions, the number and
        diversity of recording sites (five recording sites are included), and
        distribution shifts over time arising from changes in diagnostic criteria or
        practices.
      - >-
        Interactions exist between demographic or historically marginalized groups and
        the recordings: groups with less trust in the medical system or AI, or less
        proximal to collection sites, would have been less likely to be recruited, and
        participants were screened for different disorders based on site so their data
        were collected with different devices.

discouraged_uses:
  - name: Discouraged applications
    discouragement_details:
      - >-
        The dataset should not be used for non-clinical or non-research applications such
        as hiring decisions, insurance premium adjustments, or any form of surveillance
        that could lead to discrimination or harm.
      - >-
        These limitations are intended to prevent unethical or biased outcomes that could
        negatively impact individuals based on their health conditions or voice
        characteristics. The dataset is intended strictly for research that prioritizes
        patient safety, privacy and ethical use.

intended_uses:
  - name: Recommended applications
    examples:
      - >-
        Development, benchmarking or validation of clinically applicable machine-learning
        models for diagnosing health conditions using voice data, including vocal
        pathologies and neurological, psychiatric, respiratory and pediatric voice
        disorders.
      - >-
        Clinical research in disease screening, diagnosis and monitoring through voice
        biomarkers.
      - "AI model pretraining and fine-tuning."
      - >-
        Study of developmental norms in pediatric voice and speech, and development of
        AI-driven tools for early screening.
    usage_notes: >-
      The dataset is primarily intended for research applications. It is structured to be
      Findable, Accessible, Interoperable and Reusable. It is intended solely for
      commercial and non-commercial research purposes by Authorized Researchers, as
      detailed in the Registered Data Access Agreement. Parquet feature files can be
      loaded with any library supporting Parquet, and the phenotype tab-delimited files
      can be read with any statistical analysis tool.
    use_category:
      - Research
      - Clinical machine-learning model development
      - Benchmarking and external validation

prohibited_uses:
  - name: Prohibited applications
    description: >-
      Restrictions on use detailed in the Registered Data Access Agreement, reflecting
      the consortium's commitment to advancing ethical and trustworthy research practices
      that respect and protect the rights and interests of research participants.
    prohibition_reason:
      - >-
        The dataset is not to be used to attempt to re-identify research participants,
        nor for any actions that could reasonably lead to re-identification.
      - >-
        The dataset is not to be used for any purpose that could foreseeably cause harm
        or stigmatization to research participants, their families, communities or
        specific populations.
      - >-
        Intellectual property protections, database rights or related rights may not be
        used in a manner that restricts or limits access to any part of the dataset or to
        any conclusions derived from it, so that future use of the dataset remains
        unrestricted in alignment with the Open Science principles upheld by the
        consortium.
      - >-
        Sale of all or part of the Data on any media is not permitted under the access
        agreement, and recipients agree not to make intellectual property claims on the
        Data.

distribution_formats:
  - name: Feature-only datasets on PhysioNet
    description: >-
      The adult and pediatric featurized datasets are available through separate
      PhysioNet links. A derived dataset containing spectrograms and combined phenotypic
      data is available under a permissioned access mechanism; registration on PhysioNet
      and signing of a data use agreement enable access. Dense feature files are
      distributed as Parquet, an open-source column-oriented data file format, and
      phenotype and static feature tables are distributed as TSV with paired JSON data
      dictionaries.
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
      - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
  - name: Raw audio via controlled access on Synapse
    description: >-
      Raw audio data is disseminated through controlled access only, to protect
      participants' privacy. Users interested in accessing the audio data from any
      Bridge2AI-Voice dataset can request access from the project's data access committee;
      accessing raw audio requires institutional sign-off.
    access_urls:
      - https://www.synapse.org/Synapse:syn72370534/
      - https://www.synapse.org/Synapse:syn73617068
  - name: Historical release on Health Data Nexus
    description: >-
      An earlier version of the feature-only dataset is available on Health Data Nexus,
      which provides cloud compute alongside the dataset rather than allowing data
      downloads. The dataset documentation describes distribution through a data
      publishing platform that provides publicly accessible metadata with a DOI for
      persistent resolution, while the dataset itself requires registered access.
    access_urls:
      - https://healthdatanexus.ai/

distribution_dates:
  - name: Release dates
    release_dates:
      - >-
        Adult v1.0: published and made available at the end of November 2024 on Health
        Data Nexus.
      - "Adult v1.1: 17 January 2025 (PhysioNet)."
      - "Adult v2.0.0: 16 April 2025 (PhysioNet)."
      - "Adult v2.0.1: 18 August 2025 (PhysioNet)."
      - "Adult v3.0.0: 16 December 2025 (PhysioNet)."
      - "Adult v3.1.0: 1 May 2026 (PhysioNet)."
      - "Pediatric v1.0.0: 17 December 2025 (PhysioNet)."
      - "Pediatric v1.1.0: 1 May 2026 (PhysioNet)."

third_party_sharing:
  - name: Distribution beyond the creating entity
    description: >-
      The dataset will be distributed broadly to individuals outside of the entity who
      created the dataset.
    is_shared: true

license_and_use_terms:
  name: Access agreements and licensing
  description: >-
    The feature-only and raw audio datasets are available under distinct agreements
    appropriate for the sensitivity of their respective content.
  license_terms:
    - >-
      License for files on PhysioNet: Bridge2AI Voice Registered Access License. Data Use
      Agreement: Bridge2AI Voice Registered Access Agreement. For the adult v3.1.0 and
      pediatric v1.1.0 releases the access policy states that only credentialed users who
      sign the DUA can access the files, and no training is required. The earlier v1.1
      access policy stated that only registered users who sign the specified data use
      agreement can access the files.
    - >-
      Registered access for features-only data requires registering on PhysioNet and
      confirming identity under the Registered Access License, then signing the
      Bridge2AI-Voice Registered Access Agreement, which outlines the terms and conditions
      for data use.
    - >-
      Controlled access for raw audio data requires completing the Data Access Request
      Form, completing the Data Use Agreement, submitting the application to the Data
      Access Compliance Office for review, and, upon approval, ensuring a Data Use and
      Transfer Agreement is signed by an authorized official at the recipient institution.
      A memorandum on the ethical justification for controlled access to raw voice data
      samples is published alongside the documentation.
    - >-
      Intellectual property terms reproduced from the agreement: the Data may be protected
      by copyright and other rights; duplication as reasonably required to carry out the
      Research Project is permitted; sale of all or part of the Data on any media is not
      permitted; nothing in the agreement transfers intellectual property rights in or
      relating to the Data; users agree not to make intellectual property claims on the
      Data and not to use intellectual property protection in ways that would prevent or
      block access to, or use of, any element of the Data or conclusions drawn directly
      from it; users may obtain intellectual property rights on downstream discoveries but
      agree to implement licensing policies that will not obstruct further research; and
      users agree to respect the Fort Lauderdale Agreement. There are no fees associated
      with these restrictions.
    - >-
      Under the Data Transfer and Use Agreement, the Data is used solely to conduct the
      named Project and solely by the Recipient Scientist and approved Recipient
      Personnel. Collaborators at other research organizations, and other research teams
      at the same organization, must apply independently for access and sign their own
      agreement. The agreement term ends two years after the start date, upon completion
      of the project, upon expiration of the applicable ethics approval, or on termination
      by the Provider, whichever occurs first, after which the Data must be destroyed in
      accordance with the Provider's instructions and a written certification of
      destruction submitted within thirty days. Recipients must recognize the contribution
      of the Provider as the source of the Data in all public disclosures of research
      using the Data, and are encouraged to make results publicly available in open-access
      journals or pre-print servers where possible. The Data is provided "AS IS" with no
      representations or warranties. Recipients further agree to adhere to the specific
      requirements of PhysioNet.org, managed by the MIT Laboratory for Computational
      Physiology.
    - >-
      Supporting materials carry their own licenses: the Bridge2AI REDCap data dictionary
      and metadata are MIT licensed, the preparation library used to produce the released
      features is Apache-2.0 licensed, and the documentation and dashboard source is MIT
      licensed.
  data_use_permission:
    - general_research_use
    - user_specific
    - institution_specific
    - time_limit
  contact_person: b2ai:person-daco

ip_restrictions:
  name: Third-party intellectual property restrictions
  restrictions:
    - "No IP-based restrictions have been imposed by third parties."
    - >-
      The Data Provider provides no guarantees that the Data is free of third-party
      intellectual property rights, database rights and other related rights.
    - >-
      Nothing in the Data Transfer and Use Agreement operates to transfer to the recipient
      any intellectual property rights in or relating to the Data, and the recipient agrees
      not to use intellectual property protection, database rights or related rights in a
      way that could prevent or limit access to, or use of, any element of the Data or a
      research conclusion derived from it.

regulatory_restrictions:
  name: Export controls and regulatory compliance
  regulatory_restrictions:
    - "No export controls apply to the dataset."
    - >-
      The clinical study is not for a drug product and is not for a medical device, and no
      data monitoring committee was appointed.
  hipaa_compliant: compliant
  other_compliance:
    - >-
      HIPAA de-identification rules are applied to the dataset; direct identifiers are
      removed, dates are rebased and/or replaced by integers, geographic information is
      removed or generalized, and narrative text fields are removed. K-anonymization with
      k greater than or equal to 2 is not achieved.
    - >-
      Identifiable information under HIPAA and the Common Rule, as well as data considered
      sensitive, have been removed from the dataset.
    - >-
      The transferred Data is covered under a Certificate of Confidentiality, which must be
      asserted against compulsory legal demands such as court orders and subpoenas.
    - >-
      Data collection applications are HIPAA-compliant and transmit over secure https to
      HIPAA-compliant storage hosted by NIH STRIDES partners with pre-negotiated NIH
      agreements for data privacy and HIPAA protection.
    - >-
      The Data Transfer and Use Agreement records that the Data is Personally Identifiable
      Information as defined in OMB Memorandum M-07-16 and is not covered under HIPAA,
      FERPA or similar laws requiring additional special terms; the Federal Privacy Act
      checkbox is not selected.
  confidentiality_level: restricted
  governance_committee_contact: b2ai:person-daco

maintainers:
  - name: PhysioNet, MIT Laboratory for Computational Physiology
    description: >-
      Platform hosting the current adult and pediatric releases.
    role: academic_institution
    maintainer_details:
      - >-
        The PhysioNet project pages record that the platform is maintained by the MIT
        Laboratory for Computational Physiology and supported by the National Institute of
        Biomedical Imaging and Bioengineering, the National Heart Lung and Blood Institute
        and the NIH Office of the Director under NIH grant numbers U24EB037545 and
        R01EB030362.
      - >-
        Recipients of transferred data agree to adhere to the specific requirements of
        PhysioNet.org, managed by the MIT Laboratory for Computational Physiology and
        supported by NIBIB under NIH grant number R01EB030362.
  - name: Bridge2AI-Voice consortium and data access committee
    description: >-
      The consortium curates the dataset and operates the access process for raw audio.
    role: academic_institution
    maintainer_details:
      - >-
        The dataset is supported by the NIH via the Bridge2AI project. Bridge2AI-Voice is
        supported by NIH grant OT2OD032720 through the NIH Bridge2AI Common Fund program.
      - >-
        Requests for access to raw audio, and questions about the dataset, are directed to
        the project's Data Access Compliance Office at the address published on the
        PhysioNet project pages (DACO@b2ai-voice.org). The project documentation also
        publishes a general contact address for questions, suggestions or feedback related
        to the dataset, and the corresponding author is listed on the PhysioNet sidebar for
        logged-in users.
      - >-
        The Provider Institution named in the Data Transfer and Use Agreement is the
        University of South Florida Board of Trustees.
  - name: Health Data Nexus, Temerty Centre for AI Research and Education in Medicine
    description: >-
      Historical host of the earlier feature-only release.
    role: academic_institution
    maintainer_details:
      - >-
        The dataset documentation records that the dataset is hosted by the Health Data
        Nexus, a data publishing platform maintained by the Temerty Center for Artificial
        Intelligence Research and Education in Medicine (T-CAIREM) based at the University
        of Toronto. The Health Data Nexus maintains the technical infrastructure hosting
        the dataset and provides continued access to interested researchers. This describes
        the earlier v1.0 feature-only release; the current adult and pediatric releases are
        distributed on PhysioNet.

errata:
  - name: Erratum status
    erratum_details:
      - >-
        There is no erratum. A changelog for each dataset version is published online with
        the dataset metadata.
      - >-
        Release v2.0.1 of the adult dataset consisted of corrections in the authorship
        list, and release v3.1.0 fixed broken parquet files from the previous release.

updates:
  name: Update plan
  description: >-
    Planned and observed release cadence for the dataset.
  frequency: >-
    Semi-annual (twice a year), per the project's stated update plan. The observed
    PhysioNet release history is broadly consistent with this: adult releases in January
    2025, April 2025, August 2025, December 2025 and May 2026, and pediatric releases in
    December 2025 and May 2026.
  update_details:
    - >-
      Further versions of the dataset will be released on a semi-annual basis. These
      updates will be distributed as new versions of the dataset on the hosting platform,
      and users will be notified through news items on the platform as well as through
      standard communication channels.
    - >-
      The dataset is released as static versions rather than being dynamically updated.
    - >-
      Updates to date have added participants (v2.0 added 136, v3.0.0 added 391),
      reorganized files, added new feature families, repaired defective files and
      back-filled validated diagnosis information.

retention_limit:
  name: Data retention
  retention_period: >-
    Indefinite for the shared research dataset; up to 10 years after study completion for
    locally held identifiable data; minimum 5 years for consent documentation.
  retention_details:
    - >-
      Once data is contributed, the data will be retained as long as it is useful for
      research purposes, possibly indefinitely.
    - >-
      Identifiable data and datasheets linking participant numbers to participant
      information are kept in each institution on local cloud storage for a maximum of 10
      years after study completion and are then destroyed; this is the responsibility of
      each local principal investigator.
    - >-
      The USF IRB requires de-identified study data and original consent forms to be stored
      for a minimum of 5 years after the completion of the study, and original paper consent
      documents cannot be destroyed until 5 years after study completion even if uploaded
      into the study records platform.
    - >-
      All entries to the REDCap recruitment screening system are deleted once patients are
      enrolled, or within 90 days of their submission, whichever comes first. Identifiers
      collected under the partial HIPAA waiver are destroyed at the earliest opportunity
      consistent with the conduct of the research.
    - >-
      Under the Data Transfer and Use Agreement, recipients must destroy the Data at the end
      of the agreement term, retaining at most one copy to the extent necessary to comply
      with records retention requirements under law, regulation or institutional policy and
      for research integrity and verification.

version_access:
  name: Version availability across both cohorts
  description: >-
    Version support policy and the full list of releases captured across the adult and
    pediatric PhysioNet projects.
  versions_available:
    - "Adult v1.0 (Health Data Nexus, DOI 10.57764/qb6h-em84)"
    - "Adult v1.1 (PhysioNet, 17 January 2025, DOI 10.13026/249v-w155)"
    - "Adult v2.0.0 (PhysioNet, 16 April 2025)"
    - "Adult v2.0.1 (PhysioNet, 18 August 2025)"
    - "Adult v3.0.0 (PhysioNet, 16 December 2025, DOI 10.13026/k81f-qr68)"
    - >-
      Adult v3.1.0 (PhysioNet, 1 May 2026, DOI 10.13026/8xbn-nq66); latest-version DOI
      10.13026/37yb-1t42
    - "Pediatric v1.0.0 (PhysioNet, 17 December 2025)"
    - >-
      Pediatric v1.1.0 (PhysioNet, 1 May 2026, DOI 10.13026/h995-bt35); latest-version DOI
      10.13026/mf9s-5r03
  version_details:
    - >-
      By default, older versions of the dataset will continue to be supported, hosted and
      made available to researchers. Each version of the dataset has a unique DOI. The
      dataset publishers reserve the right to remove access to older versions.
    - >-
      In practice the PhysioNet page for adult v1.1 records that the files for that version
      are no longer available and directs users to the latest version, while the version
      list for both projects remains published.
    - >-
      The pediatric project is a separate PhysioNet project from the adult project rather
      than a version of it, and the two carry independent version numbering and DOIs.

extension_mechanism:
  name: Contributing to and extending the dataset
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
    - >-
      For dataset extensions and augmentations, others can publish a derivative dataset on
      the hosting platform which references the original source. These derivative datasets
      may be made available under the same conditions as the source data.
    - >-
      For augmentations to the code used to produce the data, the open-source repositories
      have discussion forums and issue pages which allow for public discussion of data
      preprocessing. The repositories also have a pull request mechanism for contributing
      improvements to the data preprocessing code.
    - >-
      Supporting source repositories published by the project include the REDCap data
      dictionary and metadata (MIT), the preparation library used to preprocess raw audio
      waveforms into the parquet files and to merge source data into the phenotype files
      (Apache-2.0), the documentation and dashboard source (MIT), and FHIR profiles for
      voice as a biomarker.

external_resources:
  - name: Self-contained release with supporting open-source tooling
    description: >-
      The dataset itself is recorded as self-contained; the resources listed below are
      supporting code and documentation rather than data dependencies.
    external_resources:
      - >-
        Bridge2AI REDCap data dictionary, metadata and instrument PDFs
        (https://github.com/eipm/bridge2ai-redcap), cited via Zenodo
        (https://zenodo.org/doi/10.5281/zenodo.12760724).
      - >-
        b2aiprep, the preparation library used to preprocess raw audio waveforms into the
        parquet files and to merge source data into the phenotype files
        (https://github.com/sensein/b2aiprep).
      - >-
        SenseLab, used for processing audio files for research tasks
        (https://github.com/sensein/senselab).
      - >-
        Project documentation and dashboard source (https://docs.b2ai-voice.org/ and
        https://github.com/eipm/bridge2ai-docs), cited via Zenodo
        (https://zenodo.org/doi/10.5281/zenodo.13834653).
      - "FHIR profiles for voice as a biomarker, published by the project."
      - >-
        Bridge2AI-Voice adult and pediatric dashboards, and training resources at
        https://www.b2aivoicescholars.org/ .
    future_guarantees:
      - >-
        The dataset documentation answers "NA" to whether there are guarantees that
        external resources will exist and remain constant over time, and "NA" to whether
        official archival versions of the complete dataset including external resources
        exist. It states that the dataset is self-contained.
    restrictions:
      - >-
        The REDCap dictionary repository and the documentation repository are MIT licensed;
        the preparation library is Apache-2.0 licensed. No restrictions on the dataset
        arising from these external resources are reported.

variables:
  - variable_name: participant_id
    name: participant_id
    description: >-
      Unique identifier for the participant, carried in every Parquet feature file and used
      to join feature records to the phenotype tables.
    data_type: identifier
    is_identifier: true
    is_sensitive: false
  - variable_name: session_id
    name: session_id
    description: >-
      Unique identifier for the recording session. Participants may have repeated visits, so
      there may be more than one session per participant.
    data_type: identifier
    is_identifier: true
  - variable_name: task_name
    name: task_name
    description: >-
      The acoustic or speech task performed during the recording, drawn from the protocol
      task inventory (for example Prolonged Vowel, Maximum Phonation Time, Glides, Loudness,
      Diadochokinesis, Rainbow Passage, Caterpillar Passage, CAPE-V Sentences, Free Speech,
      Picture Description, Story Recall, Animal Fluency, Word-Color Stroop, Productive
      Vocabulary, Random Item Generation, Cinderella Story, Respiration, Cough and the
      pediatric task set).
    data_type: categorical
  - variable_name: n_frames
    name: n_frames
    description: >-
      The number of time frames associated with the feature stored in a given Parquet
      record.
    data_type: integer
  - variable_name: spectrogram
    name: spectrogram
    description: >-
      Short-time Fourier transform magnitude representation of the standardized waveform,
      of dimension 201xT in the adult v3.1.0 and pediatric v1.1.0 releases.
    data_type: array
    measurement_technique: >-
      Short-time Fast Fourier Transform with a 25 ms window size, 10 ms hop length and a
      400-point FFT; further downsampled by a factor of two in the time domain after
      derivation.
    derivation: >-
      Derived by torchaudio from raw audio converted to monaural and resampled to 16 kHz
      with a Butterworth anti-aliasing filter.
    is_sensitive: true
    quality_notes:
      - >-
        Spectrograms for sensitive records, audio checks and free-speech prompts have been
        removed from the released feature files.
  - variable_name: mel_spectrogram
    name: mel_spectrogram
    description: Mel-scaled spectrogram of dimension 60xT.
    data_type: array
    measurement_technique: >-
      25 ms window size, 10 ms hop length, 400-point FFT and 60 Mel bins.
    derivation: Derived by torchaudio from the standardized waveform.
  - variable_name: mfcc
    name: mfcc
    description: Mel-frequency cepstral coefficients of dimension 60xT.
    data_type: array
    measurement_technique: >-
      Sixty coefficients computed with the same parameters as the Mel spectrograms.
    derivation: Derived by torchaudio from the spectrograms.
  - variable_name: pitch
    name: pitch
    description: >-
      Detected fundamental frequency over time, of dimension T. The torchaudio pitch track
      is bounded by a minimum and maximum pitch of 80 and 500; the sparc pitch estimate uses
      a different algorithm with a range of 50-550 Hz.
    data_type: array
    minimum_value: 50.0
    maximum_value: 550.0
    measurement_technique: >-
      Two independent estimators are released: a torchaudio pitch detector and a sparc-based
      F0 estimator computed at 50 Hz.
  - variable_name: ema
    name: ema
    description: >-
      Estimated electromagnetic articulography of dimension Tx12, where the 12 channels
      correspond to X/Y positions of six articulators: tongue dorsum, tongue body, tongue
      tip, lower incisor, upper lip and lower lip.
    data_type: array
    measurement_technique: >-
      Estimated with a deep learning model from the Speech Articulatory Coding (sparc)
      package, gathered at 50 Hz.
  - variable_name: loudness
    name: loudness
    description: >-
      Estimated loudness based on the average absolute amplitude of the audio waveform, of
      size T.
    data_type: array
    measurement_technique: Computed by sparc using 20 ms windows.
  - variable_name: periodicity
    name: periodicity
    description: >-
      Estimated periodicity, the confidence of pitch presence, derived from the audio, of
      dimension T.
    data_type: array
    measurement_technique: Computed by sparc using 20 ms windows.
  - variable_name: ppg
    name: ppg
    description: >-
      Phonetic posteriorgram probabilities across 40 phoneme categories, giving a dimension
      of 40xT.
    data_type: array
    measurement_technique: >-
      Generated via the ppgs package with a frame rate of 100 Hz.

is_deidentified:
  name: De-identification of the released dataset
  description: >-
    Level of de-identification for this dataset: identifiable information under HIPAA and
    the Common Rule, as well as data considered sensitive, have been removed.
  identifiable_elements_present: false
  method: >-
    Removal of HIPAA Safe Harbor identifiers and of direct and high-risk indirect
    identifiers, removal of sensitive fields flagged in the REDCap data dictionary, date
    rebasing, geographic generalization, removal of narrative text fields, and removal of
    all raw voice data from the released feature datasets.
  identifiers_removed:
    - Names
    - Civic addresses and geographic locators; state and province removed, country retained
    - Social security numbers
    - >-
      Date information at a resolution finer than years; dates are rebased and/or replaced
      by integers
    - Phone and fax numbers, email addresses and IP addresses
    - >-
      Medical record numbers, health plan beneficiary numbers, device identifiers, license
      numbers, account numbers and vehicle identifiers
    - Website URLs, full face photos, biometric identifiers and any unique identifiers
    - >-
      Select geographic or demographic indirect identifiers, and some information about
      household composition or cultural identity
    - >-
      Non-identifying but highly sensitive elements such as household income, mental health
      status and traumatic life experiences
    - Narrative text fields
    - All raw voice data and transcripts of free speech audio
  deidentification_details:
    - "Does this dataset remove direct identifiers? Yes."
    - "Does this dataset apply the HIPAA de-identification rules? Yes."
    - "Does this dataset rebase and/or replace dates by integers? Yes."
    - "Does this dataset remove or generalize geographic information? Yes."
    - "Does this dataset remove narrative text fields? Yes."
    - "Does this dataset achieve K-anonymization (k>=2)? No."
    - >-
      Pre-processing for de-identification was performed: the data were extracted from the
      raw audio to limit re-identification, and only the extracted features are released
      with the dataset.
    - >-
      Raw audio transcripts were reviewed and any audio recordings that contained
      potentially identifying information or external voices were removed from the release.
      For the pediatric v1.1 release, audio features for all free speech tasks were manually
      checked for the presence of unconsented speakers and personally identifiable
      information.
