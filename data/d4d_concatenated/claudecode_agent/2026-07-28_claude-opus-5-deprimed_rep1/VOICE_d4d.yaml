  - id: https://physionet.org/content/b2ai-voice-pediatric/
    name: Bridge2AI-Voice Pediatric Dataset
    title: Bridge2AI-Voice Pediatric Dataset
    description: >-
      Pediatric Bridge2AI-Voice release distributed on PhysioNet as a separate
      project from the adult dataset. The current release, v1.1.0 (published 1 May
      2026), contains derived audio features for 23,533 recordings collected from 300
      participants aged 2-18. Patients and healthy volunteers at the Hospital for
      Sick Children were considered for enrollment; eligibility required an age of 2
      to 18 years and English proficiency, and participants over 18 years of age and
      individuals who were non-verbal were excluded. Non-patients were recruited
      through research postings. All data were collected through customized software
      (reproschema-ui) on tablets, with a headset used for most participants and the
      built-in tablet microphone used for the remainder because of low tolerance of
      wearing headphones or existing complex medical conditions. All participants
      completed recording and demographic collection in one session; where a
      participant lacked adequate comprehension or familiarity with their past
      medical history, a parent or decision-maker completed the survey on a separate
      tablet during the recording. The release contains data considered low risk,
      including derivations such as spectrograms but not the original voice
      recordings, together with detailed demographic, clinical and validated
      questionnaire data. Access is credentialed: only credentialed users who sign
      the data use agreement can access the files; no training is required.
