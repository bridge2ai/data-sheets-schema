purposes:
  - name: Integrate voice as a biomarker of health into clinical care
    description: Primary programmatic purpose stated by the project.
    response: >-
      Bridge2AI-Voice seeks to create a flagship, standardized and ethically sourced
      dataset of voices linked to health information to fuel research and discovery
      in voice biomarkers. The group aims to promote integration of voice as a
      biomarker of health in clinical care by generating a large multi-institutional,
      ethically sourced and diverse voice dataset linked to multimodal health
      biomarkers to fuel voice AI research and build predictive models to assist in
      screening, diagnosis and treatment of a broad range of diseases. The
      documentation states a target of a flagship dataset of 10,000 voices; the NIH
      RePORTER record and the audiomics white paper describe a primary deliverable of
      a publicly available database of 30,000 human voices, and the IRB protocol
      records an anticipated enrollment of 30,000 participants overall with an
      anticipated study enrollment count of 10,000 by 2027.
  - name: Create a large, well-documented resource for clinical machine learning
    description: >-
      Purpose recorded in the project's own datasheet-style documentation of the
      released dataset.
    response: >-
      The Bridge2AI Voice dataset was created to address a gap in the availability of
      large-scale, diverse and well-documented voice data for use in clinical
      machine-learning applications. Previous studies on machine learning-based voice
      diagnosis produced promising results, but their sample sizes were too small or
      they lacked the key metadata needed for training robust, clinically useful
      models. The dataset aims to bridge this gap by providing an ethically sourced,
      large and diverse dataset to develop, benchmark or validate clinically
      applicable AI/ML models. The goal is to facilitate the use of voice as a
      non-invasive, cost-effective biomarker for the screening, diagnosis and
      monitoring of a wide range of health conditions.
  - name: Establish standards, infrastructure and governance for audiomics
    description: >-
      Non-data-generation objectives of the project that shape how the dataset was
      built.
    response: >-
      Beyond data acquisition, the project's specific aims are to introduce the field
      of acoustic biomarkers by developing new standards of acoustic and voice data
      collection and analysis for voice AI research; to develop software and cloud
      infrastructure for automated voice data collection through a smartphone
      application, including integrated acoustic amplifiers and acoustic quality
      standardization, and to implement federated learning technology allowing
      analysis of multi-institutional data while minimizing data sharing; to
      integrate existing scholarship, tools and guidance with new standards and
      normative insight on ethical and trustworthy issues arising from voice data
      generation through clinical adoption, and to develop new guidelines for
      consenting to voice data collection, sharing and utilization; to build bridges
      between medical voice research, acoustic engineering and the AI/ML world; and
      to develop curriculum and community for voice AI researchers, especially those
      from underserved communities.
  - name: Support pediatric voice and speech research
    description: Purpose specific to the pediatric release.
    response: >-
      Establishing a robust multi-institutional dataset that integrates pediatric
      voice data with demographic information would advance the understanding of
      voice and disease as well as early detection and intervention. The pediatric
      resource is intended to enable study of developmental norms, create AI-driven
      tools for early screening and support clinical insight.

tasks:
  - name: Development, benchmarking and validation of clinical voice AI models
    description: Primary task the released dataset is designed for.
    response: >-
      The Bridge2AI Voice dataset aims to enable the development, benchmarking or
      validation of clinically applicable machine-learning models for diagnosing a
      wide range of health conditions using voice data, including vocal pathologies
      and neurological, psychiatric, respiratory and pediatric voice disorders. The
      dataset can be used for AI model pretraining, fine-tuning, benchmarking or
      validation.
  - name: Predefined disease detection and classification tasks with diagnostic labels
    description: >-
      Tasks and labels shipped with the release, and the absence of recommended
      splits.
    response: >-
      The current version of the dataset comes with predefined tasks and labeling.
      The tasks are primarily designed for training machine-learning models for
      disease detection and classification using voice data. Labels include diagnostic
      categories such as vocal pathologies, neurological disorders, psychiatric
      conditions and respiratory disorders. There are no predefined recommended data
      splits for training, validation or testing; researchers are encouraged to create
      their own data splits based on their specific requirements.

addressing_gaps:
  - name: Absence of large, diverse, standards-based voice datasets
    description: The core gap motivating the data generation project.
    response: >-
      To unlock the full potential of voice as a tool there is a crucial need for
      large datasets that capture diverse populations and disease statuses along with
      other established physiologic biomarkers. Current literature on this topic has
      only been studied on small- to medium-sized datasets with limited data outside
      of acoustic measures and not linked to multi-modal health data, and comparing
      studies and pooling data is challenging because of a lack of existing standards
      in how voice and other acoustics are measured and collected. Within industry,
      datasets are often private, limiting the ability to audit ML models and the
      accuracy of training data labels, and although industry has access to vast
      amounts of voice data from users it lacks access to accurate clinical data or
      demographic information.
  - name: Lack of validated, externally evaluated voice AI algorithms
    description: Gap in evidence quality that a large public dataset is meant to close.
    response: >-
      There is a lack of prospective study and validation of AI algorithms in
      audiomics on external datasets. These factors, compounded by the limited size,
      quality and diversity of existing open-source datasets, likely explain the lack
      of validated and US Food and Drug Administration-approved AI algorithms for
      disease detection and monitoring in this space. When ML applications for
      screening and diagnosis of laryngeal cancer were considered, most studies
      reported training datasets of fewer than 300 patients, and only two studies used
      more than one data modality to train their models.
  - name: Scarcity of pediatric voice and speech data
    description: Gap specific to the pediatric cohort.
    response: >-
      Despite the clinical importance of detecting pediatric communication disorders
      such as autism spectrum disorder and speech delays, the availability of
      large-scale pediatric databases remains limited. Data collection in pediatric
      populations poses unique challenges such as privacy issues, consent processes
      and the need for developmentally appropriate tasks. Pediatric and adult
      voice/speech production are fundamentally different because the respiratory
      system and larynx undergo rapid functional maturation throughout childhood, so
      normative data available in adults cannot be generalized to pediatric
      populations.

