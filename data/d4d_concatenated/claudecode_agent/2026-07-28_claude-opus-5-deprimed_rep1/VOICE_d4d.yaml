id: https://b2ai-voice.org/
name: Bridge2AI-Voice
title: >-
  Bridge2AI-Voice: an ethically sourced, diverse voice dataset linked to health
  information
description: >-
  Bridge2AI-Voice (B2AI-Voice) is a large, ethically sourced and demographically
  diverse collection of voice, speech and respiratory-sound data linked to health
  information, generated by the Bridge2AI-Voice consortium under the NIH Common
  Fund Bridge2AI program (award OT2OD032720). Data are collected prospectively at
  academic clinical sites in North America using a purpose-built data acquisition
  application (the Bridge2AI-Voice app for adults; reproschema-ui for pediatric
  participants) that administers standardized acoustic tasks, detailed demographic
  and confounder surveys, and validated disease-specific questionnaires, together
  with clinician-confirmed "gold standard" diagnostic validation drawn from
  electronic health records and clinical work-up. Acquisition is organized around
  five disease cohort categories for which voice change has been associated with
  specific conditions - voice disorders, neurological and neurodegenerative
  disorders, mood and psychiatric disorders, respiratory disorders, and pediatric
  voice and speech disorders - plus a control cohort. Two distinct releases are
  distributed on PhysioNet and are documented here as separate resources because
  they are separate cohorts collected under separate protocols: the adult
  Bridge2AI-Voice dataset (current release v3.1.0, 833 participants across five
  North American sites) and the Bridge2AI-Voice Pediatric Dataset (current release
  v1.1.0, 300 participants aged 2-18 recruited at the Hospital for Sick Children).
  The published PhysioNet releases contain derived, lower-risk representations of
  the audio - spectrograms, Mel spectrograms, MFCCs, pitch, articulatory and
  phonetic-posteriorgram features and static acoustic features - together with
  phenotype tables, rather than the original waveforms. Raw audio is disseminated
  separately under a controlled access mechanism via Synapse to protect participant
  privacy. The stated purpose of the resource is to supply an ethically sourced,
  large and diverse dataset for developing, benchmarking and validating clinically
  applicable AI/ML models that use voice as a non-invasive, low-cost biomarker for
  screening, diagnosis and monitoring of health conditions.
keywords:
  - health
  - biomarkers
  - bridge2ai
  - voice
  - pediatric
