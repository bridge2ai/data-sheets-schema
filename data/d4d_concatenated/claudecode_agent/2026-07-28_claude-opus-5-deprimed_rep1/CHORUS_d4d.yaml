known_limitations:
  - id: chorus_limitation_modality_coverage
    name: Incomplete coverage of imaging and EEG modalities
    limitation_type: coverage_limitation
    limitation_description: >-
      As of August 2025, imaging was limited to 1,000 available images with
      de-identification in process for a larger cohort, and EEG extraction was
      still in process. Modality coverage is therefore uneven relative to the
      structured OMOP data.
    scope_impact: >-
      Analyses that depend on imaging or EEG will draw on substantially smaller
      populations than analyses of structured EHR data.
    recommended_mitigation: >-
      Confirm current per-modality availability with the CHoRUS team before
      designing analyses that depend on imaging or EEG.
  - id: chorus_limitation_notes_locality
    name: Clinical notes are not centrally held
    limitation_type: integration_limitation
    limitation_description: >-
      OMOP and telemetry data are held in the enclave, but clinical notes are
      stored locally at contributing sites, with only tokens available centrally.
    scope_impact: >-
      Analyses requiring full narrative note text cannot be performed on the
      centrally held data alone.
    recommended_mitigation: >-
      Design note-based analyses around the tokenized representation produced with
      the OHNLP toolkit.
  - id: chorus_limitation_retrospective
    name: Retrospective collection
    limitation_type: temporal_limitation
    limitation_description: >-
      The CHoRUS dataset is assembled through retrospective data collection from
      hospital systems rather than prospective enrollment, so the data reflect care
      as documented at the time it was delivered.
    scope_impact: >-
      Variables not routinely captured in clinical documentation are unlikely to be
      present, and documentation practices vary across contributing hospitals.
  - id: chorus_limitation_in_progress
    name: Dataset is still under construction
    limitation_type: scope_limitation
    limitation_description: >-
      The released dataset is an interim state of an ongoing data generation
      project whose anticipated final dataset is 100,000 patient admissions across
      9 data modalities from 14 data contributing hospitals. Reported figures
      differ by source and capture date.
    scope_impact: >-
      Counts, modality coverage, and access arrangements can be expected to change
      over the life of the project.

confidential_elements:
  - id: chorus_confidentiality_patient_data
    name: Patient clinical data
    confidential_elements_present: true
    confidentiality_details:
      - >-
        The dataset consists of patient clinical data drawn from hospital
        electronic health records, imaging archives, and physiological monitoring
        systems. Every listed data modality is under controlled access.
      - >-
        Clinical notes are stored locally at contributing sites rather than in the
        shared enclave; only tokens derived from those notes are held centrally.
      - >-
        Community-facing ethics focus groups are conducted to determine what data
        is appropriate for public sharing.

subpopulations:
  - id: chorus_subpopulation_care_settings
    name: Critical care settings
    subpopulation_elements_present: true
    identification:
      - >-
        Patients are identified by critical care setting: the current released
        dataset covers admissions from intensive care units (ICU), pediatric
        intensive care units (PICU), and neonatal intensive care units (NICU).
      - >-
        Data elements are intended to feature appropriate contextual factors such
        as geographic distance to the nearest hospital, and social determinants of
        health are among the data types acquired.
    distribution:
      - >-
        The current released dataset comprises 50,000 patient admissions from ICU,
        PICU, and NICU; the source does not break the total down by unit type.
      - >-
        As of August 2025, the dataset spanned 14 different hospitals with over
        45,000 unique admissions.

sensitive_elements:
  - id: chorus_sensitive_elements
    name: Sensitive clinical and social data elements
    sensitive_elements_present: true
    sensitivity_details:
      - >-
        The dataset contains patient demographics, diagnoses, procedures,
        medication administration, nursing flowsheets, clinical notes, imaging,
        telemetry and EEG waveforms, and social determinants of health, all
        pertaining to identifiable clinical encounters at the point of collection.
      - >-
        Contextual geographic factors such as distance to the nearest hospital are
        included as data elements.
      - >-
        Data are transformed using approaches that limit re-identification, and
        unstructured EHR content is tokenized before it is shared.

