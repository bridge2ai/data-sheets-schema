    name: Data contributing sites and site managers
    role: Data site manager at a data contributing hospital
    collector_details:
      - >-
        Data are contributed by 14 Data Acquisition centers within a collaboration
        spanning 20 academic centers.
      - >-
        Data managers at data contributing sites follow the Chorus_SOP workflow to
        extract and contribute clinical data, and report status through GitHub or a
        Google Form.
      - >-
        Sub-teams within the CHoRUS data generation project cover Standards, Data
        Acquisition, and Tooling.
  - id: chorus_data_collectors_clinical_collaborators
    name: Clinical collaborators
    role: Clinical domain expert contributing to semantic mapping and validation
    collector_details:
      - >-
        Clinical expertise is applied to semantic mapping and validation within
        CHoRUS through a mapping repository containing documentation and pooled
        tabular mappings, together with an associated clinical validation SOP.

collection_timeframes:
  - id: chorus_collection_timeframe
    name: Project period and retrospective collection scope
    timeframe_details:
      - >-
        The NIH project period runs from 2022-09-01 to 2026-11-30.
      - >-
        Collection is retrospective, so the period over which data were assembled
        does not match the period over which the underlying clinical data were
        created; the underlying records were generated during the patients'
        hospital encounters.
      - >-
        As of August 2025, the dataset covered 14 different hospitals with over
        45,000 unique admissions.

direct_collection:
  - id: chorus_direct_collection
    name: Indirect collection from hospital systems
    is_direct: false
    collection_details:
      - >-
        Data are obtained retrospectively from the electronic health record,
        imaging, and physiological monitoring systems of contributing hospitals
        rather than collected directly from the individuals in question.

raw_data_sources:
  - id: chorus_raw_source_ehr
    name: Hospital electronic health record systems
    source_description: >-
      Structured electronic health record data from contributing hospitals,
      including demographics, diagnoses and procedures documented by providers,
      medication administration time-stamped upon each infusion change or dose
      administration, and high-frequency nursing flowsheet documentation.
    source_type:
      - Hospital electronic health record system
    raw_data_format:
      - Site-native EHR export, standardized to the OMOP Common Data Model
    access_details: >-
      Raw site extracts are prepared and uploaded by data contributing sites under
      the CHoRUS standard operating protocols; the harmonized data are held under
      controlled access.
  - id: chorus_raw_source_notes
    name: Unstructured clinical notes
    source_description: >-
      Free-text clinical notes from contributing hospitals, extracted and tokenized
      using the OHNLP toolkit.
    source_type:
      - Hospital electronic health record system
    raw_data_format:
      - Free text
    access_details: >-
      Clinical notes are stored locally at the contributing sites; only tokens
      derived from them are held in the shared enclave.
  - id: chorus_raw_source_imaging
    name: Hospital picture archiving and communication systems (PACS)
    source_description: >-
      Clinical imaging drawn from the PACS of contributing hospitals.
    source_type:
      - Picture archiving and communication system
    raw_data_format:
      - DICOM
    access_details: >-
      Controlled access. As of August 2025, 1,000 images were available, with
      de-identification in process for a larger cohort.
  - id: chorus_raw_source_telemetry
    name: Bedside monitor telemetry
    source_description: >-
      Physiological waveform telemetry captured from bedside monitors through
      gateway/middleware systems.
    source_type:
      - Bedside physiological monitor
      - Gateway/middleware system
    raw_data_format:
      - WFDB
    access_details: Controlled access.
  - id: chorus_raw_source_eeg
    name: Hospital EEG databases
    source_description: >-
      Electroencephalography waveforms drawn from the EEG databases of contributing
      hospitals.
    source_type:
      - Hospital EEG database
    raw_data_format:
      - EDF+
      - Persyst
    access_details: >-
      Controlled access. As of August 2025, EEG extraction was in process.

ethical_reviews:
  - id: chorus_ethical_review_program
    name: CHoRUS ethics pillar and community engagement
    review_details:
      - >-
        Ethics is one of the three pillars of the CHoRUS data generation project,
        alongside Data and People, and is described as Ethical and Trustworthy AI.
      - >-
        The project performs community-facing ethics focus groups to determine what
        data is appropriate for public sharing.
      - >-
        The CHoRUS consortium evaluates community perspectives on clinical care AI
        to find ways to increase trustworthiness of provenance and privacy in AI,
        and new approaches are being created as the existing legal and regulatory
        landscape is analyzed.
      - >-
        The project establishes a legal framework for collecting data at scale, and
        patient-focused efforts determine the ethical and legal approaches used to
        manage privacy and bias while accounting for social determinants of health.

human_subject_research:
  id: chorus_human_subject_research
  name: Human subjects scope of the CHoRUS dataset
  involves_human_subjects: true
  special_populations:
    - >-
      The current released dataset includes admissions from pediatric intensive
      care units (PICU) and neonatal intensive care units (NICU), so pediatric and
      neonatal patients are represented among the data subjects.
  description: >-
    The dataset consists of clinical data from critically ill patients; the project
    targets an AI-ready data set drawn from more than 100,000 critically ill
    patients.

at_risk_populations:
  id: chorus_at_risk_populations
  name: At-risk populations represented in the dataset
  at_risk_groups_included: true
  description: >-
    The current released dataset covers admissions from pediatric and neonatal
    intensive care units in addition to adult intensive care, so children and
    neonates are among the represented populations.

participant_privacy:
  - id: chorus_participant_privacy
    name: Privacy protections applied to CHoRUS data
    anonymization_method:
      - >-
        Data are transformed using approaches that limit re-identification.
      - >-
        Unstructured electronic health record content is tokenized rather than
        shared as narrative text.
      - >-
        De-identification of imaging was in process as of August 2025 to enable
        release of a larger imaging cohort.
    privacy_techniques:
      - Tokenization of unstructured EHR content using the OHNLP toolkit
      - Controlled-access cloud enclave with per-user provisioning
      - Local retention of clinical notes at contributing sites
      - Automated privacy scanning of medical records
    reidentification_risk:
      - >-
        The project explicitly transforms data using approaches that limit
        re-identification, and patient-focused efforts determine the ethical and
        legal approaches used to manage privacy.
    used_software:
      - id: privacy_scan_tool
        name: privacy_scan_tool
        description: A privacy scan tool for medical records.
      - id: CTP-deid
        name: CTP-deid

preprocessing_strategies:
  - id: chorus_preprocessing_omop_standardization
    name: Standardization to the OMOP Common Data Model
    preprocessing_details:
      - >-
        Site data are standardized to the OMOP Common Data Model, and unified
        standards harmonize multi-modal EHR, waveform, imaging, and text data.
      - >-
        Validated semantic mappings connect clinical data in various source formats
        to international standards; mappings are maintained as documentation and
        pooled tabular mappings with an associated clinical validation SOP.
    used_software:
      - id: chorus-mapping
        name: chorus-mapping
        description: >-
          Repository with documentation and pooled tabular mappings, together with
          an associated clinical validation SOP, for contributing to CHoRUS
          semantic mapping efforts.
  - id: chorus_preprocessing_tokenization
    name: Tokenization of unstructured EHR content
    preprocessing_details:
      - >-
        Unstructured electronic health record data are tokenized, and clinical
        notes are extracted and tokenized using the OHNLP toolkit before being
        represented in the shared dataset.
  - id: chorus_preprocessing_waveform_conversion
    name: Waveform conversion and release preparation
    preprocessing_details:
      - >-
        Waveform data are converted using CHoRUS waveform conversion scripts, with
        accompanying documentation and resources supporting the preparation and
        release of waveforms.
    used_software:
      - id: chorus_waveform
        name: chorus_waveform
        description: >-
          CHoRUS waveform documentation and various waveform conversion scripts.
        license: MIT
  - id: chorus_preprocessing_geocoding
    name: Geocoding of location entities for contextual factors
    preprocessing_details:
      - >-
        OMOP Location entities are geocoded so that data elements can feature
        appropriate contextual factors such as geographic distance to the nearest
        hospital and social determinants of health.
    used_software:
      - id: UF-Geocoding
        name: UF-Geocoding
        description: >-
          Open source code to geocode OMOP Location entities via DeGauss, forked
          from bihorac-LAB/Exposome.
        license: MIT
  - id: chorus_preprocessing_reidentification_limiting
    name: Transformations that limit re-identification
    preprocessing_details:
      - >-
        Data are transformed using approaches that limit re-identification before
        they are made available through the enclave.

cleaning_strategies:
  - id: chorus_cleaning_site_characterization
    name: Site data characterization and SOP-based curation
    cleaning_details:
      - >-
        Characterization reports are produced and returned to sites following their
        data submissions.
      - >-
        Standard operating protocols instruct data contributing sites on best
        practices for curating and delivering interoperable datasets, and those SOP
        documents have undergone an internal validation and review process.
      - >-
        Status tracking of data contributing sites is used to identify and resolve
        blocking issues in the creation and curation of site data extracts.
    used_software:
      - id: CHoRUSReports
        name: CHoRUSReports
        description: >-
          Repository dedicated to producing characterization reports to return to
          sites following their data submissions.

labeling_strategies:
  - id: chorus_labeling_annotation_environment
    name: Visualization and annotation environment
    data_annotation_platform:
      - CHoRUS visualization and annotation environment
    data_annotation_protocol:
      - >-
        A visualization and annotation environment labels data with targets
        important for prediction.
    labeling_details:
      - >-
        The project develops capabilities across a multi-center network to acquire,
        standardize, tokenize, store, visualize, and label data.

machine_annotation_tools:
  - id: chorus_machine_annotation_ohnlp
    name: OHNLP toolkit
    tools:
      - OHNLP toolkit unknown
    tool_descriptions:
      - >-
        The OHNLP toolkit is used to extract and tokenize unstructured clinical
        notes; the corresponding published metadata schema is the OHNLP open source
        schema.

raw_sources:
  - id: chorus_raw_data_availability
    name: Availability of raw source data
    raw_data_details:
      - >-
        Raw clinical notes are retained locally at the contributing sites; only
        tokens derived from them are held in the shared enclave.
      - >-
        OMOP and telemetry data are held in the enclave under controlled access.
      - >-
        Raw site extracts are created and uploaded by contributing sites under the
        CHoRUS standard operating protocols and are not distributed as raw site
        exports.

existing_uses:
  - id: chorus_existing_uses
    name: Known uses of the CHoRUS dataset
    examples:
      - >-
        The datasets are being used for training activities and publications.
      - >-
        The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to
        Bridge2AI CHoRUS data through engagement, AI training, and mentorship, and
        equips trainees to apply AI/ML methods to big data analysis using
        multi-modal datasets.
      - >-
        Trainees conduct collaborative research on the Bridge2AI AI/ML for Clinical
        Care Collaborative Cloud platform, develop practical use cases, and prepare
        posters, conference abstracts, or manuscripts.

future_use_impacts:
  - id: chorus_future_use_impacts
    name: Privacy, bias, and accountability considerations for future use
    impact_details:
      - >-
        The dataset is high-resolution multi-modal clinical data from critically
        ill patients, and the project transforms data using approaches that limit
        re-identification precisely because the underlying content would otherwise
        carry re-identification risk.
      - >-
        Patient-focused efforts determine the ethical and legal approaches used to
        manage privacy and bias while accounting for social determinants of health.
      - >-
        The project's stated intent is that its methods promote privacy,
        accountability, and clinical benefit, and community-facing ethics focus
        groups determine what data is appropriate for public sharing.
      - >-
        The project website carried a notice that the repository is under review
        for potential modification in compliance with Administration directives,
        which bears on the future availability of the described resources.

intended_uses:
  - id: chorus_intended_uses
    name: Intended uses of the CHoRUS dataset
    examples:
      - >-
        Building machine-learning and artificial-intelligence-derived models to
        improve the care and outcomes of patients requiring critical care.
      - >-
        Characterizing acute and critical care illness, predicting complications,
        and measuring treatment response among patients with acute or critical
        illness.
      - >-
        External validation of AI models against the sequestered holdout test set,
        to aid marketplace adoption of AI-developed models for implementation in
        acute and critical care.
      - >-
        Hands-on AI/ML training and education, including work with structured EHR
        datasets, clinical deep learning, the OHDSI/OMOP common data model, and the
        ethics of clinical AI.
    use_category:
      - research
      - clinical
      - educational
    usage_notes: >-
      Access is controlled. Users register with name, email, and institution, must
      sign a licensing agreement included in the registration form before gaining
      access, and need a ".edu" email address to gain access to the dataset;
      program administrators assist with this access where needed.

distribution_formats:
  - id: chorus_distribution_enclave
    name: Controlled-access cloud enclave
    description: >-
      OMOP and telemetry data are held in a controlled-access enclave, with the
      exception that clinical notes are stored locally at contributing sites and
      only tokens are held centrally. Users work with the data on the Bridge2AI
      AI/ML for Clinical Care Collaborative Cloud platform, for which compute is
      provisioned per user after access is granted. CHoRUS services supporting the
      enclave are deployed as dockerized container applications on Azure.
  - id: chorus_distribution_standards
    name: Standards-based data representations
    description: >-
      The dataset is made available in established clinical data standards: the
      OMOP Common Data Model for structured EHR modalities, the OHNLP open source
      schema for tokenized clinical notes, DICOM for imaging, WFDB for waveform
      telemetry with a published metadata schema based on the PhysioNet schema
      extended, and EDF+ and Persyst for EEG waveforms. The project's data type
      summary also records a published metadata schema of the OMOP schema with
      extensions among the OMOP-standardized modalities; the extracted table does
      not allow that entry to be assigned to a single modality.

third_party_sharing:
  - id: chorus_third_party_sharing
    name: Sharing beyond the contributing institutions
    is_shared: true
    description: >-
      The project's overarching goal is a publicly available, AI-ready critical
      care dataset, and the holdout test set is made accessible for external model
      validation. Access is granted to individuals outside the contributing
      institutions, for example to trainees in the AIM-AHEAD Bridge2AI for Clinical
      Care Training Program, subject to registration and a signed licensing
      agreement.

license_and_use_terms:
  id: chorus_license_and_use_terms
  name: CHoRUS access and licensing terms
  license_terms:
    - >-
      All modalities of the CHoRUS dataset are under controlled access.
    - >-
      Users complete a registration form with name, email, and institution; all
      participants must sign a licensing agreement included in the registration
      form before gaining access to the dataset. Once access is granted and compute
      is provisioned, an email is sent.
    - >-
      A ".edu" email address is required in order to gain access to the dataset.
      This requirement is stated not to be a barrier to acceptance into the
      associated training program, and program administrators will assist with
      access where needed.
    - >-
      Access requests are directed to dbold@emory.edu or
      jared.houghtaling@tuftsmedicine.org.
    - >-
      The CHoRUS GitHub organization states that the project is licensed under the
      MIT License; individual repositories in the organization carry MIT or
      Apache-2.0 licenses. These terms cover the CHoRUS software and documentation,
      not the clinical dataset itself.
  contact_person: Jared Houghtaling

regulatory_restrictions:
  id: chorus_regulatory_restrictions
  name: Access classification of the CHoRUS dataset
  confidentiality_level: restricted
  description: >-
    Every data modality listed by the project is under controlled access, held in a
    cloud enclave, and released only to registered users who have signed a
    licensing agreement, so the dataset is restricted rather than open.

maintainers:
  - id: chorus_maintainer_consortium
    name: CHoRUS consortium
    role: academic_institution
    maintainer_details:
      - >-
        The CHoRUS data generation project is led from Massachusetts General
        Hospital, the grantee organization of record for NIH project
        1OT2OD032701-01, within a consortium of more than 60 members across 20
        different institutions.
      - >-
        The project website lists Ciera McCrary, MGH, Program Manager, as the
        contact, at the address cmccrary@mgh.havard.edu as printed on the site.
      - >-
        The CHoRUS GitHub organization directs access requests to dbold@emory.edu
        or jared.houghtaling@tuftsmedicine.org.
      - >-
        Package versions, maintainers, and other metadata about CHoRUS software
        packages are published on a package status page.

updates:
  id: chorus_update_plan
  name: Planned growth of the CHoRUS dataset
  update_details:
    - >-
      The anticipated final dataset is 100,000 patient admissions spanning 9
      different data modalities from 14 data contributing hospitals; the NIH project
      abstract describes acquiring an AI-ready data set from more than 100,000
      critically ill patients.
    - >-
      De-identification of imaging was in process as of August 2025 to enable
      release of a larger imaging cohort, and EEG extraction was in process at that
      time.
    - >-
      Published metadata schemas are established for several modalities and planned
      for others, per the project's data type summary.
    - >-
      At capture, the project website carried the notice that the repository is
      under review for potential modification in compliance with Administration
      directives.

extension_mechanism:
  id: chorus_extension_mechanism
  name: Contributing to CHoRUS
  contribution_url: https://github.com/chorus-ai
  extension_details:
    - >-
      Clinical collaborators can contribute to semantic mapping and validation
      through the CHoRUS mapping repository, which holds documentation and pooled
      tabular mappings together with an associated clinical validation SOP.
    - >-
      Data site managers contribute data extracts by following the interactive
      Chorus_SOP workflow, and raise problems in the Standards Discussions and Data
      Acquisition Discussions areas.
    - >-
      Data contributing sites submit regular status updates through the GitHub
      interface or a Google Form, which are routed into the Standards Project or
      the Data Acquisition Project by an automated script calling the GitHub API.
    - >-
      Software contributors are supported by a web guide compiling documentation for
      both contributors to and users of the CHoRUS software packages.
    - >-
      Those interested in downstream analytics on the mapped and assembled dataset
      are invited to reach out using the published contact details.

is_deidentified:
  id: chorus_deidentification
  name: De-identification of CHoRUS data
  method: >-
    Transformation approaches that limit re-identification, combined with
    tokenization of unstructured EHR content and de-identification of imaging.
  deidentification_details:
    - >-
      The project acquires data, standardizes it to the OMOP Common Data Model, and
      transforms it using approaches that limit re-identification.
    - >-
      Unstructured electronic health record data are tokenized; clinical notes are
      extracted and tokenized with the OHNLP toolkit and the notes themselves remain
      stored locally at contributing sites.
    - >-
      As of August 2025, de-identification of imaging was in process to permit
      release of a larger imaging cohort.
    - >-
      Despite these measures, all modalities remain under controlled access rather
      than being released openly.
