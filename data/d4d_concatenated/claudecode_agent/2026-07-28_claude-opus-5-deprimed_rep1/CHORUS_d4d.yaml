resources:
  - id: chorus_modality_demographics
    name: Demographics
    description: >-
      Patient demographic data. Access is controlled. The published metadata schema
      for the OMOP-standardized modalities is the OMOP schema.
    conforms_to: OMOP Common Data Model
  - id: chorus_modality_medication_administration
    name: Medication administration
    description: >-
      Medication administration records, with dosing time-stamped upon each
      infusion change or dose administration. Access is controlled. The published
      metadata schema for the OMOP-standardized modalities is the OMOP schema.
    conforms_to: OMOP Common Data Model
  - id: chorus_modality_procedures
    name: Procedures
    description: >-
      Procedure records as documented by providers. Access is controlled. The
      published metadata schema for the OMOP-standardized modalities is the OMOP
      schema.
    conforms_to: OMOP Common Data Model
  - id: chorus_modality_nursing_flowsheets
    name: Nursing flowsheets
    description: >-
      High-frequency nursing flowsheet documentation. Access is controlled. The
      published metadata schema for the OMOP-standardized modalities is the OMOP
      schema.
    conforms_to: OMOP Common Data Model
  - id: chorus_modality_diagnoses
    name: Diagnoses
    description: >-
      Diagnosis records as documented by providers. Access is controlled. The
      published metadata schema for the OMOP-standardized modalities is the OMOP
      schema.
    conforms_to: OMOP Common Data Model
  - id: chorus_modality_clinical_notes
    name: Clinical notes
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit. Access is
      controlled and the published metadata schema is the OHNLP open source schema.
      Notes themselves are stored locally at contributing sites; only tokens are
      held in the shared enclave.
    conforms_to: OHNLP
  - id: chorus_modality_imaging
    name: Imaging
    description: >-
      Imaging drawn from hospital PACS. Access is controlled and the published
      metadata schema is the DICOM schema. As of August 2025, 1,000 images were
      available, with de-identification in process for a larger cohort.
    conforms_to: DICOM
  - id: chorus_modality_waveform_telemetry
    name: Waveform telemetry
    description: >-
      Waveform telemetry captured from bedside monitors through gateway/middleware.
      Access is controlled and the published metadata schema is the PhysioNet
      schema, extended.
    conforms_to: WFDB
  - id: chorus_modality_waveform_eeg
    name: Waveform EEG
    description: >-
      EEG waveforms drawn from hospital EEG databases. Access is controlled and the
      published metadata schema is the open source EDF+ and Persyst schema. As of
      August 2025, EEG extraction was in process.
    conforms_to: EDF+ and Persyst

purposes:
  - id: chorus_purpose_ai_ready_critical_care_data
    name: Develop a publicly available, AI-ready critical care dataset
    response: >-
      The project's overarching goal is to develop a publicly available, AI-ready
      critical care dataset, while ensuring the methods promote privacy,
      accountability, and clinical benefit, and while promoting a new generation of
      AI clinicians and scientists.
  - id: chorus_purpose_infrastructure_for_ai_ml
    name: Provide infrastructure for AI/ML in critical care
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence
      and machine learning in critical care, and developing high-resolution
      multi-center data sets is a critical first step towards actionable and
      trustworthy AI. CHoRUS was created to meet the need of generating data for
      ML/AI applications in acute and critical illness.
  - id: chorus_purpose_diverse_ethically_sourced_dataset
    name: Build the most diverse, high-resolution, ethically sourced AI-ready dataset
    response: >-
      The goal of the CHoRUS Network is to develop the most diverse,
      high-resolution, ethically sourced, AI-ready data set to answer the grand
      challenge of improving recovery from acute illness.
  - id: chorus_purpose_holdout_validation
    name: Provision a holdout test set for external model validation
    response: >-
      The dataset will provision a holdout test set, accessible for model external
      validation, to aid marketplace adoption of AI-developed models for
      implementation in acute and critical care.
  - id: chorus_purpose_ethics_and_workforce
    name: Advance ethical practice and workforce development for clinical AI
    response: >-
      Beyond data generation, the project performs legal and ethical research to
      determine ethical and legal approaches to manage privacy and bias while
      accounting for social determinants of health, and cultivates expertise in the
      lay and scientific community to improve AI literacy and utilization through
      multimodal educational approaches.

tasks:
  - id: chorus_task_characterize_illness
    name: Characterize acute and critical care illness
    response: >-
      The dataset is intended to support ML/AI applications aimed at characterizing
      acute and critical care illness among patients with acute or critical
      illness.
  - id: chorus_task_predict_complications
    name: Predict complications
    response: >-
      The dataset is intended to support ML/AI applications aimed at predicting
      complications among patients with acute or critical illness.
  - id: chorus_task_measure_treatment_response
    name: Measure treatment response
    response: >-
      The dataset is intended to support ML/AI applications aimed at measuring
      treatment response among patients with acute or critical illness.
  - id: chorus_task_improve_recovery
    name: Build models that improve care and outcomes in critical care
    response: >-
      The project will develop the necessary network, tools, standards, data, and
      education to build machine-learning and artificial-intelligence-derived
      models to improve the care and outcomes of patients requiring critical care,
      and to improve recovery from acute illness.
  - id: chorus_task_external_validation
    name: External validation of AI models
    response: >-
      A sequestered holdout test set is provisioned for external validation of
      models developed elsewhere, to aid marketplace adoption of AI-developed
      models for implementation in acute and critical care.

addressing_gaps:
  - id: chorus_gap_infrastructure
    name: Lack of infrastructure for AI/ML in critical care
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence
      and machine learning in critical care.
  - id: chorus_gap_multicenter_high_resolution_data
    name: Absence of high-resolution multi-center critical care datasets
    response: >-
      Developing high-resolution multi-center data sets is a critical first step
      towards actionable and trustworthy AI, and the project addresses multiple
      challenges relevant to acquiring an AI-ready data set from more than 100,000
      critically ill patients.
  - id: chorus_gap_standards_and_harmonization
    name: Absence of unified standards across clinical data modalities
    response: >-
      Unified standards are needed to harmonize multi-modal EHR, waveform, imaging,
      and text data, and validated semantic mappings are needed to connect clinical
      data in various source formats to international standards.
  - id: chorus_gap_legal_and_ethical_framework
    name: Absence of a legal and ethical framework for large-scale clinical data sharing
    response: >-
      The project establishes a legal framework for collecting data at scale and
      performs community-facing ethics focus groups to determine what data is
      appropriate for public sharing.
  - id: chorus_gap_workforce
    name: Shortage of a diverse AI workforce in clinical care
    response: >-
      A comprehensive set of approaches is needed to develop the skills and
      workforce for a next generation of diverse academic and community AI
      scientists.

