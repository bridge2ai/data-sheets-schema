acquisition_methods:
  - id: chorus_acquisition_retrospective_clinical
    name: Retrospective extraction from clinical systems
    was_directly_observed: true
    was_reported_by_subjects: false
    acquisition_details:
      - >-
        The CHoRUS dataset is built through retrospective data collection from the
        clinical systems of contributing hospitals rather than through prospective
        enrollment of participants.
      - >-
        Structured data originate as provider and nursing documentation of
        diagnoses, procedures, medication administration, and flowsheet
        observations; imaging is drawn from hospital PACS; waveform telemetry is
        captured from bedside monitors through gateway/middleware; and EEG is drawn
        from hospital EEG databases.
      - >-
        Clinical notes are extracted and tokenized using the OHNLP toolkit.
      - >-
        The project develops capabilities across a multi-center network to acquire,
        standardize, tokenize, store, visualize, and label data.

collection_mechanisms:
  - id: chorus_collection_mechanism_network_tooling
    name: Multi-center acquisition tooling and standard operating protocols
    mechanism_details:
      - >-
        Data contributing sites follow standard operating protocols published in
        the Chorus_SOP repository, which presents an interactive workflow diagram
        describing the step-by-step process for extracting and contributing
        clinical data to CHoRUS, with links to SOP documents that have undergone an
        internal validation and review process.
      - >-
        Site-facing tooling supports creating and uploading a CHoRUS Data Extract,
        and CHoRUS services are deployed as dockerized container applications on
        Azure.
      - >-
        Issues arising during creation or submission of a site data extract are
        raised in context-specific Standards Discussions and Data Acquisition
        Discussions.
      - >-
        Sites provide regular status updates on their progress in creating and
        curating a CHoRUS-specific clinical data extract, either through the GitHub
        interface directly or by submitting a Google Form; a GoogleScript triggered
        on each form submission calls the GitHub API to update status and issue
        information.
    used_software:
      - id: chorus-extract-upload
        name: chorus-extract-upload
        description: >-
          Repository with tools to create and upload a CHoRUS Data Extract.
        license: MIT
      - id: chorus-container-apps
        name: chorus-container-apps
        description: >-
          Set of dockerized container applications and associated configurations to
          be deployed to support CHoRUS services on Azure.
      - id: Chorus_SOP
        name: Chorus_SOP
        description: CHoRUS centralized SOP documentation site.
        license: Apache-2.0
      - id: data_acq_SOP
        name: data_acq_SOP
        description: >-
          An online documentation SOP for the Data Acquisition Module.

sampling_strategies:
  - id: chorus_sampling_strategy
    name: Sampling for a balanced, diverse, and comprehensive cohort
    is_sample: true
    source_data:
      - >-
        Critically ill patients cared for at the CHoRUS data contributing
        hospitals; the project targets an AI-ready data set from more than 100,000
        critically ill patients.
    strategies:
      - >-
        Sampling to ensure comprehensive sets of patient conditions and clinical
        treatment strategies.
      - >-
        Federated access enabling sampling methods to ensure a balanced and diverse
        cohort.
    description: >-
      The CHoRUS collaboration spans 20 academic centers, of which 14 contribute as
      Data Acquisition centers, and the project aims for a data set of
      unprecedented diversity and high resolution.

data_collectors:
