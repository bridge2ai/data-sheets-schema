id: chorus_dataset
name: CHoRUS Dataset
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
description: >-
  The CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards)
  dataset is a multi-center, multimodal, high-resolution clinical dataset assembled
  to support artificial intelligence and machine learning in acute and critical
  care. CHoRUS is one of four data generation projects in the NIH-funded Bridge2AI
  consortium, and the CHoRUS Network describes its goal as developing the most
  diverse, high-resolution, ethically sourced, AI-ready data set to answer the
  grand challenge of improving recovery from acute illness. Data are collected
  retrospectively from hospital systems and harmonized across modalities:
  structured electronic health record data standardized to the OMOP Common Data
  Model, clinical notes extracted and tokenized with the OHNLP toolkit, waveform
  telemetry from bedside monitors, EEG waveforms from hospital EEG databases,
  imaging drawn from PACS, and social determinants of health together with
  contextual factors such as geographic distance to the nearest hospital. The
  collaboration spans 20 academic centers, of which 14 contribute as Data
  Acquisition centers, with more than 60 consortium members across 20 different
  institutions. The project website reports a current released dataset of 50,000
  patient admissions from ICU, PICU, and NICU comprising 1.6 billion rows of EHR
  OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data, and
  an anticipated final dataset of 100,000 patient admissions spanning 9 data
  modalities from 14 data contributing hospitals. An August 2025 program status
  report describes coverage of 14 different hospitals with over 45,000 unique
  admissions at that time, with imaging then limited to 1,000 available images
  while de-identification was in process for a larger cohort, and EEG extraction
  still underway. All modalities are under controlled access: OMOP and telemetry
  data are held in a cloud enclave, clinical notes remain stored locally at
  contributing sites except for tokens, users register and sign a licensing
  agreement, and a ".edu" email address is required to gain access. The project
  also provisions a holdout test set accessible for external validation of models.
page: https://chorus4ai.org/
conforms_to: OMOP Common Data Model
