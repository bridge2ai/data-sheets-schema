id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship dataset of the Artificial Intelligence Ready and Equitable/Exploratory
  Atlas for Diabetes Insights (AI-READI) project, one of four Data Generation Projects funded by the
  NIH Common Fund Bridge2AI program. The release contains data from 2280 participants with and
  without type 2 diabetes mellitus, collected between 19 July 2023 and 1 May 2025 and harmonized
  across three data collection sites. The data contain no protected health information; information
  related to the sex and race/ethnicity of the participants, as well as medication used, has been
  removed and is held under controlled access. The release comprises 356,343 files totalling
  approximately 3.82 TB, organized following the Clinical Dataset Structure (CDS) v0.1.1
  specification: one directory per datatype at the root, then one per modality, then one per device,
  then one per participant. The datatypes present are cardiac_ecg (WaveForm DataBase format),
  clinical_data (Observational Medical Outcomes Partnership Common Data Model), environment (NASA
  ASCII file format guidelines), retinal_flio, retinal_oct, retinal_octa and retinal_photography (all
  DICOM), and wearable_activity_monitor and wearable_blood_glucose (Open mHealth). Declared file
  formats are application/dicom, text/csv, application/json and text/markdown.
