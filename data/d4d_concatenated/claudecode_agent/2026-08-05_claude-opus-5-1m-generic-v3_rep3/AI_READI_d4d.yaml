splits:
  - split_details:
      - >-
        The release comes with a recommended 70/15/15 train/validation/test split, provided in the
        participants.tsv file. Because sex, race, and ethnicity are not released with the public
        version of the dataset, the project team prepared the split so that the validation and test
        sets are balanced as well as possible for sex, race/ethnicity, and diabetes status (no
        diabetes, prediabetes/lifestyle controlled, oral medication controlled, insulin controlled).
        The stated rationale is to reduce disparities in models developed from the dataset when
        demographic labels are unavailable to the user. Totals are 1576 train, 352 validation, 352
        test, 2280 overall.

subpopulations:
  - identification:
      - >-
        Self-reported race and ethnicity (Asian, Black, Hispanic, White), collected at screening.
        Individual-level race and ethnicity are removed from the public release and held under
        controlled access; only aggregate counts are published in the dataset documentation, and the
        healthsheet answers "No" to whether the released dataset identifies demographic subpopulations.
    distribution:
      - >-
        Across all 2280 participants - 380 Hispanic, 545 Asian, 519 Black, 836 White.
    subpopulation_elements_present: false
  - identification:
      - >-
        Biological sex (male, female), collected at screening. Individual-level sex is removed from
        the public release and held under controlled access; only aggregate counts are published.
    distribution:
      - >-
        Across all 2280 participants - 951 male, 1329 female.
    subpopulation_elements_present: false
  - identification:
      - >-
        Diabetes study group, assigned at enrollment into one of four arms - no type 1 or type 2
        diabetes; pre-diabetes or type 2 diabetes controlled by lifestyle adjustment; type 2 diabetes
        controlled by oral or non-insulin injectable medication; insulin-dependent type 2 diabetes.
        Study group is supplied per participant in participants.tsv.
    distribution:
      - >-
        Across all 2280 participants - 776 no diabetes, 560 lifestyle controlled, 686 oral medication
        controlled, 258 insulin controlled.
    subpopulation_elements_present: true
  - identification:
      - >-
        Data collection site, one of University of Alabama at Birmingham, University of California San
        Diego, or University of Washington. All study groups are recruited at each site, but the
        proportion of each group varies with the demographic prevalence of that group in the site's
        geographical area. No per-site participant counts are reported for this release.

anomalies:
  - anomaly_details:
      - >-
        Modality-level incompleteness - not all modalities are available for all participants because
        some participants elected not to participate in some study elements.
  - anomaly_details:
      - >-
        Loss of at-home monitoring data in a small number of cases because the collection device had
        no stored results, the battery died, or the device was returned too late for the data to be
        retrieved.
  - anomaly_details:
      - >-
        A small number of cases where a data collision occurred at some point in the processing chain
        and data were lost.
  - anomaly_details:
      - >-
        Survey data contain skipped questions and incomplete responses, which are expected in
        self-reported instruments.
  - anomaly_details:
      - >-
        Wearable device data may be affected by improper use, technical failure such as battery
        failure, or system malfunction.
  - anomaly_details:
      - >-
        Imaging data may be affected by participant non-cooperation, noise obscuring the image,
        system malfunction, and data transfer failures.
  - anomaly_details:
      - >-
        Undilated handheld Optomed Aurora fundus images vary in quality from participant to participant
        and within the same participant, because the participant is not dilated and the camera is
        handheld.
  - anomaly_details:
      - >-
        FLIO imaging is performed last in the visit and exposes participants to uncomfortable levels of
        light for a longer period than a standard OCT, so participant compliance and therefore image
        quality may be reduced for this modality.
  - anomaly_details:
      - >-
        Heidelberg Spectralis acquisition is operator-driven rather than fully automated, so quality
        issues can lead to the modality being skipped and to missing data.
  - anomaly_details:
      - >-
        Not all modalities are available for all participants. Some participants elected not to take
        part in some study elements; in some cases the collection device had no stored results or was
        returned too late to retrieve results (for example battery failure or data loss); in a few
        cases a data collision during processing caused data to be lost.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, producing volunteer bias which may limit the generalisability of
      results to those not represented in the study population.
    mitigation_strategy: >-
      Recruitment is conducted in waves from an enumerated study base of health system patients, with
      ongoing monitoring of participation characteristics and under- or oversampling of groups as
      needed.
  - bias_type: sampling_bias
    bias_description: >-
      The recruitment pool is drawn by screening electronic health records of three academic health
      systems for patients aged 40 and older with an encounter between 2020 and 2025, so recruitment
      is predominantly urban and hospital-based and may not fully capture diverse cultural and
      socioeconomic backgrounds.
    mitigation_strategy: >-
      Three geographically dispersed sites were selected to increase geographic and demographic
      diversity, and individuals from all demographic backgrounds are recruited at all three sites.
  - bias_type: representation_bias
    bias_description: >-
      The overall design targets balance across race/ethnicity, biological sex, and diabetes
      severity, but enrollment is ongoing and interim releases, including the pilot data, may not
      have achieved balanced distribution across groups. The cohort also excludes other racial and
      ethnic groups such as Pacific Islanders and Native Americans.
    affected_subsets:
      - >-
        Race/ethnicity and biological sex subpopulations across the training, validation, and test
        splits.
    mitigation_strategy: >-
      A recommended train/validation/test split is supplied in which the validation and test sets are
      balanced as far as possible for sex, race/ethnicity, and diabetes status; new recruitment
      strategies are to be implemented if balancing emerges as a challenge.
  - bias_type: selection_bias
    bias_description: >-
      Eligibility requires that participants speak, read, and understand English, which the protocol
      publication states may have created challenges in recruiting Hispanic and Asian persons.
    affected_subsets:
      - Hispanic and Asian subpopulations
    mitigation_strategy: >-
      The project noted the possibility of translating study materials into Spanish and sought
      supplemental funding for translation to enable participation of Spanish-speaking participants.
  - bias_type: representation_bias
    bias_description: >-
      Recruiting Black men into health research is documented to be more difficult than recruiting
      other populations, with factors such as medical mistrust and fear of safety stemming from
      historical events including the Tuskegee syphilis study, while this population carries a
      disproportionate burden of T2DM.
    affected_subsets:
      - Black male participants
    mitigation_strategy: >-
      Tailored printed materials and a personalised, participatory approach to recruitment were
      identified as strategies to encourage participation.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The cohort is deliberately triple-balanced by race/ethnicity, T2DM severity, and biological sex
      rather than matching the demographic distribution of the US population, so the dataset should
      not be treated as a population-representative sample.
    scope_impact: >-
      Prevalence or population-level estimates derived directly from the dataset would be biased.
    recommended_mitigation: >-
      Treat the cohort as a designed, balanced sample intended for model development rather than for
      epidemiological estimation.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Racial and ethnic coverage is restricted to Asian, Black, Hispanic, and White participants;
      other groups such as Pacific Islanders and Native Americans are not included. Participants must
      speak and read English, and eligibility is restricted to adults aged 40 and older, with an
      upper limit of 85 years in the study eligibility criteria.
    scope_impact: >-
      Models trained on the dataset may not generalise to excluded groups, to non-English speakers,
      or to younger adults.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The study is cross-sectional with a single visit per participant plus ten days of at-home
      monitoring; this release covers data collected between 19 July 2023 and 1 May 2025. A
      longitudinal follow-up of approximately 10 percent of the cohort is planned for year 4 and is
      not present in this release.
    scope_impact: >-
      Within-participant change over time cannot be studied in this release.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels, targets, or predefined tasks are supplied; the dataset is hypothesis agnostic and
      users must define their own labels.
    recommended_mitigation: >-
      The project states it has no formal guidelines for creating new labels or defining new tasks,
      so users should document their own label definitions.
  - limitation_type: scope_limitation
    limitation_description: >-
      The associated biorepository holds a finite number of biospecimens available to share with
      scientists; procedures for reviewing and prioritising written requests are still to be
      developed. Biospecimens are not part of this data release.
  - limitation_type: integration_limitation
    limitation_description: >-
      Individual-level sex, race, ethnicity, medication information, 5-digit zip code, genetic
      sequencing data, past health records, and traffic and accident reports are withheld from the
      public release and available only under controlled access, so analyses requiring these
      variables cannot be performed on the public dataset alone.
    recommended_mitigation: >-
      Enter into a data use agreement to obtain the controlled access version of the dataset.

