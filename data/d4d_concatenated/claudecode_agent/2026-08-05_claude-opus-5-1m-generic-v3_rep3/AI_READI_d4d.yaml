is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Privacy Rule Safe Harbor method, applied to the public release, with additional removal of
    sex, race/ethnicity, and medication information.
  deidentification_details:
    - >-
      The FAIRhub dataset description records a de-identification type of NoDeIdentification with the
      explanation that no identifiers were collected, so no active de-identification was necessary, but
      the team checked that no identifiable data per US HIPAA were present. The record flags
      deIdentDirect and deIdentHIPAA as true and deIdentDates, deIdentNonarr, and deIdentKAnon as
      false, so dates were not shifted or removed. The public set is stripped of Protected Health
      Information as defined by the HIPAA Privacy Rule via the Safe Harbor method, and of information
      related to the sex and race/ethnicity of participants and to medications used. To prevent
      re-identification attempts the project implements a robust data dissemination system, a strict
      licence agreement, and data watermarking for both the public and controlled sets.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - >-
        All patients aged 40 years and older who had a medical encounter within one of the three health
        systems (University of Alabama at Birmingham, University of California San Diego, University of
        Washington) between 2020 and 2025. Patients with T2DM and pre-diabetes were identified by
        screening electronic health records for ICD-10 diagnosis codes E11.X and R73.09 respectively;
        patients without diabetes have no encounters with these codes.
    why_not_representative:
      - >-
        Rather than targeting the demographic distribution of the US population, the study recruits four
        race/ethnic groups, four T2DM severity categories, and biological males and females in
        approximately equal proportions, because building balanced datasets is stated to be critical for
        developing unbiased machine learning models.
    strategies:
      - Stratified recruitment in waves, with wave composition and size influenced by observed
        participation characteristics of race/ethnicity, gender, T2DM severity, and site
      - Under- and oversampling of groups as recruitment progresses to maintain balance
      - Contact pools identified per wave by electronic health record screening at each site, then
        combined and sampled centrally at the University of Alabama at Birmingham
      - Mailed hardcopy invitation letters and invitation emails with personalised REDCap links,
        access codes, and QR codes
  - is_sample: false
    representative_verification:
      - >-
        The release is not a sample of the enrolled cohort - the healthsheet states that the dataset
        contains all possible instances, that is, all participants enrolled during the covered period.
        Because enrollment is ongoing, the released cohort may not yet have achieved the intended
        balanced distribution across groups.

acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    acquisition_details:
      - >-
        Directly observed measurements taken during the in-person visit or from participant specimens
        and devices - vitals, anthropometry, 12-lead ECG, monofilament testing, cognitive screening,
        visual acuity and contrast sensitivity, autorefraction, retinal imaging, blood and urine
        laboratory assays, and ten days of at-home continuous glucose, physical activity, and indoor
        environmental sensor recordings.
  - was_directly_observed: false
    was_reported_by_subjects: true
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details:
      - >-
        Participant-reported data collected through REDCap questionnaires covering screening and
        eligibility, demographics, CES-D-10 depression screening, Problem Areas in Diabetes (PAID-5),
        diabetes self-care, diet, ophthalmic history, smoking, alcohol, vaping and marijuana use,
        general health history, social determinants of health (PhenX surveys), and current medications
        coded with RxNorm. Verification was performed where possible, for example by cross-referencing
        entered medications with medications physically brought in or photographed by the participant.

collection_mechanisms:
  - mechanism_details:
      - >-
        REDCap electronic data capture, used for participant-reported questionnaires and for clinical
        data entered at the visit including medications assessment, vitals, visual acuity, contrast
        sensitivity, monofilament results, and complete blood count results.
  - mechanism_details:
      - >-
        Philips PageWriter TC30 Cardiograph, used for 12-lead electrocardiography with the participant
        reclining or supine and the chair position recorded (0, 30, 60, or 90 degrees relative to
        supine); exported as .xml and converted to WFDB.
  - mechanism_details:
      - >-
        Retinal imaging devices - Optomed Aurora IQ handheld undilated fundus camera (Oulu, Finland),
        iCare EIDON widefield TrueColor confocal fundus system (Raleigh, North Carolina), Heidelberg
        Spectralis HRA OCT and OCTA (Heidelberg, Germany), Heidelberg FLIO fluorescence lifetime imaging
        ophthalmoscope, Topcon Maestro2 3D OCT-1 and Triton DRI OCT (Tokyo, Japan), and Carl Zeiss
        Meditec Cirrus 5000 Angioplex (Jena, Germany). All images are collected under dilated conditions
        except the Optomed.
  - mechanism_details:
      - >-
        Dexcom G6 continuous glucose monitor, applied to the abdomen and worn for ten continuous days,
        recording blood glucose every 5 minutes; participants are masked to the results during the
        monitoring period.
  - mechanism_details:
      - >-
        Garmin Vivosmart 5 physical activity monitor, worn for ten days, recording steps, heart rate,
        respiratory rate, sleep duration and phases, stress, calories, and oxygen saturation. The device
        does not capture video or audio, has no GPS location monitoring, and is not synced with
        participant-owned devices.
  - mechanism_details:
      - >-
        LeeLab Anura, a custom-designed indoor environmental sensor built at the Karalis Johnson Retina
        Center, University of Washington, placed in the participant's home for ten days and recording
        ambient temperature, relative humidity, nitrogen oxides, volatile organic compounds, particulate
        matter (PM1.0, PM2.5, PM4, PM10), and eleven multi-spectral light intensity channels.
  - mechanism_details:
      - >-
        Vision testing instruments - M&S Technologies Electronic Visual Acuity tester at 4 metres under
        photopic and mesopic (2.0 neutral density filter) conditions, Mars letter contrast sensitivity
        charts (Mars Perceptrix), and Topcon KR-800 autorefractor/keratometer; lensometers used include
        NIDEK LM-600P, Topcon CL-200, and Topcon CL-300.
  - mechanism_details:
      - >-
        Blood pressure and heart rate devices - OMRON HEM 907XL, Medline MDS4001, and Welch Allyn 6000
        series vital signs monitors with reusable FlexiPort cuffs; two readings separated by two
        minutes.
  - mechanism_details:
      - >-
        Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
        application (MoCA Cognition, Quebec, Canada), capturing total score, section subscores, Memory
        Index Score, and task completion times.
  - mechanism_details:
      - >-
        Standard 10 gram monofilament applied at three plantar locations on each foot, ten times per
        location, with the participant's eyes closed; insensate areas are retested for confirmation.
  - mechanism_details:
      - >-
        Blood (approximately 53 mL, non-fasting) and urine collection, with CLIA-certified laboratories
        local to each site performing complete blood counts on fresh whole blood and the University of
        Washington Nutrition and Obesity Research Center performing all other assays on stored frozen
        samples shipped on dry ice approximately quarterly.
  - mechanism_details:
      - >-
        FAIRhub, a Microsoft Azure cloud-based data management, curation, and sharing platform developed
        for this project, to which each site uploads data at regular intervals after site-level quality
        control by the site Data Manager.

data_collectors:
  - role: Clinical research coordinators and research assistants
    collector_details:
      - >-
        Staff at the three data collection sites recruited, enrolled, consented, and collected data.
        All were trained by the data manager at the University of Alabama at Birmingham using a detailed
        Manual of Procedures, completed mandatory institutional compliance training for human subject
        research, and had to successfully administer all protocol elements to at least three volunteer
        practice subjects before enrolling participants.
  - role: Site data managers
    collector_details:
      - >-
        Data managers at each site oversaw the certification and data collection process and were
        responsible for quality control of all data before upload to FAIRhub.
  - role: Phlebotomists and laboratory assistants
    collector_details:
      - >-
        Responsible for blood collection from participants and for local processing and shipping of
        plasma, serum, buffy coats, CPT mononuclear cell preparation tubes, and PAXgene RNA tubes.
  - role: Central project team
    collector_details:
      - >-
        Software engineers, cloud engineers, and research and data scientists across the consortium
        institutions performed data ingestion, standardisation, curation, and release preparation.
        Their effort was supported by NIH award OT2OD032644 in proportion to percentage effort, with
        salaries aligned to the funding guidelines at each site.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details:
      - >-
        Period of data collection covered by version 3.0.0 of the dataset, as recorded in the FAIRhub
        dataset description, README, and healthsheet.
  - end_date: '2023-11-30'
    timeframe_details:
      - >-
        Preliminary pilot enrolment period, conducted to secure sufficient familiarity for all
        coordinators; formal data collection began 1 December 2023 and pilot data were included in the
        first released dataset. The start date is reported inconsistently across sources - the BMJ Open
        protocol publication gives 18 July 2023 as the enrolment start, while the FAIRhub metadata gives
        19 July 2023 - so no single start date is asserted here.
  - start_date: '2023-07-19'
    end_date: '2027-01-01'
    timeframe_details:
      - >-
        Study period as recorded in the FAIRhub study description status module - actual start
        2023-07-19, anticipated completion 2027-01-01. The BMJ Open protocol publication separately
        states that enrolment will continue until 30 November 2026.
  - start_date: '2022-09-01'
    end_date: '2025-08-31'
    timeframe_details:
      - >-
        Project period of NIH award OT2OD032644 as recorded in NIH RePORTER for application 10471118.

direct_collection:
  - is_direct: true
    collection_details:
      - >-
        Data were collected directly from participants at the three recruiting sites, not obtained via
        third parties. Recruitment pools were identified by screening the sites' electronic health
        records for diabetes and pre-diabetes ICD-10 codes among patients who had an encounter with the
        health systems, and identified individuals were then invited to enroll and attend an in-person
        study visit.

collection_consents:
  - consent_details:
      - >-
        Written informed consent was required from every participant before any part of the protocol,
        including questionnaires. Most participants consented remotely by computer, tablet, or smart
        phone through a personalised link into REDCap; participants who did not select electronic
        consent were consented in person at the start of the visit. Potential participants could read
        all consent documentation electronically before their visit and sign with an electronic
        signature without verbal communication with a coordinator, or request a call back. The approved
        consent form for the principal site (University of Washington) is published with the dataset
        documentation; other sites operated under IRB reliance and used the same form with minor
        institution-specific language.

collection_notifications:
  - notification_details:
      - >-
        Every individual was aware of the data collection, as this was active data collection directly
        from participants rather than passive collection or secondary use of existing data. Individuals
        in each recruitment pool were mailed a hardcopy invitation letter and sent an invitation email
        describing the research programme, expectations for participation, and frequently asked
        questions through an online REDCap recruitment interface.

consent_revocations:
  - revocation_details:
      - >-
        Participants were permitted to withdraw consent at any time and cease study participation.
        However, any data that had been shared or used up to that point remain in the dataset. This is
        clearly communicated in the consent document.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details:
      - >-
        The study was approved under IRB protocol STUDY00016228, with initial approval received on 20
        December 2022 and reliance agreements with the IRBs of the University of Alabama at Birmingham
        and the University of California San Diego. An annual renewal application reporting study
        status and progress is required within 90 days of expiration. The initial approval letter is
        published with the dataset documentation. The FAIRhub oversight module records the human
        subject review status as submitted and approved, with no Data Monitoring Committee and no FDA
        regulated drug or device.
  - reviewing_organization: Native BioData Consortium
    review_details:
      - >-
        The project engages in tribal consultation with the Native BioData Consortium to address
        barriers and facilitators of participation for American Indian and Alaska Native communities
        and to evaluate tools such as data usage agreements, contract negotiations, transparent access
        agreements, and mechanisms for assured return of benefit and sustainable input, control, and
        monitoring of Tribal data.
  - reviewing_organization: AI-READI Community Advisory Board
    review_details:
      - >-
        A Community Advisory Board of 11 persons from the three sites, including diversity in race and
        ethnicity as represented in the AI-READI sample, contributes to the development of the protocol
        and reviews consent forms and research procedures, with feedback incorporated into protocol
        modifications.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - STUDY00016228
  ethics_review_board:
    - >-
      University of Washington Institutional Review Board, with initial approval on 20 December 2022
      and reliance agreements from the IRBs of the University of Alabama at Birmingham and the
      University of California San Diego.
  regulatory_compliance:
    - >-
      Written informed consent from all participants; public release de-identified under the HIPAA
      Privacy Rule Safe Harbor method; licensees must comply with the data security and privacy
      standards established under the NIH Genomic Data Sharing Policy; the study is registered on
      ClinicalTrials.gov as NCT06002048; it is recorded as not an FDA-regulated drug or device study.
  special_populations:
    - >-
      No protected population is targeted. Ability to provide consent is an inclusion criterion, and
      pregnancy, gestational diabetes, and type 1 diabetes are exclusionary. Participants are adults
      aged 40 years and older, with an upper age limit of 85 years in the study eligibility module.

informed_consent:
  - consent_obtained: true
    consent_type:
      - >-
        Written informed consent, obtained either electronically (e-consent with electronic signature
        in REDCap) before the visit or in person at the start of the visit.
    consent_documentation:
      - >-
        IRB-approved consent form for the University of Washington (STUDY00016228), published with the
        dataset documentation; the other clinical sites operated under IRB reliance and used the same
        form with minor institution-specific language. Signed electronic consent forms were emailed
        automatically to participants, who could request additional copies from study coordinators.
    consent_scope:
      - >-
        Participation in the AI-READI protocol including questionnaires, in-person measurements,
        imaging, blood and urine collection, ten days of at-home monitoring, review of medical records
        and driving/accident records; placement of de-identified data in an open-source repository; and
        banking of biospecimens for future research. The FAIRhub consent metadata records the consent
        type as ConsentSpecifiedNotElsewhereCategorised, with the note that the public version of the
        dataset may only be used for type 2 diabetes related research while a private version will
        allow more generic use.
    withdrawal_mechanism:
      - >-
        Participants may withdraw consent at any time and cease participation; data already shared or
        used up to that point remain in the dataset, as stated in the consent document.

participant_compensation:
  - compensation_provided: true
    compensation_amount:
      - "200 USD"
    compensation_type:
      - >-
        A monetary stipend for the study visit, funded through the NIH grant, plus coverage of
        reasonable parking, public transit, or rideshare costs related to the study visit. The stipend
        is paid after the final data are received and the study devices are returned, typically at
        least two weeks after the visit, and is not prorated.
    compensation_rationale:
      - >-
        Compensation for the participant's time across a visit lasting between 2.5 and 4 hours plus a
        subsequent ten-day at-home monitoring period and return of devices.

participant_privacy:
  - anonymization_method:
      - >-
        Removal of Protected Health Information under the HIPAA Privacy Rule Safe Harbor method, with
        additional removal of sex, race/ethnicity, and medication information from the public release;
        participant folders are named with study ID numbers only.
    privacy_techniques:
      - Two-tier release with a public dataset and a separate controlled access dataset requiring
        institutional legal and privacy use agreements
      - Login through a verified ID system plus self-attestation before public download
      - A strict custom licence agreement that prohibits re-identification and contact with data
        subjects
      - Data watermarking applied to both the public and controlled sets
      - Selection of at-home devices that do not capture video or audio, have no GPS location
        monitoring, and are not synced with participant-owned devices
      - Storage of identifiable information on encrypted servers or in locked rooms with restricted
        access at all sites, with access limited to authorized research personnel
    data_linkage:
      - >-
        Individual-level sex, race, ethnicity, 5-digit zip code, genetic sequencing data, past health
        records, medications, and traffic and accident reports are held in the controlled access
        dataset rather than being linked into the public release.
    reidentification_risk:
      - >-
        A theoretical risk of future re-identification is acknowledged. AI algorithms can infer
        individual patient characteristics and could facilitate individual-level identification, which
        motivated the dissemination system, licence, and watermarking controls.

at_risk_populations:
  special_protections:
    - >-
      Ability to provide consent is an inclusion criterion, so adults unable to consent are not
      enrolled and no legally authorized representative process is used. Pregnancy, gestational
      diabetes, and type 1 diabetes are exclusion criteria. No minors are enrolled; the minimum age is
      40 years. Transportation assistance (rideshare services) was offered to participants who
      endorsed barriers to reaching study visits.

preprocessing_strategies:
  - preprocessing_details:
      - >-
        Clinical and survey data collected in REDCap were mapped to the Observational Medical Outcomes
        Partnership (OMOP) Common Data Model, with each CSV file in the clinical_data directory
        corresponding one-to-one to an OMOP CDM table.
  - preprocessing_details:
      - >-
        Retinal images were exported from the devices in raw format and converted to DICOM where
        necessary - Topcon Maestro2 and Triton images were exported as .fda and converted to DICOM, and
        Heidelberg FLIO images were exported as .sdt and converted to DICOM. Spectralis, Cirrus, EIDON,
        and Optomed images were exported directly as DICOM.
  - preprocessing_details:
      - >-
        Electrocardiograms were exported from the Philips PageWriter TC30 as .xml and converted to the
        WaveForm DataBase (WFDB) format.
  - preprocessing_details:
      - >-
        Garmin Vivosmart 5 activity data were exported in .FIT format and converted to the Open mHealth
        standard; Dexcom G6 continuous glucose data were exported as .csv and converted to Open mHealth.
  - preprocessing_details:
      - >-
        Environmental sensor data were formatted following the NASA ASCII File Format Guidelines for
        Earth Science Data.
  - preprocessing_details:
      - >-
        The dataset was organized according to the Clinical Dataset Structure (CDS) v0.1.1
        specification - one directory per datatype at the root, then modality, then device, then
        participant - with per-datatype manifest.tsv files and root-level metadata files
        (dataset_description.json, dataset_structure_description.json, study_description.json,
        participants.tsv, participants.json, healthsheet.md, README.md, CHANGELOG.md, LICENSE.txt).
  - preprocessing_details:
      - >-
        Protected Health Information was removed from the public release using the HIPAA Safe Harbor
        method, and information on sex, race/ethnicity, and medications was additionally removed. In
        version 3.0.0 the Snellen visual acuity variables were dropped so that only logMAR visual
        acuity measurements are available.
  - preprocessing_details:
      - >-
        Processing for this release used a combination of automated and custom pipelines, in contrast
        to the custom and ad hoc processing used for version 1.0.0.

cleaning_strategies:
  - cleaning_details:
      - >-
        Quality control at the time of data entry - clinical values outside expected minimum and
        maximum ranges were flagged in REDCap and appeared in reports reviewed by clinical research
        coordinators and Data Managers, who examined participant records to determine whether an error
        was likely.
  - cleaning_details:
      - >-
        Data were checked and edited where errors were detected for credibility (range checks),
        incorrect flow through prescribed skip patterns, missing data that could be filled directly
        from other portions of an individual's record, and the omission or duplication of records.
        Editing was done only under the guidance and approval of the site principal investigator; where
        there was no logical or appropriate way to correct a value, the site PI decided whether it
        should be removed.
  - cleaning_details:
      - >-
        Internal review by AI-READI team members for quality checks and to ensure that no personally
        identifiable information was accidentally included. The dataset has not undergone any formal
        external audit.

missing_data_documentation:
  - missing_data_patterns:
      - Modality-level absence, where a participant has no data for one or more of the collected
        modalities
      - Item-level absence in survey data from skipped questions and incomplete responses
      - Variable-level removal, with the Snellen visual acuity variables dropped in version 3.0.0 so
        that only logMAR measurements remain
      - Removal of sex, race/ethnicity, and medication variables from the public release
    missing_data_causes:
      - Participants elected not to participate in some study elements
      - The data collection device had no stored results, for example after battery failure
      - The device was returned too late for results to be retrieved
      - A data collision occurred at some point in the processing chain and data were lost
      - Imaging was skipped or degraded because of quality issues, participant non-cooperation,
        system malfunction, or data transfer failure
    handling_strategy: >-
      Missing values are left absent and no imputation is performed. During cleaning, missing data
      that could be filled directly from other portions of an individual's record were filled, and
      any such edits required site principal investigator approval.

raw_sources:
  - raw_data_details:
      - >-
        Raw device and system exports prior to standardisation - REDCap exports, Philips ECG .xml
        files, Topcon .fda files, Heidelberg .sdt files, Garmin .FIT files, Dexcom .csv files, and
        native device DICOM. The raw data are saved and expected to be preserved by the AI-READI
        project at least for the duration of the project, but are not currently shared outside the
        project team because they have not been mapped to standardized terminologies and may
        accidentally include protected health information or personally identifiable information, for
        example in free text fields. Raw data may be included in future releases of the controlled
        access dataset.

raw_data_sources:
  - source_description: >-
      Electronic health records of the three participating health systems (University of Alabama at
      Birmingham, University of California San Diego, University of Washington), screened for
      patients aged 40 and older with an encounter between 2020 and 2025 and for ICD-10 codes E11.X
      (type 2 diabetes) and R73.09 (pre-diabetes).
    source_type:
      - Electronic health records
    access_details: >-
      Used to construct recruitment contact pools only; not distributed as part of the dataset. Past
      health records are among the variables held under controlled access.
  - source_description: >-
      Prospective participant-reported and coordinator-entered data captured at the study visit and
      before it.
    source_type:
      - REDCap electronic data capture system
    raw_data_format:
      - REDCap export (.csv)
  - source_description: >-
      Retinal imaging device exports from Optomed Aurora IQ, iCare EIDON, Heidelberg Spectralis,
      Heidelberg FLIO, Topcon Maestro2, Topcon Triton, and Zeiss Cirrus 5000.
    source_type:
      - Ophthalmic imaging devices
    raw_data_format:
      - DICOM native, .fda (Topcon), .sdt (Heidelberg FLIO)
  - source_description: >-
      At-home monitoring device exports from the Dexcom G6 continuous glucose monitor, the Garmin
      Vivosmart 5 activity monitor, and the LeeLab Anura environmental sensor, each worn or deployed
      for ten days.
    source_type:
      - Wearable and environmental sensor devices
    raw_data_format:
      - .csv (Dexcom, environmental sensor), .FIT (Garmin)
  - source_description: >-
      Clinical laboratory results - complete blood counts from CLIA-certified laboratories local to
      each site on fresh whole blood, and all other blood and urine assays from the University of
      Washington Nutrition and Obesity Research Center on stored frozen samples.
    source_type:
      - Clinical laboratories
    raw_data_format:
      - .csv
  - source_description: >-
      Twelve-lead electrocardiogram recordings from the Philips PageWriter TC30 Cardiograph.
    source_type:
      - Cardiography device
    raw_data_format:
      - .xml

variables:
  - variable_name: HbA1c
    data_type: float
    unit: "%"
    measurement_technique: Whole blood test performed at the University of Washington NORC facility
    quality_notes:
      - >-
        Marker for diabetes. Reference range supplied by the testing laboratory 4.0-6.0.
  - variable_name: Glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test performed at the University of Washington NORC facility
    quality_notes:
      - >-
        Marker for diabetes. Non-fasting sample; participants were asked about last oral intake at the
        visit. Reference range supplied by the testing laboratory 62-125.
  - variable_name: C peptide
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma test performed at the University of Washington NORC facility
    quality_notes:
      - >-
        Indicator of insulin production. Reference range supplied by the testing laboratory 1.1-4.4.
  - variable_name: Insulin
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma test performed at the University of Washington NORC facility
    quality_notes:
      - >-
        Marker for diabetes. Reference range supplied by the testing laboratory 0.0-24.9.
  - variable_name: N-terminal pro-B-type natriuretic peptide
    data_type: float
    unit: pg/mL
    measurement_technique: EDTA plasma test performed at the University of Washington NORC facility
    quality_notes:
      - >-
        Severity and outcome predictor of heart failure. Reference range varies by age.
  - variable_name: Troponin-T
    data_type: float
    unit: ng/L
    measurement_technique: EDTA plasma test performed at the University of Washington NORC facility
    quality_notes:
      - >-
        Marker of myocardial injury. Reference range supplied by the testing laboratory female under
        11, male under 16.
  - variable_name: C reactive protein, high sensitivity
    data_type: float
    unit: mg/L
    measurement_technique: Serum test performed at the University of Washington NORC facility
    quality_notes:
      - >-
        Inflammation marker and risk factor for T2DM. Reference range supplied by the testing
        laboratory 0.0-10.0.
  - variable_name: Creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test performed at the University of Washington NORC facility
    quality_notes:
      - >-
        Marker for kidney function. Reference range supplied by the testing laboratory female
        0.38-1.02, male 0.51-1.18.
  - variable_name: Urine albumin
    data_type: float
    unit: mg/dL
    measurement_technique: Urine test performed at the University of Washington NORC facility
    quality_notes:
      - >-
        Urinary biomarker for early diabetic nephropathy. No reference range supplied by the testing
        laboratory.
  - variable_name: Urine creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Urine test performed at the University of Washington NORC facility
    quality_notes:
      - >-
        Urinary biomarker for early diabetic nephropathy. No reference range supplied by the testing
        laboratory.
  - variable_name: Blood glucose measurements
    data_type: float
    unit: mg/dL
    measurement_technique: >-
      Dexcom G6 continuous glucose monitor worn on the abdomen, recording every 5 minutes for ten
      days
    quality_notes:
      - >-
        Participants were masked to the readings during the monitoring period. Converted from .csv to
        the Open mHealth standard for the dataset.
  - variable_name: Montreal Cognitive Assessment total score
    data_type: integer
    minimum_value: 0
    maximum_value: 30
    measurement_technique: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application
    quality_notes:
      - >-
        Higher numbers represent better performance; section subscores, Memory Index Score, and task
        completion times are also recorded. The dataset documentation notes that a person's level of
        education and socioeconomic factors may affect the test.
  - variable_name: Visual acuity (logarithm of the minimum angle of resolution)
    data_type: float
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres, best-corrected, measured
      separately for each eye under photopic conditions and under mesopic conditions through a 2.0
      neutral density filter
    quality_notes:
      - >-
        Lower numbers indicate better resolution. Snellen visual acuity variables were dropped in
        version 3.0.0, leaving only logMAR measurements.
  - variable_name: Log contrast sensitivity
    data_type: float
    measurement_technique: >-
      Mars letter contrast sensitivity chart (Mars Perceptrix) read monocularly at approximately 50
      cm under photopic conditions and under mesopic conditions through a neutral density occluder
    quality_notes:
      - >-
        Higher numbers mean better sensitivity. Testing terminated after two consecutive errors or at
        the end of the chart; the score is computed by multiplying the number of errors prior to the
        final correct letter by 0.04 and subtracting from the log CS value at that letter.
  - variable_name: Number of steps
    data_type: integer
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for ten days
    quality_notes:
      - Converted from .FIT to the Open mHealth standard for the dataset.
  - variable_name: Oxygen saturation
    data_type: float
    unit: "%"
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for ten days
  - variable_name: Particulate matter (PM1.0, PM2.5, PM4, PM10)
    data_type: float
    measurement_technique: >-
      LeeLab Anura custom environmental sensor placed in the participant's home for ten days
    quality_notes:
      - >-
        Recorded alongside ambient temperature, relative humidity, nitrogen oxides (NO and NO2),
        volatile organic compounds, and eleven multi-spectral light intensity measurements.

