purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, multimodal AI-ready dataset on
      type 2 diabetes mellitus so that future artificial intelligence and machine learning research
      can provide insights into T2DM, including salutogenic pathways to return to health.
  - response: >-
      To assemble data specifically designed to permit downstream pseudotime manifold analysis, an
      approach used to predict disease trajectories by learning from complex multimodal data from
      participants of differing disease severity, and thereby to reconstruct a temporal atlas of
      T2DM development and reversal.
  - response: >-
      To establish standards, best practices, and guidelines (a blueprint) for the collection,
      preparation, and sharing of AI-ready biomedical datasets that future Data Generation Projects
      can follow, including new standards such as the Clinical Dataset Structure (CDS) and the
      FAIRhub curation and sharing platform.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel,
      including a year-long research internship programme at the intersection of biomedicine and AI.

addressing_gaps:
  - response: >-
      The lack of well-designed, high-quality, large, and inclusive multimodal datasets that are
      AI-ready for training models on complex multi-organ diseases such as type 2 diabetes mellitus.
  - response: >-
      The under-representation of racial and ethnic groups that bear a higher burden of type 2
      diabetes in prior research; a meta-epidemiological review of T2DM studies published from 2000
      to 2020 found that samples lacked racial and ethnic diversity.
  - response: >-
      Limited current understanding of salutogenesis in T2DM, that is, the pathway from disease back
      to health, as opposed to pathogenesis.
  - response: >-
      The absence of data sources that combine survey, physical measurement, clinical, imaging, and
      wearable device domains in a way that supports downstream AI/ML analyses not feasible with
      claims or electronic health record data alone.

tasks:
  - response: >-
      Pseudotime manifold analysis to predict disease trajectories across the spectrum from no
      diabetes to insulin-dependent type 2 diabetes.
  - response: >-
      Development of multimodal artificial intelligence and machine learning models for type 2
      diabetes mellitus using harmonized survey, clinical, imaging, wearable, and environmental data.

instances:
  - instance_type: Individual human study participant
    counts: 2280
    data_substrate: >-
      Multimodal per-participant records comprising tabular survey and clinical data (OMOP CDM CSV
      tables), DICOM retinal images (color fundus photography, fundus autofluorescence, infrared
      reflectance, OCT, OCTA en face, flow cube and segmentation, FLIO), WFDB electrocardiogram
      waveforms, Open mHealth time series from continuous glucose monitoring and a wearable activity
      monitor, and ASCII environmental sensor time series.
    data_topic: >-
      Type 2 diabetes mellitus severity and salutogenesis, with associated cardiac, renal, ocular,
      cognitive, metabolic, behavioural, physical activity, and indoor environmental exposure
      measures.
    label_description: >-
      No explicit label or target is associated with each instance; the dataset is deliberately
      hypothesis agnostic and no labeling was performed by the dataset creators.

relationships:
  - relationship_details:
      - >-
        All instances are participants in the same prospective data generation project (AI-READI), and
        this relationship is explicit in the dataset. There is currently only one study visit per
        participant, so no within-participant longitudinal links exist in this release; approximately
        10 percent of the cohort is planned to return for a follow-up visit in year 4 of the project.

