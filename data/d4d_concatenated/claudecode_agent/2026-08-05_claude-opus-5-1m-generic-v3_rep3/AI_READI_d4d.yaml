intended_uses:
  - use_category:
      - Artificial intelligence and machine learning research on type 2 diabetes mellitus
    examples:
      - Training multimodal AI/ML models across survey, clinical, imaging, wearable, and
        environmental domains
      - Pseudotime manifold analysis to reconstruct a temporal atlas of T2DM development and reversal
      - Research into salutogenesis, the pathway from disease back to health
    usage_notes: >-
      Access to the public release requires agreeing to use the data only for type 2 diabetes related
      research, and the data are stored and shared as AI-ready so that AI/ML research can proceed
      without reformatting and preprocessing.
  - use_category:
      - Methodological blueprint for creating and sharing AI-ready clinical datasets
    examples:
      - Reuse of the Clinical Dataset Structure (CDS) specification for organizing clinical research
        datasets
      - Reuse of the FAIRhub curation, management, and sharing workflows
      - Reuse of the project's guidelines for making biomedical data types FAIR
    usage_notes: >-
      The consortium disseminates the principles and processes of designing and implementing the
      dataset through publications, a Zenodo community, and a GitHub organization.
  - use_category:
      - Commercial research and development
    usage_notes: >-
      The custom licence grants a non-exclusive, non-transferable licence to download, reproduce, and
      use the data and to create derivative works for research and commercial purposes, subject to
      security, secondary-sharing, and anti-re-identification obligations.
  - use_category:
      - Workforce training at the intersection of biomedicine and artificial intelligence
    examples:
      - A year-long AI-READI research internship programme including a two-week data
        science/programming bootcamp, didactic lectures, and mentored research
      - Intern projects developing healthsheets, mapping project data into common data models, and
        analysing equity and ethical issues

prohibited_uses:
  - prohibition_reason:
      - >-
        Making clinical treatment decisions based on the data is prohibited by the licence, because the
        data are intended solely as a research resource.
  - prohibition_reason:
      - >-
        Using the data, alone or with other information, to compromise the confidentiality of any data
        subject, to identify or contact an individual data subject or group, to extract or extrapolate
        identifying information, to establish membership in a particular group, or otherwise to cause
        harm or injury to a data subject, is prohibited by the licence in order to protect participant
        privacy.
  - prohibition_reason:
      - >-
        Transferring, licensing, sublicensing, selling, assigning, displaying, sharing, or otherwise
        conveying any portion of the data or any derivative work to a third party is prohibited unless
        that party is bound by an agreement with the licensor on identical terms.
  - prohibition_reason:
      - >-
        Disseminating models, algorithms, or programs trained on the data without first undertaking all
        reasonable efforts to minimise the likelihood that the data can be memorized, derived,
        reconstructed, or reconstituted through their use or construction is prohibited.
  - prohibition_reason:
      - >-
        Use of the public release for research unrelated to type 2 diabetes is not permitted, because
        access is conditioned on agreeing to use the data only for type 2 diabetes related research.

discouraged_uses:
  - discouragement_details:
      - >-
        Uses that assume a demographically balanced or population-representative sample are discouraged
        for interim releases, because enrollment is ongoing and periodic data releases may not have
        achieved the intended balanced distribution across race/ethnicity, sex, and diabetes severity
        groups.
  - discouragement_details:
      - >-
        Estimating population prevalence or generalising to the US population is discouraged, because
        the cohort was deliberately recruited in equal proportions across four race/ethnic groups, four
        T2DM severity categories, and both sexes rather than to match the demographic distribution of
        the US population, and because participants are volunteers recruited from three urban academic
        health systems.

other_tasks:
  - task_details:
      - >-
        The dataset is hypothesis agnostic and spans more than ten health domains that can be
        associated with adverse conditions in T2DM, so it may support tasks beyond those originally
        planned. The FAIRhub consent metadata notes that while the public version may only be used for
        type 2 diabetes related research, a private (controlled access) version will allow for more
        generic use.

future_use_impacts:
  - impact_details:
      - >-
        There is a theoretical risk of future re-identification. AI algorithms can infer individual
        patient characteristics and could facilitate individual-level identification, so the project
        implements a robust data dissemination system, a strict licence agreement, and data
        watermarking for both the public and controlled sets.
  - impact_details:
      - >-
        Because interim releases may not be balanced across demographic groups, and because sex, race,
        and ethnicity are not released publicly, models trained on the data could carry demographic
        imbalance into downstream applications without the user being able to detect it. The project
        supplies a recommended train/validation/test split whose validation and test sets are balanced
        as far as possible for sex, race/ethnicity, and diabetes status to reduce this disparity.
  - impact_details:
      - >-
        Beyond the theoretical re-identification risk, the dataset creators state that to the extent of
        their knowledge they do not currently anticipate uses of the dataset that could result in
        unfair treatment of individuals or groups or other undesirable harms.

