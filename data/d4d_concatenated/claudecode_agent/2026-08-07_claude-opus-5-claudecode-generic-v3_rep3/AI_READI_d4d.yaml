purposes:
  - name: Enable AI/ML research into type 2 diabetes salutogenesis
    description: >-
      The dataset was created to enable future generations of artificial
      intelligence and machine learning research to provide critical insights into
      type 2 diabetes mellitus, including salutogenic pathways to return to health.
      Salutogenesis in this context refers to the pathway from T2DM to health, the
      opposite of studying how healthy people proceed through pathogenesis resulting
      in T2DM.
    response: >-
      The purpose for creating the dataset was to enable future generations of
      artificial intelligence/machine learning (AI/ML) research to provide critical
      insights into type 2 diabetes mellitus (T2DM), including salutogenic pathways to
      return to health.
  - name: Serve as a blueprint for ethically sourced, AI-ready biomedical datasets
    description: >-
      AI-READI places special emphasis on establishing standards, best practices and
      guidelines for the collection, preparation and sharing of data for AI/ML,
      including guidance from bioethicists and adherence to the FAIR (Findable,
      Accessible, Interoperable, Reusable) principles, so that the approach can serve
      as a model for future efforts to develop other medical and health datasets
      targeted for AI/ML.

tasks:
  - name: Downstream pseudotime manifold analysis
    description: >-
      Data collection was specifically designed to permit downstream pseudotime
      manifold analysis, an approach used to predict disease trajectories by
      collecting and learning from complex, multimodal data from participants with
      differing disease severity, from normal to insulin-dependent T2DM. The approach
      relies on dimensionality reduction, is agnostic to existing classification
      criteria or biases, and is intended to be used to reconstruct a temporal atlas
      of T2DM development and reversal towards health.
    response: >-
      The multi-modal dataset being collected is being gathered to facilitate
      downstream pseudotime manifolds and various applications in artificial
      intelligence.
  - name: Multimodal AI/ML model development on T2DM
    description: >-
      The dataset is intended as a foundational, hypothesis-agnostic resource in T2DM
      supporting a range of artificial intelligence applications, including
      multimodal model development aimed at defining disease trajectories and
      underlying genetic links across racial and ethnic cohorts.

addressing_gaps:
  - name: Lack of large, diverse, AI-ready multimodal T2DM datasets
    description: >-
      Understanding and affecting the course of complex, multi-organ diseases such as
      T2DM has been limited by a lack of well-designed, high quality, large and
      inclusive multimodal datasets. A major barrier to AI in this area has been the
      absence of diverse datasets that are AI ready for training models; the AI-READI
      dataset is intended to fill that gap.
    response: >-
      T2DM is a growing public health threat. Yet, the current understanding of T2DM,
      especially in the context of salutogenesis, is limited. Given the complexity of
      T2DM, AI-based approaches may help with improving our understanding but a key
      issue is the lack of data ready for training AI models. The AI-READI dataset is
      intended to fill this gap.
  - name: Under-representation of racial and ethnic groups in T2DM research
    description: >-
      A meta-epidemiological review of T2DM studies published from 2000 to 2020
      indicated that samples lacked racial and ethnic diversity. AI-READI recruits
      approximately equal numbers of Asian, Black, Hispanic and White participants
      rather than targeting the demographic distribution of the US population, because
      building balanced datasets is critical for the development of unbiased machine
      learning models.

