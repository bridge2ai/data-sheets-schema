instances:
  - name: Participant
    instance_type: Individual study participant
    counts: 2280
    label: false
    label_description: >-
      No explicit labels or targets are associated with the instances. No specific
      labeling was performed because the dataset is hypothesis-agnostic and aimed at
      facilitating multiple potential downstream AI/ML applications.
    description: >-
      Each instance represents an individual patient. An instance consists of all data
      available for one individual participating in the study, across survey data,
      clinical data, retinal imaging data, environmental sensor data, continuous
      glucose monitor data and wearable activity monitor data; these encompass tabular
      data, imaging data, and physiological signal or waveform data. There is no
      unstructured text data in the dataset. Version 3.0.0 contains 2280 instances;
      version 1.0.0 contained 204 and version 2.0.0 contained 1067.
    missing_information:
      - name: Modalities absent for some participants
        missing:
          - Data for one or more modalities for individual participants
        why_missing:
          - Some participants elected not to participate in some study elements
          - >-
            In a few cases the data collection device had no stored results or was
            returned too late to retrieve the results, for example because the battery
            died or data was lost
          - >-
            In a few cases a data collision occurred at some point in the process and
            data was lost
    source_caveats: >-
      Counts of 2280, 204 and 1067 are the healthsheet's cumulative per-version
      figures. The FAIRhub README change table instead reports increments of 204, 863
      and 1213 participants for the pilot, year 2 and year 3 data.

