splits:
  - name: Recommended training, validation and test splits
    split_details: >-
      Version 3.0.0 comes with recommended data splits. Because sex, race and
      ethnicity data are not released with the public version of the dataset, the
      project team prepared splits in proportions of 70% training, 15% validation and
      15% testing, in which the validation and test sets are balanced as far as
      possible for sex, race/ethnicity and diabetes status (no diabetes, prediabetes
      or lifestyle-controlled, oral-medication-controlled, and insulin-controlled).
      The suggested split is included in the participants.tsv file distributed with
      the dataset. Across all 2280 participants the totals are 380 Hispanic, 545
      Asian, 519 Black and 836 White; 951 male and 1329 female; and by diabetes status
      776 no diabetes, 560 lifestyle-controlled, 686 oral-medication-controlled and
      258 insulin-controlled, with a mean age of 60.8 (SD 11.3) years.
    description: >-
      The recommended split is described as a new addition in version 3.0.0; the
      datasheet for that version introduces no new tasks or labeling, only the new
      recommended split.

relationships:
  - name: Instances belong to a single prospective data generation project
    relationship_details: >-
      All instances are part of the same prospective data generation project
      (AI-READI). There is currently only one visit per participant. Approximately 10%
      of participants recruited in years 1 and 2 are intended to be invited back for a
      follow-up visit in year 4 of the project; the BMJ Open protocol states that
      approximately 4% of participants are expected to undergo a follow-up examination
      in year 4.

anomalies:
  - name: Expected sources of noise and error by modality
    anomaly_details: >-
      In survey data, skipped questions or incomplete responses are expected. In
      wearable data, improper use and technical failures such as battery failure or
      system malfunction are expected. In imaging data, participant uncooperation,
      noise that may obscure the images, technical failures such as system
      malfunction, and data transfer failures are expected.
  - name: Device-specific and operator-dependent image quality variation
    anomaly_details: >-
      Undilated handheld Optomed Aurora fundus images vary in quality from participant
      to participant and within the same participant because the pupil is not dilated
      and the camera is handheld. Heidelberg Spectralis imaging is operated manually
      and is not fully automated, so quality issues may arise that lead to the
      modality being skipped and data being missing. Fluorescence lifetime imaging
      ophthalmoscopy takes longer than a standard Spectralis OCT and exposes
      participants to uncomfortable levels of light, so it is performed as the last
      modality of a visit, at which point participant compliance may not be at its
      best.

known_biases:
  - name: Volunteer selection bias
    bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, so there is selection bias known as volunteer bias
      which may limit the generalisability of results to those who are not represented
      in the study population.
    mitigation_strategy: >-
      Recruitment proceeds in waves whose composition and size are adjusted according
      to the observed participation characteristics of race/ethnicity, gender, T2DM
      severity and site, with under- and oversampling of groups as needed.
  - name: Recruitment shortfalls in under-recruited populations
    bias_type: sampling_bias
    bias_description: >-
      Recruiting Black men into health research is more difficult than recruiting
      other populations, yet this population bears a disproportionate percentage of
      the T2DM burden; factors such as medical mistrust and fear of safety stem from
      historical events such as the Tuskegee syphilis study. Similar trends for
      under-recruitment and disease burden have been reported for Hispanic and Asian
      persons. Requiring that eligible participants speak, read and understand English
      may have created challenges in recruiting Hispanic and/or Asian persons.
    mitigation_strategy: >-
      Strategies identified in the literature, such as tailoring printed materials and
      using a personalised, participatory approach to recruitment, are available; if
      sample balancing on race/ethnicity emerges as a challenge, new recruitment
      strategies will be implemented. Site-level prioritisation was set by regional
      demographics: the University of Washington concentrates on Asian, then Hispanic,
      then Black participants; UC San Diego prioritises Hispanic, then Asian, then
      Black; and UAB prioritises Black, then Hispanic, then Asian. All sites recruit
      White participants.
    affected_subsets:
      - Black participants
      - Hispanic participants
      - Asian participants
  - name: Incomplete demographic representation of the US population
    bias_type: representation_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based, which may not fully
      capture diverse cultural and socioeconomic backgrounds. The study cohort does
      not include other races and ethnicities such as Pacific Islanders and Native
      Americans, so it may not provide a comprehensive representation of the
      population.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic diversity
      across the United States and to ensure diverse representation across racial and
      ethnic groups, and individuals from all demographic backgrounds were recruited
      at all three sites.
  - name: Balance not yet achieved in early releases
    bias_type: sampling_bias
    bias_description: >-
      While the cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot
      study is not balanced across these parameters, and because enrolment is ongoing
      the pilot data release and periodic updates to data releases may not have
      achieved balanced distribution across groups.
    mitigation_strategy: >-
      Recommended training, validation and test splits are supplied that balance the
      validation and test sets as far as possible for sex, race/ethnicity and diabetes
      status, and are described as aimed at reducing disparities in models developed
      using this dataset.

known_limitations:
  - name: English-language eligibility requirement
    limitation_type: representativeness_limitation
    limitation_description: >-
      Participants are required to speak, read and understand English. Non-English
      speaking participants are not initially enrolled because truly enrolling them
      would require translating all study materials rather than only the consent form,
      which was not possible at the time of the IRB application.
    scope_impact: >-
      May have created challenges in recruiting Hispanic and Asian persons and limits
      the populations represented in the dataset.
    recommended_mitigation: >-
      An NIH supplement was being submitted to fund translation of all study materials
      to enable recruitment and participation of Spanish-speaking participants; native
      Spanish-speaking research staff at UC San Diego can provide interpretation, and
      the consent form would be translated into Spanish by UCSD translation services
      if recruitment goals for Hispanic participants are not met.
  - name: Modality coverage is incomplete across participants
    limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants, because some participants
      elected not to participate in some study elements, some devices returned no
      stored results or were returned too late, and in a few cases data was lost to a
      collision in the processing pipeline.
    scope_impact: >-
      Analyses that require complete multimodal coverage will operate on a subset of
      participants.
  - name: Cross-sectional design with a single visit per participant
    limitation_type: temporal_limitation
    limitation_description: >-
      AI-READI is a cross-sectional study; there is currently only one visit per
      participant. Only a small subgroup is planned to return for a follow-up visit in
      year 4, described as approximately 10% of the study population in the project
      abstract and IRB protocol and as approximately 4% of participants in the BMJ
      Open protocol.
    scope_impact: >-
      Limits longitudinal analyses; disease trajectory inference is intended to be
      approached through pseudotime manifold analysis across participants of differing
      severity rather than through repeated measures.
  - name: No labels or predefined tasks
    limitation_type: methodological_limitation
    limitation_description: >-
      No explicit labels or targets are associated with data instances, no labeling was
      performed, and no formal guidelines exist for researchers creating new labels or
      defining new tasks.
    scope_impact: >-
      Supervised learning applications must derive their own targets from the released
      variables.
  - name: Finite biorepository sample availability
    limitation_type: scope_limitation
    limitation_description: >-
      A limitation of the biorepository is that there are a finite number of samples to
      share with scientists interested in using them in research. Procedures for
      reviewing and prioritising written requests will be developed before the
      biorepository is complete.
    scope_impact: >-
      Applies to the biospecimen repository held at the University of Alabama at
      Birmingham Center for Clinical and Translational Science rather than to the
      digital data release.
  - name: Snellen visual acuity variables withdrawn in version 3.0.0
    limitation_type: scope_limitation
    limitation_description: >-
      The data fields and types are largely the same as in the prior version of the
      dataset, but the Snellen visual acuity variables were dropped in version 3.0.0
      so that only logMAR visual acuity measurements are available.
    scope_impact: >-
      Analyses depending on Snellen acuity values must use earlier releases or convert
      from logMAR.

confidential_elements:
  - name: No confidential elements in the released dataset
    confidential_elements_present: false
    confidentiality_details: >-
      The dataset does not contain data that might be considered confidential; no
      personally identifiable information is included in the dataset.

content_warnings:
  - name: No content warnings
    content_warnings_present: false
    description: >-
      The healthsheet reports that the dataset contains no data that, if viewed
      directly, might be offensive, insulting, threatening, or otherwise pose a safety
      risk such as psychological safety or anxiety.

subpopulations:
  - name: Demographic sub-populations are not identified in the released dataset
    subpopulation_elements_present: false
    identification: >-
      The healthsheet answers "No" to whether the dataset identifies any demographic
      sub-populations by age, gender, sex or ethnicity. Information related to the sex
      and race/ethnicity of participants has been removed from the released dataset;
      5-digit zip code, sex, race and ethnicity are described as held under controlled
      access. No regulation prevents demographic data collection in the study.
    distribution: >-
      Aggregate demographic distributions are nonetheless published in the dataset
      README as part of the recommended split summary: across all 2280 participants,
      380 Hispanic, 545 Asian, 519 Black and 836 White; 951 male and 1329 female; and
      by diabetes status 776 no diabetes, 560 lifestyle-controlled, 686
      oral-medication-controlled and 258 insulin-controlled.
    source_caveats: >-
      The healthsheet's "No" answer and the README's aggregate demographic tables are
      both reported here rather than reconciled; they describe per-instance labels and
      cohort-level summary statistics respectively.

sensitive_elements:
  - name: Public release
    sensitive_elements_present: false
    sensitivity_details: >-
      The public dataset does not contain data considered sensitive. The released
      version 3.0.0 contains no protected health information, and information related
      to the sex and race/ethnicity of participants as well as medications used has
      been removed.
  - name: Controlled-access release
    sensitive_elements_present: true
    sensitivity_details: >-
      The controlled-access dataset is described as containing data on racial and
      ethnic origins, location as a 5-digit zip code, and motor vehicle accident
      reports. The dataset documentation additionally lists sex, genetic sequencing
      data, past health records and medications among the elements held under
      controlled access.

is_deidentified:
  name: De-identification of the AI-READI release
  identifiable_elements_present: false
  method: >-
    The FAIRhub dataset description records a de-identification type of
    "NoDeIdentification" with the explanation that no identifiers were collected so no
    active de-identification was necessary, but that the team checked that no data
    identifiable under US HIPAA were present. The Nature Metabolism comment states
    that the public set is stripped of Protected Health Information as defined by the
    HIPAA Privacy Rule via the "Safe Harbor" method.
  identifiers_removed: >-
    Protected health information; information related to the sex and race/ethnicity of
    participants; medications used.
  deidentification_details: >-
    The FAIRhub de-identification flags record direct-identifier removal and HIPAA
    de-identification as applied, and date shifting, non-arbitrary de-identification
    and k-anonymity as not applied. Raw data are not shared outside the project team
    in part because they have not been mapped to standardized terminologies and may
    accidentally include personal health information or personally identifiable
    information, for example in free-text fields. Data have been reviewed internally
    by AI-READI team members for quality checks and to ensure that no personally
    identifiable information was accidentally included; the dataset has not undergone
    any formal external audit.
  source_caveats: >-
    The FAIRhub metadata's "NoDeIdentification" type and the Nature Metabolism
    comment's description of HIPAA Safe Harbor stripping are both recorded here; they
    are not reconciled in the declared bundle.

acquisition_methods:
  - name: Mixed direct observation and subject report
    was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      The acquisition of data varied by domain: some data were directly observable,
      such as laboratory results, vitals and retinal imaging, whereas other data were
      reported by subjects, such as survey responses. Verification of data entry was
      performed when possible, for example by cross-referencing entered medications
      with medications that were physically brought in or photographed by each study
      participant.

collection_mechanisms:
  - name: REDCap electronic data capture
    mechanism_details: >-
      REDCap is used to collect patient-reported questionnaire data and the following
      clinical data from the visit: medications assessment, vitals, visual acuity,
      contrast sensitivity, monofilament test results and complete blood count
      results. Participants are directed into a REDCap recruitment interface by
      personalised links, access codes and QR codes, where they can read a study
      overview, download the informed consent document, request a call back, complete
      a screening survey and enroll by signing an electronic consent.
  - name: Retinal imaging devices
    mechanism_details: >-
      Retinal imaging captures both eyes of each participant on multiple devices with
      different, partially overlapping modalities: an Optomed Aurora IQ handheld
      undilated colour fundus camera (4 images per participant, DICOM); an iCare EIDON
      widefield truecolor confocal fundus system (12 images per participant, DICOM);
      a Heidelberg Spectralis HRA OCT and OCTA system (6 images per participant,
      DICOM); a Topcon Maestro2 3D OCT-1 (6 images per participant, exported as .fda
      and converted to DICOM); a Topcon Triton DRI OCT (6 images per participant,
      exported as .fda and converted to DICOM); a Carl Zeiss Cirrus 5000 (8 images per
      participant, DICOM); and Heidelberg fluorescence lifetime imaging
      ophthalmoscopy (2 macula-centred images per participant, exported as .sdt and
      converted to DICOM). All retinal images are collected under dilated conditions
      except for the Optomed.
  - name: At-home monitoring devices
    mechanism_details: >-
      At the end of the in-person visit participants are sent home with three devices
      to use continuously for 10 days: a custom-designed home environmental sensor
      (the LeeLab Anura, built at the Karalis Johnson Retina Center, University of
      Washington) recording ambient temperature, relative humidity, nitrogen oxides,
      volatile organic compounds, particulate matter at PM1.0, PM2.5, PM4 and PM10,
      and eleven multi-spectral light intensity measurements, in .csv; a Garmin
      VivoSmart 5 physical activity monitor recording step count, heart rate, sleep
      duration, and oxygen saturation, exported in .FIT and converted to the mHealth
      standard; and a Dexcom G6 continuous glucose monitor recording blood glucose
      every 5 minutes in .csv. The environmental sensor and fitness tracker were
      chosen with participant privacy as a primary concern: they capture no video or
      audio, have no GPS location monitoring, and are not synced with
      participant-owned devices. Participants are masked to the Dexcom results during
      the monitoring period and return the devices by overnight mail or in person with
      a data sheet recording which wrist the tracker was worn on, their dominant hand,
      and where the environmental sensor was placed.
  - name: Clinical measurement instruments
    mechanism_details: >-
      A 12-lead electrocardiogram is recorded on a Philips PageWriter TC30 Cardiograph
      with the participant's recline position noted. Peripheral neuropathy is assessed
      with the 10 g monofilament test at three locations on each foot. Cognition is
      screened with the Montreal Cognitive Assessment administered on an iPad using
      the MoCA Duo application. Photopic and mesopic letter visual acuity is measured
      with the M&S Technologies Electronic Visual Acuity tester at 4 metres, mesopic
      acuity through a 2.0 neutral density filter. Photopic and mesopic letter
      contrast sensitivity is measured monocularly with the Mars chart. Autorefraction
      uses a Topcon KR 800 auto keratometer/refractor. Lensometry uses NIDEK LM-600P,
      Topcon CL-200 or Topcon CL-300 devices. Blood pressure uses an OMRON HEM 907XL,
      a Medline MDS4001, or a Welch Allyn 6000 series vital signs monitor, measured
      twice two minutes apart.
  - name: Biospecimen collection and laboratory assay
    mechanism_details: >-
      Approximately 50-60 mL of non-fasting blood and a urine specimen are collected
      during the visit. One EDTA vacutainer goes to a local CLIA-certified clinical
      lab for complete blood count on fresh whole blood; all other assays are
      performed by the University of Washington Nutrition and Obesity Research Center
      on stored frozen samples batch-shipped on dry ice approximately quarterly.
      Plasma, serum, buffy coats, PAXgene RNA tubes and peripheral blood mononuclear
      cells are processed locally on the day of collection and biobanked at the
      University of Alabama at Birmingham Center for Clinical and Translational
      Science; genomic DNA extraction from stored buffy coats and centralised
      processing of CPT tubes occur at UAB CCTS.
  - name: Electronic health record and licensing record extraction
    mechanism_details: >-
      Electronic health records are screened to identify recruitment pools and are
      extracted to obtain data on general health, eye health, medical and surgical
      history, diabetes, medications, laboratory records and previous medical imaging.
      Driving and accident records are obtained from the Department of Licensing.
      Participants already wearing a Dexcom G6 may opt to share up to 90 days of prior
      glucose data through the Dexcom Clarity application, for a total of up to 100
      days.

sampling_strategies:
  - name: Study recruitment sampling
    is_sample: true
    is_random: false
    source_data: >-
      The study base is all patients aged 40 years or older who had a medical
      encounter within each health system site (University of Alabama at Birmingham,
      University of California San Diego, University of Washington) between 2020 and
      2025. Patients with T2DM and pre-diabetes are identified by screening electronic
      health records for ICD-10 diagnosis codes E11.X and R73.09 respectively;
      patients without diabetes will not have encounters with these codes.
    is_representative: false
    why_not_representative: >-
      Rather than targeting the demographic distribution of the US population, the
      study deliberately recruits four race/ethnic groups in equal proportions,
      because building balanced datasets is critical for the development of unbiased
      machine learning models. The FAIRhub study description records the sampling
      method as a non-probability sample.
    strategies: >-
      Triple-balanced recruitment by self-reported race/ethnicity (Asian, Black,
      Hispanic, White), T2DM presence and severity (no diabetes; pre-diabetes or
      lifestyle-controlled; controlled by oral or non-insulin injectable medication;
      insulin-controlled) and biological sex, with a target of approximately 1000
      participants in each of the four diabetes groups and 1000 from each of the four
      racial and ethnic groups, age- and sex-matched within and between groups.
      Participants are recruited in waves; for each wave a contact pool is identified
      by screening electronic health records at each site, and UAB selects a stratified
      sample from the combined site lists according to the sampling scheme. Over three
      or more years of recruitment approximately 50,000 invitation letters from each
      site are sent by mail and email.
  - name: Composition of the released version
    is_sample: false
    strategies: >-
      Within the enrolled cohort the dataset contains all possible instances: it
      contains data from all participants enrolled during the covered collection
      period rather than a sample of them.
    source_caveats: >-
      The healthsheet phrases this as "data from all participants who have been
      enrolled during the first year of data collection for AI-READI" while the same
      healthsheet and the FAIRhub metadata give the version 3.0.0 collection period as
      19 July 2023 to 1 May 2025.

data_collectors:
  - name: Clinical research coordinators
    role: Clinical research coordinator / study coordinator
    collector_details: >-
      Responsible for contacting and consenting research participants, ushering
      participants through the research visit, conducting study visits including
      collection of ophthalmologic images, providing training on study procedures such
      as continuous glucose monitoring and the fitness tracker, and ensuring the return
      of all study materials. All research personnel at the three data sites who
      recruited, enrolled and collected data underwent training by the data manager at
      UAB using a detailed Manual of Procedures, completed mandatory institutional
      compliance training for human subject research, and had to successfully
      administer all protocol elements to at least three volunteer practice subjects
      before enrolling participants.
  - name: Research assistants
    role: Research assistant
    collector_details: >-
      Conduct study visits including collection of ophthalmologic images, provide
      training on study procedures such as continuous glucose monitoring and the
      fitness tracker, ensure the return of all study materials under the direction of
      the study coordinator or project manager, and are responsible for data upload
      and management from each clinic visit.
  - name: Data managers and database managers
    role: Data manager / database manager
    collector_details: >-
      Data managers at each site oversee the training and certification process and
      are responsible for the quality control of all data before uploading to FAIRhub.
      Database managers ingest data into the REDCap database and extract it for
      processing.
  - name: Phlebotomists and laboratory assistants
    role: Phlebotomist / laboratory assistant
    collector_details: >-
      Phlebotomists are responsible for blood collection from research participants;
      laboratory assistants are responsible for processing and shipping samples.
  - name: Data engineering and curation staff
    role: Research or data scientist, software engineer, cloud engineer
    collector_details: >-
      Research and data scientists and postdoctoral fellows process data for release in
      the database and develop standards. Software engineers design, implement and test
      the data curation pipelines. Cloud engineers handle cloud infrastructure
      customization, configuration and deployment.
  - name: Investigators, project managers and domain experts
    role: Principal investigator, co-investigator, project manager, domain expert
    collector_details: >-
      Principal, co-principal and co-investigators make executive decisions about the
      scope of the project including data collection, curation and processing.
      Program and project managers oversee data collection and the management of
      research coordinators, and oversee integration and collaboration between study
      members and modules. Domain experts provide guidance on issues arising from
      collecting data in each domain of medicine, such as endocrinology and cardiology.
  - name: Compensation of the data collection team
    collector_details: >-
      The effort of AI-READI team members involved in data collection was supported by
      National Institutes of Health award OT2OD032644 based on the percentage of
      effort contributed, with salaries aligned to the funding guidelines at each site.

collection_timeframes:
  - name: Collection period covered by version 3.0.0
    start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      The FAIRhub dataset description records a collected date range of
      2023-07-19/2025-05-01, and the healthsheet gives the same period for this
      version of the dataset.
  - name: Overall study collection period
    timeframe_details: >-
      The overall project timeline spans four years: one year for protocol development
      and training, with years 2 to 4 allocated to subject recruitment and data
      collection. The Nature Metabolism comment describes enrolment of 4,000
      participants at three sites over four years, 2022-2026. The BMJ Open protocol
      states that enrolment began on 18 July 2023 and will continue until 30 November
      2026, that preliminary pilot enrolment ran from 18 July 2023 to 30 November
      2023, and that formal data collection began on 1 December 2023. The FAIRhub
      study description records an actual start date of 2023-07-19 and an anticipated
      completion date of 2027-01-01, with overall status "Enrolling by invitation".
    source_caveats: >-
      The BMJ Open protocol's enrolment start of 18 July 2023 differs by one day from
      the 19 July 2023 recorded in the FAIRhub study and dataset metadata.

direct_collection:
  - name: Direct collection from participants
    is_direct: true
    collection_details: >-
      Data were collected directly from participants across the three recruiting
      sites. Recruitment pools were identified by screening electronic health records
      for diabetes and prediabetes ICD-10 codes among patients who had an encounter
      with the sites' health systems, so screening data were obtained from health
      system records while study data were collected directly.

collection_notifications:
  - name: Participant awareness of collection
    notification_details: >-
      Each individual was aware of the data collection, as this was active data
      collection directly from participants rather than passive collection or
      secondary use of existing data. Potential participants were mailed a hardcopy
      invitation letter and sent an invitation email, each personalised and directing
      them into an online REDCap recruitment interface where they could read an
      overview of the research programme, expectations for participation and answers
      to frequently asked questions.

collection_consents:
  - name: Informed consent process
    consent_details: >-
      Informed consent to participate was required before participation in any part of
      the protocol, including questionnaires. Potential participants were given the
      option to read all consent documentation electronically before their visit and
      to consent with an electronic signature without verbal communication with a
      clinical research coordinator; they could access e-consent documentation in
      REDCap and decide at that point not to participate or to request additional
      information. For participants who did not consent electronically, consent was
      obtained in person in a private room at the start of the visit, followed by
      completion of all questionnaires. The approved consent form for the principal
      project site, the University of Washington, is published at
      https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf;
      the other clinical sites had IRB reliance and used the same form with minor
      institution-specific language.

consent_revocations:
  - name: Withdrawal of consent
    revocation_details: >-
      Participants were permitted to withdraw consent at any time and cease study
      participation. However, any data that had been shared or used up to that point
      would stay in the dataset. This is clearly communicated in the consent document.

missing_data_documentation:
  - name: Missing modality data
    missing_data_patterns: >-
      Information is missing from individual instances: not all modalities are
      available for all participants.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements; in a few
      cases the data collection device had no stored results or was returned too late
      to retrieve the results, for example because the battery died or data was lost;
      and in a few cases a data collision occurred at some point in the process and
      data was lost.
    handling_strategy: >-
      No data were excluded from the dataset at the time of preprocessing. Missing data
      that could be directly filled from other portions of an individual's record were
      filled during data cleaning under the guidance and approval of the site
      principal investigator.

raw_data_sources:
  - name: Study participants
    source_description: >-
      Participants provided self-reported questionnaire responses, physical
      measurements, clinical test results, retinal images, electrocardiograms and
      biospecimens during a single in-person visit, and ten days of at-home wearable
      and environmental sensor data.
    source_type: Human research participants
    access_details: >-
      Collected directly under informed consent at the three study sites; released in
      de-identified form through FAIRhub.
  - name: Electronic health records of the three site health systems
    source_description: >-
      Electronic health records at the University of Alabama at Birmingham, University
      of California San Diego and University of Washington were screened using ICD-10
      diagnosis codes, age, race and ethnicity to identify eligible participants, and
      were extracted for general health, eye health, medical and surgical history,
      diabetes, medications, laboratory records and previous medical imaging.
    source_type: Electronic health record
    access_details: >-
      Accessed under IRB approval for pre-screening and study data collection;
      identifiable elements are not part of the public release.
  - name: State Department of Licensing driving and accident records
    source_description: >-
      Driving records and accident reports, including car accidents experienced and
      traffic tickets received in the previous three years, are obtained from the
      Department of Licensing.
    source_type: Government administrative record
    access_details: >-
      No additional approvals are required beyond the IRB approval. Motor vehicle
      accident reports are described as held in the controlled-access dataset.
  - name: Dexcom Clarity historical glucose records
    source_description: >-
      Participants already wearing a Dexcom G6 at the time of the visit may opt to
      share up to 90 days of previously collected glucose values through the Dexcom
      Clarity application, in addition to the 10 days of study collection, for a total
      of up to 100 days.
    source_type: Device vendor application
    access_details: >-
      Optional and participant-initiated; the study clinic terminates data sharing
      after capture.

ethical_reviews:
  - name: University of Washington Institutional Review Board approval
    reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      AI-READI was approved by the Institutional Review Board of the University of
      Washington under approval number STUDY00016228, including reliance agreements
      with the IRBs of the University of Alabama at Birmingham and the University of
      California, San Diego. The initial IRB approval was received on 20 December
      2022, and the initial approval letter is published at
      https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf. An annual
      renewal application to the IRB about the status and progress of the study is
      required and is due within 90 days of expiration. Written informed consent is
      provided by all participants. The FAIRhub study description records a human
      subject review status of "Submitted, approved", no FDA-regulated drug or device,
      and no data monitoring committee. A Community Advisory Board of 11 persons from
      the three sites, including diversity in race and ethnicity as represented in the
      AI-READI sample, contributes to the development of the protocol and evaluates
      the consent forms and research protocols.
    source_caveats: >-
      The BMJ Open protocol also refers to "Clinicaltrials.org approval number
      STUDY00016228", which is the IRB number; the FAIRhub study description separately
      records ClinicalTrials.gov identifier NCT06002048.

data_protection_impacts:
  - name: No data protection impact analysis conducted
    impact_details: >-
      No analysis of the potential impact of the dataset and its use on data subjects,
      such as a data protection impact analysis, has been conducted.

human_subject_research:
  name: Human subject research status
  involves_human_subjects: true
  ethics_review_board: >-
    University of Washington Institutional Review Board (Human Subjects Division),
    with reliance agreements covering the University of Alabama at Birmingham and the
    University of California, San Diego
  irb_approval:
    - >-
      STUDY00016228, University of Washington IRB, initial approval 20 December 2022,
      with annual renewal required within 90 days of expiration
    - https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf
  regulatory_compliance:
    - >-
      HIPAA: the released dataset contains no protected health information; the
      Nature Metabolism comment describes the public set as stripped of PHI via the
      HIPAA Safe Harbor method
    - >-
      NIH Genomic Data Sharing Policy: the data licence requires licensees to comply
      with the NIH data security and privacy standards for controlled-access data
      subject to the GDS Policy
    - >-
      ClinicalTrials.gov registration NCT06002048; the FAIRhub oversight module records
      no FDA-regulated drug and no FDA-regulated device
  description: >-
    The dataset relates to people and was generated by active, prospective human
    subject research conducted at three US academic health systems under a single
    IRB of record.

informed_consent:
  - name: Informed consent for AI-READI participation and data sharing
    consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either as an electronic signature through
      REDCap before the visit or in person at the start of the visit
    consent_documentation: >-
      Approved University of Washington consent form, published at
      https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
      Once signed, the electronic consent form is automatically emailed to the
      participant, who may request additional copies from a study coordinator at any
      time. The consent form includes a table at its start clarifying which
      information will be publicly available and which will require an application and
      approval process with privacy protection.
    withdrawal_mechanism: >-
      Participants may withdraw consent at any time and cease study participation, but
      any data that had been shared or used up to that point remains in the dataset;
      this is clearly communicated in the consent document.
    consent_scope: >-
      The FAIRhub dataset consent record uses consent type
      "ConsentSpecifiedNotElsewhereCategorised" with the note that the public version
      of the dataset can only be used for type 2 diabetes related research while a
      private version will allow more generic use. Consent covers secondary use,
      banking and future sharing of data and specimens; consent form language covers
      submission to a repository and sharing with other researchers.

at_risk_populations:
  name: At-risk population inclusion
  at_risk_groups_included: false
  description: >-
    Eligibility is restricted to adults aged 40 years or older who are able to provide
    consent, so no minors are enrolled and no parental permission or assent procedures
    apply. Pregnancy and gestational diabetes are exclusion criteria, as is type 1
    diabetes; the FAIRhub eligibility module also records a maximum age of 85 years
    and exclusion of adults older than 85. The IRB application notes that Native
    American or non-US indigenous populations are not actively recruited through a
    tribe or tribe-focused organization for this protocol, although the wider AI-READI
    project describes a planned tribal consultation, and engagement with the Native
    Biodata Consortium, as separate activities aimed at collecting similar data within
    a Native American cohort in an ethical and respectful manner; the healthsheet
    states that the study cohort does not include Native Americans or Pacific
    Islanders.
  special_protections:
    - >-
      Transportation assistance in the form of rideshare services was offered to
      participants who reported barriers to travelling to study visits, and the study
      covers reasonable parking, public transit and rideshare costs.
    - >-
      Where a referral comes from a research staff member who has a relationship with
      a potential participant, recruitment and consent are performed by a staff member
      with no pre-existing relationship with that participant.
    - >-
      For participants who have difficulty viewing the consent form, a study team
      member reads it to them; if a person is functionally illiterate a study team
      member signs and notes the reason for the missing signature in the presence of
      an impartial witness.
  source_caveats: >-
    Derived from the stated eligibility criteria and narrative IRB answers. The
    captured IRB application form's protected-population checkbox selections were not
    preserved by text extraction, so the record relies on the narrative answers rather
    than on the form's checked boxes.

participant_privacy:
  - name: Privacy protections applied to the AI-READI dataset
    anonymization_method: >-
      Removal of protected health information as defined by the HIPAA Privacy Rule via
      the Safe Harbor method, together with removal of information related to the sex
      and race/ethnicity of participants and medications used, to prevent
      stigmatization of findings.
    reidentification_risk: >-
      To the extent of the project team's knowledge no uses of the dataset are
      anticipated that could result in unfair treatment or harm, but there is a
      theoretical risk of future re-identification. AI algorithms can infer individual
      patient characteristics and could facilitate individual-level identification.
    privacy_techniques: >-
      A robust data dissemination system, a strict licence agreement and data
      watermarking are implemented for both the public and controlled sets. The
      licence prohibits any attempt to compromise the confidentiality of information
      about a data subject, to identify or contact a data subject, to extract or
      extrapolate identifying information, or to establish a data subject's membership
      in a particular group, and requires licensees to minimise the likelihood that
      data can be memorized, derived, reconstructed or reconstituted through models
      trained on the data. The home environmental sensor and Garmin fitness tracker
      were chosen with participant privacy as a primary concern: they capture no video
      or audio, have no GPS location monitoring, and are not synced with
      participant-owned devices. All identifiable information is kept on encrypted
      computers or servers, or in a locked cabinet or room with restricted access at
      all sites, with access limited to authorized research personnel; the IRB
      protocol records a data security level of 3. All study procedures are conducted
      in private rooms.
    data_linkage: >-
      Two databases are used for distribution: a de-identified database that is
      publicly available, and a second containing some identifiable or sensitive
      information, namely genomic data and race/ethnicity, which requires a data user
      agreement and an approval process developed by the project committee. The
      controlled-access set is described elsewhere in the documentation as also holding
      5-digit zip code, sex, past health records, medications, and traffic and accident
      reports.

participant_compensation:
  - name: Participant stipend and expense reimbursement
    compensation_provided: true
    compensation_type: >-
      Monetary stipend, plus reimbursement of reasonable travel costs
    compensation_amount: >-
      $200 per study visit
    compensation_rationale: >-
      The stipend is provided when the final data and study devices are received,
      typically at least two weeks after the study visit to allow for the 10 days of
      home-based data collection and the return of devices by mail. The payment is not
      prorated. The study also covers reasonable costs for parking, public transit or
      rideshare related to the study visit, though participants may incur unreimbursed
      transport costs where fees exceed $25. The same type and amount of compensation
      is offered to participants invited back in year 4. Compensation was paid through
      the grant funding.

preprocessing_strategies:
  - name: Mapping to standard data models and formats
    preprocessing_details: >-
      Once data were sent from each study site to the central project team, additional
      processing steps were conducted in preparation for dissemination. All data are
      mapped to applicable data standard formats where possible, including the
      Observational Medical Outcomes Partnership Common Data Model for clinical data
      and DICOM for retinal imaging. Images exported from devices in raw proprietary
      formats are converted before upload: Topcon Maestro2 and Triton exports in .fda
      and Heidelberg FLIO exports in .sdt are converted to DICOM, and Garmin exports in
      .FIT are converted to the Open mHealth standard. Blood and urine testing results
      from the NORC lab are provided in .csv. Details of the data processing approach
      for each data domain are described in the dataset documentation.
  - name: Organization under the Clinical Dataset Structure
    preprocessing_details: >-
      The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1.
      Data are organized at the root level into one directory per datatype; within
      each datatype folder there is one folder per modality; within each modality
      folder one folder per device used to collect that modality; and within each
      device folder one folder per participant, named after the participant's study ID
      number. Each datatype directory carries a manifest and follows a declared file
      format standard. Structural metadata are recorded in the
      dataset_structure_description.json file included with the dataset. The CDS was
      developed by the project as a simple and intuitive way to organize clinical
      research datasets and include structured metadata.
  - name: Quality control before upload
    preprocessing_details: >-
      The Data Manager at each data site is responsible for the quality control of all
      data before uploading to FAIRhub. All data are uploaded at regular intervals to
      FAIRhub, a Microsoft Azure cloud-based data management, curation and sharing
      platform developed for this project, and are stored and shared as "AI-ready" so
      as to enable immediate AI/ML research without reformatting and preprocessing.

cleaning_strategies:
  - name: Data entry quality control and editing
    cleaning_details: >-
      Several quality control measures were used at the time of data entry and
      acquisition. Clinical data outside expected minimum and maximum ranges were
      flagged in REDCap and appeared in reports viewed by clinical research
      coordinators and Data Managers, who examined participant records to determine
      whether an error was likely. Data were checked, and edited if errors were
      detected, for credibility based on range checks; incorrect flow through
      prescribed skip patterns; missing data that could be directly filled from other
      portions of an individual's record; and the omission or duplication of records.
      Editing was done only under the guidance and approval of the site principal
      investigator. Where corrected data were available from elsewhere in the
      respondent's answers the error was corrected; where there was no logical or
      appropriate way to correct the data, the site principal investigator reviewed the
      values and decided whether they should be removed.
  - name: De-identification review
    cleaning_details: >-
      The dataset was reviewed internally by AI-READI team members for quality checks
      and to ensure that no personally identifiable information was accidentally
      included. The dataset has not undergone any formal external audit.

labeling_strategies:
  - name: No labeling performed
    labeling_details: >-
      No explicit label or target is associated with each data instance and no labels
      are provided. No specific labeling was performed because the dataset is
      hypothesis-agnostic and aimed at facilitating multiple potential downstream AI/ML
      applications. No labeling software is therefore applicable, and there are no
      formal guidelines for future researchers creating new labels or defining new
      tasks.

raw_sources:
  - name: Retained raw data
    raw_data_details: >-
      The raw data are saved and expected to be preserved by the AI-READI project at
      least for the duration of the project, but are not currently anticipated to be
      shared outside the project team, because they have not been mapped to
      standardized terminologies and because raw data may accidentally include
      personal health information or personally identifiable information, for example
      in free-text fields. There is a possibility that raw data may be included in
      future releases of the controlled-access dataset. All participant images are
      exported from imaging devices in their raw format, and some images required
      conversion to DICOM prior to upload; device data are exported in raw format to
      local storage before transformation.

existing_uses:
  - name: No documented prior uses
    description: >-
      The healthsheet reports that the dataset has not been used for any tasks
      already.

use_repository:
  - name: No repository of dependent works
    repository_details: >-
      There is no repository that links to papers or systems that use the dataset,
      beyond general scholarly indexes. The FAIRhub record displays usage statistics
      including views, citations and approved access requests; at capture the API
      reported 24,636 views and 0 citations.

other_tasks:
  - name: No predefined tasks or guidance for new tasks
    task_details: >-
      The datasheet for this version does not introduce new tasks or labeling; it
      introduces only a new recommended data split. There are no formal guidelines in
      place for future researchers creating new labels or defining new tasks, and no
      resource is identified for tracking defined tasks or label definitions.

future_use_impacts:
  - name: Considerations affecting future uses
    impact_details: >-
      To the extent of the project team's knowledge, no uses of the dataset are
      currently anticipated that could result in unfair treatment or harm; however,
      there is a theoretical risk of future re-identification. Users should also be
      aware that because enrolment is ongoing, the pilot data release and periodic
      updates to data releases may not have achieved balanced distribution across
      groups, and that the cohort excludes racial and ethnic groups such as Pacific
      Islanders and Native Americans and is drawn from predominantly urban,
      hospital-based recruitment. Uniform data collection protocols were implemented
      for all subjects irrespective of race/ethnicity, biological sex or diabetes
      severity across all study sites, and information on device make and model,
      including specific imaging protocols, was documented to support repeatability;
      multiple devices were included for one measure to enhance generalizability and
      represent the range of equipment used in clinical settings.

intended_uses:
  - name: AI and machine learning research on type 2 diabetes
    use_category: Research
    examples:
      - Pseudotime manifold analysis of T2DM disease trajectories
      - Multimodal AI/ML model development on T2DM salutogenesis
      - Studies of the pathogenesis and salutogenesis of type 2 diabetes mellitus
    usage_notes: >-
      Accessing the dataset requires logging in through a verified ID system, agreeing
      to use the data only for type 2 diabetes related research, and agreeing to the
      licence terms. The dataset is intended solely as a research resource. Those who
      download and use AI-READI data are encouraged to publish their results in the
      scientific literature, and use of the dataset requires citation of the resources
      specified at https://docs.aireadi.org.

discouraged_uses:
  - name: Uses restricted by the data licence
    discouragement_details: >-
      The AI-READI dataset licence imposes restrictions on the usage of the data; the
      restrictions are described in the licence files available at
      https://doi.org/10.5281/zenodo.17555036. The licence in the bundle prohibits
      transferring, licensing, sublicensing, selling, assigning, displaying, sharing or
      otherwise conveying any portion of the data or a derivative work to a third party
      that is not another licensee bound by identical terms. Licensees may distribute
      models, algorithms and programs developed or trained using the data provided the
      artefacts do not themselves contain the data or a modified version of it and
      provided the licensee has undertaken all reasonable efforts to minimise the
      likelihood that data can be memorized, derived, reconstructed or reconstituted
      through those models.

prohibited_uses:
  - name: Clinical treatment decisions
    prohibition_reason: >-
      Licensees shall not make clinical treatment decisions based on the data, as it is
      intended solely as a research resource.
  - name: Re-identification and privacy infringement
    prohibition_reason: >-
      Licensees shall not use or attempt to use the data, alone or in concert with
      other information, to compromise or otherwise infringe the confidentiality of
      information on an individual who is the source of any data, or their right to
      privacy; to identify or contact any individual data subject or group of data
      subjects; to extract or extrapolate any identifying information about a data
      subject; to establish a particular data subject's membership in a particular
      group of persons; or otherwise to cause harm or injury to any data subject.
  - name: Onward sharing outside the licensee community
    prohibition_reason: >-
      Sharing any portion of the data or any derivative work with anyone other than
      another licensee bound by an identical agreement is prohibited; termination
      follows automatically on any breach, and the licensee must then delete all copies
      of the data and cease all use.

file_collections:
  - id: https://fairhub.io/datasets/3#cardiac_ecg
    name: cardiac_ecg
    path: cardiac_ecg
    collection_type: processed_data
    description: >-
      Electrocardiogram data collected by a 12-lead protocol (the current standard),
      Holter monitor, or smartwatch. Contains the ecg_12lead modality directory with
      the philips_tc30 device directory, and a manifest.tsv metadata file.
    conforms_to: WaveForm DataBase (WFDB), https://wfdb.readthedocs.io/en/latest/wfdb.html
  - id: https://fairhub.io/datasets/3#clinical_data
    name: clinical_data
    path: clinical_data
    collection_type: processed_data
    description: >-
      Clinical data collected through REDCap. Each CSV file in this directory is a
      one-to-one mapping to the OMOP CDM tables. Includes a dqd_omop.json metadata
      file.
    conforms_to: >-
      Observational Medical Outcomes Partnership (OMOP) Common Data Model (CDM),
      https://ohdsi.github.io/TheBookOfOhdsi
  - id: https://fairhub.io/datasets/3#environment
    name: environment
    path: environment
    collection_type: processed_data
    description: >-
      Data collected through an environmental sensor device custom built for the
      AI-READI project. Contains the environmental_sensor modality directory with the
      leelab_anura device directory, and a manifest.tsv metadata file.
    conforms_to: >-
      Earth Science Data Systems (ESDS) ASCII file format guidelines,
      https://www.earthdata.nasa.gov/esdis/esco/standards-and-practices/ascii-file-format-guidelines-for-earth-science-data
  - id: https://fairhub.io/datasets/3#retinal_flio
    name: retinal_flio
    path: retinal_flio
    collection_type: processed_data
    description: >-
      Data collected through fluorescence lifetime imaging ophthalmoscopy (FLIO), an
      imaging modality for in vivo measurement of lifetimes of endogenous retinal
      fluorophores. Contains the flio modality directory with the heidelberg_flio
      device directory, and a manifest.tsv metadata file.
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM), http://medical.nema.org/
  - id: https://fairhub.io/datasets/3#retinal_oct
    name: retinal_oct
    path: retinal_oct
    collection_type: processed_data
    description: >-
      Data collected using optical coherence tomography (OCT), an imaging method using
      lasers that is used for mapping subsurface structure. Contains the structural_oct
      modality directory with heidelberg_spectralis, topcon_maestro2, topcon_triton and
      zeiss_cirrus device directories, and a manifest.tsv metadata file.
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM), http://medical.nema.org/
  - id: https://fairhub.io/datasets/3#retinal_octa
    name: retinal_octa
    path: retinal_octa
    collection_type: processed_data
    description: >-
      Data collected using optical coherence tomography angiography (OCTA), a
      non-invasive imaging technique that generates volumetric angiography images.
      Contains enface, flow_cube and segmentation modality directories, each with
      heidelberg_spectralis, topcon_maestro2, topcon_triton and zeiss_cirrus device
      directories, and a manifest.tsv metadata file.
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM), http://medical.nema.org/
  - id: https://fairhub.io/datasets/3#retinal_photography
    name: retinal_photography
    path: retinal_photography
    collection_type: processed_data
    description: >-
      Retinal photography data, which are 2D images, also referred to as fundus
      photography.
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM), http://medical.nema.org/
  - id: https://fairhub.io/datasets/3#wearable_activity_monitor
    name: wearable_activity_monitor
    path: wearable_activity_monitor
    collection_type: processed_data
    description: >-
      Data collected through a wearable fitness tracker. Contains heart_rate,
      oxygen_saturation, physical_activity and further modality directories, with the
      garmin_vivosmart5 device directory beneath them.
    conforms_to: >-
      Open mHealth,
      https://www.openmhealth.org/documentation/#/schema-docs/schema-library
  - id: https://fairhub.io/datasets/3#wearable_blood_glucose
    name: wearable_blood_glucose
    path: wearable_blood_glucose
    collection_type: processed_data
    description: >-
      Data collected through a continuous glucose monitoring (CGM) device. Contains the
      continuous_glucose_monitoring modality directory with the dexcom_g6 device
      directory, and a manifest.tsv metadata file.
    conforms_to: >-
      Open mHealth,
      https://www.openmhealth.org/documentation/#/schema-docs/schema-library
  - id: https://fairhub.io/datasets/3#root-metadata
    name: Root-level metadata and documentation files
    collection_type: metadata
    description: >-
      Root-level files distributed with the dataset, based on the Clinical Dataset
      Structure: healthsheet.md, LICENSE.txt, participants.json, participants.tsv,
      README.md, study_description.json, dataset_description.json and
      dataset_structure_description.json. The participants.tsv file carries the
      recommended training, validation and test split assignment, and a CHANGELOG file
      records changes between versions.
    conforms_to: >-
      Clinical Dataset Structure (CDS) v0.1.1,
      https://cds-specification.readthedocs.io/en/v0.1.1/

distribution_formats:
  - name: DICOM imaging files
    media_type: application/dicom
    format: DICOM
    access_urls:
      - https://fairhub.io/datasets/3
    description: >-
      Retinal photography, OCT, OCTA and FLIO data are distributed as DICOM. Some
      images were exported from devices in proprietary .fda or .sdt formats and
      converted to DICOM for the dataset.
  - name: Comma-separated value files
    media_type: text/csv
    format: CSV
    access_urls:
      - https://fairhub.io/datasets/3
    description: >-
      Clinical data mapped one-to-one to OMOP CDM tables, environmental sensor data,
      continuous glucose monitor data and laboratory results are distributed as CSV.
      Manifest files are distributed as TSV.
  - name: JSON metadata files
    media_type: application/json
    format: JSON
    access_urls:
      - https://fairhub.io/datasets/3
    description: >-
      Structured metadata files including dataset_description.json,
      study_description.json, dataset_structure_description.json, participants.json and
      dqd_omop.json.
  - name: Markdown documentation files
    media_type: text/markdown
    format: Markdown
    access_urls:
      - https://fairhub.io/datasets/3
    description: >-
      Documentation distributed with the dataset, including README.md and
      healthsheet.md.

distribution_dates:
  - name: FAIRhub release dates
    release_dates:
      - 2024-05-03 (version 1.0.0, DOI 10.60775/fairhub.1)
      - 2024-11-08 (version 2.0.0, DOI 10.60775/fairhub.2)
      - 2025-11-17 (version 3.0.0, DOI 10.60775/fairhub.3)
    description: >-
      De-identified data are released approximately yearly. The healthsheet records
      that the first version was distributed in May 2024, the second in November 2024
      and the third in November 2025. The BMJ Open protocol notes that the publicly
      accessible dataset from pilot data collection was made available in May 2024 and
      that all data collected through 31 July 2024 were made available in November
      2024.

third_party_sharing:
  - name: Public distribution beyond the creating entity
    is_shared: true
    description: >-
      The dataset is distributed and available for public use through the FAIRhub
      platform at https://fairhub.io/, under DOI https://doi.org/10.60775/fairhub.3.
      At each release two datasets are made available: a controlled-access set and a
      publicly accessible set with fewer requirements for access; the controlled-access
      set contains all data available in the public set plus more sensitive data
      available only to scientists whose institutions have completed legal and privacy
      use agreements with the AI-READI research programme.

license_and_use_terms:
  name: AI-READI data licence and terms of use
  license_terms: >-
    The dataset is licensed under a custom licence tailored to enable reuse of the
    AI-READI dataset, and other clinical datasets, for commercial or research purposes
    while imposing strong requirements around data usage, security and secondary
    sharing to protect study participants, especially when data are reused for AI and
    ML applications. Version 3.0.0 names "AI-READI custom license v2.0" at
    https://doi.org/10.5281/zenodo.17555036, and the FAIRhub page displays the licence
    as "Health Data License". The licence version captured in the bundle is version
    1.0, a Data License Agreement issued by the University of Washington as Licensor
    (Zenodo DOI 10.5281/zenodo.10642459). Under those terms the Licensor grants a
    non-exclusive, non-transferable licence to download, reproduce and use the data and
    to create derivative works for research and commercial purposes; the licensee may
    not convey any portion of the data or derivative works to anyone other than another
    licensee bound by identical terms; the licensee may distribute models, algorithms
    and programs trained on the data provided they do not contain the data and provided
    reasonable efforts are made to minimise memorisation or reconstruction; the
    licensee may not make clinical treatment decisions from the data nor attempt
    re-identification; the licensee must acknowledge the source and any funder in
    publications; the licensee must comply with NIH Genomic Data Sharing Policy
    security and privacy standards; the agreement terminates automatically on breach,
    after which all copies must be deleted; title and all intellectual property rights
    remain with the Licensor; the data are provided "as is" without warranty; liability
    is capped in aggregate at one US dollar except where law prohibits limitation for
    death or personal injury caused by the Licensor's negligence; and the licensee
    indemnifies the Licensor against claims arising from its use of the data or from
    any model. Accessing the dataset requires logging in through a verified ID system,
    agreeing to use the data only for type 2 diabetes related research, and agreeing to
    the licence terms. The FAIRhub access type is recorded as
    "PublicDownloadSelfAttestationRequired".
  data_use_permission: disease_specific_research
  contact_person: https://orcid.org/0000-0002-7452-1648
  description: >-
    The FAIRhub study description records the central contact as Aaron Lee, MD, reached
    at the address contact@aireadi.org.
  source_caveats: >-
    The licence text in the declared bundle is version 1.0, which grants use "for
    research and commercial purposes"; the version 3.0.0 metadata names a version 2.0
    licence whose text is not in the bundle and states that access requires agreeing to
    use the data only for type 2 diabetes related research. Both statements are
    recorded above rather than merged. The email contact@aireadi.org is the central
    contact address recorded in the FAIRhub study description alongside this
    investigator, not necessarily a personal address.

ip_restrictions:
  name: Intellectual property restrictions
  restrictions:
    - >-
      Title to the data and all industrial and intellectual property rights therein
      remain solely and exclusively with the Licensor and its suppliers; the licensee
      must not take any action inconsistent with that ownership, and any rights not
      expressly granted are reserved.
    - >-
      The licence granted is non-exclusive and non-transferable; all full and partial
      copies of the data made by the licensee are subject to the same terms.
    - >-
      Third-party IP-based or other restrictions on the data associated with the
      instances are referred to the licence at https://doi.org/10.5281/zenodo.17555036.
    - >-
      There are no plans for the researchers involved in collecting the dataset to
      develop commercial products or file for patents, but the dataset is made publicly
      available with a commercial-friendly licence and products or patents may be
      developed from it in the future.

regulatory_restrictions:
  name: Regulatory and compliance restrictions
  regulatory_restrictions:
    - >-
      Export controls and other regulatory restrictions are referred to the dataset
      licence at https://doi.org/10.5281/zenodo.17555036; no separate export control
      regime is identified in the sources.
    - >-
      Licensees must comply with all data security and privacy standards established by
      the US National Institutes of Health under its Genomic Data Sharing Policy, in
      the version current from time to time.
    - >-
      Licensees must comply with all applicable laws, regulations and restrictions
      relating to the distribution and use of the data and of models trained on it.
    - >-
      Access to the controlled-access dataset requires that the requesting scientist's
      institution complete legal and privacy use agreements with the AI-READI research
      programme; requirements for controlled-access datasets were being developed by
      the project's Data Access Committee.
  hipaa_compliant: compliant
  other_compliance: >-
    The FAIRhub oversight module records the study as not FDA-regulated for either drug
    or device and as having no data monitoring committee, with human subject review
    status "Submitted, approved". The study is registered on ClinicalTrials.gov as
    NCT06002048. UC San Diego's Health Data Oversight Committee oversees data sharing
    with other institutions, and California requires inclusion of the Experimental
    Subject's Bill of Rights in the consent form at that site.
  confidentiality_level: restricted
  description: >-
    The public release requires login through a verified ID system and self-attestation
    to the licence terms, and a separate controlled-access tier requires an
    institutional data use agreement, so the dataset is not unrestricted.

maintainers:
  - name: AI-READI team
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. The dataset is hosted on
      FAIRhub through Microsoft Azure. FAIRhub is a cloud-based data management,
      curation and sharing platform developed for this project, which the team
      anticipates making available to future data generation projects after testing it
      on the AI-READI dataset. The version 2.0.0 FAIRhub page notes that the platform
      is currently in beta.
    description: >-
      Contact information for the owner, curator or manager of the dataset is provided
      in the README file included with the dataset, which directs enquiries to
      https://aireadi.org/contact and refers to the study_description.json and
      dataset_description.json metadata files for information about the contact person
      or entity, authors and contributors. The FAIRhub study description records a
      central contact of Aaron Lee, MD, at contact@aireadi.org.

updates:
  name: Update and versioning plan
  frequency: >-
    Approximately once a year
  update_details: >-
    The dataset is released as static versions and is not updated in place. Rather,
    new versions are released with additional instances as more study participants
    complete the study visit. There are plans to release new versions approximately
    once a year with additional data from participants enrolled since the previous
    release, and enrolment is ongoing so future versions will include larger numbers of
    participants. Changes between versions are documented in detail in the CHANGELOG
    file included in the dataset and visible at docs.aireadi.org.

retention_limit:
  name: Data retention
  retention_period: No limit
  retention_details: >-
    There are no limits on the retention of the data associated with the instances.

version_access:
  name: Version availability
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  versions_available:
    - Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants
    - Version 2.0.0, DOI 10.60775/fairhub.2, released 8 November 2024
    - >-
      Version 3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025, 2280
      participants, 356,343 files, 3.82 TB
  version_details: >-
    The dataset is released as static versions, each with its own DOI and its own
    documentation version, navigable from a dropdown on the documentation site.
    Version 3.0.0 is the current version. The FAIRhub page for version 2.0.0 states
    that that version of the dataset is no longer accessible and directs users to the
    latest version; version 2.0.0 is recorded there as 2.01 TB across 165,051 files.
    Datasheets exist for earlier versions at
    https://docs.aireadi.org/docs/1/dataset/healthsheet and
    https://docs.aireadi.org/docs/2/dataset/healthsheet. Version 3.0.0 has more
    participants than earlier versions; the data fields and types are largely the same
    as the prior version except that the Snellen visual acuity variables were dropped
    so that only logMAR visual acuity measurements are available, and a new recommended
    data split was added. The healthsheet records that older versions will not
    continue to be updated, since the release model is new versions rather than
    in-place updates.
  source_caveats: >-
    The healthsheet's answer on continued support for older versions addresses the
    update model rather than hosting; the v2.0.0 FAIRhub page states directly that that
    version is no longer accessible.

extension_mechanism:
  name: Contribution and extension
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI
    dataset outside of those who are involved in the project.

external_resources:
  - name: Project and documentation resources
    external_resources:
      - https://docs.aireadi.org
