id: https://doi.org/10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, AI-ready dataset of type 2 diabetes mellitus (T2DM) generated by the
  AI-READI (Artificial Intelligence Ready and Equitable/Exploratory Atlas for Diabetes
  Insights) project, one of the data generation projects of the NIH Common Fund
  Bridge2AI program. Version 3.0.0 contains data from 2280 participants collected
  between 19 July 2023 and 1 May 2025 at three US sites (University of Alabama at
  Birmingham, University of California San Diego, and University of Washington) and
  harmonized across those sites. Data were acquired under a cross-sectional,
  hypothesis-agnostic protocol spanning more than ten domains: self-report
  questionnaires (including depression, diabetes distress and self-care, diet,
  substance use, general health, social determinants of health, and vision), physical
  measurements and vitals, a 12-lead electrocardiogram, monofilament testing for
  peripheral neuropathy, Montreal Cognitive Assessment, photopic and mesopic visual
  acuity and contrast sensitivity, autorefraction, retinal imaging on multiple devices
  (colour fundus photography, OCT, OCTA and fluorescence lifetime imaging
  ophthalmoscopy), clinical laboratory testing of blood and urine, and ten days of
  at-home continuous glucose monitoring, physical activity monitoring and indoor
  environmental sensing. Recruitment was designed to be triple-balanced across
  self-reported race/ethnicity (Asian, Black, Hispanic, White), T2DM status and
  severity (no diabetes; pre-diabetes or lifestyle-controlled; controlled by oral or
  non-insulin injectable medication; insulin-controlled) and biological sex. The
  released version contains no protected health information, and information on sex,
  race/ethnicity and medications used has been removed; more sensitive elements are
  described as being held in a separate controlled-access dataset. The release is
  organized following the Clinical Dataset Structure (CDS) v0.1.1 into nine datatype
  directories and comprises 356,343 files totalling approximately 3.82 TB, distributed
  through the FAIRhub platform under a custom AI-READI data licence.
notes: >-
  The referent of this record is the AI-READI flagship T2DM dataset as published on
  FAIRhub, pinned to its current release, version 3.0.0 (DOI 10.60775/fairhub.3,
  available 2025-11-17). Earlier releases 1.0.0 and 2.0.0 are represented as version
  history rather than as separate referents.
source_caveats: >-
  The declared bundle contains sources that disagree, and this record represents the
  disagreements rather than resolving them silently. (1) The bundle carries both the
  v2.0.0 FAIRhub record (2.01 TB, 165,051 files) and v2.0.0 documentation, and the
  v3.0.0 FAIRhub record, documentation and API metadata (3.82 TB, 356,343 files); the
  v2.0.0 FAIRhub page states that that version is no longer accessible. Sizes, file
  counts and participant counts in this record are the v3.0.0 values. (2) The FAIRhub
  study metadata names "Washington University in St. Louis" (ROR 01yc7t268) as lead
  sponsor and as the affiliation of Aaron Lee and Cecilia Lee, while the BMJ Open
  protocol, the Nature Metabolism comment and the NIH RePORTER record place both
  investigators at the University of Washington, Seattle, and name the University of
  Washington as the awardee organization. Affiliations below are transcribed as each
  source states them. (3) The BMJ Open protocol gives enrolment start as 18 July 2023
  while the FAIRhub study and dataset metadata give 19 July 2023. (4) The
  participant-count series differs between sources: the FAIRhub README change table
  reports 204 / 863 / 1213 participants for the pilot, year 2 and year 3 increments
  totalling 2280, while the healthsheet reports cumulative totals of 204, 1067 and
  2280. (5) The AI-READI licence PDF captured in the bundle is version 1.0 issued by
  the University of Washington (Zenodo DOI 10.5281/zenodo.10642459); the v3.0.0
  metadata names "AI-READI custom license v2.0" at DOI 10.5281/zenodo.17555036, whose
  text is not in the bundle. Licence terms quoted below are from the v1.0 text unless
  attributed otherwise. (6) The captured IRB protocol is a University of Washington
  application form in which most checkbox selections were not preserved by text
  extraction; only the narrative answers are used here. (7) The IRB protocol states a
  target of 4,600 participants while the BMJ Open protocol, the Nature Metabolism
  comment, the NIH RePORTER abstract and the FAIRhub study metadata all state 4,000.
  (8) The expansion of the AI-READI acronym differs across sources: the BMJ Open
  protocol title gives "Artificial Intelligence Ready and Equitable Atlas for Diabetes
  Insights" and its abstract "Artificial Intelligence Ready and Equitable for Diabetes
  Insights", while the NIH RePORTER abstract, the FAIRhub healthsheet and the FAIRhub
  README give "Artificial Intelligence Ready and Exploratory Atlas for Diabetes
  Insights", and the FAIRhub study description gives the official title as "AI Ready
  and Exploratory Atlas for Diabetes Insights".
  (9) The healthsheet answer on external resources does not state whether official
  archival versions of the complete dataset exist, so no archival flag is recorded.
