  name: Demographics
  instance_type: OMOP demographics record
  description: >-
    Demographics recorded to the OMOP data standard, under controlled access, with
    metadata available and a published metadata schema (OMOP schema).
- id: chorus:instance-medication-administration
  name: Medication administration
  instance_type: OMOP medication administration record
  description: >-
    Medication administration with dosing time-stamped upon each infusion change or dose
    administration, recorded to the OMOP data standard under controlled access.
- id: chorus:instance-procedures
  name: Procedures
  instance_type: OMOP procedure record
  description: >-
    Procedures documented by providers, recorded to the OMOP data standard under
    controlled access.
- id: chorus:instance-nursing-flowsheets
  name: Nursing flowsheets
  instance_type: OMOP nursing flowsheet record
  description: >-
    Nursing flowsheets capturing high-frequency documentation, recorded to the OMOP data
    standard under controlled access. The webinar's published-metadata-schema column
    includes an entry for the OMOP schema with extensions.
- id: chorus:instance-diagnoses
  name: Diagnoses
  instance_type: OMOP diagnosis record
  description: >-
    Diagnoses documented by providers, recorded to the OMOP data standard under
    controlled access.
- id: chorus:instance-clinical-notes
  name: Clinical notes
  instance_type: tokenized clinical note
  description: >-
    Clinical notes extracted and tokenized using the OHNLP toolkit, following the OHNLP
    data standard under controlled access, with metadata publication planned and an
    OHNLP open-source schema published. The webinar states that clinical notes are
    stored locally rather than in the enclave, except for tokens.
- id: chorus:instance-imaging
  name: Imaging
  instance_type: DICOM imaging study
  counts: 1000
  description: >-
    Imaging obtained from hospital PACS in the DICOM standard under controlled access,
    with metadata publication planned and a published DICOM schema. As of the September
    2025 webinar approximately 1,000 images were available, with de-identification in
    process for a larger cohort.
- id: chorus:instance-waveform-telemetry
  name: Waveform telemetry
  instance_type: WFDB waveform telemetry recording
  description: >-
    Waveform telemetry captured from bedside monitors and gateway/middleware in the WFDB
    standard under controlled access, with metadata available and a published metadata
    schema described as the PhysioNet schema extended. The webinar states that OMOP and
    telemetry data reside in the enclave.
- id: chorus:instance-waveform-eeg
  name: Waveform EEG
  instance_type: EEG waveform recording
  description: >-
    EEG waveforms drawn from the hospital database in EDF+ and Persyst formats under
    controlled access, with metadata publication planned and published open-source EDF+
    and Persyst schemas. As of the September 2025 webinar, EEG extraction was still in
    process.

relationships:
- id: chorus:relationship-modality-to-admission
  name: Organisation of modalities around patient admissions
  relationship_details: >-
    The dataset is organised around patient admissions, with the structured clinical
    modalities harmonised into the OMOP Common Data Model and additional modalities
    associated with the same admissions; chorus4ai.org reports 7,642 of the released
    admissions as having associated radiology data, indicating that imaging is linked to
    admissions.
  source_caveats: >-
    No source in the bundle documents the explicit linkage keys, join tables or
    identifier scheme used to relate modalities to an admission.

splits:
- id: chorus:split-holdout-test-set
  name: Sequestered holdout test set
  split_details: >-
    The project intends to sequester holdout datasets for external validation: "The
    dataset will also provision a holdout test set, accessible for model external
    validation to aid marketplace adoption of AI-developed models for implementation in
    acute and critical care." The sources describe this as a planned provision and give
    no size, composition or access procedure for the holdout set, and describe no
    train/validation split.

known_limitations:
- id: chorus:limitation-incomplete-modality-availability
  name: Several modalities are not yet fully available
  limitation_type: coverage_limitation
  limitation_description: >-
    As of the September 2025 webinar, EEG extraction was in process, imaging
    de-identification was in process for a larger cohort with approximately 1,000 images
    then available, and clinical notes were stored locally rather than in the enclave
    except for tokens.
  scope_impact: >-
    Users cannot rely on complete coverage of imaging, EEG or full-text clinical notes
    for the admissions represented in the released data.
- id: chorus:limitation-partial-release
  name: Released dataset is a fraction of the anticipated final dataset
  limitation_type: scope_limitation
  limitation_description: >-
    chorus4ai.org reports a current released dataset of 50,000 patient admissions
    against an anticipated final dataset of 100,000 patient admissions across 9 data
    modalities and 14 data-contributing hospitals.
  scope_impact: >-
    Composition, size and modality coverage will change as accrual continues, so
    analyses on the current release are not stable against later releases.
- id: chorus:limitation-critical-care-scope
  name: Restricted to acute and critical care admissions at participating US hospitals
  limitation_type: representativeness_limitation
  limitation_description: >-
    The dataset covers patients with acute or critical illness, described by
    chorus4ai.org as admissions from ICU, PICU and NICU, contributed by 14
    data-acquisition hospitals within a collaboration of 20 academic centers located in
    the United States of America.
  scope_impact: >-
    Findings may not transfer to non-critical-care populations, to non-participating
    hospitals, or outside the United States.
  recommended_mitigation: >-
    The project states that sampling is designed to ensure comprehensive sets of patient
    conditions and clinical treatment strategies and that federated access will enable
    sampling methods to ensure a balanced and diverse cohort.
- id: chorus:limitation-retrospective-only
  name: Retrospective collection only
  limitation_type: methodological_limitation
  limitation_description: >-
    The webinar describes the CHoRUS dataset as retrospective data collection; no
    prospective or interventional data collection is described in any source.
  scope_impact: >-
    Data reflect what was documented in the course of routine care rather than measures
    chosen for research, and are subject to the documentation practices of the
    contributing sites.
- id: chorus:limitation-metadata-publication-pending
  name: Metadata publication pending for several modalities
  limitation_type: integration_limitation
  limitation_description: >-
    The webinar's data-type table records metadata as "Planned" rather than available
    for some modalities, including clinical notes, imaging and EEG waveforms, while
    published metadata schemas are listed for the modality standards.
  scope_impact: >-
    Discovery and interoperability for the affected modalities depend on metadata that
    was not yet published at the time of the source.

known_biases:
- id: chorus:bias-site-selection
  name: Selection of contributing sites
  bias_type: selection_bias
  bias_description: >-
    Data are contributed by 14 data-acquisition hospitals within a collaboration of 20
    academic centers, all within the United States of America, and cover patients
    admitted to intensive care.
  affected_subsets:
  - Patients admitted to the 14 contributing hospitals
  mitigation_strategy: >-
    The project states that it samples to ensure comprehensive sets of patient
    conditions and clinical treatment strategies, and that federated access will enable
    sampling methods to ensure a balanced and diverse cohort.
- id: chorus:bias-representation-management
  name: Representation and equity management
  bias_type: representation_bias
  bias_description: >-
    The sources describe bias as something the project intends to manage rather than
    reporting a measured bias assessment: patient-focused efforts will determine the
    ethical and legal approaches to manage privacy and bias while accounting for social
    determinants of health, and data elements are to feature appropriate contextual
    factors such as geographic distance to the nearest hospital.
  mitigation_strategy: >-
    Ethical and legal approaches to manage privacy and bias, inclusion of social
    determinants of health and contextual factors, and sampling for a balanced and
    diverse cohort.
  source_caveats: >-
    No quantitative bias audit, demographic distribution or fairness evaluation of the
    released data appears in the source bundle.

confidential_elements:
- id: chorus:confidentiality-clinical-records
  name: Confidentiality of clinical records
  confidential_elements_present: true
  confidentiality_details: >-
    The dataset consists of patient clinical records. Every data type in the webinar's
    inventory is listed with "Controlled" access control. Clinical notes are stored
    locally at contributing sites rather than in the shared enclave, except for tokens,
    and access to the dataset requires a signed licensing agreement.

sensitive_elements:
- id: chorus:sensitive-patient-health-information
  name: Patient health information across all modalities
  sensitive_elements_present: true
  sensitivity_details: >-
    The dataset comprises identifiable-origin clinical information about critically ill
    patients: demographics, diagnoses, medication administration, procedures,
    high-frequency nursing flowsheet documentation, clinical notes, imaging from PACS,
    telemetry and EEG waveforms, together with social determinants of health and
    contextual factors such as geographic distance to the nearest hospital.

subpopulations:
- id: chorus:subpopulation-critical-care-units
  name: Critical care unit subpopulations
  subpopulation_elements_present: true
  identification: >-
    chorus4ai.org identifies the released admissions as coming from ICU, PICU and NICU,
    which distinguishes adult, paediatric and neonatal intensive care subpopulations.
    Demographics are captured in OMOP, and social determinants of health are within
    scope of the project.
  distribution: >-
    No source in the bundle quantifies the distribution of admissions across ICU, PICU
    and NICU, or across demographic groups.

acquisition_methods:
- id: chorus:acquisition-clinical-source-systems
  name: Retrospective acquisition from clinical source systems
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details: >-
    Instances are retrospective extracts of data recorded directly in the course of
    clinical care: structured electronic health record entries and provider
    documentation, nursing flowsheet documentation, images from hospital PACS, waveform
    telemetry from bedside monitors and gateway/middleware, and EEG from hospital
    databases. No modality is reported by the patients themselves. Derived content is
    also present: clinical notes are extracted and tokenized with the OHNLP toolkit, and
    OMOP Location entities are geocoded via DeGauss to add contextual factors.
    Verification is supported by validated semantic mappings, a clinical validation SOP
    for contributing to mapping efforts, and characterization reports returned to sites
    following their data submissions.

collection_mechanisms:
- id: chorus:mechanism-site-extract-to-enclave
  name: Site extraction, standardization and upload to a cloud enclave
  mechanism_details: >-
    The project develops capabilities across a multi-center network to acquire,
    standardize, tokenize, store, visualize and label data. Data-contributing sites
    create a CHoRUS-specific clinical data extract following standard operating
    procedures, using tooling in the chorus-ai GitHub organization such as
    chorus-extract-upload, and the data are standardized to the OMOP Common Data Model.
    OMOP and telemetry data reside in a cloud enclave supported by dockerized container
    applications deployed on Azure, while clinical notes remain stored locally except
    for tokens. Federated access enables sampling methods across the network.

sampling_strategies:
- id: chorus:sampling-balanced-diverse-cohort
  name: Sampling for a comprehensive and diverse cohort
  is_sample: true
  source_data: >-
    Routine clinical care records of patients with acute or critical illness at the 14
    CHoRUS data-acquisition hospitals.
  strategies: >-
    The project samples to ensure comprehensive sets of patient conditions and clinical
    treatment strategies, and federated access will enable sampling methods to ensure a
    balanced and diverse cohort.
  source_caveats: >-
    The sources state the sampling intent but do not describe the sampling frame,
    inclusion or exclusion criteria, randomisation, or any verification that the
    resulting cohort is representative; is_random, is_representative and
    representative_verification are therefore left unpopulated.

data_collectors:
- id: chorus:collector-data-contributing-sites
  name: Data site managers at CHoRUS data-contributing sites
  role: Data extraction, curation and submission at contributing hospitals
  collector_details: >-
    Data managers at data-contributing sites follow the Chorus_SOP interactive workflow
    describing the step-by-step process for extracting and contributing clinical data to
    CHoRUS, with links to SOP documents that have undergone internal validation and
    review. Sites provide regular status updates on their progress in creating and
    curating a CHoRUS-specific clinical data extract, submitted either through the
    GitHub interface or a Google Form that triggers a GoogleScript updating GitHub
    issues via the API.
- id: chorus:collector-clinical-collaborators
  name: Clinical collaborators contributing semantic mappings
  role: Semantic mapping and clinical validation
  collector_details: >-
    Clinical expertise is applied to semantic mapping and validation within CHoRUS
    through the chorus-mapping repository, which holds documentation, pooled tabular
    mappings and an associated clinical validation SOP for contributing to mapping
    efforts.
- id: chorus:collector-chorus-subteams
  name: CHoRUS Standards, Data Acquisition and Tooling sub-teams
  role: Coordination of standards, acquisition and tooling across the network
  collector_details: >-
    The Standards, Data Acquisition and Tooling sub-teams within the CHoRUS data
    generation project compile recordings and documentation supporting the acquisition
    workflow and maintain context-specific discussion spaces for standards and data
    acquisition issues.

collection_timeframes:
- id: chorus:timeframe-award-period
  name: NIH award period during which data acquisition takes place
  start_date: '2022-09-01'
  end_date: '2026-11-30'
  timeframe_details: >-
    NIH RePORTER records the project start as 2022-09-01 and the project end as
    2026-11-30 for award 1OT2OD032701-01. These are the award dates during which
    acquisition and standardization occur, not the clinical timeframe covered by the
    retrospective records, which no source in the bundle states. The most recent dataset
    snapshot reported in the bundle is "as of August 2025".

direct_collection:
- id: chorus:direct-collection-from-hospital-systems
  name: Collection from hospital systems rather than from individuals
  is_direct: false
  collection_details: >-
    The webinar describes the CHoRUS dataset as retrospective data collection. Data are
    obtained from documentation already recorded in hospital source systems — the
    electronic health record, PACS, bedside monitors and gateway/middleware, and the
    hospital EEG database — rather than collected directly from the patients concerned.

missing_data_documentation:
- id: chorus:missing-data-modality-completeness
  name: Modality completeness at the time of the source documents
  missing_data_patterns: >-
    Imaging was limited to approximately 1,000 available images with de-identification in
    process for a larger cohort; EEG extraction was in process; full clinical notes were
    not present in the enclave, only tokens; metadata was recorded as "Planned" rather
    than available for clinical notes, imaging and EEG waveforms.
  missing_data_causes: >-
    De-identification and extraction work still in progress, and a decision to keep
    clinical notes stored locally at contributing sites.
  source_caveats: >-
    No source in the bundle documents item-level missingness within the delivered
    modalities, nor any strategy for handling missing values, so handling_strategy is
    left unpopulated.

raw_data_sources:
- id: chorus:raw-structured-ehr
  name: Structured electronic health record data
  source_description: >-
    Structured electronic health record data recorded during routine clinical care at
    the CHoRUS data-contributing hospitals, covering demographics, medication
    administration with dosing time-stamped upon each infusion change or dose
    administration, provider-documented procedures and diagnoses, and high-frequency
    nursing flowsheet documentation.
  source_type: Hospital electronic health record system
  raw_data_format: Site-native EHR extracts standardized to the OMOP Common Data Model
  access_details: >-
    Controlled access; standardized data reside in the CHoRUS cloud enclave.
- id: chorus:raw-clinical-notes
  name: Unstructured clinical notes
  source_description: >-
    Unstructured clinical note text from the electronic health record, extracted and
    tokenized using the OHNLP toolkit.
  source_type: Hospital electronic health record system (free-text documentation)
  raw_data_format: Free text, tokenized to the OHNLP open-source schema
  access_details: >-
    Controlled access; the webinar states that clinical notes are stored locally at the
    contributing sites and that only tokens are held in the enclave.
- id: chorus:raw-imaging-pacs
  name: Imaging from hospital PACS
  source_description: >-
    Clinical imaging retrieved from hospital picture archiving and communication systems
    (PACS).
  source_type: Hospital PACS
  raw_data_format: DICOM
  access_details: >-
    Controlled access; de-identification was in process for a larger cohort at the time
    of the September 2025 webinar.
- id: chorus:raw-waveform-telemetry
  name: Waveform telemetry from bedside monitors
  source_description: >-
    Continuous physiological waveform telemetry acquired from bedside monitors and
    associated gateway/middleware systems.
  source_type: Bedside monitoring systems and gateway/middleware
  raw_data_format: WFDB
  access_details: Controlled access; telemetry resides in the CHoRUS cloud enclave.
- id: chorus:raw-eeg
  name: EEG waveforms from hospital databases
  source_description: >-
    Electroencephalography waveform recordings drawn from the hospital EEG database.
  source_type: Hospital EEG database
  raw_data_format: EDF+ and Persyst
  access_details: >-
    Controlled access; extraction was in process at the time of the September 2025
    webinar.
- id: chorus:raw-sdoh-context
  name: Social determinants of health and contextual factors
  source_description: >-
    Social determinants of health and contextual factors attached to data elements, such
    as geographic distance to the nearest hospital, derived from OMOP Location entities
    geocoded via DeGauss.
  source_type: Derived geospatial and social context
  raw_data_format: OMOP Location entities with geocoded attributes
  access_details: Controlled access as part of the standardized dataset.

raw_sources:
- id: chorus:raw-data-retention
  name: Availability of raw source data
  raw_data_details: >-
    The raw clinical source data are not distributed. Clinical notes remain stored
    locally at contributing sites except for tokens, and each site's contribution is a
    curated CHoRUS-specific clinical data extract rather than a copy of the source
    systems. The bundle states no access route to raw, pre-standardization source data.

preprocessing_strategies:
- id: chorus:preprocessing-omop-standardization
  name: Standardization to the OMOP Common Data Model
  preprocessing_details: >-
    Acquired data are standardized to the OMOP Common Data Model, with a published OMOP
    metadata schema and OMOP schema extensions used for high-frequency nursing flowsheet
    documentation. Validated semantic mappings connect clinical data in various source
    formats to international standards, with pooled tabular mappings and an associated
    clinical validation SOP held in the chorus-mapping repository.
- id: chorus:preprocessing-note-tokenization
  name: Extraction and tokenization of clinical notes
  preprocessing_details: >-
    Unstructured electronic health record text is extracted and tokenized using the
    OHNLP toolkit, following the OHNLP open-source schema. Only tokens are held centrally;
    the notes themselves remain stored locally at the contributing sites.
  used_software:
  - id: chorus:software-ohnlp-toolkit
    name: OHNLP toolkit
    description: >-
      Toolkit used to extract and tokenize unstructured clinical notes, with an
      associated open-source schema.
- id: chorus:preprocessing-waveform-conversion
  name: Waveform conversion and preparation
  preprocessing_details: >-
    Waveform telemetry is prepared to the WFDB standard with a published metadata schema
    described as the PhysioNet schema extended, and EEG waveforms to open-source EDF+
    and Persyst schemas. The chorus_waveform repository holds CHoRUS waveform
    documentation and various waveform conversion scripts, supported by a
    chorus_waveform_resources repository of resources which support the preparation and
    release of waveforms.
  used_software:
  - id: chorus:software-chorus-waveform
    name: chorus_waveform
    description: >-
      CHoRUS waveform documentation and various waveform conversion scripts, written in
      Jupyter Notebook.
    license: MIT
- id: chorus:preprocessing-imaging-deidentification
  name: Imaging de-identification
  preprocessing_details: >-
    Imaging retrieved from PACS is de-identified before release; as of the September 2025
    webinar approximately 1,000 images were available with de-identification in process
    for a larger cohort. A CTP-deid repository is present in the CHoRUS GitHub
    organization.
  used_software:
  - id: chorus:software-ctp-deid
    name: CTP-deid
    description: >-
      Repository in the chorus-ai GitHub organization associated with de-identification.
      The source bundle gives the repository name and public status but no description
      of its contents.
- id: chorus:preprocessing-reidentification-limiting-transforms
  name: Transformations that limit re-identification
  preprocessing_details: >-
    Data are transformed using approaches that limit re-identification, and a privacy
    scan tool for medical records is maintained in the CHoRUS GitHub organization.
  used_software:
  - id: chorus:software-privacy-scan-tool
    name: privacy_scan_tool
    description: A privacy scan tool for medical records, written in Python.
- id: chorus:preprocessing-geocoding
  name: Geocoding of OMOP Location entities
  preprocessing_details: >-
    Contextual and exposome factors are derived by geocoding OMOP Location entities,
    supporting data elements such as geographic distance to the nearest hospital.
  used_software:
  - id: chorus:software-uf-geocoding
    name: UF-Geocoding
    description: >-
      Open source code to geocode OMOP Location entities via DeGauss, forked from
      bihorac-LAB/Exposome and written in Python.
    license: MIT

cleaning_strategies:
- id: chorus:cleaning-characterization-reports
  name: Site characterization reports following submission
  cleaning_details: >-
    The CHoRUSReports repository is dedicated to producing characterization reports that
    are returned to sites following their data submissions, providing a feedback loop on
    submitted extracts. Site status tracking additionally identifies and resolves
    blocking issues in the creation and curation of each site's data extract.
  used_software:
  - id: chorus:software-chorus-reports
    name: CHoRUSReports
    description: >-
      Repository dedicated to producing characterization reports to return to sites
      following their data submissions, written in R.
- id: chorus:cleaning-mapping-validation
  name: Clinical validation of semantic mappings
  cleaning_details: >-
    Validated semantic mappings connect clinical data in various source formats to
    international standards. Clinical collaborators contribute through the
    chorus-mapping repository, which holds documentation, pooled tabular mappings and an
    associated clinical validation SOP. SOP documents in the Chorus_SOP repository have
    undergone an internal validation and review process.

labeling_strategies:
- id: chorus:labeling-annotation-environment
  name: Visualization and annotation environment for prediction targets
  data_annotation_platform: >-
    A CHoRUS visualization and annotation environment, described in the sources as
    planned rather than delivered.
  labeling_details: >-
    A visualization and annotation environment will label data with targets important
    for prediction, as part of capabilities to acquire, standardize, tokenize, store,
    visualize and label data across the multi-center network.
  source_caveats: >-
    The NIH RePORTER abstract sentence describing what the data will be labelled for is
    truncated in the source text ("label data for ;"). No annotation protocol, number of
    annotations per item, inter-annotator agreement or annotator demographics is
    reported anywhere in the bundle.

machine_annotation_tools:
- id: chorus:machine-annotation-ohnlp
  name: Automated processing of clinical text
  tools:
  - OHNLP toolkit
  tool_descriptions: >-
    Clinical notes are extracted and tokenized using the OHNLP toolkit, which supplies
    the OHNLP open-source schema for the resulting tokens.
  source_caveats: >-
    No accuracy, validation or benchmark result for the OHNLP toolkit as applied within
    CHoRUS is reported in the bundle, so tool_accuracy is left unpopulated.

existing_uses:
- id: chorus:existing-use-training-and-publications
  name: Current uses of the dataset
  examples:
  - Training activities
  - Publications
  - >-
    AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2), which expands
    access to Bridge2AI CHoRUS data through engagement, AI training and mentorship and
    equips trainees to apply AI/ML methods to big data analysis using multi-modal
    datasets
  description: >-
    The September 2025 webinar states that the datasets are being used for training
    activities and publications, and describes the AIM-AHEAD training programme as the
    route through which trainees obtain and use the data. No individual publication,
    model or study using the dataset is named in the source bundle.

intended_uses:
- id: chorus:intended-use-clinical-ai-development
  name: Development of AI/ML models for acute and critical care
  use_category: Machine learning and artificial intelligence research in clinical care
  examples:
  - Characterizing acute and critical care illness
  - Predicting complications
  - Measuring treatment response
  - Building ML and AI-derived models to improve the care and outcomes of patients requiring
    critical care
  usage_notes: >-
    The project describes the dataset as AI-ready and intended to catalyze biomedical
    research promoting the patient-focused deployment of AI in acute and critical care.
- id: chorus:intended-use-external-validation
  name: External validation of AI models
  use_category: Model validation
  examples:
  - External validation of AI-developed models against a sequestered holdout test set
  usage_notes: >-
    The holdout test set is intended to aid marketplace adoption of AI-developed models
    for implementation in acute and critical care.
- id: chorus:intended-use-training-and-education
  name: Hands-on AI/ML training and education
  use_category: Training and workforce development
  examples:
  - Hands-on training using the CHoRUS dataset on the Bridge2AI AI/ML for Clinical Care
    Collaborative Cloud
  - Trainee-developed practical use cases and works-in-progress posters
  - Canonical Jupyter Notebooks for AI/ML for Clinical Care
  usage_notes: >-
    chorus4ai.org points to learning opportunities offering hands-on training using the
    CHoRUS dataset, and the AIM-AHEAD programme trains participants on the OHDSI/OMOP
    common data model and the OHDSI tool stack.

other_tasks:
- id: chorus:other-task-best-practices
  name: Establishing best practices and standards for AI in health
  task_details: >-
    Beyond model building, the project produces unified standards harmonizing
    multi-modal EHR, waveform, imaging and text data, validated semantic mappings, and
    standard operating protocols instructing data-contributing sites about best
    practices for curating and delivering interoperable datasets, together with best
    practices for AI in health developed across the Bridge2AI consortium.
- id: chorus:other-task-ethics-and-legal-research
  name: Ethical and legal research on clinical AI data
  task_details: >-
    The consortium evaluates community perspectives on clinical care AI to find ways to
    increase trustworthiness of provenance and privacy in AI, and analyses the existing
    legal and regulatory landscape to develop new approaches, including a legal
    framework for collecting data at scale.

future_use_impacts:
- id: chorus:future-impact-evolving-release
  name: Composition of the dataset will change over time
  impact_details: >-
    The dataset is under active accrual toward an anticipated final dataset of 100,000
    patient admissions and 9 modalities, with imaging de-identification and EEG
    extraction in process and metadata publication planned for several modalities. Users
    should expect the size, modality coverage and metadata of the resource to change
    between the current release and the final dataset, and should record which state of
    the resource an analysis used.
- id: chorus:future-impact-repository-review
  name: Announced review of the project repository
  impact_details: >-
    chorus4ai.org carries a notice that the repository is under review for potential
    modification in compliance with Administration directives, which signals that the
    availability or content of the published resource may change for reasons outside the
    project's scientific plan.

use_repository:
- id: chorus:use-repository-github-org
  name: CHoRUS GitHub organization
  repository_url: https://github.com/chorus-ai
  repository_details: >-
    The chorus-ai GitHub organization houses 28 repositories providing software
    and tooling to interact with and extract insight from clinical data in diverse
    formats, validated semantic mappings for connecting clinical data in various source
    formats to international standards, standard operating protocols instructing data
    contributing sites on curating and delivering interoperable datasets, and project
    management overviews tracking data delivery statuses and task dependencies. A web
    guide for contributors and users of CHoRUS software packages is compiled in the
    chorus-developer repository, and a package status page reports versions, maintainers
    and other metadata about CHoRUS packages.
  source_caveats: >-
    This is a code and documentation repository. The bundle names no registry, index or
    repository that catalogues works using the dataset.

distribution_formats:
- id: chorus:format-omop
  name: OMOP-formatted structured electronic health record data
  format: OMOP Common Data Model (with OMOP schema extensions for nursing flowsheets)
  description: >-
    Demographics, medication administration, procedures, nursing flowsheets and
    diagnoses are provided in the OMOP data standard under controlled access, with a
    published OMOP metadata schema.
- id: chorus:format-ohnlp
  name: Tokenized clinical notes
  format: OHNLP open-source schema
  description: >-
    Clinical notes extracted and tokenized using the OHNLP toolkit, under controlled
    access, with a published OHNLP open-source schema and metadata publication planned.
- id: chorus:format-dicom
  name: Imaging
  format: DICOM
  description: >-
    Imaging from hospital PACS in the DICOM standard under controlled access, with a
    published DICOM schema and metadata publication planned.
- id: chorus:format-wfdb
  name: Waveform telemetry
  format: WFDB
  description: >-
    Waveform telemetry from bedside monitors and gateway/middleware in the WFDB standard
    under controlled access, with a published metadata schema described as the PhysioNet
    schema extended.
- id: chorus:format-edf-persyst
  name: EEG waveforms
  format: EDF+ and Persyst
  description: >-
    EEG waveforms from the hospital database in EDF+ and Persyst formats under
    controlled access, with published open-source EDF+ and Persyst schemas and metadata
    publication planned.

third_party_sharing:
- id: chorus:third-party-sharing-controlled-release
  name: Controlled release to approved external users
  is_shared: true
  description: >-
    The dataset is shared beyond the contributing hospitals under controlled access.
    Participants in the AIM-AHEAD Bridge2AI for Clinical Care Training Program obtain
    access after registration, provisioning of compute and signature of a licensing
    agreement, and access requests are handled by named CHoRUS contacts. The project's
    stated goal is a publicly available, AI-ready critical care dataset, with a holdout
    test set accessible for external model validation.

license_and_use_terms:
  id: chorus:license-and-use-terms
  name: CHoRUS dataset access and use terms
  license_terms: >-
    Access is controlled for every data modality. All participants must sign a licensing
    agreement, included in the registration form, before gaining access to the dataset.
    Access requires registration with name, email and institution; once access is
    granted and compute is provisioned, an email is sent to the participant. A ".edu"
    email address is required in order to gain access to the dataset, with the source
    noting that this requirement is not a barrier to acceptance into the training
    programme and that programme administrators will assist with access if needed.
    Access requests may be directed to dbold@emory.edu or
    jared.houghtaling@tuftsmedicine.org.
  description: >-
    The bundle describes the access procedure and the requirement for a signed licensing
    agreement, but does not name a licence, publish the licence text, or state
    permitted and prohibited downstream uses of the data.
  source_caveats: >-
    No dataset licence identifier appears in any source. The MIT licence stated on the
    chorus-ai GitHub organization applies to the project's code, not the dataset;
    data_use_permission is therefore left unpopulated rather than mapped from the access
    procedure.

ip_restrictions:
  id: chorus:ip-restrictions
  name: Intellectual property terms recorded in the sources
  restrictions:
  - 'CHoRUS GitHub organization (code): "This project is licensed under the MIT License.
    See the LICENSE file for more details."'
  - 'Chorus_SOP repository: Apache-2.0'
  - 'chorus_waveform repository: MIT'
  - 'chorus-extract-upload repository: MIT'
  - 'UF-Geocoding repository: MIT (forked from bihorac-LAB/Exposome)'
  - 'chorus4ai.org disclaimer: "The content on this website is solely the responsibility
    of the authors and does not necessarily represent the official views of the NIH."'
  description: >-
    Every intellectual-property statement in the bundle concerns the CHoRUS software and
    documentation repositories or the project website, not the dataset. No source states
    an intellectual property or licensing restriction attaching to the data themselves
    beyond the signed licensing agreement required for access.

regulatory_restrictions:
  id: chorus:regulatory-restrictions
  name: Regulatory and access-control posture
  confidentiality_level: restricted
  regulatory_restrictions:
  - Controlled access applies to every data modality in the CHoRUS inventory
    (demographics, medication administration, procedures, nursing flowsheets, diagnoses,
    clinical notes, imaging, waveform telemetry and waveform EEG).
  - A signed licensing agreement is required before access is granted.
  - A ".edu" email address is required in order to gain access to the dataset.
  - 'chorus4ai.org notice, quoted verbatim: "This repoitory is under review for potential
    modification in compliance with Administration directives."'
  other_compliance: >-
    The project establishes a legal framework for collecting data at scale and analyses
    the existing legal and regulatory landscape, with patient-focused efforts
    determining the ethical and legal approaches to manage privacy and bias.
  source_caveats: >-
    No source states a HIPAA compliance determination, an export-control status or any
    other formal regulatory certification for the dataset; hipaa_compliant is therefore
    left unpopulated. HIPAA and GDPR appear in the bundle only as topics of the
    AIM-AHEAD training curriculum.

is_deidentified:
  id: chorus:deidentification
  name: De-identification of the CHoRUS dataset
  method: >-
    Data are transformed using approaches that limit re-identification. Unstructured
    clinical notes are extracted and tokenized with the OHNLP toolkit, with the notes
    themselves retained locally at contributing sites and only tokens held centrally.
    Imaging de-identification was in process for a larger cohort as of the September 2025
    webinar, and a CTP-deid repository and a privacy scan tool for medical records are
    maintained in the CHoRUS GitHub organization.
  deidentification_details: >-
    De-identification is described as ongoing rather than complete: approximately 1,000
    images were available with de-identification in process for a larger cohort, and EEG
    extraction had not yet been completed. Access to every modality remains controlled.
  source_caveats: >-
    No source states which identifiers are removed, which de-identification standard is
    applied, or whether any residual identifiable elements remain, so
    identifiable_elements_present and identifiers_removed are left unpopulated.

ethical_reviews:
- id: chorus:ethical-review-community-focus-groups
  name: Community-facing ethics focus groups and ethics pillar review
  reviewing_organization: >-
    CHoRUS consortium, Ethical and Trustworthy AI pillar
  review_details: >-
    The project performs community-facing ethics focus groups to determine what data is
    appropriate for public sharing, as part of an Ethics pillar alongside the Data and
    People pillars. The consortium evaluates community perspectives on clinical care AI
    to find ways to increase trustworthiness of provenance and privacy in AI, and new
    approaches are created as the existing legal and regulatory landscape is analysed.
    Expertise is drawn from team science, law, ethics, health services, biomedical
    science, engineering and scientific journal publications.
  source_caveats: >-
    No institutional review board, ethics committee determination, protocol number or
    review date is named in any source, so no IRB approval is asserted.

data_protection_impacts:
- id: chorus:data-protection-impact-privacy-programme
  name: Privacy and legal risk analysis
  impact_details: >-
    The project analyses the existing legal and regulatory landscape and develops
    patient-focused approaches to manage privacy and bias while accounting for social
    determinants of health. Technical controls include transformations that limit
    re-identification, tokenization of clinical notes with local retention of the note
    text, a privacy scan tool for medical records, and a controlled-access cloud enclave.
    The stated aim is to ensure that the methods promote privacy, accountability and
    clinical benefit.

human_subject_research:
  id: chorus:human-subject-research
  name: Human subject involvement
  involves_human_subjects: true
  special_populations:
  - Patients with acute or critical illness
  - Paediatric intensive care (PICU) patients
  - Neonatal intensive care (NICU) patients
  description: >-
    The dataset is built from the clinical records of critically ill patients; NIH
    RePORTER describes acquiring an AI-ready data set from more than 100,000 critically
    ill patients, and chorus4ai.org identifies the released admissions as coming from
    ICU, PICU and NICU.
  source_caveats: >-
    No IRB approval, ethics review board name or regulatory compliance determination is
    stated in the bundle, so irb_approval, ethics_review_board and regulatory_compliance
    are left unpopulated.

at_risk_populations:
  id: chorus:at-risk-populations
  name: Vulnerable populations represented in the dataset
  at_risk_groups_included: true
  special_protections:
  - Controlled access to every data modality
  - Signed licensing agreement required before access
  - Tokenization of clinical notes with the note text retained locally at contributing
    sites
  - Transformations that limit re-identification, supported by a privacy scan tool for
    medical records
  - Imaging de-identification prior to release
  description: >-
    The dataset covers critically ill patients including paediatric (PICU) and neonatal
    (NICU) intensive care admissions, populations who cannot participate in decisions
    about their data at the time of care.
  source_caveats: >-
    No assent procedure and no guardian consent process is described in any source, so
    assent_procedures and guardian_consent are left unpopulated.

participant_privacy:
- id: chorus:participant-privacy
  name: Privacy protections applied to participant data
  privacy_techniques: >-
    Tokenization of unstructured clinical notes with the OHNLP toolkit; retention of full
    note text locally at contributing sites rather than in the shared enclave;
    transformations that limit re-identification; imaging de-identification; a privacy
    scan tool for medical records; and a controlled-access cloud enclave with a signed
    licensing agreement and institutional email requirement.
  reidentification_risk: >-
    The sources state that data are transformed using approaches that limit
    re-identification but do not quantify residual re-identification risk or report a
    re-identification assessment.
  data_linkage: >-
    Federated access across the network enables sampling methods over the contributing
    sites. Clinical notes remain stored locally except for tokens, so full text is not
    linkable within the enclave. OMOP Location entities are geocoded to derive
    contextual factors such as geographic distance to the nearest hospital.
  source_caveats: >-
    No specific anonymization standard is named, so anonymization_method is left
    unpopulated.

maintainers:
- id: chorus:maintainer-mgh-program-management
  name: Ciera McCrary, CHoRUS Program Manager
  role: academic_institution
  maintainer_details: >-
    chorus4ai.org lists Ciera McCrary, MGH, Program Manager as the project contact, with
    the email address transcribed verbatim from the source as cmccrary@mgh.havard.edu.
  source_caveats: >-
    The email domain "mgh.havard.edu" appears to be misspelled in the source and is
    reproduced here as published rather than corrected.
- id: chorus:maintainer-access-requests
  name: CHoRUS data access request contacts
  role: academic_institution
  maintainer_details: >-
    The CHoRUS GitHub organization overview directs access requests to dbold@emory.edu
    or jared.houghtaling@tuftsmedicine.org, and gives www.bridge2ai.org/chorus as the
    project website.
- id: chorus:maintainer-github-organization
  name: CHoRUS for Equitable AI GitHub organization
  role: academic_institution
  maintainer_details: >-
    The chorus-ai GitHub organization, located in the United States of America and
    linked to https://chorus4ai.org/, maintains 28 repositories of CHoRUS software,
    mappings, SOPs and project management artefacts. Versions, maintainers and other
    metadata about CHoRUS packages are reported on a package status page, and a
    contributor and user guide is compiled in the chorus-developer repository.

updates:
  id: chorus:update-plan
  name: Ongoing accrual and release plan
  update_details: >-
    The dataset is being accrued toward an anticipated final dataset of 100,000 patient
    admissions across 9 data modalities from 14 data-contributing hospitals, against a
    current released dataset of 50,000 admissions. As of the September 2025 webinar,
    imaging de-identification was in process for a larger cohort, EEG extraction was in
    process, and metadata publication was planned for clinical notes, imaging and EEG.
    Data-contributing sites provide regular status updates on their progress in creating
    and curating their data extracts, tracked in the Standards Project and the Data
    Acquisition Project, and characterization reports are returned to sites following
    their submissions.
  source_caveats: >-
    No release cadence, scheduled update interval or planned release date is stated in
    the bundle, so frequency is left unpopulated.

version_access:
  id: chorus:version-access
  name: Versions and their availability
  versions_available:
  - Current Released Dataset (chorus4ai.org)
  - Anticipated Final Dataset (chorus4ai.org)
  version_details: >-
    chorus4ai.org distinguishes a "Current Released Dataset" of 50,000 patient
    admissions, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data
    and 23 Tb of waveform data from an "Anticipated Final Dataset" of 100,000 patient
    admissions, 9 data modalities and 14 data-contributing hospitals. The September 2025
    webinar reports a further snapshot as of August 2025 of 14 hospitals with over
    45,000 unique admissions.
  source_caveats: >-
    No version number, version label, DOI or persistent identifier for any release is
    published in the source bundle, so latest_version_doi is left unpopulated; the named
    dataset states above are the sources' own labels, not formal versions.

extension_mechanism:
  id: chorus:extension-mechanism
  name: Routes for external contribution
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Contributions are organised through the chorus-ai GitHub organization. Data site
    managers follow the Chorus_SOP interactive workflow and may raise issues in the
    Standards Discussions or Data Acquisition Discussions. Clinical collaborators may
    contribute to semantic mapping through the chorus-mapping repository, which holds
    documentation, pooled tabular mappings and an associated clinical validation SOP,
    and are invited to reach out about downstream analytics on the mapped and assembled
    dataset. Software contributors are directed to the chorus-developer web guide and
    the package status page. Community users are invited to browse the resources and the
    public-facing project webpage.

related_datasets:
- id: chorus:related-bridge2ai-programme
  target_dataset: NIH Bridge2AI consortium data generation projects
  relationship_type: is_part_of
  description: >-
    The CHoRUS project is one data generation project of four in the National Institutes
    of Health funded Bridge2AI consortium, and collaborates with Bridge2AI and the three
    other data generation projects, the NIH Bridge2AI Bridge Center, external biomedical
    and clinical organizations, industry and regulatory agencies. The bundle does not
    name the other three data generation projects or their datasets.

external_resources:
