id: https://chorus4ai.org/
name: CHoRUS Dataset
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
description: >-
  A controlled-access, multi-centre, multimodal critical care dataset generated by the
  CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards) for
  Equitable AI project, one of four data generation projects in the NIH Common Fund's
  Bridge2AI consortium. The dataset is assembled retrospectively from routine clinical
  documentation at data-contributing hospitals and is intended to support machine
  learning and artificial intelligence applications that characterise acute and
  critical care illness, predict complications, and measure treatment response. It
  brings together structured electronic health record data standardised to the OMOP
  Common Data Model (demographics, medication administration, procedures, nursing
  flowsheets, diagnoses), clinical notes extracted and tokenized with the OHNLP
  toolkit, imaging drawn from hospital PACS in DICOM, waveform telemetry from bedside
  monitors and gateway/middleware in WFDB, and EEG waveforms from hospital databases in
  EDF+ and Persyst formats. Every modality is under controlled access. chorus4ai.org
  describes a current released dataset of 50,000 patient admissions from ICU, PICU and
  NICU comprising 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology
  data and 23 Tb of waveform data, and an anticipated final dataset of 100,000 patient
  admissions across 9 data modalities from 14 data-contributing hospitals. The
  September 2025 AIM-AHEAD informational webinar states that, as of August 2025, the
  dataset covered 14 different hospitals with over 45,000 unique admissions, that OMOP
  and telemetry data sit in a cloud enclave while clinical notes remain stored locally
  except for tokens, that approximately 1,000 images were then available with
  de-identification in process for a larger cohort, and that EEG extraction was still
  in process. The project also intends to provision a holdout test set accessible for
  external model validation.
page: https://chorus4ai.org/
status: >-
  Actively accruing and partially released. chorus4ai.org distinguishes a "Current
  Released Dataset" from an "Anticipated Final Dataset"; the September 2025 webinar
  records imaging de-identification and EEG extraction as still in process and metadata
  publication as "Planned" for several modalities. No version identifier or release
  date is published in the source bundle.
conforms_to: >-
  OMOP Common Data Model (OHDSI) for structured electronic health record data, with
  OMOP schema extensions for nursing flowsheets; OHNLP open-source schema for extracted
  and tokenized clinical notes; DICOM for imaging; PhysioNet schema (extended) and WFDB
  for waveform telemetry; open-source EDF+ and Persyst schemas for EEG waveforms.
was_derived_from: >-
  Retrospective extracts of routine clinical care documentation held in the electronic
  health record, PACS, bedside monitoring and EEG systems of the CHoRUS
  data-contributing hospitals.
