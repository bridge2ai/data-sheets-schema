source_caveats: >-
  Source disagreement on admission counts is retained rather than reconciled: the
  AIM-AHEAD cohort 2 webinar (September 2025) states that as of August 2025 the dataset
  covered 14 hospitals with "over 45K unique admissions", while chorus4ai.org reports a
  "Current Released Dataset" of 50,000 patient admissions from ICU, PICU and NICU.
  Neither source dates its figure identically and no source reconciles them.
  The webinar's data-type table is partially garbled in the extracted text; the mapping
  from data type to data standard and the "Controlled" access-control value for every
  row are unambiguous, but the per-row alignment of the "Metadata" and "Published
  metadata schema" columns is only partly recoverable, so those values are reported at
  the level the text supports.
  The programme manager contact is transcribed verbatim from chorus4ai.org as
  cmccrary@mgh.havard.edu; the domain appears to be misspelled in the source.
  chorus4ai.org carries the banner "This repoitory is under review for potential
  modification in compliance with Administration directives." (typographical error
  present in the source), quoted verbatim under regulatory_restrictions.
  The MIT and Apache-2.0 licences recorded in this datasheet apply to the CHoRUS GitHub
  code repositories, not to the dataset; no dataset licence is stated anywhere in the
  bundle beyond a signed licensing agreement required for access, so no top-level
  license value is asserted.
  The GitHub organization overview is a historical supplement captured 2025-11-14 and
  retained by the manifest curation note because the current source sheet no longer
  lists it; its repository, SOP, standards and tooling detail is not corroborated by the
  current project website.
  Trainee eligibility, the $8,000 stipend, travel allowances, application deadlines and
  curriculum content in the webinar describe the AIM-AHEAD Bridge2AI for Clinical Care
  Training Program, not the dataset or its participants, and are therefore not recorded
  as dataset properties; only the webinar's dataset-access requirements are.
  Keywords are the NIH RePORTER "Preferred terms" list for award 1OT2OD032701-01,
  reproduced in full and in source order rather than selected.
  The title is the project title as published by NIH RePORTER and the CHoRUS GitHub
  organization README; the sources give the resource itself only the informal names
  "CHoRUS Dataset" and "Bridge2AI for Clinical Care Dataset", and publish no formal
  dataset title. The dataset id is set to the project's canonical URL because no
  dataset identifier, accession or DOI is published in the bundle.
  The bundle states no IRB determination, no participant consent process, no DOI, no
  version identifier, no dataset licence, no file-level inventory and no dataset
  release date; those slots are omitted rather than inferred.

purposes:
- id: chorus:purpose-ai-ready-critical-care-dataset
  name: Develop a publicly available, AI-ready critical care dataset
  response: >-
    The project's overarching goal is to develop a publicly available, AI-ready critical
    care dataset, while ensuring the methods promote privacy, accountability and
    clinical benefit, and while promoting a new generation of AI clinicians and
    scientists.
- id: chorus:purpose-ml-ai-applications
  name: Generate data for ML/AI applications in acute and critical illness
  response: >-
    The CHoRUS data generation project meets the need of generating data for ML/AI
    applications aimed at characterizing acute and critical care illness, predicting
    complications, and measuring treatment response among patients with acute or
    critical illness.
- id: chorus:purpose-holdout-external-validation
  name: Provision a holdout test set for external model validation
  response: >-
    The dataset will also provision a holdout test set, accessible for model external
    validation to aid marketplace adoption of AI-developed models for implementation in
    acute and critical care.
- id: chorus:purpose-grand-challenge-recovery
  name: Answer the grand challenge of improving recovery from acute illness
  response: >-
    The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving
    recovery from acute illness.
- id: chorus:purpose-ethically-sourced-data-and-tools
  name: Create ethically sourced datasets and tools and best practices for AI in health
  response: >-
    The CHoRUS project is one data generation project of four in the National Institute
    of Health (NIH) funded Bridge2AI consortium. The goal is to work with projects to
    create ethically sourced datasets and tools around Artificial Intelligence and to
    create best practices for AI in health.

tasks:
- id: chorus:task-characterize-critical-illness
  name: Characterizing acute and critical care illness
  response: >-
    Machine learning and artificial intelligence applications aimed at characterizing
    acute and critical care illness among patients with acute or critical illness.
- id: chorus:task-predict-complications
  name: Predicting complications
  response: >-
    Machine learning and artificial intelligence applications aimed at predicting
    complications among patients with acute or critical illness.
- id: chorus:task-measure-treatment-response
  name: Measuring treatment response
  response: >-
    Machine learning and artificial intelligence applications aimed at measuring
    treatment response among patients with acute or critical illness.
- id: chorus:task-external-model-validation
  name: External validation of AI models
  response: >-
    A sequestered holdout test set is intended to be accessible for external validation
    of models, to aid marketplace adoption of AI-developed models for implementation in
    acute and critical care.
- id: chorus:task-prediction-target-labeling
  name: Labeling data with prediction targets
  response: >-
    A visualization and annotation environment will label data with targets important
    for prediction.

addressing_gaps:
- id: chorus:gap-critical-care-ai-infrastructure
  name: Absence of infrastructure for AI/ML in critical care
  response: >-
    There is an urgent need for infrastructure to support artificial intelligence and
    machine learning (AI/ML) in critical care. Developing high-resolution multi-center
    data sets is a critical first step towards actionable and trustworthy AI.
- id: chorus:gap-diverse-high-resolution-data
  name: Lack of a diverse, high-resolution, ethically sourced AI-ready dataset
  response: >-
    The CHoRUS Network was formed to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set for acute illness recovery, acquiring and
    standardizing a dataset of unprecedented diversity and high resolution.
- id: chorus:gap-legal-ethical-framework
  name: Missing legal and ethical framework for collecting clinical data at scale
  response: >-
    The project establishes a legal framework for collecting data at scale and performs
    community-facing ethics focus groups to determine what data is appropriate for
    public sharing, while analysing the existing legal and regulatory landscape.
- id: chorus:gap-multimodal-standards
  name: Absence of unified standards across multimodal clinical data
  response: >-
    Unified standards are required to harmonize multi-modal EHR, waveform, imaging and
    text data across a multi-center network, including capabilities to acquire,
    standardize, tokenize, store, visualize and label such data.
- id: chorus:gap-ai-literacy-workforce
  name: Limited AI literacy and workforce in the lay and scientific community
  response: >-
    The project cultivates expertise in the lay and scientific community to improve AI
    literacy and utilization through multimodal educational approaches, and develops the
    skills and workforce for a next generation of diverse academic and community AI
    scientists.

