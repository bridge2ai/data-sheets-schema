  name: CHoRUS project website
  external_resources:
  - https://chorus4ai.org/
  description: >-
    Public-facing project website presenting the project overview, team, tools, data
    acquisition, standards, community engagement, ethics, dataset snapshot and learning
    resources, and the programme manager contact. It carries the notice "This repoitory
    is under review for potential modification in compliance with Administration
    directives."
- id: chorus:resource-github-organization
  name: CHoRUS for Equitable AI GitHub organization
  external_resources:
  - https://github.com/chorus-ai
  - https://chorus4ai.org/
  description: >-
    GitHub organization with 28 repositories and 37 followers, located in the
    United States of America, licensed under the MIT License at the project level.
    Top languages are JavaScript, Python, Jupyter Notebook, CSS and MDX. The organization
    provides software and tooling for clinical data in diverse formats, validated
    semantic mappings, standard operating protocols for data-contributing sites, and
    project management overviews tracking data delivery status and task dependencies.
