notes: >-
  The dataset contains voice recordings and key metadata and is stated to be
  structured to be Findable, Accessible, Interoperable and Reusable. The project's own
  AI-readiness self-assessment table scores FAIRness, provenance, pre-model
  explainability and ethics at 100%, characterization at 80% (data quality criterion
  not met), computability at 75% (contextualized criterion not met) and sustainability
  at 50% (domain-appropriate and associated criteria not met).
source_caveats: >-
  Sources in the bundle disagree on the size the collection is aiming for. The
  project documentation states a flagship dataset of 10,000 voices and an
  anticipated enrollment count of 10,000 by 2027; the IRB protocol states a sample
  size of 30,000 participants, reached by collaboration with participating
  institutions and existing cohorts. Both are ranked at the same tier of the input
  manifest, so neither is preferred and both are recorded here. The audiomics white
  paper, which the manifest ranks lower, states a primary deliverable of 30,000
  human voices. Two DOIs identify this resource and they are not interchangeable:
  10.13026/37yb-1t42 is the DOI the source labels "DOI (latest version)", used here
  as the record identifier, and 10.13026/8xbn-nq66 is the DOI of version 3.1.0, the
  release this record describes. Several statements in the project documentation's
  healthsheet were written for an earlier release — they name v2.0.0 as the current
  version and Health Data Nexus as the distribution platform — and are recorded here
  only where the accompanying scope is explicit.
