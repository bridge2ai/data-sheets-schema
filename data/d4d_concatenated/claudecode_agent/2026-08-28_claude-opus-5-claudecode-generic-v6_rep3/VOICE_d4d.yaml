purposes:
- name: Ethically sourced voice database for AI research
  response: >-
    To generate a large-scale, ethically sourced voice, speech and cough database
    linked to health metadata in order to support AI-driven research, and to make it
    publicly available so that it can serve as the foundation for voice AI research.
- name: Flagship standardized dataset of voices linked to health information
  response: >-
    To create a flagship, standardized and ethically sourced dataset of 10,000 voices
    linked to health information to fuel research and discovery in voice biomarkers.
- name: Integration of voice as a biomarker in clinical care
  response: >-
    To integrate the use of voice as a biomarker of health in clinical care by
    building predictive models that assist in screening, diagnosis and treatment of a
    broad range of diseases, including several with unmet clinical needs.
- name: Infrastructure for privacy-preserving multi-institutional analysis
  response: >-
    To develop software and cloud infrastructure for automated voice data collection
    through a smartphone application, and to implement federated learning so that
    multi-institutional data can be analyzed while minimizing data sharing and
    preserving patient privacy.
- name: Standards for acoustic and voice data
  response: >-
    To introduce the field of acoustic biomarkers by developing new standards of
    acoustic and voice data collection and analysis for voice AI research, and to
    create new bioinformatics standards for voice data so that datasets are
    interoperable.
tasks:
- name: Disease detection and classification from voice
  response: >-
    Training machine-learning models for disease detection and classification using
    voice data, with labels drawn from diagnostic categories including vocal
    pathologies, neurological disorders, psychiatric conditions and respiratory
    disorders.
- name: Screening, diagnosis and monitoring via voice biomarkers
  response: >-
    Supporting clinical research in disease screening, diagnosis and monitoring
    through voice biomarkers, including model pretraining, fine-tuning, benchmarking
    and validation.
addressing_gaps:
- name: Absence of large, diverse voice datasets
  response: >-
    Existing work on machine-learning voice diagnosis produced promising results but
    used sample sizes that were too small or lacked the key metadata needed to train
    robust, clinically useful models; there is a crucial need for large datasets that
    capture diverse populations and disease statuses alongside other established
    physiologic biomarkers.
- name: Lack of collection standards
  response: >-
    Comparing studies and pooling data is challenging because there are no existing
    standards for how voice and other acoustics are measured and collected.
- name: Quality and accuracy of acoustic and clinical data
  response: >-
    Ensuring quality and accuracy of acoustic data and associated clinical data
    through clinical validation and evidence-based recording protocols.
- name: Diversity benchmarks and algorithmic bias
  response: >-
    Creating benchmarks of diversity metrics and minimizing the risk of algorithmic
    bias in models trained on voice data.
- name: Private industry datasets that cannot be audited
  response: >-
    Industry holds vast amounts of voice data but lacks accurate clinical or
    demographic information, which prevents external auditing of training datasets
    for fair representation of diverse populations; the limited size, quality and
    diversity of existing open-source datasets is a barrier to validated algorithms.
