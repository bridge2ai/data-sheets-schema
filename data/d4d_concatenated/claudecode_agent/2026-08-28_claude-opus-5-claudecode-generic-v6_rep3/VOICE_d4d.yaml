id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health
  information'
description: >-
  An ethically sourced, demographically diverse dataset of derived voice, speech and
  respiratory-sound features linked to clinical and demographic health information,
  produced by the Voice project of the NIH Common Fund Bridge2AI program. The adult
  release distributed on PhysioNet covers 833 participants recruited at five North
  American sites in five disease cohort categories — voice disorders, neurological
  and neurodegenerative disorders, mood and psychiatric disorders, respiratory
  disorders, and controls. Participants performed a standardized battery of acoustic
  tasks (sustained vowels, glides, diadochokinesis, validated passages, free speech,
  cough and breathing) on a tablet application, completed demographic, confounder
  and disease-specific validated questionnaires, and consented to clinician
  validation of their diagnoses against gold standards. The published release
  contains derived representations of the audio — spectrograms, Mel spectrograms,
  MFCCs, articulatory and phonetic features, pitch, loudness and periodicity — in
  Parquet files, together with tab-delimited phenotype tables and per-recording
  metadata, each accompanied by a JSON data dictionary. The original audio waveforms
  are withheld from this release and are distributed separately under controlled
  access.
