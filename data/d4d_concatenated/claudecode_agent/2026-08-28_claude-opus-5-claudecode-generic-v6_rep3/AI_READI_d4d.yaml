source_caveats: >-
  Sources in the declared bundle disagree on six points, resolved by the source ranking in
  data/preprocessed/source_manifest.yaml (lowest tier strongest). (1) Expansion of the acronym: the
  FAIRhub structured metadata, its healthsheet and README, the RO-Crate and NIH RePORTER all write
  "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights", while the BMJ Open
  protocol and the Nature Metabolism comment write "Artificial Intelligence Ready and Equitable Atlas
  for Diabetes Insights"; the tier-1 structured metadata and RO-Crate were preferred. (2) Target
  enrollment: the FAIRhub study description (tier 1), the BMJ Open protocol and the Nature Metabolism
  comment give 4,000 participants; the University of Washington IRB protocol form (tier 2) gives
  4,600. The tier-1 figure of 4,000 is stated. (3) Size and file count: the FAIRhub record for
  version 3.0.0 gives 3.82 TB across 356,343 files, while the retained FAIRhub record for version
  2.0.0 gives 2.01 TB across 165,051 files; the version 2.0.0 page states "This version of the
  dataset is no longer accessible", and this record describes version 3.0.0, so the version 3.0.0
  figures are stated. (4) Start of data collection: the FAIRhub structured metadata (tier 1) gives
  2023-07-19, while the BMJ Open protocol (tier 3) states that enrollment began on 18 July 2023; the
  tier-1 date is stated. (5) Responsible organization and ethics review: the FAIRhub structured
  metadata and the RO-Crate (both tier 1) name Washington University in St. Louis as managing
  organization and lead sponsor and "Washington University IRB" as the reviewing body, while the same
  RO-Crate gives a Human Subjects Division, University of Washington postal address and IRB reliance
  contact, and the BMJ Open protocol and the healthsheet state that approval was granted by the
  Institutional Review Board of the University of Washington under protocol STUDY00016228, with
  reliance agreements covering the University of Alabama at Birmingham and the University of
  California, San Diego. Both accounts are recorded rather than merged. The same disagreement reaches the
  principal investigator affiliations: the FAIRhub study description gives Washington University in
  St. Louis with ROR 01yc7t268 for Aaron Lee and Cecilia Lee, while the RO-Crate records the
  principal investigator as "Aaron Lee, Department of Ophthalmology, University of Washington" and
  the Nature Metabolism author list places both at the University of Washington. The structured
  affiliation follows the FAIRhub study description and the alternative is recorded in the creator
  description. (6) De-identification: the
  FAIRhub structured metadata records a de-identification type of "NoDeIdentification" with the
  explanation that no identifiers were collected, while the Nature Metabolism comment states that the
  public set is stripped of protected health information under the HIPAA Privacy Rule "Safe Harbor"
  method; both are recorded.

purposes:
- name: Enable AI and machine learning research into type 2 diabetes salutogenesis
  response: >-
    The purpose for creating the dataset was to enable future generations of artificial
    intelligence/machine learning (AI/ML) research to provide critical insights into type 2 diabetes
    mellitus (T2DM), including salutogenic pathways to return to health.
  description: >-
    Type 2 diabetes mellitus is a growing public health threat, and current understanding of it,
    especially in the context of salutogenesis, is limited. AI-based approaches may improve that
    understanding, but a key obstacle has been the lack of data ready for training AI models. The
    AI-READI dataset is intended to fill that gap.
- name: Publicly share an ethically sourced, AI-ready multimodal dataset
  response: >-
    The primary goal of AI-READI is to collect and publicly share a multimodal, AI-ready dataset for
    studying the pathogenesis and salutogenesis of type 2 diabetes mellitus.
  description: >-
    The project seeks to create a flagship ethically sourced dataset, balanced across self-reported
    race/ethnicity, gender and diabetes disease stage, and to make it publicly available in formats
    that support downstream AI and machine learning research without further reformatting or
    preprocessing.
- name: Provide a blueprint for future AI-ready data generation projects
  response: >-
    AI-READI aims to establish standards, best practices and guidelines for collection, preparation
    and sharing of the data for the purposes of AI/ML, including guidance from bioethicists.
  description: >-
    An additional aim is to share a blueprint for collecting and sharing AI-ready datasets so that
    future data generation projects can follow it, covering project management as well as data
    collection, management and sharing.

tasks:
- name: Reconstruct a temporal atlas of type 2 diabetes development and reversal
  response: >-
    The long-term objective for this project is to develop a foundational dataset in T2DM, agnostic
    to existing classification criteria or biases, which can be used to reconstruct a temporal atlas
    of T2DM development and reversal towards health.
- name: Support pseudotime manifold analysis of disease trajectories
  response: >-
    Data collection was specifically designed to permit downstream pseudotime manifold analysis, an
    approach used to predict disease trajectories by collecting and learning from complex, multimodal
    data from participants with differing disease severity, ranging from normal to insulin-dependent
    type 2 diabetes mellitus.
- name: Define genetic links across racial and ethnic cohorts
  response: >-
    The project generates data to allow future creation of artificial intelligence and machine
    learning algorithms aimed at defining disease trajectories and underlying genetic links in
    different racial and ethnic cohorts.

addressing_gaps:
- name: Absence of well-designed, high-quality multimodal datasets for type 2 diabetes
  response: >-
    The ability to understand and affect the course of complex, multi-organ diseases such as type 2
    diabetes mellitus has been limited by a lack of well-designed, high quality, large, and inclusive
    multimodal datasets.
- name: Lack of racial and ethnic diversity in prior type 2 diabetes studies
  response: >-
    A meta-epidemiological review of type 2 diabetes studies published from 2000 to 2020 indicated
    that samples lacked racial and ethnic diversity, which the balanced AI-READI recruitment design
    is intended to address.
  description: >-
    Certain populations experience a greater burden of type 2 diabetes, exacerbating health
    disparities; the cohort is balanced by self-reported race/ethnicity, diabetes severity and
    biological sex rather than mirroring the demographic distribution of the United States
    population.

