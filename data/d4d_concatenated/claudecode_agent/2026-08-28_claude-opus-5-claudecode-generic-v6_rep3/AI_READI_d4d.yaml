id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI dataset is a multimodal dataset collected from individuals with and without type 2
  diabetes mellitus (T2DM) and harmonized across three data collection sites in the United States.
  Version 3.0.0 contains data from 2,280 participants collected between 19 July 2023 and 1 May 2025,
  spanning survey data, physical measurements, clinical laboratory and questionnaire data mapped to
  the OMOP Common Data Model, 12-lead electrocardiography, retinal photography, optical coherence
  tomography, optical coherence tomography angiography, fluorescence lifetime imaging
  ophthalmoscopy, continuous glucose monitoring, wearable activity monitoring and in-home
  environmental sensing. The composition was designed with downstream artificial intelligence and
  machine learning studies in mind, using recruitment sampling procedures aimed at an approximately
  equal distribution of participants across diabetes severity, and a data acquisition protocol
  spanning multiple domains that enables analyses not feasible with claims or electronic health
  record data alone. The stated goal is to better understand salutogenesis, the pathway from disease
  to health, in T2DM. The release contains 356,343 files totaling approximately 3.82 TB. Data that
  are not considered sensitive personal health data are available for public download after
  authentication and acceptance of the license; the full dataset, which additionally carries 5-digit
  ZIP code, sex, race, ethnicity, genetic sequencing data, past health records, medications and
  traffic and accident reports, is accessible only under a data use agreement. The released data
  contain no protected health information, and information on participant sex, race/ethnicity and
  medication use has been removed from the public version.
