instances:
- name: Participant record
  instance_type: individual patient
  counts: 2280
  label: false
  data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D003924
  description: >-
    Each instance represents an individual patient and consists of all of the data available for that
    individual, across survey data, clinical data, retinal imaging data, environmental sensor data,
    continuous glucose monitor data and wearable activity monitor data. These encompass tabular data,
    imaging data and physiological signal or waveform data. There is no unstructured text data in the
    dataset.
  label_description: >-
    No explicit label or target is associated with any instance; the dataset is hypothesis agnostic
    and provides no labels.
  missing_information:
  - missing:
    - One or more data modalities for a given participant
    - Device read-outs for individual participants
    why_missing:
    - Some participants elected not to participate in some study elements
    - >-
      In a few cases the data collection device did not have any stored results or was returned too
      late to retrieve the results, for example because the battery died or the data were lost
    - >-
      In a few cases a data collision may have occurred at some point in the process and data have
      been lost

anomalies:
- name: Survey non-response and incomplete questionnaire responses
  anomaly_details: >-
    In survey data, skipped questions and incomplete responses are expected.
- name: Wearable device failure and misuse
  anomaly_details: >-
    In wearable data, improper use and technical failure such as battery failure or system
    malfunction are expected. The Garmin Vivosmart 5 had to be charged every two to three days, which
    produces gaps in the activity monitoring record.
- name: Imaging noise and acquisition failure
  anomaly_details: >-
    In imaging data, patient uncooperation, noise that may obscure the images, technical failure such
    as system malfunction, and data transfer failures are expected. Because the Optomed Aurora is a
    handheld camera used on undilated eyes, image quality varies from patient to patient and within
    the same patient; the fluorescence lifetime imaging ophthalmoscopy scan is performed last and
    exposes participants to uncomfortable light levels, so participant compliance may be reduced.

known_biases:
- bias_type: selection_bias
  bias_description: >-
    Participants are volunteers, so volunteer bias is present and may limit the generalizability of
    the results to people who are not represented in the study population.
  affected_subsets:
  - All enrolled participants
- bias_type: representation_bias
  bias_description: >-
    Recruitment is predominantly urban and hospital based, which may not fully capture the range of
    cultural and socioeconomic backgrounds in the wider population.
  affected_subsets:
  - All enrolled participants
  mitigation_strategy: >-
    Three recording sites were strategically selected for geographic variability across the United
    States and to broaden representation across racial and ethnic groups, and individuals from all
    demographic backgrounds were recruited at all three sites.
- bias_type: sampling_bias
  bias_description: >-
    Recruiting Black men into studies is more difficult than recruiting other populations, and
    factors such as medical mistrust and fear for personal safety, stemming from historical events
    including the Tuskegee syphilis study, contribute to under-recruitment; similar trends of
    under-recruitment have been reported for Hispanic and Asian people.
  affected_subsets:
  - Black participants
  - Hispanic participants
  - Asian participants
  mitigation_strategy: >-
    Each site prioritizes the groups least represented in its region: the University of Washington
    concentrates on Asian, then Hispanic, then Black participants; the University of California, San
    Diego prioritizes Hispanic, then Asian, then Black participants; and the University of Alabama at
    Birmingham prioritizes Black, then Hispanic, then Asian participants. All sites recruit White
    participants, and new recruitment strategies would be implemented if balancing on race and
    ethnicity emerged as a challenge.
- bias_type: measurement_bias
  bias_description: >-
    Multiple device makes and models are used for the same measurement across sites, which could
    introduce device-related variation into derived measurements.
  mitigation_strategy: >-
    Uniform data collection protocols were implemented for all subjects irrespective of race,
    ethnicity, biological sex or diabetes severity across all study sites, and information on device
    make and model, including the specific imaging modality used, was documented to ensure
    repeatability. Multiple devices were included for one measure deliberately, to enhance
    generalizability and represent the range of equipment used in clinical settings.

known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: >-
    The study cohort does not include other races and ethnicities such as Pacific Islanders and
    Native Americans, so it does not provide a comprehensive representation of the population.
  scope_impact: >-
    Models derived from the dataset may not generalize to populations that the cohort does not
    include.
- limitation_type: coverage_limitation
  limitation_description: >-
    Eligible participants must be able to speak, read and understand English, which may have created
    challenges in recruiting Hispanic and Asian people. Non-English-speaking participants were not
    initially enrolled because enrolling them would require translating all study materials, not only
    the consent form.
  recommended_mitigation: >-
    Consent forms would be translated into Spanish by University of California, San Diego translation
    services, and native Spanish-speaking research staff would provide interpretation, if recruitment
    goals for Hispanic participants were not being met.
- limitation_type: temporal_limitation
  limitation_description: >-
    Enrollment is ongoing, so the pilot data release and periodic updates to data releases may not
    have achieved balanced distribution across groups, and the pilot study is not balanced across
    race/ethnicity, biological sex, and diabetes presence and severity.
  scope_impact: >-
    Balance across the design strata is an aim of the completed study rather than a property of every
    release.
- limitation_type: scope_limitation
  limitation_description: >-
    The biorepository contains a finite number of samples to share with scientists interested in
    using them in research, and procedures for reviewing and prioritizing written requests were still
    to be developed at the time the study protocol was published.
- limitation_type: methodological_limitation
  limitation_description: >-
    Because of delays in obtaining laboratory results and the absence of standard interpretation
    methods for other data such as imaging, most individual results are unlikely to be clinically
    actionable, and the study team does not provide interpretation of the returned data.

confidential_elements:
- confidential_elements_present: false
  confidentiality_details: >-
    The dataset does not contain data that might be considered confidential, and no personally
    identifiable information is included in it. Access to the full dataset is nonetheless controlled:
    data that are not considered sensitive personal health data are available for public download
    after agreement to a license, while the full dataset is accessible only by entering into a data
    use agreement.

content_warnings:
- content_warnings_present: false
  description: >-
    The dataset creators record that the dataset does not contain data that, if viewed directly,
    might be offensive, insulting, threatening or otherwise pose a safety risk.

subpopulations:
- subpopulation_elements_present: false
  identification: >-
    The released dataset does not label demographic subpopulations: information related to the sex and
    race/ethnicity of participants, as well as medication used, has been removed from the public
    version, and the controlled-access version is where sex, race and ethnicity are held. The study
    design nonetheless recruits into four diabetes groups - no diabetes; pre-diabetes, borderline
    diabetes or lifestyle-controlled diabetes; type 2 diabetes controlled by oral or non-insulin
    injectable medications; and insulin-dependent type 2 diabetes - and aims to recruit approximately
    1,000 participants in each group and 1,000 participants from each of four racial and ethnic
    groups (White, Asian, Hispanic and Black), age- and sex-matched within and between groups.
  distribution: >-
    The recommended-split table in the dataset README reports aggregate counts for the 2,280
    participants in version 3.0.0: by race and ethnicity, 380 Hispanic, 545 Asian, 519 Black and 836
    White; by sex, 951 male and 1,329 female; by diabetes status, 776 with no diabetes, 560
    lifestyle-controlled, 686 controlled by oral or non-insulin injectable medications and 258
    insulin-controlled; mean age 60.8 years with a standard deviation of 11.3 years.
  source_caveats: >-
    The healthsheet answers "No" to whether the dataset identifies demographic subpopulations, which
    is consistent with sex and race/ethnicity being withheld from the public version, while the README
    for the same release reports aggregate demographic counts for the recommended splits. Both are
    recorded.

sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: >-
    The public dataset does not contain data considered sensitive. The controlled-access dataset
    contains data on racial and ethnic origins, location as a 5-digit ZIP code, sex, genetic
    sequencing data, past health records, medications, and motor vehicle accident and traffic
    records. The RO-Crate lists the categories of personal sensitive information carried by the
    collection as electronic health records, wearable monitoring, electrocardiography, environmental
    sensor data, continuous glucose monitor data and wearable accelerometer data.

relationships:
- relationship_details: >-
    All instances are part of the same prospective data generation project, AI-READI. There is
    currently only one visit per participant; approximately 10 per cent of the study population,
    recruited in years 1 and 2, is invited back for a follow-up visit in year 4 of the project, which
    forms the longitudinal arm of the study.

splits:
- split_details: >-
    The release comes with a recommended split into training, validation and test sets in
    70/15/15 proportions, provided in the participants.tsv file included with the dataset. Because
    sex, race and ethnicity are not released with the public version, the project team prepared the
    split so that the validation and test sets are balanced as far as possible for sex,
    race/ethnicity and diabetes status (no diabetes, prediabetes or lifestyle controlled, oral
    medication controlled, and insulin controlled), and for age. The README reports 1,576
    participants in the training set, 352 in the validation set and 352 in the test set, with mean
    ages of 61.1, 60.3 and 60.5 years respectively.

acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: >-
    Acquisition varied by domain. Some data were directly observable, such as laboratory results,
    vital signs and retinal imaging, whereas other data were reported by subjects, such as survey
    responses. Verification of data entry was performed where possible, for example by
    cross-referencing entered medications against medications physically brought in or photographed by
    the participant. Data are collected in a multivariable protocol containing over ten domains,
    including vitals, retinal imaging, electrocardiogram, cognitive function, continuous glucose
    monitoring, physical activity, home air quality, blood and urine collection for laboratory
    testing, and psychosocial variables including social determinants of health.
- name: Recruitment from electronic health records
  acquisition_details: >-
    The recruitment process consists of selecting individuals based on available clinical diagnoses
    using ICD-10 codes and demographic data from the electronic health records of the study sites.
    Patients with type 2 diabetes and pre-diabetes were identified by screening electronic health
    records for ICD-10 codes E11.X and R73.09 respectively; patients without diabetes have no
    encounters with these codes.
- name: Manual human curation
  acquisition_details: >-
    The RO-Crate records the data collection type for the release as manual human curation.

collection_mechanisms:
- name: Single in-person study visit
  mechanism_details: >-
    The protocol is performed as a single visit lasting between 2.5 and 4 hours depending on the
    participant. The IRB protocol states that the visit takes approximately 3 to 4 hours and that, if
    requested by the subject, it may be performed over a couple of days instead of a single visit.
- name: REDCap questionnaires and clinical data capture
  mechanism_details: >-
    REDCap is used to collect patient-reported questionnaire data and the following clinical data from
    the visit: medications assessment, vitals, visual acuity, contrast sensitivity, monofilament test
    results and complete blood count results. Questionnaires may be completed electronically or on
    paper before or after the in-person visit to reduce visit time. The questionnaire battery covers
    screening and eligibility, demographic information, the Center for Epidemiological Studies
    Depression Scale-10, the Problem Areas in Diabetes scale (PAID-5), a diabetes self-care score,
    dietary assessment, an ophthalmic survey, smoking, alcohol, vaping and marijuana use, general
    health, PhenX social determinants of health surveys, and current medications with RxNorm codes.
    Marijuana use is not assessed for participants living in Alabama because it is an illegal
    substance there.
- name: Physical measurements and vital signs
  mechanism_details: >-
    Height, weight, waist and hip circumference are measured, followed by calculation of the waist-hip
    ratio and body mass index. Systolic blood pressure, diastolic blood pressure and heart rate are
    measured twice, two minutes apart, with an automatic oscillometric, medically approved device. The
    blood pressure devices in use across the sites are the OMRON HEM 907XL, the Medline MDS4001
    automatic digital monitor, and the Welch Allyn 6000 series vital signs monitor with a Welch Allyn
    FlexiPort reusable cuff.
- name: 12-lead electrocardiography
  mechanism_details: >-
    A 12-lead electrocardiogram is performed with a Philips Pagewriter TC30 Cardiograph (Amsterdam,
    The Netherlands) while the participant sits in a reclining chair or lies supine; the position is
    recorded as 0, 30, 60 or 90 degrees relative to supine.
- name: Peripheral neuropathy and cognitive screening
  mechanism_details: >-
    Peripheral neuropathy is assessed with the monofilament test, which assesses touch perception on
    both feet with shoes and socks removed; participants keep their eyes closed and respond yes or no
    to whether they feel the 10 g filament in three locations on each foot, ten times per location.
    Cognitive screening uses the Montreal Cognitive Assessment, administered electronically on an iPad
    with the MoCA Duo application (MoCA Cognition, Quebec, Canada); the maximum score is 30 and higher
    scores represent better performance.
- name: Vision testing and retinal imaging
  mechanism_details: >-
    Visual acuity and contrast sensitivity are assessed under both photopic and mesopic conditions,
    with the right and left eyes tested separately. Photopic letter visual acuity is measured with the
    M&S Technologies Electronic Visual Acuity tester at 4 metres; mesopic acuity is measured through a
    2.0 neutral density filter. Contrast sensitivity is measured with the Mars letter contrast
    sensitivity chart (Mars Perceptrix) and expressed as log sensitivity. Autorefraction uses a Topcon
    KR 800 auto keratometer/refractor, and lensometry uses NIDEK LM-600P, Topcon CL-200 or Topcon
    CL-300 lensometers. Retinal imaging captures both eyes on each participant using an Optomed Aurora
    IQ handheld non-mydriatic fundus camera, an iCare EIDON widefield TrueColor confocal fundus
    system, a Heidelberg Spectralis HRA optical coherence tomography and angiography system, Topcon
    Maestro2 3D OCT-1 and Triton DRI OCT systems, a Carl Zeiss Meditec Cirrus 5000 Angioplex, and
    Heidelberg fluorescence lifetime imaging ophthalmoscopy. All retinal images are collected under
    dilated conditions except those from the Optomed device.
- name: Blood and urine collection
  mechanism_details: >-
    Blood, approximately 50 to 60 ml, and a urine specimen are collected during the study encounter
    for clinical laboratory assays and biobanking. Participants are not required to fast. One EDTA
    vacutainer is dedicated to a local clinical testing laboratory for complete blood count analysis;
    whole blood, plasma, serum and urine for central assays are batch shipped to the University of
    Washington Nutrition and Obesity Research Center on dry ice approximately once per quarter.
- name: At-home wearable and environmental monitoring
  mechanism_details: >-
    At the end of the in-person visit participants are sent home with three devices used continuously
    for 10 days: a custom-designed home environmental sensor known as the LeeLab Anura, a Garmin
    VivoSmart 5 physical activity monitor and a Dexcom G6 continuous glucose monitor. Participants are
    asked to wear the wristwatch on the non-dominant wrist, though they may choose either wrist, and
    to note where the environmental sensor was placed in the home and which wrist was used. Devices
    are returned by overnight mail or in person. The environmental sensor and fitness tracker were
    chosen with participant privacy as a primary concern: they capture no video or audio, carry no GPS
    location monitoring and are not synced with participant-owned devices. Participants are masked to
    the Dexcom results during the monitoring period. Participants already wearing a Dexcom G6 may
    either place an additional study sensor at least three inches from their own, or share their
    existing Dexcom Clarity data with the study clinic, optionally including up to 90 days of prior
    glucose values for up to 100 days of data in total.
- name: Electronic health record and licensing record extraction
  mechanism_details: >-
    Medical records are extracted for data on general health, eye health, medical and surgical
    history, diabetes, medications, laboratory records and previous medical imaging. Information on
    car accidents and traffic tickets received in the previous three years is also collected.
- name: Mailed and emailed recruitment
  mechanism_details: >-
    Over the three or more years of study recruitment, approximately 50,000 invitation letters per
    site are sent by both mail and email to people identified as eligible through the electronic
    medical record search. Letters and emails carry personalized links, access codes and QR codes
    directing recipients into an online REDCap recruitment interface where they can read a program
    overview, download the informed consent document, request a call back, complete a screening
    survey and enroll by signing the electronic consent. People without internet access may call
    research staff for alternative methods of enrollment, and follow-up phone calls are made to
    non-responders.

sampling_strategies:
- name: Release completeness
  is_sample: false
  description: >-
    The dataset contains all possible instances: it holds data from all participants enrolled up to
    the release cut-off date rather than a sample drawn from them.
- name: Cohort recruitment sampling
  is_sample: true
  is_random: false
  is_representative: false
  strategies: >-
    Non-probability, stratified sampling with triple balancing. Rather than targeting the demographic
    distribution of the United States population, the study recruits equal numbers of four racial and
    ethnic groups (Asian, Black, White and Hispanic), four categories of type 2 diabetes severity (no
    diabetes; pre-diabetes or lifestyle-controlled diabetes; diabetes treated with oral or
    non-insulin injectable medications; and insulin-controlled diabetes) and biological males and
    females. Participants are recruited in waves, with the composition and size of each wave
    influenced by observed participation characteristics and adjusted by under- and oversampling
    groups as needed.
  source_data: >-
    The study base is all patients aged 40 years or older who had a medical encounter within each
    health system site - the University of Alabama at Birmingham, the University of California, San
    Diego, and the University of Washington - between 2020 and 2025. Eligibility requires the ability
    to provide consent, an age of 40 years or older, presence or absence of type 2 diabetes, and the
    ability to read and speak English; exclusion criteria are age above 85 years, pregnancy,
    gestational diabetes and type 1 diabetes.
  why_not_representative: >-
    The cohort is deliberately balanced across design strata rather than representative of the United
    States population, and the sampling method is recorded as a non-probability sample. The study
    cohort does not include other races and ethnicities such as Pacific Islanders and Native
    Americans.

data_collectors:
- id: ROR:008s83205
  name: University of Alabama at Birmingham
  role: data collection site
  collector_details: >-
    Enrolling site in Birmingham, Alabama. Site data managers oversee data collection, and the data
    manager at this site trained all research personnel across the three sites. The site also hosts
    the study-wide biobank at its Center for Clinical and Translational Science.
- id: ROR:0168r3w48
  name: University of California, San Diego
  role: data collection site
  collector_details: Enrolling site in San Diego, California.
- id: ROR:00cvxb145
  name: University of Washington
  role: data collection site
  collector_details: >-
    Enrolling site in Seattle, Washington. The University of Washington Nutrition and Obesity Research
    Center performs the central laboratory testing on stored, frozen samples.
- name: Study coordinators and research staff
  role: research personnel
  collector_details: >-
    All research personnel at the three data sites who recruited, enrolled and collected data
    underwent training by the data manager at the University of Alabama at Birmingham and worked from
    a detailed Manual of Procedures. Successful completion of a certification process is required for
    all coordinators, including mandatory institutional compliance training for human subject
    research, and coordinators must successfully administer all protocol elements to at least three
    volunteer practice subjects before enrolling and testing participants. Study roles named in the
    IRB protocol include clinical research coordinators, research assistants, project managers,
    database managers, research and data scientists, software and cloud engineers, phlebotomists,
    laboratory assistants and domain experts.
- name: Clinical laboratories
  role: laboratory
  collector_details: >-
    Clinical Laboratory Improvement Amendments-certified laboratories local to each data collection
    site perform complete blood count testing on fresh whole blood samples; all other laboratory tests
    are performed by the University of Washington Nutrition and Obesity Research Center testing
    facility using stored, frozen samples.

collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: >-
    For version 3.0.0 of the dataset the data collection window ran from 19 July 2023 to 1 May 2025,
    covering the pilot phase and the first two years of the study. The overall project spans four
    years: one year for protocol development and training, and years 2 to 4 for subject recruitment
    and data collection. The study status is recorded as enrolling by invitation, with an actual start
    date of 19 July 2023 and an anticipated completion date of 1 January 2027. The BMJ Open protocol
    states that enrollment began on 18 July 2023 and will continue until 30 November 2026, that
    preliminary pilot enrollment ran from 18 July 2023 to 30 November 2023, and that formal data
    collection began on 1 December 2023. Approximately 4 per cent of participants are expected to
    undergo a follow-up examination in year 4.
  source_caveats: >-
    The FAIRhub structured metadata (tier 1) gives 2023-07-19 as the collection start; the BMJ Open
    protocol (tier 3) states 18 July 2023. The tier-1 date is used for the structured start_date and
    both are recorded here.

direct_collection:
- is_direct: true
  collection_details: >-
    Data were collected directly from participants across the three recruiting sites. Recruitment
    pools were identified by screening electronic health records for diabetes and prediabetes ICD-10
    codes among patients who had an encounter with the sites' health systems within the previous two
    years. Driving and accident records are obtained from the Department of Licensing, and no
    additional approvals beyond IRB approval are required for that.

collection_notifications:
- notification_details: >-
    Each individual was aware of the data collection, as this was active data collection directly from
    participants rather than passive collection or secondary use of existing data. People identified
    through the electronic medical record search receive a personalized hardcopy invitation letter and
    an invitation email that direct them into the online REDCap recruitment interface, where they can
    read an overview of the research program, expectations for participation and answers to
    frequently asked questions.

- name: Return of individual results to participants
  notification_details: >-
    Results from heart rate, blood pressure and visual acuity assessments are provided to the
    participant on an exam card before they leave the visit, with instructions in lay language for
    interpreting the data and any follow-up recommendations. Following the ten-day at-home monitoring
    period a Dexcom report giving average hourly, daily and overall blood glucose levels and a Glucose
    Management Indicator is provided by encrypted email, and may cover up to 100 days of collection.
    Laboratory test results with information on normative values are sent by HIPAA-compliant,
    encrypted email at the time of the yearly data release, and are also accessible through a study
    database for which each participant receives an access code; abnormal results are flagged and
    participants are advised to discuss them with their primary care provider or a specialist, with
    the portal carrying a disclaimer to that effect, because the study does not provide interpretation
    of the data. Coordinators alert participants to several incidental findings before they leave the
    visit and recommend emergency care for extreme blood pressure or heart rate readings accompanied
    by symptoms of hemodynamic instability; retinal imaging technicians are trained to detect retinal
    detachment, tumour and optic disc oedema, and suspected cases are referred immediately to the
    emergency department or to an ophthalmologist. Results that lack standard interpretation methods,
    such as retinal images and fitness tracking data, are not returned.

collection_consents:
- consent_details: >-
    Informed consent to participate was required before participation in any part of the protocol,
    including questionnaires. Potential participants could read all consent documentation
    electronically before their visit and give consent with an electronic signature without verbal
    communication with a clinical research coordinator, or could consent in person at the start of the
    visit. The approved consent form for the principal project site, the University of Washington, is
    published with the dataset documentation; the other clinical sites operated under IRB reliance and
    used the same form with minor institution-specific language. Consent scope is recorded as
    specified but not elsewhere categorized: the public version of the dataset can only be used for
    type 2 diabetes-related research, while a private version allows more generic use.

consent_revocations:
- revocation_details: >-
    Participants were permitted to withdraw consent at any time and cease study participation.
    However, any data that had been shared or used up to that point would stay in the dataset. This is
    clearly communicated in the consent document.

missing_data_documentation:
- missing_data_causes: >-
    Not all modalities are available for all participants. Some participants elected not to
    participate in some study elements. In a few cases the data collection device did not have any
    stored results or was returned too late to retrieve the results, for example because the battery
    died or the data were lost. In a few cases a data collision may have occurred at some point in the
    process and data have been lost.
  description: >-
    Missingness is documented qualitatively by cause; the sources do not characterize the missingness
    mechanism statistically and do not describe an imputation or deletion strategy applied before
    release.

raw_data_sources:
- source_description: >-
    Participants themselves, through questionnaires, physical measurements, vision and cognitive
    testing, electrocardiography, retinal imaging, and the wearable and in-home devices they used for
    ten days after the visit.
  source_type: study participants and study devices
  raw_data_format: >-
    Device-native formats before conversion, including .xml for electrocardiography, .csv for the MoCA
    Duo application, laboratory results and environmental sensor data, .fda for Topcon imaging, .sdt
    for fluorescence lifetime imaging ophthalmoscopy and .FIT for the Garmin activity monitor.
- source_description: >-
    Blood and urine specimens collected during the study encounter. Whole blood, blood derivatives and
    urine are used for clinical laboratory testing; the remaining blood is processed into plasma,
    serum, buffy coats, genomic DNA, PAXgene-stabilized RNA and peripheral blood mononuclear cells to
    establish a large repository of biospecimens at the University of Alabama at Birmingham.
  source_type: biospecimens
  access_details: >-
    Biobanked samples will eventually be available to scientists according to procedures and policies
    that were in development at the time of the protocol publication; the project is creating an
    infrastructure to decide who may request and receive specimens for future research.
- source_description: >-
    Electronic health records at the three health systems, used both to identify eligible participants
    and to extract data on general health, eye health, medical and surgical history, diabetes,
    medications, laboratory records and previous medical imaging.
  source_type: electronic health records
- source_description: >-
    State Department of Licensing driving and accident records, covering car accidents and traffic
    tickets received in the previous three years.
  source_type: administrative records

ethical_reviews:
- reviewing_organization: Washington University IRB
  review_details: >-
    The RO-Crate for release 3.0.0 names Washington University IRB as the reviewing organization,
    gives IRB protocol identifier STUDY00016228, records the study as human subjects research that is
    not FDA regulated, and gives a postal contact of Human Subjects Division, University of
    Washington, 4333 Brooklyn Ave NE Box 359470, Seattle, WA 98195-9470, United States, reached
    through an IRB Reliance Team contact point at hsdrely@uw.edu. The
    healthsheet states that initial IRB approval at the University of Washington was received on 20
    December 2022, that the initial approval letter is published with the dataset documentation, and
    that an annual renewal application reporting study status and progress is required and due within
    90 days of expiry. The BMJ Open protocol states that AI-READI was approved by the Institutional
    Review Board of the University of Washington under approval number STUDY00016228, including
    reliance agreements with the IRBs of the University of Alabama at Birmingham and the University of
    California, San Diego. The oversight record states that human subject review status is submitted
    and approved and that there is no data monitoring committee.
  source_caveats: >-
    The tier-1 RO-Crate names "Washington University IRB" while giving a University of Washington
    Human Subjects Division address, and the tier-2 and tier-3 sources name the University of
    Washington IRB. Both are recorded; the sources are not merged into a single institutional claim.
- name: Ethics, legal and social implications review
  review_details: >-
    The RO-Crate names Camille Nebeker, Debra Mathews, Kadija Ferryman and Nicholas Evans as those
    responsible for ethical review of the release. The project states that ethical, legal and social
    implications are considered at every stage of the project cycle, that the design process enacted
    ethical and equitable data collection and management practices, and that guidance from
    bioethicists informs the standards, best practices and guidelines the project establishes.

data_protection_impacts:
- impact_details: >-
    No data protection impact analysis has been conducted for this dataset.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    STUDY00016228, University of Washington Institutional Review Board; initial approval received 20
    December 2022, with annual renewal required within 90 days of expiry.
  ethics_review_board: >-
    The University of Washington Institutional Review Board provided review and oversight, with
    reliance agreements covering the IRBs of the University of Alabama at Birmingham and the
    University of California, San Diego. The RO-Crate records the reviewing organization as Washington
    University IRB.
  regulatory_compliance:
  - >-
    Health Insurance Portability and Accountability Act (HIPAA) Privacy Rule; the public set is
    stripped of protected health information as defined by the HIPAA Privacy Rule using the Safe
    Harbor method.
  - >-
    NIH Genomic Data Sharing (GDS) Policy; licensees must comply with the data security and privacy
    standards established by the National Institutes of Health under that policy, in the version
    published as NIH Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
  description: >-
    The study is an observational cohort study with a cross-sectional time perspective, registered on
    ClinicalTrials.gov as NCT06002048. It is not regulated as a drug or device study by the Food and
    Drug Administration.

informed_consent:
- consent_obtained: true
  consent_type: >-
    Written informed consent, obtained either as an electronic signature through REDCap before the
    visit or in person at the start of the visit.
  consent_documentation: >-
    Consent is documented on the approved consent form for the principal project site, the University
    of Washington, which is published with the dataset documentation. Once signed, the electronic
    consent form is automatically emailed to the subject, who may request an additional copy from the
    study coordinator at any time during the study. Consent is obtained in a private room by a study
    team member, with the opportunity to ask questions before signing and to take additional time if
    required. Where a subject has difficulty reading the form, a study team member reads it to them;
    where a person is functionally illiterate, a study team member signs and notes the reason for the
    missing subject signature in the presence of an impartial witness.
  withdrawal_mechanism: >-
    Participants may withdraw consent at any time and cease study participation; data already shared
    or used up to that point remain in the dataset.
  consent_scope: >-
    Consent covers collection, secondary use, banking and future sharing of the data and specimens.
    The consent form includes a table clarifying which information is publicly available and which
    requires an application and approval process with privacy protection. The public version of the
    dataset may only be used for type 2 diabetes-related research; a private version allows more
    generic use.

at_risk_populations:
  at_risk_groups_included: false
  description: >-
    Eligibility is restricted to adults aged 40 to 85 years who are able to provide consent; pregnancy,
    gestational diabetes and type 1 diabetes are exclusion criteria. Minors and pregnant people are
    therefore not enrolled, and the cohort does not include Pacific Islander or Native American
    participants.
  special_protections:
  - >-
    A Community Advisory Board of 11 people from the three sites, with diversity in race and ethnicity
    as represented in the AI-READI sample, contributes to the development of the protocol; the board
    also evaluates consent forms and research protocols, and its feedback informs modifications.
  - >-
    Through engagement with the Native Biodata Consortium the project provides a co-learning
    opportunity for understanding challenges specific to American Indian and Alaska Native communities
    and for evaluating tools such as data usage agreements, contract negotiations, transparent access
    agreements, and forms of assured return of benefit and sustainable input, control and monitoring
    of Tribal data. The project also planned a tribal consultation to address barriers to and
    facilitators of participation.
  - >-
    Transportation assistance in the form of rideshare services was offered to participants who
    reported barriers to travelling to study visits, and the study covers reasonable parking, public
    transit and rideshare costs related to the visit.

participant_privacy:
- anonymization_method: >-
    No identifiers were collected, so no active de-identification was necessary; the data were checked
    to confirm that no data identifiable under United States HIPAA rules were present. The public set
    is described in the Nature Metabolism comment as stripped of protected health information as
    defined by the HIPAA Privacy Rule via the Safe Harbor method, together with information related to
    the sex and race/ethnicity of participants, to prevent stigmatization of findings.
  reidentification_risk: >-
    AI algorithms can infer individual patient characteristics and could facilitate individual-level
    identification. To prevent re-identification attempts the project implements a robust data
    dissemination system, a strict license agreement and data watermarking for both the public and the
    controlled sets. The dataset creators record a theoretical risk of future re-identification while
    stating that they do not currently anticipate uses that could result in unfair treatment or harm.
  privacy_techniques: >-
    Static watermarking of the distributed data to identify the licensee, with a contractual
    prohibition on removing, obscuring, altering or masking the watermark; a strict license agreement;
    withholding of sex, race, ethnicity, medications and 5-digit ZIP code from the public version; and
    device selection for participant privacy, since the environmental sensor and fitness tracker
    capture no video or audio, carry no GPS location monitoring and are not synced with
    participant-owned devices. All study data and identifiable information are kept on encrypted
    servers or in locked cabinets or rooms with restricted access at all sites, at data security
    level 3, and only authorized research personnel have access to identifiable information.

participant_compensation:
- compensation_provided: true
  compensation_type: Monetary stipend, paid through the grant funding.
  compensation_amount: 200 US dollars for the study visit.
  compensation_rationale: >-
    The stipend is provided when the final participant data and the study devices have been received,
    typically at least two weeks after the study visit, allowing for the ten days of home-based data
    collection and the time needed to return the devices by mail. The payment is not prorated. The
    study additionally covers reasonable costs for parking, public transit or rideshare fees related
    to the study visit; participants may incur unreimbursed transport costs where these exceed 25
    dollars.
  retention_incentives: >-
    The same type and amount of compensation is given to participants asked to return for the year 4
    follow-up visit in the longitudinal arm of the study.

preprocessing_strategies:
- name: Mapping to standardized terminologies and data models
  preprocessing_details: >-
    Once data were sent from each study site to the central project team, additional processing steps
    were conducted in preparation for dissemination. All data were mapped to standardized
    terminologies where possible, such as the Observational Medical Outcomes Partnership Common Data
    Model for observational health data and Digital Imaging and Communications in Medicine for medical
    imaging data. Details of the processing approach for each data domain are described in the dataset
    documentation.
- name: Conversion of proprietary imaging formats to DICOM
  preprocessing_details: >-
    All participant images are exported from the imaging devices in their raw format, and some images
    required conversion to the DICOM standard format before upload. Topcon Maestro2 and Triton data
    are exported in .fda format and converted to DICOM for the dataset, and Heidelberg fluorescence
    lifetime imaging ophthalmoscopy data are exported in .sdt format and converted to DICOM.
- name: Conversion of wearable data to Open mHealth
  preprocessing_details: >-
    Garmin VivoSmart 5 activity data are exported in .FIT format and converted to the Open mHealth
    standard for the dataset. Continuous glucose monitor data are delivered as .csv and organized
    under the same standard.
- name: Local biospecimen processing
  preprocessing_details: >-
    Local processing for plasma, serum and buffy coats is performed using standardized operating
    procedures, ensuring consistent handling for subsequent biobanking and clinical laboratory
    analyses. Peripheral blood mononuclear cell tubes are pre-centrifuged locally and delivered
    overnight to the University of Alabama at Birmingham for centralized isolation and
    cryopreservation, and PAXgene RNA vacutainers, stable for up to 72 hours after collection, are
    shipped overnight from Seattle and San Diego to Birmingham.
- name: Data curation pipelines
  preprocessing_details: >-
    Software engineers on the project are responsible for designing, implementing and testing the data
    curation pipelines, and cloud engineers for the cloud infrastructure customization,
    configuration and deployment that hosts them.

cleaning_strategies:
- name: Quality control at data entry
  cleaning_details: >-
    Several quality control measures were used at the time of data entry and acquisition. Clinical
    data outside expected minimum and maximum ranges were flagged in REDCap and appeared in reports
    viewed by clinical research coordinators and data managers, who examined participant records and
    determined whether an error was likely. Data were checked, and edited where errors were detected,
    for credibility against prespecified reasonable ranges, incorrect flow through prescribed skip
    patterns, missing data that could be filled directly from other portions of an individual's
    record, and the omission or duplication of records. Editing was only done under the guidance and
    approval of the site principal investigator; where there was no logical or appropriate way to
    correct the data, the site principal investigator reviewed the values and decided whether they
    should be removed. The data manager at each data site is responsible for the quality control of
    all data before uploading to FAIRhub.
- name: Internal review before release
  cleaning_details: >-
    The dataset has not undergone any formal external audit. It has been reviewed internally by
    AI-READI team members for quality checks and to ensure that no personally identifiable information
    was accidentally included. No data were excluded from the dataset at the time of preprocessing.

labeling_strategies:
- labeling_details: >-
    No labeling was performed. The dataset is hypothesis agnostic and is aimed at facilitating
    multiple potential downstream AI and machine learning applications, so no explicit label or target
    is associated with any instance and no labeling software is distributed. The project has no formal
    guidelines for future researchers who create new labels or define new tasks.

raw_sources:
- raw_data_details: >-
    The raw data are saved and expected to be preserved by the AI-READI project at least for the
    duration of the project, but are not currently anticipated to be shared outside the project team,
    because they have not been mapped to standardized terminologies and because they may
    inadvertently contain personal health information or personally identifiable information, for
    example in free-text fields. Raw data may be included in future releases of the controlled-access
    dataset. Device data are exported in their raw format to local storage before conversion and
    upload.

other_tasks:
- task_details: >-
    Because the dataset is hypothesis agnostic and carries no labels, it is intended to support tasks
    beyond those the project itself names; the multimodal design is described as gathered to
    facilitate downstream pseudotime manifolds and various applications in artificial intelligence.
    The project states that it has no formal guidelines in place for researchers who wish to create
    new labels or define new tasks on the data.

future_use_impacts:
- impact_details: >-
    To the extent of the dataset creators' knowledge, they do not currently anticipate uses of the
    dataset that could result in unfair treatment or harm. They do record a theoretical risk of future
    re-identification, and note that AI algorithms can infer individual patient characteristics and
    could facilitate individual-level identification, which is why a robust dissemination system, a
    strict license agreement and data watermarking are applied to both the public and the controlled
    sets.

intended_uses:
- use_category: research
  examples:
  - >-
    Artificial intelligence and machine learning research into type 2 diabetes mellitus, including
    salutogenic pathways from disease back to health
  - Pseudotime manifold analysis to predict disease trajectories across diabetes severity
  - >-
    Multimodal model development combining survey, clinical, imaging, waveform, wearable and
    environmental data
  - >-
    Training and validating models using the recommended 70/15/15 participant split supplied with the
    release
  usage_notes: >-
    Use of the dataset requires citation of the resources specified in the AI-READI documentation, and
    licensees agree to acknowledge the licensor, the source and any funder of the data in any papers
    reporting use of the data. Those who download and use AI-READI data are encouraged to publish
    their results in the scientific literature.
- use_category: commercial
  examples:
  - >-
    Making, reproducing and distributing models, algorithms and programs developed, trained or adapted
    using the data, provided they do not themselves contain the data or a modified version of it
  usage_notes: >-
    The license grants a non-exclusive, non-transferable right to download, reproduce and use the data
    and to create derivative works for research, commercial and non-commercial purposes. Before
    disseminating any such model the licensee must undertake all reasonable efforts to minimize the
    likelihood that data can be memorized, derived, reconstructed or reconstituted through the use or
    construction of the model.

prohibited_uses:
- name: Clinical treatment decisions
  prohibition_reason: >-
    The data are intended solely as a research resource, so the license forbids making clinical
    treatment decisions based on them.
- name: Identification of or contact with data subjects
  prohibition_reason: >-
    The license forbids using the data, alone or in concert with other information, to compromise or
    infringe the confidentiality of information about an individual who is the source of any data, to
    invade or compromise the privacy of any data subject, to attempt to identify or contact any data
    subject or group of data subjects, to extract or extrapolate identifying information about a data
    subject, to establish a data subject's membership in a particular group, or otherwise to cause
    harm or injury to any data subject.
- name: Training third-party models
  prohibition_reason: >-
    The license forbids sharing or distributing the data with any third-party model vendor or
    developer for training or development purposes, even where that vendor is party to a HIPAA
    business associate agreement with the licensee's institution, where training includes model weight
    modification and other adjustments to a model's logic or operation. A third-party model may be
    used to analyze the data where the vendor is party to such an agreement and the model's
    interaction with the data is limited to short-term interaction such as prompting or querying.
- name: Bulk reproduction of data in publications
  prohibition_reason: >-
    The license forbids reproducing the data in papers, articles, presentations, analyses, reports or
    publications, except that small representative samples may be reproduced in up to five images or
    figures per paper for illustrative purposes only; larger amounts must not be published, posted or
    made available through supplemental files, zip archives, code packages or other means,
    notwithstanding journal or conference requirements.
- name: Redistribution outside the licensee group
  prohibition_reason: >-
    The license forbids transferring, licensing, sublicensing, selling, assigning, displaying, sharing
    or otherwise conveying any portion of the data or any derivative work to a third party, other than
    another licensee bound by an identical agreement with the licensor and then only for the purpose
    of collaborating on projects involving the data. Derivative data, including synthetic data created
    using the data, are treated as data and are subject to the same restrictions.

