  media_type: application/dicom
  description: >-
    Retinal photography, optical coherence tomography, optical coherence tomography angiography and
    fluorescence lifetime imaging ophthalmoscopy data are distributed as DICOM files.
  access_urls:
  - https://fairhub.io/datasets/3/access
- name: Tabular CSV distribution
  media_type: text/csv
  description: >-
    Clinical data mapped to the OMOP Common Data Model, environmental sensor data and continuous
    glucose monitor data are distributed as CSV files; each CSV file in the clinical data directory
    maps one-to-one to an OMOP CDM table.
  access_urls:
  - https://fairhub.io/datasets/3/access
- name: JSON metadata distribution
  media_type: application/json
  description: >-
    Structured metadata files accompanying the dataset, including dataset_description.json,
    dataset_structure_description.json, study_description.json, participants.json and the OMOP data
    quality dashboard file dqd_omop.json, are distributed as JSON.
  access_urls:
  - https://fairhub.io/datasets/3/access
- name: Markdown documentation distribution
  media_type: text/markdown
  description: >-
    Documentation files distributed with the dataset, including README.md, CHANGELOG.md and
    healthsheet.md, are Markdown.
  access_urls:
  - https://fairhub.io/datasets/3/access

distribution_dates:
- release_dates:
  - '2024-05-03'
  - '2024-11-08'
  - '2025-11-17'
  description: >-
    Version 1.0.0, containing pilot data, was released on 3 May 2024; version 2.0.0, adding the first
    full year of the study, on 8 November 2024; and version 3.0.0, the release this record describes,
    on 17 November 2025. The healthsheet describes these as distributed in May 2024, November 2024 and
    November 2025 respectively.

third_party_sharing:
- is_shared: true
  description: >-
    The dataset is distributed and available for public use through the FAIRhub platform, outside the
    institutions on whose behalf it was created. Onward sharing by a licensee is tightly restricted:
    data may be conveyed only to another licensee bound by an identical agreement, and only for
    collaboration on projects involving the data.

license_and_use_terms:
  license_terms: >-
    The dataset is released under the AI-READI Data License Agreement version 2.0, published at
    https://doi.org/10.5281/zenodo.17555036, with Washington University in St. Louis named as
    licensor. The license is a custom license tailored to enable reuse of the AI-READI dataset and
    other clinical datasets for commercial or research purposes while imposing strong requirements
    around data usage, security and secondary sharing to protect study participants, especially where
    data are reused for artificial intelligence and machine learning applications. It grants the
    licensee a non-exclusive, non-transferable license to download, reproduce and use the data and to
    create derivative works, for research, commercial and non-commercial purposes. Licensees may store
    the data only on servers and devices maintained by and located within their institution or
    employer, or on cloud or remote storage and backup services that have a HIPAA-approved business
    associate agreement in place with that institution. Licensees must comply with the NIH Genomic
    Data Sharing Policy security standards, must not remove or obscure the static watermarking applied
    to the data, and must delete all copies and cease use on termination, which occurs automatically
    on any breach. The data are provided on an "as is" basis without warranty, the licensor's
    aggregate liability is capped at one United States dollar except where the law prohibits such a
    limitation, and the licensee indemnifies the licensor against claims arising from its use of the
    data or any model. FAIRhub labels the license "Health Data License"; the dataset documentation is
    shared under CC-BY 4.0 with no restrictions on its use.
  data_use_permission: disease_specific_research
  description: >-
    Access requires logging in through a verified identity system, agreeing to use the data only for
    type 2 diabetes-related research, and agreeing to the license terms. The access type is recorded
    as public download with self-attestation required. Where an agreement is entered into on behalf of
    an internal group, lab or business unit, authorized users are the legal members of that group by
    contract, employment or student status, and their rights terminate automatically when that
    relationship ends. The RO-Crate carries the copyright notice "Copyright © 2026 AI-READI".

ip_restrictions:
  restrictions:
  - >-
    Title to the data and all industrial and intellectual property rights in it remain solely and
    exclusively with the licensor and its suppliers; any rights not expressly granted are reserved,
    and the licensee must take no action inconsistent with that ownership.
  - >-
    There are no plans for the researchers who collected the dataset to develop commercial products or
    file for patents; the dataset is nonetheless published with a commercial-friendly license, and
    products or patents may be developed from it in future.

regulatory_restrictions:
  regulatory_restrictions:
  - >-
    NIH Genomic Data Sharing Policy: licensees must comply with the data security and privacy
    standards established by the National Institutes of Health under that policy.
  - >-
    HIPAA Privacy Rule: the public set is stripped of protected health information as defined by the
    Privacy Rule using the Safe Harbor method, and cloud or remote storage of the data requires a
    HIPAA business associate agreement with the licensee's institution.
  hipaa_compliant: compliant
  other_compliance: >-
    Licensees agree to comply with all applicable laws, regulations and restrictions relating to the
    distribution and use of the data and of models built from it. The study is recorded as not
    regulated by the Food and Drug Administration as either a drug or a device study.
  confidentiality_level: restricted
  source_caveats: >-
    The RO-Crate states a confidentiality level of "HL7:2N (normal)", for which the schema's
    ConfidentialityLevelEnum has no corresponding term; "restricted" was selected because access
    requires authentication and acceptance of license terms, and a controlled tier requires a data use
    agreement.

data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
    description: >-
      Recorded as the managing organization of the dataset and the lead sponsor of the study, and
      named as licensor in the data license agreement.
  access_review_process: >-
    Accessing the dataset requires several steps: logging in through a verified identity system,
    agreeing to use the data only for type 2 diabetes-related research, and agreeing to the license
    terms, which set restrictions and obligations on data usage. The access type is public download
    with self-attestation required. The full dataset, including the more sensitive controlled-access
    content, is accessible only by entering into a data use agreement, and is available only to
    scientists whose institutions have completed legal and privacy use agreements with the AI-READI
    research program. The BMJ Open protocol states that requirements for the controlled-access
    dataset were being developed by the Data Access Committee. Access requests are decided by the
    principal investigators and lead co-investigators at each participating institution, and research
    staff may see data under the supervision of the principal investigators and site principal
    investigators.
  stewardship_roles:
  - >-
    The data manager at each data site is responsible for quality control of all data before uploading
    to FAIRhub, and site data managers oversee the collection process.
  - >-
    A database manager ingests data into the REDCap database and extracts it for processing; research
    and data scientists process data for release and for the development of standards.
  - >-
    During the project the team is creating an infrastructure to decide who may request and receive
    biospecimens from the repository for future research.
  source_caveats: >-
    The tier-1 RO-Crate names the AI-READI Consortium as the data governance committee, while the
    BMJ Open protocol (tier 3) refers to a Data Access Committee that was developing the requirements
    for controlled-access datasets. Both are recorded.

maintainers:
- name: AI-READI Consortium
  role: researcher
  maintainer_details: >-
    The AI-READI team supports and maintains the dataset, which is hosted on FAIRhub through Microsoft
    Azure. Contact for questions, suggestions or feedback is through https://aireadi.org/contact and
    https://docs.aireadi.org/docs/3/contact; the FAIRhub study record gives contact@aireadi.org as the
    central contact address and the Nature Metabolism comment gives leeay@uw.edu as the corresponding
    address. The README included with the dataset is named as the source of contact information for
    the owner and curator.

updates:
  frequency: Approximately once a year.
  update_details: >-
    The dataset is released as static versions and is not updated in place. New versions are released
    with additional instances as more study participants complete the study visit, with plans to
    release approximately once a year adding data from participants enrolled since the previous
    version. Enrollment is ongoing, so future versions are expected to include larger numbers of
    participants. Changes between versions are documented in detail in the CHANGELOG file included
    with the dataset and visible in the documentation site. Version 3.0.0 adds the second year of the
    study to the pilot data and first study year that made up versions 1.0.0 and 2.0.0; the data
    fields and types are largely unchanged from version 2.0.0, except that the Snellen visual acuity
    variables were dropped so that only logMAR visual acuity measurements remain, and version 3.0.0
    adds a new recommended data split.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances. Separately, the
    license requires a licensee to delete all copies of the data in its possession and control,
    including copies held by authorized users, and to cease all use, on termination of the license
    agreement.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - Version 3.0.0, DOI 10.60775/fairhub.3, published 17 November 2025, 2,280 participants
  - Version 2.0.0, DOI 10.60775/fairhub.2, published 8 November 2024, 1,067 participants
  - Version 1.0.0, DOI 10.60775/fairhub.1, published 3 May 2024, 204 participants
  version_details: >-
    One version of the documentation is associated with each version of the dataset, and versions can
    be selected from a dropdown on the documentation site. Datasheets exist for the first version, at
    https://docs.aireadi.org/docs/1/dataset/healthsheet, and for the second, at
    https://docs.aireadi.org/docs/2/dataset/healthsheet. Older versions are not maintained by updating
    them: the FAIRhub page for version 2.0.0 states that "This version of the dataset is no longer
    accessible. Please refer to the latest version." A smaller "mini" version of the dataset is
    separately available for pipeline development, and the FAIRhub structured metadata for version
    3.0.0 records a child record for it.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside those
    involved in the project.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    No active de-identification was necessary because no identifiers were collected; the data were
    checked to confirm that no data identifiable under United States HIPAA rules were present. The
    RO-Crate records the release as de-identified. The Nature Metabolism comment describes the public
    set as stripped of protected health information as defined by the HIPAA Privacy Rule via the Safe
    Harbor method.
  identifiers_removed: >-
    Protected health information; information related to the sex and race/ethnicity of participants;
    and medication used. The controlled-access tier retains 5-digit ZIP code, sex, race, ethnicity,
    genetic sequencing data, past health records, medications, and traffic and accident reports.
  deidentification_details: >-
    Sex and race/ethnicity were removed from the public version to prevent stigmatization of findings.
    A theoretical risk of future re-identification is acknowledged, and data watermarking, a strict
    license agreement and a controlled dissemination system are applied to both public and controlled
    sets to deter re-identification attempts.

variables:
- variable_name: HbA1c
  data_type: float
  unit: '%'
  measurement_technique: Whole blood testing at the University of Washington Nutrition and Obesity
    Research Center
  description: Marker for diabetes; the reference range given by the testing laboratory is 4.0 to 6.0
    per cent.
- variable_name: Glucose
  data_type: float
  unit: mg/dL
  measurement_technique: Serum testing at the University of Washington Nutrition and Obesity Research
    Center
  description: Marker for diabetes; reference range 62 to 125 mg/dL.
- variable_name: Continuous glucose measurement
  data_type: float
  unit: mg/dL
  measurement_technique: Dexcom G6 continuous glucose monitor, worn for 10 days
  description: Blood glucose measurements recorded every 5 minutes over the at-home monitoring period.
- variable_name: Best-corrected visual acuity
  data_type: float
  unit: logMAR
  measurement_technique: M&S Technologies Electronic Visual Acuity tester at 4 metres, under photopic
    and mesopic conditions with a 2.0 neutral density filter
  description: >-
    Expressed as the logarithm of the minimum angle of resolution, where lower numbers indicate better
    resolution. Snellen visual acuity variables were dropped in version 3.0.0, so only logMAR
    measurements are available.
- variable_name: Letter contrast sensitivity
  data_type: float
  unit: log contrast sensitivity
  measurement_technique: Mars letter contrast sensitivity chart (Mars Perceptrix), monocular, under
    photopic and mesopic conditions
  description: >-
    Expressed as log sensitivity, where higher numbers indicate better sensitivity. Log contrast
    sensitivity is recorded by multiplying the number of errors before the final correct letter by
    0.04 and subtracting the result from the log contrast sensitivity value at the final correct
    letter.
- variable_name: MoCA total score
  data_type: integer
  unit: points
  maximum_value: 30.0
  measurement_technique: Montreal Cognitive Assessment administered on an iPad using the MoCA Duo
    application
  description: >-
    Total possible score is 30, with higher numbers representing better performance; a total score of
    26 and above is considered normal and anything below 24 is a sign of cognitive impairment. Section
    subscores, a Memory Index Score and task completion times are also exported.
- variable_name: Systolic blood pressure
  data_type: float
  unit: mm Hg
  measurement_technique: Automatic oscillometric device, measured twice separated by 2 minutes
  description: >-
    Recorded alongside diastolic blood pressure and heart rate. Coordinators alert participants to
    readings over 180 mm Hg or below 100 mm Hg with symptoms of hemodynamic instability.
- variable_name: Heart rate
  data_type: float
  unit: beats per minute
  measurement_technique: Read from the electrocardiogram or blood pressure measurement device; also
    recorded continuously by the Garmin VivoSmart 5
- variable_name: Oxygen saturation
  data_type: float
  unit: '%'
  measurement_technique: Garmin VivoSmart 5 physical activity monitor
- variable_name: Step count
  data_type: integer
  unit: steps
  measurement_technique: Garmin VivoSmart 5 physical activity monitor, sampling every 5 seconds
- variable_name: Ambient temperature
  data_type: float
  unit: degrees Celsius
  measurement_technique: LeeLab Anura custom home environmental sensor, placed in the home for 10 days
- variable_name: Relative humidity
  data_type: float
  unit: '%'
  measurement_technique: LeeLab Anura custom home environmental sensor
- variable_name: Particulate matter
  data_type: float
  measurement_technique: LeeLab Anura custom home environmental sensor
  description: Particulate matter counts are recorded for the PM1.0, PM2.5, PM4 and PM10 size
    fractions.
- variable_name: Nitrogen oxides
  data_type: float
  measurement_technique: LeeLab Anura custom home environmental sensor
  description: Nitrogen oxide readings cover NO and NO2; volatile organic compounds and 11
    multi-spectral light intensity measurements are recorded by the same device.
- variable_name: Urine albumin
  data_type: float
  unit: mg/dL
  measurement_technique: Urine testing at the University of Washington Nutrition and Obesity Research
    Center
  description: Urinary biomarker for early diabetic nephropathy, recorded alongside urine creatinine.

file_collections:
- id: doi:10.60775/fairhub.3#cardiac_ecg
  name: cardiac_ecg
  path: cardiac_ecg
  collection_type: processed_data
  file_count: 4515
  total_bytes: 302931703
  conforms_to: WaveForm DataBase (WFDB)
  conforms_to_standard:
  - WFDB
  - CDS
  description: >-
    Electrocardiogram data collected by a 12 lead protocol, the current standard. The directory
    contains one modality directory, ecg_12lead, holding data from the Philips PageWriter TC30 device.
    All data files follow the WaveForm DataBase format, and the directory is named and organized
    following the Clinical Data Structure specification version 0.1.1. A manifest.tsv metadata file
    based on that specification accompanies the directory.
- id: doi:10.60775/fairhub.3#clinical_data
  name: clinical_data
  path: clinical_data
  collection_type: processed_data
  file_count: 7
  total_bytes: 176182781
  conforms_to: The Observational Medical Outcomes Partnership (OMOP) Common Data Model (CDM)
  conforms_to_standard:
  - OMOP_CDM
  - CDS
  description: >-
    Clinical data collected through REDCap, including blood and urine laboratory values and survey
    data. Each CSV file in the directory maps one-to-one to an OMOP Common Data Model table, covering
    laboratory tests, MoCA cognitive testing, monofilament testing, physical and vision assessments
    and survey questionnaire results. A dqd_omop.json metadata file supports OMOP CDM data quality
    analysis using the OMOP CDM Data Quality Dashboard, which runs more than 3,500 data quality checks
    against an OMOP CDM instance.
- id: doi:10.60775/fairhub.3#environment
  name: environment
  path: environment
  collection_type: processed_data
  file_count: 2232
  total_bytes: 55625676514
  conforms_to: ASCII File Format Guidelines for Earth Science Data
  conforms_to_standard:
  - ESDS
  - CDS
  description: >-
    Data collected through an environmental sensor device custom built for the AI-READI project. The
    directory holds one modality directory, environmental_sensor, containing the leelab_anura device
    directory. Files follow the NASA recommended practices for formatting and describing ASCII encoded
    data files. The sensor records particulate matter counts, temperature, relative humidity, volatile
    organic compounds, nitrogen oxides and 11 multi-spectral light intensity measurements from each
    participant's home over a 10-day period.
- id: doi:10.60775/fairhub.3#retinal_flio
  name: retinal_flio
  path: retinal_flio
  collection_type: processed_data
  file_count: 7969
  total_bytes: 1069466876718
  conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  conforms_to_standard:
  - DICOM
  - CDS
  description: >-
    Data collected through fluorescence lifetime imaging ophthalmoscopy, an imaging modality for in
    vivo measurement of the lifetimes of endogenous retinal fluorophores. The directory holds the flio
    modality and the heidelberg_flio device directory. Each scan records images at two wavelengths,
    short at 498 to 560 nm and long at 560 to 720 nm, supplied as two separate DICOM files per eye;
    the two wavelengths penetrate retinal tissue differently, and a common approach is to analyze each
    file separately for each subject. Each pixel carries a curve of photon arrival times following a
    Poisson distribution, and background light or lens fluorescence cannot simply be subtracted
    because it belongs to the same distribution as the signal.
- id: doi:10.60775/fairhub.3#retinal_oct
  name: retinal_oct
  path: retinal_oct
  collection_type: processed_data
  file_count: 56478
  total_bytes: 1317625293027
  conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  conforms_to_standard:
  - DICOM
  - CDS
  description: >-
    Data collected using optical coherence tomography, a non-invasive technique that uses
    interferometry to render an in vivo cross-sectional map of the retina accurate to within at least
    10 to 15 microns. The directory holds the structural_oct modality with four device directories:
    heidelberg_spectralis, topcon_maestro2, topcon_triton and zeiss_cirrus.
- id: doi:10.60775/fairhub.3#retinal_octa
  name: retinal_octa
  path: retinal_octa
  collection_type: processed_data
  file_count: 173721
  total_bytes: 1155908809724
  conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  conforms_to_standard:
  - DICOM
  - CDS
  description: >-
    Data collected using optical coherence tomography angiography, a non-invasive imaging technique
    that generates volumetric angiography images by comparing sequential OCT scans of the same tissue
    to map red blood cell movement, without an injected dye. The directory holds three modalities,
    each with the heidelberg_spectralis, topcon_maestro2, topcon_triton and zeiss_cirrus device
    directories: enface, holding two-dimensional views of the retinal layers derived from 3D volume
    scans; flow_cube, holding three-dimensional blood flow information; and segmentation, holding
    heightmaps and associated layer information.
- id: doi:10.60775/fairhub.3#retinal_photography
  name: retinal_photography
  path: retinal_photography
  collection_type: processed_data
  file_count: 93921
  total_bytes: 174381046406
  conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  conforms_to_standard:
  - DICOM
  - CDS
  description: >-
    Two-dimensional retinal photography, also called fundus photography, documenting the optic nerve,
    macula, retinal vasculature and central and peripheral retina. The directory holds three
    modalities: cfp, color fundus photographs from the icare_eidon, optomed_aurora, topcon_maestro2
    and topcon_triton devices; faf, fundus autofluorescence photographs from the icare_eidon device;
    and ir, near-infrared reflectance images from the heidelberg_spectralis, icare_eidon,
    topcon_maestro2 and zeiss_cirrus devices.
- id: doi:10.60775/fairhub.3#wearable_activity_monitor
  name: wearable_activity_monitor
  path: wearable_activity_monitor
  collection_type: processed_data
  file_count: 15245
  total_bytes: 38313536220
  conforms_to: Open mHealth
  conforms_to_standard:
  - OPEN_MHEALTH
  - CDS
  description: >-
    Data collected through a wearable fitness tracker, the Garmin VivoSmart 5, worn for 10 consecutive
    days concurrently with the continuous glucose monitor and the home environmental sensor.
    Participants were advised to wear the device on the non-dominant wrist but were free to choose,
    and returned it with a form recording the wrist used and their dominant hand. The device
    continuously recorded physical activity and sleep at a sampling frequency of 5 seconds, with gaps
    where the battery had to be charged every two to three days. The directory holds seven modality
    directories, each containing the garmin_vivosmart5 device directory: heart_rate,
    oxygen_saturation, physical_activity, physical_activity_calorie, respiratory_rate, sleep and
    stress.
- id: doi:10.60775/fairhub.3#wearable_blood_glucose
  name: wearable_blood_glucose
  path: wearable_blood_glucose
  collection_type: processed_data
  file_count: 2246
  total_bytes: 4169006971
  conforms_to: Open mHealth
  conforms_to_standard:
  - OPEN_MHEALTH
  - CDS
  description: >-
    Data collected through a continuous glucose monitoring device, held in the
    continuous_glucose_monitoring modality with the dexcom_g6 device directory. The Dexcom G6 is a
    real-time integrated continuous glucose monitoring system that measures glucose in tissue fluid
    through a filament inserted under the skin, without finger pricks, and captures readings every
    five minutes. A single sensor lasts a maximum of ten days, and the transmitter stores data for
    thirty days, so data must be downloaded within thirty days of activation.

external_resources:
- name: AI-READI dataset documentation
  external_resources:
  - https://docs.aireadi.org/
  archival: false
  description: >-
    The dataset is self-contained but relies on the dataset documentation for users who need further
    information about its provenance. The documentation describes the dataset using the Healthsheet
    template and provides, for each data domain, an overview of the clinical context, how the data
    were acquired, the relevant individual variables, and processing details covering file formats,
    data standards, metadata and example outputs. Version-specific documentation exists for each
    dataset version and is selected from a dropdown on the site.
  restrictions:
  - >-
    The documentation is shared under the CC-BY 4.0 license, so there are no restrictions associated
    with its use.
- name: AI-READI project website and code repositories
  external_resources:
  - https://aireadi.org/
  - https://zenodo.org/communities/aireadi
  - https://github.com/AI-READI
  description: >-
    The project website carries the study goals, team listing and data sharing information, including
    https://aireadi.org/goals/data-sharing and https://aireadi.org/team; the Zenodo community and the
    GitHub organization hold the project's guidelines, license and software outputs. AI-READI also
    hosts a year-long research internship program at https://shileyeye.ucsd.edu/research/ai_readi,
    whose inaugural 2023-2024 cohort of 10 interns was 70 per cent women, 30 per cent Black and 50 per
    cent from backgrounds under-represented by NIH criteria.
- name: FAIRhub data management platform
  external_resources:
  - https://fairhub.io/
  - https://fairhub.io/datasets/3/access
  description: >-
    FAIRhub is the AI-READI-specific data management platform, a Microsoft Azure cloud-based platform
    developed for this project, to which each data collection site uploads data at regular intervals
    and through which every version of the dataset is accessible. The project anticipates making the
    platform available to future data generation projects that wish to manage and share AI-ready
    clinical research datasets.
  restrictions:
  - >-
    Access to the dataset through the platform requires logging in through a verified identity system
    and accepting the license terms.
- name: AI-READI biospecimen repository
  external_resources:
  - University of Alabama at Birmingham Center for Clinical and Translational Science
  archival: false
  description: >-
    Blood derivatives, including isolated plasma, serum, genomic DNA, buffy coats, PAXgene-stabilized
    RNA and peripheral blood mononuclear cells, are sent to the biorepository at the University of
    Alabama at Birmingham Center for Clinical and Translational Science, separated into small aliquots
    and stored at -80 degrees Celsius or at cryogenic temperatures, and will be available to
    researchers for future ancillary studies.
  restrictions:
  - >-
    The biorepository holds a finite number of samples, and procedures for reviewing and prioritizing
    written requests were still to be developed at the time the study protocol was published.
- name: Clinical Dataset Structure specification
  external_resources:
  - https://cds-specification.readthedocs.io/en/v0.1.1/
  description: >-
    The Clinical Dataset Structure is a standard developed as part of the project for consistently
    structuring and describing clinical research datasets. The dataset is organized at the root level
    into one directory per datatype, then one directory per modality, then one per device, then one
    per participant named after the participant's study identifier. Root-level metadata files
    accompanying the release are CHANGELOG.md, dataset_description.json,
    dataset_structure_description.json, healthsheet.md, LICENSE.txt, participants.json,
    participants.tsv, README.md and study_description.json.

