id: https://doi.org/10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, AI-ready dataset collected from individuals with and without type 2 diabetes
  mellitus (T2DM) by the AI-READI project, one of four Data Generation Projects funded by the
  NIH Common Fund Bridge2AI program. Version 3.0.0 contains data from 2280 participants collected
  between 19 July 2023 and 1 May 2025 at three sites (University of Alabama at Birmingham,
  University of California San Diego, University of Washington) and harmonised across sites.
  Data domains include REDCap survey data, physical measurements and vitals, clinical
  laboratory results from blood and urine, 12-lead electrocardiography, cognitive screening,
  visual function testing, retinal imaging (colour fundus photography, fundus autofluorescence,
  infrared reflectance, OCT, OCTA and fluorescence lifetime imaging ophthalmoscopy, on devices
  from Optomed, iCare, Heidelberg, Topcon and Zeiss), continuous glucose monitoring, wearable
  activity monitoring and home
  environmental sensing. The dataset is organised following the Clinical Dataset Structure
  (CDS) v0.1.1, with clinical data mapped to the OMOP Common Data Model, imaging to DICOM,
  electrocardiography to WFDB and wearable data to Open mHealth. The released version contains
  no protected health information; information on participants' sex, race/ethnicity and
  medications has been removed from the public set and is held in a separate controlled-access
  set. The dataset is published on the FAIRhub platform and comprises 356,343 files totalling
  approximately 3.82 TB.
