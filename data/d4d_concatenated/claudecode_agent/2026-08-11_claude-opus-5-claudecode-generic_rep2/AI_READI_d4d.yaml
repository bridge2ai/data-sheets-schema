source_caveats: >-
  Three disagreements between sources in the declared bundle are represented rather than
  resolved, and are flagged again on the affected slots. (1) The FAIRhub dataset metadata names
  the managing organisation, lead sponsor and the affiliation of the principal investigators
  Aaron Lee and Cecilia Lee as "Washington University in St. Louis" with ROR
  https://ror.org/01yc7t268, while the same record's location list gives "University of
  Washington", Seattle, with ROR https://ror.org/00cvxb145, and both the BMJ Open protocol and
  the Nature Metabolism comment place Aaron Lee, Cecilia Lee and Julia Owen at the University
  of Washington. (2) The FAIRhub metadata records the de-identification type as
  "NoDeIdentification" on the grounds that no identifiers were collected, while the Nature
  Metabolism comment states that the public set is stripped of protected health information via
  the HIPAA Privacy Rule "Safe Harbor" method. (3) Target enrolment is given as 4000 people in
  the BMJ Open protocol, the Nature Metabolism comment, the NIH RePORTER abstract and the
  FAIRhub study description, and as 4600 people in the University of Washington IRB protocol
  application. Enrolment start is given as 19 July 2023 by FAIRhub and as 18 July 2023 by the
  BMJ Open protocol. (4) The acronym AI-READI is expanded as "Artificial Intelligence Ready and
  Equitable Atlas for Diabetes Insights" in the BMJ Open protocol and the Nature Metabolism
  comment, and as "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights" in
  the NIH RePORTER abstract, the dataset README and the healthsheet; the FAIRhub study
  description gives the official study title as "AI Ready and Exploratory Atlas for Diabetes
  Insights". No expansion is adopted here in preference to the others.

