      A smaller mini-subset version of version 3.0.0 available for pipeline development. The
      FAIRhub dataset page for version 3.0.0 advertises it and the documentation for v3.0.0
      lists the mini-subset version among its preliminary information.
    source_caveats: >-
      The identifier is constructed from the FAIRhub API record for this dataset, which reports
