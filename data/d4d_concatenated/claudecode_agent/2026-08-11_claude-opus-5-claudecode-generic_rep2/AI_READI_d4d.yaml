purposes:
  - id: https://doi.org/10.60775/fairhub.3#purpose-ai-ready-t2dm
    name: Enable AI/ML research into type 2 diabetes and salutogenesis
    response: >-
      The purpose for creating the dataset was to enable future generations of artificial
      intelligence/machine learning (AI/ML) research to provide critical insights into type 2
      diabetes mellitus (T2DM), including salutogenic pathways to return to health. T2DM is a
      growing public health threat. Yet, the current understanding of T2DM, especially in the
      context of salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches
      may help with improving our understanding but a key issue is the lack of data ready for
      training AI models. The AI-READI dataset is intended to fill this gap.
  - id: https://doi.org/10.60775/fairhub.3#purpose-blueprint
    name: Establish a blueprint for producing AI-ready biomedical datasets
    response: >-
      AI-READI places special emphasis on establishing standards, best practices and guidelines
      for collection, preparation and sharing of the data that can be used for future efforts to
      develop other data sets targeted for AI/ML. An additional aim of the project is to share
      its blueprint for collecting and sharing AI-ready datasets so that future Data Generation
      Projects can follow it, including guidelines for project management, as well as data
      collection, management and sharing.

tasks:
  - id: https://doi.org/10.60775/fairhub.3#task-pseudotime
    name: Pseudotime manifold analysis of disease trajectories
    response: >-
      Data collection was specifically designed to permit downstream pseudotime manifold
      analysis, an approach used to predict disease trajectories by collecting and learning from
      complex, multimodal data from participants with differing disease severity (normal to
      insulin-dependent T2DM). The long-term objective is to develop a foundational dataset in
      T2DM, agnostic to existing classification criteria, which can be used to reconstruct a
      temporal atlas of T2DM development and reversal towards health.
  - id: https://doi.org/10.60775/fairhub.3#task-applications
    name: General artificial intelligence and machine learning applications
    response: >-
      The multi-modal dataset being collected is being gathered to facilitate downstream
      pseudotime manifolds and various applications in artificial intelligence.

addressing_gaps:
  - id: https://doi.org/10.60775/fairhub.3#gap-ai-ready-data
    name: Lack of AI-ready, well-characterised multimodal T2DM datasets
    response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as
      T2DM has been limited by a lack of well-designed, high quality, large, and inclusive
      multimodal datasets. A major barrier has been the lack of diverse datasets that are AI
      ready for training AI models, which the AI-READI project is designed to address.
  - id: https://doi.org/10.60775/fairhub.3#gap-diversity
    name: Under-representation of racialised groups in T2DM research
    response: >-
      The sample is designed to be approximately balanced with respect to sex and
      race/ethnicities (Asian, black, Hispanic and white), a demographic improvement over many
      previous epidemiological studies and clinical trials on T2DM. A meta-epidemiological
      review of T2DM studies published from 2000 to 2020 indicated that samples lacked racial
      and ethnic diversity, making AI-READI an important step forward in addressing these
      demographic inequities in research.
  - id: https://doi.org/10.60775/fairhub.3#gap-severity-balance
    name: Absence of datasets balanced across T2DM severity
    response: >-
      The study population is designed to be balanced in T2DM severity groups of no diabetes,
      pre-diabetes, non-insulin controlled and insulin controlled, to facilitate artificial
      intelligence/machine learning model developments. Building balanced data sets is critical
      for the development of unbiased machine learning models.

