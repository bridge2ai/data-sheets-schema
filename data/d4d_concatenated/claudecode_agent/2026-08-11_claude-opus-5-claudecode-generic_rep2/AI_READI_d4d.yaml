instances:
  - id: https://doi.org/10.60775/fairhub.3#instance-participant
    name: Participant
    instance_type: individual study participant
    counts: 2280
    label: false
    label_description: >-
      No labels are provided. No specific labeling was performed in the dataset, as the dataset
      is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML
      applications.
    description: >-
      Each instance represents an individual patient, and consists of all of the data available
      for that individual. Multiple modalities are collected for each participant, including
      survey data, clinical data, retinal imaging data, environmental sensor data, continuous
      glucose monitor data and wearable activity monitor data, encompassing tabular data,
      imaging data and physiological signal/waveform data. There is no unstructured text data in
      the dataset, and there is currently only one visit per participant. Version 3.0.0 contains
      2280 instances; version 1.0.0 contained 204 and version 2.0.0 contained 1067.
    missing_information:
      - id: https://doi.org/10.60775/fairhub.3#instance-missing
        name: Modalities missing for some participants
        missing:
          - Individual data modalities for some participants
          - Snellen visual acuity variables, dropped in version 3.0.0
          - >-
            Sex, race/ethnicity and medication information, removed from the public version of
            the dataset
        why_missing:
          - Some participants elected not to participate in some study elements
          - >-
            In a few cases the data collection device did not have any stored results or was
            returned too late to retrieve the results, for example the battery died or data was
            lost
          - >-
            In a few cases there may have been a data collision at some point in the process and
            data has been lost
          - >-
            Only logMAR visual acuity measurements are available in this version, following the
            removal of the Snellen variables
          - >-
            Sex and race/ethnicity are withheld from the public set to prevent stigmatisation of
            findings and are held under controlled access

anomalies:
  - id: https://doi.org/10.60775/fairhub.3#anomaly-collection-noise
    name: Expected sources of noise and error by modality
    anomaly_details: >-
      In cases of survey data, skipped questions or incomplete responses are expected. In cases
      of using wearables, improper use, technical failure such as battery failure or system
      malfunction are expected. In cases of imaging data, patient uncooperation, noise that may
      obscure the images and technical failure such as system malfunction, and data transfer
      failures are expected.
  - id: https://doi.org/10.60775/fairhub.3#anomaly-imaging-quality
    name: Operator- and patient-dependent imaging quality variation
    anomaly_details: >-
      The dataset documentation records device-specific quality variation. Optomed Aurora images
      are taken undilated and handheld, so image quality varies from patient to patient and
      within the same patient. Heidelberg Spectralis imaging is operator-driven and not fully
      automated, so quality issues may arise which may lead to skipping this modality and
      missing data. FLIO takes longer than a standard Spectralis OCT and exposes patients to
      uncomfortable levels of light, so it is performed last in the visit and patients may not
      be at their best possible compliance. Topcon Triton and Maestro2 imaging is largely
      automated, which is described as leading to higher quality images with minimal
      operator-induced error.

