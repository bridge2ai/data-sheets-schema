id: "doi:10.13026/8xbn-nq66"
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is an ethically sourced, demographically diverse dataset of voice, speech,
  cough and breathing recordings linked to health information, generated by the Bridge2AI-Voice
  consortium under the NIH Common Fund Bridge2AI program. Adult participants were recruited at
  five North American sites from high-volume expert clinics across four disease cohorts — voice
  disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders, and
  respiratory disorders — together with controls, and completed a standardized protocol of
  acoustic tasks, demographic and confounder surveys, and validated patient-reported outcome
  questionnaires administered through a custom iPad application. Clinical diagnoses were
  validated against gold standards such as laryngoscopy and stroboscopy, brain imaging,
  spirometry, and electronic health record review. Version 3.1.0 covers 833 participants and
  distributes derived audio features rather than the original waveforms: spectrograms, Mel
  spectrograms, Mel-frequency cepstral coefficients, pitch, articulatory kinematics, loudness,
  periodicity, phonetic posteriorgrams, and static acoustic and prosodic feature sets, alongside
  organized phenotype tables for demographics, confounders, enrollment, diagnosis, questionnaires
  and task metadata. Raw audio is withheld from this release and disseminated separately under
  controlled access because voice is inherently re-identifiable.
