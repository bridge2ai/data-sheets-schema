purposes:
  - response: >-
      To generate a large-scale, multi-institutional, ethically sourced and demographically
      diverse dataset of human voice, speech, cough and breathing sounds linked to multimodal
      health biomarkers, in order to fuel voice AI research.
  - response: >-
      To enable the development, benchmarking and validation of clinically applicable machine
      learning models that diagnose, screen for and monitor a wide range of health conditions
      using voice data, including vocal pathologies and neurological, psychiatric, respiratory
      and pediatric voice disorders.
  - response: >-
      To introduce and standardize the field of acoustic biomarkers, termed audiomics, by
      developing new bioinformatics standards for voice and acoustic data collection, storage and
      analysis, and by ensuring interoperability and AI readiness of the resulting data.
  - response: >-
      To integrate the use of voice as a biomarker of health into clinical care, and to create
      benchmarks of diversity metrics while minimizing the risk of algorithmic bias.
  - response: >-
      To define ethical and legal norms that safeguard participants' data while supporting
      data-sharing efforts, and to build safe, innovative infrastructure for disseminating
      ethically sourced voice data to future generations of voice AI researchers.

addressing_gaps:
  - response: >-
      Previous machine learning studies of voice-based diagnosis produced promising results but
      relied on small- to medium-sized datasets, frequently of fewer than 300 patients, and
      lacked the key clinical metadata needed to train robust, clinically useful models.
  - response: >-
      Comparing studies and pooling data has been challenging because of the absence of standards
      for how voice and other acoustic data are measured and collected, which precludes
      meta-analysis and limits external validity.
  - response: >-
      Industry holds vast amounts of voice data but lacks accurate clinical and demographic
      annotation, and industry datasets are private, which prevents external auditing of training
      data for label accuracy and fair representation of diverse populations.
  - response: >-
      Existing open-source voice datasets are limited in size, quality and diversity, which helps
      explain the absence of validated, regulator-approved AI algorithms for disease detection and
      monitoring from voice.
  - response: >-
      Most prior work used voice as the only data type; audiomics needs to be integrated with
      other health data such as clinical, imaging and genomic data for improved accuracy.
  - response: >-
      The literature on pediatric voice and speech analysis is sparse, partly because of ethical
      concerns and challenges in data acquisition for that cohort.

tasks:
  - response: >-
      Detection and classification of disease from voice, speech, cough and breathing recordings
      across diagnostic categories including vocal pathologies, neurological and neurodegenerative
      disorders, mood and psychiatric disorders, and respiratory disorders.
  - response: >-
      Screening, diagnosis and longitudinal monitoring of health conditions using voice as a
      non-invasive, cost-effective biomarker.
  - response: >-
      Pretraining, fine-tuning, benchmarking and validation of AI and machine learning models on
      clinically annotated acoustic data.
  - response: >-
      Study of acoustic, phonetic, prosodic and articulatory correlates of disease using the
      derived feature sets distributed with the dataset.

acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      Data were directly observable and reported by subjects. Participants performed acoustic
      tasks that were recorded and completed self-reported demographic, confounder and validated
      questionnaire instruments. Clinical diagnoses were verified by clinicians reviewing audio
      and imaging data, examining electronic health records, or checking medication prescriptions.
  - was_inferred_derived: true
    acquisition_details: >-
      The released feature representations were inferred from the raw waveforms by automated
      signal processing and deep learning models rather than observed directly, including
      spectrograms, cepstral coefficients, estimated pitch and periodicity, estimated
      electromagnetic articulography traces, phonetic posteriorgrams and machine transcriptions.

collection_mechanisms:
  - mechanism_details: >-
      Voice, breathing, cough and speech data for the adult cohort were recorded prospectively
      using the custom Bridge2AI-Voice application running on a study tablet, following the
      Bridge2AI-Voice acoustic protocols. Twenty-two acoustic tasks are recorded through the app.
  - mechanism_details: >-
      Data were collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an
      Avid AE-36 microphone connected through an Apple dongle. Participants were instructed to
      wear a head-mounted headset with microphone when the task included voice recording, so
      microphone distance could vary slightly between recordings. Distinct iPad devices were used
      at each site.
  - mechanism_details: >-
      Demographic surveys, confounder surveys, validated questionnaires, disease-specific
      instruments and clinical validation forms were captured in a REDCap database; the supporting
      REDCap data dictionary, metadata and instrument PDFs are published openly.
  - mechanism_details: >-
      The IRB protocol also provides for remote collection through the Bridge2AI Voice Web app and
      the Bridge2AI Voice iOS app, which run in a browser or on iOS without installation, store no
      data after the page is closed, and transmit over a secure HTTPS protocol to a HIPAA-compliant
      storage server. Remote data collection did not occur for the initial dataset release.

collection_timeframes:
  - timeframe_details: >-
      Data were collected over a period of twelve months.
    source_caveats: >-
      The dataset healthsheet gives a twelve-month collection duration but no calendar start or end
      dates for the collection period, so the start_date and end_date fields are left unpopulated.

data_collectors:
  - role: researcher
    collector_details: >-
      Research teams, which may include medical, graduate or undergraduate students, coordinated
      with clinicians to identify appropriate participants and administered the collection
      protocol in clinic with a trained research assistant present.
  - role: researcher
    collector_details: >-
      Clinicians and physicians identified eligible participants and provided gold-standard
      diagnostic validation. They were listed under the IRB as co-investigators and added to the
      consortium so that their names are included on consortium-level publications. Hospital staff
      were not involved in scheduling but assisted in the logistics of coordinating data collection.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from the individuals concerned rather than obtained through
      third parties, with the exception of clinical validation information extracted from
      electronic health records by clinicians with participant consent. Data were collected in the
      United States and Canada.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling. Participants were recruited across academic institutions from
      high-volume expert clinics, defined as outpatient clinics within hospital systems or
      academic institutions with expertise in a specific disease area seeing more than fifty
      patients per month from the same disease category. Charts of patients presenting at these
      clinics were screened against per-diagnosis inclusion and exclusion criteria before the
      clinic day, and individuals without the conditions of interest were also enrolled as
      controls. Data collection is cross-sectional with a cohort observation model.
    source_data: >-
      Patients presenting at specialty clinics of the participating institutions across five
      recording sites in North America, together with healthy volunteers serving as controls.
    why_not_representative: >-
      The data are not representative because they were collected at a limited number of
      geographic locations, and because only fluent English speakers were eligible.
    notes: >-
      The healthsheet states the intent to make the sample more representative by shifting to
      remote collection and designing the recruiting approach to control for more variables.

instances:
  - instance_type: participant
    counts: 833
    data_topic: B2AI_TOPIC:36
    data_substrate: B2AI_SUBSTRATE:79
    label: true
    label_description: >-
      Each participant carries a diagnostic label established by clinical assessment. At each site
      a local clinician provided the diagnosis based on a clinical interview and appropriate
      work-up; for the psychiatric disorders cohort the assessment was determined from the
      participant's electronic health record or an active prescription made outside of data
      collection by an appropriately licensed clinician.
    notes: >-
      A participant may have more than one recording session, so phenotype and task tables may
      contain more than one row for the same participant, and responses need not be identical
      across sessions. Participant-level information is distributed as tab-separated phenotype
      tables.
  - instance_type: >-
      Recording of a single acoustic task, released as derived acoustic features rather than as
      the original waveform
    data_topic: B2AI_TOPIC:37
    data_substrate: B2AI_SUBSTRATE:69
    label: true
    label_description: >-
      Each recording is identified by the acoustic task performed (task_name) and linked to a
      participant identifier and a session identifier.
    notes: >-
      Counts vary by feature type in version 3.1.0 because some recordings could not produce some
      features and because dense features derived from free-speech prompts and audio checks were
      withheld: 23,533 to 32,522 records depending on the feature file. The time-varying feature
      tensors are distributed in Apache Parquet.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Demographic subpopulations are identified from a self-reported sociodemographic
      questionnaire administered in the collection application, covering age, sex, gender, race,
      ethnicity, language, and socioeconomic status.
    notes: >-
      Indirect geographic and demographic identifiers were removed or generalized before release
      where their combination created a significant risk of re-identification; state and province
      were removed and country of data collection retained.
  - subpopulation_elements_present: true
    identification: >-
      Disease cohort subpopulations are identified by the diagnosis tables, which record
      gold-standard validated diagnoses for each of the recruitment categories and for controls.
    distribution: >-
      The public data releases do not contain an equal distribution of the disease categories, and
      the dataset has skews based on disorder category, site and other demographic factors.

subsets:
  - id: "doi:10.13026/8xbn-nq66#voice-disorders-cohort"
    name: Voice disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants recruited for laryngeal and phonatory pathology, including laryngeal cancer,
      laryngitis, pre-cancerous lesions such as keratosis and leukoplakia, benign lesions of the
      vocal cord, muscle tension dysphonia, laryngeal dystonia and vocal tremor, unilateral vocal
      fold paralysis, and glottic insufficiency or presbyphonia. Diagnoses were validated with
      laryngoscopy images and stroboscopy videos, and with CT and spirometry where indicated.
  - id: "doi:10.13026/8xbn-nq66#respiratory-disorders-cohort"
    name: Respiratory disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants recruited for airway stenosis, including bilateral vocal fold paralysis and
      supraglottic, glottic, posterior glottic, subglottic, tracheal and multi-level upper airway
      stenosis, and for unexplained chronic cough of more than eight weeks. Diagnoses were
      validated with spirometry and flow volume loops and with CT of the neck and chest.
  - id: "doi:10.13026/8xbn-nq66#neurological-disorders-cohort"
    name: Neurological and neurodegenerative disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants aged 44 to 85 with a clinical diagnosis of mild cognitive impairment,
      Alzheimer's disease, other dementias, amyotrophic lateral sclerosis, or Parkinson's disease
      and related parkinsonian syndromes. Diagnoses were validated with brain CT and MRI, serum
      p-tau biomarkers for Alzheimer's disease, and whole genome sequencing.
  - id: "doi:10.13026/8xbn-nq66#mood-psychiatric-disorders-cohort"
    name: Mood and psychiatric disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with anxiety disorder, bipolar disorder, or depression and major depressive
      disorder as primary diagnoses, with comorbid conditions recorded including alcohol or
      substance use disorder, ADHD, autism spectrum disorder, borderline personality disorder,
      eating disorder, insomnia and sleep disorder, obsessive-compulsive disorder, panic disorder,
      post-traumatic stress disorder, schizophrenia and social anxiety disorder. Diagnoses were
      validated from the electronic health summary, a psychiatrist's clinical diagnosis, or
      medication history.
  - id: "doi:10.13026/8xbn-nq66#controls"
    name: Control participants
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants not diagnosed or treated for a voice, respiratory, mood or neurological
      disorder affecting voice, cough, breath or speech, enrolled to serve as controls in the
      dataset.

splits:
  - split_details: >-
      The dataset does not provide predefined recommended splits for training, validation or
      testing. Researchers are encouraged to create their own data splits based on their specific
      requirements, and should consider the multivariate distribution across disorder category,
      site and demographic factors when doing so.

relationships:
  - relationship_details: >-
      Instances are otherwise unrelated to one another: participants were not recruited as
      families, cohorts of contacts or repeated encounters of a single episode. Within the data,
      recordings are linked to participants through participant_id and to a recording occasion
      through session_id, and a participant may contribute more than one session.

anomalies:
  - anomaly_details: >-
      Different sites used different collection configurations, and the collection protocol
      changed over the course of the study, so recording conditions and available fields are not
      uniform across the dataset.
  - anomaly_details: >-
      Confounding factors present in the data include noise artifacts, variations in diagnostic
      practices between sites and clinicians, inaccurate questionnaire responses, and
      underreporting by participants.
  - anomaly_details: >-
      Recordings were made with a head-mounted headset and microphone that could sit at slightly
      different distances from the speaker, introducing variation in level and spectral balance.
  - anomaly_details: >-
      Transcriptions and some other derived elements were generated using off-the-shelf models
      that have not been audited for correctness.
  - anomaly_details: >-
      Some audio files, whether because of their length or for other reasons, could not produce
      certain features and are therefore absent from the corresponding feature files, which is why
      record counts differ between feature files in the same release.
  - anomaly_details: >-
      Version 3.0.0 shipped broken parquet files, which were repaired in version 3.1.0.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants were recruited from high-volume expert clinics at a small number of academic
      institutions rather than from the general population, so the sample reflects patients who
      reach specialty care.
    mitigation_strategy: >-
      The consortium intends to shift toward remote collection and to design the recruiting
      approach so that more variables are controlled.
  - bias_type: representation_bias
    bias_description: >-
      Groups that have less trust in the medical system or in AI, or that are less proximal to the
      collection sites, would have been less likely to be recruited.
    notes: >-
      The affected groups are historically marginalized and underserved communities, which the
      dataset does not delineate as named subsets.
  - bias_type: sampling_bias
    bias_description: >-
      The dataset is a non-probability sample collected at a limited number of geographic
      locations, and eligibility was restricted to participants who read and speak English, so
      linguistic and geographic coverage is narrow.
    mitigation_strategy: >-
      Spanish-language protocols and data collection are under development for future releases.
  - bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders based on site, so diagnostic group is
      confounded with recording site and with the specific device used, and clinical diagnosis was
      established by one clinician, by EHR record, or by prescription depending on the disorder.
    affected_subsets:
      - "doi:10.13026/8xbn-nq66#mood-psychiatric-disorders-cohort"
    mitigation_strategy: >-
      Users are advised to consider the multivariate distribution across site, device and disorder
      when assessing the dataset's utility for a given question.
  - bias_type: annotation_bias
    bias_description: >-
      A single labeler provided the diagnostic label for each instance, typically the clinician at
      the site of data collection or a clinician external to the study who made a prior diagnostic
      assessment, so inter-rater variation in diagnostic practice is embedded in the labels and
      cannot be measured.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset is a sample from an ongoing collection at five North American sites and is not
      representative of any larger population.
    scope_impact: >-
      Models trained on the dataset may not generalize to populations, care settings or recording
      conditions outside those represented.
    recommended_mitigation: >-
      Assess the multivariate distribution of site, device, disorder and demographics before
      drawing population-level conclusions.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Only fluent English speakers were eligible, and English was the only language of
      communication and instrument administration for this release.
    recommended_mitigation: >-
      Await forthcoming releases that include Spanish-language protocols and data collection.
  - limitation_type: scope_limitation
    limitation_description: >-
      The release contains only data considered low risk. Raw audio waveforms are excluded, and
      spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams and articulatory estimates
      derived from free-speech and open-response prompts and from audio checks were removed.
    recommended_mitigation: >-
      Request the raw audio through the controlled access mechanism where the research question
      requires the waveform.
  - limitation_type: integration_limitation
    limitation_description: >-
      The other multimodal data described in the protocol — laryngoscopy imaging, chest and brain
      imaging, respiratory function tests, genomic data and other EHR data — are extracted at each
      site independently and are not included in this release.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Distribution shift over time is expected because diagnostic criteria and practices change,
      and because the collection protocol was modified during the study period.
  - limitation_type: methodological_limitation
    limitation_description: >-
      One labeler provided a label per instance, no inter-annotator agreement was computed, and
      human-level performance on the applications the dataset is meant to address varies widely.
  - limitation_type: resolution_limitation
    limitation_description: >-
      All audio was converted to monaural and resampled to 16 kHz with a Butterworth anti-aliasing
      filter before feature extraction, and spectrograms were further downsampled by a factor of
      two in the time domain, so the released features cannot resolve detail above these limits.

content_warnings:
  - content_warnings_present: true
    warnings:
      - >-
        The protocol includes free speech tasks in which participants choose their own language;
        content that is offensive, distressing or otherwise unwelcome cannot be completely
        excluded, although transcripts of free speech audio and dense features derived from
        open-response prompts were removed before release.
      - >-
        The questionnaire instruments cover depression, anxiety, post-traumatic stress and other
        psychiatric symptoms, and the IRB protocol notes that answering some of these questions can
        cause discomfort and trigger negative emotions.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes racial and ethnic origin, sexual orientation, socioeconomic information
      and health data. Voice itself is a biometric characteristic; even with all HIPAA-protected
      information removed, an individual's voice remains unique to them, which is why raw audio is
      not distributed in this release.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet records that the released dataset does not contain data protected by legal
      privilege, by doctor-patient confidentiality, or by the confidentiality of non-public
      communications. Data that would pose a heightened risk of re-identification if released in
      full open access, including all raw audio, is instead disseminated through a controlled
      access mechanism to authorized researchers.

raw_data_sources:
  - source_description: >-
      Raw voice, speech, cough and breathing audio recorded from participants performing the
      Bridge2AI-Voice acoustic task protocol on a study tablet.
    source_type: Prospective primary collection from human participants
    raw_data_format: WAV audio, converted to monaural 16 kHz before feature extraction
    access_details: >-
      Raw audio is not included in this release and is not publicly accessible. It is retained and
      disseminated only through controlled access: interested users request access from the Data
      Access Compliance Office at DACO@b2ai-voice.org, complete a Data Access Request Form and Data
      Use Agreement, undergo review, and have a Data Transfer and Use Agreement signed by an
      authorized official at their institution. Approved users obtain the data through Synapse at
      https://www.synapse.org/Synapse:syn72370534/
  - source_description: >-
      Participant demographic, confounder, validated questionnaire and clinical validation
      responses captured during the collection session.
    source_type: Participant self-report and clinician-completed clinical validation
    raw_data_format: >-
      REDCap records exported and converted to tab-delimited values with JSON data dictionaries
      using the open-source b2aiprep library
    access_details: >-
      Released in de-identified form in the phenotype folder of the registered-access distribution.

preprocessing_strategies:
  - preprocessing_details: >-
      Raw audio was converted to monaural and resampled to 16 kHz with a Butterworth anti-aliasing
      filter applied, producing the standardized audio from which all derived features were
      computed.
  - preprocessing_details: >-
      Time-frequency representations were computed with torchaudio using the short-time Fast
      Fourier Transform with a 25 ms window, a 10 ms hop and a 400-point FFT; spectrograms were
      downsampled by a factor of two in the time domain after derivation. Mel spectrograms and 60
      Mel-frequency cepstral coefficients were computed with the same parameters and 60 Mel bins,
      and pitch was tracked over a range of 80 to 500 Hz.
  - preprocessing_details: >-
      Articulatory features were generated with the Speech Articulatory Coding (sparc) package at
      50 Hz, yielding kinematic traces of vocal tract articulators as estimated electromagnetic
      articulography, together with loudness computed as average absolute waveform amplitude over
      20 ms windows, periodicity, and fundamental frequency over a 50 to 550 Hz range.
  - preprocessing_details: >-
      Static acoustic and prosodic features were extracted with openSMILE, capturing temporal
      dynamics and acoustic characteristics, and with Parselmouth and Praat, providing measures of
      fundamental frequency, formants and voice quality, including openSMILE eGeMAPS features per
      audio file and speech intelligibility metrics for speech tasks.
  - preprocessing_details: >-
      Phonetic posteriorgrams, a time-varying categorical distribution over forty phoneme
      categories, were generated at 100 Hz with the ppgs package, and transcriptions were
      generated using OpenAI's Whisper Large model.
  - preprocessing_details: >-
      The raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported from
      REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0. All
      processing was performed with the b2aiprep toolkit for organizing and preprocessing the
      dataset and the senselab toolkit for processing audio files; version 3.1.0 was generated
      with b2aiprep v3.0.0.
  - preprocessing_details: >-
      Waveform-derived features are stored in two formats: a fixed feature format holding static
      features extracted from the entire waveform, and a temporal format whose length varies with
      the duration of each recording.

cleaning_strategies:
  - cleaning_details: >-
      No cleaning or correction was applied to the collected responses. The healthsheet records
      that there was no pre-processing for cleaning the data, and that no instances were excluded
      at the time of preprocessing.
  - cleaning_details: >-
      An audit protocol is applied to each release: missingness tables are generated, distributions
      and outliers are checked, categorical responses are checked against the schema, and quality
      control metrics are run for audio tasks, including the amount of silence and the duration of
      each waveform and, for speech tasks, a comparison of the produced speech against the intended
      passage. Version 3.1.0 additionally distributes the resulting per-recording audio quality
      metrics.
  - cleaning_details: >-
      Raw audio transcripts were reviewed, and any audio recordings that contained potentially
      identifying information or external voices were removed from the release. Where a
      caregiver's voice was recorded inadvertently, the clip could be discarded either by
      re-recording manually during data collection or during data audit and post-processing.

labeling_strategies:
  - labeling_details: >-
      Diagnostic labels are the result of a clinical assessment of the participant. At each site a
      local clinician provided the diagnosis based on a clinical interview and appropriate
      work-up. For the psychiatric disorders cohort the assessment was determined from the
      participant's electronic health record or from an active prescription, established outside
      of data collection by an appropriately licensed clinician.
    annotations_per_item: 1
    annotator_demographics:
      - >-
        Typically the clinician at the site of data collection, or a clinician external to the
        study who made the prior diagnostic assessment; no further demographic characterization of
        labelers is provided.
    data_annotation_protocol: >-
      Bridge2AI-Voice protocols and ICD-10 codes, with a gold-standard validation method specified
      for each diagnosis: laryngoscopy images and stroboscopy videos for voice disorders,
      spirometry and flow volume loops and neck and chest CT for airway stenosis and chronic
      cough, brain CT and MRI and whole genome sequencing for neurological and neurodegenerative
      disorders with serum p-tau for Alzheimer's disease, and the electronic health summary,
      psychiatrist diagnosis or medication history for mood and psychiatric disorders.
    data_annotation_platform: >-
      REDCap, using the published Bridge2AI-Voice data dictionary and clinical validation
      instruments.
    inter_annotator_agreement: >-
      Not assessed. One labeler provided a label per instance, so no agreement statistic can be
      computed.
    notes: >-
      Future researchers who create new labels or define new tasks are asked to describe the
      process alongside any release of a model or publication, including the exact variables used
      for the determination.

machine_annotation_tools:
  - tools:
      - OpenAI Whisper Large
    tool_descriptions: Whisper Large generated transcriptions of the recordings.
    tool_accuracy:
      - >-
        Certain aspects of the data, for example transcription, were generated using off-the-shelf
        models that have not been audited for correctness.
  - tools:
      - openSMILE
    tool_descriptions: >-
      openSMILE extracted static acoustic features, including eGeMAPS features per audio file,
      capturing temporal dynamics and acoustic characteristics.
  - tools:
      - Praat
      - Parselmouth
    tool_descriptions: >-
      Praat, accessed through the Parselmouth Python interface, computed phonetic and prosodic
      features including fundamental frequency, formants and voice quality measures.
  - tools:
      - torchaudio
    tool_descriptions: >-
      torchaudio computed spectrograms, Mel spectrograms, Mel-frequency cepstral coefficients and
      pitch contours.
  - tools:
      - Speech Articulatory Coding (sparc)
    tool_descriptions: >-
      The Speech Articulatory Coding package estimated electromagnetic articulography traces and
      source features including loudness, periodicity and pitch.
  - tools:
      - ppgs
    tool_descriptions: The ppgs package generated high-fidelity neural phonetic posteriorgrams.
  - tools:
      - b2aiprep
      - senselab
    tool_descriptions: >-
      b2aiprep organized and preprocessed the dataset and merged the source data into the
      phenotype files; senselab processed the audio files for research tasks.

annotation_analyses:
  - agreement_metric: None computed
    analysis_method: >-
      No inter-annotator agreement analysis was performed. A single labeler provided the diagnostic
      label for each instance, so no agreement statistic is computable.
    annotation_quality_details: >-
      Label quality rests on the gold-standard validation methods specified per diagnosis rather
      than on redundant annotation. Human-level performance on the applications the dataset is
      meant to address varies widely.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    derivation: >-
      Unique de-identified study identifier assigned to each participant, replacing direct
      identifiers; present in every feature and phenotype file.
  - variable_name: session_id
    data_type: identifier
    is_identifier: true
    derivation: >-
      Unique identifier for a recording session. A subset of participants required multiple
      sessions to complete data collection, so a participant may be associated with more than one
      session identifier.
  - variable_name: task_name
    data_type: categorical
    derivation: >-
      Name of the acoustic task performed for the recording, drawn from the twenty-two tasks in
      the adult protocol.
  - variable_name: n_frames
    data_type: integer
    derivation: Number of time frames in the feature tensor associated with the recording.
  - variable_name: spectrogram
    data_type: array
    measurement_technique: >-
      Short-time Fast Fourier Transform computed with torchaudio using a 25 ms window, a 10 ms hop
      and a 400-point FFT, then downsampled by a factor of two in the time domain.
    derivation: >-
      Power spectrogram of dimension 201 by T derived from the monaural 16 kHz waveform; 29,278
      records in version 3.1.0.
    quality_notes: >-
      Withheld for sensitive records, audio checks and free-speech prompts. Spectrograms were
      reprocessed in version 2.0 to fix minor issues identified in version 1.1.
  - variable_name: mel_spectrogram
    data_type: array
    measurement_technique: >-
      Computed with torchaudio using a 25 ms window, a 10 ms hop, a 400-point FFT and 60 Mel bins.
    derivation: Mel spectrogram of dimension 60 by T; 29,278 records in version 3.1.0.
  - variable_name: mfcc
    data_type: array
    measurement_technique: >-
      Sixty Mel-frequency cepstral coefficients computed from the Mel spectrogram with the same
      window, hop and FFT parameters.
    derivation: Cepstral coefficient matrix of dimension 60 by T; 29,278 records in version 3.1.0.
  - variable_name: pitch
    data_type: array
    unit: Hz
    minimum_value: 80.0
    maximum_value: 500.0
    measurement_technique: Pitch tracking with torchaudio.
    derivation: >-
      Detected fundamental frequency over time, of dimension T; 32,522 records in version 3.1.0.
  - variable_name: sparc_pitch
    data_type: array
    unit: Hz
    minimum_value: 50.0
    maximum_value: 550.0
    measurement_technique: >-
      Fundamental frequency estimation by the Speech Articulatory Coding package, using a different
      algorithm from the torchaudio pitch track.
    derivation: Estimated F0 contour of dimension T; 31,872 records in version 3.1.0.
  - variable_name: sparc_ema
    data_type: array
    measurement_technique: >-
      Estimated electromagnetic articulography produced by a deep learning model at 50 Hz.
    derivation: >-
      Matrix of dimension T by 12 giving the X and Y positions of six articulators: tongue dorsum,
      tongue body, tongue tip, lower incisor, upper lip and lower lip; 28,640 records in version
      3.1.0.
  - variable_name: sparc_loudness
    data_type: array
    measurement_technique: >-
      Average absolute amplitude of the audio waveform computed over 20 ms windows by the Speech
      Articulatory Coding package.
    derivation: Estimated loudness contour of dimension T; 31,855 records in version 3.1.0.
  - variable_name: sparc_periodicity
    data_type: array
    measurement_technique: >-
      Periodicity, expressed as confidence of pitch presence, derived over 20 ms windows by the
      Speech Articulatory Coding package.
    derivation: Periodicity contour of dimension T; 31,872 records in version 3.1.0.
  - variable_name: ppgs
    data_type: array
    measurement_technique: >-
      High-fidelity neural phonetic posteriorgrams generated by the ppgs package at a frame rate of
      100 Hz.
    derivation: >-
      Probability matrix of dimension 40 by T over forty phoneme categories; 29,289 records in
      version 3.1.0.
    source_caveats: >-
      This variable list documents the columns of the derived feature files. The phenotype tables
      carry many further columns whose names, prompts and data types are defined in the JSON data
      dictionaries shipped with each table; the bundle does not enumerate them individually, so
      they are not itemized here.

missing_data_documentation:
  - missing_data_causes: >-
      Some questionnaire items are optional and may be skipped by the participant. Data collection
      irregularities caused information to be missing from individual instances. Each participant
      answered a common set of questions and then only those additional questions relevant to their
      primary diagnostic category, so cohort-specific instruments are structurally absent for other
      cohorts. Some audio files, because of their length or for other reasons, could not produce
      certain features and are therefore absent from the corresponding feature file. Dense features
      derived from free-speech and open-response prompts, from audio checks, and from records
      flagged as sensitive were deliberately removed before release.
    missing_data_patterns: >-
      A missingness table is generated for each release and included with the dataset. Phenotype
      data files contain a row for a participant only where at least one column is not missing.
      Record counts differ between feature files in the same release, ranging from 23,533 to 32,522
      in version 3.1.0.
    handling_strategy: >-
      No imputation is applied. Missingness is documented rather than filled, through the
      missingness tables generated by the internal audit for consistency and missingness performed
      by the data release team.

file_collections:
  - id: "doi:10.13026/8xbn-nq66#features"
    name: Derived acoustic features
    collection_type: processed_data
    path: features/
    description: >-
      Dense per-recording features stored as Apache Parquet — ppgs.parquet, sparc_ema.parquet,
      sparc_loudness.parquet, sparc_periodicity.parquet, sparc_pitch.parquet,
      torchaudio_spectrogram.parquet, torchaudio_mfcc.parquet, torchaudio_pitch.parquet and
      torchaudio_mel_spectrogram.parquet — together with two plain-text tables:
      static_features.tsv, holding one static feature row per audio recording, and
      audio_quality_metrics.tsv, holding quality control metrics per recording. Each data file is
      accompanied by a JSON data dictionary sharing its file stem, describing the feature and the
      processing used to prepare it.
  - id: "doi:10.13026/8xbn-nq66#phenotype"
    name: Phenotype tables
    collection_type: processed_data
    path: phenotype/
    file_count: 86
    description: >-
      Tab-delimited tables of information collected from the participant or another individual
      during the encounter, each paired with a JSON data dictionary whose keys match the column
      names and whose values give a description of the column, the question asked to prompt the
      answer, and the data type of the response. Organized into six subfolders: confounders,
      demographics, diagnosis (eighteen condition-specific tables), enrollment (eligibility,
      enrollment_form and participant), questionnaire (thirteen instruments including ADHD adult,
      custom affect scale, DSM-5 adult, Dyspnea Index, GAD-7, Leicester Cough Questionnaire, PANAS,
      PHQ-9, productive vocabulary, psychiatric history, PTSD adult, VHI-10 and voice perception),
      and task (acoustic_task, harvard_sentences, random_item_generation, recording, session,
      stroop and winograd).
  - id: "doi:10.13026/8xbn-nq66#metadata"
    name: Recording metadata
    collection_type: metadata
    path: metadata/
    file_count: 2
    description: >-
      A Parquet binary file and its corresponding data dictionary, holding per-recording
      information including task instructions and prompts, the microphone used and its gain. New
      in version 3.1.0.

distribution_formats:
  - format: Apache Parquet
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Column-oriented binary format used for the dense per-recording feature tensors in the
      features folder and for the recording metadata in the metadata folder. Each row carries
      participant_id, session_id, task_name, n_frames and the feature tensor.
  - format: Tab-separated values with JSON data dictionaries
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Used for the phenotype tables, for static_features.tsv and for audio_quality_metrics.tsv.
      Each data file has a companion JSON data dictionary sharing its file stem.

distribution_dates:
  - release_dates:
      - Version 1.0 released on the Health Data Nexus platform at the end of November 2024
      - Version 1.1 released 17 January 2025
      - Version 2.0.0 released 16 April 2025
      - Version 2.0.1 released 18 August 2025
      - Version 3.0.0 released 16 December 2025
      - Version 3.1.0 released 1 May 2026

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed broadly to individuals outside the entity that created it,
      through a data publishing platform that provides publicly accessible metadata and a DOI for
      persistent resolution while requiring registered or credentialed access to the files
      themselves. The feature-only adult and pediatric datasets are published under separate
      PhysioNet entries; raw audio is disseminated only through controlled access via Synapse.

external_resources:
  - external_resources:
      - >-
        b2aiprep, the open-source library used to organize and preprocess the dataset and to merge
        source data into the phenotype files, at https://github.com/sensein/b2aiprep
    restrictions:
      - The b2aiprep preprocessing library is licensed Apache-2.0.
  - external_resources:
      - >-
        senselab, the open-source toolkit used to process audio files for research tasks, at
        https://github.com/sensein/senselab
  - external_resources:
      - >-
        The Bridge2AI-Voice REDCap data dictionary, metadata and instrument PDFs at
        https://github.com/eipm/bridge2ai-redcap and archived at
        https://zenodo.org/doi/10.5281/zenodo.12760724
    archival: true
    restrictions:
      - The REDCap data dictionary repository is licensed MIT.
  - external_resources:
      - >-
        The project documentation, dashboards and protocol tables at https://docs.b2ai-voice.org
        with source at https://github.com/eipm/bridge2ai-docs and archived at
        https://zenodo.org/doi/10.5281/zenodo.13834653
    archival: true
    restrictions:
      - The documentation repository is licensed MIT.
  - external_resources:
      - FHIR profiles for voice as a biomarker, published by the consortium
  - external_resources:
      - >-
        A downloadable memorandum setting out the ethical justification for controlled access to
        raw voice data samples
  - external_resources:
      - Training opportunities for using the dataset at https://www.b2aivoicescholars.org/
    notes: >-
      The healthsheet records that the dataset itself is self-contained and does not rely on
      external resources; no guarantees of persistence are stated for the referenced software
      repositories or training site.

existing_uses:
  - examples:
      - >-
        A restricted version of the dataset containing raw audio was used in the Bridge2AI Summer
        School and hackathon.
  - examples:
      - >-
        The dataset supports training activities delivered through the Bridge2AI Voice Scholars
        program.

intended_uses:
  - use_category: Clinical machine learning research
    examples:
      - >-
        Development, benchmarking and validation of clinically applicable machine learning models
        that diagnose health conditions from voice, including vocal pathologies and neurological,
        psychiatric, respiratory and pediatric voice disorders.
      - AI model pretraining and fine-tuning on clinically annotated acoustic data.
      - >-
        Clinical research on disease screening, diagnosis and monitoring through voice biomarkers.
    usage_notes: >-
      The dataset is intended solely for commercial and non-commercial research purposes by
      Authorized Researchers, is structured to be Findable, Accessible, Interoperable and Reusable,
      and requires citation of the specified resources when used for any purpose.

discouraged_uses:
  - discouragement_details: >-
      Non-research and non-clinical applications are discouraged, including hiring decisions,
      insurance premium adjustments, and any form of surveillance that could lead to discrimination
      or harm. These limitations are intended to prevent unethical or biased outcomes that could
      negatively affect individuals on the basis of their health conditions or voice
      characteristics.

prohibited_uses:
  - prohibition_reason: >-
      Attempting to re-identify research participants, or taking any action that could reasonably
      lead to re-identification, is prohibited because the dataset is derived from inherently
      identifiable voice data and re-identification would breach the terms on which participants
      consented.
  - prohibition_reason: >-
      Any purpose that could foreseeably cause harm or stigmatization to research participants,
      their families, communities or specific populations is prohibited, reflecting the
      consortium's commitment to research practices that respect and protect the rights and
      interests of research participants.
  - prohibition_reason: >-
      Using intellectual property protections, database rights or related rights in a manner that
      restricts or limits access to any part of the dataset, or to any conclusions derived from it,
      is prohibited so that future use of the dataset remains unrestricted, in alignment with the
      Open Science principles upheld by the consortium.
  - prohibition_reason: >-
      Sale of all or part of the data on any media is prohibited under the data transfer and use
      agreement, although duplication as reasonably required to carry out the approved research
      project is permitted.
  - prohibition_reason: >-
      Contacting the individuals who are the subjects of the data, whether using the data alone or
      in concert with other information, is prohibited without appropriate institutional review
      board approval, specific written approval from the provider, and informed consent from the
      individual where required.

future_use_impacts:
  - impact_details: >-
      The dataset has skews based on disorder category, site and other demographic factors. Users
      should consider the multivariate distribution when assessing utility for different questions,
      because models trained without that consideration may perform unevenly across groups.
  - impact_details: >-
      Use outside research, for example in hiring, insurance or surveillance, could result in
      unfair treatment of individuals or groups through stereotyping or quality-of-service
      failures, and could cause financial harm or legal risk to participants.
  - impact_details: >-
      Voice AI raises specific ethical, legal and social challenges that the consortium is
      addressing, including the risk of voice re-identification, vulnerabilities such as voice AI
      hacking, concerns around voice data sharing and privacy, and the influence of gender and
      racial diversity on the development and application of these technologies.

data_governance:
  committee_name: Data Access Compliance Office (DACO)
  accountable_organization:
    name: University of South Florida Board of Trustees
  access_review_process: >-
    Two tiers apply. Registered access to the feature-only data requires registration on the
    hosting platform, confirmation of identity, credentialing, and signature of the Bridge2AI-Voice
    Registered Access Agreement setting out the terms and conditions for data use. Controlled
    access to raw audio requires completion of a Data Access Request Form and a Data Use Agreement,
    submission of the application to the Data Access Compliance Office for review, and, upon
    approval, a Data Transfer and Use Agreement signed by an authorized official at the applicant's
    institution. Requests for raw audio are directed to DACO@b2ai-voice.org. Collaborators at other
    research organizations, and other research teams at the same organization, must apply
    independently and sign their own agreement before accessing the data.
  stewardship_roles:
    - >-
      The Bridge2AI-Voice consortium curates the data, sets the access conditions, and operates the
      Data Access Compliance Office.
    - >-
      The hosting platform team maintains the technical infrastructure and provides continued
      access to interested researchers.
    - >-
      Recipients must retain control over the data, restrict use to named Authorized Persons with a
      need to use it, establish appropriate administrative, technical and physical safeguards, and
      notify the provider of any unauthorized use or disclosure within five business days of
      discovery.
  notes: >-
    A memorandum explaining the reasoning behind the governance structure, titled "Ethical
    Justification for Controlled Access to Raw Voice Data Samples", is published for download
    alongside the dataset documentation.

license_and_use_terms:
  data_use_permission: general_research_use
  license_terms: >-
    Files are released under the Bridge2AI Voice Registered Access License and governed by the
    Bridge2AI Voice Registered Access Agreement, which credentialed users must sign. The dataset is
    intended solely for commercial and non-commercial research purposes by Authorized Researchers.
    Consent placed no restriction on commercial use, on geographic location of use, on the type of
    research, on genetic research, or on research involving the development of methods or
    algorithms. Duplication as reasonably required to carry out the approved research project is
    permitted; sale of all or part of the data on any media is not. There are no fees associated
    with these restrictions.

ip_restrictions:
  restrictions:
    - >-
      The data may be protected by copyright and other rights, including other intellectual
      property rights; nothing in the agreement operates to transfer any intellectual property
      rights in or relating to the data to the recipient.
    - Recipients agree not to make intellectual property claims on the data.
    - >-
      Recipients agree not to use intellectual property protection in ways that would prevent or
      block access to, or use of, any element of the data or conclusions drawn directly from it.
    - >-
      Recipients who perform further research adding intellectual and resource capital to the data
      may obtain intellectual property rights on downstream discoveries, but agree to implement
      licensing policies that will not obstruct further research and to respect the Fort Lauderdale
      Agreement.
    - >-
      The provider gives no guarantee that the data is free of third-party intellectual property
      rights, database rights or other related rights, and no third parties have imposed IP-based
      restrictions on the data.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
    - No export controls apply to the dataset.
    - No other regulatory restrictions on the dataset are recorded.
  other_compliance: >-
    The data is covered by a Certificate of Confidentiality, which must be asserted against
    compulsory legal demands such as court orders and subpoenas for identifying information or
    characteristics of a research participant. The data is personally identifiable information as
    defined in OMB Memorandum M-07-16 but is not subject to the Federal Privacy Act of 1974. The
    HIPAA de-identification rules have been applied.

is_deidentified:
  identifiable_elements_present: false
  method: HIPAA Safe Harbor, supplemented by expert review of indirect and sensitive elements
  identifiers_removed: >-
    Names; Civic addresses and other geographic locators, including state and province; Social
    security numbers; Date information at a resolution finer than years, rebased and replaced by
    integers; Phone and fax numbers; Email addresses and IP addresses; Medical record numbers and
    health plan beneficiary numbers; Device identifiers, license numbers, account numbers and
    vehicle identifiers; Website URLs; Full face photographs and biometric identifiers; Raw audio
    waveforms; Narrative text fields, including transcripts of free speech audio; Select indirect
    geographic and demographic identifiers, and information about household composition or cultural
    identity, where their combination with other public data created a significant risk of
    re-identification; Non-identifying but highly sensitive elements, including household income,
    mental health status and traumatic life experiences; Fields encoded as sensitive in the
    published REDCap data dictionary
  deidentification_details: >-
    Identifiable information under HIPAA and the Common Rule, as well as data considered sensitive,
    has been removed. Direct identifiers were removed because they would reveal the identity of the
    participant. Country of data collection was retained. Raw audio transcripts were reviewed and
    any recordings containing potentially identifying information or external voices were removed
    from the release. Spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams and
    articulatory estimates from open-response prompts and audio checks were removed from the
    feature-only dataset, while static features that do not encode the sensitive information were
    retained. K-anonymization at k greater than or equal to two is not achieved.

human_subject_research:
  involves_human_subjects: true
  ethics_review_board: >-
    University of South Florida Institutional Review Board, acting as the single IRB, with subsite
    IRBs approved through the single IRB process. Canadian participating institutions, which do not
    operate under the single IRB process, obtained separate research ethics board approvals in
    compliance with Canadian regulations.
  irb_approval:
    - >-
      The clinical study was submitted to and approved by the USF Single IRB and by subsite IRBs
      through the single IRB process.
    - >-
      Participants provided written informed consent to participate in this study.
    - >-
      Genomic data collection, performed only at Canadian sites, was covered by a separate protocol
      and research ethics board approval.
  regulatory_compliance:
    - HIPAA de-identification rules were applied to the released dataset.
    - >-
      The study is covered by a Certificate of Confidentiality, which must be asserted against
      compulsory legal demands for identifying information about a participant.
    - >-
      A partial HIPAA waiver was obtained for recruitment and screening purposes, allowing review
      of electronic health record information against inclusion and exclusion criteria before
      appointments.
    - No data monitoring committee was appointed for this study.
    - The clinical study is not for a drug product and not for a medical device.
  special_populations:
    - >-
      The adult dataset is restricted to participants aged 18 years and older; the protocol
      specifies a minimum age of 18 and a maximum age of 120 for the adult cohort.
    - >-
      Pediatric participants were enrolled only at pediatric sites under separate approval and are
      released as a separate dataset.
  source_caveats: >-
    The IRB number 004890 that appears in the bundle belongs to the separate feasibility study of
    the collection application conducted at the University of South Florida Health Voice Center, not
    to the Bridge2AI Voice Data Acquisition protocol under which this dataset was collected. No IRB
    number for the data acquisition protocol is stated in the bundle.

at_risk_populations:
  at_risk_groups_included: true
  special_protections:
    - >-
      Participants with cognitive impairment, dementia and psychiatric conditions were enrolled
      under the neurological and the mood and psychiatric cohorts.
    - >-
      The IRB protocol discloses that answering some of the questions asked of participants in
      cohorts such as mood disorders, depression and anxiety can lead to discomfort and could
      trigger negative emotions, and identifies this as the principal non-privacy risk of
      participation.
    - >-
      Participation was explained as voluntary and as having no bearing on medical care, potential
      participants were asked to explain back what they had understood, and about thirty minutes
      was allowed for explanation and questions.

ethical_reviews:
  - reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      Data collection and sharing were reviewed and approved. United States participating
      institutions joined through the single IRB process once the protocol was approved at the
      University of South Florida. Canadian institutions applied separately for research ethics
      board approval and submitted copies of their approvals. The protocol has been amended
      repeatedly since its January 2023 version, including to add the pediatric cohort, to add
      participant compensation, to permit electronic, remote and video consent, to add control
      participants, and to add Spanish-language data collection.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Prospective written informed consent, obtained on paper, electronically through REDCap survey
      forms or within the collection application, or by video recording in which the participant
      reads a statement aloud. Video consent provides an additional level of security by helping to
      verify identity and to distinguish participants from bots.
    consent_documentation: >-
      Paper consent documents were uploaded and saved electronically in REDCap. All paper and
      electronic versions of consent are stored for a minimum of five years after completion of the
      study, following required institutional procedure.
    consent_scope: >-
      Participants consented to the collection and use of their data and to the sharing of research
      data that does not contain their direct identifiers with external researchers through a
      secure database. Data posing a low risk of individual re-identification is shared in
      registered access with the general public; data that would pose a heightened risk of
      re-identification if shared in full open access is shared through a controlled access
      mechanism with authorized researchers. Participants who consent also permit investigators to
      access medical information through EHR platforms in order to perform gold-standard validation
      of diagnoses and symptoms. The consent imposes no restriction limiting use to non-commercial
      purposes, to a specific geographic location, to a specific type of research, to genetic
      research, or to research that does not involve the development of methods or algorithms.
    withdrawal_mechanism: >-
      Consenting participants are informed that they may withdraw from the study at any point. If a
      participant chooses to withdraw during or before the voice data collection, their data is not
      included in the database; participants are informed that research data, including voice
      recordings, cannot be removed from the database once the voice data collection process is
      completed. For longitudinal collection, an electronic consent is administered before each
      subsequent data collection session to ensure ongoing consent.

collection_consents:
  - consent_details: >-
      In most cases consent took place in the clinic setting of the recruiting high-volume expert
      clinic and was conducted by research assistants, who explained the study in detail, allowed
      time for questions, and asked potential participants to explain back what they had
      understood. Consent could also be obtained remotely in advance of data collection, in which
      case participants were notified of any changes to the study and re-consented before data
      collection. Participants were informed that participation is voluntary and does not affect
      their medical care in any way.

collection_notifications:
  - notification_details: >-
      Individuals were notified about the data collection: participants went through an
      IRB-approved consent process before any data were collected, in which the purpose of the
      collection, the data being collected, and the methods used to secure the data were explained.

consent_revocations:
  - revocation_details: >-
      If a participant chooses to withdraw during or before the voice data collection, their data
      is not included in the database. Participants are informed that research data, including
      voice recordings, cannot be removed from the database once the voice data collection process
      is completed. For longitudinal collection, an electronic consent is administered before each
      subsequent data collection session to ensure ongoing consent, and participants may leave the
      study at any point during the study period. Participants who withdraw, decline, or express
      hesitation may optionally complete a satisfaction survey to help the team understand their
      reasons; no protected health information is collected in that survey.

participant_privacy:
  - anonymization_method: >-
      Removal of direct identifiers and of indirect identifiers that created a significant
      re-identification risk, following HIPAA Safe Harbor and supplemented by review from a team of
      ethicists; removal of all raw audio; and removal of dense features derived from free-speech
      prompts.
    privacy_techniques: >-
      Assignment of a unique de-identified study identifier in place of participant names; Rebasing
      and replacement of dates by integers; Removal or generalization of geographic information,
      with state and province removed; Removal of narrative text fields and transcripts of free
      speech audio; Withholding of raw audio behind a controlled access mechanism; Storage of
      identifiable data within each collecting institution only, on password-protected REDCap
      databases accessible to approved investigators at that institution; Planned use of federated
      learning so that models can be trained across institutions without the underlying data
      leaving each institution
    reidentification_risk: >-
      K-anonymization at k greater than or equal to two is not achieved. Voice is inherently
      identifying: even when all HIPAA-protected information associated with a participant is
      removed, each person's voice is unique to them and to their health at that point in their
      life, so it is always possible, if unlikely, that someone could recognize a participant's
      voice. All raw voice data was therefore removed from the registered-access release, as it has
      the potential to cause individual re-identification or to be used for illicit or unauthorized
      purposes.
    data_linkage: >-
      Participants consented to investigators accessing medical information through EHR platforms
      for gold-standard validation of diagnoses and symptoms. The released data are not linked to
      identifiable records, and recipients may not attempt to link the data in order to contact or
      re-identify participants.

participant_compensation:
  - compensation_provided: true
    compensation_type: Electronic gift cards
    compensation_amount: >-
      USD 40 for a data collection session taking less than 90 minutes and USD 80 for a session
      taking over 90 minutes, for no more than three sessions and a maximum compensation of USD 120
      per participant.
    compensation_rationale: >-
      Participants were compensated for their time. Compensation was provided to the adult
      population only.
    source_caveats: >-
      The feasibility publication states that participants did not receive financial incentives;
      that statement describes the separate 47-participant feasibility study of the collection
      application, not the data acquisition study documented here. The IRB revision history records
      that compensation for participating adults was added to the protocol in August 2023 and that
      the amount was changed in July 2024 and again in September 2024.

data_protection_impacts:
  - impact_details: >-
      No data protection impact assessment of the dataset and its use on data subjects has been
      conducted.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts the current
      release, maintains the technical infrastructure and provides continued access to interested
      researchers.
  - role: academic_institution
    maintainer_details: >-
      The Bridge2AI-Voice consortium curates the data and operates the Data Access Compliance
      Office, reachable at DACO@b2ai-voice.org, which handles requests for controlled access to raw
      audio.
  - role: academic_institution
    maintainer_details: >-
      The Health Data Nexus, a data publishing platform maintained by the Temerty Centre for
      Artificial Intelligence Research and Education in Medicine at the University of Toronto,
      hosted the earlier feature-only release and provides cloud compute alongside that dataset
      rather than allowing data downloads.
  - role: government_agency
    maintainer_details: >-
      The dataset is supported by the National Institutes of Health via the Bridge2AI program.

updates:
  frequency: Semi-annual
  update_details: >-
    Further versions of the dataset are released roughly twice a year and distributed as new
    versions on the hosting platform. Users are notified through news items on the platform and
    through standard communication channels. A changelog for each dataset version is published
    online with the dataset metadata. Updates correct labeling errors, add new instances and
    reorganize the distribution; the consortium anticipates enrolling 10,000 participants by 2027
    and expanding to remote collection, Spanish-language protocols and additional multimodal data.

version_access:
  latest_version_doi: "doi:10.13026/37yb-1t42"
  versions_available:
    - "1.0 — released on the Health Data Nexus, November 2024, doi 10.57764/qb6h-em84"
    - "1.1 — 17 January 2025, doi 10.13026/249v-w155, restricted access"
    - "2.0.0 — 16 April 2025"
    - "2.0.1 — 18 August 2025"
    - "3.0.0 — 16 December 2025, doi 10.13026/k81f-qr68"
    - "3.1.0 — 1 May 2026, doi 10.13026/8xbn-nq66"
  version_details: >-
    By default older versions of the dataset continue to be supported, hosted and made available to
    researchers, and each version of the dataset has a unique DOI, with a separate DOI resolving to
    the latest version. The dataset publishers reserve the right to remove access to older
    versions; the files for version 1.1 are no longer available and users are directed to the
    latest version.

errata:
  - erratum_details: >-
      Version 3.1.0 fixed broken parquet files distributed in version 3.0.0.
    erratum_url: https://physionet.org/content/b2ai-voice/3.1.0/
  - erratum_details: >-
      Version 2.0 reprocessed the spectrograms to fix minor issues identified in the version 1.1
      release, and removed all spectrograms and Mel-frequency cepstral coefficients derived from
      free-speech files.
  - erratum_details: Version 2.0.1 corrected the authorship list.
  - erratum_details: >-
      Version 3.1.0 updated validated diagnosis information across conditions with back-filled
      information, rearranged some phenotype files, and renamed certain gold standard variable
      names.

retention_limit:
  retention_period: >-
    Indefinite for the published dataset; two years, or until project completion or expiry of the
    applicable ethics approval, for recipients under the data transfer and use agreement.
  retention_details: >-
    Once data is contributed it will be retained as long as it is useful for research purposes,
    possibly indefinitely. Recipients of the data must destroy or return it in accordance with the
    provider's instructions two years after the agreement start date, upon completion of the
    project, upon termination, or upon expiration of the applicable ethics approval, whichever
    occurs first, and must submit written certification of destruction within thirty days;
    recipients may retain one copy as necessary to comply with records retention requirements and
    for research integrity and verification. Separately, the IRB protocol provides that
    identifiable data and the datasheets linking participant numbers to participant information are
    kept within each institution on local cloud storage for a maximum of ten years after study
    completion and are then destroyed, and that de-identified study data and original consent forms
    are stored for a minimum of five years after study completion.

extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    For dataset extensions and augmentations, others may publish a derivative dataset on the
    hosting platform which references the original source; derivative datasets may be made
    available under the same conditions as the source data. For augmentations to the code used to
    produce the data, the open-source repositories have discussion forums and issue pages that
    allow public discussion of data preprocessing, and a pull request mechanism for contributing
    improvements to the preprocessing code.

related_datasets:
  - relationship_type: is_supplemented_by
    target_dataset: "doi:10.13026/h995-bt35"
    description: >-
      The Bridge2AI-Voice Pediatric Dataset version 1.1.0, a companion release containing derived
      audio features for 23,533 recordings from 300 participants aged 2 to 18 recruited at the
      Hospital for Sick Children, collected with the ReproSchema-UI pediatric protocol and approved
      by the Hospital for Sick Children Research Ethics Board. Raw audio for the pediatric cohort is
      available under controlled access at https://www.synapse.org/Synapse:syn73617068
  - relationship_type: is_new_version_of
    target_dataset: "doi:10.13026/k81f-qr68"
    description: >-
      Version 3.0.0, the immediately preceding release, which added data for 391 participants,
      separated the single phenotype data file into individual files, and introduced Speech
      Articulatory Coding features and phonetic posteriorgrams.
  - relationship_type: is_new_version_of
    target_dataset: "doi:10.57764/qb6h-em84"
    description: >-
      Version 1.0, the first release of the dataset, published on the Health Data Nexus platform,
      which provides cloud compute alongside the dataset rather than allowing data downloads.
  - relationship_type: is_documented_by
    target_dataset: "doi:10.5281/zenodo.12760724"
    description: >-
      The Bridge2AI Voice REDCap data dictionary, metadata and instrument PDFs, which define the
      questionnaire and clinical validation instruments used to collect the phenotype data and
      encode which fields are sensitive.
  - relationship_type: is_described_by
    target_dataset: "doi:10.21437/Interspeech.2024-1926"
    description: >-
      Bensoussan, Y. et al. "Developing Multi-Disorder Voice Protocols: A team science approach
      involving clinical expertise, bioethics, standards, and DEI", Proc. Interspeech 2024,
      1445-1449, which describes the development of the data acquisition protocols.

use_repository:
  - repository_details: >-
      No repository or registry tracks the papers or systems that use this dataset beyond general
      scholarly search.

notes: >-
  The consortium publishes a self-assessment of the dataset against the Bridge2AI AI-readiness
  recommendations. Criteria fully met are FAIRness (findable, accessible, interoperable, reusable),
  Provenance (transparent, traceable, interpretable, key actors identified), Pre-model
  explainability (data documentation templates, fit for purpose, verifiable), and Ethics (ethically
  acquired, ethically managed, ethically disseminated, secure). Characterization scores 80 percent,
  with semantics, statistics, standards and potential sources of bias met but data quality not met.
  Computability scores 75 percent, with standardized, computationally accessible and portable met
  but contextualized not met. Sustainability scores 50 percent, with persistent and well-governed
  met but domain-appropriate and associated not met.

source_caveats: >-
  This record describes the adult Bridge2AI-Voice dataset as published in PhysioNet version 3.1.0,
  the highest-ranked and most recent source in the bundle. The bundle also describes a separate
  pediatric dataset, which is recorded here as a related dataset rather than merged into this
  record. Where the project documentation and the PhysioNet release notes disagree, the PhysioNet
  entries were preferred as the higher-ranked source: the documentation states that version 3.0
  contains approximately 61,937 voice-derived recordings from 833 adult participants, while
  PhysioNet reports per-feature record counts between 29,020 and 32,236 for version 3.0.0 and
  between 23,533 and 32,522 for version 3.1.0; the per-feature counts are used here and no single
  aggregate recording count is asserted. Sources also disagree on several investigator
  affiliations: for Frank Rudzicz the project documentation and IRB protocol give the University of
  Toronto while the feasibility publication's consortium list gives Dalhousie University; for
  Alistair Johnson the IRB protocol and audiomics white paper give the Hospital for Sick Children
  while the feasibility publication gives the University of Toronto; for Vardit Ravitsky the
  project documentation and white paper give The Hastings Center while the feasibility publication
  gives the University of Montreal. In each case the higher-ranked documentation or IRB was
  preferred. Much of the healthsheet and study metadata in the project documentation was written
  for versions 1.0 to 2.0.0 — the study metadata section is explicitly labeled for version 2.0.0 and
  the maintenance section describes hosting on the Health Data Nexus rather than PhysioNet — and has
  been read as describing the collection and governance arrangements that continue to apply, with
  hosting and version facts taken from PhysioNet. The feasibility publication describes a separate
  single-site study of 47 participants evaluating the usability of the collection application in
  June and July 2023, during which audio data was not collected; its participant characteristics,
  task completion rates and IRB number belong to that study and are not attributed to this dataset.
  The NIH RePORTER page and the IRB protocol describe the broader four-year data acquisition
  project, including five disease cohorts, longitudinal collection, imaging and genomic modalities
  and a target of 30,000 participants; only the elements reflected in the released dataset are
  recorded here, and the wider project scope is not asserted as dataset content.