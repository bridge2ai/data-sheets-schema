was_derived_from: >-
  Raw voice, speech and respiratory audio waveforms and questionnaire responses
  collected from pediatric participants with reproschema-ui; the released
  features were derived from those waveforms with the b2aiprep library.
keywords:
  - health
  - pediatric
  - biomarkers
  - bridge2ai
  - voice
description: >-
  The Bridge2AI-Voice Pediatric Dataset is a credentialed-access PhysioNet
  database of derived audio features and linked phenotypic data collected from
  children and adolescents. Version 1.1.0 contains derived audio features for
  23,533 recordings collected from 300 participants aged 2-18, together with
  detailed demographic, clinical and validated questionnaire data. The release
  contains data considered low risk, including derivations such as spectrograms,
  but not the original voice recordings; raw audio is disseminated separately
  under a more involved, institutionally signed-off access process. Participants
  were patients and healthy volunteers considered for enrollment at the Hospital
  for Sick Children, and all data were collected on tablets through customized
  software (reproschema-ui) using a standardized, age-appropriate protocol. The
  dataset is part of the Bridge2AI-Voice project, which seeks to create an
  ethically sourced flagship dataset enabling artificial intelligence research
  into voice as a biomarker of health; the pediatric release exists because
  pediatric and adult voice and speech production are fundamentally different,
  so normative evidence derived in adults cannot be generalized to children.
citation: >-
  Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M., Dorr, D.,
  Payne, P., Ravitsky, V., Bélisle-Pipon, J., Bahr, R., Watts, S., Bolser, D.,
  Siu, J., Lerner-Ellis, J., Rudzicz, F., Boyer, M., Abdel-Aty, Y., Ahmed Syed,
  T., Amraei, D., ... Ghosh, S. (2026). Bridge2AI-Voice Pediatric Dataset
  (version 1.1.0). PhysioNet. RRID:SCR_007345.
  https://doi.org/10.13026/h995-bt35
source_caveats: >-
  Only one of the six documents in the declared source bundle
  (https://physionet.org/content/b2ai-voice-pediatric/1.1.0/) is specific to this
  dataset. The project documentation site, the USF IRB protocol, the NIH RePORTER
  page, the Data Transfer and Use Agreement and the documentation repository
  README describe the Bridge2AI-Voice study and consortium as a whole, and large
  parts of the documentation site describe the separate adult dataset (its
  healthsheet answers are explicitly scoped to adult releases v2.0.0 and v3.0.0,
  including the counts of 833 participants and ~61,937 recordings). Values in
  this record are taken from the pediatric release page wherever it speaks, and
  consortium-level or study-level statements are marked as such in the slot where
  they appear. Statements that the bundle makes only about the adult dataset
  (bias characterisation, collection timeframe, labeling protocol, existing uses,
  data splits, transcription content warnings, semi-annual update cadence,
  indefinite retention) are omitted rather than transferred to this dataset.

