file_collections:
  - id: features
    name: features
    path: features
    collection_type: processed_data
    description: >-
      Derived audio features for the released recordings. Binary files are
      provided as Parquet, an open-source column-oriented file format; each
      element of a parquet file carries a unique participant identifier
      (participant_id), a unique recording-session identifier (session_id), the
      task performed (task_name), the number of time frames for that feature
      (n_frames), and the tensor data for the feature. The folder also contains
      plain-text feature tables and, for every data file, a JSON data dictionary
      with the same file stem whose keys are the column names of the associated
      data file.
    resources:
      - id: features/torchaudio_spectrograms.parquet
        name: torchaudio_spectrograms.parquet
        path: features/torchaudio_spectrograms.parquet
        description: >-
          Spectrograms of dimension 201xT generated using the short-time Fast
          Fourier Transform with a 25 ms window size, 10 ms hop length and a
          400-point FFT. n=23533.
      - id: features/torchaudio_mel_spectrograms.parquet
        name: torchaudio_mel_spectrograms.parquet
        path: features/torchaudio_mel_spectrograms.parquet
        description: >-
          Mel spectrograms of dimension 60xT generated with a 25 ms window size,
          10 ms hop length, a 400-point FFT and 60 Mel bins. n=23533.
      - id: features/torchaudio_mfcc.parquet
        name: torchaudio_mfcc.parquet
        path: features/torchaudio_mfcc.parquet
        description: >-
          Mel-frequency cepstrum coefficients of dimension 60xT using the same
          parameters as the Mel spectrograms. n=23533.
      - id: features/torchaudio_pitch.parquet
        name: torchaudio_pitch.parquet
        path: features/torchaudio_pitch.parquet
        description: >-
          Detected pitch (fundamental frequency) over time, of dimension T, with
          a minimum and maximum pitch of 80 and 500 respectively. n=23533.
      - id: features/sparc_ema.parquet
        name: sparc_ema.parquet
        path: features/sparc_ema.parquet
        description: >-
          Estimated electromagnetic articulography (EMA) produced by a deep
          learning model, of dimension Tx12, where the 12 values correspond to
          X/Y positions of six articulators: tongue dorsum, tongue body, tongue
          tip, lower incisor, upper lip and lower lip. n=23532.
      - id: features/sparc_loudness.parquet
        name: sparc_loudness.parquet
        path: features/sparc_loudness.parquet
        description: >-
          Estimated loudness based on the average absolute amplitude of the audio
          waveform, of size T, using 20 ms windows. n=23532.
      - id: features/sparc_periodicity.parquet
        name: sparc_periodicity.parquet
        path: features/sparc_periodicity.parquet
        description: >-
          Estimated periodicity (confidence of pitch presence) derived from the
          audio using 20 ms windows, of dimension T. n=23532.
      - id: features/sparc_pitch.parquet
        name: sparc_pitch.parquet
        path: features/sparc_pitch.parquet
        description: >-
          Estimated fundamental frequency (F0) of the audio signal computed with
          a different algorithm from torchaudio_pitch, with a range of 50-550 Hz
          and dimension T. n=23532.
      - id: features/ppgs.parquet
        name: ppgs.parquet
        path: features/ppgs.parquet
        description: >-
          Phonetic posteriorgram probabilities across 40 phoneme categories,
          giving a dimension of 40xT with a frame rate of 100 Hz. n=23533.
      - id: features/static_features.tsv
        name: static_features.tsv
        path: features/static_features.tsv
        format: TSV
        media_type: text/tab-separated-values
        description: >-
          Plain-text table of features derived with openSMILE, Praat,
          parselmouth and torchaudio; each such feature is present in this file.
      - id: features/audio_quality_metrics.tsv
        name: audio_quality_metrics.tsv
        path: features/audio_quality_metrics.tsv
        format: TSV
        media_type: text/tab-separated-values
        description: >-
          Metrics related to audio quality derived from the recordings, newly
          released in version 1.1.
  - id: phenotype
    name: phenotype
    path: phenotype
    collection_type: processed_data
    description: >-
      Phenotypic information acquired during data collection, including
      demographic, clinical and validated questionnaire data. Phenotype files are
      plain-text tables readable with any statistical analysis tool.
  - id: metadata
    name: metadata
    path: metadata
    collection_type: metadata
    description: >-
      Per-recording metadata information, newly released in version 1.1.

purposes:
  - id: purpose_voice_biomarker_research
    name: Enable artificial intelligence research into voice as a biomarker of health
    response: >-
      The Bridge2AI-Voice project seeks to create an ethically sourced flagship
      dataset to enable future research in artificial intelligence and support
      critical insights into the use of voice as a biomarker of health. The human
      voice contains complex acoustic markers which have been linked to important
      health conditions; viewed as a biomarker, voice is promising because it is
      simple to collect, cost-effective and has broad clinical utility.
  - id: purpose_pediatric_voice_development
    name: Support understanding of pediatric voice and speech development
    response: >-
      Understanding voice and speech development in children is essential for
      identifying communication or speech disorders early in life and for
      supporting timely intervention. Establishing a robust multi-institutional
      dataset that integrates pediatric voice data with demographic information
      would advance the understanding of voice and disease as well as early
      detection and intervention.

tasks:
  - id: task_developmental_norms
    name: Study of pediatric developmental norms
    response: >-
      Resources such as this project are intended to enable study of
      developmental norms in pediatric voice and speech.
  - id: task_early_screening_tools
    name: Development of AI-driven tools for early screening
    response: >-
      The project is intended to support the creation of AI-driven tools for
      early screening of pediatric communication and speech disorders.
  - id: task_clinical_insight
    name: Support of clinical insight
    response: >-
      The resource is intended to support clinical insight into pediatric voice
      and disease.

addressing_gaps:
  - id: gap_adult_norms_not_generalizable
    name: Adult normative data cannot be generalized to children
    response: >-
      Pediatric and adult voice and speech production are fundamentally different
      because the respiratory system and larynx undergo rapid functional
      maturation and development throughout childhood. These developmental
      changes can influence acoustic features such as fundamental frequency (F0).
      As a result, evidence and normative data available in adults cannot be
      generalized to pediatric populations.
  - id: gap_scarce_pediatric_datasets
    name: Scarcity of large-scale pediatric voice datasets
    response: >-
      Despite the clinical importance of detecting pediatric communication
      disorders such as autism spectrum disorder and speech delays, the
      availability of large-scale pediatric databases and datasets remains
      limited. Data collection in pediatric populations poses unique challenges
      such as privacy issues, consent processes and the need for developmentally
      appropriate tasks; these factors have contributed to the lack of publicly
      accessible pediatric datasets that enable machine learning for pediatric
      voice analysis.

