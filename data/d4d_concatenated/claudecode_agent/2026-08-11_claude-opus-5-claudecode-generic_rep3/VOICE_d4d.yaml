    The documentation site notes that the repository "is under review for potential
    modification in compliance with Administration directives", so the availability of
    these resources is stated by the source to be under review.

file_collections:
- id: d4d:voice_fc_features
  name: features
  title: Derived audio features
  path: features/
  collection_type: processed_data
  description: >-
    Features derived from the raw audio waveforms, released in place of the waveforms
    themselves. Dense features are stored as Parquet; each Parquet element carries the
    participant identifier, session identifier, task name, number of time frames and the
    feature tensor. Static per-recording features and audio-quality metrics are stored as
    tab-delimited text. Every file has a JSON data dictionary with the same file stem
    describing the feature and the processing used to prepare it. Spectrograms, Mel
    spectrograms, MFCCs, phonetic posteriorgrams and EMA traces for sensitive records and
    audio checks were removed from v3.1, and some recordings could not generate certain
    features and are absent from the bundled data.
  version: 3.1.0
  source_caveats: >-
    The release lists the dense feature files in the singular ("torchaudio_spectrogram.parquet",
    "torchaudio_mfcc.parquet", "torchaudio_mel_spectrogram.parquet") in its folder listing and
    in the plural in the per-file descriptions that carry the record counts. The singular form
    from the folder listing is used for the file names and the counts are taken from the
    matching per-file descriptions.
  resources:
  - id: d4d:voice_file_torchaudio_spectrogram
    name: torchaudio_spectrogram.parquet
    path: features/torchaudio_spectrogram.parquet
    description: >-
      29,278 records of spectrograms of dimension 201xT generated with the short-time
      fast Fourier transform using a 25 ms window, 10 ms hop length and a 400-point FFT.
  - id: d4d:voice_file_torchaudio_mel_spectrogram
    name: torchaudio_mel_spectrogram.parquet
    path: features/torchaudio_mel_spectrogram.parquet
    description: >-
      29,278 records of Mel spectrograms of dimension 60xT generated with a 25 ms window,
      10 ms hop length, a 400-point FFT and 60 Mel bins.
  - id: d4d:voice_file_torchaudio_mfcc
    name: torchaudio_mfcc.parquet
    path: features/torchaudio_mfcc.parquet
    description: >-
      29,278 records of Mel-frequency cepstral coefficients of dimension 60xT computed
      with the same parameters as the Mel spectrograms.
  - id: d4d:voice_file_torchaudio_pitch
    name: torchaudio_pitch.parquet
    path: features/torchaudio_pitch.parquet
    description: >-
      32,522 records of detected pitch (fundamental frequency) over time, of dimension T,
      with minimum and maximum pitch of 80 and 500 Hz.
  - id: d4d:voice_file_sparc_ema
    name: sparc_ema.parquet
    path: features/sparc_ema.parquet
    description: >-
      28,640 records of estimated electromagnetic articulography of dimension Tx12, the
      twelve channels being the X and Y positions of six articulators: tongue dorsum,
      tongue body, tongue tip, lower incisor, upper lip and lower lip.
  - id: d4d:voice_file_sparc_loudness
    name: sparc_loudness.parquet
    path: features/sparc_loudness.parquet
    description: >-
      31,855 records of estimated loudness of size T, based on the average absolute
      amplitude of the waveform over 20 ms windows.
  - id: d4d:voice_file_sparc_periodicity
    name: sparc_periodicity.parquet
    path: features/sparc_periodicity.parquet
    description: >-
      31,872 records of estimated periodicity, the confidence of pitch presence, derived
      over 20 ms windows with dimension T.
  - id: d4d:voice_file_sparc_pitch
    name: sparc_pitch.parquet
    path: features/sparc_pitch.parquet
    description: >-
      31,872 records of estimated fundamental frequency computed with a different
      algorithm from torchaudio_pitch, over a range of 50-550 Hz and of dimension T.
  - id: d4d:voice_file_ppgs
    name: ppgs.parquet
    path: features/ppgs.parquet
    description: >-
      29,289 records of phonetic posteriorgram probabilities across 40 phoneme categories,
      of dimension 40xT at a frame rate of 100 Hz.
  - id: d4d:voice_file_static_features
    name: static_features.tsv
    path: features/static_features.tsv
    format: TSV
    description: >-
      Static features derived from the raw audio with one row per unique recording,
      computed with openSMILE, Praat, Parselmouth and torchaudio.
  - id: d4d:voice_file_audio_quality_metrics
    name: audio_quality_metrics.tsv
    path: features/audio_quality_metrics.tsv
    format: TSV
    description: >-
      Quality-control metrics derived from each raw audio recording, one row per
      recording. Added in v3.1.0.
- id: d4d:voice_fc_phenotype
  name: phenotype
  title: Phenotypic data tables
  path: phenotype/
  collection_type: processed_data
  description: >-
    Information collected from the participant or another individual during the encounter,
    organised into confounders, demographics, diagnosis, enrollment, questionnaire and
    task subfolders. Every table is a tab-delimited file paired with a JSON data dictionary
    of the same file stem, whose keys match the column names and whose values give a
    one-sentence description of the column, the question asked to elicit the answer and the
    data type of the response. Rows appear for a participant only if at least one column is
    non-missing, and because participants may attend repeated visits there may be more than
    one row per participant, with no requirement that responses agree across visits. The
    diagnosis subfolder holds one table per condition (airway stenosis, amyotrophic lateral
    sclerosis, anxiety, benign lesions, bipolar disorder, cognitive impairment, control,
    COPD and asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal
    dystonia, laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous
    lesions, unexplained chronic cough and unilateral vocal fold paralysis); the
    questionnaire subfolder holds the validated instruments (ADHD adult, custom affect
    scale, DSM-5 adult, dyspnea index, GAD-7, Leicester cough questionnaire, PANAS, PHQ-9,
    productive vocabulary, psychiatric history, PTSD adult, VHI-10 and voice perception);
    and the task subfolder holds acoustic task, Harvard sentences, random item generation,
    recording, session, Stroop and Winograd tables.
  version: 3.1.0
- id: d4d:voice_fc_metadata
  name: metadata
  title: Per-recording metadata
  path: metadata/
  collection_type: metadata
  description: >-
    A Parquet file and its data dictionary carrying information specific to each recording,
    including task instructions and prompts and information about the microphone used and
    its gain. Added in v3.1.0.
  version: 3.1.0

purposes:
- id: d4d:voice_purpose_biomarker_database
  name: Establish a large, ethically sourced voice database for biomedical AI
  response: >-
    The Bridge2AI-Voice dataset was created to address a gap in the availability of
    large-scale, diverse and well-documented voice data for clinical machine-learning
    applications. Earlier studies of machine-learning voice diagnosis produced promising
    results but used sample sizes that were too small or lacked the metadata needed to
    train robust, clinically useful models. The dataset aims to bridge that gap by
    providing an ethically sourced, large and diverse resource with which to develop,
    benchmark or validate clinically applicable AI and ML models, so that voice can be
    used as a non-invasive, cost-effective biomarker for the screening, diagnosis and
    monitoring of a wide range of health conditions.
- id: d4d:voice_purpose_research_applications
  name: Support research applications rather than administrative ones
  response: >-
    The dataset is primarily intended for research applications, specifically the
    development of AI and machine-learning models for healthcare, and to support clinical
    research in disease screening, diagnosis and monitoring through voice biomarkers.

tasks:
- id: d4d:voice_task_data_acquisition_module
  name: Data acquisition module
  response: >-
    To build a multi-modal, multi-institutional, large-scale, diverse and ethically
    sourced human voice database linked to other biomarkers of health that is friendly to
    AI and ML methods.
- id: d4d:voice_task_standards_module
  name: Standards module
  response: >-
    To introduce the field of acoustic biomarkers by developing new standards for acoustic
    and voice data collection and analysis for voice AI research, and to create
    bioinformatics standards that make voice data interoperable.
- id: d4d:voice_task_tool_development
  name: Tool development and optimization
  response: >-
    To develop software and cloud infrastructure for automated voice data collection
    through a smartphone application allowing non-invasive, user-friendly, high-quality
    collection while minimising human manipulation, including integrated acoustic
    amplifiers and acoustic quality standardization, and to implement federated learning
    so that multi-institutional data can be analysed without data leaving each institution.
- id: d4d:voice_task_ethics_module
  name: Ethics module
  response: >-
    To integrate existing scholarship, tools and guidance with new normative insight for
    identifying, anticipating and addressing ethical and trustworthiness issues arising
    from voice data generation and voice AI research through to clinical adoption, and to
    develop new guidelines for consenting to voice data collection, sharing and use.
- id: d4d:voice_task_teaming_module
  name: Teaming module
  response: >-
    To build bridges between medical voice research, acoustic engineering and the AI/ML
    world so that voice AI algorithms acquire tangible clinical application.
- id: d4d:voice_task_workforce_module
  name: Skills and workforce development module
  response: >-
    To develop a curriculum on voice biomarkers of health and on the development,
    validation and implementation of AI models that are FAIR and CARE, and to create a
    community of voice AI researchers, especially from underserved communities.
- id: d4d:voice_task_ml_tasks
  name: Machine-learning tasks defined on the released data
  response: >-
    The current version comes with predefined tasks and labelling designed primarily for
    training machine-learning models for disease detection and classification from voice.
    Labels include diagnostic categories such as vocal pathologies, neurological disorders,
    psychiatric conditions and respiratory disorders.

addressing_gaps:
- id: d4d:voice_gap_small_datasets
  name: Small, non-standardised and private voice datasets
  response: >-
    Existing work on voice as a biomarker has been limited to small- and medium-sized
    datasets, often using voice as the only data type, and comparing studies or pooling
    data has been difficult because there are no standards for how voice and speech data
    are collected. Industry datasets are often private, which prevents auditing of models
    and of the accuracy of training labels. For machine-learning applications in laryngeal
    cancer screening and diagnosis, most reported training datasets contained fewer than
    300 patients and only two studies used more than one data modality.
- id: d4d:voice_gap_linked_health_data
  name: Voice data unlinked to multimodal health information
  response: >-
    Current literature is largely restricted to acoustic measures not linked to
    multi-modal health data. Bridge2AI-Voice addresses this by linking acoustic data to
    demographics, confounders, validated questionnaires, clinician-validated diagnoses
    and, at some sites, imaging and genomic data, so that audiomics can be integrated
    into multi-omics analysis.
- id: d4d:voice_gap_ethics_and_diversity
  name: Ethical, legal and diversity gaps in voice AI
  response: >-
    The consortium set out to define ethical and legal norms that safeguard participants'
    data while supporting data sharing, to create benchmarks of diversity metrics and
    minimise the risk of algorithmic bias, and to address risks of voice re-identification,
    voice AI hacking, and the influence of gender and racial diversity on the development
    of these technologies.

