    The dataset documentation answers "NA" when asked whether there are guarantees that
    external resources will exist and remain constant over time and whether official
    archival versions exist, and states that the dataset itself is self-contained.
  restrictions:
  - The REDCap data dictionary and metadata repository is released under the MIT license.
  - The b2aiprep preparation library is released under the Apache-2.0 license.
  - The documentation and dashboard source is released under the MIT license.
