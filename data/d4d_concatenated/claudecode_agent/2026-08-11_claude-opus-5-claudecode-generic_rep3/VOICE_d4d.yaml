  RRID:SCR_007345. https://doi.org/10.13026/8xbn-nq66'
source_caveats: >-
  The bundle disagrees with itself on several figures and these are reported rather
  than resolved. Target size: the project documentation states a flagship dataset of
  10,000 voices and an anticipated enrollment of 10,000 by 2027, while the audiomics
  white paper and the IRB protocol state 30,000 voices; both are aims, and neither
  describes any release. Recording counts: the project documentation states that
  version 3.0 contains approximately 61,937 voice-derived recordings from 833 adult
  participants, whereas the PhysioNet v3.0.0 and v3.1.0 pages give per-feature record
  counts (for v3.1.0, 29,278 spectrogram records and 32,522 pitch records), and the
  two accounts are not reconciled anywhere in the bundle. Version currency: sections
  of the project documentation are written against v2.0.0 (study population, language
  options) and others against v3.0.0, while the PhysioNet pages carry v1.1, v3.0.0
  and v3.1.0. Access tier: the v1.1 PhysioNet page is labelled "Restricted Access"
  with a registered-user policy, and the v3.0.0 and v3.1.0 pages are labelled
  "Credentialed Access". Distribution platform: the healthsheet describes distribution
  through Health Data Nexus, whereas versions 1.1 onward are published on PhysioNet.
  Award identifiers: two award strings in the project documentation
  ("3TF-OT2ActfOD032720Projectf01S1" and "Award #3Tf-OTOD03272001S2") are garbled in
  the captured text and are recorded under the funders entry as transcribed.

external_resources:
- id: d4d:voice_external_resources
  name: Supporting code, metadata and training resources
  description: >-
    The dataset is accompanied by open-source software and metadata repositories that
    are published separately from the data files: the b2aiprep library used to convert
    raw waveforms into the released features and to merge source data into the
    phenotype files; the senselab audio processing toolkit; the bridge2ai-redcap
    repository holding the REDCap data dictionary, metadata and instrument PDFs; the
    bridge2ai-docs repository behind the project documentation site; FHIR profiles for
    voice as a biomarker; and a scholars programme site offering training in the use of
    the dataset.
  external_resources:
