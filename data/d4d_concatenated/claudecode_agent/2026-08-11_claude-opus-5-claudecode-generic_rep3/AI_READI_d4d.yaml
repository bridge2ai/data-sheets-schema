      356,343 files reported for the dataset, leaving 9. No byte total is stated for these
      files, so total_bytes is left absent.

subsets:
  - id: https://doi.org/10.60775/fairhub.3#public-set
    name: Publicly accessible dataset
    is_data_split: false
    is_subpopulation: false
    description: >-
      The publicly accessible set has fewer requirements for access than the controlled-access
      set. It includes survey data, blood and urine lab results, fitness activity levels,
      clinical measurements such as monofilament and cognitive function testing, retinal
      images, ECG, blood sugar levels and environmental variables such as home air quality. It
      contains no protected health information and omits sex, race/ethnicity and medication
      information. Access requires login through a verified ID system, agreement to use the
      data only for type 2 diabetes related research, and agreement to the licence terms.
  - id: https://doi.org/10.60775/fairhub.3#controlled-access-set
    name: Controlled access dataset
    is_data_split: false
    is_subpopulation: false
    description: >-
      The controlled access set contains all data available in the publicly accessible set,
      plus more sensitive data that are only available for use by scientists whose institutions
      have completed legal and privacy use agreements with the AI-READI research programme. The
      data held under controlled access include 5-digit zip code, sex, race, ethnicity, genetic
      sequencing data, past health records, medications, and traffic and accident reports.
  - id: https://doi.org/10.60775/fairhub.3#split-train
    name: Recommended training split
    is_data_split: true
    is_subpopulation: false
    description: >-
      The recommended training partition, 70% of participants, containing 1576 of the 2280
      participants. Race/ethnicity counts are 204 Hispanic, 369 Asian, 343 Black and 660 white;
      sex counts are 599 male and 977 female; diabetes status counts are 600 with no diabetes,
      384 lifestyle-controlled, 487 oral-medication-controlled and 105 insulin-controlled; mean
      age is 61.1 years with a standard deviation of 11.3 years. Split membership is recorded in
      participants.tsv.
  - id: https://doi.org/10.60775/fairhub.3#split-validation
    name: Recommended validation split
    is_data_split: true
    is_subpopulation: false
    description: >-
      The recommended validation partition, 15% of participants, containing 352 of the 2280
      participants and balanced as far as possible for sex, race/ethnicity and diabetes status.
      Race/ethnicity counts are 88 each of Hispanic, Asian, Black and white; sex counts are 176
      male and 176 female; diabetes status counts are 88 with no diabetes, 88
      lifestyle-controlled, 109 oral-medication-controlled and 67 insulin-controlled; mean age
      is 60.3 years with a standard deviation of 10.8 years. Split membership is recorded in
      participants.tsv.
  - id: https://doi.org/10.60775/fairhub.3#split-test
    name: Recommended test split
    is_data_split: true
    is_subpopulation: false
    description: >-
      The recommended test partition, 15% of participants, containing 352 of the 2280
      participants and balanced as far as possible for sex, race/ethnicity and diabetes status.
      Race/ethnicity counts are 88 each of Hispanic, Asian, Black and white; sex counts are 176
      male and 176 female; diabetes status counts are 88 with no diabetes, 88
      lifestyle-controlled, 90 oral-medication-controlled and 86 insulin-controlled; mean age is
      60.5 years with a standard deviation of 11.4 years. Split membership is recorded in
      participants.tsv.

external_resources:
  - name: AI-READI dataset documentation
    description: >-
      The dataset is self-contained but does rely on the dataset documentation for users
      requiring additional information about the provenance of the dataset. There is one
      version of the documentation associated with each version of the dataset, navigable from
      a dropdown. The documentation contains sections on citation, preliminary information
      (access, licence, training prerequisites, the mini-subset version and Azure Storage
      access), dataset documentation using the Healthsheet template with per-domain details,
      AI-readiness, controlled variables, additional resources and a changelog.
    external_resources:
      - https://docs.aireadi.org/
      - https://docs.aireadi.org/docs/3/about
      - https://docs.aireadi.org/docs/3/citation
    restrictions:
      - >-
        The documentation is shared under the CC-BY 4.0 licence, so there are no restrictions
        associated with its use.
  - name: AI-READI project resources
    description: >-
      Project-level resources shared as part of the blueprint for future data generating
      projects, including the project website, the team page, the Zenodo community and the
      GitHub organization.
    external_resources:
      - https://aireadi.org/
      - https://aireadi.org/team
      - https://aireadi.org/contact
      - https://aireadi.org/goals/data-sharing
      - https://zenodo.org/communities/aireadi
      - https://github.com/AI-READI
  - name: Data standards and specifications
    description: >-
      Specifications for the standards the dataset content and layout follow, including the
      Clinical Dataset Structure developed by the project, the OMOP Common Data Model, DICOM,
      WFDB, Open mHealth and the NASA ASCII file format guidelines.
    external_resources:
      - https://cds-specification.readthedocs.io/en/v0.1.1/
      - https://ohdsi.github.io/TheBookOfOhdsi/CommonDataModel.html
      - http://medical.nema.org/
      - https://wfdb.readthedocs.io/en/latest/wfdb.html
      - https://www.openmhealth.org/
      - https://www.earthdata.nasa.gov/esdis/esco/standards-and-practices/ascii-file-format-guidelines-for-earth-science-data
  - name: Study documents
    description: >-
      Documents referenced from the healthsheet that describe the study conduct: the initial
      IRB approval letter, the approved consent form and the REDCap surveys and forms.
    external_resources:
      - https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf
      - https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf
      - https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf

