    description: >-
      The FAIRhub API record for this dataset lists a child dataset with id 4, and the FAIRhub
      landing page states that "A smaller version is available for pipeline development". The
      version 3.0.0 documentation lists a mini-subset version of the dataset among its
      preliminary information.
    source_caveats: >-
      The evidence for this relationship is the numeric "child": 4 field in the FAIRhub API
      response together with a truncated landing-page sentence. The bundle contains no metadata
      record for dataset 4 itself, so its title, size, DOI and exact relationship to version
      3.0.0 are not established here.
