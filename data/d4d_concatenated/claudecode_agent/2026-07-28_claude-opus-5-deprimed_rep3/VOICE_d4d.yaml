purposes:
  - name: Flagship ethically sourced voice dataset for voice AI research
    response: >-
      Bridge2AI-Voice is a Precision Public Health grand challenge project funded by the NIH
      Common Fund Bridge2AI Program. Bridge2AI-Voice seeks to create a flagship, standardized,
      and ethically sourced dataset of 10,000 voices linked to health information to fuel
      research and discovery in voice biomarkers.
  - name: Integration of voice as a biomarker of health in clinical care
    response: >-
      The group aims to integrate the use of voice as a biomarker of health in clinical care by
      generating a substantial multi-institutional, ethically sourced and diverse voice database
      linked to multimodal health biomarkers to fuel voice AI research and build predictive
      models to assist in screening, diagnosis and treatment of a broad range of diseases.
  - name: Enabling clinically applicable machine-learning models from voice
    response: >-
      The Bridge2AI Voice dataset aims to enable the development, benchmarking, or validation of
      clinically applicable machine-learning models for diagnosing a wide range of health
      conditions using voice data, including vocal pathologies, neurological, psychiatric,
      respiratory and pediatric voice disorders.
  - name: Pediatric developmental norms and early screening
    response: >-
      For the pediatric release, establishing a robust multi-institutional dataset that
      integrates pediatric voice data with demographic information is intended to advance the
      understanding of voice and disease as well as early detection and intervention, to enable
      study of developmental norms, to create AI-driven tools for early screening, and to
      support clinical insight. Pediatric and adult voice/speech production are fundamentally
      different because the respiratory system and larynx undergo rapid functional maturation
      throughout childhood, so normative data from adults cannot be generalized to pediatric
      populations.
  - name: Supporting infrastructure, standards, ethics and workforce aims
    response: >-
      Beyond the dataset itself, the project's specific aims include developing new standards of
      acoustic and voice data collection and analysis, developing software and cloud
      infrastructure for automated voice data collection, implementing federated learning to
      allow multi-institutional analysis while preserving privacy, developing ethical and
      consent guidance for voice data, building bridges between voice research, acoustic
      engineering and AI/ML communities, and developing curricula and a community of voice AI
      researchers.

tasks:
  - name: Predefined tasks and labels supplied with the release
    response: >-
      The current version of the dataset comes with predefined tasks and labeling. The tasks are
      primarily designed for training machine-learning models for disease detection and
      classification using voice data. Labels include diagnostic categories such as vocal
      pathologies, neurological disorders, psychiatric conditions and respiratory disorders.
      There are no predefined recommended data splits for training, validation or testing;
      researchers are encouraged to create their own splits based on their requirements.
  - name: Acoustic task battery recorded per participant
    response: >-
      A total of 22 acoustic tasks are recorded through the adult app, spanning non-voice/non-speech
      tasks (respiration, voluntary cough, breath sounds), voice/non-speech tasks (prolonged vowel,
      maximum phonation time, glides, loudness, diadochokinesis) and speech tasks (Rainbow Passage,
      Caterpillar Passage, CAPE-V sentences, free speech, picture description, story recall, animal
      fluency, open response questions, word-colour Stroop, productive vocabulary, random item
      generation, Cinderella story). The pediatric protocol adds age-appropriate tasks such as
      ABCs, months, counting, naming animals and foods, identifying pictures, repeat words and
      sentences, role naming, long sounds, noisy sounds and silly sounds.
  - name: Cohort selection from questionnaire features
    response: >-
      The questionnaire features are collected and distributed in the phenotype folder format and
      can be used for cohort selection.

addressing_gaps:
  - name: Absence of large, diverse, well-documented voice data for clinical ML
    response: >-
      The Bridge2AI Voice dataset was created to address a gap in the availability of
      large-scale, diverse and well-documented voice data for use in clinical machine-learning
      applications. Previous studies on machine learning-based voice diagnosis produced
      promising results, but their sample sizes were too small, or they lacked the key metadata
      needed for training robust, clinically useful models.
  - name: Lack of standards for acoustic data collection and analysis
    response: >-
      Comparing studies and pooling data is challenging because of the lack of standards in how
      voice and speech data are collected and measured. The project identifies the need to define
      and create standards for "audiomics", the interdisciplinary field of audio analysis applied
      to biomedicine, covering data acquisition, interoperability and AI readiness.
  - name: Private industry datasets that cannot be audited
    response: >-
      Within industry, datasets are often private, limiting the ability to audit ML models and
      the accuracy of training data labels. Industry has access to vast amounts of voice data
      from users but lacks accurate clinical data or demographic information, which prevents
      external auditing of training datasets for fair representation of diverse populations.
  - name: Scarcity of pediatric voice datasets
    response: >-
      Despite the clinical importance of detecting pediatric communication disorders such as
      autism spectrum disorder and speech delays, the availability of large-scale pediatric
      datasets remains limited. Data collection in pediatric populations poses unique challenges
      such as privacy issues, consent processes and the need for developmentally appropriate
      tasks, which have contributed to the lack of publicly available pediatric datasets that
      enable machine learning for pediatric voice analysis.

