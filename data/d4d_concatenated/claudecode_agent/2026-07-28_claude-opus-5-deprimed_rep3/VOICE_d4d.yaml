id: https://b2ai-voice.org/
name: Bridge2AI-Voice
title: Bridge2AI-Voice Dataset
description: >-
  Bridge2AI-Voice (B2AI-Voice) is a large, ethically sourced and demographically diverse
  voice, speech and respiratory-sound dataset linked to health information, produced by the
  Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI program (award OT2OD032720).
  The consortium's stated aim is a flagship, standardized dataset of voices linked to health
  information to fuel research and discovery in voice biomarkers. Data acquisition is centred
  on five disease cohort categories for which voice change has been associated with specific
  diseases with well-recognized unmet needs: voice disorders, neurological and
  neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders, and
  pediatric voice and speech disorders, together with control participants.
  Two distinct releases are published as separate PhysioNet projects and are not versions of
  one another. The adult release, "Bridge2AI-Voice: An ethically-sourced, diverse voice
  dataset linked to health information", is at version 3.1.0 (published 2026-05-01) and
  contains data for 833 participants collected across five sites in North America; adult data
  are collected with the Bridge2AI-Voice smartphone/tablet application under the Bridge2AI-Voice
  adult protocols. The pediatric release, "Bridge2AI-Voice Pediatric Dataset", is at version
  1.1.0 (published 2026-05-01) and contains derived audio features for 23,533 recordings from
  300 participants aged 2 to 18; pediatric participants are recruited strictly at the Hospital
  for Sick Children (SickKids) and their data are collected with reproschema-ui under a
  separate pediatric protocol approved by the SickKids Research Ethics Board.
  Both PhysioNet releases contain derived features (spectrograms, mel spectrograms, MFCCs,
  articulatory and phonetic features, pitch, loudness, periodicity, phonetic posteriorgrams,
  openSMILE/Praat static features) together with phenotype data (demographics, confounders,
  diagnosis, enrollment and validated questionnaire responses) and per-recording metadata;
  neither contains the original raw audio waveforms. Raw audio is disseminated only under a
  controlled-access mechanism via Synapse after institutional sign-off.
