purposes:
  - name: Enable AI/ML research into type 2 diabetes salutogenesis
    response: >-
      To enable future generations of artificial intelligence and machine learning research to
      provide critical insights into type 2 diabetes mellitus, including salutogenic pathways to
      return to health.
    description: >-
      The healthsheet states that T2DM is a growing public health threat and that current
      understanding, especially in the context of salutogenesis, is limited; AI-based approaches
      may improve that understanding but a key issue is the lack of data ready for training AI
      models, and the AI-READI dataset is intended to fill that gap. The NIH RePORTER abstract
      states the long-term objective as developing a foundational dataset in diabetes, agnostic
      to existing classification criteria, that can be used to reconstruct a temporal atlas of
      T2DM development and reversal towards health.
  - name: Create a flagship, ethically sourced, publicly available dataset
    response: >-
      To create a flagship ethically-sourced dataset that is well-defined, trustworthy and
      publicly available, as one of four NIH Bridge2AI Data Generation Projects.
    description: >-
      The BMJ Open protocol describes AI-READI as one of four NIH-funded Bridge2AI projects that
      aim to generate flagship biomedical and behavioural data sets that are ethically sourced,
      trustworthy, well-defined and publicly available.
  - name: Establish a reusable blueprint for AI-ready dataset creation
    response: >-
      To establish standards, best practices and guidelines for the collection, preparation and
      sharing of data for AI/ML purposes, so that AI-READI can serve as a model for future
      efforts to develop other medical and health datasets targeted for AI/ML.
    description: >-
      The Nature Metabolism comment describes an explicit aim of sharing the project's blueprint
      for collecting and sharing AI-ready datasets, including guidelines for project management
      and for data collection, management and sharing, and the development of new standards such
      as the Clinical Dataset Structure. The NIH RePORTER specific aims list "Create a model for
      developing large scalable datasets" as aim 2.
  - name: Train a diverse AI and biomedical research workforce
    response: >-
      To increase access to and the quality of AI/ML research by recruiting and training
      personnel, addressed through a year-long AI-READI research internship programme.
    description: >-
      NIH RePORTER lists this as specific aim 3. The Nature Metabolism comment reports that the
      internship programme includes a two-week data science and programming bootcamp followed by
      a year-long curriculum of didactic lectures and mentored research, and that the inaugural
      2023-2024 cohort of 10 interns was 70% women, 30% Black, and 50% from under-represented
      backgrounds based on NIH criteria.

tasks:
  - name: Pseudotime manifold analysis of disease trajectories
    response: >-
      Data collection was specifically designed to permit downstream pseudotime manifold
      analysis, an approach used to predict disease trajectories by collecting and learning from
      complex, multimodal data from participants with differing disease severity, from normal to
      insulin-dependent T2DM.
    description: >-
      The IRB protocol adds that the approach has been used successfully in developmental biology
      to identify differentiation pathways from complex single-cell gene expression datasets,
      relies on dimensionality reduction, is agnostic to existing classification criteria or
      biases, and can be used to reconstruct a temporal atlas of pathogenesis and healing.
  - name: Hypothesis-agnostic multimodal AI/ML model development
    response: >-
      The dataset is hypothesis agnostic and is intended to support multiple potential downstream
      AI/ML applications rather than one predefined task.
    description: >-
      The BMJ Open protocol states that the multidisciplinary team designed the protocol so that
      it is agnostic to hypotheses, assembling a data collection protocol composed of assessments
      from many health domains likely to be impacted by T2DM. The healthsheet states that no
      specific labeling was performed because the dataset is hypothesis-agnostic and aimed at
      facilitating multiple potential downstream AI/ML applications.

addressing_gaps:
  - name: Lack of large, diverse, AI-ready multimodal T2DM datasets
    response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as
      T2DM has been limited by a lack of well-designed, high quality, large and inclusive
      multimodal datasets that are AI ready for training AI models.
    description: >-
      The Nature Metabolism comment identifies the lack of diverse AI-ready datasets as a major
      barrier the project is designed to address. The BMJ Open protocol states that the targeted
      sample of 4,000 persons would be the largest publicly accessible dataset then available
      containing many multidomain variables relevant to T2DM.
  - name: Under-representation of racial and ethnic groups in T2DM research
    response: >-
      Past T2DM research has under-represented groups that bear a higher burden of the disease,
      so the cohort is deliberately balanced by self-reported race/ethnicity rather than matched
      to the demographic distribution of the US population.
    description: >-
      The BMJ Open protocol cites a meta-epidemiological review of T2DM studies published from
      2000 to 2020 indicating that samples lacked racial and ethnic diversity, and describes
      building balanced datasets as critical for the development of unbiased machine learning
      models. The study recruits four race/ethnic groups (Asian, Black, Hispanic, White) in equal
      proportions, four categories of T2DM severity, and biological males and females.
  - name: Ethical and equitable practice in AI data generation
    response: >-
      AI-READI addresses challenges that have compromised AI implementation in clinical research
      by embedding ethical and equitable data collection and management and adherence to the
      FAIR principles, with guidance from bioethicists.
    description: >-
      The Nature Metabolism comment states that ethical, legal and social implications are
      considered at every stage of the project cycle, that existing documentation approaches such
      as datasheets and healthsheets were reviewed to identify the most suitable one for
      biomedical data, and that a robust data dissemination system, a strict licence agreement
      and data watermarking are being implemented for both public and controlled sets to prevent
      reidentification attempts. It also describes engagement with the Native BioData Consortium
      as a co-learning opportunity for understanding challenges specific to American Indian and
      Alaska Native communities.

