source_caveats: >-
  Referent: the bundle describes both an ongoing study and a series of dataset releases. This
  record is pinned to the dataset release "Flagship Dataset of Type 2 Diabetes from the AI-READI
  Project" version 3.0.0, DOI 10.60775/fairhub.3, because that is the release the current
  sources describe substantively. Facts specific to earlier releases (v1.0.0, v2.0.0) are kept
  in version_access and related_datasets with their versions named, and are not asserted of this
  release. Organizational attribution disagrees across the bundle: the FAIRhub v3.0.0 metadata
  names "Washington University in St. Louis" (ROR https://ror.org/01yc7t268) as both the study
  lead sponsor and the dataset managing organization, and gives that same affiliation for Aaron
  Lee and Cecilia Lee, whereas NIH RePORTER records the awardee organization for OT2OD032644 as
  UNIVERSITY OF WASHINGTON with PI LEE, AARON, the Nature Metabolism author list affiliates
  Aaron Y. Lee and Cecilia S. Lee to the University of Washington, and the license agreement and
  IRB protocol both name the University of Washington. Both attributions are recorded rather
  than reconciled. Enrollment target disagrees: 4,000 participants (BMJ Open protocol, Nature
  Metabolism, FAIRhub study description enrollmentCount, NIH RePORTER "4,000+") versus 4,600
  (UW IRB protocol application). Study start date disagrees by one day: 18 July 2023 (BMJ Open)
  versus 2023-07-19 (FAIRhub study description and dataset collection window). Project acronym
  expansion disagrees: "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights"
  (BMJ Open, Nature Metabolism) versus "Artificial Intelligence Ready and Exploratory Atlas for
  Diabetes Insights" (NIH RePORTER, FAIRhub study description and README). created_on is
  transcribed from the FAIRhub API field "created_at": 1763366400, which is
  2025-11-17T08:00:00Z; the datasetDescription separately records dateType "Available",
  dateValue "2025-11-17". The `issued` slot was left empty because the sources give a date
  without a time and the slot requires a datetime. FileCollection entries require an identifier
  that the sources do not supply; their `id` values are constructed mechanically as the dataset
  DOI URL plus the documented directory name as a fragment, and assert nothing beyond the
  directory names already recorded in `path`. `subsets` was left empty: the bundle clearly
  describes two access tiers (a publicly accessible set and a controlled-access set) but supplies
  no identifier for either, and DataSubset requires one; the two tiers are described in
  sensitive_elements, license_and_use_terms and regulatory_restrictions instead. `used_software`
  was left empty throughout for the same reason: Software requires an identifier the bundle does
  not supply for REDCap, the MoCA Duo application, Dexcom Clarity or the OMOP Data Quality
  Dashboard. The FAIRhub v3.0.0 healthsheet is itself a datasheet-style artifact, so a large part
  of this record is transcribed from it rather than synthesised from primary description.

