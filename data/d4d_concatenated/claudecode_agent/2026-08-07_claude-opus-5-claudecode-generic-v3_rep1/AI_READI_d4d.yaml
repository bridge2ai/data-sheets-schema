id: https://doi.org/10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship multimodal dataset produced by the AI-READI project, expanded as
  "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights" in the two
  publications and as "Artificial Intelligence Ready and Exploratory Atlas for Diabetes
  Insights" in the NIH RePORTER and FAIRhub records. AI-READI is one of four Data Generation
  Projects of the NIH Common Fund Bridge2AI program. The release contains data
  from 2,280 participants with and without type 2 diabetes mellitus (T2DM), collected between
  19 July 2023 and 1 May 2025 and harmonised across three data collection sites (University of
  Alabama at Birmingham, University of California San Diego, and University of Washington).
  Each instance is an individual participant, and the modalities include survey data collected
  in REDCap, physical measurements and vitals, blood and urine laboratory results, 12-lead
  electrocardiography, cognitive screening, monofilament testing, visual function testing,
  retinal photography, optical coherence tomography (OCT), OCT angiography (OCTA),
  fluorescence lifetime imaging ophthalmoscopy (FLIO), continuous glucose monitoring, wearable
  activity monitoring and home environmental sensing. The release comprises 356,343 files and
  approximately 3.82 TB, organised following the Clinical Dataset Structure (CDS) v0.1.1 with
  one directory per datatype, then modality, then device, then participant. The dataset carries
  no protected health information; information on sex, race/ethnicity and medications used has
  been removed from this public release, while a controlled-access tier holds 5-digit ZIP code,
  sex, race, ethnicity, genetic sequencing data, past health records, medications, and traffic
  and accident reports. The stated goal is to enable AI/ML research into salutogenesis, the
  pathway from T2DM back to health.
