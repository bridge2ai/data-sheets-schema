raw_sources:

  - id: https://cm4ai.org/data-releases/#raw-crispri-sequences
    name: CRISPRi perturbation raw sequence data
    raw_data_details: >-
      Raw sequence data from the expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J
