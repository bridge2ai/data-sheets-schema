    name: Identically named image archives with divergent checksums across releases
    anomaly_details: >-
      The three archives cm4ai_ifimages_MDA-MB-468_paclitaxel.zip,
      cm4ai_ifimages_MDA-MB-468_untreated.zip and cm4ai_ifimages_MDA-MB-468_vorinostat.zip appear
      under the same names and displayed sizes in the June 2025, October 2025 and June 2026 releases.
      Their MD5 values are identical between the June 2025 and October 2025 releases
      (0d972b80744344ddeede516a0cf6e3d7, a98affcc05429650c6bb3906cd836d55,
      ad4e68ccc14b0f3349dad3321e7b81b2) but differ in the June 2026 release
      (6c1a86520eec2696ec19444eb8a8b428, 6d066e6b9d762284c6aa5d0b44565568,
      df79632753989ef23b0a3df6604d4af1), where they were published on 2026-07-15 rather than with the
      rest of that release on 2026-06-17. The bundle gives no release note explaining the change.

known_biases:

  - id: https://cm4ai.org/data-releases/#bias-cell-line-representation
    name: Cell-line derivation limits population representativeness
    bias_type: representation_bias
    bias_description: >-
      The Potential Sources of Bias block on the June 2025, October 2025 and June 2026 releases
      states that data in the release were derived from commercially available de-identified human
      cell lines and do not represent all biological variants which may be seen in the population at
      large.
    affected_subsets:
      - MDA-MB-468
      - KOLF2.1J

  - id: https://cm4ai.org/data-releases/#bias-modality-overlap
    name: Incomplete overlap of the protein sets interrogated by each modality
    bias_type: selection_bias
    bias_description: >-
      The Completeness block states that protein-protein interaction (SEC-MS), protein localization
      (IF imaging) and CRISPRi perturb-seq data interrogate sets of proteins which incompletely
      overlap, so a protein's presence in one modality does not imply its presence in another.
    affected_subsets:
      - SEC-MS
      - IF imaging
      - CRISPRi perturb-seq

  - id: https://cm4ai.org/data-releases/#bias-targeted-protein-panel
    name: Deliberate targeting of a chromatin-modifier and metabolic-enzyme panel
    bias_type: sampling_bias
    bias_description: >-
      The data streams are produced by multimodal interrogation of a selected panel - 100 chromatin
      modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric and cardiac disorders,
      plus their interactors and key signalling molecules - rather than by unbiased proteome-wide
      selection. The CM4AI preprint states that spatial proteomics mapping covered 100 chromatin
      regulators in MDA-MB-468 cells with another 500 proteins pending significant hits from the
      genetic perturbations and PPI results.
    mitigation_strategy: >-
      SEC-MS is described in the preprint as a proteome-wide complex and interaction mapping approach
      that, in addition to the chromatin modifiers of interest, allowed CM4AI to map complexes in
      MDA-MB-468 cells and investigate the impact of treatment proteome-wide.

known_limitations:

  - id: https://cm4ai.org/data-releases/#limitation-interim-release
    name: Interim release
    limitation_type: scope_limitation
    limitation_description: >-
      The Limitations block on the June 2025, October 2025 and June 2026 releases states that this is
      an interim release.
    recommended_mitigation: >-
      The Maintenance Plan states the dataset will be regularly updated and augmented through the end
      of the project in November 2026, with updates on a quarterly basis.

  - id: https://cm4ai.org/data-releases/#limitation-no-cell-maps
    name: Computed cell maps not included
    limitation_type: coverage_limitation
    limitation_description: >-
      The releases do not contain predicted cell maps, which will be added in future releases; the
      Completeness block states separately that computed cell maps are not included in the release.
    scope_impact: >-
      The hierarchical cell maps that are the stated deliverable of the project are absent from every
      captured release, so the released material consists of the map-input data streams.

  - id: https://cm4ai.org/data-releases/#limitation-individual-dataset-analysis
    name: Best suited to per-dataset bioinformatics analysis
    limitation_type: integration_limitation
    limitation_description: >-
      The current release is most suitable for bioinformatics analysis of the individual datasets.
      This is stated alongside the Completeness note that the SEC-MS, IF imaging and CRISPRi
      perturb-seq data interrogate sets of proteins which incompletely overlap.

  - id: https://cm4ai.org/data-releases/#limitation-domain-expertise
    name: Requires domain expertise
    limitation_type: methodological_limitation
    limitation_description: >-
      The Limitations block states that the release requires domain expertise for meaningful
      analysis.

  - id: https://cm4ai.org/data-releases/#limitation-embargo
    name: Temporary pre-publication embargo on some datasets
    limitation_type: coverage_limitation
    limitation_description: >-
      Some datasets are under temporary pre-publication embargo. The October 2025 and June 2026
      External Data Links blocks mark the perturb-seq depositions for KOLF2.1J iPSCs and for
      MDA-MB-468 cells as Embargoed.

  - id: https://cm4ai.org/data-releases/#limitation-repository-review
    name: Repository under administrative review
    limitation_type: temporal_limitation
    limitation_description: >-
      Every CM4AI page and the Dataverse collection page carry the notice "This repository is under
      review for potential modification in compliance with Administration directives." The bundle
      does not state what modification is contemplated or how continued availability of the releases
      would be affected.

confidential_elements:

  - id: https://cm4ai.org/data-releases/#confidentiality
    name: Confidentiality of released content
    confidential_elements_present: false
    confidentiality_details: >-
      The Data Governance and Ethics block on the June 2025, October 2025 and June 2026 releases
      records Human Subjects: No and De-identified Samples: Yes, and every file in every captured
      release is listed with File Access "Public". The CM4AI preprint states that CM4AI data are
      distinctive within Bridge2AI in being non-clinical, from tissue cultures, and considered to be
      de-identified as they cannot be matched, with current knowledge, to a human subject. Access
      restrictions that do exist are licensing and embargo restrictions rather than confidentiality
      restrictions.

subpopulations:

  - id: https://cm4ai.org/data-releases/#subpopulations
    name: Population subgroups in the released data
    subpopulation_elements_present: false
    identification: >-
      The released data derive from two immortalised human cell lines rather than from a sampled
      human population, and the release metadata records Human Subjects: No. The two donor origins
      that the CM4AI preprint reports for the cell lines are a 51-year-old black female with a
      metastatic mammary adenocarcinoma (MDA-MB-468, established from a metastatic site pleural
      effusion) and a healthy male Northern European donor (KOLF2.1J).
    distribution: >-
      No distribution over subpopulations is reported, and none is meaningful for a two-cell-line
      panel.

sensitive_elements:

  - id: https://cm4ai.org/data-releases/#sensitive-elements
    name: Sensitive elements in the released data
    sensitive_elements_present: false
    sensitivity_details: >-
      The CM4AI preprint states that CM4AI data are non-clinical, from tissue cultures, and are
      considered to be de-identified as they cannot be matched, with current knowledge, to a human
      subject. The release metadata records Human Subjects: No, De-identified Samples: Yes and FDA
      Regulated: No.

acquisition_methods:

  - id: https://cm4ai.org/data-releases/#acquisition
    name: Laboratory measurement of cultured human cell lines
    was_directly_observed: true
    was_reported_by_subjects: false
    acquisition_details: >-
      All released instances are direct laboratory measurements made on cultured human cell lines.
      CM4AI input data streams are generated using immunofluorescence (IF) subcellular microscopy for
      spatial proteomics data; affinity purification mass spectrometry (AP-MS) and size exclusion
      mass spectrometry (SEC-MS) methods for protein-protein interaction data; and single-cell
      CRISPR-Cas perturbation screens by cell type. Nothing in the released data is reported by human
      subjects, and the release metadata records Human Subjects: No.

collection_mechanisms:

  - id: https://cm4ai.org/data-releases/#mechanism-apms
    name: Affinity purification-mass spectrometry (AP-MS)
    mechanism_details: >-
      AP-MS was employed on endogenously tagged cell lines to map protein-protein interactions of 100
      chromatin regulators under different conditions (cancer: no treatment, paclitaxel or
      vorinostat; iPSC: undifferentiated, neurons and cardiomyocytes). The CM4AI preprint reports
      that 17 genes had been endogenously tagged in MDA-MB-468 with AP-MS data acquired under three
      conditions (untreated, paclitaxel and vorinostat treated), and that 34 additional genes were in
      the process of being tagged. AP-MS archives for paclitaxel-treated and vorinostat-treated
      MDA-MB-468 cells first appear in the June 2026 release.

  - id: https://cm4ai.org/data-releases/#mechanism-secms
    name: Size exclusion chromatography-mass spectrometry (SEC-MS)
    mechanism_details: >-
      SEC-MS was used for proteome-wide complex and interaction mapping as an approach orthogonal to
      AP-MS. It was performed on MDA-MB-468 cells under three conditions (untreated, paclitaxel and
      vorinostat treated) and on KOLF2 iPSCs and their derivatives. SEC-MS datasets were generated in
      the Nevan Krogan laboratory at the University of California San Francisco.

  - id: https://cm4ai.org/data-releases/#mechanism-if-imaging
    name: Immunofluorescence subcellular imaging (ICC-IF and confocal microscopy)
    mechanism_details: >-
      Spatial subcellular organization was mapped by immunofluorescence-based staining (ICC-IF) and
      confocal microscopy in the Lundberg Lab at Stanford University, using the Human Protein Atlas
      resource of antibodies. Nuclei were stained with DAPI (blue channel); endoplasmic reticulum
      with a calreticulin antibody (yellow channel); microtubules with a tubulin antibody (red
      channel); and an antibody against the protein of interest supplied the green channel. Automated
      fixation and permeabilization protocols were established for a pipetting robot for the
      MDA-MB-468 and KOLF2 cell lines.

  - id: https://cm4ai.org/data-releases/#mechanism-crispri-perturbseq
    name: Single-cell CRISPRi perturbation screens (perturb-seq)
    mechanism_details: >-
      Single-cell CRISPR screens perturbing 100 chromatin regulators were performed in MDA-MB-468
      cells under three conditions (no treatment, paclitaxel or vorinostat) and in undifferentiated
      KOLF2.1J iPSCs, using the 10x Genomics 3'HT kit. A CRISPR lentiviral library targeting 100
      chromatin factors with 6 guide RNAs per gene was designed, and MDA-MB-468 and KOLF2 CRISPR
      lines expressing inducible dCas9 were generated and characterized. The released CRISPRi
      Perturbation Cell Atlas for undifferentiated KOLF2.1J hiPSCs maps transcriptional and fitness
      phenotypes associated with 11,739 targeted genes.

sampling_strategies:

  - id: https://cm4ai.org/data-releases/#sampling
    name: Targeted protein panel in two disease-relevant cell lines
    is_sample: true
    is_representative: false
    source_data: >-
      Cultured MDA-MB-468 triple-negative breast cancer cells and KOLF2.1J induced pluripotent stem
      cells and their neural progenitor, neuronal and cardiomyocyte derivatives.
    why_not_representative: >-
      Data in the releases were derived from commercially available de-identified human cell lines
      and do not represent all biological variants which may be seen in the population at large.
    strategies: >-
      CM4AI targets 100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
      neuropsychiatric and cardiac disorders, interrogated in disease-relevant cell lines under
      perturbed and unperturbed conditions. Spatial proteomics mapping covered 100 chromatin
      regulators, their interactors and key signalling molecules involved in cancer, with another 500
      proteins pending significant hits from the genetic perturbation and PPI results. A shared list
      of proteins is used across all cell types and treatment conditions so that deep multi-modal
      data are generated for the same proteins.

data_collectors:

  - id: https://cm4ai.org/data-releases/#collector-lundberg-lab
    name: Lundberg Lab, Stanford University
    role: Generation of immunofluorescence subcellular imaging data
    collector_details: >-
      Every IF image archive in the March 2025, June 2025 and October 2025 releases is described as
      imaged by immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg
      Lab at Stanford University. The CM4AI preprint states that IF images for the cell line and
      conditions are downloaded from the Lundberg Laboratory's deposition archive for further
      processing by the MuSIC pipeline.

  - id: https://cm4ai.org/data-releases/#collector-krogan-lab
    name: Nevan Krogan laboratory, University of California San Francisco
    role: Generation of SEC-MS protein-protein interaction data
    collector_details: >-
      The SEC-MS datasets for undifferentiated KOLF2.1J hiPSCs and for vorinostat- or
      paclitaxel-treated MDA-MB468 human breast cancer cells are described as generated in the Nevan
      Krogan laboratory at the University of California San Francisco. The CM4AI preprint states that
      PPI networks for the cell line and conditions are downloaded from the Krogan Laboratory's
      deposition archive for further processing.

  - id: https://cm4ai.org/data-releases/#collector-production-locations
    name: CM4AI production locations
    role: Institutions recorded as production locations for the Dataverse releases
    collector_details: >-
      The Dataverse Production Location field for the March 2025, June 2025 and October 2025 releases
      lists University of California San Diego; University of California San Francisco; Stanford
      University; University of Virginia. The March 2025 capture repeats University of California San
      Francisco twice in that string. The releases record Depositor "Niestroy, Justin".

collection_timeframes:

  - id: https://cm4ai.org/data-releases/#timeframe-project-period
    name: CM4AI project period
    start_date: '2022-09-01'
    end_date: '2026-08-31'
    timeframe_details: >-
      NIH RePORTER records project start 2022-09-01 and project end 2026-08-31 for application ID
      11211616 (project number 3OT2OD032742-01S2, core project number OT2OD032742). This is the award
      period, not a measured data collection window.
    source_caveats: >-
      The bundle states no per-modality data collection dates, so the award period is the only dated
      window available. The Dataverse Maintenance Plan states the dataset will be updated and augmented "through the
      end of the project in November 2026", which does not agree with the NIH RePORTER project end of
      2026-08-31. Both values are reported.

  - id: https://cm4ai.org/data-releases/#timeframe-dataverse-creation-date
    name: Dataverse-reported data creation date
    start_date: '2025-02-27'
    timeframe_details: >-
      All four captured Dataverse releases report Data Creation Date 2025-02-27 and Deposit Date
      2025-02-27, including the June 2026 release with Publication Date 2026-06-17.
    source_caveats: >-
      The identical creation and deposit dates across releases published in March 2025, July 2025,
      October 2025 and June 2026 are recorded as found; the bundle offers no explanation.

direct_collection:

  - id: https://cm4ai.org/data-releases/#direct-collection
    name: Whether data were collected directly from individuals
    is_direct: false
    collection_details: >-
      The data were generated in the laboratory from two established, commercially or
      consortium-available human cell lines rather than collected from individuals. The release
      metadata records Human Subjects: No and De-identified Samples: Yes. MDA-MB-468 is available
      from ATCC and KOLF2.1J from the Human Induced Pluripotent Stem Cells Initiative (HipSci)
      resource, accessible to not-for-profit organizations via a simple MTA; the CM4AI preprint
      states that both cell lines have been ethically sourced.

missing_data_documentation:

  - id: https://cm4ai.org/data-releases/#missing-data
    name: Known gaps in the released data
    missing_data_patterns: >-
      Computed cell maps are not included in any captured release. Protein-protein interaction
      (SEC-MS), protein localization (IF imaging) and CRISPRi perturb-seq data interrogate sets of
      proteins which incompletely overlap. The flagship-datasets page lists IF images for the iPSC
      lineages and AP-MS interactomes for the TNBC cells as "coming soon", although AP-MS archives
      for paclitaxel- and vorinostat-treated MDA-MB-468 cells do appear in the June 2026 release.
      Perturb-seq depositions in the external repositories are marked Embargoed in the October 2025
      and June 2026 releases.
    missing_data_causes: >-
      The Completeness block attributes part of the gap to temporary pre-publication embargo and
      states that these data are not yet in completed final form. The remainder reflects the interim
      status of a release programme still generating data.
    handling_strategy: >-
      The Maintenance Plan states the dataset will be regularly updated and augmented through the end
      of the project in November 2026, with updates on a quarterly basis, and the FAQ states that
      CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input data
      streams.

raw_data_sources:

  - id: https://cm4ai.org/data-releases/#raw-source-massive
    name: MassIVE Repository
    source_description: >-
      Mass spectrometry data underlying the CM4AI releases are linked to the MassIVE Repository. The
      June 2025 release links mass spectrometry data for human iPSCs and for human cancer cells; the
      October 2025 release links SEC-MS data in KOLF2.1J iPSCs (undifferentiated, NPC, neuron and
      cardiomyocyte) and SEC-MS data in MDA-MB-468 breast cancer cells with and without treatment;
      the June 2026 release adds AP-MS data in MDA-MB-468 breast cancer cells treated with paclitaxel
      and with vorinostat.
    source_type: external public proteomics repository
    access_details: >-
      Linked from the External Data Links block of the Dataverse landing pages as "MassIVE
      Repository".
    source_caveats: >-
      No MassIVE accession identifier for any CM4AI deposition is given in the bundle.

  - id: https://cm4ai.org/data-releases/#raw-source-ncbi-bioproject
    name: NCBI BioProject / Sequence Read Archive
    source_description: >-
      The June 2025 release links Sequence Read Archive (SRA) data to NCBI BioProject. The October
      2025 and June 2026 releases instead mark the perturb-seq depositions as Embargoed.
    source_type: external public sequence repository
    access_details: >-
      Linked from the External Data Links block as "NCBI BioProject".
    source_caveats: >-
      No BioProject accession is given in the bundle.

  - id: https://cm4ai.org/data-releases/#raw-source-figshare
    name: Figshare
    source_description: >-
      The June 2026 release links a CRISPRi Perturbation Atlas of iPSCs to Figshare.
    source_type: external generalist repository
    access_details: >-
      Linked from the External Data Links block as "Figshare".
    source_caveats: >-
      No Figshare identifier is given in the bundle.

  - id: https://cm4ai.org/data-releases/#raw-source-krogan-lundberg-archives
    name: Krogan and Lundberg laboratory deposition archives
    source_description: >-
      The CM4AI preprint states that the MuSIC pipeline's first segment downloads PPI networks for
      the cell line and conditions from the Krogan Laboratory's deposition archive, and IF images for
      the cell line and conditions from the Lundberg Laboratory's deposition archive, making both
      available for further processing.
    source_type: laboratory deposition archive internal to the project
    access_details: >-
      The archives are described only as inputs to the MuSIC pipeline's first segment.
    source_caveats: >-
