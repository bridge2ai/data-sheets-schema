      The immunofluorescence image archives are distributed as raw four-channel confocal image sets
      for MDA-MB-468 cells under the untreated, paclitaxel and vorinostat conditions. The June 2025
      release notes that its revision added RGB immunofluorescent images. The CM4AI preprint states
