  - id: https://cm4ai.org/data-releases/#instance-portal-total-proteins
    name: Total proteins investigated reported by the CM4AI portal
    instance_type: protein investigated across all CM4AI modalities
    counts: 7023
    description: >-
      The Data Insights panel reports 7,023 total proteins investigated.

  - id: https://cm4ai.org/data-releases/#instance-cell-lines
    name: Cell lines interrogated
    instance_type: human cell line under a defined treatment or differentiation condition
    description: >-
      CM4AI uses the cancer cell line MDA-MB-468 (RRID:CVCL_0419), with and without treatment with
      paclitaxel and vorinostat, and the induced pluripotent stem cell line KOLF2.1J
      (RRID:CVCL_B5P3), undifferentiated and differentiated to neural progenitor cells, neurons and
      cardiomyocytes. Both are described as ethically sourced. MDA-MB-468 is a triple negative breast
      cancer cell line established from a metastatic site pleural effusion of a 51-year-old black
      female with a metastatic mammary adenocarcinoma, available from ATCC, extensively used to study
      triple-negative breast cancer and well characterized with transcriptomic, mutational profile
      and whole-genome sequencing data available. KOLF2.1J was derived from a healthy male Northern
      European donor, is available from the Human Induced Pluripotent Stem Cells Initiative (HipSci)
      resource, and is available for access by not-for-profit organizations via a simple MTA.

anomalies:

  - id: https://cm4ai.org/data-releases/#anomaly-embargoed-subsets
    name: Embargoed and incomplete components within published releases
    anomaly_details: >-
      The Completeness block on the June 2025, October 2025 and June 2026 releases states that these
      data are not yet in completed final form, that some datasets are under temporary pre-publication
      embargo, and that computed cell maps are not included in the release. The October 2025 and June
      2026 External Data Links blocks mark the perturb-seq depositions for KOLF2.1J iPSCs and for
      MDA-MB-468 cells as Embargoed.

