external_resources:

  - id: https://cm4ai.org/data-releases/#external-repositories
    name: External repositories hosting CM4AI raw data
    description: >-
      The Dataverse release pages carry an "External Data Links" block pointing to repositories that
      hold CM4AI raw data outside the Dataverse deposition. The June 2025 release links Sequence Read
      Archive (SRA) data at NCBI BioProject and mass spectrometry data for human iPSCs and human
      cancer cells at the MassIVE Repository. The October 2025 release marks both perturb-seq
      depositions Embargoed and links SEC-MS data for KOLF2.1J iPSCs and for MDA-MB-468 cells to the
      MassIVE Repository. The June 2026 release repeats those and adds a Figshare link for the
      CRISPRi Perturbation Atlas of iPSCs and MassIVE links for AP-MS data in paclitaxel-treated and
      vorinostat-treated MDA-MB-468 cells. The March 2025 SEC-MS RO-Crate description states that
      "The data will be uploaded to Pride when available".
    external_resources:
      - MassIVE Repository
      - NCBI BioProject
      - Sequence Read Archive
      - Figshare
      - PRIDE
    restrictions:
      - "Perturb-seq data in KOLF2.1J iPSCs (undifferentiated): Embargoed"
      - "Perturb-seq data in MDA-MB-468 breast cancer cells (+/- treatment): Embargoed"
    source_caveats: >-
      The bundle records these as link labels only, so the list holds repository names rather than
      URLs. PRIDE is listed because the March 2025 SEC-MS RO-Crate description states the data will
      be uploaded there when available, not because a deposition exists. No accession identifiers,
      URLs or archival guarantees for the CM4AI depositions in these repositories appear anywhere in
      the bundle.

  - id: https://cm4ai.org/#tools-and-portal
    name: CM4AI portal, pipeline software and AI-readiness framework
    description: >-
      CM4AI disseminates its data, maps and tools through the CM4AI web portal at
      http://www.cm4ai.org, built on the U-BRITE platform. The Tools Module maintains the Multi-Scale
      Integrated Cell (MuSIC) pipeline, which produces integrated cell maps from the multimodal input
      data streams and calls the FAIRSCAPE client package to validate inputs and create an output
      RO-Crate package for each pipeline segment. The Standards Module performs AI-readiness
      packaging with FAIRSCAPE, a client-side Python3 application (FAIRSCAPE-CLI) and a Python3
      server application; RO-Crates sent to the FAIRSCAPE server are registered and assigned
      persistent, resolvable, globally unique identifiers under the ARK scheme, with DOIs planned as
      supplementary identifiers for final-state publishable work, and the server computes end-to-end
      provenance entailments expressed in the EVI Evidence Graph Ontology and serialised as JSON-LD
      and RDF-XML. Software for the Tools data integration pipeline is available under the BSD-3
      open-source license on GitHub for alpha-level tools and in the Zenodo long-term archive for
      production-ready tools; FAIRSCAPE is available under the MIT license and is documented at
      https://fairscape.github.io. The Integrative Modeling Platform used for integrative structure
      modelling is available at http://integrativemodeling.org.
    external_resources:
      - http://www.cm4ai.org
      - https://fairscape.github.io
      - http://integrativemodeling.org
    used_software:
      - id: https://cm4ai.org/#software-music
        name: Multi-Scale Integrated Cell (MuSIC) pipeline
        description: >-
          The CM4AI Tools Module dataset integration and map production system. Segments download PPI
          and image data, generate PPI and image embeddings, compute a co-embedding, perform protein
          community detection and hierarchy creation, and evaluate the hierarchy. Each segment calls
          the FAIRSCAPE client package to validate inputs and produce an RO-Crate package.
      - id: https://fairscape.github.io
        name: FAIRSCAPE
        description: >-
          The AI-readiness framework used by the CM4AI Standards Module for packaging data, software,
          metadata and provenance graphs. Comprises the client-side FAIRSCAPE-CLI Python3 package and
          a Python3 server application; both are PIP-installable and freely available. Copyright 2024
          is held by the Rector and Board of Visitors of the University of Virginia.
        license: MIT
        url: https://fairscape.github.io
      - id: http://integrativemodeling.org
        name: Integrative Modeling Platform (IMP)
        version: '2.18'
        url: http://integrativemodeling.org
        description: >-
          Open-source package underlying the Python Modeling Interface used by CM4AI for integrative
          structure modelling of MuSIC communities.

  - id: https://doi.org/10.1038/s41586-025-08878-3
    name: U2OS multimodal cell map (Schaffer et al., Nature 2025) - a distinct dataset
    description: >-
      A separate dataset described by one of the bundled documents and recorded here to keep it
      distinct from the CM4AI release programme. Schaffer LV, Hu M, Qian G, et al., "Multimodal cell
      maps as a foundation for structural and functional genomics", Nature 642:222-231 (2025),
      doi:10.1038/s41586-025-08878-3, reports a global map of human subcellular architecture built
      from joint AP-MS and immunofluorescence measurement of more than 5,100 proteins in U2OS
      osteosarcoma cells, resolving 275 molecular assemblies. Its acknowledgements list funding from
      the Bridge2AI Program (NIH Common Fund; OT2 OD032742) alongside Schmidt Futures, the Cancer
      Cell Map Initiative (U54 CA274502), Cytoscape (5U24HG012107), the Network Data Exchange
      programme (5U24CA269436), the Canada Foundation for Innovation and Genome BC (374PRO), the Knut
      and Alice Wallenberg Foundation (2021.0346), the Goran Gustafsson Foundation, the Stanford
      Institute for Human-Centered AI, Param Hansa Philanthropies, NIH R01GM083960 and P41GM109824,
      and, for the BioPlex project, NHGRI U24 HG006673, Third Rock Ventures, Google Ventures,
      Interline Therapeutics and Xaira. The dataset is deposited outside the CM4AI Dataverse
      releases. A Publisher Correction was published on 2 October 2025 (doi:10.1038/s41586-025-09648-x)
      and an Acknowledgements amendment on 29 April 2025.
    external_resources:
      - http://musicmaps.ai/u2os-cellmap/
      - https://ndexbio.org
      - https://www.ebi.ac.uk/complexportal
      - MSV000097168
      - PXD052362
      - https://modelarchive.org
      - https://github.com/idekerlab/cellmaps_pipeline
      - Human Protein Atlas v23
    source_caveats: >-
      Recorded to mark the boundary of the referent, not as a component of the CM4AI release
      programme. No count, cell line, method, license or access statement from this publication has
      been carried into any other slot of this record. The publication's data availability statement
      gives the U2OS cell map at NDEx under uuid f693137a-d2d7-11ef-8e41-005056ae3c32 and the AP-MS
      protein interaction data under uuid 95bc75d5-d1d1-11ee-8a40-005056ae23aa; assemblies at the EBI
      Protein Complex Portal under the query CLO:0009454; AP-MS raw MS files at MassIVE under
      MSV000097168; SEC-MS raw MS files and search results at ProteomeXchange under PXD052362;
      structural models at ModelArchive under ma-idk-u2osmap and ma-m5og4; and the image dataset in
      the Human Protein Atlas v23 release.

purposes:

  - id: https://cm4ai.org/data-releases/#purpose-ai-ready-cell-architecture
    name: Deliver AI-ready maps of human cell architecture
    response: >-
      CM4AI's objective is to deliver machine-readable hierarchical maps of cell architecture as
      AI-ready data produced from multimodal interrogation of 100 chromatin modifiers and 100
      metabolic enzymes involved in cancer, neuropsychiatric and cardiac disorders in disease-relevant
      cell lines under perturbed and unperturbed conditions, using state-of-the-art mass-spectrometry
      based proteomics, spatial proteomics / cell imaging, and genetic perturbations using CRISPR.
      The overarching mission is to produce ethical, AI-ready datasets of cell architecture, inferred
      from multimodal data collected for human cell lines, to enable transformative biomedical AI
      research. The data-releases page states that CM4AI will deliver these maps together with
      quarterly data releases of map-input data streams.

  - id: https://cm4ai.org/data-releases/#purpose-interpretable-genotype-phenotype
    name: Enable interpretable genotype-phenotype learning
    response: >-
      As part of the NIH Common Fund's Bridge2AI program, the CM4AI data generation project seeks to
      map the spatiotemporal architecture of human cells and use these maps toward the grand
      challenge of interpretable genotype-phenotype learning. The project launches a coordinated
      effort involving three complementary mapping approaches - proteomic mass spectrometry, cellular
      imaging, and genetic perturbation via CRISPR/Cas9 - creating a library of large-scale maps of
      cellular structure and function across demographic and disease contexts, to broadly stimulate
      research and development in "visible" machine learning systems informed by multi-scale cell and
      tissue architecture.

  - id: https://cm4ai.org/data-releases/#purpose-standards-ethics-training
    name: Establish FAIR standards, ethical AI research and training capacity
    response: >-
      Beyond data and tools, the project implements a standards data management approach based on
      FAIR access and software principles, with deep provenance and replication packages for
      representation of cell maps and their underlying datasets; initiates a research program in
      ethical AI, especially as it relates to how maps will be used in genomic medicine and model
      interpretation; and stimulates a diverse portfolio of training opportunities in the emerging
      field of biomachine learning. CM4AI is organised into three pillars - Data, People and Ethics -
      across six modules: Data Acquisition, Tools and Standards; Skills and Workforce Development and
      Teaming; and Ethics.

tasks:

  - id: https://cm4ai.org/data-releases/#task-visible-machine-learning
    name: Visible machine learning and visible neural networks
    response: >-
      Cell maps provide a foundation for downstream applications in human genomics, including
      interpretation of genetic variants and mutations. They have been used in AI tools for "visible
      machine learning" or "visible neural networks" (VNNs) to interrogate how protein assemblies in
      the cell affect cell-level phenotype predictions. The NIH RePORTER description states that the
      project will generate a resource of matched data and tools to enable the creation of "visible"
      ML systems, which are not black boxes but are built directly on knowledge maps of cell and
      tissue architecture.

  - id: https://cm4ai.org/data-releases/#task-ai-model-training
    name: AI model training on functional genomics data
    response: >-
      The Dataverse release metadata for the June 2025, October 2025 and June 2026 releases states
      that the dataset is intended for AI-ready datasets to support research in functional genomics,
      AI model training, cellular process analysis, and analysis of cell architectural changes and
      interactions in the presence of specific disease processes, treatment conditions or genetic
      perturbations.

addressing_gaps:

  - id: https://cm4ai.org/data-releases/#gap-black-box-models
    name: Uninterpretable genotype-to-phenotype machine learning models
    response: >-
      In genomics and precision medicine, machine learning models are often "black boxes", predicting
      phenotypes from genotypes without understanding the mechanisms by which such translation
      occurs. CM4AI addresses this deficiency by creating a library of large-scale maps of cellular
      structure and function across demographic and disease contexts that models can be built
      directly upon.

  - id: https://cm4ai.org/data-releases/#gap-ai-ready-data
    name: Absence of ethical, provenanced, AI-ready biomedical data
    response: >-
      The CM4AI preprint defines AI-Ready biomedical data as fully characterized FAIR data of known
      provenance, which can be ethically and reliably processed by AI applications; whose models and
      software are available and well-described for validation and re-use; and whose predictions may
      be fully explained and interpreted to the user as needed. It sets out five interdependent
      criteria - FAIR, Provenanced, Characterized, Explainable and Ethical - and states that CM4AI
      uses an expanded version of the FAIRSCAPE framework to establish a basis for AI-readiness,
      currently comprising rich metadata and persistent globally unique identifiers, a
      machine-readable provenance graph resolvable as metadata for all results, and characterization
      and validation of all datasets and data elements with mapping to public ontology vocabularies
      using JSON-Schema mini-data-dictionary descriptions resolvable from the provenance graph
      metadata.

  - id: https://cm4ai.org/data-releases/#gap-workforce
    name: Training gaps in the functional genomics and biomedical AI/ML workforce
    response: >-
      The Skills and Workforce Development module identified gaps in training of the functional
      genomic and biomedical AI/ML workforce and works to recruit and train a diverse group of
      participants in the scientific approach, data standards and tools used by CM4AI, through
      asynchronous virtual training, hosted virtual events, and an in-person internship co-hosted at
      Yale University and the University of California San Diego.

