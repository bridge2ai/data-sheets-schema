    description: >-
      The file descriptions in the March 2025 release state that each cm4ai-v0.6-beta IF image
      archive displays the spatial localization of 563 proteins of interest in MDA-MB-468 breast
      cancer cells for its condition.

  - id: https://cm4ai.org/data-releases/#instance-if-proteins-523
    name: Immunofluorescence protein coverage stated on the flagship-datasets page
    instance_type: protein of interest imaged by immunofluorescence
    counts: 523
    data_topic: http://purl.obolibrary.org/obo/GO_0008104
    description: >-
      The CM4AI flagship-datasets page states that the curated datasets for TNBC cells under
