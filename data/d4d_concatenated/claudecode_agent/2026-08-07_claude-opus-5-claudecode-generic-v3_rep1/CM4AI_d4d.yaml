source_caveats: >-
  Referent. The declared bundle describes two distinct datasets. The referent chosen for this record
  is the CM4AI quarterly data release programme deposited in the University of Virginia Dataverse,
  which is what seven of the ten bundled documents describe. The bundled Nature article
  (doi:10.1038/s41586-025-08878-3, Schaffer et al., Nature 642:222-231, 2025) describes a different
  dataset - a multimodal U2OS osteosarcoma cell map with its own depositions at NDEx, MassIVE
  MSV000097168, ProteomeXchange PXD052362 and ModelArchive - which acknowledges Bridge2AI funding
  (NIH Common Fund OT2 OD032742) and shares personnel and the MuSIC methodology with CM4AI, but is
  not part of any CM4AI Dataverse release. It is recorded under external_resources as a separate
  dataset and its facts are not merged into this record. Counts, cell lines and methods attributed to
  the U2OS map are therefore absent here.
  Release date disagreement. The CM4AI data-releases page presents the June 2026 release with
  "Released on: June 17, 2025", while the Dataverse citation metadata for the same DOI
  (10.18130/V3/HIGT4C) gives Publication Date 2026-06-17 and a 2026 citation year. The manifest
  curation note records the Dataverse value and the version 2 release time 2026-07-15T20:28:19Z. Both
  values are reported; this record uses the Dataverse value for issued dates.
  Version labelling. Each Dataverse landing page shows a version number that differs from the version
  token in the same page's citation string: March 2025 shows "Version 1.4" with citation "V1"; June
  2025 shows "Version 2.1" with citation "V2"; October 2025 shows "Version 2.1" with citation "V2";
  June 2026 shows "Version 2.0" with citation "V2". Both forms are recorded per release.
  Data Creation Date. All four captured Dataverse releases report Data Creation Date 2025-02-27,
  Deposit Date 2025-02-27 and Depositor "Niestroy, Justin", including the June 2026 release published
  2026-06-17. The bundle offers no explanation for the identical dates.
  Protein-count disagreement for immunofluorescence imaging. The March 2025 release file descriptions
  state 563 proteins of interest; the June 2025, October 2025 and June 2026 file descriptions state
  464; the CM4AI flagship-datasets page states "IF images for 523 proteins" for the TNBC cells. All
  three figures are recorded separately rather than reconciled.
  Checksum divergence under identical filenames. The three IF image archives
  cm4ai_ifimages_MDA-MB-468_{paclitaxel,untreated,vorinostat}.zip carry identical MD5 values in the
  June 2025 and October 2025 releases but different MD5 values in the June 2026 release, where they
  were published on 2026-07-15 rather than 2026-06-17.
  Project end date disagreement. NIH RePORTER gives a project end of 2026-08-31 for application
  11211616 (3OT2OD032742-01S2, core OT2OD032742), while the Dataverse maintenance plan states the
  dataset will be updated "through the end of the project in November 2026".
  Affiliation of Sali A. The Dataverse release metadata lists Sali A under University of California
  San Diego; the CM4AI preprint lists Sali under University of California San Francisco. Both
  organizations are recorded on that creator.
  Affiliation rendering. The June 2026 capture renders the University of Virginia affiliations as the
  bare identifier https://ror.org/0153tk833, whereas the March, June and October 2025 captures spell
  out "University of Virginia" for the same authors. The two forms are treated as one organization.
  The ORCID for Marquez C is printed without the https://orcid.org/ prefix on every capture; it is
  normalised here.
  Byte counts. Dataverse displays file sizes in rounded human-readable units (for example "3.8 GB",
  "31.1 KB") and the portal reports "21.4 TB" of data volume. No exact byte counts appear anywhere in
  the bundle, so total_size_bytes and File.bytes are left unset and the displayed sizes are quoted in
  the corresponding descriptions.
  Release inventory completeness. The June 2025 capture paginates its file table and shows 10 of 21
  files; only those 10 are enumerated. The May 2024 release is known only from a DOI cited in the
  CM4AI preprint and from an "Archive" link label on the data-releases page, so no inventory,
  authorship or version metadata is available for it. The March 2025 capture predates the "Data
  Governance & Ethics", "Completeness", "Maintenance Plan", "Intended Use", "Limitations",
  "Prohibited Uses" and "Potential Sources of Bias" blocks that appear on the June 2025, October 2025
  and June 2026 pages; statements drawn from those blocks are scoped accordingly.
  External data links. The Dataverse "External Data Links" blocks name target repositories (MassIVE
  Repository, NCBI BioProject, Figshare) as link labels only. No accession identifiers for the CM4AI
  depositions are given anywhere in the bundle, so none are recorded.
  Collaborating institution list. The CM4AI data-releases page states "CM4AI is a collaboration of
  UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University, and the
  Hastings Center", while the March 2025 and June 2025 Dataverse release descriptions give the same
  list without UT Austin. Both lists are reported.
  Ontology identifiers. The data_topic values used on instances are taken verbatim from the ontology
  mappings that the Dataverse keyword blocks publish alongside the corresponding keywords.
  Repository status banner. Every CM4AI page and Dataverse collection page in the bundle carries the
  notice "This repository is under review for potential modification in compliance with
  Administration directives." Its consequences for continued availability are not stated.

