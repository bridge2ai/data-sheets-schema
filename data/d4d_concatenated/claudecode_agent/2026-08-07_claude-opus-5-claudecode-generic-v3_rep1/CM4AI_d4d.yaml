    access_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C

ethical_reviews:

  - id: https://cm4ai.org/data-releases/#ethical-review-ravitsky
    name: Named ethical review contact - Vardit Ravitsky
    reviewing_organization: The Hastings Center
    review_details: >-
      The Data Governance and Ethics block of the June 2025, October 2025 and June 2026 Dataverse
      releases names Vardit Ravitsky (ravitskyv@thehastingscenter.org) under "Ethical Review". The
      contact is Vardit Ravitsky, reachable at ravitskyv@thehastingscenter.org and listed in the
      Dataverse author block under University of Montreal with ORCID
      https://orcid.org/0000-0002-7080-8801.
    contact_person: https://orcid.org/0000-0002-7080-8801
    source_caveats: >-
      The bundle gives no IRB protocol number, review board name or review determination for these
      releases.

  - id: https://cm4ai.org/data-releases/#ethical-review-belisle-pipon
    name: Named ethical review contact - Jean-Christophe Belisle-Pipon
    reviewing_organization: Simon Fraser University
    review_details: >-
      The Data Governance and Ethics block of the June 2025, October 2025 and June 2026 Dataverse
      releases names Jean-Christophe Belisle-Pipon
      (jean-christophe_belisle-pipon@sfu.ca) under "Ethical Review". The same person appears in the
      Dataverse author block as Belisle-Pipon JC, Simon Fraser University, ORCID
      https://orcid.org/0000-0002-8965-8153.
    contact_person: https://orcid.org/0000-0002-8965-8153

  - id: https://cm4ai.org/data-releases/#ethical-review-ethics-module
    name: CM4AI Ethics Module governance programme
    reviewing_organization: CM4AI Ethics Module
    review_details: >-
      The CM4AI preprint states that the Ethics team worked closely with the Data Acquisition, Tools
      and Standards Modules to develop a plan for ethical preparation, licensing, dissemination and
      Data Access supervision of CM4AI datasets, balancing the openness of the data with protection
      of intellectual property and supervision and monitoring of potential efforts at
      commercialization. The team employs a methodology inspired by Value-Sensitive Design, is
      building an axiological repository of values to guide design standards and expectations, and is
      formulating the CM4AI Life Cycle, a framework elucidating governance milestones throughout data
      generation and AI system development. The Ethics Pillar established guidelines addressing
      socio-ethical challenges, developed a first version of the Value Repository, and supported the
      Bridge2AI Ethics Working Group and the Bridge2AI Data Sharing and Dissemination Working Group
      in developing a Code of Conduct that participants in the Bridge2AI Open House must attest and
      commit to prior to accessing B2AI data, including CM4AI datasets. A Data Access Committee
      supervises ethical matters related to dataset distribution and potential dual licensing for
      commercial use.

human_subject_research:
  id: https://cm4ai.org/data-releases/#human-subject-research
  name: Human subject research status
  involves_human_subjects: false
  regulatory_compliance:
    - Not FDA regulated
  description: >-
    The Data Governance and Ethics block on the June 2025, October 2025 and June 2026 Dataverse
