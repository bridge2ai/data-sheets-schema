id: https://cm4ai.org/data-releases/
name: CM4AI Data Releases
title: Cell Maps for Artificial Intelligence (CM4AI) Data Releases
description: >-
  The quarterly data release programme of Cell Maps for Artificial Intelligence (CM4AI), the
  Functional Genomics Data Generation Project of the U.S. National Institutes of Health Bridge2AI
  programme. CM4AI delivers machine-readable hierarchical maps of cell architecture as AI-ready data,
  together with quarterly releases of the map-input data streams. Those streams are produced by
  multimodal interrogation of chromatin modifiers, metabolic enzymes and other proteins implicated in
  cancer, neuropsychiatric and cardiac disorders, in disease-relevant human cell lines under treated
  and untreated conditions, using mass-spectrometry-based proteomics (AP-MS and SEC-MS), spatial
  proteomics / immunofluorescence cell imaging, and CRISPR/Cas9 genetic perturbation (perturb-seq).
  The cell lines are the triple-negative breast cancer line MDA-MB-468 (untreated, paclitaxel-treated
  and vorinostat-treated) and the induced pluripotent stem cell line KOLF2.1J (undifferentiated, and
  differentiated to neural progenitor cells, neurons and cardiomyocytes). Output data are packaged
  with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using the
  FAIRSCAPE framework, and are deposited in LibraData, the University of Virginia's instance of
  Dataverse, which is an NIH-approved generalist repository. Each quarterly release is deposited as a
  separate Dataverse dataset with its own DOI; the releases named in the bundle are the May 2024,
  March 2025, June 2025, October 2025 and June 2026 releases, and every release from March 2025
  onward is titled "(Beta)". The CM4AI portal reports project-level figures of 1,374 protein interactions, 53,788 immunofluorescent images, 7,023 total
  proteins investigated, 11,739 genes targeted and a data volume of 21.4 TB. CM4AI is a collaboration
  of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University and the
  Hastings Center according to the data-releases page, and of the same list without UT Austin
  according to the Dataverse release descriptions.
