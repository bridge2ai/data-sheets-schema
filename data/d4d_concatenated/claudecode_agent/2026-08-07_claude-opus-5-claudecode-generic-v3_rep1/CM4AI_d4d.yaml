instances:

  - id: https://cm4ai.org/data-releases/#instance-crispri-atlas-genes
    name: CRISPRi Perturbation Cell Atlas targeted genes (KOLF2.1J iPSCs)
    instance_type: targeted gene in a genome-scale CRISPRi perturbation screen
    counts: 11739
    data_topic: http://www.ebi.ac.uk/efo/EFO_0008860
    description: >-
      An expressed genome-scale CRISPRi Perturbation Cell Atlas in undifferentiated KOLF2.1J human
      induced pluripotent stem cells (hiPSCs) mapping transcriptional and fitness phenotypes
      associated with 11,739 targeted genes. The March 2025 file description adds that the findings
      were validated via phenotypic, protein-interaction and metabolic tracing assays. The CM4AI
      portal reports the same figure as "genes targeted 11,739".

  - id: https://cm4ai.org/data-releases/#instance-perturbseq-tnbc-genes
    name: Perturb-seq targeted genes (MDA-MB-468 TNBC cells)
    instance_type: targeted gene in a perturb-seq screen
    counts: 200
    data_topic: http://www.ebi.ac.uk/efo/EFO_0008860
    description: >-
      The CM4AI flagship-datasets page states that the curated datasets for TNBC cells under
      untreated (DMSO control), vorinostat and paclitaxel conditions include perturb-seq of 200
      genes. The CM4AI preprint describes single-cell CRISPR screens perturbing 100 chromatin
      regulators in MDA-MB-468 cells under three conditions, using a CRISPR lentiviral library
      targeting 100 chromatin factors with 6 guide RNAs per gene.
    source_caveats: >-
      The flagship-datasets figure of 200 genes and the preprint's 100 chromatin regulators are both
      reported by the bundle for the TNBC perturb-seq screens and are not reconciled here. The
      preprint describes Year-1 status as of May 2024; the flagship page reflects a later state.

  - id: https://cm4ai.org/data-releases/#instance-secms-proteins
    name: SEC-MS protein coverage
    instance_type: protein quantified by size exclusion chromatography-mass spectrometry
    data_topic: http://purl.obolibrary.org/obo/NCIT_C18469
    description: >-
      The CM4AI flagship-datasets page states that both the iPSC-lineage curated dataset and the TNBC
      curated dataset include SEC-MS capturing approximately 7,000 proteins. The CM4AI preprint
      reports that SEC-MS on MDA-MB-468 cells under three conditions identified 72 of 100 chromatin
      modifiers, 52 of them integral components of protein complexes, detected PPI profiles of over a
      thousand complexes in MDA-MB-468 cells, and uncovered more than 700 protein complexes in both
      parental KOLF2 iPSCs and differentiated neurons.
    source_caveats: >-
      The figure is stated as "~7,000 proteins", an approximation, so no exact count is recorded.

  - id: https://cm4ai.org/data-releases/#instance-if-proteins-464
    name: Immunofluorescence protein coverage, June 2025 through June 2026 releases
    instance_type: protein of interest imaged by immunofluorescence
    counts: 464
    data_topic: http://purl.obolibrary.org/obo/GO_0008104
    description: >-
      The file descriptions in the June 2025 and October 2025 releases state that each IF image
      archive displays the spatial localization of 464 proteins of interest in MDA-MB-468 breast
      cancer cells for its condition, imaged by immunofluorescence-based staining (ICC-IF) and
      confocal microscopy in the Lundberg Lab at Stanford University.

  - id: https://cm4ai.org/data-releases/#instance-if-proteins-563
