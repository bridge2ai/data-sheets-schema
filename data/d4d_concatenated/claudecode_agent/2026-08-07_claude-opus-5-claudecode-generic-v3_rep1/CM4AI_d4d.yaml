  - id: https://cm4ai.org/data-releases/#instance-portal-protein-interactions
    name: Protein interactions reported by the CM4AI portal
    instance_type: protein-protein interaction
    counts: 1374
    data_topic: http://purl.obolibrary.org/obo/NCIT_C18469
