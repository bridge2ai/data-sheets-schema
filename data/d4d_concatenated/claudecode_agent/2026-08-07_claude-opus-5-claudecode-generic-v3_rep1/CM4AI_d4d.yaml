preprocessing_strategies:

  - id: https://cm4ai.org/data-releases/#preprocessing-music-pipeline
    name: MuSIC data integration and map production pipeline
    preprocessing_details: >-
      The Tools Module produces and maintains the Multi-Scale Integrated Cell (MuSIC) pipeline, which
      produces integrated cell maps from the multiple multimodal input data streams. Its segments
      are: (a) download PPI networks from the Krogan Laboratory's deposition archive and IF images
      from the Lundberg Laboratory's deposition archive; (b) generate embeddings, processing PPI
      networks with the node2vec deep learning model to produce a PPI embedding and IF images with a
      Human Protein Atlas deep learning model to produce an image embedding, both reducing
      dimensionality; (c) co-embedding, integrating the PPI and image embeddings for each protein
      using contrastive deep learning so that the original embeddings can be reconstructed with
      minimal information loss and proteins with similar PPI and image embeddings have similar
      co-embeddings; (d) protein community detection based on all-by-all similarities of protein
      pairs in the co-embedding space, with the resulting hierarchy of protein communities output as
      the final cell map; and (e) hierarchy evaluation. The pipeline is divided into segments each of
      which calls the FAIRSCAPE client package to validate inputs and create the output RO-Crate
      package for that segment, ready for dispatch to the FAIRSCAPE server for PID creation and
      provenance graph entailment computation.
    used_software:
      - id: https://cm4ai.org/#software-music
        name: Multi-Scale Integrated Cell (MuSIC) pipeline
      - id: https://cm4ai.org/#software-node2vec
        name: node2vec
        description: >-
          Deep learning model used to reduce the dimensionality of PPI networks into a PPI embedding
          that contains information about a protein's interactions.
      - id: https://cm4ai.org/#software-hpa-model
        name: Human Protein Atlas deep learning model
        description: >-
          Used to reduce the dimensionality of IF images into an image embedding that contains
          information about protein localization.

  - id: https://cm4ai.org/data-releases/#preprocessing-fairscape-packaging
    name: FAIRSCAPE AI-readiness packaging into RO-Crates
    preprocessing_details: >-
      The Standards Module performs AI-readiness packaging of data, software, metadata and provenance
      graphs using FAIRSCAPE. FAIRSCAPE-CLI is called when any computation or coherent set of
      computations in the pipeline completes, and is passed metadata defining JSON-Schema schemas for
      the datasets in the computational unit as well as the inputs, computations, software, models
      and outputs. It creates an RO-Crate package with the datasets, metadata and software, or
      resolvable references to these components, plus unique stubs for identifier creation. The
      RO-Crates are sent to the FAIRSCAPE server, which registers them and assigns persistent,
      resolvable, globally unique identifiers under the ARK scheme, decomposes them into their
      individual components - datasets, models, software - which are also registered and assigned
      PIDs, and computes end-to-end entailments on each RO-Crate's provenance as expressed in the EVI
      Evidence Graph Ontology, linking them together where possible. PIDs resolve to machine- and
      human-readable landing pages containing metadata expressed in JSON-LD using vocabularies from
      Schema.org, EVI and other public ontologies, with alternate JSON-LD and RDF-XML serializations
      available.
    used_software:
      - id: https://fairscape.github.io
        name: FAIRSCAPE
        license: MIT
        url: https://fairscape.github.io

  - id: https://cm4ai.org/data-releases/#preprocessing-june-2025-revision
    name: June 2025 release revision
    preprocessing_details: >-
      The June 2025 release is described as a revision that includes adding RGB immunofluorescent
      images, corrections to RO-Crate metadata and changes to naming conventions. The file naming in
      that release changes from the March 2025 cm4ai-v0.6-beta-if-images-{condition}.zip convention
      to cm4ai_ifimages_MDA-MB-468_{condition}.zip.

  - id: https://cm4ai.org/data-releases/#preprocessing-integrative-structure-modeling
    name: Integrative structure modelling of MuSIC communities
    preprocessing_details: >-
      The CM4AI preprint reports that the project was exploring the feasibility of integrative
      structure modelling of the MuSIC communities. A bioinformatics pipeline was developed for
      annotating MuSIC communities by the available structural information about community members
      and their interactions, drawn from the Protein Data Bank, the AlphaFold Protein Structure
      Database, crosslinking mass spectrometry and prediction of disordered sequence segments;
      communities were ranked by the amount of available structural information as a proxy for
      modelling feasibility, and integrative structure modelling was performed for a few top-ranked
      communities. The four-stage protocol - gathering input information, representing subunits and
      translating data into spatial restraints, configurational sampling, and analysing and
      validating input information and models - was scripted using the Python Modeling Interface
      package on the Integrative Modeling Platform version 2.18.
    used_software:
      - id: http://integrativemodeling.org
        name: Integrative Modeling Platform (IMP)
        version: '2.18'
        url: http://integrativemodeling.org
    source_caveats: >-
      Described in the May 2024 preprint as work in progress. No integrative structure models appear
      in any captured Dataverse release.

cleaning_strategies:

  - id: https://cm4ai.org/data-releases/#cleaning-crispr-qc
    name: Quality control of the single-cell CRISPR screen data
    cleaning_details: >-
      The CM4AI preprint reports, as Year-1 status in May 2024, that single-cell CRISPR screens of
      100 chromatin regulators with and without drug in MDA-MB-468 cells and in undifferentiated
      KOLF2.1J iPSCs were done using the 10x Genomics 3'HT kit and that the resulting data were then
      being QCed.
    source_caveats: >-
      This is a point-in-time statement from the May 2024 preprint. The bundle contains no
      description of quality-control procedures applied to any of the captured 2025 or 2026 releases.

labeling_strategies:

  - id: https://cm4ai.org/data-releases/#labeling-cell-map-annotation
    name: Two-pronged annotation of cell map assemblies
    data_annotation_protocol: >-
      Cell maps are annotated in a two-pronged approach. First, cell maps are aligned to known
      protein function and pathway resources, including the Gene Ontology (GO) and Reactome, to
      determine protein assemblies in the cell map with high overlap with known cell biology. Second,
      assemblies in the cell maps are annotated using a large language model approach developed by
      the project to name sets of proteins and assign a name confidence score.
    labeling_details: >-
      This is the MuSIC hierarchy-evaluation segment of the CM4AI pipeline. Because the Completeness
      block states that computed cell maps are not included in any captured release, no annotated
      cell map is present in the released material.
    used_software:
      - id: https://cm4ai.org/#software-llm-naming
        name: LLM protein-set naming and confidence scoring approach
        description: >-
          Names sets of proteins constituting a cell map assembly and assigns a name confidence
          score.

machine_annotation_tools:

  - id: https://cm4ai.org/data-releases/#machine-annotation
    name: Machine learning components used in the CM4AI pipeline
    tools:
      - node2vec
      - Human Protein Atlas deep learning model
      - Contrastive deep learning co-embedding model
      - Multi-resolution algorithmic community detection
      - Large language model protein-set naming with confidence scoring
    tool_descriptions: >-
      These are the components of the MuSIC pipeline that generate machine-produced representations
      and annotations rather than experimental measurements. node2vec reduces the dimensionality of
      PPI networks to a PPI embedding; the Human Protein Atlas deep learning model reduces IF images
      to an image embedding; contrastive deep learning integrates the two into a per-protein
      co-embedding; community detection over all-by-all co-embedding similarities builds the protein
      assembly hierarchy; and a large language model names sets of proteins and assigns a name
      confidence score.
    source_caveats: >-
      The bundle reports no accuracy figure for any of these components.

existing_uses:

  - id: https://cm4ai.org/data-releases/#existing-uses
    name: Reported uses of the released data
    examples:
      - >-
        Initial datasets, tools and standards associated with all three parallel mapping platforms
        were made available at the CM4AI CodeFest in March 2024, accompanied by detailed tutorials
        explaining how the data were derived and integrated and providing production-ready software
        for producing the datasets.
      - >-
        The March 2025 and June 2025 releases list as a Related Publication "Nourreddine S, Doctor Y,
        Dailamy A, et al. A PERTURBATION CELL ATLAS OF HUMAN INDUCED PLURIPOTENT STEM CELLS. bioRxiv.
        2024 Nov 4;2024.11.03.621734. PMCID: PMC11580897, doi:10.1101/2024.11.03.621734".
      - >-
        The CM4AI preprint states that cell maps have been used in AI tools for visible machine
        learning or visible neural networks to interrogate how protein assemblies in the cell affect
        cell-level phenotype predictions.
    description: >-
      The Dataverse "Dataset Citations" panel on the March 2025 release states "Sorry, no citations
      were found." Download counts are recorded per release: 302 for March 2025, 256 for June 2025,
      405 for October 2025 and 181 for June 2026.
    source_caveats: >-
      The bundle reports no external reuse of any specific CM4AI Dataverse release.

use_repository:

  - id: https://cm4ai.org/data-releases/#use-repository
    name: CM4AI web portal
    repository_url: https://cm4ai.org/
    repository_details: >-
      The CM4AI web portal carries a Publications section inviting visitors to "Check out our recent
      publications to learn more about how CM4AI is addressing the Bridge2AI's Functional Genomics
      grand challenge", alongside Data Releases, Tools, Product Documentation and Learning sections.
      The portal is built on the U-BRITE platform and is described as supporting open and trustworthy
      data management and sharing.
    source_caveats: >-
      The bundle does not capture the contents of the CM4AI Publications page, so no list of papers
      or systems using the data is available.

other_tasks:

  - id: https://cm4ai.org/data-releases/#other-task-variant-interpretation
    name: Interpretation of genetic variants and mutations
    task_details: >-
      The CM4AI preprint states that cell maps provide a foundation for downstream applications in
      human genomics, including interpretation of genetic variants and mutations.

  - id: https://cm4ai.org/data-releases/#other-task-treatment-response
    name: Analysis of cell architectural change under treatment and perturbation
    task_details: >-
      The Intended Use block lists cellular process analysis and the study of cell architectural
      changes and interactions in the presence of specific disease processes, treatment conditions or
      genetic perturbations. The October 2025 and June 2026 descriptions state that CM4AI is
      generating multi-modal data in MDA-MB-468 breast cancer cells with and without paclitaxel or
      vorinostat and in iPSCs with and without differentiation, which supports comparison across
      those conditions.

future_use_impacts:

  - id: https://cm4ai.org/data-releases/#future-impact-interim-status
    name: Interim status and planned augmentation
    impact_details: >-
      Data presented in each release will be augmented regularly through the end of the project, and
      the releases do not contain predicted cell maps, which will be added in future releases.
      Analyses built on a captured release should therefore expect the released content to grow and
      the cell maps to arrive later. Software packages are versioned as the project progresses and
      the version used to produce each dataset is referenced in the dataset's metadata.

  - id: https://cm4ai.org/data-releases/#future-impact-repository-review
    name: Administrative review of the hosting repository
    impact_details: >-
      Both the CM4AI website and the University of Virginia Dataverse collection page carry the
      notice "This repository is under review for potential modification in compliance with
      Administration directives."
    source_caveats: >-
      The bundle does not state what the review could change or when it concludes, so nothing in it
      assures continued availability of the released material in its current form.

intended_uses:

  - id: https://cm4ai.org/data-releases/#intended-uses
    name: Intended uses stated by the release metadata
    examples:
      - AI-ready datasets to support research in functional genomics
      - AI model training
      - Cellular process analysis
      - >-
        Cell architectural changes and interactions in presence of specific disease processes,
        treatment conditions, or genetic perturbations
    usage_notes: >-
      The Limitations block advises that this is an interim release, that it does not contain
      predicted cell maps, that the current release is most suitable for bioinformatics analysis of
      the individual datasets, and that it requires domain expertise for meaningful analysis.

prohibited_uses:

  - id: https://cm4ai.org/data-releases/#prohibited-clinical-use
    name: Clinical decision-making and patient care
    prohibition_reason: >-
      The Prohibited Uses block on the June 2025, October 2025 and June 2026 releases states that
      these laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.

  - id: https://cm4ai.org/data-releases/#prohibited-commercial-use
    name: Commercial use without a separate license
    prohibition_reason: >-
      The datasets are licensed under CC BY-NC-SA 4.0, whose NonCommercial term states "You may not
      use the material for commercial purposes", a commercial use being one primarily intended for
      commercial advantage or monetary compensation. The CM4AI preprint states that commercial use
      requires a separate license negotiation with the copyright holder (UCSD, Stanford and/or UCSF
      depending upon the specific data package in question), and that a Data Access Committee
      supervises ethical matters related to dataset distribution and potential dual licensing for
      commercial use.

distribution_formats:

  - id: https://cm4ai.org/data-releases/#format-zip
    name: ZIP archives
    format: ZIP Archive
    media_type: application/zip
    description: >-
      The bulk of every release is distributed as ZIP archives holding the immunofluorescence images,
      mass spectrometry data, perturbation atlas and raw sequence data, and the release metadata. All
      eight files of the October 2025 release and all ten of the June 2026 release are ZIP archives.
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/K7TGEM
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C

  - id: https://cm4ai.org/data-releases/#format-ro-crate-json
    name: RO-Crate metadata in JSON
    format: JSON
    media_type: application/json
    description: >-
      CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets in
      RO-Crate format using the FAIRSCAPE framework. The March 2025 release deposits an
      ro-crate-metadata.json per data folder; the June 2025 release deposits a
      release-ro-crate-metadata.json described as a "Release RO-Crate with pointers to sub
      ro-crates", typed by Dataverse as "RO-Crate metadata", plus per-folder RO-Crate metadata.
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R

  - id: https://cm4ai.org/data-releases/#format-html
    name: HTML datasheets and provenance graphs
    format: HTML
    media_type: text/html
    description: >-
      The June 2025 release deposits release-ro-crate-datasheet.html, an HTML datasheet summarising
      key release information, and one HTML provenance graph per imaging condition and for the
      cancer-cell mass spectrometry. The file descriptions note that the .html provenance graph files
      require download to view properly and will not display in the Dataverse preview.
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R

distribution_dates:

  - id: https://cm4ai.org/data-releases/#distribution-date-march-2025
    name: March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX
    release_dates:
      - '2025-03-03'
  - id: https://cm4ai.org/data-releases/#distribution-date-june-2025
    name: June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R
    release_dates:
      - '2025-07-01'
  - id: https://cm4ai.org/data-releases/#distribution-date-october-2025
    name: October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM
    release_dates:
      - '2025-10-31'
  - id: https://cm4ai.org/data-releases/#distribution-date-june-2026
    name: June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C
    release_dates:
      - '2026-06-17'
      - '2026-07-15T20:28:19Z'
    source_caveats: >-
      Three distinct dates are published for this release. The two recorded here are the Dataverse
      Publication Date 2026-06-17 and the version 2 release time 2026-07-15T20:28:19Z from the
      manifest curation note, consistent with the three IF image archives being published on Jul 15,
      2026. The third, "Released on: June 17, 2025" as displayed on the CM4AI data-releases page for
      this DOI, is a year earlier than the repository's own record and is reported here rather than
      recorded as a release date.

third_party_sharing:

  - id: https://cm4ai.org/data-releases/#third-party-sharing
    name: Distribution through third parties
    is_shared: true
    description: >-
      The releases are distributed by LibraData, the University of Virginia's instance of Dataverse
      and an NIH-approved generalist repository, rather than by the producing institutions
      themselves. Raw data are additionally held in external repositories - the MassIVE Repository,
      NCBI BioProject / Sequence Read Archive and Figshare - and the March 2025 SEC-MS RO-Crate notes
      that data will be uploaded to PRIDE when available. Alpha-level tools are distributed on GitHub
      and production-ready tools in the Zenodo long-term archive. All files in all captured releases
      are listed with File Access "Public".

license_and_use_terms:
  id: https://cm4ai.org/data-releases/#license-and-use-terms
  name: CC BY-NC-SA 4.0 with attribution and citation requirements
  data_use_permission: no_commercial_use
  license_terms: >-
    Every captured release records License/Data Use Agreement "CC BY-NC-SA 4.0", the Creative Commons
    Attribution-NonCommercial-ShareAlike 4.0 International license, canonical URL
    https://creativecommons.org/licenses/by-nc-sa/4.0/. Under that license users are free to share -
    copy and redistribute the material in any medium or format - and to adapt - remix, transform and
    build upon the material - and the licensor cannot revoke these freedoms as long as the license
    terms are followed. The terms are: Attribution, meaning the user must give appropriate credit,
    provide a link to the license and indicate if changes were made, in any reasonable manner but not
    in any way that suggests the licensor endorses the user; NonCommercial, meaning the material may
    not be used for commercial purposes, a commercial use being one primarily intended for commercial
    advantage or monetary compensation; ShareAlike, meaning that contributions built on the material
    must be distributed under the same license as the original or a license listed as compatible at
    https://creativecommons.org/compatiblelicenses; and No additional restrictions, meaning the user
    may not apply legal terms or technological measures that legally restrict others from doing
    anything the license permits. The deed notes that compliance is not required for elements in the
    public domain or where use is permitted by an applicable exception or limitation, that no
    warranties are given, and that other rights such as publicity, privacy or moral rights may limit
    use. Beyond the license, the CM4AI releases require attribution to the copyright holders and the
    authors, and state that any publications referencing the data or derived products should cite the
    Related Publication as well as directly citing the data collection. The Dataverse Dataset Terms
    add that community norms and good scientific practices expect proper credit via citation, using
    the data citation shown on the dataset page. The CM4AI preprint states that commercial use
    requires a separate license negotiation with the copyright holder - UCSD, Stanford and/or UCSF
    depending upon the specific data package in question - and that a Data Access Committee
    supervises ethical matters related to dataset distribution and potential dual licensing for
    commercial use. Integration and packaging software is separately licensed: the Tools data
    integration pipeline under BSD-3, and FAIRSCAPE under MIT.
  description: >-
    The contact is Trey Ideker (tideker@health.ucsd.edu, University of California San Diego, ORCID
    https://orcid.org/0000-0002-1708-8454), recorded as Point of Contact on the March 2025, June
    2025, October 2025 and June 2026 Dataverse releases; the landing pages direct enquiries through
    the Contact Owner email button.
  contact_person: https://orcid.org/0000-0002-1708-8454

ip_restrictions:
  id: https://cm4ai.org/data-releases/#ip-restrictions
  name: Copyright and commercial licensing restrictions
  restrictions:
    - >-
      Copyright in the released data is held by The Regents of the University of California except
      where otherwise noted, stated as 2025 on the March 2025, June 2025, October 2025 and June 2026
      Dataverse releases and as 2024 in the CM4AI preprint.
    - >-
      Spatial proteomics raw image data is copyright of The Board of Trustees of the Leland Stanford
      Junior University, stated as 2025 on the Dataverse releases and as 2024 in the CM4AI preprint.
    - >-
      Commercial use requires a separate license negotiation with the copyright holder - UCSD,
      Stanford and/or UCSF depending upon the specific data package in question.
    - >-
      A Data Access Committee supervises ethical matters related to dataset distribution and
      potential dual licensing for commercial use.
    - >-
      Attribution requirements include attribution to the copyright holders and to the Cell Maps for
      Artificial Intelligence project as referenced in the datasets, and citation of the CM4AI
      article.
    - >-
      The University of Virginia Dataverse pages carry the notice "Copyright 2025, by the Rector and
      Visitors of the University of Virginia" and link to its Terms of Use and Privacy Policy.

regulatory_restrictions:
  id: https://cm4ai.org/data-releases/#regulatory-restrictions
  name: Regulatory and administrative status
  regulatory_restrictions:
    - Not FDA regulated
  other_compliance: >-
    Every CM4AI web page and the University of Virginia Dataverse collection and dataset pages carry
    the notice "This repository is under review for potential modification in compliance with
    Administration directives." No further detail on the review, its scope or its outcome appears in
    the bundle.
  description: >-
    The June 2025, October 2025 and June 2026 Dataverse releases record FDA Regulated: No. Access to
    the released files is otherwise governed by the CC BY-NC-SA 4.0 license and by the temporary
    pre-publication embargo noted in the Completeness block, rather than by regulatory controls.
    The Data Governance Committee contact named in the Data Governance and Ethics block of the June
    2025, October 2025 and June 2026 releases is Jillian Parker, jillianparker@health.ucsd.edu, at
    the University of California San Diego.
  governance_committee_contact: https://cm4ai.org/data-releases/#person-jillian-parker
  source_caveats: >-
    No HIPAA determination and no export-control statement appears anywhere in the bundle, so
    hipaa_compliant and confidentiality_level are left unset. The Dataverse author list separately
    includes "Parker J (University of California, San Diego) - ORCID
    https://orcid.org/0000-0003-4535-3486". The bundle does not state that the governance contact and
    that author are the same person, so no ORCID is asserted for the governance contact and a local
    identifier is used instead.

maintainers:

  - id: https://cm4ai.org/data-releases/#maintainer-libradata
    name: LibraData, University of Virginia Dataverse
    role: academic_institution
    maintainer_details: >-
      The Maintenance Plan on the June 2025, October 2025 and June 2026 releases states long term
      preservation in the University of Virginia Dataverse, supported by committed institutional
      funds. LibraData is described in the CM4AI preprint as the University of Virginia's instance of
      Dataverse and an NIH-approved generalist repository. The Dataverse instance runs version 6.6
      build 1829-192cdc4 and offers a "Contact University of Virginia Dataverse Support" form.

  - id: https://orcid.org/0000-0001-6730-2773
    name: Swathi Thaker
    role: academic_institution
    maintainer_details: >-
      Listed on the CM4AI website as CM4AI Program Manager at the University of Alabama at Birmingham
      and as the contact for project-related inquiries, at snthaker@uab.edu.

  - id: https://cm4ai.org/#maintainer-zhandos-sembay
    name: Zhandos Sembay
    role: academic_institution
    maintainer_details: >-
      Listed on the CM4AI website as the contact for website support and updates, at the University
      of Alabama at Birmingham, zsembay8@uab.edu.

errata:

  - id: https://doi.org/10.18130/V3/F3TD5R#revision
    name: June 2025 release revision
    erratum_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
    erratum_details: >-
      The June 2025 release is described as a revision of the June 2025 Data Release. The revision
      includes adding RGB immunofluorescent images, corrections to RO-Crate metadata and changes to
      naming conventions.

  - id: https://cm4ai.org/data-releases/#erratum-release-date-display
    name: Release date displayed for the June 2026 release
    erratum_url: https://cm4ai.org/data-releases/
    erratum_details: >-
      The CM4AI data-releases page presents "June 2026 Data Release (Beta), doi.org/10.18130/V3/HIGT4C"
      with "Released on: June 17, 2025", one year earlier than the Dataverse Publication Date of
      2026-06-17 for the same DOI.

updates:
  id: https://cm4ai.org/data-releases/#update-plan
  name: Quarterly release and augmentation plan
  frequency: Quarterly
  update_details: >-
    The Maintenance Plan on the June 2025, October 2025 and June 2026 releases states that the
    dataset will be regularly updated and augmented through the end of the project in November 2026,
    with updates on a quarterly basis, and long term preservation in the University of Virginia
    Dataverse supported by committed institutional funds. The data-releases page states that CM4AI
    will deliver machine-readable hierarchical maps of cell architecture as AI-ready data together
    with quarterly data releases of map-input data streams, and its FAQ answers "When will the next
    Data Release be available?" with "CM4AI releases data quarterly, ensuring continuous updates to
    the cell maps and input data streams." The March 2025 release description states that data
    presented there will be augmented regularly through the end of the project. The CM4AI preprint
    states that software packages will be versioned as the project progresses and that the version
    used to produce each dataset will be referenced in the dataset's metadata.
  source_caveats: >-
    The stated project end of November 2026 does not agree with the NIH RePORTER project end of
    2026-08-31. Both are reported.

retention_limit:
  id: https://cm4ai.org/data-releases/#retention
  name: Long-term preservation commitment
  retention_details: >-
    The Maintenance Plan states long term preservation in the University of Virginia Dataverse,
    supported by committed institutional funds. No retention period, deletion schedule or
    deaccession policy for the released data is stated.
  source_caveats: >-
    The Dataverse interface exposes generic deaccession and retention-period controls, but the bundle
    reports no CM4AI-specific setting for them, and states no retention period or deletion
    schedule.

version_access:
  id: https://cm4ai.org/data-releases/#version-access
  name: Access to current and superseded releases
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
    - May 2024 Data Release, doi:10.18130/V3/DXWOS5
    - March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX
    - June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R
    - October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM
    - June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C
  version_details: >-
    Each quarterly release is deposited as a separate Dataverse dataset with its own DOI, and earlier
    releases remain listed under "Archive" on the CM4AI data-releases page, which names the May 2024,
    March 2025, June 2025 and October 2025 releases as archived and presents the June 2026 release as
    the latest. Within a release, Dataverse maintains its own version numbering: the March 2025
    landing page shows Version 1.4, June 2025 shows Version 2.1, October 2025 shows Version 2.1 and
    June 2026 shows Version 2.0, while the citation strings on the same pages give V1, V2, V2 and V2
    respectively. Dataverse states that files are not removed from previously published versions of a
    dataset.

extension_mechanism:
  id: https://cm4ai.org/data-releases/#extension
  name: Routes for others to contribute or extend
  contribution_url: https://cm4ai.org/
  extension_details: >-
    The bundle describes no formal mechanism for external contributors to extend, augment or build on
    the released datasets and have those contributions incorporated. The Teaming Module is described
    as fostering a culture of open science and community involvement through mailing lists, shared
    online collaborating folders, shared documents and remote messaging and collaboration software
    within CM4AI, across the Bridge2AI program and in the broader scientific community, and the
    Dataverse landing pages offer a "Contact Owner" button, but neither is presented as a
    contribution route for the data.

