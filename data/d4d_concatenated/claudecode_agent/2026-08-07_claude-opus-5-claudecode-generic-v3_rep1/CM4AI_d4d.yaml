is_deidentified:
  id: https://cm4ai.org/data-releases/#deidentification
  name: De-identification status
  identifiable_elements_present: false
  deidentification_details: >-
    The Dataverse release metadata records De-identified Samples: Yes for the June 2025, October 2025
    and June 2026 releases, and the Potential Sources of Bias block describes the source material as
    "commercially available de-identified human cell lines". The CM4AI preprint states that CM4AI
    data are considered to be de-identified as they cannot be matched, with current knowledge, to a
    human subject.
