citation: >-
  Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M., Dorr, D., Payne, P., Ravitsky, V.,
  Bélisle-Pipon, J., Bahr, R., Watts, S., Bolser, D., Siu, J., Lerner-Ellis, J., Rudzicz, F., Boyer, M.,
  Abdel-Aty, Y., Ahmed Syed, T., Amraei, D., ... Ghosh, S. (2026). Bridge2AI-Voice Pediatric Dataset
  (version 1.1.0). PhysioNet. RRID:SCR_007345. https://doi.org/10.13026/h995-bt35
description: >-
  Version 1.1.0 of the Bridge2AI-Voice Pediatric Dataset, a credentialed-access release published on
  PhysioNet on 1 May 2026. It contains derived audio features for 23,533 recordings collected from 300
  participants aged 2 to 18 years at the Hospital for Sick Children (SickKids), together with detailed
  demographic, clinical and validated questionnaire data and per-recording metadata. The release carries
  derivations of the voice recordings - spectrograms, Mel spectrograms, Mel-frequency cepstral
  coefficients, pitch contours, estimated articulatory trajectories, loudness and periodicity measures,
  phonetic posteriorgrams and static acoustic features - and is characterised as containing data considered
  low risk. It does not contain the original voice recordings; raw pediatric audio is distributed
  separately through Synapse under controlled access requiring institutional sign-off. Files are organised
  into a features folder holding the derived audio features, a phenotype folder holding the phenotypic
  information acquired during data collection, and a metadata folder holding metadata for the recordings,
  with a JSON data dictionary accompanying each data file. Participants were patients and healthy
  volunteers at the Hospital for Sick Children, plus non-patients recruited through research postings, all
  aged 2 to 18 with English proficiency and able to speak; each completed a standardized age-appropriate
  protocol of demographic, voice and speech, and medical history questionnaires alongside the recording
  session, administered on tablets through reproschema-ui. Data collection and sharing were approved by the
  Research Ethics Board at the Hospital for Sick Children. The dataset is a distinct PhysioNet project from
  the Bridge2AI-Voice Adult Dataset rather than a version of it, collected from a separate cohort under a
  separate pediatric protocol.
notes: >-
  Two statements on the release page have no dedicated slot in the schema and are recorded here. The
  conflicts of interest declaration reads "None to declare." The acknowledgements read "This release would
  not be possible without the graceful contribution of data from all the participants of the study."
source_caveats: >-
  Referent. This record describes one dataset: the Bridge2AI-Voice Pediatric Dataset at version 1.1.0 as
  published on PhysioNet under DOI 10.13026/h995-bt35. The declared bundle contains one document specific to
  that dataset - the PhysioNet landing page for version 1.1.0, captured 24 July 2026 - alongside five
  consortium-level documents: the University of South Florida single-IRB protocol "Bridge2AI Voice Data
  Acquisition", the docs.b2ai-voice.org documentation site, an NIH RePORTER record for supplement
  3OT2OD032720-01S3, a Bridge2AI-Voice Data Transfer and Use Agreement template, and the eipm/bridge2ai-docs
  README. Facts are taken from the release page wherever it speaks. Consortium-level statements are used only
  where they are explicitly pediatric, or where they describe a programme-wide instrument that the release
  page itself invokes; every such value carries its own source caveat naming the document.

  Excluded as out of scope. Statements in the documentation site that are explicitly scoped to the adult
  release are not carried into this record: the count of 833 instances, dataset versions 2.0.0 and 3.0.0, the
  18-year minimum age, Health Data Nexus hosting, the semi-annual update cadence, the five recording sites,
  the diagnostic labelling of the five adult disease cohorts, and the v3.0.0 HIPAA de-identification
  statements. The adult dataset is treated as a related but distinct resource and is recorded only through
  related_datasets.

  Creators. The PhysioNet byline for this release names 122 authors, reproduced in shortened form in the
  citation slot exactly as the release page presents it. Only those authors for whom the bundle also states an
  affiliation or a project role are itemised as creators; the remaining byline authors are represented through
  the citation rather than as separate creator entries. Affiliations and roles come from the consortium
  description on docs.b2ai-voice.org and from Annex C of the Bridge2AI Voice Data Acquisition protocol, both of
  which describe the consortium as a whole and not the pediatric release specifically. Two name discrepancies
  are noted on the individual creator entries.

  Gaps left empty. The bundle does not state the pediatric data-collection timeframe, per-file byte counts or
  checksums, the total file count or dataset size, the number of participants per age band, the split between
  patients and non-patient volunteers, the pediatric cohort's own research ethics board protocol number or
  approval date, any diagnostic labelling of the pediatric cohort, any predefined data splits, or any prior use
  of the pediatric release. Those slots are omitted rather than estimated.

  Formatting artifacts. The release page gives only a calendar publication date; the T00:00:00Z component of
  "issued" is an artifact of the datetime range. Table 3 of the documentation site, which maps validated
  questionnaires to cohorts, loses its column alignment in the captured text, so only the four questionnaires
  whose names are themselves pediatric are recorded. Award identifiers in the documentation site footer
  ("3Tf-OTOD03272001S2", "3TF-OT2ActfOD032720Projectf01S1") are corrupted in the captured text and are not used.

purposes:
  - id: purpose_pediatric_developmental_norms
    name: Enable study of pediatric voice and speech developmental norms
    response: >-
      Understanding voice and speech development in children is essential for identifying communication or
      speech disorders early in life and for supporting timely intervention. Pediatric and adult voice and
      speech production are fundamentally different, because the respiratory system and larynx undergo rapid
      functional maturation throughout childhood, and these developmental changes influence acoustic features
      such as fundamental frequency. Evidence and normative data available in adults therefore cannot be
      generalised to pediatric populations. The resource is intended to enable the study of developmental
      norms.
  - id: purpose_pediatric_ai_screening_tools
    name: Support AI-driven early screening and clinical insight
    response: >-
      The resource is intended to enable the creation of AI-driven tools for early screening and to support
      clinical insight, by establishing a robust multi-institutional dataset that integrates pediatric voice
      data with demographic information and so advances the understanding of voice and disease as well as
      early detection and intervention.
  - id: purpose_bridge2ai_voice_flagship
    name: Contribute to the Bridge2AI-Voice ethically sourced flagship dataset
    response: >-
      The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset to enable future
      research in artificial intelligence and to support critical insights into the use of voice as a
      biomarker of health. The human voice contains complex acoustic markers that have been linked to
      important health conditions, and voice is a promising characteristic to measure as a biomarker because
      it is simple to collect, cost-effective and has broad clinical utility.

tasks:
  - id: task_machine_learning_pediatric_voice
    name: Machine learning for pediatric voice analysis
    response: >-
      Support machine learning for pediatric voice analysis, including the detection of pediatric
      communication disorders such as autism spectrum disorder and speech delays, which the release page
      identifies as clinically important and under-served by existing pediatric data.
  - id: task_developmental_norm_study
    name: Study of developmental norms
    response: >-
      Characterise how voice and speech acoustic features vary across childhood and adolescence, so that
      age-specific normative expectations can be established rather than extrapolated from adult data.

addressing_gaps:
  - id: addressing_gap_scarce_pediatric_datasets
    name: Scarcity of large-scale pediatric voice datasets
    response: >-
      Despite the clinical importance of detecting pediatric communication disorders, the availability of
      large-scale pediatric databases remains limited. Data collection in pediatric populations poses unique
      challenges including privacy issues, consent processes and the need for developmentally appropriate
      tasks. These factors have contributed to the lack of publicly available pediatric datasets that enable
      machine learning for pediatric voice analysis.
  - id: addressing_gap_adult_data_not_generalisable
    name: Adult normative data do not generalise to children
    response: >-
      Because the respiratory system and larynx mature rapidly throughout childhood, and these changes
      influence acoustic features such as fundamental frequency, the evidence and normative data available in
      adults cannot be generalised to pediatric populations. A dedicated pediatric resource is required rather
      than reuse of adult voice data.

