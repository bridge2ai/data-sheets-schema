conforms_to: >-
  Brain Imaging Data Structure (BIDS) v1.9.0. The raw audio files and the questionnaire data
  retrieved from ReproSchema-UI or exported from REDCap were converted to be BIDS v1.9.0
  compliant, with a phenotype/ directory of TSV+JSON tables and sub-<participant_id>/
  ses-<session_id>/audio/ directories of WAV files with JSON sidecars.
conforms_to_schema: >-
  The Bridge2AI-Voice REDCap data dictionary and metadata (eipm/bridge2ai-redcap), which defines
  the phenotypic instruments, item wording, value sets, and the "Identifier?" sensitivity
  encoding used to select fields for removal prior to release.
was_derived_from: >-
  Raw WAV voice, speech, cough and breathing recordings together with REDCap and ReproSchema-UI
  questionnaire and clinical-validation records collected prospectively under the Bridge2AI Voice
  Data Acquisition protocol; all published feature tables are derivations computed from those
  raw recordings by the b2aiprep and senselab toolkits.

