purposes:
  - name: Build a flagship voice dataset linked to health information
    description: >-
      To generate a large multi-institutional, ethically sourced and diverse voice dataset linked
      to multimodal health biomarkers to fuel voice AI research. The bundle states the target
      inconsistently: the project documentation describes "a flagship, standardized, and
      ethically sourced dataset of 10,000 voices linked to health information" and the study
      metadata gives "Enrollment Count (Anticipated by 2027): 10,000", while the audiomics white
      paper describes the primary deliverable as "a publicly available database of 30 000 human
      voices" and the IRB protocol states a sample size of 30,000 participants, of which 5,000
      are to be enrolled through USF with the remainder reached through participating
      institutions and existing cohorts.
  - name: Enable clinically applicable machine-learning model development
    description: >-
      To enable the development, benchmarking, or validation of clinically applicable
      machine-learning models for diagnosing a wide range of health conditions using voice data,
      including vocal pathologies, neurological, psychiatric, respiratory and pediatric voice
      disorders.
  - name: Integrate voice as a biomarker of health into clinical care
    description: >-
      To promote the integration of voice as a biomarker of health in clinical care and to build
      predictive models to assist in screening, diagnosis, and treatment of a broad range of
      diseases, facilitating use of voice as a non-invasive, cost-effective biomarker.
  - name: Establish standards for acoustic and voice data collection
    description: >-
      To introduce the field of acoustic biomarkers ("audiomics") by developing new standards of
      acoustic and voice data collection and analysis for voice AI research, including
      interoperable bioinformatics standards for voice data and evidence-based recording
      protocols.
  - name: Provide an ethically governed public alternative to private voice datasets
    description: >-
      To create safe, innovative infrastructures to disseminate ethically sourced data for future
      generations of voice AI researchers, addressing the fact that industry holds vast voice
      data but lacks accurate clinical labels and does not permit external auditing of training
      datasets.
  - name: Develop tools, infrastructure and workforce for voice AI
    description: >-
      To develop software and cloud infrastructure for automated, user-friendly, high-quality
      voice data collection; to implement federated learning so multi-institutional data can be
      analysed while minimising data sharing; and to develop curricula, mentorship and a
      community of voice AI researchers, especially from underserved communities.

addressing_gaps:
  - name: Absence of large-scale voice datasets for clinical machine learning
    description: >-
      Previous studies on machine-learning-based voice diagnosis produced promising results but
      their sample sizes were too small. In laryngeal cancer screening and diagnosis, most studies
      reported training datasets of fewer than 300 patients. Published models linking voice to the
      target disease categories used datasets of 20-400 patients.
  - name: Lack of linkage between acoustic data and multimodal health data
    description: >-
      Current literature has been studied only on small- to medium-sized datasets with limited
      data outside acoustic measures and not linked to multi-modal health data. Only two of the
      reviewed laryngeal cancer studies used more than one data modality to train their models.
  - name: Absence of standards for voice and acoustic data collection
    description: >-
      Comparing studies and pooling data is challenging due to a lack of existing standards in how
      voice and other acoustics are measured and collected, precluding meta-analysis and limiting
      external validity.
  - name: Non-auditable private industry datasets
    description: >-
      Within industry, datasets are often private, limiting the ability to audit machine-learning
      models and the accuracy of training data labels. Industry has access to vast amounts of user
      voice data but lacks accurate clinical or demographic information, preventing comparison of
      algorithmic outputs with criterion-standard medical assessment and preventing external
      auditing for fair representation of diverse populations.
  - name: Limited diversity and risk of algorithmic bias in existing open datasets
    description: >-
      The limited size, quality and diversity of existing open-source datasets likely explains the
      lack of validated and FDA-approved AI algorithms for disease detection and monitoring in
      this space. The project aims to create benchmarks of diversity metrics and minimise the risk
      of algorithmic bias.
  - name: Sparse pediatric voice and speech data
    description: >-
      The literature is sparser for pediatric voice and speech analysis, partly due to ethical
      concerns and challenges in data acquisition for this cohort, despite the clinical importance
      of early detection of autism and speech delays.
  - name: Unresolved ethical and legal norms for voice AI
    description: >-
      Voice AI raises unresolved questions concerning HIPAA, potential re-identification of
      patients by their voice, voice hacking, and data ownership, calling for a new governance
      framework for diversity, data handling and privacy safeguards.

tasks:
  - name: Disease detection and classification from voice
    description: >-
      Training machine-learning models for disease detection and classification using voice data.
      Labels include diagnostic categories such as vocal pathologies, neurological disorders,
      psychiatric conditions and respiratory disorders.
  - name: Voice biomarker discovery
    description: >-
      Discovery of scalable acoustic markers associated with health diagnosis, screening and
      monitoring, and identification of unique audio biomarkers of health and disease
      ("audiomics").
  - name: Screening, diagnosis and monitoring model development
    description: >-
      Building predictive models to assist in screening, diagnosis, remote monitoring and
      treatment of a broad range of diseases, and development of new digital endpoints for
      clinical trials.
  - name: Benchmarking and validation of clinically applicable AI models
    description: >-
      AI model pretraining, fine-tuning, benchmarking or validation. The dataset ships with
      predefined tasks and diagnostic labels but no recommended train/validation/test partitions;
      researchers are directed to create their own splits based on their specific requirements.

intended_uses:
  - name: Research on AI and machine learning for healthcare
    description: >-
      The dataset is primarily intended for research applications, specifically the development of
      AI and machine-learning models for healthcare. It supports clinical research in disease
      screening, diagnosis and monitoring through voice biomarkers.
  - name: Commercial and non-commercial research by Authorized Researchers
    description: >-
      Under the Registered Data Access Agreement the dataset is intended solely for commercial and
      non-commercial research purposes by Authorized Researchers. The consent expressly does not
      restrict use to non-commercial purposes, to a specific geographic location, to a specific
      type of research, to genetic research, or to research that avoids developing methods or
      algorithms.
  - name: Model pretraining, fine-tuning, benchmarking and validation
    description: >-
      The dataset can be used for AI model pretraining, fine-tuning, benchmarking, or validation
      of clinically applicable models.
  - name: Cohort selection and phenotypic analysis
    description: >-
      The questionnaire features are collected and distributed in the phenotype folder format and
      can be used for cohort selection alongside the derived acoustic features.
  - name: Training and education in voice AI
    description: >-
      Training opportunities for using the dataset are provided through the Bridge2AI Voice
      Scholars programme at https://www.b2aivoicescholars.org/. A restricted version of the
      dataset containing raw audio has supported the Bridge2AI Summer School and hackathon.

discouraged_uses:
  - name: Non-research and non-clinical decision-making applications
    description: >-
      The dataset should not be used for non-research or non-clinical applications such as hiring
      decisions, insurance premium adjustments, or any form of surveillance that could lead to
      discrimination or harm. These limitations are intended to prevent unethical or biased
      outcomes that could negatively impact individuals based on their health conditions or voice
      characteristics.
  - name: Analyses that ignore the multivariate skew of the sample
    description: >-
      The dataset has skews based on disorder category, site, and other demographic factors. Users
      are advised to consider the multivariate distribution when assessing utility for different
      questions, to avoid unfair treatment of individuals or groups, stereotyping, or
      quality-of-service issues.

prohibited_uses:
  - name: Re-identification of research participants
    description: >-
      The dataset must not be used to attempt to re-identify research participants, nor for any
      actions that could reasonably lead to re-identification. Recipients must not use the data,
      alone or with any other information, to contact individuals who are the subjects of the data
      without appropriate IRB approval, specific written approval from the Provider, and informed
      consent from the individual where required.
  - name: Uses that could harm or stigmatize participants or communities
    description: >-
      The dataset must not be used for any purpose that could foreseeably cause harm or
      stigmatization to research participants, their families, communities, or specific
      populations.
  - name: Sale or unauthorized redistribution of the data
    description: >-
      Sale of all or part of the data on any media is not permitted. Recipients must retain control
      over the data and must not disclose, release, sell, rent, lease, loan or otherwise grant
      access to any third party except Authorized Persons without prior written consent.
      Collaborators at other research organizations and other research teams at the same
      organization must apply independently and sign their own Data Transfer and Use Agreement.
  - name: Use of intellectual property protection to restrict access
    description: >-
      Users agree not to make intellectual property claims on the data and not to use intellectual
      property protection, database rights or related rights in ways that would prevent or block
      access to, or use of, any element of the data or conclusions drawn directly from it. This
      restriction is imposed so that future use of the dataset remains unrestricted, in alignment
      with Open Science principles.

existing_uses:
  - name: Bridge2AI Summer School and hackathon
    description: >-
      A restricted version of the dataset containing raw audio has been used in the Bridge2AI
      Summer School and hackathon. At the time the healthsheet was written no repository existed
      linking to papers or systems that use the dataset.

future_use_impacts:
  - name: Risk of unfair or non-generalizable model behaviour from sample skew
    description: >-
      Because the dataset skews by disorder category, site and demographic factors, models trained
      on it may perform unevenly across groups. Users should consider the multivariate distribution
      when assessing utility, to avoid unfair treatment of individuals or groups, stereotyping,
      quality-of-service issues, financial harms or legal risks.
  - name: Confounding of diagnosis with collection site and device
    description: >-
      Participants were screened for different disorders based on site and therefore had their data
      collected with different devices, so models may learn site or device signatures rather than
      disease signatures.
  - name: Residual re-identification risk from voice
    description: >-
      Voice is inherently identifying. The IRB protocol states that even after removal of all HIPAA
      protected information, each person's voice is unique to them and their health at that time,
      and it is always possible, if unlikely, that someone could recognise a participant's voice;
      a voice can never be fully de-identified. This risk is the stated justification for
      distributing raw audio only under controlled access.
  - name: Potential benefit of expanding access to specialist screening
    description: >-
      The protocol anticipates that the dataset could provide more accessibility to underserved or
      marginal populations through AI advancements and health screenings that are otherwise only
      available through a specialist, which can take months and carry high monetary costs.

acquisition_methods:
  - name: Direct observation of acoustic performance
    description: >-
      Acoustic data were directly observable: participants performed a standardized battery of
      voice, speech, cough and breathing tasks that were recorded in real time by the data
      collection application in the presence of a trained research assistant.
  - name: Participant self-report
    description: >-
      Demographic information, confounder and social-habit information, medical history and
      validated patient-reported outcome questionnaires were reported by the subjects themselves.
      For pediatric participants without adequate comprehension or familiarity with their past
      medical history, parents or decision-makers completed the survey on a separate tablet during
      the recording.
  - name: Clinician validation against gold standards
    description: >-
      Clinical diagnoses were verified by clinicians reviewing audio and/or imaging data, examining
      electronic health records, or checking medication prescriptions. Gold-standard validation
      methods varied by cohort and included laryngoscopy images, stroboscopy videos, CT and MRI of
      the brain or neck/chest, spirometry and flow-volume loops, serum p-tau biomarkers, whole
      genome sequencing, electronic health summaries, and medication history.
  - name: Software derivation from raw audio
    description: >-
      All published feature tables were derived computationally from the raw waveforms rather than
      observed directly, using the b2aiprep and senselab toolkits.

collection_mechanisms:
  - name: Bridge2AI-Voice iPad application
    description: >-
      A custom application running on a tablet, used for adult in-clinic collection. Data were
      collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an Avid AE-36
      microphone connected through an Apple dongle. Distinct iPad devices were used at each site.
  - name: Head-mounted headset with microphone
    description: >-
      Participants were instructed to wear a headset with microphone for tasks including voice
      recording, per the Bridge2AI-Voice suggested standards. Microphone distance could vary
      slightly between recordings. For pediatric participants with low tolerance for headphones or
      complex medical conditions, the built-in tablet microphone was used instead.
  - name: ReproSchema-UI
    description: >-
      All pediatric data were collected using reproschema-ui with the Bridge2AI-Voice pediatric
      protocol, on tablets, and the resulting data were subsequently transformed into REDCap format.
  - name: Bridge2AI Voice Web app and iOS app
    description: >-
      Two remote collection platforms. Neither requires software download, installation or login;
      both are HIPAA-compliant, store data only during the collection phase, and transmit over a
      secure HTTPS protocol to HIPAA-compliant storage. Remote collection did not contribute to the
      initial dataset release.
  - name: REDCap
    description: >-
      Used for the enrollment survey, electronic consent, the clinical case report form, and upload
      of other multimodal data extracted independently at each site. Full data acquisition protocols
      are available in the REDCap Instrument Shared Library and at github.com/eipm/bridge2ai-redcap.
  - name: Bridge2AI Enrollment Web app
    description: >-
      A browser-based recruitment and enrollment tool launched on a participant's own computer,
      tablet or phone, with no software download and no login, transmitting over HTTPS to
      HIPAA-compliant storage.

collection_timeframes:
  - name: Dataset collection period
    description: >-
      The healthsheet reports that the data were collected over a period of 12 months.
  - name: Overall project period
    description: >-
      NIH RePORTER records the funded project as running from 1 September 2022 to 30 November 2026.
      The IRB protocol describes a four-year prospective cohort study organised in four phases:
      exploratory (up to 180 participants, completed November 2023), pilot (cumulatively up to 600
      participants, begun November 2023 and ongoing in November 2024), expansion (cumulatively up
      to 3,000 participants), and outreach (cumulatively 5,000 participants at USF).
  - name: Application feasibility study period
    description: >-
      A separate pilot feasibility study of the data collection application, which did not collect
      audio data, was conducted at the USF Health Voice Center between 5 June 2023 and 28 July 2023
      with 47 participants over a two-month enrollment period.

data_collectors:
  - name: Site research teams
    description: >-
      Research teams, which may include medical, graduate or undergraduate students, coordinated
      with clinicians and doctors to identify appropriate participants, introduced the study,
      obtained consent, and supervised data collection sessions. Data were collected in the clinic
      with the assistance of a trained research assistant.
  - name: Clinicians and physicians
    description: >-
      Clinicians and doctors were listed under the IRB as co-investigators and performed the
      clinical assessment and diagnosis that produced the gold-standard labels. They were not paid
      for this role but were added to the consortium so that their names appear on consortium-level
      publications arising from the research.
  - name: Hospital staff
    description: >-
      Hospital staff were not involved in scheduling but assisted in the logistics of coordinating
      data collection.

direct_collection:
  - name: Direct collection from participants
    description: >-
      The data were collected from the individuals in question directly, rather than obtained via
      third parties. Participants performed the acoustic tasks and completed the questionnaires
      themselves during a supervised session.
  - name: Indirect extraction of clinical validation data
    description: >-
      Clinical validation information was obtained indirectly from institutional records:
      participants who consented permitted investigators to access medical information through EHR
      platforms in order to perform gold-standard validation of diagnoses and symptoms. For the
      psychiatric disorders cohort the diagnostic assessment was determined from the participant's
      EHR record or an active prescription, made outside of data collection by an appropriately
      licensed clinician. Imaging for the released cohorts was collected retrospectively from
      patient charts; no additional imaging was performed for the study.

sampling_strategies:
  - name: Non-probability convenience sampling at high-volume expert clinics
    description: >-
      The study metadata records the sampling method as a Non-Probability Sample with an
      observational, cohort, cross-sectional design. Participants were recruited across different
      academic institutions from "high volume expert clinics", defined as outpatient clinics within
      hospital systems or academic institutions with expertise in a specific disease area seeing
      more than 50 patients per month from the same disease category. Charts of patients presenting
      at these clinics were screened against inclusion and exclusion criteria before the clinic day.
  - name: Cohort-based inclusion and exclusion criteria
    description: >-
      Participants were selected on the basis of membership in five predetermined disease groups
      plus controls, with per-diagnosis inclusion and exclusion criteria documented in the
      collection-methods table. Adult eligibility required age 18 or over (maximum 120), the
      ability to read and speak English, and consent to provide a voice sample for an open-sourced
      database. Exclusions included not speaking English and having had a surgical intervention
      significantly altering the symptoms of the disease studied. Healthy volunteers were accepted.
  - name: Pediatric recruitment
    description: >-
      Pediatric participants were recruited strictly from the Hospital for Sick Children (SickKids)
      and grouped by age, with age-specific protocol variants for 2-4, 4-6, 6-10 and 10+ years.
  - name: Sample of an ongoing larger collection, not representative
    description: >-
      The healthsheet states that the release is a sample of a larger, ongoing collection and that
      the data are not representative because they were collected at a limited number of geographic
      locations. The project hopes to make it more representative by shifting to remote collection
      and designing recruitment to control for more variables.
  - name: Recruitment channels
    description: >-
      Recruitment occurred through clinic appointments, flyers in well-trafficked areas including
      QR codes linking to a secure REDCap screening survey, approach of individuals in waiting rooms
      where facility approval was granted, social media (LinkedIn, X, Facebook, Instagram, YouTube,
      b2ai-voice.org and bridge2ai.org), and the FlowTrials platform. Where specific diagnoses or
      severities were under-represented, participants were identified by medical record review based
      on voice-disorder related diagnostic codes.

collection_consents:
  - name: Prospective informed consent for collection and use
    description: >-
      All participants have been duly informed and agreed to the collection and the use of their
      data via prospective informed consent. Participants provided written informed consent for all
      study procedures and were explicitly informed about the data being collected, the methods used
      to secure it, and the information that would be used for the study.
  - name: Consent to tiered data sharing
    description: >-
      The consent states that research data not containing direct identifiers will be shared with
      external researchers for future research through a secure database; that data posing a low
      risk of individual re-identification will be shared in registered access with the general
      public; and that data posing a heightened risk of re-identification if shared in full open
      access will be shared through a controlled access mechanism with authorized researchers.
  - name: Absence of downstream use restrictions in the consent
    description: >-
      The consent does not restrict use of the data to non-commercial purposes, to a specific
      geographic location, to a specific type of research, to genetic research, or to research that
      does not involve the development of methods or algorithms.
  - name: Parental permission and child assent
    description: >-
      Where children participate, parents or guardians provide consent and children provide verbal
      assent where appropriate. Parental permission is obtained from one or both parents; because
      the research is minimal risk, permission from both parents or legal guardians is not required.
      Children who cannot reasonably be asked to assent because of age and development, typically
      those under seven years of age, are not asked to do so. Assent is documented.

collection_notifications:
  - name: IRB-approved consent process as notification
    description: >-
      Individuals were notified about the data collection: participants went through an IRB-approved
      consent process. Participants were informed during the consent process that the application
      was created by the Bridge2AI-Voice consortium and were told its purpose.
  - name: Disclosure of data handling at enrollment
    description: >-
      Participants were explicitly informed about the data that was being collected, the methods
      used to secure these data, and the information that would be used for the study, and that
      participation was voluntary and did not affect their medical care in any way.
  - name: Notification of longitudinal follow-up
    description: >-
      During consent it was explained that participants might be asked to provide longitudinal data
      for some diseases, in which case they would be counselled on downloading the application to
      their personal phone or tablet, and an electronic consent through the application would be
      administered before each subsequent data collection to ensure ongoing consent.

consent_revocations:
  - name: Withdrawal at any time with an irreversibility threshold
    description: >-
      Consenting participants are informed that they may withdraw from the study at any point. If a
      participant chooses to withdraw during or before the voice data collection, their data will
      not be included in the database. Participants are informed that research data, including voice
      recordings, cannot be removed from the database once the voice data collection process is
      completed. For longitudinal collection, data already completed will be used in the database
      because the purpose of the project is to provide a platform and open-source database rather
      than to analyse the data; the minimum requirement for study completion is one data collection
      time point.
  - name: Optional exit survey on withdrawal
    description: >-
      Participants who withdraw have the option to complete a satisfaction survey to help understand
      their reasons for withdrawal. The survey may also be provided to patients who decline
      participation or who express initial hesitation. Completion is entirely optional and no
      protected health information is collected.

informed_consent:
  - name: Consent documentation modalities
    description: >-
      Consent may be given by signing a physical paper copy, by indicating electronic consent within
      the application or through REDCap survey forms, or by video recording within the application.
      Electronic consent is housed in REDCap and is HIPAA compliant, and contains the same text as
      paper consent. Where paper consent is used, documents are uploaded and saved electronically in
      REDCap. Some remote consents omit the final "Statement of Person Obtaining Informed Consent"
      section but are otherwise identical.
  - name: Video consent for identity verification
    description: >-
      For video consent the standard consent document is displayed in the application and
      participants are instructed to start recording, read a statement aloud, and send it. The audio
      recording from the consent is used to verify that the acoustic data submitted by the
      participant belongs to the consented individual. Video consent is intended to provide an
      additional level of security by helping to verify identity and to distinguish participants
      from bots.
  - name: Consent conduct, timing and re-consent
    description: >-
      In most cases consent takes place in the clinic and is conducted by research assistants, with
      about 30 minutes spent explaining the study and consent in detail with time for questions;
      potential participants are asked to explain what they have understood to confirm comprehension.
      Where a delay occurs between consent and data collection, participants are notified of any
      changes to the study and re-consented before data collection.
  - name: Consent record retention
    description: >-
      All paper and electronic versions of consent are stored for a minimum of five years after
      completion of the study, following required USF procedure. Original paper consent documents
      cannot be destroyed until five years after study completion even if uploaded to the Florence
      platform.

ethical_reviews:
  - name: USF Single IRB approval of the data acquisition protocol
    description: >-
      The clinical study was submitted to and approved by the University of South Florida Single IRB
      and by subsite IRBs through the Single IRB process. Data collection and sharing were approved
      by the University of South Florida Institutional Review Board. All US-based participating
      institutions abide by the Single IRB process.
  - name: Canadian research ethics board approvals
    description: >-
      Canadian institutions (Mount Sinai Hospital, the Hospital for Sick Children, and the
      University of Toronto) do not follow the Single IRB process and applied for separate research
      ethics board approvals to comply with Canadian regulations, with copies submitted to the USF
      IRB.
  - name: Hospital for Sick Children REB for the pediatric cohort
    description: >-
      Pediatric data collection and sharing were approved by the Research Ethics Board at the
      Hospital for Sick Children.
  - name: Separate approval for genomic data
    description: >-
      Genomic data are collected, managed and analysed only at the University of Toronto and Mount
      Sinai Hospital under a separate research ethics board protocol; no biological specimens are
      collected at USF for this protocol.
  - name: Feasibility study IRB approval
    description: >-
      The separate application feasibility study was approved by the Institutional Review Board of
      the University of South Florida under IRB number 004890, and participants provided written
      informed consent.
  - name: Oversight scope and data monitoring
    description: >-
      The study is not a clinical study for a drug product and not a clinical study for a medical
      device. No data monitoring committee was appointed for this study. A partial HIPAA waiver was
      requested for recruitment purposes to permit review of EHR information for incoming clinic
      patients ahead of their appointments, limited to the study's inclusion criteria.

human_subject_research:
  name: Observational human subjects research with IRB oversight
  description: >-
    The dataset arises from human subjects research. The study is registered under organization
    study ID OT2OD032720 as an observational, cohort, cross-sectional study with an anticipated
    enrollment of 10,000 by 2027. Biospecimens are described as respiratory, voice and speech
    samples. Eligibility is open to all sexes, is not gender based, spans a minimum age of 18 years
    (stated to change with introduction of the pediatric cohort) to a maximum of 120 years, and
    accepts healthy volunteers. The studies involving humans were approved by the University of
    South Florida Institutional Review Board and conducted in accordance with local legislation and
    institutional requirements, with written informed consent from participants. The study is not a
    drug or device study and no data monitoring committee was appointed. The Data Transfer and Use
    Agreement records that the data are covered under a Certificate of Confidentiality, which must
    be asserted against compulsory legal demands such as court orders and subpoenas for identifying
    information or characteristics of a research participant. The IRB protocol states there are no
    direct significant risks from the research; the principal risk is inadvertent release of
    personal information, with an additional risk that questions asked of certain cohorts (mood
    disorders, depression, anxiety) may cause discomfort or trigger negative emotions.

at_risk_populations:
  name: Protections for children and other vulnerable participants
  description: >-
    Children are enrolled as a distinct cohort aged 2 to 18 and are recruited only through pediatric
    sites; no pediatric data collection is performed at USF. Parents or guardians provide consent and
    children provide verbal assent where appropriate; because the research is minimal risk,
    permission from one parent or legal guardian suffices. Children who cannot reasonably be asked
    to assent because of age and development, typically those under seven years of age, are not
    asked to do so, and assent is documented. IRB checklist HRP-416 for children under 21 was
    completed and appended to the protocol. Compensation is provided to the adult population only.
    Adults with cognitive impairment, Alzheimer's disease and other dementias are enrolled in the
    neurological cohort, with an age window of 44 to 85 and a requirement for a clinical diagnosis
    and English proficiency. The protocol states that students, employees and wards of the state are
    neither specifically included nor specifically excluded, and describes a Plan for Enhancing
    Diverse Perspectives intended to enroll participants from socially and economically disadvantaged
    and underserved populations. Consent is described as fully voluntary, taking place during a
    typical patient care appointment, with no undue influence or coercion and no effect on standard
    of care.

participant_compensation:
  - name: Electronic gift cards for adult participants
    description: >-
      Participants were compensated for their time through electronic gift cards. Participants
      receive 40 US dollars for a data collection session that takes less than 90 minutes and 80 US
      dollars for a session that takes over 90 minutes, for no more than a total of three sessions
      and a maximum compensation of 120 US dollars. Compensation is provided to the adult population
      only. Earlier protocol versions record that compensation for participating adults was
      introduced by amendment in August 2023 and the amount was changed in July 2024 and again in
      September 2024.
  - name: No compensation in the application feasibility study
    description: >-
      Participants in the separate application feasibility study did not receive financial incentives
      for completion of the study.

participant_privacy:
  - name: Two-tier dissemination to protect voice privacy
    description: >-
      Raw audio data is disseminated through controlled access only, to protect participants'
      privacy, while derived features considered low risk are made available under registered or
      credentialed access. The governance rationale is set out in a downloadable memorandum,
      "Ethical Justification for Controlled Access to Raw Voice Data Samples".
  - name: Institutional separation of identifiers
    description: >-
      Each institution keeps its identified data within the institution. Identifiable protected
      health information is kept in REDCap databases with password-protected access restricted to
      investigators at the institution where the data were collected. Only de-identified data and
      voice samples are shared through the joint meta-database. Participant numbers and institution
      numbers were created to allow institutions to track and retain ownership of their institutional
      data.
  - name: HIPAA-compliant transmission and storage
    description: >-
      All collection applications transmit data over a secure HTTPS protocol to storage held with an
      NIH STRIDES partner (Amazon, Google or Microsoft), each of which has pre-negotiated agreements
      with the NIH for data privacy and HIPAA protection. The web and iOS applications require no
      login and retain data only during the collection phase, removing it as soon as the page is
      closed. All REDCap entries used for recruitment screening are deleted once patients are
      enrolled or within 90 days of submission, whichever comes first.
  - name: Federated learning to avoid data movement
    description: >-
      The project implements federated learning so that models can be trained across
      multi-institutional data without the data leaving each institution; algorithms are run on data
      at each institution and only model updates are shared to a central node.
  - name: Personnel training and access control
    description: >-
      All investigators and project-related personnel with data access must complete the appropriate
      certification through their local institution, including HIPAA and privacy training. All users
      have individual usernames and passwords for REDCap and the HIPAA-secure cloud server.

data_protection_impacts:
  - name: Ethical justification for controlled access to raw voice samples
    description: >-
      A documented assessment concluded that raw voice data has the potential to cause individual
      re-identification or to be used for illicit or unauthorized purposes, and that it must
      therefore be withheld from open and registered access and disseminated only through a
      controlled access mechanism. The reasoning behind this governance structure is published as a
      downloadable memorandum on the project documentation site.
  - name: Ethicist review of data element sensitivity
    description: >-
      A team of ethicists reviewed the data elements and identified for removal: direct identifiers;
      indirect identifiers that created a significant risk of re-identification through combination
      with public data on social media, in government registries or elsewhere, including select
      geographic or demographic identifiers and information about household composition or cultural
      identity; and non-identifying elements revealing highly sensitive information such as household
      income, mental health status and traumatic life experiences.
  - name: Review of transcripts for identifying content
    description: >-
      For the version 3.0.0 release, raw audio transcripts were reviewed and any audio recordings
      containing potentially identifying information or external voices were removed from the
      release. For the pediatric version 1.1.0 release, all free speech tasks were manually checked
      for the presence of unconsented speakers and personally identifiable information before their
      features were released.

is_deidentified:
  name: De-identified to HIPAA and Common Rule standards, without k-anonymization
  description: >-
    The stated level of de-identification is that identifiable information under HIPAA and the Common
    Rule, as well as data considered sensitive, have been removed from the dataset. The dataset
    removes direct identifiers (yes), applies the HIPAA de-identification rules (yes), rebases and/or
    replaces dates by integers (yes), removes or generalizes geographic information (yes), and
    removes narrative text fields (yes). It does not achieve K-anonymization with k greater than or
    equal to 2 (no).
    Direct identifiers removed include name, civic address and social security numbers. Indirect
    identifiers were removed where they created a significant risk of participant re-identification,
    including select geographic or demographic identifiers and some information about household
    composition or cultural identity. Non-identifying elements revealing highly sensitive information
    such as household income, mental health status and traumatic life experiences were also removed.
    HIPAA Safe Harbor identifiers were removed; state and province were removed while country of data
    collection was retained. Free-speech transcripts were removed.
    All raw voice data was removed from the public release; the data were extracted from the raw
    audio to limit re-identification and only extracted features are released. Spectrograms, Mel
    spectrograms, MFCCs, phonetic posteriorgrams, EMAs and transcriptions from open-response prompts
    were removed from the feature-only dataset, and spectrograms and similar features were excluded
    where the audio contained free speech; static features that do not encode the sensitive
    information were retained. All fields encoded as sensitive under the "Identifier?" column of the
    REDCap data dictionary were removed. Features for sensitive records and audio checks were removed
    from version 3.0 onward.
    Residual risk is acknowledged: the IRB protocol notes that a voice can never be fully
    de-identified, because each person's voice is unique to them and their health at that time, and
    it is always possible, if unlikely, that someone could recognise a participant's voice.

sensitive_elements:
  - name: Racial and ethnic origin
    description: >-
      The dataset includes race information, identified in the healthsheet as data revealing racial
      or ethnic origins.
  - name: Sexual orientation
    description: >-
      The dataset includes sexual orientation information, identified in the healthsheet as sensitive.
  - name: Socioeconomic and health data
    description: >-
      The dataset includes socioeconomic and health information. Demographic collection was designed
      to include factors that could affect voice and speech, such as weight, socio-economic status
      and literacy status.
  - name: Clinical diagnoses across psychiatric and neurological conditions
    description: >-
      Diagnostic tables cover conditions including depression, anxiety, bipolar disorder, PTSD, ADHD,
      cognitive impairment, Alzheimer's disease, Parkinson's disease and amyotrophic lateral
      sclerosis, together with validated instruments such as PHQ-9, GAD-7, DSM-5 Adult, PTSD Adult
      and psychiatric history.
  - name: Raw voice audio as a biometric identifier
    description: >-
      Raw audio is treated as a biometric identifier with re-identification potential and is excluded
      from the registered and credentialed releases, being disseminated only under controlled access.
  - name: Highly sensitive fields excluded from release
    description: >-
      Household income, mental health status, traumatic life experiences and comparable highly
      sensitive non-identifying elements were removed prior to release, as were household composition
      and cultural identity information.

confidential_elements:
  - name: Raw voice, speech and respiratory recordings
    description: >-
      The raw waveforms are withheld from the published PhysioNet releases and are disseminated only
      under a controlled access mechanism, because raw voice data has the potential to cause
      individual re-identification or to be used for illicit or unauthorized purposes. Access
      requires a Data Access Request Form, a Data Use Agreement, review by the Data Access Compliance
      Office, and a Data Use and Transfer Agreement signed by an authorized institutional official;
      the data are then made available via Synapse.
  - name: Fields flagged as identifiers in the REDCap data dictionary
    description: >-
      All data elements encoded as sensitive under the "Identifier?" column of the REDCap data
      dictionary were removed from the release and are retained only within the collecting
      institutions. The healthsheet separately records that the released dataset does not contain
      data considered confidential in the sense of legal privilege or doctor-patient confidentiality.

content_warnings:
  - name: Unfiltered participant language in free speech transcripts
    description: >-
      The dataset includes the transcription of free speech tasks. The healthsheet notes that while
      the inclusion of offensive, insulting or threatening material is unlikely, it cannot be
      completely avoided, as research participants are responsible for their choice of language.
      Transcriptions and dense features derived from open-response prompts have been removed from
      subsequent feature-only releases.
  - name: Psychiatric and trauma-related questionnaire content
    description: >-
      The phenotypic data include instruments covering depression, anxiety, PTSD, ADHD and DSM-5
      adult screening. The IRB protocol records that answering some of these questions can lead to
      possible discomfort and could trigger negative emotions.

ip_restrictions:
  name: Copyright, database rights and anti-blocking terms
  description: >-
    Users acknowledge that the data may be protected by copyright and other rights, including other
    intellectual property rights. Duplication as reasonably required to carry out the user's research
    project is permitted, but sale of all or part of the data on any media is not. Nothing in the
    agreement transfers to the user any intellectual property rights in or relating to the data.
    Users agree not to make intellectual property claims on the data and not to use intellectual
    property protection in ways that would prevent or block access to, or use of, any element of the
    data or conclusions drawn directly from it; this restriction exists so that future use of the
    dataset remains unrestricted in alignment with Open Science principles. Users may elect to perform
    further research adding intellectual and resource capital and may obtain intellectual property
    rights on downstream discoveries, but agree to implement licensing policies that will not obstruct
    further research and to respect the Fort Lauderdale Agreement. The provider gives no guarantee
    that the data is free of third-party intellectual property rights, database rights or other
    related rights, and the healthsheet records that no IP-based restrictions have been imposed by
    third parties. There are no fees associated with these restrictions.

license_and_use_terms:
  name: Tiered access under the Bridge2AI Voice Registered Access agreements
  description: >-
    The feature-only and raw audio datasets are available under distinct agreements appropriate to the
    sensitivity of their content. For the feature-only data on PhysioNet, access is granted to
    credentialed users who sign the data use agreement; the license is the Bridge2AI Voice Registered
    Access License and the agreement is the Bridge2AI Voice Registered Access Agreement, with no
    training required. The documented registered-access route requires registering on PhysioNet,
    confirming identity under the Registered Access License, and signing the Bridge2AI-Voice
    Registered Access Agreement setting out the terms and conditions for data use. Version 1.1 was
    published under restricted access to registered users; versions 3.0.0, 3.1.0 and the pediatric
    releases require credentialed access.
    For the raw audio, controlled access requires completing a Data Access Request Form, completing a
    Data Use Agreement, submitting the application to the Data Access Compliance Office for review,
    and, on approval, ensuring a Data Use and Transfer Agreement is signed by an authorized official
    at the recipient institution. The DTUA restricts use to the named Research Project and Authorized
    Persons, prohibits onward disclosure, requires appropriate administrative, technical and physical
    safeguards, requires breach notification within five business days, and requires destruction or
    return of the data at the end of the agreement term with written certification within 30 days.
    Data are provided "AS IS" with no express or implied warranties. Supporting code and metadata carry
    their own licenses: the REDCap data dictionary and the documentation site are MIT licensed and the
    b2aiprep preprocessing library is Apache-2.0.

regulatory_restrictions:
  name: No export controls; Certificate of Confidentiality, HIPAA de-identification and jurisdictional terms
  description: >-
    The healthsheet states that no export controls or other regulatory restrictions apply to the
    dataset or to individual instances. The Data Transfer and Use Agreement characterizes the raw
    data as "Personally Identifiable Information, as that is defined in OMB Memorandum M-07-16, and
    not covered under HIPAA, FERPA, or similar laws or regulations governing personal information
    that require the addition of special terms"; the Federal Privacy Act checkbox is not marked, and
    the agreement records that the data are covered under a Certificate of Confidentiality which
    must be asserted against compulsory legal demands such as court orders and subpoenas for
    identifying information or characteristics of a research participant. Separately, HIPAA is
    engaged at the collection and de-identification stages: the collection applications and storage
    are described as HIPAA compliant, the HIPAA Safe Harbor de-identification rules were applied to
    the release, and a partial HIPAA waiver was obtained for recruitment screening.
    Recipients must comply with all applicable laws, rules and regulations and with professional
    standards, and must provide documentation of an IRB-approved protocol on request. The agreement
    includes a warranty under Florida statute section 787.06 that the recipient does not use coercion
    for labor or services, and provides that the provider may unilaterally amend the agreement should
    the federal sponsor require revision. Data were collected in the USA and Canada. The project
    documentation site carries a notice that the repository is under review for potential modification
    in compliance with Administration directives.

retention_limit:
  name: Indefinite research retention with time-limited recipient and institutional holdings
  description: >-
    Once data is contributed, the data will be retained as long as it is useful for research purposes,
    possibly indefinitely. Within the collecting institutions, identifiable data and the datasheets
    linking participant numbers to participant information are kept on local cloud storage for a
    maximum of ten years after study completion and are then destroyed, under the responsibility of
    each local principal investigator. Study-related material and consent documentation are retained
    for a minimum of five years after study completion under USF procedure. For recipients of the raw
    audio, the Data Transfer and Use Agreement terminates two years after the start date, on completion
    of the project, on expiration of the applicable ethics approval, or on termination by the provider,
    whichever occurs first; data must then be destroyed in accordance with the provider's instructions,
    with written certification of destruction submitted within 30 days, save for one archival copy
    retained where necessary for records retention, research integrity and verification.

updates:
  name: Semi-annual versioned releases with growing enrollment
  description: >-
    Further versions of the dataset will be released on a semi-annual (twice a year) basis, distributed
    as new versions on the hosting platform, with users notified through news items on the platform and
    through standard communication channels. The realised release cadence is version 1.0 (Health Data
    Nexus, end of November 2024), 1.1 (17 January 2025), 2.0.0 (16 April 2025), 2.0.1 (18 August 2025),
    3.0.0 (16 December 2025) and 3.1.0 (1 May 2026), with the pediatric dataset released as 1.0.0 (17
    December 2025) and 1.1.0 (1 May 2026). Version 1.0 contained 306 participants; version 2.0 added
    136 new participants; version 3.0.0 added a further 391 participants to reach 833, which version
    3.1.0 retains with no new participants. Planned enhancements described in the documentation
    include additional disease-category data, inclusion of a pediatric cohort, Spanish-language
    protocols and data collection, remote at-home collection, and release of external multimodal data
    (imaging, genomics, respiratory function tests) which was explicitly not included in the version
    3.0.0 release.

version_access:
  name: Persistent per-version DOIs with discretionary retirement of old versions
  description: >-
    By default, older versions of the dataset continue to be supported, hosted and made available to
    researchers, and each version of the dataset has a unique DOI; the dataset publishers reserve the
    right to remove access to older versions. PhysioNet lists versions 1.1, 2.0.0, 2.0.1, 3.0.0 and
    3.1.0, and records that the files for version 1.1 are no longer available, directing users to the
    latest version. Version DOIs include 10.13026/249v-w155 (1.1), 10.13026/k81f-qr68 (3.0.0) and
    10.13026/8xbn-nq66 (3.1.0), with 10.13026/37yb-1t42 resolving to the latest version. Version 1.0
    remains published on Health Data Nexus under DOI 10.57764/qb6h-em84, a platform that provides cloud
    compute alongside the dataset rather than allowing data downloads. A changelog for each dataset
    version is published online with the dataset metadata.

errata:
  - name: Authorship list corrections in version 2.0.1
    description: >-
      Version 2.0.1, published 18 August 2025, consisted of corrections in the authorship list.
  - name: Spectrogram reprocessing in version 2.0
    description: >-
      Spectrograms were reprocessed in version 2.0 to fix minor issues identified in the previous
      release. All spectrograms and Mel-frequency cepstral coefficients derived from free-speech
      related files were also removed at that release.
  - name: Broken parquet files repaired in version 3.1.0
    description: >-
      Version 3.1.0 fixed broken parquet files from the previous release, added files related to audio
      quality metrics and per-recording metadata, updated validated diagnosis information across
      conditions with back-filled information, rearranged some phenotypic files, and renamed certain
      gold-standard variables.
  - name: No formal erratum document
    description: >-
      The healthsheet records that there is no erratum document; corrections are communicated through a
      changelog published online with the dataset metadata for each version.

extension_mechanism:
  name: Derivative dataset publication and open-source contribution
  description: >-
    For dataset extensions and augmentations, others may publish a derivative dataset on the hosting
    platform which references the original source; such derivative datasets may be made available under
    the same conditions as the source data. For augmentations to the code used to produce the data, the
    open-source repositories have discussion forums and issue pages allowing public discussion of data
    preprocessing, and a pull request mechanism for contributing improvements to the data preprocessing
    code.

third_party_sharing:
  - name: Broad distribution outside the creating entity
    description: >-
      The dataset is distributed broadly to individuals outside of the entity on behalf of which it was
      created. Distribution is through a data publishing platform providing publicly accessible metadata
      and a DOI for persistent resolution, with the dataset itself requiring registered or credentialed
      access. The healthsheet names healthdatanexus.ai as the publishing platform; the current releases
      are distributed through PhysioNet, with raw audio distributed via Synapse.
  - name: Controlled onward sharing of raw audio
    description: >-
      Raw audio is shared with third parties only after Data Access Compliance Office review and
      execution of a Data Use and Transfer Agreement by an authorized institutional official.
      Collaborators at other research organizations, and other research teams at the same organization,
      must apply independently for access and sign their own DTUA before accessing the data. Recipients
      must retain control over the data and may not disclose, release, sell, rent, lease, loan or
      otherwise grant access to any third party except Authorized Persons without prior written consent,
      and must bind Authorized Persons to equivalent confidentiality and security standards.
  - name: Inter-institutional sharing during data generation
    description: >-
      During collection, de-identified clinical and voice data are shared between participating
      institutions on a cloud-based infrastructure hosted through an NIH STRIDES partner, under data
      transfer and data use agreements drafted with the patents and innovations office. Federated
      learning is used so that models can be trained across institutions without the underlying data
      leaving each institution.

distribution_formats:
  - name: Apache Parquet
    description: >-
      Dense derived audio features are distributed as Parquet, an open-source column-oriented data file
      format. Version 3.1.0 provides nine parquet files: ppgs, sparc_ema, sparc_loudness,
      sparc_periodicity, sparc_pitch, torchaudio_spectrogram, torchaudio_mfcc, torchaudio_pitch and
      torchaudio_mel_spectrogram. Each row carries participant_id, session_id, task_name, n_frames and
      the feature tensor.
  - name: Tab-separated values with JSON data dictionaries
    description: >-
      Phenotypic tables, static features and audio quality metrics are distributed as TSV files, each
      paired with a JSON data dictionary sharing the same file stem. Dictionary keys match the column
      names of the associated data file and provide a description, the question asked of the participant
      where applicable, and the data type of the response.
  - name: BIDS-organized WAV audio with JSON sidecars
    description: >-
      The audio dataset is organised to the Brain Imaging Data Structure v1.9.0, with
      sub-<participant_id>/ses-<session_id>/audio/ directories containing
      sub<participant_id>_ses<participant_id>_task-<task_name>.wav files and matching JSON sidecars,
      alongside CHANGES.md, README.md, dataset_description.json and the phenotype directory. This form is
      available under controlled access only.
  - name: Cloud-compute-only distribution of version 1.0
    description: >-
      The earliest feature-only release was made available on Health Data Nexus, which provides cloud
      compute alongside the dataset rather than allowing data downloads.

distribution_dates:
  - name: Version 1.0 release
    description: >-
      Published on Health Data Nexus at the end of November 2024, under DOI 10.57764/qb6h-em84, with
      12,523 recordings for 306 participants.
  - name: Version 1.1 release
    description: >-
      Published on PhysioNet on 17 January 2025 under DOI 10.13026/249v-w155, adding Mel-frequency
      cepstral coefficients. Files for this version are no longer available.
  - name: Version 2.0.0 release
    description: Published on PhysioNet on 16 April 2025, adding data for 136 new participants.
  - name: Version 2.0.1 release
    description: Published on PhysioNet on 18 August 2025, correcting the authorship list.
  - name: Version 3.0.0 release
    description: >-
      Published on PhysioNet on 16 December 2025 under DOI 10.13026/k81f-qr68, adding data for a further
      391 participants to reach 833, separating the phenotype file into individual files, and adding
      SPARC and phonetic posteriorgram features.
  - name: Version 3.1.0 release
    description: >-
      Published on PhysioNet on 1 May 2026 under DOI 10.13026/8xbn-nq66. A minor update over 3.0.0 with
      no new participants but additional data for some participants, repaired parquet files, new
      audio-quality and per-audio metadata files, and back-filled validated diagnosis information.

related_datasets:
  - relationship_type: related_to
    target_dataset: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
    description: >-
      The Bridge2AI-Voice Pediatric Dataset is a separate PhysioNet project rather than a version of
      the adult dataset; the two releases are distinct cohorts collected under a separate pediatric
      protocol and a separate research ethics board approval at the Hospital for Sick Children. Each
      release cross-links the other from its PhysioNet notice. Pediatric version 1.1.0 was published
      on 1 May 2026 under DOI 10.13026/h995-bt35 (latest-version DOI 10.13026/mf9s-5r03) and contains
      23,533 derived recordings from 300 participants aged 2 to 18. It shares the same funding award,
      documentation site, processing toolchain and access agreements as the adult dataset.
  - relationship_type: is_version_of
    target_dataset: https://doi.org/10.57764/qb6h-em84
    description: >-
      Bridge2AI-Voice version 1.0, the first release of the feature-only dataset, published on Health
      Data Nexus at the end of November 2024 with 12,523 recordings for 306 participants. It is the
      predecessor of the PhysioNet series and is hosted on a platform that provides cloud compute
      alongside the dataset rather than permitting downloads.
  - relationship_type: has_part
    target_dataset: https://www.synapse.org/Synapse:syn72370534/
    description: >-
      The controlled-access raw audio distribution for the adult cohort. The PhysioNet release contains
      only features derived from these waveforms; the waveforms themselves are the source material and
      are made available separately via Synapse after Data Access Compliance Office approval.

instances:
  - name: Participant
    description: >-
      The healthsheet states that each instance represents a person. Versions 3.0.0 and 3.1.0 contain
      833 adult participants; version 1.0 contained 306. Each individual answered a common set of
      questions and then responded to additional questions relevant to their primary diagnostic
      category. Each modality per participant comprises audio recordings and questionnaire responses.
  - name: Session
    description: >-
      For most participants a single session was sufficient to collect all relevant data, but a subset
      required multiple sessions, so there may be more than one session per participant. Sessions are
      identified by session_id and phenotype tables may therefore contain more than one row per
      participant, with no requirement that the participant give the same response at each visit.
  - name: Recording
    description: >-
      Each acoustic task performance yields a recording, identified by participant_id, session_id and
      task_name, from which the derived features are computed. Feature-file record counts in version
      3.1.0 range from 28,640 (sparc_ema) to 32,522 (torchaudio_pitch), with 29,278 spectrograms, Mel
      spectrograms and MFCCs and 29,289 phonetic posteriorgrams. The project documentation separately
      describes version 3.0 as containing approximately 61,937 voice-derived recordings from the 833
      adult participants.

subpopulations:
  - name: Voice disorders cohort
    description: >-
      Participants with laryngeal cancer, laryngitis, pre-cancerous lesions (keratosis, leukoplakia),
      benign lesions of the vocal cord (nodule, polyp, cyst, Reinke's edema, ulcers, recurrent
      respiratory papilloma, fibrous mass, rheumatoid nodules), muscle tension dysphonia, spasmodic
      dysphonia and laryngeal tremor, unilateral vocal fold paralysis, and glottic
      insufficiency/presbyphonia. Validated by laryngoscopy images and stroboscopy videos, with CT and
      spirometry for some diagnoses.
  - name: Respiratory disorders cohort
    description: >-
      Participants with airway stenosis (bilateral vocal fold paralysis, supraglottic, glottic,
      posterior glottic, subglottic, tracheal and multi-level upper airway stenosis) and unexplained
      chronic cough of more than eight weeks. Validated by spirometry, flow volume loops and CT of the
      neck and chest.
  - name: Neurological and neurodegenerative disorders cohort
    description: >-
      Participants aged 44 to 85 with a clinical diagnosis of mild cognitive impairment, Alzheimer's
      disease, other dementias (frontotemporal, Lewy body, vascular, mixed, alcohol-induced),
      amyotrophic lateral sclerosis, or Parkinson's disease and atypical parkinsonism. Validated by
      brain CT, brain MRI, whole genome sequencing and, for Alzheimer's disease, serum p-tau
      biomarkers.
  - name: Mood and psychiatric disorders cohort
    description: >-
      Participants with anxiety disorder, bipolar disorder, depression or major depressive disorder,
      and co-morbid conditions including alcohol or substance use disorder, ADHD, autism spectrum
      disorder, borderline personality disorder, eating disorder, insomnia/sleep disorder, OCD, panic
      disorder, PTSD, schizophrenia, social anxiety disorder and other psychiatric disorders. Validated
      by electronic health summary, clinical diagnosis from a psychiatrist, and medication history.
  - name: Pediatric voice and speech disorders cohort
    description: >-
      Children recruited strictly from the Hospital for Sick Children and grouped by age, with protocol
      variants for ages 2-4, 4-6, 6-10 and 10 and over. Released as a separate PhysioNet project with
      300 participants aged 2 to 18.
  - name: Control participants
    description: >-
      Participants not diagnosed or treated for a voice, respiratory, pediatric, mood or neurological
      disorder affecting voice, cough, breath or speech, enrolled to serve as controls. Healthy
      volunteers are accepted under the study eligibility criteria and a control diagnosis table is
      present in the phenotype directory.
  - name: Demographic subgroups
    description: >-
      The dataset identifies demographic sub-populations by age, gender, sex, ethnicity and
      socioeconomic status. The documentation cautions that the public data releases do not contain an
      equal distribution of the disease categories and that the dataset skews by disorder category,
      site and other demographic factors.

relationships:
  - name: Participants are mutually unrelated
    description: >-
      The healthsheet states that relationships between individual instances are not made explicit and
      that instances are unrelated: participants are not members of a shared trial arm, household or
      network.
  - name: Hierarchical linkage of participant, session, task and recording
    description: >-
      Within the data, every feature record and every phenotype row is keyed by participant_id, and
      recordings and sessions are further keyed by session_id and task_name, so that multiple recordings
      belong to a session and multiple sessions may belong to a participant. The task directory
      provides session, acoustic_task and recording tables that make this structure explicit.

anomalies:
  - name: Heterogeneous collection configurations across sites
    description: >-
      Different sites have different collection configurations. Distinct iPad devices were used at each
      site, and participants were screened for different disorders based on site, so different disorders
      were collected with different devices.
  - name: Protocol change over the course of the study
    description: >-
      The collection protocol changed over the course of the study. The application underwent continuous
      alpha- and beta-testing, and tasks could be altered, added or removed based on patient feedback,
      auditing and validation experiments.
  - name: Missing responses from optional items and collection irregularities
    description: >-
      Some questions are optional, and there may be data collection irregularities that caused some
      information to be missing from individual instances.
  - name: Unaudited automated transcription
    description: >-
      Certain aspects of the data, for example transcription, were generated using off-the-shelf models
      that have not been audited for correctness. Transcriptions were produced with OpenAI's Whisper
      Large model.
  - name: Features absent for some recordings
    description: >-
      Some files, whether due to length or other issues, could not generate certain features and are not
      included in the bundled data, which is why record counts differ between feature files (for example
      28,640 sparc_ema records against 32,522 torchaudio_pitch records in version 3.1.0).
  - name: Corrupt parquet files in version 3.0.0
    description: >-
      Version 3.1.0 records that it fixed broken parquet files present in the previous release.
  - name: Recording-condition variability
    description: >-
      Data were recorded with a head-mounted headset with a microphone that could be at slightly
      different distances; for some pediatric participants the built-in tablet microphone was used
      instead. Noise artifacts are identified as a confounding factor.
  - name: Variability in diagnostic practice and self-report accuracy
    description: >-
      Identified confounding factors include variations in diagnostic practices, inaccurate questionnaire
      responses, and underreporting. Changes in diagnostic criteria or practices could be a source of
      distribution shift over time.
  - name: Data quality criterion not met in the AI-readiness assessment
    description: >-
      In the project's self-assessment against the Bridge2AI AI-readiness criteria, the Data Quality
      criterion (2.e) was scored 0, giving the Characterization category a score of 80 percent.

known_biases:
  - name: Geographic and site selection bias
    description: >-
      The sample is not representative of a larger set because it was collected at a limited number of
      geographic locations, across five recording sites, recruiting from high-volume expert clinics
      rather than from the general population.
  - name: Device and site confounding with diagnosis
    description: >-
      Participants were screened for different disorders based on site and so had their data collected
      with different devices, meaning that device and site characteristics are correlated with
      diagnostic label.
  - name: Recruitment bias against low-trust and distant populations
    description: >-
      Groups that have less trust in the medical system or in AI, or that are less proximal to the
      collection sites, would have been less likely to be recruited.
  - name: Language bias
    description: >-
      Eligibility required the ability to read and speak English, and the only language option in the
      released protocol is English, so non-English speakers are systematically excluded. Spanish versions
      of the protocol are under development.
  - name: Disease-category imbalance
    description: >-
      The public data releases do not contain an equal distribution of the five disease categories, and
      the dataset has skews based on disorder category.
  - name: Demographic skew
    description: >-
      The dataset has skews based on demographic factors in addition to disorder category and site; users
      are directed to consider the multivariate distribution when assessing utility.
  - name: Temporal distribution shift
    description: >-
      Changes in diagnostic criteria or practices over the collection period could be a source of
      distribution shift.
  - name: Single-labeler diagnostic labeling
    description: >-
      Exactly one labeler provides a label per instance, typically the clinician at the site of data
      collection or a clinician external to it for a prior diagnostic assessment, so labels carry
      unmeasured individual clinician variation, and human-level performance in the target applications
      is reported to vary widely.

known_limitations:
  - name: Sample not representative of any defined population
    description: >-
      The release is a sample of a larger ongoing collection and is explicitly stated not to be
      representative, because of the limited number of geographic collection locations.
  - name: No recommended data splits
    description: >-
      The dataset does not provide predefined recommended data splits for training, validation or
      testing; researchers must construct their own splits.
  - name: No k-anonymization
    description: >-
      The dataset does not achieve K-anonymization with k greater than or equal to 2.
  - name: Raw audio excluded from the registered and credentialed releases
    description: >-
      The published PhysioNet releases contain derived features only; obtaining raw audio requires a
      separate, more involved controlled-access process with institutional sign-off.
  - name: Open-response task features withheld
    description: >-
      Spectrograms, Mel spectrograms, MFCCs, transcriptions, EMAs and PPGs derived from free-speech and
      open-response prompts have been removed from the feature-only dataset, restricting analysis of
      those tasks to static features that do not encode the sensitive content.
  - name: English only
    description: >-
      Data collection and participant communication were in English; the Spanish protocol was still under
      development at the time of the documented releases.
  - name: No impact analysis on data subjects
    description: >-
      The healthsheet records that no analysis of the potential impact of the dataset and its use on data
      subjects has been conducted.
  - name: External multimodal data not released
    description: >-
      Imaging, genomic data, laryngoscopy imaging and other EHR data are extracted at sites and uploaded
      to REDCap, but no external data was released in the version 3.0.0 release.
  - name: Collection scale below target
    description: >-
      The current releases contain 833 adult participants against a documented project target of 10,000
      voices (30,000 in the white paper and IRB protocol) and an anticipated enrollment of 10,000 by
      2027, so cohort sizes for individual conditions remain limited.
  - name: Psychiatric labels derived from records rather than study assessment
    description: >-
      For the psychiatric disorders cohort the diagnostic assessment was determined using the
      participant's EHR record or an active prescription, performed outside of data collection, rather
      than by a standardized instrument administered during the study.
  - name: Remaining unmet AI-readiness criteria
    description: >-
      In the project's self-assessment, Data Quality (2.e) scored 0 under Characterization (80 percent);
      Domain-appropriate (5.b) and Associated (5.d) scored 0 under Sustainability (50 percent); and
      Contextualized (6.d) scored 0 under Computability (75 percent).

missing_data_documentation:
  - name: Sources of missingness
    description: >-
      Some questions are optional, and data collection irregularities may have caused information to be
      missing from individual instances. Each individual answered a common set of questions and then
      responded only to additional questions relevant to their primary diagnostic category, so
      cohort-specific instruments are structurally missing for participants outside that cohort.
  - name: Missingness tables shipped with the dataset
    description: >-
      The dataset has been audited internally for missingness and consistency by the data release team,
      and a missingness table is included with the dataset. Generating missingness tables is the first
      step of the documented audit protocol.
  - name: Row-level presence rule in phenotype files
    description: >-
      Phenotype data files only contain rows for a participant if at least one column is not missing, so
      absence of a row indicates that no data for that instrument was captured for that participant.
  - name: Feature-level absence
    description: >-
      Some recordings could not generate certain features, whether due to length or other issues, and are
      not included in the bundled data; consequently record counts differ across feature files and
      absence of a record for a given recording in a given feature file is expected rather than
      erroneous.

cleaning_strategies:
  - name: No value-level cleaning applied
    description: >-
      The healthsheet records that there was no pre-processing for cleaning the data. No outlier removal,
      deduplication or error correction of recorded values is documented, and no imputation was applied.
  - name: Documented audit protocol
    description: >-
      The audit protocol comprises generating missingness tables; checking distributions and outliers;
      checking categorical responses against the schema; and running quality control metrics for audio
      tasks. For waveforms this includes checking the amount of silence and the duration, and for speech
      tasks checking the produced speech relative to the intended passage. Per-recording audio quality
      metrics were published as a TSV file from version 3.1.0.
  - name: Ongoing quality control during collection
    description: >-
      The protocol provides for acoustic engineers and AI data scientists to analyse all samples from the
      first-year exploratory collection phase for acoustic quality and machine-learning readiness, and
      for 10 percent of data to be selected at random each month in subsequent years for quality control
      and ML-readiness checks. The collection application includes volume standardization and noise
      cancellation.
  - name: Reprocessing of defective derived features
    description: >-
      Spectrograms were reprocessed at version 2.0 to fix minor issues identified in the previous
      release, and broken parquet files were repaired at version 3.1.0.

preprocessing_strategies:
  - name: Audio standardization
    description: >-
      Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a Butterworth
      anti-aliasing filter applied. All subsequent feature extraction operates on this standardized audio.
  - name: Spectrogram computation
    description: >-
      Time-frequency representations were computed using the short-time Fast Fourier Transform with a 25
      ms window size, 10 ms hop length and a 400-point FFT, giving dimension 201 by T; spectrograms were
      further downsampled by a factor of two in the time domain after derivation. Version 1.1 used a
      512-point FFT giving dimension 513 by T.
  - name: Mel spectrogram and MFCC computation
    description: >-
      Mel spectrograms of dimension 60 by T were computed with the same 25 ms window, 10 ms hop, 400-point
      FFT and 60 Mel bins, and 60 Mel-frequency cepstral coefficients of dimension 60 by T were extracted
      using the same parameters.
  - name: Pitch extraction
    description: >-
      Detected pitch (fundamental frequency) over time of dimension T was computed with torchaudio using a
      minimum pitch of 80 Hz and a maximum of 500 Hz. A second estimate of fundamental frequency with a
      range of 50-550 Hz was computed by the SPARC package.
  - name: Speech articulatory coding
    description: >-
      The Speech Articulatory Coding (sparc) package was used to generate kinematic traces of vocal tract
      articulators and source features at 50 Hz: estimated electromagnetic articulography of dimension T
      by 12 corresponding to X/Y positions of tongue dorsum, tongue body, tongue tip, lower incisor, upper
      lip and lower lip; estimated loudness from the average absolute amplitude over 20 ms windows; and
      estimated periodicity as the confidence of pitch presence over 20 ms windows.
  - name: Phonetic posteriorgram generation
    description: >-
      Phonetic posteriorgrams giving a time-varying categorical distribution over 40 phoneme categories at
      100 Hz, of dimension 40 by T, were generated with the ppgs package.
  - name: Static acoustic and phonetic feature extraction
    description: >-
      Acoustic features were extracted with openSMILE (eGeMAPS features per audio file), capturing temporal
      dynamics and acoustic characteristics, and phonetic and prosodic features were computed with
      Parselmouth and Praat, providing measures of fundamental frequency, formants and voice quality.
      Speech intelligibility metrics were computed for speech tasks. These are stored one row per recording
      in static_features.tsv.
  - name: Automatic transcription
    description: >-
      Transcriptions were generated using OpenAI's Whisper Large model.
  - name: Feature storage formats
    description: >-
      The waveform-derived features are stored in two formats: a fixed feature format containing static
      features extracted from the entire waveform, and a temporal format whose length varies for each
      audio file depending on the length of the recording.
  - name: Conversion to BIDS and REDCap harmonization
    description: >-
      The raw audio files and questionnaire data retrieved from ReproSchema-UI or exported from REDCap were
      converted to be compliant with the Brain Imaging Data Structure v1.9.0. Pediatric data collected
      through ReproSchema-UI are extracted, transformed into REDCap format and subsequently converted to
      BIDS.
  - name: Processing toolchain
    description: >-
      All processing is performed using b2aiprep, for organizing and preprocessing the dataset, and
      SenseLab, for processing audio files for research tasks. The version 3.0.0 and 3.1.0 releases were
      generated with b2aiprep v3.0.0.

labeling_strategies:
  - name: Clinician gold-standard diagnostic labeling
    description: >-
      Diagnostic labels are the result of a clinical assessment of the participant, described as a gold
      standard label available in the data and diagnosed by a clinician. At each site a local clinician
      provided the diagnosis based on a clinical interview and appropriate work-up. Clinical validation is
      performed by a qualified physician or practitioner based on established gold standards for diagnosis.
  - name: Single labeler per instance
    description: >-
      One labeler is considered per data item and one label is provided per instance, typically the
      clinician at the site of data collection, or a clinician external to it for a prior diagnostic
      assessment.
  - name: Labeling guidelines
    description: >-
      Labelers followed the Bridge2AI protocols and ICD-10 codes.
  - name: Cohort-specific gold-standard validation methods
    description: >-
      Validation methods vary by cohort and diagnosis and include laryngoscopy images and stroboscopy
      videos for voice disorders; CT scan and spirometry for vocal fold paralysis; spirometry and flow
      volume loops and CT of the neck and chest for airway stenosis and chronic cough; brain CT, brain MRI
      and whole genome sequencing for neurological and neurodegenerative disorders, with serum p-tau
      biomarkers additionally for Alzheimer's disease; and electronic health summary, clinical diagnosis
      from a psychiatrist and medication history for mood and psychiatric disorders.
  - name: Record-based labeling for the psychiatric cohort
    description: >-
      For the psychiatric disorders cohort the assessment was determined by using the participant's EHR
      record or an active prescription, which was done outside of data collection by an appropriately
      licensed clinician.
  - name: Guidance for future label creation
    description: >-
      The process for any new labels should be described alongside any release of a model or publication,
      and that description should include the exact variables used for the determination.

machine_annotation_tools:
  - name: OpenAI Whisper Large
    description: Used to generate transcriptions from the standardized audio.
  - name: openSMILE
    description: >-
      Speech and Music Interpretation by Large-space Extraction, used to extract eGeMAPS acoustic features
      per audio file, capturing temporal dynamics and acoustic characteristics.
  - name: Praat and Parselmouth
    description: >-
      Used to compute phonetic and prosodic features for speech tasks, providing measures of fundamental
      frequency, formants and voice quality.
  - name: torchaudio
    description: >-
      Used to compute pitch contours, spectrograms, Mel spectrograms and MFCCs.
  - name: Speech Articulatory Coding (sparc)
    description: >-
      Used to generate electromagnetic articulography estimates and source features including loudness,
      periodicity and pitch at 50 Hz.
  - name: ppgs
    description: >-
      Used to generate phonetic posteriorgrams, a time-varying categorical distribution over 40 acoustic
      units of speech at 100 Hz, following Churchwell, Morrison and Pardo (2024).
  - name: b2aiprep
    description: >-
      The open-source Bridge2AI data processing library used for organizing and preprocessing the dataset,
      converting raw audio into features and merging source data into the phenotype files. Apache-2.0
      licensed; version 3.0.0 generated the 3.0.0 and 3.1.0 releases.
  - name: SenseLab
    description: Open-source toolkit used for processing audio files for research tasks.

annotation_analyses:
  - name: No inter-annotator agreement obtainable
    description: >-
      Exactly one labeler provides a label per instance, so no inter-annotator agreement statistics can be
      computed for the diagnostic labels. The demographic characteristics of labelers are not recorded
      beyond the statement that they are typically the clinician at the site of data collection or external
      to it.
  - name: Internal audit of missingness and consistency
    description: >-
      The dataset has been audited internally for missingness and consistency by the data release team, and
      a missingness table is included with the dataset. Certain aspects of the data, for example
      transcription, were generated using off-the-shelf models that have not been audited for correctness.
  - name: Human-level performance benchmark
    description: >-
      Asked what human-level performance is in the applications the dataset is supposed to address, the
      healthsheet states that it varies widely.

raw_sources:
  - name: Raw voice, speech, cough and breathing recordings
    description: >-
      The unprocessed source data are WAV audio recordings of the acoustic task battery, captured at 
      the collection sites. The raw data, post de-identification, was saved in addition to the
      preprocessed data and is not accessible publicly through the standard release; it is available only
      through the controlled access mechanism.
  - name: Raw questionnaire responses
    description: >-
      Unprocessed questionnaire, demographic, confounder, medical-history and validated-instrument
      responses as captured by the collection application, prior to conversion into the released phenotype
      tables.
  - name: Retrospective clinical and imaging records
    description: >-
      Existing clinical data reviewed within the electronic health record, including disease type,
      severity, symptoms, management, validated questionnaire scores, and previously completed imaging
      (chest X-ray for respiratory, brain CT and MRI for neurology, laryngoscopy imaging for voice). No
      additional imaging was performed for the study; these data were not included in the version 3.0.0
      release.

raw_data_sources:
  - source_description: >-
      Adult raw voice, speech, cough and breathing WAV recordings collected prospectively at five North
      American clinical sites with the Bridge2AI-Voice iPad application. These are not published on
      PhysioNet; access requires institutional sign-off and is granted through the Data Access Compliance
      Office at DACO@b2ai-voice.org, with the data made available via Synapse at
      https://www.synapse.org/Synapse:syn72370534/.
  - source_description: >-
      Pediatric raw audio collected at the Hospital for Sick Children using reproschema-ui with the
      Bridge2AI-Voice pediatric protocol. Access is likewise through the Data Access Compliance Office,
      with the data made available via Synapse at https://www.synapse.org/Synapse:syn73617068.
  - source_description: >-
      Participant questionnaire, demographic, confounder, enrollment and clinical-validation responses
      captured in REDCap. The supporting REDCap data dictionary, metadata and instrument PDFs are openly
      available at https://github.com/eipm/bridge2ai-redcap and archived on Zenodo at
      https://zenodo.org/doi/10.5281/zenodo.12760724, with the release notes citing Bridge2AI Voice REDCap
      versions 3.20.0 and 3.23.0.
  - source_description: >-
      Electronic health record extracts used for gold-standard clinical validation of diagnoses and
      symptoms, together with imaging and, for the neurological cohort at Canadian sites, genomic data.
      These are extracted from each site independently and uploaded through the REDCap database; they are
      held within the collecting institutions and were not included in the version 3.0.0 release.

external_resources:
  - name: Bridge2AI-Voice Pediatric Dataset
    description: >-
      A separate PhysioNet project, not a version of this dataset, containing derived audio features for
      23,533 recordings from 300 participants aged 2 to 18, collected at the Hospital for Sick Children
      under a separate pediatric protocol and REB approval. Current version 1.1.0, published 1 May 2026,
      DOI 10.13026/h995-bt35 (latest-version DOI 10.13026/mf9s-5r03), available at
      https://physionet.org/content/b2ai-voice-pediatric/ under credentialed access.
  - name: Synapse controlled-access raw audio repositories
    description: >-
      Raw audio for the adult cohort is distributed at https://www.synapse.org/Synapse:syn72370534/ and for
      the pediatric cohort at https://www.synapse.org/Synapse:syn73617068, following approval by the Data
      Access Compliance Office.
  - name: b2aiprep
    description: >-
      Open-source library used to organize and preprocess the dataset, convert raw audio into the released
      features, and merge source data into the phenotype files. Apache-2.0 licensed, at
      https://github.com/sensein/b2aiprep.
  - name: SenseLab
    description: >-
      Open-source toolkit for processing audio files for research tasks, used alongside b2aiprep, at
      https://github.com/sensein/senselab.
  - name: eipm/bridge2ai-redcap
    description: >-
      Bridge2AI REDCap data dictionary and metadata, MIT licensed, at
