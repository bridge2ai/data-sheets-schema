id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  The Bridge2AI-Voice adult flagship dataset is a large, ethically sourced, demographically
  diverse collection of voice, speech, and respiratory-sound data linked to health information,
  generated by the Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI program.
  Version 3.1.0 contains data for 833 adult participants recruited across five sites in North
  America. Participants were selected on the basis of conditions known to manifest in the voice
  waveform, spanning five disease cohort categories: voice disorders, neurological and
  neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders, and
  pediatric voice and speech disorders, together with control participants without those
  conditions. Each participant performed a standardized battery of acoustic tasks (breathing,
  cough, sustained vowel, glides, diadochokinesis, validated read passages, free speech, picture
  description, story recall, and cognitive-linguistic tasks) and completed demographic,
  confounder, medical-history, and disease-specific validated questionnaires. Clinical diagnoses
  were validated by clinicians against established gold standards.
  The published PhysioNet release contains derived features rather than the original waveforms:
  spectrograms, Mel spectrograms, MFCCs, pitch contours, articulatory (SPARC/EMA) traces,
  loudness and periodicity estimates, phonetic posteriorgrams, and static acoustic features from
  openSMILE, Praat/Parselmouth and torchaudio, alongside per-recording audio-quality metrics,
  recording metadata, and the full phenotypic tables. Raw audio is disseminated only under a
  separate controlled-access mechanism via Synapse. The project documentation at
  docs.b2ai-voice.org additionally describes a separate Bridge2AI-Voice Pediatric Dataset
  (300 participants aged 2-18), published as a distinct PhysioNet project rather than a version
  of this one.
