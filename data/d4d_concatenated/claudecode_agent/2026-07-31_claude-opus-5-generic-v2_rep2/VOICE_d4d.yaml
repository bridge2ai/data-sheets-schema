file_collections:
  - id: b2ai-voice-3.1.0-features
    name: Derived audio features
    description: >-
      The features subfolder of the version 3.1.0 release. Nine Parquet files of dense time-varying
      features (ppgs, sparc_ema, sparc_loudness, sparc_periodicity, sparc_pitch,
      torchaudio_spectrogram, torchaudio_mfcc, torchaudio_pitch, torchaudio_mel_spectrogram), each row
      keyed by participant_id, session_id, task_name and n_frames; plus two plain-text tables,
      static_features.tsv giving one feature row per audio recording from openSMILE, Praat, Parselmouth
      and torchaudio, and audio_quality_metrics.tsv giving quality-control metrics per recording. Every
      file is paired with a JSON data dictionary sharing the same file stem that describes the feature
      and the processing used to prepare it.
  - id: b2ai-voice-3.1.0-phenotype
    name: Phenotypic tables
    description: >-
      The phenotype subfolder of the version 3.1.0 release. Tab-separated tables with matching JSON data
      dictionaries, organised into six subdirectories: confounders; demographics; diagnosis (18 condition
      tables covering airway stenosis, ALS, anxiety, benign lesions, bipolar disorder, cognitive
      impairment, control, COPD and asthma, depression, glottic insufficiency, laryngeal cancer,
      laryngeal dystonia, laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous
      lesions, unexplained chronic cough and unilateral vocal fold paralysis); enrollment (eligibility,
      enrollment_form, participant); questionnaire (adhd_adult, custom_affect_scale, dsm5_adult,
      dyspnea_index, gad7_anxiety, leicester_cough_questionnaire, panas, phq9, productive_vocabulary,
      psychiatric_history, ptsd_adult, vhi10, voice_perception); and task (acoustic_task,
      harvard_sentences, random_item_generation, recording, session, stroop, winograd). Rows are present
      for a participant only where at least one column is not missing, and a participant may have more
      than one row where they attended more than one session.
  - id: b2ai-voice-3.1.0-metadata
    name: Recording metadata
    description: >-
      The metadata folder of the version 3.1.0 release. A Parquet file with its data dictionary,
      introduced at version 3.1.0, containing specific information about each recording including task
      instructions and prompts, the microphone used, and its gain.
  - id: b2ai-voice-audio-bids
    name: BIDS raw audio dataset (controlled access)
    description: >-
      The b2ai-voice-audio dataset organised to BIDS v1.9.0, comprising CHANGES.md, README.md,
      dataset_description.json, the phenotype directory, and per-participant
      sub-<participant_id>/ses-<session_id>/audio/ directories holding WAV recordings with JSON sidecars
      named sub<participant_id>_ses<participant_id>_task-<task_name>. Distributed only under controlled
      access via Synapse at https://www.synapse.org/Synapse:syn72370534/ following Data Access
      Compliance Office approval.

variables:
  - variable_name: participant_id
    description: >-
      Unique identifier for the participant, present in every Parquet feature record and used as the key
      linking feature records to the phenotype tables. Directory names in the BIDS audio layout take the
      form sub-<participant_id>.
  - variable_name: session_id
    description: >-
      Unique identifier for the recording session. Most participants completed data collection in a single
      session, but a subset required multiple sessions, so a participant may have more than one session_id.
  - variable_name: task_name
    description: >-
      The acoustic task performed for the recording, drawn from the 22 adult acoustic tasks in the protocol
      and their pediatric variants, spanning non-voice/non-speech tasks (respiration, cough, breath
      sounds), voice/non-speech tasks (prolonged vowel, maximum phonation time, glides, loudness,
      diadochokinesis) and speech tasks (Rainbow Passage, Caterpillar Passage, CAPE-V sentences, free
      speech, picture description, story recall, animal fluency, open response questions, word-color
      Stroop, productive vocabulary, random item generation, Cinderella story).
  - variable_name: n_frames
    description: >-
      The number of time frames associated with the feature tensor in a given Parquet record.
  - variable_name: spectrogram
    description: >-
      Short-time Fourier transform magnitude representation of dimension 201 by T at versions 3.0.0 and
      3.1.0 (513 by T at version 1.1), computed with a 25 ms window, 10 ms hop and 400-point FFT and
      downsampled by two in the time domain. Stored in power representation; the documented usage example
      converts to decibels with librosa.power_to_db.
  - variable_name: mel_spectrogram
    description: >-
      Mel spectrogram of dimension 60 by T computed with a 25 ms window, 10 ms hop, 400-point FFT and 60
      Mel bins.
  - variable_name: mfcc
    description: >-
      Sixty Mel-frequency cepstral coefficients, of dimension 60 by T, derived from the spectrograms using
      the same parameters as the Mel spectrogram.
  - variable_name: pitch
    description: >-
      Detected fundamental frequency over time, of dimension T. The torchaudio estimate uses a minimum
      pitch of 80 Hz and a maximum of 500 Hz; the SPARC estimate uses a different algorithm over a
      50-550 Hz range.
  - variable_name: ema
    description: >-
      Estimated electromagnetic articulography from a deep learning model, of dimension T by 12,
      corresponding to the X and Y positions of six articulators: tongue dorsum, tongue body, tongue tip,
      lower incisor, upper lip and lower lip, sampled at 50 Hz.
  - variable_name: loudness
    description: >-
      Estimated loudness based on the average absolute amplitude of the audio waveform, of dimension T,
      computed over 20 ms windows.
  - variable_name: periodicity
    description: >-
      Estimated periodicity, that is the confidence of pitch presence, derived from the audio over 20 ms
      windows, of dimension T.
  - variable_name: ppg
    description: >-
      Phonetic posteriorgram probabilities across 40 phoneme categories, of dimension 40 by T, at a frame
      rate of 100 Hz.