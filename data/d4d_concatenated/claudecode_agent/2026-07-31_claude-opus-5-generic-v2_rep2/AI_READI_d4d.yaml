instances:
  - name: Individual study participant
    description: >-
      Each instance represents an individual participant in the AI-READI study. Version 3.0.0
      contains 2,280 instances, each consisting of all data available for that person across
      the collected modalities. An instance is therefore a bundle of tabular survey and
      clinical records mapped to the OMOP Common Data Model, laboratory values, imaging series
      (retinal photography, OCT, OCTA, FLIO) in DICOM, an ECG waveform record in WFDB format,
      and 10-day time series from a continuous glucose monitor, a wearable activity monitor and
      an in-home environmental sensor. There is currently one study visit per participant. No
      explicit label or target is attached to any instance; the dataset is hypothesis-agnostic.
      Prior versions contained 204 instances (v1.0.0, pilot phase) and 1,067 instances
      (v2.0.0).

relationships:
  - name: Shared study membership; one visit per participant
    description: >-
      All instances are part of the same prospective data generation project (AI-READI), and
      this relationship is explicit in the dataset structure. There is currently only one study
      visit per participant, so instances are not linked longitudinally in this release,
      although a subgroup of the cohort is planned to be invited back for a follow-up visit in
      year 4 of the project. Within a participant, files across data type, modality and device
      directories are related by the participant identifier used as the folder name.

subpopulations:
  - name: Hispanic participants
    description: >-
      380 of 2,280 participants in version 3.0.0 (204 in the recommended training split, 88 in
      validation, 88 in test), by self-reported race/ethnicity recorded at screening.
      Race/ethnicity values are not distributed in the public release; they are held under
      controlled access. The counts are published in the recommended data split table in the
      dataset README.
  - name: Asian participants
    description: >-
      545 of 2,280 participants in version 3.0.0 (369 training, 88 validation, 88 test), by
      self-reported race/ethnicity. Values held under controlled access.
  - name: Black participants
    description: >-
      519 of 2,280 participants in version 3.0.0 (343 training, 88 validation, 88 test), by
      self-reported race/ethnicity. Values held under controlled access. The protocol notes
      that recruiting Black men into health research is documented as more difficult than
      recruiting other populations even though this population bears a disproportionate share
      of T2DM burden.
  - name: White participants
    description: >-
      836 of 2,280 participants in version 3.0.0 (660 training, 88 validation, 88 test), by
      self-reported race/ethnicity. Values held under controlled access. White participants are
      the largest group in this release, so the intended equal balance across the four
      race/ethnicity groups has not yet been achieved.
  - name: Female participants
    description: >-
      1,329 of 2,280 participants in version 3.0.0 (977 training, 176 validation, 176 test), by
      biological sex recorded at screening. Sex is not distributed in the public release; it is
      held under controlled access.
  - name: Male participants
    description: >-
      951 of 2,280 participants in version 3.0.0 (599 training, 176 validation, 176 test), by
      biological sex. Males are under-represented relative to females in this release. Sex is
      held under controlled access.
  - name: Participants without diabetes
    description: >-
      776 of 2,280 participants (600 training, 88 validation, 88 test). Defined as participants
      who have neither type 1 nor type 2 diabetes.
  - name: Pre-diabetes or lifestyle-controlled T2DM
    description: >-
      560 of 2,280 participants (384 training, 88 validation, 88 test). Defined as participants
      with pre-type 2 diabetes and those with T2DM whose blood sugar is controlled by lifestyle
      adjustments.
  - name: T2DM controlled by oral or non-insulin injectable medication
    description: >-
      686 of 2,280 participants (487 training, 109 validation, 90 test). Defined as
      participants with T2DM whose blood sugar is controlled by oral or injectable medications
      other than insulin.
  - name: Insulin-controlled T2DM
    description: >-
      258 of 2,280 participants (105 training, 67 validation, 86 test). Defined as participants
      with T2DM whose blood sugar is controlled by insulin. This is the smallest severity
      group, so the intended equal balance across the four severity groups has not yet been
      achieved.

