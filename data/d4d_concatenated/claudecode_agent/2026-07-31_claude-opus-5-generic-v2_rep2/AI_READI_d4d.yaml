id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, AI-ready dataset collected from 2,280 participants with and without type 2
  diabetes mellitus (T2DM), harmonised across three United States data collection sites
  (University of Alabama at Birmingham, University of California San Diego, University of
  Washington) by the AI-READI (Artificial Intelligence Ready and Equitable/Exploratory Atlas
  for Diabetes Insights) project, one of four Data Generation Projects of the NIH Common Fund
  Bridge2AI program. Data were collected between 19 July 2023 and 1 May 2025. Modalities
  include survey and clinical data mapped to the OMOP Common Data Model, blood and urine
  laboratory results, physical measurements, cognitive screening (MoCA), monofilament testing
  for peripheral neuropathy, vision testing, 12-lead electrocardiography, retinal photography,
  optical coherence tomography (OCT), OCT angiography (OCTA), fluorescence lifetime imaging
  ophthalmoscopy (FLIO), 10 days of continuous glucose monitoring, 10 days of wearable activity
  monitoring, and 10 days of in-home environmental sensing. Recruitment was designed to be
  triple-balanced across self-reported race/ethnicity, biological sex, and T2DM severity in
  order to support downstream artificial intelligence and machine learning research into
  salutogenesis, the pathway from disease back to health. The public release contains no
  protected health information; sex, race/ethnicity, and medication information are held under
  controlled access. The dataset is published on the FAIRhub data portal, which the dataset
  metadata records as the publisher.
