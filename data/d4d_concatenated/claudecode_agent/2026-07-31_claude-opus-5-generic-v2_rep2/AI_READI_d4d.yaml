purposes:
  - name: Enable AI/ML research into T2DM salutogenesis
    description: >-
      The dataset was created to enable future generations of artificial intelligence and
      machine learning research to provide critical insights into type 2 diabetes mellitus,
      including salutogenic pathways back to health. Salutogenesis in this context refers to
      the pathway from T2DM to health, the opposite of studying how healthy people proceed
      through pathogenesis resulting in T2DM.
  - name: Create a flagship ethically sourced, balanced multimodal dataset
    description: >-
      AI-READI set out to create and share a flagship ethically sourced dataset that is
      triple-balanced by self-reported race/ethnicity (Asian, Black, Hispanic, White), T2DM
      presence and severity (no diabetes; pre-diabetes or lifestyle-controlled; controlled by
      oral or non-insulin injectable medications; insulin-controlled), and biological sex.
      Building balanced datasets was treated as critical for developing unbiased machine
      learning models, so the study deliberately recruited equal proportions of these groups
      rather than targeting the demographic distribution of the US population.
  - name: Support downstream pseudotime manifold analysis
    description: >-
      Data collection was specifically designed to permit downstream pseudotime manifold
      analysis, an approach used to predict disease trajectories by collecting and learning
      from complex multimodal data from participants with differing disease severity, from
      normal to insulin-dependent T2DM. The long-term objective is a foundational dataset in
      T2DM, agnostic to existing classification criteria or biases, that can be used to
      reconstruct a temporal atlas of T2DM development and reversal towards health.
  - name: Establish a blueprint and standards for AI-ready data generation
    description: >-
      A further purpose is to establish standards, best practices and guidelines for the
      collection, preparation and sharing of data for AI/ML purposes, including guidance from
      bioethicists and adherence to the FAIR (Findable, Accessible, Interoperable, Reusable)
      principles, so that AI-READI can serve as a model for future efforts to develop other
      medical/health datasets targeted for AI/ML.

addressing_gaps:
  - name: Lack of AI-ready datasets for training models on T2DM
    description: >-
      A major barrier to applying AI to type 2 diabetes has been the lack of diverse datasets
      that are AI ready for training AI models. The ability to understand and affect the course
      of complex, multi-organ diseases such as T2DM has been limited by a lack of
      well-designed, high-quality, large and inclusive multimodal datasets.
  - name: Absence of racial and ethnic diversity in prior T2DM research
    description: >-
      A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated that
      samples lacked racial and ethnic diversity. Because the prevalence and consequences of
      T2DM are greater in certain racial and ethnic populations, AI-READI's approximately
      balanced sample across Asian, Black, Hispanic and White participants is intended as a
      demographic improvement over many previous epidemiological studies and clinical trials.
  - name: Limits of claims and electronic health record data for AI/ML
    description: >-
      The data acquisition protocol was designed across multiple domains (survey data, physical
      measurements, clinical data, imaging data, wearable device data and others) specifically
      to enable downstream AI/ML analyses that may not be feasible with existing data sources
      such as claims or electronic health records data.
  - name: Missing standards and practices for sharing AI-ready clinical data
    description: >-
      Preparing and sharing AI-ready datasets is time consuming and difficult for
      data-collecting researchers, and existing documentation approaches for clinical research
      datasets were judged insufficient. The project addresses this gap by developing new
      standards such as the Clinical Dataset Structure, by extending existing standards with
      their maintainers, and by building the FAIRhub curation and sharing platform.

tasks:
  - name: Pseudotime manifold analysis of disease trajectory
    description: >-
      Reconstruction of a temporal atlas of T2DM development and reversal towards health by
      applying dimensionality reduction and pseudotime manifold methods, originally used in
      developmental biology, to multimodal data from participants spanning normal to
      insulin-dependent disease severity.
  - name: Multimodal AI/ML model development across diabetes severity
    description: >-
      Development and training of artificial intelligence and machine learning models on
      harmonised multimodal data (imaging, physiological signals, wearable time series, survey
      and clinical tabular data) from participants balanced across four T2DM severity groups.
  - name: Study of salutogenesis in type 2 diabetes
    description: >-
      Investigation of the pathway from type 2 diabetes back to health, including the
      identification of factors associated with health resilience, using a hypothesis-agnostic
      protocol assembled from assessments across many health domains likely to be impacted by
      T2DM.

