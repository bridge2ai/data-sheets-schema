purposes:
  - description: >-
      To meet the need for infrastructure supporting artificial intelligence and machine learning in
      critical care by developing high-resolution multi-center data sets as a first step towards
      actionable and trustworthy AI.
  - description: >-
      To develop a publicly available, AI-ready critical care dataset while ensuring that the methods
      used promote privacy, accountability, and clinical benefit.
  - description: >-
      To generate data for ML/AI applications aimed at characterizing acute and critical care illness,
      predicting complications, and measuring treatment response among patients with acute or
      critical illness.
  - description: >-
      To provision a holdout test set accessible for model external validation, in order to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care.
  - description: >-
      To create ethically sourced datasets and tools around artificial intelligence and to establish
      best practices for AI in health, as one of four data generation projects in the NIH Bridge2AI
      consortium.
  - description: >-
      To support the training of a new generation of AI clinicians and scientists, including engineers,
      data scientists and clinicians working in AI in clinical care data engineering infrastructure.

tasks:
  - description: >-
      Characterizing acute and critical care illness in patients with acute or critical illness.
  - description: >-
      Predicting complications and clinical deterioration among critically ill patients.
  - description: >-
      Measuring treatment response among patients with acute or critical illness.
  - description: >-
      Building machine learning and artificial intelligence derived models to improve the care and
      outcomes of patients requiring critical care.
  - description: >-
      External validation of AI/ML models against a sequestered holdout test set.
  - description: >-
      Labeling data with targets important for prediction, supported by a visualization and
      annotation environment.

addressing_gaps:
  - description: >-
      An urgent need for infrastructure to support artificial intelligence and machine learning in
      critical care, which the project addresses by developing high-resolution multi-center data sets.
  - description: >-
      The absence of a diverse, high-resolution, ethically sourced, AI-ready dataset capable of
      answering the grand challenge of improving recovery from acute illness.
  - description: >-
      The lack of unified standards for harmonizing multi-modal EHR, waveform, imaging and text data
      across institutions, addressed through standardization to the OMOP Common Data Model and
      modality-specific standards.
  - description: >-
      The absence of sequestered holdout datasets for external validation of clinical AI models, which
      limits marketplace adoption of AI-developed models in acute and critical care.
  - description: >-
      Limited AI literacy and workforce capacity in the lay and scientific community, addressed through
      multimodal educational approaches.

instances:
  - description: >-
      Each instance is a patient admission for a critically or acutely ill patient. The currently
      released dataset comprises 50,000 patient admissions from ICU, PICU and NICU settings; the
      anticipated final dataset comprises 100,000 patient admissions, drawn from a population described
      in the funded project as more than 100,000 critically ill patients.
  - description: >-
      Per-admission records are multimodal and may include demographics, medication administration
      events time-stamped at each infusion change or dose administration, procedures documented by
      providers, high-frequency nursing flowsheet documentation, provider-documented diagnoses,
      tokenized clinical notes, imaging studies, waveform telemetry, and EEG waveforms.

subsets:
  - id: https://chorus4ai.org/dataset/subset/released
    description: >-
      Currently released dataset: 50,000 patient admissions from ICU, PICU and NICU, containing 1.6
      billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data.
  - id: https://chorus4ai.org/dataset/subset/holdout-test
    description: >-
      Holdout test set. The funded project states that the dataset will also provision a holdout test
      set, accessible for model external validation to aid marketplace adoption of AI-developed models
      for implementation in acute and critical care.
  - id: https://chorus4ai.org/dataset/subset/imaging-available
    description: >-
      Imaging subset. As reported in the September 2025 webinar, approximately 1000 images were
      available at that time, with de-identification in process for a larger cohort.

subpopulations:
  - description: >-
      Intensive care unit (ICU) admissions, included among the 50,000 patient admissions reported for
      the currently released dataset.
  - description: >-
      Pediatric intensive care unit (PICU) admissions, included among the 50,000 patient admissions
      reported for the currently released dataset.
  - description: >-
      Neonatal intensive care unit (NICU) admissions, included among the 50,000 patient admissions
      reported for the currently released dataset.

splits:
  - description: >-
      The funded project states that the dataset will also provision a holdout test set, accessible
      for model external validation.

acquisition_methods:
  - description: >-
      Retrospective data collection. Data are extracted from existing clinical systems at contributing
      hospitals rather than prospectively generated for the dataset.
  - description: >-
      Multi-center acquisition through a network built to acquire, standardize, tokenize, store,
      visualize and label data, spanning structured EHR data, tokenized unstructured EHR data,
      telemetry and EEG waveforms, imaging, and social determinants of health.
  - description: >-
      Site-based extraction following validated standard operating procedures. Data managers at
      contributing sites follow an interactive workflow in the Chorus_SOP documentation site, which
      links to SOP documents that have undergone internal validation and review, and use the
      chorus-extract-upload tooling to create and upload a CHoRUS data extract.

collection_mechanisms:
  - description: >-
      Extraction of structured electronic health record data (demographics, medication administration,
      procedures, nursing flowsheets, diagnoses) and transformation to the OMOP Common Data Model.
  - description: >-
      Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit.
  - description: >-
      Retrieval of imaging studies from hospital PACS systems in DICOM format.
  - description: >-
      Capture of waveform telemetry from bedside monitors via gateway/middleware, delivered in WFDB
      format.
  - description: >-
      Extraction of EEG waveforms from hospital EEG databases in EDF+ and Persyst formats.
  - description: >-
      Software tooling and dockerized container applications deployed to support CHoRUS services on
      Azure, together with tools to create and upload a CHoRUS data extract.

collection_timeframes:
  - description: >-
      As of August 2025, the dataset covered 14 different hospitals with over 45,000 unique admissions,
      as reported in the September 2025 informational webinar.

data_collectors:
  - description: >-
      Fourteen academic medical centers acting as CHoRUS Data Acquisition centers, drawn from a
      collaboration spanning 20 academic centers.
  - description: >-
      Data site managers at each contributing site, responsible for extracting and contributing
      clinical data according to CHoRUS standard operating procedures and for providing regular status
      updates on their extract creation and curation progress.
  - description: >-
      CHoRUS sub-teams for Standards, Data Acquisition, and Tooling, which produce documentation,
      recordings and validated procedures supporting site data delivery.

direct_collection:
  - description: >-
      Retrospective data collection. Data are extracted from clinical records, imaging archives,
      monitoring systems and EEG databases already held by the 14 contributing hospitals, which act as
      the CHoRUS Data Acquisition centers.

sampling_strategies:
  - description: >-
      Sampling designed to ensure comprehensive sets of patient conditions and clinical treatment
      strategies, established alongside a legal framework for collecting data at scale.
  - description: >-
      Federated access enabling sampling methods intended to ensure a balanced and diverse cohort
      across the contributing centers.

raw_data_sources:
  - source_description: >-
      Structured electronic health record systems at the 14 contributing hospitals, supplying
      demographics, medication administration records (time-stamped at each infusion change or dose
      administration), provider-documented procedures, high-frequency nursing flowsheet documentation,
      and provider-documented diagnoses.
  - source_description: >-
      Unstructured clinical notes from hospital electronic health record systems, which remain stored
      locally at contributing sites except for tokens.
  - source_description: >-
      Hospital PACS imaging archives, supplying DICOM imaging studies.
  - source_description: >-
      Bedside monitors and associated gateway/middleware systems, supplying waveform telemetry.
  - source_description: >-
      Hospital EEG databases, supplying EEG waveforms in EDF+ and Persyst formats.

raw_sources:
  - description: >-
      Structured electronic health record extracts held at contributing hospitals prior to CHoRUS
      standardization to the OMOP Common Data Model.
  - description: >-
      Free-text clinical notes held in hospital electronic health record systems prior to extraction
      and tokenization with the OHNLP toolkit.
  - description: >-
      DICOM imaging studies held in hospital PACS archives prior to de-identification and release.
  - description: >-
      Bedside monitor telemetry streams captured via gateway/middleware prior to conversion to WFDB.
  - description: >-
      Hospital EEG recordings prior to extraction into EDF+ and Persyst formats.

preprocessing_strategies:
  - description: >-
      Standardization of acquired data to the OMOP Common Data Model, with OMOP schema metadata
      published for demographics, medication administration, procedures, nursing flowsheets (OMOP
      schema with extensions) and diagnoses.
  - description: >-
      Tokenization of unstructured electronic health record text, so that clinical notes are extracted
      and tokenized using the OHNLP toolkit and only tokens leave the contributing site.
  - description: >-
      Transformation of data using approaches that limit re-identification.
  - description: >-
      Conversion of waveform data into standard formats, supported by CHoRUS waveform documentation
      and waveform conversion scripts.
  - description: >-
      Harmonization of multi-modal EHR, waveform, imaging, and text data under unified standards, using
      validated semantic mappings that connect clinical data in various source formats to international
      standards.

cleaning_strategies:
  - description: >-
      Characterization reports are produced and returned to contributing sites following their data
      submissions.

labeling_strategies:
  - description: >-
      A visualization and annotation environment is used to label data with targets important for
      prediction.
  - description: >-
      Semantic mapping with clinical validation: pooled tabular mappings are maintained in a
      chorus-mapping repository with documentation and an associated clinical validation standard
      operating procedure, with clinical collaborators contributing expertise to semantic mapping and
      validation.

machine_annotation_tools:
  - description: >-
      OHNLP toolkit, used to extract and tokenize clinical notes; outputs conform to the OHNLP open
      source schema.

is_deidentified:
  description: >-
    The dataset is derived from patient clinical records and is subject to de-identification and
    re-identification-limiting transformations. Unstructured EHR text is tokenized, with clinical
    notes stored locally at contributing sites and only tokens shared. Data are transformed using
    approaches that limit re-identification. As of the September 2025 webinar, de-identification of
    imaging was in process for a cohort larger than the approximately 1000 images then available.

participant_privacy:
  - description: >-
      Patient privacy protections include tokenization of unstructured clinical text, retention of
      clinical notes locally at contributing sites, transformations that limit re-identification, and
      controlled access to all data types. Patient-focused efforts determine the ethical and legal
      approaches used to manage privacy and bias.

sensitive_elements:
  - description: >-
      Demographic data for critically ill patients, standardized to OMOP and released only under
      controlled access.
  - description: >-
      Clinical notes, which contain free-text patient information and are therefore stored locally at
      contributing sites with only tokenized representations shared.
  - description: >-
      Imaging studies obtained from hospital PACS, which require de-identification prior to release.
  - description: >-
      Waveform telemetry from bedside monitors and EEG waveforms from hospital databases.
  - description: >-
      Social determinants of health and contextual data elements such as geographic distance to the
      nearest hospital, which the project acquires as part of the dataset.
  - description: >-
      Provider-documented diagnoses, procedures, medication administration records and high-frequency
      nursing flowsheet documentation.

confidential_elements:
  - description: >-
      All data types in the CHoRUS dataset (demographics, medication administration, procedures,
      nursing flowsheets, diagnoses, clinical notes, imaging, waveform telemetry and waveform EEG) are
      designated controlled access.
  - description: >-
      Full clinical notes are not released: they are stored locally at contributing sites, with only
      tokens made available. OMOP and telemetry data reside in the cloud enclave.

human_subject_research:
  description: >-
    The dataset is composed of retrospective clinical data from acutely and critically ill patients,
    described in the funded project as more than 100,000 critically ill patients. The project includes
    an Ethics pillar covering ethical and trustworthy AI, community-facing ethics focus groups to
    determine what data is appropriate for public sharing, and the establishment of a legal framework
    for collecting data at scale.

known_limitations:
  - description: >-
      The dataset is incomplete relative to its stated target. The anticipated final dataset is 100,000
      patient admissions across 9 modalities, while the currently released dataset covers 50,000
      patient admissions.
  - description: >-
      Modality coverage is uneven. As of the September 2025 webinar, imaging comprised approximately
      1000 available images with de-identification in process for a larger cohort, and EEG extraction
      was still in process.
  - description: >-
      Full clinical notes are not centrally available: notes are stored locally at contributing sites
      and only tokens are shared, which constrains text-based analyses.
  - description: >-
      Metadata availability differs by modality. Published metadata schemas exist for the OMOP-based
      data types, the OHNLP note schema, the DICOM imaging schema and the extended PhysioNet waveform
      schema, while metadata for some modalities was still marked as planned as of September 2025.
  - description: >-
      Access is restricted: all data types are controlled access, requiring registration, a signed
      licensing agreement, and (for the training program access route) a ".edu" email address.
  - description: >-
      Reported admission figures are not consistent across sources. The September 2025 webinar reports
      14 hospitals and over 45,000 unique admissions as of August 2025, while the project website
      reports a current released dataset of 50,000 patient admissions.
  - description: >-
      Reported imaging figures are not consistent across sources. The September 2025 webinar reports
      approximately 1000 images available with de-identification in process for a larger cohort, while
      the project website reports 7,642 admissions with radiology data in the current released dataset.
  - description: >-
      The project repository is under review for potential modification in compliance with
      Administration directives, which may affect availability of project materials.

intended_uses:
  - description: >-
      Building machine learning and artificial intelligence derived models to improve the care and
      outcomes of patients requiring critical care.
  - description: >-
      Developing models that characterize acute and critical care illness, predict complications, and
      measure treatment response.
  - description: >-
      External validation of AI/ML models using the holdout test set.
  - description: >-
      Hands-on AI/ML training and education in clinical care, including use within the AIM-AHEAD
      Bridge2AI for Clinical Care Training Program, where trainees develop practical use cases on the
      Bridge2AI AI/ML for Clinical Care Collaborative Cloud.
  - description: >-
      Innovative research at the intersection of healthcare challenges and AI/ML using multi-modal
      datasets from a broad range of cohort participants.

existing_uses:
  - description: >-
      The datasets are being used for training activities, as reported in the September 2025
      informational webinar.
  - description: >-
      The datasets are being used for publications, as reported in the September 2025 informational
      webinar.
  - description: >-
      The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2, running November 2025 to
      July 2026 with up to 30 trainees) expands access to Bridge2AI CHoRUS data through engagement, AI
      training and mentorship, with trainees producing posters, conference abstracts and manuscripts.

other_tasks:
  - description: >-
      Downstream analytics on the mapped and assembled dataset, for which clinical collaborators are
      invited to get involved.
  - description: >-
      Development and evaluation of tooling, semantic mappings and standards for interoperable
      multi-modal clinical data, supported by the CHoRUS open-source repositories.

future_use_impacts:
  - description: >-
      The project anticipates that the dataset will catalyze the biomedical research and expertise
      necessary to promote the patient-focused deployment of AI in acute and critical care.
  - description: >-
      The holdout test set is intended to aid marketplace adoption of AI-developed models for
      implementation in acute and critical care through external validation.

distribution_formats:
  - description: >-
      OMOP Common Data Model tables for demographics, medication administration, procedures, nursing
      flowsheets (OMOP schema with extensions) and diagnoses.
  - description: >-
      OHNLP open source schema for clinical notes, extracted and tokenized using the OHNLP toolkit.
  - description: >-
      DICOM, with DICOM schema metadata, for imaging obtained from PACS.
  - description: >-
      WFDB, with an extended PhysioNet schema, for waveform telemetry from bedside monitors and
      gateway/middleware.
  - description: >-
      EDF+ and Persyst open source schemas for EEG waveforms from hospital databases.

distribution_dates:
  - description: >-
      A released dataset was available as of August 2025, at which point it covered 14 different
      hospitals with over 45,000 unique admissions.

third_party_sharing:
  - description: >-
      The dataset is distributed outside the contributing hospitals under controlled access within a
      cloud enclave. OMOP and telemetry data reside in the enclave; clinical notes remain stored
      locally at contributing sites except for tokens.
  - description: >-
      Access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org, per the
      CHoRUS GitHub organization.
  - description: >-
      For training program participants, access is granted through a registration form capturing name,
      email and institution; once access is granted and compute is provisioned, an email is sent. A
      ".edu" email address is required to gain access to the dataset, and program administrators will
      assist with this access if needed.

license_and_use_terms:
  description: >-
    All CHoRUS data types are controlled access. All participants in the AIM-AHEAD Bridge2AI for
    Clinical Care Training Program must sign a licensing agreement, included in the registration form,
    before gaining access to the dataset. Separately, the CHoRUS software project hosted in the
    chorus-ai GitHub organization is licensed under the MIT License, with individual repositories
    carrying MIT or Apache-2.0 licenses.

updates:
  description: >-
    The dataset is being expanded from the currently released 50,000 patient admissions toward an
    anticipated final dataset of 100,000 patient admissions across 9 data modalities from 14 data
    contributing hospitals. As of September 2025, de-identification of imaging was in process for a
    cohort larger than the approximately 1000 images then available, EEG extraction was in process,
    and published metadata schemas were planned for several modalities. Contributing sites provide
    regular status updates on their progress in creating and curating CHoRUS data extracts, submitted
    either through the GitHub interface or a Google Form that triggers automated updates to GitHub
    project status via the GitHub API.

extension_mechanism:
  description: >-
    Contributions are coordinated through the chorus-ai GitHub organization. Data site managers report
    issues in context-specific Standards Discussions and Data Acquisition Discussions. Clinical
    collaborators contribute semantic mappings through the chorus-mapping repository, which holds
    documentation, pooled tabular mappings and a clinical validation standard operating procedure.
    Software contributors use a web guide compiled in the chorus-developer repository, with package
    versions, maintainers and other metadata tracked on a package status page. Tasks are aggregated
    across repositories into a central task management GitHub project, and site status is tracked in
    the Standards Project and the Data Acquisition Project.

