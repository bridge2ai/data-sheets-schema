  - description: >-
      dbold@emory.edu. Listed on the CHoRUS GitHub organization as a contact for requesting access.
  - description: >-
      jared.houghtaling@tuftsmedicine.org. Listed on the CHoRUS GitHub organization as a contact for
      requesting access. Jared Houghtaling is also listed in the September 2025 webinar as a CHoRUS
