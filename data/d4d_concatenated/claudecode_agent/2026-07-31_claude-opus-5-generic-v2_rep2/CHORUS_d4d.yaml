id: https://chorus4ai.org/dataset
name: CHoRUS Dataset
title: >-
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  Dataset (also referred to as the Bridge2AI for Clinical Care Dataset)
description: >-
  A multicenter, multimodal, high-resolution, controlled-access clinical dataset generated by the
  CHoRUS data generation project, one of four data generation projects in the NIH Common Fund
  Bridge2AI consortium. The dataset is assembled from retrospective clinical data contributed by
  hospitals participating in the CHoRUS Network and is intended to support machine learning and
  artificial intelligence applications that characterize acute and critical care illness, predict
  complications, and measure treatment response among patients with acute or critical illness.
  Data are standardized to the OMOP Common Data Model where applicable and span structured
  electronic health record data, tokenized unstructured clinical notes, imaging, waveform telemetry,
  EEG waveforms, and social determinants of health. The project website reports an anticipated final
  dataset of 100,000 patient admissions across 9 data modalities from 14 data contributing hospitals,
  and a currently released dataset of 50,000 patient admissions from ICU, PICU and NICU settings
  comprising 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of
  waveform data. A September 2025 informational webinar reported that, as of August 2025, the dataset
  covered 14 different hospitals with over 45,000 unique admissions. The dataset also provisions a
  holdout test set accessible for external validation of models.

keywords:
  - critical care
  - acute care
  - critical illness
  - artificial intelligence
  - machine learning
  - electronic health record
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - Bridge2AI
  - AI-ready dataset
  - data standards
  - health equity
  - privacy
  - trustworthiness

page: https://chorus4ai.org/

status: >-
  Partially released and under active development. A released dataset is available under controlled
  access while additional modalities and admissions are still being acquired and processed. The
  project website carries the notice "This repoitory is under review for potential modification in
  compliance with Administration directives."

conforms_to: >-
  OMOP Common Data Model (OHDSI), with modality-specific standards: OHNLP schema for tokenized
  clinical notes, DICOM for imaging, WFDB for waveform telemetry, and EDF+ / Persyst for EEG waveforms.

was_derived_from: >-
  Retrospective clinical records held by the 14 CHoRUS data acquisition hospitals, including
  structured and unstructured electronic health record systems, PACS imaging archives, bedside
  monitor and gateway/middleware telemetry streams, and hospital EEG databases.

created_by: >-
  The CHoRUS for Equitable AI consortium, led from Massachusetts General Hospital and comprising
  60+ members across 20 different institutions, of which 14 contribute as data acquisition centers.

