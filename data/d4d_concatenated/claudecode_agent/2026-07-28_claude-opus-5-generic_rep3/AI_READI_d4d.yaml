purposes:
  - name: Enable AI/ML research into type 2 diabetes salutogenesis
    response: >-
      The dataset was created to enable future generations of artificial intelligence/machine
      learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus
      (T2DM), including salutogenic pathways to return to health.
    description: >-
      The project states that the current understanding of T2DM, especially in the context of
      salutogenesis, is limited; that AI-based approaches may improve that understanding given
      the complexity of the disease; and that a key issue is the lack of data ready for
      training AI models, which the AI-READI dataset is intended to fill. The long-term
      objective is a foundational T2DM dataset, agnostic to existing classification criteria or
      biases, that can be used to reconstruct a temporal atlas of T2DM development and reversal
      towards health.
  - name: Establish standards and a blueprint for AI-ready dataset creation
    response: >-
      AI-READI places emphasis on establishing standards, best practices and guidelines for the
      collection, preparation and sharing of data for AI/ML purposes, and on sharing that
      blueprint so that future data generation projects can follow it.
    description: >-
      Stated aims include creating a model for developing large scalable datasets, adherence to
      the FAIR principles, guidance from bioethicists, and the development of new standards such
      as the Clinical Dataset Structure (CDS) and the FAIRhub platform.
  - name: Support downstream applications in artificial intelligence
    response: >-
      The multi-modal dataset is gathered to facilitate downstream pseudotime manifolds and
      various applications in artificial intelligence.

tasks:
  - name: Pseudotime manifold analysis of disease trajectories
    response: >-
      Data collection was specifically designed to permit downstream pseudotime manifold
      analysis, an approach used to predict disease trajectories by collecting and learning
      from complex, multimodal data from participants with differing disease severity (normal
      to insulin-dependent T2DM).
    description: >-
      The IRB protocol states that the approach has been used in developmental biology to
      identify differentiation pathways from complex single-cell gene expression datasets,
      relies on dimensionality reduction, is agnostic to existing classification criteria or
      biases, and can be used to reconstruct a temporal atlas of pathogenesis and healing.
  - name: Development of AI/ML algorithms for disease trajectories and genetic links
    response: >-
      The purpose of the project is data generation to allow future creation of artificial
      intelligence/machine learning algorithms aimed at defining disease trajectories and
      underlying genetic links in different racial/ethnic cohorts.
  - name: Hypothesis-agnostic multimodal analysis
    response: >-
      No specific predictive task is imposed on the data. The protocol was designed to be
      agnostic to hypotheses; the team assembled a data collection protocol composed of
      assessments from many health domains likely to be impacted by T2DM.

addressing_gaps:
  - name: Lack of AI-ready multimodal T2DM datasets
    response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as
      T2DM has been limited by a lack of well-designed, high quality, large and inclusive
      multimodal datasets. A major barrier to AI in this area has been the lack of diverse
      datasets that are AI ready for training AI models.
  - name: Under-representation of racial and ethnic groups in T2DM research
    response: >-
      The cohort is designed to be balanced in race/ethnicity to address the
      under-representation in past research studies of groups that bear a higher burden of the
      disease.
    description: >-
      A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated that
      samples lacked racial and ethnic diversity; the project describes its balanced design as
      a demographic improvement over many previous epidemiological studies and clinical trials
      on T2DM.
  - name: Absence of data suitable for studying salutogenesis
    response: >-
      Existing data sources such as claims or electronic health records do not support the
      downstream AI/ML analyses needed to study salutogenesis, the pathway from disease to
      health in T2DM. The AI-READI acquisition protocol spans multiple domains specifically to
      enable those analyses.

