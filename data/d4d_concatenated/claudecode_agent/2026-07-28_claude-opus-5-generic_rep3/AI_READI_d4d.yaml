  - variable_name: Multi-spectral light intensity
    data_type: array
    measurement_technique: LeeLab Anura custom environmental sensor placed in the home for 10 days
    description: >-
      Eleven multi-spectral light intensity measurements recorded by the home environmental sensor.
  - variable_name: Device placement and handedness data sheet
    data_type: categorical
    measurement_technique: Participant-completed data sheet returned with the monitoring devices
    description: >-
      Records which wrist the fitness tracker was worn on, the participant's dominant hand, and
      where the environmental sensor was placed in the home.
