instances:
  - name: Participant records
    instance_type: participant (individual person enrolled in the AI-READI study)
    description: >-
      Each instance represents an individual patient. Each instance consists of all of the data
      available for an individual participating in the study, across survey data, clinical data,
      retinal imaging data, environmental sensor data, continuous glucose monitor data and
      wearable activity monitor data. These encompass tabular data, imaging data, and
      physiological signal/waveform data. There is no unstructured text data included in this
      dataset. Version 3.0.0 contains 2280 instances; version 1.0.0 contained 204 and
      version 2.0.0 contained 1067. Across the whole cohort of 2280, the release documentation
      reports 380 Hispanic, 545 Asian, 519 Black and 836 White participants; 951 male and 1329
      female; and 776 with no diabetes, 560 lifestyle-controlled, 686 oral-medication
      controlled and 258 insulin-controlled, with mean age 60.8 years (SD 11.3).
    counts: 2280
    label: false
    label_description: >-
      No labels are provided. The dataset is described as hypothesis-agnostic, aimed at
      facilitating multiple potential downstream AI/ML applications.

anomalies:
  - name: Expected sources of error and noise
    anomaly_details:
      - >-
        In survey data, skipped questions or incomplete responses are expected.
      - >-
        In wearable data, improper use and technical failure such as battery failure or system
        malfunction are expected.
      - >-
        In imaging data, patient uncooperation, noise that may obscure the images, technical
        failure such as system malfunction, and data transfer failures are expected.
      - >-
        Image quality varies between and within patients for undilated handheld fundus
        photography (Optomed Aurora), because it is challenging to obtain a good view without
        dilation and because the camera is handheld.
      - >-
        For operator-dependent modalities such as the Heidelberg Spectralis, quality issues may
        arise which may lead to skipping the modality and missing data. FLIO is performed last
        in the visit and exposes participants to uncomfortable light levels, so participant
        compliance may not be at its best.
      - >-
        In a few cases a data collection device had no stored results or was returned too late
        to retrieve the results (for example battery died, data lost), and in a few cases a data
        collision in the process resulted in lost data.
    description: >-
      The dataset has not undergone any formal external audit. It has been reviewed internally
      by AI-READI team members for quality checks and to ensure that no personally identifiable
      information was accidentally included.

known_biases:
  - name: Volunteer selection bias
    bias_type: selection_bias
    bias_description: >-
      Participants are volunteers; the protocol publication identifies this as selection bias
      known as volunteer bias, which may limit the generalisability of results among those who
      are not represented in the study population.
    affected_subsets:
      - whole cohort
  - name: Under-recruitment of specific demographic groups
    bias_type: sampling_bias
    bias_description: >-
      It is a well-documented observation in health research that recruiting black men into
      studies is more difficult than recruiting other populations, yet this population bears a
      disproportionate percentage of the T2DM burden. Similar trends for under-recruitment and
      disease burden have been reported for Hispanic and Asian persons. Requiring that eligible
      participants speak, read and understand English may have created challenges in recruiting
      Hispanic and/or Asian persons.
    mitigation_strategy: >-
      Recruitment proceeds in waves whose composition is monitored for diversity and inclusion
      and adjusted by under- and oversampling groups as needed; if sample balancing on
      race/ethnicity emerges as a challenge, the project states new recruitment strategies will
      be implemented. Site-level recruitment priorities were set by regional demographics (UW
      Asian>Hispanic>Black, UCSD Hispanic>Asian>Black, UAB Black>Hispanic>Asian). An NIH
      supplement was submitted to fund translation of study materials for Spanish speakers.
    affected_subsets:
      - Black participants
      - Hispanic participants
      - Asian participants
  - name: Incomplete population representation
    bias_type: representation_bias
    bias_description: >-
      The study cohort may not provide a comprehensive representation of the population, as it
      does not include other races/ethnicities such as Pacific Islanders and Native Americans.
      Recruitment is predominantly urban and hospital-based, which may not fully capture
      diverse cultural and socioeconomic backgrounds.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic diversity across the
      United States and to ensure diverse representation across racial and ethnic groups, with
      individuals from all demographic backgrounds recruited at all three sites. Through
      engagement with the Native Biodata Consortium, the project states it will provide a
      co-learning opportunity for understanding challenges specific to American Indian and
      Alaska Native communities.
    affected_subsets:
      - Pacific Islander populations
      - Native American populations
      - rural populations
  - name: Interim releases not yet balanced
    bias_type: sampling_bias
    bias_description: >-
      While the cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
      balanced across these parameters. As enrollment is ongoing, the pilot data release and
      periodic updates to data releases may not have achieved balanced distribution across
      groups.
    mitigation_strategy: >-
      The project team prepared recommended data splits (70/15/15) in which the validation and
      test sets are balanced as well as possible for sex, race/ethnicity and diabetes status.

known_limitations:
  - name: Representativeness of the cohort
    limitation_type: representativeness_limitation
    limitation_description: >-
      The cohort is deliberately not designed to match the demographic distribution of the US
      population; four racial/ethnic groups and four diabetes severity categories are recruited
      in equal proportions. It excludes some racial and ethnic groups entirely and is drawn
      from three urban academic health systems.
    scope_impact: >-
      Models trained on the dataset may not generalise to populations, care settings or
      geographies not represented in the cohort.
  - name: English-language and age eligibility restrictions
    limitation_type: scope_limitation
    limitation_description: >-
      Participants are required to speak, read and understand English, and must be aged 40 or
      older (with the study description recording a maximum age of 85). Pregnancy, gestational
      diabetes and type 1 diabetes are exclusionary.
    scope_impact: >-
      The dataset does not describe non-English-speaking participants, younger adults, people
      with type 1 diabetes, or pregnant people.
    recommended_mitigation: >-
      The project states that consent materials would be translated into Spanish if recruitment
      goals for Hispanic participants are not met, and that native Spanish-speaking research
      staff at UCSD can provide interpretation and instructions.
  - name: Cross-sectional design with a single visit
    limitation_type: temporal_limitation
    limitation_description: >-
      AI-READI is a cross-sectional study and there is currently only one visit per participant
      in the released data. A longitudinal arm is planned in which approximately 10% (elsewhere
      described as about 4%) of participants are invited for a follow-up visit in year 4.
    scope_impact: >-
      Within-person change over time cannot be studied from this release.
  - name: Incomplete modality coverage per participant
    limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements, some devices returned no data, and some data were lost.
    scope_impact: >-
      Analyses requiring complete multimodal coverage will operate on a subset of participants.
  - name: Finite biorepository samples
    limitation_type: coverage_limitation
    limitation_description: >-
      A limitation of the biorepository is that there are a finite number of samples to share
      with scientists interested in using them in research. Procedures for reviewing and
      prioritising written requests will be developed before the biorepository is complete.
    scope_impact: >-
      Biospecimens are not part of this data release and their future availability is limited
      and governed by policies still in development.
  - name: Variables dropped between versions
    limitation_type: integration_limitation
    limitation_description: >-
      The data fields and types are largely the same as the prior version, but the Snellen
      visual acuity variables were dropped in version 3.0.0, so only logMAR visual acuity
      measurements are available.
    scope_impact: >-
      Analyses that pooled Snellen measurements across versions cannot be reproduced against
      this version.

confidential_elements:
  - name: Confidentiality of released data
    confidential_elements_present: false
    confidentiality_details:
      - >-
        The project states that the dataset does not contain data that might be considered
        confidential, and that no personally identifiable information is included in the dataset.
      - >-
        Separately, the IRB protocol records that identifiable study data held by the study team
        (not released here) are kept on encrypted servers or in locked cabinets or rooms with
        restricted access at all sites, with access limited to authorised research personnel,
        and that the study data security level is Level 3.

content_warnings:
  - name: Offensive or distressing content
    content_warnings_present: false
    warnings:
      - >-
        The project answers "No" to whether the dataset contains data that, if viewed directly,
        might be offensive, insulting, threatening or otherwise pose a safety risk.

subpopulations:
  - name: Demographic subpopulations
    subpopulation_elements_present: false
    identification:
      - >-
        The healthsheet answers "No" to whether the dataset identifies any demographic
        sub-populations by age, gender, sex or ethnicity, and states that no regulation prevents
        demographic data collection in the study.
      - >-
        Information related to the sex and race/ethnicity of participants has been removed from
        this release; 5-digit zip code, sex, race and ethnicity are held under controlled access.
      - >-
        At the study level, participants are recruited into four arm groups by diabetes status:
        Healthy (no type 1 or type 2 diabetes); Pre-diabetes/Lifestyle Controlled; Oral
        Medication and/or Non-insulin-injectable Medication Controlled; and Insulin Dependent.
        Recruitment also targets four self-reported race/ethnicity groups (Asian, Black,
        Hispanic, White) and biological sex.
    distribution:
      - >-
        The release README reports cohort totals across the recommended splits: race/ethnicity
        Hispanic 380, Asian 545, Black 519, White 836; sex male 951, female 1329; diabetes
        status no diabetes 776, lifestyle 560, oral 686, insulin 258; total 2280; mean age
        60.8 years (SD 11.3).
      - >-
        The study target is approximately 1000 participants in each of the four diabetes groups
        and 1000 in each of the four racial and ethnic groups, age- and sex-matched within and
        between groups.
    description: >-
      The healthsheet answer refers to the released dataset, from which sex and race/ethnicity
      were removed; the distribution figures above come from the release README split table and
      from the study-level design description, and are recorded here with that scope.

sensitive_elements:
  - name: Sensitive data elements
    sensitive_elements_present: false
    sensitivity_details:
      - >-
        The project states that the public dataset does not contain data considered sensitive,
        and that this release contains no protected health information.
      - >-
        The controlled access dataset is stated to contain data on racial and ethnic origins,
        location (5-digit zip code), motor vehicle accident reports, genetic sequencing data,
        past health records and medications. Access to it requires legal and privacy use
        agreements with the AI-READI research programme.
      - >-
        Members of the study team hold identifiable data outside the release, including name,
        medical record number, date of birth, age, sex, race/ethnicity, address, phone number,
        driver's licence number and email.

relationships:
  - name: Relationships between instances
    relationship_details:
      - >-
        All instances are part of the same prospective data generation project (AI-READI).
      - >-
        There is currently only one visit per participant, so instances are not linked across
        visits in this release.
      - >-
        Within the dataset structure, files for a given participant are grouped by a participant
        folder named after the participant's study ID number inside each datatype/modality/device
        directory, and participants.tsv provides participant-level metadata including the
        recommended split assignment.

splits:
  - name: Recommended training, validation and test splits
    split_details:
      - >-
        The current version of the dataset comes with recommended data splits. Because sex, race
        and ethnicity data are not released with the public version, the project team prepared
        splits in proportions 70%/15%/15% for training/validation/testing, where the validation
        and test sets are balanced as well as possible for sex, race/ethnicity and diabetes
        status (no diabetes, prediabetes/lifestyle controlled, oral medication controlled and
        insulin controlled).
      - >-
        The suggested split is included in the participants.tsv file distributed with the
        dataset. Totals are 1576 training, 352 validation and 352 test participants, summing to
        2280.
      - >-
        Version 3.0.0 introduces this new recommended split for the 2280 participants; it
        introduces no new tasks or labeling.

acquisition_methods:
  - name: Acquisition of data per instance
    was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details:
      - >-
        The acquisition of data varied by domain. Some data were directly observable, such as
        laboratory results, vitals and retinal imaging; other data were reported by subjects,
        such as survey responses.
      - >-
        Verification of data entry was performed when possible, for example cross-referencing
        entered medications with medications that were physically brought in or photographed by
        each study participant.
      - >-
        REDCap was used for collecting patient-reported questionnaire data and the following
        clinical data from the visit: medications assessment, vitals, visual acuity, contrast
        sensitivity, monofilament test results and complete blood count results.
      - >-
        Data from devices were exported in their raw formats to local storage: ECG (.xml), MoCA
        Duo application output (.csv), retinal imaging, and at-home monitoring devices. Blood and
        urine testing by the UW NORC laboratory was provided in .csv format.
      - >-
        Medical records were extracted to obtain data on general health, eye health, medical and
        surgical history, diabetes, medications, laboratory records, and previous medical
        imaging; driving and accident records were obtained from the Department of Licensing.

collection_mechanisms:
  - name: Study protocol and visit structure
    mechanism_details:
      - >-
        The protocol is performed as a single visit lasting between 2.5 and 4 hours depending on
        the participant, preceded by approximately one hour of at-home self-reported surveys and
        followed by a 10-day at-home monitoring period.
      - >-
        Questionnaires cover screening/eligibility, demographic information, CES-D-10 depression
        screening, Problem Areas in Diabetes (PAID-5), a diabetes self-care score, dietary
        assessment, an ophthalmic survey, smoking/alcohol/vaping/marijuana history, general
        health history, PhenX social determinants of health surveys, and current medications
        with RxNorm codes. Marijuana use is not assessed for participants living in Alabama
        because it is an illegal substance there.
      - >-
        Physical measurements include height, weight, waist and hip circumference, waist-hip
        ratio and body mass index. Systolic and diastolic blood pressure and heart rate are
        measured twice, separated by 2 minutes, with an automatic oscillometric medically
        approved device.
      - >-
        All research personnel who recruited, enrolled and collected data underwent training by
        the data manager at UAB with a detailed Manual of Procedures, and had to complete a
        certification process including mandatory institutional compliance training for human
        subject research and successful administration of all protocol elements to at least three
        volunteer practice subjects. Data managers at each site oversee the process.
    description: >-
      The project states that the procedures for data collection and processing are available at
      https://docs.aireadi.org.
  - name: Clinical measurement devices
    mechanism_details:
      - >-
        Electrocardiography: 12-lead ECG using a Philips PageWriter TC30 Cardiograph (Amsterdam,
        The Netherlands), performed while the participant sits in a reclining chair or lies
        supine, with the position recorded (0, 30, 60 or 90 degrees relative to supine).
      - >-
        Peripheral neuropathy: monofilament test assessing touch perception on both feet with
        shoes and socks removed, using a standard 10 g monofilament at three locations on each
        foot, ten times per location, with the participant's eyes closed; insensate areas are
        retested for confirmation. Results are recorded on an iPad, laptop or paper questionnaire
        and entered into REDCap by clinical research staff.
      - >-
        Cognition: Montreal Cognitive Assessment (MoCA) administered electronically on an iPad
        using the MoCA Duo application (MoCA Cognition, Quebec, Canada); total possible score 30,
        with six domain-specific index scores.
      - >-
        Blood pressure devices across sites: OMRON HEM 907XL, Medline MDS4001 Automatic Digital
        Blood Pressure Monitor, and Welch Allyn 6000 series vital signs monitor with FlexiPort
        reusable cuff.
      - >-
        Lensometers across sites: NIDEK LM-600P Auto Lensometer, Topcon CL-200 and Topcon CL-300
        computerized lensometers.
      - >-
        Autorefraction: Topcon KR 800 auto keratometer/refractor (Topcon Healthcare, Oakland,
        New Jersey), giving spherical and cylindrical components in diopters with cylindrical
        axis.
  - name: Visual function testing
    mechanism_details:
      - >-
        Visual acuity is measured with the M&S Technologies Electronic Visual Acuity tester
        (Niles, Illinois) at 4 metres from a 12x20 inch touch-screen monitor, under
        best-corrected conditions and expressed as logMAR. Photopic testing uses a general
        occluder; mesopic testing uses a 2.0 neutral density filter, either as a trial-frame lens
        or as a handheld "ND-occluder".
      - >-
        Letter contrast sensitivity is measured with the Mars chart (Mars Perceptrix, Chappaqua,
        New York) monocularly under photopic and mesopic conditions, in the standardized order
        Photopic OD, Photopic OS, Mesopic OD, Mesopic OS. Chart background luminance is 60 to 120
        cd/m2 (optimal 85), illuminance 189 to 377 lux (optimal 267), viewing distance 50 cm
        (range 40 to 59 cm), with appropriate near correction and undilated eyes. Log contrast
        sensitivity is computed by multiplying errors before the final correct letter by 0.04 and
        subtracting from the log CS value at the final correct letter.
  - name: Retinal imaging devices
    mechanism_details:
      - >-
        Optomed Aurora IQ (Optomed, Oulu, Finland): handheld non-mydriatic fundus camera, 50
        degree field of view, 5 Mpix sensor; macula- and disc-centred colour fundus photographs
        taken undilated; DICOM; 4 images per participant.
      - >-
        iCare EIDON widefield truecolor confocal fundus system (iCare USA, Raleigh, North
        Carolina): ultra-wide field central, nasal and temporal colour fundus photographs,
        ultra-wide field central infrared, ultra-wide field central fundus autofluorescence, and
        a mosaic of ultra-wide field images; DICOM; 12 images per participant.
      - >-
        Heidelberg Spectralis HRA OCT/OCTA (Heidelberg Engineering GmbH, Heidelberg, Germany):
        Optic Nerve Head Radial Circle high resolution OCT, Posterior Pole Macula HR 61 lines
        OCT, and Macula 20x20 HS 512 lines OCTA; DICOM; 6 images per participant.
      - >-
        Topcon Maestro2 3D OCT-1 (Topcon Healthcare, Itabashi-ku, Tokyo, Japan): 3D Wide (H)
        12x9 512x128 OCT, 3D Macula 6x6 512x128 OCT, and Macula 6x6 360x360 OCTA; exported in
        .fda file format and converted to DICOM for the dataset; 6 images per participant.
      - >-
        Topcon Triton DRI OCT (Topcon Healthcare): 3D(H)+Rad 12x9 512x256 OCT, Macula 6x6
        320x320 OCTA and Macula 12x12 512x512 OCTA; exported in .fda file format and converted to
        DICOM; 6 images per participant. Uses a 1,050 nm swept-source light source and a
        non-mydriatic colour fundus camera.
      - >-
        Zeiss Cirrus 5000 (Carl Zeiss Meditec AG, Jena, Germany): Disc Cube 200x200 OCT, Macula
        Cube 512x128 OCT, Macula 6x6 OCTA and Disc 6x6 OCTA; DICOM; 8 images per participant. The
        Cirrus 5000 Angioplex also provides a 60-degree OCTA widefield view, 8x8 mm single scans
        and a 14x14 mm automated OCTA montage.
      - >-
        Heidelberg Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO): macula-centred imaging;
        exported in .sdt file format and converted to DICOM; 2 images per participant. FLIO is
        performed last in the visit because it takes longer than a standard Spectralis OCT and
        exposes participants to uncomfortable light levels.
      - >-
        All retinal images are collected under dilated conditions except for the Optomed. All
        participant images are exported from imaging devices in their raw format, and some
        required conversion to DICOM prior to upload.
  - name: At-home monitoring devices
    mechanism_details:
      - >-
        Dexcom G6 Continuous Glucose Monitor (Dexcom, Inc., San Diego, California): blood glucose
        measurements in mg/dL every 5 minutes, output in .csv. Participants are masked to the
        results during the monitoring period. Participants already wearing a Dexcom G6 may either
        place an additional study sensor at least 3 inches from their own, or share data through
        Dexcom Clarity; those already wearing a sensor may also consent to download of up to 90
        days of prior glucose values, for up to 100 days total.
      - >-
        Garmin Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland):
        number of steps, heart rate, sleep duration (circadian and diurnal rhythm) and oxygen
        saturation; exported in .FIT file format and converted to the mHealth standard for the
        dataset. The dataset structure additionally contains respiratory rate, stress and
        physical activity calorie directories for this device.
      - >-
        Custom environmental sensor, the LeeLab Anura, designed at the Karalis Johnson Retina
        Center, University of Washington (Seattle, Washington): ambient temperature, relative
        humidity, nitrogen oxides (NO and NO2), volatile organic compounds, particulate matter
        (PM1.0, PM2.5, PM4, PM10) and 11 multi-spectral light intensity measurements; output in
        .csv. Component datasheets referenced in the dataset structure include the ams-OSRAM
        AS7431, the DS3231 precision real-time clock and the Sensirion SEN5x environmental node.
      - >-
        Participants are sent home with the three devices and instructed to use them continuously
        for 10 days, then return them to study staff by overnight mail or in person. The
        environmental sensor and fitness tracker were specifically chosen with participant
        privacy as a primary concern: they do not capture video or audio, are not equipped with
        GPS location monitoring, and are not synced with participant-owned devices. Participants
        return the devices with a data sheet indicating which wrist the tracker was worn on,
        their dominant hand, and where the environmental sensor was placed in the home.
  - name: Biospecimen collection and processing
    mechanism_details:
      - >-
        Blood (53 mL per the protocol publication; approximately 50 to 60 mL per the IRB
        protocol) and a urine specimen are collected during the study encounter. Participants
        need not be fasting; the time of last oral intake is recorded and a snack is available.
      - >-
        One EDTA vacutainer is delivered to a local CLIA-certified clinical laboratory for
        complete blood count analysis on fresh whole blood on the day of collection.
      - >-
        Whole blood, plasma, serum and urine for central assays are batch-shipped to the
        University of Washington Nutrition and Obesity Research Center (NORC); samples are first
        stored locally at UAB and UCSD at -70 C and shipped on dry ice approximately once per
        quarter.
      - >-
        Plasma, serum and buffy coats collected at UW and UCSD are batch-shipped to the UAB
        Center for Clinical and Translational Science for a central study-wide biobank. Genomic
        DNA extractions from stored buffy coats are performed at UAB CCTS. CPT mononuclear cell
        preparation tubes are processed centrally at UAB CCTS because of the complexity of
        isolating and cryopreserving peripheral blood mononuclear cells; PAXgene RNA vacutainers
        are stable for up to 72 hours, allowing overnight shipment from UW and UCSD to UAB.
      - >-
        Biorepository specimens comprise buffy coats, genomic DNA, plasma, serum, PAXgene
        vacutainers and peripheral blood mononuclear cells, stored at -80 C or at cryogenic
        temperatures (PBMC) in small aliquots. Biobanked samples will eventually be available to
        scientists according to procedures and policies that are in development.

sampling_strategies:
  - name: Composition of the released dataset
    is_sample: false
    source_data:
      - >-
        All participants enrolled in AI-READI whose data fall within the collection window for
        this version.
    strategies:
      - >-
        The dataset is stated to contain all possible instances, specifically data from all
        participants who had been enrolled during the covered data collection period.
    description: >-
      The healthsheet preprocessing section answers "N/A" to the question of sampling strategy
      for a sample from a larger set, consistent with the statement that all enrolled
      participants are included.
  - name: Study recruitment sampling
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - >-
        All patients aged 40 years or older who had a medical encounter within each health
        system site (UAB, UCSD, UW) between 2020 and 2025. Patients with T2DM and pre-diabetes
        are identified by screening electronic health records for ICD-10 diagnosis codes E11.X
        and R73.09 respectively; patients without diabetes will not have encounters with these
        ICD codes.
    strategies:
      - >-
        Non-Probability Sample, as recorded in the study description.
      - >-
        Triple-balanced recruitment in equal proportions across four self-reported race/ethnic
        groups (Asian, Black, White, Hispanic), four categories of T2DM status (no diabetes;
        pre-diabetes or lifestyle-controlled; controlled by oral or non-insulin injectable
        medications; insulin-controlled) and biological sex.
      - >-
        Participants are recruited in waves; for each wave a contact pool is identified by
        screening electronic health records at each site, and UAB selects a stratified sample of
        potential participants based on the sampling scheme. The composition and size of each
        wave are influenced by observed participation characteristics of race/ethnicity, gender,
        T2DM severity and site.
      - >-
        Over 3-plus years of recruitment, approximately 50,000 invitation letters from each site
        are sent by mail and email to potentially eligible participants identified through the
        electronic medical record search, directing them into an online REDCap recruitment
        interface via personalised links, access codes and QR codes.
    why_not_representative:
      - >-
        Rather than targeting the demographic distribution of the US population, the study
        intentionally recruits equal numbers of four racial/ethnic groups and four diabetes
        severity categories, because building balanced datasets is critical for developing
        unbiased machine learning models.
      - >-
        The cohort does not include other races/ethnicities such as Pacific Islanders and Native
        Americans, and recruitment is predominantly urban and hospital-based.

data_collectors:
  - name: AI-READI study team
    role: >-
      Clinical research coordinators, research assistants, data managers, phlebotomists,
      laboratory assistants, project managers, software and cloud engineers, data scientists and
      investigators
    collector_details:
      - >-
        Details about the AI-READI team members involved in the data collection process are
        stated to be available at https://aireadi.org/team.
      - >-
        Clinical research coordinators are responsible for contacting and consenting
        participants, ushering them through the research visit, conducting study visits including
        collection of ophthalmologic images, training participants on continuous glucose
        monitoring and fitness tracker use, and ensuring return of all study materials. Research
        assistants perform these tasks under the direction of the study coordinator or project
        manager and handle data upload and management from each clinic visit.
      - >-
        Database managers ingest data into the REDCap database and extract it for processing;
        research and data scientists process data for release and standards development; software
        engineers design, implement and test the data curation pipelines; cloud engineers manage
        the cloud infrastructure; phlebotomists collect blood; lab assistants process and ship
        samples; domain experts advise on each medical domain.
      - >-
        Effort was supported by NIH award OT2OD032644 based on percentage of effort contributed,
        with salaries aligned to the funding guidelines at each site.
    description: >-
      The Community Advisory Board of 11 persons from the three sites, including diversity in
      race and ethnicity as represented in the AI-READI sample, contributes to the development of
      the protocol and evaluates consent forms and research protocols.

collection_timeframes:
  - name: Data collection window for version 3.0.0
    start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details:
      - >-
        The FAIRhub dataset description records a Collected date of 2023-07-19/2025-05-01, and
        the release documentation states that this version contains data from 2280 participants
        collected between 19 July 2023 and 1 May 2025.
      - >-
        The BMJ Open protocol states that enrolment began on 18 July 2023 and will continue until
        30 November 2026, that preliminary pilot enrolment occurred between 18 July 2023 and
        30 November 2023, and that the formal data collection process began on 1 December 2023.
        The study description records an actual start date of 2023-07-19 and an anticipated
        completion date of 2027-01-01, with overall status "Enrolling by invitation".
      - >-
        The overall project timeline spans four years: one year dedicated to protocol development
        and training, and years 2 to 4 allocated for subject recruitment and data collection.
        Approximately 4% of participants are expected to undergo a follow-up examination in
        year 4; elsewhere the project states that about 10% of the cohort will be invited to
        return.
      - >-
        Data are collected at the time of the participant's study visit and the following 10-day
        at-home monitoring period, so the collection timeframe matches the creation timeframe of
        the underlying data, except for extracted medical-record and driving-record history and
        for optional retrospective CGM data covering up to 90 days before the visit.

direct_collection:
  - name: Direct collection from participants
    is_direct: true
    collection_details:
      - >-
        The data was collected directly from participants across the three recruiting sites.
      - >-
        Recruitment pools were identified by screening electronic health records for diabetes and
        prediabetes ICD-10 codes for all patients who had an encounter with the sites' health
        systems within the past two years.
      - >-
        Some study data are obtained from other sources: medical records at the study sites, and
        driving and accident records obtained from the Department of Licensing.

collection_notifications:
  - name: Notification of data collection
    notification_details:
      - >-
        Each individual was aware of the data collection, as this was not passive data collection
        or secondary use of existing data, but rather active data collection directly from
        participants.
      - >-
        Individuals in each recruitment pool are mailed a hardcopy invitation letter and sent an
        invitation email, both personalised, directing them into the online REDCap recruitment
        interface where they can read an overview of the research programme, expectations for
        participation and answers to frequently asked questions, download the informed consent
        document, request a call back from study staff, complete a screening survey and enroll.
      - >-
        Participants are also directed to the AI-READI website (https://aireadi.org) where they
        can learn more about the study, including the study FAQ. Follow-up phone calls are made
        by research coordinators to those who did not respond and those who initiated contact.

collection_consents:
  - name: Informed consent for collection and use
    consent_details:
      - >-
        Written informed consent is provided by all participants. Informed consent to participate
        was required before participation in any part of the protocol, including questionnaires.
      - >-
        Potential participants were given the option to read all consent documentation
        electronically (e-consent) before their visit and give consent with an electronic
        signature without verbal communication with a clinical research coordinator. Participants
        may access e-consent documentation in REDCap and decide at that point that they do not
        want to participate or would like additional information. For most participants informed
        consent is performed remotely by computer, tablet or smart phone; if participants did not
        select the electronic option it is performed in person at the start of the visit.
      - >-
        The approved consent form for the principal project site, University of Washington, is
        stated to be available at
        https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
        The other clinical sites had IRB reliance and used the same consent form, with minor
        institution-specific language incorporated depending on individual institutional
        requirements.
      - >-
        The consent form includes a table at its beginning clarifying which information will be
        publicly available and which will require an application and approval process containing
        privacy protection. Subjects are asked to confirm their understanding of study activities
        and requirements. In-person consent is obtained in a private room with opportunity to ask
        questions; upon signing, the electronic consent form is automatically emailed to the
        subject, who may request additional copies for the duration of the study.

consent_revocations:
  - name: Withdrawal of consent
    revocation_details:
      - >-
        Participants were permitted to withdraw consent at any time and cease study
        participation. However, any data that had been shared or used up to that point would stay
        in the dataset. This is clearly communicated in the consent document.
      - >-
        Study subjects have the opportunity to ask questions throughout the study and are
        reminded that they have the right to change their mind about study participation.

missing_data_documentation:
  - name: Missing data in the release
    missing_data_patterns:
      - >-
        Not all modalities are available for all participants; missingness is at the level of
        whole modalities for a participant rather than scattered fields.
      - >-
        In survey data, skipped questions and incomplete responses occur.
    missing_data_causes:
      - Some participants elected not to participate in some study elements.
      - >-
        In a few cases the data collection device did not have any stored results or was returned
        too late to retrieve the results, for example because the battery died or data was lost.
      - >-
        In a few cases there may have been a data collision at some point in the process and data
        has been lost.
      - >-
        For operator-dependent imaging modalities, quality issues may lead to skipping the
        modality, producing missing data.
    handling_strategy: >-
      No imputation strategy is described. During data entry, missing data that could be directly
      filled from other portions of an individual's record were corrected under the guidance and
      approval of the site principal investigator; where there was no logical or appropriate way
      to correct the data, the site PI reviewed the values and decided whether they should be
      removed.

raw_data_sources:
  - name: REDCap survey and clinical data entry
    source_description: >-
      Participant-reported questionnaire responses and clinician-entered clinical measurements
      captured in REDCap, including medications assessment, vitals, visual acuity, contrast
      sensitivity, monofilament test results and complete blood count results.
    source_type:
      - user input
      - manual data entry
      - electronic data capture system
    access_details: >-
      Raw REDCap exports are not distributed. The exact forms used for data collection in REDCap
      are stated to be available at https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf.
    raw_data_format:
      - REDCap export
      - CSV
  - name: Clinical and research laboratory testing
    source_description: >-
      Blood and urine assays performed by CLIA-certified laboratories local to each data
      collection site (complete blood count on fresh whole blood) and by the University of
      Washington Nutrition and Obesity Research Center testing facility on stored frozen samples
      (all other tests).
    source_type:
      - laboratory assay
    access_details: >-
      Blood and urine testing results from the NORC laboratory are provided to the project in
      .csv format and released within the clinical_data directory after mapping to the OMOP CDM.
    raw_data_format:
      - CSV
  - name: Imaging and physiological devices
    source_description: >-
      Retinal imaging devices (Optomed Aurora, iCare EIDON, Heidelberg Spectralis and FLIO,
      Topcon Maestro2 and Triton, Zeiss Cirrus 5000) and the Philips PageWriter TC30
      electrocardiograph, exported in their native formats at the point of collection.
    source_type:
      - sensor
      - medical imaging device
    access_details: >-
      Native exports are held by the project; the released dataset contains the standardized
      conversions.
    raw_data_format:
      - DICOM
      - .fda
      - .sdt
      - .xml
  - name: Wearable and home monitoring devices
    source_description: >-
      Dexcom G6 continuous glucose monitor, Garmin Vivosmart 5 activity monitor and the custom
      LeeLab Anura environmental sensor, each worn or placed for a 10-day at-home monitoring
      period.
    source_type:
      - sensor
      - wearable device
    raw_data_format:
      - CSV
      - .FIT
  - name: Electronic health records and external registries
    source_description: >-
      Electronic health records at the three sites, used both for recruitment screening and for
      extraction of general health, eye health, medical and surgical history, diabetes,
      medications, laboratory records and prior medical imaging; and driving and accident records
      obtained from the Department of Licensing.
    source_type:
      - database
      - administrative records
    access_details: >-
      These sources are held by the study team; past health records, medications and traffic and
      accident reports are described as controlled-access content rather than part of the public
      release.

ethical_reviews:
  - name: University of Washington Institutional Review Board approval
    review_details:
      - >-
        AI-READI was approved by the Institutional Review Board of the University of Washington,
        approval number STUDY00016228, including reliance agreements with the IRBs of the
        University of Alabama at Birmingham and the University of California, San Diego.
      - >-
        The initial IRB approval at the University of Washington was received on 20 December 2022.
        The initial approval letter is stated to be available at
        https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf.
      - >-
        An annual renewal application to the IRB about the status and progress of the study is
        required and due within 90 days of expiration.
      - >-
        The study description records human subject review status "Submitted, approved", that the
        study is not FDA-regulated for either drug or device, and that there is no Data Monitoring
        Committee.
      - >-
        The reviewing organization referenced here is the University of Washington Institutional
        Review Board (Human Subjects Division), ROR https://ror.org/00cvxb145, acting as IRB of
        record with reliance agreements from the UAB and UCSD IRBs.
      - >-
        The BMJ Open protocol also records ClinicalTrials.gov approval number STUDY00016228; the
        study description records the ClinicalTrials.gov secondary identifier NCT06002048.
      - >-
        UCSD has a Health Data Oversight Committee that oversees data sharing with other
        institutions; approval is contingent on IRB approval. The State of California requires
        inclusion of the Bill of Rights in the UCSD informed consent form.
    reviewing_organization: https://ror.org/00cvxb145

data_protection_impacts:
  - name: Data protection impact analysis
    impact_details:
      - >-
        No data protection impact analysis has been conducted.
      - >-
        Related safeguards are described elsewhere: to prevent reidentification attempts the
        project states it is implementing a robust data dissemination system, a strict licence
        agreement and data watermarking for both public and controlled sets.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      University of Washington IRB approval number STUDY00016228, initially approved
      20 December 2022, with reliance agreements from the IRBs of the University of Alabama at
      Birmingham and the University of California, San Diego. Annual renewal is required.
  ethics_review_board:
    - University of Washington Institutional Review Board (Human Subjects Division)
    - University of Alabama at Birmingham IRB (reliance agreement)
    - University of California, San Diego IRB (reliance agreement)
  special_populations:
    - >-
      No special populations are purposefully included. Pregnancy and gestational diabetes are
      exclusion criteria, type 1 diabetes is an exclusion criterion, and eligibility is limited
      to adults aged 40 and older, so minors are not enrolled.
    - >-
      The project states it will engage in a tribal consultation to address barriers and
      facilitators of participation with the goal of collecting similar data within a Native
      American cohort in an ethical and respectful manner, through engagement with the Native
      Biodata Consortium. This is described as a separate co-learning effort rather than part of
      the released cohort.
  regulatory_compliance:
    - >-
      HIPAA Privacy Rule: the public set is stripped of Protected Health Information as defined
      by the HIPAA Privacy Rule via the Safe Harbor method, as well as information related to
      participant sex and race/ethnicity to prevent stigmatization of findings.
    - >-
      NIH Genomic Data Sharing (GDS) Policy: the data license agreement requires licensees to
      comply with all data security and privacy standards established by NIH under its GDS
      Policy, referencing the NIH Best Practices for Controlled-Access Data Subject to the NIH
      GDS Policy.
    - >-
      Results returned to participants are sent by HIPAA-compliant encrypted email.

informed_consent:
  - name: AI-READI informed consent procedures
    consent_obtained: true
    consent_type:
      - written
      - electronic (e-consent with electronic signature via REDCap)
    consent_documentation:
      - >-
        The approved University of Washington consent form is stated to be available at
        https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
      - >-
        Signed electronic consent forms are automatically emailed to subjects; additional copies
        can be requested from the study coordinator for the duration of the study.
      - >-
        The consent process includes a table at the beginning of the form clarifying which
        information will be publicly available and which will require an application and approval
        process with privacy protection.
    withdrawal_mechanism:
      - >-
        Participants may withdraw consent at any time and cease study participation; data already
        shared or used up to that point remains in the dataset, as communicated in the consent
        document.
    consent_scope:
      - >-
        The FAIRhub dataset description records consent type
        "ConsentSpecifiedNotElsewhereCategorised" with no non-commercial restriction, no
        geographic restriction, no research-type restriction, no genetic-only restriction and no
        methods restriction recorded, and states: "The public version of the dataset can only be
        used for type 2 diabetes related research. A private version will allow for more generic
        use."
      - >-
        Consent covers secondary use, banking and future sharing: language regarding future use
        and sharing is included in the informed consent form, and the IRB protocol describes
        planned deposition into a public deidentified database and a controlled database
        requiring a data user agreement.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
    - >-
      Eligibility is restricted to adults aged 40 and older who are able to provide consent, so
      minors and individuals unable to consent are not enrolled. Pregnancy, gestational diabetes
      and type 1 diabetes are exclusion criteria.
    - >-
      Prisoners are not a target population and no prisoner-specific procedures are described.
    - >-
      Transportation assistance (rideshare services) was offered to study participants who
      endorsed barriers to transporting themselves to study visits, and the study covers
      reasonable costs for parking, public transit or rideshare fees related to the study visit.
    - >-
      A Community Advisory Board of 11 persons from the three sites, including diversity in race
      and ethnicity as represented in the AI-READI sample, contributes to protocol development and
      reviews consent forms.
    - >-
      For subjects who have difficulty viewing the study consent, a study team member reads the
      consent form to them; if a person is functionally illiterate, a study team member signs and
      notes the reason for the missing subject signature in the presence of an impartial witness.
  description: >-
    Accessibility measurements were not specifically assessed. Non-English-speaking participants
    are not initially enrolled because translating all study materials, not only the consent
    form, was not possible at the time; Spanish translation of the consent form is planned if
    recruitment goals for Hispanic participants are not met.

participant_privacy:
  - name: Privacy protections for the released dataset
    anonymization_method:
      - >-
        The FAIRhub dataset description records de-identification type "NoDeIdentification" with
        the detail: "No identifiers were collected so no active de-identification was necessary
        but we checked that no identifiable data per US HIPAA were present in the data." It marks
        direct-identifier and HIPAA de-identification as satisfied, and dates, non-arbitrary
        details and k-anonymity as not applied.
      - >-
        The Nature Metabolism comment states that the public set is stripped of Protected Health
        Information as defined by the HIPAA Privacy Rule via the Safe Harbor method, as well as
        information related to participant sex and race/ethnicity to prevent stigmatization of
        findings.
      - >-
        The release documentation states that the data contain no PHI and that information
        related to the sex and race/ethnicity of participants, as well as medication used, has
        been removed.
    reidentification_risk:
      - >-
        The project states that, to the extent of its knowledge, it does not currently anticipate
        uses of the dataset that could result in unfair treatment or harm, but that there is a
        theoretical risk of future re-identification.
      - >-
        AI algorithms can infer individual patient characteristics and could facilitate
        individual-level identification; to prevent reidentification attempts the project is
        implementing a robust data dissemination system, a strict licence agreement and data
        watermarking for both public and controlled sets.
      - >-
        The license agreement prohibits using the data, alone or with other information, to
        compromise the confidentiality of a data subject, to identify or contact any data subject
        or group of data subjects, to extract or extrapolate identifying information, or to
        establish a data subject's membership in a particular group of persons.
    privacy_techniques:
      - data watermarking
      - HIPAA Safe Harbor removal of protected health information
      - removal of sex, race/ethnicity and medication information from the public release
      - access gated by verified identity login and self-attestation
      - strict license agreement with secondary-sharing restrictions
    data_linkage:
      - >-
        More sensitive data, including 5-digit zip code, sex, race, ethnicity, genetic sequencing
        data, past health records, medications, and traffic and accident reports, are held under
        controlled access and are only available to scientists whose institutions have completed
        legal and privacy use agreements with the AI-READI research programme.
    description: >-
      Devices sent home with participants were specifically chosen with privacy in mind: they do
      not capture video or audio, are not GPS-equipped, and are not synced with participant-owned
      devices.

participant_compensation:
  - name: Participant compensation
    compensation_provided: true
    compensation_type:
      - monetary stipend
      - reimbursement of travel costs
    compensation_amount:
      - >-
        200 US dollars for the study visit, funded through the grant.
      - >-
        The study covers reasonable costs for parking, public transit or rideshare fees related
        to the study visit; participants may incur unreimbursed transport costs where fees exceed
        25 US dollars.
    compensation_rationale:
      - >-
        The stipend is provided when the study receives the final data from participants and the
        study devices are returned, typically at least two weeks after the study visit to allow
        for the 10-day home monitoring period and device return by mail. The payment is not
        prorated. The amount may change in future years depending on study funding, with the IRB
        notified of any change.
      - >-
        The same type and amount of compensation is given to participants asked to return in
        year 4 of the study.

preprocessing_strategies:
  - name: Mapping to standard data models and formats
    preprocessing_details:
      - >-
        All data are mapped to applicable data standard formats, such as the Observational
        Medical Outcomes Partnership (OMOP) Common Data Model for clinical data and the DICOM
        format for retinal imaging. Each CSV file in the clinical_data directory is a one-to-one
        mapping to the OMOP CDM tables.
      - >-
        For some devices the data are transformed from a proprietary state into a standard model
        format prior to upload: Topcon Maestro2 and Triton images are exported as .fda and
        converted to DICOM; Heidelberg FLIO images are exported as .sdt and converted to DICOM;
        Garmin activity data are exported as .FIT and converted to the Open mHealth standard.
      - >-
        Electrocardiography files follow the WaveForm DataBase (WFDB) standard; environmental
        sensor files follow the NASA ASCII File Format Guidelines for Earth Science Data;
        continuous glucose monitoring and wearable activity data follow Open mHealth.
      - >-
        The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1: data are
        organized at the root level into one directory per datatype, then one folder per modality,
        then one folder per device, then one folder per participant named after the participant's
        study ID number. Metadata files including manifest.tsv accompany each datatype directory.
      - >-
        All data are stored and shared using FAIRhub as "AI-ready", which the project states
        enables immediate AI/ML research without reformatting and preprocessing.
    description: >-
      The project states that details about the data processing approaches for each data
      domain/modality are described in the dataset documentation at https://docs.aireadi.org.
    used_software:
      - id: https://fairhub.io/
        name: FAIRhub
        url: https://fairhub.io/
        description: >-
          Cloud-based data management, curation and sharing platform developed for the AI-READI
          project on Microsoft Azure, into which all data collection sites upload data at regular
          intervals, and through which each dataset version is released.
      - id: https://www.project-redcap.org
        name: REDCap
        description: >-
          Electronic data capture system used for the recruitment interface, e-consent,
          questionnaires and entry of visit clinical data, hosted in the UW REDCap system.
      - id: https://cds-specification.readthedocs.io/en/v0.1.1/
        name: Clinical Dataset Structure (CDS) specification
        version: 0.1.1
        url: https://cds-specification.readthedocs.io/en/v0.1.1/
        description: >-
          Standard developed by the project for consistently structuring and describing clinical
          research datasets, used to organize and name the dataset's directories and metadata
          files.

cleaning_strategies:
  - name: Quality control at data entry and central processing
    cleaning_details:
      - >-
        Several quality control measures were used at the time of data entry and acquisition. For
        example, clinical data outside expected minimum and maximum ranges were flagged in REDCap
        and were visible in reports viewed by clinical research coordinators and data managers.
      - >-
        Using the REDCap reports as guides, data managers and coordinators examined participant
        records and determined whether an error was likely. Data were checked for credibility
        (range checks), incorrect flow through prescribed skip patterns, missing data that could
        be directly filled from other portions of an individual's record, and the omission or
        duplication of records, and were edited where errors were detected.
      - >-
        Editing was only done under the guidance and approval of the site principal investigator.
        If corrected data were available elsewhere in the respondent's answers, the error was
        corrected; if there was no logical or appropriate way to correct the data, the site PI
        reviewed the values and decided whether they should be removed.
      - >-
        The data manager at each data site is responsible for the quality control of all data
        before uploading to FAIRhub.
      - >-
        No instances were excluded from the dataset at the time of preprocessing.
    used_software:
      - id: https://ohdsi.github.io/DataQualityDashboard/
        name: OMOP CDM Data Quality Dashboard (DQD)
        url: https://ohdsi.github.io/DataQualityDashboard/
        description: >-
          The clinical_data directory includes a dqd_omop.json file supporting OMOP CDM data
          quality analysis; the DQD tool runs a set of more than 3500 data quality checks against
          an OMOP CDM instance.

labeling_strategies:
  - name: Labeling
    labeling_details:
      - >-
        No labels are provided and no specific labeling was performed, as the dataset is a
        hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML
        applications.
      - >-
        No labellers were engaged, no gold-standard or proxy label definitions were applied, and
        no inter-annotator agreement statistics exist.
      - >-
        The project states that it has no formal guidelines in place for future researchers
        creating new labels or defining new tasks.

raw_sources:
  - name: Availability of raw data
    raw_data_details:
      - >-
        The raw data is saved and expected to be preserved by the AI-READI project at least for
        the duration of the project, but is not anticipated to be shared outside the project team
        at present, because it has not been mapped to standardized terminologies and because it
        may accidentally include personal health information or personally identifiable
        information, for example in free text fields.
      - >-
        There is a possibility that raw data may be included in future releases of the
        controlled access dataset.
      - >-
        Device exports are held in their native formats locally at each site before conversion and
        upload; the released dataset contains the standardized conversions rather than the native
        exports.

existing_uses:
  - name: Prior uses of the dataset
    description: >-
      The project answers "No" to whether the dataset has been used for any tasks already. The
      FAIRhub record reports 24,636 views and a citation count of 0 for this version. Those who
      download and use AI-READI data are encouraged to publish their results in the scientific
      literature.

use_repository:
  - name: Repository of known uses
    repository_details:
      - >-
        The project answers "No" to whether there is a repository that links to any or all papers
        or systems that use the dataset, besides Google Scholar. The FAIRhub record displays
        "Cited by" and "Dataset Uses" panels but the captured record reports zero citations for
        this version.

other_tasks:
  - name: Additional supportable tasks
    task_details:
      - >-
        The dataset is described as hypothesis-agnostic and intended to facilitate multiple
        potential downstream AI/ML applications beyond any single predefined task.
      - >-
        The dataset is stated to be suitable for reconstructing a temporal atlas of T2DM
        development and reversal towards health, and for defining disease trajectories and
        underlying genetic links in different racial/ethnic cohorts.
      - >-
        The AI-READI Data License Agreement v1.0 grants a license to download, reproduce and use
        the data and to create derivative works for research and commercial purposes, subject to
        its restrictions. The FAIRhub v3.0.0 access terms require agreement to use the data only
        for type 2 diabetes related research; the project states that a private version will
        allow for more generic use.

future_use_impacts:
  - name: Considerations affecting future uses
    impact_details:
      - >-
        The project does not currently anticipate uses of the dataset that could result in unfair
        treatment or harm, but notes a theoretical risk of future re-identification.
      - >-
        Factors that may limit generalization of derived models include the number and diversity
        of devices, the number and diversity of recording sites, predominantly urban and
        hospital-based recruitment, and the absence of other races and ethnicities such as
        Pacific Islanders and Native Americans.
      - >-
        Because enrollment is ongoing, interim releases may not have achieved balanced
        distribution across race/ethnicity, sex and diabetes severity groups.
      - >-
        There are no plans for the researchers who collected the dataset to develop commercial
        products or file patents, but the dataset is made available with a commercial-friendly
        license and products or patents may be developed from it in future.

discouraged_uses:
  - name: Uses restricted by license
    discouragement_details:
      - >-
        The AI-READI dataset license imposes restrictions on the usage of the data; the
        restrictions are described in the license files available at
        https://doi.org/10.5281/zenodo.17555036. The healthsheet answers the question about
        discouraged tasks by referring to those license terms.
      - >-
        Uniform data collection protocols and site selection were intended to minimize sampling
        bias, but the cohort's composition should be considered before applying the dataset to
        populations it does not represent.

intended_uses:
  - name: Intended uses of the AI-READI dataset
    examples:
      - >-
        Artificial intelligence and machine learning research into type 2 diabetes mellitus,
        including salutogenic pathways from disease back to health.
      - >-
        Downstream pseudotime manifold analysis to predict disease trajectories from multimodal
        data across a range of disease severity.
      - >-
        Development of multimodal models spanning survey, clinical, imaging, waveform, wearable
        and environmental data for a single cohort.
      - >-
        Use as a model or blueprint for future efforts to develop other medical and health
        datasets targeted for AI/ML.
    use_category:
      - research
    usage_notes: >-
      Access to the public version requires agreeing to use the data only for type 2 diabetes
      related research. The dataset is intended solely as a research resource and, per the license
      agreement, must not be used to make clinical treatment decisions. Recommended
      training/validation/test splits are supplied in participants.tsv.

prohibited_uses:
  - name: Clinical treatment decisions
    description: >-
      The license agreement states that the licensee shall not make clinical treatment decisions
      based on the data.
    prohibition_reason:
      - The data is intended solely as a research resource.
  - name: Re-identification or targeting of data subjects
    description: >-
      The licensee shall not use or attempt to use the data, alone or in concert with other
      information, to compromise or otherwise infringe the confidentiality of information on an
      individual data subject and their right to privacy, to identify or contact any individual
      data subject or group of data subjects, to extract or extrapolate identifying information
      about a data subject, to establish a data subject's membership in a particular group of
      persons, or otherwise to cause harm or injury to any data subject.
    prohibition_reason:
      - License restriction
      - Privacy risk to study participants
  - name: Onward transfer of the data to non-licensees
    description: >-
      The licensee shall not transfer, license, sublicense, sell, assign, display, share or
      otherwise convey any portion of the data or any derivative work to any third party other
      than another licensee bound by an identical agreement with the licensor. Models developed
      using the data may be distributed provided they do not themselves contain the data or a
      modified version of it, and provided the licensee first undertakes all reasonable efforts to
      minimise the likelihood that data can be memorized, derived, reconstructed or reconstituted
      through the use or construction of such models.
    prohibition_reason:
      - License restriction on secondary sharing
  - name: Use of the public version outside type 2 diabetes research
    description: >-
      Accessing the dataset requires agreeing to use the data only for type 2 diabetes related
      research. The project states that a private version will allow for more generic use.
    prohibition_reason:
      - Access condition recorded in the dataset access details and consent terms

distribution_formats:
  - name: Distribution through the FAIRhub platform
    access_urls:
      - https://fairhub.io/datasets/3
      - https://doi.org/10.60775/fairhub.3
      - https://fairhub.io/
    description: >-
      The dataset is distributed through the FAIRhub platform, a Microsoft Azure cloud-based data
      management, curation and sharing platform developed for this project, and is identified by
      the DOI 10.60775/fairhub.3. The FAIRhub dataset description lists the formats
      application/dicom, text/markdown, text/csv and application/json. Access type is recorded as
      "PublicDownloadSelfAttestationRequired": accessing the dataset requires logging in through a
      verified ID system, agreeing to use the data only for type 2 diabetes related research, and
      agreeing to the license terms. The v3.0.0 documentation additionally mentions a mini-subset
      version of the dataset and Azure Storage access. The project states that all data files are
      in formats accessible with free software commonly used for such data types, so no specific
      software is required.

distribution_dates:
  - name: Release dates of dataset versions
    release_dates:
      - '2024-05-03'
      - '2024-11-08'
      - '2025-11-17'
    description: >-
      FAIRhub records version 1.0.0 (DOI 10.60775/fairhub.1) on 3 May 2024, version 2.0.0 (DOI
      10.60775/fairhub.2) on 8 November 2024, and version 3.0.0 (DOI 10.60775/fairhub.3) on
      17 November 2025. The healthsheet gives the same sequence as May 2024, November 2024 and
      November 2025. The BMJ Open protocol, written earlier, states that the publicly accessible
      dataset from pilot data collection was made available in May 2024 and that all data
      collected through 31 July 2024 were made available in November 2024. Deidentified data are
      released approximately yearly.

third_party_sharing:
  - name: Distribution to third parties
    is_shared: true
    description: >-
      The dataset will be distributed and be available for public use, through the FAIRhub
      platform, subject to verified-ID login, a self-attestation of type 2 diabetes related
      research use, and acceptance of the license terms. Two sets are released at each version: a
      controlled access set and a publicly accessible set with fewer requirements for access. The
      controlled access set contains all data available in the publicly accessible set plus more
      sensitive data, available only to scientists whose institutions have completed legal and
      privacy use agreements with the AI-READI research programme; its requirements were being
      developed by the Data Access Committee at the time of the protocol publication.

license_and_use_terms:
  license_terms:
    - >-
      The FAIRhub record for version 3.0.0 names the rights statement "AI-READI custom license
      v2.0" with rights URI https://doi.org/10.5281/zenodo.17555036. The release documentation
      describes it as a custom license specifically tailored to enable reuse of the AI-READI
      dataset (and other clinical datasets) for commercial or research purposes while putting
      strong requirements around data usage, security and secondary sharing to protect study
      participants, especially when data is reused for AI and ML applications. The text of v2.0 is
      not contained in the source bundle.
    - >-
      The license document included in the source bundle is the earlier University of Washington
      AI-READI Data License Agreement v1.0 (https://doi.org/10.5281/zenodo.10642459). It grants a
      non-exclusive, non-transferable license to download, reproduce and use the data and to
      create derivative works for research and commercial purposes; restricts onward sharing to
      other licensees bound by identical terms; permits distribution of models that do not contain
      the data; prohibits clinical treatment decisions and re-identification; requires compliance
      with NIH Genomic Data Sharing security standards; terminates automatically on breach;
      retains title and all IP rights with the Licensor and its suppliers; disclaims warranties;
      caps aggregate liability at one US dollar; and requires indemnification of the Licensor.
    - >-
      The FAIRhub record lists the license as "Health Data License". No fees are stated for access
      to the dataset.
    - >-
      Use of the dataset requires citation of the resources specified in the AI-READI
      documentation, and the license requires acknowledgement of the source and any funder of the
      data in publications reporting its use.
    - >-
      The licensing contact referenced here is Aaron Lee (ORCID 0000-0002-7452-1648), the central
      contact recorded in the FAIRhub study description, email contact@aireadi.org. The dataset
      README directs questions, suggestions or feedback to https://aireadi.org/contact and refers
      to the study_description.json and dataset_description.json metadata files included in the
      dataset for additional information about the contact person or entity, authors and
      contributors.
  data_use_permission:
    - disease_specific_research
  contact_person: https://orcid.org/0000-0002-7452-1648

ip_restrictions:
  restrictions:
    - >-
      The healthsheet answers the question about third-party IP-based restrictions by referring to
      the license (https://doi.org/10.5281/zenodo.17555036).
    - >-
      Under the AI-READI Data License Agreement v1.0, title to the data and all industrial and
      intellectual property rights therein remain solely and exclusively with the Licensor
      (University of Washington) and its suppliers, and the licensee shall not take any action
      inconsistent with such ownership. Any rights not expressly granted are reserved.
    - >-
      The IRB protocol records that there are no plans for the researchers involved in collecting
      the dataset to develop commercial products or file patents, but that the dataset will be
      publicly available with a commercial-friendly open-source license and products or patents
      may be developed from it in future.

regulatory_restrictions:
  regulatory_restrictions:
    - >-
      The healthsheet answers the question about export controls and other regulatory restrictions
      by referring to the license (https://doi.org/10.5281/zenodo.17555036); no export control
      regime is named.
    - >-
      HIPAA: the public set is stripped of Protected Health Information as defined by the HIPAA
      Privacy Rule via the Safe Harbor method. Results returned to participants are sent by
      HIPAA-compliant encrypted email.
    - >-
      NIH Genomic Data Sharing Policy: licensees must comply with the data security and privacy
      standards established by NIH under that policy.
  hipaa_compliant: compliant
  other_compliance:
    - >-
      The FAIRhub de-identification record states that no identifiers were collected, so no active
      de-identification was necessary, but that the project checked that no identifiable data per
      US HIPAA were present in the data.
    - >-
      Study conduct is subject to US human subjects research oversight through the University of
      Washington IRB with reliance agreements at UAB and UCSD; the study is recorded as not FDA
      regulated for drug or device.
  confidentiality_level: restricted
  description: >-
    Access to the public release is gated: it requires login through a verified ID system,
    agreement to use the data only for type 2 diabetes related research, and acceptance of the
    license terms. The controlled access set requires completed legal and privacy use agreements
    between the user's institution and the AI-READI research programme.

maintainers:
  - name: AI-READI team
    role: researcher
    maintainer_details:
      - >-
        The AI-READI team will be supporting and maintaining the dataset. The dataset is hosted on
        FAIRhub through Microsoft Azure.
      - >-
        For contact information the project refers to the README file included with the dataset,
        which directs questions, suggestions or feedback to https://aireadi.org/contact and to the
        study_description.json and dataset_description.json metadata files included in the
        dataset. The FAIRhub study description gives contact@aireadi.org as the central contact
        email.
      - >-
        The Data Manager at each data site is responsible for the quality control of all data
        before uploading to FAIRhub.

updates:
  frequency: >-
    Approximately once a year; new versions are released rather than existing versions updated.
  update_details:
    - >-
      The dataset gets released as static versions. The dataset will not be updated in place;
      rather, new versions of the dataset will be released with additional instances as more study
      participants complete the study visit.
    - >-
      There are plans to release new versions approximately once a year with additional data from
      participants enrolled since the last release. Enrollment is ongoing, and future versions
      will include larger numbers of participants.
    - >-
      Changes between versions are documented in detail in the CHANGELOG file included in the
      dataset and visible at docs.aireadi.org. A summary table records: v1.0.0 pilot, 204
      participants, 15+ data types, custom/ad hoc processing, released 5/3/2024; year 2 data, 863
      participants, +1 image device, automated plus custom processing, included in v2.0.0; year 3
      data, 1213 participants, +3 image devices, included in v3.0.0; v3.0.0 main study, 2280
      participants, 15+ data types, released 11/17/2025.
    - >-
      Between v2.0.0 and v3.0.0 the data fields and types are largely the same, except that the
      Snellen visual acuity variables were dropped so that only logMAR visual acuity measurements
      are available. Version 3.0.0 also introduces a new recommended data split.

retention_limit:
  retention_details:
    - >-
      There are no limits on the retention of the data associated with the instances.
    - >-
      The raw data is saved and expected to be preserved by the AI-READI project at least for the
      duration of the project.

version_access:
  latest_version_doi: 10.60775/fairhub.3
  versions_available:
    - 'Version 3.0.0, DOI 10.60775/fairhub.3, 17 November 2025, 3.82 TB, 356,343 files, 2280 participants'
    - 'Version 2.0.0, DOI 10.60775/fairhub.2, 8 November 2024, 2.01 TB, 165,051 files, 1067 participants'
    - 'Version 1.0.0, DOI 10.60775/fairhub.1, 3 May 2024, 204 participants (pilot data collection phase)'
  version_details:
    - >-
      The healthsheet answers the question about continued support for older versions with "N/A",
      noting that the dataset will not be updated and that new versions will be released with
      additional instances instead.
    - >-
      The FAIRhub page for version 2.0.0 states "This version of the dataset is no longer
      accessible. Please refer to the latest version." The corresponding v2.0.0 documentation
      states that it is for a version of the dataset which is no longer accessible and refers
      readers to the documentation for v3.0.0.
    - >-
      One version of the documentation exists for each version of the dataset, navigable from a
      version dropdown at https://docs.aireadi.org. Datasheets exist for earlier versions at
      https://docs.aireadi.org/docs/1/dataset/healthsheet and
      https://docs.aireadi.org/docs/2/dataset/healthsheet.

extension_mechanism:
  extension_details:
    - >-
      There is currently no mechanism for others to extend or augment the AI-READI dataset outside
      of those who are involved in the project.
    - >-
      The project shares its blueprint for collecting and sharing AI-ready datasets so that future
      data generation projects can follow it, through https://zenodo.org/communities/aireadi,
      https://github.com/AI-READI and https://aireadi.org, and states that it anticipates making
      the FAIRhub platform available for future data generation projects wishing to manage and
      share AI-ready clinical research datasets.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    The FAIRhub dataset description records de-identification type "NoDeIdentification" with the
    detail that no identifiers were collected so no active de-identification was necessary, but
    that the project checked that no identifiable data per US HIPAA were present. The Nature
    Metabolism comment states that the public set is stripped of Protected Health Information as
    defined by the HIPAA Privacy Rule via the Safe Harbor method.
  identifiers_removed:
    - protected health information as defined by the HIPAA Privacy Rule
    - sex
    - race and ethnicity
    - medications used
  deidentification_details:
    - >-
      The release documentation states that the data in this dataset contain no protected health
      information and that information related to the sex and race/ethnicity of participants, as
      well as medication used, has been removed.
    - >-
      The healthsheet questions on de-identification measures and on pre-processing for
      de-identification are left blank in the source record.
    - >-
      Data held under controlled access include 5-digit zip code, sex, race, ethnicity, genetic
      sequencing data, past health records, medications, and traffic and accident reports.
    - >-
      A theoretical risk of future re-identification is acknowledged; mitigations described
      include a robust data dissemination system, a strict licence agreement and data watermarking
      for both public and controlled sets.

related_datasets:
  - name: Version 2.0.0 of this dataset
    target_dataset: 10.60775/fairhub.2
    relationship_type: is_new_version_of
    description: >-
      FAIRhub version 2.0.0, published 8 November 2024, 2.01 TB across 165,051 files, containing
      data from 1067 participants. The FAIRhub page for this version states that it is no longer
      accessible and refers readers to the latest version.
  - name: Version 1.0.0 of this dataset
    target_dataset: 10.60775/fairhub.1
    relationship_type: is_new_version_of
    description: >-
      FAIRhub version 1.0.0, published 3 May 2024, containing data from 204 participants collected
      during the pilot data collection phase.
  - name: AI-READI mini version
    target_dataset: 10.60775/fairhub.4
    relationship_type: has_part
    description: >-
      The FAIRhub record for this dataset carries "child": 4 and the dataset page notes "A smaller
      version is available for pipeline development". The source manifest records FAIRhub record 4
      as a distinct "Mini Version" of 100 participants with DOI 10.60775/fairhub.4, intended for
      pipeline development rather than as a version of this dataset; it was not captured in the
      source bundle.

variables:
  - variable_name: NT-proBNP
    data_type: float
    measurement_technique: EDTA plasma laboratory assay at the UW Nutrition and Obesity Research Center
    description: >-
      N-terminal pro-B-type natriuretic peptide, included as a severity and outcome predictor of
      heart failure. Reported in pg/mL; the reference range provided by the testing laboratory
      varies by age.
  - variable_name: Troponin-T
    data_type: float
    measurement_technique: EDTA plasma laboratory assay at the UW Nutrition and Obesity Research Center
    description: Marker of myocardial injury, reported in ng/L.
  - variable_name: C-peptide
    data_type: float
    measurement_technique: EDTA plasma laboratory assay at the UW Nutrition and Obesity Research Center
    description: Indicator of insulin production, reported in ng/mL.
  - variable_name: Insulin
    data_type: float
    measurement_technique: EDTA plasma laboratory assay at the UW Nutrition and Obesity Research Center
    description: Marker for diabetes, reported in ng/mL.
  - variable_name: C-reactive protein, high sensitivity
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: Inflammation marker and risk factor for type 2 diabetes, reported in mg/L.
  - variable_name: Total cholesterol
    data_type: float
    measurement_technique: Serum lipid panel at the UW Nutrition and Obesity Research Center
    description: Cardiovascular disease risk factor, reported in mg/dL.
  - variable_name: Triglycerides
    data_type: float
    measurement_technique: Serum lipid panel at the UW Nutrition and Obesity Research Center
    description: Cardiovascular disease risk factor, reported in mg/dL.
  - variable_name: High-density lipoprotein cholesterol
    data_type: float
    measurement_technique: Serum lipid panel at the UW Nutrition and Obesity Research Center
    description: Cardiovascular disease risk factor, reported in mg/dL.
  - variable_name: Low-density lipoprotein cholesterol
    data_type: float
    measurement_technique: Serum lipid panel at the UW Nutrition and Obesity Research Center
    description: Cardiovascular disease risk factor, calculated rather than measured directly, reported in mg/dL.
    derivation: Calculated from the other lipid panel components.
  - variable_name: Glucose
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: >-
      Marker for diabetes, reported in mg/dL. Blood samples are non-fasting; participants are asked
      about their last oral food or drink intake at the time of the visit.
  - variable_name: Blood urea nitrogen
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: Marker for kidney and liver function, reported in mg/dL.
  - variable_name: Creatinine
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: >-
      Marker for kidney function, reported in mg/dL; the laboratory-provided reference range differs
      by sex.
  - variable_name: Blood urea nitrogen/creatinine ratio
    data_type: float
    measurement_technique: Derived from serum blood urea nitrogen and creatinine
    description: Indicator of kidney function.
    derivation: Ratio of blood urea nitrogen to creatinine.
  - variable_name: Sodium
    data_type: float
    measurement_technique: Serum electrolyte panel at the UW Nutrition and Obesity Research Center
    description: Marker of metabolic health, reported in mEq/L.
  - variable_name: Potassium
    data_type: float
    measurement_technique: Serum electrolyte panel at the UW Nutrition and Obesity Research Center
    description: Marker of metabolic health, reported in mEq/L.
  - variable_name: Chloride
    data_type: float
    measurement_technique: Serum electrolyte panel at the UW Nutrition and Obesity Research Center
    description: Marker of metabolic health, reported in mEq/L.
  - variable_name: Carbon dioxide, total
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: Marker of metabolic health, reported in mEq/L.
  - variable_name: Calcium
    data_type: float
    measurement_technique: Serum electrolyte panel at the UW Nutrition and Obesity Research Center
    description: Marker of metabolic health, reported in mg/dL.
  - variable_name: Protein, total
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: Indicator of overall health status, reported in g/dL.
  - variable_name: Albumin
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: Indicator of overall health status, reported in g/dL.
  - variable_name: Globulin, total
    data_type: float
    measurement_technique: Derived from serum total protein and albumin
    description: Indicator of overall health status, calculated rather than measured, reported in g/dL.
    derivation: Calculated from total protein and albumin.
  - variable_name: A/G ratio
    data_type: float
    measurement_technique: Derived from serum albumin and globulin
    description: Albumin to globulin ratio, calculated rather than measured.
    derivation: Calculated from albumin and total globulin.
  - variable_name: Bilirubin, total
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: Marker of liver health, reported in mg/dL.
  - variable_name: Alkaline phosphatase
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: Marker of liver health, reported in IU/L.
  - variable_name: Aspartate aminotransferase
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: Marker of liver health, reported in IU/L.
  - variable_name: Alanine aminotransferase
    data_type: float
    measurement_technique: Serum laboratory assay at the UW Nutrition and Obesity Research Center
    description: >-
      Marker of liver health, reported in IU/L; the laboratory-provided reference range differs by
      sex and age.
  - variable_name: HbA1c
    data_type: float
    measurement_technique: Whole blood laboratory assay at the UW Nutrition and Obesity Research Center
    description: Haemoglobin A1c, a marker for diabetes, reported as a percentage.
  - variable_name: White blood cell count
    data_type: float
    measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory local to each site
    description: Component of the complete blood count, reported in x10E3/microlitre.
  - variable_name: Red blood cell count
    data_type: float
    measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory local to each site
    description: Component of the complete blood count, reported in x10E6/microlitre.
  - variable_name: Haemoglobin
    data_type: float
    measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory local to each site
    description: Component of the complete blood count, reported in g/dL.
  - variable_name: Haematocrit
    data_type: float
    measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory local to each site
    description: Component of the complete blood count, reported as a percentage.
  - variable_name: MCV
    data_type: float
    measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory local to each site
    description: Mean corpuscular volume, reported in fL.
  - variable_name: MCH
    data_type: float
    measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory local to each site
    description: Mean corpuscular haemoglobin, reported in pg.
  - variable_name: MCHC
    data_type: float
    measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory local to each site
    description: Mean corpuscular haemoglobin concentration, reported in g/dL.
  - variable_name: RDW
    data_type: float
    measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory local to each site
    description: Red blood cell distribution width, reported as a percentage.
  - variable_name: Platelets
    data_type: float
    measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory local to each site
    description: Component of the complete blood count, reported in x10E3/microlitre.
  - variable_name: Urine creatinine
    data_type: float
    measurement_technique: Urine laboratory assay at the UW Nutrition and Obesity Research Center
    description: >-
      Urinary biomarker for early diabetic nephropathy, reported in mg/dL.
  - variable_name: Urine albumin
    data_type: float
    measurement_technique: Urine laboratory assay at the UW Nutrition and Obesity Research Center
    description: >-
      Urinary biomarker for early diabetic nephropathy, reported in mg/dL.
  - variable_name: Height
    data_type: float
    measurement_technique: In-clinic physical measurement
    description: Anthropometric measurement taken during the on-site visit.
  - variable_name: Weight
    data_type: float
    measurement_technique: In-clinic physical measurement
    description: Anthropometric measurement taken during the on-site visit.
  - variable_name: Waist circumference
    data_type: float
    measurement_technique: In-clinic physical measurement
    description: Anthropometric measurement taken during the on-site visit.
  - variable_name: Hip circumference
    data_type: float
    measurement_technique: In-clinic physical measurement
    description: Anthropometric measurement taken during the on-site visit.
  - variable_name: Waist-hip ratio
    data_type: float
    measurement_technique: Derived from waist and hip circumference
    description: Calculated after waist and hip circumference are measured.
    derivation: Calculated as the ratio of waist circumference to hip circumference.
  - variable_name: Body mass index
    data_type: float
    measurement_technique: Derived from height and weight
    description: Calculated after height and weight are measured.
    derivation: Calculated from height and weight.
  - variable_name: Systolic blood pressure
    data_type: float
    measurement_technique: >-
      Automatic oscillometric medically approved device (OMRON HEM 907XL, Medline MDS4001 or Welch
      Allyn 6000 series), measured twice separated by 2 minutes
    description: >-
      Blood pressure reading returned to the participant on an exam card before they leave the
      visit. Readings over 180 mm Hg, or under 100 mm Hg with symptoms of haemodynamic instability,
      trigger a recommendation for emergency care.
  - variable_name: Diastolic blood pressure
    data_type: float
    measurement_technique: >-
      Automatic oscillometric medically approved device, measured twice separated by 2 minutes
    description: >-
      Blood pressure reading returned to the participant on an exam card. Readings greater than
      120 mm Hg, or less than 60 mm Hg with symptoms of haemodynamic instability, trigger a
      recommendation for emergency care.
  - variable_name: Heart rate (in-clinic)
    data_type: float
    measurement_technique: Automatic oscillometric blood pressure device or ECG, measured twice separated by 2 minutes
    description: >-
      Reported in beats per minute. Readings greater than 100 bpm or less than 60 bpm, if not known
      to be usual for the participant and accompanied by symptoms of haemodynamic instability,
      trigger a recommendation for emergency care.
  - variable_name: MoCA total score
    data_type: integer
    measurement_technique: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application (MoCA Cognition, Quebec, Canada)
    description: >-
      General cognitive screener score with a maximum of 30; higher numbers represent better
      performance. Six domain-specific index scores, a Memory Index Score, section subscores and
      task completion times are also captured.
    minimum_value: 0.0
    maximum_value: 30.0
  - variable_name: Monofilament test result
    data_type: categorical
    measurement_technique: >-
      Standard 10 g monofilament applied at three locations on each foot, ten times per location,
      with the participant's eyes closed
    description: >-
      Peripheral neuropathy assessment; participants respond yes or no as to whether they feel the
      filament. Insensate areas are retested for confirmation.
  - variable_name: Photopic visual acuity (logMAR)
    data_type: float
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres, best-corrected, right and left
      eyes tested separately
    description: >-
      Letter visual acuity under daylight conditions expressed as the logarithm of the minimum angle
      of resolution; lower numbers indicate better resolution. Snellen visual acuity variables were
      dropped in this version of the dataset.
  - variable_name: Mesopic visual acuity (logMAR)
    data_type: float
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester viewed through a 2.0 neutral density filter
    description: >-
      Letter visual acuity under dim-light conditions expressed as logMAR.
  - variable_name: Photopic letter contrast sensitivity (log CS)
    data_type: float
    measurement_technique: Mars letter contrast sensitivity chart (Mars Perceptrix), monocular, with a general occluder
    description: >-
      Contrast sensitivity under daylight conditions expressed as log sensitivity; higher numbers
      indicate better sensitivity.
  - variable_name: Mesopic letter contrast sensitivity (log CS)
    data_type: float
    measurement_technique: >-
      Mars letter contrast sensitivity chart viewed through a 2.0 neutral density occluder
    description: Contrast sensitivity under dim-light conditions expressed as log sensitivity.
  - variable_name: Autorefraction spherical component
    data_type: float
    measurement_technique: Topcon KR 800 autorefractor, standard protocol, each eye
    description: Spherical component of autorefraction, expressed in diopters.
  - variable_name: Autorefraction cylindrical component
    data_type: float
    measurement_technique: Topcon KR 800 autorefractor, standard protocol, each eye
    description: Cylindrical component of autorefraction, expressed in diopters.
  - variable_name: Autorefraction cylindrical axis
    data_type: float
    measurement_technique: Topcon KR 800 autorefractor, standard protocol, each eye
    description: Axis of the cylindrical component of autorefraction.
  - variable_name: ECG recording position
    data_type: categorical
    measurement_technique: Recorded by the operator during 12-lead ECG acquisition
    description: >-
      Position of the participant relative to supine during the 12-lead ECG, recorded as 0, 30, 60
      or 90 degrees.
    categories:
      - '0 degrees (supine)'
      - '30 degrees'
      - '60 degrees'
      - '90 degrees'
  - variable_name: Continuous glucose measurement
    data_type: float
    measurement_technique: Dexcom G6 continuous glucose monitor worn for 10 days
    description: >-
      Blood glucose measurement in mg/dL recorded every 5 minutes. Participants are masked to the
      results during the monitoring period. For participants already wearing a Dexcom G6, up to 90
      days of prior values may optionally be included, for up to 100 days total.
  - variable_name: Step count
    data_type: integer
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days
    description: Number of steps recorded by the wearable activity monitor.
  - variable_name: Heart rate (wearable)
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days
    description: Heart rate recorded by the wearable activity monitor.
  - variable_name: Sleep duration
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days
    description: >-
      Sleep duration capturing circadian and diurnal rhythm; sleep phases are also listed among the
      collected activity variables.
  - variable_name: Oxygen saturation
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days
    description: Peripheral oxygen saturation (SpO2) recorded by the wearable activity monitor.
  - variable_name: Respiratory rate
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days
    description: >-
      Respiration rate recorded by the wearable activity monitor; a respiratory_rate directory is
      present in the wearable_activity_monitor collection.
  - variable_name: Stress level
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days
    description: >-
      Stress level derived by the wearable activity monitor; a stress directory is present in the
      wearable_activity_monitor collection.
  - variable_name: Physical activity calorie expenditure
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days
    description: >-
      Calorie expenditure associated with physical activity; a physical_activity_calorie directory
      is present in the wearable_activity_monitor collection.
  - variable_name: Ambient temperature
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the home for 10 days
    description: Indoor ambient temperature measured by the home environmental sensor.
  - variable_name: Relative humidity
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the home for 10 days
    description: Indoor relative humidity measured by the home environmental sensor.
  - variable_name: Nitric oxide (NO)
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the home for 10 days
    description: Indoor nitrogen oxide concentration measured by the home environmental sensor.
  - variable_name: Nitrogen dioxide (NO2)
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the home for 10 days
    description: >-
      Indoor nitrogen dioxide concentration measured by the home environmental sensor; the sensor
      documentation references the Sensirion NOx Index.
  - variable_name: Volatile organic compounds
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the home for 10 days
    description: Indoor volatile organic compound levels measured by the home environmental sensor.
  - variable_name: Particulate matter PM1.0
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the home for 10 days
    description: Indoor particulate matter concentration for particles up to 1.0 micrometres.
  - variable_name: Particulate matter PM2.5
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the home for 10 days
    description: Indoor particulate matter concentration for particles up to 2.5 micrometres.
  - variable_name: Particulate matter PM4
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the home for 10 days
    description: Indoor particulate matter concentration for particles up to 4 micrometres.
  - variable_name: Particulate matter PM10
