file_collections:
- id: doi:10.13026/mf9s-5r03#features
  name: features
  path: features
  description: Derived audio data features. Binary files are made available as Parquet,
    an open-source column-oriented data file format, and each Parquet file is formatted
    similarly; each element contains participant_id, session_id, task_name, n_frames
    and the tensor data for the feature. The folder also contains static_features.tsv
    and audio_quality_metrics.tsv. Every file is associated with a data dictionary
    file with the same file stem and a JSON suffix, whose keys are the column names
    of the associated data file.
  resources:
  - id: doi:10.13026/mf9s-5r03#features-torchaudio_spectrograms
    name: torchaudio_spectrograms.parquet
    file_type: data_file
    description: Spectrograms of dimension 201xT generated using the short-time Fast
      Fourier Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT
      (n=23533).
  - id: doi:10.13026/mf9s-5r03#features-torchaudio_mel_spectrograms
    name: torchaudio_mel_spectrograms.parquet
    file_type: data_file
    description: Mel spectrograms of dimension 60xT generated with a 25 ms window size,
      10 ms hop length, a 400-point FFT and 60 Mel bins (n=23533).
  - id: doi:10.13026/mf9s-5r03#features-torchaudio_mfcc
    name: torchaudio_mfcc.parquet
    file_type: data_file
    description: Mel-frequency cepstrum coefficients of dimension 60xT using the same
      parameters as the Mel spectrograms (n=23533).
  - id: doi:10.13026/mf9s-5r03#features-torchaudio_pitch
    name: torchaudio_pitch.parquet
    file_type: data_file
    description: Detected pitch (fundamental frequency) over time, of dimension T, with
      a minimum and maximum pitch of 80 and 500 (n=23533).
  - id: doi:10.13026/mf9s-5r03#features-sparc_ema
    name: sparc_ema.parquet
    file_type: data_file
    description: Estimated electromagnetic articulography (EMA) from a deep learning
      model, with dimensions Tx12 corresponding to X/Y positions of six articulators
      (tongue dorsum, tongue body, tongue tip, lower incisor, upper lip, lower lip)
      (n=23532).
  - id: doi:10.13026/mf9s-5r03#features-sparc_loudness
    name: sparc_loudness.parquet
    file_type: data_file
    description: Estimated loudness based on the average absolute amplitude of the audio
      waveform, of size T, using 20 ms windows (n=23532).
  - id: doi:10.13026/mf9s-5r03#features-sparc_periodicity
    name: sparc_periodicity.parquet
    file_type: data_file
    description: Estimated periodicity (confidence of pitch presence) derived from the
      audio using 20 ms windows, of dimension T (n=23532).
  - id: doi:10.13026/mf9s-5r03#features-sparc_pitch
    name: sparc_pitch.parquet
    file_type: data_file
    description: Estimated fundamental frequency (F0) using a different algorithm from
      torchaudio_pitch, with a range of 50-550 Hz and dimension T (n=23532).
  - id: doi:10.13026/mf9s-5r03#features-ppgs
    name: ppgs.parquet
    file_type: data_file
    description: Phonetic posteriorgram probabilities across 40 phoneme categories, of
      dimension 40xT, with a frame rate of 100 Hz (n=23533).
  - id: doi:10.13026/mf9s-5r03#features-static_features
    name: static_features.tsv
    file_type: data_file
    format: TSV
    description: Plain-text file of static features derived from openSMILE, Praat, parselmouth
      and torchaudio.
  - id: doi:10.13026/mf9s-5r03#features-audio_quality_metrics
    name: audio_quality_metrics.tsv
    file_type: data_file
    format: TSV
    description: Metrics related to audio quality derived from the recordings.
- id: doi:10.13026/mf9s-5r03#phenotype
  name: phenotype
  path: phenotype
  description: Phenotypic information acquired during data collection.
- id: doi:10.13026/mf9s-5r03#metadata
  name: metadata
  path: metadata
  collection_type: metadata
  description: Metadata information for the recordings.
