source_caveats: 'Referent: this record describes the Bridge2AI-Voice Pediatric Dataset
  on PhysioNet (release 1.1.0; latest-version DOI 10.13026/mf9s-5r03). The Bridge2AI-Voice
  Adult Dataset is a separate PhysioNet dataset that the release page notes is also
  available; no passage states a typed relationship between the two, so no related_datasets
  entry is recorded. Most of the project documentation (docs.b2ai-voice.org) and its
  healthsheet answers describe the adult dataset; those passages were not applied
  to this record.
  The Bridge2AI Voice Data Acquisition IRB protocol in the bundle is the parent USF
  protocol: its revision history says it was modified to include the pediatric cohort
  under the single IRB, while the same protocol states that Canadian institutions
  including SickKids do not follow the single IRB process and apply for a separate
  REB, and the PhysioNet release states that pediatric data collection and sharing
  was approved by the Research Ethics Board at the Hospital for Sick Children; the
  record states the PhysioNet approval and attributes pediatric consent, assent and
  enrollment statements to the parent protocol. The parent protocol states that compensation
  will be provided to the adult population only; whether pediatric participants were
  compensated is not stated for this release. Funding: the PhysioNet release cites
  NIH project number 3OT2OD032720-01S1; the NIH RePORTER page in the bundle describes
  project number 3OT2OD032720-01S3 (core project OT2OD032720) under the same title,
  and the project documentation footer cites award 3Tf-OTOD03272001S2; only the release''s
  own grant number is recorded as funding this dataset. Principal investigator: Yael
  Bensoussan is designated principal investigator in the RePORTER record and the
  parent protocol, and Yael Bensoussan and Olivier Elemento are named co-principal
  investigators for the Voice as a Biomarker of Health project in the project documentation.
  Name spellings differ between sources: the project documentation lists Jennifer
  Sui (Hospital for Sick Children), Frank Rudzizc and Don Bolser where the PhysioNet
  author list has Jennifer Siu, Frank Rudzicz and Donald Bolser; the PhysioNet spellings
  are used and the documentation affiliations are attached to them. The PhysioNet
  usage example loads torchaudio_spectrogram.parquet and torchaudio_mel_spectrogram.parquet,
  whereas the data description names torchaudio_spectrograms.parquet and torchaudio_mel_spectrograms.parquet;
  the data-description names are used. The PhysioNet page footer (maintained by the
  MIT Laboratory for Computational Physiology, supported by NIBIB, NHLBI and the NIH
  Office of the Director) describes the PhysioNet platform, not this dataset, and
  was not recorded as maintainer or funder. The corresponding author is listed only
  to logged-in PhysioNet users and is not named in the bundle.'
