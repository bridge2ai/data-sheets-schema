description: Bridge2AI-Voice Pediatric Dataset version 1.1.0, published on PhysioNet
  under credentialed access, contains derived audio features for 23,533 recordings
  collected from 300 participants aged 2-18. The release contains data its publishers
  consider low risk, including derivations such as spectrograms, but not the original
  voice recordings; detailed demographic, clinical and validated questionnaire data
  are also made available. The data are organized as derived audio features (features
  folder), phenotypic information acquired during data collection (phenotype folder)
  and per-recording metadata (metadata folder). Raw pediatric audio is not part of
  the PhysioNet project and is distributed separately through Synapse under a more
  involved access process.
