purposes:
- name: Ethically sourced flagship voice dataset
  response: The Bridge2AI-Voice project seeks to create an ethically sourced flagship
    dataset to enable future research in artificial intelligence and support critical
    insights into the use of voice as a biomarker of health.
addressing_gaps:
- name: Lack of open pediatric voice datasets for machine learning
  response: Privacy issues, consent processes and the need for developmentally appropriate
    tasks in pediatric data collection have contributed to a lack of publicly available
    pediatric datasets that enable machine learning for pediatric voice analysis.
- name: Sparse pediatric voice and speech analysis literature
  response: The parent Bridge2AI Voice Data Acquisition protocol states that the literature
    on pediatric voice and speech analysis is sparser, partly due to ethical concerns
    and challenges in data acquisition for this cohort, and that a voice database of
    a normal cohort of different age groups will be key to help machine learning models
    diagnose age-specific speech delays and disorders.
intended_uses:
- name: Study of developmental norms
  description: Resources such as this project are intended to enable study of developmental
    norms.
- name: AI-driven tools for early screening
  description: Resources such as this project are intended to create AI-driven tools
    for early screening.
- name: Clinical insight
  description: Resources such as this project are intended to support clinical insight.
instances:
- name: Recordings
  instance_type: recording with derived audio features
  counts: 23533
  description: Derived audio features are released for 23,533 recordings; raw audio
    is not included in the PhysioNet release.
- name: Participants
  instance_type: participant
  counts: 300
  description: The recordings were collected from 300 participants aged 2-18.
subpopulations:
- name: Age groups
  identification: Pediatric participants are recruited strictly from the Hospital
    for Sick Children (SickKids) and are grouped by age.
  description: The project documentation lists pediatric protocols for the age groups
    Peds 2-4, Peds 4-6, Peds 6-10 and Peds 10+.
sampling_strategies:
- name: Eligibility and recruitment
  strategies: Patients and healthy volunteers at the Hospital for Sick Children (Toronto,
    Ontario, Canada) were considered for enrollment; pediatric participants are recruited
    strictly from SickKids. Inclusion criteria were 2 to 18 years of age and English
    proficiency; exclusion criteria were age over 18 and being non-verbal. Non-patients,
    recruited through research postings, were evaluated against the same inclusion
    and exclusion criteria.
collection_mechanisms:
- name: reproschema-ui on tablets
  mechanism_details: All data were collected through customized software (reproschema-ui)
    on tablets, with the Bridge2AI-Voice pediatric protocol. A headset was used to record
    most participants; the remaining recordings used the built-in tablet microphone
    because of low tolerance of wearing headphones or existing complex medical conditions.
    Voice, breathing, cough and speech data are recorded with reproschema-ui for pediatrics.
    All participants completed the recording and demographic data collection in one
    session; for participants without adequate comprehension and familiarity with their
    past medical history, parents or decision-makers completed the survey during the
    recording on a separate tablet.
acquisition_methods:
- name: Standardized age-appropriate protocol
  acquisition_details: Once consented, participants were assigned a unique study identification
    number and a standardized age-appropriate protocol was adopted. The protocol included
    the collection of demographic information, voice and speech related questionnaires,
    and questionnaires inquiring about medical history.
informed_consent:
- name: Parental or participant consent
  consent_obtained: true
  consent_type: parental or participant consent
  description: Following confirmation of eligibility, parental or participant consent
    was obtained prior to data collection and data sharing.
at_risk_populations:
  at_risk_groups_included: true
  special_protections:
  - The parent Bridge2AI Voice Data Acquisition protocol states that pediatric patients
    will be enrolled only through the pediatric sites and not at USF, and that data
    collection for pediatric cohorts will only be performed at the pediatric participating
    institutions.
  - The parent protocol states that Checklist HRP-416 for children under 21 has been
    completed and is appended to the protocol.
  guardian_consent:
  - The parent protocol states that when children participate, parents or guardians
    will provide consent, and that parental permission will be obtained from one or
    both parents because the research is minimal risk.
  - The parent protocol excludes pediatric participants who do not receive consent
    from a parent or guardian to voice and clinical de-identified data being uploaded
    to an open-sourced database.
  assent_procedures: The parent protocol states that children will provide verbal
    assent where appropriate, and that young children who cannot reasonably be asked
    to assent because of age and development (typically children under seven years
    of age) will not be asked to do so.
human_subject_research:
  involves_human_subjects: true
  ethics_review_board: Research Ethics Board at the Hospital for Sick Children
  special_populations:
  - participants aged 2-18
ethical_reviews:
- name: Research Ethics Board approval
  reviewing_organization: Research Ethics Board at the Hospital for Sick Children
  review_details: Data collection and sharing was approved by the Research Ethics Board
    at the Hospital for Sick Children.
participant_privacy:
- name: Raw audio withheld from the PhysioNet release
  privacy_techniques: The PhysioNet release contains derived features from the audio
    waveforms and no raw audio; raw audio data is disseminated through controlled access
    only, to protect participants' privacy.
preprocessing_strategies:
- name: Export and conversion to tab-delimited values
  preprocessing_details: Data were exported and converted to tab-delimited values using
    an open-source library developed by the study team.
- name: Audio feature derivation and phenotype merging
  preprocessing_details: Raw audio waveforms were preprocessed into Parquet feature
    files (torchaudio spectrograms, Mel spectrograms, MFCCs and pitch; SPARC-based
    EMA, loudness, periodicity and pitch; phonetic posteriorgrams), static features
    were derived with openSMILE, Praat, parselmouth and torchaudio, and the source data
    were merged into the phenotype files. The code used for this has been made open
    source in the b2aiprep library.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: Bridge2AI Data Processing Library (b2aiprep)
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
- name: ReproSchema-UI to REDCap to BIDS conversion
  preprocessing_details: Pediatric data collected through ReproSchema-UI is extracted
    and transformed into REDCap format, and subsequently converted to the Brain Imaging
    Data Structure (BIDS); the project documentation states that raw audio files and
    questionnaire data retrieved from ReproSchema-UI were converted to be compliant
    with Brain Imaging Data Structure v1.9.0.
cleaning_strategies:
- name: Removal of features for sensitive records and audio checks
  cleaning_details: Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs
    for sensitive records and audio checks have been removed from v1.1.
- name: Manual check of free speech tasks
  cleaning_details: Version 1.1 releases audio features for all free speech tasks
    that were manually checked for presence of unconsented speakers and PII.
missing_data_documentation:
- name: Features that could not be generated
  missing_data_causes: Some files, whether due to length or other issues, could not
    generate certain features and so are not included in the bundled data.
