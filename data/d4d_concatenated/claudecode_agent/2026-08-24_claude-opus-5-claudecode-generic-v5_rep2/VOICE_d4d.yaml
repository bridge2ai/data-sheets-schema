purposes:
  - name: Create an ethically sourced flagship voice dataset
    response: >-
      The Voice project set out to create an ethically sourced flagship dataset that
      would enable future research in artificial intelligence and support critical
      insights into the use of voice as a biomarker of health.
    description: >-
      Stated in the abstract of the PhysioNet releases as the purpose of the
      Bridge2AI-Voice project.
  - name: Fill the gap in large, diverse, well-documented clinical voice data
    response: >-
      The dataset was created to address a gap in the availability of large-scale,
      diverse and well-documented voice data for clinical machine-learning
      applications. Earlier studies of machine-learning-based voice diagnosis
      produced promising results but used sample sizes that were too small or lacked
      the key metadata needed to train robust, clinically useful models.
  - name: Support screening, diagnosis and monitoring through voice biomarkers
    response: >-
      The dataset aims to facilitate the use of voice as a non-invasive,
      cost-effective biomarker for the screening, diagnosis and monitoring of a wide
      range of health conditions, by linking acoustic data to multimodal health
      biomarkers.

tasks:
  - name: Disease detection and classification from voice
    response: >-
      The release comes with predefined tasks and labeling. The tasks are primarily
      designed for training machine-learning models for disease detection and
      classification using voice data, with labels drawn from diagnostic categories
      including vocal pathologies, neurological disorders, psychiatric conditions
      and respiratory disorders.
  - name: Development, benchmarking and validation of clinical models
    response: >-
      The dataset is intended to enable the development, benchmarking or validation
      of clinically applicable machine-learning models for diagnosing a wide range
      of health conditions using voice data.

addressing_gaps:
  - name: Absence of a large, standardized, publicly available voice database
    response: >-
      Existing work on voice as a biomarker was confined to small and medium-sized
      datasets that often used voice as the only data type. Comparing studies and
      pooling data was difficult because no standards existed for how voice and
      speech are collected and measured, and industry datasets were private, which
      prevented auditing of models and of the accuracy of training labels. The
      project addresses this by building a large, standardized, ethically sourced
      database linked to multimodal health data.
  - name: Lack of interoperability standards for acoustic data
    response: >-
      One of the project's stated aims is to introduce the field of acoustic
      biomarkers by developing new standards of acoustic and voice data collection
      and analysis for voice AI research, so that data collected at different sites
      can be pooled and compared.
  - name: Lack of ethical and legal norms for voice data
    response: >-
      The project addresses the ethical and legal challenges specific to voice data -
      the risk of re-identification from a voice, voice AI hacking, voice data
      sharing and privacy, and the influence of gender and racial diversity on these
      technologies - by developing consent, governance and dissemination practices
      alongside the data.

instances:
  - name: Participant
    instance_type: person
    counts: 833
    label: true
    label_description: >-
      Each participant carries a clinical diagnosis assigned by a qualified clinician
      at the site of collection, based on established gold standards for the disease
      cohort. For the psychiatric disorders cohort the assessment was determined from
      the participant's electronic health record or from an active prescription.
    description: >-
      Each instance represents a person. Version 3.1 contains data for 833
      participants across five sites in North America. Because participants may have
      repeated visits, a participant may appear in more than one row of the
      phenotypic tables, and there is no requirement that a participant give the
      same response at each visit.
    source_caveats: >-
      Earlier releases had smaller cohorts: version 1.0 provided 12,523 recordings
      for 306 participants, version 2.0 added 136 participants, and version 3.0.0
      added a further 391. Version 3.1.0 released no new participants.
  - name: Recording
    instance_type: audio recording
    description: >-
      Each recording is one performance of one acoustic task by one participant
      within one session, identified by participant_id, session_id and task_name.
      Recordings are represented in the release by derived features rather than by
      the waveform; the number of rows differs by feature because some recordings
      could not yield some features. In version 3.1.0 the spectrogram, Mel
      spectrogram and MFCC tables each hold 29,278 rows, the torchaudio pitch table
      32,522, the articulatory loudness and periodicity tables 31,855 and 31,872,
      the articulatory EMA table 28,640, and the phonetic posteriorgram table 29,289.
    source_caveats: >-
      The project documentation site states that version 3.0 contains approximately
      61,937 voice-derived recordings from 833 adult participants. The PhysioNet
      release pages, which the input manifest ranks higher, state no single total and
      instead give per-feature row counts that range between 28,640 and 32,522 for
      version 3.1.0. The two figures are not the same quantity and no total recording
      count is asserted here.

relationships:
  - name: Participant, session and recording linkage
    relationship_details: >-
      Every feature record carries a participant identifier, a session identifier and
      the name of the task performed, so recordings can be grouped by session and by
      participant. Sessions are explicitly modeled: for most participants a single
      session sufficed, but a subset required multiple sessions, so there may be more
      than one session per participant.
    source_caveats: >-
      The project documentation site answers the question of whether relationships
      between individual instances are made explicit with "No, they are unrelated".
      The PhysioNet release pages, ranked higher by the input manifest, describe the
      participant, session and recording identifiers that make the linkage explicit,
      and that description is preferred here.

splits:
  - name: No recommended splits
    split_details: >-
      The release does not provide recommended data splits for training, validation
      or testing. Researchers are encouraged to create their own splits according to
      their specific requirements.

subpopulations:
  - name: Demographic subpopulations
    subpopulation_elements_present: true
    identification: >-
      Age, gender, sex, ethnicity and socioeconomic status are collected through a
      demographic questionnaire administered in the collection application and are
      released in the demographics table.
    distribution: >-
      The distribution is not stated numerically in the sources. The dataset is
      documented as skewed by disorder category, site and other demographic factors,
      and users are advised to consider the multivariate distribution when assessing
      its utility for a given question.
  - name: Disease cohort categories
    subpopulation_elements_present: true
    identification: >-
      Participants were recruited into five predetermined disease cohort categories -
      voice disorders, neurological and neurodegenerative disorders, mood and
      psychiatric disorders, respiratory disorders, and pediatric voice and speech
      disorders - together with controls who do not have the conditions of interest.
      The cohort is expressed in the release through per-diagnosis phenotypic tables.
    distribution: >-
      The public releases do not contain an equal distribution of the disease
      categories, and further releases are expected to add data. The adult release
      draws on four of the five categories; the pediatric category is published as a
      separate dataset.

sensitive_elements:
  - name: Sensitive demographic and health data
    sensitive_elements_present: true
    sensitivity_details: >-
      The dataset records health information, including clinical diagnoses across
      voice, neurological, mood and respiratory conditions, together with demographic
      information. The project documentation identifies race and ethnic origin,
      sexual orientation, and socioeconomic and health data as sensitive categories
      present in the dataset.
    source_caveats: >-
      The two statements in the bundle are scoped differently. The general
      description on the project documentation site lists race, sexual orientation
      and socioeconomic and health information as present. The de-identification
      notes for version 3.0.0, and the PhysioNet release pages that the manifest
      ranks higher, state that all fields encoded as sensitive in the REDCap data
      dictionary were removed at that stage, along with non-identifying elements
      revealing highly sensitive information such as household income, mental health
      status and traumatic life experiences. The set of sensitive elements in the
      current release is therefore narrower than the general statement.

confidential_elements:
  - name: Confidential content
    confidential_elements_present: false
    confidentiality_details: >-
      The project documentation states that the dataset does not contain data that
      might be considered confidential, such as data protected by legal privilege or
      by doctor-patient confidentiality. Identifiable protected health information is
      retained at each collecting institution rather than shared in the release.

content_warnings:
  - name: Free speech content
    warnings:
      - >-
        Free speech tasks were transcribed, and although the inclusion of offensive
        or distressing content is unlikely it cannot be completely avoided, because
        research participants are responsible for their own choice of language.
    description: >-
      The risk arises from open-ended speech prompts rather than from the clinical
      data.
    source_caveats: >-
      The warning is stated on the project documentation site. The PhysioNet release
      pages record that transcripts of free speech audio were removed from version
      1.1, and that from version 3.0 onward spectrograms and similar features were
      excluded where the audio contained free speech, so the material the warning
      describes is not present in the current release.

anomalies:
  - name: Site-to-site variation in collection configuration
    anomaly_details: >-
      Different sites used different collection configurations, and the collection
      protocol changed over the course of the study. Distinct iPad devices were used
      at each site, and the head-mounted headset microphone could sit at slightly
      different distances from the speaker. Noise artifacts, variations in diagnostic
      practice, inaccurate questionnaire responses and underreporting are identified
      as confounding factors.
  - name: Unaudited machine-generated derivations
    anomaly_details: >-
      Certain aspects of the data, for example transcription, were generated using
      off-the-shelf models that have not been audited for correctness. The dataset
      has otherwise been audited internally for missingness and consistency by the
      data release team, and a missingness table is distributed with it.

known_biases:
  - name: Recruitment from high volume expert clinics at a limited number of sites
    bias_type: selection_bias
    bias_description: >-
      Participants were recruited from high volume expert clinics within hospital
      systems and academic institutions, on the basis of diagnosis and of inclusion
      and exclusion criteria. Groups with less trust in the medical system or in
      artificial intelligence, or who live further from the collection sites, would
      have been less likely to be recruited.
    mitigation_strategy: >-
      The project describes a shift toward remote collection and a recruiting
      approach designed to control for more variables, together with a plan to
      recruit through community outreach clinics serving underserved populations.
  - name: Limited geographic and linguistic representation
    bias_type: representation_bias
    bias_description: >-
      The data is a sample of a larger, ongoing collection and is not representative,
      because it was collected at a limited number of geographic locations across
      five sites in the United States and Canada. Participation required reading and
      speaking English; Spanish protocols were under development at the time the
      sources were written.
    affected_subsets:
      - Non-English-speaking populations
      - Populations distant from the participating academic sites
  - name: Device and site confounded with diagnostic label
    bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders depending on the site, so
      their data was also collected with different devices. Device and site are
      therefore partly confounded with the diagnostic label, and a model may learn
      recording characteristics rather than clinical ones.

known_limitations:
  - name: Derived features only in the public release
    limitation_type: scope_limitation
    limitation_description: >-
      The published PhysioNet release contains derivations of the audio -
      spectrograms, Mel spectrograms, MFCCs, pitch, articulatory traces and phonetic
      posteriorgrams - and not the original voice recordings. Spectrograms, Mel
      spectrograms, MFCCs, phonetic posteriorgrams and articulatory estimates for
      sensitive records and for audio checks were removed, and features could not be
      generated for some files because of their length or other issues.
    scope_impact: >-
      Work that requires the waveform itself, including any analysis that depends on
      features not already extracted, cannot be performed on the registered-access
      release.
    recommended_mitigation: >-
      Raw audio is available through a separate controlled-access process; requests
      go to the access committee at DACO@b2ai-voice.org and the data is made
      available via Synapse.
  - name: Uneven coverage of disease categories and of multimodal data
    limitation_type: coverage_limitation
    limitation_description: >-
      The public data releases do not contain an equal distribution of the five
      disease categories. The other multimodal data collected by the project -
      imaging, genomic data for the neurological cohort, laryngoscopy imaging and
      other electronic health record data - is extracted at each site independently
      and was not released with version 3.0.0.
  - name: Single labeler per instance
    limitation_type: methodological_limitation
    limitation_description: >-
      One labeler provided the diagnostic label for each instance, typically the
      clinician at the site of data collection or, for a prior diagnostic assessment,
      a clinician external to it. No inter-annotator agreement can therefore be
      computed, and variations in diagnostic practice between sites are not corrected
      for. Human-level performance on the applications the dataset is meant to
      address is described as varying widely.
  - name: Protocol drift over the collection period
    limitation_type: temporal_limitation
    limitation_description: >-
      The collection protocol changed over the course of the study, and changes in
      diagnostic criteria or practice are identified as a possible source of
      distribution shift. The task inventory itself grew and was reorganized between
      releases.

acquisition_methods:
  - name: Direct observation combined with participant self-report
    was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      Acoustic data was observed directly through recordings made during the session.
      Demographic information, confounders and validated questionnaire responses were
      reported by the participants themselves. Clinical diagnoses were verified by
      clinicians reviewing audio or imaging data, consulting electronic health
      records, or checking medication prescriptions.

collection_mechanisms:
  - name: Bridge2AI-Voice application on a tablet
    mechanism_details: >-
      Voice, breathing, cough and speech data were recorded with a custom application
      on a tablet, with a headset used where possible. Data was collected on iPads of
      the 9th or 10th generation and on the 5th generation iPad Air, using an Avid
      AE-36 microphone connected through an Apple dongle. Collection took place in the
      clinic with the assistance of a trained research assistant. Two client
      applications exist, the Bridge2AI Voice iOS app and the Bridge2AI Voice Web app;
      both are HIPAA compliant, store data only during the collection phase, require
      no login, and send data over HTTPS to a HIPAA-compliant storage server operated
      by an NIH STRIDES partner.
    used_software:
      - id: https://github.com/eipm/bridge2ai-redcap
        name: bridge2ai-redcap
        description: >-
          The REDCap data dictionary, metadata and instrument PDFs that define the
          data acquisition protocols.
        license: MIT
        url: https://github.com/eipm/bridge2ai-redcap
  - name: REDCap clinical database
    mechanism_details: >-
      Questionnaire and clinical data were held in a REDCap database as part of the
      case report form, with individual usernames and passwords and access restricted
      to approved study personnel. The questionnaire data was later exported from
      REDCap and converted for release using an open-source library developed by the
      team.

sampling_strategies:
  - name: Non-probability clinic-based sampling
    is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      A larger, ongoing collection of voice, speech and respiratory recordings linked
      to health information, gathered by the consortium across its participating
      institutions.
    why_not_representative: >-
      The data was collected at a limited number of geographic locations, so it does
      not represent the wider population.
    strategies: >-
      Non-probability sampling. Participants were recruited from high volume expert
      clinics - outpatient clinics within hospital systems or academic institutions
      with expertise in a specific disease area, seeing more than 50 patients a month
      from the same disease category - and screened against per-cohort inclusion and
      exclusion criteria before their visit.

data_collectors:
  - name: Site research teams
    role: Recruitment, consent and session facilitation
    collector_details: >-
      Research teams, which may include medical, graduate or undergraduate students,
      coordinated with clinicians and doctors to identify appropriate participants and
      ran the collection sessions. Hospital staff were not involved in scheduling but
      assisted with the logistics of coordinating data collection.
  - name: Site clinicians
    role: Diagnosis and clinical validation
    collector_details: >-
      Clinicians and doctors at each site provided the diagnosis and the gold standard
      clinical validation. They were listed under the IRB as co-investigators and were
      added to the consortium, so that their names appear on consortium-level
      publications arising from the research; they were not otherwise separately
      compensated.

collection_timeframes:
  - name: Collection period for the released data
    timeframe_details: >-
      The project documentation states that the data was collected over a period of
      12 months. The IRB protocol describes the acquisition as a prospective cohort
      study running over four years in four phases - exploratory, pilot, expansion and
      outreach - with the pilot phase beginning in November 2023 and the exploratory
      phase completed in November 2023. No start or end date is stated for the
      released dataset itself.

direct_collection:
  - name: Collection directly from participants
    is_direct: true
    collection_details: >-
      Data was collected directly from the individuals in question rather than
      obtained through third parties. Existing clinical information used for
      screening and validation was drawn from each site's electronic health record by
      investigators practicing in those clinics.

collection_notifications:
  - name: Notification through the consent process
    notification_details: >-
      Participants were notified about the data collection through an IRB-approved
      consent process. They were explicitly informed about the data being collected,
      the methods used to secure it, and the purposes for which it would be used.

collection_consents:
  - name: Prospective informed consent
    consent_details: >-
      All participants gave prospective informed consent to the collection and use of
      their data. Consent normally took place in the clinic setting of the recruiting
      high volume expert clinic and was conducted by research assistants, with about
      30 minutes spent explaining the study; potential participants were asked to
      explain back what they had understood. Consent could also be given remotely
      through REDCap survey forms, electronically within the application, on paper, or
      by video recording within the application, in which case the participant reads a
      statement aloud so that the acoustic data can be verified as belonging to the
      consented individual. Where data collection was delayed, participants were
      re-consented beforehand. For longitudinal cohorts an electronic consent is
      administered before each subsequent collection.

consent_revocations:
  - name: Withdrawal and its effect on the released data
    revocation_details: >-
      Consenting participants are informed that they may withdraw from the study at
      any point. If a participant withdraws during or before the voice data
      collection, their data is not included in the database. Participants are
      informed that research data, including voice recordings, cannot be removed from
      the database once the collection process is complete. Participants who withdraw
      may optionally complete a satisfaction survey about their reasons.

missing_data_documentation:
  - name: Missingness in the phenotypic tables
    missing_data_patterns: >-
      Phenotypic tables contain a row for a participant only where at least one column
      is not missing. Each participant answered a common set of questions and then a
      set specific to their primary diagnostic category, so questions outside that
      category are absent for them. Because participants may have repeated visits,
      values for the same data element can vary across rows for one participant.
    missing_data_causes: >-
      Some questions are optional, some are asked only of particular cohorts, and data
      collection irregularities caused information to be missing from individual
      instances. Some recordings could not yield particular features because of their
      length or other issues, so they are absent from the corresponding feature files.
    handling_strategy: >-
      Missingness tables are generated as part of the audit protocol and a missingness
      table is distributed with the dataset. No imputation is performed.

raw_data_sources:
  - name: Raw audio waveforms and REDCap responses
    source_description: >-
      The underlying sources are the raw audio waveforms recorded through the
      collection application and the questionnaire and clinical responses held in
      REDCap. The waveforms were converted to monaural and resampled to 16 kHz with a
      Butterworth anti-aliasing filter before feature extraction.
    source_type: Prospectively recorded audio and structured questionnaire responses
    raw_data_format: WAV audio and tab-delimited questionnaire exports
    access_details: >-
      The raw audio is not part of the PhysioNet release. It is disseminated through
      controlled access only, to protect participant privacy; requests go to the
      access committee at DACO@b2ai-voice.org, and the data is made available via
      Synapse at https://www.synapse.org/Synapse:syn72370534/.

raw_sources:
  - name: Retention of the raw audio
    access_url: https://www.synapse.org/Synapse:syn72370534/
    raw_data_details: >-
      The raw data was saved in addition to the derived features and is not publicly
      accessible. Access requires a Data Access Request Form, a Data Use Agreement,
      review by the Data Access Compliance Office, and a Data Use and Transfer
      Agreement signed by an authorized official at the requesting institution.

preprocessing_strategies:
  - name: Audio standardization
    preprocessing_details: >-
      Raw audio was converted to monaural and resampled to 16 kHz with a Butterworth
      anti-aliasing filter applied, producing the standardized audio from which all
      derived features were computed.
    used_software:
      - id: https://github.com/sensein/b2aiprep
        name: b2aiprep
        version: 3.0.0
        description: >-
          The library used to organize and preprocess the dataset, to process the raw
          audio waveforms into the released feature files, and to merge the source
          data into the phenotypic files. Version 3.1.0 of the dataset was generated
          with b2aiprep version 3.0.0.
        license: Apache-2.0
        url: https://github.com/sensein/b2aiprep
      - id: https://github.com/sensein/senselab
        name: SenseLab
        description: The library used to process audio files for research tasks.
        url: https://github.com/sensein/senselab
  - name: Feature extraction
    preprocessing_details: >-
      Seven families of features were derived from the standardized audio.
      Spectrograms were computed with the short-time Fast Fourier transform using a
      25 ms window, a 10 ms hop and a 400-point FFT, then downsampled by a factor of
      two in the time domain; Mel spectrograms used the same parameters with 60 Mel
      bins; 60 Mel-frequency cepstral coefficients were extracted from the
      spectrograms. Pitch was detected over time with a minimum and maximum of 80 and
      500 Hz. The Speech Articulatory Coding package produced kinematic traces of the
      vocal tract articulators, electromagnetic articulography estimates for six
      articulators, and measures of loudness, periodicity and pitch at 50 Hz.
      Phonetic posteriorgrams over 40 phoneme categories were generated at 100 Hz.
      Acoustic features were extracted with openSMILE, and phonetic and prosodic
      features with Parselmouth and Praat, giving measures of fundamental frequency,
      formants and voice quality. Transcriptions were generated with OpenAI's Whisper
      Large model.
  - name: Conversion to the Brain Imaging Data Structure
    preprocessing_details: >-
      The raw audio files and the questionnaire data exported from REDCap were
      converted to be compliant with the Brain Imaging Data Structure version 1.9.0,
      giving a per-participant, per-session folder layout alongside the phenotypic
      tables and their data dictionaries.

cleaning_strategies:
  - name: No cleaning pass
    cleaning_details: >-
      The project documentation states that no pre-processing was carried out for the
      purpose of cleaning the data, and that no instances were excluded at the time of
      preprocessing. Records were nonetheless withheld from particular feature files:
      spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams and articulatory
      estimates for sensitive records and for audio checks were removed, and files
      that could not yield a given feature are absent from that feature's table.

labeling_strategies:
  - name: Clinician-assigned gold standard diagnosis
    data_annotation_platform: REDCap
    data_annotation_protocol: >-
      Labels follow the Bridge2AI-Voice protocols and ICD-10 codes. At each site a
      local clinician provided the diagnosis from a clinical interview and the
      appropriate work-up, against the gold standard validation method defined for
      the cohort - laryngoscopy images and stroboscopy videos for voice disorders,
      spirometry and flow volume loops and CT for airway conditions, brain CT and MRI
      and whole genome sequencing for neurological conditions, and the electronic
      health summary, a psychiatrist's diagnosis or medication history for psychiatric
      conditions. For the psychiatric cohort the assessment was made outside of data
      collection by an appropriately licensed clinician.
    annotations_per_item: 1
    annotator_demographics:
      - >-
        Typically the clinician at the site of data collection, or a clinician
        external to it where a prior diagnostic assessment was used.
    labeling_details: >-
      A single labeler provided the label for each instance, so no inter-annotator
      agreement is available. Researchers who define new labels or tasks are asked to
      describe the process alongside any release of a model or publication, including
      the exact variables used.

machine_annotation_tools:
  - name: Automated derivation of transcripts and acoustic features
    tools:
      - OpenAI Whisper Large
      - openSMILE
      - Praat
      - parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - ppgs
    tool_descriptions: >-
      Transcriptions were generated with OpenAI's Whisper Large model. Acoustic
      features were extracted with openSMILE, phonetic and prosodic features with
      Parselmouth and Praat, spectrograms, Mel spectrograms, MFCCs and pitch with
      torchaudio, articulatory traces and source features with the Speech Articulatory
      Coding package, and phonetic posteriorgrams with the ppgs package. None of these
      tools assigned the diagnostic labels, which were made by clinicians.
    tool_accuracy:
      - >-
        Certain aspects of the data, for example transcription, were generated using
        off-the-shelf models that have not been audited for correctness.
    used_software:
      - id: https://github.com/sensein/b2aiprep
        name: b2aiprep
        version: 3.0.0
        description: >-
          The library that orchestrates the automated feature extraction and merges
          the source data into the phenotypic files.
        license: Apache-2.0
        url: https://github.com/sensein/b2aiprep

existing_uses:
  - name: Bridge2AI Summer School and hackathon
    examples:
      - >-
        A restricted version of the dataset containing raw audio has been used in the
        Bridge2AI Summer School and hackathon.

intended_uses:
  - name: Clinical machine-learning model development
    use_category: research
    usage_notes: >-
      The dataset is intended to enable the development, benchmarking or validation
      of clinically applicable machine-learning models for diagnosing a wide range of
      health conditions using voice data, including vocal pathologies and
      neurological, psychiatric and respiratory conditions.
    examples:
      - Model pretraining
      - Fine-tuning
      - Benchmarking
      - Validation
  - name: Voice biomarker research
    use_category: research
    usage_notes: >-
      The dataset is intended to support clinical research into disease screening,
      diagnosis and monitoring through voice biomarkers, and to serve as the
      foundation for the emerging field of audiomics by supplying acoustic data linked
      to multimodal health information.
  - name: Cohort selection from phenotypic data
    use_category: research
    usage_notes: >-
      The questionnaire features are collected and distributed in the phenotype folder
      and can be used for cohort selection independently of the acoustic features.

discouraged_uses:
  - name: Non-research applications affecting individuals
    discouragement_details: >-
      The dataset should not be used for non-research applications such as hiring
      decisions, insurance premium adjustments, or any form of surveillance that could
      lead to discrimination or harm. These limitations are intended to prevent
      unethical or biased outcomes that could affect individuals on the basis of their
      health conditions or voice characteristics.

prohibited_uses:
  - name: Re-identification of participants
    prohibition_reason: >-
      The registered access agreement forbids attempts to re-identify research
      participants, and any action that could reasonably lead to re-identification,
      because a voice is inherently identifying and the consortium's commitment is to
      protect the rights and interests of research participants.
  - name: Uses that could harm or stigmatize participants
    prohibition_reason: >-
      The dataset may not be used for any purpose that could foreseeably cause harm or
      stigmatization to research participants, their families, communities or specific
      populations.
  - name: Intellectual property claims that restrict access
    prohibition_reason: >-
      Users agree not to make intellectual property claims on the data and not to use
      intellectual property protection, database rights or related rights in ways that
      would prevent or block access to, or use of, any element of the data or of
      conclusions drawn directly from it, so that future use of the dataset remains
      unrestricted in line with open science principles.
  - name: Sale of the data
    prohibition_reason: >-
      The registered access agreement permits duplication as reasonably required to
      carry out the user's research project but does not permit sale of all or part of
      the data on any media.

future_use_impacts:
  - name: Skew across disorder, site and demographics
    impact_details: >-
      The dataset has skews based on disorder category, site and other demographic
      factors. Users should consider the multivariate distribution when assessing
      whether the dataset is suitable for a given question, because a model trained
      without regard to it may reflect the recruitment pattern rather than the
      clinical signal.

file_collections:
  - id: doi:10.13026/37yb-1t42#features
    name: features
    collection_type: processed_data
    path: features
    description: >-
      Dense features derived from the standardized audio, distributed as Parquet
      files, together with plain-text tables of per-recording static features and
      audio quality metrics. Each Parquet record carries participant_id, session_id,
      task_name, the number of time frames and the tensor for that feature. Every
      file is accompanied by a JSON data dictionary describing the feature and the
      processing used to prepare it.
    resources:
      - id: doi:10.13026/37yb-1t42#features-torchaudio-spectrogram
        name: torchaudio_spectrogram.parquet
        path: features/torchaudio_spectrogram.parquet
        description: >-
          Spectrograms of dimension 201xT generated with the short-time Fast Fourier
          transform using a 25 ms window, a 10 ms hop and a 400-point FFT. 29,278
          records in version 3.1.0.
      - id: doi:10.13026/37yb-1t42#features-torchaudio-mel-spectrogram
        name: torchaudio_mel_spectrogram.parquet
        path: features/torchaudio_mel_spectrogram.parquet
        description: >-
          Mel spectrograms of dimension 60xT generated with a 25 ms window, a 10 ms
          hop, a 400-point FFT and 60 Mel bins. 29,278 records in version 3.1.0.
      - id: doi:10.13026/37yb-1t42#features-torchaudio-mfcc
        name: torchaudio_mfcc.parquet
        path: features/torchaudio_mfcc.parquet
        description: >-
          Mel-frequency cepstral coefficients of dimension 60xT computed with the
          same parameters as the Mel spectrograms. 29,278 records in version 3.1.0.
      - id: doi:10.13026/37yb-1t42#features-torchaudio-pitch
        name: torchaudio_pitch.parquet
        path: features/torchaudio_pitch.parquet
        description: >-
          Detected pitch over time, of dimension T, with a minimum and maximum pitch
          of 80 and 500 Hz. 32,522 records in version 3.1.0.
      - id: doi:10.13026/37yb-1t42#features-sparc-ema
        name: sparc_ema.parquet
        path: features/sparc_ema.parquet
        description: >-
          Electromagnetic articulography estimated with a deep learning model, of
          dimension Tx12, holding the X and Y positions of six articulators: tongue
          dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip.
          28,640 records in version 3.1.0.
      - id: doi:10.13026/37yb-1t42#features-sparc-loudness
        name: sparc_loudness.parquet
        path: features/sparc_loudness.parquet
        description: >-
          Loudness estimated from the average absolute amplitude of the waveform over
          20 ms windows, of size T. 31,855 records in version 3.1.0.
      - id: doi:10.13026/37yb-1t42#features-sparc-periodicity
        name: sparc_periodicity.parquet
        path: features/sparc_periodicity.parquet
        description: >-
          Periodicity, the confidence that pitch is present, derived over 20 ms
          windows, of dimension T. 31,872 records in version 3.1.0.
      - id: doi:10.13026/37yb-1t42#features-sparc-pitch
        name: sparc_pitch.parquet
        path: features/sparc_pitch.parquet
        description: >-
          Fundamental frequency estimated by a different algorithm from the
          torchaudio pitch, over a range of 50 to 550 Hz, of dimension T. 31,872
          records in version 3.1.0.
      - id: doi:10.13026/37yb-1t42#features-ppgs
        name: ppgs.parquet
        path: features/ppgs.parquet
        description: >-
          Phonetic posteriorgram probabilities across 40 phoneme categories, of
          dimension 40xT at a frame rate of 100 Hz. 29,289 records in version 3.1.0.
      - id: doi:10.13026/37yb-1t42#features-static-features
        name: static_features.tsv
        path: features/static_features.tsv
        format: TSV
        description: >-
          Features derived from the raw audio with one row per unique recording,
          drawn from openSMILE, Praat, parselmouth and torchaudio.
      - id: doi:10.13026/37yb-1t42#features-audio-quality-metrics
        name: audio_quality_metrics.tsv
        path: features/audio_quality_metrics.tsv
        format: TSV
        description: >-
          Quality control metrics derived from the raw audio, one row per recording.
          Added in version 3.1.0.
  - id: doi:10.13026/37yb-1t42#phenotype
    name: phenotype
    collection_type: processed_data
    path: phenotype
    description: >-
      Information collected from the participant or another individual during the
      encounter, organized into five subfolders. The confounders and demographics
      subfolders hold one table each; the diagnosis subfolder holds a table for each
      condition, from airway stenosis and amyotrophic lateral sclerosis through
      laryngeal cancer, laryngeal dystonia and Parkinson's disease to unilateral
      vocal fold paralysis, and a control table; the enrollment subfolder holds
      eligibility, enrollment form and participant tables; the questionnaire
      subfolder holds the validated instruments including VHI-10, PHQ-9, GAD-7,
      PANAS, the custom affect scale, DSM-5 adult, PTSD adult, ADHD adult, the
      dyspnea index, the Leicester cough questionnaire, productive vocabulary,
      psychiatric history and voice perception; and the task subfolder holds acoustic
      task, Harvard sentences, random item generation, recording, session, Stroop and
      Winograd tables. Every table has a JSON data dictionary whose entries give a
      one-sentence description of the column, the question asked of the participant
      where there was one, and the response data type.
  - id: doi:10.13026/37yb-1t42#metadata
    name: metadata
    collection_type: metadata
    path: metadata
    description: >-
      A Parquet file and its data dictionary carrying information specific to each
      recording, including the task instructions and prompts and details of the
      microphone used and its gain. Added in version 3.1.0.

distribution_formats:
  - name: PhysioNet credentialed-access release of derived features
    format: Parquet, TSV and JSON
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    description: >-
      The derived feature, phenotypic and metadata files are distributed through
      PhysioNet, which is maintained by the MIT Laboratory for Computational
      Physiology. Access requires the user to be a credentialed PhysioNet user and to
      sign the data use agreement for the project; no training is required.
    source_caveats: >-
      The access policy changed across versions. Version 1.1 is described as
      restricted access, open to registered users who sign the specified data use
      agreement; versions 3.0.0 and 3.1.0 are described as credentialed access, open
      to credentialed users who sign the data use agreement. The current release's
      policy is stated here.
  - name: Synapse controlled-access release of raw audio
    format: WAV
    access_urls:
      - https://www.synapse.org/Synapse:syn72370534/
    description: >-
      Raw audio for the adult cohort is disseminated separately under controlled
      access, because it carries a heightened risk of re-identification. Requests go
      to the access committee at DACO@b2ai-voice.org, and access requires
      institutional sign-off.
  - name: Health Data Nexus release of the earlier feature-only dataset
    format: Feature-only tables served with cloud compute
    access_urls:
      - https://healthdatanexus.ai/
    description: >-
      Version 1.0 of the feature-only dataset was published on the Health Data Nexus,
      a data publishing platform that provides cloud compute alongside the dataset
      rather than allowing downloads, under DOI 10.57764/qb6h-em84. This is a
      historical distribution; later versions are published on PhysioNet.

distribution_dates:
  - name: PhysioNet version release dates
    release_dates:
      - '1.1: 17 January 2025'
      - '2.0.0: 16 April 2025'
      - '2.0.1: 18 August 2025'
      - '3.0.0: 16 December 2025'
      - '3.1.0: 1 May 2026'
    description: >-
      The dates on which each PhysioNet version of the adult dataset was published.
      The project documentation additionally records that the data was published and
      made available at the end of November 2024, which refers to the version 1.0
      release on the Health Data Nexus.

third_party_sharing:
  - name: Broad distribution outside the creating entity
    is_shared: true
    description: >-
      The dataset is distributed broadly to individuals outside the entity that
      created it, subject to the access mechanism appropriate to the sensitivity of
      the content.

license_and_use_terms:
  name: Bridge2AI Voice Registered Access License
  data_use_permission: general_research_use
  license_terms: >-
    Files are released under the Bridge2AI Voice Registered Access License, and users
    must sign the Bridge2AI Voice Registered Access Agreement, which sets out the
    terms and conditions of use. The dataset is intended solely for commercial and
    non-commercial research purposes by authorized researchers. Its use is not
    restricted to non-commercial purposes, to a specific geographic location, to a
    specific type of research, to genetic research, or to research that does not
    involve the development of methods or algorithms. There are no fees associated
    with the restrictions.
  description: >-
    Two agreements govern the dataset, matched to the sensitivity of the content.
    Feature-only data is released under registered or credentialed access: the user
    registers on PhysioNet, confirms their identity and signs the registered access
    agreement. Raw audio is released under controlled access: the user completes a
    Data Access Request Form and a Data Use Agreement, submits the application to the
    Data Access Compliance Office for review, and on approval has a Data Use and
    Transfer Agreement signed by an authorized official at their institution.

ip_restrictions:
  name: Intellectual property terms of the registered access agreement
  restrictions:
    - >-
      The data may be protected by copyright and other rights, including other
      intellectual property rights.
    - >-
      Duplication as reasonably required to carry out the user's research project is
      permitted.
    - Sale of all or part of the data on any media is not permitted.
    - >-
      Nothing in the agreement operates to transfer any intellectual property rights
      in or relating to the data to the user.
    - Users agree not to make intellectual property claims on the data.
    - >-
      Users agree not to use intellectual property protection in ways that would
      prevent or block access to, or use of, any element of the data or conclusions
      drawn directly from it.
    - >-
      Users may perform further research that adds intellectual and resource capital
      to the data and may obtain intellectual property rights on those downstream
      discoveries, provided they implement licensing policies that will not obstruct
      further research.
    - Users agree to respect the Fort Lauderdale Agreement.
  description: >-
    No intellectual-property-based restrictions have been imposed by third parties on
    the data associated with the instances.

regulatory_restrictions:
  name: Regulatory position of the dataset
  regulatory_restrictions:
    - No export controls apply to the dataset.
    - >-
      No export controls or other regulatory restrictions apply to individual
      instances.
    - >-
      The data transferred under the Data Transfer and Use Agreement is covered by a
      Certificate of Confidentiality, which must be asserted against compulsory legal
      demands such as court orders and subpoenas for identifying information or
      characteristics of a research participant.
  hipaa_compliant: compliant
  confidentiality_level: restricted
  other_compliance: >-
    The clinical study was submitted to and approved by the University of South
    Florida single IRB and by subsite IRBs through the single IRB process. It is not
    a study of a drug product or of a medical device, and no data monitoring
    committee was appointed. Recipients of the data must follow their own
    institutional policies and applicable federal, state and local law, including any
    IRB review required before use, and must store the data with safeguards adequate
    for personally identifiable information.
  description: >-
    PhysioNet describes the release as a restricted-access resource, available only
    to credentialed users who sign the data use agreement. The HIPAA de-identification
    rules were applied to the released data.

data_governance:
  name: Data Access Compliance Office
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: >-
    For the feature-only data, the user registers on PhysioNet, confirms their
    identity and signs the Bridge2AI Voice Registered Access Agreement. For raw
    audio, the user completes a Data Access Request Form and a Data Use Agreement and
    submits the application to the Data Access Compliance Office for review; on
    approval, a Data Use and Transfer Agreement is signed by an authorized official
    at the user's institution. Requests reach the access committee at
    DACO@b2ai-voice.org. Collaborators at other research organizations, and other
    research teams at the same organization, must apply independently for access and
    sign their own Data Transfer and Use Agreement before accessing the data.
  stewardship_roles:
    - >-
      Provider institution, which represents that it has the authority to share the
      data and that the recipient's project is consistent with the consents obtained
      from the individuals who are the subjects of the data.
    - >-
      Recipient scientist and recipient authorized institutional official, who accept
      the terms of the Data Transfer and Use Agreement on behalf of their institution.
    - >-
      Data Access Compliance Office, whose review and approval the agreement is
      subject to.
  accountable_organization:
    name: University of South Florida Board of Trustees
    description: >-
      The provider institution named in the Data Transfer and Use Agreement for the
      Voice project.
  description: >-
    A memorandum setting out the ethical justification for controlled access to raw
    voice samples is published alongside the governance documents. The agreement
    expires two years after its start date, on completion of the project, on
    expiration of the applicable ethics approval, or on termination, whichever occurs
    first, after which the data is destroyed in accordance with the provider's
    instructions and a written certification of destruction is returned within thirty
    days.

maintainers:
  - name: MIT Laboratory for Computational Physiology
    role: academic_institution
    maintainer_details: >-
      PhysioNet, which hosts the current adult releases, is maintained by the MIT
      Laboratory for Computational Physiology and supported by the National Institute
      of Biomedical Imaging and Bioengineering, the National Heart Lung and Blood
      Institute and the NIH Office of the Director.
  - name: Bridge2AI-Voice Consortium
    role: academic_institution
    maintainer_details: >-
      The consortium curates the dataset and answers questions about it. The dataset
      is supported by the NIH through the Bridge2AI project. Questions about the
      dataset itself go to the corresponding author listed on the release page, and
      requests for raw audio access go to the access committee at DACO@b2ai-voice.org.
  - name: Health Data Nexus, Temerty Centre for Artificial Intelligence Research and Education in Medicine
    role: academic_institution
    maintainer_details: >-
      The Health Data Nexus, a data publishing platform maintained by the Temerty
      Centre for Artificial Intelligence Research and Education in Medicine at the
      University of Toronto, hosted the earlier feature-only release and maintains the
      technical infrastructure for it.
    source_caveats: >-
      The project documentation site names the Health Data Nexus as the host that
      maintains the technical infrastructure and provides continued access. The
      PhysioNet release pages, which the input manifest ranks higher, name the MIT
      Laboratory for Computational Physiology as the maintainer of the platform
      carrying versions 1.1 through 3.1.0. The two statements are read as applying to
      different platforms and different releases rather than contradicting each other.

errata:
  - name: Changelog in place of an erratum
    erratum_details: >-
      There is no erratum. A changelog for each dataset version is published online
      with the dataset metadata, and the PhysioNet release pages carry release notes
      for every version from 1.0 onward describing what each release added or changed.

updates:
  name: Release cadence
  frequency: Semi-annual
  update_details: >-
    Further versions of the dataset are released on a semi-annual basis. Updates are
    distributed as new versions and users are notified through news items on the
    platform as well as through standard communication channels. The PhysioNet
    releases to date - January 2025, April 2025, August 2025, December 2025 and May
    2026 - are consistent with that cadence in aggregate. Version 3.1.0 was a minor
    update that released no new participants but added data for certain participants,
    fixed broken Parquet files, added audio quality metrics and per-recording
    metadata, back-filled validated diagnosis information, rearranged some phenotypic
    files and renamed certain gold standard variables.
  source_caveats: >-
    The semi-annual cadence is stated by the project documentation site with reference
    to the Health Data Nexus platform, whereas the current releases are published on
    PhysioNet.

retention_limit:
  name: Retention of contributed data
  retention_period: Indefinite for the research data; a maximum of ten years after study completion for identifiable data held locally
  retention_details: >-
    Once data is contributed it is retained as long as it is useful for research
    purposes, possibly indefinitely. Separately, identifiable data and the tables
    linking participant numbers to participant information are held at each
    institution on local cloud storage for a maximum of ten years after study
    completion and are then destroyed, which is the responsibility of each local
    principal investigator. Study-related material and original consent documents are
    stored for a minimum of five years after study completion, as required by the
    University of South Florida IRB.

version_access:
  name: Availability of earlier versions
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
    - '1.0'
    - '1.1'
    - '2.0.0'
    - '2.0.1'
    - '3.0.0'
    - '3.1.0'
  version_details: >-
    Each version of the dataset has its own DOI: 10.13026/249v-w155 for version 1.1,
    10.13026/k81f-qr68 for version 3.0.0 and 10.13026/8xbn-nq66 for version 3.1.0,
    with 10.13026/37yb-1t42 resolving to the latest version. Version 1.0 was published
    on the Health Data Nexus under 10.57764/qb6h-em84. The files for version 1.1 are
    no longer available from PhysioNet, which directs users to the latest version.
  source_caveats: >-
    The project documentation states that older versions will by default continue to
    be supported, hosted and made available to researchers, while reserving the
    publishers' right to remove access to older versions. The PhysioNet page for
    version 1.1, which the input manifest ranks higher, states that the files for that
    version are no longer available. The PhysioNet statement is preferred as the
    account of what is currently accessible.

extension_mechanism:
  name: Contributing to the dataset and its code
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    Others may publish a derivative dataset that references the original source, and
    such derivatives may be made available under the same conditions as the source
    data. For the code used to produce the data, the open-source repositories have
    discussion forums and issue pages for public discussion of data preprocessing and
    accept improvements through pull requests.

external_resources:
  - name: Self-contained release
    description: >-
      The dataset documentation states that the dataset is self-contained and does not
      rely on external resources, and that no restrictions, licenses or fees attach to
      external resources that might apply to a future user.

is_deidentified:
  name: De-identification of the released data
  identifiable_elements_present: false
  method: HIPAA Safe Harbor, with additional removal of indirect and highly sensitive elements
  identifiers_removed: >-
    Direct identifiers including name, civic address and social security number.
    HIPAA Safe Harbor identifiers including names, geographic locators, date
    information at a resolution finer than years, telephone and fax numbers, email
    addresses, IP addresses, social security numbers, medical record numbers, health
    plan beneficiary numbers, device identifiers, license numbers, account numbers,
    vehicle identifiers, website URLs, full-face photographs, biometric identifiers
    and any unique identifiers. State and province were removed while the country of
    collection was retained. Indirect identifiers were removed where their combination
    with other public data created a significant re-identification risk, including
    selected geographic and demographic identifiers and information about household
    composition or cultural identity. Non-identifying elements revealing highly
    sensitive information, such as household income, mental health status and
    traumatic life experiences, were also removed. Dates are rebased or replaced by
    integers, and narrative text fields are removed.
  deidentification_details: >-
    All raw voice data was removed from the released dataset, because a voice has the
    potential to cause individual re-identification or to be used for illicit or
    unauthorized purposes. Raw audio transcripts were reviewed and any recordings
    containing potentially identifying information or external voices were removed
    from the release. From version 3.0 onward, spectrograms and similar features were
    excluded where the audio contained free speech, while static features that do not
    encode sensitive information were retained. The dataset does not achieve
    k-anonymization at k of 2 or greater.

participant_privacy:
  - name: Privacy protections applied to the released data
    anonymization_method: >-
      HIPAA Safe Harbor identifier removal, supplemented by removal of indirect
      identifiers and of non-identifying but highly sensitive elements, and by
      withholding the raw audio from the public release.
    reidentification_risk: >-
      Residual. Even with all HIPAA-protected information removed, a voice is unique
      to a person and to their health at that point in their life, so it is always
      possible, if unlikely, that someone could recognize a participant's voice; a
      voice can never be fully de-identified. The dataset does not achieve
      k-anonymization at k of 2 or greater. The raw audio is withheld from the public
      release and disseminated only under controlled access for this reason.
    privacy_techniques: >-
      Data was extracted from the raw audio so that only derived features are released.
      Data posing a low risk of re-identification is shared under registered access
      with the general public, and data that would pose a heightened risk if shared in
      full open access is shared through a controlled access mechanism with authorized
      researchers.
    data_linkage: >-
      Each institution keeps its identifiable data within the institution, in
      password-protected REDCap databases accessible only to investigators at the site
      where the data was collected. De-identified data is shared through a joint meta
      database on cloud infrastructure hosted by an NIH STRIDES partner, with
      participant numbers and institution numbers created so that institutions can
      track and retain ownership of their own data. Federated learning is used so that
      models can be trained across institutions without the data leaving them.

participant_compensation:
  - name: Gift card compensation for adult participants
    compensation_provided: true
    compensation_type: Electronic gift cards
    compensation_amount: >-
      40 US dollars for a data collection session lasting under 90 minutes and 80 US
      dollars for a session lasting over 90 minutes, for no more than three sessions
      and a maximum of 120 US dollars.
    description: >-
      Compensation was provided to the adult population only.

human_subject_research:
  name: Human subjects oversight
  involves_human_subjects: true
  ethics_review_board: University of South Florida Institutional Review Board
  irb_approval:
    - >-
      University of South Florida Institutional Review Board, which approved the data
      collection and sharing and serves as the single IRB for the US sites.
    - >-
      Subsite institutional review boards of the participating US institutions,
      approved through the single IRB process.
    - >-
      Research ethics boards of the Canadian participating institutions, which do not
      follow the single IRB process and applied separately to comply with Canadian
      regulations.
  regulatory_compliance:
    - HIPAA
    - Certificate of Confidentiality
  description: >-
    The study is a prospective cohort study whose primary objective is to build a
    large multi-institutional database of human voices, speech and respiratory sounds
    linked to multimodal health biomarkers. It involves no intervention. A partial
    HIPAA waiver was obtained for recruitment, allowing the study team to review
    electronic health record information for incoming clinic patients against the
    study's inclusion criteria before approaching them; identifiers collected under
    the waiver are destroyed at the earliest opportunity consistent with the conduct
    of the research.

informed_consent:
  - name: Informed consent for collection and sharing
    consent_obtained: true
    consent_type: Prospective written informed consent, with electronic, remote and video options
    consent_documentation: >-
      Participants may consent by signing a physical paper copy, by indicating
      electronic consent within the application or through REDCap surveys, or through
      a video recording within the application in which the participant reads a
      statement aloud. Paper consent documents are uploaded and saved electronically
      in REDCap. All paper and electronic versions of consent are stored for a minimum
      of five years after the completion of the study.
    withdrawal_mechanism: >-
      Participants may withdraw at any point. Data provided before or during voice
      data collection is not included in the database if the participant withdraws at
      that stage; once collection is complete the data cannot be removed.
    consent_scope: >-
      Research data that does not contain direct identifiers is shared with external
      researchers for future research through a secure database. Data posing a low
      risk of re-identification is shared in registered access with the general
      public, and data that would pose a heightened risk if shared in full open access
      is shared through a controlled access mechanism with authorized researchers. The
      consent places no restriction limiting use to non-commercial purposes, to a
      geographic location, to a specific type of research, to genetic research, or to
      research that does not involve the development of methods or algorithms.

ethical_reviews:
  - name: University of South Florida single IRB review
    reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      Data collection and sharing was approved by the University of South Florida
      Institutional Review Board. The protocol was submitted to and approved by the
      USF single IRB and by subsite IRBs through the single IRB process. Each US
      participating institution submits its review under the single IRB at USF once
      the protocol is approved there. The protocol has been revised repeatedly, with
      thirteen recorded revisions between May 2023 and July 2025 covering the addition
      of the pediatric cohort, compensation for adult participants, electronic and
      remote consent, control data collection, remote enrollment and data collection
      platforms, Spanish-language collection, and additional collection sites.
  - name: Canadian research ethics board review
    reviewing_organization: >-
      Research ethics boards of Mount Sinai Hospital, the Hospital for Sick Children
      and the University of Toronto
    review_details: >-
      The Canadian institutions do not follow the single IRB process and applied for
      separate research ethics board approval to comply with Canadian regulations,
      submitting a copy of the approved application to the USF IRB. Genomic data is
      collected and analyzed only at the University of Toronto and Mount Sinai
      Hospital, under a separate protocol and research ethics board approval.

data_protection_impacts:
  - name: Impact analysis on data subjects
    impact_details: >-
      The project documentation records that no analysis of the potential impact of
      the dataset and its use on data subjects has been conducted.

related_datasets:
  - target_dataset: doi:10.13026/mf9s-5r03
    relationship_type: is_supplemented_by
    description: >-
      The Bridge2AI-Voice Pediatric Dataset is a separate PhysioNet release from the
      same consortium, covering 300 participants aged 2 to 18 recruited at the
      Hospital for Sick Children, with 23,533 recordings represented by derived
      features in version 1.1.0. It was collected with reproschema-ui rather than the
      adult collection application, and its collection and sharing was approved by the
      research ethics board at the Hospital for Sick Children rather than by the USF
      IRB. It is announced on the adult dataset's PhysioNet page and is a distinct
      dataset from this one.
    source_caveats: >-
      The sources describe the two as separate releases of the same project and do not
      name a typed relation between them, so the relationship type recorded here is
      the closest available term for a companion release rather than a claim taken
      from the evidence.
  - target_dataset: doi:10.57764/qb6h-em84
    relationship_type: is_new_version_of
    description: >-
      Version 1.0 of the feature-only dataset was published on the Health Data Nexus
      and is cited by the PhysioNet releases as the first release of the Bridge2AI
      voice as a biomarker of health dataset. The PhysioNet releases from version 1.1
      onward continue that lineage.
  - target_dataset: doi:10.5281/zenodo.14148755
    relationship_type: is_documented_by
    description: >-
      The Bridge2AI Voice REDCap record on Zenodo carries the REDCap data dictionary,
      metadata and instrument PDFs that define what was asked of participants, and the
      PhysioNet releases cite it as the source of the questionnaire structure.
    source_caveats: >-
      The bundle cites this resource at three different points and three different
      versions: version 3.20.0 at 10.5281/zenodo.14148755 on the version 1.1 release
      page, version 3.23.0 at https://zenodo.org/records/14989503 on the version 3.0.0
      and 3.1.0 release pages, and a concept record at
      https://zenodo.org/doi/10.5281/zenodo.12760724 on the project documentation site.
      One is recorded here and the others are named rather than merged into it.
