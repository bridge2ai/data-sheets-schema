id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health
  information'
description: >-
  The adult voice dataset generated by the Voice project, a Bridge2AI Precision Public
  Health grand challenge funded by the NIH Common Fund. The dataset couples recordings
  of standardized acoustic, speech and respiratory tasks with clinical diagnoses,
  demographics, acoustic confounders and validated questionnaire responses, so that
  voice can be studied as a biomarker of health. Version 3.1.0, published on PhysioNet
  on 1 May 2026, contains data for 833 participants collected across five sites in
  North America. Participants were selected on the basis of known conditions that
  manifest within the voice waveform - voice disorders, neurological and
  neurodegenerative disorders, mood and psychiatric disorders and respiratory
  disorders - alongside participants without those conditions who serve as controls.
  The published release contains data considered low risk: features derived from the
  raw audio (spectrograms, Mel spectrograms, MFCCs, pitch, articulatory traces and
  phonetic posteriorgrams) rather than the original recordings, together with
  phenotypic tables and per-recording metadata. Access to the derived features is
  granted to credentialed PhysioNet users who sign the data use agreement; the raw
  audio is disseminated separately under controlled access.
