citation: >-
  Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M., Dorr, D.,
  Payne, P., Ravitsky, V., Belisle-Pipon, J., Bahr, R., Watts, S., Bolser, D., Siu,
  J., Lerner-Ellis, J., Rudzicz, F., Boyer, M., Abdel-Aty, Y., Ahmed Syed, T.,
  Anibal, J., ... Ghosh, S. (2026). Bridge2AI-Voice: An ethically-sourced, diverse
  voice dataset linked to health information (version 3.1.0). PhysioNet.
  RRID:SCR_007345. https://doi.org/10.13026/8xbn-nq66
source_caveats: >-
  This record describes the adult Bridge2AI-Voice dataset published on PhysioNet.
  The bundle also contains the PhysioNet page for the Bridge2AI-Voice Pediatric
  Dataset, which is a separate release with its own DOI and its own research ethics
  approval; it is represented here through related_datasets and its facts are not
  merged into this record. Several sources in the bundle disagree. Where the
  disagreement could be resolved by the input manifest's ranking, the higher-ranked
  source was preferred and the disagreement recorded on the object it affects: the
  PhysioNet release pages are ranked above the project documentation site, which is
  ranked above the feasibility publication and the audiomics white paper, which are
  in turn ranked above the NIH RePORTER page. Where the disagreeing sources share a
  rank the ranking cannot decide, and both values are stated - most notably the
  target enrollment, which the IRB protocol gives as 30,000 participants and the
  project documentation gives as 10,000 voices, both at the same rank. Statements
  drawn from the IRB protocol describe the data acquisition study rather than any
  particular published release, and statements about the smartphone application's
  feasibility study describe 47 participants at a single site in 2023, a separate
  study that did not contribute recordings to this dataset.

