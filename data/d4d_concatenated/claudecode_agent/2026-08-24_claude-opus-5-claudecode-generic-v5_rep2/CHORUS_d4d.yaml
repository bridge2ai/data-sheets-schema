id: https://chorus4ai.org/
name: CHoRUS Dataset

description: >-
  The CHoRUS dataset is a multi-center, multimodal, AI-ready critical care dataset assembled by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  project, one of four data generation projects in the NIH-funded Bridge2AI consortium. It brings
  together retrospectively collected clinical data from patients admitted to intensive care units at
  14 data contributing hospitals, drawn from a network of 20 academic centers, harmonized to shared
  standards so that machine learning and artificial intelligence models can be developed to
  characterize acute and critical care illness, predict complications, and measure treatment response
  among patients with acute or critical illness.

  The current released dataset comprises 50,000 patient admissions from ICU, PICU and NICU, including
  1.6 billion rows of electronic health record data standardized to the OMOP Common Data Model, 7,642
  admissions with radiology data, and 23 Tb of waveform data. Nine data modalities are represented:
  demographics, medication administration, procedures, nursing flowsheets and diagnoses in the OMOP
  Common Data Model; clinical notes extracted and tokenized with the OHNLP toolkit; imaging from PACS
  in DICOM; waveform telemetry from bedside monitors in WFDB; and EEG waveforms in EDF+ and Persyst
  formats. The anticipated final dataset is 100,000 patient admissions across nine modalities from 14
  data contributing hospitals, assembled by a consortium of more than 60 members across 20
  institutions.

  Access to every modality is controlled and the data are held in a cloud enclave rather than
  distributed for download. Clinical note text is retained at the contributing sites, with only
  tokenized representations held centrally, and de-identification of imaging is in process for a
  cohort larger than the images currently available. The project also plans to provision a
  sequestered holdout test set that external parties can use to validate models.

status: Released

page: https://chorus4ai.org/

conforms_to: >-
  OMOP Common Data Model for demographics, medication administration, procedures, nursing flowsheets
  and diagnoses; OHNLP for clinical notes extracted and tokenized using the OHNLP toolkit; DICOM for
  imaging from PACS; WFDB for waveform telemetry from bedside monitors; EDF+ and Persyst for waveform
  EEG from hospital databases.

