source_caveats: >-
  Source disagreement on the number of admissions: the project documentation at chorus4ai.org (source
  id project_documentation, manifest tier 2) states that the current released dataset holds 50,000
  patient admissions, while the AIM-AHEAD Bridge2AI for Clinical Care cohort 2 informational webinar
  (source id cohort_2_webinar, tier 4) states that as of August 2025 the dataset covers 14 different
  hospitals with over 45K unique admissions. The tier-2 project documentation is preferred and 50,000
  is the figure recorded; both figures are stated here.

  The registration form, signed licensing agreement and ".edu" email requirements recorded under data
  governance are stated in the cohort 2 webinar and describe how participants in the AIM-AHEAD
  Bridge2AI for Clinical Care Training Program obtain access. The bundle does not state whether the
  same requirements govern every user of the dataset.

  The GitHub organization overview (source id github_organization_overview, tier 5) states "This
  project is licensed under the MIT License" on the chorus-ai organization README, alongside a
  repository listing in which individual repositories carry MIT and Apache-2.0 licenses. No source
  states a license for the dataset itself, whose access is controlled and conditioned on a signed
  licensing agreement, so no dataset-level license value is asserted here.

  The webinar's data-modality table lists a "Published metadata schema" of "Yes (OMOP schema)" four
  times and "Yes (OMOP schema with extensions)" once across the five OMOP modalities. The extracted
  text does not indicate which of the five modalities carries the extensions, so no modality is
  assigned that value.

  The bundle supplies no ORCID, ROR, or other registry identifier for any person or organization it
  names, and no DOI, download URL, or version identifier for the dataset. People and organizations are
  therefore recorded by name and affiliation only, and no Person object is emitted where the schema
  would require an identifier the evidence does not contain.

  Grant number: chorus4ai.org states award number OT2OD032701; NIH RePORTER gives project number
  1OT2OD032701-01 and core project number OT2OD032701 for the same award.

  Dataset name: the cohort 2 webinar titles the dataset both "CHoRUS Dataset" and "Bridge2AI for
  Clinical Care Dataset". Both statements are at the same manifest tier, so the ranking cannot decide
  between them; "CHoRUS Dataset" is used as the record's name and the alternative is recorded here.

  Project page: https://chorus4ai.org/ is used as this record's identifier, following the identifier
  the sources themselves use. The GitHub organization overview additionally gives
  www.bridge2ai.org/chorus as a project website.

  The chorus4ai.org page carries a banner, repeated twice, stating "This repoitory is under review for
  potential modification in compliance with Administration directives" (spelling as in the source).

purposes:
  - name: Generate an AI-ready critical care dataset
    response: >-
      To meet the need for high-resolution, multi-center data supporting artificial intelligence and
      machine learning in critical care, by generating data for ML/AI applications aimed at
      characterizing acute and critical care illness, predicting complications, and measuring
      treatment response among patients with acute or critical illness. The project's overarching goal
      is a publicly available, AI-ready critical care dataset developed by methods that promote
      privacy, accountability and clinical benefit.
  - name: Provision a holdout test set for external model validation
    response: >-
      To sequester a holdout test set, accessible for external validation of models, in order to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care.
  - name: Establish ethically sourced data, tools and best practices for AI in health
    response: >-
      To work with the other Bridge2AI data generation projects to create ethically sourced datasets
      and tools around artificial intelligence, and to create best practices for AI in health,
      including the ethical and legal approaches needed to manage privacy and bias while accounting
      for social determinants of health.

tasks:
  - name: Characterizing acute and critical care illness
    response: >-
      The dataset is generated for ML/AI applications aimed at characterizing acute and critical care
      illness among patients with acute or critical illness.
  - name: Predicting complications
    response: >-
      The dataset is generated for ML/AI applications aimed at predicting complications among patients
      with acute or critical illness. A visualization and annotation environment is planned to label
      data with targets important for prediction.
  - name: Measuring treatment response
    response: >-
      The dataset is generated for ML/AI applications aimed at measuring treatment response among
      patients with acute or critical illness.

addressing_gaps:
  - name: Lack of infrastructure for AI/ML in critical care
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning in critical care, and developing high-resolution multi-center data sets is a critical
      first step towards actionable and trustworthy AI.
  - name: Absence of unified standards across clinical data modalities
    response: >-
      Multi-modal electronic health record, waveform, imaging and text data are not harmonized across
      centers. CHoRUS develops unified standards and validated semantic mappings to connect clinical
      data in various source formats to international standards, and standard operating procedures
      instructing contributing sites how to curate and deliver interoperable datasets.
  - name: Absence of a legal and ethical framework for collecting clinical data at scale
    response: >-
      A legal framework is needed for collecting data at scale, together with community-facing ethics
      work to determine what data is appropriate for public sharing and patient-focused approaches to
      managing privacy and bias.
  - name: Shortage of AI expertise in the clinical and lay community
    response: >-
      Expertise must be cultivated in the lay and scientific community to improve AI literacy and
      utilization through multimodal educational approaches, developing the skills and workforce for a
      next generation of diverse academic and community AI scientists.

