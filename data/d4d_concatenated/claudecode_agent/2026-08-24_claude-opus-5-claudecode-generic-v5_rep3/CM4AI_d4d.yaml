    description: >-
      The June 2026 Data Release of CM4AI and the current release at capture. This Beta release
      includes perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment and for
      undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 cells with and without
      treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived neural progenitor cells, neurons
      and cardiomyocytes; AP-MS data for MDA-MB-468 cells with treatment, appearing in the release
      series for the first time; and immunofluorescence images in MDA-MB-468 cells with and without
      treatment. Subject: Medicine, Health and Life Sciences. Deposited by Justin Niestroy on
      2025-02-27. The record reports 181 downloads at capture.
