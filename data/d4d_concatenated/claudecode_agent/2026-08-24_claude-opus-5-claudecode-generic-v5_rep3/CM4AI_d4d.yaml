id: https://cm4ai.org/
name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI)
description: >-
  CM4AI is the Functional Genomics Data Generation Project of the U.S. National Institutes of
  Health Bridge2AI program. It delivers machine-readable hierarchical maps of cell architecture as
  AI-ready data, together with quarterly data releases of the map-input data streams. The input
  streams are produced by multimodal interrogation of chromatin modifiers, metabolic enzymes and
  other proteins implicated in cancer, neuropsychiatric and cardiac disorders, measured in
  disease-relevant human cell lines under treated and untreated conditions: affinity
  purification-mass spectrometry (AP-MS) and size-exclusion chromatography-mass spectrometry
  (SEC-MS) for protein-protein interactions, immunofluorescence subcellular microscopy for spatial
  proteomics, and single-cell CRISPR/Cas9 perturbation screens (perturb-seq). The cell lines under
  investigation are the triple-negative breast cancer line MDA-MB-468, treated with paclitaxel or
  vorinostat or left untreated, and the KOLF2.1J induced pluripotent stem cell line, undifferentiated
  or differentiated into neural progenitor cells, neurons and cardiomyocytes. Output data are
  packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using an
  extended client-server version of the FAIRSCAPE framework, and archived in LibraData, the
  University of Virginia's instance of Dataverse. The project reports aggregate figures of 1,374
  protein interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739
  genes targeted and a data volume of 21.4 TB. Successive quarterly releases are recorded here as
  resources; each carries its own DOI, version, file inventory and checksums.
notes: >-
  The record's referent is the CM4AI release program as an ongoing quarterly series, with the
  individual Dataverse releases enumerated as resources.
source_caveats: >-
  The declared bundle contains ten sources of five kinds: the CM4AI project preprint, a Nature
  research article, an NIH RePORTER project page, two CM4AI project web pages, the Creative Commons
  BY-NC-SA 4.0 deed, and four University of Virginia Dataverse release records (March 2025, June
  2025, October 2025 and June 2026). Where the sources disagree the higher-ranked source in the
  input manifest was preferred and the disagreement is recorded on the affected value. The Nature
  article in the bundle reports a multimodal cell map of U2OS osteosarcoma cells that was funded in
  part by the same Bridge2AI award; its data are deposited in NDEx, MassIVE, ProteomeXchange and
  ModelArchive rather than in the CM4AI Dataverse releases, so it is recorded here as an external
  resource and a related publication and its contents are not represented as part of this dataset.
