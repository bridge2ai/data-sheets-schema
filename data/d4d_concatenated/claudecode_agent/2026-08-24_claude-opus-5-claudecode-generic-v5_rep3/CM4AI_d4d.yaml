purposes:
  - name: Deliver AI-ready hierarchical maps of cell architecture
    response: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready data, produced
      from multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in
      cancer, neuropsychiatric and cardiac disorders in disease-relevant cell lines under perturbed
      and unperturbed conditions.
  - name: Map the spatiotemporal architecture of human cells
    response: >-
      To map the spatiotemporal architecture of human cells and use those maps toward the grand
      challenge of interpretable genotype-phenotype learning, through three complementary mapping
      approaches: proteomic mass spectrometry, cellular imaging, and genetic perturbation via
      CRISPR/Cas9.
  - name: Enable visible machine learning systems
    response: >-
      To generate a resource of matched data and tools that enables the creation of "visible" machine
      learning systems, which are built directly on knowledge maps of cell and tissue architecture
      rather than operating as black boxes.
  - name: Produce ethical, FAIR, AI-ready datasets
    response: >-
      To produce ethical, AI-ready datasets of cell architecture that are FAIR, provenanced,
      characterized, explainable and ethically obtained, validated, documented, licensed and
      distributed, so that biomedical AI research can rely on them.
  - name: Implement a FAIR standards and provenance approach
    response: >-
      To implement a standards-based data management approach founded on FAIR access and software
      principles, with deep provenance and replication packages representing cell maps and their
      underlying datasets.

tasks:
  - name: Interpretable genotype-phenotype learning
    response: >-
      Interpretable genotype-phenotype learning, in which predictions from genome to phenotype are
      traced through the cellular structures that mediate them rather than produced by an
      uninterpretable model.
  - name: Visible neural network construction
    response: >-
      Construction of visible machine learning models, or visible neural networks, in which protein
      assemblies drawn from a cell map form the internal structure of the model and can be
      interrogated for their effect on cell-level phenotype predictions.
  - name: Interpretation of genetic variants and mutations
    response: >-
      Interpretation of genetic variants and mutations in human genomics by locating them within the
      hierarchy of protein assemblies a cell map describes.

addressing_gaps:
  - name: Black-box machine learning in genomics
    response: >-
      Machine learning models in genomics and precision medicine are typically difficult-to-interpret
      black boxes that predict phenotypes from genotypes without exposing the mechanisms by which
      that translation occurs. CM4AI addresses that deficiency by supplying knowledge maps of cell
      and tissue architecture on which visible models can be built.
  - name: Much of subcellular architecture remains uncharted
    response: >-
      Human cells are organized across a spatial hierarchy of components, much of which remains
      uncharted, and the individual mapping technologies have typically been applied separately.
      CM4AI addresses this by generating and integrating multiple complementary data modalities in
      matched cellular contexts.
  - name: Absence of ethical, fully provenanced AI-ready biomedical data
    response: >-
      Datasets used to train and to be analyzed by AI models are subject to requirements -- FAIR
      compliance, machine-readable provenance graphs, complete schemas and datasheets, explainability
      and ethical sourcing and distribution -- that existing functional genomics resources do not
      collectively meet. CM4AI addresses this gap through its AI-readiness framework.
  - name: Workforce gaps in biomedical AI and machine learning
    response: >-
      New training is needed to allow researchers to leverage the datasets produced by Bridge2AI and
      similar programs. CM4AI addresses this by broadly distributing its data and tools and providing
      training in their use.

