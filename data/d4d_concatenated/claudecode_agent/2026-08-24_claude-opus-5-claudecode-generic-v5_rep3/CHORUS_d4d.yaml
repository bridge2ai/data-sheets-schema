    name: Absence of infrastructure for AI and machine learning in critical care
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence and
      machine learning (AI/ML) in critical care.
  - id: https://chorus4ai.org/#gap-multicenter-high-resolution-data
    name: Absence of high-resolution multicenter critical care datasets
    response: >-
      Developing high-resolution multi-center data sets is a critical first step towards
      actionable and trustworthy AI.
  - id: https://chorus4ai.org/#gap-diverse-ethically-sourced-data
    name: Absence of a diverse, ethically sourced, AI-ready critical care dataset
    response: >-
