acquisition_methods:
  - id: https://chorus4ai.org/#acquisition-retrospective-extraction
    name: Retrospective extraction from hospital clinical systems
    acquisition_details: >-
      Data collection is retrospective. Fourteen data contributing hospitals extract
      clinical data from their own systems and deliver it to CHoRUS following standard
      operating protocols, using the chorus-extract-upload tooling to create and upload a
      CHoRUS data extract. Extracted data are standardized to the OMOP Common Data Model
      and transformed using approaches that limit re-identification before being made
      available under controlled access.
    description: >-
      An interactive workflow diagram in the Chorus_SOP repository describes the
      step-by-step process for extracting and contributing clinical data to CHoRUS, with
      links to standard operating protocol documents that have undergone internal
      validation and review.

collection_mechanisms:
  - id: https://chorus4ai.org/#mechanism-structured-ehr
    name: Structured electronic health record extraction
    mechanism_details: >-
      Structured electronic health record content is extracted from site systems and mapped
      to the OMOP Common Data Model. It comprises demographics; medication administration,
      with dosing time-stamped upon each infusion change or dose administration; procedures
      documented by providers; nursing flowsheets, which are high-frequency documentation;
      and diagnoses documented by providers.
  - id: https://chorus4ai.org/#mechanism-clinical-notes
    name: Clinical note extraction and tokenization
    mechanism_details: >-
      Clinical notes are extracted and tokenized using the OHNLP toolkit. The notes
      themselves are stored locally at the contributing site; only the tokens are carried
      into the shared environment.
  - id: https://chorus4ai.org/#mechanism-imaging-pacs
    name: Imaging retrieval from picture archiving and communication systems
    mechanism_details: >-
      Imaging is retrieved from hospital PACS and carried in DICOM.
  - id: https://chorus4ai.org/#mechanism-waveform-telemetry
    name: Waveform telemetry capture from bedside monitors
    mechanism_details: >-
      Waveform telemetry is captured from bedside monitors by way of gateway and middleware
      systems and carried in WFDB.
  - id: https://chorus4ai.org/#mechanism-eeg
    name: EEG extraction from the hospital EEG database
    mechanism_details: >-
      EEG waveforms are extracted from the hospital EEG database and carried in EDF+ and
      Persyst formats. As of August 2025 this extraction was in process.

sampling_strategies:
  - id: https://chorus4ai.org/#sampling-balanced-diverse-cohort
    name: Sampling for a balanced and diverse cohort
    is_sample: true
    source_data: >-
      Patients with acute or critical illness admitted to ICU, PICU and NICU at the 14 data
      contributing hospitals within the 20-center CHoRUS collaboration.
    strategies: >-
      Federated access enables sampling methods that ensure a balanced and diverse cohort.
      The project samples to ensure comprehensive sets of patient conditions and clinical
      treatment strategies, and ensures that data elements feature appropriate contextual
      factors such as geographic distance to the nearest hospital.
    source_caveats: >-
      The sources describe the sampling aims but state no sampling algorithm, no
      randomization, and no verification that the resulting cohort is representative, so
      is_random, is_representative and representative_verification are left unpopulated.

data_collectors:
  - id: https://chorus4ai.org/#collector-data-acquisition-centers
    name: CHoRUS data acquisition centers
    role: data contributing site
    collector_details: >-
      Fourteen of the 20 academic centers in the CHoRUS collaboration contribute as data
      acquisition centers. Data site managers at each site follow the extraction and
      contribution workflow documented in the Chorus_SOP repository and report progress in
      creating and curating their CHoRUS-specific clinical data extract, either through the
      GitHub interface or by submitting a Google Form whose submissions update status and
      issue information through the GitHub API.
  - id: https://chorus4ai.org/#collector-clinical-collaborators
    name: CHoRUS clinical collaborators
    role: clinical validation and semantic mapping
    collector_details: >-
      Clinical collaborators contribute clinical expertise to semantic mapping and
      validation through the chorus-mapping repository, which holds documentation, pooled
      tabular mappings and an associated clinical validation standard operating protocol.

collection_timeframes:
  - id: https://chorus4ai.org/#timeframe-retrospective
    name: Retrospective collection period
    timeframe_details: >-
      Collection is retrospective, so the timeframe over which the data were assembled does
      not match the timeframe in which the underlying records were created: the records
      were generated during patients' hospital care and extracted afterward.
    source_caveats: >-
      No source in the bundle gives calendar start or end dates for the period the
      underlying records cover, so start_date and end_date are left unpopulated. The
      project period of award OT2OD032701 runs 2022-09-01 to 2026-11-30, but that is the
      award period rather than a data collection window.

preprocessing_strategies:
  - id: https://chorus4ai.org/#preprocessing-omop-standardization
    name: Standardization to the OMOP Common Data Model
    preprocessing_details: >-
      Site data are acquired, standardized to the OMOP Common Data Model, tokenized, stored,
      visualized and labeled. Unified standards harmonize multi-modal EHR, waveform,
      imaging and text data. Validated semantic mappings connecting clinical data in
      various source formats to international standards are maintained in the
      chorus-mapping repository, together with a clinical validation standard operating
      protocol.
  - id: https://chorus4ai.org/#preprocessing-note-tokenization
    name: Tokenization of unstructured clinical text
    preprocessing_details: >-
      Tokenized unstructured electronic health record data are produced by extracting and
      tokenizing clinical notes with the OHNLP toolkit. The notes remain stored locally at
      the contributing site and only the tokens are carried into the shared environment.
  - id: https://chorus4ai.org/#preprocessing-limit-reidentification
    name: Transformation to limit re-identification
    preprocessing_details: >-
      Data are transformed using approaches that limit re-identification before being made
      available.
  - id: https://chorus4ai.org/#preprocessing-imaging-deidentification
    name: Imaging de-identification
    preprocessing_details: >-
      Imaging is de-identified before release. As of August 2025, 1000 images were
      available and de-identification was in process for a larger cohort.
  - id: https://chorus4ai.org/#preprocessing-geocoding
    name: Geocoding of OMOP Location entities
    preprocessing_details: >-
      The chorus-ai organization maintains UF-Geocoding, open source code to geocode OMOP
      Location entities via DeGauss, forked from bihorac-LAB/Exposome.

cleaning_strategies:
  - id: https://chorus4ai.org/#cleaning-site-characterization-reports
    name: Site characterization reports
    cleaning_details: >-
      The CHoRUSReports repository produces characterization reports that are returned to
      contributing sites following their data submissions.
    source_caveats: >-
      The sources name the reporting mechanism but state no criteria for removing or
      correcting instances and no accounting of instances removed.

labeling_strategies:
  - id: https://chorus4ai.org/#labeling-visualization-annotation-environment
    name: Visualization and annotation environment
    labeling_details: >-
      A visualization and annotation environment labels data with targets important for
      prediction. The project's stated capabilities across the multi-center network include
      labeling data alongside acquiring, standardizing, tokenizing, storing and visualizing
      it.
    source_caveats: >-
      The sources name no annotation platform, annotation protocol, number of annotations
      per item, inter-annotator agreement measure or annotator demographics, and the
      RePORTER abstract's sentence describing what data are labeled for is truncated in the
      source text.

is_deidentified:
  id: https://chorus4ai.org/#deidentification
  name: CHoRUS de-identification approach
  method: >-
    Tokenization of unstructured clinical text with the OHNLP toolkit, together with
    de-identification of imaging, before data are made available.
  deidentification_details: >-
    Data are transformed using approaches that limit re-identification. Clinical notes are
    stored locally at the contributing sites and only tokens are shared. As of August 2025,
    1000 images were available with de-identification in process for a larger cohort. The
    chorus-ai organization maintains a CTP-deid repository and privacy_scan_tool, a privacy
    scan tool for medical records.
  source_caveats: >-
    The sources name no de-identification standard such as HIPAA Safe Harbor, list no
    specific identifier types removed, and give no residual re-identification risk
    assessment, so method names only the techniques the sources describe and
    identifiers_removed is left unpopulated. Because de-identification is described as
    complete for some modalities and in process for others, no single value for
    identifiable_elements_present is supported by the evidence.

sensitive_elements:
  - id: https://chorus4ai.org/#sensitive-clinical-records
    name: Patient clinical records
    sensitive_elements_present: true
    sensitivity_details: >-
      The dataset comprises hospital records of critically ill patients, including
      demographics, medication administration, procedures, nursing flowsheets, diagnoses,
      clinical notes, imaging, waveform telemetry and EEG. Every data type the project
      lists is designated controlled access, and the project transforms data using
      approaches that limit re-identification.

confidential_elements:
  - id: https://chorus4ai.org/#confidential-clinical-notes
    name: Clinical note text
    confidential_elements_present: true
    confidentiality_details: >-
      Clinical notes are stored locally at the contributing sites rather than in the shared
      enclave; only tokens extracted with the OHNLP toolkit leave the site. OMOP and
      telemetry data are held in the enclave.

participant_privacy:
  - id: https://chorus4ai.org/#privacy-protections
    name: Privacy protections for patients whose records are included
    anonymization_method: >-
      Clinical notes are tokenized with the OHNLP toolkit and retained locally, imaging is
      de-identified, and data are transformed using approaches that limit re-identification.
    privacy_techniques: >-
      The chorus-ai organization maintains privacy_scan_tool, a privacy scan tool for
      medical records, and a CTP-deid repository.
    source_caveats: >-
      The sources describe the techniques applied but give no assessed re-identification
      risk and no statement about linkage to other datasets, so reidentification_risk and
      data_linkage are left unpopulated.

human_subject_research:
  id: https://chorus4ai.org/#human-subject-research
  name: Human subjects status of the CHoRUS dataset
  involves_human_subjects: true
  special_populations:
    - >-
      The current released dataset includes admissions from pediatric intensive care units
      (PICU) and neonatal intensive care units (NICU).
  description: >-
    The dataset comprises retrospectively collected hospital records of patients with acute
    or critical illness. The project establishes a legal framework for collecting data at
    scale and performs community-facing ethics focus groups to determine what data is
    appropriate for public sharing. Patient-focused efforts determine the ethical and legal
    approaches used to manage privacy and bias while accounting for social determinants of
    health, and the CHoRUS consortium evaluates community perspectives on clinical care AI
    to find ways to increase the trustworthiness of provenance and privacy in AI as the
    existing legal and regulatory landscape is analyzed.
  source_caveats: >-
    No source in the bundle names an IRB approval, an ethics review board, or a regulatory
    framework governing the dataset, so irb_approval, ethics_review_board and
    regulatory_compliance are left unpopulated. IRB protocol drafting and HIPAA and GDPR
    compliance appear in the bundle only as topics in the associated AIM-AHEAD training
    curriculum, not as statements about this dataset. No additional protections for the
    pediatric and neonatal admissions are described.

known_limitations:
  - id: https://chorus4ai.org/#limitation-modality-completeness
    name: Imaging and EEG modalities incomplete at the August 2025 snapshot
    limitation_type: coverage_limitation
    limitation_description: >-
      As of August 2025, imaging availability was limited to 1000 images with
      de-identification in process for a larger cohort, and EEG extraction was still in
      process.
    scope_impact: >-
      Analyses using imaging or EEG are constrained relative to those using the structured
      EHR content and waveform telemetry, which were already held in the enclave.
  - id: https://chorus4ai.org/#limitation-clinical-notes-local
    name: Clinical note text is not released
    limitation_type: coverage_limitation
    limitation_description: >-
      Clinical notes are stored locally at the contributing sites; only tokens extracted
      with the OHNLP toolkit are carried into the shared environment.
    scope_impact: >-
      Analyses that require the original clinical narrative cannot be performed on the
      shared data.
  - id: https://chorus4ai.org/#limitation-released-versus-anticipated
    name: Released dataset is smaller than the anticipated final dataset
    limitation_type: coverage_limitation
    limitation_description: >-
      The current released dataset comprises 50,000 patient admissions, against an
      anticipated final dataset of 100,000 patient admissions across 9 different data
      modalities from 14 data contributing hospitals.
    scope_impact: >-
      Coverage of patient conditions and treatment strategies in the released data is
      narrower than the coverage the completed dataset is designed to provide.
  - id: https://chorus4ai.org/#limitation-metadata-publication
    name: Published metadata schemas are not in place for every modality
    limitation_type: integration_limitation
    limitation_description: >-
      The project's data type table records metadata as published for some modalities and
      as planned for others.
    scope_impact: >-
      Modalities whose metadata is still planned are less readily discoverable and less
      readily integrated than those already carrying a published metadata schema.
    source_caveats: >-
      The webinar's data type table lost its column alignment in the text extraction of the
      source PDF. The presence of both "Yes" and "Planned" entries in the metadata columns
      is legible, but which modality carries which entry is not recoverable from the source
      text, so no per-modality attribution is made here.

existing_uses:
  - id: https://chorus4ai.org/#use-training-and-publications
    name: Training activities and publications
    examples:
      - AIM-AHEAD Bridge2AI for Clinical Care Training Program
    description: >-
      The datasets are being used for training activities and publications. The AIM-AHEAD
      Bridge2AI for Clinical Care Training Program expands access to CHoRUS data through
      engagement, AI training and mentorship, equipping trainees to apply AI/ML methods to
      big data analysis and to conduct research at the intersection of healthcare
      challenges and AI/ML using multi-modal datasets from a broad range of cohort
      participants. Cohort 2 of that program runs from November 17, 2025 to July 31, 2026
      and selects up to 30 trainees.

intended_uses:
  - id: https://chorus4ai.org/#intended-use-model-development
    name: AI and machine learning model development for acute and critical care
    use_category: research
    examples:
      - characterizing acute and critical care illness
      - predicting complications
      - measuring treatment response
    description: >-
      The dataset is intended to support the building of machine learning and artificial
      intelligence models that improve the care and outcomes of patients requiring critical
      care.
  - id: https://chorus4ai.org/#intended-use-external-validation
    name: External validation of AI models
    use_category: research
    description: >-
      The holdout test set is accessible for model external validation, to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - id: https://chorus4ai.org/#intended-use-training
    name: Hands-on training and workforce development
    use_category: educational
    description: >-
      The dataset supports hands-on training in the Bridge2AI AI/ML for Clinical Care
      ecosystem, covering Python and version control, structured EHR datasets, machine
      learning for clinical applications, clinical deep learning, the ethics of clinical
      AI, and the OHDSI/OMOP common data model, delivered through Jupyter notebooks,
      workshops and office hours on the Bridge2AI AI/ML for Clinical Care Collaborative
      Cloud.
    usage_notes: >-
      Trainees must complete a registration form and sign a licensing agreement before
      gaining access, and a ".edu" email address is required to gain access to the dataset.

