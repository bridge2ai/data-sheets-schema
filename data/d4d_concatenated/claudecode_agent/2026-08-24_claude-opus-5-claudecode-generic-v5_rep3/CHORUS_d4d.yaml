updates:
  id: https://chorus4ai.org/#update-plan
  name: Expansion toward the anticipated final dataset
  update_details: >-
    The dataset is being expanded toward an anticipated final dataset of 100,000 patient
    admissions across 9 different data modalities from 14 data contributing hospitals. As
    of August 2025, de-identification of a larger imaging cohort and extraction of EEG were
    in process, and published metadata schemas were planned for modalities that did not yet
    carry one.
  source_caveats: >-
    The sources describe work in progress but state no update frequency, no versioning
    policy and no mechanism for notifying users of changes, so frequency is left
    unpopulated.

extension_mechanism:
  id: https://chorus4ai.org/#extension-mechanism
  name: Site contribution and status reporting workflow
  extension_details: >-
    Data contributing sites create and upload a CHoRUS data extract using the
    chorus-extract-upload tooling, following the step-by-step workflow and standard
    operating protocol documents in the Chorus_SOP repository, which have undergone an
    internal validation and review process. Issues arising in the creation or submission of
    an extract are posted to the Standards or Data Acquisition discussion areas. Sites
    provide regular status updates either through the GitHub interface or by submitting a
    Google Form, whose submissions trigger a script that calls the GitHub API to update
    status and issue information; those statuses appear in the Standards Project or the
    Data Acquisition Project. Clinical collaborators contribute pooled tabular mappings
    through the chorus-mapping repository under an associated clinical validation standard
    operating protocol.
