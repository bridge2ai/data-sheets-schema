id: https://chorus4ai.org/
name: CHoRUS dataset
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution critical care dataset produced by
  the CHoRUS data generation project, one of four data generation projects in the NIH
  Common Fund Bridge2AI program. It is assembled from retrospectively collected hospital
  records of patients with acute or critical illness at 14 data contributing hospitals
  within a collaboration spanning 20 academic centers. Structured electronic health record
  content — demographics, medication administration, procedures, nursing flowsheets and
  diagnoses — is standardized to the OMOP Common Data Model; clinical notes are extracted
  and tokenized with the OHNLP toolkit; imaging is drawn from hospital PACS and carried in
  DICOM; waveform telemetry from bedside monitors is carried in WFDB; and EEG is carried in
  EDF+ and Persyst formats. The project website reports a current released dataset of 50,000
  patient admissions from ICU, PICU and NICU, comprising 1.6 billion rows of EHR OMOP data,
  7,642 admissions with radiology data and 23 Tb of waveform data, against an anticipated
  final dataset of 100,000 patient admissions across 9 data modalities. Access is
  controlled: OMOP and telemetry data are held in a cloud enclave, users register and sign
  a licensing agreement before access is granted, and a holdout test set is provisioned so
  that models can be validated externally.
page: https://chorus4ai.org/
conforms_to: OMOP Common Data Model
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset
keywords:
  - critical care
  - critical illness
  - acute care
  - artificial intelligence
  - machine learning
  - electronic health record
  - OMOP
  - waveform
  - telemetry
  - electroencephalography
  - imaging
  - social determinants of health
  - data standards
  - data acquisition
  - Bridge2AI
source_caveats: >-
  Two sources in the declared bundle give different admission counts. chorus4ai.org
  (source_priority tier 2) states a current released dataset of 50,000 patient admissions;
  the AIM-AHEAD cohort 2 informational webinar (tier 4) states that as of August 2025 the
  dataset "covers 14 different hospitals with over 45K unique admissions". The manifest
  ranks the project website higher, so 50,000 is the value stated in this record and the
  webinar figure is recorded here rather than asserted. The two are not necessarily
  inconsistent, since the webinar figure is dated August 2025 and the website figure
  carries no date. The NIH RePORTER abstract's figure of "more than 100,000 critically ill
  patients" describes the project's target and matches the website's anticipated final
  dataset of 100,000 admissions rather than the released dataset. The webinar's data type
  table lost its column alignment in the text extraction of the source PDF, so the data
  type and data standard pairings were recoverable but the per-row entries in the access
  control, metadata and published metadata schema columns were not; only the repeated
  "Controlled" access designation, which applies to every listed row, is asserted from that
  table. The chorus4ai.org page carries a site-wide banner reading "This repoitory is under
  review for potential modification in compliance with Administration directives", so the
  figures taken from it may be subject to change; the banner's spelling is the source's.
  The github_organization_overview source is classified in the manifest as historical
  documentation (tier 5) and is a capture dated 2025-11-14. No dataset DOI, version
  identifier, release date, or download URL appears in any source in the bundle. No source
  states a title for the dataset as distinct from the project: the title recorded here is
  the award and project title, which the NIH RePORTER record and the chorus-ai GitHub
  organization README both carry. The waveform volume is transcribed as the project website
  writes it, "23 Tb"; that source does not disambiguate terabits from terabytes and the
  unit has not been converted here. No personal identifier — ORCID or otherwise — and no
  organizational identifier such as a ROR appears anywhere in the bundle for any of the
  people or institutions named, so no such identifier is asserted in this record.

external_resources:
  - id: https://github.com/chorus-ai
    name: CHoRUS for Equitable AI GitHub organization
    description: >-
      The chorus-ai GitHub organization houses 28 repositories providing software and
      tooling to interact with and extract insight from clinical data in diverse formats,
      validated semantic mappings connecting clinical data in various source formats to
      international standards, standard operating protocols instructing data contributing
      sites on curating and delivering interoperable datasets, and project management
      overviews tracking data delivery status and task dependencies. Named repositories
      include chorus-container-apps (dockerized container applications deployed to support
      CHoRUS services on Azure), privacy_scan_tool (a privacy scan tool for medical
      records), chorus_waveform (waveform documentation and conversion scripts),
      Chorus_SOP (centralized standard operating protocol documentation), CADA,
      data_acq_SOP, CTP-deid, UF-Geocoding (open source code to geocode OMOP Location
      entities via DeGauss), chorus_waveform_resources, CHoRUSReports,
      chorus-extract-upload (tools to create and upload a CHoRUS data extract),
      chorus-apps-internal and cloud_public.
    source_caveats: >-
      The organization README states "This project is licensed under the MIT License",
      which in that document governs the organization's software repositories; the
      Chorus_SOP repository is separately listed as Apache-2.0 and chorus_waveform,
      chorus-extract-upload and UF-Geocoding as MIT. No license is stated for the data.
  - id: https://reporter.nih.gov/project-details/10472824
    name: NIH RePORTER record for award OT2OD032701
    description: >-
      NIH RePORTER project page for application ID 10472824, project number
      1OT2OD032701-01, carrying the award abstract, the principal investigator, the
      awardee organization and the project period.
  - name: Bridge2AI CHoRUS project page
    external_resources:
      - www.bridge2ai.org/chorus
    description: >-
      Listed as the CHoRUS website in the contact section of the chorus-ai GitHub
      organization README.
  - id: https://www.aim-ahead.net/media/jnzdnid3/bridge2ai-for-clinical-care-informational-webinar-cohort-2.pdf
    name: AIM-AHEAD Bridge2AI for Clinical Care Training Program cohort 2 informational webinar
    description: >-
      Informational webinar deck dated September 09, 2025 for cohort 2 of the AIM-AHEAD
      Bridge2AI for Clinical Care Training Program, which expands access to CHoRUS data
      through engagement, AI training and mentorship. It describes the dataset's contents,
      data standards and access route.

purposes:
  - id: https://chorus4ai.org/#purpose-ai-ready-critical-care-dataset
    name: Develop a publicly available, AI-ready critical care dataset
    response: >-
      To develop a publicly available, AI-ready critical care dataset while ensuring the
      methods promote privacy, accountability and clinical benefit.
    description: >-
      The overarching goal stated in the NIH RePORTER abstract for award OT2OD032701. The
      project addresses the challenges of acquiring an AI-ready dataset from more than
      100,000 critically ill patients through three pillars: Data (standards, tool
      development and optimization, and data acquisition), Ethics (ethical and trustworthy
      AI) and People (team science, and skill and workforce development).
  - id: https://chorus4ai.org/#purpose-ml-ai-applications-critical-illness
    name: Generate data for AI and machine learning applications in acute and critical illness
    response: >-
      To meet the need of generating data for ML/AI applications aimed at characterizing
      acute and critical care illness, predicting complications, and measuring treatment
      response among patients with acute or critical illness.
    description: >-
      Stated in the NIH RePORTER abstract as the purpose of the CHoRUS data generation
      project, motivated by the urgent need for infrastructure to support artificial
      intelligence and machine learning in critical care.
  - id: https://chorus4ai.org/#purpose-holdout-external-validation
    name: Provision a holdout test set for external model validation
    response: >-
      To provision a holdout test set, accessible for model external validation, to aid
      marketplace adoption of AI-developed models for implementation in acute and critical
      care.
  - id: https://chorus4ai.org/#purpose-grand-challenge-recovery
    name: Answer the grand challenge of improving recovery from acute illness
    response: >-
      To develop the most diverse, high-resolution, ethically sourced, AI-ready dataset to
      answer the grand challenge of improving recovery from acute illness.
    description: >-
      Stated as the goal of the CHoRUS Network in the chorus-ai GitHub organization README.
  - id: https://chorus4ai.org/#purpose-ethical-sourcing-best-practices
    name: Create ethically sourced datasets, tools and best practices for AI in health
    response: >-
      To work with projects to create ethically sourced datasets and tools around
      artificial intelligence and to create best practices for AI in health.
    description: >-
      Stated on the CHoRUS project website as the goal shared across the four data
      generation projects of the NIH-funded Bridge2AI consortium.

