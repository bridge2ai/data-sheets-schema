third_party_sharing:
  - id: https://chorus4ai.org/#third-party-sharing
    name: Controlled distribution outside the contributing institutions
    is_shared: true
    description: >-
      The dataset is made available to parties outside the contributing institutions under
      controlled access. Users complete a registration form, sign a licensing agreement, and
      are provisioned compute; OMOP and telemetry data are worked with in a cloud enclave.
      Federated access enables sampling methods that ensure a balanced and diverse cohort,
      and a holdout test set is accessible for external validation of models.

license_and_use_terms:
  id: https://chorus4ai.org/#license-and-use-terms
  name: CHoRUS licensing agreement
  license_terms: >-
    All participants must sign a licensing agreement, included in the registration form,
    before gaining access to the dataset.
  description: >-
    Access to the dataset is controlled and is governed by a licensing agreement signed
    during registration. Program administrators assist with this requirement where needed,
    and it is stated not to be a barrier to acceptance into the training program.
  source_caveats: >-
    No source in the bundle states a license for the data themselves, and no source states
    the terms the licensing agreement contains, so the top-level license slot is left
    unpopulated. The chorus-ai GitHub organization README states "This project is licensed
    under the MIT License", which in that document governs the organization's software
    repositories rather than the data. The sources also state no Data Use Ontology
    permission category and name no licensing contact, so data_use_permission and
    contact_person are left unpopulated.

data_governance:
  id: https://chorus4ai.org/#data-governance
  name: CHoRUS controlled access process
  access_review_process: >-
    Participants complete a registration form giving name, email and institution, and sign
    a licensing agreement included in that form. A ".edu" email address is required to gain
    access to the dataset. Once access is granted and compute is provisioned, an email is
    sent to the applicant. Program administrators assist with the licensing and email
    address requirements where needed, and neither requirement is a barrier to acceptance
    into the training program. Requests for access are directed to dbold@emory.edu or
    jared.houghtaling@tuftsmedicine.org according to the chorus-ai GitHub organization
    README.
  stewardship_roles:
    - >-
      Data site managers at data contributing sites, who extract and submit their site's
      clinical data extract following the published standard operating protocols and report
      submission status.
    - >-
      Clinical collaborators, who contribute clinical expertise to semantic mapping and
      validation through the chorus-mapping repository.
    - >-
      Project managers, who track tasks among CHoRUS members and across teams and track the
      status of data contributing sites to identify and resolve blocking issues.
    - >-
      Software developers, who produce and maintain the open-source tooling for
      transforming and interacting with clinical data, documented for contributors and
      users in the chorus-developer repository and tracked on a package status page.
  description: >-
    Access to CHoRUS data is controlled for every data type the project lists.
  source_caveats: >-
    The sources name no access committee, state no decision timeframe, describe no appeal
    process, and name no organization accountable for the dataset over time, so
    committee_name, committee_members, committee_contact, access_decision_timeframe,
    appeal_process and accountable_organization are left unpopulated. Massachusetts General
    Hospital is the awardee organization of the funding award, which is not a statement
    about stewardship of the data.

