id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  An ethically sourced, demographically diverse dataset of adult human voice, speech and
  respiratory sounds linked to clinical and questionnaire data, generated by the Voice
  project of the NIH Common Fund Bridge2AI program and published on PhysioNet. Version
  3.1.0, released 1 May 2026, contains data for 833 adult participants recruited at five
  sites in North America across four clinical cohorts (voice disorders, neurological and
  neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders)
  together with control participants. The published release contains derived audio
  features rather than the original waveforms: torchaudio spectrograms, Mel spectrograms,
  MFCCs and pitch contours, Speech Articulatory Coding estimates of articulator position,
  loudness, periodicity and pitch, phonetic posteriorgrams, and static openSMILE, Praat
  and Parselmouth features, distributed as Parquet and tab-delimited files with JSON data
  dictionaries. Alongside the features the release carries per-participant phenotype data
  organized as demographics, confounders, per-condition diagnosis tables, enrollment
  records, validated questionnaires and acoustic task metadata. Data were collected
  prospectively in clinic on iPads using a custom application built by the project, with
  diagnoses validated by a clinician against cohort-specific gold standards. Access to the
  feature-only release requires PhysioNet credentialing and a signed data use agreement;
  the raw audio is disseminated separately under controlled access through Synapse.
