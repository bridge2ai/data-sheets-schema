notes: >-
  The project documentation publishes a self-assessment of the release against the
  Bridge2AI AI-readiness criteria (Table 4, "Precision Public Health (Voice) - Current
  Rating"). FAIRness, provenance, pre-model explainability and ethics score 100 per cent;
  characterization scores 80 per cent, with data quality the unmet criterion;
  computability scores 75 per cent, with contextualization unmet; and sustainability
  scores 50 per cent, with domain-appropriateness and association unmet.

source_caveats: >-
  Sources in the bundle disagree in several places, and the input manifest's
  source_priority ranking was used to decide. (1) Personal name spellings: the project
  documentation writes "Jennifer Sui" and "Frank Rudzizc" where the PhysioNet release
  pages write "Jennifer Siu" and "Frank Rudzicz"; PhysioNet is a tier 1 data resource and
  the project documentation is tier 2, so the PhysioNet spellings are stated. (2)
  Distribution platform: the project documentation healthsheet answers that the dataset is
  distributed through the Health Data Nexus at https://healthdatanexus.ai/ and is hosted
  by that platform, while the tier 1 PhysioNet sources show versions 1.1 through 3.1.0
  published on PhysioNet; PhysioNet is stated as the current channel and the Health Data
  Nexus is recorded as the platform carrying the earlier feature-only version 1.0. (3)
  Recording counts: the project documentation states that version 3.0 contains about
  61,937 voice-derived recordings from 833 adult participants, while the tier 1 PhysioNet
  pages report per-feature row counts rather than one recording total; the PhysioNet
  per-feature counts are stated. (4) Release versions: the manifest declares
  physionet_3_0_0 superseded by physionet_3_1_0, which settles that pair regardless of
  tier, so version 3.1.0 values are stated and version 3.0.0 values are retained only
  where their historical scope is explicit. The project documentation answers some
  healthsheet questions with respect to version 2.0.0 (study population, language
  options) and others with respect to version 3.0.0 (no external multimodal data
  released); those statements are retained with their release scope named. (5) The
  feasibility publication reports IRB number 004890 at the University of South Florida for
  the Bridge2AI-Voice application feasibility study, which is a separate study from the
  data acquisition protocol; that number is therefore not recorded as this dataset's IRB
  approval. (6) Two award identifiers on the project documentation page are garbled in the
  source text ("3TF-OT2ActfOD032720Projectf01S1" and "Award #3Tf-OTOD03272001S2") and are
  not recorded as grant numbers. (7) Contact e-mail addresses on the project documentation
  page are redacted in the bundle as "[email protected]", so contact routes are recorded only
  where an address appears elsewhere in the bundle. (8) No ORCID, ROR or other personal or
  organizational registry identifiers appear anywhere in the bundle, so Creator,
  Organization and Person identifiers are omitted rather than supplied from outside the
  evidence. (9) The Bridge2AI-Voice Pediatric Dataset is present in the bundle as source
  physionet_pediatric_1_1_0 and is a separate PhysioNet project with its own DOI, cohort,
  collection site, protocol and ethics approval; it is expressed through related_datasets
  and its facts are not merged into this record. (10) The project documentation states
  both that no pre-processing was performed to clean the data and that a pre-release audit
  protocol is run; both statements come from that same document and are recorded
  separately rather than reconciled. (11) Three investigator affiliations differ between
  sources and were decided by the same ranking. The feasibility publication's group-member
  list places Frank Rudzicz at Dalhousie University, Vardit Ravitsky at the University of
  Montreal and Alistair Johnson at the University of Toronto; the project documentation and
  the IRB protocol place them at the University of Toronto, The Hastings Center and the
  Hospital for Sick Children respectively. Those two sources are tier 2 and the feasibility
  publication is tier 3, so the tier 2 affiliations are stated.

purposes:
  - id: doi:10.13026/37yb-1t42#purpose-clinical-ml
    name: Enable clinically applicable machine-learning models built on voice
    response: >-
      The dataset aims to enable the development, benchmarking, or validation of clinically
      applicable machine-learning models for diagnosing a wide range of health conditions
      using voice data, including vocal pathologies, neurological, psychiatric, respiratory,
      and pediatric voice disorders.
  - id: doi:10.13026/37yb-1t42#purpose-voice-as-biomarker
    name: Establish voice as a non-invasive biomarker of health
    response: >-
      The goal is to facilitate the use of voice as a non-invasive, cost-effective biomarker
      for the screening, diagnosis, and monitoring of a wide range of health conditions, and
      to integrate the use of voice as a biomarker of health into clinical care.
  - id: doi:10.13026/37yb-1t42#purpose-ethically-sourced-resource
    name: Provide an ethically sourced, publicly available voice resource
    response: >-
      The project set out to create a flagship, standardized and ethically sourced dataset
      of voices linked to health information, so that voice AI researchers have access to a
      publicly available resource without depending on private-sector data holdings that
      cannot be externally audited.

tasks:
  - id: doi:10.13026/37yb-1t42#task-disease-classification
    name: Disease detection and classification from voice
    response: >-
      The tasks are primarily designed for training machine-learning models for disease
      detection and classification using voice data. Labels include diagnostic categories
      such as vocal pathologies, neurological disorders, psychiatric conditions, and
      respiratory disorders.

addressing_gaps:
  - id: doi:10.13026/37yb-1t42#gap-sample-size-and-metadata
    name: Small, thinly documented prior voice datasets
    response: >-
      Previous studies on machine learning-based voice diagnosis produced promising results,
      but their sample sizes were too small, or they lacked the key metadata needed for
      training robust, clinically useful models. When machine-learning applications for
      screening and diagnosis of laryngeal cancer were reviewed, most studies reported
      training datasets of fewer than 300 patients and only two used more than one data
      modality.
  - id: doi:10.13026/37yb-1t42#gap-collection-standards
    name: Absence of standards for acoustic data collection
    response: >-
      Comparing studies and pooling data is challenging because of the lack of standards in
      how voice and speech data are collected and measured, which precludes meta-analysis.
      The project addresses this by developing new standards of acoustic and voice data
      collection and analysis, and by creating bioinformatics standards for voice data so
      that the resulting data are interoperable.
  - id: doi:10.13026/37yb-1t42#gap-auditable-open-data
    name: Private industry datasets that cannot be audited
    response: >-
      Within industry, voice datasets are often private, limiting the ability to audit
      machine-learning models and the accuracy of training data labels, and industry holders
      of large voice corpora lack accurate clinical or demographic annotation. An openly
      distributed, clinically validated dataset makes external auditing and fair
      representation of diverse populations possible.

