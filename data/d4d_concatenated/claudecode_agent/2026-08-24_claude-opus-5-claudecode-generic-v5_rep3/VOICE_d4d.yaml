subsets:
  - id: doi:10.13026/37yb-1t42#cohort-voice-disorders
    name: Voice disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with laryngeal cancer, laryngitis, pre-cancerous lesions, benign lesions
      of the vocal cord, muscle tension dysphonia, spasmodic dysphonia or laryngeal tremor,
      unilateral vocal fold paralysis, and glottic insufficiency or presbyphonia. Gold
      standard validation for this cohort uses laryngoscopy images and stroboscopy videos,
      with CT scan and spirometry additionally used for unilateral vocal fold paralysis.
  - id: doi:10.13026/37yb-1t42#cohort-respiratory-disorders
    name: Respiratory disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with airway stenosis, including bilateral vocal fold paralysis and
      supraglottic, glottic, posterior glottic, subglottic, tracheal and multi-level upper
      airway stenosis, and participants with unexplained chronic cough of more than eight
      weeks. Gold standard validation uses spirometry with flow volume loops and CT scan of
      the neck and chest.
  - id: doi:10.13026/37yb-1t42#cohort-neurological-disorders
    name: Neurological and neurodegenerative disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants aged 44 to 85 with a clinical diagnosis of mild cognitive impairment,
      Alzheimer's disease, other dementias, amyotrophic lateral sclerosis, or Parkinson's
      disease and related parkinsonian syndromes. Gold standard validation uses brain CT,
      brain MRI and whole genome sequencing, with serum p-tau protein markers additionally
      used for Alzheimer's disease.
  - id: doi:10.13026/37yb-1t42#cohort-mood-psychiatric-disorders
    name: Mood and psychiatric disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with depression or major depressive disorder, bipolar disorder, anxiety
      disorder, social anxiety disorder, panic disorder, post-traumatic stress disorder,
      obsessive-compulsive disorder, attention-deficit/hyperactivity disorder, autism
      spectrum disorder, schizophrenia, borderline personality disorder, eating disorder,
      insomnia or sleep disorder, alcohol or substance use disorder, and other psychiatric
      disorders. Gold standard validation uses the electronic health summary, a clinical
      diagnosis from a psychiatrist, and medication history.
  - id: doi:10.13026/37yb-1t42#cohort-controls
    name: Controls
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants who are not diagnosed with or treated for a voice, respiratory,
      pediatric, mood or neurological disorder affecting voice, cough, breath or speech, and
      who serve as controls in the database. Control participants are represented in the
      release by their own diagnosis table.
    notes: >-
      The project defines five disease cohort categories for its acquisition effort. The
      fifth, pediatric voice and speech disorders, is collected under a separate protocol at
      a separate site and released as a separate dataset, so it is not a subset of this one.

instances:
  - id: doi:10.13026/37yb-1t42#instance-participant
    name: Participant
    instance_type: >-
      A person: each instance is an adult participant, linked to the audio-derived features
      of that participant's recordings, to self-reported demographic, confounder and
      questionnaire responses, and to clinically validated diagnosis information.
    counts: 833
    label: true
    label_description: >-
      Diagnostic labels are the result of a clinical assessment of the participant. At each
      site, a local clinician provided the diagnosis based on a clinical interview and
      appropriate work-up. For the psychiatric disorders cohort, this assessment was
      determined by using the participant's electronic health record or an active
      prescription, which was done outside of data collection by an appropriately licensed
      clinician.
    description: >-
      Version 3.1.0 contains data for 833 participants across five sites in North America.
      Because participants may have repeated visits, a participant may have more than one
      recording session and therefore more than one row in the data files, and there is no
      requirement that a participant give the same response at each visit.
    missing_information:
      - name: Optional and cohort-specific questionnaire responses
        missing:
          - Responses to optional questionnaire items
          - Responses to questionnaires outside a participant's primary diagnostic category
          - Rows in phenotype files where every column would be missing
        why_missing:
          - Some questions are optional
          - >-
            Each individual answered a common set of questions and then responded to
            additional questions relevant to their primary diagnostic category
          - >-
            Phenotype data files only contain rows for a participant if at least one column
            is not missing
      - name: Derived features absent for some recordings
        missing:
          - >-
            Spectrograms, Mel spectrograms, MFC coefficients, phonetic posteriorgrams and
            electromagnetic articulography estimates for sensitive records and audio checks
          - Certain features for individual recordings
        why_missing:
          - >-
            Features derived from audio containing free speech or classified as sensitive
            were removed from the release
          - >-
            Some files, whether due to length or other issues, could not generate certain
            features and so are not included in the bundled data

anomalies:
  - id: doi:10.13026/37yb-1t42#anomaly-site-configuration-and-protocol-drift
    name: Site-to-site configuration differences and protocol change over time
    anomaly_details: >-
      Different sites have different collection configurations, and the collection protocol
      changed over the course of the study. Distinct iPad devices were used at each site,
      and the head-mounted headset microphone could be at slightly different distances from
      one recording to another.
  - id: doi:10.13026/37yb-1t42#anomaly-noise-and-response-quality
    name: Acoustic noise and self-report quality
    anomaly_details: >-
      Confounding factors present in the data include noise artifacts, variations in
      diagnostic practices, inaccurate questionnaire responses, and underreporting.

known_biases:
  - id: doi:10.13026/37yb-1t42#bias-geographic-representation
    name: Limited geographic coverage
    bias_type: representation_bias
    bias_description: >-
      The data are a sample of a larger, ongoing collection and are not representative,
      because they were collected at a limited number of geographic locations. Five
      recording sites in the United States and Canada are included.
    mitigation_strategy: >-
      The project intends to make the data more representative by shifting to remote
      collection and by designing the recruiting approach so that it controls for more
      variables.
  - id: doi:10.13026/37yb-1t42#bias-recruitment-trust-and-proximity
    name: Recruitment bias by trust and proximity
    bias_type: selection_bias
    bias_description: >-
      Groups that have less trust in the medical system or in AI, or who are less proximal
      to the collection sites, would have been less likely to be recruited.
  - id: doi:10.13026/37yb-1t42#bias-site-device-label-confounding
    name: Device and site confounded with diagnostic label
    bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders based on site, so participants with
      different diagnoses also had their data collected with different devices. Device and
      site are therefore confounded with the diagnostic label.
  - id: doi:10.13026/37yb-1t42#bias-cohort-imbalance
    name: Unequal representation of disease categories
    bias_type: sampling_bias
    bias_description: >-
      The public data releases do not contain an equal distribution of the disease cohort
      categories, and the dataset has skews based on disorder category, site and other
      demographic factors.
    mitigation_strategy: >-
      Users should consider the multivariate distribution when assessing utility for
      different questions. Further releases are stated to contain additional data.
    affected_subsets:
      - Voice disorders cohort
      - Respiratory disorders cohort
      - Neurological and neurodegenerative disorders cohort
      - Mood and psychiatric disorders cohort
      - Controls

known_limitations:
  - id: doi:10.13026/37yb-1t42#limitation-english-only
    name: English-language participants only
    limitation_type: coverage_limitation
    limitation_description: >-
      Participants who do not read or speak English were excluded, and English was the only
      language used for communication with study participants.
    scope_impact: >-
      Findings and models derived from the dataset may not transfer to speakers of other
      languages.
    recommended_mitigation: >-
      Spanish versions of the protocol are under development and Spanish protocols and data
      collection are stated to be included in future releases.
  - id: doi:10.13026/37yb-1t42#limitation-no-raw-audio
    name: Raw audio withheld from the published release
    limitation_type: scope_limitation
    limitation_description: >-
      In this release audio waveforms are omitted and only derived features are made
      available. All raw voice data was removed because it has the potential to cause
      individual re-identification or to be used for illicit or unauthorized purposes.
    scope_impact: >-
      Analyses that require the original waveform, or features other than those already
      derived, cannot be run against the published release.
    recommended_mitigation: >-
      Raw audio is disseminated separately under a controlled access mechanism through
      Synapse, on application to the Data Access Compliance Office.
  - id: doi:10.13026/37yb-1t42#limitation-no-external-modalities
    name: Imaging, genomic and other electronic health record data not released
    limitation_type: scope_limitation
    limitation_description: >-
      Imaging, genomic data for the neurological cohort, laryngoscopy imaging and other
      electronic health record data are extracted at each site and uploaded through the
      REDCap database, but no external data was released in the version 3.0.0 release.
    scope_impact: >-
      The multimodal linkage the project describes is not exercisable from the published
      release, which carries audio-derived features and phenotype data only.
  - id: doi:10.13026/37yb-1t42#limitation-single-labeler
    name: One clinician label per instance
    limitation_type: methodological_limitation
    limitation_description: >-
      A single labeler provided one label per instance. The clinical diagnosis, depending on
      the disorder, was performed by one clinician or based on an electronic health record
      entry or a prescription, and human-level performance on the applications the dataset
      addresses varies widely.
    scope_impact: >-
      No inter-annotator agreement can be computed, and label reliability varies with the
      condition and the route by which the diagnosis was established.
  - id: doi:10.13026/37yb-1t42#limitation-distribution-shift
    name: Distribution shift over time
    limitation_type: temporal_limitation
    limitation_description: >-
      Changes in diagnostic criteria or practices over the collection period could be a
      source of distribution shift.
    scope_impact: >-
      Models trained on earlier participants may not transfer cleanly to later ones, and
      release-to-release comparisons may reflect changing practice rather than changing
      voice.
  - id: doi:10.13026/37yb-1t42#limitation-unaudited-model-outputs
    name: Machine-generated data elements not audited for correctness
    limitation_type: methodological_limitation
    limitation_description: >-
      The dataset has been audited internally for missingness and consistency by the data
      release team, but certain aspects of the data, for example transcription, were
      generated using off-the-shelf models that have not been audited for correctness.
    scope_impact: >-
      Derived elements produced by third-party models carry unquantified error into any
      downstream analysis that uses them.

confidential_elements:
  - id: doi:10.13026/37yb-1t42#confidentiality
    name: Confidential content assessment
    confidential_elements_present: false
    confidentiality_details: >-
      The dataset is documented as containing no data that might be considered confidential,
      such as data protected by legal privilege or by doctor-patient confidentiality, or the
      content of individuals' non-public communications.

content_warnings:
  - id: doi:10.13026/37yb-1t42#content-warning-free-speech
    name: Free speech content
    content_warnings_present: true
    warnings:
      - >-
        The dataset includes the transcription of free speech tasks; while offensive,
        insulting or threatening content is unlikely, it cannot be completely avoided, as
        research participants are responsible for their choice of language.
    description: >-
      The warning reflects the dataset-level assessment. In the published releases,
      transcripts of free speech audio were removed, and spectrograms and similar features
      were excluded where the audio contained free speech.

subpopulations:
  - id: doi:10.13026/37yb-1t42#subpopulations
    name: Identified demographic sub-populations
    subpopulation_elements_present: true
    identification: >-
      The dataset identifies age, gender, sex, ethnicity and socioeconomic status.
      Demographic data are collected through the data collection application and include
      age, sex, gender, race and ethnicity, and language, together with education level,
      employment status and other factors that could affect voice and speech.

sensitive_elements:
  - id: doi:10.13026/37yb-1t42#sensitive-elements
    name: Sensitive data elements
    sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes race information, sexual orientation information, and
      socioeconomic and health information. Non-identifying elements that revealed highly
      sensitive information, such as household income, mental health status and traumatic
      life experiences, were removed from the release, as were all fields encoded as
      sensitive in the REDCap data dictionary.

relationships:
  - id: doi:10.13026/37yb-1t42#relationships
    name: Relationships between instances
    relationship_details: >-
      Relationships between individual instances are not made explicit; the participants are
      unrelated to one another. Within a participant, recordings and phenotype rows are
      linked by a participant identifier and a session identifier, and a participant who
      attended more than one session has more than one session recorded.

splits:
  - id: doi:10.13026/37yb-1t42#splits
    name: Recommended data splits
    split_details: >-
      There are no predefined recommended data splits for training, validation, or testing.
      Researchers are encouraged to create their own data splits based on their specific
      requirements.

acquisition_methods:
  - id: doi:10.13026/37yb-1t42#acquisition
    name: Direct observation with participant self-report and clinician validation
    was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      The data were directly observable and reported by subjects. Clinical diagnoses were
      verified by clinicians reviewing audio or imaging data, looking at electronic health
      records, or checking medication prescriptions. Participants who consent also permit
      investigators to access medical information through electronic health record platforms
      in order to perform gold standard validation of diagnoses and symptoms.

collection_mechanisms:
  - id: doi:10.13026/37yb-1t42#mechanism-ios-app
    name: Bridge2AI Voice iOS application on tablet
    mechanism_details: >-
      Data were collected using a custom iPad application developed by the project, which
      hosts the acoustic task protocols, demographic and confounder surveys and validated
      questionnaires. Collection used iPads of the 9th or 10th generation and iPad Air 5th
      generation, with an Avid AE-36 microphone connected through an Apple dongle; a
      head-mounted headset with microphone was used for recording where possible. The
      application is HIPAA-compliant, stores data only during the collection phase, and
      sends data over a secure HTTPS protocol to a HIPAA-compliant storage server operated
      by an NIH STRIDES partner.
  - id: doi:10.13026/37yb-1t42#mechanism-web-app
    name: Bridge2AI Voice Web application
    mechanism_details: >-
      A browser-based application used for remote data collection, which runs on a computer,
      tablet or phone. No software is downloaded or installed, no login is required, and
      data are removed as soon as the page is closed. Remote data collection did not occur
      for the initial dataset release.
  - id: doi:10.13026/37yb-1t42#mechanism-redcap
    name: REDCap database
    mechanism_details: >-
      Clinical information collected from patient charts and electronic health records,
      including disease type, severity, symptoms, management and validated questionnaire
      scores, is entered into a password-protected REDCap database as part of the case
      report form. Questionnaire data were exported from REDCap and converted using an open
      source library developed by the project team.

sampling_strategies:
  - id: doi:10.13026/37yb-1t42#sampling
    name: Non-probability clinic-based sampling
    is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      A larger, ongoing collection of voice, speech and respiratory recordings linked to
      health information being assembled by the project across its participating
      institutions.
    why_not_representative: >-
      The data are not representative because they were collected at a limited number of
      geographic locations.
    strategies: >-
      Non-probability sampling. Participants are recruited across different academic
      institutions from high volume expert clinics, defined as outpatient clinics within
      hospital systems or academic institutions with expertise in a specific disease area
      that see more than 50 patients per month from the same disease category. Charts of
      patients presenting at those clinics are screened against the cohort inclusion and
      exclusion criteria before the clinic day, and eligible patients are offered
      enrollment. Recruitment also uses flyers, QR codes linking to a screening survey,
      approach in waiting rooms where approved, social media, and an online trial listing
      platform, and community outreach clinics serving underserved and under-represented
      populations are included to broaden the sample.

data_collectors:
  - id: doi:10.13026/37yb-1t42#collector-research-staff
    name: Research teams and research assistants
    role: Recruitment, consent and supervised data collection
    collector_details: >-
      Research teams, which may include medical, graduate or undergraduate students,
      coordinated with clinicians to identify appropriate participants, conducted the consent
      process, and assisted participants through the acoustic tasks in clinic.
  - id: doi:10.13026/37yb-1t42#collector-clinicians
    name: Clinicians and physicians
    role: Participant identification and clinical validation of diagnoses
    collector_details: >-
      Clinicians and doctors identified appropriate participants and provided the clinically
      validated diagnosis. They were listed under the IRB as co-investigators and were added
      to the consortium so that their names are included on consortium-level publications
      that emerge from the research.
  - id: doi:10.13026/37yb-1t42#collector-hospital-staff
    name: Hospital staff
    role: Logistical coordination
    collector_details: >-
      Hospital staff were not involved in scheduling but assisted in the logistics of
      coordinating data collection.

collection_timeframes:
  - id: doi:10.13026/37yb-1t42#timeframe
    name: Collection period
    timeframe_details: >-
      The data were collected over a period of 12 months. Acquisition is organized as a
      four-year phased program: an exploratory phase covering IT and cloud infrastructure,
      software and application development and collection from up to 180 participants was
      completed in November 2023; a pilot phase to cumulatively reach up to 600 participants
      at the main sites and at high volume expert clinics began in November 2023 and was
      ongoing in November 2024; expansion and outreach phases follow.

direct_collection:
  - id: doi:10.13026/37yb-1t42#direct-collection
    name: Direct collection from participants
    is_direct: true
    collection_details: >-
      Data were collected from the individuals in question directly, rather than obtained
      through third parties, with the exception of clinical validation information reviewed
      from the participants' own electronic health records under consent.

collection_notifications:
  - id: doi:10.13026/37yb-1t42#notification
    name: Notification of data collection
    notification_details: >-
      Participants were notified about the data collection: they went through an
      IRB-approved consent process in which the study was explained in detail, with about 30
      minutes spent on explanation and questions, and potential participants were asked to
      explain what they had understood in order to confirm their comprehension.

collection_consents:
  - id: doi:10.13026/37yb-1t42#collection-consent
    name: Prospective informed consent
    consent_details: >-
      All participants have been duly informed and agreed to the collection and use of their
      data via prospective informed consent. Consent takes place in the clinic setting of
      the recruiting high volume expert clinic conducted by research assistants, or remotely
      through REDCap survey forms, or electronically within the application, or through a
      video recording in which the participant reads a statement aloud so that the acoustic
      data submitted can be verified as belonging to the consented individual. Where data
      collection is delayed after consent, participants are notified of any changes and
      re-consented before collection, and for longitudinal cohorts an electronic consent is
      administered before each subsequent collection.

consent_revocations:
  - id: doi:10.13026/37yb-1t42#consent-revocation
    name: Withdrawal of consent
    revocation_details: >-
      Consenting participants are informed that they may withdraw from the study at any
      point. If a participant chooses to withdraw during or before the voice data collection,
      their data will not be included in the database. Participants are informed that
      research data, including voice recordings, cannot be removed from the database once
      the voice data collection process is completed. Participants who withdraw have the
      option to complete a satisfaction survey to help the team understand their reasons for
      withdrawal; completion is optional and no protected health information is collected.

missing_data_documentation:
  - id: doi:10.13026/37yb-1t42#missing-data
    name: Missing data in the release
    missing_data_patterns: >-
      Information is missing from individual instances. Phenotype data files only contain
      rows for a participant if at least one column is not missing, and because participants
      may have repeated visits there may be more than one row per participant with differing
      responses. Some recordings are absent from individual feature files, so the per-feature
      row counts differ from one another.
    missing_data_causes: >-
      Some questions are optional; there may be data collection irregularities; each
      individual answered a common set of questions and then only those additional questions
      relevant to their primary diagnostic category; features derived from sensitive records,
      audio checks and free speech were removed from the release; and some files, whether
      due to length or other issues, could not generate certain features.
    handling_strategy: >-
      The dataset has been audited internally for missingness and consistency by the data
      release team, and a missingness table is included with the dataset. Each data file is
      accompanied by a JSON data dictionary describing every column, the question that
      prompted it and its data type.

raw_data_sources:
  - id: doi:10.13026/37yb-1t42#raw-source-audio
    name: Prospectively recorded acoustic tasks
    source_description: >-
      Voice, speech, breathing and cough recordings captured prospectively from consenting
      participants performing the project's acoustic task protocol on a tablet application,
      with a head-mounted headset microphone where tolerated.
    source_type: Prospectively collected audio recordings
    raw_data_format: >-
      Audio waveforms, converted to monaural and resampled to 16 kHz during preprocessing and
      organized in the Brain Imaging Data Structure layout as WAV files with accompanying
      JSON sidecars.
    access_details: >-
      Not included in the PhysioNet release. Raw audio is disseminated through controlled
      access only, via Synapse, on application to the Data Access Compliance Office at
      DACO@b2ai-voice.org.
  - id: doi:10.13026/37yb-1t42#raw-source-questionnaires
    name: Participant-reported demographic, confounder and questionnaire data
    source_description: >-
      Self-reported demographic information, questions about confounders such as smoking and
      hydration, and disease-specific validated questionnaires and patient-reported outcomes,
      completed by participants within the data collection application.
    source_type: Participant-reported survey data
    raw_data_format: >-
      Questionnaire responses captured in the application and exported from REDCap, then
      converted to tab-delimited files with JSON data dictionaries.
    access_details: >-
      Released in derived form in the phenotype folder of the PhysioNet release under
      credentialed access.
  - id: doi:10.13026/37yb-1t42#raw-source-clinical
    name: Clinical validation data from electronic health records
    source_description: >-
      Diagnosis, disease severity, symptoms, management, validated questionnaire scores and
      gold standard investigations reviewed from each participant's electronic health record
      by site clinicians and entered into the case report form.
    source_type: Clinical records
    raw_data_format: REDCap case report form entries
    access_details: >-
      Identifiable clinical records remain within each collecting institution and are not
      shared. Validated diagnosis information appears in the release only in the per-condition
      diagnosis tables.

raw_sources:
  - id: doi:10.13026/37yb-1t42#raw-audio-retention
    name: Retained raw audio
    access_url: https://www.synapse.org/Synapse:syn72370534/
    raw_data_details: >-
      The raw data were saved in addition to the preprocessed data and are not accessible
      publicly. The published PhysioNet project contains derived features from the audio
      waveforms and does not contain raw audio. Accessing raw audio is a more involved
      process and requires institutional sign-off; requests go to the access committee at
      DACO@b2ai-voice.org, and the data are made available via Synapse.

ethical_reviews:
  - id: doi:10.13026/37yb-1t42#ethics-usf-irb
    name: University of South Florida Institutional Review Board
    reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      Data collection and sharing was approved by the University of South Florida
      Institutional Review Board. The protocol was submitted and approved by the USF single
      IRB and by subsite IRBs through the single IRB process; once approved at the University
      of South Florida, each participating US institution submits its review under that
      single IRB. The clinical study is not for a drug product or a medical device, and no
      data monitoring committee was appointed.
  - id: doi:10.13026/37yb-1t42#ethics-canadian-reb
    name: Canadian research ethics board review
    reviewing_organization: >-
      Research ethics boards of Mount Sinai Hospital, the Hospital for Sick Children and the
      University of Toronto
    review_details: >-
      Canadian institutions do not fall under the US single IRB process and applied
      separately to their own research ethics boards to comply with Canadian regulations,
      submitting a copy of the approved application to the University of South Florida IRB.
      Genomic data are collected and analyzed only at the University of Toronto and Mount
      Sinai Hospital, under a separate protocol and separate research ethics board approval.

data_protection_impacts:
  - id: doi:10.13026/37yb-1t42#dpia
    name: Impact analysis on data subjects
    impact_details: >-
      No analysis of the potential impact of the dataset and its use on data subjects has
      been conducted.

human_subject_research:
  id: doi:10.13026/37yb-1t42#human-subject-research
  name: Human subject research status
  involves_human_subjects: true
  ethics_review_board: >-
    University of South Florida Institutional Review Board, acting as the single IRB of
    record for United States sites
  irb_approval:
    - >-
      Submitted and approved by the USF single IRB and subsite IRBs through the single IRB
      process
    - >-
      Data collection and sharing was approved by the University of South Florida
      Institutional Review Board
    - >-
      Canadian participating institutions applied separately to their own research ethics
      boards, and a separate protocol and approval covers genomic data collection at the
      University of Toronto and Mount Sinai Hospital
  special_populations:
    - >-
      Participants from socially and economically disadvantaged and underserved populations,
      recruited through community outreach clinics under a Plan for Enhancing Diverse
      Perspectives
    - >-
      Adults with cognitive impairment, dementia or psychiatric conditions, enrolled through
      the neurological and mood cohorts
  regulatory_compliance:
    - Health Insurance Portability and Accountability Act
    - Common Rule
    - Certificate of Confidentiality
    - Good Clinical Practice guidelines
  description: >-
    The project is a prospective cohort study whose only intervention is data collection.
    Adult participants must be 18 years or older; the maximum age is 120 years, healthy
    volunteers are eligible, and both sexes are enrolled. A partial HIPAA waiver was granted
    for recruitment so that the study team may review electronic health record information
    for incoming clinic patients ahead of their appointments, limited to the study's
    inclusion criteria.

informed_consent:
  - id: doi:10.13026/37yb-1t42#informed-consent
    name: Informed consent for collection and sharing
    consent_obtained: true
    consent_type: >-
      Prospective written informed consent, with electronic consent in REDCap or within the
      application, and video-recorded consent as an alternative that also verifies that the
      submitted acoustic data belong to the consented individual.
    consent_documentation: >-
      Paper consent documents are uploaded and saved electronically in REDCap. All paper and
      electronic versions of consent are stored for a minimum of five years after completion
      of the study, following required University of South Florida procedure, and original
      paper consent documents cannot be destroyed until five years after study completion.
    withdrawal_mechanism: >-
      Participants may withdraw at any point. Data provided before completion of voice data
      collection are excluded from the database; data already completed are retained,
      because the purpose of the project is to provide an open-source database rather than to
      analyze the data collected.
    consent_scope: >-
      Research data that do not contain direct identifiers will be shared with external
      researchers for future research through a secure database. Data that pose a low risk of
      individual re-identification are shared under registered access with the general
      public, and data that would pose a heightened risk if shared in full open access are
      shared through a controlled access mechanism with authorized researchers. The consent
      is not restricted to non-commercial use, to a specific geographic location, to a
      specific type of research, to genetic research, or to research that does not involve
      the development of methods or algorithms.

participant_privacy:
  - id: doi:10.13026/37yb-1t42#participant-privacy
    name: Privacy protections for participants
    anonymization_method: >-
      Removal of HIPAA Safe Harbor identifiers, application of the HIPAA de-identification
      rules, rebasing or replacement of dates by integers, generalization or removal of
      geographic information with state and province removed and country of collection
      retained, and removal of narrative text fields.
    reidentification_risk: >-
      Each person's voice is unique and can never be fully de-identified, so it is always
      possible, even if unlikely, that someone could recognize a participant's voice; raw
      audio is therefore withheld from the public release and disseminated only under
      controlled access. The release does not achieve k-anonymization at k of two or greater.
    privacy_techniques: >-
      Tiered dissemination with registered access for the feature-only data and controlled
      access for raw audio; removal of all fields encoded as sensitive in the REDCap data
      dictionary; removal of transcripts of free speech and of spectrograms, Mel
      spectrograms, MFC coefficients, phonetic posteriorgrams and electromagnetic
      articulography estimates derived from free speech or sensitive records; and manual
      review of raw audio transcripts, with recordings containing potentially identifying
      information or external voices removed from the release.
    data_linkage: >-
      Participants are represented by a study participant identifier and a session
      identifier. Each institution keeps its identified data within the institution, with
      protected health information held in password-protected REDCap databases accessible
      only to investigators at the collecting site, and de-identified data are shared through
      a joint meta-database on cloud infrastructure hosted by an NIH STRIDES partner.
      Federated learning is used so that models can be trained across institutions without
      the underlying data leaving them.

participant_compensation:
  - id: doi:10.13026/37yb-1t42#compensation
    name: Participant compensation
    compensation_provided: true
    compensation_type: Electronic gift cards
    compensation_amount: >-
      40 US dollars for a data collection session lasting under 90 minutes and 80 US dollars
      for a session lasting over 90 minutes, for no more than three sessions and a maximum
      total of 120 US dollars.
    compensation_rationale: >-
      Compensation is provided for participants' time, and is provided to the adult
      population only.

preprocessing_strategies:
  - id: doi:10.13026/37yb-1t42#preprocessing-audio-standardization
    name: Audio standardization
    preprocessing_details: >-
      Raw audio was preprocessed by converting to monaural and resampling to 16 kHz, with a
      Butterworth anti-aliasing filter applied.
    used_software:
      - id: https://github.com/sensein/b2aiprep
        name: b2aiprep
        version: 3.0.0
        url: https://github.com/sensein/b2aiprep
        description: >-
          The open source library the project developed to organize and preprocess the
          dataset, including converting the raw audio waveforms into the Parquet feature files
          and merging the source data into the phenotype files. Version 3.1.0 of the dataset
          was generated with b2aiprep v3.0.0.
  - id: doi:10.13026/37yb-1t42#preprocessing-feature-extraction
    name: Derivation of audio features
    preprocessing_details: >-
      From the standardized audio the release derives spectrograms of dimension 201 by T
      using the short-time Fast Fourier Transform with a 25 ms window, 10 ms hop and
      400-point FFT, further downsampled by a factor of two in the time domain; Mel
      spectrograms of dimension 60 by T with 60 Mel bins at the same parameters; 60
      Mel-frequency cepstral coefficients derived from those spectrograms; pitch contours
      with a minimum and maximum pitch of 80 and 500 Hz; articulatory features from the
      Speech Articulatory Coding package giving electromagnetic articulography estimates for
      six articulators, together with loudness, periodicity and pitch at 50 Hz with a pitch
      range of 50 to 550 Hz; phonetic posteriorgrams over 40 phoneme categories at 100 Hz;
      static acoustic features from openSMILE; and phonetic and prosodic measures of
      fundamental frequency, formants and voice quality computed with Praat and Parselmouth.
      Audio quality control metrics are also derived per recording.
    used_software:
      - id: https://github.com/sensein/senselab
        name: SenseLab
        url: https://github.com/sensein/senselab
        description: >-
          The open source library used to process audio files for research tasks.
  - id: doi:10.13026/37yb-1t42#preprocessing-bids-conversion
    name: Conversion to the Brain Imaging Data Structure
    preprocessing_details: >-
      The raw audio files and the questionnaire data retrieved from ReproSchema-UI or
      exported from REDCap were converted to be compliant with the Brain Imaging Data
      Structure v1.9.0, giving a layout with a top-level phenotype tree of confounders,
      demographics, per-condition diagnosis tables, enrollment forms, questionnaires and
      acoustic task metadata, and one subject and session directory per participant holding
      the audio and its JSON sidecars.
  - id: doi:10.13026/37yb-1t42#preprocessing-transcription
    name: Transcription of speech tasks
    preprocessing_details: >-
      Transcriptions were generated using OpenAI's Whisper Large model. Transcripts of free
      speech audio were subsequently removed from the release, and raw audio transcripts were
      reviewed so that recordings containing potentially identifying information or external
      voices could be removed.

cleaning_strategies:
  - id: doi:10.13026/37yb-1t42#cleaning-none
    name: No cleaning pre-processing
    cleaning_details: >-
      No pre-processing was performed to clean the data. The preprocessing applied to the
      release consists of de-identification and of standardization and feature derivation
      from the raw audio, and no instances were excluded from the dataset at the time of
      preprocessing.
  - id: doi:10.13026/37yb-1t42#cleaning-audit-protocol
    name: Pre-release audit protocol
    cleaning_details: >-
      Before release the team generates missingness tables, checks distributions and
      outliers, checks categorical responses against the schema, and runs quality control
      metrics on the audio tasks, including the amount of silence in a waveform, its
      duration, and for speech tasks a comparison of the speech produced against the intended
      passage.

labeling_strategies:
  - id: doi:10.13026/37yb-1t42#labeling
    name: Clinician gold standard labeling
    data_annotation_platform: >-
      REDCap, in which the clinical validation section of the case report form is completed
    data_annotation_protocol: >-
      Labeling follows the Bridge2AI protocols and ICD-10 codes. Clinical validation is
      performed by a qualified physician or practitioner based on the gold standard
      established for each disease cohort: laryngoscopy images and stroboscopy videos for
      voice disorders, with CT scan and spirometry additionally for unilateral vocal fold
      paralysis; spirometry with flow volume loops and CT of the neck and chest for
      respiratory disorders; brain CT, brain MRI and whole genome sequencing for neurological
      and neurodegenerative disorders, with serum p-tau protein markers for Alzheimer's
      disease; and the electronic health summary, a psychiatrist's clinical diagnosis and
      medication history for mood and psychiatric disorders.
    annotations_per_item: 1
    annotator_demographics:
      - >-
        Typically the clinician at the site of data collection, or a clinician external to
        the collection for a prior diagnostic assessment
    labeling_details: >-
      An explicit diagnostic label is associated with each instance, and the labeling
      strategy is a gold standard label available in the data, diagnosed by a clinician. A
      single labeler provided the label for each instance. For the psychiatric disorders
      cohort the assessment was determined from the participant's electronic health record or
      an active prescription, established outside of data collection by an appropriately
      licensed clinician. Version 3.1.0 back-filled validated diagnosis information across
      conditions and renamed some gold standard variables. Any new labels defined by future
      researchers should have their process described alongside the release of a model or
      publication, including the exact variables used for the determination.

annotation_analyses:
  - id: doi:10.13026/37yb-1t42#annotation-analysis
    name: Quality of machine-generated annotations
    analysis_method: >-
      Internal audit of the release by the data release team for missingness and consistency,
      with a missingness table distributed alongside the data.
    annotation_quality_details: >-
      Certain aspects of the data, for example transcription, were generated using
      off-the-shelf models that have not been audited for correctness. Human-level
      performance on the applications the dataset is intended to address varies widely, and
      the clinical diagnosis, depending on the disorder, was performed by one clinician or
      established from an electronic health record entry or a prescription.

machine_annotation_tools:
  - id: doi:10.13026/37yb-1t42#machine-annotation-tools
    name: Software used to derive and annotate the released data
    tools:
      - OpenAI Whisper Large
      - openSMILE
      - Praat
      - Parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - Phonetic posteriorgrams (ppgs)
      - b2aiprep
      - SenseLab
    tool_descriptions: >-
      Whisper Large generated transcriptions; openSMILE, Praat, Parselmouth and torchaudio
      produced the static and time-varying acoustic features; the Speech Articulatory Coding
      package produced electromagnetic articulography, loudness, periodicity and pitch
      estimates; the ppgs package produced phonetic posteriorgrams; b2aiprep organized and
      preprocessed the dataset and merged source data into the phenotype files; and SenseLab
      processed the audio files for research tasks.
    tool_accuracy:
      - >-
        Certain aspects of the data, for example transcription, were generated using
        off-the-shelf models that have not been audited for correctness.

existing_uses:
  - id: doi:10.13026/37yb-1t42#existing-use-summer-school
    name: Bridge2AI Summer School and hackathon
    examples:
      - >-
        A restricted version of the dataset containing raw audio has been used in the
        Bridge2AI Summer School and hackathon.

other_tasks:
  - id: doi:10.13026/37yb-1t42#other-task-cohort-selection
    name: Cohort selection
    task_details: >-
      The questionnaire features collected and distributed in the phenotype folder can be
      used for cohort selection.

future_use_impacts:
  - id: doi:10.13026/37yb-1t42#future-impact-skew
    name: Skewed composition affecting downstream utility
    impact_details: >-
      The dataset has skews based on disorder category, site, and other demographic factors.
      Users should consider the multivariate distribution when assessing utility for
      different questions, and should be aware that a future user could otherwise draw
      conclusions that treat individuals or groups unfairly.
  - id: doi:10.13026/37yb-1t42#future-impact-reidentification
    name: Re-identification and misuse risk inherent in voice
    impact_details: >-
      Voice carries an inherent risk of re-identification, and the consortium is addressing
      the ethical, legal and social challenges surrounding voice AI, including risks of voice
      re-identification, vulnerabilities such as voice AI hacking, concerns around voice data
      sharing and privacy, and the influence of gender and racial diversity on the
      development and application of these technologies. The tiered access model, with raw
      audio released only under controlled access, is the mitigation applied.

discouraged_uses:
  - id: doi:10.13026/37yb-1t42#discouraged-non-research
    name: Non-research and surveillance applications
    discouragement_details: >-
      The dataset should not be used for non-research or non-clinical applications such as
      hiring decisions, insurance premium adjustments, or any form of surveillance that could
      lead to discrimination or harm. These limitations are intended to prevent unethical or
      biased outcomes that could negatively affect individuals based on their health
      conditions or voice characteristics. The dataset is intended strictly for research that
      prioritizes patient safety, privacy, and ethical use.

intended_uses:
  - id: doi:10.13026/37yb-1t42#intended-use-model-development
    name: Development, benchmarking and validation of clinical machine-learning models
    use_category: research
    examples:
      - >-
        Developing, benchmarking or validating clinically applicable machine-learning models
        for diagnosing health conditions using voice data
      - >-
        Model pretraining and fine-tuning on voice data linked to clinical labels
    usage_notes: >-
      Labels cover vocal pathologies, neurological disorders, psychiatric conditions and
      respiratory disorders. No recommended data splits are provided, so researchers define
      their own.
  - id: doi:10.13026/37yb-1t42#intended-use-clinical-research
    name: Clinical research on voice biomarkers
    use_category: research
    examples:
      - Research into disease screening, diagnosis and monitoring through voice biomarkers
      - >-
        Study of the association between acoustic features and clinically validated
        diagnoses across the cohorts represented
    usage_notes: >-
      The dataset is primarily intended for research applications, specifically the
      development of AI and machine-learning models for healthcare.
  - id: doi:10.13026/37yb-1t42#intended-use-standards
    name: Methodological work on acoustic data standards
    use_category: research
    examples:
      - >-
        Work on bioinformatics and acoustic standards for voice data, using a corpus
        collected under a standardized, documented protocol
    usage_notes: >-
      One of the project's stated aims is interoperability of voice data through new
      bioinformatics standards, and the release is structured to be findable, accessible,
      interoperable and reusable.

prohibited_uses:
  - id: doi:10.13026/37yb-1t42#prohibited-reidentification
    name: Re-identification of participants
    prohibition_reason: >-
      Under the registered data access agreement the dataset is not to be used to attempt to
      re-identify research participants, nor for any actions that could reasonably lead to
      re-identification.
  - id: doi:10.13026/37yb-1t42#prohibited-harm-stigmatization
    name: Uses that could cause harm or stigmatization
    prohibition_reason: >-
      The dataset is not to be used for any purpose that could foreseeably cause harm or
      stigmatization to research participants, their families, communities, or specific
      populations.
  - id: doi:10.13026/37yb-1t42#prohibited-access-restriction
    name: Using intellectual property rights to restrict access
    prohibition_reason: >-
      Intellectual property protections, database rights, or related rights may not be used
      in a manner that restricts or limits access to any part of the dataset or to any
      conclusions derived from it, so that future use of the dataset remains unrestricted in
      alignment with the open science principles the consortium upholds.
  - id: doi:10.13026/37yb-1t42#prohibited-sale
    name: Sale of the data
    prohibition_reason: >-
      Sale of all or part of the data on any media is not permitted under the access
      agreement, although duplication as reasonably required to carry out the approved
      research project is permitted.

distribution_formats:
  - id: doi:10.13026/37yb-1t42#distribution-physionet
    name: PhysioNet credentialed access release
    format: >-
      Parquet binary files for the dense derived features, tab-delimited text files for the
      static features and phenotype tables, and JSON data dictionaries for every data file
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    description: >-
      The current release is distributed by PhysioNet as a restricted-access resource.
      Registration on PhysioNet, credentialing and signing of the project's data use
      agreement enable access; no additional training is required.
  - id: doi:10.13026/37yb-1t42#distribution-synapse
    name: Synapse controlled access to raw audio
    format: Audio waveforms
    access_urls:
      - https://www.synapse.org/Synapse:syn72370534/
    description: >-
      Raw audio for the adult cohort is disseminated through controlled access via Synapse.
      Accessing it is a more involved process requiring institutional sign-off, and requests
      are made to the access committee at DACO@b2ai-voice.org.
  - id: doi:10.13026/37yb-1t42#distribution-health-data-nexus
    name: Health Data Nexus hosted version
    format: Feature-only dataset accessible through cloud compute rather than download
    access_urls:
      - https://healthdatanexus.ai/
    description: >-
      An earlier version of the feature-only dataset is available on Health Data Nexus,
      which provides cloud compute alongside the dataset rather than allowing data downloads.
      The platform publishes publicly accessible metadata with a DOI for persistent
      resolution while the dataset itself requires registered access.

distribution_dates:
  - id: doi:10.13026/37yb-1t42#distribution-dates
    name: Release history
    release_dates:
      - Version 1.0 published on Health Data Nexus at the end of November 2024
      - Version 1.1 published on PhysioNet on 17 January 2025
      - Version 2.0.0 published on PhysioNet on 16 April 2025
      - Version 2.0.1 published on PhysioNet on 18 August 2025
      - Version 3.0.0 published on PhysioNet on 16 December 2025
      - Version 3.1.0 published on PhysioNet on 1 May 2026

third_party_sharing:
  - id: doi:10.13026/37yb-1t42#third-party-sharing
    name: Distribution beyond the creating entity
    is_shared: true
    description: >-
      The dataset is distributed broadly to individuals outside of the entity that created
      it. Collaborators at other research organizations, and other research teams at the same
      organization, must apply independently for access and sign their own data transfer and
      use agreement with the provider institution before accessing the data.

license_and_use_terms:
  id: doi:10.13026/37yb-1t42#license-terms
  name: License and terms of use
  license_terms: >-
    The files are released under the Bridge2AI Voice Registered Access License, and users
    must sign the Bridge2AI Voice Registered Access Agreement. Registered access to the
    feature-only data requires registration on PhysioNet and confirmation of identity;
    version 3.0.0 onwards is published as credentialed access, requiring the user to be a
    credentialed PhysioNet user and to sign the data use agreement, with no training
    required. Controlled access to raw audio additionally requires a completed Data Access
    Request Form and Data Use Agreement, review by the Data Access Compliance Office, and a
    Data Use and Transfer Agreement signed by an authorized official at the recipient
    institution. There are no fees associated with these restrictions.
  data_use_permission: general_research_use
  description: >-
    The dataset is intended solely for commercial and non-commercial research purposes by
    authorized researchers. The consent does not restrict use to non-commercial purposes, to
    a specific geographic location, to a specific type of research, to genetic research, or
    to research that does not involve the development of methods or algorithms.

ip_restrictions:
  id: doi:10.13026/37yb-1t42#ip-restrictions
  name: Intellectual property terms
  restrictions:
    - >-
      The data may be protected by copyright and other rights, including other intellectual
      property rights; duplication as reasonably required to carry out the approved research
      project with the data is nonetheless permitted.
    - Sale of all or part of the data on any media is not permitted.
    - >-
      Nothing in the agreement operates to transfer any intellectual property rights in or
      relating to the data to the user, and users agree not to make intellectual property
      claims on the data.
    - >-
      Users agree not to use intellectual property protection in ways that would prevent or
      block access to, or use of, any element of the data or conclusions drawn directly from
      it.
    - >-
      Users may obtain intellectual property rights on downstream discoveries but agree to
      implement licensing policies that will not obstruct further research, and to respect
      the Fort Lauderdale Agreement.
  description: >-
    No intellectual property based restrictions have been imposed by third parties, and no
    fees are associated with the restrictions that do apply.

regulatory_restrictions:
  id: doi:10.13026/37yb-1t42#regulatory-restrictions
  name: Regulatory and compliance status
  regulatory_restrictions:
    - >-
      The data are covered under a Certificate of Confidentiality, which must be asserted
      against compulsory legal demands such as court orders and subpoenas for identifying
      information or characteristics of a research participant.
    - >-
      Under the Data Transfer and Use Agreement the data are Personally Identifiable
      Information as defined in OMB Memorandum M-07-16, and recipients must apply
      administrative, physical and technical safeguards equivalent to those required of
      covered entities and business associates for electronic protected health information.
    - >-
      Recipients must adhere to the specific requirements of PhysioNet, managed by the MIT
      Laboratory for Computational Physiology, or to such other data distribution mechanism
      as the provider uses.
  hipaa_compliant: compliant
  other_compliance: >-
    Identifiable information under HIPAA and the Common Rule has been removed and the HIPAA
    de-identification rules have been applied. Data collection applications are themselves
    HIPAA-compliant and transmit over a secure HTTPS protocol to HIPAA-compliant storage
    operated by NIH STRIDES partners.
  confidentiality_level: restricted
  description: >-
    No export controls or other regulatory restrictions apply to the dataset.

data_governance:
  id: doi:10.13026/37yb-1t42#data-governance
  name: Data access governance
  committee_name: Data Access Compliance Office
  access_review_process: >-
    Registered access to the feature-only data requires registration on PhysioNet,
    confirmation of identity, and signature of the Bridge2AI-Voice Registered Access
    Agreement, which sets out the terms and conditions for data use; from version 3.0.0
    access is credentialed, requiring the applicant to be a credentialed PhysioNet user who
    has signed the data use agreement. Controlled access to raw audio requires the applicant
    to complete a Data Access Request Form and a Data Use Agreement, submit the application
    to the Data Access Compliance Office for review, and, upon approval, ensure that a Data
    Use and Transfer Agreement is signed by an authorized official at their institution.
    Requests for raw audio access are addressed to DACO@b2ai-voice.org. A memorandum setting
    out the ethical justification for controlled access to raw voice data samples is
    published alongside the documentation.
  stewardship_roles:
    - >-
      Provider institution under the Data Transfer and Use Agreement, responsible for
      supplying the data and for the terms on which it is transferred
    - >-
      Data Access Compliance Office, responsible for reviewing controlled access applications
      for raw audio
    - >-
      Each participating institution retains its own identifiable data locally in a
      password-protected REDCap instance accessible only to approved investigators at that
      site
    - >-
      Local principal investigators are responsible for destroying identifiable data at the
      end of the retention period
  accountable_organization:
    name: University of South Florida Board of Trustees
    description: >-
      Named as the provider institution in the Data Transfer and Use Agreement for the
      project, and the institution holding the NIH award.
  description: >-
    Access decisions are separated by sensitivity: the derived feature data are released
    under a registered or credentialed access mechanism operated through PhysioNet, while
    raw audio is released only under a controlled access mechanism reviewed by the project's
    own access committee. Recipients must retain control over the data, must not disclose it
    to anyone other than authorized persons named in their agreement, and must notify the
    provider of any unauthorized use or disclosure within five business days of discovery.

maintainers:
  - id: doi:10.13026/37yb-1t42#maintainer-nih
    name: National Institutes of Health
    role: government_agency
    maintainer_details: >-
      The dataset is supported by the NIH via the Bridge2AI project, and Voice is supported
      by NIH grant OT2OD032720 through the NIH Bridge2AI Common Fund program.
  - id: doi:10.13026/37yb-1t42#maintainer-mit-lcp
    name: MIT Laboratory for Computational Physiology
    role: academic_institution
    maintainer_details: >-
      PhysioNet, which hosts the current releases, is maintained by the MIT Laboratory for
      Computational Physiology and supported by the National Institute of Biomedical Imaging
      and Bioengineering, the National Heart Lung and Blood Institute, and the NIH Office of
      the Director under NIH grant numbers U24EB037545 and R01EB030362.
  - id: doi:10.13026/37yb-1t42#maintainer-t-cairem
    name: >-
      Temerty Center for Artificial Intelligence Research and Education in Medicine
      (T-CAIREM), University of Toronto
    role: academic_institution
    maintainer_details: >-
      The Health Data Nexus, the data publishing platform carrying the earlier feature-only
      version of the dataset, is maintained by the Temerty Center for Artificial Intelligence
      Research and Education in Medicine, based at the University of Toronto. The Health Data
      Nexus maintains the technical infrastructure hosting the dataset and provides continued
      access to interested researchers.

updates:
  id: doi:10.13026/37yb-1t42#update-plan
  name: Update plan
  frequency: Semi-annual, that is twice a year
  update_details: >-
    Further versions of the dataset will be released on a semi-annual basis, distributed as
    new versions of the dataset on the publishing platform. Users will be notified through
    news items on the platform as well as through standard communication channels. The
    dataset is released as static versions rather than being dynamically updated.

retention_limit:
  id: doi:10.13026/37yb-1t42#retention
  name: Retention limits
  retention_period: >-
    Indefinite for contributed research data; identifiable data are held locally for a
    maximum of 10 years after study completion, and de-identified study data and original
    consent forms for a minimum of 5 years after completion of the study.
  retention_details: >-
    Once data is contributed, the data will be retained as long as it is useful for research
    purposes, possibly indefinitely. Identifiable data and the datasheets linking participant
    numbers to participant information are kept in each institution on local cloud storage
    for a maximum of 10 years after study completion and are then destroyed, which is the
    responsibility of each local principal investigator. The University of South Florida IRB
    requires de-identified study data and original consent forms to be stored for at least
    five years after completion of the study, and original paper consent documents cannot be
    destroyed until five years after study completion.

version_access:
  id: doi:10.13026/37yb-1t42#version-access
  name: Version availability
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
    - Version 1.1, published 17 January 2025, version DOI 10.13026/249v-w155
    - Version 2.0.0, published 16 April 2025
    - Version 2.0.1, published 18 August 2025
    - Version 3.0.0, published 16 December 2025, version DOI 10.13026/k81f-qr68
    - Version 3.1.0, published 1 May 2026, version DOI 10.13026/8xbn-nq66
  version_details: >-
    By default, older versions of the dataset will continue to be supported, hosted, and made
    available to researchers, and each version of the dataset has a unique DOI; the dataset
    publishers reserve the right to remove access to older versions, and the files for
    version 1.1 are no longer available. Release notes record what changed: version 1.0 was
    the first release; version 1.1 added Mel-frequency cepstral coefficients; version 2.0
    added data for a further 136 participants, reprocessed spectrograms to fix minor issues,
    and removed all spectrograms and MFCCs derived from free speech; version 2.0.1 corrected
    the authorship list; version 3.0.0 was a major update adding data for a further 391
    participants, separating the single phenotype file into individual files, adding
    articulatory features from the Speech Articulatory Coding package and phonetic
    posteriorgrams, and reorganizing the files; and version 3.1.0 is a minor update with no
    new participants that released additional data for certain participants, fixed broken
    Parquet files, added audio quality metrics and per-recording metadata, back-filled
    validated diagnosis information across conditions, rearranged some phenotype files and
    renamed certain gold standard variables.

extension_mechanism:
  id: doi:10.13026/37yb-1t42#extension
  name: Contribution and extension mechanism
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    For dataset extensions and augmentations, others may publish a derivative dataset on the
    publishing platform which references the original source; such derivative datasets may be
    made available under the same conditions as the source data. For augmentations to the
    code used to produce the data, the open-source repositories have discussion forums and
    issue pages that allow public discussion of data preprocessing, and the repository has a
    pull request mechanism for contributing improvements to the data preprocessing code.

is_deidentified:
  id: doi:10.13026/37yb-1t42#deidentification
  name: De-identification of the release
  identifiable_elements_present: false
  method: >-
    Removal of HIPAA Safe Harbor identifiers with application of the HIPAA de-identification
    rules, followed by removal of indirect identifiers that created a significant
    re-identification risk and of non-identifying but highly sensitive elements, and by
    withholding of all raw voice data.
  identifiers_removed: >-
    Names, civic addresses and social security numbers; geographic locators, with state and
    province removed and country of data collection retained; date information at resolution
    finer than years, with dates rebased or replaced by integers; phone and fax numbers,
    email addresses and IP addresses; medical record numbers, health plan beneficiary
    numbers, device identifiers, license numbers, account numbers and vehicle identifiers;
    website URLs, full face photographs, biometric identifiers and other unique identifiers;
    narrative text fields and transcripts of free speech; select demographic identifiers and
    information about household composition or cultural identity; household income, mental
    health status and traumatic life experience elements; all fields encoded as sensitive in
    the REDCap data dictionary; and all raw voice data.
  deidentification_details: >-
    The level of de-identification is that identifiable information under HIPAA and the
    Common Rule, as well as data considered sensitive, have been removed from this dataset.
    Direct identifiers are removed, the HIPAA de-identification rules are applied, dates are
    rebased or replaced by integers, geographic information is removed or generalized, and
    narrative text fields are removed; the dataset does not achieve k-anonymization at k of
    two or greater. Raw audio transcripts were reviewed and any recordings containing
    potentially identifying information or external voices were removed from the release, and
    spectrograms, Mel spectrograms, MFC coefficients, phonetic posteriorgrams and
    electromagnetic articulography estimates from open-response prompts are removed from the
    feature-only dataset.

file_collections:
  - id: doi:10.13026/37yb-1t42#collection-features
    name: Derived audio features
    path: features/
    collection_type: processed_data
    description: >-
      Dense derived features stored as Parquet, an open-source column-oriented data file
      format, together with plain-text feature tables. Each element of a Parquet file carries
      a participant identifier, a session identifier, the task performed, the number of time
      frames for that feature, and the tensor data. Every file is accompanied by a JSON data
      dictionary with the same file stem describing the feature and the processing used to
      prepare it. Counts below are for version 3.1.0.
    resources:
      - id: doi:10.13026/37yb-1t42#file-torchaudio-spectrogram
        name: torchaudio_spectrogram.parquet
        path: features/torchaudio_spectrogram.parquet
        description: >-
          29,278 spectrograms of dimension 201 by T, generated using the short-time Fast
          Fourier Transform with a 25 ms window size, 10 ms hop length and 400-point FFT.
      - id: doi:10.13026/37yb-1t42#file-torchaudio-mel-spectrogram
        name: torchaudio_mel_spectrogram.parquet
        path: features/torchaudio_mel_spectrogram.parquet
        description: >-
          29,278 Mel spectrograms of dimension 60 by T, generated with a 25 ms window size,
          10 ms hop length, 400-point FFT and 60 Mel bins.
      - id: doi:10.13026/37yb-1t42#file-torchaudio-mfcc
        name: torchaudio_mfcc.parquet
        path: features/torchaudio_mfcc.parquet
        description: >-
          29,278 sets of Mel-frequency cepstrum coefficients of dimension 60 by T, using the
          same parameters as the Mel spectrograms.
      - id: doi:10.13026/37yb-1t42#file-torchaudio-pitch
        name: torchaudio_pitch.parquet
        path: features/torchaudio_pitch.parquet
        description: >-
          32,522 detected pitch contours over time, of dimension T, with a minimum and
          maximum pitch of 80 and 500 Hz.
      - id: doi:10.13026/37yb-1t42#file-sparc-ema
        name: sparc_ema.parquet
        path: features/sparc_ema.parquet
        description: >-
          28,640 electromagnetic articulography estimates produced by a deep learning model,
          of dimensions T by 12, where the twelve values are the X and Y positions of six
          articulators: tongue dorsum, tongue body, tongue tip, lower incisor, upper lip and
          lower lip.
      - id: doi:10.13026/37yb-1t42#file-sparc-loudness
        name: sparc_loudness.parquet
        path: features/sparc_loudness.parquet
        description: >-
          31,855 loudness estimates of size T, based on the average absolute amplitude of the
          audio waveform using 20 ms windows.
      - id: doi:10.13026/37yb-1t42#file-sparc-periodicity
        name: sparc_periodicity.parquet
        path: features/sparc_periodicity.parquet
        description: >-
          31,872 periodicity estimates of dimension T, expressing confidence of pitch
          presence, derived from the audio using 20 ms windows.
      - id: doi:10.13026/37yb-1t42#file-sparc-pitch
        name: sparc_pitch.parquet
        path: features/sparc_pitch.parquet
        description: >-
          31,872 estimates of fundamental frequency of dimension T, computed with a different
          algorithm from the torchaudio pitch and covering a range of 50 to 550 Hz.
      - id: doi:10.13026/37yb-1t42#file-ppgs
        name: ppgs.parquet
        path: features/ppgs.parquet
        description: >-
          29,289 phonetic posteriorgrams giving probabilities across 40 phoneme categories,
          of dimension 40 by T, at a frame rate of 100 Hz.
      - id: doi:10.13026/37yb-1t42#file-static-features
        name: static_features.tsv
        path: features/static_features.tsv
        format: TSV
        description: >-
          Static features derived from the raw audio with one row per unique recording,
          drawn from openSMILE, Praat, Parselmouth and torchaudio, with a data dictionary
          describing each feature.
      - id: doi:10.13026/37yb-1t42#file-audio-quality-metrics
        name: audio_quality_metrics.tsv
        path: features/audio_quality_metrics.tsv
        format: TSV
        description: >-
          Quality control metrics derived from the raw audio, with one feature per audio
          recording. Added in version 3.1.0.
  - id: doi:10.13026/37yb-1t42#collection-phenotype
    name: Phenotype data
    path: phenotype/
    collection_type: processed_data
    description: >-
      Organized information collected from the participant or another individual during their
      encounter, as tab-delimited files each accompanied by a JSON data dictionary whose keys
      match the column names and whose values give a one-sentence description of the column,
      the question that prompted the response where there was one, and the data type. The
      tree comprises confounders; demographics; per-condition diagnosis tables for airway
      stenosis, amyotrophic lateral sclerosis, anxiety, benign lesions, bipolar disorder,
      cognitive impairment, controls, COPD and asthma, depression, glottic insufficiency,
      laryngeal cancer, laryngeal dystonia, laryngitis, muscle tension dysphonia, Parkinson's
      disease, precancerous lesions, unexplained chronic cough and unilateral vocal fold
      paralysis; enrollment records covering eligibility, the enrollment form and participant
      information; validated questionnaires including the adult ADHD questionnaire, custom
      affect scale, DSM-5 adult, dyspnea index, GAD-7, Leicester cough questionnaire, PANAS,
      PHQ-9, productive vocabulary, psychiatric history, adult PTSD, VHI-10 and voice
      perception; and task tables for acoustic task, Harvard sentences, random item
      generation, recording, session, Stroop and Winograd. Phenotype files contain a row for a
      participant only where at least one column is not missing.
  - id: doi:10.13026/37yb-1t42#collection-metadata
    name: Recording metadata
    path: metadata/
    collection_type: metadata
    description: >-
      A Parquet file and its data dictionary carrying information about each recording,
      including task instructions and prompts and information about the microphone used and
      its gain. Added in version 3.1.0.
  - id: doi:10.13026/37yb-1t42#collection-raw-audio
    name: Raw audio in Brain Imaging Data Structure layout
    collection_type: raw_data
    conforms_to_standard:
      - BIDS
    path: b2ai-voice-audio/
    description: >-
      The raw audio distribution, organized to the Brain Imaging Data Structure with a
      CHANGES.md, a README.md and a dataset_description.json at the top level, the phenotype
      tree of confounders, demographics, diagnosis, enrollment, questionnaire and task
      tables, and one directory per participant and session containing WAV files named by
      participant, session and task with a matching JSON sidecar. This collection is not part
      of the PhysioNet release; it is distributed under controlled access through Synapse.

related_datasets:
  - id: doi:10.13026/37yb-1t42#related-pediatric
    name: Bridge2AI-Voice Pediatric Dataset
    target_dataset: doi:10.13026/mf9s-5r03
    relationship_type: is_supplemented_by
    description: >-
      A separate PhysioNet project, not a version of this dataset. The pediatric release
      version 1.1.0, published on 1 May 2026 with version DOI 10.13026/h995-bt35, contains
      derived audio features for 23,533 recordings collected from 300 participants aged 2 to
      18 at the Hospital for Sick Children, under a separate age-appropriate protocol
      collected with ReproSchema-UI and approved by that hospital's Research Ethics Board.
      Its raw audio is distributed via Synapse at
      https://www.synapse.org/Synapse:syn73617068 rather than through the adult cohort's
      Synapse project. The two releases are advertised alongside one another as the adult and
      pediatric datasets of the same project.
