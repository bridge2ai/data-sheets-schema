purposes:
  - description: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-Ready data,
      produced from multimodal interrogation of proteins involved in cancer, neuropsychiatric,
      and cardiac disorders in disease-relevant cell lines under perturbed and unperturbed
      conditions.
  - description: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the grand
      challenge of interpretable genotype-phenotype learning (NIH RePORTER project description,
      OT2OD032742).
  - description: >-
      To ethically leverage state-of-the-art computational and experimental tools in biomedical
      science to enable a new generation of transformative artificial intelligence research to
      benefit humanity.
  - description: >-
      To broadly stimulate research and development in "visible" machine learning systems informed
      by multi-scale cell and tissue architecture, rather than black-box models.
  - description: >-
      To implement and demonstrate a standards data management approach based on FAIR access and
      software principles, with deep provenance and replication packages for representation of
      cell maps and their underlying datasets.

addressing_gaps:
  - description: >-
      In genomics and precision medicine, machine learning models are often "black boxes,"
      predicting phenotypes from genotypes without understanding the mechanisms by which such
      translation occurs. CM4AI data are generated to address this deficiency by enabling
      "visible" machine learning systems built on knowledge maps of cell and tissue architecture.
  - description: >-
      Gaps in the availability of ethical, FAIR, provenanced, AI-ready biomedical datasets. The
      project defines AI-Readiness criteria (FAIR, provenanced, characterized, explainable,
      ethical) and packages its outputs to meet them, providing reusable enabling capabilities.
  - description: >-
      Lack of matched multimodal measurement across the same proteins and the same cellular
      contexts. CM4AI generates deep multi-modal data for a shared list of proteins across all
      cell types and treatment conditions.

tasks:
  - description: >-
      Interpretable genotype-phenotype learning - using maps of cellular structure and function
      to make machine learning predictions from genotype mechanistically interpretable.
  - description: >-
      Construction of hierarchical, multi-scale cell maps (directed acyclic graphs of protein
      assemblies) by integrating protein localization and protein interaction data.
  - description: >-
      AI model training on multimodal functional genomics data (stated intended use of the
      Dataverse release).
  - description: >-
      Analysis of cell architectural changes and interactions in the presence of specific disease
      processes, treatment conditions, or genetic perturbations.

intended_uses:
  - description: >-
      Provision of AI-ready datasets to support research in functional genomics.
  - description: AI model training.
  - description: Cellular process analysis.
  - description: >-
      Study of cell architectural changes and interactions in the presence of specific disease
      processes, treatment conditions, or genetic perturbations.
  - description: >-
      Bioinformatics analysis of the individual constituent datasets (SEC-MS, AP-MS, IF imaging,
      perturb-seq), which the producers state is what the current release is most suitable for.

other_tasks:
  - description: >-
      Development of visible neural networks (VNNs) - cell maps have been used in AI tools for
      "visible machine learning" to interrogate how protein assemblies in the cell affect
      cell-level phenotype predictions.
  - description: >-
      Downstream applications in human genomics, including interpretation of genetic variants
      and mutations.
  - description: >-
      Integrative structure modeling of protein communities. The CM4AI Tools/Standards work
      includes a bioinformatics pipeline for annotating MuSIC communities with available
      structural information (PDB, AlphaFold Protein Structure Database, crosslinking mass
      spectrometry, disordered-segment prediction) and ranking communities for feasibility of
      integrative structure modeling using the Integrative Modeling Platform (IMP).
  - description: >-
      Integration of external data into an existing cell map for the ethical development of AI/ML
      applications (a stated learning objective of the CM4AI in-person internship).

discouraged_uses:
  - description: >-
      Use of this release as a source of computed cell maps. The producers state that computed
      cell maps are not included in this release and will be added in future releases.
  - description: >-
      Cross-modality integrated analysis that assumes complete protein overlap. The producers
      state that SEC-MS, IF imaging, and CRISPRi perturb-seq data interrogate sets of proteins
      that incompletely overlap, and that the current release is most suitable for bioinformatics
      analysis of the individual datasets.
  - description: >-
      Analysis without relevant domain expertise. The producers state that meaningful analysis
      requires domain expertise.

prohibited_uses:
  - description: >-
      "These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval."
  - description: >-
      Commercial use under the distributed license. The dataset is licensed CC BY-NC-SA 4.0,
      which does not permit use of the material for commercial purposes; the CM4AI preprint
      states that commercial use requires a separate license negotiation with the copyright
      holder (UCSD, Stanford, and/or UCSF depending upon the specific data package).

existing_uses:
  - description: >-
      Nourreddine S, Doctor Y, Dailamy A, et al. "A perturbation cell atlas of human induced
      pluripotent stem cells." bioRxiv 2024 Nov 4; 2024.11.03.621734; PMCID PMC11580897;
      doi 10.1101/2024.11.03.621734. Listed as a Related Publication of the Dataverse release and
      corresponding to the genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs.
  - description: >-
      CM4AI project publication describing the resource- Clark T, Mohan J, Schaffer L, Obernier K,
      et al. "Cell Maps for Artificial Intelligence- AI-Ready Maps of Human Cell Architecture from
      Disease-Relevant Cell Lines." bioRxiv 2024; doi 10.1101/2024.05.21.589311.
  - description: >-
      Training and workforce development. CM4AI data and tools were distributed and used at the
      inaugural virtual CodeFest event in March 2024, attended by 38 registrants, accompanied by
      tutorials explaining how the data were derived and integrated.

future_use_impacts:
  - description: >-
      Anticipated benefit- the producers intend CM4AI to become a highly transformative platform
      for ethical, explainable, and interpretable biomedical AI, to deepen understanding of
      processes of human disease and health, help train a new generation of researchers, enable
      development of novel cures, and assist researchers and clinicians in equitably improving
      human lives.
  - description: >-
      Anticipated risk- misuse in clinical decision-making or patient care without appropriate
      regulatory oversight and approval, which is explicitly prohibited by the producers.
  - description: >-
      Anticipated risk of limited generalization- because the data derive from a small number of
      commercially available de-identified human cell lines, downstream AI/ML systems trained on
      them may not represent biological variation seen in the population at large.
  - description: >-
      The CM4AI Ethics module states an explicit commitment to anticipating potential applications
      of the data and derived AI/ML systems, integrating them into data governance frameworks to
      optimize benefits and mitigate potential risks, and promoting their use for the collective
      good. The Ethics module is developing a CM4AI Life Cycle framework of governance milestones
      spanning data generation and AI system development, and tools to enhance awareness of the
      ethical, legal, and social ramifications of CM4AI data and consequent AI systems.

