      Donor of the MDA-MB-468 cell line. MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast
      cancer cell line established from a metastatic site pleural effusion of a 51-year-old black
      female with a metastatic mammary adenocarcinoma. All breast cancer data in this release
      derive from this single donor-derived line.
  - description: >-
      Donor of the KOLF2.1J cell line. KOLF2.1J (RRID:CVCL_B5P3) iPSCs were derived from a healthy
      male Northern European donor. All iPSC and iPSC-derived data in this release derive from this
      single donor-derived line.
  - description: >-
      Population representation. The producers state that data in this release were derived from
      commercially available de-identified human cell lines and do not represent all biological
      variants which may be seen in the population at large.

