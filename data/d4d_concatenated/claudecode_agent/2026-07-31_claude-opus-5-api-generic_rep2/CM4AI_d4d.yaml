data_collectors:
  - description: >-
      Lundberg Lab, Stanford University - generation of immunofluorescence (ICC-IF) confocal
      subcellular imaging data for MDA-MB-468 cells (untreated, paclitaxel, vorinostat), as stated
      in the Dataverse file descriptions. Spatial proteomics mapping used the Human Protein Atlas
      resource of antibodies and HPA-derived protocols, with automated fixation and permeabilization
      protocols established for a pipetting robot for the MDA-MB-468 and KOLF2 cell lines.
  - description: >-
      Nevan Krogan laboratory, University of California San Francisco - generation of
      size-exclusion chromatography mass spectrometry (SEC-MS) data for KOLF2.1J iPSCs and
      derivatives and for MDA-MB-468 cells (untreated, paclitaxel, vorinostat), and of affinity
      purification mass spectrometry (AP-MS) data on endogenously tagged MDA-MB-468 cell lines.
  - description: >-
      University of California San Diego - generation of single-cell CRISPR (perturb-seq) screens
      in MDA-MB-468 cells and KOLF2.1J iPSCs, and development of the MuSIC data integration
      pipeline and Cell Mapping Toolkit. Note- unlike the imaging and mass spectrometry work, no
      source in the bundle names a specific generating laboratory for the CRISPR screens.
  - description: >-
      University of Virginia - Standards module; AI-readiness packaging, FAIRSCAPE metadata and
      provenance framework, and deposition of the release into the University of Virginia
      Dataverse (LibraData). Depositor of record- Niestroy, Justin.
  - description: >-
      Production Location recorded in the Dataverse metadata- University of California San Diego;
      University of California San Francisco; Stanford University; University of Virginia.

acquisition_methods:
  - description: >-
      Directly observed experimental measurement in cultured human cell lines. Protein-protein
      interaction data were acquired by affinity purification mass spectrometry (AP-MS) on
      endogenously tagged cell lines and by size-exclusion chromatography coupled to mass
      spectrometry (SEC-MS) for proteome-wide complex/interaction mapping, described as two
      orthogonal mass spectrometry-based approaches.
  - description: >-
      Directly observed imaging measurement. Spatial proteomics data were acquired by
      immunofluorescence-based staining (ICC-IF) and high-resolution confocal microscopy of
      MDA-MB-468 cells.
  - description: >-
      Directly observed perturbation experiment. Genetic perturbation data were acquired by
      single-cell CRISPR (CRISPRi) screens; the project designed a CRISPR lentiviral library
      targeting chromatin factors with 6 guide RNAs per gene and generated and characterized
      MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9.
  - description: >-
      Derived/processed products included alongside raw acquisitions- for example the expressed
      genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs, which maps transcriptional
      and fitness phenotypes associated with 11,739 targeted genes.

collection_mechanisms:
  - description: >-
      Immunofluorescence confocal microscopy with four-channel staining. Nuclei stained with DAPI
      (blue channel); endoplasmic reticulum with a calreticulin antibody (yellow channel);
      microtubules with tubulin antibody (red channel); and an antibody against the protein of
      interest (green channel). Antibodies drawn from the Human Protein Atlas resource.
  - description: >-
      Automated fixation and permeabilization protocols implemented on a pipetting robot for the
      MDA-MB-468 and KOLF2 cell lines.
  - description: >-
      Affinity purification mass spectrometry (AP-MS) on endogenously tagged genes in MDA-MB-468
      cells.
  - description: >-
      Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide
      complex and interaction mapping.
  - description: >-
      Single-cell CRISPR screens performed using the 10x Genomics 3'HT kit, with a CRISPR
      lentiviral library targeting chromatin factors at 6 guide RNAs per gene and inducible dCas9
      lines.

direct_collection:
  - description: >-
      Data were not collected from human individuals. Measurements were made directly by the
      project laboratories on established, commercially or institutionally available human cell
      lines. The Dataverse record states Human Subjects- No; De-identified Samples- Yes; FDA
      Regulated- No. The CM4AI preprint states that the data "are non-clinical (from tissue
      cultures) and are considered to be de-identified as they cannot be matched, with current
      knowledge, to a human subject."
  - description: >-
      Cell lines were obtained from third parties. MDA-MB-468 (RRID:CVCL_0419) is available from
      ATCC. KOLF2.1J (RRID:CVCL_B5P3) is available from the Human Induced Pluripotent Stem Cells
      Initiative (HipSci) resource, and is available for access by not-for-profit organizations
      via a simple MTA. Both are described by the project as having been ethically sourced.

collection_timeframes:
  - description: >-
      The NIH project period for OT2OD032742 runs from 2022-09-01 to 2026-08-31. The CM4AI
      preprint (May 2024) reports Year 1 acquisition activities.
  - description: >-
      Dataverse metadata for this release records a Data Creation Date of 2025-02-27 and a Deposit
      Date of 2025-02-27; publication date 2026-06-17; version 2 files published 2026-07-15
      (version 2 release timestamp 2026-07-15T20:28:19Z).
  - description: >-
      Collection and release are ongoing- CM4AI releases data quarterly, and the dataset is stated
      to be regularly updated and augmented through the end of the project in November 2026.

sampling_strategies:
  - description: >-
      Targeted protein panel. CM4AI's stated design objective is multimodal interrogation of 100
      chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric, and
      cardiac disorders, in disease-relevant cell lines under perturbed and unperturbed conditions.
      Data releases describe deep multi-modal data generated for a shared list of proteins across
      all cell types and treatment conditions. Reported achievement against this design target was
      partial at the time of the CM4AI preprint (Year 1)- 17 genes had been endogenously tagged in
      MDA-MB-468 with 34 additional genes in progress, and SEC-MS had identified 72 of the 100
      chromatin modifiers, 52 of them as integral components of protein complexes.
  - description: >-
      Genome-scale CRISPRi sampling in iPSCs. The KOLF2.1J CRISPRi Perturbation Cell Atlas is
      described as an expressed genome-scale screen mapping transcriptional and fitness phenotypes
      associated with 11,739 targeted genes, with 6 guide RNAs per gene in the designed library.
  - description: >-
      Antibody-limited sampling for imaging. Spatial proteomics coverage is bounded by the
      availability and quality of Human Protein Atlas antibodies for each target protein. The
      Dataverse file descriptions for this release state spatial localization of 464 proteins of
      interest per treatment condition in MDA-MB-468 cells.
  - description: >-
      Cell-line and condition sampling. Two human cell lines were selected- the triple negative
      breast cancer line MDA-MB-468 (+/- paclitaxel and vorinostat) and the iPSC line KOLF2.1J
      (+/- neuronal and cardiomyocytic differentiation). Both were selected in part because they
      have been ethically sourced.

instances:
  - description: >-
      Immunofluorescence confocal image instances. Each instance is a multi-channel confocal
      microscopy image of MDA-MB-468 cells stained for one protein of interest (green channel)
      together with reference markers for nucleus (DAPI, blue), endoplasmic reticulum
      (calreticulin, yellow), and microtubules (tubulin, red). From the June 2025 revision onward,
      RGB composite immunofluorescent images are also provided.
  - description: >-
      Protein-protein interaction instances. SEC-MS instances are protein elution profiles across
      chromatographic size fractions, from which complexes and differential elution between
      conditions are derived; AP-MS instances are bait-prey interaction records from endogenously
      tagged baits.
  - description: >-
      Single-cell perturbation instances. Each instance is a single cell with an assigned CRISPRi
      guide RNA / targeted gene and an associated single-cell transcriptional profile; derived
      instances in the Perturbation Cell Atlas are per-gene transcriptional and fitness phenotypes.
  - description: >-
      Packaging instances. Each released archive is an RO-Crate package containing datasets,
      metadata, software references and provenance, registered with persistent identifiers.

relationships:
  - description: >-
      Protein-protein interaction edges. AP-MS and SEC-MS instances define an interaction network
      among proteins- AP-MS yields bait-prey associations, and SEC-MS yields co-elution
      relationships from which complex membership is inferred. The CM4AI preprint reports SEC-MS
      detection of PPI profiles of over a thousand complexes in MDA-MB-468 cells and more than 700
      protein complexes in parental iPSCs and differentiated neurons.
  - description: >-
      Containment relationships in the downstream cell map. Cell maps produced from these data are
      hierarchical directed acyclic graphs in which each node is an assembly of proteins in
      proximity at a given scale, and edges represent containment of a smaller assembly by a larger
      one, spanning from cell compartments to small protein complexes. These computed maps are not
      included in this release.
  - description: >-
      Perturbation-to-phenotype relationships. Each CRISPRi-targeted gene is related to the
      transcriptional and fitness phenotype it induces in the single-cell screen.

subsets:
