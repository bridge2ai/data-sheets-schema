raw_data_sources:
  - source_description: >-
      SEC-MS mass spectrometry data in KOLF2.1J iPSCs (undifferentiated, NPC, neuron, and
      cardiomyocyte), deposited in the MassIVE repository and linked from the Dataverse release as
      an external data resource.
  - source_description: >-
      SEC-MS mass spectrometry data in MDA-MB-468 breast cancer cells (+/- treatment), deposited in
      the MassIVE repository and linked from the Dataverse release as an external data resource.
  - source_description: >-
      AP-MS mass spectrometry data in MDA-MB-468 breast cancer cells treated with paclitaxel,
      deposited in the MassIVE repository and linked from the Dataverse release.
  - source_description: >-
      AP-MS mass spectrometry data in MDA-MB-468 breast cancer cells treated with vorinostat,
      deposited in the MassIVE repository and linked from the Dataverse release.
  - source_description: >-
      Perturb-seq data in KOLF2.1J iPSCs (undifferentiated) - external link marked "Embargoed" in
      the June 2026 release. In the March 2025 release the corresponding raw sequence data were
      described as a distinct RO-Crate ("CRISPR Perturbation RNA Sequences - Raw Sequences"), and
      the June 2025 release linked Sequence Read Archive (SRA) data via NCBI BioProject.
  - source_description: >-
      Perturb-seq data in MDA-MB-468 breast cancer cells (+/- treatment) - external link marked
      "Embargoed" in the June 2026 release.
  - source_description: >-
      CRISPRi Perturbation Atlas of iPSCs, linked from the June 2026 release as an external data
      resource hosted on Figshare.
  - source_description: >-
      Raw immunofluorescence confocal image data generated in the Lundberg Lab at Stanford
      University using Human Protein Atlas antibodies and protocols; raw image data are stated to be
      copyright of The Board of Trustees of the Leland Stanford Junior University.

raw_sources:
  - description: >-
      Raw mass spectrometry files from AP-MS and SEC-MS experiments, held in the MassIVE
      repository and referenced from the Dataverse release rather than duplicated in it.
  - description: >-
      Raw single-cell sequencing reads from the CRISPRi perturb-seq screens, referenced via the
      Sequence Read Archive / NCBI BioProject (June 2025 release) and, in the June 2026 release,
      partly marked as embargoed.
  - description: >-
      Raw four-channel confocal immunofluorescence microscopy images of MDA-MB-468 cells, which are
      distributed directly in this release as ZIP archives.

preprocessing_strategies:
  - description: >-
      AI-readiness packaging. Any computation or coherent set of computations in the pipeline calls
      the FAIRSCAPE client (FAIRSCAPE-CLI), which is passed metadata defining JSON-Schema schemas
      for the datasets in the computational unit as well as the inputs, computations, software,
      models and outputs, and creates an RO-Crate package containing the datasets, metadata and
      software (or resolvable references) plus identifier stubs. RO-Crates are then registered on
      the FAIRSCAPE server, assigned persistent globally unique resolvable identifiers (ARK scheme),
      decomposed into individual components which are also registered and identified, and end-to-end
      provenance entailments are computed and expressed in the EVI Evidence Graph Ontology.
  - description: >-
      Derivation of processed perturbation products. The KOLF2.1J CRISPRi Perturbation Cell Atlas is
      a processed product derived from the raw single-cell sequence data, mapping transcriptional and
      fitness phenotypes for 11,739 targeted genes; the raw sequences are distributed separately.
  - description: >-
      MuSIC integration pipeline (documented as the route from these input data streams to cell maps;
      the resulting computed cell maps are NOT included in this release). Steps- (a) download PPI and
      image data from the Krogan and Lundberg laboratory deposition archives; (b) generate embeddings
      - PPI networks processed with the node2vec deep learning model to produce a PPI embedding
      capturing a protein's interactions, and IF images processed with a Human Protein Atlas deep
      learning model to produce an image embedding capturing protein localization; (c) co-embedding -
      integration of the PPI and image embeddings by contrastive deep learning so that the original
      embeddings can be reconstructed with minimal information loss and proteins with similar inputs
      have similar co-embeddings; (d) protein community detection and hierarchy creation based on
      all-by-all similarities of protein pairs in the co-embedding space; (e) hierarchy evaluation
      and annotation.
  - description: >-
      Structural annotation pipeline (exploratory). A bioinformatics pipeline annotates MuSIC
      communities with available structural information about community members and their
      interactions, drawn from the Protein Data Bank, the AlphaFold Protein Structure Database,
      crosslinking mass spectrometry, and prediction of disordered sequence segments; communities are
      ranked by the amount of available structural information as a proxy for the feasibility of
      integrative structure modeling, which is then performed for top-ranked communities using the
      Python Modeling Interface and the Integrative Modeling Platform (IMP) version 2.18.

cleaning_strategies:
  - description: >-
      Input validation at each pipeline segment. Each MuSIC pipeline segment calls the FAIRSCAPE
      client package to validate inputs and create the output RO-Crate package for that segment.
  - description: >-
      Schema-based characterization and validation. CM4AI's AI-readiness criteria require complete
      schemas and validation procedures for all datasets in the provenance graph; data elements are
      characterized and mapped to public ontology vocabularies where appropriate using JSON-Schema
      mini-data-dictionary descriptions resolvable from the provenance graph metadata.
  - description: >-
      Quality control of perturbation screens. The CM4AI preprint (Year 1) reports that single-cell
      CRISPR screen data resulting from the MDA-MB-468 and undifferentiated KOLF2.1J screens were
      "currently being QCed" at the time of writing.

labeling_strategies:
  - description: >-
      Image channel labeling by staining design. Each immunofluorescence image is labeled by the
      protein of interest targeted by the primary antibody (green channel), with three reference
      channels of fixed biological meaning- DAPI/nucleus (blue), calreticulin/endoplasmic reticulum
      (yellow), tubulin/microtubules (red).
  - description: >-
      Perturbation labeling. Single cells are labeled by the CRISPRi guide RNA and hence the targeted
      gene, using a designed library with 6 guide RNAs per gene.
  - description: >-
      Cell map assembly annotation (pipeline-level; applies to computed maps not included in this
      release). Cell maps are annotated in a two-pronged approach- first, alignment to known protein
      function and pathway resources including the Gene Ontology (GO) and Reactome, to determine
      protein assemblies with high overlap with known cell biology; second, annotation of assemblies
      using a large language model approach developed by the project to name sets of proteins and
      assign a name confidence score.

machine_annotation_tools:
  - description: >-
      node2vec - deep learning model used to reduce dimensionality of downloaded protein-protein
      interaction networks and produce a PPI embedding containing information about a protein's
      interactions.
  - description: >-
      Human Protein Atlas deep learning model - used to reduce dimensionality of immunofluorescence
      images and produce an image embedding containing information about protein localization.
  - description: >-
      Contrastive deep learning co-embedding model - used to integrate PPI and image embeddings into
      a single per-protein co-embedding. The CM4AI preprint cites Bao F et al., "Integrative spatial
      analysis of cell morphologies and transcriptional states with MUSE", as the reference for this
      integration step.
  - description: >-
      Multiscale community detection - algorithmic detection of protein communities at multiple
      resolutions from all-by-all co-embedding similarities, yielding a hierarchy of protein
      assemblies.
  - description: >-
      Large language model naming - an LLM approach developed by the project to name sets of proteins
      and assign a name confidence score during hierarchy evaluation.
  - description: >-
      Scope note - these tools constitute the CM4AI MuSIC pipeline that consumes the released data
      streams. The computed cell maps they produce are explicitly not included in this release.

anomalies:
  - description: >-
      Inconsistent reported counts of imaged proteins across sources within the available material.
      The March 2025 release (DOI 10.18130/V3/B35XWX) describes its immunofluorescence archives as
      displaying the spatial localization of 563 proteins of interest per condition in MDA-MB-468
      cells; the June 2025, October 2025 and June 2026 release file descriptions state 464 proteins
      of interest per condition; the CM4AI portal Data Releases page states "IF images for 523
      proteins" among the curated TNBC flagship datasets; and the CM4AI preprint (May 2024) reports
      Year 1 completion of spatial proteomics mapping of 100 chromatin regulators in MDA-MB-468 cells
      "with another 500 proteins pending significant hits from the genetic perturbations and PPI
      results". These figures are not reconciled in the available sources.
  - description: >-
      Incomplete cross-modality protein overlap. The producers state that protein-protein interaction
      (SEC-MS), protein localization (IF imaging), and CRISPRi perturb-seq data interrogate sets of
      proteins which incompletely overlap, which constrains joint analysis across modalities.

errata:
  - description: >-
      June 2025 release revision. Version 2 of the June 2025 Data Release (DOI 10.18130/V3/F3TD5R) is
      described by its producers as a revision that added RGB immunofluorescent images, made
      corrections to RO-Crate metadata, and changed naming conventions relative to the initial June
      2025 deposit.
  - description: >-
      Release-date inconsistency for this release. The CM4AI Data Releases page labels DOI
      10.18130/V3/HIGT4C as the "June 2026 Data Release (Beta)" but displays "Released on- June 17,
      2025", whereas the official Dataverse metadata reports a publication date of 2026-06-17 and a
      version 2 release timestamp of 2026-07-15T20:28:19Z. The Dataverse dates are the ones recorded
      in this datasheet.
  - description: >-
      Residual date string in the release description. The Dataverse description block for the June
      2026 release terminates with the parenthetical date "(2025-06-30)". The same string terminates
      the description blocks of the June 2025 and October 2025 releases. The recurrence across three
      releases is directly observable in the sources; the string does not correspond to any date
      specific to the June 2026 release.

known_limitations:
  - description: >-
      Interim status. The producers state explicitly that "these data are not yet in completed final
      form" and that "this is an interim release".
  - description: >-
      Computed cell maps are not included. The release does not contain predicted cell maps, which the
      producers state will be added in future releases.
  - description: >-
      Suitability is currently modality-scoped. The producers state that the current release is most
      suitable for bioinformatics analysis of the individual datasets.
  - description: >-
      Domain expertise is required for meaningful analysis.
  - description: >-
      Some datasets are under temporary pre-publication embargo, so parts of the underlying raw data
      are not yet openly accessible.
  - description: >-
      Coverage across modalities is uneven. The producers note that the constituent SEC-MS, IF imaging
      and CRISPRi perturb-seq datasets interrogate sets of proteins which incompletely overlap.

known_biases:
  - description: >-
      Cell line derivation bias. The producers state that data in this release were derived from
      commercially available de-identified human cell lines and do not represent all biological
      variants which may be seen in the population at large.
  - description: >-
      Single-donor representation per lineage. All breast cancer data derive from MDA-MB-468, a line
      established from one 51-year-old black female donor with metastatic mammary adenocarcinoma; all
      stem-cell-derived data derive from KOLF2.1J, established from one healthy male Northern European
      donor. These donor descriptors are stated in the sources. The further observation that ancestry,
      sex and disease context are consequently confounded with cell line identity is this record's own
      inference from those descriptors and is not stated by the producers.
  - description: >-
      Target selection bias. The protein panel is deliberately focused on chromatin modifiers,
      metabolic enzymes and proteins implicated in cancer, neuropsychiatric and cardiac disorders,
      rather than being an unbiased sample of the proteome; imaging coverage is further constrained by
      Human Protein Atlas antibody availability and quality.

missing_data_documentation:
  - description: >-
      Embargoed components. External links for perturb-seq data in KOLF2.1J iPSCs (undifferentiated)
      and in MDA-MB-468 breast cancer cells (+/- treatment) are marked "Embargoed" in the June 2026
      release; the producers state that some datasets are under temporary pre-publication embargo.
  - description: >-
      Absent derived products. Computed cell maps are not included in this release.
  - description: >-
      Modality gaps carried across releases. The CM4AI Data Releases page marks IF images for the iPSC
      flagship dataset and AP-MS interactomes for the TNBC flagship dataset as "coming soon". AP-MS
      data first appear in this June 2026 release, and only for MDA-MB-468 cells with treatment
      (paclitaxel and vorinostat archives); no untreated MDA-MB-468 AP-MS archive is listed.
  - description: >-
      Unequal protein coverage across modalities, as documented under Completeness by the producers.

confidential_elements:
  - description: >-
      Temporary pre-publication embargo. The producers state that some datasets are under temporary
      pre-publication embargo; in this release the external perturb-seq data links for KOLF2.1J iPSCs
      and for MDA-MB-468 cells are labelled "Embargoed" rather than resolving to open repositories.
      All ten files deposited in the Dataverse release itself are listed with Public file access.

is_deidentified:
  description: >-
    The Dataverse release records Human Subjects- No; De-identified Samples- Yes; FDA Regulated- No.
    The CM4AI preprint states that CM4AI data "are distinctive within Bridge2AI in that they are
    non-clinical (from tissue cultures) and are considered to be de-identified as they cannot be
    matched, with current knowledge, to a human subject." Data derive from established, commercially
    or institutionally available human cell lines (MDA-MB-468, RRID:CVCL_0419, from ATCC; KOLF2.1J,
    RRID:CVCL_B5P3, from the HipSci resource), both described by the project as ethically sourced.
    Donor-level descriptors reported in the source literature (age, sex, ancestry, disease for
    MDA-MB-468; sex and ancestry for KOLF2.1J) remain associated with the cell lines themselves.

human_subject_research:
  description: >-
    The Dataverse release states Human Subjects- No. The work is non-clinical and performed on
    cultured human cell lines rather than on human participants. The CM4AI preprint describes the
    resulting data as de-identified because they cannot be matched, with current knowledge, to a human
    subject. No IRB protocol number or ethics committee approval identifier for this dataset is stated
    in the available sources; ethical oversight is described instead through the project's Ethics
    module and named ethics contacts.

ethical_reviews:
  - description: >-
      Named ethical review contacts for the release- Vardit Ravitsky (ravitskyv@thehastingscenter.org)
      and Jean-Christophe Bélisle-Pipon (jean-christophe_belisle-pipon@sfu.ca).
  - description: >-
      Data Governance Committee contact for the release- Jillian Parker (jillianparker@health.ucsd.edu).
      The CM4AI preprint states that a Data Access Committee will supervise ethical matters related to
      dataset distribution and potential dual licensing for commercial use.
  - description: >-
      Project Ethics module. The CM4AI Ethics team worked with the Data Acquisition, Tools and Standards
      modules to develop a plan for ethical preparation, licensing, dissemination and Data Access
      supervision, balancing openness with protection of intellectual property and supervision of
      commercialization efforts. The team employs a methodology inspired by Value-Sensitive Design
      (VSD), is building an axiological repository (repository of values) to guide design standards and
      expectations, and is formulating the CM4AI Life Cycle framework of governance milestones across
      data generation and AI system development. The Ethics pillar also supported the Bridge2AI Ethics
      Working Group in developing a Code of Conduct that participants must attest to before accessing
      Bridge2AI data, including CM4AI datasets.
  - description: >-
      Ethical sourcing of materials. CM4AI states it elected to use MDA-MB-468 and KOLF2.1J because
      both have been ethically sourced; KOLF2.1J is available to not-for-profit organizations via a
      simple MTA.

license_and_use_terms:
  description: >-
    Licensed for reuse under the Creative Commons Attribution-NonCommercial-ShareAlike 4.0
    International license (CC BY-NC-SA 4.0; https://creativecommons.org/licenses/by-nc-sa/4.0/). Users
    are free to share (copy and redistribute in any medium or format) and adapt (remix, transform and
    build upon) the material, under the terms of Attribution (appropriate credit, link to the license,
    indication of changes), NonCommercial (no use for commercial purposes), ShareAlike (contributions
    distributed under the same license), and no additional restrictions. Attribution is required to the
    copyright holders and the authors; the producers state that any publications referencing this data
    or derived products should cite the Related Publication as well as directly citing the data
    collection. The Dataverse Community Norms additionally expect proper credit via the displayed data
    citation. The CM4AI preprint states that commercial use requires a separate license negotiation
    with the copyright holder, and that a Data Access Committee will supervise ethical matters related
    to dataset distribution and potential dual licensing for commercial use.

ip_restrictions:
  description: >-
    Copyright in the CM4AI data is held by The Regents of the University of California except where
    otherwise noted; spatial proteomics raw image data is copyright The Board of Trustees of the Leland
    Stanford Junior University. The CM4AI preprint states that commercial use requires a separate
    license negotiation with the copyright holder (UCSD, Stanford, and/or UCSF depending upon the
    specific data package in question). Associated software carries separate, less restrictive terms-
    the Tools data integration pipeline is available under a BSD-3 open source license, FAIRSCAPE under
    the MIT license (copyright the Rector and Board of Visitors of the University of Virginia), and the
    Integrative Modeling Platform is open source.

regulatory_restrictions:
  description: >-
    The Dataverse release records FDA Regulated- No, Human Subjects- No, and De-identified Samples-
    Yes. The producers state that these laboratory data are not to be used in clinical decision-making
    or in any context involving patient care without appropriate regulatory oversight and approval. No
    export control designations (e.g. ITAR or EAR) are stated in the available sources.

distribution_formats:
  - description: >-
      ZIP archives. All ten files in the June 2026 release are distributed as ZIP archives, each
      containing an RO-Crate packaged dataset with metadata and provenance. (Prior releases in the
      series also distributed loose JSON and HTML files alongside ZIP archives.)
  - description: >-
      RO-Crate JSON-LD metadata. Release and sub-crate metadata are distributed as RO-Crate metadata
      JSON files; in prior releases these appeared as release-ro-crate-metadata.json and per-subcrate
      ro-crate-metadata.json files, and in this release within cm4ai_release_metadata.zip.
  - description: >-
      Human-readable summaries. Prior releases included an HTML datasheet
      (release-ro-crate-datasheet.html) summarizing key release information and per-subcrate HTML
      provenance graph files, which the producers note require download to view properly and do not
      display in the Dataverse preview.
  - description: >-
      Access channels. Files are publicly accessible from the University of Virginia Dataverse; the
      full dataset is too large to download as a single ZIP, and users are directed to select
      individual files below the platform download limit or to use the Data Access API for programmatic
      access. Metadata can be exported as OAI_ORE, DataCite, OpenAIRE, Schema.org JSON-LD, DDI Codebook
      v2, Dublin Core, Croissant, DDI HTML Codebook, and JSON. Persistent identifiers minted by
      FAIRSCAPE use the ARK scheme, with DOIs described as a future supplementary identifier for
      final-state publishable work.
  - description: >-
      Companion distribution of underlying raw data through external repositories - MassIVE for AP-MS
      and SEC-MS raw mass spectrometry data, NCBI SRA/BioProject for raw perturbation sequence data,
      and Figshare for the CRISPRi Perturbation Atlas of iPSCs.

distribution_dates:
  - description: >-
      June 2026 Data Release (Beta), DOI 10.18130/V3/HIGT4C - publication date 2026-06-17; eight files
      published 2026-06-17 and three immunofluorescence archives published 2026-07-15; Dataverse
      version 2.0, version 2 released 2026-07-15T20:28:19Z.
  - description: >-
      Prior releases in the same series- May 2024 Data Release (DOI 10.18130/V3/DXWOS5); March 2025
      Data Release (Beta), DOI 10.18130/V3/B35XWX, publication date 2025-03-03, version 1.4, files
      published 2025-03-03; June 2025 Data Release (Beta), DOI 10.18130/V3/F3TD5R, publication date
      2025-07-01, version 2.1, with some image archives published 2025-10-22; October 2025 Data Release
      (Beta), DOI 10.18130/V3/K7TGEM, publication date 2025-10-31, version 2.1, with some files
      published 2025-12-22.
  - description: >-
      Release cadence. CM4AI states that it releases data quarterly, ensuring continuous updates to the
      cell maps and input data streams, and that the dataset will be regularly updated and augmented
      through the end of the project in November 2026.

third_party_sharing:
  - description: >-
      Public open distribution. The release is openly available from the University of Virginia
      Dataverse (LibraData), an NIH-approved generalist repository, with all listed files marked Public
      file access, under CC BY-NC-SA 4.0.
  - description: >-
      Deposition of underlying raw data with external third-party repositories - MassIVE (AP-MS and
      SEC-MS), NCBI SRA/BioProject (perturbation sequence data), and Figshare (CRISPRi Perturbation
      Atlas of iPSCs). Cell maps produced by the project are shared via the Network Data Exchange
      (NDEx).
  - description: >-
      Programmatic dissemination through the CM4AI web portal (cm4ai.org) using the U-BRITE platform,
      and collaboration with the NIH Common Fund Data Ecosystem (CFDE) for data curation to integrate
      CM4AI contributions into the broader scientific community.
  - description: >-
      Access conditions for Bridge2AI distribution. The Bridge2AI Code of Conduct outlines basic
      requirements that participants in the Bridge2AI Open House must attest and commit to prior to
      accessing B2AI data, including CM4AI datasets.
  - description: >-
      Commercial redistribution is not permitted under the CC BY-NC-SA 4.0 license without separate
      license negotiation with the copyright holder.

maintainers:
  - description: >-
      Point of Contact for the Dataverse release- Trey Ideker, University of California San Diego
      (ORCID 0000-0002-1708-8454); corresponding author of the CM4AI preprint, tideker@health.ucsd.edu.
  - description: >-
      Depositor of the Dataverse record- Niestroy, Justin, University of Virginia.
  - description: >-
      Data Governance Committee contact- Jillian Parker, University of California San Diego
      (jillianparker@health.ucsd.edu).
  - description: >-
      Ethical review contacts- Vardit Ravitsky (ravitskyv@thehastingscenter.org) and Jean-Christophe
      Bélisle-Pipon (jean-christophe_belisle-pipon@sfu.ca).
  - description: >-
      CM4AI project-related inquiries- Swathi Thaker, PhD, University of Alabama at Birmingham, Program
      Manager, snthaker@uab.edu. Website support and updates- Zhandos Sembay, UAB, zsembay8@uab.edu.
  - description: >-
      Repository maintenance- University of Virginia Dataverse Support, which hosts the record and
      provides the contact form on the dataset landing page.

updates:
  description: >-
    CM4AI releases data quarterly. The producers state that the dataset will be regularly updated and
    augmented through the end of the project in November 2026, with updates on a quarterly basis, and
    that quarterly data releases of map-input data streams accompany delivery of machine-readable
    hierarchical maps of cell architecture as AI-ready data. Future releases are stated to add computed
    cell maps, which are absent from this release. Versioning follows the Dataverse major/minor version
    model; this release is at version 2.0 and prior releases in the series reached versions 1.4 and 2.1.

version_access:
  description: >-
    Version history is maintained by the University of Virginia Dataverse, which exposes a Versions tab
    and version-difference views for each deposited dataset, and mints a distinct DOI for each release
    in the CM4AI series. Known releases in the series- May 2024 Data Release (DOI 10.18130/V3/DXWOS5);
    March 2025 Data Release (Beta), DOI 10.18130/V3/B35XWX, version 1.4, six files, describing
    perturb-seq data in undifferentiated KOLF2.1J iPSCs, SEC-MS in undifferentiated KOLF2.1J iPSCs and
    iPSC-derived NPCs, neurons and cardiomyocytes, and IF images of 563 proteins per condition in
    MDA-MB-468 cells; June 2025 Data Release (Beta), DOI 10.18130/V3/F3TD5R, version 2.1, 21 files, a
    revision adding RGB immunofluorescent images, correcting RO-Crate metadata and changing naming
    conventions, and extending SEC-MS to treated and untreated MDA-MB-468 cells, with IF archives
    describing 464 proteins per condition; October 2025 Data Release (Beta), DOI 10.18130/V3/K7TGEM,
    version 2.1, eight files, adding perturb-seq for MDA-MB-468 cells +/- treatment; and this June 2026
    Data Release (Beta), DOI 10.18130/V3/HIGT4C, version 2.0, ten files, adding AP-MS data for
    MDA-MB-468 cells with treatment and a Figshare link to the CRISPRi Perturbation Atlas of iPSCs. The
    CM4AI Data Releases page presents the June 2026 release as the current release and archives the
    May 2024, March 2025, June 2025 and October 2025 releases. An earlier data package associated with
    the CM4AI preprint is cited as Clark T, Mohan J, Schaffer L, Obernier K, et al. "Cell Maps for
    Artificial Intelligence - Data Release", https://doi.org/10.18130/V3/DXWOS5, University of Virginia
    Dataverse, V1.

retention_limit:
  description: >-
    The producers state a maintenance plan of long term preservation in the University of Virginia
    Dataverse, supported by committed institutional funds. LibraData is the University of Virginia's
    instance of Dataverse, an NIH-approved generalist repository. No deletion schedule or retention
    expiry is stated. A caveat appears on both the CM4AI portal and the Dataverse collection page-
    "This repository/collection is under review for potential modification in compliance with
    Administration directives."

extension_mechanism:
  description: >-
    Extension is enabled principally through open-source tooling and open contact channels rather than
    a formal contribution workflow. The Cell Mapping Toolkit / MuSIC pipeline software is freely
    available and licensed under nonrestrictive open-source licenses (BSD-3 for alpha-level tools in
    GitHub and production-ready tools in the Zenodo long-term archive), with links packaged in RO-Crates
    as part of CM4AI provenance representations; the FAIRSCAPE AI-readiness framework is documented with
    a tutorial and installation instructions at https://fairscape.github.io and is available under the
    MIT license; the Integrative Modeling Platform is available at http://integrativemodeling.org. The
    project describes this toolkit as providing a flexible and generalizable framework enabling
    researchers to integrate and construct cell maps via multiple input modalities. The Teaming module
    fosters open science and community involvement through mailing lists, shared online collaborating
    folders, shared documents, and remote messaging and collaboration software within CM4AI, across the
    Bridge2AI program, and in the broader scientific community. Project-related inquiries are directed
    to snthaker@uab.edu and website support to zsembay8@uab.edu.

external_resources:
  - description: >-
      Primary project publication- Clark T, Mohan J, Schaffer L, Obernier K, Al Manir S, Churas CP,
      Dailamy A, Doctor Y, Forget A, Hansen JN, Hu M, Lenkiewicz J, Levinson MA, Marquez C, Nourreddine
      S, Niestroy J, Pratt D, Qian G, Thaker S, Bélisle-Pipon JC, Brandt C, Chen J, Ding Y, Fodeh S,
      Krogan N, Lundberg E, Mali P, Payne-Foster P, Ratcliffe S, Ravitsky V, Sali A, Schulz W, Ideker T.
      "Cell Maps for Artificial Intelligence- AI-Ready Maps of Human Cell Architecture from
      Disease-Relevant Cell Lines." bioRxiv, posted 24 May 2024; doi 10.1101/2024.05.21.589311. Listed
      as the Related Publication of the Dataverse release and the required citation for attribution.
  - description: >-
      Related publication- Nourreddine S, Doctor Y, Dailamy A, Forget A, Lee YH, Chinn B, Khaliq H,
      Polacco B, Muralidharan M, Pan E, Zhang Y, Sigaeva A, Hansen JN, Gao J, Parker JA, Obernier K,
      Clark T, Chen JY, Metallo C, Lundberg E, Ideker T, Krogan N, Mali P. "A perturbation cell atlas of
      human induced pluripotent stem cells." bioRxiv 2024 Nov 4; 2024.11.03.621734; PMCID PMC11580897;
      doi 10.1101/2024.11.03.621734.
  - description: >-
      Methodologically antecedent publication and distinct dataset- Schaffer LV, Hu M, Qian G, et al.
      "Multimodal cell maps as a foundation for structural and functional genomics." Nature 642,
      222-231 (2025); doi 10.1038/s41586-025-08878-3; Publisher Correction published 02 October 2025
      (doi 10.1038/s41586-025-09648-x). This work reports a multimodal cell map of U2OS osteosarcoma
      cells built from AP-MS and immunofluorescence data for over 5,100 proteins, with SEC-MS
      validation, and the associated Cell Visualization Portal (http://musicmaps.ai/u2os-cellmap/) and
      Cell Mapping Toolkit (https://github.com/idekerlab/cellmaps_pipeline). It describes a different
      dataset in a different cell line from the CM4AI release documented here and is included as
      related methodological background, not as a description of CM4AI data.
  - description: >-
      CM4AI web portal- https://cm4ai.org/ and the Data Releases page https://cm4ai.org/data-releases/,
      built on the U-BRITE platform, providing project documentation, tools, publications, and learning
      resources.
  - description: >-
      NIH RePORTER project record- https://reporter.nih.gov/project-details/11211616 for application ID
      11211616, project number 3OT2OD032742-01S2, core project OT2OD032742, "Bridge2AI: Cell Maps for AI
      (CM4AI) Data Generation Project".
  - description: >-
      License text- Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International,
      https://creativecommons.org/licenses/by-nc-sa/4.0/.
  - description: >-
      Software- FAIRSCAPE AI-readiness framework, https://fairscape.github.io (MIT license); Cell
      Mapping Toolkit / MuSIC pipeline, https://github.com/idekerlab/cellmaps_pipeline with
      documentation at https://cellmaps-pipeline.readthedocs.io/; Integrative Modeling Platform,
      http://integrativemodeling.org.
  - description: >-
      Data repositories referenced from the release- MassIVE (SEC-MS for KOLF2.1J and MDA-MB-468; AP-MS
      for MDA-MB-468 paclitaxel and vorinostat), NCBI BioProject / Sequence Read Archive (raw
      perturbation sequence data), Figshare (CRISPRi Perturbation Atlas of iPSCs), and the Network Data
      Exchange (NDEx) for cell maps.
  - description: >-
      Bridge2AI program- https://commonfund.nih.gov/bridge2ai, the NIH Common Fund program within which
      CM4AI is the Functional Genomics Data Generation Project.

use_repository:
  - description: >-
      Dataverse usage metrics on the release landing page report 181 downloads for the June 2026
      release, with per-file download counts listed alongside each archive. The landing page also states
      that citations for the dataset are retrieved from Crossref via DataCite using Make Data Count
      standards, and reports "Sorry, no citations were found." Download counts recorded for prior
      releases in the series are 302 (March 2025), 256 (June 2025) and 405 (October 2025).