name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  The June 2026 Data Release (Beta) of Cell Maps for Artificial Intelligence (CM4AI; cm4ai.org),
  the Functional Genomics Grand Challenge Data Generation Project of the U.S. National Institutes
  of Health Bridge2AI program. CM4AI generates multi-modal data including protein-protein
  interaction (PPI), spatial protein localization, and genetic perturbation data in MDA-MB-468
  breast cancer cells (with and without paclitaxel or vorinostat treatment) and in KOLF2.1J
  induced pluripotent stem cells (with and without differentiation). This Beta release includes,
  per the Dataverse record- (1) perturb-seq data for MDA-MB-468 breast cancer cells +/- treatment
  and for undifferentiated (parental) KOLF2.1J iPSCs; (2) SEC-MS data for MDA-MB-468 breast cancer
  cells +/- treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived neural progenitor cells
  (NPCs), neurons, and cardiomyocytes; (3) AP-MS data for MDA-MB-468 breast cancer cells +
  treatment; and (4) immunofluorescence (IF) confocal images in MDA-MB-468 breast cancer cells
  +/- treatment. Output data are packaged with provenance graphs and rich metadata as AI-ready
  datasets in RO-Crate format using the FAIRSCAPE framework. Computed cell maps are explicitly
  NOT included in this release. Sources in the bundle give two variant lists of collaborating
  institutions- the CM4AI Data Releases page states "a collaboration of UCSD, UCSF, Stanford, UVA,
  Yale, UT Austin, UA Birmingham, Simon Fraser University, and the Hastings Center", while the
  March 2025 Dataverse release description states "a collaboration of UCSD, UCSF, Stanford, UVA,
  Yale, UA Birmingham, Simon Fraser University, and the Hastings Center" (omitting UT Austin);
  both are recorded here rather than one being selected. Project-level totals advertised on the
  CM4AI portal (not verified in the bundle as counts specific to this release) are- 1,374 protein
  interactions; 53,788 immunofluorescent images; 7,023 total proteins investigated; 11,739 genes
  targeted; 21.4 TB data volume.
