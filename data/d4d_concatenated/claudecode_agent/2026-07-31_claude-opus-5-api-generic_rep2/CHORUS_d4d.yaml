id: https://chorus4ai.org/
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multi-center, multimodal, high-resolution critical care dataset generated by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  project, one of four data generation projects in the NIH Common Fund Bridge2AI consortium
  (award OT2OD032701). Data are collected retrospectively from hospital systems and offered under
  controlled access. The sources characterize the contributing network in slightly different terms:
  the CHoRUS GitHub organization overview states that the collaboration spans 20 academic centers,
  "of which 14 will contribute as Data Acquisition centers"; the project website reports 14 data
  contributing hospitals and 60+ consortium members across 20 different institutions; and a
  September 2025 Bridge2AI webinar reports coverage of 14 different hospitals as of August 2025.
  The dataset aggregates structured electronic health record data standardized to the OMOP Common
  Data Model, tokenized unstructured clinical notes, imaging from PACS, bedside waveform telemetry,
  EEG waveforms, and social determinants of health, with the aim of supporting machine learning and
  artificial intelligence work that characterizes acute and critical illness, predicts complications,
  and measures treatment response. The project website describes a currently released dataset of
  50,000 patient admissions from ICU, PICU, and NICU settings, comprising 1.6 billion rows of EHR
  OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data, and an anticipated
  final dataset of 100,000 patient admissions across 9 data modalities from 14 contributing
  hospitals. A holdout test set is sequestered to enable external validation of models.
keywords:
  - critical care
  - intensive care
  - acute illness
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - artificial intelligence
  - machine learning
  - Bridge2AI
  - multimodal data
  - controlled access
page: https://chorus4ai.org/
created_by: >-
  CHoRUS for Equitable AI consortium (60+ members across 20 different institutions). The
  organization named on the NIH award record (OT2OD032701) is Massachusetts General Hospital.
status: >-
  Actively generated and incrementally released; a released dataset is available under controlled
  access while additional modalities and admissions are still being acquired. The project website
  carries the notice: "This repoitory is under review for potential modification in compliance with
  Administration directives."
conforms_to: >-
  OMOP Common Data Model (OHDSI) for structured EHR data; OHNLP open source schema for tokenized
  clinical notes; DICOM for imaging; WFDB and an extended PhysioNet schema for waveform telemetry;
  EDF+ and Persyst for EEG waveforms.
conforms_to_schema: "OMOP Common Data Model (OHDSI), with CHoRUS extensions for nursing flowsheet data"
was_derived_from: >-
  Source clinical systems at the contributing hospitals, including structured electronic health
  records, provider documentation, nursing flowsheets, PACS imaging archives, bedside monitor
  telemetry gateways/middleware, and hospital EEG databases.

purposes:
  - description: >-
      To meet the need for infrastructure supporting artificial intelligence and machine learning in
      critical care by developing a publicly available, AI-ready critical care dataset drawn from
      more than 100,000 critically ill patients, while ensuring that the methods promote privacy,
      accountability, and clinical benefit.
  - description: >-
      To create ethically sourced datasets and tools around artificial intelligence and to establish
      best practices for AI in health, as one of four data generation projects within the NIH-funded
      Bridge2AI consortium.
  - description: >-
      To develop the most diverse, high-resolution, ethically sourced, AI-ready dataset addressing the
      grand challenge of improving recovery from acute illness, supported by unified standards that
      harmonize multi-modal EHR, waveform, imaging, and text data.
  - description: >-
      To provision a sequestered holdout test set accessible for external validation of models, aiding
      marketplace adoption of AI-developed models for implementation in acute and critical care.
  - description: >-
      To cultivate expertise in the lay and scientific community and to train a next generation of
      engineers, data scientists, and clinicians in AI for clinical care, including through
      hands-on training programs that use the CHoRUS dataset.

tasks:
  - description: "Characterizing acute and critical care illness in patients with acute or critical illness."
  - description: "Predicting complications and clinical deterioration among critically ill patients."
  - description: "Measuring treatment response among patients with acute or critical illness."
  - description: >-
      External validation of AI/ML models against a sequestered holdout test set to support
      marketplace adoption of models for acute and critical care.
  - description: >-
      Labeling of data with targets important for prediction, supported by a visualization and
      annotation environment developed within the project.
  - description: >-
      Training and education tasks: guided AI/ML exercises, canonical Jupyter Notebooks, and
      use-case development on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud.

addressing_gaps:
  - description: >-
      There is an urgent need for infrastructure to support AI/ML in critical care; developing
      high-resolution multi-center data sets is described as a critical first step towards actionable
      and trustworthy AI. CHoRUS addresses the absence of such an AI-ready, multi-center, multimodal
      critical care resource.
  - description: >-
      Existing legal and regulatory landscapes for sharing high-resolution clinical data are analyzed
      and new approaches created, addressing the gap in legal frameworks for collecting and sharing
      critical care data at scale.
  - description: >-
      Community perspectives on clinical care AI had not been systematically incorporated into dataset
      construction; CHoRUS conducts community-facing ethics focus groups to determine what data is
      appropriate for public sharing and to increase trustworthiness of provenance and privacy.
  - description: >-
      Data elements frequently lack contextual factors; CHoRUS ensures inclusion of contextual factors
      such as geographic distance to the nearest hospital and social determinants of health.
  - description: >-
      Workforce and AI literacy gaps in the lay and scientific community are addressed through
      multimodal educational approaches and training programs.

creators:
  - description: >-
      Eric S. Rosenthal, Massachusetts General Hospital; principal investigator of the CHoRUS
      Bridge2AI award (1OT2OD032701-01) and member of the Bridge2AI CHoRUS leadership team.
  - description: "Azra Bihorac, University of Florida; Bridge2AI CHoRUS leadership team."
  - description: "Xiaoqian Jiang, UTHealth Houston; Bridge2AI CHoRUS leadership team."
  - description: "Yulia Strekalova, University of Florida; Bridge2AI CHoRUS leadership team."
  - description: "Parisa Rashidi, University of Florida; Bridge2AI CHoRUS leadership team."
  - description: "Manlik Kwong, Tufts University; Bridge2AI CHoRUS leadership team."
  - description: >-
      The CHoRUS consortium as a whole: more than 60 members across 20 different institutions, of which
      14 are reported as data contributing hospitals / data acquisition centers.

funders:
  - description: >-
      United States National Institutes of Health, NIH Common Fund Bridge2AI program. Core project
      number OT2OD032701; project number 1OT2OD032701-01; application ID 10472824. Awarded to
      Massachusetts General Hospital, fiscal year 2022, award amount 5,880,300 (currency unit not
      stated in the source), project period 2022-09-01 to 2026-11-30. The project website notes that
      content is solely the responsibility of the authors and does not necessarily represent the
      official views of the NIH.

instances:
  - description: >-
      The primary instance is a patient hospital admission involving acute or critical illness. The
      project website reports 50,000 patient admissions from ICU, PICU, and NICU in the current
      released dataset and an anticipated final dataset of 100,000 patient admissions; the NIH project
      abstract describes acquiring data from more than 100,000 critically ill patients. A Bridge2AI
      informational webinar dated September 2025 states that, as of August 2025, the dataset covers 14
      different hospitals with over 45,000 unique admissions. The 45K (August 2025 webinar) and 50K
      (project website) admission counts are both recorded here as reported by their respective sources.
  - description: >-
      Each admission is associated with multimodal records: structured OMOP records (demographics,
      medication administration time-stamped at each infusion change or dose administration, procedures,
      nursing flowsheets at high documentation frequency, diagnoses), tokenized clinical notes,
      DICOM imaging, WFDB waveform telemetry, and EDF+/Persyst EEG waveforms.
  - description: >-
      Aggregate volumetric characterization of the released dataset: 1.6 billion rows of EHR OMOP data,
      7,642 admissions with radiology data, and 23 Tb of waveform data.

subsets:
  - id: https://chorus4ai.org/dataset#demographics
    description: "Demographics. Data standard: OMOP. Access control: Controlled. Metadata available: yes; published metadata schema: OMOP schema."
  - id: https://chorus4ai.org/dataset#medication-administration
    description: >-
      Medication administration, with dosing time-stamped upon each infusion change or dose
      administration. Data standard: OMOP. Access control: Controlled. Metadata available: yes;
      published metadata schema: OMOP schema.
  - id: https://chorus4ai.org/dataset#procedures
    description: "Procedures, as documented by providers. Data standard: OMOP. Access control: Controlled. Metadata available: yes; published metadata schema: OMOP schema."
  - id: https://chorus4ai.org/dataset#nursing-flowsheets
    description: >-
      Nursing flowsheets (high-frequency documentation). Data standard: OMOP. Access control:
      Controlled. Metadata available: yes; published metadata schema: OMOP schema with extensions.
  - id: https://chorus4ai.org/dataset#diagnoses
    description: "Diagnoses, as documented by providers. Data standard: OMOP. Access control: Controlled. Metadata available: yes; published metadata schema: OMOP schema."
  - id: https://chorus4ai.org/dataset#clinical-notes
    description: >-
      Clinical notes, extracted and tokenized using the OHNLP toolkit. Data standard: OHNLP. Access
      control: Controlled. Metadata: planned; published metadata schema: OHNLP open source schema.
      Clinical notes are stored locally at contributing sites; only tokens are held in the enclave.
  - id: https://chorus4ai.org/dataset#imaging
    description: >-
      Imaging obtained from PACS. Data standard: DICOM. Access control: Controlled. Metadata: planned;
      published metadata schema: DICOM schema. As of the September 2025 webinar, approximately 1,000
      images were available with de-identification in process for a larger cohort; the project website
      reports 7,642 admissions with radiology data in the released dataset.
  - id: https://chorus4ai.org/dataset#waveform-telemetry
    description: >-
      Waveform telemetry from bedside monitors via gateway/middleware. Data standard: WFDB. Access
      control: Controlled. Metadata available: yes; published metadata schema: PhysioNet schema
      (extended). Reported volume: 23 Tb of waveform data.
  - id: https://chorus4ai.org/dataset#waveform-eeg
    description: >-
      Waveform EEG drawn from hospital databases. Data standards: EDF+ and Persyst. Access control:
      Controlled. Metadata: planned; published metadata schema: open source EDF+ and Persyst schema.
      As of the September 2025 webinar, EEG extraction was still in process.
  - id: https://chorus4ai.org/dataset#holdout
    description: >-
      A sequestered holdout dataset provisioned as a test set, accessible for external validation of
      models to aid marketplace adoption of AI-developed models in acute and critical care.

subpopulations:
  - description: >-
      Intensive care unit (ICU) admissions. The released dataset comprises admissions from ICU, PICU,
      and NICU settings.
  - description: "Pediatric intensive care unit (PICU) admissions."
  - description: "Neonatal intensive care unit (NICU) admissions."
  - description: >-
      Patients distributed across 14 data contributing hospitals within a network of 20 academic
      centers. Federated access is intended to enable sampling methods that ensure a balanced and
      diverse cohort, and sampling is designed to ensure comprehensive sets of patient conditions and
      clinical treatment strategies.

splits:
  - description: >-
      The project sequesters holdout datasets that are not released with the primary dataset and are
      provisioned as a test set for external model validation. No further train/validation partitioning
      is described in the available sources.

sensitive_elements:
  - description: >-
      The dataset consists of patient-level clinical records from hospital electronic health record,
      imaging, telemetry, and EEG systems; all nine data types are listed with Controlled access.
  - description: >-
      Unstructured clinical notes, which are retained locally at contributing sites and represented in
      the enclave only as tokens produced with the OHNLP toolkit.
  - description: >-
      Imaging derived from PACS, which requires de-identification prior to release; de-identification was
      in process for the larger imaging cohort as of the September 2025 webinar.
  - description: >-
      Social determinants of health and contextual factors such as geographic distance to the nearest
      hospital, which the project states will be featured among the data elements.

confidential_elements:
  - description: >-
      Full-text clinical notes are not centrally released; they are stored locally at contributing sites,
      with only tokenized representations available in the shared enclave.
  - description: >-
      All nine data modalities are designated as Controlled access. Access requires registration, a
      signed licensing agreement, and provisioning within the project cloud enclave.

is_deidentified:
  description: >-
    The project acquires data, standardizes it to the OMOP Common Data Model, and transforms data using
    approaches that limit re-identification, including tokenization of unstructured electronic health
    record data. Imaging de-identification was in process for the larger cohort as of the September 2025
    webinar, and a subset of approximately 1,000 images was available with de-identification completed.
    Supporting tooling in the CHoRUS GitHub organization includes a privacy scan tool for medical records
    (privacy_scan_tool) and a CTP-deid repository. Residual re-identification risk is not quantified in
    the available sources.

known_biases:
  - description: >-
      The available sources do not identify or quantify any specific bias present in the assembled data.
      Bias is described as an explicit project workstream: patient-focused efforts determine the ethical
      and legal approaches to manage privacy and bias while accounting for social determinants of health,
      federated access is intended to enable sampling methods that ensure a balanced and diverse cohort,
      and sampling is designed to ensure comprehensive sets of patient conditions and clinical treatment
      strategies.

known_limitations:
  - description: >-
      Incomplete modality coverage at the time of documentation: as of the September 2025 webinar, imaging
      de-identification was in process for the larger cohort with only about 1,000 images available, and
      EEG extraction was in process.
  - description: >-
      Full clinical note text is not available centrally; notes remain stored locally at contributing sites
      and are represented only as tokens in the enclave.
  - description: >-
      Published metadata is marked "Planned" rather than available for clinical notes, imaging, and EEG
      waveforms.
  - description: >-
      The released dataset is smaller than the anticipated final dataset: 50,000 patient admissions
      released versus 100,000 anticipated.
  - description: "Data collection is retrospective."
  - description: >-
      Access is controlled and requires registration and a signed licensing agreement; for the AIM-AHEAD
      training pathway a ".edu" email address is required to gain access to the dataset, though program
      administrators will assist with this access if needed.
  - description: >-
      The project website carries a notice that the repository is under review for potential modification
      in compliance with Administration directives.

missing_data_documentation:
  - description: >-
      Modalities not yet fully populated at the time of the September 2025 webinar: imaging (de-identification
      in process beyond an initial ~1,000 images) and EEG (extraction in process). Clinical notes are
      systematically absent from the enclave in full-text form by design, with tokens substituted.
  - description: >-
      Metadata records are documented as "Planned" for clinical notes, imaging, and EEG waveform modalities,
      and as available for demographics, medication administration, procedures, nursing flowsheets,
      diagnoses, and waveform telemetry.

acquisition_methods:
  - description: >-
      Retrospective acquisition of clinical data already recorded in hospital systems, rather than data
      generated prospectively for research purposes.
  - description: >-
      Multi-center acquisition across a network in which capabilities were developed to acquire, standardize,
      tokenize, store, visualize, and label data. Contributing sites create and upload a CHoRUS Data Extract
      following standard operating protocols.
  - description: >-
      Federated access arrangements enable sampling methods across sites to ensure a balanced and diverse
      cohort.

collection_mechanisms:
  - description: "Extraction of structured electronic health record data from hospital EHR systems, standardized to the OMOP Common Data Model."
  - description: "Extraction of imaging studies from hospital PACS in DICOM format."
  - description: "Capture of waveform telemetry from bedside monitors via gateway/middleware systems, delivered in WFDB format."
  - description: "Extraction of EEG waveforms from hospital EEG databases in EDF+ and Persyst formats."
  - description: "Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit."
  - description: >-
      Software tooling in the CHoRUS GitHub organization, including chorus-extract-upload (tools to create and
      upload a CHoRUS Data Extract) and dockerized container applications deployed to support CHoRUS services
      on Azure.
  - description: >-
      Standard operating protocols (SOPs) maintained in the Chorus_SOP repository, including an interactive
      workflow diagram describing the step-by-step process for extracting and contributing clinical data to
      CHoRUS, and a data acquisition SOP site.

data_collectors:
  - description: >-
      Data acquisition centers within the collaboration contribute clinical data extracts; the sources report
      14 data contributing hospitals / data acquisition centers within a network of 20 academic centers. Data
      site managers at each contributing site follow the CHoRUS SOPs to extract, curate, and deliver
      interoperable datasets.
  - description: >-
      The CHoRUS Data Acquisition, Standards, and Tooling sub-teams within the CHoRUS data generation project
      support and validate site contributions; clinical collaborators contribute semantic mapping and clinical
      validation.

collection_timeframes:
  - description: >-
      Data collection is retrospective. The funded project period runs from 2022-09-01 to 2026-11-30. A dataset
      snapshot described in a September 2025 informational webinar reflects coverage as of August 2025. The time
      window of the underlying patient encounters is not specified in the available sources.

sampling_strategies:
  - description: >-
      Sampling designed to ensure comprehensive sets of patient conditions and clinical treatment strategies when
      collecting data at scale under an established legal framework.
  - description: >-
      Federated access enabling sampling methods across contributing sites to ensure a balanced and diverse cohort.
  - description: >-
      Cohort scope restricted to patients with acute or critical illness, with released admissions drawn from ICU,
      PICU, and NICU settings.

direct_collection:
  - description: >-
      Data are not collected directly from individuals for the purpose of this dataset. They are obtained
      retrospectively from clinical systems operated by the contributing hospitals and then standardized,
      tokenized, and transformed by the CHoRUS network.

raw_sources:
  - description: >-
      Source-format clinical data held by contributing hospitals prior to harmonization: structured EHR records,
      provider documentation of diagnoses and procedures, nursing flowsheets, unstructured clinical notes, PACS
      imaging, bedside monitor telemetry streams, and hospital EEG recordings. Validated semantic mappings
      maintained in the chorus-mapping repository connect clinical data in various source formats to
      international standards.

raw_data_sources:
  - source_description: >-
      Hospital electronic health record systems at the data acquisition centers, providing demographics,
      medication administration, procedures, nursing flowsheets, diagnoses, and unstructured clinical notes.
  - source_description: >-
      Hospital picture archiving and communication systems (PACS), providing imaging studies in DICOM format.
  - source_description: >-
      Bedside physiologic monitors and their gateway/middleware systems, providing continuous waveform telemetry.
  - source_description: >-
      Hospital EEG databases, providing EEG waveform recordings in EDF+ and Persyst formats.

preprocessing_strategies:
  - description: >-
      Standardization of structured clinical data to the OMOP Common Data Model, with schema extensions for
      high-frequency nursing flowsheet documentation.
  - description: >-
      Tokenization of unstructured electronic health record text using the OHNLP toolkit, so that only tokens
      rather than full note text are transferred to the shared enclave.
  - description: >-
      Transformation of data using approaches that limit re-identification, including de-identification of imaging
      prior to release.
  - description: >-
      Conversion of waveform data into standardized formats, supported by the chorus_waveform repository of waveform
      documentation and conversion scripts and by chorus_waveform_resources supporting waveform preparation and
      release.

cleaning_strategies:
  - description: >-
      Validated semantic mappings for connecting clinical data in various source formats to international standards,
      pooled in tabular form in the chorus-mapping repository.
  - description: >-
      A clinical validation SOP under which clinical experts review and validate semantic mappings before adoption.
  - description: >-
      Internal validation and review of all standard operating protocol documents within the Chorus_SOP repository.
  - description: >-
      Characterization reports produced by the CHoRUSReports repository and returned to contributing sites following
      their data submissions.

labeling_strategies:
  - description: >-
      A visualization and annotation environment developed by the project labels data with targets important for
      prediction. The project develops capabilities across the multi-center network to acquire, standardize,
      tokenize, store, visualize, and label data.

machine_annotation_tools:
  - description: "OHNLP toolkit, used to extract and tokenize clinical notes into the OHNLP open source schema."

ethical_reviews:
  - description: >-
      Ethics is one of three project pillars ("Ethical and Trustworthy AI"). As reported in the sources, the project
      performs legal and ethical research, establishes a legal framework for collecting data at scale, and conducts
      community-facing ethics focus groups to determine what data is appropriate for public sharing. The CHoRUS
      consortium also evaluates community perspectives on clinical care AI in order to increase the trustworthiness
      of provenance and privacy in AI, and analyzes the existing legal and regulatory landscape to create new
      approaches. No institutional review board determination, approval number, or ethics committee review specific
      to this dataset is described in the available sources.

human_subject_research:
  description: >-
    The dataset is derived from clinical records of critically ill human patients (reported as over 45,000 unique
    admissions as of August 2025 and 50,000 released admissions on the project website, with more than 100,000
    critically ill patients anticipated). Data are collected retrospectively from hospital systems rather than
    prospectively from participants. The project establishes a legal framework for collecting data at scale and
    conducts ethics focus groups on appropriate public sharing. The available sources do not state IRB approval
    numbers, consent procedures, or waiver determinations for the underlying patient data.

at_risk_populations:
  description: >-
    The released dataset includes admissions from pediatric (PICU) and neonatal (NICU) intensive care units,
    meaning minors and neonates are represented. Specific safeguards, assent procedures, or additional protections
    for these populations are not described in the available sources beyond the project's general privacy,
    tokenization, de-identification, and controlled-access measures.

participant_privacy:
  - description: >-
      Privacy protections include tokenization of unstructured EHR text, retention of full clinical notes only in
      local site storage, de-identification of imaging prior to release, and transformation of data using approaches
      that limit re-identification.
  - description: >-
      All nine data modalities are released only under controlled access within a project cloud enclave, gated by
      registration and a signed licensing agreement.
  - description: >-
      The project's overarching goal explicitly includes ensuring that methods promote privacy, accountability, and
      clinical benefit; patient-focused efforts determine the ethical and legal approaches to manage privacy and bias.

data_protection_impacts:
  - description: >-
      The project performs legal and ethical research on privacy, analyzes the existing legal and regulatory
      landscape, and conducts community-facing ethics focus groups to determine what data is appropriate for public
      sharing. Technical privacy tooling in the CHoRUS GitHub organization includes a privacy scan tool for medical
      records and a de-identification repository. A formal data protection impact assessment document is not
      identified in the available sources.

license_and_use_terms:
  description: >-
    The CHoRUS dataset is controlled access. Prospective users complete a registration form providing name, email,
    and institution, and all participants must sign a licensing agreement included in the registration form before
    gaining access to the dataset; access and compute are then provisioned and confirmed by email. For the
    AIM-AHEAD Bridge2AI for Clinical Care training pathway, a ".edu" email address is required to gain access to the
    dataset, though program administrators will assist with this access if needed and the requirement is stated not
    to be a barrier to acceptance into the program. Separately, the CHoRUS software maintained in the chorus-ai
    GitHub organization is licensed under the MIT License; individual repositories additionally carry MIT or
    Apache-2.0 licenses. This software licensing does not describe the terms of the dataset itself. The project
    website states that its content is solely the responsibility of the authors and does not necessarily represent
    the official views of the NIH.

distribution_formats:
  - description: "OMOP Common Data Model tables (with CHoRUS extensions for nursing flowsheets) for demographics, medication administration, procedures, nursing flowsheets, and diagnoses."
  - description: "OHNLP open source schema token representations of clinical notes."
  - description: "DICOM for imaging derived from PACS."
  - description: "WFDB, using an extended PhysioNet schema, for bedside waveform telemetry."
  - description: "EDF+ and Persyst for EEG waveforms."
  - description: >-
      Delivery is through a controlled-access cloud enclave: OMOP and telemetry data reside in the enclave, clinical
      notes are stored locally with only tokens in the enclave, and access is provided together with provisioned
      compute on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud, supported by dockerized container
      applications deployed on Azure.

distribution_dates:
  - description: >-
      A dataset snapshot described in the September 9, 2025 Bridge2AI for Clinical Care informational webinar
      reflects coverage as of August 2025 (14 hospitals, over 45,000 unique admissions). The project website
      describes a "Current Released Dataset" of 50,000 patient admissions with an anticipated final dataset of
      100,000 admissions. Specific release version dates are not stated in the available sources.

third_party_sharing:
  - description: >-
      The dataset is shared outside the acquiring institutions under controlled access, following registration and a
      signed licensing agreement, within the project cloud enclave.
  - description: >-
      Datasets are being used for training activities and publications, including the AIM-AHEAD Bridge2AI for
      Clinical Care Training Program, whose purpose is to expand access to Bridge2AI CHoRUS data through engagement,
      AI training, and mentorship; up to 30 trainees are selected for Cohort 2.
  - description: >-
      A holdout test set is made accessible for external model validation to aid marketplace adoption of AI-developed
      models, involving external biomedical and clinical organizations, industry, and regulatory agencies.
  - description: >-
      The project collaborates with the NIH Bridge2AI program, the NIH Bridge2AI Bridge Center, and three other data
      generation projects.

maintainers:
  - description: >-
      Massachusetts General Hospital is the organization named on the NIH award record; Ciera McCrary, MGH, is listed
      as Program Manager and website contact (cmccrary@mgh.havard.edu, as printed on the project website).
  - description: >-
      Data access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org, per the CHoRUS
      GitHub organization contact section.
  - description: >-
      The chorus-ai GitHub organization (37 followers, 28 repositories, United States of America) maintains software,
      semantic mappings, SOPs, and project management resources; package versions, maintainers, and other metadata
      about CHoRUS packages are tracked on a package status page, and documentation for contributors and users is
      compiled in the chorus-developer repository.

updates:
  description: >-
    The dataset is being expanded from the currently released 50,000 patient admissions toward an anticipated final
    dataset of 100,000 patient admissions across 9 data modalities from 14 contributing hospitals. As of the
    September 2025 webinar, de-identification of a larger imaging cohort and extraction of EEG data were in process,
    and published metadata for clinical notes, imaging, and EEG was planned. Contributing sites provide regular status
    updates on their data extract progress, submitted through the GitHub interface or a Google Form; a GoogleScript
    triggered on each form submission calls the GitHub API to update status and issue information, with statuses
    routed to the Standards Project or the Data Acquisition Project. The project website notes the repository is under
    review for potential modification in compliance with Administration directives.

extension_mechanism:
  description: >-
    Contributions are coordinated through the chorus-ai GitHub organization. Data site managers follow the Chorus_SOP
    workflow diagram and its linked SOP documents, and post issues to context-specific Standards Discussions or Data
    Acquisition Discussions. Clinical collaborators contribute to semantic mapping through the chorus-mapping
    repository, which holds documentation, pooled tabular mappings, and an associated clinical validation SOP.
    Software developers contribute open-source tooling documented in the chorus-developer web guide. Project managers
    aggregate issues across repositories into a central task management project with assigned users, delivery dates,
    and dependencies. Community users are directed to the public-facing project webpage, and interested parties may
    contact the project directly.

intended_uses:
  - description: >-
      Development of machine learning and artificial intelligence models to improve the care and outcomes of patients
      requiring critical care, including characterizing acute and critical illness, predicting complications, and
      measuring treatment response.
  - description: >-
      External validation of AI/ML models using the sequestered holdout test set, supporting marketplace adoption and
      implementation of models in acute and critical care.
  - description: >-
      Training and workforce development: hands-on AI/ML training using the CHoRUS dataset in the Bridge2AI AI/ML for
      Clinical Care Collaborative Cloud, including Jupyter Notebook workshops, the OHDSI tool stack, and the
      OHDSI/OMOP common data model.
  - description: >-
      Research on ethical, legal, and trustworthy AI in health, including provenance, privacy, and bias, and best
      practices for AI in health.
  - description: >-
      Analyses incorporating social determinants of health and contextual factors such as geographic distance to the
      nearest hospital.

existing_uses:
  - description: >-
      As stated in the September 2025 Bridge2AI for Clinical Care webinar, the datasets are being used for training
      activities and publications.
  - description: >-
      The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2; program start November 17, 2025, program
      end July 31, 2026) is described as expanding access to Bridge2AI CHoRUS data, with trainees developing use
      cases, poster presentations for the Bridge2AI Conference 2026 and AIM-AHEAD Annual Meeting 2026, conference
      abstracts, and manuscripts.

other_tasks:
  - description: >-
      Downstream analytics on the mapped and assembled dataset, for which the CHoRUS GitHub organization invites
      interested clinical collaborators to make contact.
  - description: >-
      Semantic mapping and validation work connecting clinical data in various source formats to international
      standards, supported by the pooled tabular mappings in the chorus-mapping repository.

future_use_impacts:
  - description: >-
      Anticipated benefit: the dataset and its holdout test set are intended to aid marketplace adoption of
      AI-developed models for implementation in acute and critical care, and to catalyze biomedical research and
      expertise promoting patient-focused deployment of AI in acute and critical care.
  - description: >-
      Anticipated risk management: the project's methods are explicitly designed to promote privacy, accountability,
      and clinical benefit, to manage privacy and bias while accounting for social determinants of health, and to
      limit re-identification through data transformation; community-facing ethics focus groups determine what data is
      appropriate for public sharing.
  - description: >-
      Trainees using the dataset are expected to learn how to address concerns such as privacy in the responsible
      application of AI/ML.

