collection_mechanisms:
- name: Immunofluorescence subcellular microscopy
  description: >-
    Immunofluorescence (IF) subcellular microscopy generates the spatial
    proteomics data stream. The May 2024 preprint reports completed spatial
    proteomics mapping of 100 chromatin regulators in MDA-MB-468 cells (with or
    without paclitaxel or vorinostat). Release file descriptions state that
    the images were acquired by immunofluorescence-based staining (ICC-IF) and
    confocal microscopy in the Lundberg Lab at Stanford University.
- name: Affinity purification mass spectrometry (AP-MS)
  description: >-
    AP-MS generates protein-protein interaction data. As of the May 2024
    preprint, 17 genes had been endogenously tagged in MDA-MB-468 cells and
    AP-MS data acquired under three conditions (untreated, paclitaxel and
    vorinostat treated). The June 2026 release includes AP-MS data for
    treated MDA-MB-468 cells.
- name: Size exclusion chromatography mass spectrometry (SEC-MS)
  description: >-
    SEC-MS generates proteome-wide protein complex and interaction data. The
    releases include SEC-MS data for MDA-MB-468 cells with or without
    treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived NPCs, neurons
    and cardiomyocytes.
- name: Single-cell CRISPR perturbation screens (Perturb-seq)
  description: >-
    Single-cell CRISPR-Cas perturbation screens by cell type. The May 2024
    preprint reports single-cell CRISPR screens of 100 chromatin regulators
    (with or without drug) in MDA-MB-468 cells and in undifferentiated
    KOLF2.1J iPSCs using the 10x Genomics 3'HT kit, with the resulting data
    then being quality-controlled.
data_collectors:
- name: Lundberg Lab, Stanford University
  role: Immunofluorescence imaging
  description: >-
    Release file descriptions state that the IF image data were imaged by
    immunofluorescence-based staining (ICC-IF) and confocal microscopy in the
    Lundberg Lab at Stanford University.
- name: Nevan Krogan laboratory, University of California San Francisco
  role: SEC-MS data generation
  description: >-
    Release file descriptions state that the SEC-MS data were generated in the
    Nevan Krogan laboratory at the University of California San Francisco.
raw_data_sources:
- source_description: >-
    PPI networks for each cell line and condition, downloaded from the Krogan
    Laboratory's deposition archive as input to the MuSIC cell-map pipeline.
  source_caveats: >-
    Described in the May 2024 preprint for the cell-map pipeline; the June
    2026 release states that computed cell maps are not included in that
    release.
- source_description: >-
    IF images for each cell line and condition, downloaded from the Lundberg
    Laboratory's deposition archive as input to the MuSIC cell-map pipeline.
  source_caveats: >-
    Described in the May 2024 preprint for the cell-map pipeline; the June
    2026 release states that computed cell maps are not included in that
    release.
preprocessing_strategies:
- name: MuSIC data integration pipeline
  description: >-
    Input data streams are integrated via the Multi-Scale Integrated Cell
    (MuSIC) software pipeline, which integrates localization and interaction
    data using self-supervised embedding approaches from deep learning,
    followed by algorithmic community detection at multiple resolutions to
    produce a hierarchy of protein assemblies (a cell map).
  source_caveats: >-
    Described in the May 2024 preprint; it applies to the cell maps, which the
    June 2026 release states are not included in that release.
- name: Embedding generation
  description: >-
    Downloaded PPI networks are processed with the node2vec deep learning model
    to produce a PPI embedding for each protein, and IF images are processed
    with a Human Protein Atlas deep learning model to produce an image
    embedding that carries protein localization information.
- name: Co-embedding
  description: >-
    The PPI and image embeddings are integrated with contrastive deep learning
    into a co-embedding for each protein.
- name: Community detection and hierarchy creation
  description: >-
    Community detection is performed on the all-by-all similarities of protein
    pairs in the co-embedding space, and the resulting hierarchy of protein
    communities is output as the cell map.
labeling_strategies:
- description: >-
    Cell maps are annotated in two ways: assemblies are aligned to known
    protein function and pathway resources, including the Gene Ontology and
    Reactome, to find assemblies with high overlap with known cell biology;
    and assemblies are named with a large language model approach that assigns
    a name and a name confidence score to each set of proteins.
  source_caveats: >-
    Described in the May 2024 preprint as the hierarchy-evaluation step of the
    MuSIC pipeline; computed cell maps are not included in the June 2026
    release.
