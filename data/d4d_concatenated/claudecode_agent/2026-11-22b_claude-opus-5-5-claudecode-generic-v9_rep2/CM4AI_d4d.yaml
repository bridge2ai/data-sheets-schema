id: https://cm4ai.org/
name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI)
page: https://cm4ai.org/data-releases/
description: >-
  The CM4AI dataset is the series of quarterly data releases produced by Cell
  Maps for Artificial Intelligence (CM4AI), the Functional Genomics Grand
  Challenge data generation project of the NIH Bridge2AI program. CM4AI is
  generating multi-modal data, including protein-protein interaction (PPI),
  spatial localization and genetic perturbation data, in MDA-MB-468 breast
  cancer cells (with or without paclitaxel or vorinostat) and in induced
  pluripotent stem cells (with or without differentiation). The releases are
  deposited in the University of Virginia Dataverse; the current release
  (June 2026, doi:10.18130/V3/HIGT4C) includes Perturb-seq, SEC-MS, AP-MS and
  immunofluorescence (IF) image data. The Dataverse release records list the
  production locations as University of California San Diego, University of
  California San Francisco, Stanford University and University of Virginia,
  and the project website describes CM4AI as a collaboration of UCSD, UCSF,
  Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University and
  the Hastings Center. The project website reports a data volume of 21.4 TB.
  The May 2024 preprint describing the project states that its Data Module
  had completed parallel maps of protein-protein interactions, protein
  subcellular distributions and transcriptional states for a near-comprehensive
  set of chromatin regulators in breast cancer cells.
