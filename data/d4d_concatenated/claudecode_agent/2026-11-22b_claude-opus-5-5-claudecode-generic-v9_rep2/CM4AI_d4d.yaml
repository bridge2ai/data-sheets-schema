source_caveats: >-
  Referent: the CM4AI dataset as a series of Dataverse releases; the four
  captured releases are recorded under resources, and the current-state slots
  (governance, limitations, intended uses, creators) follow the June 2026
  release page. The May 2024 preprint describes the project as it stood then,
  and its statements are qualified as such. The RO-Crate packaging recorded in
  conforms_to is stated by the 2024 preprint and the March 2025 release
  description, and the June 2025 release lists RO-Crate metadata files; the
  June 2026 release page does not state its packaging format. Image counts differ by source and
  release (563 proteins in the March 2025 IF files, 464 in the June and
  October 2025 IF files, 523 proteins for TNBC IF images on the data-releases
  page); these describe different releases or summaries and are not
  reconciled here. The data-releases page lists UT Austin among the
  collaborating institutions while the March 2025 release description omits
  it. The project website and the Dataverse collection both carry a notice
  that they are under review for potential modification in compliance with
  Administration directives. The bundle also contains a Nature article on a
  U2OS cell map; no CM4AI release page or project page links that article to
  this dataset, so none of its facts are recorded here.
