purposes:
- description: >-
    The project's overarching mission is to produce ethical, AI-ready datasets
    of cell architecture, inferred from multimodal data collected for human
    cell lines, to enable transformative biomedical AI research.
- description: >-
    CM4AI states that it will deliver machine-readable hierarchical maps of
    cell architecture as AI-ready data, produced from multimodal interrogation
    of chromatin modifiers, metabolic enzymes and other proteins involved in
    cancer, neuropsychiatric and cardiac disorders, together with quarterly
    data releases of the map-input data streams.
- description: >-
    The CM4AI data generation project seeks to map the spatiotemporal
    architecture of human cells and use these maps toward the grand challenge
    of interpretable genotype-phenotype learning.
addressing_gaps:
- description: >-
    In genomics and precision medicine, machine learning models are often
    "black boxes" that predict phenotypes from genotypes without explaining the
    mechanisms by which that translation occurs. The NIH RePORTER project
    description states that the project will address this by creating a
    library of large-scale maps of cellular structure and function to
    stimulate research on "visible" machine learning systems.
intended_uses:
- description: AI-ready datasets to support research in functional genomics.
- description: AI model training.
- description: Cellular process analysis.
- description: >-
    Study of cell architectural changes and interactions in the presence of
    specific disease processes, treatment conditions or genetic perturbations.
- description: >-
    Creation of "visible" machine learning systems that are built directly on
    knowledge maps of cell and tissue architecture rather than being black
    boxes.
  source_caveats: >-
    Stated as the aim of the generated resource on the NIH RePORTER page for
    award OT2OD032742; the other intended uses are listed under "Intended Use"
    on the June 2026 release page.
prohibited_uses:
- description: >-
    These laboratory data are not to be used in clinical decision-making or in
    any context involving patient care without appropriate regulatory
    oversight and approval.
known_limitations:
- limitation_description: >-
    Some datasets are under temporary pre-publication embargo; the June 2026
    release page lists the Perturb-seq data in undifferentiated KOLF2.1J iPSCs
    and in MDA-MB-468 breast cancer cells (with or without treatment) as
    embargoed external data links.
- limitation_description: >-
    The protein-protein interaction (SEC-MS), protein localization (IF
    imaging) and CRISPRi Perturb-seq data interrogate sets of proteins that
    incompletely overlap.
- limitation_description: >-
    Computed (predicted) cell maps are not included in the current release;
    the release page states they will be added in future releases.
- limitation_description: The June 2026 release is an interim release.
- limitation_description: >-
    The current release is most suitable for bioinformatics analysis of the
    individual datasets.
- limitation_description: Meaningful analysis requires domain expertise.
known_biases:
- bias_description: >-
    Data in the release were derived from commercially available de-identified
    human cell lines.
- bias_description: >-
    The data do not represent all biological variants that may be seen in the
    population at large.
subpopulations:
- identification: >-
    MDA-MB-468 breast cancer cells, untreated (DMSO control) or treated with
    vorinostat or paclitaxel. The 2024 preprint identifies MDA-MB-468
    (RRID:CVCL_0419) as a triple-negative breast cancer cell line established
    from a metastatic-site pleural effusion of a 51-year-old Black female with
    metastatic mammary adenocarcinoma, available from ATCC.
  distribution: >-
    The data-releases page lists curated datasets for TNBC cells under
    untreated (DMSO control), vorinostat and paclitaxel conditions that include
    SEC-MS capturing about 7,000 proteins, IF images for 523 proteins and
    Perturb-seq of 200 genes, and marks AP-MS interactomes as "coming soon";
    the June 2026 release includes AP-MS data for treated MDA-MB-468 cells.
  source_caveats: >-
    The data-releases page calls these cells "TNBC cells"; the link to
    MDA-MB-468 rests on the 2024 preprint, which identifies CM4AI's breast
    cancer line MDA-MB-468 as triple-negative, and on the release pages, which
    describe the same treatment conditions for MDA-MB-468 cells.
- identification: >-
    KOLF2.1J induced pluripotent stem cells, undifferentiated (parental) and
    iPSC-derived neural progenitor cells (NPCs), neurons and cardiomyocytes.
    The 2024 preprint identifies KOLF2.1J (RRID:CVCL_B5P3) as an iPSC line
    derived from a healthy male Northern European donor, available from the
    Human Induced Pluripotent Stem Cells Initiative (HipSci) resource.
  distribution: >-
    The data-releases page lists a curated dataset for these cells that
    includes Perturb-seq of more than 11,000 genes (whole genome) and SEC-MS
    capturing about 7,000 proteins, with IF images marked "coming soon".
