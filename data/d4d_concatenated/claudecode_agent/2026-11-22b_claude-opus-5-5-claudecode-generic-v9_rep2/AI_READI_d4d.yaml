- name: Topcon CL-200 computerized Lensometer
  mechanism_details: Lensometer device used at data acquisition sites.
- name: Topcon CL-300 computerized Lensometer
  mechanism_details: Lensometer device used at data acquisition sites.
data_collectors:
- name: Site research personnel
  collector_details: >-
    Research personnel at the three data sites recruited, enrolled and collected
    data after training by the data manager at UAB and certification; clinical
    research coordinators contacted and consented participants and conducted
    study visits including collection of ophthalmologic images.
- id: ROR:008s83205
  name: University of Alabama at Birmingham
  role: Data collection site
- id: ROR:0168r3w48
  name: University of California, San Diego
  role: Data collection site
- id: ROR:00cvxb145
  name: University of Washington
  role: Data collection site
raw_data_sources:
- source_description: ECG data exported from the device in raw format to local storage.
  raw_data_format: .xml
- source_description: >-
    MoCA Duo application output (total score, section subscores, Memory Index
    Score and task completion times) exported in raw format to local storage.
  raw_data_format: .csv
- source_description: Blood and urine testing results provided by the NORC laboratory.
  raw_data_format: .csv
raw_sources:
- name: Retained raw data
  raw_data_details: >-
    The raw data is saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but is not anticipated to be shared
    outside the project team, because it has not been mapped to standardized
    terminologies and may accidentally include personal health information or
    personally identifiable information.
preprocessing_strategies:
- name: Conversion to DICOM
  preprocessing_details: >-
    Images are exported from imaging devices in their raw format, and some images
    required conversion to the DICOM standard format before upload; DICOM is used
    for retinal imaging.
- name: Mapping to OMOP CDM
  preprocessing_details: >-
    All data were mapped to standardized terminologies when possible, such as
    the Observational Medical Outcomes Partnership (OMOP) Common Data Model for
    clinical data.
cleaning_strategies:
- name: Site data manager quality control
  cleaning_details: >-
    The Data Manager at each data site is responsible for quality control of all
    data before uploading to FAIRhub.
- name: REDCap range checks and edits
  cleaning_details: >-
    Clinical data outside expected min/max ranges were flagged in REDCap reports
    viewed by clinical research coordinators and Data Managers, who examined
    records and edited errors (credibility range checks, skip-pattern flow,
    missing data fillable from other portions of a record, omitted or duplicated
    records) under the guidance and approval of the site PI.
- name: Internal review
  cleaning_details: >-
    The dataset has been reviewed internally by AI-READI team members for quality
    checks and to ensure that no personally identifiable information was
    accidentally included.
ethical_reviews:
- name: University of Washington IRB approval STUDY00016228
  reviewing_organization: University of Washington Institutional Review Board
  review_details: >-
    AI-READI was approved by the University of Washington IRB (approval number
    STUDY00016228), including reliance agreements with the IRBs of the University
    of Alabama at Birmingham and the University of California, San Diego. The
    initial approval was received on December 20, 2022, and an annual renewal
    application is required.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - University of Washington IRB, approval number STUDY00016228
  notes: Human subject review status in the study description is "Submitted, approved".
informed_consent:
- name: Informed consent
  consent_obtained: true
  consent_type: Written informed consent, electronic (e-consent with electronic signature) or in person
  consent_documentation: >-
    Consent documentation is available electronically in REDCap; electronic
    signatures are collected through UW ITHS REDCap per the IRB protocol. Other
    clinical sites relied on the University of Washington IRB and used the same
    consent form with minor institution-specific language.
  withdrawal_mechanism: >-
    Participants may withdraw consent at any time and cease study participation;
    data already shared or used up to that point stays in the dataset.
collection_consents:
- name: Electronic consent process
  consent_details: >-
    For most participants, informed consent is performed remotely by computer,
    tablet or smart phone through a link in the invitation letter or email to
    REDCap, where participants may read all consent documentation before the
    visit; otherwise consent is performed in person at the start of the visit.
consent_revocations:
- name: Withdrawal of consent
  revocation_details: >-
    Participants were permitted to withdraw consent at any time and cease study
    participation; however, any data that had been shared or used up to that
    point would stay in the dataset. Per the IRB protocol, subjects cannot
    withdraw their data from secondary use, banking or sharing.
collection_notifications:
- name: Active data collection
  notification_details: >-
    Each individual was aware of the data collection, as this was active data
    collection directly from participants rather than passive collection or
    secondary use of existing data.
participant_compensation:
- name: Study visit stipend
  compensation_provided: true
  compensation_amount: $200
  compensation_type: Stipend for the study visit, paid through the grant funding
  description: >-
    Per the IRB protocol, the stipend is provided after the final data and study
    devices are returned, and the study covers reasonable costs for parking,
    public transit or rideshare related to the study visit.
participant_privacy:
- name: Privacy-preserving device selection
  privacy_techniques: >-
    The environmental sensor and fitness tracker were chosen with participant
    privacy as a primary concern: they do not capture video or audio, are not
    equipped with GPS location monitoring, and are not synced with
    participant-owned devices.
- name: Data watermarking
  privacy_techniques: >-
    Data may be statically watermarked to identify the licensee; the Nature
    Metabolism commentary describes implementing a data dissemination system, a
    strict license agreement and data watermarking to prevent reidentification
    attempts.
- name: Secure study data storage
  privacy_techniques: >-
    Per the IRB protocol, study data and identifiable information are kept on
    encrypted servers or in locked cabinets or rooms with restricted access at
    all sites.
is_deidentified:
  identifiable_elements_present: false
  method: >-
    No active de-identification (FAIRhub de-identification type
    "NoDeIdentification"): no identifiers were collected, so no active
    de-identification was necessary, and the data were checked for identifiable
    data per US HIPAA.
  deidentification_details: >-
    The data contain no protected health information (PHI); information related
    to participants' sex and race/ethnicity and medication used has been removed
    from this dataset.
  source_caveats: >-
    The Nature Metabolism commentary states that the public set is stripped of
    PHI as defined by the HIPAA Privacy Rule via the Safe Harbor method; the
    FAIRhub structured metadata (preferred, source tier 1) gives the
    de-identification type NoDeIdentification and describes no active
    de-identification, while setting its deIdentDirect and deIdentHIPAA fields to
    true; the sources do not define those fields.
sensitive_elements:
- name: Sensitive data withheld from the public release
  sensitivity_details: >-
    The data held under controlled access include 5-digit zip code, sex, race,
    ethnicity, genetic sequencing data, past health records, medications, and
    traffic and accident reports; the controlled-access dataset contains data on
    racial and ethnic origins, location (5-digit zip code) and motor vehicle
    accident reports. Sex, race/ethnicity and medication information has been
    removed from this public dataset.
third_party_sharing:
- name: Public dataset
  is_shared: true
  description: >-
    Data not considered sensitive personal health data are available to the
    public for download upon agreement with a license that defines how the data
    can be used, through the FAIRhub platform.
distribution_formats:
- name: DICOM
  media_type: application/dicom
- name: Markdown
  media_type: text/markdown
- name: CSV
  media_type: text/csv
- name: JSON
  media_type: application/json
data_governance:
  access_review_process: >-
    Accessing the dataset requires logging in through a verified ID system,
    agreeing to use the data only for type 2 diabetes related research, and
    agreeing to the license terms, which set restrictions and obligations for
    data usage.
license_and_use_terms:
  data_use_permission:
  - disease_specific_research
  license_terms: >-
    AI-READI Data License Agreement (Version 2.0), with Washington University in
    St. Louis as Licensor. It grants a non-exclusive and non-transferable license
    to download, reproduce and use the Data and create derivative works for
    research, commercial and non-commercial purposes, with strong requirements
    on data usage, security and secondary sharing to protect study participants.
    Licensees must acknowledge the Licensor, the source and any funder of the
    Data in papers reporting use of the Data, and comply with NIH Genomic Data
    Sharing Policy security standards; the Agreement terminates automatically on
    breach, after which all copies must be deleted.
  source_caveats: >-
    The FAIRhub consent metadata states the public version can only be used for
    type 2 diabetes related research (a private version allows more generic
    use), and access requires agreeing to that restriction, while the license
    text grants use for research, commercial and non-commercial purposes; both
    are recorded.
prohibited_uses:
- name: Clinical treatment decisions
  description: Licensees shall not make clinical treatment decisions based on the Data.
  prohibition_reason: The Data is intended solely as a research resource.
- name: Re-identification or harm to data subjects
  description: >-
    Licensees shall not use the Data to compromise confidentiality or privacy of
    data subjects, identify or contact any data subject, extract identifying
    information, establish a data subject's membership in a group, or cause harm
    to any data subject.
- name: Sharing with third-party model vendors for training
  description: >-
    Licensees shall not share or distribute Data with any third-party model
    vendor or developer for training or development purposes; short-term
    interaction with a model vendor under a BAA is permitted.
- name: Reproduction of data in publications
  description: >-
    Data may not be reproduced in papers except small representative samples in
    up to five images or figures per paper for illustrative purposes; larger
    amounts may not be published via supplemental files, archives or code
    packages.
- name: Transfer to non-licensees
  description: >-
    Licensees shall not transfer, license, sublicense, sell, assign, display,
    share or otherwise convey any portion of the Data or derivative work to any
    third party other than another licensee bound by identical terms.
ip_restrictions:
  restrictions:
  - >-
    Title to the Data and all industrial and intellectual property rights
    therein remain solely and exclusively with the Licensor and its suppliers.
regulatory_restrictions:
  regulatory_restrictions:
  - >-
    Data may be stored only on servers and devices within the licensee's
    institution or on cloud or remote storage services with a HIPAA-approved
    Business Associate Agreement in place with the institution.
  - >-
    Licensees must comply with the data security and privacy standards
    established by the NIH under its Genomic Data Sharing (GDS) Policy.
future_use_impacts:
- name: Theoretical re-identification risk
  impact_details: >-
    The dataset creators do not currently anticipate uses that could result in
    unfair treatment or harm, but there is a theoretical risk of future
    re-identification.
