description: >-
  Version 3.0.0 of the AI-READI dataset, published on the FAIRhub platform as
  "Flagship Dataset of Type 2 Diabetes from the AI-READI Project". The AI-READI
  project seeks to create and share a flagship ethically sourced dataset of type
  2 diabetes. The dataset consists of data collected from individuals with and
  without type 2 diabetes mellitus (T2DM) and harmonized across 3 data collection
  sites; its composition was designed for future AI/machine learning studies,
  with recruitment sampling aimed at an approximately equal distribution of
  participants across sex, race and diabetes severity, and a data acquisition
  protocol spanning multiple domains (survey data, physical measurements,
  clinical data, imaging data, wearable device data). This version contains data
  from 2280 participants collected between July 19, 2023 and May 1, 2025. The
  modalities encompass tabular data, imaging data and physiological
  signal/waveform data; there is no unstructured text data. The dataset contains
  356,343 files and is around 3.82 TB in size, organized following the Clinical
  Dataset Structure (CDS) v0.1.1, with one directory per datatype at the root
  level, then one folder per modality, per device and per participant.
