purposes:
- name: Understand salutogenesis in type 2 diabetes
  description: >-
    The goal is to better understand salutogenesis (the pathway from disease to
    health) in T2DM, facilitating the use of artificial intelligence and machine
    learning (AI/ML) approaches to study it.
- name: Collect and share an AI-ready multimodal dataset
  description: >-
    The primary goal of the AI-READI project is to collect and publicly share a
    multimodal, AI-ready dataset for studying the pathogenesis and salutogenesis
    of T2DM.
- name: Enable future AI/ML research on type 2 diabetes
  description: >-
    The dataset was created to enable future generations of AI/ML research to
    provide critical insights into T2DM, including salutogenic pathways to
    return to health.
addressing_gaps:
- name: Lack of diverse, AI-ready data for training AI models
  description: >-
    A key issue for AI-based approaches to T2DM is the lack of diverse data ready
    for training AI models; the dataset is intended to fill this gap, and its
    cohort design addresses inherent limitations of many existing large datasets
    for AI/ML training.
- name: Lack of large, high-quality multimodal datasets
  description: >-
    The ability to understand and affect the course of complex, multi-organ
    diseases such as T2DM has been limited by a lack of well-designed, high
    quality and large multimodal datasets.
- name: Analyses not feasible with claims or EHR data
  description: >-
    The multi-domain acquisition protocol is intended to enable downstream AI/ML
    analyses that may not be feasible with existing data sources such as claims
    or electronic health records data.
tasks:
- name: Pseudotime manifold analysis
  description: >-
    Data collection was designed to permit downstream pseudotime manifold
    analysis, an approach used to predict disease trajectories from multimodal
    data collected from participants with differing disease severity, and to
    facilitate various applications in artificial intelligence.
