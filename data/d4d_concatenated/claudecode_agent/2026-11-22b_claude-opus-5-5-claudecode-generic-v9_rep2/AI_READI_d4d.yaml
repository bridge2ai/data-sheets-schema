source_caveats: >-
  Sources disagree or differ on several points. (1) The project name is expanded
  as "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights" in
  the BMJ Open and Nature Metabolism papers and as "Artificial Intelligence Ready
  and Exploratory Atlas for Diabetes Insights" in NIH RePORTER, the FAIRhub
  healthsheet, README and study description, and the IRB protocol. (2) The BMJ
  Open paper dates the start of pilot enrollment to July 18, 2023, while the
  FAIRhub metadata dates the start of collection to July 19, 2023; both are
  recorded. (3) The license is named "AI-READI custom license v2.0" in the
  FAIRhub rights metadata, "Health Data License" on the FAIRhub page and
  "AI-READI DATA LICENSE AGREEMENT (Version 2.0)" in the license text; the rights
  URI (DOI 10.5281/zenodo.17555036) matches the license document's source, so
  these are treated as one license. (4) The standard is named "Clinical Dataset
  Structure (CDS) v0.1.1" in the README and "Clinical Data Structure (CDS)
  v0.1.1" in the structure metadata. (5) Planned enrollment is 4,000 in the BMJ
  Open paper and the study description and 4,600 in the IRB protocol; both are
  plans, not facts about this release. (6) The BMJ Open paper gives
  STUDY00016228 as a "Clinicaltrials.org approval number", which is the
  University of Washington IRB approval number; the study description gives
  ClinicalTrials.gov identifier NCT06002048. Statements of absence from the
  healthsheet: the dataset has not undergone any formal external audit; no data
  protection impact analysis has been conducted; no labels are provided; the
  dataset had not been used for any tasks; there is no repository linking uses;
  no retention limits apply; there is no mechanism for others to extend the
  dataset; and the healthsheet states the dataset contains no confidential data
  and nothing offensive. Controlled-access data (5-digit zip code, sex, race,
  ethnicity, genetic sequencing data, past health records, medications, traffic
  and accident reports) and the study biorepository are held separately and are
  not part of this public release; the Data Access Committee governs the
  controlled-access sets. Totals check (this record's own arithmetic from the
  per-directory figures in the FAIRhub structure metadata): the nine datatype
  directories' numberOfFiles sum to 356,334, 9 fewer than the stated 356,343
  files, matching the nine root-level metadata files listed; their sizes sum to
  3,815,969,360,064 bytes, 419,614 bytes less than the stated 3,815,969,779,678
  bytes, and the bundle states no size for the root-level files.
collection_mechanisms:
- name: REDCap
  mechanism_details: >-
    Online REDCap interface used for recruitment, electronic consent and
    collection of patient-reported questionnaire data and clinical visit data
    (medications, vitals, visual acuity, contrast sensitivity, monofilament and
    CBC results).
- name: Study questionnaires
  mechanism_details: >-
    Questionnaires including screening, demographics, CES-D-10, PAID-5, diabetes
    self-care, diet, smoking/alcohol/vaping/marijuana use, general health,
    ophthalmic survey, current medications, and social determinants of health
    surveys (PhenX selection).
- name: Philips PageWriter TC30 Cardiograph
  mechanism_details: 12-lead ECG collected with the Philips PageWriter TC30 device.
- name: Monofilament test
  mechanism_details: >-
    Peripheral neuropathy test using a standard 10 g monofilament on the plantar
    surface of both feet.
- name: Montreal Cognitive Assessment (MoCA Duo app)
  mechanism_details: Cognitive screener administered electronically on an iPad using the MoCA Duo application.
- name: M&S Technologies EVA
  mechanism_details: Electronic Visual Acuity tester used to test photopic and mesopic visual acuity.
- name: MARS Letter Contrast Sensitivity test (Perceptrix)
  mechanism_details: Contrast sensitivity measured monocularly under photopic and mesopic conditions.
- name: Topcon KR 800 Auto Keratometer/Refractor
  mechanism_details: Autorefraction for each eye.
- name: Blood and urine specimen collection and laboratory testing
  mechanism_details: >-
    Non-fasting blood (53 mL) and urine collected at the visit; CBC tested at
    local CLIA-certified laboratories and other tests performed by the University
    of Washington Nutrition and Obesity Research Center testing facility.
- name: LeeLab Anura environmental sensor
  mechanism_details: >-
    Custom-designed home environmental sensor (Karalis Johnson Retina Center,
    University of Washington) used for 10 continuous days.
- name: Garmin Vivosmart 5
  mechanism_details: Wrist-worn fitness activity tracker used for 10 days.
- name: Dexcom G6 continuous glucose monitor
  mechanism_details: Real-time integrated continuous glucose monitoring system worn for 10 days.
- name: iCare EIDON
  mechanism_details: Widefield TrueColor confocal fundus imaging system (manufactured by iCare).
- name: Heidelberg Spectralis HRA+OCT
  mechanism_details: Ophthalmic imaging system combining OCT with retinal angiography (manufactured by Heidelberg).
- name: Topcon Maestro2
  mechanism_details: Robotic OCT and color fundus camera system (manufactured by Topcon).
- name: Topcon Triton DRI OCT
  mechanism_details: Swept-source OCT with multimodal fundus imaging (manufactured by Topcon).
- name: Zeiss Cirrus 5000 Angioplex
  mechanism_details: High-definition OCT system for imaging retinal microvasculature (manufactured by Zeiss).
- name: Heidelberg FLIO
  mechanism_details: Fluorescence lifetime imaging ophthalmoscopy.
- name: Optomed Aurora IQ
  mechanism_details: Handheld non-mydriatic fundus camera (manufactured by Optomed).
- name: OMRON HEM 907XL Blood Pressure Monitor
  mechanism_details: Blood pressure device used at data acquisition sites.
- name: Medline MDS4001 Automatic Digital Blood Pressure Monitor
  mechanism_details: Blood pressure device used at data acquisition sites.
- name: Welch Allyn 6000 series Vital signs monitor
  mechanism_details: With Welch Allyn FlexiPort Reusable Blood Pressure Cuff; blood pressure device used at data acquisition sites.
- name: NIDEK LM-600P Auto Lensometer
