subpopulations:
- name: Diabetes status study groups
  identification: >-
    Participants belong to one of four study groups: Healthy (no type 1 or type 2
    diabetes); Pre-diabetes/Lifestyle Controlled; Oral Medication and/or
    Non-insulin-injectable Medication Controlled; and Insulin Dependent.
relationships:
- name: Single project, single visit
  relationship_details: >-
    All instances are part of the same prospective data generation project
    (AI-READI); there is currently only one visit per participant.
splits:
- name: Recommended train/validation/test split
  description: >-
    Because sex, race and ethnicity data are not released with the public
    version, the project team prepared data splits in 70%/15%/15% proportions for
    training/validation/testing, with the validation and test sets balanced as
    well as possible for sex, race/ethnicity and diabetes status.
  split_details: >-
    The suggested split is included in the participants.tsv file. The README
    summary table gives 1576 participants in train, 352 in validation and 352 in
    test, for a total of 2280.
missing_data_documentation:
- name: Modality-level missingness
  missing_data_patterns: >-
    Not all modalities are available for all participants; some participants
    elected not to participate in some study elements.
  missing_data_causes: >-
    In a few cases the data collection device did not have any stored results or
    was returned too late to retrieve the results (e.g. battery died, data was
    lost), and in a few cases a data collision may have occurred at some point in
    the process with data lost.
anomalies:
- name: Survey nonresponse
  anomaly_details: In survey data, skipped questions or incomplete responses are expected.
- name: Wearable device failures
  anomaly_details: >-
    For wearables, improper use and technical failure such as battery failure or
    system malfunction are expected.
- name: Imaging noise and failures
  anomaly_details: >-
    For imaging data, patient uncooperation, noise that may obscure the images,
    technical failure such as system malfunction, and data transfer failures are
    expected.
- name: Variable handheld fundus image quality
  anomaly_details: >-
    Undilated images from the handheld Optomed Aurora camera vary in quality from
    patient to patient and within the same patient.
- name: Spectralis operator-dependent quality
  anomaly_details: >-
    As the Spectralis is operated by the imaging team and is not fully automated,
    quality issues may arise, which may lead to skipping this modality and
    missing data.
- name: FLIO patient compliance
  anomaly_details: >-
    FLIO is performed as the last modality of the visit because it takes longer
    and exposes patients to uncomfortable levels of light, so patients may not be
    at their best possible compliance.
known_biases:
- name: Volunteer bias
  bias_type: selection_bias
  bias_description: >-
    Participants are volunteers; there is selection bias known as volunteer bias,
    which may limit the generalizability of results among those not represented
    in the study population.
known_limitations:
- name: English-language eligibility requirement
  limitation_description: >-
    Participants were required to speak, read and understand English;
    non-English-speaking participants were not initially enrolled, which may have
    created challenges in recruiting Hispanic and/or Asian persons.
- name: Releases may not be balanced
  limitation_description: >-
    As enrollment is ongoing, the pilot data release and periodic updates to data
    releases may not have achieved balanced distribution across groups.
- name: Urban, hospital-based recruitment
  limitation_description: >-
    Recruitment was predominantly urban and hospital-based, which may not fully
    capture diverse cultural and socioeconomic backgrounds.
- name: Races/ethnicities not included
  limitation_description: >-
    The cohort does not include other races/ethnicities such as Pacific Islanders
    and Native Americans, so it may not provide a comprehensive representation of
    the population.
sampling_strategies:
- name: Triple-balanced recruitment design
  strategies: >-
    Rather than targeting the demographic distribution of the US population, the
    study is triple-balanced by recruiting in equal proportions four race/ethnic
    groups (Asian, Black, White, Hispanic), four categories of T2DM status (no
    diabetes; pre-diabetes/lifestyle-controlled; oral or non-insulin-injectable
    medication controlled; insulin controlled) and biological males and females,
    with recruitment sampling aimed at approximately equal distribution across
    diabetes severity. The investigators aim to recruit approximately 1000
    patients into each of the four groups.
  is_random: false
  why_not_representative: >-
    The design intentionally balances groups rather than mirroring the
    demographic distribution of the US population.
- name: Eligibility criteria
  strategies: >-
    Inclusion: able to provide consent, 40 years or older, persons with or
    without type 2 diabetes, able to speak and read English. Exclusion:
    pregnancy, gestational diabetes, type 1 diabetes; the study description and
    IRB protocol also exclude adults older than 85.
- name: EHR-based recruitment in waves
  strategies: >-
    The study base is patients aged 40 or older with a medical encounter at a
    site health system (UAB, UCSD, UW). Recruitment pools are identified by
    screening electronic health records for diabetes and prediabetes ICD-10
    codes, and participants are recruited in waves; as recruitment progresses the
    composition of participants is monitored for diversity and inclusion and
    adjusted by under- and oversampling groups as needed. The IRB protocol describes
    UAB selecting a stratified sample of potential participants based on the
    sampling scheme.
- name: Instance coverage
  is_sample: false
  strategies: >-
    The healthsheet states that the dataset contains all possible instances,
    i.e. data from all participants enrolled.
  source_caveats: >-
    The healthsheet's composition answer says "all participants who have been
    enrolled during the first year of data collection", while its versioning
    answer says this version covers data collected through the end of the second
    year (July 19, 2023 to May 1, 2025); the "first year" wording appears to be
    carried over from an earlier version.
