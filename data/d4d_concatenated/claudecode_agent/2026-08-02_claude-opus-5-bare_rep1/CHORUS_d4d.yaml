id: https://chorus4ai.org/
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution, controlled-access dataset of acute and
  critical care hospitalizations, generated by the CHoRUS data generation project, one of four
  data generation projects in the NIH Common Fund Bridge2AI consortium (award OT2OD032701).
  The dataset is assembled retrospectively from 14 data-contributing hospitals within a network
  of 20 academic centers and is intended to support machine learning and artificial intelligence
  applications that characterize acute and critical care illness, predict complications, and
  measure treatment response. Data modalities include structured electronic health record data
  standardized to the OMOP Common Data Model (demographics, diagnoses, procedures, medication
  administration, nursing flowsheets), tokenized unstructured clinical notes, imaging from PACS,
  bedside telemetry waveforms, EEG waveforms, and social determinants of health with contextual
  factors such as geographic distance to the nearest hospital. As of August 2025 the dataset
  covered 14 hospitals with over 45,000 unique admissions; the released dataset described on the
  project website comprises 50,000 patient admissions from ICU, PICU, and NICU settings,
  1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform
  data. The anticipated final dataset covers 100,000 patient admissions across 9 data modalities
  from 14 contributing hospitals. A holdout test set is sequestered for external model validation.
page: https://chorus4ai.org/
status: >-
  Under active development with partial controlled-access release; imaging de-identification and
  EEG extraction were in process as of August 2025. The project website carries the notice:
  "This repoitory is under review for potential modification in compliance with Administration
  directives."
conforms_to: "OMOP Common Data Model (OHDSI), with modality-specific standards OHNLP, DICOM, WFDB, and EDF+/Persyst"
conforms_to_schema: "OMOP Common Data Model (OHDSI)"
was_derived_from: >-
  Electronic health record systems, PACS imaging archives, bedside monitor telemetry
  gateway/middleware, and hospital EEG databases of the 14 CHoRUS data acquisition centers.
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - artificial intelligence
  - machine learning
  - Bridge2AI
  - multimodal data
  - controlled access

creators:
  - name: Eric S. Rosenthal
    description: >-
      Principal investigator of the CHoRUS project (NIH application 10472824, project number
      1OT2OD032701-01), Massachusetts General Hospital; member of the Bridge2AI CHoRUS
      leadership team.
  - name: Azra Bihorac
    description: Member of the Bridge2AI CHoRUS leadership team, University of Florida.
  - name: Xiaoqian Jiang
    description: Member of the Bridge2AI CHoRUS leadership team, UTHealth Houston.
  - name: Yulia Strekalova
    description: Member of the Bridge2AI CHoRUS leadership team, University of Florida.
  - name: Parisa Rashidi
    description: Member of the Bridge2AI CHoRUS leadership team, University of Florida.
  - name: Manlik Kwong
    description: Member of the Bridge2AI CHoRUS leadership team, Tufts University.
  - name: CHoRUS Consortium
    description: >-
      More than 60 CHoRUS consortium members across 20 different institutions, spanning team
      science, law, ethics, health services, biomedical science, engineering, and scientific
      publishing, 14 of which contribute as data acquisition centers.

funders:
  - name: NIH Common Fund Bridge2AI program
    description: >-
      Funded by the National Institutes of Health under award number OT2OD032701 (project number
      1OT2OD032701-01, application ID 10472824), as part of the NIH Common Fund Bridge2AI program.
      Fiscal year 2022 award amount 5,880,300 USD, with a project period of 2022-09-01 to
      2026-11-30. The awardee organization is Massachusetts General Hospital.

purposes:
  - name: Generate an AI-ready critical care dataset
    description: >-
      To meet the need for infrastructure supporting AI/ML in critical care by generating a
      publicly available, AI-ready, high-resolution multi-center dataset from more than 100,000
      critically ill patients, aimed at characterizing acute and critical care illness,
      predicting complications, and measuring treatment response.
  - name: Provision a sequestered holdout test set
    description: >-
      To provision a holdout test set accessible for external validation of models, in order to
      aid marketplace adoption of AI-developed models for implementation in acute and critical
      care.
  - name: Ensure privacy, accountability, and clinical benefit
    description: >-
      To ensure that the methods used to build the dataset promote privacy, accountability, and
      clinical benefit, including establishing a legal framework for collecting data at scale and
      determining, through community-facing ethics focus groups, what data is appropriate for
      public sharing.
  - name: Develop standards, tools, and workforce for clinical care AI
    description: >-
      To develop the network, tools, standards, and education needed to build ML/AI-derived
      models improving care and outcomes of patients requiring critical care, and to cultivate a
      new generation of AI clinicians and scientists through multimodal educational approaches.

tasks:
  - name: Characterization of acute and critical care illness
    description: >-
      Machine learning and AI applications aimed at characterizing acute and critical care
      illness among patients with acute or critical illness.
  - name: Prediction of complications and deterioration
    description: >-
      Development of predictive models for complications and clinical deterioration in acute and
      critical care patients.
  - name: Measurement of treatment response
    description: >-
      Analysis and modeling of treatment response among patients with acute or critical illness.
  - name: External validation of AI models
    description: >-
      Use of a sequestered holdout test set for external validation of models developed elsewhere,
      supporting adoption of AI models in acute and critical care.
  - name: Data labeling for prediction targets
    description: >-
      Labeling of data with targets important for prediction using a visualization and annotation
      environment developed by the project.

addressing_gaps:
  - name: Lack of infrastructure for AI/ML in critical care
    description: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning in critical care; CHoRUS builds the network, tools, standards, and data required.
  - name: Absence of high-resolution multi-center critical care datasets
    description: >-
      Developing high-resolution multi-center data sets is described as a critical first step
      towards actionable and trustworthy AI; CHoRUS acquires and standardizes a dataset of
      unprecedented diversity and high resolution across 14 hospitals.
  - name: No sequestered holdout data for external model validation
    description: >-
      Existing resources do not provide sequestered holdout datasets for external validation of
      clinical AI models; CHoRUS sequesters a holdout test set for this purpose.
  - name: Need for ethically sourced clinical AI data
    description: >-
      CHoRUS addresses the need for ethically sourced datasets and best practices for AI in
      health, including legal and ethical approaches to managing privacy and bias and accounting
      for social determinants of health.

intended_uses:
  - name: Development of clinical AI/ML models for acute and critical care
    description: >-
      Building ML and AI-derived models to improve the care and outcomes of patients requiring
      critical care, including characterization, prediction, and treatment response models.
  - name: External validation of externally developed models
    description: >-
      Use of the sequestered holdout test set to externally validate AI models prior to
      implementation in acute and critical care settings.
  - name: Hands-on AI/ML training and education
    description: >-
      Use in structured training, such as the AIM-AHEAD Bridge2AI for Clinical Care Training
      Program, where trainees apply AI/ML methods to big data analysis and develop practical use
      cases on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud.
  - name: Collaborative research on the Bridge2AI clinical care cloud platform
    description: >-
      Collaborative research conducted within the controlled cloud enclave, including
      publications and conference abstracts arising from trainee and consortium projects.

other_tasks:
  - name: Research on social determinants and contextual factors
    description: >-
      Data elements feature contextual factors such as geographic distance to the nearest
      hospital and social determinants of health, supporting health services and equity research
      beyond the primary prediction tasks.

existing_uses:
  - name: Training activities
    description: >-
      As of August 2025, CHoRUS datasets are being used for training activities, including the
      AIM-AHEAD Bridge2AI for Clinical Care Training Program, in which up to 30 trainees per
      cohort access the data through a registration and licensing process and work with it on the
      Bridge2AI AI/ML for Clinical Care Collaborative Cloud.
  - name: Publications
    description: >-
      As of August 2025, CHoRUS datasets are being used for publications.

future_use_impacts:
  - name: Adoption of validated AI models in acute and critical care
    description: >-
      By provisioning a holdout test set for external validation, the dataset is expected to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care,
      and to catalyze patient-focused deployment of AI.
  - name: Residual re-identification risk from richly detailed clinical data
    description: >-
      Because the dataset contains high-resolution multimodal clinical records, re-identification
      is a foreseeable risk; the project transforms data using approaches that limit
      re-identification, tokenizes unstructured EHR content, and keeps all modalities under
      controlled access.

acquisition_methods:
  - name: Retrospective extraction from hospital clinical systems
    description: >-
      Retrospective data collection in which data acquisition centers extract clinical data from
      their operational systems and deliver a CHoRUS-specific data extract, following
      step-by-step standard operating procedures with an interactive workflow diagram and
      dynamic links to validated SOP documents.
  - name: Multi-center capability development for acquisition and standardization
    description: >-
      The project develops capabilities across a multi-center network to acquire, standardize,
      tokenize, store, visualize, and label structured EHR data, tokenized unstructured EHR data,
      telemetry and EEG waveforms, imaging, and social determinants of health.
  - name: Tooling-assisted extract creation and upload
    description: >-
      Contributing sites use CHoRUS-provided tooling, including a repository of tools to create
      and upload a CHoRUS Data Extract, to deliver interoperable datasets into the cloud enclave.

collection_mechanisms:
  - name: Electronic health record documentation
    description: >-
      Provider and nursing documentation captured in hospital EHR systems, including diagnoses
      and procedures documented by providers, high-frequency nursing flowsheet documentation, and
      medication administration recorded with dosing time-stamped upon each infusion change or
      dose administration.
  - name: PACS imaging archive
    description: Imaging obtained from hospital PACS.
  - name: Bedside monitors and gateway/middleware
    description: >-
      Waveform telemetry acquired from bedside monitors via gateway/middleware systems at
      contributing hospitals.
  - name: Hospital EEG database
    description: EEG waveforms extracted from hospital EEG databases.
  - name: OHNLP toolkit for clinical text
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit, with tokens transferred to
      the enclave while full note text remains stored locally at contributing sites.

data_collectors:
  - name: CHoRUS data acquisition centers
    description: >-
      Fourteen data-contributing hospitals, drawn from a collaboration of 20 academic centers,
      perform the extraction and curation of clinical data extracts for CHoRUS.
  - name: Data site managers
    description: >-
      Data managers at contributing sites execute the documented extraction workflow, submit
      extracts, and provide regular status updates on their progress in creating and curating a
      CHoRUS-specific clinical data extract.

direct_collection:
  - name: Indirect, retrospective collection from institutional records
    description: >-
      Data are not collected prospectively from individuals; the dataset is assembled through
      retrospective extraction of existing clinical records, imaging archives, and physiologic
      monitoring streams held by the 14 contributing hospitals.

collection_timeframes:
  - name: Project data generation period
    description: >-
      Data acquisition takes place within the CHoRUS award period of 2022-09-01 to 2026-11-30.
      A dataset snapshot reported in September 2025 states that, as of August 2025, the dataset
      covered 14 different hospitals with over 45,000 unique admissions, with imaging
      de-identification and EEG extraction still in process.

sampling_strategies:
  - name: Sampling for comprehensive coverage of conditions and treatments
    description: >-
      Sampling is designed to ensure comprehensive sets of patient conditions and clinical
      treatment strategies across the participating centers.
  - name: Federated sampling for a balanced and diverse cohort
    description: >-
      Federated access enables sampling methods intended to ensure a balanced and diverse cohort
      across the contributing data acquisition centers.

instances:
  - name: Patient admission
    description: >-
      Each instance is a patient admission to an intensive care setting (ICU, PICU, or NICU) at a
      contributing hospital, with associated multimodal records spanning structured OMOP EHR
      data, tokenized clinical notes, imaging, telemetry waveforms, and EEG where available. The
      released dataset comprises 50,000 such admissions; the anticipated final dataset comprises
      100,000 patient admissions.

subpopulations:
  - name: Intensive care unit (ICU) admissions
    description: >-
      Admissions from ICU settings are included among the 50,000 released patient admissions;
      per-setting counts are not broken out in the released snapshot.
  - name: Pediatric intensive care unit (PICU) admissions
    description: >-
      Admissions from pediatric intensive care units are included among the released patient
      admissions.
  - name: Neonatal intensive care unit (NICU) admissions
    description: >-
      Admissions from neonatal intensive care units are included among the released patient
      admissions.

splits:
  - name: Sequestered holdout test set
    description: >-
      The dataset will also provision a holdout test set, sequestered from the distributed data
      and accessible for external validation of models, to aid marketplace adoption of
      AI-developed models in acute and critical care.

file_collections:
  - id: https://chorus4ai.org/dataset#structured-ehr-omop
    name: Structured EHR data in OMOP Common Data Model
    description: >-
      Structured electronic health record data standardized to the OMOP Common Data Model,
      comprising demographics, diagnoses documented by providers, procedures documented by
      providers, medication administration with dosing time-stamped upon each infusion change or
      dose administration, and high-frequency nursing flowsheet documentation. The current
      released dataset contains 1.6 billion rows of EHR OMOP data. Access is controlled and the
      data are held in the cloud enclave. Published metadata schemas are available (OMOP schema;
      OMOP schema with extensions for nursing flowsheets).
  - id: https://chorus4ai.org/dataset#clinical-notes
    name: Tokenized clinical notes
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit and represented in the OHNLP
      open source schema. Note text is stored locally at contributing sites; only tokens are held
      in the enclave. Access is controlled and metadata publication is planned.
  - id: https://chorus4ai.org/dataset#imaging
    name: Imaging from PACS
    description: >-
      DICOM imaging obtained from hospital PACS. As of August 2025, 1,000 images were available
      with de-identification in process for a larger cohort; the current released dataset reports
      7,642 admissions with radiology data. Access is controlled, the DICOM schema applies, and
      metadata publication is planned.
  - id: https://chorus4ai.org/dataset#waveform-telemetry
    name: Waveform telemetry
    description: >-
      Continuous waveform telemetry from bedside monitors captured via gateway/middleware,
      distributed in WFDB format with an extended PhysioNet metadata schema. The current released
      dataset contains 23 Tb of waveform data. Telemetry is held in the enclave under controlled
      access.
  - id: https://chorus4ai.org/dataset#waveform-eeg
    name: EEG waveforms
    description: >-
      EEG waveforms drawn from hospital EEG databases, represented in the open source EDF+ and
      Persyst schemas. Extraction was in process as of August 2025. Access is controlled and
      metadata publication is planned.

preprocessing_strategies:
  - name: Standardization to the OMOP Common Data Model
    description: >-
      Acquired data are standardized to the OMOP Common Data Model, using ongoing and new
      standardization practices and validated semantic mappings that connect clinical data in
      various source formats to international standards.
  - name: Tokenization of unstructured EHR text
    description: >-
      Unstructured electronic health record text is extracted and tokenized using the OHNLP
      toolkit so that tokens rather than full notes are transferred into the enclave.
  - name: Transformation to limit re-identification
    description: >-
      Data are transformed using approaches that limit re-identification before being made
      available through the controlled enclave.
  - name: Waveform conversion to standard formats
    description: >-
      Telemetry waveforms are converted to WFDB using CHoRUS waveform conversion scripts and
      documentation; EEG is prepared in EDF+ and Persyst formats.
  - name: Geocoding of location entities
    description: >-
      OMOP Location entities are geocoded with open source code based on DeGauss, supporting
      contextual factors such as geographic distance to the nearest hospital and social
      determinants of health.

raw_data_sources:
  - source_description: >-
      Operational electronic health record systems at the 14 CHoRUS data acquisition hospitals,
      supplying demographics, diagnoses, procedures, medication administration, and nursing
      flowsheet documentation prior to OMOP standardization.
  - source_description: >-
      Unstructured clinical note text held in hospital EHR systems, which remains stored locally
      at each contributing site and is processed with the OHNLP toolkit to produce tokens.
  - source_description: >-
      Hospital PACS, supplying source DICOM imaging studies prior to de-identification.
  - source_description: >-
      Bedside physiologic monitors and their gateway/middleware systems, supplying raw telemetry
      waveform streams.
  - source_description: >-
      Hospital EEG databases, supplying raw EEG recordings for extraction into EDF+ and Persyst
      formats.

cleaning_strategies:
  - name: Site characterization reports
    description: >-
      Characterization reports are produced and returned to contributing sites following their
      data submissions.
  - name: Clinical validation of semantic mappings
    description: >-
      Clinical experts contribute to semantic mapping and validation through a documented
      clinical validation SOP and a repository of pooled tabular mappings.

labeling_strategies:
  - name: Visualization and annotation environment
    description: >-
      A visualization and annotation environment is used to label data with targets important for
      prediction, as part of the project's tooling for acquiring, standardizing, tokenizing,
      storing, visualizing, and labeling data.

machine_annotation_tools:
  - name: OHNLP toolkit
    description: >-
      OHNLP toolkit used to extract and tokenize clinical notes, with output represented in the
      OHNLP open source schema.

is_deidentified:
  description: >-
    The dataset is derived from identifiable clinical records and is subject to de-identification
    and privacy-preserving transformation before release. Unstructured EHR content is tokenized,
    data are transformed using approaches that limit re-identification, note text is retained
    locally at contributing sites while only tokens enter the enclave, and imaging
    de-identification was in process as of August 2025 for the cohort beyond the first 1,000
    images. A privacy scan tool for medical records is maintained by the project. All modalities
    remain under controlled access.

sensitive_elements:
  - name: Protected health information in clinical records
    description: >-
      The underlying records are hospital clinical data for critically ill patients, including
      demographics, diagnoses, procedures, medication administration, and nursing documentation.
  - name: Unstructured clinical note text
    description: >-
      Free-text clinical notes are treated as especially sensitive: full text is stored locally at
      contributing sites and only tokenized representations are placed in the enclave.
  - name: Medical imaging
    description: >-
      DICOM imaging from PACS requires de-identification before broader release; only 1,000 images
      were available as of August 2025 while de-identification proceeded for a larger cohort.
  - name: Geographic and social determinants data
    description: >-
      Contextual factors such as geographic distance to the nearest hospital and social
      determinants of health are included and carry re-identification potential.

confidential_elements:
  - name: Controlled access across all modalities
    description: >-
      Every data type in the CHoRUS dataset - demographics, medication administration, procedures,
      nursing flowsheets, diagnoses, clinical notes, imaging, telemetry waveforms, and EEG - is
      designated controlled access.
  - name: Locally retained clinical note text
    description: >-
      Full clinical note text is not released into the enclave; it is retained at the contributing
      site and only tokens are shared.

human_subject_research:
  description: >-
    The dataset consists of retrospective clinical data from human patients receiving acute and
    critical care. The NIH project abstract describes acquiring an AI-ready data set from more
    than 100,000 critically ill patients, and the project website describes an anticipated final
    dataset of 100,000 patient admissions. The project established a legal framework for
    collecting data at scale and conducted community-facing ethics focus groups to determine what
    data is appropriate for public sharing.

participant_privacy:
  - name: Privacy-preserving handling of patient data
    description: >-
      Patient privacy is protected by tokenizing unstructured EHR content, transforming data using
      approaches that limit re-identification, retaining clinical note text locally rather than in
      the enclave, de-identifying imaging, applying a privacy scan tool to medical records, and
      restricting all modalities to controlled access within a cloud enclave.

known_limitations:
  - name: Partial modality availability at time of snapshot
    limitation_type: coverage_limitation
    description: >-
      As of August 2025, only 1,000 images were available with de-identification in process for a
      larger cohort, EEG extraction was still in process, and published metadata for clinical
      notes, imaging, and EEG was planned rather than available.
  - name: Released dataset smaller than anticipated final dataset
    limitation_type: coverage_limitation
    description: >-
      The current released dataset covers 50,000 patient admissions (over 45,000 unique admissions
      reported as of August 2025), against an anticipated final dataset of 100,000 patient
      admissions across 9 modalities.
  - name: Clinical note text not centrally available
    limitation_type: integration_limitation
    description: >-
      Clinical notes are stored locally at contributing sites and only tokens are available in the
      enclave, limiting analyses that require full note text.
  - name: Scope restricted to acute and critical care
    limitation_type: scope_limitation
    description: >-
      The dataset covers admissions to ICU, PICU, and NICU settings at 14 contributing hospitals
      and is designed around acute and critical illness rather than general-population or
      outpatient care.
  - name: Retrospective design
    limitation_type: temporal_limitation
    description: >-
      Data collection is retrospective, so the dataset reflects care as documented in existing
      hospital records rather than prospectively designed measurement.

license_and_use_terms:
  description: >-
    Access to the CHoRUS dataset is controlled. All users must sign a licensing agreement before
    gaining access; for the AIM-AHEAD Bridge2AI for Clinical Care training route, the agreement is
    included in a registration form that collects name, email, and institution, and access
    additionally requires a ".edu" email address. Once access is granted and compute is
    provisioned, users work with the data in the Bridge2AI AI/ML for Clinical Care Collaborative
    Cloud enclave.

ip_restrictions:
  description: >-
    CHoRUS software repositories on the project's GitHub organization are licensed under the MIT
    License, with individual repositories also carrying Apache-2.0 and MIT licenses. Access to the
    dataset itself requires a signed licensing agreement under controlled access.

regulatory_restrictions:
  confidentiality_level: restricted
  description: >-
    Every CHoRUS data type is designated controlled access, and data are held within a cloud
    enclave with provisioned compute. Access requires a signed licensing agreement and, for the
    training program route, an institutional (".edu") email address.

distribution_formats:
  - name: OMOP Common Data Model tables
    description: >-
      Structured EHR data (demographics, diagnoses, procedures, medication administration, nursing
      flowsheets) distributed in the OMOP Common Data Model, with published OMOP metadata schemas,
      including OMOP schema with extensions for nursing flowsheets.
  - name: OHNLP tokenized text
    description: >-
      Clinical note content distributed as tokens conforming to the OHNLP open source schema.
  - name: DICOM
    description: Imaging distributed in DICOM format with the DICOM metadata schema.
  - name: WFDB
    description: >-
      Telemetry waveforms distributed in WFDB format, documented with an extended PhysioNet
      metadata schema.
  - name: EDF+ and Persyst
    description: >-
      EEG waveforms distributed in the open source EDF+ and Persyst formats and schemas.

third_party_sharing:
  - name: Controlled-access sharing outside the contributing centers
    description: >-
      The dataset is shared beyond the contributing hospitals under controlled access: prospective
      users register, sign a licensing agreement, and are provisioned compute in the cloud enclave.
      Access requests are directed to the CHoRUS access contacts (dbold@emory.edu or
      jared.houghtaling@tuftsmedicine.org).
  - name: Access through the AIM-AHEAD Bridge2AI for Clinical Care Training Program
    description: >-
      AIM-AHEAD and Bridge2AI collaborate to expand access to CHoRUS data through a training
      program; up to 30 trainees per cohort receive access after registration, licensing, and
      compute provisioning, with program administrators assisting with access where needed.

maintainers:
  - name: Ciera McCrary
    description: >-
      Program Manager, Massachusetts General Hospital; contact for the CHoRUS project website
      (cmccrary@mgh.havard.edu, as listed on chorus4ai.org).
  - name: CHoRUS access request contacts
    description: >-
      Requests for data access are handled by dbold@emory.edu and
      jared.houghtaling@tuftsmedicine.org.
  - name: CHoRUS software maintainers
    description: >-
      Software contributors within CHoRUS maintain the open-source tooling for transforming and
      interacting with clinical data; versions, maintainers, and other package metadata are
      tracked on a package status page maintained in the developer documentation.

updates:
  description: >-
    The dataset is actively growing from the currently released 50,000 admissions toward an
    anticipated final dataset of 100,000 patient admissions across 9 modalities and 14 hospitals.
    Imaging de-identification for a larger cohort and EEG extraction were in progress as of
    August 2025, and published metadata schemas for clinical notes, imaging, and EEG were planned.
    Contributing sites deliver updated extracts on a tracked schedule, with characterization
    reports returned after each submission.

extension_mechanism:
  description: >-
    External and consortium contributors can extend the resource in several documented ways:
    clinical collaborators contribute to semantic mapping and validation through the CHoRUS
    mapping repository, which holds documentation, pooled tabular mappings, and an associated
    clinical validation SOP; data contributing sites submit extracts and regular status updates
    either through the GitHub interface or a Google Form that triggers automated status updates
    via the GitHub API; issues and questions are raised in context-specific Standards and Data
    Acquisition discussion spaces; and software contributors add to the open-source tooling
    documented in the developer guide.

external_resources:
  - name: CHoRUS project website
    description: Public-facing project website at https://chorus4ai.org/ describing the project, its components, and dataset snapshots.
  - name: CHoRUS for Equitable AI GitHub organization
    description: >-
      GitHub organization at https://github.com/chorus-ai housing 28 repositories with software and
      tooling for clinical data, validated semantic mappings, standard operating protocols for
      contributing sites, and project management overviews.
  - name: Bridge2AI CHoRUS page
    description: Program page for CHoRUS within the Bridge2AI consortium at www.bridge2ai.org/chorus.
  - name: NIH RePORTER project record
    description: >-
      NIH RePORTER record for application ID 10472824, project number 1OT2OD032701-01, at
      https://reporter.nih.gov/project-details/10472824.