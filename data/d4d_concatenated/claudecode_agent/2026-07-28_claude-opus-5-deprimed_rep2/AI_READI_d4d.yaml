variables:
  - id: d4d:AI_READI-var-hba1c
    variable_name: HbA1c
    name: Haemoglobin A1c
    description: >-
      Whole blood haemoglobin A1c, tested by the University of Washington Nutrition and
      Obesity Research Center on stored frozen samples. Included as a marker for diabetes.
    data_type: float
    minimum_value: 4.0
    maximum_value: 6.0
    measurement_technique: >-
      Whole blood assay performed by the UW NORC testing facility; the stated range is the
      laboratory reference range, not the observed data range.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-glucose
    variable_name: glucose
    name: Serum glucose
    description: >-
      Serum glucose, included as a marker for diabetes, reported in mg/dL with a laboratory
      reference range of 62 to 125 mg/dL.
    data_type: float
    minimum_value: 62.0
    maximum_value: 125.0
    measurement_technique: >-
      Serum assay performed by the UW NORC testing facility on stored frozen samples; the
      stated range is the laboratory reference range, not the observed data range.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-creatinine
    variable_name: creatinine
    name: Serum creatinine
    description: >-
      Serum creatinine, included as a marker of kidney function, reported in mg/dL with
      sex-specific laboratory reference ranges of 0.38 to 1.02 for females and 0.51 to 1.18
      for males.
    data_type: float
    measurement_technique: >-
      Serum assay performed by the UW NORC testing facility on stored frozen samples.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-urine-albumin
    variable_name: urine_albumin
    name: Urine albumin
    description: >-
      Urine albumin, reported in mg/dL and included as a urinary biomarker for early diabetic
      nephropathy.
    data_type: float
    measurement_technique: >-
      Urine assay performed by the UW NORC testing facility on samples processed locally at
      the data site on the day of collection.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-urine-creatinine
    variable_name: urine_creatinine
    name: Urine creatinine
    description: >-
      Urine creatinine, reported in mg/dL and included as a urinary biomarker for early
      diabetic nephropathy.
    data_type: float
    measurement_technique: >-
      Urine assay performed by the UW NORC testing facility on samples processed locally at
      the data site on the day of collection.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-nt-probnp
    variable_name: NT-proBNP
    name: N-terminal pro-B-type natriuretic peptide
    description: >-
      EDTA plasma N-terminal pro-B-type natriuretic peptide, reported in pg/mL, included as a
      severity and outcome predictor of heart failure. The laboratory reference range varies by
      age.
    data_type: float
    measurement_technique: >-
      EDTA plasma assay performed by the UW NORC testing facility on stored frozen samples.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-troponin-t
    variable_name: troponin-T
    name: Troponin-T
    description: >-
      EDTA plasma troponin-T, reported in ng/L, included as a marker of myocardial injury, with
      laboratory reference values below 11 for females and below 16 for males.
    data_type: float
    measurement_technique: >-
      EDTA plasma assay performed by the UW NORC testing facility on stored frozen samples.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-systolic-bp
    variable_name: systolic_blood_pressure
    name: Systolic blood pressure
    description: >-
      Systolic blood pressure in mm Hg, measured twice separated by two minutes with an
      automatic oscillometric medically approved device and recorded in REDCap. Readings above
      180 mm Hg or below 100 mm Hg with symptoms of haemodynamic instability trigger an
      emergency care recommendation.
    data_type: integer
    measurement_technique: >-
      Automatic oscillometric measurement using OMRON HEM 907XL, Medline MDS4001, or Welch
      Allyn 6000 series monitors.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-diastolic-bp
    variable_name: diastolic_blood_pressure
    name: Diastolic blood pressure
    description: >-
      Diastolic blood pressure in mm Hg, measured twice separated by two minutes. Readings
      above 120 mm Hg or below 60 mm Hg with symptoms of haemodynamic instability trigger an
      emergency care recommendation.
    data_type: integer
    measurement_technique: >-
      Automatic oscillometric measurement using OMRON HEM 907XL, Medline MDS4001, or Welch
      Allyn 6000 series monitors.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-heart-rate
    variable_name: heart_rate
    name: Heart rate
    description: >-
      Heart rate in beats per minute, measured twice separated by two minutes and also
      readable from the ECG. Readings above 100 bpm or below 60 bpm, if not known to be usual
      for the participant and accompanied by symptoms of haemodynamic instability, trigger an
      emergency care recommendation.
    data_type: integer
    measurement_technique: >-
      Automatic oscillometric blood pressure monitor or 12-lead electrocardiography; heart rate
      is also captured continuously by the Garmin Vivosmart 5 during the 10-day at-home period.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-moca-total
    variable_name: moca_total_score
    name: Montreal Cognitive Assessment total score
    description: >-
      Total score on the Montreal Cognitive Assessment, administered electronically on an iPad
      using the MoCA Duo application. The maximum score is 30, higher numbers represent better
      performance, a final total score of 26 and above is considered normal, and anything below
      24 is a sign of cognitive impairment. Section subscores, a Memory Index Score and task
      completion times are also captured.
    data_type: integer
    minimum_value: 0.0
    maximum_value: 30.0
    measurement_technique: >-
      MoCA Duo application administered on an iPad by trained research staff, capturing
      participant responses interactively.
    quality_notes:
      - Professionals require training to score the test.
      - A person's level of education may affect the test.
      - Socioeconomic factors may affect the test.
      - >-
        People living with depression or other mental health issues may score similarly to
        those with mild dementia.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-visual-acuity
    variable_name: best_corrected_visual_acuity_logmar
    name: Best-corrected visual acuity (logMAR)
    description: >-
      Best-corrected letter visual acuity expressed as the logarithm of the minimum angle of
      resolution, measured for the right and left eyes separately under photopic conditions and
      under mesopic conditions through a 2.0 neutral density filter. Lower numbers indicate
      better resolution. Snellen visual acuity variables were dropped in version 3.0.0, leaving
      only logMAR measurements.
    data_type: float
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres from a touch-screen monitor,
      using the instrument's routine protocol, with best correction from the participant's own
      spectacles or trial frames.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-contrast-sensitivity
    variable_name: letter_contrast_sensitivity_logcs
    name: Letter contrast sensitivity (log CS)
    description: >-
      Monocular letter contrast sensitivity expressed as log sensitivity, with higher numbers
      meaning better sensitivity, assessed under photopic conditions with a general occluder and
      under mesopic conditions through a 2.0 neutral density occluder, in the standardized order
      photopic right eye, photopic left eye, mesopic right eye, mesopic left eye.
    data_type: float
    measurement_technique: >-
      Mars Letter Contrast Sensitivity chart with background luminance between 60 and 120 cd/m2
      (optimal 85), illuminance between 189 and 377 lux (optimal 267), and viewing distance
      nominally 50 cm and permitted between 40 and 59 cm, with appropriate near correction, under
      undilated conditions. Testing terminates after two consecutive errors or at the end of the
      chart, and log CS is computed by subtracting 0.04 times the number of errors before the
      final correct letter from the log CS value at that letter.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-cgm-glucose
    variable_name: cgm_blood_glucose
    name: Continuous glucose monitor blood glucose
    description: >-
      Blood glucose measurements in mg/dL recorded every 5 minutes by the Dexcom G6 continuous
      glucose monitor over a 10-day at-home monitoring period. Participants are masked to the
      readings during the monitoring period. For participants already wearing a Dexcom G6, up to
      90 days of prior glucose values may optionally be downloaded, for a total of up to 100
      days.
    data_type: float
    measurement_technique: >-
      Dexcom G6 real-time integrated continuous glucose monitoring system worn on the abdomen,
      with data downloaded by study staff after device return or through Dexcom Clarity.
    is_sensitive: false
    is_identifier: false
  - id: d4d:AI_READI-var-monofilament
    variable_name: monofilament_test_result
    name: Monofilament peripheral neuropathy test result
    description: >-
      Per-location yes or no responses indicating whether the participant perceived a 10 g
      monofilament at three locations on each foot, tested ten times per location with the
