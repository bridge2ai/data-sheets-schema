purposes:
  - id: d4d:AI_READI-purpose-primary
    name: Enable AI/ML research into type 2 diabetes salutogenesis
    description: >-
      The dataset was created to enable future generations of artificial intelligence and
      machine learning research to provide critical insights into type 2 diabetes mellitus,
      including salutogenic pathways to return to health. T2DM is a growing public health
      threat affecting a large share of the adult population, yet current understanding of
      T2DM in the context of salutogenesis is limited. Given the complexity of T2DM,
      AI-based approaches may improve understanding, but a key barrier has been the lack
      of data ready for training AI models. The AI-READI dataset is intended to fill that
      gap.
    response: >-
      The purpose for creating the dataset was to enable future generations of artificial
      intelligence/machine learning (AI/ML) research to provide critical insights into type
      2 diabetes mellitus (T2DM), including salutogenic pathways to return to health.
  - id: d4d:AI_READI-purpose-blueprint
    name: Provide a blueprint for ethically sourced, AI-ready data generation
    description: >-
      A second purpose is to establish and disseminate standards, best practices, and
      guidelines for the collection, preparation, and sharing of biomedical data for AI/ML,
      including guidance from bioethicists, so that the project can serve as a model for
      future efforts to develop other medical and health datasets targeted for AI/ML. The
      project develops guidelines for project management and for data collection,
      management, and sharing, extends existing standards where possible, and has developed
      the Clinical Dataset Structure (CDS) specification and the FAIRhub data management
      and sharing platform.
    response: >-
      An additional aim of the AI-READI project is to share our blueprint for collecting
      and sharing AI-ready datasets so that future Data Generation Projects can follow
      them, including guidelines for project management as well as data collection,
      management and sharing.

tasks:
  - id: d4d:AI_READI-task-pseudotime
    name: Pseudotime manifold analysis of disease trajectories
    description: >-
      Data collection was specifically designed to permit downstream pseudotime manifold
      analysis, an approach used to predict disease trajectories by collecting and learning
      from complex, multimodal data from participants with differing disease severity
      (normal through insulin-dependent T2DM). The approach relies on dimensionality
      reduction, is agnostic to existing classification criteria or biases, and can be used
      to reconstruct a temporal atlas of T2DM pathogenesis and reversal toward health.
    response: >-
      The multi-modal dataset being collected is being gathered to facilitate downstream
      pseudotime manifolds and various applications in artificial intelligence.
  - id: d4d:AI_READI-task-multimodal-modeling
    name: Multimodal AI/ML model development on balanced clinical data
    description: >-
      The dataset supports development of multimodal AI/ML models across survey, clinical,
      laboratory, imaging, waveform, wearable, and environmental modalities. The cohort was
      constructed to be balanced across race/ethnicity, biological sex, and T2DM severity
      so that models developed on it are less affected by the demographic skew of prior
      T2DM datasets. The dataset is hypothesis-agnostic and carries no predefined
      prediction target.
    response: >-
      The dataset is a hypothesis-agnostic dataset aimed at facilitating multiple potential
      downstream AI/ML applications.

addressing_gaps:
  - id: d4d:AI_READI-gap-ai-ready-data
    name: Absence of large, diverse, AI-ready multimodal T2DM datasets
    description: >-
      The ability to understand and affect the course of complex, multi-organ diseases such
      as T2DM has been limited by a lack of well-designed, high quality, large, and
      inclusive multimodal datasets. A major barrier to AI in this area has been the lack of
      diverse datasets that are AI ready for training AI models. AI-READI addresses this by
      generating a large multimodal dataset that is stored and shared as AI-ready, enabling
      immediate AI/ML research without reformatting and preprocessing.
    response: >-
      A major barrier has been the lack of diverse datasets that are AI ready for training
      AI models, which the AI-READI project is designed to address.
  - id: d4d:AI_READI-gap-representation
    name: Under-representation of racial and ethnic groups in T2DM research
    description: >-
      A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated
      that samples lacked racial and ethnic diversity, even though the prevalence and
      consequences of T2DM are higher in certain racial and ethnic populations. Rather than
      targeting the demographic distribution of the US population, AI-READI recruits four
      race/ethnic groups (Asian, Black, Hispanic, White) in equal proportions, which the
      project describes as an important step forward in addressing these demographic
      inequities in research.
    response: >-
      The sample is designed to be approximately balanced with respect to sex and
      race/ethnicities (Asians, blacks, Hispanics and whites), a demographic improvement
      over many previous epidemiological studies and clinical trials on T2DM.

creators:
  - id: d4d:AI_READI-creator-consortium
    name: AI-READI Consortium
    description: >-
      The dataset was created by members of the AI-READI project, referred to as the
      AI-READI Consortium, and is registered on FAIRhub with an organizational creator
      name. The consortium is a multidisciplinary group including clinicians, data
      scientists, vision scientists, computer scientists, organisational scientists and
      ethicists, spanning senior, mid-career and early-career faculty, clinical research
      coordinators, staff and interns, and covering clinical research, data collection,
      data management, data standards, bioinformatics, team science and ethics. Six
      cross-disciplinary project modules involving teams located across eight institutions
      work together to develop the dataset. Note that the FAIRhub structured metadata for
      version 3.0.0 records the managing organization and lead sponsor as Washington
      University in St. Louis, while the NIH RePORTER award record, the IRB of record, the
      data license agreement, the study location list and the peer-reviewed publications all
      identify the University of Washington; the University of Washington is used here.
