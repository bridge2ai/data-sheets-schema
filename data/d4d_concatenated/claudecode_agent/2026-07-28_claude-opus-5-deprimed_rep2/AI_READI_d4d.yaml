id: https://doi.org/10.60775/fairhub.3
name: AI-READI
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI dataset is a multimodal, cross-sectional dataset collected from individuals with and
  without type 2 diabetes mellitus (T2DM) and harmonized across three data collection
  sites in the United States: the University of Alabama at Birmingham, the University of
  California San Diego, and the University of Washington. It is one of four Data
  Generation Projects funded by the NIH Common Fund Bridge2AI program. Version 3.0.0
  contains data from 2280 participants collected between 19 July 2023 and 1 May 2025,
  comprising 356,343 files and approximately 3.82 TB. Data domains include self-reported
  survey data (demographics, depression screening, diabetes distress and self-care, diet,
  smoking/alcohol/vaping/marijuana history, general health, social determinants of health,
  ophthalmic survey, current medications), physical measurements and vitals, 12-lead
  electrocardiography, monofilament testing for peripheral neuropathy, Montreal Cognitive
  Assessment, visual function testing under photopic and mesopic conditions, multi-device
  retinal imaging (color fundus photography, fundus autofluorescence, infrared, optical
  coherence tomography, OCT angiography, and fluorescence lifetime imaging
  ophthalmoscopy), blood and urine laboratory results, 10-day continuous glucose
  monitoring, 10-day wearable physical activity monitoring, and 10-day in-home
  environmental sensing. The cohort was designed to be triple-balanced across
  self-reported race/ethnicity (Asian, Black, Hispanic, White), T2DM presence and severity
  (no diabetes; pre-diabetes or lifestyle-controlled; controlled with oral or non-insulin
  injectable medication; insulin-controlled), and biological sex, so that downstream
  AI/ML models can be trained on data that is not skewed by the demographic composition of
  prior T2DM studies. The scientific goal is to enable AI/ML research into salutogenesis,
  the pathway from T2DM back toward health, including downstream pseudotime manifold
  analysis of disease trajectories. Data are organized following the Clinical Dataset
  Structure (CDS) v0.1.1 and mapped to community standards (OMOP CDM for clinical data,
  DICOM for imaging, WFDB for ECG, Open mHealth for wearables), and are distributed
  through the FAIRhub platform. The public release carries no protected health
  information; sex, race/ethnicity, and medication information are withheld from it and
  released only under controlled access. The acronym AI-READI is expanded inconsistently
  across the project's own sources: the two peer-reviewed publications expand it as
  Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights, while the NIH
  RePORTER record, the dataset README and healthsheet, and the registered study title
  expand it as Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights.
  The official registered study title is "AI Ready and Exploratory Atlas for Diabetes
  Insights", registered on ClinicalTrials.gov as NCT06002048.
