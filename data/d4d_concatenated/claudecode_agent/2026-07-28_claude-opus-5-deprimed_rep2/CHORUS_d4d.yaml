file_collections:
- id: d4d:CHORUS_fc_omop_structured_ehr
  name: Structured electronic health record data standardized to OMOP
  description: >-
    Structured EHR content standardized to the OMOP Common Data Model, comprising
    demographics, medication administration (dosing time-stamped upon each infusion
    change or dose administration), procedures documented by providers, nursing flowsheets
    (high-frequency documentation), and diagnoses documented by providers. All of
    these data types are under controlled access and have published metadata; nursing
    flowsheets use the OMOP schema with extensions. The current released dataset contains
    1.6 billion rows of EHR OMOP data. This data type is held in the CHoRUS cloud
    enclave.
  collection_type:
  - processed_data
  conforms_to: OMOP Common Data Model
  conforms_to_schema: OMOP Common Data Model, with CHoRUS extensions for nursing flowsheets
- id: d4d:CHORUS_fc_clinical_notes
  name: Tokenized unstructured clinical notes
  description: >-
    Clinical notes extracted and tokenized using the OHNLP toolkit. Notes are stored
    locally at the contributing site; only tokens are transferred to the CHoRUS enclave.
    Access is controlled and the metadata schema is the OHNLP open source schema;
    published metadata for this data type is planned rather than complete.
  collection_type:
  - processed_data
  conforms_to: OHNLP open source schema
- id: d4d:CHORUS_fc_imaging
  name: Imaging data from PACS
  description: >-
    Imaging drawn from hospital PACS systems in DICOM format under controlled access,
    conforming to the DICOM schema. As of August 2025 approximately 1,000 images were
    available, with de-identification in process for a larger cohort. The current
    released dataset reports 7,642 admissions with radiology data. Published metadata
    for this data type is planned.
  collection_type:
  - processed_data
  conforms_to: DICOM
- id: d4d:CHORUS_fc_waveform_telemetry
  name: Waveform telemetry from bedside monitors
  description: >-
    Physiologic waveform telemetry captured from bedside monitors and gateway/middleware
    systems, stored in WFDB format under controlled access, with a published metadata
    schema based on an extended PhysioNet schema. Telemetry is held in the CHoRUS
    cloud enclave. The current released dataset reports 23 Tb of waveform data.
  collection_type:
  - processed_data
  conforms_to: WFDB
  conforms_to_schema: PhysioNet schema, extended
- id: d4d:CHORUS_fc_waveform_eeg
  name: EEG waveform data
  description: >-
    Electroencephalography waveforms drawn from hospital EEG databases, stored in
    EDF+ and Persyst formats under controlled access, using the open source EDF+ and
    Persyst schemas. As of August 2025 EEG extraction was in process. Published metadata
    for this data type is planned.
  collection_type:
  - processed_data
  conforms_to: EDF+ and Persyst

purposes:
- id: d4d:CHORUS_purpose_ai_ready_critical_care_data
  name: Generate an AI-ready critical care dataset
  response: >-
    The CHoRUS data generation project was created to meet the need of generating
    data for machine learning and artificial intelligence applications aimed at characterizing
    acute and critical care illness, predicting complications, and measuring treatment
    response among patients with acute or critical illness. There is an urgent need
    for infrastructure to support AI/ML in critical care, and developing high-resolution
    multi-center data sets is a critical first step towards actionable and trustworthy
    AI.
- id: d4d:CHORUS_purpose_public_availability
  name: Develop a publicly available dataset that promotes privacy and clinical benefit
  response: >-
    The project's overarching goal is to develop a publicly available, AI-ready critical
    care dataset, while ensuring the methods promote privacy, accountability, and
    clinical benefit, and while promoting a new generation of AI clinicians and scientists.
- id: d4d:CHORUS_purpose_holdout_validation
  name: Provision a holdout test set for external model validation
  response: >-
    The dataset provisions a holdout test set, accessible for model external validation,
    to aid marketplace adoption of AI-developed models for implementation in acute
    and critical care.
- id: d4d:CHORUS_purpose_diverse_ethically_sourced
  name: Build a diverse, high-resolution, ethically sourced resource
  response: >-
    The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving
    recovery from acute illness, acquiring and standardizing a dataset of unprecedented
    diversity and high resolution.

tasks:
- id: d4d:CHORUS_task_characterize_illness
  name: Characterize acute and critical care illness
  response: >-
    Support ML/AI applications aimed at characterizing acute and critical care illness
    among patients with acute or critical illness.
- id: d4d:CHORUS_task_predict_complications
  name: Predict complications
  response: >-
    Support ML/AI applications aimed at predicting complications among patients with
    acute or critical illness.
- id: d4d:CHORUS_task_measure_treatment_response
  name: Measure treatment response
  response: >-
    Support ML/AI applications aimed at measuring treatment response among patients
    with acute or critical illness.
- id: d4d:CHORUS_task_external_validation
  name: External validation of AI models
  response: >-
    Support external validation of AI/ML models through a sequestered holdout dataset,
    intended to aid marketplace adoption of AI-developed models for implementation
    in acute and critical care.
- id: d4d:CHORUS_task_improve_recovery
  name: Improve care and outcomes for patients requiring critical care
  response: >-
    Enable the building of machine-learning and artificial-intelligence-derived models
    to improve the care and outcomes of patients requiring critical care, answering
    the grand challenge of improving recovery from acute illness.

addressing_gaps:
- id: d4d:CHORUS_gap_infrastructure
  name: Lack of infrastructure and multi-center data for critical care AI
  response: >-
    There is an urgent need for infrastructure to support artificial intelligence
    and machine learning in critical care. Developing high-resolution multi-center
    data sets is a critical first step towards actionable and trustworthy AI, and
    the project addresses the challenge of acquiring an AI-ready data set from more
    than 100,000 critically ill patients.
- id: d4d:CHORUS_gap_standards_harmonization
  name: Absence of unified standards across clinical data modalities
  response: >-
    Unified standards are needed to harmonize multi-modal electronic health record,
    waveform, imaging, and text data. CHoRUS develops capabilities across a multi-center
    network to acquire, standardize, tokenize, store, visualize, and label these data
    types and standardizes structured data to the OMOP Common Data Model.
- id: d4d:CHORUS_gap_ethical_legal_framework
  name: Missing legal and ethical framework for large-scale clinical data sharing
  response: >-
    The project establishes a legal framework for collecting data at scale and performs
    community-facing ethics focus groups to determine what data is appropriate for
    public sharing, addressing the absence of settled ethical and legal approaches
    for managing privacy and bias in clinical care AI.
- id: d4d:CHORUS_gap_workforce
  name: Shortage of a trained AI clinical workforce
  response: >-
    The project cultivates expertise in the lay and scientific community to improve
    AI literacy and utilization through multimodal educational approaches, developing
    the skills and workforce for a next generation of diverse academic and community
    AI scientists.

