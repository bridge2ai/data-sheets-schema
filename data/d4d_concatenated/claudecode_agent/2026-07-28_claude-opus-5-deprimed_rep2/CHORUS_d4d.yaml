known_biases:
- id: d4d:CHORUS_bias_representation
  name: Cohort restricted to participating data acquisition centers
  bias_type: representation_bias
  bias_description: >-
    The dataset is assembled from admissions at 14 data-contributing hospitals drawn
    from a 20-center academic collaboration in the United States of America, rather
    than from a population-level or randomly selected sample of critically ill patients.
    The project documentation frames the management of bias, alongside privacy, as
    an ongoing patient-focused effort rather than a resolved property of the released
    data, and no verification of representativeness is reported in the source documents.
  mitigation_strategy: >-
    Federated access enables sampling methods intended to ensure a balanced and diverse
    cohort, and the project samples to ensure comprehensive sets of patient conditions
    and clinical treatment strategies. Patient-focused efforts determine the ethical
    and legal approaches to manage privacy and bias while accounting for social determinants
    of health, and data elements are designed to feature appropriate contextual factors
    such as geographic distance to the nearest hospital.
  affected_subsets:
  - Admissions from ICU, PICU, and NICU settings at the 14 data-contributing hospitals

known_limitations:
- id: d4d:CHORUS_limitation_modality_completeness
  name: Modality coverage is incomplete
  limitation_type: coverage_limitation
  limitation_description: >-
    Not all in-scope modalities were fully available at the time of the source documents.
    As of August 2025, imaging comprised approximately 1,000 images with de-identification
    in process for a larger cohort, EEG extraction was in process, and clinical notes
    remained stored locally at contributing sites with only tokens transferred. Published
    metadata was reported as planned rather than complete for clinical notes, imaging,
    and EEG waveforms.
  scope_impact: >-
    Analyses requiring imaging, EEG, or full-text clinical notes are constrained relative
    to analyses using OMOP-standardized structured EHR data and waveform telemetry,
    which were reported as available in the enclave.
  recommended_mitigation: >-
    Confirm current modality availability and metadata publication status with the
    project before designing analyses that depend on imaging, EEG, or note content.
- id: d4d:CHORUS_limitation_released_subset
  name: Released dataset is a subset of the anticipated final dataset
  limitation_type: scope_limitation
  limitation_description: >-
    The current released dataset (50,000 patient admissions) is half the size of the
    anticipated final dataset (100,000 patient admissions), and the reported snapshot
    figures differ across sources and dates (over 45,000 unique admissions as of August
    2025 versus 50,000 in the current released dataset reported on the project website).
    Users working with the dataset at different times will encounter different cohort
    sizes.
  scope_impact: >-
    Cohort size, modality coverage, and contributing-site coverage are time-dependent,
    which affects reproducibility of analyses that do not record the dataset state
    at time of use.
  recommended_mitigation: >-
    Record the dataset snapshot in use, including admission counts and contributing
    sites, when reporting analyses.
- id: d4d:CHORUS_limitation_clinical_scope
  name: Scope restricted to acute and critical care
  limitation_type: scope_limitation
  limitation_description: >-
    The dataset covers patients with acute or critical illness, drawn from ICU, PICU,
    and NICU settings at United States hospitals. It is designed to characterize acute
    and critical care illness, predict complications, and measure treatment response
    in that population.
  scope_impact: >-
    Findings and models derived from the dataset are scoped to acute and critical
    care populations and United States care delivery contexts.
- id: d4d:CHORUS_limitation_repository_review
  name: Repository availability under administrative review
  limitation_type: temporal_limitation
  limitation_description: >-
    The project website states "This repoitory is under review for potential modification
    in compliance with Administration directives", indicating that the content and
    availability of the project's public resources may change.
  scope_impact: >-
    Documentation, dataset descriptions, and access pathways referenced in the source
    documents may be modified or withdrawn.

confidential_elements:
- id: d4d:CHORUS_confidentiality_patient_data
  name: Patient clinical data under controlled access
  confidential_elements_present: true
  confidentiality_details:
  - >-
    The dataset consists of patient data drawn from hospital clinical systems. Every
    data type listed in the project documentation (demographics, medication administration,
    procedures, nursing flowsheets, diagnoses, clinical notes, imaging, waveform telemetry,
    and EEG waveforms) is designated as controlled access.
  - >-
    Clinical notes are stored locally at the contributing site and are not transferred
    to the enclave except as tokens produced by the OHNLP toolkit, reflecting the
    confidentiality of free-text clinical documentation.
  - >-
    Access is granted only after registration and signature of a licensing agreement,
    and requires a ".edu" email address.

subpopulations:
- id: d4d:CHORUS_subpopulation_care_settings
  name: Intensive care settings represented
  subpopulation_elements_present: true
  identification:
  - >-
    Admissions in the current released dataset are identified by intensive care setting,
    covering intensive care unit (ICU), pediatric intensive care unit (PICU), and
    neonatal intensive care unit (NICU) admissions.
  - >-
    Demographics are captured as an OMOP-standardized data type with controlled access
    and published metadata, and data elements are designed to feature contextual factors
    such as geographic distance to the nearest hospital, alongside social determinants
    of health.
  distribution:
  - >-
    The current released dataset comprises 50,000 patient admissions from ICU, PICU,
    and NICU combined. Counts or proportions for each individual care setting, and
    distributions across demographic subpopulations, are not reported in the source
    documents.

sensitive_elements:
- id: d4d:CHORUS_sensitive_elements
  name: Sensitive clinical and contextual data elements
  sensitive_elements_present: true
  sensitivity_details:
  - >-
    The dataset contains patient demographics, diagnoses, procedures, medication administration
    records, nursing flowsheet documentation, clinical notes, medical imaging, and
    physiologic waveform data for critically ill patients, including pediatric and
    neonatal intensive care admissions.
  - >-
    Social determinants of health and geographic contextual factors, such as distance
    to the nearest hospital, are included as data elements, and the project explicitly
    accounts for social determinants of health when determining ethical and legal
    approaches to manage privacy and bias.
  - >-
    All sensitive data types are held under controlled access; data are transformed
    using approaches that limit re-identification, notes are tokenized, and imaging
    is de-identified.

relationships:
- id: d4d:CHORUS_relationships_admission_linkage
  name: Modality records linked at the admission level
  relationship_details:
  - >-
    Multi-modal records are organized around patient admissions. The project reports
    dataset composition in admission terms across modalities, including 7,642 admissions
    with radiology data within a released set of 50,000 admissions, indicating that
    imaging and other modality records are associated with admission-level records.
  - >-
    Structured electronic health record content is standardized to the OMOP Common
    Data Model, which provides the shared representation used to relate demographics,
    medication administration, procedures, nursing flowsheets, and diagnoses. Validated
    semantic mappings connect clinical data in various source formats to international
    standards.

