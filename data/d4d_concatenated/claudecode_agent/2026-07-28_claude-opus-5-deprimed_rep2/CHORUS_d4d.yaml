id: https://chorus4ai.org/
name: CHoRUS
title: 'Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI'
description: >-
  CHoRUS is a multi-center, multi-modal, high-resolution critical care dataset assembled
  by the Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI project, one of four data generation projects in the NIH Bridge2AI
  consortium. The dataset is assembled retrospectively from clinical systems at data-contributing
  hospitals and is intended to support artificial intelligence and machine learning
  applications that characterize acute and critical care illness, predict complications,
  and measure treatment response. Nine data modalities are in scope, including structured
  electronic health record data (demographics, medication administration, procedures,
  nursing flowsheets, diagnoses) standardized to the OMOP Common Data Model, tokenized
  unstructured clinical notes, imaging drawn from PACS in DICOM format, waveform telemetry
  from bedside monitors in WFDB format, and EEG waveforms in EDF+ and Persyst formats.
  Social determinants of health and other contextual factors, such as geographic distance
  to the nearest hospital, are included as data elements. The anticipated final dataset
  covers 100,000 patient admissions across 9 data modalities contributed by 14 hospitals;
  the current released dataset comprises 50,000 patient admissions from ICU, PICU,
  and NICU settings, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology
  data, and 23 Tb of waveform data. All data types are under controlled access. A
  holdout test set is provisioned to support external validation of models. The CHoRUS
  collaboration spans 20 academic centers with more than 60 consortium members, of
  which 14 centers contribute as Data Acquisition centers.
page: https://chorus4ai.org/
status: >-
  Partially released and actively growing. The project website distinguishes a current
  released dataset (50,000 patient admissions; 1.6 billion rows of EHR OMOP data;
  7,642 admissions with radiology data; 23 Tb of waveform data) from an anticipated
  final dataset (100,000 patient admissions; 9 data modalities; 14 data-contributing
  hospitals). As of August 2025 the dataset covered 14 hospitals with over 45,000
  unique admissions. The project website carries the notice "This repoitory is under
  review for potential modification in compliance with Administration directives."
conforms_to: >-
  OMOP Common Data Model (OHDSI) for structured electronic health record data; the
  OHNLP toolkit output schema for extracted and tokenized clinical notes; DICOM for
  imaging; WFDB for waveform telemetry, with an extended PhysioNet metadata schema;
  EDF+ and Persyst for EEG waveforms.
conforms_to_schema: >-
  OMOP Common Data Model, including published OMOP schema extensions used by CHoRUS
  for nursing flowsheet and other high-frequency documentation.
was_derived_from: >-
  Retrospective clinical data extracted from hospital electronic health record systems,
  PACS imaging archives, bedside monitor and gateway/middleware telemetry streams,
  and hospital EEG databases at 14 data-contributing hospitals within the CHoRUS network.
is_tabular: false
