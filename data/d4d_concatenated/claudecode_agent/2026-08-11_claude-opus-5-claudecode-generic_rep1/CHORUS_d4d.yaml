id: https://chorus4ai.org/
name: CHoRUS
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
description: >-
  CHoRUS is a multi-center, multi-modal, high-resolution critical care dataset
  assembled by the CHoRUS Network, one of four data generation projects in the
  NIH Common Fund Bridge2AI consortium. The stated goal is to develop the most
  diverse, high-resolution, ethically sourced, AI-ready dataset available to
  answer the grand challenge of improving recovery from acute illness, and to
  make a publicly available AI-ready critical care dataset while ensuring the
  methods promote privacy, accountability and clinical benefit. Data are
  collected retrospectively from contributing hospitals and standardized to the
  OMOP Common Data Model, with additional modalities carried in modality-native
  standards: tokenized unstructured clinical notes (OHNLP toolkit), imaging from
  PACS (DICOM), waveform telemetry from bedside monitors and gateway/middleware
  (WFDB), and EEG waveforms from hospital databases (EDF+ and Persyst). The
  collaboration spans 20 academic centers, of which 14 contribute as Data
  Acquisition centers. The project website reports a current released dataset of
  50,000 patient admissions from ICU, PICU and NICU comprising 1.6 billion rows
  of EHR OMOP data, 7,642 admissions with radiology data and 23 Tb of waveform
  data, against an anticipated final dataset of 100,000 patient admissions
  across 9 data modalities. Access is controlled: users register with name,
  email and institution, sign a licensing agreement, and are provisioned compute
  in a cloud enclave.
page: https://chorus4ai.org/
status: >-
  Active. A current released dataset exists and is in use for training
  activities and publications, while imaging de-identification and EEG
  extraction were still in process as of the September 2025 informational
  webinar. The project website carries the notice "This repoitory is under
  review for potential modification in compliance with Administration
  directives."
conforms_to: OMOP Common Data Model (OHDSI), with modality-specific standards for
  clinical notes (OHNLP), imaging (DICOM), waveform telemetry (WFDB) and EEG
  (EDF+ and Persyst)
keywords:
  - Critical Care
  - Critical Illness
  - acute care
  - Electronic Health Record
  - OMOP Common Data Model
  - Electroencephalography
  - Telemetry
  - Image
  - Artificial Intelligence
  - Machine Learning
  - Bridge to Artificial Intelligence
  - social health determinants
  - data standards
  - Hospitals
  - repository
  - Ethics
  - Privacy
source_caveats: >-
  Four sources make up the declared bundle and they do not agree on every count.
  (1) Admissions: the Cohort 2 informational webinar (September 9, 2025) states
  that as of August 2025 the dataset covered 14 different hospitals with over
  45,000 unique admissions; the project website reports 50,000 released patient
  admissions from ICU, PICU and NICU. The website figure carries no date, so
  both are recorded as stated rather than reconciled. (2) Imaging: the webinar
  states 1,000 images are currently available with de-identification in process
  for a larger cohort, while the website reports 7,642 admissions with radiology
  data; these are different units (images versus admissions) as well as
  potentially different dates. (3) License: the CHoRUS GitHub organization
  README states "This project is licensed under the MIT License", which in that
  document scopes the GitHub software project; individual repositories carry MIT
  and Apache-2.0 licenses. No source states a license for the dataset itself,
  which is distributed under a signed licensing agreement, so no dataset-level
  license slot is populated. (4) No DOI or dataset version identifier appears in
  any source; the project website URL is the only identifier the sources
  provide. (5) The program manager contact address is transcribed verbatim from
  the project website as "cmccrary@mgh.havard.edu", which appears to contain a
  typographical error in the domain. (6) The GitHub organization overview is a
  manual PDF capture dated 2025-11-14, retained by the manifest as historical
  documentation because the current project website does not preserve its
  repository, SOP, standards and tooling detail; repository counts and "updated"
  timestamps in it are as of that capture. (7) Keywords are drawn from the NIH
  RePORTER preferred-terms list for the award and from the terminology used in
  the abstract, not from a dataset-supplied keyword list. (8) The data-type
  table in the webinar is a slide whose rows do not survive PDF text extraction
  in aligned form; data type, data standard, access control, metadata status and
  published metadata schema are recovered as ordered columns. Assignments that
  the column order does not determine unambiguously are left unasserted.

purposes:
  - id: purpose_ai_ready_critical_care_dataset
    name: Develop a publicly available AI-ready critical care dataset
    response: >-
      The project's overarching goal is to develop a publicly available,
      AI-ready critical care dataset, while ensuring the methods promote
      privacy, accountability and clinical benefit, and while promoting a new
      generation of AI clinicians and scientists. The CHoRUS Network states its
      goal as developing the most diverse, high-resolution, ethically sourced,
      AI-ready data set to answer the grand challenge of improving recovery from
      acute illness.
  - id: purpose_infrastructure_for_critical_care_ai
    name: Build infrastructure for AI/ML in critical care
    response: >-
      There is an urgent need for infrastructure to support artificial
      intelligence and machine learning in critical care, and developing
      high-resolution multi-center data sets is a critical first step towards
      actionable and trustworthy AI. CHoRUS generates data for ML/AI
      applications aimed at characterizing acute and critical care illness,
      predicting complications, and measuring treatment response among patients
      with acute or critical illness.
  - id: purpose_external_validation_holdout
    name: Provision a holdout test set for external validation
    response: >-
      The dataset will also provision a holdout test set, accessible for model
      external validation to aid marketplace adoption of AI-developed models for
      implementation in acute and critical care.
  - id: purpose_ethics_and_workforce
    name: Ethics and workforce development pillars
    response: >-
      Alongside data, the project addresses Ethics (ethical and trustworthy AI,
      including community-facing ethics focus groups to determine what data is
      appropriate for public sharing) and People (team science, skill and
      workforce development), cultivating expertise in the lay and scientific
      community to improve AI literacy and utilization through multimodal
      educational approaches.

tasks:
  - id: task_characterize_critical_illness
    name: Characterizing acute and critical care illness
    response: >-
      The dataset is generated for ML/AI applications aimed at characterizing
      acute and critical care illness among patients with acute or critical
      illness.
  - id: task_predict_complications
    name: Predicting complications
    response: >-
      Predicting complications among patients with acute or critical illness is
      one of the three named ML/AI application aims of the data generation
      project.
  - id: task_measure_treatment_response
    name: Measuring treatment response
    response: >-
      Measuring treatment response among patients with acute or critical illness
      is one of the three named ML/AI application aims.
  - id: task_label_prediction_targets
    name: Labeling data with prediction targets
    response: >-
      A visualization and annotation environment will label data with targets
      important for prediction.
  - id: task_external_model_validation
    name: External validation of AI models
    response: >-
      A sequestered holdout test set is intended to support external validation
      of models developed elsewhere, to aid marketplace adoption of AI models
      for implementation in acute and critical care.

addressing_gaps:
  - id: gap_no_multicenter_high_resolution_critical_care_data
    name: Absence of high-resolution multi-center critical care datasets
    response: >-
      There is an urgent need for infrastructure to support AI/ML in critical
      care, and developing high-resolution multi-center data sets is a critical
      first step towards actionable and trustworthy AI. CHoRUS addresses the
      challenge of acquiring an AI-ready data set from more than 100,000
      critically ill patients.
  - id: gap_legal_and_ethical_framework
    name: Missing legal and ethical framework for data collection at scale
    response: >-
      The project establishes a legal framework for collecting data at scale and
      performs community-facing ethics focus groups to determine what data is
      appropriate for public sharing, analyzing the existing legal and
      regulatory landscape.
  - id: gap_standards_for_multimodal_harmonization
    name: Lack of unified standards across modalities
    response: >-
      Unified standards are developed to harmonize multi-modal EHR, waveform,
      imaging and text data, including validated semantic mappings connecting
      clinical data in various source formats to international standards, and
      standard operating protocols instructing contributing sites on curating
      and delivering interoperable datasets.
  - id: gap_contextual_factors
    name: Missing contextual and social determinants data
    response: >-
      The project ensures that data elements feature appropriate contextual
      factors such as geographic distance to the nearest hospital, and accounts
      for Social Determinants of Health.
  - id: gap_ai_workforce
    name: Workforce and AI literacy gap
    response: >-
      A comprehensive set of approaches develops the skills and workforce for a
      next generation of diverse academic and community AI scientists, and
      cultivates expertise in the lay and scientific community to improve AI
      literacy and utilization.

