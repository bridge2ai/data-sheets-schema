id: https://cm4ai.org/
name: Cell Maps for Artificial Intelligence (CM4AI)
title: Cell Maps for Artificial Intelligence (CM4AI)
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data
  Generation Project of the NIH Common Fund Bridge to Artificial Intelligence
  (Bridge2AI) program. Its stated objective is to deliver machine-readable
  hierarchical maps of cell architecture as AI-ready data, produced from
  multimodal interrogation of chromatin modifiers, metabolic enzymes and other
  proteins involved in cancer, neuropsychiatric and cardiac disorders in
  disease-relevant human cell lines under treated and untreated conditions. The
  project is organised into three pillars (Data, People, Ethics) across six
  modules: Data Acquisition, Tools, Standards, Skills and Workforce
  Development, Teaming, and Ethics.

  The data are published as a series of quarterly Beta data releases in
  LibraData, the University of Virginia's instance of Dataverse, an
  NIH-approved generalist repository. Input data streams comprise
  protein-protein interaction data from affinity purification mass spectrometry
  (AP-MS) and size-exclusion chromatography mass spectrometry (SEC-MS), spatial
  proteomics immunofluorescence (IF) confocal images, and single-cell CRISPRi
  perturb-seq screens. Two cell systems are interrogated: the triple-negative
  breast cancer line MDA-MB-468 (untreated, paclitaxel-treated and
  vorinostat-treated) and the induced pluripotent stem cell line KOLF2.1J,
  undifferentiated and differentiated into neural progenitor cells, neurons and
  cardiomyocytes. Outputs are packaged with provenance graphs and rich metadata
  as AI-ready datasets in RO-Crate format using an extended client-server
  version of the FAIRSCAPE framework, and are assigned persistent, resolvable
  identifiers under the ARK scheme.

  The CM4AI project site reports the following aggregate figures for the data
  generated: 1,374 protein interactions, 53,788 immunofluorescent images, 7,023
  total proteins investigated, 11,739 genes targeted, and a data volume of
  21.4 TB.
