source_caveats: >-
  The record's referent is the CM4AI dataset as published through its quarterly
  Dataverse data releases. The bundle also contains a 2025 Nature article by
  Schaffer, Hu et al. describing a multimodal cell map of U2OS osteosarcoma
  cells, produced by overlapping investigators with Bridge2AI CM4AI funding but
  from a different cell line and distributed through NDEx, MassIVE,
  ProteomeXchange and ModelArchive rather than through the CM4AI Dataverse
  releases. It is recorded here as an external resource rather than as part of
  this dataset. The project site's aggregate "Data Insights" figures (1,374
  protein interactions; 53,788 immunofluorescent images; 7,023 proteins
  investigated; 11,739 genes targeted; 21.4 TB) are given without a stated
  release scope or capture date.

purposes:
  - name: Deliver AI-ready maps of human cell architecture
    response: >-
      To produce ethical, AI-ready datasets of cell architecture, inferred from
      multimodal data collected for human cell lines, in order to enable
      transformative biomedical AI research.
    description: >-
      CM4AI's overarching mission, as stated in the project preprint, is to
      produce ethical, AI-ready datasets of cell architecture from multimodal
      interrogation of human cell lines. Its objective is to deliver
      machine-readable hierarchical maps of cell architecture as AI-ready data
      produced from 100 chromatin modifiers and 100 metabolic enzymes involved
      in cancer, neuropsychiatric and cardiac disorders in disease-relevant
      cell lines under perturbed and unperturbed conditions.
  - name: Support interpretable genotype-phenotype learning
    response: >-
      To map the spatiotemporal architecture of human cells and use these maps
      toward the grand challenge of interpretable genotype-phenotype learning.
    description: >-
      The NIH RePORTER record for the CM4AI Data Generation Project states that
      machine learning models in genomics and precision medicine are often
      "black boxes", predicting phenotypes from genotypes without exposing the
      mechanisms of translation, and that CM4AI addresses this deficiency by
      creating a library of large-scale maps of cellular structure and function
      across demographic and disease contexts to stimulate research in
      "visible" machine learning systems.
  - name: Demonstrate ethical, FAIR, AI-ready data practice
    response: >-
      To establish and demonstrate a framework for ethical, FAIR, provenanced,
      characterized and explainable AI-ready biomedical data.
    description: >-
      CM4AI defines AI-Ready biomedical data as fully characterized FAIR data
      of known provenance that can be ethically and reliably processed by AI
      applications, whose models and software are available and well described
      for validation and re-use, and whose predictions may be fully explained
      and interpreted. The project implements this through the FAIRSCAPE
      framework: rich metadata with persistent globally unique identifiers, a
      machine-readable provenance graph resolvable as metadata for all results,
      and JSON-Schema data dictionaries mapping data elements to public
      ontology vocabularies.

tasks:
  - name: Construction of hierarchical cell maps
    response: >-
      Construction of hierarchical, machine-readable maps of human subcellular
      architecture by integrating protein interaction and protein localization
      data through the Multi-Scale Integrated Cell (MuSIC) pipeline.
    description: >-
      Cell maps are hierarchical directed acyclic graphs in which each node
      represents an assembly of proteins in proximity at a given scale,
      spanning large assemblies representing cell compartments through to small
      protein complexes or subunits.
  - name: Training and interpretation of visible machine learning models
    response: >-
      Use of cell maps in AI tools for "visible machine learning" or "visible
      neural networks" (VNNs), which interrogate how protein assemblies in the
      cell affect cell-level phenotype predictions.
  - name: Mapping the effect of treatment and differentiation on cell architecture
    response: >-
      Comparison of cell architecture, protein interactions and transcriptional
      state between treated and untreated cancer cells and between
      undifferentiated and differentiated iPSCs.
    description: >-
      The release descriptions state that the data support analysis of cell
      architectural changes and interactions in the presence of specific
      disease processes, treatment conditions, or genetic perturbations.

addressing_gaps:
  - name: Uninterpretable genotype-phenotype models
    response: >-
      Machine learning models that analyse the human genome are typically
      difficult-to-interpret "black boxes"; CM4AI generates matched data and
      tools so that "visible" ML systems can instead be built directly on
      knowledge maps of cell and tissue architecture.
  - name: Absence of AI-ready, provenanced functional genomics data
    response: >-
      Existing functional genomics datasets generally lack the provenance
      graphs, schemas, data sheets, model cards and ethical documentation that
      CM4AI defines as necessary for a dataset to be AI-ready.
  - name: Uncharted subcellular architecture
    response: >-
      Much of the structure of human cells remains unmapped, and the individual
      mapping technologies (imaging, interaction proteomics, genetic
      perturbation) have typically been applied separately rather than
      integrated.

