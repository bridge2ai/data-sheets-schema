    name: Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta)
    title: Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta)
    doi: 10.18130/V3/F3TD5R
    version: '2.1'
    page: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
    license: CC BY-NC-SA 4.0
    status: Beta
    publisher: https://dataverse.lib.virginia.edu/
    total_file_count: 21
    description: >-
      A revision of the June 2025 Data Release of Cell Maps for Artificial
      Intelligence, described as adding RGB immunofluorescent images,
      corrections to RO-Crate metadata, and changes to naming conventions. The
      Beta release includes perturb-seq data in undifferentiated KOLF2.1J
      iPSCs; SEC-MS data in undifferentiated KOLF2.1J iPSCs, iPSC-derived NPCs,
      neurons, cardiomyocytes, and treated and untreated MDA-MB468 breast
      cancer cells; and IF images in MDA-MB-468 breast cancer cells in the
      presence and absence of chemotherapy (vorinostat and paclitaxel). This
      release is the first captured to carry the structured Data Governance and
      Ethics, Completeness, Maintenance Plan, Intended Use, Limitations,
      Prohibited Uses and Potential Sources of Bias blocks. The Dataverse
      record gives a publication date of 2025-07-01, a data creation date and
      deposit date of 2025-02-27, a depositor of Justin Niestroy, funding
      information "National Institutes of Health: 1OT2OD032742-01", production
      locations of University of California San Diego, University of California
      San Francisco, Stanford University and University of Virginia, and 256
      recorded downloads at capture. The release contains 21 public files,
      classified by the repository as 12 Text, 5 Data, 3 Archive and 1
      Metadata; the capture lists the first 10.
    source_caveats: >-
      The release page header gives "Version 2.1" while the data citation on
      the same page gives "V2"; the version recorded here is the page header
      value. The description block ends with "(2025-06-30)", one day before the
      stated publication date of 2025-07-01, and the meaning of the
      parenthesised date is not explained. Only 10 of the 21 files are visible
      in the capture, so the file inventory below is partial and its file_count
      values sum to 10 rather than to the release's stated total of 21. The
      three image archives are dated 2025-10-22, later than the release
      publication date.
