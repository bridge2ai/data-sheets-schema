    description: >-
      The October 2025 Data Release of Cell Maps for Artificial Intelligence.
      The release description states that CM4AI is generating multi-modal data
      including protein-protein interaction, spatial localization and genetic
      perturbation data in MDA-MB-468 breast cancer cells with and without
      paclitaxel or vorinostat and in iPSCs with and without differentiation,
      and that this Beta release includes perturb-seq data for MDA-MB-468 cells
      with and without treatment and for undifferentiated parental KOLF2.1J
      iPSCs; SEC-MS data for MDA-MB-468 cells with and without treatment, for
      undifferentiated KOLF2.1J iPSCs and for iPSC-derived neuron progenitor
      cells, neurons and cardiomyocytes; and IF images in MDA-MB-468 cells with
      and without treatment. The Dataverse record gives a publication date of
      2025-10-31, a data creation date and deposit date of 2025-02-27, a
      depositor of Justin Niestroy, funding information "National Institutes of
      Health: 1OT2OD032742-01", production locations of University of
      California San Diego, University of California San Francisco, Stanford
      University and University of Virginia, and 405 recorded downloads at
      capture, the highest of the captured releases.
    source_caveats: >-
      The release page header gives "Version 2.1" while the data citation on
      the same page gives "V2"; the version recorded here is the page header
      value. The description block carries the same trailing "(2025-06-30)" as
      the June 2025 release, which does not match this release's publication
      date of 2025-10-31. Two of the eight files are dated 22 December 2025,
      after the release publication date.
