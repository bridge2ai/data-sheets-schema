    status: Beta
    publisher: https://dataverse.lib.virginia.edu/
    total_file_count: 10
    description: >-
      The June 2026 Data Release of Cell Maps for Artificial Intelligence,
      presented on the CM4AI data releases page as the project's latest data
      release. The release description states that this Beta release includes
      perturb-seq data for MDA-MB-468 breast cancer cells with and without
      treatment and for undifferentiated parental KOLF2.1J iPSCs; SEC-MS data
      for MDA-MB-468 cells with and without treatment, for undifferentiated
      KOLF2.1J iPSCs and for iPSC-derived neuron progenitor cells, neurons and
      cardiomyocytes; AP-MS data for MDA-MB-468 breast cancer cells with
      treatment; and IF images in MDA-MB-468 cells with and without treatment.
      It is the first captured release to distribute AP-MS interactomes. The
      Dataverse record gives a publication date of 2026-06-17, a data creation
      date and deposit date of 2025-02-27, a depositor of Justin Niestroy,
      funding information "National Institutes of Health: 1OT2OD032742-01",
      production locations of University of California San Diego, University of
      California San Francisco, Stanford University and University of Virginia,
      and 181 recorded downloads at capture. Author affiliations on this
      release begin to use ROR identifiers, with the University of Virginia
      recorded as https://ror.org/0153tk833.
    source_caveats: >-
      The release page header gives "Version 2.0" while the data citation on
      the same page gives "V2"; the version recorded here is the page header
      value. This release page also carries the trailing "(2025-06-30)" in its
      description block, a year before its stated publication date. The CM4AI
      data releases page states that the June 2026 Data Release was "Released
      on: June 17, 2025", which disagrees with the Dataverse publication date
      of 2026-06-17. The release page carries no file-level descriptions, so
      the assay attribution of each file below is taken from its file name and
      from the release description. The three image archives are dated 15 July
      2026, after the release publication date, and their checksums differ from
      the identically named archives in the June 2025 and October 2025
      releases.
