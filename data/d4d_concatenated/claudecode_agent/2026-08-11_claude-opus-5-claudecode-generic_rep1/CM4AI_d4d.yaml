  - name: CM4AI project period and release schedule
    start_date: '2022-09-01'
    timeframe_details: >-
      The NIH RePORTER record gives a project start of 2022-09-01 and a project
      end of 2026-08-31. The Dataverse releases record a Data Creation Date and
      Deposit Date of 2025-02-27 for the March 2025, June 2025, October 2025
      and June 2026 releases. Release publication dates recorded on Dataverse
      are 2025-03-03 (March 2025), 2025-07-01 (June 2025), 2025-10-31 (October
      2025) and 2026-06-17 (June 2026). The maintenance plan on the release
      pages states that the dataset will be regularly updated and augmented
      through the end of the project in November 2026, with quarterly updates.
    source_caveats: >-
      Two different project end dates appear in the bundle: NIH RePORTER gives
      a project end of 2026-08-31, while the release pages state that the
      project ends in November 2026. Both are recorded here rather than one
      being selected. The Data Creation Date of 2025-02-27 is repeated
      unchanged on all four captured Dataverse releases, including the June
      2026 release whose files were published in 2026, so it does not describe
      the creation date of the later releases' content.

direct_collection:
  - name: Data derived from cultured cell lines rather than from individuals
    is_direct: false
    collection_details: >-
      All CM4AI data are generated from commercially or institutionally
      available human cell lines rather than collected from individuals. The
      MDA-MB-468 triple negative breast cancer line (RRID:CVCL_0419) was
      established from a metastatic pleural effusion of a 51-year-old black
      female with metastatic mammary adenocarcinoma and is available from ATCC.
      The KOLF2.1J iPSC line (RRID:CVCL_B5P3) was derived from a healthy male
      Northern European donor and is available from the Human Induced
      Pluripotent Stem Cells Initiative (HipSci) resource, accessible to
      not-for-profit organizations via a simple MTA. The 2024 preprint states
      that both cell lines have been ethically sourced.

raw_data_sources:
  - name: MDA-MB-468 triple negative breast cancer cell line
    source_description: >-
      MDA-MB-468 (RRID:CVCL_0419), a triple negative breast cancer cell line
      established from a metastatic site pleural effusion of a 51-year-old
      black female with a metastatic mammary adenocarcinoma. Extensively used
      to study triple-negative breast cancer and well characterized, with
      transcriptomic, mutational profile and whole-genome sequencing data
      available.
    source_type: human cancer cell line
    access_details: Available from ATCC.
  - name: KOLF2.1J induced pluripotent stem cell line
    source_description: >-
      KOLF2.1J (RRID:CVCL_B5P3), an induced pluripotent stem cell line derived
      from a healthy male Northern European donor, used undifferentiated and
      differentiated into neural progenitor cells, neurons and cardiomyocytes.
    source_type: human induced pluripotent stem cell line
    access_details: >-
      Available from the Human Induced Pluripotent Stem Cells Initiative
      (HipSci) resource, for access by not-for-profit organizations via a
      simple MTA.
  - name: Raw mass spectrometry files
    source_description: >-
      Raw mass spectrometry data underlying the SEC-MS and AP-MS results.
    source_type: mass spectrometry instrument output
    access_details: >-
      The release pages link SEC-MS data for KOLF2.1J iPSCs and for MDA-MB-468
      cells, and AP-MS data for paclitaxel- and vorinostat-treated MDA-MB-468
      cells, to the MassIVE Repository. The March 2025 release states of the
      SEC-MS KOLF2.1J dataset that "the data will be uploaded to Pride when
      available".
  - name: Raw CRISPRi perturbation sequence data
    source_description: >-
      Raw sequence data from the expressed genome-scale CRISPRi Perturbation
      Cell Atlas in KOLF2.1J hiPSCs.
    source_type: single-cell sequencing output
    access_details: >-
      Distributed within the releases as cm4ai_perturb-seq_KOLF2_raw_sra.zip
      (October 2025 and June 2026) and as an RO-Crate metadata record under
      "CRISPR Perturbation RNA Sequences - Raw Sequences" (March 2025). The
      June 2025 release links Sequence Read Archive (SRA) data via NCBI
      BioProject; the October 2025 and June 2026 release pages mark the
      perturb-seq external links as Embargoed.

raw_sources:
  - name: Raw data retention alongside processed data
    raw_data_details: >-
      Raw sequence data and raw immunofluorescence images are distributed
      alongside processed products: the releases include raw SRA sequence
      archives for the KOLF2.1J perturb-seq atlas and zipped raw IF image sets
      per treatment condition. Raw mass spectrometry files are linked to
      external repositories (MassIVE) rather than deposited in the Dataverse
      release, and some of those links are marked Embargoed.
    source_caveats: >-
      The bundle records the names of the external repositories but not their
      URLs, so no resolvable access point for the externally held raw mass
      spectrometry data can be transcribed from these sources.

preprocessing_strategies:
  - name: MuSIC data integration and map production pipeline
    preprocessing_details: >-
      The Multi-Scale Integrated Cell (MuSIC) pipeline, maintained by the CM4AI
      Tools Module, produces integrated cell maps from the multimodal input
      data streams in the following segments: (a) download of PPI networks from
      the Krogan Laboratory deposition archive and of IF images from the
      Lundberg Laboratory deposition archive; (b) generation of embeddings, in
      which PPI networks are processed with the node2vec deep learning model to
      reduce dimensionality and IF images are processed with a Human Protein
      Atlas deep learning model, producing a PPI embedding and an image
      embedding respectively; (c) co-embedding, in which the PPI and image
      embeddings are integrated by contrastive deep learning so that the
      original embeddings can be reconstructed with minimal information loss
      and proteins with similar inputs receive similar co-embeddings;
      (d) protein community detection over all-by-all similarities in the
      co-embedding space, yielding a hierarchy of protein communities as the
      final cell map; and (e) hierarchy evaluation. Each pipeline segment calls
      the FAIRSCAPE client package to validate its inputs and create the output
      RO-Crate package for that segment.
    used_software:
      - id: https://github.com/idekerlab/cellmaps_pipeline
        name: Cell Mapping Toolkit (cellmaps_pipeline)
        url: https://github.com/idekerlab/cellmaps_pipeline
        license: BSD-3
        description: >-
          A series of pip-installable Python packages implementing the
          end-to-end pipeline, including cellmaps_imagedownloader,
          cellmaps_ppidownloader, cellmaps_image_embedding,
          cellmaps_ppi_embedding, cellmaps_coembedding,
          cellmaps_generate_hierarchy and cellmaps_hierarchyeval. Documentation
          is hosted at https://cellmaps-pipeline.readthedocs.io/. The CM4AI
          preprint states that software comprising the Tools data integration
          pipeline is available under a BSD-3 open source licence in GitHub for
          alpha-level tools and in the Zenodo long-term archive for
          production-ready tools.
  - name: FAIRSCAPE AI-readiness packaging
    preprocessing_details: >-
      Packaging of data, software, metadata and provenance graphs is performed
      by the FAIRSCAPE framework. The client-side package, FAIRSCAPE-CLI, is
      called when a computation or coherent set of computations in the pipeline
      completes and is passed metadata defining JSON-Schema schemas for the
      datasets in the computational unit together with its inputs,
      computations, software, models and outputs; it creates an RO-Crate
      package containing the datasets, metadata and software, or resolvable
      references to them, and identifier stubs for each component. RO-Crates
      are then sent to the FAIRSCAPE server, where they are registered and
      assigned persistent, resolvable, globally unique identifiers under the
      ARK scheme, decomposed into their individual components, which are
      themselves registered and assigned identifiers, and end-to-end
      provenance entailments are computed and expressed in the EVI Evidence
      Graph Ontology. Identifiers resolve to machine- and human-readable
      landing pages expressed in JSON-LD using vocabularies from Schema.org,
      EVI and other public ontologies, with RDF-XML serialisations also
      provided.
    used_software:
      - id: https://fairscape.github.io
        name: FAIRSCAPE
        url: https://fairscape.github.io
        license: MIT
        description: >-
          Client-side and server-side Python3 packages, both pip-installable
          and freely available under the MIT open source licence. Copyright is
          held by the Rector and Board of Visitors of the University of
          Virginia.
    source_caveats: >-
      The preprint states that DOIs are a future feature as supplementary
      persistent identifiers for final-state publishable work; the ARK scheme
      is the identifier system described as currently in use for RO-Crate
      components, while the releases themselves carry Dataverse DOIs.

labeling_strategies:
  - name: Annotation of cell map assemblies
    data_annotation_protocol: >-
      Cell maps are annotated in a two-pronged approach. First, cell maps are
      aligned to known protein function and pathway resources, including the
      Gene Ontology and Reactome, to determine which protein assemblies in the
      cell map have high overlap with known cell biology. Second, assemblies
      are annotated using a large language model approach developed by the
      project to name sets of proteins and assign a name confidence score.
    labeling_details: >-
      Annotation is the hierarchy evaluation segment of the MuSIC pipeline,
      implemented in the cellmaps_hierarchyeval package.
    source_caveats: >-
      This annotation step applies to computed cell maps, which the release
      pages state are not included in the current releases. It is recorded
      because it is part of the documented pipeline that produces the project's
      deliverable, not because annotated maps are present in the released
      files.

is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    The 2024 project preprint states that CM4AI data are distinctive within
    Bridge2AI in being non-clinical, derived from tissue cultures, and are
    considered to be de-identified as they cannot be matched, with current
    knowledge, to a human subject. The June 2025, October 2025 and June 2026
    release pages record under Data Governance and Ethics: "Human Subjects: No;
    De-identified Samples: Yes; FDA Regulated: No".

human_subject_research:
  involves_human_subjects: false
  description: >-
    The release pages record "Human Subjects: No" and "FDA Regulated: No". The
    data are generated from established human cell lines rather than from human
    participants. No IRB approval number or ethics review board determination
    appears in any source in the bundle.

ethical_reviews:
  - name: CM4AI ethical review
    contact_person: https://orcid.org/0000-0002-7080-8801
    reviewing_organization: CM4AI Ethics Module
    review_details: >-
      The June 2025, October 2025 and June 2026 release pages name two ethical
      review contacts: Vardit Ravitsky (ravitskyv@thehastingscenter.org) and
      Jean-Christophe Belisle-Pipon
      (jean-christophe_belisle-pipon@sfu.ca). The 2024 preprint describes the
      Ethics team as working with the Data Acquisition, Tools and Standards
      modules to develop a plan for ethical preparation, licensing,
      dissemination and Data Access supervision of CM4AI datasets, balancing
      openness against protection of intellectual property and supervision of
      potential commercialisation. The team employs a methodology inspired by
      Value-Sensitive Design, has begun an axiological repository of values to
      guide design standards, and is formulating the CM4AI Life Cycle, a
      framework elucidating governance milestones throughout data generation
      and AI system development. The Ethics Pillar also supported the
      Bridge2AI Ethics Working Group and the Data Sharing and Dissemination
      Working Group in developing a Code of Conduct, which participants in the
      Bridge2AI Open House must attest and commit to before accessing B2AI data
      including CM4AI datasets.
    source_caveats: >-
      No institutional review board, ethics committee determination, approval
      number or review frequency is recorded in any source in the bundle; the
      review described is project-internal ethics governance rather than
      regulatory human subjects review, consistent with the releases' statement
      that the data do not involve human subjects.

existing_uses:
  - name: CM4AI CodeFest, March 2024
    examples:
      - >-
        Initial datasets, tools and standards from all three parallel mapping
        platforms were made available at the CM4AI CodeFest in March 2024,
        accompanied by detailed tutorials explaining how the data were derived
        and integrated and providing production-ready software for producing
        the datasets.
      - >-
        The inaugural virtual CodeFest event provided training to 38
        registrants, of whom 40% identified as female and 30% came from
        underrepresented communities.
    description: >-
      Reported in the 2024 project preprint as the first documented use of the
      released data by both within-project and external participants.

other_tasks:
  - name: Interpretation of genetic variants and mutations
    task_details: >-
      The 2024 preprint states that cell maps provide a foundation for
      downstream applications in human genomics, including interpretation of
      genetic variants and mutations.
  - name: Development of visible neural networks
    task_details: >-
      Cell maps have been used in AI tools for "visible machine learning" or
      "visible neural networks" to interrogate how protein assemblies in the
      cell affect cell-level phenotype predictions. The CM4AI in-person
      internship curriculum includes developing a visible neural network using
      cell maps and integrating external data into an existing cell map.

intended_uses:
  - name: Stated intended uses of the CM4AI data releases
    use_category: research
    examples:
      - AI-ready datasets to support research in functional genomics
      - AI model training
      - Cellular process analysis
      - >-
        Cell architectural changes and interactions in presence of specific
        disease processes, treatment conditions, or genetic perturbations
    usage_notes: >-
      The release pages state that the current release is most suitable for
      bioinformatics analysis of the individual datasets and that meaningful
      analysis requires domain expertise.

discouraged_uses:
  - name: Use as a source of computed or predicted cell maps
    discouragement_details: >-
      The releases state that computed cell maps are not included and that the
      release does not contain predicted cell maps, which will be added in
      future releases. The released content is the map-input data streams, so
      the current releases are not a source for the hierarchical cell maps
      themselves.

prohibited_uses:
  - name: Clinical decision-making or patient care
    prohibition_reason: >-
      The release pages state under "Prohibited Uses" that these laboratory
      data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and
      approval.
  - name: Commercial use without separate licence negotiation
    prohibition_reason: >-
      The data are licensed under CC BY-NC-SA 4.0, whose NonCommercial term
      prohibits use of the material for commercial purposes. The 2024 preprint
      states that commercial use requires a separate license negotiation with
      the copyright holder (UCSD, Stanford, and/or UCSF depending upon the
      specific data package in question), and that a Data Access Committee will
      supervise ethical matters related to dataset distribution and potential
      dual licensing for commercial use.

future_use_impacts:
  - name: Anticipated applications and governance of derived AI systems
    impact_details: >-
      The 2024 preprint states that CM4AI's ethical requirements involve
      anticipating potential applications of the data and derived AI/ML
      systems, integrating them into data governance frameworks to optimize
      benefits and mitigate potential risks, and promoting their use for the
      collective good. The Ethics team is developing a suite of tools intended
      to enhance awareness and comprehension of the ethical, legal and social
      ramifications associated with CM4AI data and the AI systems built on it.
      Because the released data derive from two cell lines and do not represent
      population-level biological variation, models trained on them inherit
      that restriction of scope.

distribution_formats:
  - name: Dataverse file download and access API
    media_type: application/zip
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/K7TGEM
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    description: >-
      Each release page states that the dataset is too large to download in
      full and that files must be selected individually from the files table.
      Files above the 953.7 MB ZIP download limit cannot be downloaded as a
      ZIP; the pages direct users to select smaller individual files or to use
      the Data Access API for programmatic access, and provide a package
      download URL prefix of
      https://dataverse.lib.virginia.edu/api/access/datafile/ for use with wget
      or a download manager. All files in the captured releases are listed with
      Public file access.
  - name: RO-Crate AI-ready data packages
    media_type: application/json
    format: RO-Crate (JSON-LD)
    description: >-
      CM4AI output data are packaged with provenance graphs and rich metadata
      as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework.
      Releases contain RO-Crate metadata documents at release level
      (release-ro-crate-metadata.json, described as a release RO-Crate with
      pointers to sub RO-Crates) and per data package, together with an HTML
      release datasheet (release-ro-crate-datasheet.html) and per-package
      provenance graph HTML files. The October 2025 and June 2026 releases
      collect this material into cm4ai_release_metadata.zip.
  - name: Provenance graph landing pages
    media_type: text/html
    description: >-
      FAIRSCAPE-generated persistent identifiers resolve to human- and
      machine-readable landing pages presenting a graphical view of the
      RO-Crate's evidence graph, with alternate views serialized in JSON-LD and
      RDF-XML. Provenance graph HTML files are also distributed inside the
      June 2025 release; their file descriptions note that these files require
      download to view properly and will not display in the Dataverse preview.

distribution_dates:
  - name: CM4AI quarterly release dates
    release_dates:
      - '2024-05'
      - '2025-03-03'
      - '2025-07-01'
      - '2025-10-31'
      - '2026-06-17'
    description: >-
      Dataverse publication dates for the March 2025 (2025-03-03), June 2025
      (2025-07-01), October 2025 (2025-10-31) and June 2026 (2026-06-17)
      releases. The CM4AI data releases page lists a May 2024 Data Release in
      its archive; the 2024 preprint, posted 2024-05-24, cites a University of
      Virginia Dataverse release at https://doi.org/10.18130/V3/DXWOS5, V1.
      Individual files within a release may carry later publication dates than
      the release itself: the June 2025 release's image archives are dated
      2025-10-22, the October 2025 release's raw SRA and metadata archives
      2025-12-22, and the June 2026 release's image archives 2026-07-15.
    source_caveats: >-
      The CM4AI data releases page presents the June 2026 Data Release (Beta),
      doi.org/10.18130/V3/HIGT4C, with "Released on: June 17, 2025", whereas
      the Dataverse record for the same DOI gives a publication date of
      2026-06-17. The two sources disagree on the year; both are recorded
      rather than one being selected.

third_party_sharing:
  - name: Open distribution to the research community
    is_shared: true
    description: >-
      The data are distributed publicly outside the creating institutions
      through LibraData, the University of Virginia's Dataverse instance, and
      linked external repositories. The 2024 preprint states that CM4AI's
      datasets and software are available to the research community under
      minimally restrictive terms consistent with ethical guidelines,
      researcher attribution and research integrity, and that the Teaming
      module supports open dissemination of CM4AI-generated data, maps and
      tools via the CM4AI web portal using the U-BRITE platform.

license_and_use_terms:
  name: CC BY-NC-SA 4.0 with attribution and citation requirements
  license_terms: >-
    All captured CM4AI data releases record their License/Data Use Agreement as
    CC BY-NC-SA 4.0, the Creative Commons Attribution-NonCommercial-ShareAlike
    4.0 International licence
    (https://creativecommons.org/licenses/by-nc-sa/4.0/). Under this licence
    users are free to share (copy and redistribute the material in any medium
    or format) and adapt (remix, transform and build upon the material), under
    three conditions: Attribution, requiring appropriate credit, a link to the
    licence and an indication of whether changes were made; NonCommercial,
    prohibiting use of the material for commercial purposes; and ShareAlike,
    requiring that contributions built on the material be distributed under the
    same licence. No additional legal or technological restrictions may be
    applied. Attribution requirements for CM4AI datasets specifically include
    attribution to the copyright holders and to the Cell Maps for Artificial
    Intelligence project as referenced in the datasets, and citation of the
    project preprint; the Dataverse release pages add that publications
    referencing the data or derived products should cite the Related
    Publication as well as directly citing the data collection. The Dataverse
    Community Norms recorded with each release expect that proper credit is
    given via citation, using the data citation shown on the dataset page.
    Commercial use requires a separate license negotiation with the copyright
    holder.
  data_use_permission: no_commercial_use

ip_restrictions:
  name: Copyright and commercial licensing restrictions
  restrictions:
    - >-
      Copyright (c) 2025 The Regents of the University of California, except
      where otherwise noted (stated on the March 2025 data release; the 2024
      preprint states the equivalent for 2024).
    - >-
      Spatial proteomics raw image data is copyright (c) 2025 The Board of
      Trustees of the Leland Stanford Junior University (stated on the March
      2025 data release; the 2024 preprint states the equivalent for 2024).
    - >-
      Commercial use requires a separate license negotiation with the copyright
      holder, which may be UCSD, Stanford and/or UCSF depending upon the
      specific data package in question.
    - >-
      A Data Access Committee will supervise ethical matters related to dataset
      distribution and potential dual licensing for commercial use.
    - >-
      Copyright in the FAIRSCAPE AI-readiness framework software is held by the
      Rector and Board of Visitors of the University of Virginia and it is
      released under the MIT licence; the Tools data integration pipeline is
      released under a BSD-3 licence.
  description: >-
    The 2024 preprint states that attribution requirements include attribution
    to the copyright holding institutions as referenced in the datasets. The
    Dataverse pages carry the additional footer notice "Copyright (c) 2025, by
    the Rector and Visitors of the University of Virginia" for the repository
    itself.

regulatory_restrictions:
  name: Data governance and regulatory status
  regulatory_restrictions:
    - >-
      Participants in the Bridge2AI Open House must attest and commit to a Code
      of Conduct prior to accessing B2AI data, including CM4AI datasets.
  other_compliance: >-
    The Data Governance and Ethics block of the June 2025, October 2025 and
    June 2026 releases records "FDA Regulated: No" and "Human Subjects: No,
    De-identified Samples: Yes". No other regulatory framework is named as
    applicable in any source in the bundle; HIPAA, GDPR and export control
    regimes are not mentioned.
  confidentiality_level: unrestricted
  governance_committee_contact: https://orcid.org/0000-0003-4535-3486
  description: >-
    The June 2025, October 2025 and June 2026 release pages name Jillian Parker
    (jillianparker@health.ucsd.edu) as the Data Governance Committee contact. All files in the captured
    releases are listed with Public file access, which is why the
    confidentiality level is recorded as unrestricted; the externally linked
    perturb-seq datasets are separately marked Embargoed on the October 2025
    and June 2026 release pages.
  source_caveats: >-
    The ORCID recorded here for Jillian Parker is that of "Parker J (University
    of California, San Diego)" in the same releases' author lists; the sources
    do not state explicitly that the governance contact and the author are the
    same person, though the name and institution match. The 2024 preprint's
    author list instead contains "Jillian Mohan" at the University of
    California San Diego, and the bundle does not state any relationship
    between the two names.

maintainers:
  - name: University of Virginia Dataverse (LibraData)
    role: academic_institution
    maintainer_details: >-
      The release pages state that long-term preservation is in the University
      of Virginia Dataverse, supported by committed institutional funds.
      LibraData is the University of Virginia's instance of Dataverse, an
      NIH-approved generalist repository, and the CM4AI collection sits under
      University of Virginia Dataverse > LibraData: UVa's Scholarly Research >
      School of Medicine > Cell Maps for Artificial Intelligence. The depositor
      of record for all four captured releases is Justin Niestroy.
  - name: CM4AI project management
    role: academic_institution
    maintainer_details: >-
      The CM4AI project site names Swathi Thaker, PhD, UAB, Program Manager
      (snthaker@uab.edu) for project-related inquiries and Zhandos Sembay, UAB
      (zsembay8@uab.edu) for website support and updates. Trey Ideker
      (University of California San Diego) is recorded as Point of Contact on
      each Dataverse release.
  - name: CM4AI Standards Module
    role: researcher
    maintainer_details: >-
      The Standards Module is responsible for AI-readiness packaging of data,
      software, metadata and provenance graphs, and maintains the FAIRSCAPE
      client and server packages that register RO-Crates and their components
      and assign them persistent identifiers.

errata:
  - name: June 2025 Data Release revision
    erratum_url: https://doi.org/10.18130/V3/F3TD5R
    erratum_details: >-
      The June 2025 Data Release page describes the captured version as a
      revision of the June 2025 Data Release, stating that the revision
      includes adding RGB immunofluorescent images, corrections to RO-Crate
      metadata, and changes to naming conventions. The page is captured at
      version 2.1 and notes that the DRAFT version was not found.
  - name: Immunofluorescence image archives replaced between releases
    erratum_details: >-
      The three MDA-MB-468 immunofluorescence image archives
      (cm4ai_ifimages_MDA-MB-468_paclitaxel.zip, _untreated.zip and
      _vorinostat.zip) carry identical MD5 checksums in the June 2025 and
      October 2025 releases (0d972b80744344ddeede516a0cf6e3d7,
      a98affcc05429650c6bb3906cd836d55 and ad4e68ccc14b0f3349dad3321e7b81b2
      respectively) but different MD5 checksums in the June 2026 release
      (6c1a86520eec2696ec19444eb8a8b428, 6d066e6b9d762284c6aa5d0b44565568 and
      df79632753989ef23b0a3df6604d4af1), while the stated file sizes are
      unchanged at 3.8 GB, 4.6 GB and 4.2 GB.
    source_caveats: >-
      The checksum change is visible in the captured release pages; no source
      in the bundle states what changed in the June 2026 image archives or
      whether the change was a correction.

updates:
  name: Quarterly release plan
  frequency: Quarterly
  update_details: >-
    The Maintenance Plan recorded on the June 2025, October 2025 and June 2026
    release pages states that the dataset will be regularly updated and
    augmented through the end of the project in November 2026, that updates are
    on a quarterly basis, and that long-term preservation is in the University
    of Virginia Dataverse supported by committed institutional funds. The March
    2025 release description states that data presented there will be augmented
    regularly through the end of the project. The CM4AI data releases page
    states that CM4AI will deliver machine-readable hierarchical maps of cell
    architecture as AI-ready data together with quarterly data releases of
    map-input data streams, and answers the question "When will the next Data
    Release be available?" with "CM4AI releases data quarterly, ensuring
    continuous updates to the cell maps and input data streams."

version_access:
  name: Release versions and long-term availability
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
    - 'Cell Maps for Artificial Intelligence - Data Release, https://doi.org/10.18130/V3/DXWOS5, V1'
    - 'Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta), https://doi.org/10.18130/V3/B35XWX, Dataverse V1, page version 1.4'
    - 'Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta), https://doi.org/10.18130/V3/F3TD5R, Dataverse V2, page version 2.1'
    - 'Cell Maps for Artificial Intelligence - October 2025 Data Release (Beta), https://doi.org/10.18130/V3/K7TGEM, Dataverse V2, page version 2.1'
    - 'Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta), https://doi.org/10.18130/V3/HIGT4C, Dataverse V2, page version 2.0'
  version_details: >-
    Each quarterly release is deposited as a separate Dataverse dataset with
    its own DOI, and earlier releases remain individually resolvable and
    downloadable. The CM4AI data releases page presents the June 2026 Data
    Release as the latest release and lists May 2024, March 2025, June 2025 and
    October 2025 Data Releases in an Archive section. Long-term preservation is
    stated to be in the University of Virginia Dataverse, supported by
    committed institutional funds. Within a release, Dataverse offers minor and
    major version updates; the captured pages show version numbers both in the
    citation (V1, V2) and in the page header (1.4, 2.0, 2.1).
  source_caveats: >-
    Both the Dataverse collection landing pages and the CM4AI web pages carry
    the notice "This repository is under review for potential modification in
    compliance with Administration directives", which bears on future
    availability but is not explained further in any source.

external_resources:
  - name: External data repositories linked from the release pages
    external_resources:
      - MassIVE Repository
      - NCBI BioProject (Sequence Read Archive)
      - Figshare
    restrictions:
      - >-
        Perturb-seq data in KOLF2.1J iPSCs (undifferentiated) is listed as
        Embargoed on the October 2025 and June 2026 release pages.
      - >-
        Perturb-seq data in MDA-MB-468 breast cancer cells (with and without
        treatment) is listed as Embargoed on the October 2025 and June 2026
        release pages.
      - >-
        The release pages state that some datasets are under temporary
        pre-publication embargo.
    description: >-
      The June 2025 release links Sequence Read Archive data via NCBI
      BioProject and mass spectrometry data for human iPSCs and human cancer
      cells to the MassIVE Repository. The October 2025 release links SEC-MS
      data for KOLF2.1J iPSCs and for MDA-MB-468 cells to MassIVE and marks
      both perturb-seq links Embargoed. The June 2026 release adds a Figshare
      link for the CRISPRi Perturbation Atlas of iPSCs and MassIVE links for
      AP-MS data in paclitaxel-treated and vorinostat-treated MDA-MB-468 cells.
    source_caveats: >-
      The captured pages record the labels of these external links but not
      their target URLs, so no resolvable address for any of them can be
      transcribed from the bundle. The March 2025 release additionally states
      of its SEC-MS data that "the data will be uploaded to Pride when
      available".
  - name: CM4AI software and AI-readiness framework
    external_resources:
      - https://fairscape.github.io
      - https://github.com/idekerlab/cellmaps_pipeline
      - https://cellmaps-pipeline.readthedocs.io/
      - https://integrativemodeling.org
    archival: false
    future_guarantees: >-
      The 2024 preprint states that production-ready tools are archived in
      Zenodo for the long term, while alpha-level tools are in GitHub, and that
      software packages will be versioned as the project progresses with the
      version used to produce each dataset referenced in that dataset's
      metadata. Links to these tools are packaged in RO-Crates as part of CM4AI
      provenance representations.
    description: >-
      FAIRSCAPE is described with a tutorial and installation instructions at
      fairscape.github.io and is available under the MIT licence. The Cell
      Mapping Toolkit implementing the MuSIC pipeline is released as a series
      of Python PyPI packages at github.com/idekerlab/cellmaps_pipeline under
      a BSD-3 licence, with documentation at cellmaps-pipeline.readthedocs.io.
      The open source Integrative Modeling Platform (IMP) package, version 2.18
      of which was used for integrative structure modelling of MuSIC
      communities, is available at integrativemodeling.org.
    used_software:
      - id: https://fairscape.github.io
        name: FAIRSCAPE
        url: https://fairscape.github.io
        license: MIT
      - id: https://github.com/idekerlab/cellmaps_pipeline
        name: Cell Mapping Toolkit (cellmaps_pipeline)
        url: https://github.com/idekerlab/cellmaps_pipeline
        license: BSD-3
      - id: https://integrativemodeling.org
        name: Integrative Modeling Platform (IMP)
        version: '2.18'
        url: https://integrativemodeling.org
  - name: Publications describing the dataset and its methods
    external_resources:
      - https://doi.org/10.1101/2024.05.21.589311
      - https://doi.org/10.1101/2024.11.03.621734
      - https://doi.org/10.1038/s41586-025-08878-3
    description: >-
      The Dataverse releases record as Related Publication the CM4AI project
      preprint (Clark T, Parker J, Schaffer L, Obernier K, Al Manir S, Churas
      CP, Dailamy A, Doctor Y, Forget A, Hansen JN, Hu M, Lenkiewicz J,
      Levinson MA, Marquez C, Nourreddine S, Niestroy J, Pratt D, Qian G,
      Thaker S, Belisle-Pipon JC, Brandt C, Chen J, Ding Y, Fodeh S, Krogan N,
      Lundberg E, Mali P, Payne-Foster P, Ratcliffe S, Ravitsky V, Sali A,
      Schulz W, Ideker T. Cell Maps for Artificial Intelligence: AI-Ready Maps
      of Human Cell Architecture from Disease-Relevant Cell Lines. 2024. doi:
      10.1101/2024.05.21.589311), which is available under a CC-BY-NC-ND 4.0
      International licence. The March 2025 and June 2025 releases additionally
      reference the Perturbation Cell Atlas preprint (Nourreddine S, Doctor Y,
      Dailamy A, Forget A, Lee YH, Chinn B, Khaliq H, Polacco B, Muralidharan
      M, Pan E, Zhang Y, Sigaeva A, Hansen JN, Gao J, Parker JA, Obernier K,
      Clark T, Chen JY, Metallo C, Lundberg E, Ideker T, Krogan N, Mali P. A
      Perturbation Cell Atlas of Human Induced Pluripotent Stem Cells. bioRxiv
      2024 Nov 4; 2024.11.03.621734; PMCID PMC11580897; doi:
      10.1101/2024.11.03.621734). The bundle also contains Schaffer LV, Hu M,
      Qian G et al., "Multimodal cell maps as a foundation for structural and
      functional genomics", Nature 642:222-231 (2025), doi:
      10.1038/s41586-025-08878-3, an open access article acknowledging
      Bridge2AI Program funding OT2 OD032742; a Publisher Correction was
      published on 2 October 2025 (doi: 10.1038/s41586-025-09648-x) and a
      further correction to the Acknowledgements on 29 April 2025.
    source_caveats: >-
      The Nature 2025 article reports a multimodal cell map of U2OS
      osteosarcoma cells built from Human Protein Atlas imaging and BioPlex-
      style AP-MS data. It is not one of the CM4AI cell lines, and its data are
      distributed through NDEx, MassIVE, ProteomeXchange, the EBI Complex
      Portal and ModelArchive rather than through the CM4AI Dataverse releases.
      It is recorded here as a related publication of the same investigator
      group rather than as part of this dataset.
  - name: U2OS multimodal cell map resources (Nature 2025 study)
    external_resources:
      - http://musicmaps.ai/u2os-cellmap/
      - https://ndexbio.org
      - https://www.ebi.ac.uk/complexportal
      - https://modelarchive.org
    description: >-
      The Nature 2025 article makes its U2OS cell map available at
      musicmaps.ai/u2os-cellmap through the Multiscale Integrated Cell
      visualization portal, at NDEx under uuid
      f693137a-d2d7-11ef-8e41-005056ae3c32, and at the EBI Protein Complex
      Portal under the query CLO:0009454; its AP-MS protein interaction data
      are at NDEx under uuid 95bc75d5-d1d1-11ee-8a40-005056ae23aa; raw AP-MS
      mass spectrometry files are at MassIVE under MSV000097168; SEC-MS raw
      files and search results are at ProteomeXchange under PXD052362; and
      structural models are at ModelArchive under the identifiers
      ma-idk-u2osmap and ma-m5og4. The 2024 CM4AI preprint separately records
      that CM4AI cell maps are shared via the Network Data Exchange (NDEx) and
      can be visualized in a web browser or accessed with Cytoscape, HiView and
      the Python ndex2 library.
    source_caveats: >-
      These identifiers belong to the U2OS cell map study rather than to the
      CM4AI Dataverse data releases; they are recorded to keep the two
      distinguishable rather than as access points for this dataset.

