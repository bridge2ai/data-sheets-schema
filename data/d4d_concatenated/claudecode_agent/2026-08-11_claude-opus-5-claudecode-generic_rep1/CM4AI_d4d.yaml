instances:
  - name: Immunofluorescence confocal images of subcellular protein localization
    instance_type: immunofluorescence confocal microscopy image
    data_topic: http://purl.obolibrary.org/obo/GO_0008104
    counts: 53788
    label: true
    label_description: >-
      Each image is associated with the protein of interest that was
      immunostained. Each IF image contains four colour channels: the protein
      of interest (green), nuclei stained with DAPI (blue), endoplasmic
      reticulum stained with a calreticulin antibody (yellow) and microtubules
      stained with a tubulin antibody (red).
    description: >-
      Images display the spatial localization of proteins of interest in cells
      of the MDA-MB-468 breast cancer line, untreated or treated with
      paclitaxel or vorinostat, imaged by immunofluorescence-based staining
      (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford
      University. The March 2025 release describes 563 proteins of interest per
      condition; the June 2025, October 2025 and June 2026 releases describe
      464 proteins of interest per condition. The count given here is the
      53,788 immunofluorescent images reported on the CM4AI project site.
    source_caveats: >-
      The 53,788 figure is a project-level "Data Insights" total on cm4ai.org
      and cm4ai.org/data-releases with no stated release scope or capture date;
      no per-release image count appears in the bundle. Three different protein
      counts for the same IF imaging arm appear in the bundle and are not
      reconciled by any source: 563 proteins of interest per condition in the
      March 2025 release file descriptions, 464 in the June 2025, October 2025
      and June 2026 file descriptions, and "IF images for 523 proteins" in the
      Flagship Datasets block of the CM4AI data releases page. The change from
      563 to 464 is not explained anywhere in the bundle.
  - name: SEC-MS protein elution profiles
    instance_type: size-exclusion chromatography mass spectrometry protein profile
    data_topic: http://purl.obolibrary.org/obo/NCIT_C18469
    description: >-
      Protein-protein interaction data generated by size-exclusion
      chromatography coupled to mass spectrometry in the Nevan Krogan
      laboratory at the University of California San Francisco, for
      undifferentiated KOLF2.1J iPSCs and iPSC-derived neural progenitor cells,
      neurons and cardiomyocytes, and for MDA-MB-468 cells untreated or treated
      with vorinostat or paclitaxel. The CM4AI data releases page states that
      the curated SEC-MS data capture approximately 7,000 proteins for both the
      iPSC and the TNBC arms.
    source_caveats: >-
      The 2024 preprint reports earlier interim figures for the same assay: 72
      of 100 chromatin modifiers identified in MDA-MB-468 by SEC-MS, 52 of them
      integral components of protein complexes, PPI profiles for over a
      thousand complexes in MDA-MB-468, and more than 700 protein complexes in
      parental iPSCs and differentiated neurons. These are progress figures
      from Year 1 rather than release-level counts.
  - name: AP-MS protein interaction data
    instance_type: affinity purification mass spectrometry interaction dataset
    data_topic: http://purl.obolibrary.org/obo/NCIT_C18469
    description: >-
      Affinity purification mass spectrometry data on endogenously tagged
      MDA-MB-468 cells, first distributed in the June 2026 release for
      paclitaxel- and vorinostat-treated cells. The 2024 preprint reports that
      17 genes had been endogenously tagged in MDA-MB-468 with AP-MS data
      acquired under three conditions (untreated, paclitaxel, vorinostat), and
      that tagging of 34 additional genes was in progress.
    source_caveats: >-
      The June 2026 release description states "AP-MS data for MDA-MB-468
      breast cancer cells + treatment" and the release contains AP-MS files for
      the paclitaxel and vorinostat conditions only, whereas the 2024 preprint
      describes AP-MS acquisition under three conditions including untreated.
      No untreated AP-MS file appears in any captured release. The Flagship
      Datasets block of the CM4AI data releases page still lists "AP-MS
      interactomes (coming soon!)" for the TNBC arm on the same page that
      presents the June 2026 release, which distributes them; the same block
      lists "IF images (coming soon!)" for the iPSC arm, for which no IF image
      archive appears in any captured release.
  - name: Single-cell CRISPRi perturb-seq profiles
    instance_type: single-cell CRISPR interference perturbation transcriptome
    data_topic: http://www.ebi.ac.uk/efo/EFO_0008860
    counts: 11739
    description: >-
      An expressed genome-scale CRISPRi Perturbation Cell Atlas in
      undifferentiated KOLF2.1J human induced pluripotent stem cells, mapping
      transcriptional and fitness phenotypes associated with 11,739 targeted
      genes, together with the corresponding raw sequence data. Perturb-seq
      data for MDA-MB-468 breast cancer cells with and without treatment are
      described in the October 2025 and June 2026 release descriptions. The
      2024 preprint describes single-cell CRISPR screens perturbing 100
      chromatin regulators in MDA-MB-468 under three conditions and in
      undifferentiated KOLF2.1J, using a lentiviral library with 6 guide RNAs
      per gene and the 10x Genomics 3'HT kit, on lines expressing inducible
      dCas9. The Flagship Datasets block of the CM4AI data releases page
      describes the curated TNBC arm as covering untreated (DMSO control),
      vorinostat and paclitaxel conditions with "Perturb-seq of 200 genes", and
      the curated iPSC arm as "Perturb-seq of >11,000 genes (whole-genome)".
    source_caveats: >-
      The counts value is the number of targeted genes stated in the perturb-seq
      file descriptions and matches the "genes targeted 11,739" figure on the
      project site; it is a count of perturbation targets, not of cells or of
      sequenced instances, which no source reports.

known_biases:
  - name: Cell lines do not represent population-level biological variation
    bias_type: representation_bias
    bias_description: >-
      The release pages state under "Potential Sources of Bias" that data in
      the release were derived from commercially available de-identified human
      cell lines and do not represent all biological variants which may be seen
      in the population at large.
    affected_subsets:
      - 'All assays in the release, which derive from two cell lines: MDA-MB-468 and KOLF2.1J'
    description: >-
      MDA-MB-468 was established from a metastatic pleural effusion of a
      51-year-old black female with metastatic mammary adenocarcinoma;
      KOLF2.1J was derived from a healthy male Northern European donor. All
      released measurements therefore derive from two donor genetic
      backgrounds.

known_limitations:
  - name: Interim release
    limitation_type: scope_limitation
    limitation_description: >-
      The release pages state that this is an interim release and that the data
      are not yet in completed final form.
    scope_impact: >-
      Content and coverage change between quarterly releases; figures and file
      inventories are specific to the release in which they appear.
  - name: Computed cell maps not included
    limitation_type: coverage_limitation
    limitation_description: >-
      The releases state that computed cell maps are not included, and that the
      release does not contain predicted cell maps, which will be added in
      future releases.
    scope_impact: >-
      The released data are the map-input data streams rather than the
      hierarchical cell maps that are the project's stated deliverable.
  - name: Incompletely overlapping protein sets across assays
    limitation_type: integration_limitation
    limitation_description: >-
      The releases state that the protein-protein interaction (SEC-MS), protein
      localization (IF imaging) and CRISPRi perturb-seq data interrogate sets of
      proteins which incompletely overlap.
    scope_impact: >-
      The release pages state that the current release is most suitable for
      bioinformatics analysis of the individual datasets rather than for
      integrated multimodal analysis.
  - name: Some datasets under temporary pre-publication embargo
    limitation_type: coverage_limitation
    limitation_description: >-
      The releases state under "Completeness" that some datasets are under
      temporary pre-publication embargo. On the October 2025 and June 2026
      release pages the external links for perturb-seq data in KOLF2.1J iPSCs
      and in MDA-MB-468 cells are marked "Embargoed".
  - name: Requires domain expertise
    limitation_type: methodological_limitation
    limitation_description: >-
      The releases state that meaningful analysis of these data requires domain
      expertise.

sampling_strategies:
  - name: Targeted selection of proteins and genes for interrogation
    is_sample: true
    is_representative: false
    source_data: >-
      The human proteome and the expressed human genome, in two cultured human
      cell lines.
    strategies: >-
      Targeted selection of 100 chromatin modifiers and 100 metabolic enzymes
      involved in cancer, neuropsychiatric and cardiac disorders, extended to
      other proteins of interest; genome-scale CRISPRi perturbation of 11,739
      targeted genes in KOLF2.1J iPSCs; IF imaging of 563 (March 2025) or 464
      (later releases) proteins of interest per treatment condition in
      MDA-MB-468.
    why_not_representative: >-
      The release pages state that the data derive from commercially available
      de-identified human cell lines and do not represent all biological
      variants which may be seen in the population at large. The 2024 preprint
      further notes that for Year 1 spatial proteomics mapping covered 100
      chromatin regulators, with another 500 proteins pending significant hits
      from the genetic perturbation and PPI results.
    description: >-
      The 2024 preprint states that the shared list of proteins is deliberately
      common across cell types and treatment conditions, so that deep
      multi-modal data are generated for the same proteins throughout.

acquisition_methods:
  - name: Direct laboratory measurement in cultured human cell lines
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    acquisition_details: >-
      All instances are laboratory measurements acquired directly from cultured
      human cell lines by mass spectrometry, confocal microscopy and
      single-cell sequencing. No data are collected from human subjects; the
      release pages record "Human Subjects: No".
  - name: Computationally derived embeddings and cell maps
    was_directly_observed: false
    was_inferred_derived: true
    acquisition_details: >-
      Derived products, including modality-specific embeddings, co-embeddings
      and hierarchical cell maps, are computed from the measured input data
      streams by the MuSIC pipeline. The releases state that computed cell maps
      are not included in the current releases.

collection_mechanisms:
  - name: Affinity purification mass spectrometry (AP-MS)
    mechanism_details: >-
      AP-MS on endogenously tagged cell lines, used to map protein-protein
      interactions of chromatin regulators under different conditions. The 2024
      preprint reports 17 genes endogenously tagged in MDA-MB-468 with AP-MS
      data acquired for untreated, paclitaxel-treated and vorinostat-treated
      conditions, and 34 additional genes in the process of being tagged.
    description: >-
      Performed as part of the Data Acquisition module. AP-MS interactomes for
      MDA-MB-468 were first distributed in the June 2026 release.
  - name: Size-exclusion chromatography mass spectrometry (SEC-MS)
    mechanism_details: >-
      Size-exclusion chromatography coupled to mass spectrometry for
      proteome-wide complex and interaction mapping, applied as an orthogonal
      mass spectrometry approach alongside AP-MS. Performed in the Nevan Krogan
      laboratory at the University of California San Francisco on MDA-MB-468
      cells under three conditions (untreated, paclitaxel, vorinostat) and on
      KOLF2.1J iPSCs and their derivatives.
  - name: Immunofluorescence confocal imaging (spatial proteomics)
    mechanism_details: >-
      Immunofluorescence-based staining (ICC-IF) and confocal microscopy in the
      Lundberg Lab at Stanford University, using the Human Protein Atlas
      resource of antibodies. Automated fixation and permeabilization protocols
      were established for a pipetting robot for the MDA-MB-468 and KOLF2 cell
      lines. Each image carries four channels: protein of interest (green),
      nuclei with DAPI (blue), endoplasmic reticulum with a calreticulin
      antibody (yellow) and microtubules with a tubulin antibody (red).
  - name: Single-cell CRISPR interference perturbation screens
    mechanism_details: >-
      Single-cell CRISPR screens using a CRISPR lentiviral library targeting
      chromatin factors with 6 guide RNAs per gene, in MDA-MB-468 and KOLF2
      lines engineered to express inducible dCas9, read out with the 10x
      Genomics 3'HT kit. The released KOLF2.1J Perturbation Cell Atlas is
      described as expressed genome-scale, covering 11,739 targeted genes.

data_collectors:
  - name: Nevan Krogan laboratory, University of California San Francisco
    role: laboratory generating protein-protein interaction data
    collector_details: >-
      Named in the CM4AI release file descriptions as the laboratory that
      generated the SEC-MS data on undifferentiated KOLF2.1J iPSCs and on
      MDA-MB-468 cells following treatment with vorinostat or paclitaxel. The
      2024 preprint records that PPI networks are downloaded from the Krogan
      Laboratory's deposition archive for processing by the MuSIC pipeline.
  - name: Emma Lundberg laboratory, Stanford University
    role: laboratory generating spatial proteomics image data
    collector_details: >-
      Named in the CM4AI release file descriptions as the laboratory in which
      the immunofluorescence images of MDA-MB-468 cells were acquired. The 2024
      preprint records that IF images are downloaded from the Lundberg
      Laboratory's deposition archive for processing by the MuSIC pipeline.
      Raw image data for spatial proteomics is copyrighted to The Board of
      Trustees of the Leland Stanford Junior University.
  - name: CM4AI Data Acquisition module, University of California San Diego
    role: genetic perturbation mapping
    collector_details: >-
      The 2024 preprint attributes the single-cell CRISPR perturbation screens
      to the CM4AI Data Acquisition module; the Perturbation Cell Atlas
      preprint cited as a Related Publication on the releases is led from the
      University of California San Diego with Prashant Mali as senior author.
    source_caveats: >-
      No source in the bundle names a specific laboratory for the perturb-seq
      data in the way the SEC-MS and IF file descriptions name the Krogan and
      Lundberg laboratories.

