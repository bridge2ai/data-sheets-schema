  - bridge2ai
  - voice
source_caveats: >-
  Five of the six documents in the declared bundle (the USF IRB protocol, the
  project documentation site, the NIH RePORTER page, the Data Transfer and Use
  Agreement and the documentation repository README) are shared with the adult
  Bridge2AI-Voice project and are written mainly about the adult cohort or
  about the Bridge2AI-Voice programme as a whole. Only the PhysioNet page for
  b2ai-voice-pediatric 1.1.0 is scoped to this dataset. Figures that belong to
  the adult release have therefore been excluded from this record: the 833
  participants and roughly 61,937 voice-derived recordings, the v2.0.0/v3.0.0
  and v3.1.0 version numbers, the "around 833 instances" and 12-month
  collection-window answers in the documentation healthsheet, the Health Data
  Nexus hosting and semi-annual release cadence described for the earlier
  feature-only release, the BIDS folder tree, which is presented for
  b2ai-voice-audio and enumerates adult-only phenotype files such as
  adhd_adult.tsv and ptsd_adult.tsv, and the labelling, existing-use and
  data-protection-impact answers of the healthsheet, which are answered for the
  adult release. Where a programme-level statement has been used it is
  attributed in the slot that carries it. The pediatric collection window is
  not stated anywhere in the bundle, so collection_timeframes is absent rather
  than inferred from the release dates or the award period. Grant identifiers
  disagree between sources and are recorded separately under funders rather
  than merged.

