is_deidentified:
  id: deidentification_pediatric_release
  name: De-identification of the pediatric release
  identifiable_elements_present: false
  method: >-
    Raw audio waveforms are excluded from the published release and only derived
    features are distributed. Free-speech task features published in v1.1 were
    manually checked for the presence of unconsented speakers and personally
    identifiable information, and spectrograms, Mel spectrograms, MFC
    coefficients, PPGs and EMAs for sensitive records and audio checks were
    removed from v1.1. Participants are identified only by a study
    identification number assigned at enrollment.
  identifiers_removed: >-
    The Bridge2AI-Voice de-identification description states that all direct
    identifiers were removed, including name, civic address and social security
    numbers; that indirect identifiers were removed where these created a
    significant risk of participant re-identification, including select
    geographic or demographic identifiers and some information about household
    composition or cultural identity; and that non-identifying elements of data
    revealing highly sensitive information, such as household income, mental
    health status and traumatic life experiences, were also removed.
  deidentification_details: >-
    The project documentation records the level of de-identification as
    identifiable information under HIPAA and the Common Rule, as well as data
    considered sensitive, having been removed, and answers that the dataset
    removes direct identifiers, applies the HIPAA de-identification rules,
    rebases or replaces dates by integers, removes or generalizes geographic
    information and removes narrative text fields, but does not achieve
    K-anonymization at k greater than or equal to two. The release page states
    that the pediatric release contains data considered low risk, including
    derivations such as spectrograms but not the original voice recordings.
  source_caveats: >-
    The de-identification answers and the identifier list quoted here come from
    the Bridge2AI-Voice documentation's data governance page, whose detailed
    method section is headed for the adult v3.0.0 release; only the low-risk
    characterisation, the exclusion of raw audio and the v1.1 manual check are
    stated for the pediatric release itself.

