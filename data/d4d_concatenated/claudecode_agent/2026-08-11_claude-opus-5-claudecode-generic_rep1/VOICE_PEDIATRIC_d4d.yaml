id: https://doi.org/10.13026/mf9s-5r03
name: Bridge2AI-Voice Pediatric Dataset
title: Bridge2AI-Voice Pediatric Dataset v1.1.0
description: >-
  The Bridge2AI-Voice Pediatric Dataset is a credentialed-access PhysioNet
  database of derived audio features and linked phenotypic data collected from
  children. Version 1.1.0 contains derived audio features for 23,533 recordings
  collected from 300 participants aged 2-18. The release contains data
  considered low risk, including derivations such as spectrograms, but not the
  original voice recordings; detailed demographic, clinical and validated
  questionnaire data are also made available. Participants were patients and
  healthy volunteers at the Hospital for Sick Children who met the inclusion
  criteria of 2 to 18 years of age and English proficiency; non-patients were
  recruited through research postings. Data were collected in a single session
  on tablets using customized software (reproschema-ui) with the
  Bridge2AI-Voice pediatric protocol, following parental or participant
  consent. The dataset is part of the Bridge2AI-Voice project, which seeks to
  create an ethically sourced flagship dataset of voice linked to health
  information to enable artificial intelligence research into voice as a
  biomarker of health.
version: '1.1.0'
doi: https://doi.org/10.13026/h995-bt35
page: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
publisher: https://physionet.org/
license: Bridge2AI Voice Registered Access License
language: English
conforms_to: Brain Imaging Data Structure (BIDS)
was_derived_from: >-
  Raw audio waveform recordings and questionnaire responses collected from
  pediatric participants under the Bridge2AI-Voice pediatric protocol; the
  published release contains features derived from those waveforms rather than
  the waveforms themselves.
citation: >-
  Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M., Dorr, D.,
  Payne, P., Ravitsky, V., Belisle-Pipon, J., Bahr, R., Watts, S., Bolser, D.,
