    name: Bridge2AI-Voice dataset (adult)
    description: >-
      The Bridge2AI-Voice Adult Dataset is a separate PhysioNet project covering
      the adult cohort of the same Bridge2AI-Voice study, under its own protocol
      and its own ethics approval. The pediatric PhysioNet page points readers
      to it at https://physionet.org/content/b2ai-voice/, and the project
      documentation site describes the adult and pediatric featurized datasets
      as available through separate PhysioNet links under registered access.
    source_caveats: >-
      The bundle states only that the adult dataset is also available on
      PhysioNet and gives its landing-page URL; the project-level DOI recorded
      here is the identifier the source manifest declares for that project.
      "references" is the closest relationship type this schema defines and
      asserts no derivation, versioning or containment between the two datasets.

purposes:
  - id: purpose_pediatric_voice_speech_development
    name: Enable research into pediatric voice and speech development
    description: >-
      Understanding voice and speech development in children is essential for
      identifying communication or speech disorders early in life, and for
      supporting timely intervention. Pediatric and adult voice/speech
      production are fundamentally different because the respiratory system and
      larynx undergo rapid functional maturation and development throughout
      childhood, and these developmental changes can influence acoustic features
      such as fundamental frequency.
    response: >-
      Establishing a robust multi-institutional dataset that integrates
      pediatric voice data with demographic information would advance the
      understanding of voice and disease as well as early detection and
      intervention.
  - id: purpose_bridge2ai_voice_flagship_dataset
    name: Contribute to the Bridge2AI-Voice flagship dataset
    description: >-
      The Bridge2AI-Voice project seeks to create an ethically sourced flagship
      dataset to enable future research in artificial intelligence and support
      critical insights into the use of voice as a biomarker of health. The
      human voice contains complex acoustic markers which have been linked to
      important health conditions including dementia, mood disorders and cancer;
      as a biomarker, voice is simple to collect, cost-effective and has broad
      clinical utility.
    response: >-
      Bridge2AI-Voice is a Precision Public Health grand challenge project funded
      by the NIH Common Fund Bridge2AI Program, which seeks to create a flagship,
      standardized and ethically sourced dataset of voices linked to health
      information to fuel research and discovery in voice biomarkers.
    source_caveats: >-
      Programme-level purpose, stated in the project documentation site and the
      NIH RePORTER record for the parent award rather than on the pediatric
      release page.

tasks:
  - id: task_developmental_norms
    name: Study of developmental norms in pediatric voice
    description: >-
      Resources such as this project are intended to enable study of
      developmental norms in pediatric voice and speech.
    response: >-
      Because evidence and normative data available in adults cannot be
      generalized to pediatric populations, pediatric normative data must be
      established from pediatric recordings.
  - id: task_early_screening_tools
    name: Development of AI-driven tools for early screening
    description: >-
      Resources such as this project are intended to create AI-driven tools for
      early screening and to support clinical insight.
    response: >-
      Many studies have investigated the use of machine learning models for
      voice and speech analysis for detection of autism and speech delays in the
      pediatric population; due to the important variations in voice and speech
      with the development of a child, a voice database covering different age
      groups is described as key to helping machine learning models diagnose
      age-specific speech delays and disorders.

addressing_gaps:
  - id: gap_pediatric_data_scarcity
    name: Scarcity of large-scale pediatric voice datasets
    description: >-
      Despite the clinical importance of detecting pediatric communication
      disorders such as autism spectrum disorder and speech delays, the
      availability of large-scale pediatric databases and datasets remains
      limited.
    response: >-
      Data collection in pediatric populations introduces unique challenges such
      as privacy issues, consent processes and the need for developmentally
      appropriate tasks. These factors have contributed to the lack of publicly
      accessible pediatric datasets that enable machine learning for pediatric
      voice analysis.
  - id: gap_adult_norms_do_not_transfer
    name: Adult normative data cannot be generalized to children
    description: >-
      Pediatric and adult voice and speech production are fundamentally
      different because the respiratory system and larynx undergo rapid
      functional maturation and development throughout childhood.
    response: >-
      As a result, evidence and normative data available in adults cannot be
      generalized to pediatric populations.

