  - id: anomaly_removed_features_v1_1
    name: Features withheld for sensitive records and audio checks
    anomaly_details: >-
      Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for
      sensitive records and audio checks have been removed from v1.1.
    description: >-
      The affected feature types are therefore incomplete with respect to the
      set of recordings in the release.
  - id: anomaly_feature_generation_failures
    name: Recordings for which some features could not be generated
    anomaly_details: >-
      Some files, whether due to length or other issues, could not generate
      certain features and so are not included in the bundled data.
    description: >-
      The per-file counts published for release 1.1.0 differ accordingly: the
      four torchaudio feature files and ppgs.parquet report 23,533 rows, while
      sparc_ema.parquet, sparc_loudness.parquet, sparc_periodicity.parquet and
      sparc_pitch.parquet report 23,532.

known_biases:
  - id: bias_single_site_recruitment
    name: Single-site pediatric recruitment
    bias_type: selection_bias
    bias_description: >-
      Pediatric participants are recruited strictly from the Hospital for Sick
      Children and are grouped by age. Patients and healthy volunteers at that
      hospital were considered for enrollment, and non-patients were recruited
      through research postings at the same site.
    affected_subsets:
      - The whole pediatric cohort of 300 participants
    source_caveats: >-
      The bundle states the single-site recruitment restriction but does not
      itself characterise the pediatric cohort as biased; the classification of
      this restriction as selection bias is the schema's closest defined type
      for the stated fact. The documentation site's statement that "the data is
      not representative because it was collected at a limited number of
      geographic locations" is answered for the adult release and is not carried
      over here.
  - id: bias_english_proficiency_requirement
    name: English proficiency requirement
    bias_type: representation_bias
    bias_description: >-
      Eligibility for the pediatric study required English proficiency, and
      individuals who were non-verbal were excluded. Children who do not speak
      English and children who are non-verbal are therefore absent from the
      cohort.
    affected_subsets:
      - Children who are not proficient in English
      - Children who are non-verbal
    source_caveats: >-
      The inclusion and exclusion criteria are stated on the PhysioNet release
      page; the consequence for representation is the schema's framing of that
      stated criterion.

known_limitations:
  - id: limitation_no_raw_audio_in_release
    name: Release contains derived features, not raw audio
    limitation_type: scope_limitation
    limitation_description: >-
      The published Bridge2AI-Voice Pediatric Dataset contains derived features
      from the audio waveforms. This PhysioNet project does not contain raw
      audios. The release contains data considered low risk, including
      derivations such as spectrograms but not the original voice recordings.
    scope_impact: >-
      Analyses that require the original waveform cannot be performed on the
      PhysioNet release alone.
    recommended_mitigation: >-
      Accessing raw audio is a more involved process and requires institutional
      sign off; the release directs interested users to contact the access
      committee, and states that data will be made available via Synapse.
  - id: limitation_recording_hardware_varied
    name: Recording hardware varied between participants
    limitation_type: methodological_limitation
    limitation_description: >-
      A headset was used to record for most participants, while the remaining
      recordings utilized the built-in tablet microphone due to low tolerance of
      wearing headphones or existing complex medical conditions.
    scope_impact: >-
      Acoustic features may not be directly comparable across all recordings in
      the release.
  - id: limitation_incomplete_feature_coverage
    name: Incomplete feature coverage across recordings
    limitation_type: coverage_limitation
    limitation_description: >-
      Features for sensitive records and audio checks were removed from v1.1,
      and some files could not generate certain features and are not included in
      the bundled data.
    scope_impact: >-
      The feature tables are not a complete cross-product of recordings and
      feature types.
  - id: limitation_single_site_and_language
    name: Single site and single language of collection
    limitation_type: representativeness_limitation
    limitation_description: >-
      The pediatric cohort was recruited only at the Hospital for Sick Children
      and required English proficiency for eligibility.
    scope_impact: >-
      The cohort reflects one hospital population and one language of
      assessment.

subpopulations:
  - id: subpopulation_pediatric_age_groups
    name: Pediatric age groupings
    subpopulation_elements_present: true
    identification: >-
      Participants are aged 2-18 and are grouped by age. The Bridge2AI-Voice
      documentation publishes four age-banded pediatric protocols: Peds 10+,
      Peds 6-10, Peds 4-6 and Peds 2-4. Detailed demographic data are released
      alongside the features.
    source_caveats: >-
      The counts of participants in each age band are not stated anywhere in the
      bundle, so no distribution is recorded.

sensitive_elements:
  - id: sensitive_pediatric_health_data
    name: Health and demographic data about minors
    sensitive_elements_present: true
    sensitivity_details: >-
      The release carries demographic, clinical and validated questionnaire data
      for children aged 2-18 and is distributed only to credentialed users who
      sign the data use agreement. The release process explicitly identifies
      sensitive records: spectrograms, Mel spectrograms, MFC coefficients, PPGs
      and EMAs for sensitive records and audio checks were removed from v1.1,
      and free-speech task features were manually checked for the presence of
      unconsented speakers and personally identifiable information before
      release. Raw audio is withheld from this project and its release requires
      institutional sign off.
    source_caveats: >-
      The documentation site's enumeration of sensitive categories in the
      dataset (race, sexual orientation, socioeconomic and health information)
      is answered for the adult release and is not carried over to this record.

relationships:
  - id: relationship_participant_session_recording
    name: Participant, session and recording linkage within the release
    relationship_details: >-
      Each element of the parquet-formatted feature files contains a unique
      identifier for the participant (participant_id), a unique identifier for
      the recording session (session_id) and the task performed (task_name), so
      recordings can be grouped by participant, by session and by acoustic task
      across feature files and joined to the phenotype tables.
    source_caveats: >-
      The documentation healthsheet's answer that instances are unrelated is
      given for the adult release, in which each instance represents a person,
      and is not carried over to this record.

acquisition_methods:
  - id: acquisition_pediatric_session
    name: Single-session tablet-based acquisition
    was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: true
    acquisition_details: >-
      Voice, speech and non-speech recordings were captured directly from
      participants during a data collection session. Demographic information,
      voice and speech related questionnaires, and questionnaires inquiring
      about medical history were reported by the participant, or, for
      participants without adequate comprehension and familiarity with their
      past medical history, by parents or decision-makers who completed the
      survey during the recording on a separate tablet. The features published
      in this release were subsequently derived from the recorded waveforms by
      signal-processing and model-based feature extractors rather than being
      observed directly.

collection_mechanisms:
  - id: mechanism_reproschema_ui_tablets
    name: Customized tablet software with age-appropriate protocol
    mechanism_details: >-
      All data was collected through customized software, reproschema-ui, on
      tablets, using the Bridge2AI-Voice pediatric protocol. A headset was used
      to record for most participants, while the remaining recordings utilized
      the built-in tablet microphone due to low tolerance of wearing headphones
      or existing complex medical conditions. All participants completed the
      recording and demographic data collection in one session. For participants
      without adequate comprehension and familiarity with their past medical
      history, parents or decision-makers completed the survey during the
      recording on a separate tablet; the simultaneous completion of the
      recording and survey improved efficiency and minimized participant burden
      and fatigue.
    description: >-
      Once consented, patients were assigned a unique study identification
      number and a standardized age-appropriate protocol for data collection was
      adopted. The protocol included the collection of demographic information,
      voice and speech related questionnaires, and questionnaires inquiring
      about medical history.
  - id: mechanism_pediatric_acoustic_tasks
    name: Age-appropriate acoustic task battery
    mechanism_details: >-
      The Bridge2AI-Voice documentation lists the acoustic tasks assigned to the
      pediatric part of the protocol: ABC's, Ready For School, Favorite Show,
      Favorite Food, Outside of School, Months, Counting, Naming Animals, Naming
      Food, Identifying Pictures, Picture Description (Pediatrics), Caterpillar
      Passage (Pediatrics), Repeat Words, Role naming, Repeat Sentences, Long
      Sounds (sustained /ee/ and /ah/), Noisy Sounds and Silly Sounds.
    description: >-
      Tasks are classified in the documentation as speech tasks or as voice /
      non-speech tasks.
  - id: mechanism_pediatric_questionnaires
    name: Validated questionnaires for the pediatric cohort
    mechanism_details: >-
      The validated questionnaires the Bridge2AI-Voice documentation lists as
      specific to the pediatric cohort are the Children's Voice Handicap
      Index-10 (C-VHI-10), the Pediatric Voice Outcomes Survey (PVOS), the
      Pediatric Voice-Related Quality-of-Life measure (PVRQOL) and the Patient
      Health Questionnaire modified for Adolescents (PHQ-A).
    source_caveats: >-
      The questionnaire table in the documentation marks applicability per
      cohort in columns that do not survive text extraction, so only the rows
      naming pediatric-specific instruments can be attributed to the pediatric
      cohort with confidence; the general instruments in that table may or may
      not also apply.

sampling_strategies:
  - id: sampling_pediatric_enrollment
    name: Eligibility-screened enrollment at a single pediatric hospital
    is_sample: true
    source_data: >-
      Patients and healthy volunteers at the Hospital for Sick Children, plus
      non-patients recruited through research postings.
    strategies: >-
      Patients were considered eligible for the study if they fulfilled the
      inclusion criteria of 2 to 18 years of age and English proficiency.
      Exclusion criteria included participants over 18 years of age and
      individuals who were non-verbal. Non-patients, recruited through research
      postings, were evaluated for eligibility based on the study's inclusion
      and exclusion criteria. Following confirmation of eligibility, parental or
      participant consent was obtained prior to data collection and data
      sharing.
    source_caveats: >-
      The documentation's study-metadata entry recording a non-probability
      sampling method sits in a block that states the current dataset contains
      only adult populations, so neither is_random nor is_representative is
      asserted for the pediatric cohort.

data_collectors:
  - id: collector_hospital_for_sick_children
    name: Hospital for Sick Children study team
    role: Recruiting and collecting site for the pediatric cohort
    collector_details: >-
      Pediatric participants are recruited strictly from the Hospital for Sick
      Children. The USF protocol states that pediatric patients will be enrolled
      only through the pediatric sites and not at USF, and that data collection
      for pediatric cohorts will only be performed at the pediatric
      participating institutions. The IRB annex lists Alistair Johnson, DPhil as
      the lead investigator for the Hospital for Sick Children.
  - id: collector_research_assistants
    name: Trained research assistants
    role: Consent and in-clinic data collection
    collector_details: >-
      The Bridge2AI-Voice documentation states that data is collected in the
      clinic with the assistance of a trained research assistant, and the USF
      protocol states that the consent and assent process is conducted by
      research assistants in the clinic setting.
    source_caveats: >-
      Both statements are written for the Bridge2AI-Voice study as a whole
      rather than specifically for the pediatric site.

direct_collection:
  - id: direct_collection_from_participants
    name: Data collected directly from participants
    is_direct: true
    collection_details: >-
      Data were collected directly from the enrolled children and, where the
      child could not answer medical-history questions, from their parents or
      decision-makers during the same session, rather than obtained from a third
      party.

collection_notifications:
  - id: notification_consent_before_collection
    name: Participants and guardians informed before collection
    notification_details: >-
      Following confirmation of eligibility, parental or participant consent was
      obtained prior to data collection and data sharing. The USF protocol
      describes an informed consent process in which the participant and/or
      consenting parent or guardian is made aware that participation is fully
      voluntary, and states that the participant will be made explicitly aware
      that this is optional and voluntary and that deciding not to participate
      will not interfere with their normal standard of care in any way.

collection_consents:
  - id: consent_pediatric_parental_and_assent
    name: Parental permission with child assent
    consent_details: >-
      Parental or participant consent was obtained prior to data collection and
      data sharing. Where children participate, parents or guardians provide
      consent and children provide verbal assent where appropriate. Parental
      permission is obtained from one or both parents; the research is minimal
      risk and does not require permission from both parents or legal guardians.
      Where young children cannot reasonably be asked to assent, due to
      limitations in understanding arising from age and development, they are
      not asked to do so; this typically holds for children under seven years of
      age. Assent is documented on a form. Not consenting, or in the case of
      pediatric participants not receiving consent from a parent or guardian, to
      voice and clinical de-identified data being uploaded to an open-sourced
      database is an exclusion criterion.
    source_caveats: >-
      The consent and assent provisions are taken from the USF IRB protocol,
      which was modified in version 2 of May 3, 2023 to include the pediatric
      cohort; the pediatric data themselves were collected under the separate
      Research Ethics Board approval of the Hospital for Sick Children.

consent_revocations:
  - id: revocation_withdrawal_provisions
    name: Withdrawal provisions in the study protocol
    revocation_details: >-
      Under the study protocol, if participants withdraw from the study after
      they complete the voice data collection, the data they have provided will
      be kept until completion of the study; if participants withdraw during or
      before the voice data collection is completed, their data will not be
      included in the database. Participants can decide to withdraw at any point
      throughout the study period, and participants who withdraw have the option
      to complete a satisfaction survey to better understand their reasons for
      withdrawal.
    source_caveats: >-
      These provisions come from the USF IRB protocol. The pediatric cohort was
      collected at the Hospital for Sick Children under a separate Research
      Ethics Board approval, and the bundle does not state whether the same
      withdrawal provisions apply there.

missing_data_documentation:
  - id: missing_data_feature_gaps
    name: Missing feature rows and withheld feature types
    missing_data_patterns: >-
      Feature types are not present for every recording: the four torchaudio
      feature files and ppgs.parquet report 23,533 rows while the four sparc
      feature files report 23,532, and several feature types are absent for
      records flagged as sensitive or as audio checks.
    missing_data_causes: >-
      Some files, whether due to length or other issues, could not generate
      certain features and so are not included in the bundled data.
      Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for
      sensitive records and audio checks were removed from v1.1.
    handling_strategy: >-
      The affected rows are omitted from the bundled feature files rather than
      imputed or flagged inline; the per-file record counts are published in the
      data description.

raw_data_sources:
  - id: raw_source_pediatric_audio_waveforms
    name: Pediatric raw audio waveforms
    source_description: >-
      Raw audio waveform recordings of voice, speech and non-speech tasks
      captured from pediatric participants on tablets using reproschema-ui, from
      which every feature in this release is derived.
    source_type: Audio recordings captured during the study session
    access_details: >-
      Raw audio data access for the Bridge2AI Voice pediatric cohort is via
      Synapse. Accessing raw audio is a more involved process and requires
      institutional sign off; the release directs interested parties to the
      access committee at DACO@b2ai-voice.org, and states that data will be made
      available via Synapse at https://www.synapse.org/Synapse:syn73617068. The
      documentation site states that raw audio data is disseminated through
      controlled access only, to protect participants' privacy.
    raw_data_format: >-
      WAV audio files organised in a Brain Imaging Data Structure layout, per
      the folder structure published in the Bridge2AI-Voice documentation.
    source_caveats: >-
      The published folder structure is presented for the b2ai-voice-audio
      dataset as a whole and enumerates adult-specific phenotype files, so only
      the audio file naming and format are taken from it.

ethical_reviews:
  - id: ethics_hospital_for_sick_children_reb
    name: Research Ethics Board, Hospital for Sick Children
    reviewing_organization: Research Ethics Board at the Hospital for Sick Children
    review_details: >-
      Data collection and sharing was approved by the Research Ethics Board at
      the Hospital for Sick Children. This is the approval the PhysioNet release
      cites for the pediatric dataset.
  - id: ethics_usf_single_irb
    name: University of South Florida single IRB
    reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      The Bridge2AI Voice Data Acquisition protocol was submitted and approved by
      the USF Single IRB and subsite IRBs through the Single IRB process, with
      Yael Bensoussan as principal investigator. Protocol version 2, dated May 3,
      2023, was modified to include the pediatric cohort under the single IRB,
      and a Checklist HRP-416 for children under 21 was completed and appended to
      the protocol.
    source_caveats: >-
      The protocol also states that the Canadian institutions - Mount Sinai
      Hospital, SickKids and the University of Toronto - do not abide by the
      single IRB process and apply for a separate research ethics board
      application to comply with Canadian regulations. The pediatric cohort was
      collected at SickKids, so the Hospital for Sick Children Research Ethics
      Board approval, and not the USF single IRB, is the approval under which
      these data were collected.

human_subject_research:
  id: human_subject_research_pediatric_voice
  name: Human subjects research with a pediatric cohort
  involves_human_subjects: true
  irb_approval:
    - >-
      Research Ethics Board at the Hospital for Sick Children: approved data
      collection and sharing for the Bridge2AI-Voice Pediatric Dataset.
    - >-
      University of South Florida single IRB: approved the Bridge2AI Voice Data
      Acquisition protocol, modified in version 2 of May 3, 2023 to include the
      pediatric cohort.
  ethics_review_board: Research Ethics Board at the Hospital for Sick Children
  special_populations:
    - Children aged 2 to 18 years
    - >-
      Children too young to assent, typically those under seven years of age,
      who are enrolled on parental permission alone
  regulatory_compliance:
    - >-
      Canadian participating institutions apply for a separate research ethics
      board approval rather than operating under the USF single IRB process.
    - >-
      Checklist HRP-416 for children under 21 was completed and appended to the
      study protocol.

informed_consent:
  - id: informed_consent_pediatric
    name: Informed consent and assent for pediatric participants
    consent_obtained: true
    consent_type: >-
      Parental or participant consent obtained prior to data collection and data
      sharing, with verbal assent from the child where developmentally
      appropriate.
    consent_documentation: >-
      Assent is documented on a form. Parental permission is obtained from one
      or both parents; the research is minimal risk and does not require
      permission from both parents or legal guardians.
    withdrawal_mechanism: >-
      Participants may withdraw at any point during the study period; data
      provided by a participant who withdraws before or during voice data
      collection are not included in the database, while data from a participant
      who withdraws after completing collection are kept until completion of the
      study.
    consent_scope: >-
      Consent covers collection of voice and clinical data and the sharing of
      de-identified data through an open-sourced database; declining that
      sharing is an exclusion criterion.
    source_caveats: >-
      Consent mechanics are described in the USF IRB protocol; the pediatric
      cohort was collected under the separate Research Ethics Board approval of
      the Hospital for Sick Children.

at_risk_populations:
  id: at_risk_pediatric_participants
  name: Children as an at-risk population
  at_risk_groups_included: true
  special_protections:
    - >-
      Pediatric patients are enrolled only through the pediatric sites and not
      at the University of South Florida.
    - >-
      Checklist HRP-416 for children under 21 was completed and appended to the
      study protocol.
    - >-
      Compensation was provided to the adult population only, so no financial
      inducement was offered to pediatric participants.
  assent_procedures: >-
    Children provide verbal assent where appropriate. Where young children
    cannot reasonably be asked to assent, due to limitations in understanding
    arising from age and development, they are not asked to do so; this
    typically holds for children under seven years of age. Assent is documented
    on a form.
  guardian_consent:
    - Parents or guardians provide consent for children participating in the research.
    - >-
      Parental permission is obtained from one or both parents; the research is
      minimal risk and does not require permission from both parents or legal
      guardians.
    - >-
      Not receiving consent from a parent or guardian for de-identified voice and
      clinical data to be uploaded to an open-sourced database is an exclusion
      criterion for pediatric participants.

participant_privacy:
  - id: privacy_pediatric_release
    name: Privacy protections applied to the pediatric release
    anonymization_method: >-
      Once consented, patients were assigned a unique study identification
      number, and participants are identified in the release only by that
      number. Withholding of the original recordings and of features for
      sensitive records is recorded under is_deidentified.
    reidentification_risk: >-
      The release is described as containing data considered low risk. The study
      protocol notes that even when all HIPAA-protected information associated
      with a participant is removed, each person's voice is unique to them, so
      it is always possible, even if unlikely, that someone could recognise a
      participant's voice; this is given as the reason raw audio is withheld from
      open release.
    source_caveats: >-
      The re-identification statement is made in the USF study protocol about
      voice data in general rather than about this release specifically.

participant_compensation:
  - id: compensation_pediatric_none
    name: No compensation for pediatric participants
    compensation_provided: false
    description: >-
      The study protocol states that compensation will be provided to the adult
      population only. The gift-card schedule described in the protocol and in
      the project documentation - forty dollars for sessions under ninety
      minutes, eighty dollars for sessions over ninety minutes, for no more than
      three sessions and a maximum of one hundred and twenty dollars - therefore
      applies to adult participants and not to the pediatric cohort.

preprocessing_strategies:
  - id: preprocessing_feature_extraction
    name: Derivation of audio features from raw waveforms
    preprocessing_details: >-
      Time-varying features were derived from each recording and stored as
      parquet. Spectrograms of dimension 201xT were generated using the
      short-time Fast Fourier Transform with a 25ms window size, 10ms hop length
      and a 400-point FFT. Mel spectrograms of dimension 60xT were generated
      with the same window, hop and FFT size and 60 Mel bins. Mel-frequency
      cepstrum coefficients of dimension 60xT were generated using the same
      parameters as the Mel spectrograms. Detected pitch over time was computed
      with a minimum and maximum pitch of 80 and 500. Estimated electromagnetic
      articulography of dimension Tx12 was produced for the X and Y positions of
      six articulators: tongue dorsum, tongue body, tongue tip, lower incisor,
      upper lip and lower lip. Estimated loudness, based on the average absolute
      amplitude of the audio waveform, and estimated periodicity were computed
      using 20ms windows. A second fundamental-frequency estimate was computed
      with a range of 50-550Hz. Phonetic posteriorgram probabilities across 40
      phoneme categories were computed at a frame rate of 100Hz, giving a
      dimension of 40xT. Static features were extracted using openSMILE, Praat,
      parselmouth and torchaudio, and audio quality metrics were derived from
      the recordings.
    description: >-
      The code used to preprocess the raw audio waveforms into the parquet files
      and to merge the source data into the phenotype files has been made open
      source in the b2aiprep library.
    used_software:
      - id: https://github.com/sensein/b2aiprep
        name: b2aiprep - Bridge2AI Data Processing Library
        version: 3.0.0
        license: Apache-2.0
        url: https://github.com/sensein/b2aiprep
        description: >-
          Cited in the release as Johnson, A., Bevers, I., Ng, E., Wilke, J.,
          Brito, R., Bedrick, S., Catania, F. and Ghosh, S. (2025), Bridge2AI
          Data Processing Library (Version 3.0.0) [Computer software].
      - id: https://github.com/sensein/senselab
        name: SenseLab
        url: https://github.com/sensein/senselab
        description: >-
          Named in the Bridge2AI-Voice documentation as the toolkit used for
          processing audio files for research tasks.
  - id: preprocessing_format_conversion
    name: Conversion of collected data to REDCap and BIDS structures
    preprocessing_details: >-
      Pediatric data collected through ReproSchema-UI is extracted and
      transformed into REDCap format, and subsequently converted to the Brain
      Imaging Data Structure. Data were exported and converted to tab delimited
      values using an open source library developed by the team.
    used_software:
      - id: https://github.com/sensein/b2aiprep
        name: b2aiprep - Bridge2AI Data Processing Library
        version: 3.0.0
        license: Apache-2.0
        url: https://github.com/sensein/b2aiprep
        description: >-
          The open source library developed by the team and used to export and
          convert the collected data.
  - id: preprocessing_withholding_for_release
    name: Withholding of features prior to release
    preprocessing_details: >-
      Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for
      sensitive records and audio checks were removed before publication of
      v1.1, and the original voice recordings were excluded from the PhysioNet
      project entirely.

cleaning_strategies:
  - id: cleaning_free_speech_manual_review
    name: Manual review of free speech recordings
    cleaning_details: >-
      For release v1.1, audio features were released for all free speech tasks
      that were manually checked for the presence of unconsented speakers and
      personally identifiable information. The study protocol provides that
      where a caregiver's voice is recorded inadvertently, the clip can be
      discarded either by re-recording manually during data collection or during
      data audit and postprocessing.
  - id: cleaning_audit_protocol
    name: Release audit protocol
    cleaning_details: >-
      The Bridge2AI-Voice audit protocol generates missingness tables, checks
      distributions and outliers, checks categorical responses against the
      schema, and runs quality control metrics for audio tasks, including the
      amount of silence and the duration of a waveform and, for speech, a check
      of the produced speech relative to the intended passage.
    source_caveats: >-
      The audit protocol is documented for the Bridge2AI-Voice releases in
      general on the project documentation site rather than specifically for the
      pediatric release; the pediatric release page separately records that new
      metrics related to the audio quality of the recordings were published in
      v1.1.

machine_annotation_tools:
  - id: machine_annotation_model_derived_features
    name: Model-based feature estimators
    tools:
      - SPARC speech articulatory coding
      - Phonetic posteriorgram estimator
      - torchaudio
      - openSMILE
      - Praat
      - parselmouth
    tool_descriptions: >-
      Several of the released feature types are estimates produced by models
      rather than direct measurements: the electromagnetic articulography
      features are estimated using a deep learning model, and the phonetic
      posteriorgrams are probabilities across 40 phoneme categories. The sparc
      pitch estimate uses a different algorithm from the torchaudio pitch
      estimate. Static features are extracted with openSMILE, Praat, parselmouth
      and torchaudio.
    source_caveats: >-
      No accuracy figures for any of these estimators are given anywhere in the
      bundle.

future_use_impacts:
  - id: future_use_pediatric_specificity
    name: Adult evidence does not transfer to pediatric voice
    impact_details: >-
      Pediatric and adult voice and speech production are fundamentally
      different because the respiratory system and larynx undergo rapid
      functional maturation and development throughout childhood, and these
      developmental changes can influence acoustic features such as fundamental
      frequency. As a result, evidence and normative data available in adults
      cannot be generalized to pediatric populations, and conclusions drawn from
      this dataset should be understood as specific to the pediatric age range
      it covers.

discouraged_uses:
  - id: discouraged_non_research_applications
    name: Non-research applications
    discouragement_details: >-
      Under the registered access agreement, the dataset should not be used for
      non-research applications such as hiring decisions, insurance premium
      adjustments, or any form of surveillance that could lead to discrimination
      or harm. These limitations are intended to prevent unethical or biased
      outcomes that could negatively impact individuals based on their health
      conditions or voice characteristics.
    source_caveats: >-
      This wording appears in the Bridge2AI-Voice documentation healthsheet,
      whose composition figures describe the adult release; the pediatric release
      is distributed under the Bridge2AI Voice Registered Access Agreement named
      on its PhysioNet page.

intended_uses:
  - id: intended_use_pediatric_voice_ai_research
    name: Research use in pediatric voice biomarker and AI research
    use_category: research
    examples:
      - Study of developmental norms in pediatric voice and speech
      - Development of AI-driven tools for early screening of communication or speech disorders
      - Support for clinical insight into pediatric voice and disease
    usage_notes: >-
      The release page gives worked examples for loading the data. In Python the
      parquet dataset can be loaded with the HuggingFace datasets library, for
      example Dataset.from_parquet("torchaudio_spectrogram.parquet"). A
      spectrogram can be plotted in decibels by converting it from its original
      power representation, for example with librosa.power_to_db. A phenotype
      file can be loaded with any statistical analysis tool; for example the
      pandas library can read demographics.tsv as a tab-separated file.
    description: >-
      The registered access agreement states that the dataset is intended solely
      for commercial and non-commercial research purposes by authorized
      researchers.
    source_caveats: >-
      The task, screening and clinical-insight examples are stated on the
      pediatric release page. The research-purpose wording is quoted from the
      Bridge2AI-Voice documentation healthsheet, whose composition figures
      describe the adult release; the pediatric release is distributed under the
      Bridge2AI Voice Registered Access Agreement named on its PhysioNet page.

prohibited_uses:
  - id: prohibited_reidentification
    name: Attempted re-identification of participants
    prohibition_reason: >-
      The dataset is not to be used to attempt to re-identify research
      participants, nor for any actions that could reasonably lead to
      re-identification.
  - id: prohibited_harm_or_stigmatization
    name: Uses that could cause harm or stigmatization
    prohibition_reason: >-
      The dataset is not to be used for any purpose that could foreseeably cause
      harm or stigmatization to research participants, their families,
      communities, or specific populations.
  - id: prohibited_sale_of_data
    name: Sale of the data
    prohibition_reason: >-
      Duplication as reasonably required to carry out a research project with
      the data is permitted, but sale of all or part of the data on any media is
      not permitted.

file_collections:
  - id: urn:b2ai-voice-pediatric:1.1.0:features
    name: features
    path: features
    collection_type: processed_data
    description: >-
      Derived audio data features. Binary files are made available as Parquet,
      an open-source column-oriented data file format. Each of the parquet files
      is formatted similarly: each element contains a unique identifier for the
      participant (participant_id), a unique identifier for the recording
      session (session_id), the task performed (task_name), the number of time
      frames associated with that feature (n_frames), and the tensor data for
      the feature. The folder also contains plain-text feature tables and, for
      every data file, a data dictionary file with the same file stem and a JSON
      suffix, whose keys are the column names matching the associated data file
      and whose values are dictionaries with further detail; the description
      value in the data dictionary provides a one sentence summary of the
      respective column.
    resources:
      - id: urn:b2ai-voice-pediatric:1.1.0:features/torchaudio_spectrograms.parquet
        name: torchaudio_spectrograms.parquet
        path: features/torchaudio_spectrograms.parquet
        file_type: data_file
        description: >-
          Parquet file, n=23533, containing spectrograms of dimension 201xT
          generated using the short-time Fast Fourier Transform with a 25ms
          window size, 10ms hop length and a 400-point FFT.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/torchaudio_mel_spectrograms.parquet
        name: torchaudio_mel_spectrograms.parquet
        path: features/torchaudio_mel_spectrograms.parquet
        file_type: data_file
        description: >-
          Parquet file, n=23533, containing Mel spectrograms of dimension 60xT
          generated with a 25ms window size, 10ms hop length, a 400-point FFT
          and 60 Mel bins.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/torchaudio_mfcc.parquet
        name: torchaudio_mfcc.parquet
        path: features/torchaudio_mfcc.parquet
        file_type: data_file
        description: >-
          Parquet file, n=23533, containing Mel-frequency cepstrum coefficients
          of dimension 60xT using the same parameters as the Mel spectrograms.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/torchaudio_pitch.parquet
        name: torchaudio_pitch.parquet
        path: features/torchaudio_pitch.parquet
        file_type: data_file
        description: >-
          Parquet file, n=23533, containing the detected pitch (fundamental
          frequency) over time, of dimension T, with a minimum and maximum pitch
          of 80 and 500 respectively.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/sparc_ema.parquet
        name: sparc_ema.parquet
        path: features/sparc_ema.parquet
        file_type: data_file
        description: >-
          Parquet file, n=23532, containing the estimated electromagnetic
          articulography produced using a deep learning model, with dimensions
          Tx12 where the twelve values correspond to the X and Y positions of
          six articulators: tongue dorsum, tongue body, tongue tip, lower
          incisor, upper lip and lower lip.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/sparc_loudness.parquet
        name: sparc_loudness.parquet
        path: features/sparc_loudness.parquet
        file_type: data_file
        description: >-
          Parquet file, n=23532, containing the estimated loudness based on the
          average absolute amplitude of the audio waveform, of size T, using
          20ms windows.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/sparc_periodicity.parquet
        name: sparc_periodicity.parquet
        path: features/sparc_periodicity.parquet
        file_type: data_file
        description: >-
          Parquet file, n=23532, containing the estimated periodicity, the
          confidence of pitch presence, derived from the audio using 20ms
          windows, of dimension T.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/sparc_pitch.parquet
        name: sparc_pitch.parquet
        path: features/sparc_pitch.parquet
        file_type: data_file
        description: >-
          Parquet file, n=23532, containing the estimated fundamental frequency
          of the audio signal using a different algorithm from
          torchaudio_pitch.parquet, with a range of 50-550Hz and dimension T.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/ppgs.parquet
        name: ppgs.parquet
        path: features/ppgs.parquet
        file_type: data_file
        description: >-
          Parquet file, n=23533, containing the phonetic posteriorgram
          probabilities across 40 phoneme categories, giving a dimension of 40xT
          with a frame rate of 100Hz.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/static_features.tsv
        name: static_features.tsv
        path: features/static_features.tsv
        format: TSV
        file_type: data_file
        description: >-
          Plain-text table of features derived using the open-source Speech and
          Music Interpretation by Large-space Extraction (openSMILE), Praat,
          parselmouth and torchaudio. Each such feature is present in this file.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/audio_quality_metrics.tsv
        name: audio_quality_metrics.tsv
        path: features/audio_quality_metrics.tsv
        format: TSV
        file_type: data_file
        description: >-
          Plain-text table of metrics related to audio quality derived from the
          recordings, newly released in v1.1.
      - id: urn:b2ai-voice-pediatric:1.1.0:features/data_dictionaries
        name: Feature data dictionaries
        path: features
        format: JSON
        file_type: metadata_file
        description: >-
          One JSON data dictionary per data file in the features folder, sharing
          the file stem of the file it documents, for example
          torch_spectrogram.json. Each dictionary is keyed by the column names
          of the associated data file, with values giving further detail
          including a one sentence description of the column.
  - id: urn:b2ai-voice-pediatric:1.1.0:phenotype
    name: phenotype
    path: phenotype
    collection_type: processed_data
    description: >-
      Phenotypic information acquired during data collection, comprising the
      detailed demographic, clinical and validated questionnaire data made
      available with the release. Phenotype tables are tab-separated and can be
      read with any statistical analysis tool.
    source_caveats: >-
      The pediatric phenotype files are not enumerated on the release page. The
      Brain Imaging Data Structure folder tree published in the project
      documentation is presented for the b2ai-voice-audio dataset and enumerates
      adult-specific tables such as adhd_adult.tsv and ptsd_adult.tsv, so it is
      not reproduced here as the pediatric layout.
  - id: urn:b2ai-voice-pediatric:1.1.0:metadata
    name: metadata
    path: metadata
    collection_type: metadata
    description: >-
      Metadata information for the recordings. Per-recording metadata
      information was newly released in v1.1.

distribution_formats:
  - id: distribution_physionet_features
    name: PhysioNet credentialed-access distribution of the derived features
    access_urls:
      - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
    description: >-
      The feature, phenotype and metadata files are published on PhysioNet as a
      restricted-access resource, as Parquet binaries, tab-separated text tables
      and JSON data dictionaries. To access the files a user must be a
      credentialed user and must sign the data use agreement for the project.
  - id: distribution_synapse_raw_audio
    name: Synapse distribution of the raw audio
    access_urls:
      - https://www.synapse.org/Synapse:syn73617068
    description: >-
      Raw audio data access for the Bridge2AI Voice pediatric cohort is via
      Synapse. The PhysioNet project does not contain raw audios; accessing them
      is a more involved process that requires institutional sign off, arranged
      through the access committee at DACO@b2ai-voice.org.

distribution_dates:
  - id: distribution_dates_pediatric_releases
    name: Published versions of the pediatric dataset
    release_dates:
      - '1.0.0: December 17, 2025'
      - '1.1.0: May 1, 2026'

third_party_sharing:
  - id: third_party_sharing_registered_access
    name: Distribution to external credentialed researchers
    is_shared: true
    description: >-
      The featurized pediatric dataset is available through PhysioNet under
      registered access to credentialed users outside the institutions that
      created it; credentialed users must be approved and must sign the data use
      agreement. Raw audio is disseminated separately under controlled access.

license_and_use_terms:
  id: license_bridge2ai_voice_registered_access
  name: Bridge2AI Voice Registered Access License and Agreement
  license_terms: >-
    Access Policy: only credentialed users who sign the data use agreement can
    access the files. License (for files): Bridge2AI Voice Registered Access
    License. Data Use Agreement: Bridge2AI Voice Registered Access Agreement.
    Required training: no training required. To obtain registered access a user
    registers on PhysioNet, confirms their identity under the Registered Access
    License, and signs the Bridge2AI-Voice Registered Access Agreement, which
    outlines the terms and conditions for data use. Controlled access to raw
    audio additionally requires completing a Data Access Request Form and a Data
    Use Agreement, submitting the application to the Data Access Compliance
    Office for review, and, upon approval, ensuring a Data Use and Transfer
    Agreement is signed by an authorized official at the recipient institution.
  data_use_permission: general_research_use
  description: >-
    The registered access agreement states that the dataset is intended solely
    for commercial and non-commercial research purposes by authorized
    researchers.

ip_restrictions:
  id: ip_restrictions_registered_access_agreement
  name: Intellectual property terms of the registered access agreement
  restrictions:
    - >-
      The data may be protected by copyright and other rights, including other
      intellectual property rights.
    - >-
      Duplication, as reasonably required to carry out the research project with
      the data, is permitted.
    - Sale of all or part of the data on any media is not permitted.
    - >-
      Nothing in the agreement operates to transfer any intellectual property
      rights in or relating to the data to the user.
    - The user agrees not to make intellectual property claims on the data.
    - >-
      The user agrees not to use intellectual property protection in ways that
      would prevent or block access to, or use of, any element of the data, or
      conclusions drawn directly from the data.
    - >-
      A user may elect to perform further research that adds intellectual and
      resource capital to the data and obtain intellectual property rights on
      those downstream discoveries, but agrees to implement licensing policies
      that will not obstruct further research, and to respect the Fort
      Lauderdale Agreement.
    - There are no fees associated with these restrictions.
    - No intellectual-property-based restrictions have been imposed by third parties.
  source_caveats: >-
    These terms are reproduced in the Bridge2AI-Voice documentation for
    informational purposes; the same substantive terms appear in the Data
    Transfer and Use Agreement issued by the University of South Florida Board
    of Trustees for the Bridge2AI-Voice data.

regulatory_restrictions:
  id: regulatory_restrictions_pediatric_release
  name: Access controls and regulatory restrictions
  regulatory_restrictions:
    - >-
      Access to the published files is restricted to credentialed PhysioNet
      users who have signed the Bridge2AI Voice Registered Access Agreement.
    - >-
      Raw audio is released only under controlled access, requiring institutional
      sign off and review by the Data Access Compliance Office.
    - >-
      Under the Data Transfer and Use Agreement, the data is covered under a
      Certificate of Confidentiality, which must be asserted against compulsory
      legal demands such as court orders and subpoenas for identifying
      information or characteristics of a research participant.
    - >-
      Under the Data Transfer and Use Agreement, collaborators at other research
      organizations, and other research teams at the same organization, must
      apply independently for access and sign their own Data Transfer and Use
      Agreement before accessing the data.
    - >-
      The Bridge2AI-Voice documentation states that no export controls apply to
      the dataset.
  confidentiality_level: restricted
  other_compliance: >-
    Data collection and sharing for the pediatric cohort was approved by the
    Research Ethics Board at the Hospital for Sick Children; Canadian
    participating institutions operate under separate research ethics board
    approval rather than the University of South Florida single IRB process.
  governance_committee_contact: mailto:DACO@b2ai-voice.org
  description: >-
    The Bridge2AI-Voice Data Access Compliance Office, reachable at
    DACO@b2ai-voice.org, is the access committee named on the release page for
    requests to access raw audio and the office to which controlled-access
    applications are submitted for review.
  source_caveats: >-
    The governance contact slot references a person record; the bundle names
    only an office, so the office mailbox is recorded as the reference. No HIPAA
    compliance status is recorded: the documentation's de-identification
    answers state that HIPAA de-identification rules were applied, but that block
    describes the adult release, and the pediatric cohort was collected in Canada
    under a Canadian research ethics board.

maintainers:
  - id: maintainer_mit_lcp_physionet
    name: MIT Laboratory for Computational Physiology
    role: academic_institution
    maintainer_details: >-
      PhysioNet, which hosts the release, is maintained by the MIT Laboratory
      for Computational Physiology and is supported by the National Institute of
      Biomedical Imaging and Bioengineering, the National Heart Lung and Blood
      Institute, and the NIH Office of the Director under NIH grant numbers
      U24EB037545 and R01EB030362.
    description: >-
      Platform maintainer for the hosting repository rather than for the dataset
      content.
  - id: maintainer_bridge2ai_voice_daco
    name: Bridge2AI-Voice Data Access Compliance Office
    maintainer_details: >-
      Requests for access to raw audio, and controlled-access applications, are
      handled by the Bridge2AI-Voice access committee at DACO@b2ai-voice.org.
      For questions regarding the dataset itself the release page directs users
      to the corresponding author listed on the PhysioNet sidebar, whose contact
      details are visible only to logged-in users.
    source_caveats: >-
      The Health Data Nexus hosting arrangement and the Temerty Centre for
      Artificial Intelligence Research and Education in Medicine described in
      the documentation healthsheet apply to the earlier feature-only release on
      that platform, not to this PhysioNet release, and are not recorded here.

updates:
  id: update_plan_pediatric_releases
  name: Release history and update content
  update_details: >-
    Release v1.1 of b2ai-voice-pediatric added no new participants; it is a
    minor update that released audio features for all free speech tasks that
    were manually checked for the presence of unconsented speakers and personally
    identifiable information, and additionally released new metrics related to
    the audio quality of the recordings and per recording metadata information.
    Release v1.0 was the first release of the Bridge2AI-Voice Pediatric Dataset.
  source_caveats: >-
    No update frequency is stated for the pediatric project. The semi-annual
    release cadence described in the documentation healthsheet is stated for the
    Health Data Nexus release and is not carried over here.

retention_limit:
  id: retention_limits_bridge2ai_voice
  name: Retention and disposition requirements
  retention_period: >-
    For recipients under a Data Transfer and Use Agreement: two years after the
    start date, upon completion of the project, upon termination, or upon
    expiration of the applicable ethics approval, whichever occurs first.
  retention_details: >-
    Under the Data Transfer and Use Agreement, data must be destroyed in
    accordance with the instructions of the provider, and the recipient must
    submit a written certification of destruction within thirty days after
    termination or expiration, signed by an appropriate representative; the
    recipient may retain one copy to the extent necessary to comply with records
    retention requirements under law, regulation or institutional policy and for
    the purposes of research integrity and verification, and the restrictions of
    the agreement survive and apply to that archival copy. The study protocol
    separately requires that de-identified study data and original consent forms
    be stored for a minimum of five years after completion of the study, and
    that identifiable data and datasheets linking participant numbers to
    participant information be kept at each institution on local cloud storage
    for a maximum of ten years after study completion and then destroyed.
  source_caveats: >-
    The five-year and ten-year figures are University of South Florida protocol
    requirements; the bundle does not state the retention rules applying at the
    Hospital for Sick Children, where the pediatric data were collected.

version_access:
