updates:
  frequency: Quarterly
  update_details: >-
    CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input data
    streams. The dataset will be regularly updated and augmented through the end of the
    project in November 2026. Each quarterly release is deposited as a separate versioned
    Dataverse dataset with its own DOI, and prior releases remain listed in the archive on the
    CM4AI data releases page. Planned additions include computed cell maps, immunofluorescence
    images for the induced pluripotent stem cell arm, and release of the currently embargoed
    perturb-seq deposits.

