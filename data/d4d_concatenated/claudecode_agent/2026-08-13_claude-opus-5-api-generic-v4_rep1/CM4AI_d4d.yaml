direct_collection:
  - is_direct: true
    collection_details: >-
      All measurement data were generated directly by CM4AI laboratories from cell cultures
      maintained by the project; no data were obtained from human participants.
  - is_direct: false
    collection_details: >-
      The underlying human cell lines were obtained from third parties. MDA-MB-468
      (RRID:CVCL_0419) is available from ATCC and was established from a metastatic site
      pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma.
      KOLF2.1J (RRID:CVCL_B5P3) was derived from a healthy male Northern European donor and is
      available from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource to
      not-for-profit organisations via a simple material transfer agreement.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Targeted selection of approximately 100 chromatin modifiers and 100 metabolic enzymes
      involved in cancer, neuropsychiatric and cardiac disorders as the shared protein panel
      interrogated across all cell types and treatment conditions. Genome-scale CRISPRi
      perturbation of 11,739 expressed genes in KOLF2.1J iPSCs, extending coverage beyond the
      targeted panel to the whole expressed genome. Immunofluorescence mapping of chromatin
      regulators, their interactors and key signalling molecules involved in cancer, using the
      Human Protein Atlas resource of antibodies, with additional proteins added contingent on
      significant hits from the genetic perturbation and protein-protein interaction results.
      Selection of two disease-relevant, ethically sourced cell lines - MDA-MB-468 for
      triple-negative breast cancer and KOLF2.1J for induced pluripotent stem cell and
      neuronal/cardiomyocyte contexts - rather than random sampling of cellular contexts.
    why_not_representative: >-
      Data in the release were derived from two commercially available de-identified human
      cell lines and do not represent all biological variants which may be seen in the
      population at large.

