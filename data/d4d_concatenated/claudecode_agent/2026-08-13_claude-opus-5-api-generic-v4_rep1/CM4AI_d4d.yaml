raw_data_sources:
  - source_description: >-
      Raw immunofluorescence confocal microscopy images of MDA-MB-468 cells generated in the
      Lundberg Lab at Stanford University, with four colour channels per field covering the
      protein of interest and three reference markers.
    source_type: spatial proteomics imaging
    raw_data_format: >-
      Image files distributed in ZIP archives; RGB immunofluorescent images were added in the
      revision of the June 2025 release.
    access_details: Distributed directly within the University of Virginia Dataverse releases.
  - source_description: >-
      Raw and searched mass spectrometry files from size-exclusion chromatography-mass
      spectrometry of KOLF2.1J iPSCs, iPSC-derived neural progenitor cells, neurons and
      cardiomyocytes, and of MDA-MB-468 cells with and without treatment.
    source_type: mass spectrometry
    access_details: >-
      Deposited in the MassIVE repository, linked from the release description as an external
      data link.
  - source_description: >-
      Raw and searched mass spectrometry files from affinity purification-mass spectrometry of
      paclitaxel-treated and vorinostat-treated MDA-MB-468 cells.
    source_type: mass spectrometry
    access_details: >-
      Deposited in the MassIVE repository as two separate deposits, one per treatment
      condition, linked from the June 2026 release description.
  - source_description: >-
      Raw single-cell sequencing reads from the genome-scale CRISPRi perturb-seq screens in
      KOLF2.1J iPSCs and in MDA-MB-468 cells.
    source_type: single-cell RNA sequencing
    access_details: >-
      Earlier releases linked an NCBI BioProject entry for Sequence Read Archive data; the
      October 2025 and June 2026 releases list the perturb-seq deposits for both cell lines as
      embargoed. A CRISPRi Perturbation Atlas of iPSCs is additionally deposited at Figshare.

preprocessing_strategies:
  - preprocessing_details: >-
      Protein-protein interaction networks and immunofluorescence images are downloaded from
      the generating laboratories' deposition archives by the MuSIC pipeline segments
      cellmaps_ppidownloader and cellmaps_imagedownloader, and made available for further
      processing.
  - preprocessing_details: >-
      Downloaded protein-protein interaction networks are processed with the node2vec deep
      learning model to reduce dimensionality, producing a per-protein PPI embedding that
      encodes information about that protein's interactions.
  - preprocessing_details: >-
      Immunofluorescence images are processed with a Human Protein Atlas deep learning model
      to reduce dimensionality, producing a per-protein image embedding that encodes
      information about protein localisation.
  - preprocessing_details: >-
      The PPI and image embeddings are integrated into a per-protein co-embedding using
      contrastive deep learning. The integration model learns co-embeddings such that the
      original embeddings can be reconstructed with minimal information loss and proteins with
      similar PPI and image embeddings have similar co-embeddings.
  - preprocessing_details: >-
      Community detection is performed on the all-by-all similarities of protein pairs in the
      co-embedding space, and the resulting hierarchy of protein communities is output as the
      final cell map. Computed cell maps are not included in the June 2026 release.

cleaning_strategies:
  - cleaning_details: >-
      Each MuSIC pipeline segment calls the FAIRSCAPE client package to validate its inputs
      before creating the output RO-Crate package for that segment, so that datasets and data
      elements are characterised and validated and mapped to public ontology vocabularies
      where appropriate, using JSON-Schema mini-data-dictionary descriptions resolvable from
      the provenance graph metadata.
  - cleaning_details: >-
      Single-cell CRISPR screen data are subject to quality control after acquisition; the
      CM4AI overview publication records the first round of screens as undergoing QC at the
      time of writing.

labeling_strategies:
  - labeling_details: >-
      Cell maps are annotated in a two-pronged approach. First, cell maps are aligned to known
      protein function and pathway resources, including the Gene Ontology and Reactome, to
      determine protein assemblies in the cell map with high overlap with known cell biology.
      Second, assemblies in the cell maps are annotated using a large language model approach
      developed by the project to name sets of proteins and assign a name confidence score.
    data_annotation_protocol: >-
      Implemented in the Cell Mapping Toolkit as the cellmaps_hierarchyeval package, which
      annotates the constructed hierarchical cell map with known resources such as the Gene
      Ontology.

machine_annotation_tools:
  - tools:
      - Large language model assembly-naming pipeline with confidence scoring
      - Gene Ontology alignment (cellmaps_hierarchyeval)
      - Reactome pathway alignment
    tool_descriptions: >-
      A large language model approach developed by the project to name sets of proteins
      constituting an assembly and to assign a confidence score to the suggested name.
      Alignment of assemblies to curated protein function and pathway resources in order to
      identify assemblies with high overlap with previously documented cell biology.

missing_data_documentation:
  - missing_data_patterns: >-
      Protein-protein interaction (SEC-MS), protein localisation (immunofluorescence imaging)
      and CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap, so
      many proteins are covered by only a subset of modalities. Computed, integrated cell maps
      are absent from the release, although they are the project's principal intended output.
      Immunofluorescence images for the induced pluripotent stem cell arm are listed by the
      project portal as forthcoming, so the imaging modality is present only for the breast
      cancer arm. Perturb-seq deposits for KOLF2.1J iPSCs and for MDA-MB-468 cells are listed
      as embargoed among the external data links of the June 2026 release.
    missing_data_causes: >-
      Staged, quarterly release schedule with data added progressively through the project.
      Temporary pre-publication embargo on some component datasets.
    handling_strategy: >-
      The release documentation states explicitly that these data are not yet in completed
      final form and that the dataset will be regularly updated and augmented through the end
      of the project, with quarterly updates.

known_limitations:
  - limitation_type: scope_limitation
    limitation_description: >-
      This is an interim Beta release. It does not contain predicted or computed cell maps,
      which will be added in future releases.
    scope_impact: >-
      The current release is most suitable for bioinformatics analysis of the individual
      modality datasets rather than for analyses that depend on the integrated multiscale
      cell map.
    recommended_mitigation: >-
      Await later quarterly releases for the computed cell maps, or construct maps
      independently using the openly released Cell Mapping Toolkit / MuSIC pipeline software.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The sets of proteins interrogated by SEC-MS, immunofluorescence imaging and CRISPRi
      perturb-seq incompletely overlap, limiting the number of proteins for which all three
      modalities are available.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Some component datasets are under temporary pre-publication embargo and are therefore
      not accessible at the time of release, notably the perturb-seq deposits for KOLF2.1J
      iPSCs and for MDA-MB-468 cells.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Meaningful analysis of the release requires domain expertise in proteomics, spatial
      cell biology and functional genomics.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Data in this release were derived from commercially available de-identified human cell
      lines and do not represent all biological variants which may be seen in the population
      at large. The two lines derive from single donors of differing background: MDA-MB-468
      from a 51-year-old black female with metastatic mammary adenocarcinoma, and KOLF2.1J
      from a healthy male Northern European donor.
    affected_subsets:
      - MDA-MB-468 triple-negative breast cancer arm
      - KOLF2.1J induced pluripotent stem cell arm
  - bias_type: selection_bias
    bias_description: >-
      Proteins and genes were selected for interrogation on the basis of disease relevance -
      approximately 100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
      neuropsychiatric and cardiac disorders - rather than sampled at random from the
      proteome, so coverage is concentrated on chromatin and metabolic biology and their
      interactors.
    mitigation_strategy: >-
      Genome-scale CRISPRi perturbation of 11,739 expressed genes in KOLF2.1J iPSCs, and
      proteome-wide SEC-MS capturing approximately 7,000 proteins, broaden coverage
      substantially beyond the targeted panels.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    Use of established, commercially distributed immortalised and induced pluripotent stem
    cell lines in place of primary human subject material.
  deidentification_details: >-
    CM4AI data are distinctive within Bridge2AI in that they are non-clinical, being derived
    from tissue cultures, and are considered to be de-identified as they cannot be matched,
    with current knowledge, to a human subject. Dataverse release metadata records Human
    Subjects: No and De-identified Samples: Yes.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The release contains no personal identifiers or protected health information. Release
      metadata records that the dataset does not involve human subjects, that samples are
      de-identified and that the dataset is not FDA regulated. All distributed files are
      marked Public in the University of Virginia Dataverse and require no access request.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      No confidential or restricted content is present in the released files. Certain
      component datasets - the perturb-seq deposits for KOLF2.1J iPSCs and for MDA-MB-468
      cells - are withheld under temporary pre-publication embargo rather than for reasons of
      confidentiality, and are expected to be released subsequently.

collection_consents:
  - consent_details: >-
      CM4AI states that it has elected to use cell lines that have been ethically sourced:
      MDA-MB-468, available from ATCC, and KOLF2.1J, available from the Human Induced
      Pluripotent Stem Cells Initiative (HipSci) resource for access by not-for-profit
      organisations via a simple material transfer agreement.
    source_caveats: >-
      The available documentation asserts ethical sourcing of the cell lines but does not
      describe donor consent procedures, consent scope, or whether donors were notified of
      secondary research uses.

ethical_reviews:
  - reviewing_organization: >-
      The Hastings Center, on behalf of the CM4AI Ethics module, which operates as one of the
      three pillars of the project alongside Data and People
    contact_person: Vardit Ravitsky
    review_details: >-
      Vardit Ravitsky (ravitskyv@thehastingscenter.org) is named in the release metadata as an
      ethical review contact for the CM4AI data releases. The Ethics team worked with the Data
      Acquisition, Tools and Standards modules to develop a plan for ethical preparation,
      licensing, dissemination and Data Access supervision of CM4AI datasets, employing a
      methodology inspired by Value-Sensitive Design and developing an axiological repository
      of values, a CM4AI Life Cycle framework describing governance milestones through data
      generation and AI system development, and mixed qualitative and quantitative empirical
      research to capture stakeholder values. The Ethics pillar also supported the Bridge2AI
      Ethics Working Group and the Data Sharing and Dissemination Working Group in developing
      a Code of Conduct.
  - reviewing_organization: >-
      Simon Fraser University, on behalf of the CM4AI Ethics module
    contact_person: Jean-Christophe Belisle-Pipon (ORCID https://orcid.org/0000-0002-8965-8153)
    review_details: >-
      Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca) is named in the
      release metadata as the second ethical review contact for the CM4AI data releases,
      alongside Vardit Ravitsky.

human_subject_research:
  involves_human_subjects: false
  irb_approval:
    - >-
      Not applicable. Release metadata records Human Subjects: No; the data are non-clinical,
      generated from commercially available de-identified human cell lines, and no
      institutional review board approval is reported for the data releases.
  ethics_review_board: >-
    Oversight is provided by the CM4AI Ethics module and by a Data Access Committee that
    supervises ethical matters related to dataset distribution and potential dual licensing
    for commercial use.

data_governance:
  committee_name: Data Governance Committee
  committee_contact: Jillian Parker (ORCID https://orcid.org/0000-0003-4535-3486)
  access_review_process: >-
    All files in the June 2026 release are marked Public in the University of Virginia
    Dataverse and are downloadable without an access request; whole-dataset download is
    disabled because the collection exceeds the repository ZIP download limit, so individual
    files must be selected or the Dataverse Data Access API used. The CM4AI overview
    publication states that a Data Access Committee supervises ethical matters related to
    dataset distribution and potential dual licensing for commercial use, and commercial
    reuse requires separate licence negotiation with the copyright holder.
  stewardship_roles:
    - >-
      Data governance committee contact: Jillian Parker, University of California San Diego
      (jillianparker@health.ucsd.edu).
    - >-
      Ethical review contacts: Vardit Ravitsky (ravitskyv@thehastingscenter.org) and
      Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca).
    - >-
      Point of contact for the Dataverse releases: Trey Ideker, University of California San
      Diego.
    - >-
      Programme management and project-related inquiries: Swathi Thaker, University of Alabama
      at Birmingham (snthaker@uab.edu).
    - >-
      Long-term preservation: University of Virginia Dataverse (LibraData), supported by
      committed institutional funds.
  notes: >-
    The CM4AI plan for data governance balances the openness of the data produced with
    protection of intellectual property and supervision and monitoring of potential efforts at
    commercialisation. Guidelines and best practices for ethical development of AI systems
    leveraging the data are being established alongside the governance arrangements.
  source_caveats: >-
    Two committee names appear in the bundle and the sources do not state whether they denote
    the same body: the Dataverse release metadata names a "Data Governance Committee" with
    Jillian Parker as contact, which is the name recorded in committee_name here, while the
    CM4AI overview publication refers to a "Data Access Committee" that will supervise ethical
    matters related to dataset distribution and potential dual licensing, recorded in
    access_review_process. Separately, the release metadata identifies the governance contact
    only by name and email (jillianparker@health.ucsd.edu); the ORCID recorded in
    committee_contact is that of the author "Parker J" in the same release's citation, and the
    equation of the two is an inference rather than a statement in the sources.

