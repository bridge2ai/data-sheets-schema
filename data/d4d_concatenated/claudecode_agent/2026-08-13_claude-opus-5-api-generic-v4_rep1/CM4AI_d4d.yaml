    data_substrate: B2AI_SUBSTRATE:64
    data_topic: B2AI_TOPIC:34

relationships:
  - relationship_details: >-
      Protein-protein interaction records are inherently relational: AP-MS records link a bait
      protein to the prey proteins recovered with it, and SEC-MS records link pairs of
      proteins by similarity of their elution profiles across chromatography fractions. These
      pairwise relations are the edges from which protein assemblies are subsequently
      resolved.
  - relationship_details: >-
      CRISPRi perturb-seq records link a targeted gene to the single-cell transcriptional
      profiles of cells carrying that perturbation, and immunofluorescence images link a
      protein of interest to its subcellular localisation pattern within the imaged cells.
  - relationship_details: >-
      Records across the three modalities are joined by shared protein and gene identifiers
      and by the cell line, differentiation state and treatment condition under which they
      were acquired, although the sets of proteins interrogated by SEC-MS, immunofluorescence
      imaging and CRISPRi perturb-seq incompletely overlap.

