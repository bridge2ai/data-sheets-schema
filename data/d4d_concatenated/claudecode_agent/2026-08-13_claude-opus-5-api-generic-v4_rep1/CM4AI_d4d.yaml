distribution_formats:
  - format: ZIP archive
    media_type: application/zip
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
      - doi:10.18130/V3/HIGT4C
    download_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    notes: >-
      Ten archives are distributed through the University of Virginia Dataverse (LibraData).
      Whole-dataset download is disabled because the selection exceeds the repository's 1.9 GB
      ZIP download limit; individual files must be selected from the files table, or the
      Dataverse Data Access API used for programmatic access. MD5 checksums are published for
      each archive on the dataset landing page. Metadata for the release can additionally be
      exported in OAI_ORE, DataCite, OpenAIRE, Schema.org JSON-LD, DDI Codebook v2, Dublin
      Core, Croissant, DDI HTML Codebook and JSON formats.
  - format: Mass spectrometry raw and search-result files deposited in the MassIVE repository
    notes: >-
      SEC-MS deposits for KOLF2.1J iPSCs and derivatives and for MDA-MB-468 cells, and AP-MS
      deposits for paclitaxel-treated and vorinostat-treated MDA-MB-468 cells, are held
      externally at MassIVE and linked from the release description as external data links.
    source_caveats: >-
      The captured source text records the link labels only; the MassIVE accession identifiers
      and resolved URLs are not present in the available material.
  - format: >-
      Raw single-cell sequencing reads deposited at the NCBI Sequence Read Archive under a
      BioProject, and a CRISPRi Perturbation Atlas of iPSCs deposited at Figshare
    notes: >-
      Earlier releases linked an NCBI BioProject entry for the Sequence Read Archive data; in
      the June 2026 release the perturb-seq deposits for both KOLF2.1J iPSCs and MDA-MB-468
      cells are listed as embargoed, while the CRISPRi Perturbation Atlas of iPSCs is listed
      as available at Figshare.

