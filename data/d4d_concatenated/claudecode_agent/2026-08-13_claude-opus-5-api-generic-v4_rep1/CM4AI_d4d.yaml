purposes:
  - response: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready data,
      produced from multimodal interrogation of chromatin modifiers, metabolic enzymes and
      other proteins involved in cancer, neuropsychiatric and cardiac disorders, in
      disease-relevant cell lines under perturbed and unperturbed conditions.
  - response: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the
      grand challenge of interpretable genotype-phenotype learning, addressing the fact that
      machine learning models in genomics and precision medicine are often black boxes.
  - response: >-
      To broadly stimulate research and development in "visible" machine learning systems
      informed by multi-scale cell and tissue architecture, by creating a library of
      large-scale maps of cellular structure and function across demographic and disease
      contexts.
  - response: >-
      To ethically leverage state-of-the-art computational and experimental tools in
      biomedical science so as to enable a new generation of transformative artificial
      intelligence research to benefit humanity, with datasets and software made available to
      the research community under minimally restrictive terms consistent with ethical
      guidelines, researcher attribution and research integrity.
  - response: >-
      To implement a standards data management approach based on FAIR access and software
      principles, with deep provenance and replication packages for representation of cell
      maps and their underlying datasets.

addressing_gaps:
  - response: >-
      In genomics and precision medicine, machine learning models are often "black boxes",
      predicting phenotypes from genotypes without understanding the mechanisms by which such
      translation occurs. CM4AI generates matched data and tools to enable creation of visible
      machine learning systems built directly on knowledge maps of cell and tissue
      architecture rather than on opaque models.
  - response: >-
      Datasets used to train and to be analysed by AI/ML models must be AI-Ready - FAIR,
      provenanced, characterised, explainable and ethical. CM4AI addresses the absence of such
      packaging in functional genomics by releasing data with machine-readable provenance
      graphs, schemas, validation procedures and datasheets resolvable from persistent
      identifiers.
  - response: >-
      Cell mapping technologies have typically been applied separately. CM4AI addresses the
      lack of matched, multimodal measurements over the same protein sets in the same cellular
      contexts, which is required to resolve subcellular components robustly across physical
      scales.

tasks:
  - response: >-
      Construction of hierarchical, multi-scale maps of human cell architecture as directed
      acyclic graphs of protein assemblies, by integrating protein-protein interaction and
      spatial proteomics data.
  - response: >-
      Development and training of "visible" machine learning systems, including visible neural
      networks (VNNs), that interrogate how protein assemblies in the cell affect cell-level
      phenotype predictions.
  - response: >-
      Interpretation of genetic variants and mutations in human genomics using cell maps as
      structured priors.
  - response: >-
      Self-supervised representation learning and multi-resolution community detection over
      multimodal protein features.
  - response: >-
      Proteome-wide detection of protein complexes and comparison of complex composition and
      elution profiles between treated and untreated cells and across differentiation states.
  - response: >-
      Mapping of transcriptional and fitness phenotypes associated with genome-scale CRISPRi
      gene perturbation.

acquisition_methods:
  - acquisition_details: >-
      Protein-protein interactions acquired by affinity purification-mass spectrometry (AP-MS)
      on endogenously tagged MDA-MB-468 cell lines, under untreated, paclitaxel-treated and
      vorinostat-treated conditions.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
  - acquisition_details: >-
      Proteome-wide complex and interaction profiles acquired by size-exclusion chromatography
      coupled to mass spectrometry (SEC-MS), used as an orthogonal mass-spectrometry approach
      to AP-MS, in MDA-MB-468 cells with and without treatment and in KOLF2.1J iPSCs and
      iPSC-derived neural progenitor cells, neurons and cardiomyocytes.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
  - acquisition_details: >-
      Subcellular protein localisation acquired by immunofluorescence-based staining (ICC-IF)
      and confocal microscopy of MDA-MB-468 cells, using the Human Protein Atlas resource of
      antibodies.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
  - acquisition_details: >-
      Transcriptional and fitness phenotypes acquired by single-cell CRISPRi perturbation
      screens (perturb-seq) in MDA-MB-468 cells with and without treatment and in KOLF2.1J
      iPSCs.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
  - acquisition_details: >-
      Hierarchical cell maps are inferred rather than measured: interaction and image features
      are embedded separately, co-embedded by contrastive deep learning, and partitioned by
      multi-resolution community detection into a hierarchy of protein assemblies. Such
      computed maps are not included in the June 2026 release.
    was_directly_observed: false
    was_inferred_derived: true
    was_reported_by_subjects: false

collection_mechanisms:
  - mechanism_details: >-
      Affinity purification-mass spectrometry (AP-MS) performed on endogenously tagged cell
      lines. At the time of the CM4AI overview publication 17 genes had been endogenously
      tagged in MDA-MB-468 with AP-MS acquired under three conditions (untreated, paclitaxel
      and vorinostat), with a further 34 genes then being tagged.
  - mechanism_details: >-
      Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide
      complex and interaction mapping, applied to MDA-MB-468 cells under three conditions and
      to KOLF2.1J iPSCs and their differentiated derivatives.
  - mechanism_details: >-
      Immunofluorescence confocal microscopy with automated fixation and permeabilization
      protocols implemented on a pipetting robot for the MDA-MB-468 and KOLF2 cell lines.
      Nuclei were stained with DAPI (blue channel), endoplasmic reticulum with a calreticulin
      antibody (yellow channel), microtubules with a tubulin antibody (red channel) and the
      protein of interest with a Human Protein Atlas antibody (green channel).
  - mechanism_details: >-
      Single-cell CRISPR screens using a CRISPR lentiviral library targeting chromatin factors
      with six guide RNAs per gene, in MDA-MB-468 and KOLF2 lines engineered to express
      inducible dCas9, read out with the 10x Genomics 3'HT kit.

