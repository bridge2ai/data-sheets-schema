third_party_sharing:
  - is_shared: true
    notes: >-
      Component datasets are deposited with third-party repositories outside the creating
      institutions: mass spectrometry data at the MassIVE repository, raw perturb-seq sequence
      data at the NCBI Sequence Read Archive under a BioProject, and the CRISPRi Perturbation
      Atlas of iPSCs at Figshare. Full releases are distributed by the University of Virginia
      Dataverse (LibraData), an NIH-approved generalist repository, and cell maps are shared
      via the Network Data Exchange (NDEx). CM4AI collaborates with the NIH Common Fund Data
      Ecosystem (CFDE) for data curation so as to integrate its contributions into the broader
      scientific community.

intended_uses:
  - use_category: AI-ready data resource
    examples:
      - AI-ready datasets to support research in functional genomics
    usage_notes: >-
      The current release is most suitable for bioinformatics analysis of the individual
      modality datasets; computed cell maps are not yet included.
  - use_category: AI model training
    examples:
      - Training of machine learning models on multimodal cell architecture data
  - use_category: Cellular process analysis
    examples:
      - Analysis of cellular processes from protein interaction, localisation and perturbation data
  - use_category: Comparative and perturbation analysis
    examples:
      - >-
        Analysis of cell architectural changes and interactions in the presence of specific
        disease processes, treatment conditions or genetic perturbations
  - use_category: Interpretable and visible machine learning
    examples:
      - >-
        Development of visible machine learning systems and visible neural networks (VNNs)
        built on knowledge maps of cell and tissue architecture
      - >-
        Interrogation of how protein assemblies in the cell affect cell-level phenotype
        predictions, and interpretation of genetic variants and mutations

prohibited_uses:
  - prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval. The data
      are laboratory measurements from cell lines and are not validated or regulated for
      clinical use.
  - prohibition_reason: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 licence under which the data
      are distributed; any commercial use requires a separate licence negotiation with the
      copyright holder (UCSD, Stanford and/or UCSF depending upon the specific data package).

discouraged_uses:
  - discouragement_details: >-
      Analyses that depend on the integrated, computed multiscale cell maps are discouraged
      using this release, because such maps are not included; the release is an interim one
      most suitable for bioinformatics analysis of the individual modality datasets.
  - discouragement_details: >-
      Generalising findings to human population-level biological variation is discouraged: the
      data derive from two commercially available de-identified human cell lines that do not
      represent all biological variants seen in the population at large.
  - discouragement_details: >-
      Cross-modality analyses that assume complete protein coverage are discouraged, since the
      protein sets interrogated by SEC-MS, immunofluorescence imaging and CRISPRi perturb-seq
      incompletely overlap.

other_tasks:
  - task_details: >-
      Beyond map construction, the individual modality datasets support proteome-wide
      identification of protein complexes and comparison of complex composition and elution
      profiles between control and drug-treated cells; SEC-MS in MDA-MB-468 detected
      protein-protein interaction profiles for over a thousand complexes, with thousands of
      proteins exhibiting differential elution profiles between control and paclitaxel- or
      vorinostat-treated cells, and identified 72 of 100 chromatin modifiers of interest, 52 of
      them as integral components of protein complexes.
  - task_details: >-
      Integrative structure modelling of protein assemblies. A bioinformatics pipeline
      annotates MuSIC communities by the structural information available for their members
      and interactions - from the Protein Data Bank, the AlphaFold Protein Structure Database,
      crosslinking mass spectrometry and prediction of disordered sequence segments - and ranks
      communities by the amount of available structural information as a proxy for modelling
      feasibility, with top-ranked communities modelled using the open-source Integrative
      Modeling Platform.
  - task_details: >-
      Analysis of transcriptional and fitness phenotypes associated with genome-scale gene
      perturbation in induced pluripotent stem cells, independently of the cell mapping
      objective.

existing_uses:
  - examples:
      - >-
        CM4AI initial datasets, tools and standards were made available at a CM4AI CodeFest in
        March 2024, accompanied by detailed tutorials explaining how the data were derived and
        integrated and providing production-ready software for producing the datasets; the
        inaugural virtual CodeFest trained 38 registrants.
  - examples:
      - >-
        The associated publication "A Perturbation Cell Atlas of Human Induced Pluripotent Stem
        Cells" (Nourreddine et al., bioRxiv 2024, PMCID PMC11580897) reports analysis of the
        expressed genome-scale CRISPRi perturbation data included in these releases, with
        findings validated via phenotypic, protein-interaction and metabolic tracing assays.
  - examples:
      - >-
        The CM4AI data and tools are disseminated through the CM4AI web portal built on the
        U-BRITE platform, which supports open and trustworthy data management and sharing.

future_use_impacts:
  - impact_details: >-
      CM4AI anticipates potential applications of the data and derived AI/ML systems and
      integrates them into data governance frameworks in order to optimise benefits and
      mitigate potential risks, and to promote their use for the collective good. The Ethics
      module is developing guidelines and best practices, a repository of values, a CM4AI Life
      Cycle framework describing governance milestones throughout data generation and AI system
      development, and a suite of tools intended to enhance awareness of the ethical, legal and
      social ramifications associated with CM4AI data and the resulting AI systems.
  - impact_details: >-
      The project intends the data to broadly stimulate research and development in visible
      machine learning systems informed by multi-scale cell and tissue architecture, to deepen
      understanding of processes of human disease and health, to enable development of novel
      cures, and to stimulate a diverse portfolio of training opportunities in the emerging
      field of biomachine learning.

use_repository:
