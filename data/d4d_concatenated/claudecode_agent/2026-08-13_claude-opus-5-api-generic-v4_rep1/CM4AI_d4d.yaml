      and the prey proteins recovered with it, in a given treatment condition.
    data_substrate: B2AI_SUBSTRATE:58
    data_topic: B2AI_TOPIC:26
  - instance_type: >-
      Single-cell transcriptional profile from a CRISPRi perturb-seq screen, associated with
