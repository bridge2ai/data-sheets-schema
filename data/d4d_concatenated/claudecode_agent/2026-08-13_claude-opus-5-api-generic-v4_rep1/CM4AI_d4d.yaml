id: doi:10.18130/V3/HIGT4C
name: Cell Maps for Artificial Intelligence (CM4AI)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Bridge2AI program. It produces AI-ready,
  multimodal measurements of human cell architecture and, ultimately, machine-readable
  hierarchical maps of subcellular organisation. In such a map, each node is an assembly of
  proteins in proximity at a given scale, spanning large assemblies that represent cell
  compartments such as the nucleus and mitochondria down to small assemblies of proteins in
  close proximity such as protein complexes or subunits, with edges representing containment
  of a smaller assembly by a larger one.


  Data are generated in two disease-relevant human cell lines under perturbed and unperturbed
  conditions: the triple-negative breast cancer line MDA-MB-468 (untreated, or treated with
  paclitaxel or vorinostat) and the induced pluripotent stem cell line KOLF2.1J
  (undifferentiated, or differentiated into neural progenitor cells, neurons or
  cardiomyocytes). Three complementary experimental modalities are used: mass-spectrometry
  proteomics for protein-protein interactions, by affinity purification-mass spectrometry
  (AP-MS) on endogenously tagged lines and by size-exclusion chromatography-mass spectrometry
  (SEC-MS) for proteome-wide complex mapping; immunofluorescence confocal imaging for spatial
  proteomics using Human Protein Atlas antibodies; and single-cell CRISPRi perturbation
  sequencing (perturb-seq). Targets were selected around 100 chromatin modifiers and 100
  metabolic enzymes implicated in cancer, neuropsychiatric and cardiac disorders, with
  genome-scale CRISPRi coverage in the iPSC arm.


  This record describes the June 2026 Data Release (Beta), distributed through the University
  of Virginia Dataverse as ten ZIP archives. It contains perturb-seq data for MDA-MB-468 cells
  with and without treatment and for undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data
  for MDA-MB-468 cells with and without treatment and for undifferentiated KOLF2.1J iPSCs and
  iPSC-derived neural progenitor cells, neurons and cardiomyocytes; AP-MS data for treated
  MDA-MB-468 cells; and immunofluorescence images of MDA-MB-468 cells with and without
  treatment. Releases are quarterly and explicitly interim: computed cell maps are not yet
  included, and some component datasets are under temporary pre-publication embargo.


  Outputs are packaged as RO-Crates with provenance graphs and rich metadata by the FAIRSCAPE
  framework, and are integrated by the Multi-Scale Integrated Cell (MuSIC) pipeline, which
  embeds interaction and image data separately, co-embeds them by contrastive deep learning,
  and applies multi-resolution community detection to produce a hierarchy of protein
  assemblies. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA
  Birmingham, Simon Fraser University and the Hastings Center.
