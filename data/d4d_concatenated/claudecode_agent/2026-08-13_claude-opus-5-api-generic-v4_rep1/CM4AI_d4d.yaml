notes: >-
  The CM4AI project portal reports project-wide totals across all releases of 1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739
  genes targeted and 21.4 TB of data volume. The project is organised into three pillars -
  Data, People and Ethics - implemented as six modules: Data Acquisition; Tools; Standards;
  Teaming; Skills and Workforce Development; and Ethics. The Teaming module maintains a
  scholarly "talent graph" linking CM4AI investigators to their peer-reviewed publications,
  and the Skills and Workforce Development module runs virtual training, CodeFests and an
  in-person internship co-hosted at Yale University and the University of California San
  Diego, supported by a Diversity, Equity and Inclusion Committee with partnerships including
  Meharry Medical College and Morehouse School of Medicine.

source_caveats: |-
  1. The declared bundle includes the Nature 2025 paper "Multimodal cell maps as a foundation
  for structural and functional genomics", which reports a cell map of U2OS osteosarcoma cells
  and acknowledges Bridge2AI support (OT2 OD032742). That study's data - AP-MS interactions,
  immunofluorescence images and SEC-MS profiles in U2OS cells, deposited at NDEx, MassIVE
  (MSV000097168), ProteomeXchange (PXD052362), the Human Protein Atlas v23 release, the EBI
  Complex Portal and ModelArchive - constitute a distinct dataset and are not part of the CM4AI
  Dataverse releases described by this record. Methodological statements attributed to CM4AI
  here are taken from the CM4AI overview preprint, the CM4AI portal and the Dataverse release
  documentation, not from the U2OS study.
  2. Release-date conflict: the CM4AI data releases page states that the June 2026 Data Release
  was "Released on: June 17, 2025", while the Dataverse record for doi:10.18130/V3/HIGT4C gives
  a publication date of 2026-06-17. The Dataverse date has been used here.
  3. File-date conflict: the June 2026 Dataverse record is version 2.0 published 2026-06-17,
  but the three immunofluorescence archives are recorded as published 2026-07-15, after the
  stated version publication date. last_updated_on has been set from the later file date.
  4. Immunofluorescence coverage is reported inconsistently: 563 proteins in the March 2025
  release, 464 proteins in the June 2025 and October 2025 releases, and 523 proteins on the
  CM4AI portal's flagship-dataset summary for the breast cancer arm. The June 2026 release
  restates no figure, and the MD5 checksums of the identically named image archives differ from
  those in the October 2025 release, indicating the contents changed. Neither a protein count
  nor an image count has been asserted for the June 2026 imaging data; the portal figure of
  53,788 images is a project-wide total across all releases and both cell lines and is recorded
  in the record-level notes rather than as an instance count.
  5. Project end-date conflict: the release documentation states that updates will continue
  "through the end of the project in November 2026", while NIH RePORTER records a project end
  date of 2026-08-31. Both are recorded, the RePORTER dates in collection_timeframes and the
  November 2026 statement in the timeframe details and update plan.
  6. The CM4AI overview preprint (May 2024) reports Year 1 status - for example 17 endogenously
  tagged genes in MDA-MB-468 with 34 more in progress, and CRISPR screen data then undergoing
  QC - which has been superseded by later releases. Figures from that preprint are recorded here
  only where later sources do not contradict them, and are flagged as of that date.
  7. Dataverse metadata for the June 2026 release records a Data Creation Date and Deposit Date
  of 2025-02-27, the same values carried by the March 2025 and June 2025 release records, so
  these appear to be inherited from the earliest deposit rather than specific to the June 2026
  release. created_on has been populated from this field notwithstanding.
  8. The portal statistics (1,374 protein interactions; 53,788 immunofluorescent images; 7,023
  proteins investigated; 11,739 genes targeted; 21.4 TB) are given project-wide without a
  release attribution, a capture date, or a definition of what is counted as an interaction.
  9. The June 2026 Dataverse landing page lists file names, sizes, checksums and publication
  dates but no per-file descriptions. Content descriptions recorded in file_collections for
  identically named archives are drawn from the October 2025 release listing, which does
  provide descriptions; the differing checksums indicate that contents were updated.
  10. Several archives in the June 2026 release are only tens to hundreds of kilobytes - the
  SEC-MS archives are 171.8 KB and 93.9 KB and the perturb-seq archives 30.2 KB and 73.3 KB -
  and are markedly smaller than their October 2025 counterparts (23.8 MB and 23.0 MB for
  SEC-MS). The March 2025 release listed these components as ro-crate-metadata.json files
  pointing to externally deposited data. This is consistent with the archives containing
  RO-Crate metadata and pointers to data held at MassIVE, SRA and Figshare rather than the
  measurement data themselves, but the release documentation does not state this explicitly.
  11. The June 2026 Dataverse citation names 47 authors, all of whom are recorded in the
  citation slot. Structured Creator objects are limited to the seven individuals for whom the
  bundle documents a specific leadership or contribution role - the principal investigator, the
  Standards module lead, the three laboratory or senior authors credited with generating the
  SEC-MS/AP-MS, imaging and perturb-seq data, the named ethical review lead and the structure
  modelling lead - because Creator's only person-valued field is principal_investigator, and
  populating it for every listed author would assert 47 principal investigators. The CM4AI
  release documentation contains no CRediT contributor-roles statement; the credit_roles
  recorded are assigned from documented contributions (Dataverse file descriptions attributing
  SEC-MS and AP-MS data to the Krogan laboratory and immunofluorescence images to the Lundberg
  Lab, NIH RePORTER listing Trey Ideker as principal investigator, and the module descriptions
  in the CM4AI overview publication) rather than transcribed from a contributions statement.
  12. Structured affiliations are recorded only where the bundle supplies a persistent
  organisational identifier. The June 2026 Dataverse metadata gives a ROR identifier for the
  University of Virginia (https://ror.org/0153tk833) and none for the other institutions, so
  affiliations is populated for the University of Virginia creator alone; remaining
  institutional affiliations are stated in the citation, the description and the creator notes.
  13. The bundle does not contain the release RO-Crate metadata files themselves, the JSON-Schema
  data dictionaries they reference, or the resolved external repository accessions; MassIVE,
  Figshare and SRA appear only as unresolved link text in the captured pages. Variable-level
  metadata recorded here therefore describes the documented experimental design factors rather
  than transcribed data dictionaries.
  14. The CM4AI portal lists AP-MS interactomes for the breast cancer arm and immunofluorescence
  images for the iPSC arm as "coming soon", while the June 2026 Dataverse release does include
  AP-MS archives for paclitaxel- and vorinostat-treated MDA-MB-468 cells; the portal summary
  appears not to have been updated for that release.
  15. Affiliation conflict for Andrej Sali: the Dataverse release metadata records the
  University of California San Diego, while the CM4AI overview preprint author list places him
  at the University of California San Francisco. No affiliation is asserted for this creator.