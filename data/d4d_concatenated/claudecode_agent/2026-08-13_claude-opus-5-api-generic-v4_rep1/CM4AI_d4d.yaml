    description: >-
      Multimodal data generated in the MDA-MB-468 triple-negative breast cancer cell line
      under three conditions: untreated (DMSO control), treated with paclitaxel, and treated
      with vorinostat. MDA-MB-468 was established from a metastatic site pleural effusion of a
      51-year-old black female with a metastatic mammary adenocarcinoma; CM4AI selected it as
      an ethically sourced line that has been extensively used to study triple-negative breast
      cancer and is well characterised, with transcriptomic, mutational-profile and
      whole-genome sequencing data available. The CM4AI portal summarises the curated dataset
