    target_dataset: 10.60775/fairhub.2
  - relationship_type: is_new_version_of
    target_dataset: 10.60775/fairhub.1

external_resources:
  - external_resources:
      - https://docs.aireadi.org/
      - https://aireadi.org/
      - https://github.com/AI-READI
      - https://zenodo.org/communities/aireadi
      - https://cds-specification.readthedocs.io/en/v0.1.1/
      - https://commonfund.nih.gov/bridge2ai
      - https://aireadi.org/goals/data-sharing
    future_guarantees:
      - >-
        The dataset is self-contained but relies on the dataset documentation at docs.aireadi.org
        for users requiring additional information about its provenance; that site maintains one
        documentation version per dataset version, selectable from a version dropdown. All data
        files are in formats accessible with freely available software commonly used for such data
        types, so no specific software is required.
    restrictions:
      - >-
        The documentation is shared under the CC-BY 4.0 licence, so there are no restrictions
        associated with its use.

relationships:
  - relationship_details:
      - >-
        All instances are part of the same prospective data generation project (AI-READI). There is
        currently only one study visit per participant, so instances are independent individuals
        rather than repeated measures; approximately 10 per cent of the cohort is planned to be
        invited back for a follow-up visit in year 4 of the project, forming a longitudinal arm.
        Within a participant, records across the nine data-type directories are linked by the
        participant identifier used to name the participant-level folders and recorded in
        participants.tsv.

anomalies:
  - anomaly_details:
      - >-
        In survey data, skipped questions and incomplete responses are expected.
  - anomaly_details:
      - >-
        In wearable device data, improper use and technical failures such as battery failure or
        system malfunction are expected; in a few cases the device had no stored results or was
        returned too late for the results to be retrieved.
  - anomaly_details:
      - >-
        In imaging data, participant non-cooperation, noise that may obscure the images, system
        malfunction and data transfer failures are expected.
  - anomaly_details:
      - >-
        Because Optomed Aurora images are taken undilated with a handheld camera in a dark room, it
        is challenging to obtain a good view and image quality varies from participant to
        participant and within the same participant.
  - anomaly_details:
      - >-
        Fluorescence lifetime imaging ophthalmoscopy takes longer than a standard Spectralis OCT
        and exposes participants to uncomfortable levels of light, so it is performed last in the
        visit and participants may not be at their best possible compliance.
  - anomaly_details:
      - >-
        Operator-driven acquisition on the Heidelberg Spectralis, which is not fully automated, can
        give rise to quality issues that may lead to skipping the modality and to missing data.
  - anomaly_details:
      - >-
        In a few cases a data collision at some point in the processing pipeline resulted in lost
        data.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers recruited from health-system patient populations, so there is
      selection bias known as volunteer bias, which may limit the generalisability of results among
      those who are not represented in the study population.
    mitigation_strategy: >-
      Recruitment proceeds in waves with monitoring of participation characteristics in terms of
      diversity and inclusion, with under- and oversampling of groups as needed, and across three
      geographically distinct sites.
  - bias_type: selection_bias
    bias_description: >-
      It is well documented that recruiting Black men into health research is more difficult than
      recruiting other populations, driven in part by medical mistrust and fear of safety stemming
      from historical events such as the Tuskegee syphilis study, yet this population bears a
      disproportionate burden of type 2 diabetes. Similar trends of under-recruitment and disease
      burden have been reported for Hispanic and Asian persons.
    mitigation_strategy: >-
      Strategies identified in the literature, such as tailoring printed materials and using a
      personalised, participatory approach to recruitment, are applied, and new recruitment
      strategies will be implemented if balancing on race/ethnicity emerges as a challenge.
  - bias_type: representation_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based and may not fully capture diverse
      cultural and socioeconomic backgrounds. The cohort does not include other races and
      ethnicities such as Pacific Islanders and Native Americans. Requiring that eligible
      participants speak, read and understand English may have created challenges in recruiting
      Hispanic and Asian persons.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic diversity across the United
      States and to ensure diverse representation across racial and ethnic groups, with individuals
      from all demographic backgrounds recruited at all three sites; a supplement was sought to
      fund translation of study materials so that Spanish-speaking participants could be enrolled.
  - bias_type: sampling_bias
    bias_description: >-
      Although the target cohort is triple-balanced by race/ethnicity, biological sex and diabetes
      severity, enrolment is ongoing and interim releases, including the pilot release and periodic
      updates, may not have achieved balanced distribution across groups.
    mitigation_strategy: >-
      Recruitment composition is monitored and adjusted between waves, and the released recommended
      data split balances the validation and test sets as far as possible for sex, race/ethnicity
      and diabetes status.
  - bias_type: measurement_bias
    bias_description: >-
      Several measures were acquired with more than one device model across sites, for example
      three different blood pressure monitors and three different lensometers, and imaging was
      acquired on several devices with differing degrees of operator involvement, which may
      introduce device- and operator-dependent measurement differences.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all participants irrespective of
      race/ethnicity, biological sex or diabetes severity across all study sites; device make and
      model and the specific scan modality were documented to ensure repeatability; and multiple
      devices for one measure were deliberately included to enhance generalisability and represent
      the diverse range of equipment used in clinical settings.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The cohort is deliberately balanced rather than population-representative, and interim
      releases have not achieved the intended balanced distribution across race/ethnicity, sex and
      diabetes severity groups.
    scope_impact: >-
      Prevalence estimates and any analysis assuming a population-representative or fully balanced
      sample will be biased.
    recommended_mitigation: >-
      Use the released group counts and the recommended data split, whose validation and test sets
      are balanced as far as possible, and treat the dataset as a balanced training resource rather
      than an epidemiological sample.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants, because some participants elected not
      to take part in some study elements and because of device failures, late device returns and
      occasional data loss.
    scope_impact: >-
      Complete-case analyses across all modalities will use fewer than the 2,280 participants
      represented in the dataset.
  - limitation_type: scope_limitation
    limitation_description: >-
      The public release excludes sex, race, ethnicity, medications, 5-digit ZIP code, genetic
      sequencing data, past health records, and traffic and accident reports; these are available
      only under controlled access through a data use agreement.
    scope_impact: >-
      Fairness auditing and analyses conditioned on demographic, geographic, pharmacological or
      genomic variables are not possible with the public dataset alone.
    recommended_mitigation: >-
      Apply for the controlled access version, which contains all data in the public set plus the
      more sensitive elements.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The study is cross-sectional with a single visit per participant; longitudinal data are
      planned only for a subgroup of the cohort at a follow-up visit in year 4 of the project and
      are not present in this release.
    scope_impact: >-
      Disease trajectories cannot be measured directly and must instead be inferred across
      participants, for example by pseudotime manifold analysis.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No explicit labels or targets are provided and no labeling was performed; the dataset is
      hypothesis-agnostic, and the creators state they have no formal guidelines for researchers
      creating new labels or defining new tasks.
    scope_impact: >-
      Users must define their own outcome definitions and labeling conventions, which may limit
      comparability across studies using the dataset.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Eligibility is restricted to adults aged 40 to 85 years who are able to provide consent and
      who speak and read English; pregnancy, gestational diabetes and type 1 diabetes are
      exclusionary.
    scope_impact: >-
      Findings do not extend to younger adults, children, pregnant people, people with type 1 or
      gestational diabetes, or people who do not read and speak English.
  - limitation_type: scope_limitation
    limitation_description: >-
      Snellen visual acuity variables were dropped in version 3.0.0, so only logMAR visual acuity
      measurements are available in this release.
    scope_impact: >-
      Analyses depending on Snellen notation must convert from logMAR or use an earlier dataset
      version.

content_warnings:
  - content_warnings_present: false

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details:
      - >-
        The publicly released dataset does not contain data considered sensitive. It carries no
        protected health information as defined by the HIPAA Privacy Rule, and information related
        to the sex and race/ethnicity of participants and to medications used has been removed. The
        sensitive elements collected by the study are held instead in a companion controlled access
        dataset, which contains 5-digit ZIP code, sex, race, ethnicity, genetic sequencing data,
        past health records, medications, and traffic and motor vehicle accident reports; access to
        that version requires entering into a data use agreement and is available only to
        scientists whose institutions have completed legal and privacy use agreements with the
        AI-READI research programme.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details:
      - >-
        The creators state that the dataset does not contain data that might be considered
        confidential, such as data protected by legal privilege or doctor-patient confidentiality
        or the content of individuals' non-public communications, and that no personally
        identifiable information is included.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    Reported inconsistently across sources. The FAIRhub dataset description records the
    de-identification type as "NoDeIdentification", explaining that no identifiers were collected
    so no active de-identification was necessary, while flagging direct identifiers and HIPAA
    identifiers as removed and date shifting, non-arrangement and k-anonymity as not applied. The
    Nature Metabolism comment states instead that the public set is stripped of Protected Health
    Information via the HIPAA Privacy Rule "Safe Harbor" method.
  identifiers_removed:
    - Protected Health Information as defined by the HIPAA Privacy Rule
    - Sex
    - Race and ethnicity
    - Medications
  deidentification_details:
    - >-
      The team checked that no data identifiable under US HIPAA were present in the released data.
      The public set is additionally stripped of information related to the sex and race/ethnicity
      of participants in order to prevent stigmatization of findings. The dataset has been reviewed
      internally by AI-READI team members for quality checks and to ensure that no personally
      identifiable information was accidentally included; it has not undergone any formal external
      audit. The creators note a theoretical risk of future re-identification, since AI algorithms
      can infer individual patient characteristics and could facilitate individual-level
      identification, and they implement a robust data dissemination system, a strict licence
      agreement and data watermarking for both public and controlled sets to deter
      re-identification attempts.

variables:
  - variable_name: HbA1c
    unit: '%'
    data_type: float
    measurement_technique: >-
      Whole blood assay performed by the University of Washington Nutrition and Obesity Research
      Center on stored frozen samples.
    quality_notes:
      - >-
        Included as a marker for diabetes. Laboratory-provided reference range 4.0 to 6.0 per cent.
  - variable_name: Glucose
    unit: mg/dL
    data_type: float
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    quality_notes:
      - Marker for diabetes. Laboratory-provided reference range 62 to 125 mg/dL.
  - variable_name: Continuous blood glucose
    unit: mg/dL
    data_type: float
    measurement_technique: >-
      Dexcom G6 continuous glucose monitor, recording a measurement every 5 minutes over a ten-day
      at-home monitoring period; participants were masked to the results during monitoring.
  - variable_name: C-peptide
    unit: ng/mL
    data_type: float
    quality_notes:
      - Indicator of insulin production. Reference range 1.1 to 4.4 ng/mL.
  - variable_name: Insulin
    unit: ng/mL
    data_type: float
    quality_notes:
      - Marker for diabetes. Reference range 0.0 to 24.9 ng/mL.
  - variable_name: N-terminal pro-B-type natriuretic peptide (NT-proBNP)
    unit: pg/mL
    data_type: float
    quality_notes:
      - >-
        Severity and outcome predictor of heart failure. Reference range varies by age. Measured in
        EDTA plasma.
  - variable_name: Troponin-T
    unit: ng/L
    data_type: float
    quality_notes:
      - >-
        Marker of myocardial injury. Reference range female less than 11, male less than 16.
  - variable_name: C reactive protein, high sensitivity
    unit: mg/L
    data_type: float
    quality_notes:
      - >-
        Inflammation marker and risk factor for type 2 diabetes. Reference range 0.0 to 10.0 mg/L.
  - variable_name: Total cholesterol
    unit: mg/dL
    data_type: float
    quality_notes:
      - Cardiovascular disease risk factor. Reference range less than 200 mg/dL.
  - variable_name: Triglycerides
    unit: mg/dL
    data_type: float
    quality_notes:
      - Cardiovascular disease risk factor. Reference range less than 150 mg/dL.
  - variable_name: High-density lipoprotein cholesterol
    unit: mg/dL
    data_type: float
    quality_notes:
      - Cardiovascular disease risk factor. Reference range greater than 39 mg/dL.
  - variable_name: Low-density lipoprotein cholesterol
    unit: mg/dL
    data_type: float
    derivation: Calculated rather than directly measured.
    quality_notes:
      - Cardiovascular disease risk factor. Reference range less than 130 mg/dL.
  - variable_name: Creatinine
    unit: mg/dL
    data_type: float
    quality_notes:
      - >-
        Marker for kidney function. Reference range female 0.38 to 1.02, male 0.51 to 1.18 mg/dL.
  - variable_name: Blood urea nitrogen
    unit: mg/dL
    data_type: float
    quality_notes:
      - Marker for kidney and liver function. Reference range 8.0 to 21.0 mg/dL.
  - variable_name: Urine albumin
    unit: mg/dL
    data_type: float
    quality_notes:
      - >-
        Urinary biomarker for early diabetic nephropathy. No reference range provided by the
        testing laboratory.
  - variable_name: Urine creatinine
    unit: mg/dL
    data_type: float
    quality_notes:
      - >-
        Urinary biomarker for early diabetic nephropathy. No reference range provided by the
        testing laboratory.
  - variable_name: White blood cell count
    unit: x10E3/uL
    data_type: float
    measurement_technique: >-
      Complete blood count performed on fresh whole blood by a CLIA-certified laboratory local to
      each data collection site.
    quality_notes:
      - Reference range 3.4 to 10.8 x10E3/uL.
  - variable_name: Haemoglobin
    unit: g/dL
    data_type: float
    measurement_technique: Complete blood count on fresh whole blood at a local CLIA-certified laboratory.
    quality_notes:
      - Reference range 11.1 to 17.7 g/dL.
  - variable_name: Systolic blood pressure
    unit: mm Hg
    data_type: float
    measurement_technique: >-
      Automatic oscillometric, medically approved device (OMRON HEM 907XL, Medline MDS4001 or Welch
      Allyn 6000 series), measured twice separated by two minutes.
    quality_notes:
      - >-
        Readings over 180 mm Hg or under 100 mm Hg with symptoms of haemodynamic instability
        triggered a recommendation for emergency care.
  - variable_name: Diastolic blood pressure
    unit: mm Hg
    data_type: float
    measurement_technique: >-
      Automatic oscillometric, medically approved device, measured twice separated by two minutes.
    quality_notes:
      - >-
        Readings over 120 mm Hg or under 60 mm Hg with symptoms of haemodynamic instability
        triggered a recommendation for emergency care.
  - variable_name: Heart rate
    unit: beats per minute
    data_type: float
    measurement_technique: >-
      Read from the blood pressure device at the visit, and separately from the Garmin Vivosmart 5
      during at-home monitoring.
  - variable_name: Body mass index
    data_type: float
    derivation: Calculated from measured height and weight.
  - variable_name: Waist-hip ratio
    data_type: float
    derivation: Calculated from measured waist and hip circumference.
  - variable_name: Montreal Cognitive Assessment total score
    data_type: integer
    minimum_value: 0
    maximum_value: 30
    measurement_technique: >-
      MoCA administered electronically on an iPad using the MoCA Duo application; section
      subscores, Memory Index Score and task completion times are also recorded.
    quality_notes:
      - >-
        Higher numbers represent better performance; a total score of 26 and above is considered
        normal and below 24 is a sign of cognitive impairment. Scores may be affected by a person's
        level of education, socioeconomic factors, and depression or other mental health
        conditions.
  - variable_name: Best-corrected visual acuity (logMAR)
    data_type: float
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres, right and left eyes tested
      separately under photopic conditions and under mesopic conditions through a 2.0 neutral
      density filter.
    quality_notes:
      - >-
        Expressed as the logarithm of the minimum angle of resolution; lower numbers indicate
        better resolution. Snellen visual acuity variables were dropped in version 3.0.0.
  - variable_name: Letter contrast sensitivity (log CS)
    data_type: float
    measurement_technique: >-
      Mars Letter Contrast Sensitivity chart read monocularly at approximately 50 cm under photopic
      conditions with a general occluder and under mesopic conditions with a neutral density
      occluder; testing terminated after two consecutive errors or at the end of the chart.
    quality_notes:
      - >-
        Expressed as log sensitivity, with higher numbers meaning better sensitivity. Chart
        background luminance was maintained between 60 and 120 cd/m2, optimally 85 cd/m2.
  - variable_name: Monofilament test response
    data_type: categorical
    measurement_technique: >-
      10 g monofilament applied at three locations on each foot, ten times per location, with the
      participant's eyes closed and shoes and socks removed; insensate areas were retested for
      confirmation.
    categories:
      - sensate (participant reports feeling the filament)
      - insensate (participant does not feel the filament after it bends)
  - variable_name: Autorefraction (spherical and cylindrical components with cylindrical axis)
    unit: diopter
    data_type: float
    measurement_technique: Topcon KR 800 autorefractor/keratometer using its standard protocol, for each eye.
  - variable_name: Number of steps
    data_type: integer
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for ten days.
  - variable_name: Oxygen saturation
    unit: '%'
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor.
  - variable_name: Sleep duration
    data_type: float
    measurement_technique: >-
      Garmin Vivosmart 5, capturing circadian and diurnal rhythm and sleep phases over the ten-day
      monitoring period.
  - variable_name: Ambient temperature
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the participant's home for ten days.
  - variable_name: Relative humidity
    unit: '%'
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor.
  - variable_name: Particulate matter (PM1.0, PM2.5, PM4, PM10)
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor incorporating a Sensirion SEN5x module.
  - variable_name: Nitrogen oxides (NO and NO2)
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor; a Sensirion NOx Index is used.
  - variable_name: Volatile organic compounds
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor.
  - variable_name: Multi-spectral light intensity measurements
    data_type: array
    measurement_technique: >-
      LeeLab Anura custom environmental sensor incorporating an ams-OSRAM AS7431 sensor; eleven
      spectral channels are recorded.
  - variable_name: 12-lead electrocardiogram waveform
    data_type: array
    measurement_technique: >-
      Philips PageWriter TC30 Cardiograph recorded while the participant sat reclining or lay
      supine, with the position relative to supine (0, 30, 60 or 90 degrees) recorded; exported as
      .xml and converted to WaveForm DataBase format.
  - variable_name: Participant identifier
    data_type: identifier
    is_identifier: true
    quality_notes:
      - >-
        The participant ID number used in the study; it names each participant-level directory
        across the nine data-type directories and is recorded in participants.tsv.

distribution_dates:
  - release_dates:
      - '2024-05-03'
      - '2024-11-08'
      - '2025-11-17'

third_party_sharing:
  - is_shared: true

license_and_use_terms:
  data_use_permission:
    - disease_specific_research
  contact_person: contact@aireadi.org
  license_terms:
    - >-
      Version 3.0.0 is released under the AI-READI custom license v2.0, identified by
      https://doi.org/10.5281/zenodo.17555036 and included with the dataset as LICENSE.txt. It is
      described as a custom licence specifically tailored to enable reuse of the AI-READI dataset
      and other clinical datasets for commercial or research purposes while placing strong
      requirements around data usage, security and secondary sharing to protect study participants,
      especially when data are reused for artificial intelligence and machine learning
      applications; the full text of v2.0 is not reproduced in the sources consulted. Access is
      recorded as PublicDownloadSelfAttestationRequired and requires logging in through a verified
      ID system, agreeing to use the data only for type 2 diabetes related research, and agreeing
      to the licence terms. The dataset consent record notes a two-tier arrangement: the public
      version of the dataset may be used only for type 2 diabetes related research, while a
      private, controlled access version will allow more generic use under a data use agreement. An
      earlier and now superseded instrument, the University of Washington Data License Agreement
      v1.0 (https://doi.org/10.5281/zenodo.10642459), governed earlier releases; it granted a
      non-exclusive, non-transferable licence to download, reproduce and use the data and to create
      derivative works for research and commercial purposes, subject to restrictions on secondary
      conveyance, a prohibition on clinical treatment decisions and on re-identification, a
      requirement to acknowledge the source and any funder in publications, compliance with NIH
      Genomic Data Sharing security best practices, an as-is disclaimer of warranty, a liability
      cap of one US dollar, and automatic termination upon breach requiring deletion of all copies.

regulatory_restrictions:
  governance_committee_contact: AI-READI Data Access Committee, contact@aireadi.org
  regulatory_restrictions:
    - >-
      Licensees must comply with all data security and privacy standards established by the US
      National Institutes of Health under its Genomic Data Sharing Policy, currently the NIH
      Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
    - >-
      Licensees must comply with all applicable laws, regulations and restrictions relating to the
      distribution and use of the data and of models derived from it.
    - >-
      Access to the controlled access dataset is restricted to scientists whose institutions have
      completed legal and privacy use agreements with the AI-READI research programme; the
      requirements are administered by the Data Access Committee.
  other_compliance:
    - >-
      The healthsheet answers the questions about export controls and other regulatory restrictions
      by referring to the licence; no export control regime such as ITAR or EAR is identified as
      applying to the dataset. The public dataset is stripped of Protected Health Information under
      the HIPAA Privacy Rule Safe Harbor method, and clinical results returned to participants are
      sent by HIPAA-compliant encrypted email.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details:
      - >-
        AI-READI was approved by the Institutional Review Board of the University of Washington
        under approval number STUDY00016228, with initial approval received on 20 December 2022 and
        reliance agreements with the IRBs of the University of Alabama at Birmingham and the
        University of California, San Diego. An annual renewal application to the IRB reporting the
        status and progress of the study is required and is due within 90 days of expiration.
        Written informed consent is provided by all participants. The FAIRhub study record lists
        the human subject review status as submitted and approved, with no data monitoring
        committee and no FDA regulation of drugs or devices.
  - reviewing_organization: AI-READI Community Advisory Board
    review_details:
      - >-
        A Community Advisory Board of 11 persons drawn from the three study sites, including
        diversity in race and ethnicity as represented in the AI-READI sample, contributes to the
        development of the protocol, evaluates the consent forms and research protocols, and
        provides feedback that is considered in protocol modifications. Patients and the public
        were involved in the design, conduct, reporting and dissemination plans of the research.
  - reviewing_organization: AI-READI ethics, legal and social implications team and consulting bioethicists
    review_details:
      - >-
        AI-READI aims to establish standards, best practices and guidelines for the collection,
        preparation and sharing of the data for AI/ML purposes, including guidance from
        bioethicists. Ethical, legal and social implications are considered at every stage of the
        project cycle, and the team reviewed existing documentation approaches such as datasheets
        and healthsheets to identify the most suitable one for biomedical data.
  - reviewing_organization: Native Biodata Consortium
    review_details:
      - >-
        Through engagement with the Native Biodata Consortium and a planned tribal consultation,
        the project addresses barriers and facilitators of participation for American Indian and
        Alaska Native communities and evaluates tools such as data usage agreements, contract
        negotiations, transparent access agreements, and forms of assured return of benefit and
        sustainable input, control and monitoring of tribal data.

human_subject_research:
  involves_human_subjects: true
  ethics_review_board:
    - >-
      University of Washington Institutional Review Board, with reliance agreements from the IRBs
      of the University of Alabama at Birmingham and the University of California, San Diego.
  irb_approval:
    - >-
      STUDY00016228, initially approved 20 December 2022, with annual renewal required within 90
      days of expiration.
  regulatory_compliance:
    - >-
      The study is registered on ClinicalTrials.gov as NCT06002048 and is recorded as an
      observational cohort study with a cross-sectional time perspective, not a patient registry,
      not FDA-regulated for drugs or devices, and without a data monitoring committee. Data
      handling complies with HIPAA, results returned to participants are sent by HIPAA-compliant
      encrypted email, and licensees must comply with NIH Genomic Data Sharing security best
      practices.

informed_consent:
  - consent_obtained: true
    consent_type:
      - >-
        Written informed consent, obtained electronically through REDCap for most participants or
        in person at the start of the study visit for those who did not select the electronic
        option.
    consent_documentation:
      - >-
        Informed consent to participate was required before participation in any part of the
        protocol, including the questionnaires. Potential participants could read all consent
        documentation electronically before their visit and give consent with an electronic
        signature without verbal communication with a clinical research coordinator, could decide
        at that point not to participate, or could request additional information, a call back or a
        video conference. Consent was obtained in a private room when performed in person, and
        participants were given the opportunity to ask questions and could take the form away and
        return later. Signed electronic consent forms were automatically emailed to participants,
        who could request an additional copy from the study coordinator at any time during the
        study. The approved consent form for the principal project site, the University of
        Washington, is published with the dataset documentation; the other clinical sites operated
        under IRB reliance and used the same consent form with minor institution-specific language.
    consent_scope:
      - >-
        Consent covers participation in the study protocol including questionnaires, physical and
        visual function testing, ECG, cognitive and monofilament testing and retinal imaging;
        collection of blood and urine for clinical laboratory testing; banking of biospecimen
        derivatives for future research; at-home monitoring with the continuous glucose monitor,
        fitness tracker and environmental sensor; access to medical records and driving and
        accident records; and placement of de-identified data in an open-source repository for
        future research. The dataset consent type is recorded as
        ConsentSpecifiedNotElsewhereCategorised, with the note that the public version of the
        dataset can only be used for type 2 diabetes related research while a private version will
        allow more generic use.
    withdrawal_mechanism:
      - >-
        Participants were permitted to withdraw consent at any time and cease study participation;
        however, any data that had been shared or used up to that point would remain in the
        dataset, which is clearly communicated in the consent document.

participant_privacy:
  - anonymization_method:
      - >-
        HIPAA Safe Harbor de-identification of the public dataset, together with removal of sex,
        race/ethnicity and medication information; participants appear in the dataset only under
        the study participant ID number used to name their directories.
    privacy_techniques:
      - Stripping of Protected Health Information as defined by the HIPAA Privacy Rule via the Safe Harbor method
      - Removal of sex and race/ethnicity from the public set to prevent stigmatization of findings
      - Placement of 5-digit ZIP code, genetic sequencing data, past health records, medications and accident reports behind controlled access
      - A data dissemination system requiring login through a verified ID system and self-attestation of intended use
      - A strict licence agreement prohibiting re-identification, contact with data subjects and secondary sharing
      - Data watermarking for both the public and controlled sets
      - Selection of at-home monitoring devices that do not capture video or audio, are not equipped with GPS location monitoring, and are not synced with participant-owned devices
      - Conduct of all study procedures in private rooms, with identifiable information kept on encrypted servers or in locked cabinets with restricted access
    reidentification_risk:
      - >-
        The creators report a theoretical risk of future re-identification. AI algorithms can infer
        individual patient characteristics and could facilitate individual-level identification,
        and the licence, dissemination system and watermarking are intended to deter
        re-identification attempts. The licence expressly forbids using the data alone or with
        other information to identify or contact a data subject, to extract or extrapolate
        identifying information, or to establish a data subject's membership in a particular group.
    data_linkage:
      - >-
        Data are linked across modalities within a participant by the study participant identifier
        and are described in participants.tsv. The public release contains no link to direct
        identifiers. Under controlled access, participant data may be linked to past health
        records, medications, genetic sequencing data, 5-digit ZIP code and traffic and accident
        reports.

participant_compensation:
  - compensation_provided: true
    compensation_amount:
      - 200 USD
    compensation_type:
      - >-
        A monetary stipend for the study visit, paid after receipt of the final data and return of
        the study devices, typically at least two weeks after the visit; the payment is not
        prorated. The study additionally covers reasonable parking, public transit or rideshare
        costs related to the study visit, and transportation assistance was offered to participants
        who reported barriers to travelling to study visits.
    compensation_rationale:
      - >-
        Compensation for participation in the study visit, funded through NIH grant OT2OD032644.
        The same type and amount of compensation is planned for participants invited back in year 4
        of the study.

collection_consents:
  - consent_details:
      - >-
        Individuals consented to the collection and use of their data. Informed consent was
        required before participation in any part of the protocol, including questionnaires. Most
        participants gave electronic consent through REDCap before the visit; those who did not
        select the electronic option were consented in person at the start of the visit, after
        which they completed all questionnaires. No study-specific questionnaires other than the
        screening questionnaire were made available to a participant until consent had been given.

collection_notifications:
  - notification_details:
      - >-
        Each individual was aware of the data collection, as this was active data collection
        directly from participants rather than passive collection or secondary use of existing
        data. Potential participants identified from electronic health records were mailed a
        personalised hardcopy invitation letter and sent an invitation email, both containing
        links, access codes and QR codes directing them into the online REDCap recruitment
        interface. There they could read an overview of the research programme, expectations for
        participation and answers to Frequently Asked Questions, download the informed consent
        document, request a call back from study staff, complete a screening survey for
        qualification, and enrol by signing the electronic consent. Those without internet access
        could call research staff for alternative methods of enrolment. Follow-up phone calls were
        made to those who did not respond and to those who initiated contact, and the project
        website provided further information.

consent_revocations:
  - revocation_details:
      - >-
        Participants were permitted to withdraw consent at any time and to cease study
        participation. Any data that had been shared or used up to the point of withdrawal would
        remain in the dataset; this limitation is clearly communicated in the consent document.

data_protection_impacts:
  - impact_details:
      - >-
        No data protection impact analysis has been conducted. The healthsheet records that an
        analysis of the potential impact of the dataset and its use on data subjects has not been
        carried out.

cleaning_strategies:
  - cleaning_details:
      - >-
        Clinical data outside expected minimum and maximum ranges were flagged in REDCap at the
        time of data entry or acquisition and appeared in reports viewed by clinical research
        coordinators and data managers, who examined participant records to determine whether an
        error was likely.
  - cleaning_details:
      - >-
        Data were checked, and edited if errors were detected, for credibility using range checks
        to determine whether all responses fell within a prespecified reasonable range; for
        incorrect flow through prescribed skip patterns; for missing data that could be directly
        filled from other portions of an individual's record; and for the omission or duplication
        of records.
  - cleaning_details:
      - >-
        Editing was performed only under the guidance and approval of the site principal
        investigator. Where corrected data were available elsewhere in the respondent's answers the
        error was corrected; where there was no logical or appropriate way to correct the data, the
        site PI reviewed the values and decided whether they should be removed.
  - cleaning_details:
      - >-
        The data manager at each data site was responsible for quality control of all data before
        uploading to FAIRhub, and an OMOP CDM Data Quality Dashboard report (dqd_omop.json),
        covering more than 3,500 data quality checks run against the OMOP CDM instance, is
        distributed with the clinical data directory.
  - cleaning_details:
      - >-
        No instances were excluded from the dataset at the time of preprocessing; exclusion
        operated only through the study eligibility criteria at recruitment.

preprocessing_strategies:
  - preprocessing_details:
      - >-
        All data were mapped to applicable standardised terminologies and formats: clinical data to
        the Observational Medical Outcomes Partnership Common Data Model, with each CSV file
        mapping one-to-one to an OMOP CDM table; electrocardiograms to the WaveForm DataBase (WFDB)
        standard; retinal photography, OCT, OCTA and FLIO to DICOM; wearable activity and
        continuous glucose monitoring data to Open mHealth schemas; and environmental sensor data
        to the NASA ASCII File Format Guidelines for Earth Science Data.
  - preprocessing_details:
      - >-
        Images exported from imaging devices in proprietary raw formats were converted before
        upload: Topcon Maestro2 and Topcon Triton data were exported as .fda files and converted to
        DICOM, and Heidelberg FLIO data were exported as .sdt files and converted to DICOM.
  - preprocessing_details:
      - >-
        Garmin Vivosmart 5 activity data were exported in .FIT format and converted to the mHealth
        standard for the dataset.
  - preprocessing_details:
      - >-
        The dataset is organised following the Clinical Dataset Structure (CDS) v0.1.1: at the root
        level one directory per data type, then within each data type one directory per modality,
        then one directory per device, then one directory per participant named after the
        participant's study ID number, with a manifest.tsv metadata file in each data type
        directory and CDS metadata files at the dataset root.
  - preprocessing_details:
      - >-
        Processing for version 3.0.0 combined automated and custom pipelines, compared with custom
        or ad hoc processing for the v1.0.0 pilot release.
  - preprocessing_details:
      - >-
        Data were uploaded at regular intervals from each site to FAIRhub, a Microsoft Azure
        cloud-based data management, curation and sharing platform developed for the project, and
        are stored and shared as AI-ready so that AI/ML research can proceed without further
        reformatting and preprocessing.

raw_sources:
  - raw_data_details:
      - >-
        The raw data are saved and are expected to be preserved by the AI-READI project at least
        for the duration of the project, but are not anticipated to be shared outside the project
        team at present, because they have not been mapped to standardised terminologies and
        because raw data may accidentally include personal health information or personally
        identifiable information, for example in free-text fields. There is a possibility that raw
        data may be included in future releases of the controlled access dataset.
  - raw_data_details:
      - >-
        Device-native exports held at each site before conversion and upload: ECG in .xml, MoCA Duo
        application output in .csv, Topcon Maestro2 and Triton retinal images in .fda, Heidelberg
        FLIO in .sdt, Garmin activity data in .FIT, and Dexcom continuous glucose monitor and
        environmental sensor readings in .csv. Blood and urine testing results from the UW
        Nutrition and Obesity Research Center laboratory were provided in .csv.

raw_data_sources:
  - source_description: >-
      Electronic health records of the University of Alabama at Birmingham, University of
      California San Diego and University of Washington health systems, screened for ICD-10 codes
      E11.X and R73.09 and for demographic data to identify recruitment pools of patients aged 40
      and older with a medical encounter between 2020 and 2025.
    source_type:
      - Electronic health records
    access_details: >-
      Accessed by the study teams at each site under IRB approval for prescreening and recruitment;
      past health records are held under controlled access and are not part of the public dataset.
  - source_description: >-
      REDCap electronic data capture system holding participant-reported questionnaire responses
      and clinician-entered clinical data from the visit, including medications assessment, vitals,
      visual acuity, contrast sensitivity, monofilament test results and complete blood count
      results.
    source_type:
      - Electronic data capture system
    raw_data_format:
      - REDCap export
  - source_description: >-
      Clinical laboratory results: complete blood counts run on fresh whole blood by CLIA-certified
      laboratories local to each data collection site, and all other blood and urine assays
      performed on stored frozen samples by the University of Washington Nutrition and Obesity
      Research Center, to which samples were batch-shipped on dry ice approximately once per
      quarter after local storage at minus 70 degrees Celsius.
    source_type:
      - Clinical laboratory
    raw_data_format:
      - CSV
  - source_description: >-
      Retinal imaging devices: Optomed Aurora IQ, iCare EIDON widefield truecolor confocal fundus
      system, Heidelberg Spectralis HRA OCT and OCTA, Heidelberg fluorescence lifetime imaging
      ophthalmoscope, Topcon Maestro2 3D OCT-1, Topcon Triton DRI OCT and Zeiss Cirrus 5000.
    source_type:
      - Medical imaging devices
    raw_data_format:
      - DICOM, with .fda and .sdt native exports converted to DICOM
  - source_description: >-
      At-home monitoring devices issued to participants for ten days: Dexcom G6 continuous glucose
      monitor, Garmin Vivosmart 5 physical activity monitor, and the custom-built LeeLab Anura
      environmental sensor designed at the Karalis Johnson Retina Center, University of Washington.
    source_type:
      - Wearable and environmental sensors
    raw_data_format:
      - CSV and .FIT
  - source_description: Philips PageWriter TC30 Cardiograph 12-lead electrocardiograph.
    source_type:
      - Medical device
    raw_data_format:
      - XML
  - source_description: >-
      Driving and accident records obtained from the Department of Licensing, covering motor
      vehicle collisions and traffic tickets in the three years preceding the visit.
    source_type:
      - Administrative records
    access_details: Held under controlled access; not included in the public dataset.
  - source_description: >-
      Biospecimens collected during the visit: approximately 53 mL of non-fasting blood and a urine
      specimen, processed locally into plasma, serum, buffy coats, PAXgene-stabilised RNA and
      peripheral blood mononuclear cells and banked at the University of Alabama at Birmingham
      Center for Clinical and Translational Science for future genomics, proteomics, metabolomics,
      gene expression and immunological studies.
    source_type:
      - Biospecimen repository
    access_details: >-
      Biobanked samples will eventually be available to scientists according to procedures and
      policies that are in development; a limitation is that there are a finite number of samples
      to share.

labeling_strategies:
  - labeling_details:
      - >-
        No explicit label or target is associated with each data instance and no labeling was
        performed, because the dataset is hypothesis-agnostic and is aimed at facilitating multiple
        potential downstream AI/ML applications. No human or machine annotators were used, no
        annotation software was applied, and the creators state that they have no formal guidelines
        in place for future researchers creating new labels or defining new tasks.

missing_data_documentation:
  - missing_data_patterns:
      - Not all modalities are available for all participants
      - Skipped questions and incomplete responses within the survey data
      - Absent device data for some participants across the continuous glucose, activity and environmental sensor modalities
      - Skipped imaging modalities where acquisition quality could not be achieved
    missing_data_causes:
      - Some participants elected not to participate in some study elements
      - The data collection device did not have any stored results or was returned too late to retrieve the results, for example because the battery died or data were lost
      - A data collision at some point in the process resulted in lost data
      - Technical failure of wearables, including battery failure and system malfunction, and improper use of devices
      - Participant non-cooperation, image noise, system malfunction and data transfer failures affecting imaging
    handling_strategy: >-
      Missing data are left missing; no imputation procedure is described. During cleaning, missing
      data that could be directly filled from other portions of an individual's record were
      completed, under the guidance and approval of the site principal investigator, and values
      that could not be logically corrected were reviewed by the site PI for possible removal.

intended_uses:
  - use_category:
      - Artificial intelligence and machine learning research on type 2 diabetes
    examples:
      - Training and evaluating multimodal AI/ML models on data balanced across diabetes severity
      - Pseudotime manifold analysis to predict disease trajectories and reconstruct a temporal atlas of T2DM development and reversal
    usage_notes: >-
      Access is conditional on agreeing to use the data only for type 2 diabetes related research,
      and users must follow the recommended train/validation/test split if they wish to use the
      demographically balanced evaluation sets.
  - use_category:
      - Salutogenesis research
    examples:
      - Studying the pathway from type 2 diabetes back to health, the opposite of studying pathogenesis
      - Investigating multi-organ and multi-domain consequences of T2DM across vitals, biomarkers, retinal structure, cognition, neuropathy, activity and environmental exposure
  - use_category:
      - Methodological blueprint for AI-ready data generation
    examples:
      - Reuse of the AI-READI guidelines for making data types FAIR
      - Reuse of the Clinical Dataset Structure specification for organising clinical research datasets with structured metadata
      - Reuse of the FAIRhub platform by future data generation projects wishing to manage and share AI-ready clinical research datasets
  - use_category:
      - Workforce development and training
    examples:
      - Use within the AI-READI year-long research internship programme, in which interns develop healthsheets describing the data, map project data into common data models, and analyse equity and ethical issues

other_tasks:
  - task_details:
      - >-
        Because the dataset is hypothesis-agnostic and multimodal with over ten variable domains
        that can be associated with adverse conditions in type 2 diabetes, it may support analyses
        beyond the originally planned salutogenesis work, including research on stroke, kidney
        disease, heart disease, vision impairment, cognitive decline, peripheral neuropathy and
        physical inactivity, and on the relationship between social determinants of health and
        medical status in T2DM.
  - task_details:
      - >-
        The associated biorepository at the University of Alabama at Birmingham Center for Clinical
        and Translational Science supports future ancillary studies not covered by the released
        data, including whole genome sequencing and other genomic applications from extracted DNA,
        proteomics and metabolomics from plasma and serum, RNA isolation from PAXgene tubes, and
        immunological studies or generation of induced pluripotent stem cells from peripheral blood
        mononuclear cells. Procedures for reviewing and prioritising written requests are in
        development.

prohibited_uses:
  - prohibition_reason:
      - >-
        The data license agreement prohibits making clinical treatment decisions based on the data,
        as the data are intended solely as a research resource.
  - prohibition_reason:
      - >-
        The data license agreement prohibits using or attempting to use the data, alone or in
        concert with other information, to compromise or infringe the confidentiality of
        information on an individual data subject and their right to privacy, to identify or
        contact any individual data subject or group of data subjects, to extract or extrapolate
        identifying information about a data subject, to establish a data subject's membership in a
        particular group of persons, or otherwise to cause harm or injury to any data subject.
  - prohibition_reason:
      - >-
        The data license agreement prohibits transferring, licensing, sublicensing, selling,
        assigning, displaying, sharing or otherwise conveying any portion of the data or any
        derivative work to any third party other than another licensee bound by an agreement on
        identical terms.
  - prohibition_reason:
      - >-
        The data license agreement prohibits disseminating models, algorithms or programs trained
        on the data without first undertaking all reasonable efforts to minimise the likelihood
        that data can be memorised, derived, reconstructed or reconstituted through their use or
        construction.
  - prohibition_reason:
      - >-
        Use of the publicly released dataset for purposes other than type 2 diabetes related
        research is not permitted; users must attest to this restriction before obtaining access.

future_use_impacts:
  - impact_details:
      - >-
        The creators state that, to the extent of their knowledge, they do not currently anticipate
        uses of the dataset that could result in unfair treatment or harm, but they note a
        theoretical risk of future re-identification, since AI algorithms can infer individual
        patient characteristics and could facilitate individual-level identification.
  - impact_details:
      - >-
        Sex and race/ethnicity were withheld from the public release specifically to prevent
        stigmatization of findings, which constrains fairness auditing by demographic group in the
        public dataset; to mitigate this the project supplies a recommended data split whose
        validation and test sets are balanced across sex, race/ethnicity and diabetes status, aimed
        at reducing disparities in models developed using the dataset.
  - impact_details:
      - >-
        Factors that may limit the generalization of models derived from the dataset include the
        predominantly urban and hospital-based recruitment, the absence of racial and ethnic groups
        such as Pacific Islanders and Native Americans, the number and diversity of devices
        included, the number and diversity of recording sites, and the imbalance of interim
        releases across race/ethnicity, sex and diabetes severity.
  - impact_details:
      - >-
        The project expects the flagship dataset to lead to novel discoveries into type 2 diabetes
        pathogenesis and salutogenesis while benefiting a broader population given the diversity of
        the study participants, and expects its blueprint to remove one of the major bottlenecks to
        the widespread use of AI in healthcare, namely the availability of data that are
        off-the-shelf ready for AI-based analysis.

maintainers:
  - maintainer_details:
      - >-
        The AI-READI team supports and maintains the dataset. Contact information is provided in
        the README file included with the dataset and at https://aireadi.org/contact; the central
        study contact recorded in the study metadata is Aaron Lee, contact@aireadi.org. Additional
        information about the contact person or entity, authors and contributors is carried in the
        study_description.json and dataset_description.json metadata files included with the
        dataset.
    role: academic_institution
  - maintainer_details:
      - >-
        FAIRhub, the cloud-based data management, curation and sharing platform developed for the
        project and hosted on Microsoft Azure, hosts and distributes the dataset; the Microsoft AI
        for Good Lab supported the cloud services needed for the project.
    role: other

updates:
  frequency: Approximately annually
  update_details:
    - >-
      The dataset is released as static versions and is not updated in place; rather than
      correcting or amending an existing release, new versions are released with additional
      instances as more study participants complete the study visit. Releases to date are version
      1.0.0 on 3 May 2024 (204 participants from the pilot data collection phase), version 2.0.0 on
      8 November 2024 (1,067 participants, adding 863 to the pilot cohort) and version 3.0.0 on 17
      November 2025 (2,280 participants, adding 1,213). Enrolment is ongoing and future versions
      will include larger numbers of participants. Changes between versions are documented in
      detail in the CHANGELOG file included with the dataset and visible at docs.aireadi.org; the
      change from version 2 to version 3 dropped the Snellen visual acuity variables, leaving only
      logMAR measurements, and added imaging devices.

version_access:
  latest_version_doi: 10.60775/fairhub.3
  versions_available:
    - Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants from the pilot data collection phase
    - Version 2.0.0, DOI 10.60775/fairhub.2, released 8 November 2024, 1,067 participants, 2.01 TB across 165,051 files
    - Version 3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025, 2,280 participants, 3.82 TB across 356,343 files
  version_details:
    - >-
      Each version has its own DOI on FAIRhub and its own documentation, selectable from a version
      dropdown at docs.aireadi.org. The FAIRhub record for version 2.0.0 states that that version
      of the dataset is no longer accessible and directs users to the latest version, while the
      healthsheet states that older versions will not be supported or updated because new versions
      are released instead. FAIRhub additionally notes that a smaller version of the dataset is
      available for pipeline development; that smaller version is a separate FAIRhub record rather
      than a version of this dataset.

retention_limit:
  retention_details:
    - >-
      There are no limits on the retention of the data associated with the instances; participants
      were not told that their data would be retained for a fixed period and then deleted.

extension_mechanism:
  extension_details:
    - >-
      There is currently no mechanism for others to extend or augment the AI-READI dataset outside
      of those who are involved in the project.