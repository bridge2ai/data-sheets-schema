id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, AI-ready dataset collected from individuals with and without type 2 diabetes
  mellitus (T2DM) and harmonized across three United States data collection sites: the University
  of Alabama at Birmingham, the University of California San Diego, and the University of
  Washington. Version 3.0.0 contains data from 2,280 participants collected between 19 July 2023
  and 1 May 2025 and comprises survey data, blood and urine laboratory results, physical
  measurements, cognitive screening and monofilament testing, visual function testing, 12-lead
  electrocardiography, retinal photography, optical coherence tomography, optical coherence
  tomography angiography, fluorescence lifetime imaging ophthalmoscopy, ten days of continuous
  glucose monitoring, wearable activity monitoring, and home environmental sensing. The publicly
  released version contains no protected health information; information on sex, race/ethnicity
  and medications has been removed and is held under controlled access. The dataset was created by
  the AI-READI project, one of four Data Generation Projects of the NIH Common Fund Bridge2AI
  program, to support artificial intelligence and machine learning research into the salutogenesis
  of type 2 diabetes.
