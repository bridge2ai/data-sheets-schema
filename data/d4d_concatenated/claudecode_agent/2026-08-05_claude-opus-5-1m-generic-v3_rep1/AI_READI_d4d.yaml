purposes:
  - response: >-
      To create and share a flagship, ethically sourced, AI-ready multimodal dataset that enables
      future generations of artificial intelligence and machine learning research to provide
      critical insights into type 2 diabetes mellitus, including salutogenic pathways to return to
      health.
  - response: >-
      To collect data specifically designed to permit downstream pseudotime manifold analysis, an
      approach used to predict disease trajectories by collecting and learning from complex,
      multimodal data from participants with differing disease severity, from normal to
      insulin-dependent type 2 diabetes.
  - response: >-
      To develop a foundational dataset in type 2 diabetes that is agnostic to existing
      classification criteria or biases and that can be used to reconstruct a temporal atlas of
      T2DM development and reversal towards health.
  - response: >-
      To establish standards, best practices and guidelines for the collection, preparation and
      sharing of data for AI/ML purposes, following the Findable, Accessible, Interoperable and
      Reusable principles, so that AI-READI can serve as a model and blueprint for future efforts
      to develop other medical and health datasets targeted for AI/ML.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel at
      the intersection of biomedicine and artificial intelligence.

tasks:
  - response: >-
      Development and training of artificial intelligence and machine learning models on
      multimodal type 2 diabetes data balanced across diabetes severity.
  - response: >-
      Pseudotime manifold analysis to predict disease trajectories and reconstruct a temporal atlas
      of type 2 diabetes pathogenesis and reversal from cross-sectional multimodal data.
  - response: >-
      Study of salutogenesis in type 2 diabetes, that is, the pathway from disease back to health,
      which is the opposite of studying how healthy people proceed through pathogenesis resulting
      in T2DM.
  - response: >-
      Investigation of the multi-organ and multi-domain consequences of type 2 diabetes across more
      than ten health domains, including cardiovascular, renal, ophthalmic, cognitive, neuropathic,
      physical activity and environmental exposure measures.

addressing_gaps:
  - response: >-
      A major barrier to the adoption of artificial intelligence in healthcare research has been
      the lack of diverse datasets that are AI ready for training AI models; the AI-READI project
      is designed to address this lack.
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as type
      2 diabetes has been limited by a lack of well-designed, high quality, large and inclusive
      multimodal datasets.
  - response: >-
      A meta-epidemiological review of type 2 diabetes studies published from 2000 to 2020 found
      that samples lacked racial and ethnic diversity. AI-READI recruits a cohort approximately
      balanced across Asian, Black, Hispanic and White participants, biological sex and diabetes
      severity, which is a demographic improvement over many previous epidemiological studies and
      clinical trials on T2DM.
  - response: >-
      Existing data sources such as insurance claims or electronic health record data do not
      support the downstream AI/ML analyses that a purpose-built multi-domain acquisition protocol
      enables; the AI-READI acquisition protocol was designed across survey, physical measurement,
      clinical, imaging and wearable device domains to close that gap.
  - response: >-
      Preparing and sharing AI-ready datasets is time consuming and difficult for data-collecting
      researchers; the project addresses this by developing the FAIRhub cloud-based data
      management, curation and sharing platform and the Clinical Dataset Structure specification.

