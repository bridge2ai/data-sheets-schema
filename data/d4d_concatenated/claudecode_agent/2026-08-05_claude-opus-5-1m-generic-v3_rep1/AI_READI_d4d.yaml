data_collectors:
  - collector_details:
      - >-
        Clinical research coordinators at the three data collection sites contacted and consented
        research participants, ushered them through the research visit, conducted study procedures
        including ophthalmic imaging, provided training on continuous glucose monitoring and
        fitness tracker use, and ensured the return of all study materials. All research personnel
        who recruited, enrolled and collected data underwent training by the data manager at the
        University of Alabama at Birmingham and worked from a detailed Manual of Procedures.
        Successful completion of a certification process was required for all coordinators,
        including mandatory institutional compliance training for human subject research and
        successful administration of all protocol elements to at least three volunteer practice
        subjects. Study team effort was supported by National Institutes of Health award
        OT2OD032644 based on the percentage of effort contributed, with salaries aligned to the
        funding guidelines at each site.
    role: researcher
  - collector_details:
      - >-
        Data managers at each site oversaw the enrolment and testing process and were responsible
        for the quality control of all data before uploading to FAIRhub.
    role: researcher
  - collector_details:
      - >-
        Retinal imaging technicians acquired the ophthalmic imaging and were trained to detect
        potentially life- or vision-threatening conditions such as retinal detachment, tumour and
        optic disc oedema, triggering immediate referral when suspected.
    role: researcher
  - collector_details:
      - >-
        Phlebotomists collected blood from research participants and laboratory assistants
        processed and shipped specimens; complete blood counts were run by Clinical Laboratory
        Improvement Amendments-certified laboratories local to each site and all other assays by
        the University of Washington Nutrition and Obesity Research Center.
    role: researcher

acquisition_methods:
  - acquisition_details:
      - >-
        Directly observed measurements acquired during a single in-person study visit lasting
        between 2.5 and 4 hours: height, weight, waist and hip circumference, systolic and
        diastolic blood pressure and heart rate measured twice two minutes apart, 12-lead
        electrocardiogram, monofilament testing of touch perception on both feet, Montreal
        Cognitive Assessment, photopic and mesopic visual acuity and letter contrast sensitivity,
        autorefraction, and retinal imaging of both eyes on multiple devices under dilated
        conditions except for the handheld Optomed camera.
    was_directly_observed: true
  - acquisition_details:
      - >-
        Participant-reported data collected through REDCap questionnaires completed online before
        or after the visit, covering eligibility screening, demographics, depressive symptoms
        (CES-D-10), diabetes distress (PAID-5), diabetes self-care, dietary habits, ophthalmic
        history and eye care access, smoking, alcohol, vaping and marijuana use, general health
        history, social determinants of health, and current medications coded with RxNorm.
    was_reported_by_subjects: true
  - acquisition_details:
      - >-
        Laboratory values derived from non-fasting blood (approximately 53 mL) and a urine specimen
        collected during the study encounter; complete blood counts were performed on fresh whole
        blood by CLIA-certified laboratories local to each site and all other assays were performed
        on stored frozen samples by the University of Washington Nutrition and Obesity Research
        Center.
    was_directly_observed: true
  - acquisition_details:
      - >-
        Ten days of at-home monitoring after the visit using a Dexcom G6 continuous glucose monitor
        (participants masked to the results during the monitoring period), a Garmin Vivosmart 5
        activity tracker, and a custom-built LeeLab Anura environmental sensor placed in the home;
        participants returned the devices to study staff by overnight mail or in person together
        with a data sheet recording which wrist the tracker was worn on, their dominant hand, and
        where the environmental sensor was placed.
    was_directly_observed: true
  - acquisition_details:
      - >-
        Verification of participant-reported data was performed where possible, for example by
        cross-referencing entered medications with medications physically brought in or
        photographed by each study participant.
    was_validated_verified: true
  - acquisition_details:
      - >-
        Retrieval from pre-existing records held by third parties, comprising electronic health
        record data on general health, eye health, medical and surgical history, medications,
        laboratory records and prior medical imaging, and motor vehicle accident and traffic
        records obtained from the Department of Licensing; these elements are held under controlled
        access rather than released in the public dataset.

collection_mechanisms:
  - mechanism_details:
      - >-
        REDCap electronic data capture was used for participant-reported questionnaires and for the
        following clinical data from the visit: medications assessment, vitals, visual acuity,
        contrast sensitivity, monofilament test results and complete blood count results. REDCap
        was also used for the online recruitment interface, screening survey and electronic
        consent.
  - mechanism_details:
      - >-
        Retinal imaging devices: Optomed Aurora IQ handheld non-mydriatic fundus camera (4 images
        per participant, DICOM); iCare EIDON widefield truecolor confocal fundus system (12 images,
        DICOM); Heidelberg Spectralis HRA OCT and OCTA (6 images, DICOM); Topcon Maestro2 3D OCT-1
        (6 images, exported .fda and converted to DICOM); Topcon Triton DRI OCT (6 images, exported
        .fda and converted to DICOM); Zeiss Cirrus 5000 (8 images, DICOM); and Heidelberg
        fluorescence lifetime imaging ophthalmoscopy (2 macula-centred images, exported .sdt and
        converted to DICOM).
  - mechanism_details:
      - >-
        Philips PageWriter TC30 Cardiograph used to record a 12-lead electrocardiogram while the
        participant sat in a reclining chair or lay supine, with the recorded position (0, 30, 60
        or 90 degrees relative to supine) documented; exported as .xml.
  - mechanism_details:
      - >-
        At-home monitoring devices: Dexcom G6 continuous glucose monitor recording blood glucose
        every 5 minutes (.csv); Garmin Vivosmart 5 physical activity monitor recording steps, heart
        rate, respiratory rate, sleep, stress and oxygen saturation (exported .FIT, converted to
        the Open mHealth standard); and a custom-designed environmental sensor built at the Karalis
        Johnson Retina Center, University of Washington, recording ambient temperature, relative
        humidity, nitrogen oxides, volatile organic compounds, particulate matter (PM1.0, PM2.5,
        PM4, PM10) and eleven multi-spectral light intensity measurements (.csv).
  - mechanism_details:
      - >-
        Vision testing instruments: M&S Technologies Electronic Visual Acuity tester at 4 metres
        for photopic and (through a 2.0 neutral density filter) mesopic letter acuity; the Mars
        Letter Contrast Sensitivity chart read monocularly at approximately 50 cm under photopic
        and mesopic conditions; and the Topcon KR 800 autorefractor/keratometer. Lensometers used
        across sites were the NIDEK LM-600P and the Topcon CL-200 and CL-300.
  - mechanism_details:
      - >-
        Blood pressure devices used across the data acquisition sites were the OMRON HEM 907XL, the
        Medline MDS4001 Automatic Digital Blood Pressure Monitor, and the Welch Allyn 6000 series
        vital signs monitor with a Welch Allyn FlexiPort reusable cuff, all automatic oscillometric,
        medically approved devices.
  - mechanism_details:
      - >-
        Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
        application, capturing the total score, section subscores, Memory Index Score and task
        completion times as .csv.
  - mechanism_details:
      - >-
        A 10 g monofilament applied at three locations on each foot, ten times per location, with
        the participant's eyes closed and shoes and socks removed, with insensate areas retested
        for confirmation; results recorded on an iPad, laptop or paper questionnaire and entered
        into REDCap by clinical research staff.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details:
      - >-
        Data included in version 3.0.0 were collected between 19 July 2023 and 1 May 2025, spanning
        the pilot enrolment phase and the first two years of the main study. The study protocol
        publication records that enrolment began on 18 July 2023 and will continue until 30
        November 2026, with preliminary pilot enrolment between 18 July 2023 and 30 November 2023
        and formal data collection beginning on 1 December 2023; the FAIRhub study record gives an
        actual start date of 19 July 2023 and an anticipated completion date of 1 January 2027. The
        overall project timeline spans four years, with one year for protocol development and
        training and years 2 to 4 for recruitment and data collection. Sources differ on the size
        of the planned longitudinal arm: the healthsheet states that approximately 4 per cent of
        participants are expected to undergo a follow-up examination in year 4, while the NIH
        RePORTER abstract, the dataset README and the IRB protocol describe longitudinal data from
        10 per cent of the study cohort.

direct_collection:
  - is_direct: true
    collection_details:
      - >-
        Data were collected directly from participants at the three recruiting sites rather than
        obtained via third parties. Recruitment pools were identified by screening electronic
        health records at each site for diabetes and prediabetes ICD-10 codes (E11.X and R73.09)
        among patients aged 40 and older who had had an encounter with the sites' health systems;
        those individuals were then mailed a personalised hardcopy invitation letter and sent an
        invitation email directing them into the online REDCap recruitment interface, after which
        enrolled participants attended an in-person visit and completed at-home monitoring.

sampling_strategies:
  - is_sample: true
    is_representative: false
    source_data:
      - >-
        The study base is all patients aged 40 years and older who had a medical encounter within
        each health system site (University of Alabama at Birmingham, University of California San
        Diego, University of Washington) between 2020 and 2025. Patients with type 2 diabetes and
        pre-diabetes were identified by screening electronic health records for ICD-10 codes E11.X
        and R73.09 respectively; patients without diabetes have no encounters with these codes. The
        released dataset comprises all participants enrolled during the covered collection period
        rather than a further sample drawn from the enrolled cohort, so sampling occurs at the
        recruitment stage from this health-system study base.
    strategies:
      - >-
        Triple-balanced purposive recruitment in approximately equal proportions across four
        self-reported race/ethnicity groups (Asian, Black, Hispanic, White), four categories of
        type 2 diabetes (no diabetes; pre-diabetes or lifestyle-controlled; controlled with oral or
        non-insulin injectable medication; insulin-controlled) and biological sex, with a
        study-wide target of 4,000 participants and approximately 1,000 in each diabetes group.
      - >-
        Recruitment in waves, with the composition and size of each wave influenced by the observed
        participation characteristics of race/ethnicity, gender, T2DM severity and site according
        to health records, and adjusted by under- and oversampling groups as needed as recruitment
        progresses.
      - >-
        Non-probability sampling. All study groups are recruited from each site to capture
        diversity, but the proportion of each group varies with the demographic prevalence of that
        group in the site's geographical area; the University of Washington concentrates on Asian,
        then Hispanic, then Black participants, San Diego on Hispanic, then Asian, then Black
        participants, and Birmingham on Black, then Hispanic, then Asian participants, with all
        sites recruiting White participants.
    why_not_representative:
      - >-
        The cohort is deliberately balanced across race/ethnicity, diabetes severity and biological
        sex rather than matched to the demographic distribution of the US population, because
        building balanced datasets is critical for the development of unbiased machine learning
        models. Participants are volunteers, so volunteer selection bias may limit generalisability
        to those not represented in the study population. Recruitment is predominantly urban and
        hospital-based and may not fully capture diverse cultural and socioeconomic backgrounds,
        and groups such as Pacific Islanders and Native Americans are not included. Eligibility is
        restricted to adults aged 40 to 85 who can speak and read English and who do not have type
        1 or gestational diabetes and are not pregnant.

instances:
  - instance_type: >-
      An individual study participant; each instance consists of all of the data available for one
      person participating in the study, and there is currently only one study visit per
      participant.
    counts: 2280
    data_substrate: >-
      Tabular survey and clinical data in CSV mapped to the OMOP Common Data Model, DICOM medical
      images, physiological waveform signals in WaveForm DataBase format, and time-series sensor
      readings in Open mHealth JSON and ASCII formats. There is no unstructured text data in the
      dataset.
    data_topic: >-
      Type 2 diabetes mellitus and associated health domains, including vitals and physical
      measurements, blood and urine biomarkers, cardiac electrophysiology, peripheral neuropathy,
      cognitive function, visual function and retinal structure, continuous glucose, physical
      activity and sleep, psychosocial variables and social determinants of health, and home air
      quality.
    label_description: >-
      No explicit label or target is associated with each data instance. The dataset is
      hypothesis-agnostic and no labeling was performed, because it is intended to facilitate
      multiple potential downstream AI/ML applications.

subpopulations:
  - subpopulation_elements_present: true
    identification:
      - >-
        The public release does not identify demographic sub-populations: the healthsheet answers
        "No" to whether the dataset identifies demographic sub-populations, because information
        related to the sex and race/ethnicity of participants has been removed from the public
        release to prevent stigmatization of findings and is held under controlled access together
        with 5-digit ZIP code, genetic sequencing data, past health records, medications, and
        traffic and accident reports. Participants are nevertheless assigned to one of four study
        arms by diabetes status: no type 1 or type 2 diabetes; pre-type 2 diabetes or type 2
        diabetes controlled by lifestyle adjustments; type 2 diabetes controlled by oral or
        non-insulin injectable medications; and type 2 diabetes controlled by insulin.
    distribution:
      - >-
        Aggregate group counts for the 2,280 participants are reported in the dataset README
        alongside the recommended data split: 380 Hispanic, 545 Asian, 519 Black and 836 White
        participants; 951 male and 1,329 female participants; 776 with no diabetes, 560
        lifestyle-controlled, 686 controlled by oral or non-insulin injectable medication and 258
        insulin-controlled; and a mean age of 60.8 plus or minus 11.3 years. The study-wide target
        is approximately 1,000 participants in each of the four diabetes groups; because enrolment
        is ongoing, interim releases may not have achieved balanced distribution across groups.

splits:
  - split_details:
      - >-
        Version 3.0.0 comes with a recommended 70/15/15 per cent train, validation and test split
        supplied in the participants.tsv file. Because sex, race and ethnicity are not released
        with the public version, the project team prepared the split so that the validation and
        test sets are balanced as well as possible for sex, race/ethnicity and diabetes status (no
        diabetes, prediabetes or lifestyle controlled, oral medication controlled, and insulin
        controlled). The split assigns 1,576 participants to training, 352 to validation and 352 to
        testing, with the validation and test sets each containing 88 participants from each of the
        four race/ethnicity groups and 176 male and 176 female participants. The split is intended
        to reduce disparities in models developed using the dataset in the absence of released
        demographic labels.

