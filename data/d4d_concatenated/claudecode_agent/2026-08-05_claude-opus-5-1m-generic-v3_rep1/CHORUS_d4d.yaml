id: https://chorus4ai.org/dataset
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution, controlled-access critical care dataset
  generated by the CHoRUS data generation project of the NIH Common Fund Bridge2AI program. It is
  assembled from retrospective clinical data contributed by hospitals in the CHoRUS network and is
  intended to support machine learning and artificial intelligence for characterizing acute and
  critical illness, predicting complications, and measuring treatment response. The project website
  describes a current released dataset of 50,000 patient admissions from ICU, PICU and NICU settings,
  1.6 billion rows of electronic health record data in the OMOP common data model, 7,642 admissions
  with radiology data, and 23 Tb of waveform data; the anticipated final dataset covers 100,000
  patient admissions across 9 data modalities contributed by 14 hospitals. The September 2025
  informational webinar states that, as of August 2025, the dataset covered 14 different hospitals
  with over 45,000 unique admissions. Structured data, waveforms, imaging and tokenized notes are
  held under controlled access in a cloud enclave, and a holdout test set is sequestered for external
  validation of models.
page: https://chorus4ai.org/
status: >-
  Active data generation project; NIH project period 2022-09-01 to 2026-11-30.
conforms_to: >-
  OMOP Common Data Model (OHDSI) for structured electronic health record data, with additional
  modality standards: OHNLP schema for tokenized clinical notes, DICOM for imaging, WFDB (PhysioNet
  schema extended) for telemetry waveforms, and EDF+ and Persyst for EEG waveforms.
conforms_to_schema: OMOP Common Data Model
keywords:
  - critical care
  - intensive care unit
  - acute illness
  - electronic health records
  - OMOP common data model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - DICOM
  - clinical notes
  - social determinants of health
  - artificial intelligence
  - machine learning
  - Bridge2AI
  - multimodal data
  - equitable AI
  - controlled access

