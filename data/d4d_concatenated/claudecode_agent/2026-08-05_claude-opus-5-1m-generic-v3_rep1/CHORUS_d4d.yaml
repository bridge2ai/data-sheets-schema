purposes:
  - response: >-
      Generate a publicly available, AI-ready critical care dataset for machine learning and
      artificial intelligence applications in acute and critical care, addressing the urgent need for
      infrastructure to support AI/ML in critical care.
  - response: >-
      Develop the most diverse, high-resolution, ethically sourced, AI-ready data set to answer the
      grand challenge of improving recovery from acute illness.
  - response: >-
      Provision a sequestered holdout test set accessible for external model validation, to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care.
  - response: >-
      Ensure that the methods of data generation promote privacy, accountability and clinical benefit
      while cultivating a new generation of AI clinicians and scientists.
  - response: >-
      Create best practices and ethically sourced datasets and tools for AI in health, in
      collaboration with the other data generation projects of the NIH Bridge2AI consortium.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning in critical care; developing high-resolution multi-center data sets is a critical first
      step towards actionable and trustworthy AI.
  - response: >-
      Existing resources lack a multi-center, multi-modal critical care dataset of this diversity and
      resolution that is harmonized to common standards and that includes a sequestered holdout set
      for external model validation.
  - response: >-
      The legal and ethical framework for collecting and sharing high-resolution critical care data at
      scale is underdeveloped; CHoRUS establishes such a framework and analyzes the existing legal and
      regulatory landscape.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: Predicting complications and clinical deterioration among patients with acute or critical illness.
  - response: Measuring treatment response among patients with acute or critical illness.
  - response: >-
      External validation of AI/ML models developed elsewhere, using the sequestered holdout test set.
  - response: >-
      Labeling of data with prediction targets in a visualization and annotation environment.

intended_uses:
  - use_category:
      - research
    description: >-
      Development of machine learning and artificial intelligence models to improve the care and
      outcomes of patients requiring critical care.
    usage_notes: Access is controlled and requires a signed licensing agreement.
  - use_category:
      - model validation
    description: >-
      Use of the sequestered holdout test set for external validation of AI models prior to
      implementation in acute and critical care.
  - use_category:
      - training and education
    description: >-
      Hands-on AI/ML training. The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands
      access to CHoRUS data through engagement, AI training and mentorship, and trainees conduct
      collaborative research on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud platform.
    examples:
      - Canonical AI/ML for Clinical Care Jupyter Notebooks
      - Workshops on the OHDSI/OMOP common data model and the OHDSI tool stack
      - Trainee use cases developed during Bridge2AI topics and presented as works-in-progress posters

existing_uses:
  - description: >-
      As stated in the September 2025 informational webinar, the CHoRUS datasets are being used for
      training activities and publications.
    examples:
      - AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2, November 2025 to July 2026)
      - Publications arising from the CHoRUS consortium

future_use_impacts:
  - impact_details:
      - >-
        By acquiring and standardizing a dataset of unprecedented diversity and high resolution and
        sequestering holdout datasets for external validation, the project is expected to catalyze the
        biomedical research and expertise necessary to promote patient-focused deployment of AI in
        acute and critical care.
  - impact_details:
      - >-
        Because the data derive from critically ill patients, patient-focused efforts determine the
        ethical and legal approaches needed to manage privacy and bias in downstream use, and account
        for social determinants of health.

acquisition_methods:
  - acquisition_details:
      - >-
        Retrospective extraction of clinical data from the operational systems of contributing
        hospitals, standardized to the OMOP Common Data Model and delivered to CHoRUS following
        validated standard operating protocols.
    was_directly_observed: false
  - acquisition_details:
      - >-
        Device-recorded signal acquisition: waveform telemetry captured from bedside monitors via
        gateway/middleware systems and EEG waveforms extracted from hospital EEG databases.
    was_directly_observed: true
  - acquisition_details:
      - >-
        Imaging retrieved from hospital PACS systems and delivered in DICOM format, with
        de-identification applied prior to release.
    was_directly_observed: true
  - acquisition_details:
      - >-
        Clinical notes extracted and tokenized using the OHNLP toolkit; full notes remain stored
        locally at contributing sites and only tokens are shared.
    was_inferred_derived: true

direct_collection:
  - collection_details:
      - >-
        Data are obtained retrospectively from the clinical systems of 14 data-contributing hospitals
        rather than being collected prospectively from individuals for this dataset. Contributing
        sites create and upload a CHoRUS-specific data extract following centralized standard
        operating protocols.
    is_direct: false

collection_mechanisms:
  - mechanism_details:
      - >-
        Site-level extraction and upload tooling (the chorus-extract-upload repository provides tools
        to create and upload a CHoRUS Data Extract) together with dockerized container applications
        deployed on Azure to support CHoRUS services.
  - mechanism_details:
      - >-
        Centralized standard operating protocols in the Chorus_SOP documentation site, including an
        interactive workflow diagram describing the step-by-step process for extracting and
        contributing clinical data to CHoRUS, with dynamic links to validated SOP documents.
  - mechanism_details:
      - >-
        Bedside monitors with gateway/middleware for waveform telemetry, hospital EEG databases for
        EEG waveforms, and PACS for imaging.
  - mechanism_details:
      - OHNLP toolkit used to extract and tokenize clinical notes.
  - mechanism_details:
      - >-
        Project-management instrumentation for delivery tracking: sites submit status updates through
        the GitHub interface or a Google Form, and a GoogleScript triggered on each submission calls
        the GitHub API to update status and issue information in the Standards Project or the Data
        Acquisition Project.

collection_timeframes:
  - start_date: '2022-09-01'
    end_date: '2026-11-30'
    timeframe_details:
      - >-
        Retrospective data collection carried out over the NIH project period. As of August 2025 the
        dataset covered 14 different hospitals with over 45,000 unique admissions.

data_collectors:
  - name: CHoRUS data acquisition centers
    collector_details:
      - >-
        The CHoRUS collaboration spans 20 academic centers, of which 14 contribute as Data Acquisition
        centers. Data site managers at contributing sites perform extraction and submission following
        the Chorus_SOP workflow.
    role: data contributing site
  - name: CHoRUS clinical collaborators
    collector_details:
      - >-
        Clinical experts contribute to semantic mapping and validation through the chorus-mapping
        repository and its associated clinical validation SOP.
    role: clinical validation and semantic mapping

sampling_strategies:
  - is_sample: true
    strategies:
      - >-
        Sampling designed to ensure comprehensive sets of patient conditions and clinical treatment
        strategies across the multi-center network.
      - >-
        Federated access enabling sampling methods to ensure a balanced and diverse cohort.
    is_representative: false
    why_not_representative:
      - >-
        The cohort is drawn from 14 contributing hospitals within a 20-institution academic network in
        the United States and is restricted to admissions involving acute and critical care (ICU, PICU
        and NICU), so it is not a representative sample of all hospitalized patients.

raw_data_sources:
  - source_description: >-
      Structured electronic health record data from contributing hospitals, covering demographics,
      medication administration (dosing time-stamped upon each infusion change or dose
      administration), procedures documented by providers, nursing flowsheets (high-frequency
      documentation) and diagnoses documented by providers.
    source_type:
      - hospital electronic health record system
    raw_data_format:
      - OMOP Common Data Model tables
    access_details: Controlled access within the CHoRUS cloud enclave.
  - source_description: Unstructured clinical notes authored during hospital care.
    source_type:
      - hospital electronic health record system
    raw_data_format:
      - Free text, extracted and tokenized with the OHNLP toolkit
    access_details: >-
      Notes are stored locally at contributing sites; only tokens are made available through CHoRUS.
  - source_description: Radiology images retrieved from hospital picture archiving and communication systems.
    source_type:
      - PACS
    raw_data_format:
      - DICOM
    access_details: >-
      Controlled access; 1000 images were available as of August 2025 with de-identification in
      process for a larger cohort.
  - source_description: Continuous waveform telemetry recorded at the bedside.
    source_type:
      - Bedside monitors with gateway/middleware
    raw_data_format:
      - WFDB (PhysioNet schema extended)
    access_details: Controlled access within the CHoRUS cloud enclave.
  - source_description: Electroencephalography waveforms recorded during hospital care.
    source_type:
      - Hospital EEG database
    raw_data_format:
      - EDF+ and Persyst
    access_details: Controlled access; extraction was in process as of August 2025.
  - source_description: >-
      Contextual and social determinants of health data, including contextual factors such as
      geographic distance to the nearest hospital.
    source_type:
      - Contextual/geospatial enrichment of clinical records
    raw_data_format:
      - OMOP Location entities geocoded with DeGauss

preprocessing_strategies:
  - preprocessing_details:
      - >-
        Standardization of structured clinical data to the OMOP Common Data Model, harmonizing
        multi-modal EHR, waveform, imaging and text data under unified standards.
  - preprocessing_details:
      - >-
        Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit, with the
        resulting tokens released under the OHNLP open source schema.
  - preprocessing_details:
      - >-
        Transformation of data using approaches that limit re-identification, including tokenization
        and de-identification of imaging prior to release.
  - preprocessing_details:
      - >-
        Conversion of waveform data using CHoRUS waveform conversion scripts and documentation
        (chorus_waveform), and preparation of waveforms for release (chorus_waveform_resources).
  - preprocessing_details:
      - >-
        Geocoding of OMOP Location entities via DeGauss to derive contextual and social determinants
        of health variables.

cleaning_strategies:
  - cleaning_details:
      - >-
        Validated semantic mappings connecting clinical data in various source formats to
        international standards, pooled in the chorus-mapping repository with an associated clinical
        validation SOP for contributing to mapping efforts.
  - cleaning_details:
      - >-
        Characterization reports produced from each site submission and returned to the contributing
        site (CHoRUSReports repository) so that data quality issues can be identified and resolved.
  - cleaning_details:
      - >-
        Standard operating protocols that undergo an internal validation and review process within the
        Chorus_SOP repository, instructing contributing sites on best practices for curating and
        delivering interoperable datasets.

labeling_strategies:
  - labeling_details:
      - >-
        A visualization and annotation environment is used to label data with targets important for
        prediction, developed as part of the project's capability to acquire, standardize, tokenize,
        store, visualize and label data.
  - labeling_details:
      - >-
        Clinical expertise is applied to semantic mapping and validation; a clinical validation SOP
        governs contributions to mapping efforts.

machine_annotation_tools:
  - tools:
      - OHNLP toolkit
      - privacy_scan_tool
      - CTP-deid
      - DeGauss (via UF-Geocoding)
    tool_descriptions:
      - Extraction and tokenization of unstructured clinical notes.
      - A privacy scan tool for medical records.
      - De-identification tooling maintained in the chorus-ai organization.
      - Open source code to geocode OMOP Location entities.

instances:
  - instance_type: >-
      Patient admission (hospital encounter of a critically ill patient), with linked multimodal data
      across up to nine modalities.
    label_description: >-
      Data are labeled in a visualization and annotation environment with targets important for
      prediction; label availability varies by modality.
    description: >-
      The sources report different admission counts at different points. The project website reports a
      current released dataset of 50,000 patient admissions from ICU, PICU and NICU; the September
      2025 informational webinar states that as of August 2025 the dataset covered 14 hospitals with
      over 45,000 unique admissions; the website gives an anticipated final dataset of 100,000 patient
      admissions; and the NIH project abstract describes acquiring an AI-ready data set from more than
      100,000 critically ill patients.

subsets:
  - id: https://chorus4ai.org/dataset#structured-ehr-omop
    name: Structured EHR data in OMOP
    description: >-
      Demographics, medication administration (time-stamped at each infusion change or dose
      administration), procedures documented by providers, nursing flowsheets (high-frequency
      documentation) and diagnoses documented by providers, all standardized to the OMOP Common Data
      Model and held under controlled access. The released dataset contains 1.6 billion rows of EHR
      OMOP data.
    conforms_to: OMOP Common Data Model
  - id: https://chorus4ai.org/dataset#clinical-notes
    name: Tokenized clinical notes
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit and published under the OHNLP
      open source schema. Notes are stored locally at contributing sites; only tokens are available
      in the enclave. Access is controlled.
    conforms_to: OHNLP open source schema
  - id: https://chorus4ai.org/dataset#imaging
    name: Imaging
    description: >-
      Radiology imaging obtained from PACS in DICOM format under controlled access. As of August 2025,
      1000 images were available with de-identification in process for a larger cohort; the website
      reports 7,642 admissions with radiology data.
    conforms_to: DICOM
  - id: https://chorus4ai.org/dataset#waveform-telemetry
    name: Waveform telemetry
    description: >-
      Continuous bedside monitor telemetry captured through gateway/middleware, distributed in WFDB
      format using an extended PhysioNet schema under controlled access. The website reports 23 Tb of
      waveform data.
    conforms_to: WFDB (PhysioNet schema extended)
  - id: https://chorus4ai.org/dataset#eeg
    name: EEG waveforms
    description: >-
      Electroencephalography waveforms from hospital EEG databases in EDF+ and Persyst formats under
      controlled access; extraction was in process as of August 2025.
    conforms_to: EDF+ and Persyst

splits:
  - split_details:
      - >-
        A holdout test set is sequestered from the dataset and made accessible for external model
        validation, to aid marketplace adoption of AI-developed models for implementation in acute and
        critical care.

subpopulations:
  - subpopulation_elements_present: true
    identification:
      - >-
        Care setting of the admission: the released dataset comprises patient admissions from adult
        intensive care units (ICU), pediatric intensive care units (PICU) and neonatal intensive care
        units (NICU).
    distribution:
      - >-
        The relative sizes of the ICU, PICU and NICU groups within the released admissions are not
        stated in the sources.
  - subpopulation_elements_present: true
    identification:
      - >-
        Contributing hospital: admissions originate from 14 different data-contributing hospitals
        within a consortium of 20 academic institutions.
  - subpopulation_elements_present: true
    identification:
      - >-
        Social determinants of health and contextual factors, including geographic distance to the
        nearest hospital, are captured as data elements so that subgroups defined by social and
        geographic context can be identified.

missing_data_documentation:
  - missing_data_patterns:
      - >-
        Modality coverage is uneven as of August 2025: clinical notes are available only as tokens
        (full notes remain local), imaging is limited to 1000 available images while de-identification
        proceeds for a larger cohort, and EEG extraction is still in progress.
      - >-
        Full clinical notes are not centrally released (only tokens are shared); as of August 2025
        only 1000 images were available with de-identification in process for a larger cohort, and EEG
        extraction was still in process.
    missing_data_causes:
      - >-
        Privacy protection requirements (notes retained locally, imaging de-identification pending)
        and staged, ongoing acquisition and curation of modalities across contributing sites.
    handling_strategy: >-
      Modalities are released progressively as de-identification and extraction complete; metadata for
      clinical notes, imaging and EEG were listed as planned at the time of the September 2025
      webinar.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Not all nine anticipated modalities are fully available: as of August 2025 imaging was limited to
      1000 images with de-identification in process, EEG extraction was in process, and clinical notes
      were available only as tokens because full notes are stored locally.
    scope_impact: >-
      Analyses requiring full-text notes, large imaging cohorts, or EEG were not yet supportable at
      the scale of the anticipated final dataset.
    recommended_mitigation: >-
      Check current modality availability in the enclave before designing analyses; additional data
      are being released as de-identification and extraction complete.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset is restricted to acute and critical care admissions (ICU, PICU, NICU) at
      participating United States academic hospitals.
    scope_impact: >-
      Findings may not generalize to non-critical-care settings, to non-participating hospitals, or to
      health systems outside the United States.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Data collection is retrospective and the dataset is still growing toward its anticipated final
      size of 100,000 admissions and 9 modalities; reported counts differ between sources and reflect
      different snapshot dates.
    scope_impact: >-
      Counts and coverage cited in documentation may be out of date relative to the current enclave
      contents.

known_biases:
  - bias_description: >-
      Patient-focused efforts within CHoRUS are explicitly directed at determining the ethical and
      legal approaches to manage privacy and bias, and at accounting for social determinants of
      health, indicating a recognized risk that a multi-center critical care cohort may not be
      balanced or diverse without deliberate intervention.
    mitigation_strategy: >-
      Federated access enabling sampling methods to ensure a balanced and diverse cohort; sampling to
      ensure comprehensive sets of patient conditions and clinical treatment strategies; inclusion of
      contextual factors such as geographic distance to the nearest hospital and social determinants
      of health as data elements.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details:
      - >-
        The dataset consists of hospital clinical records of critically ill patients, including
        demographics, diagnoses, procedures, medication administration and nursing flowsheets.
  - sensitive_elements_present: true
    sensitivity_details:
      - >-
        Clinical notes may contain directly identifying information; full notes are therefore retained
        locally at contributing sites and only tokens are shared.
  - sensitive_elements_present: true
    sensitivity_details:
      - >-
        Imaging derived from PACS requires de-identification before release; only a de-identified
        subset was available as of August 2025.
  - sensitive_elements_present: true
    sensitivity_details:
      - >-
        Contextual and social determinants of health data, including geocoded location-derived
        measures such as distance to the nearest hospital, carry re-identification and stigmatization
        risk.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details:
      - >-
        All listed data types (demographics, medication administration, procedures, nursing
        flowsheets, diagnoses, clinical notes, imaging, waveform telemetry and EEG) are under
        controlled access. Clinical notes are stored locally rather than in the shared enclave, except
        for tokens. Access requires registration and a signed licensing agreement.

is_deidentified:
  identifiable_elements_present: true
  method: >-
    Tokenization of unstructured clinical notes using the OHNLP toolkit; de-identification of imaging
    prior to release; transformation of data using approaches that limit re-identification; a privacy
    scan tool for medical records and CTP-deid tooling maintained by the consortium.
  deidentification_details:
    - >-
      The project transforms data using approaches that limit re-identification and retains full
      clinical notes locally at contributing sites, sharing only tokens. Imaging de-identification for
      the larger cohort was still in process as of August 2025.

participant_privacy:
  - anonymization_method:
      - >-
        Tokenization of clinical text and de-identification of imaging, combined with transformations
        designed to limit re-identification.
    privacy_techniques:
      - Local retention of full clinical notes with only tokens shared
      - Privacy scan tooling for medical records
      - Controlled-access cloud enclave with provisioned compute
      - Licensing agreement required before data access
    reidentification_risk:
      - >-
        Data are transformed using approaches that limit re-identification, and residual risk is
        managed by controlled access rather than open release.

at_risk_populations:
  at_risk_groups_included: true

human_subject_research:
  involves_human_subjects: true
  special_populations:
    - >-
      Critically ill patients, including pediatric (PICU) and neonatal (NICU) intensive care
      admissions.
    - >-
      Minors are represented: the released dataset includes patient admissions from pediatric
      intensive care units (PICU) and neonatal intensive care units (NICU) in addition to adult ICU
      admissions.

ethical_reviews:
  - reviewing_organization: CHoRUS consortium
    review_details:
      - >-
        One of the three CHoRUS pillars is Ethics (Ethical and Trustworthy AI). The consortium
        performs community-facing ethics focus groups to determine what data is appropriate for public
        sharing, evaluates community perspectives on clinical care AI to increase trustworthiness of
        provenance and privacy, establishes a legal framework for collecting data at scale, and
        analyzes the existing legal and regulatory landscape.

regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions:
    - >-
      All CHoRUS data types are under controlled access. Access requires registration with name, email
      and institution, a signed licensing agreement, and a ".edu" email address; compute is
      provisioned before access is granted.

license_and_use_terms:
  license_terms:
    - >-
      Controlled access. All users must complete a registration form (name, email, institution) and
      sign a licensing agreement included in the registration form before gaining access to the
      dataset; a ".edu" email address is required to gain access to the dataset. Once access is
      granted and compute is provisioned, an email is sent to the user. Program administrators assist
      trainees with this access where needed.
  contact_person: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org

ip_restrictions:
  restrictions:
    - >-
      Software produced by the CHoRUS organization is licensed under the MIT License (individual
      repositories may carry other open-source licenses, for example Chorus_SOP under Apache-2.0). The
      dataset itself is released only under a signed licensing agreement with controlled access.

distribution_formats:
  - name: OMOP Common Data Model tables
    description: >-
      Structured EHR data (demographics, medication administration, procedures, nursing flowsheets,
      diagnoses) distributed in the OMOP Common Data Model within the controlled cloud enclave, with
      published metadata in the OMOP schema, including schema extensions for nursing flowsheets.
  - name: OHNLP tokenized notes
    description: >-
      Clinical notes extracted and tokenized with the OHNLP toolkit and distributed under the OHNLP
      open source schema; full notes are not distributed.
  - name: DICOM imaging
    description: Imaging from PACS distributed in DICOM format with a published DICOM metadata schema.
  - name: WFDB waveforms
    description: >-
      Bedside monitor telemetry distributed in WFDB format using an extended PhysioNet schema.
  - name: EDF+ and Persyst EEG
    description: >-
      EEG waveforms distributed in EDF+ and Persyst formats with published open source EDF+ and
      Persyst schemas.
  - name: Controlled cloud enclave
    description: >-
      OMOP and telemetry data are held in the enclave; clinical notes are stored locally at sites
      except for tokens. CHoRUS services are supported by dockerized container applications deployed
      on Azure, and users work with the data on the Bridge2AI AI/ML for Clinical Care Collaborative
      Cloud.

distribution_dates:
  - description: >-
      A released dataset was available at the time of the September 2025 informational webinar, which
      states that as of August 2025 the dataset covered 14 hospitals with over 45,000 unique
      admissions; the project website describes a current released dataset of 50,000 admissions. The
      anticipated final dataset (100,000 admissions, 9 modalities) had not been released.

third_party_sharing:
  - is_shared: true
    description: >-
      The dataset is made available beyond the creating consortium under controlled access, including
      to trainees of the AIM-AHEAD Bridge2AI for Clinical Care Training Program and to community users
      who register and sign the licensing agreement.

updates:
  update_details:
    - >-
      The dataset is growing toward an anticipated final size of 100,000 patient admissions across 9
      data modalities from 14 contributing hospitals. Imaging de-identification for a larger cohort
      and EEG extraction were in process as of August 2025, and published metadata for clinical notes,
      imaging and EEG were planned. Contributing sites provide regular status updates on their
      progress in creating and curating CHoRUS data extracts, tracked in the Standards Project and
      Data Acquisition Project boards.

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details:
    - >-
      The chorus-ai GitHub organization hosts active repositories for software and tooling, validated
      semantic mappings, standard operating protocols and project management. Contributors can post
      issues in context-specific Standards Discussions or Data Acquisition Discussions, contribute to
      pooled tabular mappings through the chorus-mapping repository and its clinical validation SOP,
      and contribute to CHoRUS software packages using the web guide compiled in the chorus-developer
      repository. Data contributing sites submit status updates through the GitHub interface or a
      Google Form.

external_resources:
  - name: chorus-ai GitHub organization
    description: >-
      Public GitHub organization at https://github.com/chorus-ai with 28 repositories, 3 projects and
      37 followers, housing software and tooling for interacting with clinical data, validated
      semantic mappings, standard operating protocols and project management overviews. Notable
      repositories include chorus-container-apps, Chorus_SOP, chorus_waveform,
      chorus_waveform_resources, chorus-extract-upload, CHoRUSReports, privacy_scan_tool, CTP-deid,
      UF-Geocoding, CADA, data_acq_SOP, cloud_public and chorus-apps-internal.
    restrictions:
      - >-
        The project code is licensed under the MIT License; some repositories carry other licenses,
        for example Chorus_SOP under Apache-2.0.
  - name: CHoRUS project website
    description: >-
      https://chorus4ai.org/ provides the public-facing description of the project, its team, tools,
      data acquisition, standards, community engagement, ethics, dataset snapshot and learning
      resources. An additional project page is referenced at www.bridge2ai.org/chorus.
  - name: AIM-AHEAD Bridge2AI for Clinical Care Training Program
    description: >-
      Training program that expands access to CHoRUS data through engagement, AI training and
      mentorship; Cohort 2 ran from November 17, 2025 to July 31, 2026 with up to 30 trainees, an
      $8,000 stipend upon completion of trainee milestones, and travel allowances for the Bridge2AI
      Conference (May 2026) and AIM-AHEAD Annual Meeting (July 2026).
    restrictions:
      - >-
        Trainee eligibility is limited to U.S. Citizens, Permanent Residents or Non-Citizen U.S.
        Nationals; a ".edu" email address is required to gain access to the dataset.

related_datasets:
  - relationship_type: is_part_of
    target_dataset: https://www.bridge2ai.org/chorus
    description: >-
      CHoRUS is one data generation project of four in the NIH-funded Bridge2AI consortium and
      collaborates with the Bridge2AI Bridge Center and the other data generation projects.