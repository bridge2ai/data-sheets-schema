id: https://cm4ai.org/
name: Cell Maps for Artificial Intelligence
title: Cell Maps for Artificial Intelligence - CM4AI data releases
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics
  Grand Challenge in the NIH Bridge2AI program. The project generates
  multimodal, AI-ready maps of human cell architecture and associated input
  data streams for interpretable genotype-phenotype learning. Current source
  materials describe data streams including protein-protein interaction,
  spatial localization and immunofluorescence imaging, SEC-MS, AP-MS,
  CRISPR/Cas9 genetic perturbation and perturb-seq data in disease-relevant
  cell lines and induced pluripotent stem cell contexts.
