annotation_analyses:
  - id: https://cm4ai.org/annotation-analysis/resource-alignment
    name: Resource alignment and human curation
    analysis_method: >-
      The Nature article describes hypergeometric tests comparing cell-map
      assemblies to Gene Ontology, CORUM and Human Protein Atlas components,
      with FDR correction and human annotation jamborees.
    annotation_quality_details:
      - GPT-4 confidence was contrasted against random protein sets, and high-confidence proposals were reviewed by human curators.
