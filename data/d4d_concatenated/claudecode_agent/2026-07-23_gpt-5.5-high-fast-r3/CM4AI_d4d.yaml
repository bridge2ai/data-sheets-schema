preprocessing_strategies:
  - id: https://cm4ai.org/preprocessing/ro-crate-fairscape
    name: RO-Crate and FAIRSCAPE packaging
    preprocessing_details:
      - CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework.
  - id: https://cm4ai.org/preprocessing/multimodal-embedding
    name: Multimodal embedding and cell-map construction
    preprocessing_details:
      - The Nature article describes self-supervised multimodal machine learning to integrate AP-MS and IF protein representations into a 128-dimensional embedding space.
cleaning_strategies:
  - id: https://cm4ai.org/cleaning/quality-control
    name: AP-MS and imaging quality control
    cleaning_details:
      - The Nature article states that AP-MS data passed quality-control measures including sequence validation, bait protein detection and sufficient peptide and protein identifications.
      - Immunofluorescence images were generated and validated according to Human Protein Atlas standard procedures for image and antibody quality control.
labeling_strategies:
  - id: https://cm4ai.org/labeling/assembly-annotation
    name: Cell-map assembly annotation
    data_annotation_protocol:
      - Assemblies were aligned with Gene Ontology cellular component, CORUM and Human Protein Atlas resources.
      - Annotation Jamborees used expert curation to assign names and putative functional roles to assemblies.
      - Gene Set AI using GPT-4 proposed names for some previously undocumented assemblies, followed by human curation.
    labeling_details:
      - The Nature article states that LLM-assisted assembly names were passed to the human curation team for final naming determination.
raw_sources:
  - id: https://cm4ai.org/raw-source/cell-lines
    name: Commercially available de-identified human cell lines
    raw_data_details:
