purposes:
  - id: https://cm4ai.org/purpose/interpretable-genotype-phenotype-learning
    name: Interpretable genotype-phenotype learning
    description: >-
      Map the spatiotemporal architecture of human cells and use these maps
      toward the grand challenge of interpretable genotype-phenotype learning.
    response: >-
      The NIH RePORTER source states that CM4AI seeks to create visible machine
      learning systems built directly on knowledge maps of cell and tissue
      architecture.
  - id: https://cm4ai.org/purpose/ai-ready-cell-maps
    name: AI-ready cell map data resources
    description: >-
      Deliver machine-readable hierarchical maps of cell architecture as
      AI-ready data together with quarterly map-input data stream releases.
    response: >-
      CM4AI source documentation states that releases include data and tools for
      functional genomics, model training and cellular process analysis.
tasks:
  - id: https://cm4ai.org/task/functional-genomics
    name: Functional genomics analysis
    description: >-
      Support research in functional genomics using multimodal data from mass
      spectrometry, imaging and genetic perturbation.
  - id: https://cm4ai.org/task/model-training
    name: AI model training
    description: >-
      Support AI model training on cell architecture, protein interaction,
      spatial localization and perturbation data.
  - id: https://cm4ai.org/task/cell-architecture-analysis
    name: Cell architecture and interaction analysis
    description: >-
      Support analysis of cellular process, architectural changes and
      interactions in disease processes, treatment conditions or genetic
      perturbations.
addressing_gaps:
  - id: https://cm4ai.org/gap/black-box-genomics
    name: Black-box genotype-to-phenotype prediction
    description: >-
      CM4AI addresses the difficulty of interpreting machine learning models
      that predict phenotypes from genotypes without understanding translation
      mechanisms.
  - id: https://cm4ai.org/gap/multimodal-cell-map-coverage
    name: Multimodal cellular structure coverage
    description: >-
      CM4AI combines complementary mapping approaches because individual omics
      or imaging modalities have incomplete and partially overlapping coverage.
