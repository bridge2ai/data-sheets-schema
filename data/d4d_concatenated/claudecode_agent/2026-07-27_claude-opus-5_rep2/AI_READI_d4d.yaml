    description: >-
      This directory contains data collected through a wearable fitness tracker, the Garmin
      Vivosmart 5, organized into heart rate, oxygen saturation, physical activity, physical
      activity calorie, respiratory rate, sleep and stress modalities. Source data were exported in
      .FIT file format and converted to the Open mHealth standard for the dataset.
    path: wearable_activity_monitor
    collection_type:
