purposes:
  - id: d4d:AI_READI_purpose_salutogenesis
    name: Enable AI/ML research into type 2 diabetes salutogenesis
    description: Primary scientific purpose stated for creating the dataset.
    response: >-
      The purpose for creating the dataset was to enable future generations of artificial
      intelligence/machine learning (AI/ML) research to provide critical insights into type 2
      diabetes mellitus (T2DM), including salutogenic pathways to return to health. T2DM is a
      growing public health threat, yet current understanding of T2DM, especially in the context
      of salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches may help
      improve understanding, but a key issue is the lack of data ready for training AI models.
      The AI-READI dataset is intended to fill this gap.
  - id: d4d:AI_READI_purpose_pseudotime_manifold
    name: Support downstream pseudotime manifold analysis
    description: Analytic purpose that shaped the data collection design.
    response: >-
      The multimodal dataset was gathered to facilitate downstream pseudotime manifold analysis
      and various applications in artificial intelligence. Pseudotime manifold analysis is an
      approach used to predict disease trajectories by collecting and learning from complex,
      multimodal data from participants with differing disease severity, ranging from normal to
      insulin-dependent T2DM. The approach relies on dimensionality reduction, is agnostic to
      existing classification criteria or biases, and can be used to reconstruct a temporal atlas
      of pathogenesis and healing.
  - id: d4d:AI_READI_purpose_blueprint
    name: Provide a blueprint and standards for AI-ready data generation
    description: Methodological purpose beyond the dataset content itself.
    response: >-
      AI-READI places special emphasis on establishing standards, best practices and guidelines
      for the collection, preparation and sharing of data that can be used for future efforts to
      develop other data sets targeted for AI/ML. The project is sharing its blueprint for
      collecting and sharing AI-ready datasets so that future Data Generation Projects can follow
      it, including guidelines for project management as well as data collection, management and
      sharing. Following FAIR (Findable, Accessible, Interoperable, Reusable) principles, AI-READI
      can be viewed as a model for future efforts to develop other medical and health data sets
      targeted for AI/ML.
  - id: d4d:AI_READI_purpose_workforce
    name: Train a diverse AI and biomedical research workforce
    description: Workforce development purpose of the parent project.
    response: >-
      An additional project aim is to increase access to and the quality of AI/ML research by
      recruiting and training personnel. AI-READI hosts a year-long research internship programme
      providing immersive training for individuals interested in working at the nexus of
      biomedicine and AI, comprising a two-week data science and programming bootcamp followed by
      a yearlong curriculum of didactic lectures and mentored research. The inaugural cohort in
      academic year 2023-2024 consisted of 10 interns, of whom 70 percent were women, 30 percent
      were Black, and 50 percent overall were from under-represented backgrounds based on NIH
      criteria.

tasks:
  - id: d4d:AI_READI_task_no_predefined_task
    name: No predefined machine learning task
    description: Statement about whether the dataset ships with a defined task.
    response: >-
      No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic
      dataset aimed at facilitating multiple potential downstream AI/ML applications. The dataset
      has not been used for any tasks already. The version 3.0.0 datasheet does not introduce new
      tasks or labeling; it does introduce a new recommended data split for the 2,280 participants
      balancing training, validation and testing sets for age, sex, race/ethnicity and study group.
  - id: d4d:AI_READI_task_disease_trajectory
    name: Disease trajectory reconstruction
    description: Intended analytic task the collection design was optimised for.
    response: >-
      The long-term objective for the project is to develop a foundational dataset in T2DM,
      agnostic to existing classification criteria or biases, which can be used to reconstruct a
      temporal atlas of T2DM development and reversal towards health, that is, salutogenesis. Data
      collection was specifically designed to permit downstream pseudotime manifold analysis to
      predict disease trajectories across participants with differing disease severity.

addressing_gaps:
  - id: d4d:AI_READI_gap_ai_ready_data
    name: Lack of AI-ready multimodal diabetes datasets
    description: Primary gap the dataset is designed to fill.
    response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as
      T2DM has been limited by a lack of well-designed, high quality, large and inclusive
      multimodal datasets. A major barrier has been the lack of diverse datasets that are AI ready
      for training AI models, which the AI-READI project is designed to address. All data are
      stored and shared using FAIRhub as AI-ready, which enables immediate AI/ML research without
      reformatting and preprocessing.
  - id: d4d:AI_READI_gap_demographic_balance
    name: Under-representation of racial and ethnic groups in T2DM research
    description: Equity gap addressed by the balanced sampling design.
    response: >-
      The prevalence of T2DM is higher in certain racial and ethnic populations and the
      deleterious consequences are exacerbated in these populations. A meta-epidemiological review
      of T2DM studies published from 2000 to 2020 indicated that samples lacked racial and ethnic
      diversity. Rather than targeting the demographic distribution of the US population, AI-READI
      recruits four race/ethnic groups (Asian, Black, White, Hispanic) in equal proportions, making
      the sample approximately balanced with respect to race/ethnicity, a demographic improvement
      over many previous epidemiological studies and clinical trials on T2DM.
  - id: d4d:AI_READI_gap_severity_balance
    name: Absence of severity-balanced cohorts for unbiased model training
    description: Design gap addressed by triple balancing on diabetes severity.
    response: >-
      Building balanced data sets is critical for the development of unbiased machine learning
      models. The study population is designed to be balanced across four T2DM severity groups
      (no diabetes; pre-diabetes or lifestyle-controlled diabetes; diabetes treated with oral or
      non-insulin injectable medications; insulin-controlled diabetes) to facilitate artificial
      intelligence and machine learning model development.

