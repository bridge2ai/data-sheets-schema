instances:
  - id: d4d:AI_READI_instance_participant
    name: Participant record
    description: >-
      Each instance represents an individual patient. An instance consists of all of the data
      available for an individual participating in the study, spanning survey data, clinical data,
      retinal imaging data, environmental sensor data, continuous glucose monitor data and
      wearable activity monitor data. These encompass tabular data, imaging data, and physiological
      signal or waveform data. There is no unstructured text data included in this dataset. There
      is currently only one visit per participant. Version 3.0.0 contains 2,280 participants;
      version 1.0.0 contained 204 and version 2.0.0 contained 1,067.
    instance_type: individual study participant
    counts: 2280
    label: false
    label_description: >-
      No labels are provided. No explicit label or target is associated with each data instance,
      because the dataset is hypothesis-agnostic and aimed at facilitating multiple potential
      downstream AI/ML applications. No labeling was performed, so no labeling software is
      applicable, and the project has no formal guidelines for future researchers creating new
      labels or defining new tasks.
    missing_information:
      - id: d4d:AI_READI_missing_modalities
        name: Modality coverage gaps
        missing:
          - Data for one or more modalities are absent for some participants.
        why_missing:
          - Some participants elected not to participate in some study elements.
          - >-
            In a few cases the data collection device did not have any stored results or was
            returned too late to retrieve the results, for example because the battery died or the
            data were lost.
          - >-
            In a few cases there may have been a data collision at some point in the process and
            data have been lost.

