    description: >-
      This directory contains data collected through a continuous glucose monitoring (CGM) device,
      the Dexcom G6, which records blood glucose measurements in mg/dL every 5 minutes over the
      10-day at-home monitoring period.
    path: wearable_blood_glucose
    collection_type:
