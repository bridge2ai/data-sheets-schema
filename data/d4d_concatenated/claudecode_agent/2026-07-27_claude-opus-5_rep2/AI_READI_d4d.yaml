    file_count: 2246
    total_bytes: 4169006971
    conforms_to: Open mHealth
  - id: d4d:AI_READI_fc_root_metadata
    name: root metadata files
    title: Root-level dataset metadata files
    description: >-
      Root-level metadata files distributed with the dataset following the Clinical Dataset
      Structure (CDS) v0.1.1 specification: CHANGELOG.md, dataset_description.json,
      dataset_structure_description.json, healthsheet.md, LICENSE.txt, participants.json,
      participants.tsv, README.md and study_description.json. The nine root metadata files account
      for the difference between the 356,343 files reported for the whole dataset and the 356,334
      files contained in the nine data type directories.
    collection_type:
      - metadata
      - documentation
    file_count: 9
    conforms_to: Clinical Dataset Structure (CDS) v0.1.1

external_resources:
  - id: d4d:AI_READI_external_documentation
    name: AI-READI dataset documentation
    description: >-
      The dataset is self-contained but relies on the dataset documentation for users requiring
      additional information about the provenance of the dataset. Each dataset version has its own
      documentation version, selectable from the version dropdown on the documentation site.
    external_resources:
      - https://docs.aireadi.org
      - https://docs.aireadi.org/docs/3/about
      - https://aireadi.org
      - https://github.com/AI-READI
      - https://zenodo.org/communities/aireadi
      - https://cds-specification.readthedocs.io
    restrictions:
      - >-
        The documentation is shared under the CC-BY 4.0 license, so there are no restrictions
        associated with its use.

anomalies:
  - id: d4d:AI_READI_anomaly_noise_sources
    name: Errors, sources of noise and redundancies
    description: Known error and noise sources by modality.
    anomaly_details:
      - >-
        In cases of survey data, skipped questions or incomplete responses are expected.
      - >-
        In cases of using wearables, improper use and technical failure such as battery failure or
        system malfunction are expected.
      - >-
        In cases of imaging data, patient uncooperation, noise that may obscure the images,
        technical failure such as system malfunction, and data transfer failures are expected.
      - >-
        Undilated Optomed Aurora handheld fundus images vary in quality from patient to patient
        and within the same patient, because obtaining a good view is challenging without dilation
        and because the camera is handheld.
      - >-
        The Heidelberg Spectralis is operated manually rather than fully automatically, so quality
        issues may arise which may lead to skipping this modality and missing data.
      - >-
        FLIO takes longer than a usual Spectralis OCT and exposes patients to uncomfortable levels
        of light, so it is performed as the last modality of a visit; because of this, participants
        may not be at their best possible compliance.

known_biases:
  - id: d4d:AI_READI_bias_volunteer
    name: Volunteer selection bias
    bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, therefore there is selection bias known as volunteer bias which
      may limit the generalisability of results among those who are not represented in the study
      population. Recruitment is predominantly urban and hospital-based, drawn from patients who
      had a medical encounter within each health system site, which may not fully capture diverse
      cultural and socioeconomic backgrounds.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic diversity across the United
      States and to ensure diverse representation across racial and ethnic groups, and individuals
      from all demographic backgrounds are recruited at all three sites.
  - id: d4d:AI_READI_bias_representation
    name: Population representation gaps
    bias_type: representation_bias
    bias_description: >-
      The study cohort may not provide a comprehensive representation of the population, as it does
      not include other races and ethnicities such as Pacific Islanders and Native Americans.
      Requiring that eligible participants speak, read and understand English may create challenges
      in recruiting Hispanic and/or Asian persons, and non-English-speaking participants are not
      initially enrolled because translating all study materials was not initially feasible.
    mitigation_strategy: >-
      The project engaged with the Native Biodata Consortium and planned a tribal consultation to
      address barriers and facilitators of participation with the goal of collecting similar data
      within a Native American cohort in an ethical and respectful manner. An NIH supplement was
      submitted to fund translation of all study materials to enable recruitment of
      Spanish-speaking participants, and Spanish translation of the consent form by UCSD
      translation services is planned if Hispanic recruitment goals are not met.
    affected_subsets:
      - Pacific Islander populations
      - Native American and Alaska Native populations
      - Individuals who do not speak, read or understand English
  - id: d4d:AI_READI_bias_interim_imbalance
    name: Interim release imbalance
    bias_type: sampling_bias
    bias_description: >-
      While the cross-sectional database ultimately aims to achieve balance across race/ethnicity,
      biological sex, and diabetes presence and severity, the pilot study is not balanced across
      these parameters. As enrollment is ongoing, the pilot data release and periodic updates to
      data releases may not have achieved balanced distribution across groups.
    mitigation_strategy: >-
      Recruitment proceeds in waves whose composition and size are influenced by observed
      participation characteristics, and the composition of participants is monitored for diversity
      and inclusion and adjusted by under- and oversampling groups as needed. The recommended
      validation and test splits are balanced as well as possible for sex, race/ethnicity and
      diabetes status.
  - id: d4d:AI_READI_bias_recruitment_difficulty
    name: Differential recruitment difficulty by group
    bias_type: selection_bias
    bias_description: >-
      It is a well-documented observation in health research that recruiting Black men into studies
      is more difficult than recruiting other populations, yet this population represents a
      disproportionate percentage of burden in T2DM. Factors such as medical mistrust and fear for
      safety stem from historical events such as the Tuskegee syphilis study. Similar trends for
      under-recruitment and for disease burden have also been reported for Hispanic and Asian
      persons.
    mitigation_strategy: >-
      If sample balancing on race/ethnicity emerges as a challenge, new recruitment strategies will
      be implemented to overcome the imbalance, drawing on identified strategies such as tailoring
      printed materials and using a personalised, participatory approach to recruitment. Sites also
      prioritise recruitment by local demographics, with University of Washington concentrating on
      Asian, then Hispanic, then Black participants; UCSD prioritising Hispanic, then Asian, then
      Black; and UAB prioritising Black, then Hispanic, then Asian participants.
  - id: d4d:AI_READI_bias_device_measurement
    name: Device and operator measurement variability
    bias_type: measurement_bias
    bias_description: >-
      Multiple makes and models of device are used for several measures, and some imaging
      modalities depend on operator technique, which introduces measurement variability. Blood
      pressure was measured with OMRON HEM 907XL, Medline MDS4001 and Welch Allyn 6000 series
      monitors across sites, and lensometry with NIDEK LM-600P, Topcon CL-200 and Topcon CL-300
      devices.
    mitigation_strategy: >-
      Information on device make and model, including specific modalities such as macula scans or
      wide scans during OCT, was documented to ensure repeatability. Multiple devices were included
      for one measure deliberately, to enhance generalizability and represent the diverse range of
      equipment utilized in clinical settings. Uniform data collection protocols were implemented
      for all subjects irrespective of race/ethnicity, biological sex or diabetes severity, across
      all study sites.

known_limitations:
  - id: d4d:AI_READI_limitation_enrollment_incomplete
    name: Release covers only part of the target cohort
    limitation_type: coverage_limitation
    limitation_description: >-
      Version 3.0.0 contains 2,280 of the 4,000 participants targeted by the study protocol.
      Enrollment began on 18 July 2023 and is planned to continue until 30 November 2026, so this
      release represents an interim state of the cohort.
    scope_impact: >-
      Statistical power and the achieved balance across race/ethnicity, sex and diabetes severity
      groups are lower than the study design target.
    recommended_mitigation: >-
      Use the recommended data splits, which are balanced as well as possible on sex,
      race/ethnicity and diabetes status, and consult later dataset versions as enrollment
      completes.
  - id: d4d:AI_READI_limitation_cross_sectional
    name: Cross-sectional design with a single visit per participant
    limitation_type: temporal_limitation
    limitation_description: >-
      AI-READI is a cross-sectional study and this release contains one visit per participant, so
      within-person change over time cannot be observed. A longitudinal arm inviting approximately
      4 to 10 percent of participants back for a follow-up visit in year 4 of the project is
      planned but not included in this release.
    scope_impact: >-
      Disease trajectory questions must be approached through cross-sectional methods such as
      pseudotime manifold analysis rather than direct longitudinal follow-up.
  - id: d4d:AI_READI_limitation_biorepository
    name: Finite biorepository samples
    limitation_type: scope_limitation
    limitation_description: >-
      A limitation of the biorepository is that there are a finite number of samples to share with
      scientists interested in using them in research. Procedures for reviewing and prioritising
      written requests will be developed before the biorepository is complete.
    scope_impact: >-
      Access to biospecimens is constrained and governed separately from access to the digital
      dataset; biobanked samples are not part of this dataset release.
  - id: d4d:AI_READI_limitation_withheld_variables
    name: Sensitive variables withheld from the public release
    limitation_type: scope_limitation
    limitation_description: >-
      The publicly distributed dataset excludes protected health information and additionally
      excludes information related to the sex and race/ethnicity of participants and medications
      used. Data held under controlled access include 5-digit zip code, sex, race, ethnicity,
      genetic sequencing data, past health records, medications, and traffic and accident reports.
    scope_impact: >-
      Fairness analyses that require demographic attributes cannot be performed directly on the
      public release; the project supplies balanced recommended splits precisely because these
      attributes are unavailable to public users.
    recommended_mitigation: >-
      Researchers requiring the withheld variables must obtain the controlled access dataset, which
      requires that their institutions complete legal and privacy use agreements with the AI-READI
      research programme through an approval process developed by the project committee.
  - id: d4d:AI_READI_limitation_dropped_variables
    name: Snellen visual acuity variables dropped in this version
    limitation_type: integration_limitation
    limitation_description: >-
      The data fields and types are largely the same as the prior version of the dataset, except
      that the Snellen visual acuity variables were dropped in this version, so that only logMAR
      visual acuity measurements are available.
    scope_impact: >-
      Analyses that pool version 2.0.0 and version 3.0.0 on Snellen acuity are not possible without
      conversion; only logMAR measurements are common across the current release.
  - id: d4d:AI_READI_limitation_no_labels
    name: No labels, tasks or human performance baselines
    limitation_type: methodological_limitation
    limitation_description: >-
      No explicit label or target is associated with each data instance, no gold standard or proxy
      labeling strategy is defined, and human level performances for the applications the dataset
      is meant to address are not reported. The project also states that it has no formal
      guidelines for future researchers creating new labels or defining new tasks.
    scope_impact: >-
      Supervised learning users must define and justify their own outcome definitions and label
      derivations from the released variables.
  - id: d4d:AI_READI_limitation_no_audit
    name: No formal external audit
    limitation_type: methodological_limitation
    limitation_description: >-
      The dataset has not undergone any formal external audits. It has been reviewed internally by
      AI-READI team members for quality checks and to ensure that no personally identifiable
      information was accidentally included. A data protection impact analysis has not been
      conducted.
    scope_impact: >-
      Assurance about data quality and disclosure risk rests on internal project review rather than
      independent assessment.

confidential_elements:
  - id: d4d:AI_READI_confidentiality
    name: Confidential content assessment
    description: Whether the released dataset contains confidential material.
    confidential_elements_present: false
    confidentiality_details:
      - >-
        The dataset does not contain data that might be considered confidential. No personally
        identifiable information is included in the dataset.
      - >-
        The data in this dataset contain no protected health information (PHI). Information related
        to the sex and race/ethnicity of the participants as well as medication used has also been
        removed.

content_warnings:
  - id: d4d:AI_READI_content_warnings
    name: Offensive or distressing content assessment
    description: Whether direct viewing of the data could be offensive or pose a safety risk.
    content_warnings_present: false
    warnings:
      - >-
        The dataset creators answered "No" to whether the dataset contains data that, if viewed
        directly, might be offensive, insulting, threatening, or might otherwise pose any safety
        risk such as psychological safety and anxiety.

subpopulations:
  - id: d4d:AI_READI_subpopulations
    name: Demographic sub-population identification
    description: >-
      Whether demographic sub-populations are identified within the distributed dataset, and how
      the study handles demographic balance in their absence.
    subpopulation_elements_present: false
    identification:
      - >-
        The dataset creators answered "No" to whether the dataset identifies any demographic
        sub-populations by age, gender, sex or ethnicity, because sex, race and ethnicity variables
        are withheld from the public release; those variables are available only in the controlled
        access dataset.
      - >-
        No regulation prevents demographic data collection in the study; the withholding is a
        privacy design decision intended to prevent stigmatization of findings.
      - >-
        The study protocol nevertheless defines four recruitment groups by diabetes status
        (healthy/no diabetes; pre-diabetes, borderline or lifestyle-controlled diabetes; oral
        and/or non-insulin injectable medication controlled type 2 diabetes; insulin dependent
        type 2 diabetes) with a target of approximately 1,000 participants per group, and four
        target racial and ethnic groups (White, Asian, Hispanic, Black) with a target of 1,000
        participants each.
    distribution:
      - >-
        Aggregate distributions for version 3.0.0 across the recommended splits are reported as
        Hispanic 380, Asian 545, Black 519 and White 836; male 951 and female 1,329; and no
        diabetes 776, lifestyle controlled 560, oral medication controlled 686 and insulin
        controlled 258, with an overall mean age of 60.8 years and standard deviation of 11.3
        years.
      - >-
        To reduce disparity of error rates between demographic subgroups when demographic labels
        are unavailable to users, the project supplies a recommended training, validation and
        testing split aimed at reducing disparities in models developed using this dataset.

sensitive_elements:
  - id: d4d:AI_READI_sensitive_elements
    name: Sensitive data assessment
    description: Sensitive content in the public versus controlled access releases.
    sensitive_elements_present: true
    sensitivity_details:
      - >-
        The public dataset does not contain data that is considered sensitive.
      - >-
        The controlled access dataset contains data regarding racial and ethnic origins, location
        as 5-digit zip code, and motor vehicle accident reports, as well as genetic sequencing
        data, past health records and medications.
      - >-
        The public set is stripped of Protected Health Information as defined by the HIPAA Privacy
        Rule via the Safe Harbor method, as well as information related to the sex and
        race/ethnicity of the participants, to prevent stigmatization of findings.

acquisition_methods:
  - id: d4d:AI_READI_acquisition
    name: Instance acquisition
    description: How the data associated with each instance were acquired.
    was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details:
      - >-
        The acquisition of data varied based on the domain; some data were directly observable,
        such as labs, vitals and retinal imaging, whereas other data were reported by subjects, for
        example survey responses.
      - >-
        Verification of data entry was performed when possible, for example by cross-referencing
        entered medications with medications that were physically brought in or photographed by
        each study participant.
      - >-
        Data were also extracted from electronic medical records to obtain general health, eye
        health, medical and surgical history, diabetes, medications, laboratory records and
        previous medical imaging, and driving and accident records were obtained from the
        Department of Licensing.

collection_mechanisms:
  - id: d4d:AI_READI_collection_mechanisms
    name: Collection mechanisms and procedures
    description: Hardware, software and human procedures used to collect the data.
    mechanism_details:
      - >-
        REDCap is used for collecting patient-reported data from questionnaires and the following
        clinical data from the visit: medications assessment, vitals, visual acuity, contrast
        sensitivity, monofilament test results and complete blood count test results.
      - >-
        Electrocardiography is performed with a Philips PageWriter TC30 cardiograph using a 12-lead
        protocol while the participant sits in a reclining chair or lies supine, with the position
        recorded at 0, 30, 60 or 90 degrees relative to supine, exported as .xml.
      - >-
        Cognitive screening uses the Montreal Cognitive Assessment administered electronically on
        an iPad using the MoCA Duo application, exporting total score, section subscores, Memory
        Index Score and task completion times as .csv.
      - >-
        Peripheral neuropathy is assessed with the 10 g monofilament test on both feet with shoes
        and socks removed, with the participant's eyes closed, responding yes or no at three
        locations on each foot, ten times per location, with insensate areas retested for
        confirmation.
      - >-
        Visual acuity is measured with the M&S Technologies Electronic Visual Acuity tester at 4
        metres on a 12 by 20 inch touch-screen monitor, under photopic conditions and under mesopic
        conditions using a 2.0 neutral density filter, expressed as logMAR under best-corrected
        conditions.
      - >-
        Contrast sensitivity is measured with the Mars Letter Contrast Sensitivity chart
        monocularly under photopic and mesopic conditions, with background luminance between 60 and
        120 candela per square metre (optimal 85), illuminance between 189 and 377 lux (optimal
        267), and viewing distance nominally 50 cm with a permitted range of 40 to 59 cm, all under
        undilated conditions.
      - >-
        Autorefraction is obtained for each eye with a Topcon KR 800 auto keratometer/refractor,
        recording spherical and cylindrical components in dioptres with cylindrical axis.
      - >-
        Retinal imaging is performed on both eyes with the Optomed Aurora IQ (undilated colour
        fundus, 4 images per participant), iCare Eidon widefield truecolor confocal fundus system
        (12 images), Heidelberg Spectralis HRA OCT and OCTA (6 images), Topcon Maestro2 3D OCT-1 (6
        images), Topcon Triton DRI OCT (6 images), Zeiss Cirrus 5000 (8 images) and Heidelberg FLIO
        (2 images). All retinal images are collected under dilated conditions except for the
        Optomed.
      - >-
        At the end of the in-person visit, participants are sent home with three monitoring devices
        used continuously for 10 days: a custom-designed home environmental sensor (LeeLab Anura),
        a Garmin Vivosmart 5 fitness tracker and a Dexcom G6 continuous glucose monitor. Devices are
        returned to study staff by overnight mail or in person, together with a data sheet recording
        which wrist the fitness tracker was worn on, the participant's dominant hand and where the
        environmental sensor was placed in the home.
      - >-
        Blood (approximately 50 to 60 mL, described in the protocol publication as 53 mL) and urine
        are collected during the visit. Complete blood count testing is performed on fresh whole
        blood by Clinical Laboratory Improvement Amendments-certified laboratories local to each
        site; all other lab tests are performed by the University of Washington Nutrition and
        Obesity Research Center testing facility using stored frozen samples batch-shipped on dry
        ice approximately once per quarter.
      - >-
        The procedures for data collection and processing are documented at https://docs.aireadi.org.

sampling_strategies:
  - id: d4d:AI_READI_sampling
    name: Sampling strategy
    description: Whether the dataset is a sample, and how participants were selected.
    is_sample: false
    is_random: false
    is_representative: false
    source_data:
      - >-
        The study base is all patients aged 40 years or older who had a medical encounter within
        each health system site (University of Alabama at Birmingham, University of California San
        Diego, University of Washington) between 2020 and 2025.
    strategies:
      - >-
        The dataset contains all possible instances; more specifically, it contains data from all
        participants enrolled during the covered data collection period. The sampling strategy
        question in the project healthsheet is answered as not applicable for this reason.
      - >-
        Participants are recruited in waves. For each wave a contact pool is identified by
        screening electronic health records at each site using ICD-10 diagnosis codes R73.09 for
        pre-diabetes and E11.X for T2DM; patients without diabetes do not have encounters with these
        codes. Individuals in each pool are mailed a hardcopy invitation letter and sent an
        invitation email, personalised to direct them into an online REDCap recruitment interface
        via links, access codes and QR codes.
      - >-
        UW and UCSD provide lists of potential participants identified through electronic medical
        record search to UAB, which adds its own eligible patients and selects a stratified sample
        based on the sampling scheme. The selection process recurs, with UAB coordinating selection
        to achieve balancing of race/ethnicity, sex and diabetes severity until recruitment goals
        are achieved. Over the three-plus years of recruitment, approximately 50,000 invitation
        letters from each site are planned.
      - >-
        The overall clinical trial registration records the sampling method as a non-probability
        sample.
    why_not_representative:
      - >-
        Rather than targeting the demographic distribution of the US population, the study
        deliberately recruits four race/ethnic groups in equal proportions and four diabetes
        severity categories in equal proportions, so the cohort is intentionally not representative
        of the general population.
      - >-
        All study groups are recruited from each site, but the proportion of each group varies
        depending on the demographic prevalence of each group in the site's geographical area.

data_collectors:
  - id: d4d:AI_READI_collectors_team
    name: AI-READI study team
    role: Data collection, curation and quality control
    description: >-
      Who was involved in the data collection process and how they were supported.
    collector_details:
      - >-
        Details about the AI-READI team members involved in the data collection process are
        available at https://aireadi.org/team. Their effort was supported by National Institutes of
        Health award OT2OD032644 based on the percentage of effort contributed, and salaries which
        aligned with the funding guidelines at each site.
      - >-
        All research personnel at the three data sites who recruited, enrolled and collected data
        underwent training by the data manager at the University of Alabama at Birmingham and used
        a detailed Manual of Procedures for reference. Successful completion of a certification
        process is required for all coordinators, involving mandatory institutional compliance
        training for human subject research.
      - >-
        Prior to enrolling and testing participants, all coordinators are required to successfully
        administer all protocol elements to at least three volunteer practice subjects, meeting the
        standards outlined in the Manual of Procedures. Data managers at each site oversee the
        process.
      - >-
        Defined roles include principal investigators and co-investigators, program and project
        managers, database managers, research and data scientists and postdoctoral fellows,
        clinical research coordinators, research assistants, software engineers, cloud engineers,
        phlebotomists, lab assistants and domain experts in fields such as endocrinology and
        cardiology.
      - >-
        There is a wide range of experience within the project team, including senior, mid-career
        and early career faculty members as well as clinical research coordinators, staff and
        interns, collectively covering clinical research, data collection, data management, data
        standards, bioinformatics, team science and ethics.
      - >-
        The Data Manager at each data site is responsible for the quality control of all data
        before uploading to FAIRhub.

collection_timeframes:
  - id: d4d:AI_READI_timeframe_v3
    name: Version 3.0.0 data collection period
    description: Period covered by the data in this release.
    start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details:
      - >-
        For this version of the dataset, the timeframe for data collection was 19 July 2023 to
        1 May 2025. This is the third version of the dataset and consists of data collected up
        through the end of the second year of the study.
      - >-
        The FAIRhub dataset description records the collection period as 2023-07-19/2025-05-01 with
        date type "Collected".
  - id: d4d:AI_READI_timeframe_study
    name: Overall study timeline
    description: Timeline of the parent data generation project.
    start_date: '2023-07-18'
    end_date: '2026-11-30'
    timeframe_details:
      - >-
        Enrolment began on 18 July 2023 and will continue until 30 November 2026. Preliminary pilot
        enrolment occurred between 18 July 2023 and 30 November 2023 in order to secure sufficient
        familiarity for all coordinators; the formal data collection process began on 1 December
        2023.
      - >-
        The timeline for the overall project spans four years, encompassing one year dedicated to
        protocol development and training, and years 2 to 4 allocated for subject recruitment and
        data collection. The Nature Metabolism comment describes enrolment of 4,000 participants at
        three study sites over four years, 2022 to 2026.
      - >-
        The NIH RePORTER record for application 10471118 gives a project start of 1 September 2022
        and a project end of 31 August 2025. The clinical study record gives an actual start date of
        19 July 2023 and an anticipated completion date of 1 January 2027, with overall status
        "Enrolling by invitation".
      - >-
        Approximately 4 percent of participants are expected to undergo a follow-up examination in
        year 4; the protocol and IRB documents describe an intention to invite about 10 percent of
        the study population back for a second visit.

direct_collection:
  - id: d4d:AI_READI_direct_collection
    name: Direct collection from participants
    description: Whether data were obtained directly from individuals or via third parties.
    is_direct: true
    collection_details:
      - >-
        The data were collected directly from participants across the three recruiting sites.
        Recruitment pools were identified by screening Electronic Health Records for diabetes and
        prediabetes ICD-10 codes for all patients who had an encounter with the sites' health
        systems within the past two years.
      - >-
        Data are obtained from subjects, from devices they are asked to use, and from their
        specimens, as well as from medical records. Driving and accident records are obtained from
        the Department of Licensing, for which no additional approvals beyond the IRB approval are
        required.
      - >-
        Participants who already wear a Dexcom G6 sensor may optionally allow download of
        previously collected glucose values for up to 90 days prior to the study visit, for a total
        of up to 100 days of glucose data.

collection_notifications:
  - id: d4d:AI_READI_notification
    name: Participant notification
    description: Whether and how individuals were notified about data collection.
    notification_details:
      - >-
        Each individual was aware of the data collection, as this was not passive data collection
        or secondary use of existing data, but rather active data collection directly from
        participants.
      - >-
        Individuals identified through electronic medical record screening are sent a personalised
        hardcopy invitation letter and an invitation email directing them to an online REDCap
        recruitment interface, where they can read an overview of the research programme,
        expectations for participation and answers to frequently asked questions, download the
        informed consent document, request a call back from study staff, complete a screening
        survey for qualification, and enroll by signing an electronic consent. Those without
        internet access may call research staff for alternative methods of enrolment.

collection_consents:
  - id: d4d:AI_READI_consent
    name: Participant consent to collection and use
    description: How consent was requested and provided.
    consent_details:
      - >-
        Informed consent to participate was required before participation in any part of the
        protocol, including questionnaires. Written informed consent is provided by all
        participants.
      - >-
        Potential participants were given the option to read all consent documentation
        electronically before their visit and give consent with an electronic signature without
        verbal communication with a clinical research coordinator. Participants may access
        e-consent documentation in REDCap and decide at that point that they do not want to
        participate or would like additional information. For participants who did not select
        electronic consent, consent is performed in person at the start of the visit in a private
        room by a study team member, followed by completion of all questionnaires.
      - >-
        The approved consent form for the principal project site, University of Washington, is
        published in the dataset documentation. The other clinical sites had IRB reliance and used
        the same consent form, with minor institution-specific language incorporated depending on
        individual institutional requirements; the State of California requires inclusion of the
        Bill of Rights in the UCSD consent form.
      - >-
        The consent form includes a table at the beginning clarifying which information will be
        publicly available and which would require an application and approval process containing
        privacy protection. Subjects are asked to confirm their understanding of study activities
        and requirements to ensure comprehension, and a community advisory board evaluates the
        consent forms and research protocols.
      - >-
        Consent covers secondary use, banking and future sharing; the relevant language is included
        in the informed consent form.

consent_revocations:
  - id: d4d:AI_READI_consent_revocation
    name: Consent revocation mechanism
    description: Whether and how participants can revoke consent.
    revocation_details:
      - >-
        Participants were permitted to withdraw consent at any time and cease study participation.
        However, any data that had been shared or used up to that point would stay in the dataset.
        This is clearly communicated in the consent document.
      - >-
        Study subjects have the opportunity to ask questions throughout the study and are reminded
        that they have the right to change their mind about study participation.

missing_data_documentation:
  - id: d4d:AI_READI_missing_data
    name: Missing data patterns and causes
    description: Documentation of missingness within the dataset.
    missing_data_patterns:
      - >-
        Not all modalities are available for all participants.
      - >-
        Skipped questions or incomplete responses occur in survey data.
      - >-
        Imaging modalities may be missing where quality issues led to skipping the modality.
    missing_data_causes:
      - Some participants elected not to participate in some study elements.
      - >-
        In a few cases the data collection device did not have any stored results or was returned
        too late to retrieve the results, for example because the battery died or the data were
        lost.
      - >-
        In a few cases there may have been a data collision at some point in the process and data
        have been lost.
      - >-
        Manual imaging modalities such as the Heidelberg Spectralis may be skipped when quality
        issues arise, and FLIO compliance may be reduced because it is performed last and exposes
        participants to uncomfortable light levels.
    handling_strategy: >-
      Missing data that can be directly filled from other portions of an individual's record were
      identified during data cleaning and corrected under the guidance and approval of the site
      principal investigator. Where there was no logical or appropriate way to correct the data,
      the site principal investigator reviewed the values and decided whether they should be
      removed. No imputation of missing values is described for the released dataset.

raw_data_sources:
  - id: d4d:AI_READI_raw_source_devices
    name: Instrument and device exports
    source_description: >-
      Raw exports from clinical and imaging instruments and at-home monitoring devices, captured to
      local storage at each data collection site before standardisation.
    source_type:
      - instrument export
      - device export
    raw_data_format:
      - .xml from the Philips PageWriter TC30 electrocardiograph
      - .csv from the MoCA Duo cognitive assessment application
      - .csv from the Dexcom G6 continuous glucose monitor
      - .csv from the custom home environmental sensor
      - .FIT from the Garmin Vivosmart 5 fitness tracker
      - .fda from Topcon Maestro2 and Topcon Triton OCT devices
      - .sdt from the Heidelberg FLIO device
      - native DICOM from the Optomed Aurora, iCare Eidon, Heidelberg Spectralis and Zeiss Cirrus
    access_details: >-
      Raw device exports are held by the project and are not distributed; they are converted to
      standard formats before upload to FAIRhub.
  - id: d4d:AI_READI_raw_source_redcap
    name: REDCap study database
    source_description: >-
      REDCap electronic data capture system hosted in the University of Washington REDCap
      installation, holding patient-reported questionnaire data and clinical data entered during
      the visit.
    source_type:
      - electronic data capture system
    raw_data_format:
      - REDCap database records exported to tabular form
    access_details: >-
      Not distributed directly; REDCap contents are mapped to the OMOP Common Data Model and
      released as CSV files within the clinical_data directory. The exact forms used for data
      collection in REDCap are published in the dataset documentation.
  - id: d4d:AI_READI_raw_source_lab
    name: Clinical laboratory results
    source_description: >-
      Results from Clinical Laboratory Improvement Amendments-certified laboratories local to each
      site for complete blood count testing on fresh whole blood, and from the University of
      Washington Nutrition and Obesity Research Center testing facility for all other blood and
      urine assays on stored frozen samples.
    source_type:
      - clinical laboratory
    raw_data_format:
      - .csv
  - id: d4d:AI_READI_raw_source_ehr
    name: Electronic health records and external registries
    source_description: >-
      Electronic health records at the three sites, used both for pre-screening and for extraction
      of general health, eye health, medical and surgical history, diabetes, medications,
      laboratory records and previous medical imaging, together with driving and accident records
      obtained from the Department of Licensing.
    source_type:
      - electronic health record
      - government registry
    access_details: >-
      Health record derived data and traffic and accident reports are held under controlled access
      and are not part of the public release.

raw_sources:
  - id: d4d:AI_READI_raw_data_retention
    name: Raw data retention and availability
    description: Whether raw data are preserved and whether they are shared.
    raw_data_details:
      - >-
        The raw data are saved and expected to be preserved by the AI-READI project at least for
        the duration of the project, but are not anticipated to be shared outside the project team
        at present, because they have not been mapped to standardized terminologies and because raw
        data may accidentally include personal health information or personally identifiable
        information, for example in free text fields.
      - >-
        There is a possibility that raw data may be included in future releases of the controlled
        access dataset.
      - >-
        All participant images are exported from imaging devices in their raw format, and some
        images required conversion to a DICOM standard format prior to upload to the external
        AI-READI data storage site.

preprocessing_strategies:
  - id: d4d:AI_READI_preprocessing
    name: Standardisation and preparation for dissemination
    description: Processing applied between site collection and public release.
    preprocessing_details:
      - >-
        Once data were sent from each of the study sites to the central project team, additional
        processing steps were conducted in preparation for dissemination. All data were mapped to
        standardized terminologies when possible, such as the Observational Medical Outcomes
        Partnership (OMOP) Common Data Model for observational health data and Digital Imaging and
        Communications in Medicine (DICOM) for medical imaging data.
      - >-
        For some devices, the data are transformed from a proprietary state into a standard model
        format prior to upload to FAIRhub: Topcon .fda and Heidelberg .sdt exports are converted to
        DICOM, and Garmin .FIT exports are converted to the Open mHealth standard.
      - >-
        Medications are coded with RxNorm codes, and social determinants of health measures use
        PhenX Toolkit surveys.
      - >-
        Data are organized following the Clinical Dataset Structure (CDS) v0.1.1 specification: at
        the root level one directory per data type, within each data type one folder per modality,
        within each modality one folder per device, and within each device folder one folder per
        participant named after the participant's study ID number. Details about data processing
        approaches for each data domain and modality are described in the dataset documentation at
        https://docs.aireadi.org.
      - >-
        Processing maturity has changed across releases: version 1.0.0 pilot data used custom and
        ad hoc processing, while data for later releases use automated plus custom processing.
      - >-
        No data were excluded from the dataset at the time of preprocessing.

cleaning_strategies:
  - id: d4d:AI_READI_cleaning
    name: Quality control and data cleaning
    description: Quality control measures applied at and after data entry.
    cleaning_details:
      - >-
        Several quality control measures were used at the time of data entry and acquisition. For
        example, clinical data outside of expected minimum and maximum ranges were flagged in
        REDCap, which was visible in reports viewed by clinical research coordinators and data
        managers. Using these REDCap reports as guides, data managers and coordinators examined
        participant records and determined if an error was likely.
      - >-
        Data were checked for credibility based on range checks to determine if all responses fall
        within a prespecified reasonable range; incorrect flow through prescribed skip patterns;
        missing data that can be directly filled from other portions of an individual's record; and
        the omission or duplication of records. Records were edited if errors were detected.
      - >-
        Editing was only done under the guidance and approval of the site principal investigator.
        If corrected data were available from elsewhere in the respondent's answers, the error was
        corrected. If there was no logical or appropriate way to correct the data, the site
        principal investigator reviewed the values and made decisions about whether those values
        should be removed from the data.
      - >-
        The dataset was reviewed internally by AI-READI team members for quality checks and to
        ensure that no personally identifiable information was accidentally included.
      - >-
        A dqd_omop.json file is distributed with the clinical data to support OMOP CDM data quality
        analysis using the OMOP CDM Data Quality Dashboard, which runs a set of more than 3,500
        data quality checks against an OMOP CDM instance.

labeling_strategies:
  - id: d4d:AI_READI_labeling
    name: Labeling strategy
    description: Whether and how instances were labeled.
    labeling_details:
      - >-
        No labels are provided. No explicit label or target is associated with each data instance,
        for either the preliminary dataset or the current version.
      - >-
        No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic
        dataset aimed at facilitating multiple potential downstream AI/ML applications. No gold
        standard, proxy or human labeling strategy applies, and no software used to label instances
        exists to be released.
      - >-
        There are no formal guidelines in place for future researchers who wish to create new
        labels or define new tasks.

existing_uses:
  - id: d4d:AI_READI_existing_uses
    name: Existing uses of the dataset
    description: Tasks for which the dataset has already been used.
    examples:
      - >-
        The dataset creators answered "No" to whether the dataset has been used for any tasks
        already.
      - >-
        FAIRhub reports a citation count of zero and a view count of 24,636 for the version 3.0.0
        record at the time of capture.

use_repository:
  - id: d4d:AI_READI_use_repository
    name: Repository of works using the dataset
    description: Whether a repository tracks papers or systems that use the dataset.
    repository_details:
      - >-
        The dataset creators answered "No" to whether there is a repository, besides Google
        Scholar, that links to any or all papers or systems that use the dataset.
      - >-
        The AI-READI Consortium disseminates the principles and processes of designing and
        implementing the AI-READI data set through publications, and those who download and use
        AI-READI data are encouraged to publish their results in the scientific literature.

other_tasks:
  - id: d4d:AI_READI_other_tasks
    name: Other tasks the dataset could support
    description: Additional applications indicated by the dataset creators.
    task_details:
      - >-
        The multi-modal dataset is being gathered to facilitate downstream pseudotime manifolds and
        various applications in artificial intelligence.
      - >-
        The project anticipates that the flagship dataset will lead to novel discoveries into T2DM
        pathogenesis and salutogenesis while benefiting a broader population, given the diversity of
        the study participants.
      - >-
        Biobanked specimens support future proteomics, metabolomics, genomics, gene expression and
        immunological studies, including generation of induced pluripotent stem cells; these are
        governed separately from the digital dataset.

future_use_impacts:
  - id: d4d:AI_READI_future_use_impacts
    name: Composition and processing effects on future use
    description: What future users should know to avoid harm.
    impact_details:
      - >-
        To the extent of the creators' knowledge, they do not currently anticipate any uses of the
        dataset that could result in unfair treatment or harm. However, there is a theoretical risk
        of future re-identification.
      - >-
        Because sex, race and ethnicity are withheld from the public release, users who wish to
        audit models for demographic fairness on the public data must rely on the recommended
        balanced splits rather than direct stratification.
      - >-
        Because enrollment is ongoing and this release covers 2,280 of a targeted 4,000
        participants, distributions across race/ethnicity, sex and diabetes severity may not yet be
        balanced, which users should account for when training or evaluating models.
      - >-
        To prevent re-identification attempts, the project implements a robust data dissemination
        system, a strict licence agreement and data watermarking for both public and controlled
        sets.

discouraged_uses:
  - id: d4d:AI_READI_discouraged_uses
    name: Discouraged uses
    description: Usage or applications discouraged by the dataset creators.
    discouragement_details:
      - >-
        The AI-READI dataset license imposes certain restrictions on the usage of the data. The
        restrictions are described in the license files available at
        https://doi.org/10.5281/zenodo.17555036.
      - >-
        The license prohibits making clinical treatment decisions based on the data, as it is
        intended solely as a research resource.
      - >-
        The public version of the dataset can only be used for type 2 diabetes related research; a
        private version allows for more generic use.

prohibited_uses:
  - id: d4d:AI_READI_prohibited_reidentification
    name: Re-identification and privacy compromise
    description: >-
      The license prohibits use or attempted use of the data, alone or in concert with other
      information, to compromise or otherwise infringe the confidentiality of information on an
      individual person who is the source of any data or any clinical data or biological sample
      from which data has been generated, and their right to privacy.
    prohibition_reason:
      - >-
        Prohibited acts include identifying or contacting any individual data subject or group of
        data subjects, extracting or extrapolating any identifying information about a data
        subject, establishing a particular data subject's membership in a particular group of
        persons, or otherwise causing harm or injury to any data subject.
  - id: d4d:AI_READI_prohibited_clinical_decisions
    name: Clinical treatment decisions
    description: >-
      Licensees shall not make clinical treatment decisions based on the data, as it is intended
      solely as a research resource.
    prohibition_reason:
      - The dataset is a research resource and is not validated for clinical decision making.
  - id: d4d:AI_READI_prohibited_onward_sharing
    name: Unrestricted onward sharing of the data
    description: >-
      Licensees shall not transfer, license, sublicense, sell, assign, display, share or otherwise
      convey any portion of the data or any derivative work to any third party other than another
      licensee bound by an identical agreement with the licensor.
    prohibition_reason:
      - >-
        Sharing is permitted only with other licensees and their employees, agents and contractors
        bound under such an agreement, for the purpose of collaborating with the licensee on one or
        more projects involving the data. Models, algorithms and programs developed, trained or
        adapted using the data may be distributed provided they do not themselves contain the data
        or any modified version of it, and provided the licensee undertakes all reasonable efforts
        to minimise the likelihood that data can be memorized, derived, reconstructed or
        reconstituted through the use or construction of such models.

intended_uses:
  - id: d4d:AI_READI_intended_uses
    name: Intended uses
    description: Applications the dataset is meant to address.
    use_category:
      - research
      - artificial intelligence and machine learning model development
    examples:
      - Artificial intelligence and machine learning research into type 2 diabetes mellitus.
      - >-
        Investigation of salutogenesis, the pathway from type 2 diabetes mellitus back to health.
      - >-
        Downstream pseudotime manifold analysis to predict disease trajectories from multimodal
        data across disease severity strata.
      - >-
        Multimodal model development combining survey, clinical, laboratory, imaging, waveform,
        wearable and environmental data.
      - >-
        Use as a model or blueprint for future efforts to develop other medical and health data
        sets targeted for AI and machine learning.
    usage_notes: >-
      Accessing the dataset requires logging in through a verified ID system, agreeing to use the
      data only for type 2 diabetes related research, and agreeing to the license terms which set
      certain restrictions and obligations for data usage. All data files are in formats accessible
      with free software commonly used for such data types, so no specific software is required.

distribution_formats:
  - id: d4d:AI_READI_distribution_formats
    name: Distribution formats and access points
    description: >-
      The FAIRhub dataset description lists the media types of the released files as
      application/dicom, text/markdown, text/csv and application/json. The dataset is distributed
      through the FAIRhub platform. Retinal imaging is released as DICOM, electrocardiography in
      WaveForm DataBase (WFDB) format, clinical data as CSV mapped one-to-one to OMOP CDM tables,
      wearable and continuous glucose monitoring data in the Open mHealth standard, environmental
      sensor data following NASA ASCII file format guidelines for Earth science data, and metadata
      as JSON, TSV and Markdown files. Version 3.0.0 of the documentation additionally describes
      Azure Storage access and a mini-subset version of the dataset.
    access_urls:
      - https://fairhub.io/datasets/3
      - https://fairhub.io/
      - https://doi.org/10.60775/fairhub.3

distribution_dates:
  - id: d4d:AI_READI_distribution_dates
    name: Release dates
    description: >-
      Deidentified data are released approximately yearly in two data sets, a controlled access set
      and a publicly accessible set with fewer requirements for access. The dataset gets released as
      static versions; the dataset itself is not updated in place.
    release_dates:
      - >-
        Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024, containing 204 participants from
        the pilot data collection phase.
      - >-
        Version 2.0.0, DOI 10.60775/fairhub.2, released 8 November 2024, containing 1,067
        participants and covering data collected through 31 July 2024.
      - >-
        Version 3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025, containing 2,280
        participants and covering data collected from 19 July 2023 to 1 May 2025.

third_party_sharing:
  - id: d4d:AI_READI_third_party_sharing
    name: Distribution to third parties
    description: >-
      The dataset will be distributed and be available for public use, to third parties outside the
      entity on behalf of which it was created. Two databases exist for data distribution: a
      deidentified one that is publicly available, and one containing some identifiable or sensitive
      information, namely genomic data and race/ethnicity, which requires a data user agreement
      between researchers and an approval process developed by the project committee.
    is_shared: true

license_and_use_terms:
  id: d4d:AI_READI_license
  name: AI-READI custom license
  description: >-
    The dataset is released under a custom license specifically tailored to enable reuse of the
    AI-READI dataset, and other clinical datasets, for commercial or research purposes while
    putting strong requirements around data usage, security and secondary sharing to protect study
    participants, especially when data is reused for artificial intelligence and machine learning
    related applications. FAIRhub records the applicable license for version 3.0.0 as "AI-READI
    custom license v2.0" at https://doi.org/10.5281/zenodo.17555036 and labels it as a Health Data
    License. Version 1.0 of the license, published at https://doi.org/10.5281/zenodo.10642459, is
    the version captured in this source bundle. The contact person referenced below is Aaron Y.
    Lee (ORCID https://orcid.org/0000-0002-7452-1648), the central study contact recorded in the
    FAIRhub study description; the general dataset contact address is contact@aireadi.org and
    https://aireadi.org/contact.
  data_use_permission:
    - disease_specific_research
  license_terms:
    - >-
      Current license: AI-READI custom license v2.0, https://doi.org/10.5281/zenodo.17555036. The
      license terms were specifically tailored to enable reuse of the AI-READI dataset, and other
      clinical datasets, for commercial or research purposes while putting strong requirements
      around data usage, security and secondary sharing to protect study participants.
    - >-
      Access conditions recorded by FAIRhub for version 3.0.0 are
      "PublicDownloadSelfAttestationRequired": logging in through a verified ID system, agreeing to
      use the data only for type 2 diabetes related research, and agreeing to the license terms.
    - >-
      Consent-derived condition: the public version of the dataset can only be used for type 2
      diabetes related research; a private version will allow for more generic use.
    - >-
      Terms of the captured version 1.0 license (University of Washington as Licensor,
      https://doi.org/10.5281/zenodo.10642459), section 1: the Licensor grants the Licensee a
      non-exclusive and non-transferable license to download, reproduce and use the Data, and to
      create derivative works thereof, for research and commercial purposes. All full and partial
      copies of the Data made by the Licensee are subject to the terms of the agreement.
    - >-
      Version 1.0 license section 2: the Licensee shall not transfer, license, sublicense, sell,
      assign, display, share or otherwise convey any portion of the Data or any derivative work to
      any third party other than another licensee bound by an identical agreement. The Licensee is
      permitted to make, reproduce and distribute models, algorithms and programs developed, trained
