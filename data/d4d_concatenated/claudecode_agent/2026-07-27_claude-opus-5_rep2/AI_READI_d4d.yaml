    description: >-
      This directory contains retinal photography data, which are 2D images, also referred to as
      fundus photography. Modalities are colour fundus photography (iCare Eidon, Optomed Aurora,
      Topcon Maestro2, Topcon Triton), fundus autofluorescence (iCare Eidon) and near-infrared
      reflectance (Heidelberg Spectralis, iCare Eidon, Topcon Maestro2, Zeiss Cirrus).
    path: retinal_photography
    collection_type:
      - processed_data
    file_count: 93921
    total_bytes: 174381046406
    conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  - id: d4d:AI_READI_fc_wearable_activity_monitor
    name: wearable_activity_monitor
