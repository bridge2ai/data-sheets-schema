splits:
  - id: d4d:AI_READI_splits_recommended
    name: Recommended training, validation and test splits
    description: Recommended data splits shipped with version 3.0.0 of the dataset.
    split_details:
      - >-
        The current version of the dataset comes with recommended data splits. Because sex, race
        and ethnicity data are not released with the public version of the dataset, the project
        team prepared data splits into proportions of 70 percent training, 15 percent validation
        and 15 percent testing that can be used for subsequent training, validation and testing,
        where the validation and test sets are balanced as well as possible for sex,
        race/ethnicity and diabetes status (no diabetes, prediabetes or lifestyle controlled, oral
        medication controlled, and insulin controlled).
      - >-
        The suggested split is included in the participants.tsv file distributed with the dataset:
        1,576 participants in training, 352 in validation and 352 in testing, for a total of 2,280.
      - >-
        Overall totals across the three splits are Hispanic 380, Asian 545, Black 519, White 836;
        male 951 and female 1,329; no diabetes 776, lifestyle controlled 560, oral medication
        controlled 686 and insulin controlled 258. Overall mean age is 60.8 years with a standard
        deviation of 11.3 years.
      - >-
        The split is described as aimed at reducing disparities in models developed using this
        dataset, and is a new recommended split introduced with version 3.0.0.

relationships:
  - id: d4d:AI_READI_relationships_instances
    name: Relationships between instances
    description: How relationships between individual instances are made explicit.
    relationship_details:
      - >-
        All instances are part of the same prospective data generation project (AI-READI). There
        is currently only one visit per participant, so instances are not linked to one another
        through repeated visits.
      - >-
        Within a participant folder, files are organized by data type, modality and device
        following the Clinical Dataset Structure (CDS) v0.1.1 specification, so all records for a
        participant are linked by the participant identifier used in the study.
      - >-
        Approximately 4 percent to 10 percent of participants recruited in years 1 and 2 are
        planned to be invited for a follow-up visit in year 4 of the project, forming a
        longitudinal arm; those follow-up data are not part of this cross-sectional release.

file_collections:
  - id: d4d:AI_READI_fc_cardiac_ecg
    name: cardiac_ecg
    title: Electrocardiography data
    description: >-
      This directory contains electrocardiogram data collected by a 12 lead protocol (the current
      standard), Holter monitor, or smartwatch. The terms ECG and EKG are often used
      interchangeably. Data in the release were collected with the Philips PageWriter TC30
      cardiograph under a 12-lead protocol.
    path: cardiac_ecg
    collection_type:
      - processed_data
    file_count: 4515
    total_bytes: 302931703
    conforms_to: WaveForm DataBase (WFDB)
  - id: d4d:AI_READI_fc_clinical_data
    name: clinical_data
    title: Clinical and survey data
    description: >-
      This directory contains clinical data collected through REDCap, including blood and urine
      lab values and survey data. Each CSV file in this directory is a one-to-one mapping to the
      OMOP Common Data Model tables. A dqd_omop.json metadata file supports OMOP CDM data quality
      analysis using the OMOP CDM Data Quality Dashboard.
    path: clinical_data
    collection_type:
      - processed_data
    file_count: 7
    total_bytes: 176182781
    conforms_to: Observational Medical Outcomes Partnership (OMOP) Common Data Model (CDM)
  - id: d4d:AI_READI_fc_environment
    name: environment
    title: Home environmental sensor data
    description: >-
      This directory contains data collected through an environmental sensor device custom built
      for the AI-READI project, the LeeLab Anura unit designed at the Karalis Johnson Retina
      Center, University of Washington. Measured variables include ambient temperature, relative
      humidity, nitrogen oxides, volatile organic compounds, particulate matter at PM1.0, PM2.5,
      PM4 and PM10, and eleven multi-spectral light intensity measurements.
    path: environment
    collection_type:
      - processed_data
    file_count: 2232
    total_bytes: 55625676514
    conforms_to: ASCII File Format Guidelines for Earth Science Data
  - id: d4d:AI_READI_fc_retinal_flio
    name: retinal_flio
    title: Fluorescence lifetime imaging ophthalmoscopy data
    description: >-
      This directory contains data collected through fluorescence lifetime imaging ophthalmoscopy
      (FLIO), an imaging modality for in vivo measurement of lifetimes of endogenous retinal
      fluorophores, acquired on the Heidelberg Engineering FLIO device. Source images were exported
      in .sdt file format and converted to DICOM for the dataset.
    path: retinal_flio
    collection_type:
      - processed_data
    file_count: 7969
    total_bytes: 1069466876718
    conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  - id: d4d:AI_READI_fc_retinal_oct
    name: retinal_oct
    title: Optical coherence tomography data
    description: >-
      This directory contains data collected using optical coherence tomography (OCT), an imaging
      method using lasers that is used for mapping subsurface structure. Devices represented are
      the Heidelberg Spectralis, Topcon Maestro2, Topcon Triton and Zeiss Cirrus. Topcon data were
      exported in .fda file format and converted to DICOM for the dataset.
    path: retinal_oct
    collection_type:
      - processed_data
    file_count: 56478
    total_bytes: 1317625293027
    conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  - id: d4d:AI_READI_fc_retinal_octa
    name: retinal_octa
    title: Optical coherence tomography angiography data
    description: >-
      This directory contains data collected using optical coherence tomography angiography
      (OCTA), a non-invasive imaging technique that generates volumetric angiography images. The
      directory is organized into en face, flow cube and segmentation modalities, each with data
      from the Heidelberg Spectralis, Topcon Maestro2, Topcon Triton and Zeiss Cirrus devices.
    path: retinal_octa
    collection_type:
      - processed_data
    file_count: 173721
    total_bytes: 1155908809724
    conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  - id: d4d:AI_READI_fc_retinal_photography
    name: retinal_photography
