  contact_person: https://orcid.org/0000-0002-7452-1648

ip_restrictions:
  id: d4d:AI_READI_ip_restrictions
  name: Intellectual property restrictions
  description: Third-party intellectual property restrictions on the data.
  restrictions:
    - >-
      The dataset creators refer all questions about third-party IP-based or other restrictions to
      the license at https://doi.org/10.5281/zenodo.17555036.
    - >-
      Under the captured version 1.0 license, title to the Data and all industrial and intellectual
      property rights therein remain solely and exclusively with the Licensor, the University of
      Washington, and its suppliers, and the Licensee shall not take any action inconsistent with
      such ownership.
    - >-
      There are no plans for the researchers involved in collecting the dataset to develop
      commercial products or file for patents; however, the dataset is publicly available with a
      commercial-friendly license and products or patents may be developed from it in future.

regulatory_restrictions:
  id: d4d:AI_READI_regulatory_restrictions
  name: Regulatory and compliance restrictions
  description: >-
    Export control, regulatory and compliance posture of the dataset. The governance committee
    contact referenced below is Aaron Y. Lee (ORCID https://orcid.org/0000-0002-7452-1648),
    responsible party and study principal investigator; requirements for the controlled access
    dataset are being developed by the AI-READI Data Access Committee, and the general contact
    address is contact@aireadi.org.
  hipaa_compliant: compliant
  confidentiality_level: restricted
  regulatory_restrictions:
    - >-
      The dataset creators refer questions about export controls and other regulatory restrictions
      to the license at https://doi.org/10.5281/zenodo.17555036.
    - >-
      Licensees must comply with all data security and privacy standards established by the US
      National Institutes of Health under its Genomic Data Sharing (GDS) Policy, per the NIH
      Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
    - >-
      Licensees agree to comply with all applicable laws, regulations and restrictions relating to
      the distribution and use of the Data and Models.
  other_compliance:
    - >-
      The public set is stripped of Protected Health Information as defined by the HIPAA Privacy
      Rule via the Safe Harbor method. FAIRhub records the dataset as having no identifiable data
      per US HIPAA present.
    - >-
      Results are returned to participants by HIPAA-compliant encrypted email, and recruitment
      mailings are handled by Adapt Inc., an SSAE16 SOC security-certified and HIPAA-compliant
      printing and fulfillment service.
    - >-
      The study is registered on ClinicalTrials.gov as NCT06002048 and is recorded as not FDA
      regulated for either drug or device, with human subject review status "Submitted, approved"
      and no data monitoring committee.
    - >-
      Study data are classified at UW data security Level 3, with all identifiable information kept
      on encrypted computers or servers or in a locked cabinet or room with restricted access at all
      sites, accessible only to authorized research personnel.
    - >-
      As an NIH-funded study, the research is automatically covered by a federal Certificate of
      Confidentiality.
  governance_committee_contact: https://orcid.org/0000-0002-7452-1648

ethical_reviews:
  - id: d4d:AI_READI_ethical_review_uw_irb
    name: University of Washington Institutional Review Board approval
    description: >-
      AI-READI was approved by the Institutional Review Board of the University of Washington,
      approval number STUDY00016228, including reliance agreements with the IRBs of the University
      of Alabama at Birmingham and the University of California, San Diego. The reviewing
      organization referenced below is the University of Washington Human Subjects Division
      Institutional Review Board (institutional ROR https://ror.org/00cvxb145); the contact person
      is Aaron Y. Lee (ORCID https://orcid.org/0000-0002-7452-1648), lead researcher on the
      University of Washington IRB application.
    reviewing_organization: https://ror.org/00cvxb145
    contact_person: https://orcid.org/0000-0002-7452-1648
    review_details:
      - >-
        The initial IRB approval at the University of Washington was received on 20 December 2022.
        The initial approval letter is published in the dataset documentation. An annual renewal
        application to the IRB about the status and progress of the study is required and is due
        within 90 days of expiration.
      - >-
        The IRB application records the study as a cross-sectional and longitudinal observational
        study with data and sample collections, designed to expand the knowledge base of a
        scientific discipline and produce results applicable to a larger population beyond the site
        of data collection.
      - >-
        Risks assessed in the IRB application and characterised as low include confidentiality
        breach, dilating eye drops (with rare serious adverse events including angle closure
        attacks, allergic reactions, increased blood pressure and arrhythmias), eye imaging
        discomfort, COVID-19 exposure, emotional stress, fatigue, blood draw complications,
        continuous glucose monitor site reactions, and fitness tracker and environmental sensor use.
      - >-
        The study is not a prisoner research study, does not enroll minors, and did not check any
        protected population boxes; pregnancy, gestational diabetes and type 1 diabetes are
        exclusionary.
      - >-
        UCSD has a health Data Oversight Committee that oversees data sharing with other
        institutions; approval is contingent upon IRB approval.
      - >-
        A Community Advisory Board of 11 persons from the three sites, including diversity in race
        and ethnicity as represented in the AI-READI sample, contributes to the development of the
        protocol and evaluates consent forms and research protocols.
      - >-
        The project includes guidance from bioethicists and considers ethical, legal and social
        implications at every stage of the project cycle.

data_protection_impacts:
  - id: d4d:AI_READI_dpia
    name: Data protection impact analysis
    description: Whether a data protection impact analysis was conducted.
    impact_details:
      - >-
        No data protection impact analysis has been conducted.
      - >-
        The dataset has not undergone any formal external audits, but has been reviewed internally
        by AI-READI team members for quality checks and to ensure that no personally identifiable
        information was accidentally included.

human_subject_research:
  id: d4d:AI_READI_human_subject_research
  name: Human subject research status
  description: >-
    The dataset relates to people and derives from prospective human subject research conducted at
    three United States clinical sites.
  involves_human_subjects: true
  irb_approval:
    - >-
      University of Washington IRB approval number STUDY00016228, initially approved 20 December
      2022, with annual renewal required within 90 days of expiration.
    - >-
      Reliance agreements with the Institutional Review Boards of the University of Alabama at
      Birmingham and the University of California, San Diego.
  ethics_review_board:
    - University of Washington Human Subjects Division Institutional Review Board
  special_populations:
    - >-
      No special or protected populations are purposefully included. Inclusion criteria are being
      able to provide consent, being 40 years of age or older, being a person with or without type 2
      diabetes, and being able to speak and read English. Exclusion criteria are pregnancy,
      gestational diabetes and type 1 diabetes; the IRB application additionally records exclusion
      of adults older than 85 years of age.
    - >-
      The project engaged with the Native Biodata Consortium to provide a co-learning opportunity
      for understanding challenges specific to American Indian and Alaska Native communities and to
      evaluate tools for addressing them, such as data usage agreements, contract negotiations,
      transparent access agreements and forms of assured return of benefit and sustainable input,
      control and monitoring of Tribal data. The project also planned a tribal consultation to
      address barriers and facilitators of participation.
  regulatory_compliance:
    - >-
      Written informed consent is provided by all participants; e-consent is obtained through the
      University of Washington ITHS REDCap installation.
    - >-
      The study is registered on ClinicalTrials.gov as NCT06002048 and recorded as an observational
      cohort study with a cross-sectional time perspective, not FDA regulated for drug or device,
      with no data monitoring committee.
    - >-
      Data collected in the United States only.

informed_consent:
  - id: d4d:AI_READI_informed_consent
    name: Informed consent process
    description: How informed consent was obtained and documented.
    consent_obtained: true
    consent_type:
      - Written informed consent
      - Electronic informed consent with verifiable electronic signature
      - Broad consent for secondary use, banking and future data sharing
    consent_documentation:
      - >-
        The approved consent form for the principal project site, the University of Washington, is
        published in the version 3.0.0 dataset documentation. The other clinical sites had IRB
        reliance and used the same consent form, with minor institution-specific language.
      - >-
        Electronic consent is obtained through the University of Washington ITHS REDCap
        installation, which has been vetted for compliance with Washington State and federal laws
        regarding electronic signatures. On signing, the signed consent form is automatically
        emailed to the subject, who may request additional copies from the study coordinator at any
        time during the study.
      - >-
        For subjects who have difficulty viewing the consent, a study team member reads the consent
        form to them; if a person is functionally illiterate, a study team member signs and notes
        the reason for the missing subject signature in the presence of an impartial witness.
    withdrawal_mechanism:
      - >-
        Participants were permitted to withdraw consent at any time and cease study participation.
        Any data that had been shared or used up to that point would stay in the dataset, which is
        clearly communicated in the consent document.
    consent_scope:
      - >-
        Consent covers all study procedures, including questionnaires, on-site testing, biospecimen
        collection, at-home device monitoring, medical record extraction, and driving and accident
        record retrieval.
      - >-
        Consent covers secondary use, banking and future sharing of information, specimens and
        contact information, including submission to a repository and sharing with other researchers
        for their own research.
      - >-
        Consent covers future contact, for example to invite participants to a follow-up study
        visit, to ask about interest in additional related studies, to obtain additional samples, or
        to invite participation in the community advisory board.
      - >-
        The consent form includes a table clarifying which information will be publicly available
        and which requires an application and approval process with privacy protection.
      - >-
        Non-English-speaking participants are not initially enrolled because translating all study
        materials was not initially feasible; all participants must be proficient enough in English
        to understand study procedure instructions.

at_risk_populations:
  id: d4d:AI_READI_at_risk_populations
  name: At-risk population inclusion
  description: >-
    Whether populations warranting additional protections are purposefully included in the study.
  at_risk_groups_included: false
  special_protections:
    - >-
      No protected populations were checked on the IRB application. Prisoners are not recruited and
      the research is not expected to have subjects who become prisoners while participating.
    - >-
      Pregnancy and gestational diabetes are exclusion criteria, so pregnant women, fetuses in
      utero and neonates are not included.
    - >-
      Participants must be able to provide consent, so adults unable to consent are not enrolled and
      no surrogate consent process applies.
    - >-
      Transportation assistance through rideshare services was offered to study participants who
      endorsed barriers to transporting themselves to study visits, and the study covers reasonable
      parking, public transit or rideshare costs; subjects may incur unreimbursed transport costs
      above 25 US dollars.
    - >-
      Devices sent home were specifically chosen with participant privacy as a primary concern: the
      environmental sensor and Garmin fitness tracker do not capture video or audio, are not
      equipped with GPS location monitoring, and are not synced with participant-owned devices.
  assent_procedures:
    - >-
      Not applicable. The research does not include minors; the minimum age for participation is 40
      years.
  guardian_consent:
    - >-
      Not applicable. Parental permission and guardian consent procedures do not apply because no
      minors and no adults unable to consent are enrolled.

participant_privacy:
  - id: d4d:AI_READI_participant_privacy
    name: Participant privacy protections
    description: Privacy and re-identification protections applied to participant data.
    anonymization_method:
      - >-
        The public set is stripped of Protected Health Information as defined by the HIPAA Privacy
        Rule via the Safe Harbor method, as well as information related to the sex and
        race/ethnicity of the participants, to prevent stigmatization of findings. Medication
        information is also removed from the public release.
      - >-
        FAIRhub records that no identifiers were collected into the released dataset, so no active
        de-identification was necessary, but that the team checked that no identifiable data per US
        HIPAA were present in the data.
      - >-
        Participant folders are named after the participant's study ID number rather than any direct
        identifier.
    reidentification_risk:
      - >-
        There is a theoretical risk of future re-identification. AI algorithms can infer individual
        patient characteristics and could facilitate individual-level identification.
    privacy_techniques:
      - >-
        To prevent re-identification attempts, the project implements a robust data dissemination
        system, a strict licence agreement and data watermarking for both public and controlled
        sets.
      - >-
        All study procedures are conducted in private rooms, and all study data and identifiable
        information are kept on encrypted servers or in locked cabinets or rooms with restricted
        access at all sites, at UW data security Level 3.
      - >-
        The license forbids attempts to identify or contact data subjects, extract or extrapolate
        identifying information, or establish a data subject's membership in a particular group.
    data_linkage:
      - >-
        Two databases exist for data distribution: a deidentified publicly available database, and a
        controlled access database containing genomic data and race/ethnicity that requires a data
        user agreement and an approval process developed by the project committee.
      - >-
        Within the project, direct identifiers used for recruitment and screening are held in the
        REDCap system and are not part of the released dataset; only principal investigators, lead
        co-investigators and supervised research staff at participating institutions can see
        identifiable data.

participant_compensation:
  - id: d4d:AI_READI_participant_compensation
    name: Participant compensation
    description: Compensation provided to study participants.
    compensation_provided: true
    compensation_type:
      - Monetary stipend for study participation
      - Reimbursement of reasonable parking, public transit or rideshare costs for the study visit
    compensation_amount:
      - >-
        200 US dollars per study visit. The healthsheet records that study subjects received a
        compensation of 200 US dollars for the study visit through the grant funding, and the IRB
        application records a 200 US dollar stipend for participation.
    compensation_rationale:
      - >-
        The stipend is provided when the final data from participants and the study devices are
        received, typically at least two weeks after the study visit, allowing for 10 days of
        home-based data collection and time for devices to be returned by mail. The payment is not
        prorated. The amount may change in future years depending on study funding, with the IRB
        notified of any change.
      - >-
        The same type and amount of compensation is given to participants asked to return in year 4
        of the study.
      - >-
        Study staff effort was supported by NIH award OT2OD032644 based on percentage of effort
        contributed, with salaries aligned to funding guidelines at each site.

maintainers:
  - id: d4d:AI_READI_maintainer
    name: AI-READI team
    role: academic_institution
    description: >-
      The AI-READI team supports and maintains the dataset. The dataset is hosted on FAIRhub
      through Microsoft Azure. The Microsoft AI for Good Lab is acknowledged for supporting the
      cloud services needed for the project.
    maintainer_details:
      - >-
        Contact information for the owner, curator or manager of the dataset is provided in the
        README file included with the dataset; general contact is available at
        https://aireadi.org/contact, and the study description names contact@aireadi.org as the
        central contact email.
      - >-
        FAIRhub is a cloud-based data management, curation and sharing platform developed for this
        project on Microsoft Azure, intended to be made available for future Data Generation
        Projects after testing with the AI-READI dataset.
      - >-
        The Data Manager at each data site is responsible for the quality control of all data before
        uploading to FAIRhub.

errata:
  - id: d4d:AI_READI_errata
    name: Errata
    description: >-
      The healthsheet question asking whether there is an erratum was left unanswered for version
      3.0.0. Changes between versions of the dataset are provided in detail in the CHANGELOG file
      included in the dataset and visible at docs.aireadi.org.

updates:
  id: d4d:AI_READI_updates
  name: Update plan
  description: >-
    The dataset will not be updated in place. Rather, new versions of the dataset will be released
    with additional instances as more study participants complete the study visit.
  frequency: Approximately annual static version releases
  update_details:
    - >-
      The dataset gets released as static versions. There are plans to release new versions of the
      dataset approximately once a year with additional data from participants who have been
      enrolled since the last dataset version release.
    - >-
      Enrollment is ongoing, and future versions of the dataset will be released that include larger
      numbers of subjects as enrollment increases.
    - >-
      Deidentified data are released approximately yearly in two data sets: a controlled access set
      and a publicly accessible set with fewer requirements for access.
    - >-
      Changes between the current version of the dataset and the previous one are provided in detail
      in the CHANGELOG file included in the dataset, also visible at docs.aireadi.org.

retention_limit:
  id: d4d:AI_READI_retention
  name: Retention limits
  description: Limits on retention of the data associated with instances.
  retention_period: No limit
  retention_details:
    - >-
      There are no limits on the retention of the data associated with the instances. Participants
      were not told that their data would be retained for a fixed period and then deleted.
    - >-
      The IRB application confirms that identifiers, links between identifiers and data or
      specimens, and data that are part of the research records will not be destroyed until after
      the end of the applicable records retention requirements under Washington State law, funding
      agency or sponsor rules, and Food and Drug Administration rules.
    - >-
      The raw data are saved and expected to be preserved by the AI-READI project at least for the
      duration of the project.

version_access:
  id: d4d:AI_READI_version_access
  name: Version access
  description: Availability of current and previous dataset versions.
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  versions_available:
    - Version 3.0.0, DOI 10.60775/fairhub.3, 17 November 2025, 2,280 participants, current version.
    - Version 2.0.0, DOI 10.60775/fairhub.2, 8 November 2024, 1,067 participants.
    - Version 1.0.0, DOI 10.60775/fairhub.1, 3 May 2024, 204 participants.
  version_details:
    - >-
      The dataset will not be updated; rather, new versions of the dataset will be released with
      additional instances as more study participants are enrolled. The healthsheet answers the
      question about continued support for older versions as not applicable for this reason.
    - >-
      The FAIRhub record for version 2.0.0 states that this version of the dataset is no longer
      accessible and directs users to the latest version. The version 2.0.0 record reported 2.01 TB
      across 165,051 files.
    - >-
      One version of the documentation is associated with each version of the dataset, selectable
      from a dropdown on https://docs.aireadi.org; the documentation site defaults to Dataset
      v3.0.0.
    - >-
      Previous datasheets exist for earlier versions: for version 1.0.0 at
      https://docs.aireadi.org/docs/1/dataset/healthsheet and for version 2.0.0 at
      https://docs.aireadi.org/docs/2/dataset/healthsheet.
    - >-
      The FAIRhub version 3.0.0 record notes that a smaller version of the dataset is available for
      pipeline development; the version 3.0.0 documentation likewise describes a mini-subset version
      of the dataset. That mini version is a separate FAIRhub record and is not a version of this
      dataset.
    - >-
      Version-to-version participant counts reported by the project are 204 for the v1.0.0 pilot,
      an additional 863 in year 2 data and an additional 1,213 in year 3 data, giving 1,067 for
      version 2.0.0 and 2,280 for version 3.0.0. Each version covers 15 or more data types, with
      one additional imaging device added in year 2 and three additional imaging devices added in
      year 3.

extension_mechanism:
  id: d4d:AI_READI_extension
  name: Extension and contribution mechanism
  description: >-
    Currently there is no mechanism for others to extend or augment the AI-READI dataset outside of
    those who are involved in the project.
  extension_details:
    - >-
      The dataset creators answered that there is no mechanism for others to extend, augment, build
      on or contribute to the dataset outside the project team.
    - >-
      The project publishes its software, standards and guidelines openly through the AI-READI
      GitHub organization at https://github.com/AI-READI and the Zenodo community at
      https://zenodo.org/communities/aireadi, and is developing the Clinical Dataset Structure
      specification at https://cds-specification.readthedocs.io, working with standard maintainers
      to extend existing standards where necessary.

is_deidentified:
  id: d4d:AI_READI_deidentification
  name: De-identification status
  description: De-identification approach applied to the released dataset.
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor removal of protected health information from the publicly accessible set,
    combined with a collection design in which direct identifiers are not carried into the released
    dataset. FAIRhub records the de-identification type as "NoDeIdentification" with the explanation
    that no identifiers were collected so no active de-identification was necessary, but that the
    team checked that no identifiable data per US HIPAA were present in the data.
  identifiers_removed:
    - Protected health information as defined by the HIPAA Privacy Rule (Safe Harbor method)
    - Participant sex
    - Participant race and ethnicity
    - Medications used
  deidentification_details:
    - >-
      The data in this dataset contain no protected health information. Information related to the
      sex and race/ethnicity of the participants as well as medication used has also been removed.
    - >-
      Data held under controlled access, and therefore not present in the public release, include
      5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records,
      medications, and traffic and accident reports.
    - >-
      The healthsheet composition question asking whether measures were taken to avoid
      re-identification of individuals after de-identification was left unanswered for version
      3.0.0, as was the preprocessing question about de-identification pre-processing.
    - >-
      Participant folders in the distributed dataset are named after the participant's study ID
      number.

variables:
  - id: d4d:AI_READI_var_hba1c
    variable_name: HbA1c
    name: Haemoglobin A1c
    description: >-
      Glycated haemoglobin measured on whole blood at the University of Washington Nutrition and
      Obesity Research Center, reported in percent. The reference range provided by the testing
      laboratory is 4.0 to 6.0 percent.
    data_type: float
    measurement_technique: Whole blood assay at the UW Nutrition and Obesity Research Center
    quality_notes:
      - Included as a marker for diabetes.
  - id: d4d:AI_READI_var_glucose
    variable_name: glucose
    name: Serum glucose
    description: >-
      Serum glucose reported in mg/dL, with a laboratory reference range of 62 to 125 mg/dL.
    data_type: float
    measurement_technique: Serum assay at the UW Nutrition and Obesity Research Center
    quality_notes:
      - Included as a marker for diabetes.
      - Participants are not required to fast, so glucose values are non-fasting measurements.
  - id: d4d:AI_READI_var_cgm_glucose
    variable_name: cgm_blood_glucose
    name: Continuous glucose monitor blood glucose
    description: >-
      Blood glucose measurements in mg/dL recorded every 5 minutes by a Dexcom G6 continuous
      glucose monitor worn for a 10-day at-home monitoring period. Participants are masked to the
      results during the monitoring period.
    data_type: float
    measurement_technique: Dexcom G6 real-time integrated continuous glucose monitoring system
    quality_notes:
      - Released in the Open mHealth standard within the wearable_blood_glucose directory.
      - >-
        Participants already wearing a Dexcom G6 may optionally contribute up to 90 days of prior
        glucose values, giving up to 100 days total.
  - id: d4d:AI_READI_var_c_peptide
    variable_name: c_peptide
    name: C peptide
    description: >-
      EDTA plasma C peptide reported in ng/mL, with a laboratory reference range of 1.1 to 4.4
      ng/mL.
    data_type: float
    measurement_technique: EDTA plasma assay at the UW Nutrition and Obesity Research Center
    quality_notes:
      - Included as an indicator of insulin production.
  - id: d4d:AI_READI_var_insulin
    variable_name: insulin
    name: Insulin
    description: >-
      EDTA plasma insulin reported in ng/mL, with a laboratory reference range of 0.0 to 24.9
      ng/mL.
    data_type: float
    measurement_technique: EDTA plasma assay at the UW Nutrition and Obesity Research Center
    quality_notes:
      - Included as a marker for diabetes.
  - id: d4d:AI_READI_var_nt_probnp
    variable_name: nt_probnp
    name: N-terminal pro-B-type natriuretic peptide
    description: >-
      EDTA plasma NT-proBNP reported in pg/mL. The laboratory reference range varies by age.
    data_type: float
    measurement_technique: EDTA plasma assay at the UW Nutrition and Obesity Research Center
    quality_notes:
      - Included as a severity and outcome predictor of heart failure.
  - id: d4d:AI_READI_var_troponin_t
    variable_name: troponin_t
    name: Troponin-T
    description: >-
      EDTA plasma troponin-T reported in ng/L, with laboratory reference ranges of less than 11 for
      females and less than 16 for males.
    data_type: float
    measurement_technique: EDTA plasma assay at the UW Nutrition and Obesity Research Center
    quality_notes:
      - Included as a marker of myocardial injury.
  - id: d4d:AI_READI_var_crp_hs
    variable_name: crp_high_sensitivity
    name: C reactive protein, high sensitivity
    description: >-
      Serum high-sensitivity C reactive protein reported in mg/L, with a laboratory reference range
      of 0.0 to 10.0 mg/L.
    data_type: float
    measurement_technique: Serum assay at the UW Nutrition and Obesity Research Center
    quality_notes:
      - Included as an inflammation marker and risk factor for T2DM.
  - id: d4d:AI_READI_var_creatinine
    variable_name: creatinine
    name: Serum creatinine
    description: >-
      Serum creatinine reported in mg/dL, with laboratory reference ranges of 0.38 to 1.02 for
      females and 0.51 to 1.18 for males.
    data_type: float
    measurement_technique: Serum assay at the UW Nutrition and Obesity Research Center
    quality_notes:
      - Included as a marker for kidney function.
  - id: d4d:AI_READI_var_urine_albumin
    variable_name: urine_albumin
    name: Urine albumin
    description: Urine albumin reported in mg/dL; no laboratory reference range is provided.
    data_type: float
    measurement_technique: Urine assay at the UW Nutrition and Obesity Research Center
    quality_notes:
      - Included as a urinary biomarker for early diabetic nephropathy.
  - id: d4d:AI_READI_var_visual_acuity_logmar
    variable_name: visual_acuity_logmar
    name: Best-corrected visual acuity (logMAR)
    description: >-
      Letter visual acuity measured separately for the right and left eyes under photopic (daylight)
      and mesopic (dim light) conditions with the M&S Technologies Electronic Visual Acuity tester,
      expressed as the logarithm of the minimum angle of resolution under best-corrected conditions.
      Lower numbers indicate better resolution. Mesopic acuity is measured through a 2.0 neutral
      density filter.
    data_type: float
    measurement_technique: M&S Technologies Electronic Visual Acuity tester at 4 metres
    derivation: >-
      Logarithm of the minimum angle of resolution derived from the letter chart response under
      best-corrected conditions.
    quality_notes:
      - >-
        The Snellen visual acuity variables were dropped in version 3.0.0, so only logMAR visual
        acuity measurements are available in this release.
  - id: d4d:AI_READI_var_contrast_sensitivity
    variable_name: letter_contrast_sensitivity
    name: Letter contrast sensitivity (log CS)
    description: >-
      Letter contrast sensitivity measured monocularly with the Mars Letter Contrast Sensitivity
      chart under photopic and mesopic conditions, expressed as log sensitivity, where higher
      numbers mean better sensitivity. All testing is carried out under undilated conditions.
    data_type: float
    measurement_technique: Mars Letter Contrast Sensitivity chart (Mars Perceptrix)
    derivation: >-
      The log contrast sensitivity value is recorded by multiplying the number of errors prior to
      the final correct letter by 0.04 and subtracting the result from the log CS value at the final
      correct letter. If a patient reaches the end of the chart without making two consecutive
      errors, the final correct letter is the last one correctly identified.
    quality_notes:
      - >-
        Testing is terminated either when the patient makes two consecutive errors or reaches the
        end of the chart. The standardized order of Mars cards is photopic right eye, photopic left
        eye, mesopic right eye, mesopic left eye.
  - id: d4d:AI_READI_var_moca_total
    variable_name: moca_total_score
    name: Montreal Cognitive Assessment total score
    description: >-
      Total score from the Montreal Cognitive Assessment administered electronically on an iPad
      using the MoCA Duo application. The total possible score is 30, with higher numbers
      representing better performance; a final total score of 26 and above is considered normal and
      anything below 24 is a sign of cognitive impairment. Section subscores, a Memory Index Score
      and task completion times are also recorded.
    data_type: integer
    measurement_technique: MoCA Duo iPad application (MoCA Cognition, Quebec, Canada)
    quality_notes:
      - >-
        Professionals require training to score the test; a person's level of education and
        socioeconomic factors may affect the test; and people living with depression or other mental
        health issues may score similarly to those with mild dementia.
  - id: d4d:AI_READI_var_monofilament
    variable_name: monofilament_response
    name: Monofilament peripheral neuropathy response
    description: >-
      Yes or no response to application of a 10 g monofilament at three locations on each foot, ten
      times per location, with the participant's eyes closed and shoes and socks removed.
      Participants who do not sense the monofilament after it bends are considered insensate.
    data_type: boolean
    measurement_technique: Standard 10 g monofilament test on the plantar surface of the feet
    quality_notes:
      - >-
        Insensate areas are retested for confirmation, and the sequence is repeated randomly at each
        testing site on each foot until results are obtained. Results are recorded on an iPad,
        laptop or paper questionnaire and entered directly into the project REDCap by clinical
        research staff.
  - id: d4d:AI_READI_var_environment_pm
    variable_name: particulate_matter
    name: Indoor particulate matter concentrations
    description: >-
      Particulate matter concentrations at PM1.0, PM2.5, PM4 and PM10 measured by the custom
      environmental sensor placed in the participant's home for 10 days, alongside ambient
      temperature, relative humidity, nitrogen oxides (NO and NO2), volatile organic compounds and
      eleven multi-spectral light intensity measurements.
    data_type: float
    measurement_technique: >-
      Custom-designed LeeLab Anura environmental sensor unit, Karalis Johnson Retina Center,
      University of Washington
    quality_notes:
      - >-
        The sensor does not capture video or audio, is not equipped with GPS location monitoring,
        and is not synced with participant-owned devices.

