id: https://doi.org/10.60775/fairhub.3
name: AI-READI Flagship Dataset of Type 2 Diabetes, version 3.0.0
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship multimodal dataset generated by the Artificial Intelligence
  Ready and Equitable/Exploratory Atlas for Diabetes Insights (AI-READI) project, one of four
  Data Generation Projects funded by the NIH Common Fund Bridge2AI program. The dataset contains
  data from 2,280 participants collected between 19 July 2023 and 1 May 2025 at three United
  States study sites (University of Alabama at Birmingham, University of California San Diego,
  and University of Washington) under a cross-sectional protocol whose target enrollment is
  4,000 adults aged 40 and older, triple-balanced by self-reported race/ethnicity (Asian, Black,
  Hispanic, White), type 2 diabetes mellitus status and severity (no diabetes;
  pre-diabetes/lifestyle-controlled; controlled by oral or non-insulin injectable medications;
  insulin-controlled), and biological sex. Each participant completes pre-visit questionnaires,
  a single 2.5-4 hour on-site visit, and a 10-day at-home monitoring period. Modalities include
  survey and clinical data mapped to the OMOP Common Data Model, blood and urine laboratory
  results, physical measurements and vitals, visual acuity and contrast sensitivity, monofilament
  peripheral neuropathy testing, Montreal Cognitive Assessment scores, 12-lead electrocardiography
  in WFDB format, retinal photography, optical coherence tomography (OCT), OCT angiography (OCTA)
  and fluorescence lifetime imaging ophthalmoscopy (FLIO) in DICOM format, continuous glucose
  monitoring and wearable activity monitoring in Open mHealth format, and indoor environmental
  sensor measurements. The release comprises 356,343 files totalling approximately 3.82 TB,
  organized following the Clinical Dataset Structure (CDS) v0.1.1 specification. The scientific
  goal is to enable artificial intelligence and machine learning research into salutogenesis, the
  pathway from type 2 diabetes mellitus back to health. The dataset is distributed through the
  FAIRhub platform under DOI 10.60775/fairhub.3 and contains no protected health information;
  information on participant sex, race/ethnicity, and medications used has been removed from the
  publicly distributed version.
