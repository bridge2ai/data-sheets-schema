id: https://chorus4ai.org/
name: CHoRUS_for_Equitable_AI_Dataset
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
description: >-
  CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards) for
  Equitable AI is one of four data generation projects in the NIH Common Fund
  Bridge2AI consortium. It assembles a multi-center, multi-modal, high-resolution,
  controlled-access dataset describing acute and critical care, intended to support
  machine learning and artificial intelligence that characterizes acute and critical
  illness, predicts complications, and measures treatment response. Data are
  collected retrospectively from contributing hospitals and standardized primarily
  to the OHDSI/OMOP Common Data Model, with additional modality-specific standards
  (OHNLP for tokenized clinical notes, DICOM for imaging, WFDB for waveform
  telemetry, EDF+ and Persyst for EEG). The project website describes an anticipated
  final dataset of 100,000 patient admissions covering 9 data modalities from 14
  data-contributing hospitals, assembled by 60+ consortium members across 20
  institutions, and a current released dataset of 50,000 patient admissions from
  ICU, PICU, and NICU settings comprising 1.6 billion rows of EHR OMOP data, 7,642
  admissions with radiology data, and 23 Tb of waveform data. A separate holdout
  test set is provisioned for external validation of models. The NIH RePORTER
  abstract describes the target population as more than 100,000 critically ill
  patients and organizes the work in three pillars: Data (standards, tool
  development and optimization, data acquisition), Ethics (ethical and trustworthy
  AI), and People (team science, skill and workforce development).
page: https://chorus4ai.org/
status: >-
  Partially released and under active assembly. As of August 2025 the assembled
  dataset covered 14 different hospitals with over 45,000 unique admissions; OMOP
  and telemetry data resided in the cloud enclave, clinical notes were stored
  locally with only tokens transferred, approximately 1,000 imaging studies were
  available with de-identification in process for a larger cohort, and EEG
  extraction was in process. The project website carries the notice "This repoitory
  is under review for potential modification in compliance with Administration
  directives."
conforms_to: >-
  OHDSI/OMOP Common Data Model for structured electronic health record data;
  OHNLP for extracted and tokenized clinical notes; DICOM for imaging; WFDB
  (PhysioNet schema, extended) for waveform telemetry; EDF+ and Persyst for EEG
  waveforms.
keywords:
  - critical care
  - acute care
  - critical illness
  - intensive care unit
  - electronic health record
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - artificial intelligence
  - machine learning
  - Bridge2AI
  - data standards
  - data acquisition
  - ethics
  - trustworthiness
  - workforce development
  - treatment response
  - multimodality

external_resources:
  - id: d4d:CHORUS-external-resources
    name: External resources and dependencies
    description: >-
      The dataset is not self-contained. It is hosted in and accessed through a
      controlled-access cloud enclave, and it depends on external data standards and
      open-source tooling maintained inside and outside the project.
    external_resources:
      - >-
        Bridge2AI AI/ML for Clinical Care Collaborative Cloud enclave, which hosts
        OMOP and telemetry data and is where analysis is performed.
      - >-
        Azure cloud services, targeted by the CHoRUS containerized applications
        (chorus-container-apps repository).
      - >-
        OHDSI/OMOP Common Data Model and the OHDSI tool stack, used for structured
        clinical data.
      - >-
        OHNLP toolkit, used to extract and tokenize clinical notes.
      - >-
        DeGauss, used by the UF-Geocoding tool to geocode OMOP Location entities.
      - >-
        The chorus-ai GitHub organization (https://github.com/chorus-ai), which
        houses software and tooling, validated semantic mappings, standard operating
        procedures, and project management overviews.
    restrictions:
      - >-
        Access to the enclave requires registration, a signed licensing agreement,
        and a ".edu" email address.
      - >-
        Clinical notes remain stored locally at contributing sites; only tokens are
        transferred into the enclave.

file_collections:
  - id: d4d:CHORUS-fc-demographics
    name: Demographics
    description: >-
      Patient demographic data standardized to the OMOP Common Data Model. Access is
      controlled.
    collection_type:
      - processed_data
    conforms_to: OMOP Common Data Model
    conforms_to_schema: OMOP schema
  - id: d4d:CHORUS-fc-medication-administration
    name: Medication administration
    description: >-
      Medication administration records, with dosing time-stamped upon each infusion
      change or dose administration, standardized to the OMOP Common Data Model.
      Access is controlled.
    collection_type:
      - processed_data
    conforms_to: OMOP Common Data Model
    conforms_to_schema: OMOP schema
  - id: d4d:CHORUS-fc-procedures
    name: Procedures
    description: >-
      Procedure records documented by providers, standardized to the OMOP Common
      Data Model. Access is controlled.
    collection_type:
      - processed_data
    conforms_to: OMOP Common Data Model
    conforms_to_schema: OMOP schema
  - id: d4d:CHORUS-fc-nursing-flowsheets
    name: Nursing flowsheets
    description: >-
      High-frequency nursing flowsheet documentation standardized to the OMOP Common
      Data Model. Access is controlled. The source table records that one of the
      OMOP-standardized modalities publishes an OMOP schema with extensions, but the
      source's tabular layout does not preserve which row that annotation applies to.
    collection_type:
      - processed_data
    conforms_to: OMOP Common Data Model
    conforms_to_schema: OMOP schema
  - id: d4d:CHORUS-fc-diagnoses
    name: Diagnoses
    description: >-
      Diagnosis records documented by providers, standardized to the OMOP Common
      Data Model. Access is controlled.
    collection_type:
      - processed_data
    conforms_to: OMOP Common Data Model
    conforms_to_schema: OMOP schema
  - id: d4d:CHORUS-fc-clinical-notes
    name: Clinical notes
    description: >-
      Unstructured clinical notes extracted and tokenized using the OHNLP toolkit.
      Access is controlled and metadata was listed as planned rather than available.
      The notes themselves are stored locally at contributing sites; only tokens are
      transferred to the enclave.
    collection_type:
      - processed_data
    conforms_to: OHNLP
    conforms_to_schema: OHNLP open source schema
  - id: d4d:CHORUS-fc-imaging
    name: Imaging
    description: >-
      Imaging studies drawn from hospital PACS systems in DICOM format. Access is
      controlled and metadata was listed as planned rather than available. As of the
      September 2025 informational webinar, approximately 1,000 images were
      available, with de-identification in process for a larger cohort. The project
      website reports 7,642 admissions with radiology data in the current released
      dataset.
    collection_type:
      - processed_data
    conforms_to: DICOM
    conforms_to_schema: DICOM schema
  - id: d4d:CHORUS-fc-waveform-telemetry
    name: Waveform telemetry
    description: >-
      Physiological waveform telemetry captured from bedside monitors via
      gateway/middleware, in WFDB format. Access is controlled. The project website
      reports 23 Tb of waveform data in the current released dataset; the source does
      not disambiguate the unit further, so no byte count is asserted here.
    collection_type:
      - processed_data
    conforms_to: WFDB
    conforms_to_schema: PhysioNet schema, extended
  - id: d4d:CHORUS-fc-waveform-eeg
    name: Waveform EEG
    description: >-
      Electroencephalography waveforms sourced from hospital EEG databases, in EDF+
      and Persyst formats. Access is controlled and metadata was listed as planned
      rather than available. As of the September 2025 informational webinar, EEG
      extraction was in process.
    collection_type:
      - processed_data
    conforms_to: EDF+ and Persyst
    conforms_to_schema: Open source EDF+ and Persyst schema

purposes:
  - id: d4d:CHORUS-purpose-ai-ready-critical-care-data
    name: Generate a publicly available, AI-ready critical care dataset
    description: Primary purpose stated by the funded project.
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence
      and machine learning in critical care, and developing high-resolution
      multi-center data sets is a critical first step towards actionable and
      trustworthy AI. The project's overarching goal is to develop a publicly
      available, AI-ready critical care dataset while ensuring the methods promote
      privacy, accountability, and clinical benefit, and while promoting a new
      generation of AI clinicians and scientists.
  - id: d4d:CHORUS-purpose-diverse-ethically-sourced-data
    name: Build the most diverse, high-resolution, ethically sourced AI-ready dataset
    description: Goal statement of the CHoRUS Network.
    response: >-
      The goal of the CHoRUS Network is to develop the most diverse,
      high-resolution, ethically sourced, AI-ready data set to answer the grand
      challenge of improving recovery from acute illness.
  - id: d4d:CHORUS-purpose-external-validation
    name: Support external validation and marketplace adoption of clinical AI models
    description: Purpose of the provisioned holdout test set.
    response: >-
      The dataset will also provision a holdout test set, accessible for model
      external validation to aid marketplace adoption of AI-developed models for
      implementation in acute and critical care.
  - id: d4d:CHORUS-purpose-workforce-and-education
    name: Support AI training and workforce development
    description: >-
      Purpose associated with the project's People pillar and with the
      AIM-AHEAD Bridge2AI for Clinical Care Training Program.
    response: >-
      The project cultivates expertise in the lay and scientific community to improve
      AI literacy and utilization through multimodal educational approaches, and is
      dedicated to training engineers, data scientists, and clinicians. The
      AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to
      Bridge2AI CHoRUS data through engagement, AI training, and mentorship.

tasks:
  - id: d4d:CHORUS-task-characterize-critical-illness
    name: Characterize acute and critical care illness
    response: >-
      The CHoRUS data generation project will meet the need of generating data for
      ML/AI applications aimed at characterizing acute and critical care illness
      among patients with acute or critical illness.
  - id: d4d:CHORUS-task-predict-complications
    name: Predict complications
    response: >-
      Generating data for ML/AI applications aimed at predicting complications among
      patients with acute or critical illness. A visualization and annotation
      environment will label data with targets important for prediction.
  - id: d4d:CHORUS-task-measure-treatment-response
    name: Measure treatment response
    response: >-
      Generating data for ML/AI applications aimed at measuring treatment response
      among patients with acute or critical illness.
  - id: d4d:CHORUS-task-improve-recovery-from-acute-illness
    name: Improve recovery from acute illness
    response: >-
      The dataset is intended to answer the grand challenge of improving recovery
      from acute illness, and to build ML- and AI-derived models to improve the care
      and outcomes of patients requiring critical care.

addressing_gaps:
  - id: d4d:CHORUS-gap-critical-care-ai-infrastructure
    name: Lack of infrastructure for AI/ML in critical care
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence
      and machine learning in critical care. Developing high-resolution multi-center
      data sets is a critical first step towards actionable and trustworthy AI.
  - id: d4d:CHORUS-gap-multicenter-multimodal-scale
    name: Absence of a multi-center, multi-modal, high-resolution critical care dataset
    response: >-
      The project addresses multiple challenges relevant for acquiring an AI-ready
      data set from more than 100,000 critically ill patients, including developing
      capabilities across a multi-center network to acquire, standardize, tokenize,
      store, visualize, and label structured electronic health record data, tokenized
      unstructured electronic health record data, telemetry and EEG waveforms,
      imaging, and social determinants of health.
  - id: d4d:CHORUS-gap-legal-and-ethical-framework
    name: Missing legal and ethical framework for collecting clinical data at scale
    response: >-
      The project will establish a legal framework for collecting data at scale,
      perform community-facing ethics focus groups to determine what data is
      appropriate for public sharing, and determine ethical and legal approaches to
      manage privacy and bias while accounting for social determinants of health.
  - id: d4d:CHORUS-gap-external-validation-holdout
    name: No shared holdout data for external validation of clinical AI models
    response: >-
      The dataset provisions a holdout test set accessible for model external
      validation, to aid marketplace adoption of AI-developed models for
      implementation in acute and critical care.

