description: >-
  This dataset is the June 2026 Data Release of Cell Maps for Artificial Intelligence (CM4AI;
  CM4AI.org), the Functional Genomics Grand Challenge in the NIH Bridge2AI program. CM4AI is
  generating multi-modal data including protein-protein interaction (PPI), spatial localization,
  and genetic perturbation data in MDA-MB-468 breast cancer cells (+/- paclitaxel or vorinostat)
  and iPSCs (+/- differentiation). This Beta release includes: perturb-seq data for MDA-MB-468
  breast cancer cells +/- treatment and undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data
  for MDA-MB-468 breast cancer cells +/- treatment, undifferentiated KOLF2.1J iPSCs, and
  iPSC-derived neuron progenitor cells (NPCs), neurons, and cardiomyocytes; AP-MS data for
  MDA-MB-468 breast cancer cells + treatment; and IF images in MDA-MB-468 breast cancer cells
  +/- treatment. The release is deposited in the University of Virginia Dataverse (LibraData)
  under the "Cell Maps for Artificial Intelligence" collection, School of Medicine. As stated for
  the CM4AI release series, CM4AI output data are packaged with provenance graphs and rich
  metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework. CM4AI is a
  collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser
  University, and the Hastings Center. Dataverse displays the notice "This collection is under
  review for potential modification in compliance with Administration directives."

