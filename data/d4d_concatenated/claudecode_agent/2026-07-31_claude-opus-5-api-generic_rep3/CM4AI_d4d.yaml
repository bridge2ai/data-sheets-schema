purposes:
  - description: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-Ready data produced
      from multimodal interrogation of chromatin modifiers, metabolic enzymes, and other proteins
      involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines
      under treated and untreated conditions, using mass spectrometry-based proteomics, spatial
      proteomics / cell imaging, and genetic perturbations via CRISPR/Cas9.
  - description: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the grand
      challenge of interpretable genotype-phenotype learning (NIH RePORTER project abstract).
  - description: >-
      To broadly stimulate research and development in "visible" machine learning systems informed
      by multi-scale cell and tissue architecture, rather than black-box models.
  - description: >-
      To ethically leverage state-of-the-art computational and experimental tools in biomedical
      science to enable a new generation of transformative artificial intelligence research to
      benefit humanity, with datasets and software available to the research community under
      minimally restrictive terms consistent with ethical guidelines, researcher attribution, and
      research integrity.
  - description: >-
      To implement and demonstrate a standards data management approach based on FAIR access and
      software principles, with deep provenance and replication packages for representation of cell
      maps and their underlying datasets.
  - description: >-
      To provide quarterly releases of map-input data streams alongside the eventual cell maps, so
      that the community can use the underlying multimodal measurements directly.

addressing_gaps:
  - description: >-
      In genomics and precision medicine, machine learning models are often "black boxes",
      predicting phenotypes from genotypes without understanding the mechanisms by which such
      translation occurs. CM4AI addresses this deficiency by generating matched data and tools that
      enable creation of "visible" ML systems built directly on knowledge maps of cell and tissue
      architecture.
  - description: >-
      To recruit and prepare a biomedical workforce adept at both the data and life sciences, new
      training that allows researchers to leverage the datasets produced by Bridge2AI and other
      programs is needed; CM4AI addresses this through its Skills and Workforce Development module.
  - description: >-
      Cell mapping technologies have typically been applied separately; integration of multiple
      complementary data modalities is required to incorporate biological structure robustly across
      physical scales. Reported in the associated Nature publication (Schaffer et al. 2025) for the
      U2OS cell map, which is a related resource distinct from the cell lines released here.
  - description: >-
      Much of cell structure still remains uncharted, motivating systematic strategies to map
      subcellular architecture across scales (associated Nature publication).
  - description: >-
      A need for ethical, FAIR, provenanced, AI-Ready biomedical datasets: datasets that are FAIR,
      provenanced, characterized, explainable and ethical, with schemas, validation procedures,
      datasheets, and model cards resolvable from the dataset's metadata.

tasks:
  - description: >-
      Construction of hierarchical maps of cell architecture (cell maps) as directed acyclic graphs
      in which each node represents an assembly of proteins in proximity at a given scale, spanning
      from large assemblies representing cell compartments (e.g. nucleus, mitochondria) to small
      assemblies of proteins in close proximity (e.g. protein complexes or subunits).
  - description: >-
      Protein-protein interaction mapping via affinity purification-mass spectrometry (AP-MS) and
      size-exclusion chromatography-mass spectrometry (SEC-MS).
  - description: >-
      Spatial proteomics: mapping protein subcellular localization and distribution within human
      cells via immunofluorescence staining and high-resolution confocal microscopy.
  - description: >-
      Single-cell CRISPRi genetic perturbation screening (perturb-seq) to map transcriptional and
      fitness phenotypes associated with targeted genes.
  - description: >-
      Interpretable genotype-phenotype learning, including "visible machine learning" or "visible
      neural networks" (VNNs) that interrogate how protein assemblies in the cell affect cell-level
      phenotype predictions.
  - description: >-
      Analysis of cell architectural changes and interactions in the presence of specific disease
      processes, treatment conditions, or genetic perturbations.
  - description: >-
      Integrative structure modeling of protein communities, ranked by the amount of available
      structural information from the Protein Data Bank, AlphaFold Protein Structure Database,
      crosslinking mass spectrometry, and prediction of disordered sequence segments.

acquisition_methods:
  - description: >-
      Directly measured experimental data generated in cell culture by the CM4AI consortium
      laboratories; no data were acquired from human individuals. The release declares
      "Human Subjects: No" and "De-identified Samples: Yes".
  - description: >-
      Affinity purification-mass spectrometry (AP-MS) on endogenously tagged cell lines, used to map
      protein-protein interactions of chromatin regulators under different conditions.
  - description: >-
      Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide
      complex/interaction mapping, applied as an orthogonal mass spectrometry-based approach to
      AP-MS.
  - description: >-
      Immunofluorescence-based staining (ICC-IF) followed by confocal microscopy for spatial
      proteomics, performed in the Lundberg Lab at Stanford University using the Human Protein Atlas
      resource of antibodies, with automated fixation and permeabilization protocols on a pipetting
      robot for MDA-MB-468 and KOLF2 cell lines.
  - description: >-
      Single-cell CRISPR (CRISPRi) perturbation screens using a CRISPR lentiviral library and the
      10x Genomics 3'HT kit, in cell lines expressing inducible dCas9.

collection_mechanisms:
  - description: >-
      Mass spectrometry instrumentation for AP-MS and SEC-MS protein-protein interaction profiling
      (CM4AI Data Acquisition module, Krogan laboratory, University of California San Francisco).
  - description: >-
      Confocal microscopy with immunofluorescence antibody staining; each image comprises channels
      for the protein of interest plus reference markers. In the released MDA-MB-468 image sets,
      nuclei were stained with DAPI (blue channel), endoplasmic reticulum with a calreticulin
      antibody (yellow channel), microtubules with tubulin antibody (red channel), and the protein
      of interest with a specific antibody (green channel).
  - description: >-
      CRISPR lentiviral library targeting chromatin factors with 6 guide RNAs per gene, delivered to
      MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9; single-cell readout on the 10x
      Genomics 3'HT platform.
  - description: >-
      Robotic pipetting for automated fixation and permeabilization protocols established for the
      MDA-MB-468 and KOLF2 cell lines.
  - description: >-
      Reported for the related U2OS cell map in the associated Nature publication and not asserted
      of this release: AP-MS on a Thermo Fisher Q-Exactive HFX with data-dependent acquisition;
      SEC on a 300 x 7.8 mm BioSep-4000 column (Phenomenex) with an Agilent 1290 Series
      semi-preparative HPLC, 40 fractions; DIA-PASEF acquisition on a Bruker TimsTOF Pro2 with
      CaptiveSpray source coupled to a nanoElute UHPLC; immunofluorescence imaging on a Leica SP5
      confocal microscope with a x63 HCX PL APO 1.40 oil CS objective.

