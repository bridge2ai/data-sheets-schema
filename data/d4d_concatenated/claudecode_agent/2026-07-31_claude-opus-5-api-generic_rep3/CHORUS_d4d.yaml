id: https://chorus4ai.org/dataset
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution, controlled-access critical care dataset
  produced by the Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for
  Equitable AI data generation project, one of four data generation projects in the NIH Common Fund
  Bridge2AI consortium. The dataset is assembled through retrospective data collection from
  contributing hospitals and is intended to support machine learning and artificial intelligence
  applications that characterize acute and critical care illness, predict complications, and measure
  treatment response. The CHoRUS Network spans 20 academic centers, of which 14 will contribute as
  Data Acquisition centers; the project website reports 60+ consortium members across 20 institutions.
  The anticipated final dataset is described as 100,000 patient admissions across 9 different data
  modalities from 14 data contributing hospitals. The currently released dataset is described on the
  project website as 50,000 patient admissions from ICU, PICU, and NICU, 1.6 billion rows of EHR OMOP
  data, 7,642 admissions with radiology data, and 23 Tb of waveform data. A September 2025
  informational webinar reported that, as of August 2025, the dataset covered 14 different hospitals
  with over 45,000 unique admissions. Data modalities include structured EHR data standardized to the
  OMOP Common Data Model (demographics, medication administration, procedures, nursing flowsheets,
  diagnoses), clinical notes extracted and tokenized with the OHNLP toolkit, imaging from PACS in
  DICOM, bedside monitor/telemetry waveforms in WFDB, and EEG waveforms in EDF+ and Persyst formats.
  The project also plans to provision a holdout test set accessible for external validation of models.
keywords:
  - CHoRUS
  - Bridge2AI
  - critical care
  - acute illness
  - intensive care unit
  - electronic health record
  - OMOP Common Data Model
  - OHDSI
  - clinical notes
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - DICOM
  - WFDB
  - EDF+
  - social determinants of health
  - artificial intelligence
  - machine learning
  - multimodal data
  - controlled access
  - AI-ready dataset
page: https://chorus4ai.org/
created_by: CHoRUS Consortium (Patient-Focused Collaborative Hospital Repository Uniting Standards for Equitable AI)
status: >-
  Partially released and actively under construction. The project website carries the notice "This
  repoitory is under review for potential modification in compliance with Administration directives."
  A current released dataset is described alongside a larger anticipated final dataset; imaging
  de-identification and EEG extraction were reported as in process as of the September 2025 webinar.
conforms_to: >-
  OMOP Common Data Model (OHDSI) for structured EHR data; OHNLP schema for tokenized clinical notes;
  DICOM for imaging; WFDB (PhysioNet schema, extended) for telemetry waveforms; EDF+ and Persyst for
  EEG waveforms.
was_derived_from: >-
  Retrospective clinical source systems at 14 data contributing hospitals, including electronic health
  record systems, PACS imaging archives, bedside monitor/gateway-middleware telemetry systems, and
  hospital EEG databases.

creators:
  - description: >-
      Eric S. Rosenthal, Massachusetts General Hospital; Principal Investigator of NIH project
      1OT2OD032701-01 (core project OT2OD032701) and listed on the Bridge2AI CHoRUS Leadership Team.
  - description: Azra Bihorac, University of Florida; listed on the Bridge2AI CHoRUS Leadership Team.
  - description: Xiaoqian Jiang, UTHealth Houston; listed on the Bridge2AI CHoRUS Leadership Team.
  - description: Yulia Strekalova, University of Florida; listed on the Bridge2AI CHoRUS Leadership Team.
  - description: Parisa Rashidi, University of Florida; listed on the Bridge2AI CHoRUS Leadership Team.
  - description: Manlik Kwong, Tufts University; listed on the Bridge2AI CHoRUS Leadership Team.
  - description: >-
      The CHoRUS Network as a whole, described as a collaboration spanning 20 academic centers, of
      which 14 will contribute as Data Acquisition centers; the project website reports 60+ CHoRUS
      consortium members across 20 different institutions.

funders:
  - description: >-
      National Institutes of Health (NIH) Common Fund, Bridge2AI program. NIH RePORTER application ID
      10472824; project number 1OT2OD032701-01; core project number OT2OD032701; awarded to
      Massachusetts General Hospital; fiscal year 2022; award amount 5880300 as listed in NIH RePORTER;
      project start 2022-09-01, project end 2026-11-30. The project website states "This project is
      funded by the NIH under award number OT2OD032701. The content on this website is solely the
      responsibility of the authors and does not necessarily represent the official views of the NIH."

purposes:
  - description: >-
      To meet the need for infrastructure supporting artificial intelligence and machine learning in
      critical care by generating data for ML/AI applications aimed at characterizing acute and
      critical care illness, predicting complications, and measuring treatment response among patients
      with acute or critical illness.
  - description: >-
      To develop a publicly available, AI-ready critical care dataset while ensuring the methods
      promote privacy, accountability, and clinical benefit, and while promoting a new generation of AI
      clinicians and scientists.
  - description: >-
      To provision a holdout test set, accessible for model external validation, to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - description: >-
      To create ethically sourced datasets and tools around artificial intelligence and to create best
      practices for AI in health, in collaboration with the other Bridge2AI data generation projects.
  - description: >-
      To develop the most diverse, high-resolution, ethically sourced, AI-ready dataset to answer the
      grand challenge of improving recovery from acute illness.

addressing_gaps:
  - description: >-
      There is an urgent need for infrastructure to support AI/ML in critical care; developing
      high-resolution multi-center datasets is described as a critical first step towards actionable
      and trustworthy AI.
  - description: >-
      Absence of unified standards across multi-modal EHR, waveform, imaging, and text data; CHoRUS
      develops and applies unified standards to harmonize these modalities.
  - description: >-
      Lack of a legal and ethical framework for collecting critical care data at scale and for
      determining what data is appropriate for public sharing; the project performs legal and ethical
      research and community-facing ethics focus groups to address this.
  - description: >-
      Lack of externally validated AI models for acute and critical care; the sequestered holdout
      dataset addresses the gap in independent external validation.
  - description: >-
      Shortage of trained workforce and AI literacy in the lay and scientific community, addressed
      through multimodal educational approaches and workforce development.

tasks:
  - description: Characterizing acute and critical care illness in patients with acute or critical illness.
  - description: Predicting complications and clinical deterioration among critically ill patients.
  - description: Measuring treatment response among patients with acute or critical illness.
  - description: >-
      Labeling data with targets important for prediction, supported by a visualization and annotation
      environment.
  - description: >-
      External validation of AI/ML models using a sequestered holdout dataset to aid marketplace
      adoption of AI-developed models.

intended_uses:
  - description: >-
      Development of machine-learning and artificial-intelligence-derived models to improve the care and
      outcomes of patients requiring critical care.
  - description: >-
      Hands-on AI/ML training and education, including the AIM-AHEAD Bridge2AI for Clinical Care
      Training Program, which expands access to Bridge2AI CHoRUS data through engagement, AI training,
      and mentorship, using canonical Jupyter Notebooks, the OHDSI tool stack, and the OHDSI/OMOP
      common data model on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud.
  - description: >-
      Collaborative research on the Bridge2AI Clinical Care Cloud platform, including development of
      practical use cases, works-in-progress posters for the AIM-AHEAD and Bridge2AI Annual Meetings,
      abstracts for health informatics conferences, and manuscripts for peer-reviewed journals.
  - description: >-
      Downstream analytics on the mapped and assembled dataset by clinical collaborators, coordinated
      through the chorus-ai GitHub organization.

other_tasks:
  - description: >-
      Research accounting for contextual and social factors, since data elements are intended to feature
      appropriate contextual factors such as geographic distance to the nearest hospital and social
      determinants of health.

future_use_impacts:
  - description: >-
      The sequestered holdout dataset is expected to aid marketplace adoption of AI-developed models for
      implementation in acute and critical care, with anticipated benefit to care delivery and care
      outcomes.
  - description: >-
      Privacy and re-identification risk is an anticipated concern for future use; the project transforms
      data using approaches that limit re-identification and performs patient-focused work to determine
      ethical and legal approaches to manage privacy and bias.
  - description: >-
      Bias in downstream models is an anticipated concern; patient-focused efforts determine ethical and
      legal approaches to manage bias while accounting for social determinants of health, and federated
      access is intended to enable sampling methods that ensure a balanced and diverse cohort.

known_limitations:
  - description: >-
      The dataset is not complete at the time of the source documentation: as of August 2025 imaging
      de-identification was in process for a larger cohort with only about 1000 images available, and
      EEG extraction was in process.
  - description: >-
      Clinical notes are stored locally at contributing sites rather than in the central enclave; only
      tokens derived from notes are available in the enclave.
  - description: >-
      Published metadata schemas were reported as "planned" rather than available for several modalities
      (clinical notes, imaging, and EEG metadata entries listed as planned).
  - description: >-
      Access is controlled for every data type; use requires registration, a signed licensing agreement,
      and (for the training program) a ".edu" email address, which limits open reuse.
  - description: >-
      Data are retrospective and drawn from 14 contributing hospitals within a network of 20 academic
      centers, so coverage is limited to those participating institutions.
  - description: >-
      Reported cohort sizes differ across sources: the project website reports 50,000 released patient
      admissions while the September 2025 webinar reported over 45,000 unique admissions as of August
      2025, against an anticipated final target of 100,000 patient admissions.

missing_data_documentation:
  - description: >-
      Metadata availability is uneven across modalities. In the CHoRUS dataset table, metadata is
      recorded as available ("Yes") for OMOP-standardized data types and for waveform telemetry, and as
      "Planned" for clinical notes, imaging, and EEG entries. Modalities still undergoing extraction or
      de-identification (EEG, larger imaging cohort) are correspondingly incomplete.

instances:
  - description: >-
      The primary unit of the dataset is a patient hospital admission for critically ill patients. The
      project aims to acquire an AI-ready dataset from more than 100,000 critically ill patients; the
      released dataset is described as 50,000 patient admissions from ICU, PICU, and NICU, and the
      August 2025 status reported over 45,000 unique admissions across 14 hospitals.
  - description: >-
      Each admission is associated with multi-modal records: structured OMOP EHR records (demographics,
      medication administration time-stamped upon each infusion change or dose administration,
      procedures documented by providers, high-frequency nursing flowsheet documentation, and diagnoses
      documented by providers), tokenized clinical notes, DICOM imaging studies from PACS, WFDB bedside
      monitor waveform telemetry, and EDF+/Persyst EEG waveforms.

subsets:
  - id: https://chorus4ai.org/dataset#omop-structured-ehr
    description: >-
      Structured EHR data standardized to the OMOP Common Data Model, covering demographics, medication
      administration, procedures, nursing flowsheets, and diagnoses. Access is controlled; metadata is
      available and published under the OMOP schema (with extensions for nursing flowsheets). The
      released dataset is reported as 1.6 billion rows of EHR OMOP data.
  - id: https://chorus4ai.org/dataset#clinical-notes
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit, conforming to the OHNLP open source
      schema. Access is controlled and published metadata is planned. Notes are stored locally at
      contributing sites; only tokens are held in the central enclave.
  - id: https://chorus4ai.org/dataset#imaging
    description: >-
      Imaging obtained from hospital PACS in DICOM format, conforming to the DICOM schema, with
      controlled access and planned published metadata. As of August 2025 approximately 1000 images were
      available with de-identification in process for a larger cohort; the project website reports 7,642
      admissions with radiology data in the current released dataset.
  - id: https://chorus4ai.org/dataset#waveform-telemetry
    description: >-
      Waveform telemetry from bedside monitors via gateway/middleware, distributed in WFDB format
      conforming to an extended PhysioNet schema, with controlled access and available metadata. The
      project website reports 23 Tb of waveform data in the current released dataset.
  - id: https://chorus4ai.org/dataset#eeg
    description: >-
      EEG waveforms sourced from hospital EEG databases in EDF+ and Persyst formats (open source EDF+ and
      Persyst schema), with controlled access; extraction was reported as in process as of August 2025
      and published metadata as planned.

splits:
  - description: >-
      The project will sequester holdout datasets and provision a holdout test set accessible for model
      external validation, intended to aid marketplace adoption of AI-developed models for
      implementation in acute and critical care.

subpopulations:
  - description: >-
      The current released dataset comprises patient admissions from ICU, PICU, and NICU.
  - description: >-
      The project states an intent to acquire a dataset of unprecedented diversity, using federated
      access and sampling methods to ensure a balanced and diverse cohort, and sampling to ensure
      comprehensive sets of patient conditions and clinical treatment strategies.
  - description: >-
      Social determinants of health and contextual factors such as geographic distance to the nearest
      hospital are included as data elements characterizing patient populations.

sensitive_elements:
  - description: >-
      The dataset consists of patient hospital records for critically ill patients, including
      demographics, diagnoses, procedures, medication administration, and nursing flowsheet
      documentation, all of which constitute sensitive health information and are held under controlled
      access.
  - description: >-
      Unstructured clinical notes, which are extracted and tokenized rather than distributed as free
      text, and which remain stored locally at contributing sites except for tokens.
  - description: >-
      Medical imaging from PACS, which requires de-identification before release (de-identification was
      reported as in process for the larger imaging cohort).
  - description: >-
      Social determinants of health and geographic contextual factors such as distance to the nearest
      hospital.
  - description: >-
      Physiologic waveform data (bedside telemetry and EEG) linked to individual admissions.

confidential_elements:
  - description: >-
      Every data type listed in the CHoRUS dataset table (demographics, medication administration,
      procedures, nursing flowsheets, diagnoses, clinical notes, imaging, waveform telemetry, and EEG) is
      designated as controlled access.
  - description: >-
      Clinical notes are not centrally released: they are stored locally at contributing sites, with only
      tokens placed in the enclave.
  - description: >-
      Community-facing ethics focus groups are conducted to determine what data is appropriate for public
      sharing.

is_deidentified:
  description: >-
    The project develops capabilities to acquire, standardize, tokenize, store, visualize, and label
    data, and states that it will transform data using approaches that limit re-identification.
    Unstructured EHR text is tokenized; imaging de-identification was in process as of August 2025 for a
    larger cohort. The chorus-ai GitHub organization lists a privacy_scan_tool repository described as
    "A Privacy Scan tools for medical records" and a repository named CTP-deid for which the source
    listing gives no description. Residual re-identification risk is not quantified in the available
    sources.

participant_privacy:
  - description: >-
      Patient-focused efforts determine the ethical and legal approaches to manage privacy and bias while
      accounting for social determinants of health. Data are transformed using approaches that limit
      re-identification, clinical notes are tokenized and retained locally, imaging undergoes
      de-identification, and all modalities are released only under controlled access within a cloud
      enclave.

human_subject_research:
  description: >-
    The dataset is derived from retrospective clinical records of critically ill patients at
    participating hospitals. The project establishes a legal framework for collecting data at scale,
    performs legal and ethical research, and conducts community-facing ethics focus groups to determine
    what data is appropriate for public sharing. The available sources do not state IRB approval details
    for the dataset itself.

at_risk_populations:
  description: >-
    The released cohort is described as patient admissions from ICU, PICU, and NICU. The available
    sources do not describe specific safeguards or assent procedures for particular at-risk populations
    beyond the project-wide controlled access, de-identification, and ethics work.

ethical_reviews:
  - description: >-
      The available sources do not document an IRB approval, ethics committee review, or compliance
      certification for the dataset. They describe project-level ethics activity: Ethics is one of the
      three project pillars ("Ethics (Ethical and Trustworthy AI)"); the project performs
      community-facing ethics focus groups to determine what data is appropriate for public sharing,
      establishes a legal framework for collecting data at scale, and analyzes the existing legal and
      regulatory landscape. The CHoRUS consortium evaluates community perspectives on clinical care AI to
      find ways to increase trustworthiness of provenance and privacy in AI.

acquisition_methods:
  - description: >-
      Retrospective data collection from clinical source systems at data contributing hospitals; data are
      observed clinical records rather than data generated for research.
  - description: >-
      Data are acquired, standardized to the OMOP Common Data Model, tokenized, stored, visualized, and
      labeled through capabilities developed across a multi-center network.
  - description: >-
      Contributing sites create and upload a CHoRUS Data Extract following validated standard operating
      procedures; tooling such as the chorus-extract-upload repository supports extract creation and
      upload.

collection_mechanisms:
  - description: >-
      Hospital electronic health record systems supply structured data (demographics, medication
      administration recorded at each infusion change or dose administration, provider-documented
      procedures and diagnoses, and high-frequency nursing flowsheet documentation).
  - description: >-
      Unstructured EHR text is extracted and tokenized using the OHNLP toolkit.
  - description: Imaging is drawn from hospital PACS systems and represented in DICOM.
  - description: >-
      Waveform telemetry is captured from bedside monitors through gateway/middleware and represented in
      WFDB format.
  - description: EEG waveforms are extracted from hospital EEG databases in EDF+ and Persyst formats.

data_collectors:
  - description: >-
      Fourteen data acquisition centers within a collaboration spanning 20 academic centers contribute
      clinical data extracts; the project website reports 14 data contributing hospitals and 60+
      consortium members across 20 institutions.
  - description: >-
      Data site managers at contributing sites follow the Chorus_SOP interactive workflow for extracting
      and contributing clinical data, and provide regular status updates through GitHub or a Google Form
      that updates the Standards Project or Data Acquisition Project boards.
  - description: >-
      Sub-teams within the CHoRUS data generation project (Standards, Data Acquisition, and Tooling)
      support and validate the acquisition process.

direct_collection:
  - description: >-
      Data are not collected directly from individuals for research purposes; they are retrospectively
      extracted from existing hospital clinical systems (EHR, PACS, bedside monitors, EEG databases) at
      the 14 data contributing hospitals and delivered to the CHoRUS enclave.

collection_timeframes:
  - description: >-
      Data collection is retrospective. The funded project period runs from 2022-09-01 to 2026-11-30. As
      of August 2025 the dataset covered 14 different hospitals with over 45,000 unique admissions, with
      imaging de-identification and EEG extraction still in process.

sampling_strategies:
  - description: >-
      The project establishes a legal framework for collecting data at scale, sampling to ensure
      comprehensive sets of patient conditions and clinical treatment strategies.
  - description: >-
      Federated access is intended to enable sampling methods that ensure a balanced and diverse cohort.

raw_sources:
  - description: >-
      Structured and unstructured electronic health record data from contributing hospitals, prior to
      OMOP standardization and tokenization.
  - description: >-
      Native imaging studies held in hospital PACS, prior to DICOM extraction and de-identification.
  - description: >-
      Bedside monitor telemetry captured via gateway/middleware systems, prior to conversion to WFDB.
  - description: >-
      Hospital EEG database recordings, prior to extraction into EDF+ and Persyst formats.

raw_data_sources:
  - source_description: >-
      Electronic health record systems at the 14 CHoRUS data contributing hospitals, supplying
      demographics, medication administration, procedures, nursing flowsheets, diagnoses, and clinical
      notes.
  - source_description: >-
      Picture Archiving and Communication Systems (PACS) at contributing hospitals, supplying imaging
      studies.
  - source_description: >-
      Bedside physiologic monitors and associated gateway/middleware at contributing hospitals, supplying
      waveform telemetry.
  - source_description: >-
      Hospital EEG databases at contributing hospitals, supplying EEG waveform recordings.

preprocessing_strategies:
  - description: >-
      Standardization of acquired clinical data to the OMOP Common Data Model, with schema extensions
      used for nursing flowsheet data.
  - description: >-
      Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit, conforming to
      the OHNLP open source schema.
  - description: >-
      Transformation of data using approaches that limit re-identification, including tokenization and
      de-identification of imaging.
  - description: >-
      Conversion of waveform data using CHoRUS waveform documentation and waveform conversion scripts
      (chorus_waveform, chorus_waveform_resources) into WFDB, conforming to an extended PhysioNet schema.

cleaning_strategies:
  - description: >-
      Validated semantic mappings connect clinical data in various source formats to international
      standards; a chorus-mapping repository holds documentation and pooled tabular mappings together
      with an associated clinical validation standard operating procedure, and clinical expertise is
      applied to semantic mapping and validation.
  - description: >-
      Standard operating procedures (SOPs) instruct data contributing sites on best practices for
      curating and delivering interoperable datasets; SOP documents undergo internal validation and
      review within the Chorus_SOP repository.
  - description: >-
      Characterization reports are produced and returned to sites following their data submissions
      (CHoRUSReports repository), and status tracking identifies and resolves blocking issues at
      contributing sites.

labeling_strategies:
  - description: >-
      A visualization and annotation environment labels data with targets important for prediction; the
      project develops capabilities across the multi-center network to acquire, standardize, tokenize,
      store, visualize, and label data.

machine_annotation_tools:
  - description: >-
      OHNLP toolkit, used to extract and tokenize clinical notes into the OHNLP open source schema.

license_and_use_terms:
  description: >-
    The dataset is controlled access across all modalities. All participants in the AIM-AHEAD Bridge2AI
    for Clinical Care Training Program must sign a licensing agreement, included in the registration
    form, before gaining access to the dataset, and must complete a registration form with name, email,
    and institution; access is granted and compute provisioned by email notification. A ".edu" email
    address is required to gain access to the dataset in that program context (program administrators
    will assist with this access if needed, and the requirement is stated not to be a barrier to
    acceptance into the program). Separately, the CHoRUS software project hosted in the chorus-ai GitHub
    organization is licensed under the MIT License (individual repositories also list MIT and Apache-2.0
    licenses); this software licensing is distinct from the terms governing access to the clinical data.

distribution_formats:
  - description: >-
      OMOP Common Data Model tables for structured EHR data (demographics, medication administration,
      procedures, nursing flowsheets with schema extensions, diagnoses), distributed under controlled
      access within the cloud enclave.
  - description: >-
      OHNLP-schema tokenized clinical note output; full notes remain stored locally at contributing
      sites.
  - description: DICOM imaging files conforming to the DICOM schema.
  - description: WFDB waveform files conforming to an extended PhysioNet schema.
  - description: EDF+ and Persyst EEG files conforming to the open source EDF+ and Persyst schemas.

distribution_dates:
  - description: >-
      As of August 2025 the dataset covered 14 different hospitals with over 45,000 unique admissions and
      was in use for training activities and publications. The project website separately describes a
      "Current Released Dataset" of 50,000 patient admissions against an "Anticipated Final Dataset" of
      100,000 patient admissions; the funded project period ends 2026-11-30.

third_party_sharing:
  - description: >-
      Access is controlled and mediated through a cloud enclave (the Bridge2AI AI/ML for Clinical Care
      Collaborative Cloud), with OMOP and telemetry data held in the enclave, clinical notes stored
      locally except for tokens, and access granted following registration and a signed licensing
      agreement.
  - description: >-
      Access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org according to
      the CHoRUS GitHub organization overview.
  - description: >-
      The project intends the dataset to be publicly available and AI-ready, and will sequester holdout
      datasets accessible to external parties for model external validation.
  - description: >-
      Data are shared with trainees of the AIM-AHEAD Bridge2AI for Clinical Care Training Program (up to
      30 trainees selected for Cohort 2, program running November 17, 2025 to July 31, 2026).

existing_uses:
  - description: >-
      As reported in September 2025, CHoRUS datasets are being used for training activities and
      publications.
  - description: >-
      The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2) expands access to Bridge2AI
      CHoRUS data through engagement, AI training, and mentorship, equipping trainees to apply AI/ML
      methods to big data analysis and conduct research at the intersection of healthcare challenges and
      AI/ML using multi-modal datasets. Training includes Jupyter Notebook workshops, the OHDSI tool
      stack, the OHDSI/OMOP common data model, generative AI use cases, and ethics of clinical AI.

maintainers:
  - description: >-
      Ciera McCrary, Massachusetts General Hospital, Program Manager; contact listed on the project
      website as cmccrary@mgh.havard.edu (as printed on the source page).
  - description: >-
      Access requests and inquiries are directed to dbold@emory.edu or
      jared.houghtaling@tuftsmedicine.org per the chorus-ai GitHub organization overview.
  - description: >-
      The chorus-ai GitHub organization (37 followers, 28 repositories, United States of America) hosts
      active repositories with versions, maintainers, and other package metadata tracked on a package
      status page compiled in the chorus-developer repository.
  - description: >-
      Project management within the chorus-ai organization aggregates issues into a central task
      management project and tracks the status of data contributing sites in the Standards Project and
      Data Acquisition Project boards.

extension_mechanism:
  description: >-
    The chorus-ai GitHub organization provides context-specific discussion locations (Standards
    Discussions and Data Acquisition Discussions) for issues encountered in the creation or submission of
    data extracts. Clinical collaborators can contribute to semantic mapping efforts through the
    chorus-mapping repository, which holds documentation, pooled tabular mappings, and a clinical
    validation SOP. Data contributing sites submit regular status updates either through the GitHub
    interface or a Google Form, with a GoogleScript calling the GitHub API to update status and issue
    information. Software contributors are supported by a web guide compiled in the chorus-developer
    repository, and interested parties can reach out via the listed contacts.

updates:
  description: >-
    The dataset is growing toward an anticipated final size of 100,000 patient admissions across 9 data
    modalities from 14 contributing hospitals. As of August 2025, imaging de-identification was in
    process for a cohort larger than the approximately 1000 images then available, EEG extraction was in
    process, and published metadata schemas for clinical notes, imaging, and EEG were planned.
    Repositories in the chorus-ai organization were being actively updated, and per-repository project
    boards were being phased out and migrated to a central project space.

