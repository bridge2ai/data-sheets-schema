  - description: >-
      NIH RePORTER record for the funding award:
      https://reporter.nih.gov/project-details/10472824 (application ID 10472824, project number
      1OT2OD032701-01)
  - description: >-
      Chorus_SOP centralized SOP documentation site, including an interactive workflow diagram with
