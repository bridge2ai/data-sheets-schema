id: https://doi.org/10.13026/37yb-1t42

name: Bridge2AI-Voice

title: >-
  Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health
  information

description: >-
  Bridge2AI-Voice is a large, ethically sourced, demographically diverse voice
  dataset linked to health information, produced by the Bridge2AI-Voice
  consortium under the NIH Common Fund Bridge2AI program. It comprises voice,
  speech, breathing and cough recordings collected with a purpose-built
  application from participants recruited at North American clinical sites. The
  project defines five disease cohort categories for which voice changes have
  been associated with specific diseases: voice disorders, neurological and
  neurodegenerative disorders, mood and psychiatric disorders, respiratory
  disorders, and pediatric voice and speech disorders. Participants without
  those conditions are additionally enrolled as controls. The adult release
  documented here draws on the four adult disease categories together with
  controls and was collected at five North American sites; pediatric data are
  collected under a separate protocol at a pediatric institution and are
  released as a separate dataset. Recordings are accompanied by detailed
  demographics, confounder surveys, clinician-validated diagnoses, and validated
  patient-reported outcome questionnaires. The public PhysioNet release contains
  data considered low risk, namely derived audio features (spectrograms, Mel
  spectrograms, MFCCs, pitch, articulatory and phonetic posteriorgram features,
  static acoustic features, and audio quality metrics) rather than the original
  voice waveforms; raw audio is distributed separately under controlled access.
  Version 3.1.0 contains data for 833 adult participants.

