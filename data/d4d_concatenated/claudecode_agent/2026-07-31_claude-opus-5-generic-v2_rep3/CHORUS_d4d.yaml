id: https://chorus4ai.org/
name: CHoRUS Dataset
title: "Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards) is a multicenter,
  multimodal, high-resolution, controlled-access critical care dataset produced by one of four data
  generation projects in the NIH Common Fund Bridge2AI consortium. The dataset assembles
  retrospectively collected clinical data from patients with acute and critical illness at 14
  data-contributing hospitals within a collaboration spanning 20 academic centers and more than 60
  consortium members. Data span nine modalities: demographics, medication administration,
  procedures, nursing flowsheets and diagnoses standardized to the OMOP Common Data Model; clinical
  notes extracted and tokenized with the OHNLP toolkit; imaging from PACS in DICOM; bedside
  telemetry waveforms in WFDB; and EEG waveforms in EDF+ and Persyst formats. The project website
  reports a current released dataset of 50,000 patient admissions from ICU, PICU and NICU, 1.6
  billion rows of EHR OMOP data, 7,642 admissions with radiology data and 23 Tb of waveform data,
  against an anticipated final dataset of 100,000 patient admissions across 9 data modalities and 14
  contributing hospitals. The Cohort 2 informational webinar states that as of August 2025 the
  dataset covered 14 different hospitals with over 45,000 unique admissions. A holdout test set is
  sequestered to allow external validation of models.
status: >-
  Partially released and still under construction: a current released dataset is available under
  controlled access while imaging de-identification and EEG extraction remain in process against an
  anticipated final dataset. The project website carries the notice "This repoitory is under review
  for potential modification in compliance with Administration directives."
page: https://chorus4ai.org/
created_by: CHoRUS for Equitable AI Network (Patient-Focused Collaborative Hospital Repository Uniting Standards)
was_derived_from: >-
  Electronic health record systems, PACS imaging archives, bedside monitor telemetry
  gateway/middleware, and hospital EEG databases at the 14 CHoRUS data-contributing hospitals.
conforms_to: >-
  OMOP Common Data Model (OHDSI) for structured EHR data; OHNLP open source schema for tokenized
  clinical notes; DICOM for imaging; WFDB with an extended PhysioNet schema for telemetry waveforms;
  EDF+ and Persyst for EEG waveforms.

