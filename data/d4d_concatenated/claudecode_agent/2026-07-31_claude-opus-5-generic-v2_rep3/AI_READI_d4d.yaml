purposes:
  - description: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal dataset that
      enables future generations of artificial intelligence and machine learning research to provide
      critical insights into type 2 diabetes mellitus, including salutogenic pathways back to health.
  - description: >-
      To build a foundational dataset in T2DM that is agnostic to existing classification criteria
      or biases and that can be used to reconstruct a temporal atlas of T2DM development and
      reversal towards health.
  - description: >-
      To address the lack of well-designed, high-quality, large, and inclusive multimodal datasets
      that has limited the ability to understand and affect the course of complex, multi-organ
      diseases such as T2DM.
  - description: >-
      To establish and disseminate standards, best practices, and guidelines - a "blueprint" - for
      the collection, preparation, and sharing of data for AI/ML, including FAIR (Findable,
      Accessible, Interoperable, Reusable) implementation and ethical, legal and social
      considerations, so that other data generation projects can follow them.

addressing_gaps:
  - description: >-
      A major barrier to AI in health research has been the lack of diverse datasets that are
      AI-ready for training AI models; AI-READI was designed specifically to address this gap.
  - description: >-
      A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated that
      samples lacked racial and ethnic diversity. AI-READI addresses this demographic inequity by
      recruiting approximately balanced numbers of Asian, Black, Hispanic, and white participants,
      described in the protocol as a demographic improvement over many previous epidemiological
      studies and clinical trials on T2DM.
  - description: >-
      Existing data sources such as insurance claims or electronic health records do not support
      the downstream AI/ML analyses the project targets. AI-READI fills this gap with a purpose-built
      multi-domain acquisition protocol spanning survey, physical, clinical, imaging, and wearable
      device data collected under a uniform protocol.
  - description: >-
      Current understanding of T2DM, especially in the context of salutogenesis (the pathway from
      disease to health, as opposed to pathogenesis), is limited; the dataset is intended to enable
      research on that pathway.

tasks:
  - description: >-
      Downstream pseudotime manifold analysis - an approach borrowed from developmental biology and
      used to predict disease trajectories by collecting and learning from complex, multimodal data
      from participants with differing disease severity (normal through insulin-dependent T2DM).
  - description: >-
      Development of multimodal artificial intelligence and machine learning models of type 2
      diabetes mellitus using balanced training data.
  - description: >-
      Reconstruction of a temporal atlas of T2DM development and of reversal towards health
      (salutogenesis).
  - description: >-
      Investigation of underlying genetic links and disease trajectories in different racial and
      ethnic cohorts (using the controlled-access release, which retains race, ethnicity, and
      genomic data).

intended_uses:
  - description: >-
      Type 2 diabetes related research. Access to the public dataset is conditioned on the user
      agreeing to use the data only for type 2 diabetes related research; the controlled/private
      version is intended to allow more generic use.
  - description: >-
      Training, validating, and testing AI/ML models using the recommended 70/15/15 participant-level
      splits distributed in participants.tsv, which are balanced as far as possible for sex,
      race/ethnicity, and diabetes status.
  - description: >-
      Immediate AI/ML research without reformatting and preprocessing: all data are stored and shared
      through FAIRhub in an "AI-ready" state, mapped to community standards (OMOP CDM, DICOM,
      WFDB, Open mHealth) and organized under the Clinical Dataset Structure specification.
  - description: >-
      Use as a model or exemplar for future efforts to develop other medical and health datasets
      targeted for AI/ML, including reuse of the accompanying guidelines, licence, metadata schemas,
      and the FAIRhub platform itself.
  - description: >-
      Commercial as well as research reuse: the data licence grants a non-exclusive,
      non-transferable licence to download, reproduce, and use the data and to create derivative
      works for research and commercial purposes, subject to its restrictions.

prohibited_uses:
  - description: >-
      Making clinical treatment decisions based on the data. The data licence states the dataset is
      intended solely as a research resource.
  - description: >-
      Using or attempting to use the data, alone or in concert with other information, to compromise
      or infringe the confidentiality or privacy of any data subject; to identify or contact any
      individual data subject or group of data subjects; to extract or extrapolate identifying
      information; to establish a data subject's membership in a particular group of persons; or
      otherwise to cause harm or injury to any data subject.
  - description: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing, or otherwise
      conveying any portion of the data or any derivative work to any third party other than another
      licensee bound by an identical agreement with the licensor.
  - description: >-
      Disseminating models, algorithms, or programs trained or adapted on the data without first
      undertaking all reasonable efforts to minimise the likelihood that data can be memorized,
      derived, reconstructed, or reconstituted through the use or construction of such models.
  - description: >-
      Using the public release for purposes other than type 2 diabetes related research; access is
      granted only after the user attests to this restriction (accessType
      "PublicDownloadSelfAttestationRequired").
  - description: >-
      Handling the data outside the security and privacy standards established by the NIH Genomic
      Data Sharing (GDS) Policy, with which licensees must comply.

future_use_impacts:
  - description: >-
      Theoretical risk of future re-identification. The project states it does not currently
      anticipate uses of the dataset that could result in unfair treatment or harm, but explicitly
      acknowledges a theoretical re-identification risk.
  - description: >-
      AI algorithms can infer individual patient characteristics and could facilitate individual-level
      identification. To prevent re-identification attempts the project implements a robust data
      dissemination system, a strict licence agreement, and data watermarking for both the public
      and controlled sets.
  - description: >-
      Information related to the sex and race/ethnicity of participants was removed from the public
      release specifically to prevent stigmatization of findings; consequently fairness or subgroup
      analyses on those attributes are only possible under controlled access.

instances:
  - description: >-
      Each instance represents an individual participant (patient). There are 2,280 instances in
      version 3.0.0 of the dataset. An instance comprises all data available for that individual
      across the collected modalities: survey data, clinical data (including blood and urine
      laboratory results), retinal imaging (photography, OCT, OCTA, FLIO), 12-lead ECG waveforms,
      continuous glucose monitor readings, wearable activity monitor streams, and indoor
      environmental sensor readings. These encompass tabular data, imaging data, and physiological
      signal/waveform data; no unstructured free-text data are included. Earlier releases contained
      204 instances (v1.0.0, pilot phase) and 1,067 instances (v2.0.0).

relationships:
  - description: >-
      All instances are part of the same prospective data generation project (AI-READI). There is
      currently only one study visit per participant, so instances are not linked longitudinally in
      this release. Within an instance, files across all datatype directories are linked by the
      participant identifier used as the directory name under each device folder and recorded in
      participants.tsv.

subpopulations:
  - description: >-
      Self-reported race/ethnicity groups across the 2,280 participants, as published in the
      README split table: Hispanic 380, Asian 545, Black 519, White 836. Participant-level race and
      ethnicity are withheld from the public release and held under controlled access; the
      healthsheet answers "No" to whether the dataset identifies demographic sub-populations, which
      is in tension with the aggregate counts published in the README.
  - description: >-
      Sex groups across the 2,280 participants, as published in the README split table: male 951,
      female 1,329. Participant-level sex is withheld from the public release and held under
      controlled access. Recruitment was designed to be balanced by biological sex, and the
      realized distribution in this release is not balanced.
  - description: >-
      Diabetes status groups across the 2,280 participants, as published in the README split table:
      no diabetes 776; pre-diabetes or T2DM controlled by lifestyle adjustments 560; T2DM controlled
      by oral or non-insulin injectable medications 686; insulin-controlled T2DM 258. The study
      design target was approximately 1,000 participants in each of the four groups.
  - description: >-
      Age distribution: mean 60.8 years, standard deviation 11.3 years across the 2,280
      participants (train 61.1 +/- 11.3; validation 60.3 +/- 10.8; test 60.5 +/- 11.4). Eligibility
      required age 40 years or older; the FAIRhub eligibility metadata also records a maximum age of
      85 years and excludes adults older than 85.
  - description: >-
      Geographic subpopulations by recruiting site: University of Alabama at Birmingham
      (Birmingham, Alabama), University of California San Diego (San Diego, California), and
      University of Washington (Seattle, Washington). All study groups are recruited at each site,
      but the proportion of each group varies with the demographic prevalence of that group in the
      site's geographical area.

splits:
  - description: >-
      Training split: 1,576 participants (approximately 70%). Composition as published in the
      README: Hispanic 204, Asian 369, Black 343, White 660; male 599, female 977; no diabetes 600,
      lifestyle-controlled 384, oral-medication-controlled 487, insulin-controlled 105; mean age
      61.1 +/- 11.3 years.
  - description: >-
      Validation split: 352 participants (approximately 15%). Composition as published in the
      README: Hispanic 88, Asian 88, Black 88, White 88; male 176, female 176; no diabetes 88,
      lifestyle-controlled 88, oral-medication-controlled 109, insulin-controlled 67; mean age
      60.3 +/- 10.8 years.
  - description: >-
      Test split: 352 participants (approximately 15%). Composition as published in the README:
      Hispanic 88, Asian 88, Black 88, White 88; male 176, female 176; no diabetes 88,
      lifestyle-controlled 88, oral-medication-controlled 90, insulin-controlled 86; mean age
      60.5 +/- 11.4 years.
  - description: >-
      Rationale and delivery. Because sex, race, and ethnicity are not released with the public
      version of the dataset, the project team prepared the splits so that the validation and test
      sets are balanced as far as possible for sex, race/ethnicity, and diabetes status (no diabetes,
      prediabetes/lifestyle controlled, oral medication controlled, insulin controlled). The split
      assignment for each participant is distributed in the participants.tsv file. The split is
      described as aimed at reducing disparities in models developed using this dataset. This
      recommended split is new in version 3.0.0.

anomalies:
  - description: >-
      Missing modalities. Not all modalities are available for all participants: some participants
      elected not to participate in some study elements.
  - description: >-
      Device data loss. In a few cases the data collection device had no stored results or was
      returned too late to retrieve the results, for example because the battery died or the data
      were lost.
  - description: >-
      Data collision. In a few cases there may have been a data collision at some point in the
      processing pipeline and data have been lost.
  - description: >-
      Survey non-response. Skipped questions and incomplete responses are expected in the survey
      data.
  - description: >-
      Wearable device faults. Improper use, technical failure such as battery failure, and system
      malfunction are expected for the wearable and at-home devices.
  - description: >-
      Imaging quality variability. Patient uncooperation, noise that may obscure the images,
      technical failure such as system malfunction, and data transfer failures are expected in the
      imaging data. Image quality varies particularly for the handheld, undilated Optomed Aurora
      camera and for FLIO, which is acquired last in the visit after prolonged light exposure when
      participants may not be at their best possible compliance.

missing_data_documentation:
  - description: >-
      Modality-level missingness is documented in the healthsheet: not all modalities are available
      for all participants. Causes recorded are participant declination of individual study
      elements, device-level failure to store or return data in time, and occasional loss through
      data collision during processing.
  - description: >-
      Item-level missingness in the survey data arises from skipped questions and incomplete
      responses. During data entry, missing data that could be directly filled from other portions
      of an individual's record were completed during quality control; where there was no logical
      or appropriate way to correct the data, the site principal investigator reviewed the values
      and decided whether they should be removed.
  - description: >-
      Deliberate withholding rather than absence: sex, race/ethnicity, and medications used are
      removed from the public release and held under controlled access, and the Snellen visual
      acuity variables present in earlier versions were dropped in version 3.0.0 so that only
      logMAR visual acuity measurements remain.

known_biases:
  - description: >-
      Volunteer (self-selection) bias. Participants are volunteers; the protocol states there is
      selection bias known as volunteer bias which may limit the generalisability of results to
      those who are not represented in the study population.
  - description: >-
      Recruitment bias against Black men. It is a well-documented observation in health research
      that recruiting Black men into studies is more difficult than recruiting other populations,
      yet this population bears a disproportionate share of T2DM burden; factors include medical
      mistrust and fear of safety stemming from historical events such as the Tuskegee syphilis
      study. Similar under-recruitment trends are reported for Hispanic and Asian persons.
  - description: >-
      Language-based exclusion bias. Participants are required to speak, read, and understand
      English, which the protocol notes may have created challenges in recruiting Hispanic and/or
      Asian persons and which excludes non-English-speaking populations entirely.
  - description: >-
      Coverage bias in population groups. The study cohort does not include other races and
      ethnicities such as Pacific Islanders and Native Americans, so it does not provide a
      comprehensive representation of the population.
  - description: >-
      Setting bias. Recruitment is predominantly urban and hospital-based, drawn from patients who
      had a medical encounter within the three participating health systems, and may not fully
      capture diverse cultural and socioeconomic backgrounds.
  - description: >-
      Residual imbalance in released versions. Although the overall enrollment goal is balanced
      distribution across race/ethnicity, sex, and diabetes severity, enrollment is ongoing and the
      pilot and periodic interim releases may not have achieved balanced distribution across groups;
      the realized counts in version 3.0.0 are unbalanced for sex and for race/ethnicity.
  - description: >-
      Non-probability sampling. The FAIRhub study metadata records the sampling method as
      "Non-Probability Sample", drawn from a contact pool identified by screening electronic health
      records rather than from a random population sample.

known_limitations:
  - description: >-
      Cross-sectional design with a single visit. There is currently only one visit per participant
      in the dataset; the planned longitudinal arm invites approximately 10% (approximately 4% of
      participants per one statement in the healthsheet) for a follow-up examination in year 4 of
      the project, which is not represented in this release.
  - description: >-
      No labels or targets. No explicit label or target is associated with each data instance and no
      labeling was performed, because the dataset is deliberately hypothesis-agnostic; there are
      also no formal guidelines for future researchers creating new labels or defining new tasks.
  - description: >-
      Raw data are not shared. Raw, pre-standardization data are preserved by the project but are
      not shared outside the project team, because they have not been mapped to standardized
      terminologies and because free-text fields may accidentally include personal health or
      personally identifiable information.
  - description: >-
      Withheld attributes limit fairness analysis. Because sex, race, ethnicity, medications, ZIP
      code, and genomic data are withheld from the public release, subgroup performance and equity
      analyses cannot be performed on the public set alone.
  - description: >-
      Finite biorepository. A limitation of the biorepository is that there are a finite number of
      samples to share with scientists interested in using them in research; procedures for
      reviewing and prioritising written requests were still to be developed at the time of the
      protocol publication.
  - description: >-
      Variable set changes across versions. The Snellen visual acuity variables present in earlier
      versions were dropped in version 3.0.0, so only logMAR visual acuity measurements are
      available; users combining versions must account for this.
  - description: >-
      Confounding by device and site is partially mitigated but not eliminated. Uniform data
      collection protocols were implemented for all subjects irrespective of race/ethnicity,
      biological sex, or diabetes severity across all study sites, and multiple devices were used
      for one measure to enhance generalizability; nevertheless the number and diversity of devices
      and recording sites, and possible distribution shifts over time, are identified as factors
      limiting the generalization of derived models.
  - description: >-
      Documentation inconsistency across versions. The version 3.0.0 documentation "About" page
      states that it is associated with a version of the dataset "which contains data from the
      participants of the pilot study phase", repeating wording from the version 2.0.0 page, whereas
      the dataset README and healthsheet state that version 3.0.0 contains 2,280 participants
      collected from 19 July 2023 to 1 May 2025.
  - description: >-
      No external audit. The dataset has not undergone any formal external audit; it has been
      reviewed internally by AI-READI team members for quality checks and to ensure that no
      personally identifiable information was accidentally included.

acquisition_methods:
  - description: >-
      Directly observable measurement. Laboratory results from blood and urine, vital signs and
      anthropometrics, retinal imaging, ECG, monofilament testing, visual function testing, and
      cognitive screening were measured directly by trained study personnel during the in-person
      visit.
  - description: >-
      Participant self-report. Survey and questionnaire responses were reported by the subjects
      themselves, completed online through REDCap before or after the visit, or on paper.
  - description: >-
      Device-recorded at-home monitoring. Continuous glucose, physical activity, and indoor
      environmental parameters were recorded automatically by devices carried or placed by the
      participant over a 10-day period after the visit.
  - description: >-
      Extraction from existing records. Age, diabetes status by ICD-10 code, and other eligibility
      and demographic data were drawn from electronic health records for screening; past health
      records, medications, and traffic and accident reports were also extracted and are held under
      controlled access.
  - description: >-
      Verification of reported data. Verification of data entry was performed when possible, for
      example by cross-referencing entered medications with medications that were physically brought
      in or photographed by each study participant.

collection_mechanisms:
  - description: >-
      REDCap. Used for e-consent, self-report questionnaires, and entry of clinical data from the
      visit including medications assessment, vitals, visual acuity, contrast sensitivity,
      monofilament test results, and complete blood count results. The exact forms used are
      published as a PDF alongside the documentation.
  - description: >-
      Philips PageWriter TC30 Cardiograph (Philips, Amsterdam, The Netherlands). 12-lead ECG
      performed with the participant in a reclining chair or supine; the position (0, 30, 60, or 90
      degrees relative to supine) is recorded. Exported as .xml and released in WaveForm DataBase
      (WFDB) format.
  - description: >-
      Optomed Aurora IQ handheld fundus camera (Optomed, Oulu, Finland). Undilated macula- and
      disc-centred colour fundus photographs, 50 degree field of view, 5 Mpix sensor; four images
      per participant; DICOM.
  - description: >-
      iCare EIDON widefield TrueColor confocal fundus system (iCare USA, Raleigh, North Carolina).
      Ultra-wide field central, nasal and temporal colour fundus photographs, central infrared,
      central fundus autofluorescence, and a mosaic of ultra-wide field images; 12 images per
      participant; DICOM.
  - description: >-
      Heidelberg Spectralis HRA OCT and OCTA (Heidelberg Engineering GmbH, Heidelberg, Germany).
      Optic nerve head radial circle high resolution OCT, posterior pole macula HR 61-line OCT, and
      20x20 HS 512-line macular OCTA; six images per participant; DICOM.
  - description: >-
      Topcon Maestro2 3D OCT-1 (Topcon Healthcare, Itabashi-ku, Tokyo, Japan). 3D Wide (H)
      12x9-512x128 OCT, 3D Macula 6x6-512x128 OCT, and Macula 6x6-360x360 OCTA; six images per
      participant; exported in .fda and converted to DICOM.
  - description: >-
      Topcon Triton DRI OCT (Topcon Healthcare, Itabashi-ku, Tokyo, Japan). Swept-source
      3D(H)+Rad 12x9-512x256 OCT, Macula 6x6-320x320 OCTA, and Macula 12x12-512x512 OCTA; six images
      per participant; exported in .fda and converted to DICOM.
  - description: >-
      Zeiss Cirrus 5000 Angioplex (Carl Zeiss Meditec AG, Jena, Germany). Disc Cube 200x200 OCT,
      Macula Cube 512x128 OCT, Macula 6x6 OCTA and Disc 6x6 OCTA; eight images per participant;
      DICOM.
  - description: >-
      Heidelberg fluorescence lifetime imaging ophthalmoscopy (FLIO) (Heidelberg Engineering GmbH,
      Heidelberg, Germany). Macula-centred acquisition; two images per participant; exported in .sdt
      and converted to DICOM. Performed last in the visit because of its duration and light exposure.
  - description: >-
      Dexcom G6 Continuous Glucose Monitor (Dexcom, Inc., San Diego, California). Real-time
      integrated CGM applied to the abdomen recording blood glucose in mg/dL every 5 minutes over
      10 days; exported as .csv and released in Open mHealth format. Participants are masked to the
      results during the monitoring period.
  - description: >-
      Garmin Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland). Records
      steps, heart rate, sleep duration and phases, respiratory rate, stress, calories, and oxygen
      saturation; exported in .FIT and converted to the Open mHealth standard.
  - description: >-
      Custom-designed indoor environmental sensor, the LeeLab Anura, built at the Karalis Johnson
      Retina Center, University of Washington (Seattle, Washington). Records ambient temperature,
      relative humidity, nitrogen oxides, volatile organic compounds, particulate matter, and
      multi-spectral light intensity over 10 days; released as .csv following NASA ASCII file format
      guidelines for Earth science data. The environmental sensor and fitness tracker were
      specifically chosen with participant privacy as a primary concern: they capture no video or
      audio, have no GPS location monitoring, and are not synced with participant-owned devices.
  - description: >-
      Clinical laboratory instruments. Complete blood count is performed on fresh whole blood by
      CLIA-certified laboratories local to each site; all other laboratory tests are performed by
      the University of Washington Nutrition and Obesity Research Center (NORC) testing facility on
      stored, frozen samples, with results provided in .csv.
  - description: >-
      Visual function instruments. M&S Technologies Electronic Visual Acuity tester (M&S Technology,
      Niles, Illinois) at 4 metres for photopic and, through a 2.0 neutral density filter, mesopic
      best-corrected acuity; Mars letter contrast sensitivity chart (Mars Perceptrix, Chappaqua, New
      York) under photopic and mesopic conditions; Topcon KR 800 autorefractor/keratometer (Topcon
      Healthcare, Oakland, New Jersey); and lensometers (NIDEK LM-600P, Topcon CL-200, Topcon CL-300).
  - description: >-
      Montreal Cognitive Assessment (MoCA) administered electronically on an iPad using the MoCA Duo
      application (MoCA Cognition, Quebec, Canada); total score, section subscores, Memory Index
      Score, and task completion times exported as .csv.
  - description: >-
      10 g monofilament for peripheral neuropathy testing, applied to three locations on each foot
      with the participant's eyes closed and shoes and socks removed, ten times per location, with
      insensate areas retested for confirmation; results entered directly into REDCap.
  - description: >-
      Automatic oscillometric blood pressure devices: OMRON HEM 907XL, Medline MDS4001 Automatic
      Digital Blood Pressure Monitor, and Welch Allyn 6000 series vital signs monitor with Welch
      Allyn FlexiPort reusable cuff. Systolic, diastolic, and heart rate measured twice, separated
      by 2 minutes.

data_collectors:
  - description: >-
      Clinical research coordinators at the three data collection sites. Responsible for contacting
      and consenting participants, ushering participants through the research visit, conducting
      study visits including collection of ophthalmic images, training participants on continuous
      glucose monitoring and the fitness tracker, and ensuring return of study materials. All
      coordinators underwent mandatory institutional compliance training for human subject research,
      training by the data manager at UAB, study of a detailed Manual of Procedures, and a
      certification process requiring successful administration of all protocol elements to at least
      three volunteer practice subjects.
  - description: >-
      Data managers at each site, who oversee the training and certification process and are
      responsible for the quality control of all data before uploading to FAIRhub.
  - description: >-
      Research assistants, who conduct study visits including collection of ophthalmic images,
      provide device training, ensure return of study materials, and handle data upload and
      management from each clinic visit under the direction of the study coordinator or project
      manager.
  - description: >-
      Retinal imaging technicians, trained to detect certain potentially life- or vision-threatening
      conditions (retinal detachment, tumour, and optic disc oedema) during acquisition and to
      trigger immediate follow-up and referral.
  - description: >-
      Phlebotomists and laboratory assistants, responsible respectively for blood collection from
      research participants and for processing and shipping samples.
  - description: >-
      Compensation of data collectors. Effort was supported by NIH award OT2OD032644 based on the
      percentage of effort contributed, with salaries aligned with the funding guidelines at each
      site.

collection_timeframes:
  - description: >-
      Preliminary pilot enrolment occurred between 18 July 2023 and 30 November 2023, to secure
      sufficient familiarity for all coordinators. Data from this period formed version 1.0.0 of the
      dataset.
  - description: >-
      Formal data collection began on 1 December 2023.
  - description: >-
      Collection window for this release: 19 July 2023 to 1 May 2025, as recorded in the FAIRhub
      dataset description (dateType "Collected", value 2023-07-19/2025-05-01), the README, and the
      healthsheet. Note that the BMJ Open protocol states that enrolment began on 18 July 2023,
      one day earlier than the structured metadata start date.
  - description: >-
      Planned enrolment period. The BMJ Open protocol states enrolment will continue until 30
      November 2026. The FAIRhub study metadata records an actual start date of 2023-07-19 and an
      anticipated completion date of 2027-01-01. The NIH award project period runs 2022-09-01 to
      2025-08-31. Participants are recruited in waves, with the composition and size of each wave
      influenced by the observed participation characteristics of race/ethnicity, gender, severity
      of T2DM, and site.
  - description: >-
      Per-participant timeframe. The in-person protocol is a single visit lasting between 2.5 and 4
      hours, followed by a 10-day at-home monitoring period using the continuous glucose monitor,
      fitness tracker, and environmental sensor.

direct_collection:
  - description: >-
      Data were collected directly from participants across the three recruiting sites; this was
      active data collection rather than passive collection or secondary use of existing data.
  - description: >-
      Recruitment pools were identified indirectly by screening the electronic health records of the
      participating health systems for diabetes and prediabetes ICD-10 codes among patients who had
      had an encounter with the sites' health systems. The study base is all patients aged 40 years
      or older who had a medical encounter within each health system site (UAB, UCSD, UW) between
      2020 and 2025.
  - description: >-
      Driving and accident records are obtained from the Department of Licensing, that is, from a
      third-party source rather than from the individual.

sampling_strategies:
  - description: >-
      Triple-balanced recruitment design. Rather than targeting the demographic distribution of the
      US population, the study recruits the following populations in approximately equal proportions:
      four race/ethnic groups (Asian, Black, white, Hispanic); four categories of T2DM (no diabetes;
      pre-diabetes or lifestyle-controlled diabetes; diabetes treated with oral or non-insulin
      injectable medications; insulin-controlled diabetes); and biological males and females.
      Building balanced datasets is described as critical for the development of unbiased machine
      learning models.
  - description: >-
      Electronic health record screening. Patients with T2DM and pre-diabetes are identified by
      screening electronic health records for ICD-10 diagnosis codes R73.09 and E11.X; patients
      without diabetes will not have encounters with these ICD codes.
  - description: >-
      Wave-based stratified contact pooling. For each recruitment wave a contact pool is identified
      by screening electronic health records at each site; individuals are mailed a personalised
      hardcopy invitation letter and sent an invitation email directing them into an online REDCap
      recruitment interface via links, access codes, and QR codes. As recruitment progresses the
      composition of participants is monitored for diversity and inclusion and adjusted by under-
      and oversampling groups as needed. Per the IRB protocol, UAB coordinates the selection of a
      stratified sample from the combined UW, UCSD, and UAB candidate lists to achieve balancing of
      race/ethnicity, sex, and diabetes severity.
  - description: >-
      Site-level prioritisation. All study groups are recruited at each site to capture diversity,
      but the proportion of each group varies with the demographic prevalence of that group in the
      site's geographical area. The IRB protocol records that UW concentrates on
      Asian > Hispanic > Black participants, UCSD on Hispanic > Asian > Black, and UAB on
      Black > Hispanic > Asian, with all sites recruiting white participants.
  - description: >-
      Sampling method as declared in the structured study metadata: "Non-Probability Sample";
      observational model "Cohort"; time perspective "Cross-sectional".
  - description: >-
      No sampling at the dataset level. The healthsheet states the dataset contains all possible
      instances - that is, data from all participants enrolled during the covered collection period -
      rather than a sample drawn from a larger collected set.

raw_data_sources:
  - source_description: >-
      REDCap study database at the University of Washington, holding participant-reported
      questionnaire responses and clinical data entered at the visit (medications assessment, vitals,
      visual acuity, contrast sensitivity, monofilament results, complete blood count results).
      Retained by the project; not publicly shared in raw form.
  - source_description: >-
      Native device exports from the retinal imaging instruments (Optomed Aurora, iCare EIDON,
      Heidelberg Spectralis, Heidelberg FLIO, Topcon Maestro2, Topcon Triton, Zeiss Cirrus 5000),
      stored locally at each site before conversion and upload. Retained by the project; not
      publicly shared in raw form.
  - source_description: >-
      Native exports from the at-home monitoring devices: Dexcom G6 continuous glucose monitor,
      Garmin Vivosmart 5 activity tracker, and the LeeLab Anura environmental sensor, downloaded by
      study staff after the devices are returned. Retained by the project; not publicly shared in
      raw form.
  - source_description: >-
      Central and local clinical laboratory result files: complete blood count from CLIA-certified
      laboratories local to each site, and all other blood and urine assays from the University of
      Washington Nutrition and Obesity Research Center, provided in .csv.
  - source_description: >-
      Electronic health records at the three health systems, used for pre-screening and for
      extraction of past health records, medications, and prior imaging; and Department of Licensing
      records for driving and accident history. Held under controlled access or retained internally.

raw_sources:
  - description: >-
      ECG raw export in .xml from the Philips PageWriter TC30, prior to conversion to the WaveForm
      DataBase (WFDB) format used in the release.
  - description: >-
      MoCA Duo application export in .csv containing total score, section subscores, Memory Index
      Score, and task completion times.
  - description: >-
      Topcon Maestro2 and Topcon Triton raw exports in .fda file format, converted to DICOM for the
      dataset.
  - description: >-
      Heidelberg FLIO raw export in .sdt file format, converted to DICOM for the dataset.
  - description: >-
      Garmin Vivosmart 5 raw export in .FIT file format, converted to the Open mHealth standard for
      the dataset.
  - description: >-
      Dexcom G6 and environmental sensor raw exports in .csv, and NORC blood and urine testing
      results in .csv.
  - description: >-
      Native DICOM output requiring no conversion from the Optomed Aurora, iCare EIDON, Heidelberg
      Spectralis, and Zeiss Cirrus 5000 devices.

preprocessing_strategies:
  - description: >-
      Mapping of clinical data to the Observational Medical Outcomes Partnership (OMOP) Common Data
      Model. Each CSV file in the clinical_data directory is a one-to-one mapping to an OMOP CDM
      table, and a dqd_omop.json file supports data quality analysis with the OMOP CDM Data Quality
      Dashboard, which runs more than 3,500 data quality checks against an OMOP CDM instance.
  - description: >-
      Conversion of imaging data to the DICOM standard. Images exported from devices in proprietary
      formats (.fda for Topcon Maestro2 and Triton, .sdt for Heidelberg FLIO) were converted to
      DICOM prior to release; other devices export DICOM natively.
  - description: >-
      Conversion of ECG waveforms to the WaveForm DataBase (WFDB) standard from the device .xml
      export.
  - description: >-
      Conversion of wearable device data to the Open mHealth standard: Garmin Vivosmart 5 .FIT files
      and Dexcom G6 continuous glucose monitor output are released as Open mHealth-conformant files.
  - description: >-
      Formatting of environmental sensor data following the NASA ASCII File Format Guidelines for
      Earth Science Data.
  - description: >-
      Organization of the whole dataset under the Clinical Dataset Structure (CDS) v0.1.1
      specification: one directory per datatype at the root, then one directory per modality, then
      one per device, then one per participant, with manifest.tsv metadata files per datatype and
      root-level CHANGELOG.md, dataset_description.json, dataset_structure_description.json,
      healthsheet.md, LICENSE.txt, participants.json, participants.tsv, README.md, and
      study_description.json.
  - description: >-
      Removal of protected health information and of sex, race/ethnicity, and medication information
      from the public release, and checking that no identifiable data per US HIPAA are present. The
      source materials give two differing accounts of this step: the Nature Metabolism comment and
      the README describe active stripping of PHI via the HIPAA Safe Harbor method and removal of
      sex, race/ethnicity, and medication information, whereas the structured dataset description
      records deIdentType "NoDeIdentification" and states that no active de-identification was
      necessary because no identifiers were collected. The same tension is recorded under
      is_deidentified.
  - description: >-
      Processing maturity changed across versions: version 1.0.0 (pilot) used custom or ad hoc
      processing, while versions 2.0.0 and 3.0.0 used a combination of automated and custom
      processing.

cleaning_strategies:
  - description: >-
      Range and credibility checks at data entry. Clinical data outside expected minimum/maximum
      ranges were flagged in REDCap and surfaced in reports viewed by clinical research coordinators
      and data managers, who examined participant records and determined whether an error was likely.
  - description: >-
      Skip-pattern verification. Records were checked for incorrect flow through prescribed skip
      patterns in the questionnaires.
  - description: >-
      Completion from within-record information. Missing data that could be directly filled from
      other portions of an individual's record were completed.
  - description: >-
      Detection of omitted and duplicated records.
  - description: >-
      Governance of edits. Editing was only done under the guidance and approval of the site
      principal investigator. If corrected data were available elsewhere in the respondent's answers
      the error was corrected; if there was no logical or appropriate way to correct the data, the
      site principal investigator reviewed the values and decided whether they should be removed.
  - description: >-
      Site-level quality control before upload. The data manager at each data site is responsible
      for the quality control of all data before uploading to FAIRhub.
  - description: >-
      No instances were excluded at the time of preprocessing; exclusions occur only through the
      study eligibility criteria.

file_collections:
