related_datasets:
  - relationship_type: IsNewVersionOf
    target_dataset: https://doi.org/10.60775/fairhub.2
    description: >-
      Version 2.0.0 of the Flagship Dataset of Type 2 Diabetes from the AI-READI Project, DOI
      10.60775/fairhub.2, released 8 November 2024 with 1,067 participants, 2.01 TB and 165,051
      files. The FAIRhub record for that version states that it is no longer accessible and directs
      users to the latest version.
  - relationship_type: IsNewVersionOf
    target_dataset: https://doi.org/10.60775/fairhub.1
    description: >-
      Version 1.0.0 of the Flagship Dataset of Type 2 Diabetes from the AI-READI Project, DOI
      10.60775/fairhub.1, released 3 May 2024 with 204 participants from the pilot data collection
      phase.
  - relationship_type: HasPart
    target_dataset: https://doi.org/10.60775/fairhub.4
    description: >-
      A distinct "Mini Version" of the dataset, DOI 10.60775/fairhub.4, comprising 100 participants
      and intended for pipeline development. It is recorded in the FAIRhub API metadata for this
      record as its child ("child": 4) and is described in the source materials as a separate record
      rather than a version of this dataset.

is_deidentified:
  description: >-
    The structured dataset description records deIdentType "NoDeIdentification" with deIdentDirect
    true and deIdentHIPAA true, and states: "No identifiers were collected so no active
    de-identification was necessary but we checked that no identifiable data per US HIPAA were
    present in the data." The Nature Metabolism comment states that the public set is stripped of
    Protected Health Information as defined by the HIPAA Privacy Rule via the "Safe Harbor" method,
    as well as of information related to the sex and race/ethnicity of participants to prevent
    stigmatization of findings; the README adds that medication information has also been removed.
    These two accounts differ in whether an active de-identification step was applied. Additional
    re-identification safeguards described for both the public and controlled sets are a robust data
    dissemination system, a strict licence agreement, and data watermarking. The healthsheet
    question on measures taken to avoid re-identification was left unanswered. A theoretical risk of
    future re-identification is acknowledged.

human_subject_research:
  description: >-
    The dataset derives from human subjects research. The study is an observational, cross-sectional
    cohort study registered at ClinicalTrials.gov as NCT06002048 and approved by the Institutional
    Review Board of the University of Washington under approval number STUDY00016228, with reliance
    agreements covering the IRBs of the University of Alabama at Birmingham and the University of
    California, San Diego. Initial IRB approval was received on 20 December 2022, and an annual
    renewal application on the status and progress of the study is required within 90 days of
    expiration. The FAIRhub oversight metadata records humanSubjectReviewStatus "Submitted,
    approved", isFDARegulatedDrug "No", isFDARegulatedDevice "No", and oversightHasDMC "No". Written
    informed consent is provided by all participants. Data were collected in the USA at three sites.
    A Community Advisory Board of 11 persons from the three sites, including diversity in race and
    ethnicity as represented in the AI-READI sample, contributes to the development of the protocol.

ethical_reviews:
  - description: >-
      University of Washington Institutional Review Board approval STUDY00016228, initially approved
      20 December 2022, with reliance agreements with the IRBs of the University of Alabama at
      Birmingham and the University of California, San Diego. The initial approval letter is
      published with the dataset documentation. Annual continuing review is required within 90 days
      of expiration. Note that the BMJ Open abstract labels STUDY00016228 as a "Clinicaltrials.org
      approval number", while the Methods section correctly identifies it as the IRB approval number.
  - description: >-
      Registration of the study on ClinicalTrials.gov under identifier NCT06002048.
  - description: >-
      Ethics, legal and social implications (ELSI) are considered at every stage of the project
      cycle, with guidance from bioethicists; the project team includes ethicists and an ELSI module,
      and the AI-readiness documentation includes a section on ethical practices.
  - description: >-
      Engagement with the Native Biodata Consortium and a planned tribal consultation, to address
      barriers and facilitators of participation and to evaluate tools such as data usage agreements,
      contract negotiations, transparent access agreements, and forms of assured return of benefit
      and sustainable input, control, and monitoring of Tribal data, with the goal of collecting
      similar data within a Native American cohort in an ethical and respectful manner.

collection_consents:
  - description: >-
      Informed consent to participate was required before participation in any part of the protocol,
      including questionnaires. Potential participants were given the option to read all consent
      documentation electronically (e-consent) before their visit and to give consent with an
      electronic signature without verbal communication with a clinical research coordinator.
      Participants could access e-consent documentation in REDCap and decide at that point not to
      participate or to request additional information.
  - description: >-
      For participants who did not select the option to consent electronically, consent was performed
      in person at the start of the visit, followed by completion of all questionnaires. Those
      without internet access could call research staff for alternative methods of enrolment.
  - description: >-
      The approved consent form for the principal project site, the University of Washington, is
      published with the dataset documentation. The other clinical sites had IRB reliance and used
      the same consent form, with minor institution-specific language incorporated depending on
      individual institutional requirements (for example, the State of California requires inclusion
      of the Experimental Subject's Bill of Rights at UCSD).

informed_consent:
  - description: >-
      Consent type and documentation. Written informed consent is provided by all participants,
      documented either by electronic signature in REDCap (the project's preferred route, which also
      allows participants to complete questionnaires before the visit and shorten visit duration) or
      on paper at the start of the in-person visit. Signed e-consent forms are automatically emailed
      to subjects, and additional copies can be requested from the study coordinator for the duration
      of the study.
  - description: >-
      Scope of consent. The consent covers deposition of data in an open-source repository and the
      sending of biospecimens to the study sample repository for use in future research; the consent
      form includes a table clarifying which information will be publicly available and which
      requires an application and approval process. Consent is also obtained for future contact,
      including invitation to a follow-up visit in year 4 of the project.
  - description: >-
      Withdrawal. Participants were permitted to withdraw consent at any time and cease study
      participation; this is clearly communicated in the consent document.
  - description: >-
      Consent-related access constraints on the released data. The dataset consent metadata records
      consentType "ConsentSpecifiedNotElsewhereCategorised" with the note that the public version of
      the dataset can only be used for type 2 diabetes related research while a private version will
      allow for more generic use; consentNoncommercial, consentGeogRestrict, consentResearchType,
      consentGeneticOnly, and consentNoMethods are all recorded as false.

collection_notifications:
  - description: >-
      Individuals were notified through personalised hardcopy invitation letters sent by mail and
      invitation emails, both directing them into the online REDCap recruitment interface using
      links, access codes, and QR codes. Letters were produced and mailed through Adapt Inc., an
      SSAE16 SOC security-certified and HIPAA-compliant printing and fulfillment service.
  - description: >-
      Within the REDCap interface, individuals could read an overview of the research programme,
      expectations for participation, and answers to Frequently Asked Questions; download the
      informed consent document; request a call back from study staff; complete a screening survey
      for qualification; and enroll by signing the electronic consent.
  - description: >-
      Follow-up phone calls and texts were made by research coordinators to those who did not respond
      to emails or mailings and to those who initiated contact. The healthsheet confirms that each
      individual was aware of the data collection, as this was active data collection directly from
      participants rather than passive collection or secondary use of existing data.

consent_revocations:
  - description: >-
      Participants were permitted to withdraw consent at any time and cease study participation.
      However, any data that had been shared or used up to that point would remain in the dataset.
      This limitation is clearly communicated in the consent document.

participant_compensation:
  - description: >-
      Study participants received a compensation of $200 for the study visit, paid through the grant
      funding. Payment is provided after receipt of the final data and return of the study devices,
      typically at least two weeks after the study visit to allow for the 10-day home monitoring
      period and mailing time. The payment is not prorated. The same type and amount of compensation
      is planned for participants invited back in year 4.
  - description: >-
      Travel support. The study covers reasonable costs for parking, public transit, or rideshare
      fees related to the study visit, and transportation assistance (rideshare services) was offered
      to participants who endorsed barriers to transporting themselves to study visits. The IRB
      protocol notes that participants may incur transport costs that will not be reimbursed if they
      exceed $25.

participant_privacy:
  - description: >-
      Device selection for privacy. The environmental sensor and Garmin fitness tracker were
      specifically chosen with participant privacy as a primary concern: they do not capture video or
      audio, are not equipped with GPS location monitoring, and are not synced with participant-owned
      devices.
  - description: >-
      Release-level protections. The public release contains no protected health information; sex,
      race/ethnicity, and medications are removed, in part to prevent stigmatization of findings.
      Data watermarking and a strict licence agreement are applied to both the public and controlled
      sets to deter re-identification attempts.
  - description: >-
      Procedural protections during collection. All study procedures were conducted in private rooms.
      All study data and identifiable information are kept on encrypted servers or in locked
      cabinets or rooms with restricted access at all sites, with access limited to authorized
      research personnel; the IRB protocol assigns the study University of Washington data security
      Level 3.
  - description: >-
      Results returned to participants are transmitted by HIPAA-compliant encrypted email, and
      participants access laboratory results through a secure portal using an individual access code.

distribution_dates:
  - description: >-
      Version 1.0.0, comprising data from the pilot data collection phase (204 participants),
      released 3 May 2024; DOI 10.60775/fairhub.1.
  - description: >-
      Version 2.0.0, comprising data collected through 31 July 2024 (1,067 participants), released
      8 November 2024; DOI 10.60775/fairhub.2. The FAIRhub record for this version now states that
      it is no longer accessible and directs users to the latest version.
  - description: >-
      Version 3.0.0, the current release (2,280 participants), made available on FAIRhub on
      17 November 2025; DOI 10.60775/fairhub.3; publication year 2025.

distribution_formats:
  - description: >-
      DICOM (application/dicom) for all retinal photography, OCT, OCTA, and FLIO image files,
      following the Digital Imaging and Communications in Medicine standard.
  - description: >-
      CSV (text/csv) for the OMOP Common Data Model clinical data tables, the environmental sensor
      ASCII files, and other tabular outputs.
  - description: >-
      JSON (application/json) for the Open mHealth-formatted wearable activity monitor and continuous
      glucose monitoring records and for the root-level metadata files dataset_description.json,
      dataset_structure_description.json, participants.json, study_description.json, and dqd_omop.json.
  - description: >-
      Markdown (text/markdown) for the root-level README.md, CHANGELOG.md, and healthsheet.md files.
  - description: >-
      Tab-separated values for the per-datatype manifest.tsv files and the root-level participants.tsv
      file that carries the recommended train/validation/test split assignment.
  - description: >-
      WaveForm DataBase (WFDB) files for the 12-lead electrocardiogram signal data.
  - description: >-
      Plain text for LICENSE.txt. All data files are in formats accessible with free software commonly
      used for such data types, so no specific software is required.

third_party_sharing:
  - description: >-
      The dataset is distributed publicly to third parties outside the creating institutions, through
      the FAIRhub platform (https://fairhub.io/), hosted on Microsoft Azure. Access requires logging
      in through a verified ID system, agreeing to use the data only for type 2 diabetes related
      research, and agreeing to the licence terms; the declared access type is
      "PublicDownloadSelfAttestationRequired".
  - description: >-
      A controlled-access release, containing more sensitive data than the public release (5-digit
      ZIP code, sex, race, ethnicity, genetic sequencing data, past health records, medications, and
      traffic and accident reports), is available only to scientists whose institutions have
      completed legal and privacy use agreements with the AI-READI research programme; requirements
      were being developed by the Data Access Committee at the time of the protocol publication.
  - description: >-
      Onward sharing by licensees is restricted. Licensees may not transfer, license, sublicense,
      sell, assign, display, share, or otherwise convey any portion of the data or any derivative
      work to any third party other than another licensee bound by an identical agreement, in which
      case access may be given to that other licensee and its employees, agents, and contractors for
      the purpose of collaborating on projects involving the data.
  - description: >-
      Biospecimens held in the biorepository at the University of Alabama at Birmingham Center for
      Clinical and Translational Science will eventually be available to scientists according to
      procedures and policies that were in development at the time of the protocol publication, with
      procedures for reviewing and prioritising written requests to be developed before the
      biorepository is complete.

license_and_use_terms:
  description: >-
    Version 3.0.0 is released under the "AI-READI custom license v2.0", identified by
    https://doi.org/10.5281/zenodo.17555036 and labelled "Health Data License" on the FAIRhub record.
    The licence terms were specifically tailored to enable reuse of the AI-READI dataset (and other
    clinical datasets) for commercial or research purposes while imposing strong requirements around
    data usage, security, and secondary sharing to protect study participants, especially when data
    are reused for AI and ML applications. The text of v2.0 is not included in the source materials;
    the source bundle contains the earlier University of Washington Data License Agreement v1.0
    (https://doi.org/10.5281/zenodo.10642459), whose terms are: a non-exclusive, non-transferable
    licence to download, reproduce, and use the data and to create derivative works for research and
    commercial purposes; a prohibition on conveying the data or derivative works to any party other
    than another identically bound licensee; permission to distribute models, algorithms, and
    programs trained on the data provided they do not themselves contain the data and provided all
    reasonable efforts are made to minimise memorization or reconstruction of the data; a prohibition
    on making clinical treatment decisions from the data and on any attempt to identify, contact, or
    harm a data subject; a requirement to acknowledge the source and any funder in publications and
    to follow the citation instructions at docs.aireadi.org; a requirement to comply with the NIH
    Genomic Data Sharing Policy security best practices; automatic termination on breach with
    deletion of all copies; retention of all title and intellectual property by the licensor; an
    "as is" warranty disclaimer; an indemnification obligation; a liability cap of one U.S. dollar in
    aggregate; and English as the language of the agreement. The AI-READI documentation itself is
    shared under CC-BY 4.0. The BMJ Open protocol article is published under CC BY-NC 4.0.

ip_restrictions:
  description: >-
    Under the data licence, title to the data and all industrial and intellectual property rights
    therein remain at all times solely and exclusively with the licensor (University of Washington in
    the v1.0 agreement) and its suppliers, and the licensee must not take any action inconsistent
    with such ownership. Any rights not expressly granted are reserved to the licensor and its
    suppliers. All full and partial copies of the data made by a licensee are subject to the terms of
    the agreement. The healthsheet answers the question about third-party IP-based restrictions by
    referring to the same licence. The IRB protocol states that there are no plans for the
    researchers collecting the dataset to develop commercial products or file patents, but that the
    dataset is made available with a commercial-friendly licence and products or patents may be
    developed from it in future.

regulatory_restrictions:
  description: >-
    No specific export control regime (such as ITAR or EAR) is identified in the source materials;
    the healthsheet answers the question about export controls and other regulatory restrictions by
    referring to the data licence. The licence requires the licensee to comply with all applicable
    laws, regulations, and restrictions relating to the distribution and use of the data and of
    models derived from it, and to comply with all data security and privacy standards established by
    the U.S. National Institutes of Health under its Genomic Data Sharing Policy, currently the NIH
    Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy. Handling of the
    underlying source records is governed by HIPAA; the released public dataset is asserted to
    contain no protected health information. The FAIRhub oversight metadata records that the study is
    not FDA-regulated with respect to either drugs or devices.

maintainers:
  - description: >-
      The AI-READI team supports and maintains the dataset. Contact information is provided in the
      README file included with the dataset and via https://aireadi.org/contact; the central study
      contact recorded in the structured metadata is Aaron Lee (contact@aireadi.org). The
      study_description.json and dataset_description.json metadata files included in the dataset
      carry additional information about the contact person or entity, authors, and contributors.
  - description: >-
      The dataset is hosted on FAIRhub (https://fairhub.io/), a cloud-based data management, curation,
      and sharing platform developed for this project and running on Microsoft Azure. FAIRhub is
      recorded as the publisher of the dataset. The FAIRhub record and the AI-READI documentation site
      both carry the notice "This repository is under review for potential modification in compliance
      with Administration directives."
  - description: >-
      The managing organization recorded in the dataset description metadata is "Washington University
      in St. Louis" with ROR https://ror.org/01yc7t268, which is also given as the lead sponsor. This
      conflicts with NIH RePORTER, which records the awardee organization for OT2OD032644 as the
      University of Washington, and with the data licence, whose licensor is the University of
      Washington.

updates:
  description: >-
    The dataset is released as static versions and is not updated in place. Rather than correcting or
    amending an existing release, new versions are released with additional instances as more study
    participants complete the study visit. New versions are planned approximately once a year with
    additional data from participants enrolled since the last release; enrollment is ongoing and
    future versions are expected to include larger numbers of participants. Changes between versions
    are documented in detail in the CHANGELOG file included with the dataset and mirrored at
    docs.aireadi.org. Documented changes to date: v1.0.0 pilot, 204 participants, 15+ data types,
    custom/ad hoc processing, released 3 May 2024; year 2 data added 863 participants and one imaging
    device (included in v2.0.0); year 3 data added 1,213 participants and three imaging devices
    (included in v3.0.0); v3.0.0 main study totals 2,280 participants with automated plus custom
    processing, released 17 November 2025. Version 3.0.0 also dropped the Snellen visual acuity
    variables and introduced the recommended train/validation/test split.

version_access:
  description: >-
    Every version of the dataset is minted with its own DOI and remains listed on the FAIRhub record:
    version 1.0.0, DOI 10.60775/fairhub.1, 3 May 2024; version 2.0.0, DOI 10.60775/fairhub.2,
    8 November 2024; version 3.0.0, DOI 10.60775/fairhub.3, 17 November 2025. One version of the
    documentation is associated with each version of the dataset, navigable from a dropdown at
    docs.aireadi.org (v1, v2, v3). The FAIRhub page and documentation for version 2.0.0 both state
    that this version of the dataset is no longer accessible and direct users to the latest version,
    so although older version records and DOIs are preserved, the older data themselves are not
    downloadable. The healthsheet answers the question about continued support of older versions with
    "N/A", on the grounds that the dataset is not updated and new versions are released instead.

retention_limit:
  description: >-
    There are no limits on the retention of the data associated with the instances; participants were
    not told that their data would be retained only for a fixed period and then deleted. The raw,
    pre-standardization data are saved and expected to be preserved by the AI-READI project at least
    for the duration of the project, but are not anticipated to be shared outside the project team at
    present because they have not been mapped to standardized terminologies and may accidentally
    include personal health or personally identifiable information in free-text fields. Under the
    data licence, a licensee whose agreement terminates for breach must delete all copies of the data
    in its possession and control and cease all use.

extension_mechanism:
  description: >-
    There is currently no mechanism for parties outside the project to extend, augment, or contribute
    to the AI-READI dataset; extension is limited to those involved in the project. The project does,
    however, publish its guidelines, code, and specifications for reuse by other data generation
    projects through the AI-READI GitHub organization (https://github.com/AI-READI), the Zenodo
    community (https://zenodo.org/communities/aireadi), and the Clinical Dataset Structure
    specification, and anticipates making the FAIRhub platform available for future data generation
    projects that wish to manage and share AI-ready clinical research datasets. Users may submit
    questions, suggestions, or feedback via https://aireadi.org/contact.

variables:
  - variable_name: N-terminal pro-B-type natriuretic peptide (NT-proBNP)
    description: EDTA plasma test; pg/mL; reference range varies by age; severity and outcome predictor of heart failure.
  - variable_name: Troponin-T
    description: EDTA plasma test; ng/L; reference range female <11, male <16; marker of myocardial injury.
  - variable_name: C-peptide
    description: EDTA plasma test; ng/mL; reference range 1.1-4.4; indicator of insulin production.
  - variable_name: Insulin
    description: EDTA plasma test; ng/mL; reference range 0.0-24.9; marker for diabetes.
  - variable_name: C-reactive protein, high sensitivity
    description: Serum test; mg/L; reference range 0.0-10.0; inflammation marker and risk factor for T2DM.
  - variable_name: Total cholesterol
    description: Serum test; mg/dL; reference range <200; cardiovascular disease risk factor.
  - variable_name: Triglycerides
    description: Serum test; mg/dL; reference range <150; cardiovascular disease risk factor.
  - variable_name: High-density lipoprotein cholesterol
    description: Serum test; mg/dL; reference range >39; cardiovascular disease risk factor.
  - variable_name: Low-density lipoprotein cholesterol (calculated)
    description: Serum test; mg/dL; reference range <130; cardiovascular disease risk factor.
  - variable_name: Glucose
    description: Serum test; mg/dL; reference range 62-125; marker for diabetes.
  - variable_name: Blood urea nitrogen
    description: Serum test; mg/dL; reference range 8.0-21.0; marker for kidney and liver function.
  - variable_name: Creatinine
    description: Serum test; mg/dL; reference range female 0.38-1.02, male 0.51-1.18; marker for kidney function.
  - variable_name: Blood urea nitrogen/creatinine ratio
    description: Serum test, calculated; indicator of kidney function.
  - variable_name: Sodium
    description: Serum test; mEq/L; reference range 135-145; marker of metabolic health.
  - variable_name: Potassium
    description: Serum test; mEq/L; reference range 3.6-5.2; marker of metabolic health.
  - variable_name: Chloride
    description: Serum test; mEq/L; reference range 98-108; marker of metabolic health.
  - variable_name: Carbon dioxide, total
    description: Serum test; mEq/L; reference range 22-32; marker of metabolic health.
  - variable_name: Calcium
    description: Serum test; mg/dL; reference range 8.9-10.2; marker of metabolic health.
  - variable_name: Protein, total
    description: Serum test; g/dL; reference range 6.0-8.2; useful tool for overall health status.
  - variable_name: Albumin
    description: Serum test; g/dL; reference range 3.5-5.2; useful tool for overall health status.
  - variable_name: Globulin, total (calculated)
    description: Serum test; g/dL; useful tool for overall health status.
  - variable_name: A/G ratio (calculated)
    description: Serum test, albumin-to-globulin ratio; useful tool for overall health status.
  - variable_name: Bilirubin, total
    description: Serum test; mg/dL; reference range 0.2-1.3; marker of liver health.
  - variable_name: Alkaline phosphatase
    description: Serum test; IU/L; reference range varies by age; marker of liver health.
  - variable_name: Aspartate aminotransferase (AST)
    description: Serum test; IU/L; reference range 9-38; marker of liver health.
  - variable_name: Alanine aminotransferase (ALT)
    description: >-
      Serum test; IU/L; reference range female age 7-33 and male age 0-49: 10-64; male age 50+:
      10-48; marker of liver health.
  - variable_name: HbA1c
    description: Whole blood test; percent; reference range 4.0-6.0; marker for diabetes.
  - variable_name: White blood cell count
    description: Whole blood test (complete blood count); x10E3/microlitre; reference range 3.4-10.8.
  - variable_name: Red blood cell count
    description: Whole blood test (complete blood count); x10E6/microlitre; reference range 3.77-5.80.
  - variable_name: Haemoglobin
    description: Whole blood test (complete blood count); g/dL; reference range 11.1-17.7.
  - variable_name: Haematocrit
    description: Whole blood test (complete blood count); percent; reference range 34.0-51.0.
  - variable_name: Mean corpuscular volume (MCV)
    description: Whole blood test (complete blood count); fL; reference range 79-97.
  - variable_name: Mean corpuscular hemoglobin (MCH)
    description: Whole blood test (complete blood count); pg; reference range 26.6-33.0.
  - variable_name: Mean corpuscular hemoglobin concentration (MCHC)
    description: Whole blood test (complete blood count); g/dL; reference range 31.5-35.7.
  - variable_name: Red cell distribution width (RDW)
    description: Whole blood test (complete blood count); percent; reference range 11.6-15.4.
  - variable_name: Platelets
    description: Whole blood test (complete blood count); x10E3/microlitre; reference range 150-450.
  - variable_name: Urine creatinine
    description: Urine test; mg/dL; urinary biomarker for early diabetic nephropathy.
  - variable_name: Urine albumin
    description: Urine test; mg/dL; urinary biomarker for early diabetic nephropathy.
  - variable_name: Height
    description: Physical measurement taken at the in-person visit.
  - variable_name: Weight
    description: Physical measurement taken at the in-person visit.
  - variable_name: Waist circumference
    description: Physical measurement taken at the in-person visit; used to compute the waist-hip ratio.
  - variable_name: Hip circumference
    description: Physical measurement taken at the in-person visit; used to compute the waist-hip ratio.
  - variable_name: Waist-hip ratio
    description: Calculated from measured waist and hip circumference.
  - variable_name: Body mass index
    description: Calculated from measured height and weight.
  - variable_name: Systolic blood pressure
    description: >-
      Measured twice, separated by 2 minutes, with an automatic oscillometric medically approved
      device. Readings over 180 mm Hg, or under 100 mm Hg with symptoms of haemodynamic instability,
      trigger an emergency care recommendation.
  - variable_name: Diastolic blood pressure
    description: >-
      Measured twice, separated by 2 minutes. Readings greater than 120 mm Hg, or less than 60 mm Hg
      with symptoms of haemodynamic instability, trigger an emergency care recommendation.
  - variable_name: Heart rate
    description: >-
      Measured twice at the visit and also derived from ECG and the wearable monitor. Readings above
      100 bpm or below 60 bpm, if not known to be usual and with symptoms of haemodynamic
      instability, trigger an emergency care recommendation.
  - variable_name: Monofilament test result
    description: >-
      Peripheral neuropathy assessment; touch perception with a 10 g filament at three locations on
      each foot, ten times per location, with the participant's eyes closed; insensate areas retested
      for confirmation.
  - variable_name: Montreal Cognitive Assessment (MoCA) total score
    description: >-
      General cognitive screener administered on iPad via the MoCA Duo application; total possible
      score 30, higher numbers representing better performance. Section subscores, Memory Index
      Score, and task completion times are also recorded.
  - variable_name: Photopic letter visual acuity
    description: >-
      Best-corrected, measured separately for each eye under daylight conditions with the M&S
      Electronic Visual Acuity tester and expressed as logMAR; lower numbers indicate better
      resolution. Snellen equivalents present in earlier dataset versions were dropped in v3.0.0.
  - variable_name: Mesopic letter visual acuity
    description: >-
      Best-corrected acuity measured while viewing the display through a 2.0 neutral density filter
      that reduces the test to a mesopic (dim light) level; expressed as logMAR.
  - variable_name: Photopic letter contrast sensitivity
    description: >-
      Measured monocularly with the Mars letter contrast sensitivity chart under photopic conditions;
      expressed as log sensitivity, with higher numbers meaning better sensitivity.
  - variable_name: Mesopic letter contrast sensitivity
    description: >-
      Measured with the Mars chart while viewing through a 2.0 neutral density occluder; expressed as
      log sensitivity.
  - variable_name: Autorefraction
    description: >-
      Spherical and cylindrical components expressed as dioptres with cylindrical axis, obtained for
      each eye with the Topcon KR 800 autorefractor.
  - variable_name: Interstitial blood glucose
    description: >-
      Continuous glucose monitoring measurement in mg/dL recorded every 5 minutes over the 10-day
      at-home period by the Dexcom G6.
  - variable_name: Step count
    description: Number of steps recorded by the Garmin Vivosmart 5 physical activity monitor.
  - variable_name: Sleep duration and phases
    description: >-
      Sleep duration (circadian and diurnal rhythm) and sleep phases recorded by the Garmin
      Vivosmart 5.
  - variable_name: Oxygen saturation (SpO2)
    description: Peripheral oxygen saturation recorded by the Garmin Vivosmart 5.
  - variable_name: Respiratory rate
    description: Respiration rate recorded by the Garmin Vivosmart 5.
  - variable_name: Stress level
    description: Stress level metric recorded by the Garmin Vivosmart 5.
  - variable_name: Physical activity calories
    description: Calorie expenditure derived from the Garmin Vivosmart 5 activity data.
  - variable_name: Ambient temperature
    description: Indoor temperature recorded by the LeeLab Anura environmental sensor over 10 days.
  - variable_name: Relative humidity
    description: Indoor relative humidity recorded by the LeeLab Anura environmental sensor.
  - variable_name: Nitrogen oxides (NO and NO2)
    description: >-
      Indoor nitrogen oxide levels recorded by the LeeLab Anura environmental sensor; reported using
      the Sensirion NOx Index.
  - variable_name: Volatile organic compounds
    description: Indoor volatile organic compound levels recorded by the LeeLab Anura environmental sensor.
  - variable_name: Particulate matter
    description: >-
      Indoor particulate matter concentrations at PM1.0, PM2.5, PM4, and PM10 size fractions,
      recorded by the LeeLab Anura environmental sensor.
  - variable_name: Multi-spectral light intensity
    description: >-
      Eleven multi-spectral light intensity measurements recorded by the LeeLab Anura environmental
      sensor.
  - variable_name: Depressive symptoms (CES-D-10)
    description: >-
      Center for Epidemiological Studies Depression Scale, 10-item short form; screens for
      depressive symptoms.
  - variable_name: Diabetes-related emotional distress (PAID-5)
    description: >-
      Problem Areas in Diabetes short-form questionnaire; diabetes-associated injuries, lifestyle
      changes, and medical care.
  - variable_name: Diabetes self-care score
    description: >-
      Diabetes Score questionnaire focusing on diabetes self-management, querying dietary habits,
      exercise, healthcare, and foot care.
  - variable_name: Dietary assessment
    description: Brief dietary assessment about food and drink habits over the past few months.
  - variable_name: Social determinants of health
    description: >-
      PhenX Toolkit-derived surveys on food and job insecurity, educational attainment, health
      insurance coverage, access to healthcare, housing and neighbourhood environment, perceptions of
      discrimination in medical settings, and racial/ethnic discrimination (current and lifetime).
  - variable_name: Smoking, alcohol, vaping and marijuana use history
    description: >-
      History of each of these behaviours. Marijuana use is not assessed for participants living in
      Alabama because it is an illegal substance there.
  - variable_name: Ophthalmic survey
    description: Self-reported difficulties with vision and recent eye care.
  - variable_name: General health history
    description: >-
      Self-reported chronic health conditions elicited by the question "Has a doctor or other
      healthcare professional ever told you that you have/had?" with yes/no responses and optional
      specification.

external_resources:
  - description: >-
      Dataset documentation site, https://docs.aireadi.org/ (version-specific pages for v1.0.0,
      v2.0.0, and v3.0.0). Complements the FAIRhub landing page; recommended reading before accessing
      the dataset. Contains the citation instructions, preliminary information on access and training
      prerequisites, the Healthsheet, per-domain documentation, AI-readiness and FAIR/ethics material,
      controlled-variable listings, a changelog, and additional resources. Shared under CC-BY 4.0.
      Recorded in the dataset metadata with relationType "IsDocumentedBy".
  - description: >-
      AI-READI project website, https://aireadi.org/, including the team roster (https://aireadi.org/team),
      the data-sharing goals page (https://aireadi.org/goals/data-sharing), and the contact page.
      Recorded in the dataset metadata with relationType "IsDocumentedBy".
  - description: >-
      Study protocol publication: Owsley C, Matthies DS, McGwin G, et al. "Cross-sectional design and
      protocol for Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI)."
      BMJ Open 2025;15:e097449. doi:10.1136/bmjopen-2024-097449.
  - description: >-
      Project description publication: AI-READI Consortium. "AI-READI: rethinking AI data collection,
      preparation and sharing in diabetes research and beyond." Nature Metabolism 2024;6:2210-2212.
      doi:10.1038/s42255-024-01165-x.
  - description: >-
      Data licence record on Zenodo: AI-READI custom licence v2.0, https://doi.org/10.5281/zenodo.17555036;
      earlier licence v1.0 at https://doi.org/10.5281/zenodo.10642459 (Contreras J, et al. "License
      terms for reusing the AI-READI dataset", Zenodo, 2024).
  - description: >-
      AI-READI GitHub organization, https://github.com/AI-READI, holding project code and guidelines.
  - description: >-
      AI-READI Zenodo community, https://zenodo.org/communities/aireadi, holding project outputs and
      guidelines.
  - description: >-
      Clinical Dataset Structure (CDS) specification v0.1.1,
      https://cds-specification.readthedocs.io/en/v0.1.1/, the standard developed by the project for
      organizing clinical research datasets and including structured metadata.
  - description: >-
      NIH RePORTER project record for award OT2OD032644, "Bridge2AI: Salutogenesis Data Generation
      Project", https://reporter.nih.gov/project-details/10471118 (application ID 10471118) and
      https://reporter.nih.gov/search/yatARMM-qUyKAhnQgsCTAQ/project-details/10885481.
  - description: >-
      ClinicalTrials.gov registration NCT06002048,
      https://classic.clinicaltrials.gov/ct2/show/NCT06002048.
  - description: >-
      NIH Bridge2AI Common Fund program pages, https://bridge2ai.org and
      https://commonfund.nih.gov/bridge2ai.
  - description: >-
      Study instruments published with the documentation: the REDCap surveys and forms PDF
      (https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf), the University of Washington
      IRB initial approval letter, and the approved consent form.
  - description: >-
      Environmental sensor reference: Shaffer J, Gim N, Wei R, et al. "Portable environmental sensor
      enabling studies of exposome on ocular health." Invest Ophthalmol Vis Sci 2024;65:6370.
  - description: >-
      AI-READI research internship programme, https://shileyeye.ucsd.edu/research/ai_readi, a
      year-long training programme comprising a two-week data science and programming bootcamp
      followed by a curriculum of didactic lectures and mentored research; the inaugural 2023-2024
      cohort of 10 interns was 70% women, 30% Black, and 50% from backgrounds under-represented per
      NIH criteria.