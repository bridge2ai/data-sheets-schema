id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, cross-sectional dataset collected from 2,280 participants with and without
  type 2 diabetes mellitus (T2DM), harmonized across three United States data collection sites
  (University of Alabama at Birmingham, University of California San Diego, and University of
  Washington). Data were collected between 19 July 2023 and 1 May 2025 for this version and
  span survey data, clinical measurements, blood and urine laboratory results, 12-lead
  electrocardiography, retinal photography, optical coherence tomography (OCT), OCT angiography
  (OCTA), fluorescence lifetime imaging ophthalmoscopy (FLIO), continuous glucose monitoring,
  wearable activity monitoring, and indoor environmental sensing. The dataset was designed to be
  "AI-ready" and hypothesis-agnostic, with recruitment sampling aimed at approximately equal
  distribution of participants across diabetes severity, self-reported race/ethnicity, and sex,
  in order to support downstream artificial intelligence and machine learning research into
  salutogenesis (the pathway from disease back to health) in T2DM. The publicly released version
  contains no protected health information; information on sex, race/ethnicity, and medications
  used has been removed and is held under controlled access. Note that the project acronym
  AI-READI is expanded inconsistently across the source materials: the BMJ Open protocol and the
  Nature Metabolism comment give "Artificial Intelligence Ready and Equitable Atlas for Diabetes
  Insights", whereas NIH RePORTER, the FAIRhub study metadata, and the dataset README give
  "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights" / "AI Ready and
  Exploratory Atlas for Diabetes Insights".
