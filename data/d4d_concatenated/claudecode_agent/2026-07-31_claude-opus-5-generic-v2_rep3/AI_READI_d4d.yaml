    description: >-
      Electrocardiogram data collected using the 12-lead protocol on the Philips PageWriter TC30.
      Files follow the WaveForm DataBase (WFDB) standard. Organized as modality ecg_12lead, device
      philips_tc30, with a manifest.tsv metadata file.
    file_count: 4515
    total_bytes: 302931703
  - id: https://fairhub.io/datasets/3#clinical_data
    description: >-
      Clinical data collected through REDCap, including blood and urine laboratory values and survey
      data. Each CSV file is a one-to-one mapping to an OMOP Common Data Model table; a dqd_omop.json
      quality file accompanies the directory.
    file_count: 7
    total_bytes: 176182781
  - id: https://fairhub.io/datasets/3#environment
    description: >-
      Indoor environmental data collected with the custom-built LeeLab Anura sensor. Files follow
      the NASA ASCII File Format Guidelines for Earth Science Data. Organized as modality
      environmental_sensor, device leelab_anura.
    file_count: 2232
    total_bytes: 55625676514
  - id: https://fairhub.io/datasets/3#retinal_flio
    description: >-
      Fluorescence lifetime imaging ophthalmoscopy (FLIO) data, an imaging modality for in vivo
      measurement of lifetimes of endogenous retinal fluorophores. DICOM format; modality flio,
