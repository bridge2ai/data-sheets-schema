source_caveats: >-
  Every Dataverse release page and both cm4ai.org pages carry the notice "This
  repository is under review for potential modification in compliance with
  Administration directives", so the holdings this record describes may change
  for reasons unrelated to the science. The project summary figure of 21.4 TB
  is much larger than the sum of the file sizes displayed on the Dataverse
  releases, which are in the tens of gigabytes; the release records state that
  raw sequencing and raw mass spectrometry data are held in external
  repositories, so the two figures are not describing the same holdings and
  neither is asserted as a total for the other. The repository records the same
  Data Creation Date of 2025-02-27 on every release, including the June 2026
  release whose own files are published in June and July 2026, so that field is
  a repeated repository value rather than a per-release fact and no creation
  date is asserted for any release. The bundle also names an
  earlier release, "Cell Maps for Artificial Intelligence - Data Release"
  (10.18130/V3/DXWOS5), only through the project preprint; no repository record
  for it is present, so only its title, DOI and version are stated here.

purposes:
- name: Ethical AI-ready datasets of cell architecture
  response: >-
    To produce ethical, AI-ready datasets of cell architecture, inferred from
    multimodal data collected for human cell lines, to enable transformative
    biomedical AI research.
  description: >-
    CM4AI states this as its overarching mission as the Functional Genomics Data
    Generation Project of the NIH Bridge2AI program. It defines AI-ready
    biomedical data as fully characterized FAIR data of known provenance that
    can be ethically and reliably processed by AI applications, whose models and
    software are available and well described for validation and reuse, and
    whose predictions can be fully explained and interpreted to the user.
- name: Interpretable genotype-phenotype learning
  response: >-
    To map the spatiotemporal architecture of human cells and use these maps
    toward the grand challenge of interpretable genotype-phenotype learning.
  description: >-
    The project describes a coordinated effort across three complementary
    mapping approaches that creates a library of large-scale maps of cellular
    structure and function across demographic and disease contexts, intended to
    stimulate research and development in "visible" machine learning systems
    informed by multi-scale cell and tissue architecture.

tasks:
- name: Multimodal interrogation of disease-relevant proteins
  response: >-
    To deliver machine-readable hierarchical maps of cell architecture as
    AI-ready data produced from multimodal interrogation of 100 chromatin
    modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric,
    and cardiac disorders in disease-relevant cell lines under perturbed and
    unperturbed conditions.
  description: >-
    The interrogation uses mass spectrometry based proteomics, spatial
    proteomics and cell imaging, and genetic perturbation using CRISPR.
- name: Three complementary mapping approaches
  response: >-
    To launch a coordinated effort involving three complementary mapping
    approaches — proteomic mass spectrometry, cellular imaging, and genetic
    perturbation via CRISPR/Cas9.
  description: >-
    Stated as the mapping strategy of the funded data generation project on its
    NIH project record.

addressing_gaps:
- name: Black-box genotype-phenotype models
  response: >-
    In genomics and precision medicine, machine learning models are often "black
    boxes", predicting phenotypes from genotypes without understanding the
    mechanisms by which such translation occurs.
  description: >-
    The project positions its resource of matched data and tools as the material
    needed to build "visible" machine learning systems that are built directly
    on knowledge maps of cell and tissue architecture rather than being opaque.

