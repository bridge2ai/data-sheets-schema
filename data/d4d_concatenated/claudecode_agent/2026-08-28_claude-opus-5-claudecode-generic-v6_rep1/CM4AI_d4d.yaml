id: https://cm4ai.org/
name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI)
description: >-
  CM4AI is the Functional Genomics Data Generation Project in the U.S. National
  Institutes of Health Bridge2AI program. Its stated mission is to produce
  ethical, AI-ready datasets of cell architecture, inferred from multimodal data
  collected for human cell lines, and it delivers machine-readable hierarchical
  maps of cell architecture together with quarterly data releases of the
  map-input data streams. Three complementary mapping approaches supply those
  streams: proteomic mass spectrometry, cellular imaging, and genetic
  perturbation via CRISPR/Cas9. The measurements interrogate chromatin
  modifiers, metabolic enzymes, and other proteins implicated in cancer,
  neuropsychiatric, and cardiac disorders, in two disease-relevant cell lines
  under perturbed and unperturbed conditions: the MDA-MB-468 triple-negative
  breast cancer line, untreated and treated with paclitaxel or vorinostat; and
  the KOLF2.1J induced pluripotent stem cell line, undifferentiated and
  differentiated into neural progenitor cells, neurons, and cardiomyocytes.
  Input streams are integrated by the Multi-Scale Integrated Cell (MuSIC)
  software pipeline, which uses deep learning models and community detection
  algorithms, and outputs are packaged with provenance graphs and rich metadata
  as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework. The
  project summarizes its holdings as 53,788 immunofluorescent images, 1,374
  protein interactions, 7,023 total proteins investigated, 11,739 genes
  targeted, and 21.4 TB of data. Releases are deposited in LibraData, the
  University of Virginia's instance of Dataverse and an NIH-approved generalist
  repository, and are cataloged on the project's own web portal.
