preprocessing_strategies:
- name: MuSIC data integration and map production pipeline
  preprocessing_details: >-
    The Multi-Scale Integrated Cell (MuSIC) pipeline produces integrated cell
    maps from the multimodal input streams in five steps. Protein-protein
    interaction networks and immunofluorescence images for the cell line and
    conditions are downloaded from the generating laboratories' deposition
    archives. Interaction networks are reduced in dimensionality with the
    node2vec deep learning model to produce a protein-protein interaction
    embedding, and images with a Human Protein Atlas deep learning model to
    produce an image embedding carrying protein localization. The two embeddings
    are integrated into a per-protein co-embedding by contrastive deep learning,
    trained so that the original embeddings can be reconstructed with minimal
    information loss and proteins with similar inputs receive similar
    co-embeddings. Community detection over all-by-all protein similarities in
    the co-embedding space yields a hierarchy of protein communities, which is
    the final cell map. The pipeline is divided into segments, each of which
    calls the FAIRSCAPE client package to validate inputs and create the output
    RO-Crate package for that segment.
  used_software:
  - id: https://github.com/idekerlab/cellmaps_pipeline
    name: Cell Mapping Toolkit
    url: https://github.com/idekerlab/cellmaps_pipeline
    description: >-
      A series of Python packages implementing the end-to-end pipeline, with
      steps for processing the protein imaging and biophysical interaction
      datasets, embedding the input modalities, integrating them, constructing
      the hierarchical cell map, and annotating it against known resources. Each
      package is pip-installable, with documentation hosted at
      https://cellmaps-pipeline.readthedocs.io/.
  - id: https://github.com/eliorc/node2vec
    name: node2vec
    url: https://github.com/eliorc/node2vec
    description: >-
      Deep learning model used to represent each protein as a feature vector
      based on its protein-protein interaction neighborhood.
- name: AI-readiness packaging with FAIRSCAPE
  preprocessing_details: >-
    Output data are packaged with provenance graphs and rich metadata as
    AI-ready datasets in RO-Crate format using an extended, client-server
    version of the FAIRSCAPE framework. The client-side package, FAIRSCAPE-CLI,
    is called when a computation or coherent set of computations completes and
    is passed metadata defining JSON-Schema schemas for the datasets in the
    computational unit as well as its inputs, computations, software, models and
    outputs; it creates an RO-Crate package holding those components or
    resolvable references to them, together with stubs for identifier creation.
    The RO-Crates are sent to the FAIRSCAPE server, which registers them and
    assigns persistent, resolvable, globally unique identifiers under the ARK
    scheme, then decomposes them into their component datasets, models and
    software and registers those in turn. The server finally computes end-to-end
    entailments on each RO-Crate's provenance as expressed in the EVI Evidence
    Graph Ontology and links them together where possible. Identifiers resolve
    to machine- and human-readable landing pages carrying the metadata in
    JSON-LD using vocabularies from Schema.org, EVI and other public ontologies,
    with alternate JSON-LD and RDF-XML serializations offered.
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    url: https://fairscape.github.io
    license: MIT
    description: >-
      Client-side and server-side Python 3 packages, both pip-installable and
      freely available under the MIT open source license. Copyright is held by
      the Rector and Board of Visitors of the University of Virginia.
- name: Integrative structure modeling of map communities
  preprocessing_details: >-
    The project developed a bioinformatics pipeline that annotates MuSIC
    communities by the structural information available about their members and
    interactions, drawing on the Protein Data Bank, the AlphaFold Protein
    Structure Database, crosslinking mass spectrometry, and prediction of
    disordered sequence segments, then ranks communities by the amount of
    available structural information as a proxy for the feasibility of
    integrative structure modeling. Modeling of top-ranked communities proceeds
    through four stages: gathering input information; representing subunits and
    translating data into spatial restraints; configurational sampling to
    produce an ensemble of models satisfying the restraints; and analyzing and
    validating the input information and the models. The protocol is scripted
    using the Python Modeling Interface package.
  used_software:
  - id: https://integrativemodeling.org
    name: Integrative Modeling Platform (IMP)
    version: '2.18'
    url: https://integrativemodeling.org
    description: >-
      Open-source package for modeling macromolecular complexes, on which the
      Python Modeling Interface library is based.

labeling_strategies:
- name: Cell map assembly annotation
  data_annotation_protocol: >-
    Cell maps are annotated in a two-pronged approach. First they are aligned to
    known protein function and pathway resources, including the Gene Ontology
    and Reactome, to determine which protein assemblies in the map overlap
    substantially with known cell biology. Second, assemblies are annotated
    using a large language model approach developed by the project to name sets
    of proteins and assign a confidence score to each name.
  labeling_details: >-
    In the project's published application of this approach, an engineered
    prompt following chain-of-thought and one-shot strategies elicits a
    descriptive name, a confidence score and a referenced analysis essay giving
    the model's rationale for each assembly, and a separate citation module
    constructs PubMed queries from gene symbols and functional keywords in that
    essay and asks the model to select publications that support its factual
    statements. Names proposed with sufficient confidence were then passed to a
    human curation team for final naming determination, working in in-person
    annotation jamborees in which about a dozen individuals worked in pairs to
    assign names and putative functional roles on the basis of expert knowledge
    and literature curation.
  source_caveats: >-
    This is the project's declared annotation method for the cell maps it
    produces. The releases described in this record state that computed cell
    maps are not included in them, so no released file carries these
    annotations.

machine_annotation_tools:
- name: Large language model assembly naming
  tools:
  - GPT-4 unknown
  tool_descriptions: >-
    A generative large language model used through the project's Gene Set AI
    pipeline to propose a descriptive name, a confidence score and a supporting
    rationale for each protein assembly in a cell map.

existing_uses:
- name: Uses reported by the project
  examples:
  - >-
    The project's Data Module completed parallel maps of protein-protein
    interactions, protein subcellular distributions, and transcriptional states
    associated with a near-comprehensive set of chromatin regulators encoded by
    the human genome, generated in ethically sourced breast cancer cells.
  - >-
    The CRISPRi perturbation cell atlas in KOLF2.1J induced pluripotent stem
    cells released here is reported in a companion preprint, "A perturbation
    cell atlas of human induced pluripotent stem cells"
    (https://doi.org/10.1101/2024.11.03.621734), which every release cites as a
    related publication.
  - >-
    Initial datasets, tools and standards from all three mapping platforms were
    made available at the project's CodeFest in March 2024, accompanied by
    tutorials explaining how the data were derived and integrated and by
    production-ready software for producing the datasets.

intended_uses:
- name: Intended uses stated on the releases
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - >-
    Cell architectural changes and interactions in presence of specific disease
    processes, treatment conditions, or genetic perturbations
  usage_notes: >-
    The releases note that the current release is most suitable for
    bioinformatics analysis of the individual datasets and requires domain
    expertise for meaningful analysis.
  use_category: research
- name: Visible machine learning
  examples:
  - >-
    Enabling the creation of "visible" machine learning systems, which are not
    black boxes but are built directly on knowledge maps of cell and tissue
    architecture.
  - >-
    Downstream applications in human genomics, including interpretation of
    genetic variants and mutations, for example in visible neural networks that
    interrogate how protein assemblies in the cell affect cell-level phenotype
    predictions.
  use_category: research

prohibited_uses:
- name: Clinical decision-making and patient care
  prohibition_reason: >-
    The releases state that these laboratory data are not to be used in clinical
    decision-making or in any context involving patient care without appropriate
    regulatory oversight and approval.
- name: Commercial use without a separate license
  prohibition_reason: >-
    The data are licensed under Creative Commons Attribution-NonCommercial-
    ShareAlike 4.0 International, under which the material may not be used for
    commercial purposes; the project states that commercial use requires a
    separate license negotiation with the copyright holder, which is UCSD,
    Stanford, or UCSF depending on the specific data package.

future_use_impacts:
- name: Anticipating applications and governing their risks
  impact_details: >-
    The project's ethical criteria require anticipating potential applications
    of the data and of the AI and machine learning systems derived from them,
    integrating those applications into data governance frameworks so as to
    optimize benefits and mitigate potential risks, and promoting their use for
    the collective good. The Ethics team is formulating a CM4AI Life Cycle
    framework intended to set out governance milestones through data generation
    and AI system development, and is developing tools to raise awareness of the
    ethical, legal and social ramifications of the data and the systems built on
    them.

distribution_formats:
- name: Dataverse release packages
  format: ZIP archives and RO-Crate metadata deposited in a Dataverse repository
  media_type: application/zip
  access_urls:
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/K7TGEM
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
  download_url: https://dataverse.lib.virginia.edu/api/access/datafile/
  description: >-
    Releases are deposited in LibraData, the University of Virginia's instance
    of Dataverse and an NIH-approved generalist repository. Every file in every
    release is marked public. Each release record states that the dataset is too
    large to download as a whole and that files must be selected individually
    from the files table; files above the repository's browser download limit
    must be retrieved through the Data Access API, whose datafile endpoint is
    given here, using a download manager or wget rather than a web browser.
- name: RO-Crate AI-ready packaging
  format: RO-Crate
  description: >-
    Output data are distributed as RO-Crate packages carrying the datasets,
    metadata and software or resolvable references to them, together with
    machine-readable provenance graphs and persistent identifiers. The June 2025
    release ships a release-level RO-Crate with pointers to sub-crates and an
    HTML datasheet summarizing key release information, alongside per-component
    RO-Crate metadata and provenance graph files.
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    url: https://fairscape.github.io
    license: MIT

distribution_dates:
- name: Dataverse release publication dates
  release_dates:
  - '2025-03-03'
  - '2025-07-01'
  - '2025-10-31'
  - '2026-06-17'
  description: >-
    Publication dates recorded in the citation metadata of the March 2025, June
    2025, October 2025 and June 2026 releases respectively. The project's data
    releases page additionally names a May 2024 release, for which the bundle
    records no publication date.
  source_caveats: >-
    The project's data releases page displays the June 2026 release with
    "Released on: June 17, 2025". The Dataverse record for that release, which
    is the release describing itself and outranks project documentation under
    the input manifest's source priority, gives a publication date of
    2026-06-17; that is the date stated here. The individual files of that
    release are published on 2026-06-17 and 2026-07-15, consistent with the
    Dataverse date and not with the 2025 date.

third_party_sharing:
- name: Public distribution
  is_shared: true
  description: >-
    The project states that its datasets and software are available to the
    research community under minimally restrictive terms consistent with ethical
    guidelines, researcher attribution and research integrity, and that initial
    datasets, tools and standards are publicly available at the CM4AI web
    portal. Every file in the Dataverse releases is marked as having public file
    access.

license_and_use_terms:
  name: CC BY-NC-SA 4.0
  license_terms: >-
    Data packages are licensed under the Creative Commons
    Attribution-NonCommercial-ShareAlike 4.0 International license
    (https://creativecommons.org/licenses/by-nc-sa/4.0/). The license permits
    copying and redistributing the material in any medium or format and
    remixing, transforming and building upon it, on three conditions:
    attribution, with appropriate credit, a link to the license and an
    indication of whether changes were made; non-commercial use, where a
    commercial use is one primarily intended for commercial advantage or
    monetary compensation; and share-alike, under which contributions built on
    the material must be distributed under the same license. No additional legal
    or technological restrictions may be applied that would legally restrict
    others from doing what the license permits. The project states that
    attribution is required to the copyright holders and to the authors, and
    that publications referencing the data or derived products should cite both
    the related publication and the data collection itself. Commercial use
    requires a separate license negotiation with the copyright holder. Two
    further sets of terms sit alongside the license. The repository states its
    own community norms, under which proper credit is expected via citation
    using the data citation shown on the dataset page. Separately, the Bridge2AI
    Data Sharing and Dissemination Working Group developed a Code of Conduct
    setting out basic requirements that participants in the Bridge2AI Open House
    attest and commit to before accessing B2AI data, including CM4AI datasets.
  data_use_permission: no_commercial_use
  contact_person: mailto:jillianparker@health.ucsd.edu
  description: >-
    Licensing questions have no separately named contact; the person referenced
    here is Jillian Parker of the University of California San Diego, whom the
    release records name as the Data Governance Committee contact.
  source_caveats: >-
    The CC BY-NC-SA 4.0 deed included in the input bundle states that it
    highlights only some key features and terms of the actual license, is not a
    license and has no legal value.

ip_restrictions:
  name: Copyright and commercialization
  restrictions:
  - >-
    Copyright in the released data is held by the Regents of the University of
    California except where otherwise noted.
  - >-
    Raw image data for spatial proteomics is copyright the Board of Trustees of
    the Leland Stanford Junior University.
  - >-
    Commercial use requires a separate license negotiation with the copyright
    holder, which is UCSD, Stanford, or UCSF depending on the specific data
    package in question.
  - >-
    Under the share-alike term of the license, anyone who remixes, transforms or
    builds upon the material must distribute their contributions under the same
    license as the original.
  description: >-
    The project describes its ethical plan as balancing the openness of the data
    produced with protection of the intellectual property and with supervision
    and monitoring of potential efforts at commercialization.

regulatory_restrictions:
  name: Regulatory status
  other_compliance: >-
    The release records state that the data are not FDA regulated. They also
    record that the work does not involve human subjects and that the samples
    are de-identified, so no human subjects regulatory framework is claimed to
    govern the data.

data_governance:
  committee_name: Data Governance Committee
  committee_members:
  - id: mailto:jillianparker@health.ucsd.edu
    name: Jillian Parker
    email: jillianparker@health.ucsd.edu
    affiliation:
    - name: University of California San Diego
  committee_contact: mailto:jillianparker@health.ucsd.edu
  access_review_process: >-
    The project's Ethics team worked with the Data Acquisition, Tools and
    Standards Modules to develop a plan for ethical preparation, licensing,
    dissemination and data access supervision of CM4AI datasets, and states that
    a Data Access Committee supervises ethical matters related to dataset
    distribution and to potential dual licensing for commercial use. The
    released files themselves are public and require no access request; the
    committee's role as described concerns distribution policy and
    commercial-use licensing rather than gating access to the public releases.
  stewardship_roles:
  - >-
    The Ethics Module holds responsibility for the CM4AI Life Cycle, a framework
    setting out governance milestones through data generation and AI system
    development.
  - >-
    The Standards Module holds responsibility for AI-readiness packaging of
    data, software, metadata and provenance graphs.
  - >-
    The Teaming Module holds responsibility for open dissemination of the data,
    maps and tools through the CM4AI web portal.
  accountable_organization:
    id: ROR:0153tk833
    name: University of Virginia
    description: >-
      Long-term preservation of the releases is stated to be in the University
      of Virginia Dataverse, supported by committed institutional funds.
  description: >-
    The Ethics team employs a methodology inspired by Value-Sensitive Design to
    create normative standards and expectations for the responsible design of
    datasets and AI technologies, including an axiological repository of values
    to guide the articulation of design standards.

ethical_reviews:
- name: CM4AI ethical review
  contact_person: ORCID:0000-0002-7080-8801
  review_details: >-
    Each release records ethical review against two named reviewers: Vardit
    Ravitsky of the University of Montreal, referenced here as the contact
    person and reachable at ravitskyv@thehastingscenter.org, and
    Jean-Christophe Bélisle-Pipon of Simon Fraser University
    (jean-christophe_belisle-pipon@sfu.ca). The release records state
    that the work does not involve human subjects, that samples are
    de-identified and that the data are not FDA regulated; no institutional
    review board, approval number or review date is given. The project
    separately reports that its Ethics Pillar established guidelines addressing
    socio-ethical challenges and supported the Bridge2AI Ethics Working Group in
    developing a Code of Conduct for access to Bridge2AI data.

human_subject_research:
  name: Human subjects status
  involves_human_subjects: false
  description: >-
    Every release record answers "Human Subjects: No". The project states that
    its data are distinctive within Bridge2AI in being non-clinical, derived
    from tissue cultures, and considered de-identified because they cannot be
    matched, with current knowledge, to a human subject.

is_deidentified:
  name: De-identification status
  identifiable_elements_present: false
  deidentification_details: >-
    Every release record answers "De-identified Samples: Yes". The project's
    basis for this is that the data are non-clinical, coming from tissue
    cultures, and cannot be matched with current knowledge to a human subject.
    The two cell lines are commercially or institutionally available reference
    lines rather than samples collected for this project. No de-identification
    procedure is described, because none is stated to have been required.

maintainers:
- name: Swathi Thaker
  role: researcher
  maintainer_details: >-
    Program Manager at the University of Alabama at Birmingham, listed on the
    project website as the contact for project-related inquiries at
    snthaker@uab.edu.
- name: Zhandos Sembay
  role: researcher
  maintainer_details: >-
    Listed at the University of Alabama at Birmingham as the contact for website
    support and updates, at zsembay8@uab.edu.
- name: University of Virginia Dataverse (LibraData)
  role: academic_institution
  maintainer_details: >-
    Hosts the releases and is stated to provide their long-term preservation,
    supported by committed institutional funds. Support for the repository
    itself is handled by University of Virginia Dataverse Support.

updates:
  name: Quarterly release plan
  frequency: Quarterly
  update_details: >-
    CM4AI delivers quarterly data releases of the map-input data streams, and
    the release records state that the dataset will be regularly updated and
    augmented through the end of the project in November 2026. The March 2025
    release adds that data presented there will be augmented regularly through
    the end of the project.
  source_caveats: >-
    The release records give the end of the project as November 2026, while the
    NIH project record for the funding award gives a project end of 2026-08-31.
    The two describe different things — a planned end of data augmentation and
    the end date of an award — and neither is asserted as the other.

retention_limit:
  name: Long-term preservation
  retention_details: >-
    The release records state long-term preservation in the University of
    Virginia Dataverse, supported by committed institutional funds. No retention
    limit or deletion schedule is stated; the data do not relate to identifiable
    individuals, and no participant was told their data would be deleted.

version_access:
  name: Release versions
  latest_version_doi: doi:10.18130/V3/HIGT4C
  versions_available:
  - May 2024 Data Release
  - March 2025 Data Release
  - June 2025 Data Release
  - October 2025 Data Release
  - June 2026 Data Release
  version_details: >-
    Each release is deposited as a separate Dataverse dataset with its own DOI
    and its own version number, and earlier releases remain published and
    citable rather than being superseded in place. The project's data releases
    page lists the four earlier releases under an Archive heading and presents
    the June 2026 release as the latest. Within a release, Dataverse records
    minor and major version increments: the March 2025 release stands at version
    1.4, the June 2025 release at 2.1 after a revision that added RGB
    immunofluorescent images, corrected RO-Crate metadata and changed naming
    conventions, the October 2025 release at 2.1, and the June 2026 release at
    2.0.

external_resources:
- name: CM4AI project preprint
  external_resources:
  - https://doi.org/10.1101/2024.05.21.589311
  description: >-
    "Cell Maps for Artificial Intelligence: AI-Ready Maps of Human Cell
    Architecture from Disease-Relevant Cell Lines", the article describing the
    project and its goals, methods, standards, datasets, software tools, status
    and future directions. Every Dataverse release cites it as a related
    publication, and the project asks that publications referencing the data
    cite it. The article states that it will be continuously updated as the
    project progresses.
- name: Perturbation cell atlas preprint
  external_resources:
  - https://doi.org/10.1101/2024.11.03.621734
  description: >-
    "A perturbation cell atlas of human induced pluripotent stem cells", cited
    as a related publication by the March 2025, June 2025, October 2025 and June
    2026 releases and reporting the CRISPRi perturbation atlas those releases
    distribute.
- name: Multimodal cell maps reference study
  external_resources:
  - https://doi.org/10.1038/s41586-025-08878-3
  - https://doi.org/10.1038/s41586-025-09648-x
  - http://musicmaps.ai/u2os-cellmap/
  - https://ndexbio.org
  - https://www.ebi.ac.uk/complexportal
  - https://modelarchive.org
  description: >-
    "Multimodal cell maps as a foundation for structural and functional
    genomics", published in Nature volume 642, pages 222-231 (2025), which
    acknowledges the Bridge2AI Program award that funds CM4AI. It reports a
    global map of human subcellular architecture built by the same integration
    strategy the project's pipeline implements — joint measurement of biophysical
    interactions and immunofluorescence images, self-supervised multimodal
    embedding, and multiscale community detection — and validated by whole-cell
    size-exclusion chromatography mass spectrometry. That map was built in U2OS
    osteosarcoma cells, which are not among the cell lines the CM4AI data
    releases cover, and its outputs are deposited outside those releases: the
    cell map at NDEx under uuid f693137a-d2d7-11ef-8e41-005056ae3c32 and the
    affinity purification interaction data under uuid
    95bc75d5-d1d1-11ee-8a40-005056ae23aa; the assemblies at the European
    Bioinformatics Institute Protein Complex Portal under the query CLO:0009454;
    raw affinity purification mass spectrometry files at MassIVE under
    MSV000097168; raw size exclusion chromatography mass spectrometry files and
    search results at ProteomeXchange under PXD052362; the image dataset within
    the Human Protein Atlas v23 release; and the structural models at
    ModelArchive under ma-idk-u2osmap and ma-m5og4. The second DOI listed here
    is a Correction to the article published on 2 October 2025; a separate
    Publisher Correction on 29 April 2025 restored missing text to the
    Acknowledgements.
  archival: false
- name: Cell Mapping Toolkit
  external_resources:
  - https://github.com/idekerlab/cellmaps_pipeline
  - https://cellmaps-pipeline.readthedocs.io/
  description: >-
    Open-source software for cell map construction, released as a series of
    Python PyPI packages and linked from the project's visualization portal. The
    project states that software comprising the Tools data integration pipeline
    is available under the BSD-3 open source license in GitHub for alpha-level
    tools, or in the Zenodo long-term archive for production-ready tools, and
    that links to these tools are packaged in the RO-Crates as part of the
    project's provenance representations.
- name: FAIRSCAPE AI-readiness framework
  external_resources:
  - https://fairscape.github.io
  description: >-
    Tutorial and installation instructions for the framework that performs the
    project's AI-readiness packaging. Copyright is held by the Rector and Board
    of Visitors of the University of Virginia and the software is available
    under the MIT license.
- name: Integrative Modeling Platform
  external_resources:
  - https://integrativemodeling.org
  description: >-
    Open-source package underlying the Python Modeling Interface used for the
    project's integrative structure modeling of cell map communities.
- name: External repositories holding raw data
  description: >-
    The release records link raw data held outside the Dataverse deposits
    without giving addresses for them: Sequence Read Archive data through NCBI
    BioProject on the June 2025 release; mass spectrometry data for human
    induced pluripotent stem cells and for human cancer cells in the MassIVE
    Repository; and, from the June 2026 release, the CRISPRi Perturbation Atlas
    of iPSCs on Figshare and AP-MS data for MDA-MB-468 cells treated with
    paclitaxel and with vorinostat in the MassIVE Repository.
  restrictions:
  - >-
    On the October 2025 and June 2026 releases, perturb-seq data in
    undifferentiated KOLF2.1J induced pluripotent stem cells and perturb-seq
    data in MDA-MB-468 breast cancer cells with and without treatment are both
    marked Embargoed rather than linked.

