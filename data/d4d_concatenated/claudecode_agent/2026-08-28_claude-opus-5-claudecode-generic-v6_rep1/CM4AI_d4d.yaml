known_biases:
- name: Cell line derivation
  bias_type: representation_bias
  bias_description: >-
    The release records warn that data in the release were derived from
    commercially available de-identified human cell lines, and therefore do not
    represent all biological variants which may be seen in the population at
    large.
  affected_subsets:
  - MDA-MB-468 triple-negative breast cancer cell line
  - KOLF2.1J induced pluripotent stem cell line

known_limitations:
- name: Interim release without computed cell maps
  limitation_type: scope_limitation
  limitation_description: >-
    Each release records that the data are not yet in completed final form: it
    is an interim release, and computed cell maps are not included in it.
  scope_impact: >-
    The releases distribute the map-input data streams rather than the
    hierarchical cell maps the project exists to produce.
  recommended_mitigation: >-
    The release records state that predicted cell maps will be added in future
    releases.
- name: Incomplete overlap between modalities
  limitation_type: integration_limitation
  limitation_description: >-
    Protein-protein interaction data from size exclusion chromatography-mass
    spectrometry, protein localization data from immunofluorescence imaging, and
    CRISPRi perturb-seq data interrogate sets of proteins which incompletely
    overlap.
  scope_impact: >-
    Analyses that require all three modalities for the same protein are
    restricted to the intersection rather than to any single modality's
    coverage.
- name: Suitability for analysis
  limitation_type: methodological_limitation
  limitation_description: >-
    The release records state that the current release is most suitable for
    bioinformatics analysis of the individual datasets, and requires domain
    expertise for meaningful analysis.
- name: Pre-publication embargo
  limitation_type: coverage_limitation
  limitation_description: >-
    Some datasets are under temporary pre-publication embargo. On the October
    2025 and June 2026 releases the perturb-seq data in undifferentiated
    KOLF2.1J induced pluripotent stem cells and in MDA-MB-468 breast cancer
    cells with and without treatment are both marked as embargoed in the
    external data links.

acquisition_methods:
- name: Laboratory measurement of cultured cell lines
  was_directly_observed: true
  was_reported_by_subjects: false
  acquisition_details: >-
    All instances are laboratory measurements made on cultured human cell lines
    rather than observations of or reports by human participants. The release
    records state that the data do not involve human subjects and that the
    samples are de-identified.
- name: MDA-MB-468 cell line sourcing
  acquisition_details: >-
    MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line
    established from a metastatic site pleural effusion of a 51-year-old black
    female with a metastatic mammary adenocarcinoma, available from ATCC. The
    project describes it as extensively used to study triple-negative breast
    cancer and well characterized, with transcriptomic, mutational profile and
    whole-genome sequencing data available, and states that it was ethically
    sourced. It is measured untreated and after treatment with paclitaxel or
    vorinostat.
- name: KOLF2.1J cell line sourcing
  acquisition_details: >-
    The KOLF2.1J (RRID:CVCL_B5P3) induced pluripotent stem cell line was derived
    from a healthy male Northern European donor and is available from the Human
    Induced Pluripotent Stem Cells Initiative (HipSci) resource, for access by
    not-for-profit organizations via a simple material transfer agreement. The
    project states that it was ethically sourced. It is measured
    undifferentiated and after differentiation into neural progenitor cells,
    neurons, and cardiomyocytes.

collection_mechanisms:
- name: Affinity purification mass spectrometry
  mechanism_details: >-
    Affinity purification mass spectrometry (AP-MS) is applied to endogenously
    tagged cell lines to map protein-protein interactions. The project reports
    having endogenously tagged 17 genes in MDA-MB-468 and acquired AP-MS data
    under three conditions — untreated, paclitaxel treated and vorinostat
    treated — with 34 additional genes then being tagged. AP-MS data for
    MDA-MB-468 cells with treatment first appear in the June 2026 release.
- name: Size exclusion chromatography-mass spectrometry
  mechanism_details: >-
    Size exclusion chromatography coupled to mass spectrometry (SEC-MS) is used
    for proteome-wide complex and interaction mapping, as an approach orthogonal
    to affinity purification. In MDA-MB-468 cells under three conditions it
    identified 72 of the 100 chromatin modifiers of interest, 52 of them
    integral components of protein complexes, and detected protein-protein
    interaction profiles of over a thousand complexes, with thousands of
    proteins showing differential elution profiles between control and treated
    cells. In KOLF2.1J induced pluripotent stem cells and derivatives it
    uncovered more than 700 protein complexes in both parental cells and
    differentiated neurons.
- name: Immunofluorescence confocal microscopy
  mechanism_details: >-
    Spatial subcellular organization is mapped by immunofluorescence-based
    staining (ICC-IF) and confocal microscopy using the Human Protein Atlas
    resource of antibodies. Automated fixation and permeabilization protocols
    were established for a pipetting robot for the MDA-MB-468 and KOLF2 cell
    lines. Nuclei are stained with DAPI in the blue channel, the endoplasmic
    reticulum with a calreticulin antibody in the yellow channel, microtubules
    with a tubulin antibody in the red channel, and the protein of interest in
    the green channel.
- name: Single-cell CRISPR perturbation screening
  mechanism_details: >-
    Single-cell CRISPR screens perturb 100 chromatin regulators in MDA-MB-468
    cells under three conditions and in KOLF2.1J induced pluripotent stem cells
    in the undifferentiated state. A CRISPR lentiviral library targeting 100
    chromatin factors with six guide RNAs per gene was designed, MDA-MB-468 and
    KOLF2 CRISPR lines expressing inducible dCas9 were generated and
    characterized, and the screens were run using the 10x Genomics 3'HT kit. The
    released perturbation cell atlas covers 11,739 targeted genes at expressed
    genome scale. The project's flagship dataset descriptions give whole-genome
    perturb-seq of more than 11,000 genes for the induced pluripotent stem cell
    arm and perturb-seq of 200 genes for the triple-negative breast cancer arm.

sampling_strategies:
- name: Targeted selection of proteins for interrogation
  is_sample: true
  source_data: >-
    The human proteome. The project describes its first-year target set as a
    near-comprehensive set of the chromatin regulators encoded by the human
    genome.
  strategies: >-
    Targeted selection by protein class and disease relevance rather than random
    sampling: 100 chromatin modifiers and 100 metabolic enzymes involved in
    cancer, neuropsychiatric, and cardiac disorders. Spatial proteomics mapping
    covered 100 chromatin regulators in MDA-MB-468 cells with and without
    treatment, with a further 500 proteins held pending significant hits from
    the genetic perturbation and protein-protein interaction results, so the
    imaging panel is expanded on the basis of earlier results rather than fixed
    in advance. The CRISPRi perturbation atlas is the exception in scale, being
    an expressed genome-scale screen covering 11,739 targeted genes.
  description: >-
    The dataset is a targeted sample of the proteome rather than a complete
    survey of it, and the sets interrogated by the three modalities do not fully
    coincide.

