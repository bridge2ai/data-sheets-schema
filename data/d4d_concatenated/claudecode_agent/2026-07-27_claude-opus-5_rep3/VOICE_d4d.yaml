id: https://b2ai-voice.org/
name: bridge2ai-voice
title: Bridge2AI-Voice - Voice as a Biomarker of Health
description: >-
  Bridge2AI-Voice is a Precision Public Health grand challenge project funded by the NIH
  Common Fund Bridge2AI Program that generates a large, ethically sourced, and
  demographically diverse voice, speech, and respiratory-sound dataset linked to multimodal
  health information. Data are collected prospectively at high-volume expert clinics across
  North America using the Bridge2AI-Voice App (adults) and reproschema-ui (pediatrics),
  together with validated questionnaires, patient-reported outcomes, detailed demographics,
  confounder surveys, and clinician-validated diagnoses across five disease cohort
  categories: voice disorders, neurological and neurodegenerative disorders, mood and
  psychiatric disorders, respiratory disorders, and pediatric voice and speech disorders.
  The consortium publishes TWO DISTINCT COHORT DATASETS as separate PhysioNet projects
  rather than as versions of one another. (1) The adult dataset, "Bridge2AI-Voice: An
  ethically-sourced, diverse voice dataset linked to health information" (PhysioNet project
  b2ai-voice), whose current release v3.1.0 was published 2026-05-01 and contains data for
  833 adult participants collected across five sites in North America. (2) The pediatric
  dataset, "Bridge2AI-Voice Pediatric Dataset" (PhysioNet project b2ai-voice-pediatric),
  whose current release v1.1.0 was published 2026-05-01 and contains derived audio features
  for 23,533 recordings collected from 300 participants aged 2 to 18 who were recruited at
  the Hospital for Sick Children (SickKids) under a separate pediatric protocol and a
  separate Research Ethics Board approval. Neither PhysioNet release contains raw audio
  waveforms; both distribute derived features such as spectrograms, mel spectrograms, MFCCs,
  articulatory and phonetic features, plus phenotypic and metadata tables. Raw audio for each
  cohort is disseminated only under controlled access through separate Synapse projects.
keywords:
  - bridge2ai
  - voice
  - speech
  - health
  - biomarkers
  - audiomics
  - pediatric
  - artificial intelligence
  - machine learning
