      based on known conditions which manifest within the voice waveform, including voice disorders,
      neurological disorders, mood disorders, and respiratory disorders. The release contains data
      considered low risk, including derivations such as spectrograms but not the original voice
      recordings; detailed demographic, clinical, and validated questionnaire data are also made
      available. Version 3.1.0 is a minor update over 3.0.0 with no new participants, but with some
      additional data released for certain participants, repaired parquet files that were broken in the
      previous release, new files related to audio quality metrics and per-audio metadata, validated
