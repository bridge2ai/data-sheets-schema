instances:
  - id: https://b2ai-voice.org/instance/adult-participant
    name: adult participant
    description: >-
      Each instance represents a person. The healthsheet states there are currently around 833
      instances and that the dataset represents 833 patients or subjects, which matches the
      participant count reported for adult PhysioNet releases v3.0.0 and v3.1.0.
    instance_type: person
    counts: 833
    label: true
    label_description: >-
      Diagnostic labels are the result of a clinical assessment of the participant. At each site a
      local clinician provided the diagnosis based on a clinical interview and appropriate work-up.
      For the psychiatric disorders cohort, this assessment was determined using the participant's
      EHR record or an active prescription, done outside of data collection by an appropriately
      licensed clinician.
  - id: https://b2ai-voice.org/instance/pediatric-participant
    name: pediatric participant
    description: >-
      Pediatric participants are a separate cohort from the adult participants. The Bridge2AI-Voice
      Pediatric Dataset v1.1.0 contains data from 300 participants aged 2 to 18, recruited at the
      Hospital for Sick Children. Participants were eligible if they were 2 to 18 years of age with
      English proficiency; individuals over 18 years of age and non-verbal individuals were
      excluded. Non-patients recruited through research postings were evaluated against the same
      criteria.
    instance_type: person
    counts: 300
  - id: https://b2ai-voice.org/instance/pediatric-derived-recording
    name: pediatric derived audio recording
    description: >-
      Bridge2AI-Voice Pediatric Dataset v1.1.0 contains derived audio features for 23,533
      recordings collected from the 300 pediatric participants. All pediatric participants
      completed the recording and demographic data collection in one session.
    instance_type: derived audio recording
    counts: 23533
  - id: https://b2ai-voice.org/instance/adult-derived-recording
    name: adult derived audio recording
    description: >-
      Derived recordings for the adult cohort are distributed one row per unique recording. Element
      counts differ by feature type in v3.1.0, ranging from 28,640 sparc_ema records to 32,522
      torchaudio_pitch records, because some recordings could not generate certain features and
      because features for sensitive records and audio checks were removed. The project
      documentation separately states that adult version 3.0 contained approximately 61,937
      voice-derived recordings from 833 adult participants. Participants may have more than one
      recording session, so there may be more than one session per participant.
    instance_type: derived audio recording

anomalies:
  - id: https://b2ai-voice.org/anomaly/site-and-protocol-variation
    name: site and protocol variation
    anomaly_details:
      - Different sites have different collection configurations.
      - The collection protocol changed over the course of the study.
      - >-
        Distinct iPad devices were used at each site, and the data were recorded with a
        head-mounted headset with a microphone that could be at slightly different distances.
      - >-
        Participants were screened for different disorders based on site, so they also had their
        data collected with different devices.
  - id: https://b2ai-voice.org/anomaly/measurement-and-response-noise
    name: measurement and response noise
    anomaly_details:
      - Noise artifacts.
      - Variations in diagnostic practices.
      - Inaccurate questionnaire responses and underreporting.
      - >-
        Changes in diagnostic criteria or practices could be a source of distribution shift over
        time.
  - id: https://b2ai-voice.org/anomaly/pediatric-microphone-variation
    name: pediatric recording device variation
    anomaly_details:
      - >-
        For the pediatric cohort a headset was used to record for most participants, while the
        remaining recordings used the built-in tablet microphone because of low tolerance of
        wearing headphones or existing complex medical conditions.

known_biases:
  - id: https://b2ai-voice.org/bias/selection
    name: recruitment-driven selection bias
    bias_type: selection_bias
    bias_description: >-
      Participants are recruited from high-volume expert clinics and community outreach clinics
      based on diagnosis and inclusion or exclusion criteria, and pediatric participants are
      recruited strictly from the Hospital for Sick Children. Groups that have less trust in the
      medical system or in AI, or that are less proximal to the collection sites, would have been
      less likely to be recruited.
    mitigation_strategy: >-
      A Plan for Enhancing Diverse Perspectives is in place to enroll participants from socially
      and economically disadvantaged and underserved populations. The team hopes to make the sample
      more representative by shifting to remote collection and designing recruitment to control for
      more variables.
  - id: https://b2ai-voice.org/bias/representation
    name: representation bias
    bias_type: representation_bias
    bias_description: >-
      The public data releases do not contain an equal distribution of the five disease cohort
      categories. The dataset has skews based on disorder category, site, and other demographic
      factors. Data collection to date is limited to fluent English speakers; Spanish protocols
      and data collection are planned for future releases.
    mitigation_strategy: >-
      Users should consider the multivariate distribution when assessing utility for different
      questions. Further releases will contain additional data, and the protocol was updated to
      include data collection from Spanish language speakers.
    affected_subsets:
      - disease cohort categories
      - language groups
      - recording sites
  - id: https://b2ai-voice.org/bias/measurement
    name: device and diagnostic measurement bias
    bias_type: measurement_bias
    bias_description: >-
      Data are collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an
      Avid AE-36 microphone and an Apple dongle, with distinct devices at each site. The clinical
      diagnosis, depending on the disorder, was performed by one clinician or based on an EHR record
      or prescription, so label provenance varies across cohorts.
  - id: https://b2ai-voice.org/bias/sampling
    name: non-probability sampling bias
    bias_type: sampling_bias
    bias_description: >-
      The study metadata records the sampling method as a non-probability sample. The dataset is a
      sample of a larger, ongoing collection and is not representative because it was collected at a
      limited number of geographic locations.

known_limitations:
  - id: https://b2ai-voice.org/limitation/no-raw-audio-in-release
    name: no raw audio in the public releases
    limitation_type: scope_limitation
    limitation_description: >-
      Neither the adult nor the pediatric PhysioNet project contains raw audio. Both publish derived
      features from the audio waveforms. All raw voice data was removed because it has the potential
      to cause individual re-identification or to be used for illicit or unauthorized purposes.
    scope_impact: >-
      Analyses that require the original waveform cannot be performed on the PhysioNet releases
      alone.
    recommended_mitigation: >-
      Raw audio is available under a controlled access mechanism requiring institutional sign-off;
      requests go to the access committee at DACO@b2ai-voice.org, and data are made available via
      Synapse.
  - id: https://b2ai-voice.org/limitation/geographic-and-language-coverage
    name: limited geographic and language coverage
    limitation_type: coverage_limitation
    limitation_description: >-
      Adult data were collected across five recording sites in North America, in the USA and Canada,
      and communication with study participants used the English language. The exclusion criteria
      include not reading or speaking English.
    scope_impact: >-
      The data are not representative of the larger population because they were collected at a
      limited number of geographic locations and from fluent English speakers only.
  - id: https://b2ai-voice.org/limitation/single-labeler
    name: single labeler per instance
    limitation_type: methodological_limitation
    limitation_description: >-
      A single labeler provided one label per instance, typically the clinician at the site of data
      collection or a clinician external to it for a prior diagnostic assessment. Human-level
      performance in the applications the dataset addresses is reported to vary widely.
    recommended_mitigation: >-
      The process for any new labels should be described alongside any release of a model or
      publication, including the exact variables used for the determination.
  - id: https://b2ai-voice.org/limitation/unaudited-derived-content
    name: unaudited automatically generated content
    limitation_type: methodological_limitation
    limitation_description: >-
      The dataset has been audited internally for missingness and consistency by the data release
      team and a missingness table is included with the dataset, but certain aspects of the data,
      for example transcription, were generated using off-the-shelf models that have not been
      audited for correctness.
  - id: https://b2ai-voice.org/limitation/no-external-modalities-released
    name: multimodal data not included in the release
    limitation_type: scope_limitation
    limitation_description: >-
      Other multimodal data, including imaging, genomic data for the neuro cohort, laryngoscopy
      imaging, and other EHR data, is extracted from different sites independently and uploaded
      through the REDCap database, but no external data was released in the v3.0.0 release.
  - id: https://b2ai-voice.org/limitation/ai-readiness-gaps
    name: self-assessed AI-readiness gaps
    limitation_type: methodological_limitation
    limitation_description: >-
      In the project's AI-readiness self-assessment table, the criteria Data Quality (2.e),
      Domain-appropriate (5.b), Associated (5.d) and Contextualized (6.d) are scored as not met,
      giving category scores of 80 percent for characterization, 50 percent for sustainability and
      75 percent for computability, while FAIRness, provenance, pre-model explainability and ethics
      score 100 percent.
  - id: https://b2ai-voice.org/limitation/no-k-anonymization
    name: k-anonymization not achieved
    limitation_type: methodological_limitation
    limitation_description: >-
      The de-identification levels record that the dataset removes direct identifiers, applies the
      HIPAA de-identification rules, rebases or replaces dates by integers, removes or generalizes
      geographic information, and removes narrative text fields, but does not achieve
      K-anonymization with k greater than or equal to 2.

confidential_elements:
  - id: https://b2ai-voice.org/confidentiality/statement
    name: confidential data statement
    confidential_elements_present: false
    confidentiality_details:
      - >-
        The healthsheet answers "No" to whether the dataset contains data that might be considered
        confidential, such as data protected by legal privilege or doctor-patient confidentiality.

content_warnings:
  - id: https://b2ai-voice.org/content-warning/free-speech-transcription
    name: free speech transcription content
    content_warnings_present: true
    warnings:
      - >-
        This dataset includes the transcription of free speech tasks. While the inclusion of
        offensive, insulting or threatening content is unlikely, it cannot be completely avoided, as
        research participants are responsible for their choice of language.
      - >-
        Answering questions asked of participants from certain disease cohorts such as mood
        disorders, depression and anxiety can lead to possible discomfort and could trigger negative
        emotions for the participants.

subpopulations:
  - id: https://b2ai-voice.org/subpopulation/demographics
    name: demographic subpopulations
    subpopulation_elements_present: true
    identification:
      - Age
      - Gender
      - Sex
      - Ethnicity
      - Socioeconomic status
      - Race
      - Language
    distribution:
      - >-
        Detailed demographic data and surveys about confounding factors such as smoking and drinking
        history are collected through the smartphone application.
      - >-
        The adult study metadata lists sex as All, gender-based as No, minimum age 18 years and
        maximum age 120 years, with healthy volunteers accepted.
      - >-
        The pediatric cohort covers participants aged 2 to 18 and is grouped by age, with separate
        age-banded protocols for Peds 10+, Peds 6-10, Peds 4-6 and Peds 2-4.
  - id: https://b2ai-voice.org/subpopulation/disease-cohorts
    name: disease cohort categories
    subpopulation_elements_present: true
    identification:
      - Voice Disorders
      - Neurological and Neurodegenerative Disorders
      - Mood and Psychiatric Disorders
      - Respiratory disorders
      - Pediatric Voice and Speech Disorders
      - Controls
    distribution:
      - >-
        The public data releases do not contain an equal distribution of these categories of
        diseases; further releases will contain additional data.
      - >-
        The adult PhysioNet abstract states that participants were selected based on known
        conditions which manifest within the voice waveform including voice disorders, neurological
        disorders, mood disorders, and respiratory disorders.
      - >-
        In addition to patient cohort data, participants include individuals who do not have the
        conditions of interest and serve as controls in the dataset.

sensitive_elements:
  - id: https://b2ai-voice.org/sensitive/categories
    name: sensitive data categories present
    sensitive_elements_present: true
    sensitivity_details:
      - 'Racial or ethnic origins: the dataset includes race information.'
      - 'Sexual orientations: the dataset includes sexual orientation information.'
      - 'Financial or health data: the dataset includes socioeconomic and health information.'
      - >-
        Non-identifying elements of data that revealed highly sensitive information, such as
        household income, mental health status and traumatic life experiences, were removed from the
        release.

relationships:
  - id: https://b2ai-voice.org/relationship/instances
    name: relationships between instances
    relationship_details:
      - >-
        The healthsheet answers that relationships between individual instances are not made
        explicit and that instances are unrelated.
      - >-
        For most participants a single session was sufficient to collect all relevant data, but a
        subset of participants required multiple sessions, so there may be more than one session per
        participant and more than one row per participant in the phenotype data files. There is no
        requirement that a participant provide the same response for each visit, so participant
        information for the same data element may vary across a data file.

splits:
  - id: https://b2ai-voice.org/splits/none-recommended
    name: no recommended data splits
    split_details:
      - >-
        There are no predefined recommended data splits for training, validation, or testing.
        Researchers are encouraged to create their own data splits based on their specific
        requirements.

acquisition_methods:
  - id: https://b2ai-voice.org/acquisition/observed-and-reported
    name: directly observed and subject-reported acquisition
    was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - >-
        The data was directly observable and reported by subjects. Clinical diagnoses were verified
        by clinicians reviewing audio and/or imaging data, looking at electronic health records, or
        medication prescriptions.
      - >-
        Clinical validation is performed by a qualified physician or practitioner based on
        established gold standards for diagnosis, which include laryngoscopy images and stroboscopy
        videos for voice disorders, spirometry and flow volume loops and CT scans for respiratory
        disorders, brain CT and MRI and whole genome sequencing for neurological and
        neurodegenerative disorders, and electronic health summary, psychiatrist diagnosis and
        medication history for mood and psychiatric disorders.
      - >-
        Derived features such as spectrograms, MFCCs, mel spectrograms, articulatory features,
        phonetic posteriorgrams and transcriptions are computationally derived from the raw audio
        rather than observed.

collection_mechanisms:
  - id: https://b2ai-voice.org/mechanism/adult-app
    name: Bridge2AI-Voice application and hardware
    mechanism_details:
      - The data were collected using an iPad app.
      - >-
        Data is collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an
        Avid AE-36 microphone and an Apple dongle to connect it to the iPad.
      - >-
        Voice samples are collected prospectively using a custom software application, the
        Bridge2AI-Voice App, with the Bridge2AI-Voice protocols. A total of 22 acoustic tasks are
        recorded through the app.
      - >-
        HVEC and remote data collection occur through two platforms, the Bridge2AI Voice Web app and
        the Bridge2AI Voice iOS app. The iOS app is restricted to iOS-compatible devices, while the
        Web app can run on a computer, tablet, or phone device. No software is downloaded or
        installed. Both apps are HIPAA-compliant and only store data during the collection phase;
        the data are removed as soon as the page is closed and there is no login required. Data are
        sent over a secure https protocol to a HIPAA-compliant storage server.
      - >-
        Data is collected in the clinic with the assistance of a trained research assistant. Future
        data collection will also occur remotely; however, remote data collection did not occur for
        the initial dataset release.
    used_software:
      - id: https://github.com/eipm/bridge2ai-redcap
        name: eipm/bridge2ai-redcap
        description: >-
          Bridge2AI REDCap data dictionary, metadata, and instrument PDFs supporting the data
          acquisition protocols.
        license: MIT
        url: https://github.com/eipm/bridge2ai-redcap
  - id: https://b2ai-voice.org/mechanism/pediatric-reproschema
    name: pediatric reproschema-ui collection
    mechanism_details:
      - >-
        For pediatrics, all data is collected using reproschema-ui with the Bridge2AI-Voice pediatric
        protocol.
      - >-
        All pediatric data was collected through customized software, reproschema-ui, on tablets. A
        headset was used to record for most participants, while the remaining recordings used the
        built-in tablet microphone. All participants completed the recording and demographic data
        collection in one session. For participants without adequate comprehension and familiarity
        with their past medical history, parents or decision-makers completed the survey during the
        recording on a separate tablet.
  - id: https://b2ai-voice.org/mechanism/redcap-and-ehr
    name: REDCap capture and EHR extraction
    mechanism_details:
      - >-
        Existing clinical data within the EHR is reviewed and entered into a REDCap database as part
        of the Case Report Form, including demographics, imaging such as chest X-rays for the
        respiratory category and brain CT and MRI for the neurology category, and clinical data
        related to diagnosis.
      - >-
        Other multimodal data, including imaging, genomic data for the neuro cohort, laryngoscopy
        imaging and other EHR data, is extracted from different sites independently and uploaded
        through the REDCap database.
      - >-
        The supporting REDCap data dictionary, metadata, and instrument PDFs are available at
        https://github.com/eipm/bridge2ai-redcap and full data acquisition protocols are available
        in the REDCap Instrument Shared Library.

sampling_strategies:
  - id: https://b2ai-voice.org/sampling/non-probability
    name: non-probability clinic-based sampling
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - >-
        Patients presenting at specialty clinics and institutions in North America across the five
        predetermined disease groups.
      - >-
        Pediatric patients and healthy volunteers at the Hospital for Sick Children, plus
        non-patients recruited through research postings.
    why_not_representative:
      - >-
        It is a sample of a larger, ongoing collection. The data is not representative because it was
        collected at a limited number of geographic locations.
    representative_verification:
      - >-
        No representativeness verification is reported; the healthsheet instead states the plan to
        make the sample more representative by shifting to remote collection and designing the
        recruiting approach to control for more variables.
    strategies:
      - The study metadata records the sampling method as Non-Probability Sample.
      - >-
        Participants are recruited across different academic institutions from high volume expert
        clinics based on diagnosis and inclusion/exclusion criteria. High volume expert clinics are
        outpatient clinics within hospital systems or academic institutions with expertise in a
        specific disease area that see more than 50 patients per month from the same disease
        category.
      - >-
        Pediatric participants are recruited strictly from the Hospital for Sick Children (SickKids)
        and are grouped by age.
      - >-
        Patients presenting at the given clinic were screened for inclusion and exclusion criteria
        prior to their visit by the project investigators.
      - >-
        Enrollment targets differ by source and scope and are not a description of what has been
        collected. The current project documentation states an anticipated enrollment count by 2027
        of 10,000 and describes a flagship dataset of 10,000 voices. The IRB protocol, whose study
        summary predates those figures, gives a sample size of 30,000 participants reached through
        collaboration with participating institutions and existing cohorts, with up to 5,000
        participants enrolled through USF clinics and complete multi-modal acquisition for up to
        5,000 participants per disease category and controls. The audiomics white paper describes
        the primary deliverable as a publicly available database of 30,000 human voices. As this
        database is intended to fuel AI research, no sample size calculation is applicable to the
        methodology; sample sizes were defined according to the existing literature.

data_collectors:
  - id: https://b2ai-voice.org/collectors/research-teams
    name: research teams and clinicians
    role: data collection and clinical validation
    collector_details:
      - >-
        Research teams, which may include medical, graduate, or undergraduate students, coordinated
        with clinicians and doctors to identify appropriate participants. These clinicians and
        doctors were listed under IRB as co-investigators and were added to the consortium so that
        their names are included on consortium-level publications that emerge from the research.
        Hospital staff were not involved in scheduling but assisted in the logistics of coordinating
        data collection.
      - >-
        Data is collected in the clinic with the assistance of a trained research assistant, who
        introduces the app and conducts the consent process.

collection_timeframes:
  - id: https://b2ai-voice.org/timeframe/collection-period
    name: data collection timeframe
    timeframe_details:
      - The healthsheet states the data was collected over a period of 12 months.
      - >-
        The IRB protocol describes a prospective cohort study over 4 years involving 11 different
        academic sites across the US, with a phased approach: phase 1 exploratory data collection
        for up to 180 participants completed November 2023; phase 2 pilot collection to cumulatively
        reach up to 600 participants, begun November 2023 and ongoing in November 2024; phase 3
        expansion to cumulatively reach up to 3000 participants; and phase 4 outreach to cumulatively
        reach 5000 participants.
      - >-
        The NIH RePORTER record gives a project start of 2022-09-01 and a project end of 2026-11-30.
      - >-
        The separate app feasibility study at the University of South Florida Health Voice Center ran
        between June 5, 2023 and July 28, 2023 and did not collect audio data.

direct_collection:
  - id: https://b2ai-voice.org/direct-collection/statement
    name: direct collection from individuals
    is_direct: true
    collection_details:
      - >-
        The healthsheet answers "Directly" to whether data was collected from the individuals in
        question directly or obtained via third parties or other sources.
      - The data was collected in the USA and Canada.

collection_notifications:
  - id: https://b2ai-voice.org/notification/consent-process
    name: participant notification
    notification_details:
      - >-
        Yes, participants went through an IRB-approved consent process. Participants were explicitly
        informed about the data that was being collected, the methods used to secure these data, and
        the information that would be used for the study.

collection_consents:
  - id: https://b2ai-voice.org/consent/prospective-informed-consent
    name: prospective informed consent
    consent_details:
      - >-
        All participants have been duly informed and agreed to the collection and the use of their
        data via prospective informed consent.
      - >-
        Consent may be given by signing a physical paper copy, by indicating electronic consent
        within the app or through REDCap surveys, or through video recording within the app. Video
        consent provides an additional level of security by helping verify identity and distinguish
        participants from bots. Electronic consent is housed in REDCap and is HIPAA compliant.
      - >-
        When children participate, parents or guardians provide consent and children provide verbal
        assent where appropriate. Parental permission is obtained from one or both parents; the
        research is minimal risk and does not require permission from both parents or legal
        guardians. Where young children cannot reasonably be asked to assent, typically under seven
        years of age, they are not asked to do so, and assent is documented.
      - >-
        For ongoing longitudinal collection, an electronic consent through the app is administered
        before each subsequent data collection to ensure ongoing consent.
      - >-
        Consent details state that research data that does not contain direct identifiers will be
        shared with external researchers for future research through a secure database; data posing
        low re-identification risk will be shared in registered access with the general public; and
        data that would pose a heightened risk if shared in full open access will be shared through a
        controlled access mechanism with authorized researchers.

consent_revocations:
  - id: https://b2ai-voice.org/consent-revocation/withdrawal
    name: consent revocation and withdrawal
    revocation_details:
      - >-
        Consenting participants are informed that they may withdraw from the study at any point. If a
        participant chooses to withdraw during or before the voice data collection, their data will
        not be included in the database. Participants are informed that research data, including
        voice recordings, cannot be removed from the database once the voice data collection process
        is completed.
      - >-
        For longitudinal data collection, if participants withdraw at any time during the study
        process, the data they have completed will be used in the database. Participants who withdraw
        have the option to complete an optional satisfaction survey; no PHI is collected in it.

missing_data_documentation:
  - id: https://b2ai-voice.org/missing-data/documentation
    name: missing data documentation
    missing_data_patterns:
      - >-
        Each individual answered a common set of questions and then responded to additional questions
        relevant to their primary diagnostic category, so coverage varies by cohort.
      - >-
        Phenotype data files only contain rows for a participant if at least one column is not
        missing.
      - >-
        Some files, whether due to length or other issues, could not generate certain features and so
        are not included in the bundled data, which is why per-feature record counts differ.
    missing_data_causes:
      - Some questions are optional.
      - There may be data collection irregularities that caused some information to be missing.
      - >-
        Features for sensitive records and audio checks, and spectrogram-like features derived from
        free speech, were deliberately removed.
    handling_strategy: >-
      The dataset has been audited internally for missingness and consistency by the data release
      team, and a missingness table is included with the dataset. Generating missingness tables is
      the first step of the documented audit protocol.

raw_data_sources:
  - id: https://b2ai-voice.org/raw-source/acoustic-recordings
    name: acoustic recordings
    source_description: >-
      Raw audio recordings of voice, speech, breathing and cough tasks captured prospectively from
      consenting participants through the Bridge2AI-Voice App for adults and reproschema-ui for
      pediatrics, on tablets with a head-mounted headset and microphone where possible.
    source_type:
      - primary prospective acoustic collection
    access_details: >-
      Raw audio is retained but is not publicly accessible. It is disseminated only through a
      controlled access mechanism; requests are directed to the access committee at
      DACO@b2ai-voice.org, and approved data are made available via Synapse.
    raw_data_format:
      - WAV audio files organised in a Brain Imaging Data Structure v1.9.0 layout
  - id: https://b2ai-voice.org/raw-source/questionnaires
    name: questionnaire and survey responses
    source_description: >-
      Self-reported demographic, confounder, past medical history, validated questionnaire and
      patient-reported outcome responses captured in the collection application and stored in REDCap
      for adults or exported from ReproSchema-UI for pediatrics.
    source_type:
      - participant self-report
    raw_data_format:
      - REDCap exports and ReproSchema-UI exports converted to tab-delimited values
  - id: https://b2ai-voice.org/raw-source/clinical-records
    name: clinical records and gold standard modalities
    source_description: >-
      Existing clinical data reviewed in the electronic health record and gold standard diagnostic
      modalities used for clinical validation, including laryngoscopy images, stroboscopy videos,
      spirometry and flow volume loops, CT and MRI scans, serum biomarkers, whole genome sequencing
      for designated cohorts, and medication or prescription histories.
    source_type:
      - electronic health record extraction
      - clinical imaging and diagnostic testing
    access_details: >-
      No external data was released in the v3.0.0 release; these modalities are extracted at sites
      independently and uploaded through the REDCap database.

ethical_reviews:
  - id: https://b2ai-voice.org/ethics/usf-single-irb
    name: University of South Florida single IRB review
    reviewing_organization: University of South Florida Institutional Review Board
    review_details:
      - >-
        Data collection and sharing for the adult dataset was approved by the University of South
        Florida Institutional Review Board.
      - >-
        The study was submitted and approved by the USF Single IRB and subsite IRBs through the
        Single IRB process. All US-based institutions abide by the single IRB process; once the
        protocol is approved at USF, each participating institution submits review based on the
        single IRB at USF.
      - >-
        The clinical study is not for a drug product and not for a medical device, and no data
        monitoring committee was appointed for this study.
      - >-
        The protocol "Bridge2AI Voice Data Acquisition" is at version V1 dated January 17, 2023 with
        a revision history running through V13 dated July 11, 2025, including V2 (May 3, 2023) which
        modified the protocol to include the pediatric cohort under single IRB.
      - >-
        The separate app feasibility study conducted at the USF Health Voice Center was approved by
        the Institutional Review Board of the University of South Florida under IRB number 004890.
  - id: https://b2ai-voice.org/ethics/sickkids-reb
    name: Hospital for Sick Children Research Ethics Board review
    reviewing_organization: Research Ethics Board at the Hospital for Sick Children
    review_details:
      - >-
        Data collection and sharing for the pediatric dataset was approved by the Research Ethics
        Board at the Hospital for Sick Children.
      - >-
        Canadian institutions, namely Mount Sinai Hospital, SickKids and the University of Toronto,
        do not abide by the single IRB process and apply for a separate research ethics board
        application to comply with Canadian regulations; a copy of the approved application is
        submitted to the USF IRB.
  - id: https://b2ai-voice.org/ethics/genomic-separate-protocol
    name: separate ethics review for genomic data
    review_details:
      - >-
        No genetic information is collected at the USF site. Genomic data collection is performed only
        at Mount Sinai Hospital and the University of Toronto, which submit a separate research ethics
        board protocol; the approval is sent to the USF IRB once obtained.

data_protection_impacts:
  - id: https://b2ai-voice.org/dpia/statement
    name: data protection impact analysis
    impact_details:
      - >-
        The healthsheet answers "No" to whether an analysis of the potential impact of the dataset and
        its use on data subjects has been conducted.

human_subject_research:
  id: https://b2ai-voice.org/human-subjects
  name: human subjects research status
  involves_human_subjects: true
  irb_approval:
    - >-
      Adult data collection and sharing approved by the University of South Florida Institutional
      Review Board through the Single IRB process, with subsite IRBs.
    - >-
      Pediatric data collection and sharing approved by the Research Ethics Board at the Hospital for
      Sick Children.
  ethics_review_board:
    - University of South Florida Institutional Review Board (single IRB of record)
    - Research Ethics Board at the Hospital for Sick Children
    - Separate Canadian research ethics board applications for Mount Sinai Hospital and the University of Toronto
  special_populations:
    - >-
      Pediatric participants aged 2 to 18. Pediatric patients are enrolled only through the pediatric
      sites and not at USF; checklist HRP-416 for children under 21 was completed and appended to the
      protocol.
    - >-
      Participants from socially and economically disadvantaged and underserved populations recruited
      through community outreach clinics under a Plan for Enhancing Diverse Perspectives.
    - >-
      Students, employees and wards of the state are neither specifically included nor specifically
      excluded.
  regulatory_compliance:
    - >-
      HIPAA. All voice data is collected through HIPAA-compliant client applications and sent over a
      secure https protocol to NIH STRIDES partner infrastructure with pre-negotiated NIH agreements
      for data privacy and HIPAA protection.
    - >-
      Common Rule. Identifiable information under HIPAA and the Common Rule, as well as data considered
      sensitive, have been removed from the released dataset.
    - >-
      A partial HIPAA waiver was requested for recruitment purposes to allow review of EHR information
      for incoming clinic patients ahead of their appointments, limited to the study's inclusion
      criteria.

informed_consent:
  - id: https://b2ai-voice.org/informed-consent/procedures
    name: informed consent procedures
    consent_obtained: true
    consent_type:
      - Signed paper consent
      - Electronic consent within the app
      - Electronic consent through REDCap survey forms
      - Video-recorded consent within the app
      - Parental permission with child assent for pediatric participants
    consent_documentation:
      - >-
        Paper consent documents are uploaded and saved electronically in REDCap. All paper and
        electronic versions of consent are stored for a minimum of five years after the completion of
        the study, following required USF procedure.
      - >-
        About 30 minutes is spent explaining the study and consent in detail with time for questions;
        potential participants are asked to explain what they have understood to the research
        assistant to confirm their understanding.
    withdrawal_mechanism:
      - >-
        Participants may withdraw from the study at any point. Data collected before completion of
        voice data collection are excluded; data cannot be removed once voice data collection is
        complete.
    consent_scope:
      - >-
        Consent covers collection of voice, speech and respiratory data plus linked clinical and
        demographic data, and sharing of de-identified data through an open-source database.
      - >-
        Participants who consent also permit investigators to access medical information through EHR
        platforms in order to perform gold standard validation of diagnoses and symptoms.
      - >-
        Within the consent process, individuals are asked if they agree to be contacted in the future
        for further voice data collection; contact information provided for this purpose is stored
        within the institutional database only and is not shared or uploaded to the cloud.

at_risk_populations:
  id: https://b2ai-voice.org/at-risk-populations
  name: at-risk population protections
  at_risk_groups_included: true
  special_protections:
    - >-
      Pediatric patients are enrolled only through pediatric participating institutions and not at
      USF, and checklist HRP-416 for children under 21 was completed and appended to the protocol.
    - >-
      Compensation is provided to the adult population only.
    - >-
      Collection accessibility was facilitated through the normal means of the collection sites,
      including reading questions to participants when needed, and the protocol asks about
      disabilities.
  assent_procedures:
    - >-
      Children provide verbal assent where appropriate; where young children cannot reasonably be
      asked to assent due to limitations in understanding from age and development, typically under
      seven years of age, they are not asked to do so. Assent is documented on a form.
  guardian_consent:
    - >-
      Parents or guardians provide consent for children. Parental permission is obtained from one or
      both parents; this research is minimal risk and does not require permission from both parents or
      legal guardians.
    - >-
      Exclusion criteria include, in the case of pediatric participants, not receiving consent from a
      parent or guardian for de-identified voice and clinical data to be uploaded to an open-sourced
      database.

participant_privacy:
  - id: https://b2ai-voice.org/privacy/protections
    name: participant privacy protections
    anonymization_method:
      - >-
        HIPAA Safe Harbor identifiers were removed, including names, geographic locators, date
        information at resolution finer than years, phone and fax numbers, email addresses, IP
        addresses, Social Security Numbers, medical record numbers, health plan beneficiary numbers,
        device identifiers, license numbers, account numbers, vehicle identifiers, website URLs, full
        face photos, biometric identifiers, and any unique identifiers.
      - State and province were removed; country of data collection was retained.
    reidentification_risk:
      - >-
        Even when removing all HIPAA protected information, each person's voice is unique to them and
        their health at that time in their life, and it is always possible, even if unlikely, that
        someone could recognize a participant's voice, since voice can never be fully de-identified.
      - >-
        The dataset does not achieve K-anonymization with k greater than or equal to 2.
      - >-
        Indirect identifiers were removed where these created a significant risk of participant
        re-identification, for example through combination with other public data available on social
        media, in government registries, or elsewhere.
    privacy_techniques:
      - All raw voice data was removed from the public releases.
      - Transcripts of free speech audio were removed.
      - >-
        Raw audio transcripts were reviewed, and any audio recordings that contained potentially
        identifying information or external voices were removed from the release.
      - >-
        For the pediatric v1.1 release, audio features for all free speech tasks were manually checked
        for the presence of unconsented speakers and personally identifiable information before
        release.
      - >-
        In the event a caregiver's voice is recorded inadvertently, the clips can be discarded either
        by re-recording manually during data collection or during data audit and post-processing.
      - >-
        Two levels of privacy were built: a combined master de-identified database hosted through a
        HIPAA privacy-preserving NIH STRIDES partner, and federated learning in which each institution
        hosts its own data and models are trained without the data leaving the institution.
    data_linkage:
      - >-
        Each institution keeps identified data within the institution. Identifiable PHI is kept in
        REDCap databases with password-protected access only for investigators at the institution
        where the data is collected. Participant numbers and institution numbers are created to allow
        institutions to track and have ownership of their institutional data.

participant_compensation:
  - id: https://b2ai-voice.org/compensation/gift-cards
    name: participant compensation
    compensation_provided: true
    compensation_type:
      - Electronic gift cards
    compensation_amount:
      - >-
        Participants currently receive $40 for a data collection session that takes less than 90
        minutes, and $80 for a session that takes over 90 minutes, for no more than a total of 3
        sessions and maximum compensation of $120.
    compensation_rationale:
      - >-
        Compensation is provided to the adult population only. In the separate app feasibility study,
        participants did not receive financial incentives for completion of the study.

preprocessing_strategies:
  - id: https://b2ai-voice.org/preprocessing/audio-standardization
    name: audio standardization and feature derivation
    preprocessing_details:
      - >-
        Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a
        Butterworth anti-aliasing filter applied.
      - >-
        Spectrograms are time-frequency representations computed using the short-time Fast Fourier
        Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT, further downsampled
        by a factor of two in the time domain after derivation. Mel spectrograms use the same
        parameters with 60 Mel bins, and 60 Mel-frequency cepstral coefficients are extracted from the
        spectrograms.
      - >-
        Articulatory features are generated with the Speech Articulatory Coding package, producing
        kinematic traces of vocal tract articulators and source features as well as measures of
        loudness, periodicity and pitch, all gathered at 50 Hz. Phonetic posteriorgrams, a
        time-varying categorical distribution over acoustic units of speech, are generated at 100 Hz.
      - >-
        Acoustic features were extracted using OpenSMILE, and phonetic and prosodic features were
        computed using Parselmouth and Praat, providing measures of fundamental frequency, formants
        and voice quality. Torchaudio provides pitch contour, spectrograms, mel spectrograms and
        MFCCs. Speech intelligibility metrics are computed for speech tasks.
      - >-
        Waveform-derived features are stored in two formats: a fixed feature format that includes
        static features extracted from the entire waveform, and a temporal format that varies for each
        audio file depending on the length of the recording.
      - >-
        The raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported from
        REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0. Pediatric
        data collected through ReproSchema-UI is extracted and transformed into REDCap format and
        subsequently converted to BIDS.
      - >-
        The healthsheet notes that pre-processing for de-identification consisted of extracting
        features from the raw audio to limit re-identification, with only the extracted features
        released.
    used_software:
      - id: https://github.com/sensein/b2aiprep
        name: b2aiprep
        description: >-
          The code used to preprocess the raw audio waveforms into the parquet files and to merge the
          source data into the phenotype files. The adult v3.1.0 release was generated with b2aiprep
          v3.0.0.
        version: 3.0.0
        license: Apache-2.0
        url: https://github.com/sensein/b2aiprep
      - id: https://github.com/sensein/senselab
        name: SenseLab
        description: Processing audio files for research tasks.
        url: https://github.com/sensein/senselab
  - id: https://b2ai-voice.org/preprocessing/acoustic-quality-controls
    name: in-application acoustic quality control
    preprocessing_details:
      - >-
        The smartphone application for voice data collection includes models to ensure acoustic data
        quality, including volume standardization and noise cancellation.
      - >-
        The v3.1.0 adult release and the v1.1.0 pediatric release add plain-text audio quality metrics
        derived from the recordings.

cleaning_strategies:
  - id: https://b2ai-voice.org/cleaning/statement
    name: cleaning of the data
    cleaning_details:
      - >-
        The healthsheet answers "No" to whether there was any pre-processing for cleaning the data,
        and answers "No" to whether instances were excluded from the dataset at the time of
        preprocessing.
      - >-
        Content removal was nonetheless applied for privacy and sensitivity reasons rather than for
        data cleaning: all sensitive fields encoded as sensitive in the REDCap data dictionary were
        removed; spectrograms, MFCCs, mel spectrograms, transcriptions, EMAs and PPGs from
        open-response prompts were removed from the feature-only dataset; and spectrogram-like
        features for sensitive records and audio checks were removed in adult v3.1 and pediatric v1.1.

labeling_strategies:
  - id: https://b2ai-voice.org/labeling/clinical-gold-standard
    name: clinician gold standard labeling
    data_annotation_platform:
      - REDCap clinical validation forms
    data_annotation_protocol:
      - Per Bridge2AI Protocols and ICD-10 codes.
      - >-
        Gold standard label available in the data, diagnosed by a clinician, using the disease-specific
        validation methods listed in the cohort inclusion and exclusion table.
    annotations_per_item: 1
    annotator_demographics:
      - >-
        Typically the clinician at the site of data collection, or a clinician external to it for a
        prior diagnostic assessment. Single labeler per data item.
    labeling_details:
      - >-
        Diagnostic labels are the result of a clinical assessment of the participant. At each site, a
        local clinician provided the diagnosis based on a clinical interview and appropriate work-up.
        For the psychiatric disorders cohort, this assessment was determined by using the participant's
        EHR record or an active prescription, which was done outside of data collection by an
        appropriately licensed clinician.
      - >-
        Human-level performance in the applications the dataset is supposed to address varies widely.
      - >-
        Adult v3.1.0 updated validated diagnosis information across conditions with back-filled
        information, and renamed certain gold standard variable names.

raw_sources:
  - id: https://b2ai-voice.org/raw-data/adult-synapse
    name: adult raw audio via Synapse
    access_url: https://www.synapse.org/Synapse:syn72370534/
    raw_data_details:
      - >-
        The published Bridge2AI-Voice Adult Dataset contains derived features from the audio waveforms;
        the PhysioNet project does not contain raw audio. Accessing raw audio is a more involved
        process and requires institutional sign-off. Requests go to the access committee at
        DACO@b2ai-voice.org, and data are made available via Synapse.
      - >-
        The healthsheet states the raw data was saved in addition to the preprocessed data and is not
        accessible publicly.
  - id: https://b2ai-voice.org/raw-data/pediatric-synapse
    name: pediatric raw audio via Synapse
    access_url: https://www.synapse.org/Synapse:syn73617068
    raw_data_details:
      - >-
        The published Bridge2AI-Voice Pediatric Dataset contains derived features from the audio
        waveforms; the PhysioNet project does not contain raw audio. Raw pediatric audio is made
        available via a Synapse project distinct from the adult Synapse project, following the same
        controlled access process through DACO@b2ai-voice.org.

machine_annotation_tools:
  - id: https://b2ai-voice.org/machine-annotation/toolchain
    name: automated feature extraction and transcription toolchain
    tools:
      - OpenAI Whisper Large
      - openSMILE
      - Praat
      - parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - ppgs
      - b2aiprep
      - SenseLab
    tool_descriptions:
      - Transcriptions were generated using OpenAI's Whisper Large model.
      - >-
        openSMILE extracts acoustic features capturing temporal dynamics and acoustic characteristics,
        including eGeMAPS features per audio file.
      - >-
        Praat and parselmouth compute phonetic and prosodic features, providing measures of fundamental
        frequency, formants and voice quality.
      - >-
        torchaudio produces pitch contours, spectrograms, mel spectrograms and MFCCs; sparc produces
        electromagnetic articulography estimates plus loudness, periodicity and pitch; ppgs produces
        phonetic posteriorgrams across 40 phoneme categories.
      - >-
        b2aiprep organizes and preprocesses the dataset; SenseLab processes audio files for research
        tasks.
    tool_accuracy:
      - >-
        Certain aspects of the data, for example transcription, were generated using off-the-shelf
        models that have not been audited for correctness.
    used_software:
      - id: https://github.com/sensein/b2aiprep
        name: b2aiprep
        description: Organizing and preprocessing the dataset.
        version: 3.0.0
        license: Apache-2.0
        url: https://github.com/sensein/b2aiprep

existing_uses:
  - id: https://b2ai-voice.org/existing-use/summer-school
    name: Bridge2AI Summer School and hackathon
    examples:
      - >-
        A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer
        School and hackathon.
      - >-
        Training opportunities for using the dataset are offered through https://www.b2aivoicescholars.org/.

use_repository:
  - id: https://b2ai-voice.org/use-repository/none
    name: repository of dataset uses
    repository_details:
      - >-
        The healthsheet answers "No" to whether there is a repository, besides Google Scholar, that
        links to any or all papers or systems that use the dataset.

other_tasks:
  - id: https://b2ai-voice.org/other-tasks/model-lifecycle
    name: additional machine learning tasks
    task_details:
      - >-
        The dataset can be used for AI model pretraining, fine-tuning, benchmarking, or validation.
      - >-
        It aims to support clinical research in disease screening, diagnosis, and monitoring through
        voice biomarkers.
      - >-
        The questionnaire features distributed in the phenotype folder format can be used for cohort
        selection.

future_use_impacts:
  - id: https://b2ai-voice.org/future-use-impact/skews
    name: composition skews affecting future use
    impact_details:
      - >-
        This dataset has skews based on disorder category, site, and other demographic factors. Users
        should consider the multivariate distribution when assessing utility for different questions.
      - >-
        Factors that might limit the generalization of derived models include the number and diversity
        of devices, recording specificities such as variable headset microphone distance, the number
        and diversity of recording sites (five for the adult cohort), and distribution shifts over time
        arising from changes in diagnostic criteria or practices.

discouraged_uses:
  - id: https://b2ai-voice.org/discouraged-use/non-research-applications
    name: discouraged non-research applications
    discouragement_details:
      - >-
        The dataset should not be used for non-clinical or non-research applications such as hiring
        decisions, insurance premium adjustments, or any form of surveillance that could lead to
        discrimination or harm.
      - >-
        These discouraged uses are intended to prevent unethical or biased outcomes that could
        negatively impact individuals based on their health conditions or voice characteristics. The
        dataset is intended strictly for research that prioritizes patient safety, privacy, and ethical
        use.

intended_uses:
  - id: https://b2ai-voice.org/intended-use/research
    name: intended research uses
    examples:
      - Development, benchmarking or validation of clinically applicable AI and machine-learning models.
      - Research on disease screening, diagnosis and monitoring through voice biomarkers.
      - AI model pretraining and fine-tuning.
      - Study of pediatric developmental norms and early screening tools using the pediatric cohort.
    use_category:
      - research
      - commercial and non-commercial research by Authorized Researchers
    usage_notes: >-
      The Bridge2AI Voice dataset is primarily intended for research applications, specifically in the
      development of AI and machine-learning models for healthcare. The registered access agreement
      states the dataset is intended solely for commercial and non-commercial research purposes by
      Authorized Researchers.

prohibited_uses:
  - id: https://b2ai-voice.org/prohibited-use/registered-access-agreement
    name: uses prohibited by the registered access agreement
    description: >-
      Restrictions on the use of this dataset are detailed in the Registered Data Access Agreement and
      reflect the B2AI-Voice Consortium's commitment to advancing ethical and trustworthy research
      practices that respect and protect the rights and interests of research participants.
    prohibition_reason:
      - >-
        The dataset is not to be used to attempt to re-identify research participants, nor for any
        actions that could reasonably lead to re-identification.
      - >-
        The dataset is not to be used for any purpose that could foreseeably cause harm or
        stigmatization to research participants, their families, communities, or specific populations.
      - >-
        Intellectual property protections, database rights, or related rights may not be used in a
        manner that restricts or limits access to any part of the dataset or to any conclusions derived
        from it, so that future use of the dataset remains unrestricted in alignment with Open Science
        principles.
      - >-
        Sale of all or part of the Data on any media is not permitted, and recipients agree not to make
        intellectual property claims on the Data.

