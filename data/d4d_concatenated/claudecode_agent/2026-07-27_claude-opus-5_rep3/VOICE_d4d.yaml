license_and_use_terms:
  id: https://b2ai-voice.org/license-terms
  name: license and use terms
  license_terms:
    - >-
      License for files on both PhysioNet projects: Bridge2AI Voice Registered Access License, with the
      Bridge2AI Voice Registered Access Agreement as the data use agreement. No training is required.
    - >-
      Registered access for the features-only data requires registering on PhysioNet, confirming
      identity, and signing the Bridge2AI-Voice Registered Access Agreement, which outlines the terms
      and conditions for data use. Adult v3.0.0 and v3.1.0 and pediatric v1.1.0 state that only
      credentialed users who sign the DUA can access the files.
    - >-
      Controlled access for raw audio data requires completing the Data Access Request Form (DARF) and
      the Data Use Agreement (DUA), submitting the application to the Data Access Compliance Office for
      review, and, upon approval, ensuring a Data Use and Transfer Agreement (DTUA) is signed by an
      authorized official at the recipient's institution.
    - >-
      Users of the dataset must agree to terms laid out in the registered access agreement. The
      intellectual property terms state that the Data may be protected by copyright and other rights;
      duplication as reasonably required to carry out the Research Project is permitted; sale of all or
      part of the Data on any media is not permitted; nothing transfers intellectual property rights in
      the Data; users agree not to make intellectual property claims on the Data or to use intellectual
      property protection in ways that would prevent or block access to any element of the Data or
      conclusions drawn directly from it; users may obtain intellectual property rights on downstream
      discoveries but agree to implement licensing policies that will not obstruct further research and
      to respect the Fort Lauderdale Agreement. There are no fees associated with these restrictions.
    - >-
      The Data Transfer and Use Agreement names the University of South Florida Board of Trustees as
      the Provider Institution, sets an agreement term ending two years after the start date or upon
      completion of the project, expiration of the applicable ethics approval, or termination by the
      Provider Institution, whichever occurs first, and requires collaborators at other research
      organizations and other research teams at the same organization to apply independently for access
      and sign their own DTUA. Data are provided "AS IS" with no warranties, the recipient assumes all
      liability, and the agreement is effective only upon review and approval by the Data Access
      Compliance Office.
  data_use_permission:
    - general_research_use
  contact_person: Data Access Compliance Office (DACO@b2ai-voice.org)

ip_restrictions:
  id: https://b2ai-voice.org/ip-restrictions
  name: third-party intellectual property restrictions
  restrictions:
    - No IP-based restrictions have been imposed by third parties.
    - >-
      The Data Provider provides no guarantees that the Data is free of third-party intellectual
      property rights, database rights, and other related rights.

regulatory_restrictions:
  id: https://b2ai-voice.org/regulatory-restrictions
  name: regulatory and export control restrictions
  regulatory_restrictions:
    - No export controls apply to the dataset.
  hipaa_compliant: compliant
  other_compliance:
    - >-
      The dataset applies the HIPAA de-identification rules and removes direct identifiers, rebases or
      replaces dates by integers, removes or generalizes geographic information, and removes narrative
      text fields.
    - >-
      Identifiable information under HIPAA and the Common Rule, as well as data considered sensitive,
      have been removed from this dataset.
    - >-
      Data are hosted on cloud servers through NIH STRIDES partners (Amazon, Google, Microsoft), which
      have pre-determined agreements with the NIH to ensure HIPAA protection and participant safety.
  confidentiality_level: restricted
  governance_committee_contact: Data Access Compliance Office (DACO@b2ai-voice.org)

