file_collections:
  - id: https://physionet.org/content/b2ai-voice/3.1.0/features
    name: b2ai-voice adult v3.1.0 features
    title: Adult derived audio features
    path: features
    collection_type:
      - processed_data
    description: >-
      Derived audio features for the adult cohort, distributed as Parquet binary files plus
      plain-text tables, each accompanied by a JSON data dictionary with the same file stem.
      Parquet files are ppgs.parquet, sparc_ema.parquet, sparc_loudness.parquet,
      sparc_periodicity.parquet, sparc_pitch.parquet, torchaudio_spectrogram.parquet,
      torchaudio_mfcc.parquet, torchaudio_pitch.parquet, and
      torchaudio_mel_spectrogram.parquet. Plain-text files are audio_quality_metrics.tsv
      (one row of quality-control metrics per audio recording, new in v3.1.0) and
      static_features.tsv (features derived from the raw audio, one per audio recording).
      Element counts in v3.1.0 are 29,278 for torchaudio_spectrogram, torchaudio_mel_spectrogram
      and torchaudio_mfcc; 32,522 for torchaudio_pitch; 28,640 for sparc_ema; 31,855 for
      sparc_loudness; 31,872 for sparc_periodicity and sparc_pitch; and 29,289 for ppgs.
      Spectrograms, mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive records
      and audio checks were removed from v3.1.
  - id: https://physionet.org/content/b2ai-voice/3.1.0/phenotype
    name: b2ai-voice adult v3.1.0 phenotype
    title: Adult phenotype tables
    path: phenotype
    collection_type:
      - processed_data
    description: >-
      Tab-delimited phenotype tables with paired JSON data dictionaries, organised into
      confounders, demographics, diagnosis, enrollment, questionnaire and task subfolders.
      The v3.1.0 diagnosis subfolder covers airway stenosis, amyotrophic lateral sclerosis,
      anxiety, benign lesions, bipolar disorder, cognitive impairment, control, COPD and
      asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal dystonia,
      laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous lesions,
      unexplained chronic cough, and unilateral vocal fold paralysis. The questionnaire
      subfolder covers adhd_adult, custom_affect_scale, dsm5_adult, dyspnea_index,
      gad7_anxiety, leicester_cough_questionnaire, panas, phq9, productive_vocabulary,
      psychiatric_history, ptsd_adult, vhi10 and voice_perception. Phenotype files contain a
      row for a participant only if at least one column is not missing, and participants with
      repeated visits may have more than one row.
  - id: https://physionet.org/content/b2ai-voice/3.1.0/metadata
    name: b2ai-voice adult v3.1.0 metadata
    title: Adult per-recording metadata
    path: metadata
    collection_type:
      - metadata
    description: >-
      A Parquet binary file and its data dictionary carrying per-recording information for the
      adult cohort, including task instructions and prompts and information about the
      microphone used and its gain. This folder was introduced in v3.1.0.
  - id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features
    name: b2ai-voice-pediatric v1.1.0 features
    title: Pediatric derived audio features
    path: features
    collection_type:
      - processed_data
    description: >-
      Derived audio features for the pediatric cohort, distributed as Parquet binary files
      plus plain-text tables with paired JSON data dictionaries. Element counts are 23,533 for
      torchaudio_spectrograms, torchaudio_mel_spectrograms, torchaudio_mfcc, torchaudio_pitch
      and ppgs, and 23,532 for sparc_ema, sparc_loudness, sparc_periodicity and sparc_pitch.
      The folder also contains static_features.tsv and audio_quality_metrics.tsv.
      Spectrograms, mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive records
      and audio checks were removed from v1.1.
  - id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/phenotype
    name: b2ai-voice-pediatric v1.1.0 phenotype
    title: Pediatric phenotype tables
    path: phenotype
    collection_type:
      - processed_data
    description: >-
      Phenotypic information acquired from pediatric participants or their parents or
      decision-makers during data collection, distributed as tab-delimited tables that can be
      read with any statistical analysis tool.
  - id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/metadata
    name: b2ai-voice-pediatric v1.1.0 metadata
    title: Pediatric per-recording metadata
    path: metadata
    collection_type:
      - metadata
    description: >-
      Per-recording metadata information for the pediatric cohort, released alongside the
      v1.1.0 audio quality metrics.

purposes:
  - id: https://b2ai-voice.org/purpose/flagship-voice-dataset
    name: create a flagship ethically sourced voice dataset
    description: Primary purpose stated in the project documentation and healthsheet.
    response: >-
      The Bridge2AI Voice dataset was created to address a gap in the availability of
      large-scale, diverse, and well-documented voice data for use in clinical machine-learning
      applications. Previous studies on machine learning-based voice diagnosis produced
      promising results, but their sample sizes were too small, or they lacked the key metadata
      needed for training robust, clinically useful models. The dataset aims to bridge this gap
      by providing an ethically sourced, large, and diverse dataset to develop, benchmark, or
      validate clinically applicable AI/ML models. The goal is to facilitate the use of voice
      as a non-invasive, cost-effective biomarker for the screening, diagnosis, and monitoring
      of a wide range of health conditions.
  - id: https://b2ai-voice.org/purpose/audiomics-standards
    name: establish standards and infrastructure for audiomics
    description: Purpose stated in the audiomics white paper and the NIH RePORTER project record.
    response: >-
      Beyond the primary deliverable of a publicly available voice database, the team aims to
      address gaps in audiomics by ensuring quality and accuracy of acoustic data and associated
      clinical data through clinical validation and evidence-based recording protocols; aiming
      for interoperability of data by creating new bioinformatics standards for voice data;
      creating benchmarks of diversity metrics and minimizing risk of algorithmic bias; defining
      ethical and legal norms safeguarding patients' data while supporting data-sharing efforts;
      developing infrastructure for audiomics data storage and sharing within and across research
      institutions; and formulating training pathways for scientists, engineers, bioethicists,
      and clinicians to develop skills in audiomics.
  - id: https://b2ai-voice.org/purpose/pediatric-developmental-norms
    name: enable study of pediatric voice and speech development
    description: Purpose stated in the PhysioNet pediatric dataset background section.
    response: >-
      Pediatric and adult voice and speech production are fundamentally different because the
      respiratory system and larynx undergo rapid functional maturation throughout childhood, so
      normative data derived in adults cannot be generalized to pediatric populations.
      Establishing a robust multi-institutional dataset that integrates pediatric voice data with
      demographic information is intended to enable study of developmental norms, create AI-driven
      tools for early screening, and support clinical insight into pediatric communication
      disorders such as autism spectrum disorder and speech delays.

tasks:
  - id: https://b2ai-voice.org/task/disease-detection-classification
    name: disease detection and classification from voice
    description: Predefined tasks and labels shipped with the release.
    response: >-
      The current version of the dataset comes with predefined tasks and labeling. The tasks are
      primarily designed for training machine-learning models for disease detection and
      classification using voice data. Labels include diagnostic categories such as vocal
      pathologies, neurological disorders, psychiatric conditions, and respiratory disorders.
      There are no predefined recommended data splits for training, validation, or testing;
      researchers are encouraged to create their own data splits based on their specific
      requirements.
  - id: https://b2ai-voice.org/task/model-development-benchmarking
    name: development, benchmarking and validation of clinical ML models
    description: Task framing stated in the healthsheet general information section.
    response: >-
      The Bridge2AI Voice dataset aims to enable the development, benchmarking, or validation of
      clinically applicable machine-learning models for diagnosing a wide range of health
      conditions using voice data, including vocal pathologies, neurological, psychiatric,
      respiratory, and pediatric voice disorders.

addressing_gaps:
  - id: https://b2ai-voice.org/gap/small-nondiverse-datasets
    name: small, non-diverse and non-standardized voice datasets
    response: >-
      Current literature on voice biomarkers has only been studied on small- to medium-sized data
      sets with limited data outside of acoustic measures not linked to multi-modal health data,
      and comparing studies or pooling data is challenging due to a lack of existing standards in
      how voice and other acoustics are measured and collected. When machine-learning applications
      for screening and diagnosis of laryngeal cancer were reviewed, most studies reported training
      datasets of fewer than 300 patients, and only two studies used more than one data modality.
      Industry holds vast amounts of voice data but lacks accurate clinical or demographic
      information, which prevents external auditing of training datasets for fair representation.
  - id: https://b2ai-voice.org/gap/pediatric-data-scarcity
    name: scarcity of open pediatric voice datasets
    response: >-
      Despite the clinical importance of detecting pediatric communication disorders such as autism
      spectrum disorder and speech delays, the availability of large-scale pediatric datasets
      remains limited. Data collection in pediatric populations poses unique challenges such as
      privacy issues, consent processes, and the need for developmentally appropriate tasks. These
      factors have contributed to the lack of publicly available pediatric datasets that enable
      machine learning for pediatric voice analysis.

