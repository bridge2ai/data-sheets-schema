errata:
  - id: https://b2ai-voice.org/erratum/changelog
    name: erratum and changelog
    erratum_details:
      - >-
        There is no erratum. A changelog for each dataset version is published online with the dataset
        metadata.
      - >-
        Adult release v2.0.1 consisted of corrections in the authorship list, and v2.0 reprocessed
        spectrograms to fix minor issues identified in the previous release. Adult v3.1.0 fixed broken
        parquet files from the previous release.

updates:
  id: https://b2ai-voice.org/updates
  name: update plan
  frequency: semi-annual (twice a year)
  update_details:
    - >-
      Further versions of the dataset will be released on a semi-annual (twice a year) basis. Users
      will be notified through news items on the hosting platform as well as through standard
      communication channels.
    - >-
      The healthsheet text, written when the current release was v2.0.0, states that these updates
      will be distributed as new versions of the dataset on the Health Data Nexus platform. The
      current adult and pediatric releases are instead distributed on PhysioNet, and the project
      documentation describes Health Data Nexus as hosting an earlier version of the feature-only
      dataset.
    - >-
      The dataset is released as static versions rather than being dynamically updated.
    - >-
      The public data releases do not contain an equal distribution of the disease categories; further
      releases will contain additional data. Spanish protocols and data collection will be included in
      future releases.

retention_limit:
  id: https://b2ai-voice.org/retention
  name: data retention limits
  retention_period: >-
    Indefinite for contributed research data; a maximum of 10 years after study completion for
    identifiable data held locally.
  retention_details:
    - >-
      Once data is contributed, the data will be retained as long as it is useful for research purposes,
      possibly indefinitely.
    - >-
      Identifiable data and datasheets linking participant numbers to participant information will be
      kept in each institution on local cloud storage for a maximum of 10 years after study completion,
      then destroyed, under the responsibility of each local principal investigator.
    - >-
      The USF IRB requires de-identified study data and original consent forms to be stored for a
      minimum of five years after the completion of the study; original paper consent documents cannot
      be destroyed until five years after study completion.
    - >-
      All entries to the recruitment REDCap system are deleted once patients are enrolled, or within 90
      days of their submission, whichever comes first.

version_access:
  id: https://b2ai-voice.org/version-access
  name: version availability
  versions_available:
    - 'Adult b2ai-voice: 1.1 (Jan. 17, 2025), 2.0.0 (April 16, 2025), 2.0.1 (Aug. 18, 2025), 3.0.0 (Dec. 16, 2025), 3.1.0 (May 1, 2026)'
    - 'Pediatric b2ai-voice-pediatric: 1.0.0 (Dec. 17, 2025), 1.1.0 (May 1, 2026)'
  version_details:
    - >-
      By default, older versions of the dataset will continue to be supported, hosted, and made
      available to researchers. Each version of the dataset has a unique DOI. The dataset publishers
      reserve the right to remove access to older versions.
    - >-
      The PhysioNet page for adult v1.1 states that the files for that version are no longer available
      and that the latest version is 3.1.0.
    - >-
      The adult and pediatric projects maintain separate version lineages and separate latest-version
      DOIs.

extension_mechanism:
  id: https://b2ai-voice.org/extension
  name: extension and contribution mechanism
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
    - >-
      For dataset extensions and augmentations, it is possible for others to publish a derivative
      dataset on the Health Data Nexus which references the original source. These derivative datasets
      may be made available under the same conditions as the source data.
    - >-
      For augmentations to the code used to produce the data, the open-source repositories have
      discussion forums and issue pages which allow for public discussion of data preprocessing. The
      repository also has a mechanism, pull requests, for contributing improvements to the data
      preprocessing code.

is_deidentified:
  id: https://b2ai-voice.org/deidentification
  name: de-identification status
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor identifier removal combined with removal of indirect identifiers and of
    non-identifying but highly sensitive elements, plus withholding of all raw audio.
  identifiers_removed:
    - Names
    - Civic addresses
    - Social security numbers
    - Geographic locators, including state and province
    - Date information at resolution finer than years
    - Phone and fax numbers, email addresses, IP addresses
    - Medical record numbers, health plan beneficiary numbers, account numbers
    - Device identifiers, license numbers, vehicle identifiers, website URLs
    - Full face photos and biometric identifiers
    - Select demographic identifiers and information about household composition or cultural identity
    - Narrative text fields and transcripts of free speech audio
    - All raw voice data
  deidentification_details:
    - >-
      The level of de-identification for this dataset is that identifiable information under HIPAA and
      the Common Rule, as well as data considered sensitive, have been removed.
    - >-
      Non-identifying elements of data that revealed highly sensitive information, such as household
      income, mental health status and traumatic life experiences, were also removed.
    - >-
      All sensitive fields were removed from the dataset, corresponding to data elements encoded as
      sensitive under the column name "Identifier?" in the REDCap data dictionary.
    - >-
      Country of data collection was retained.
    - >-
      The dataset removes direct identifiers, applies the HIPAA de-identification rules, rebases and/or
      replaces dates by integers, removes or generalizes geographic information, and removes narrative
      text fields, but does not achieve K-anonymization with k greater than or equal to 2.

related_datasets:
