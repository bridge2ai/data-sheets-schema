      - bridge2ai
      - voice
    description: >-
      The Bridge2AI-Voice Pediatric Dataset, published as PhysioNet project b2ai-voice-pediatric and
      distinct from the adult b2ai-voice project. Version 1.1.0 contains derived audio features for
      23,533 recordings collected from 300 participants aged 2 to 18. Patients and healthy volunteers at
      the Hospital for Sick Children were considered for enrollment; eligibility required an age of 2 to
      18 years and English proficiency, while participants over 18 years of age and individuals who were
      non-verbal were excluded. Non-patients were recruited through research postings and evaluated
      against the same criteria. All data was collected through reproschema-ui on tablets, with a headset
      used for most participants and the built-in tablet microphone for the remainder. All participants
      completed the recording and demographic data collection in one session; where a participant lacked
      adequate comprehension or familiarity with their past medical history, a parent or decision-maker
      completed the survey on a separate tablet during the recording. The release contains data
      considered low risk, including derivations such as spectrograms but not the original voice
      recordings.
