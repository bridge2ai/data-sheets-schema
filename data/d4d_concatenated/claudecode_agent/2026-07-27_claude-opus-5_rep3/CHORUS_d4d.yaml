    strategies:
      - Sampling to ensure comprehensive sets of patient conditions and clinical treatment strategies
      - Federated access enabling sampling methods to ensure a balanced and diverse cohort
    description: >-
      The dataset is a sample of critically ill patients drawn from the participating data
      acquisition centers rather than all possible instances. The source documents state the
      sampling aims but do not report a formal representativeness assessment.

