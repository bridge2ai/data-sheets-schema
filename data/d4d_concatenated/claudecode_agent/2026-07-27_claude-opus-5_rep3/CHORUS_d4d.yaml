missing_data_documentation:
  - id: d4d:chorus-missing-data
    name: Modality coverage gaps as of the August 2025 status report
    missing_data_patterns:
      - Imaging was limited to approximately 1,000 images, with a larger cohort pending de-identification
      - EEG waveform extraction was still in process
      - Clinical note text is held locally at contributing sites; only tokens are present in the enclave
      - Radiology data are present for 7,642 of the 50,000 released admissions
    missing_data_causes:
      - De-identification of the larger imaging cohort was in process
      - EEG extraction from hospital databases was in process
      - Notes are retained at sites, with tokenization used to move derived content into the enclave
    handling_strategy: >-
      Data acquisition continues toward the anticipated final dataset of 100,000 patient
      admissions across 9 data modalities from 14 contributing hospitals, and contributing sites
      report status updates that are tracked to identify and resolve blocking issues.

