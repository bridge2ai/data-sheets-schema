relationships:
  - id: d4d:chorus-relationships
    name: Multi-modal harmonization around patient admissions
    relationship_details:
      - Unified standards harmonize multi-modal EHR, waveform, imaging, and text data within the repository
      - Modality coverage is reported per admission, for example 7,642 admissions with radiology data out of 50,000 released admissions
      - Validated semantic mappings connect clinical data in various source formats to international standards

splits:
  - id: d4d:chorus-splits
    name: Sequestered holdout test set
    split_details:
      - The project sequesters holdout datasets for external validation
      - The holdout test set is accessible for model external validation to aid marketplace adoption of AI-developed models for implementation in acute and critical care
      - The source documents do not state the size or the selection procedure for the holdout set

acquisition_methods:
  - id: d4d:chorus-acquisition
    name: Retrospective extraction from hospital clinical systems
    acquisition_details:
      - Data collection is retrospective
      - Structured EHR elements are documented in the course of clinical care, including procedures and diagnoses documented by providers and nursing flowsheets recorded as high-frequency documentation
      - Medication administration is time-stamped upon each infusion change or dose administration
      - Imaging is extracted from hospital picture archiving and communication systems (PACS)
      - Waveform telemetry is acquired from bedside monitors through gateway and middleware systems
      - EEG waveforms are drawn from hospital EEG databases
      - Clinical notes are extracted and tokenized using the OHNLP toolkit
      - Data are obtained from hospital clinical systems at contributing sites rather than directly from the individuals in question

collection_mechanisms:
  - id: d4d:chorus-collection-mechanisms
    name: SOP-driven, tooling-supported multi-site data contribution
    mechanism_details:
      - Data contributing sites follow standard operating procedures published in the Chorus_SOP repository, which provides an interactive workflow diagram describing the step-by-step process for extracting and contributing clinical data to CHoRUS, with links to SOP documents that have undergone internal validation and review
      - A dedicated Data Acquisition Module SOP is published in the data_acq_SOP repository
      - The chorus-extract-upload repository provides tools to create and upload a CHoRUS Data Extract
      - Validated semantic mappings connect clinical data in various source formats to international standards, with pooled tabular mappings and a clinical validation SOP in the chorus-mapping repository
      - Sites submit regular status updates on their progress in creating and curating a CHoRUS-specific clinical data extract, either through the GitHub interface or through a Google Form whose submissions trigger a GoogleScript that calls the GitHub API to update status and issue information
      - Issues encountered in creating or submitting a data extract are posted to context-specific Standards Discussions or Data Acquisition Discussions
      - Dockerized container applications and associated configurations are deployed to support CHoRUS services on Azure
    used_software:
      - id: d4d:software-chorus-extract-upload
        name: chorus-extract-upload
        description: Repository with tools to create and upload a CHoRUS Data Extract. Python.
        license: MIT
        url: https://github.com/chorus-ai
      - id: d4d:software-chorus-sop
        name: Chorus_SOP
        description: CHoRUS centralized SOP documentation site. MDX.
        license: Apache-2.0
        url: https://github.com/chorus-ai
      - id: d4d:software-data-acq-sop
        name: data_acq_SOP
        description: An online documentation SOP for the Data Acquisition Module. JavaScript.
        url: https://github.com/chorus-ai
      - id: d4d:software-chorus-container-apps
        name: chorus-container-apps
        description: >-
          Set of dockerized container applications and associated configurations to be deployed
          to support CHoRUS services on Azure. JavaScript.
        url: https://github.com/chorus-ai

sampling_strategies:
  - id: d4d:chorus-sampling
    name: Sampling for a comprehensive and balanced critical care cohort
    is_sample: true
    source_data:
