sensitive_elements:
  - id: d4d:chorus-sensitive-elements
    name: Sensitive clinical and contextual elements
    sensitive_elements_present: true
    sensitivity_details:
      - Patient-level clinical data from critically ill patients, including demographics, diagnoses, procedures, medications, nursing documentation, clinical notes, imaging, telemetry waveforms, and EEG waveforms
