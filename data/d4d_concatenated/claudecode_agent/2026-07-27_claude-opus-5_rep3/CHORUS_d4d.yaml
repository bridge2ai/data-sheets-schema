      - The project analyses the existing legal and regulatory landscape and creates new approaches in response
      - Legal and ethical research is performed alongside tool development, data acquisition, and education
      - Data are transformed using approaches that limit re-identification
      - The overarching goal is stated as ensuring that the methods promote privacy, accountability, and clinical benefit
      - Community perspectives are evaluated to increase trustworthiness of provenance and privacy in AI

human_subject_research:
  id: d4d:chorus-human-subject-research
  name: Human subjects data from critically ill patients
  involves_human_subjects: true
  special_populations:
    - Patients with acute or critical illness
    - Pediatric intensive care unit admissions
    - Neonatal intensive care unit admissions
  description: >-
    The dataset consists of clinical data from patients with acute or critical illness,
    including admissions from ICU, PICU, and NICU settings. The source documents describe
    ethics focus groups, legal and regulatory analysis, and privacy-preserving transformation,
    but do not report an institutional review board approval, an ethics review board name, or
    specific regulatory compliance determinations for the dataset.

at_risk_populations:
  id: d4d:chorus-at-risk-populations
  name: Critically ill, pediatric, and neonatal patients
  at_risk_groups_included: true
  description: >-
    The released dataset includes admissions from pediatric and neonatal intensive care units
    as well as adult intensive care, so it covers critically ill patients including minors. The
    source documents do not describe assent procedures, guardian consent procedures, or
    protections specific to these groups beyond the project-wide privacy, de-identification, and
    controlled-access measures.

participant_privacy:
  - id: d4d:chorus-participant-privacy
    name: Tokenization, de-identification, and controlled access
    anonymization_method:
      - Tokenization of unstructured electronic health record data, with clinical notes extracted and tokenized using the OHNLP toolkit and only tokens moved into the enclave
      - De-identification of imaging, in process for the larger imaging cohort as of August 2025
      - Transformation of data using approaches that limit re-identification
    reidentification_risk:
      - The project states that data are transformed using approaches that limit re-identification, but the source documents do not report a quantitative re-identification risk assessment
    privacy_techniques:
      - Storage of OMOP data and telemetry in a controlled cloud enclave
      - Local retention of clinical note text at contributing sites
      - Controlled access for every data type, gated by a signed licensing agreement
      - A privacy scanning tool for medical records
    data_linkage:
      - Geocoding of OMOP Location entities is used to derive contextual factors such as geographic distance to the nearest hospital
    used_software:
      - id: d4d:software-privacy-scan-tool
        name: privacy_scan_tool
        description: A privacy scan tool for medical records. Python.
        url: https://github.com/chorus-ai
      - id: d4d:software-ctp-deid
        name: CTP-deid
        description: CHoRUS de-identification repository listed in the chorus-ai GitHub organization.
        url: https://github.com/chorus-ai

preprocessing_strategies:
  - id: d4d:chorus-preprocessing
    name: Standardization, tokenization, and format conversion
    preprocessing_details:
      - Structured electronic health record data are standardized to the OMOP Common Data Model
      - Unstructured electronic health record data are tokenized; clinical notes are extracted and tokenized using the OHNLP toolkit
      - Telemetry waveforms are converted to the WFDB format, supported by waveform conversion scripts and documentation
      - EEG waveforms are handled in the EDF+ and Persyst formats
      - Imaging from PACS is prepared in DICOM with de-identification applied
      - Data are transformed using approaches that limit re-identification
      - OMOP Location entities are geocoded via DeGauss to derive contextual factors such as geographic distance to the nearest hospital
      - Validated semantic mappings connect clinical data in various source formats to international standards
    used_software:
      - id: d4d:software-chorus-waveform
        name: chorus_waveform
        description: CHoRUS waveform documentation and various waveform conversion scripts. Jupyter Notebook.
        license: MIT
        url: https://github.com/chorus-ai
      - id: d4d:software-chorus-waveform-resources
        name: chorus_waveform_resources
        description: Resources which support the preparation and release of waveforms.
        url: https://github.com/chorus-ai
      - id: d4d:software-uf-geocoding
        name: UF-Geocoding
        description: >-
          Open source code to geocode OMOP Location entities via DeGauss. Python. Forked from
          bihorac-LAB/Exposome.
        license: MIT
        url: https://github.com/chorus-ai

cleaning_strategies:
  - id: d4d:chorus-cleaning
    name: SOP-based curation and site characterization reports
    cleaning_details:
      - Standard operating protocols instruct data contributing sites about best practices for curating and delivering interoperable datasets
      - Characterization reports are produced and returned to sites following their data submissions
      - Site status is tracked to identify and resolve blocking issues in creating and curating CHoRUS-specific clinical data extracts
      - SOP documents undergo an internal validation and review process within the Chorus_SOP repository
      - The source documents do not describe instance removal or missing-value processing rules
    used_software:
      - id: d4d:software-chorus-reports
        name: CHoRUSReports
        description: >-
          Repository dedicated to producing characterization reports to return to sites following
          their data submissions. R.
        url: https://github.com/chorus-ai

labeling_strategies:
  - id: d4d:chorus-labeling
    name: Annotation environment and clinically validated semantic mapping
    data_annotation_platform:
      - A visualization and annotation environment developed by the project
    data_annotation_protocol:
      - A clinical validation SOP governs contributions to the semantic mapping effort
      - Pooled tabular mappings and documentation are maintained in the chorus-mapping repository
    labeling_details:
      - A visualization and annotation environment labels data with targets important for prediction
      - Clinical expertise is applied to semantic mapping and validation within CHoRUS
      - The source documents do not report annotations per item, inter-annotator agreement, or annotator demographics

raw_sources:
  - id: d4d:chorus-raw-data-retention
    name: Retention of source data at contributing sites
    raw_data_details:
      - Clinical notes are stored locally at contributing sites, with only tokens placed in the CHoRUS enclave
      - OMOP data and telemetry are held in the CHoRUS cloud enclave
      - The source documents do not provide a public link or access point to raw, pre-standardization site data

machine_annotation_tools:
  - id: d4d:chorus-machine-annotation-tools
    name: Automated extraction, de-identification, and geocoding tools
    tools:
      - OHNLP toolkit
      - privacy_scan_tool
      - DeGauss geocoding via UF-Geocoding
    tool_descriptions:
      - The OHNLP toolkit extracts and tokenizes clinical notes; the OHNLP open source schema is listed as the published metadata schema for this data type
      - privacy_scan_tool is a privacy scan tool for medical records, written in Python
      - UF-Geocoding provides open source code to geocode OMOP Location entities via DeGauss
    tool_accuracy:
      - The source documents do not report accuracy metrics for these tools

existing_uses:
  - id: d4d:chorus-existing-uses
    name: Training activities and publications
    examples:
      - The datasets are being used for training activities and publications
      - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI CHoRUS data through engagement, AI training, and mentorship, with cohort 2 running from 2025-11-17 to 2026-07-31 and up to 30 trainees selected
      - Trainees receive hands-on training on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud and use the data and tools to create practical use cases
      - Trainees are expected to present works-in-progress posters at the Bridge2AI Annual Meeting in May 2026 and the AIM-AHEAD Annual Meeting in July 2026, and may submit conference abstracts or develop manuscripts for peer-reviewed journals

future_use_impacts:
  - id: d4d:chorus-future-use-impacts
    name: Privacy, bias, and regulatory considerations affecting future use
    impact_details:
      - The project analyses the existing legal and regulatory landscape and develops a legal framework for collecting data at scale, which shapes what may be done with the data
      - Patient-focused efforts determine the ethical and legal approaches to manage privacy and bias, while accounting for social determinants of health
      - Data are transformed using approaches that limit re-identification, which may constrain analyses that depend on fine-grained identifiers
      - Community-facing ethics focus groups determine what data is appropriate for public sharing, so the publicly shareable scope is set by that process
      - Modality coverage was uneven as of August 2025, with imaging limited and EEG extraction in process, which affects the conclusions that multimodal analyses can support

intended_uses:
  - id: d4d:chorus-intended-uses
    name: Recommended applications of the CHoRUS dataset
    examples:
      - Machine learning and AI applications characterizing acute and critical care illness
      - Predicting complications among patients with acute or critical illness
      - Measuring treatment response among patients with acute or critical illness
      - External validation of AI models against the sequestered holdout test set, to aid marketplace adoption of AI-developed models for implementation in acute and critical care
      - Hands-on AI/ML training and workforce development on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud
      - Innovative research at the intersection of healthcare challenges and AI/ML using multi-modal datasets from a broad range of cohort participants
    use_category:
      - Clinical care AI research
      - Model external validation
      - Education and training

distribution_formats:
  - id: d4d:chorus-distribution
    name: Controlled-access delivery through the CHoRUS collaborative cloud
    description: >-
      The dataset is made available under controlled access through the Bridge2AI AI/ML for
      Clinical Care Collaborative Cloud. OMOP data and telemetry are held in the enclave;
      clinical notes remain at contributing sites with only tokens in the enclave. Container
      applications supporting CHoRUS services are deployed on Azure. Data are provided in OMOP,
      OHNLP, DICOM, WFDB, and EDF+/Persyst representations.
    access_urls:
      - https://chorus4ai.org/
      - https://github.com/chorus-ai

distribution_dates:
  - id: d4d:chorus-distribution-dates
    name: Release status
    release_dates:
      - A current released dataset was available as of the project website snapshot, comprising 50,000 patient admissions, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data
      - As of August 2025 the dataset covered 14 different hospitals with over 45,000 unique admissions
      - The source documents do not state a formal release date or a versioned release schedule

third_party_sharing:
  - id: d4d:chorus-third-party-sharing
    name: Sharing beyond the consortium
    is_shared: true
    description: >-
      The overarching goal is a publicly available, AI-ready critical care dataset. The dataset
      is shared outside the consortium under controlled access, including with trainees in the
      AIM-AHEAD Bridge2AI for Clinical Care Training Program and with external parties using the
      holdout test set for model validation.

license_and_use_terms:
  id: d4d:chorus-license-and-use-terms
  name: Controlled access under a signed licensing agreement
  license_terms:
    - Access control is listed as controlled for every CHoRUS data type
    - All participants in the AIM-AHEAD Bridge2AI for Clinical Care Training Program must sign a licensing agreement included in the registration form before gaining access to the dataset
    - Registration requires name, email, and institution; once access is granted and compute is provisioned, an email is sent
    - A ".edu" email address is required to gain access to the dataset in the training program context; program administrators will assist with this access if needed, and this requirement is stated not to be a barrier to acceptance into the program
    - The source documents do not state a license identifier or license text for the dataset itself. The MIT License stated in the chorus-ai GitHub organization README applies to that software project, not to the dataset
  contact_person: 'CHoRUS access requests: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org'
  description: >-
    Terms are described from the perspective of the training program registration flow and the
    GitHub organization contact information. The source documents do not reproduce the licensing
    agreement itself, do not state fees, and do not state a data use permission taxonomy.

regulatory_restrictions:
  id: d4d:chorus-regulatory-restrictions
  name: Controlled-access confidentiality classification
  confidentiality_level: restricted
  description: >-
    Every CHoRUS data type is listed with controlled access control, and access is gated by a
    signed licensing agreement, so the dataset is restricted rather than unrestricted. The source
    documents do not state export control determinations, a HIPAA compliance determination for
    the dataset, or other named regulatory compliance frameworks applying to the dataset itself.

maintainers:
  - id: d4d:chorus-maintainer-consortium
    name: CHoRUS consortium, led from Massachusetts General Hospital
    role: academic_institution
    maintainer_details:
      - The CHoRUS consortium spans 20 academic centers with more than 60 members; Massachusetts General Hospital is the organization of record for the NIH award
      - Ciera McCrary, Massachusetts General Hospital, is the program manager and the contact listed on the project website (cmccrary@mgh.havard.edu, as printed on the site)
      - Access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org
      - The chorus-ai GitHub organization README lists the project website as www.bridge2ai.org/chorus, alongside the public-facing project site at https://chorus4ai.org/
      - The chorus-ai GitHub organization hosts 28 repositories and maintains the project's software, standards, SOPs, and mappings; package versions, maintainers, and other metadata are tracked on a package status page compiled in the chorus-developer repository
      - The project website states that the repository is under review for potential modification in compliance with Administration directives

updates:
  id: d4d:chorus-update-plan
  name: Ongoing accrual toward the anticipated final dataset
  update_details:
    - Data acquisition continues toward an anticipated final dataset of 100,000 patient admissions, 9 data modalities, and 14 data contributing hospitals
    - De-identification of a larger imaging cohort and extraction of EEG were in process as of August 2025
    - Metadata publication is listed as planned for some data types
    - Data contributing sites provide regular status updates on their progress, tracked through GitHub projects and a Google Form integration
    - Task tracking is being consolidated from per-repository projects into a central task management project
    - The source documents do not state an update frequency or a formal versioning policy
  description: >-
    Update information is inferred from the project's stated acquisition targets and status
    tracking practices; no formal update schedule appears in the source documents.

version_access:
  id: d4d:chorus-version-access
  name: Current released dataset relative to the anticipated final dataset
  versions_available:
    - 'Current released dataset: 50,000 patient admissions from ICU, PICU, and NICU; 1.6 billion rows of EHR OMOP data; 7,642 admissions with radiology data; 23 Tb waveform data'
    - 'Anticipated final dataset: 100,000 patient admissions; 9 different data modalities; 14 data contributing hospitals'
  version_details:
    - The project website distinguishes a current released dataset from an anticipated final dataset, but does not assign version identifiers or DOIs to either
    - The source documents do not state whether older releases will continue to be supported or hosted

extension_mechanism:
  id: d4d:chorus-extension-mechanism
  name: Contribution through the chorus-ai GitHub organization
  contribution_url: https://github.com/chorus-ai
  extension_details:
    - The chorus-ai GitHub organization houses active repositories providing software and tooling to interact with and extract insight from clinical data in diverse formats, validated semantic mappings, standard operating protocols for data contributing sites, and project management overviews
    - Clinical collaborators can contribute to mapping efforts through the chorus-mapping repository, which holds documentation, pooled tabular mappings, and an associated clinical validation SOP
    - Data site managers can raise issues in the Standards Discussions or Data Acquisition Discussions
    - Software contributors and users are directed to a web guide compiling documentation in the chorus-developer repository
    - Sites may submit status updates through the GitHub interface or a Google Form
    - Interest in downstream analytics on the mapped and assembled dataset is handled through the published contact addresses

is_deidentified:
  id: d4d:chorus-deidentification
  name: Privacy-preserving transformation of clinical data
  method: >-
    Tokenization of unstructured EHR data using the OHNLP toolkit, de-identification of imaging,
    and transformation of data using approaches that limit re-identification, supported by a
    privacy scanning tool for medical records and a dedicated de-identification repository.
  deidentification_details:
    - Tokenized unstructured electronic health record data are placed in the enclave while note text remains at contributing sites
    - Imaging de-identification was in process for a larger cohort as of August 2025, with approximately 1,000 images available at that time
    - The source documents do not enumerate which identifiers are removed, nor state a formal de-identification standard
