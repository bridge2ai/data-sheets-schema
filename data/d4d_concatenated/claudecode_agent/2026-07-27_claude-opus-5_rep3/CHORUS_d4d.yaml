id: https://chorus4ai.org/
name: CHoRUS
title: 'Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards
  (CHoRUS) for Equitable AI'
description: >-
  CHoRUS is one of four data generation projects in the NIH Common Fund Bridge2AI
  consortium. It is building a multicenter, multimodal, high-resolution, AI-ready
  critical care dataset drawn from patients with acute or critical illness, together
  with the network, tools, standards, and educational programs needed to use it. The
  project describes itself as addressing the grand challenge of improving recovery
  from acute illness, and organizes its work around three pillars: Data (standards,
  tool development and optimization, and data acquisition), Ethics (ethical and
  trustworthy AI), and People (team science, skill and workforce development). The
  collaboration spans 20 academic centers, of which 14 contribute as data acquisition
  centers, and includes more than 60 consortium members. The anticipated final dataset
  covers 100,000 patient admissions across 9 data modalities from 14 contributing
  hospitals. The dataset released as of the current project website comprises 50,000
  patient admissions from ICU, PICU, and NICU settings, 1.6 billion rows of EHR data
  standardized to the OMOP Common Data Model, 7,642 admissions with radiology data,
  and 23 Tb of waveform data. Structured EHR data are harmonized to OMOP; clinical
  notes are extracted and tokenized with the OHNLP toolkit; imaging follows DICOM;
  telemetry waveforms follow WFDB; and EEG waveforms follow EDF+ and Persyst. Access
  to all data types is controlled. The project also provisions a holdout test set for
  external validation of models.
page: https://chorus4ai.org/
status: >-
  Partially released and actively accruing. A current released dataset is available
  under controlled access while data acquisition continues toward the anticipated final
  dataset. The project website carries the notice "This repoitory is under review for
  potential modification in compliance with Administration directives."
