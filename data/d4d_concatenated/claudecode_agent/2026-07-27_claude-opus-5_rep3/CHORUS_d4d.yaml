known_limitations:
  - id: d4d:chorus-limitation-imaging-coverage
    name: Limited imaging availability
    limitation_type: coverage_limitation
    limitation_description: >-
      As of the August 2025 status report, only approximately 1,000 images were available, with
      de-identification still in process for a larger cohort.
    scope_impact: >-
      Imaging-based analyses are constrained to a small fraction of the admissions represented
      in the structured EHR data.
  - id: d4d:chorus-limitation-eeg-extraction
    name: EEG extraction incomplete
    limitation_type: coverage_limitation
    limitation_description: >-
      EEG waveform extraction from hospital databases was still in process as of the August 2025
      status report.
    scope_impact: EEG coverage is incomplete relative to the other modalities.
  - id: d4d:chorus-limitation-notes-locality
    name: Clinical notes remain at contributing sites
    limitation_type: scope_limitation
    limitation_description: >-
      OMOP data and telemetry are held in the CHoRUS enclave, but clinical notes are stored
      locally at contributing sites; only tokens are placed in the enclave.
    scope_impact: >-
      Analyses requiring full note text rather than tokens cannot be performed on data held in
      the enclave.
  - id: d4d:chorus-limitation-controlled-access
    name: Controlled access to every data type
    limitation_type: scope_limitation
    limitation_description: >-
      Access control is listed as controlled for every CHoRUS data type, and a signed licensing
      agreement is required before access is granted.
    scope_impact: >-
      The dataset cannot be obtained or redistributed without completing the access and
      licensing process, which limits open reuse and independent reproduction.
  - id: d4d:chorus-limitation-metadata-publication
    name: Metadata publication still planned for some modalities
    limitation_type: methodological_limitation
    limitation_description: >-
      The cohort 2 webinar data table lists metadata as available for some data types and as
      planned for others, so descriptive metadata coverage is uneven across modalities.
    scope_impact: >-
      Users of the modalities whose metadata is still planned have less descriptive context than
      users of the OMOP-standardized modalities.
  - id: d4d:chorus-limitation-retrospective-multicenter
    name: Retrospective collection from 14 contributing hospitals
    limitation_type: representativeness_limitation
    limitation_description: >-
      Data collection is retrospective and draws on 14 data contributing hospitals within a
      collaboration of 20 academic centers, rather than on a population-wide or prospectively
      enrolled sample.
    scope_impact: >-
      Coverage reflects the practices and case mix of the participating academic centers. The
      project addresses this through sampling to ensure comprehensive sets of patient conditions
      and clinical treatment strategies and through federated access enabling sampling methods
      for a balanced and diverse cohort.

