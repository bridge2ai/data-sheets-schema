external_resources:
  - id: d4d:chorus-external-resources
    name: Dependence on site-held source data and on the CHoRUS cloud enclave
    description: >-
      The CHoRUS dataset is not fully self-contained. Structured OMOP data and telemetry
      are held in the CHoRUS cloud enclave, but clinical notes remain stored locally at
      contributing sites, with only tokens moved into the enclave. Imaging is available
      for a limited cohort while de-identification proceeds for a larger cohort, and EEG
      extraction was still in process as of the August 2025 status report. Use of the
      dataset also depends on the CHoRUS collaborative cloud platform, on OMOP/OHDSI
      standards and tooling maintained outside the project, and on the open-source
      software published in the CHoRUS GitHub organization.
    external_resources:
      - Clinical notes held locally at contributing hospitals; only tokens are placed in the CHoRUS enclave
      - Hospital source systems at the 14 data acquisition centers (EHR, PACS, bedside monitors and gateway/middleware, hospital EEG databases)
      - CHoRUS cloud enclave hosting OMOP and telemetry data, deployed on Azure
      - OHDSI/OMOP common data model and tool stack
      - CHoRUS GitHub organization software, standards, and standard operating procedures (https://github.com/chorus-ai)
    restrictions:
      - Access to all listed data types is controlled
      - A licensing agreement must be signed before dataset access is granted

file_collections:
  - id: d4d:chorus-fc-structured-ehr-omop
    name: Structured electronic health record data in OMOP
    title: Structured EHR data standardized to the OMOP Common Data Model
    description: >-
      Structured electronic health record data harmonized to the OMOP Common Data Model,
      covering demographics, medication administration (dosing time-stamped upon each
      infusion change or dose administration), procedures documented by providers,
      nursing flowsheets (high-frequency documentation), and diagnoses documented by
      providers. Access control is listed as controlled for every one of these data
      types, and the published metadata schema is the OMOP schema, with extensions for
      at least one data type. The current released dataset is reported to contain 1.6
      billion rows of EHR OMOP data. These data are held in the CHoRUS enclave.
    collection_type:
      - processed_data
    conforms_to: OMOP Common Data Model
  - id: d4d:chorus-fc-clinical-notes
    name: Tokenized clinical notes
    title: Clinical notes extracted and tokenized with the OHNLP toolkit
    description: >-
      Unstructured clinical notes extracted and tokenized using the OHNLP toolkit. Access
      control is controlled and the published metadata schema is the OHNLP open source
      schema. Notes themselves are stored locally at contributing sites; only tokens are
      placed in the CHoRUS enclave.
    collection_type:
      - processed_data
    conforms_to: OHNLP
  - id: d4d:chorus-fc-imaging
    name: Imaging data
    title: Imaging extracted from hospital PACS in DICOM format
    description: >-
      Imaging extracted from hospital picture archiving and communication systems (PACS)
      and distributed in DICOM format, with the DICOM schema as the published metadata
      schema. As of the August 2025 status report, approximately 1,000 images were
      available, with de-identification in process for a larger cohort. The current
      released dataset is reported to include 7,642 admissions with radiology data.
      Access control is controlled.
    collection_type:
      - processed_data
    conforms_to: DICOM
    file_count: 1000
  - id: d4d:chorus-fc-waveform-telemetry
    name: Waveform telemetry
    title: Bedside monitor waveform telemetry in WFDB format
    description: >-
      Physiologic waveform telemetry acquired from bedside monitors via gateway and
      middleware systems, converted to the WFDB format, with an extended PhysioNet schema
      listed as the published metadata schema. Telemetry is held in the CHoRUS enclave.
      The current released dataset is reported to contain 23 Tb of waveform data. Access
      control is controlled.
    collection_type:
      - processed_data
    conforms_to: WFDB
  - id: d4d:chorus-fc-waveform-eeg
    name: Waveform EEG
    title: Electroencephalography waveforms in EDF+ and Persyst formats
    description: >-
      Electroencephalography waveforms drawn from hospital EEG databases, in EDF+ and
      Persyst formats, with the open source EDF+ and Persyst schemas listed as published
      metadata schemas. Access control is controlled. As of the August 2025 status report,
      EEG extraction was still in process.
    collection_type:
      - processed_data
    conforms_to: EDF+ and Persyst

purposes:
  - id: d4d:chorus-purpose-ai-ready-critical-care-data
    name: Create a publicly available, AI-ready critical care dataset
    description: Primary stated purpose of the CHoRUS data generation project.
    response: >-
      CHoRUS was created to meet the need for infrastructure supporting artificial
      intelligence and machine learning in critical care. Its overarching goal is to
      develop a publicly available, AI-ready critical care dataset from more than 100,000
      critically ill patients, while ensuring that the methods used promote privacy,
      accountability, and clinical benefit, and while cultivating a new generation of AI
      clinicians and scientists. The CHoRUS Network states its goal as developing the most
      diverse, high-resolution, ethically sourced, AI-ready data set to answer the grand
      challenge of improving recovery from acute illness.
  - id: d4d:chorus-purpose-ethical-sourcing
    name: Demonstrate ethical, privacy-preserving sourcing of clinical care data
    description: Ethics pillar purpose.
    response: >-
      The project was also created to establish ethical and legal approaches for managing
      privacy and bias in clinical care AI, to evaluate community perspectives on clinical
      care AI in order to increase trustworthiness of provenance and privacy, and to create
      best practices for AI in health alongside the other Bridge2AI data generation projects.

tasks:
  - id: d4d:chorus-task-characterize-predict-measure
    name: Characterize critical illness, predict complications, and measure treatment response
    description: Machine learning and AI tasks named as the dataset's intended applications.
    response: >-
      The dataset was generated for machine learning and AI applications aimed at
      characterizing acute and critical care illness, predicting complications, and
      measuring treatment response among patients with acute or critical illness.
  - id: d4d:chorus-task-external-validation
    name: External validation of AI models
    description: Holdout test set task.
    response: >-
      The dataset provisions a holdout test set, accessible for model external validation,
      to aid marketplace adoption of AI-developed models for implementation in acute and
      critical care.
  - id: d4d:chorus-task-labeling-for-prediction
    name: Labeling data with prediction targets
    description: Annotation task supported by the project's visualization and annotation environment.
    response: >-
      A visualization and annotation environment is being developed to label data with
      targets important for prediction.

addressing_gaps:
  - id: d4d:chorus-gap-multicenter-high-resolution
    name: Absence of high-resolution multi-center critical care data for AI
    description: The gap the dataset was created to fill.
    response: >-
      There is an urgent need for infrastructure to support AI and machine learning in
      critical care, and developing high-resolution multi-center data sets is described as
      a critical first step towards actionable and trustworthy AI. CHoRUS addresses the
      absence of an AI-ready dataset of this scale, diversity, and resolution, and the
      accompanying absence of a legal framework for collecting such data at scale, of
      harmonized standards across multi-modal EHR, waveform, imaging, and text data, and
      of sequestered holdout datasets for external validation.
  - id: d4d:chorus-gap-workforce-and-literacy
    name: Shortfall in AI literacy and workforce for clinical care AI
    description: Workforce and education gap addressed by the People pillar.
    response: >-
      The project cultivates expertise in the lay and scientific community to improve AI
      literacy and utilization through multimodal educational approaches, and develops the
      skills and workforce for a next generation of diverse academic and community AI
      scientists, engineers, data scientists, and clinicians.

