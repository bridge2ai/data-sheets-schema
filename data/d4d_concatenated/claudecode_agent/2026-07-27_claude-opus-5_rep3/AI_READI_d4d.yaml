purposes:
- id: purpose_ai_ready_t2dm
  name: Enable AI/ML research into type 2 diabetes salutogenesis
  description: Primary stated purpose of the dataset.
  response: >-
    The purpose for creating the dataset was to enable future generations of artificial
    intelligence/machine learning (AI/ML) research to provide critical insights into type 2
    diabetes mellitus (T2DM), including salutogenic pathways to return to health. T2DM is a
    growing public health threat, yet current understanding of T2DM, especially in the context
    of salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches may improve
    understanding, but a key issue is the lack of data ready for training AI models. The
    AI-READI dataset is intended to fill this gap.
- id: purpose_pseudotime_manifold
  name: Support pseudotime manifold analysis of disease trajectories
  description: Analytical design goal that shaped the collection protocol.
  response: >-
    The multi-modal dataset was gathered to facilitate downstream pseudotime manifold analyses
    and various applications in artificial intelligence. Data collection was specifically
    designed to permit downstream pseudo-time manifold analysis, an approach used to predict
    disease trajectories by collecting and learning from complex, multimodal data from
    participants with differing disease severity (normal to insulin-dependent T2DM). The
    long-term objective is a foundational dataset in T2DM, agnostic to existing classification
    criteria or biases, that can be used to reconstruct a temporal atlas of T2DM development
    and reversal towards health.
- id: purpose_blueprint
  name: Provide a blueprint for future ethically sourced AI-ready datasets
  description: Secondary programme-level purpose stated in the project publications.
  response: >-
    AI-READI aims to establish standards, best practices and guidelines for collection,
    preparation and sharing of data for the purposes of AI/ML, including guidance from
    bioethicists. Following FAIR (Findable, Accessible, Interoperable, Reusable) principles,
    AI-READI can be viewed as a model for future efforts to develop other medical/health data
    sets targeted for AI/ML. The project shares its blueprint for collecting and sharing
    AI-ready datasets so that future Bridge2AI Data Generation Projects can follow it, including
    guidelines for project management as well as data collection, management and sharing.
- id: purpose_workforce
  name: Train a diverse AI and biomedical research workforce
  description: Workforce-development purpose of the parent project.
  response: >-
    Workforce development is one of the key pillars of the NIH Bridge2AI Program. AI-READI hosts
    a year-long research internship programme providing immersive training for individuals
    interested in working at the nexus of biomedicine and AI, comprising a two-week data
    science/programming bootcamp followed by a year-long curriculum of didactic lectures and
    mentored research. The inaugural cohort in academic year 2023-2024 consisted of 10 interns,
    of whom 70% were women, 30% were Black, and 50% overall were from under-represented
    backgrounds based on NIH criteria.

tasks:
- id: task_salutogenesis_modelling
  name: Modelling T2DM salutogenesis and disease trajectories
  description: Principal analytical task the dataset was designed to support.
  response: >-
    Building AI/ML models that define disease trajectories in type 2 diabetes and the salutogenic
    pathway from disease back to health, including reconstruction of a temporal atlas of T2DM
    development and reversal via pseudotime manifold analysis and dimensionality reduction.
- id: task_multimodal_ai
  name: Multimodal AI/ML model development
  description: General class of downstream tasks the dataset supports.
  response: >-
    The dataset is hypothesis-agnostic and was assembled to support many possible downstream
    AI/ML applications across survey, clinical, laboratory, imaging, waveform, wearable and
    environmental modalities, rather than one predefined predictive task. No explicit labels or
    targets are supplied with the dataset.
- id: task_genetic_and_trajectory_links
  name: Investigating underlying genetic links across racial and ethnic cohorts
  description: Task named in the study description and IRB protocol.
  response: >-
    The project is data generation to allow future creation of AI/ML algorithms aimed at defining
    disease trajectories and underlying genetic links in different racial/ethnic cohorts.
    Genetic sequencing data are held under controlled access rather than in the public release.

addressing_gaps:
- id: gap_ai_ready_data
  name: Lack of AI-ready multimodal T2DM datasets
  description: The core data gap the project set out to fill.
  response: >-
    The ability to understand and affect the course of complex, multi-organ diseases such as
    T2DM has been limited by a lack of well-designed, high-quality, large and inclusive
    multimodal datasets. A major barrier to AI in this domain has been the absence of diverse
    datasets that are AI-ready for training AI models; existing sources such as claims or
    electronic health record data do not support the intended downstream AI/ML analyses.
- id: gap_demographic_representation
  name: Under-representation of racialised groups in T2DM research
  description: Equity gap addressed by the balanced recruitment design.
  response: >-
    A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated that
    samples lacked racial and ethnic diversity. AI-READI deliberately recruits approximately
    equal numbers of Asian, Black, Hispanic and White participants rather than targeting the
    demographic distribution of the US population, which is a demographic improvement over many
    previous epidemiological studies and clinical trials on T2DM and an important step forward
    in addressing these demographic inequities in research.
- id: gap_severity_balance
  name: Absence of severity-balanced cohorts for unbiased model training
  description: Design gap addressed by triple balancing.
  response: >-
    The study population is designed to be balanced across T2DM severity groups (no diabetes,
    pre-diabetes/lifestyle-controlled, non-insulin-medication-controlled and insulin-controlled)
    as well as biological sex, because building balanced datasets is critical for the development
    of unbiased machine learning models.
- id: gap_documentation_standards
  name: Missing provenance and intended-use documentation for clinical AI datasets
  description: Documentation gap the project explicitly targets.
  response: >-
    Documenting practices regarding the creation, use and maintenance of clinical research
    datasets is critically important so that AI developers can easily understand the provenance
    and intended use of the data. The project reviewed existing documentation approaches such as
    datasheets and healthsheets to identify the most suitable one for biomedical data, and
    publishes a completed Healthsheet with each dataset version.

