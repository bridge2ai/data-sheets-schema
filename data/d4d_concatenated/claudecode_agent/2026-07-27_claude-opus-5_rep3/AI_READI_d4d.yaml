id: https://doi.org/10.60775/fairhub.3
name: AI-READI Flagship Dataset of Type 2 Diabetes (v3.0.0)
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI (Artificial Intelligence Ready and Equitable/Exploratory Atlas for Diabetes
  Insights) flagship dataset is a multimodal, AI-ready dataset collected from individuals with
  and without type 2 diabetes mellitus (T2DM) and harmonized across three US data collection
  sites (University of Alabama at Birmingham, University of California San Diego, and
  University of Washington). Version 3.0.0 contains data from 2,280 participants collected
  between 2023-07-19 and 2025-05-01, spanning 356,343 files and approximately 3.82 TB. Data
  domains include self-reported surveys (demographics, depression, diabetes distress and
  self-care, diet, substance use, general health, social determinants of health, vision and
  eye-care access), physical measurements and vitals, 12-lead electrocardiography, monofilament
  testing for peripheral neuropathy, Montreal Cognitive Assessment, visual acuity and contrast
  sensitivity under photopic and mesopic conditions, autorefraction, blood and urine clinical
  laboratory results, multi-device retinal imaging (fundus photography, OCT, OCTA and
  fluorescence lifetime imaging ophthalmoscopy), 10-day continuous glucose monitoring, 10-day
  wearable physical-activity monitoring, and 10-day in-home environmental sensing. Recruitment
  was designed to be triple-balanced across self-reported race/ethnicity (Asian, Black,
  Hispanic, White), T2DM status and severity (no diabetes; pre-diabetes or lifestyle-controlled;
  controlled with oral or non-insulin injectable medication; insulin-controlled) and biological
  sex, so that AI/ML models can be trained on a cohort that is not skewed by the demographic
  distribution of the US population. The overarching scientific goal is to enable AI/ML research
  into salutogenesis, the pathway from T2DM back to health. The dataset is released in static,
  approximately annual versions through the FAIRhub data portal, organized according to the
  Clinical Dataset Structure (CDS) v0.1.1 specification with per-datatype file-format standards
  (OMOP CDM, DICOM, WFDB, Open mHealth, NASA ESDS ASCII).
