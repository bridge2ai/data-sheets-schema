instances:
- id: instance_participant
  name: Participant
  instance_type: individual study participant
  counts: 2280
  label: false
  label_description: >-
    No explicit label or target is associated with each data instance. No specific labeling was
    performed, as the dataset is a hypothesis-agnostic dataset aimed at facilitating multiple
    potential downstream AI/ML applications.
  description: >-
    Each instance represents an individual participant. An instance consists of all data
    available for that individual, spanning survey data, clinical data, retinal imaging data,
    environmental sensor data, continuous glucose monitor data and wearable activity monitor
    data, encompassing tabular data, imaging data and physiological signal/waveform data. There
    is no unstructured free-text data in the dataset. Version 3.0.0 contains 2,280 instances;
    version 1.0.0 contained 204 instances and version 2.0.0 contained 1,067 instances. There is
    currently only one visit per participant, although approximately 10% of participants
    (approximately 4% per the healthsheet collection-timeframe answer) are expected to be invited
    for a follow-up examination in year 4 of the study.
  missing_information:
  - name: Modality-level missingness
    missing:
    - Data for one or more modalities for some participants
    - Individual survey items skipped or incompletely answered
    - Wearable and device readings lost or unretrievable
    why_missing:
    - Some participants elected not to participate in some study elements
    - In a few cases the data collection device had no stored results or was returned too late to retrieve the results (for example, battery died or data was lost)
    - In a few cases a data collision at some point in the process caused data loss

anomalies:
- id: anomaly_survey_and_device
  name: Expected sources of noise and error
  description: Known error and noise sources documented in the healthsheet.
  anomaly_details:
  - In survey data, skipped questions or incomplete responses are expected.
  - In wearable data, improper use and technical failure such as battery failure or system malfunction are expected.
  - In imaging data, patient uncooperation, noise that may obscure the images, technical failure such as system malfunction, and data transfer failures are expected.
- id: anomaly_imaging_quality_variation
  name: Device- and operator-dependent image quality variation
  description: Quality variation documented per imaging device in the healthsheet device section.
  anomaly_details:
  - Optomed Aurora undilated handheld fundus images vary in quality from patient to patient and within the same patient because the pupil is not dilated and the camera is handheld.
  - Heidelberg Spectralis HRA acquisition is operator-driven and not fully automated, so quality issues may arise that lead to skipping the modality and missing data.
  - FLIO is performed last in the visit because it takes longer than a standard Spectralis OCT and exposes participants to uncomfortable light levels, so participant compliance may not be at its best.

known_biases:
- id: bias_volunteer_selection
  name: Volunteer selection bias
  bias_type: selection_bias
  bias_description: >-
    Participants are volunteers, so there is selection bias known as volunteer bias which may
    limit the generalisability of results to those who are not represented in the study
    population.
  mitigation_strategy: >-
    Recruitment proceeds in waves whose composition and size are adjusted by under- and
    oversampling groups as needed, monitored against diversity and inclusion targets using health
    record data.
- id: bias_recruitment_representation
  name: Under-recruitment of specific populations
  bias_type: representation_bias
  bias_description: >-
    It is well documented that recruiting Black men into health research is more difficult than
    recruiting other populations, yet this population bears a disproportionate percentage of the
    T2DM burden; medical mistrust and fear of safety stem from historical events such as the
    Tuskegee syphilis study. Similar trends for under-recruitment and disease burden have been
    reported for Hispanic and Asian persons. Requiring that eligible participants speak, read and
    understand English may also have created challenges in recruiting Hispanic and/or Asian
    persons.
  mitigation_strategy: >-
    If sample balancing on race/ethnicity emerges as a challenge, new recruitment strategies will
    be implemented, such as tailoring printed materials and using a personalised, participatory
    approach. An NIH supplement was submitted to fund translation of all study materials to enable
    recruitment of Spanish-speaking participants, and native Spanish-speaking research staff at
    UCSD can provide interpretation.
  affected_subsets:
  - Black participants
  - Hispanic participants
  - Asian participants
- id: bias_pilot_imbalance
  name: Balance not yet achieved in released versions
  bias_type: sampling_bias
  bias_description: >-
    While AI-READI ultimately aims to achieve balance across race/ethnicity, biological sex and
    diabetes presence and severity, enrollment is ongoing and the pilot data release and periodic
    updates to data releases may not have achieved balanced distribution across groups.
  mitigation_strategy: >-
    Because sex, race and ethnicity data are not released with the public version, the project
    team supplies recommended 70%/15%/15% train/validation/test splits in which the validation
    and test sets are balanced as well as possible for sex, race/ethnicity and diabetes status.
- id: bias_urban_hospital_recruitment
  name: Urban, hospital-based recruitment base
  bias_type: selection_bias
  bias_description: >-
    Factors influencing the generalization of derived models include the predominantly urban and
    hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
    backgrounds. The study base is patients aged 40 years or older who had a medical encounter
    within one of the three health system sites, identified by screening electronic health records
    for ICD-10 codes.
  mitigation_strategy: >-
    Three recording sites were strategically selected for geographic diversity across the United
    States and to ensure diverse representation across racial and ethnic groups; individuals from
    all demographic backgrounds were recruited at all three sites.

known_limitations:
- id: limitation_population_coverage
  name: Population groups not represented
  limitation_type: representativeness_limitation
  limitation_description: >-
    The study cohort may not provide a comprehensive representation of the population, as it does
    not include other races/ethnicities such as Pacific Islanders and Native Americans.
  scope_impact: >-
    Models trained on the dataset may not transfer to populations outside the four recruited
    race/ethnicity groups.
  recommended_mitigation: >-
    The project engages with the Native Biodata Consortium as a co-learning opportunity for
    understanding challenges specific to American Indian and Alaska Native communities and is
    evaluating tools such as data usage agreements, contract negotiations, transparent access
    agreements and forms of assured return of benefit and sustainable input, control and
    monitoring of Tribal data.
- id: limitation_age_and_language
  name: Eligibility restrictions on age, language and pregnancy status
  limitation_type: coverage_limitation
  limitation_description: >-
    Eligibility is restricted to adults aged 40 years and older who can provide consent and who
    speak and read English. Adults older than 85 years, pregnancy, gestational diabetes and type 1
    diabetes are exclusion criteria.
  scope_impact: >-
    The dataset does not support research on paediatric, young-adult, very elderly, pregnant, or
    non-English-speaking populations, or on type 1 diabetes.
- id: limitation_cross_sectional
  name: Predominantly cross-sectional design
  limitation_type: temporal_limitation
  limitation_description: >-
    AI-READI is a cross-sectional study with one study visit per participant; only a smaller
    subgroup (intended to be about 10% of the study population, described elsewhere as
    approximately 4% of participants) will be invited for a follow-up visit in year 4 of the
    project.
  scope_impact: >-
    Longitudinal within-participant trajectories are largely unavailable; trajectory inference
    depends on cross-sectional pseudotime manifold approaches rather than repeated measurement.
- id: limitation_biorepository_finite
  name: Finite biorepository samples
  limitation_type: scope_limitation
  limitation_description: >-
    A limitation of the biorepository is that there are a finite number of samples to share with
    scientists interested in using them in research.
  scope_impact: >-
    Access to biospecimens will be constrained and is not part of the distributed digital dataset.
  recommended_mitigation: >-
    Procedures for reviewing and prioritising written requests will be developed before the
    biorepository is complete; biobanked samples will eventually be available according to
    policies still in development.
- id: limitation_public_set_stripped
  name: Demographic and sensitive variables removed from the public release
  limitation_type: coverage_limitation
  limitation_description: >-
    Information related to the sex and race/ethnicity of the participants, as well as medication
    used, has been removed from the released dataset. Zip code, sex, race, ethnicity, genetic
    sequencing data, past health records, medications, and traffic and accident reports are held
    under controlled access.
  scope_impact: >-
    Fairness auditing and subgroup analysis cannot be performed directly on the public release.
  recommended_mitigation: >-
    Use the supplied recommended data splits, which were constructed by the project team to be
    balanced for sex, race/ethnicity and diabetes status, or apply for the controlled-access
    dataset.
- id: limitation_no_labels
  name: No labels or target variables provided
  limitation_type: methodological_limitation
  limitation_description: >-
    No explicit labels or targets are associated with data instances, no gold-standard labelling
    was performed, and no formal guidelines are in place for researchers creating new labels or
    defining new tasks.
  scope_impact: >-
    Supervised-learning users must define and validate their own outcome definitions.
- id: limitation_visual_acuity_variables
  name: Snellen visual acuity variables removed in v3.0.0
  limitation_type: integration_limitation
  limitation_description: >-
    The data fields and types are largely the same as the prior version, but the Snellen visual
    acuity variables were dropped in version 3.0.0, so only logMAR visual acuity measurements are
    available.
  scope_impact: >-
    Analyses that depend on Snellen notation must convert from logMAR or use an earlier dataset
    version.

confidential_elements:
- id: confidentiality_none_in_release
  name: Confidential data in the released dataset
  confidential_elements_present: false
  confidentiality_details:
  - The dataset does not contain data that might be considered confidential.
  - No personally identifiable information is included in the dataset.
  - The data in this dataset contain no protected health information (PHI).

content_warnings:
- id: content_warning_none
  name: Offensive or distressing content
  content_warnings_present: false
  warnings:
  - The healthsheet reports that the dataset contains no data that, if viewed directly, might be offensive, insulting, threatening or otherwise pose a safety risk.

subpopulations:
- id: subpopulation_controlled_access_only
  name: Demographic sub-populations
  subpopulation_elements_present: false
  identification:
  - The healthsheet states that the dataset does not identify demographic sub-populations, because sex, race and ethnicity are withheld from the public release.
  - The controlled-access dataset contains data regarding racial and ethnic origins, location (5-digit zip code) and motor vehicle accident reports.
  distribution:
  - 'Recruitment targets equal representation of four self-reported race/ethnicity groups (Asian, Black, Hispanic, White), four T2DM severity groups (no diabetes; pre-diabetes or lifestyle-controlled; oral or non-insulin-injectable medication controlled; insulin-controlled) and both biological sexes.'
  - 'Version 3.0.0 totals reported in the README split table: Hispanic 380, Asian 545, Black 519, White 836; male 951, female 1,329; no diabetes 776, lifestyle-controlled 560, oral-medication-controlled 686, insulin-controlled 258; overall mean age 60.8 +/- 11.3 years.'
  - No regulation prevented demographic data collection in the study; the project instead recommends splits designed to reduce disparity of error rate across subgroups when demographic labels are unavailable to the user.

sensitive_elements:
- id: sensitive_public_versus_controlled
  name: Sensitive elements by access tier
  sensitive_elements_present: true
  sensitivity_details:
  - The public dataset does not contain data that is considered sensitive.
  - The controlled-access dataset contains data regarding racial and ethnic origins, location (5-digit zip code), and motor vehicle accident reports.
  - Controlled-access content also includes sex, genetic sequencing data, past health records and medications.
  - Blood, urine and derived biospecimens (plasma, serum, buffy coats, genomic DNA, PAXgene-stabilised RNA and peripheral blood mononuclear cells) are banked at the University of Alabama at Birmingham Center for Clinical and Translational Science but are not part of the distributed digital dataset.

relationships:
- id: relationship_instances
  name: Relationships between instances
  relationship_details:
  - All instances are part of the same prospective data generation project (AI-READI).
  - There is currently only one visit per participant, so instances are not linked as repeated encounters.
  - Within the distributed directory tree, each datatype directory contains one folder per modality, each modality folder one folder per device, and each device folder one folder per participant, named after the participant ID number used in the study, which links a participant's files across modalities.

splits:
- id: splits_recommended
  name: Recommended training, validation and test splits
  split_details:
  - The current version of the dataset comes with recommended data splits in proportions of 70%/15%/15% for training, validation and testing.
  - Because sex, race and ethnicity data are not released with the public version of the dataset, the project team prepared the splits so that the validation and test sets are balanced as well as possible for sex, race/ethnicity and diabetes status (no diabetes, prediabetes/lifestyle controlled, oral medication controlled and insulin controlled).
  - 'Split sizes for version 3.0.0: train 1,576 participants, validation 352 participants, test 352 participants, total 2,280 participants.'
  - The split assignment is included in the participants.tsv file distributed with the dataset.
  - This datasheet does not introduce new tasks or labeling, but it does include a new recommended data split for the 2,280 participants balancing training, validation and testing sets for age, sex, races/ethnicities and study group.

acquisition_methods:
- id: acquisition_mixed
  name: Mixed direct observation and subject report
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: false
  was_validated_verified: true
  acquisition_details:
  - The acquisition of data varied based on the domain; some data were directly observable (such as labs, vitals and retinal imaging), whereas other data were reported by subjects (for example survey responses).
  - Verification of data entry was performed when possible, for example cross-referencing entered medications with medications that were physically brought in or photographed by each study participant.
  - Data are obtained from subjects, from devices they are asked to use, from their specimens, and from medical records; driving and accident records are obtained from the Department of Licensing.

collection_mechanisms:
- id: mechanism_redcap
  name: REDCap electronic data capture
  mechanism_details:
  - REDCap is used for collecting patient-reported questionnaire data and the following clinical data from the visit - medications assessment, vitals, visual acuity, contrast sensitivity, monofilament test results and complete blood count test results.
  - Questionnaires may be completed electronically before or after the in-person visit, or on paper and brought to the visit or mailed back with the devices.
  - The exact forms used for data collection in REDCap are published at https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf.
- id: mechanism_devices_and_instruments
  name: Clinical instruments, imaging devices and at-home monitors
  mechanism_details:
  - 'Vitals and physical measurement: height, weight, waist and hip circumference with derived waist-hip ratio and body mass index; systolic and diastolic blood pressure and heart rate measured twice, two minutes apart, with an automatic oscillometric medically approved device (OMRON HEM 907XL, Medline MDS4001, or Welch Allyn 6000 series with FlexiPort reusable cuff).'
  - 'Electrocardiography: 12-lead ECG using a Philips PageWriter TC30 cardiograph while the participant sits reclined or lies supine, with the recline position recorded (0, 30, 60 or 90 degrees). Exported as .xml.'
  - 'Peripheral neuropathy: monofilament test assessing touch perception on both feet with shoes and socks removed, using a standard 10 g filament at three locations on each foot, ten times per location, with eyes closed; insensate areas are retested for confirmation.'
  - 'Cognition: Montreal Cognitive Assessment (MoCA) administered electronically on an iPad using the MoCA Duo application; total score, section subscores, Memory Index Score and task completion times exported as .csv. Maximum score 30.'
  - 'Vision: photopic and mesopic visual acuity with the M&S Technologies Electronic Visual Acuity tester at 4 m under best-corrected conditions expressed in logMAR; mesopic testing through a 2.0 neutral density filter. Photopic and mesopic letter contrast sensitivity with the Mars chart (Mars Perceptrix) expressed as log sensitivity. Autorefraction with a Topcon KR 800. Lensometry with NIDEK LM-600P, Topcon CL-200 or Topcon CL-300.'
  - 'Retinal imaging: Optomed Aurora IQ handheld undilated colour fundus photography (4 images per participant, DICOM); iCare EIDON widefield truecolor confocal fundus system (12 images per participant, DICOM); Heidelberg Spectralis HRA OCT/OCTA (6 images, DICOM); Topcon Maestro2 3D OCT-1 (6 images, exported .fda converted to DICOM); Topcon Triton DRI OCT (6 images, exported .fda converted to DICOM); Zeiss Cirrus 5000 (8 images, DICOM); Heidelberg fluorescence lifetime imaging ophthalmoscopy (2 images, exported .sdt converted to DICOM). Both eyes are imaged; all retinal images are collected under dilated conditions except the Optomed.'
  - 'At-home monitoring for 10 continuous days: Dexcom G6 continuous glucose monitor recording blood glucose every 5 minutes (.csv), Garmin Vivosmart 5 physical activity monitor recording steps, heart rate, sleep duration, oxygen saturation and related variables (.FIT converted to the mHealth standard), and a custom LeeLab Anura environmental sensor recording ambient temperature, relative humidity, nitrogen oxides, volatile organic compounds, particulate matter (PM1.0, PM2.5, PM4, PM10) and eleven multi-spectral light intensity measurements (.csv).'
  - Participants are masked to Dexcom CGM results during the monitoring period, and return devices with a data sheet indicating which wrist the fitness tracker was worn on, their dominant hand, and where the environmental sensor was placed in the home.
  - The environmental sensor and fitness tracker were specifically chosen with participant privacy as a primary concern; they do not capture video or audio, are not equipped with GPS location monitoring, and are not synced with participant-owned devices.
- id: mechanism_laboratory
  name: Clinical laboratory and biospecimen processing
  mechanism_details:
  - Approximately 50-60 mL of blood (reported as 53 mL in the protocol publication) and a urine specimen are collected during the study encounter; participants do not need to be fasting.
  - CLIA-certified laboratories local to each data collection site perform complete blood count testing on fresh whole blood.
  - All other laboratory tests are performed by the University of Washington Nutrition and Obesity Research Center (NORC) testing facility using stored frozen samples, provided in .csv format. Samples are stored locally at -70 degrees Celsius and batch-shipped to UW on dry ice approximately once per quarter.
  - 'Assays include EDTA plasma tests (NT-proBNP, troponin-T, C-peptide, insulin), serum tests (high-sensitivity C-reactive protein, total cholesterol, triglycerides, HDL and calculated LDL cholesterol, glucose, blood urea nitrogen, creatinine, BUN/creatinine ratio, sodium, potassium, chloride, total carbon dioxide, calcium, total protein, albumin, calculated total globulin and A/G ratio, total bilirubin, alkaline phosphatase, AST, ALT), whole blood tests (HbA1c, white blood cell, red blood cell, haemoglobin, haematocrit, MCV, MCH, MCHC, RDW, platelets) and urine tests (creatinine, albumin).'
  - 'Biorepository specimens banked at the University of Alabama at Birmingham Center for Clinical and Translational Science include buffy coats from EDTA vacutainers, genomic DNA, plasma, serum, PAXgene vacutainers and peripheral blood mononuclear cells; PBMC processing is centralised at UAB because of the complexity of isolation and cryopreservation, and PAXgene RNA vacutainers are stable for up to 72 hours allowing overnight shipment from UW and UCSD.'
- id: mechanism_ehr_screening
  name: Electronic health record screening and recruitment pipeline
  mechanism_details:
  - Recruitment pools are identified by screening electronic health records at each site for ICD-10 diagnosis codes R73.09 and E11.X, which the protocol publication associates with T2DM and pre-diabetes; patients without diabetes will not have encounters with these ICD codes.
  - UW and UCSD provide lists of potential participants to UAB, which adds its own eligible patients and selects a stratified sample based on the sampling scheme; the combined dataset is uploaded to a secure UAB site for OHSU to load into the UW REDCap system and generate patient-specific survey links and email invitations.
  - The complete dataset including participant-specific REDCap survey links is returned to UAB, which sends participant information to Adapt Inc., an SSAE16 SOC security-certified and HIPAA-compliant printing and fulfillment service, to send recruitment letters. Approximately 50,000 invitation letters per site were planned over the 3+ years of recruitment.
  - Individuals are mailed a hardcopy invitation letter and sent an invitation email, both personalised with links, access codes and QR codes directing them into the online REDCap recruitment interface, where they can read a programme overview, expectations for participation, FAQs, download the informed consent document, request a call back, complete a screening survey and enroll by signing the electronic consent. Those without internet access may call research staff for alternative methods of enrolment.

sampling_strategies:
- id: sampling_strategy_cohort
  name: Stratified, non-probability wave sampling of a health-system study base
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - All patients aged 40 years or older who had a medical encounter within each health system site (University of Alabama at Birmingham, University of California San Diego, University of Washington) between 2020 and 2025.
  strategies:
  - 'Target enrolment is 4,000 people aged 40 and older, recorded on FAIRhub as an anticipated enrollment count of 4000 and stated as 4,000 in both the BMJ Open protocol publication and the Nature Metabolism comment, with a target of approximately 1,000 participants in each of the four T2DM severity groups and 1,000 in each of the four race/ethnicity groups. The earlier University of Washington IRB protocol form records a target of 4,600 people; the 4,000 figure is the one carried by the current publications and by the dataset''s own study metadata.'
  - Sampling method recorded on FAIRhub as "Non-Probability Sample" for an observational cohort study with a cross-sectional time perspective.
  - Triple balancing by recruiting equal proportions of four race/ethnic groups (Asian, Black, White, Hispanic), four categories of T2DM (no diabetes; pre-diabetes or lifestyle-controlled; controlled with oral or non-insulin-injectable medications; insulin-controlled) and biological males and females, rather than targeting the demographic distribution of the US population.
  - Participants are recruited in waves; the composition and size of each wave are influenced by observed participation characteristics of race/ethnicity, gender, T2DM severity and site, and are adjusted by under- and oversampling groups as needed.
  - All study groups are recruited at each site, but the proportion of each group varies with local demographics - UW concentrates on Asian, then Hispanic, then Black participants; UCSD prioritises Hispanic, then Asian, then Black; UAB prioritises Black, then Hispanic, then Asian; all sites recruit White participants. All race and ethnicity information is self-reported at screening and enrollment.
  - The healthsheet reports that the released dataset contains all instances collected in the covered period rather than a further sample of them, and answers "N/A" to the question about a preprocessing-stage sampling strategy. The healthsheet answer describing that coverage as "all participants who have been enrolled during the first year of data collection" is carried over from the earlier version's healthsheet; the collection window stated elsewhere in the same v3.0.0 record is 2023-07-19 to 2025-05-01.
  why_not_representative:
  - The cohort is deliberately balanced across race/ethnicity, sex and diabetes severity rather than matched to the US population distribution, so it is not demographically representative by design.
  - Recruitment is predominantly urban and hospital-based and does not include Pacific Islanders or Native Americans.

data_collectors:
- id: collectors_study_team
  name: AI-READI study team across three data collection sites
  role: Clinical research coordinators, research assistants, data managers, phlebotomists, laboratory assistants, project managers, database managers, software and cloud engineers, data scientists, domain experts and principal investigators.
  collector_details:
  - Details about the AI-READI team members involved in the data collection process are available at https://aireadi.org/team.
  - Their effort was supported by NIH award OT2OD032644 based on percentage of effort contributed, with salaries aligned to the funding guidelines at each site.
  - All research personnel at the three data sites who recruited, enrolled and collected data underwent training by the data manager at UAB and follow a detailed Manual of Procedures.
  - Successful completion of a certification process is required for all coordinators, including mandatory institutional compliance training for human subject research; before enrolling and testing participants, all coordinators must successfully administer all protocol elements to at least three volunteer practice subjects, meeting the standards outlined in the Manual of Procedures. Data managers at each site oversee the process.
  - 'IRB-listed role definitions include: principal, co-principal and co-investigators making executive decisions on data collection, curation and processing; program/project managers overseeing data collection and coordination; database managers ingesting and extracting data from REDCap; research or data scientists and postdoctoral fellows processing data for release and developing standards; clinical research coordinators contacting and consenting participants, running visits, collecting ophthalmic images and training participants on device use; research assistants supporting visits and data upload; software engineers designing, implementing and testing data curation pipelines; cloud engineers managing cloud infrastructure; phlebotomists collecting blood; laboratory assistants processing and shipping samples; and domain experts advising on each medical domain.'
  - A Community Advisory Board of 11 persons from the three sites, including diversity in race and ethnicity as represented in the AI-READI sample, contributes to the development of the protocol and evaluates consent forms and research protocols.

collection_timeframes:
- id: timeframe_v3
  name: Version 3.0.0 data collection period
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details:
  - 'FAIRhub records the collected date range for this dataset version as 2023-07-19/2025-05-01, and the README states that this dataset contains data from 2,280 participants collected between July 19, 2023 and May 01, 2025.'
  - The healthsheet describes this version as consisting of data collected up through the end of the second year of the study.
- id: timeframe_study
  name: Overall study timeline
  start_date: '2023-07-19'
  timeframe_details:
  - Enrolment began on 18 July 2023 and will continue until 30 November 2026 according to the BMJ Open protocol publication; FAIRhub records an actual study start date of 2023-07-19 and an anticipated completion date of 2027-01-01.
  - Preliminary pilot enrolment occurred between 18 July 2023 and 30 November 2023 to secure sufficient familiarity for all coordinators; the formal data collection process began on 1 December 2023.
  - The Nature Metabolism comment describes enrolment of 4,000 participants at three study sites over four years (2022-2026).
  - The timeline for the overall project spans four years, encompassing one year dedicated to protocol development and training and years 2-4 allocated to subject recruitment and data collection.
  - Each participant completes a single visit lasting between 2.5 and 4 hours, followed by a 10-day at-home monitoring period.

direct_collection:
- id: direct_collection_participants
  name: Direct collection from participants
  is_direct: true
  collection_details:
  - The data was collected directly from participants across the three recruiting sites; this was not passive data collection or secondary use of existing data.
  - The healthsheet states that recruitment pools were identified by screening electronic health records for diabetes and prediabetes ICD-10 codes for patients who had an encounter with the sites' health systems within the past 2 years; the BMJ Open protocol publication describes the study base more broadly as all patients aged 40 years or older with a medical encounter at a site between 2020 and 2025.
  - Medical records are also extracted for general health, eye health, medical and surgical history, diabetes, medications, laboratory records and prior medical imaging, and driving and accident records are obtained from the Department of Licensing.

collection_notifications:
- id: notification_participants
  name: Participant notification
  notification_details:
  - Each individual was aware of the data collection, as this was active data collection directly from participants rather than passive collection or secondary use of existing data.
  - Potential participants receive a mailed hardcopy invitation letter and an invitation email that direct them to the REDCap recruitment interface, where they can read an overview of the research programme, expectations for participation and frequently asked questions, and are directed to the AI-READI website (https://aireadi.org) for further information including the study FAQ.

collection_consents:
- id: consent_collection
  name: Informed consent for collection and use
  consent_details:
  - Informed consent to participate was required before participation in any part of the protocol, including questionnaires.
  - Potential participants were given the option to read all consent documentation electronically (e-consent) before their visit and give consent with an electronic signature without verbal communication with a clinical research coordinator; e-consent is delivered through UW REDCap using a unique access code, allows free forward and backward navigation and return at a later time, and automatically emails the signed form to the participant.
  - Participants who prefer in-person consent are not excluded; in-person consent is obtained in a private room by a study team member with opportunity to ask questions and, if needed, additional scheduled time before signing.
  - The approved consent form for the principal project site, the University of Washington, is published at https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf. The other clinical sites had IRB reliance and used the same consent form with minor institution-specific language.
  - The consent form includes a table clarifying which information will be publicly available and which requires an application and approval process with privacy protection.
  - Subjects are asked to confirm their understanding of study activities and requirements to ensure comprehension. For subjects who have difficulty viewing the consent, a study team member reads it aloud; if a person is functionally illiterate, a study team member signs and notes the reason for the missing subject signature in the presence of an impartial witness.

consent_revocations:
- id: consent_revocation
  name: Consent withdrawal
  revocation_details:
  - Participants were permitted to withdraw consent at any time and cease study participation.
  - Any data that had been shared or used up to that point would stay in the dataset; this is clearly communicated in the consent document.
  - Study subjects have the opportunity to ask questions throughout the study and are reminded that they have the right to change their mind about study participation.

missing_data_documentation:
- id: missing_data
  name: Missing data patterns and causes
  missing_data_patterns:
  - Not all modalities are available for all participants.
  - Skipped questions or incomplete responses in survey data.
  - Absent or partial wearable and continuous glucose monitoring records.
  - Occasional missing imaging modalities where acquisition quality could not be achieved.
  missing_data_causes:
  - Some participants elected not to participate in some study elements.
  - In a few cases the data collection device did not have any stored results or was returned too late to retrieve the results, for example because the battery died or data was lost.
  - In a few cases there may have been a data collision at some point in the process and data has been lost.
  - Operator-dependent imaging modalities such as the Heidelberg Spectralis may be skipped when quality issues arise, producing missing data.
  handling_strategy: >-
    Missing values are retained rather than imputed. Quality control at data entry flagged clinical
    values outside expected minimum and maximum ranges in REDCap; data managers and clinical
    research coordinators reviewed flagged records and corrected errors only under the guidance
    and approval of the site principal investigator, and where no logical or appropriate
    correction existed the site PI decided whether the values should be removed.

raw_data_sources:
- id: raw_source_devices_and_records
  name: Source systems and instruments behind the released data
  source_description: >-
    Released data derive from REDCap electronic data capture, clinical instruments and imaging
    devices at the three study sites, at-home monitoring devices, CLIA-certified local
    laboratories and the University of Washington NORC central laboratory, participant electronic
    health records, and state Department of Licensing driving and accident records.
  source_type:
  - electronic data capture system
  - clinical instrument
  - medical imaging device
  - wearable and at-home sensor
  - clinical laboratory
  - electronic health record
  - government records
  access_details: >-
    The raw data are saved and expected to be preserved by the AI-READI project at least for the
    duration of the project, but are not anticipated to be shared outside the project team at
    present, because they have not been mapped to standardized terminologies and because raw data
    may accidentally include personal health information or personally identifiable information
    (for example in free-text fields). There is a possibility that raw data may be included in
    future releases of the controlled-access dataset.
  raw_data_format:
  - .xml (ECG)
  - .csv (MoCA, laboratory results, environmental sensor, continuous glucose monitor)
  - .fda (Topcon Maestro2 and Triton OCT/OCTA exports)
  - .sdt (Heidelberg FLIO exports)
  - .FIT (Garmin fitness tracker exports)
  - native DICOM (Optomed, iCare EIDON, Heidelberg Spectralis, Zeiss Cirrus)

ethical_reviews:
- id: ethical_review_uw_irb
  name: University of Washington Institutional Review Board approval
  contact_person: https://orcid.org/0000-0002-7452-1648
  reviewing_organization: https://ror.org/00cvxb145
  review_details:
  - AI-READI was approved by the Institutional Review Board of the University of Washington under approval number STUDY00016228, including reliance agreements with the IRBs of the University of Alabama at Birmingham and the University of California, San Diego.
  - The initial IRB approval at the University of Washington was received on December 20, 2022; the initial approval letter is published at https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf.
  - An annual renewal application to the IRB about the status and progress of the study is required and is due within 90 days of expiration.
  - FAIRhub records the human subject review status as "Submitted, approved", with no data monitoring committee, and states that the study is neither an FDA-regulated drug nor an FDA-regulated device study.
  - The BMJ Open protocol publication reports the ClinicalTrials.gov approval number STUDY00016228; FAIRhub records the ClinicalTrials.gov secondary identifier NCT06002048.
  - UCSD required inclusion of the California Bill of Rights in the informed consent form, and its Health Data Oversight Committee oversees data sharing with other institutions.

data_protection_impacts:
- id: dpia_none
  name: Data protection impact analysis
  impact_details:
  - No data protection impact analysis has been conducted.
  - The dataset has not undergone any formal external audits, but it has been reviewed internally by AI-READI team members for quality checks and to ensure that no personally identifiable information was accidentally included.

human_subject_research:
  id: human_subject_research
  name: Human subject research status
  involves_human_subjects: true
  irb_approval:
  - University of Washington IRB approval number STUDY00016228, initially approved 2022-12-20, with annual continuing review.
  - Reliance agreements with the IRBs of the University of Alabama at Birmingham and the University of California, San Diego.
  ethics_review_board:
  - University of Washington Human Subjects Division and Institutional Review Board
  special_populations:
  - No protected populations are purposefully included; pregnancy and gestational diabetes are exclusion criteria and enrolment is limited to consenting adults aged 40 to 85 years.
  - Native American or non-US indigenous populations are not actively recruited through a tribe or tribal organization for this protocol; separately, the project engages with the Native Biodata Consortium and planned a tribal consultation to address barriers and facilitators of participation with the goal of collecting similar data within a Native American cohort in an ethical and respectful manner.
  regulatory_compliance:
  - Written informed consent is provided by all participants.
  - Results returned to participants are sent by HIPAA-compliant encrypted email.
  - Licensees must comply with all data security and privacy standards established by the NIH under its Genomic Data Sharing Policy.

informed_consent:
- id: informed_consent_main
  name: Informed consent process
  consent_obtained: true
  consent_type:
  - Written informed consent
  - Electronic consent (e-consent) with electronic signature via REDCap
  - Broad consent for secondary use, banking and future sharing of data and specimens
  consent_documentation:
  - Approved University of Washington consent form published at https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
  - Other sites operated under IRB reliance and used the same consent form with minor institution-specific language.
  - Signed electronic consent forms are automatically emailed to subjects, who may request additional copies from the study coordinator for the duration of the study.
  withdrawal_mechanism:
  - Participants may withdraw consent at any time and cease study participation; data already shared or used remain in the dataset, which is clearly communicated in the consent document.
  consent_scope:
  - 'FAIRhub records the consent type as "ConsentSpecifiedNotElsewhereCategorised" with the note: the public version of the dataset can only be used for type 2 diabetes related research, while a private version will allow for more generic use.'
  - Consent covers placement of data in an open-source repository and transfer of samples to the study sample repository for future research, including manuscript and presentation preparation, grant preparation, future research studies, future AI/ML algorithms, repository and data-sharing platform creation, and future research using stored specimens and data.
  - Consent covers no geographic restriction, no genetic-only restriction, no research-type restriction and no non-commercial restriction as recorded in the FAIRhub dataset consent metadata.

at_risk_populations:
  id: at_risk_populations
  name: At-risk and protected populations
  at_risk_groups_included: false
  special_protections:
  - No protected populations (fetuses in utero, neonates, pregnant women, prisoners) are purposefully included; pregnancy and gestational diabetes are exclusion criteria.
  - Participation is limited to adults aged 40 to 85 years who are able to provide consent, so no parental permission or child assent procedures apply.
  - Transportation assistance (rideshare services) was offered to participants who reported barriers to transporting themselves to study visits, and the study covers reasonable parking, public transit or rideshare costs.
  - English fluency is required; based on Community Advisory Board feedback the team determined that enrolling non-English speakers would require translating all study materials, which was not initially possible. Native Spanish-speaking research staff at UCSD can provide interpretation, and Spanish translation of the consent form by UCSD translation services would be obtained if Hispanic recruitment goals are not met.
  - A Community Advisory Board of 11 persons drawn from the three sites, with racial and ethnic diversity reflecting the AI-READI sample, reviews consent forms and research protocols.

participant_privacy:
- id: participant_privacy_main
  name: Participant privacy protections
  anonymization_method:
  - 'FAIRhub records the de-identification type as "NoDeIdentification" with the explanation: no identifiers were collected so no active de-identification was necessary, but the team checked that no identifiable data per US HIPAA were present in the data. The record also flags direct-identifier and HIPAA de-identification as applied, while date, non-arbitrary and k-anonymity de-identification are not applied.'
  - The Nature Metabolism comment states that the public set is stripped of Protected Health Information as defined by the HIPAA Privacy Rule via the Safe Harbor method, as well as information related to participant sex and race/ethnicity to prevent stigmatization of findings.
  reidentification_risk:
  - The healthsheet states that the team does not currently anticipate uses of the dataset that could result in unfair treatment or harm, but notes a theoretical risk of future re-identification.
  - AI algorithms can infer individual patient characteristics and could facilitate individual-level identification; to prevent re-identification attempts the project implements a robust data dissemination system, a strict license agreement and data watermarking for both public and controlled sets.
  privacy_techniques:
  - Two-tier release - a publicly accessible set with fewer requirements for access, and a controlled-access set containing all public data plus more sensitive data available only to scientists whose institutions have completed legal and privacy use agreements.
  - Data watermarking applied to both public and controlled sets.
  - License terms that prohibit attempts to identify or contact data subjects, extract identifying information, establish membership of a data subject in a particular group, or otherwise cause harm.
  - All study procedures are conducted in private rooms; all study data and identifiable information are kept on encrypted servers or in locked cabinets or rooms with restricted access at all sites, at UW data security Level 3, with access limited to authorized research personnel.
  - Devices sent home with participants do not capture video or audio, have no GPS location monitoring, and are not synced with participant-owned devices.
  data_linkage:
  - Within the dataset, participant folders are named after the participant ID number used in the study, which links a participant's files across datatypes, modalities and devices.
  - Identifiable screening and contact information is held by the study team in REDCap and site systems and is not distributed with the dataset.

participant_compensation:
- id: compensation_participants
  name: Participant compensation
  compensation_provided: true
  compensation_type:
  - Cash stipend
  - Reimbursement of travel costs
  compensation_amount:
  - Study subjects received compensation of USD 200 for the study visit, funded through the grant.
  - 'The IRB protocol records a USD 200 stipend provided after receipt of the final data from participants and return of the study devices, typically at least two weeks after the study visit, not prorated, with the amount subject to change in future years depending on study funding.'
  - The study covers reasonable costs for parking, public transit or rideshare fees related to the study visit; subjects may incur unreimbursed transport costs if transportation fees exceed USD 25.
  - The same type and amount of compensation is given to participants invited back in year 4 of the study.
  compensation_rationale:
  - Compensation for participation and reimbursement of study-visit travel costs, with the payment schedule tied to return of the at-home monitoring devices after the 10-day collection period.

preprocessing_strategies:
- id: preprocessing_standardisation
  name: Mapping to standard data models and formats
  preprocessing_details:
  - All data are mapped to applicable data standard formats, such as the Observational Medical Outcomes Partnership (OMOP) Common Data Model for clinical data and DICOM for retinal imaging.
  - For some devices, data are transformed from a proprietary state into a standard model format prior to upload to FAIRhub - Topcon Maestro2 and Triton exports (.fda) and Heidelberg FLIO exports (.sdt) are converted to DICOM, and Garmin .FIT exports are converted to the Open mHealth standard.
  - ECG data are stored following the WaveForm DataBase (WFDB) standard and environmental sensor data follow the NASA ASCII File Format Guidelines for Earth Science Data.
  - The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1 specification - one directory per datatype at the root level, then one folder per modality, then one folder per device, then one folder per participant.
  - The project is developing new standards, such as the Clinical Dataset Structure, a simple and intuitive way to organize clinical research datasets and include structured metadata, documented at https://cds-specification.readthedocs.io.
  - All data are stored and shared using FAIRhub as "AI-ready", which enables immediate AI/ML research without reformatting and preprocessing.
  - Processing evolved across versions - version 1.0.0 used custom or ad hoc processing, while versions 2.0.0 and 3.0.0 used automated plus custom processing.
- id: preprocessing_deidentification
  name: Removal of identifying and sensitive fields before release
  preprocessing_details:
  - The public release contains no protected health information; information related to the sex and race/ethnicity of participants as well as medication used has been removed.
  - Data held under controlled access include 5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records, medications, and traffic and accident reports.
  - The healthsheet questions on pre-processing for de-identification and on de-identification measures to avoid re-identification are left unanswered in the published v3.0.0 healthsheet.

cleaning_strategies:
- id: cleaning_qc
  name: Quality control and data cleaning
  cleaning_details:
  - Several quality control measures were used at the time of data entry and acquisition; clinical data outside expected minimum and maximum ranges were flagged in REDCap and surfaced in reports viewed by clinical research coordinators and data managers.
  - 'Using these REDCap reports as guides, data managers and coordinators examined participant records and determined whether an error was likely, checking for credibility based on range checks, incorrect flow through prescribed skip patterns, missing data that can be directly filled from other portions of an individual record, and the omission or duplication of records.'
  - Editing was only done under the guidance and approval of the site principal investigator. If corrected data were available elsewhere in the respondent's answers the error was corrected; if there was no logical or appropriate way to correct the data, the site PI reviewed the values and decided whether they should be removed.
  - The Data Manager at each data site is responsible for the quality control of all data before uploading to FAIRhub.
  - Once data were sent from each study site to the central project team, additional processing steps were conducted in preparation for dissemination, including mapping to standardized terminologies where possible.
  - No instances were excluded from the dataset at the time of preprocessing.
  - FAIRhub publishes a Dataset Quality Dashboard, and the clinical_data directory includes a dqd_omop.json file supporting OMOP CDM data-quality analysis with the OMOP CDM Data Quality Dashboard, which runs more than 3,500 data quality checks against an OMOP CDM instance.

labeling_strategies:
- id: labeling_none
  name: No labeling performed
  labeling_details:
  - No labels are provided and no labeling strategy was applied; the dataset is hypothesis-agnostic and aimed at facilitating multiple potential downstream AI/ML applications.
  - No labellers were engaged, so no annotator demographics, guidelines, inter-annotator agreement or annotation compensation apply.
  - The software used to preprocess, clean or label instances is recorded as not applicable because no labeling was performed.
  - There are no formal guidelines for future researchers creating new labels or defining new tasks.
  - Human-level performance benchmarks for the applications the dataset is meant to address are recorded as not applicable.

raw_sources:
- id: raw_data_retained_internally
  name: Retained raw data
  raw_data_details:
  - The raw data are saved and expected to be preserved by the AI-READI project at least for the duration of the project.
  - Raw data are not anticipated to be shared outside the project team at present, because they have not been mapped to standardized terminologies and because they may accidentally include personal health information or personally identifiable information, for example in free-text fields.
  - There is a possibility that raw data may be included in future releases of the controlled-access dataset.
  - All participant images are exported from imaging devices in their raw format, and some images required conversion to DICOM prior to upload to the external AI-READI data storage site.

existing_uses:
- id: existing_uses_none
  name: Existing uses of the dataset
  examples:
  - The healthsheet records that the dataset has not yet been used for any tasks.
  - FAIRhub reports a citation count of zero and approximately 24,636 views for the version 3.0.0 record.

use_repository:
- id: use_repository_none
  name: Repository of works using the dataset
  repository_details:
  - There is no repository that links to papers or systems that use the dataset, beyond general scholarly search.
  - FAIRhub displays "Cited by" and dataset impact panels on the dataset landing page.

other_tasks:
- id: other_tasks_open
  name: Other potential tasks
  task_details:
  - The dataset is hypothesis-agnostic and was assembled with a data collection protocol composed of assessments from many health domains likely impacted by T2DM, so downstream tasks are open-ended rather than enumerated.
  - The project team does not maintain a resource for tracking all defined tasks or associated label definitions.

future_use_impacts:
- id: future_use_impacts
  name: Composition and processing factors affecting future uses
  impact_details:
  - The healthsheet states that, to the extent of the team's knowledge, no uses of the dataset are currently anticipated that could result in unfair treatment or harm, but there is a theoretical risk of future re-identification.
  - Because sex, race and ethnicity are withheld from the public release, subgroup and fairness analyses on the public data are constrained; the supplied recommended splits are intended to reduce disparities in models developed using the dataset.
  - As enrollment is ongoing, the pilot data release and periodic updates to data releases may not have achieved balanced distribution across groups, so users should not assume the released version is fully balanced.
  - Multiple devices were included for single measures to enhance generalizability and represent the diverse range of equipment used in clinical settings; device make and model, including specific imaging protocols such as macula or wide scans during OCT, were documented to ensure repeatability.

discouraged_uses:
- id: discouraged_uses
  name: Discouraged uses
  discouragement_details:
  - The AI-READI dataset license imposes restrictions on the usage of the data; the restrictions are described in the license files available at https://doi.org/10.5281/zenodo.17555036.
  - Licensees shall not make clinical treatment decisions based on the data, as it is intended solely as a research resource.
  - Licensees shall not use or attempt to use the data, alone or with other information, to compromise or infringe the confidentiality of an individual data subject or their right to privacy, to identify or contact any individual data subject or group of data subjects, to extract or extrapolate identifying information, to establish a data subject's membership in a particular group of persons, or otherwise to cause harm or injury to any data subject.
  - Licensees shall not transfer, license, sublicense, sell, assign, display, share or otherwise convey any portion of the data or any derivative work to a third party other than another licensee bound by identical terms.
  - Public-version access requires agreeing to use the data only for type 2 diabetes related research.

intended_uses:
- id: intended_uses
  name: Intended uses
  use_category:
  - Research
  - AI/ML model development
  - Commercial research use permitted under the license
  examples:
  - Development of AI/ML models of type 2 diabetes pathogenesis and salutogenesis.
  - Pseudotime manifold analyses reconstructing a temporal atlas of T2DM development and reversal towards health.
  - Multimodal model development combining survey, clinical, laboratory, imaging, waveform, wearable and environmental data.
  - Use as a model or blueprint for constructing other ethically sourced, AI-ready medical and health datasets.
  usage_notes: >-
    The dataset is intended solely as a research resource and must not be used for clinical
    treatment decisions. The license grants a non-exclusive, non-transferable right to download,
    reproduce and use the data and to create derivative works for research and commercial
    purposes. Licensees may make, reproduce and distribute models, algorithms and programs
    developed, trained or adapted using the data provided those artifacts do not themselves
    contain the data or any modified version of it, and provided the licensee undertakes all
    reasonable efforts before dissemination to minimise the likelihood that data can be memorized,
    derived, reconstructed or reconstituted through the use or construction of such models.
    Licensees agree to acknowledge the source and any funder of the data in any publications
    reporting use of the data. Those who download and use AI-READI data are encouraged to publish
    their results in the scientific literature.

prohibited_uses:
- id: prohibited_uses
  name: Prohibited uses
  prohibition_reason:
  - Making clinical treatment decisions based on the data is prohibited because the data is intended solely as a research resource.
  - Any attempt to compromise or infringe the confidentiality or privacy of a data subject, to identify or contact a data subject, to extract or extrapolate identifying information, to establish group membership, or otherwise to cause harm or injury to a data subject is prohibited.
  - Onward transfer, licensing, sublicensing, sale, assignment, display or sharing of any portion of the data or derivative works with third parties who are not bound by an identical agreement with the licensor is prohibited.
  - Use of the public version for research unrelated to type 2 diabetes is prohibited by the access agreement.
  - The agreement terminates automatically upon any breach, whereupon the licensee must delete all copies of the data in its possession and control and cease all use.

distribution_formats:
- id: distribution_fairhub
  name: FAIRhub data portal distribution
  description: >-
    The dataset is distributed and available for public use through the FAIRhub platform, a
    Microsoft Azure cloud-based data management, curation and sharing platform developed for this
    project. Version 3.0.0 has DOI 10.60775/fairhub.3. FAIRhub records the access type as
    "PublicDownloadSelfAttestationRequired". The documentation for v3.0.0 additionally describes
    a mini-subset version of the dataset for pipeline development and Azure Storage access. File
    formats recorded in the dataset description are application/dicom, text/markdown, text/csv and
    application/json.
  access_urls:
  - https://fairhub.io/datasets/3
  - https://fairhub.io/
  - https://doi.org/10.60775/fairhub.3
  - https://docs.aireadi.org/

distribution_dates:
- id: distribution_dates
  name: Release dates
  release_dates:
  - 'Version 1.0.0 (DOI 10.60775/fairhub.1): released 2024-05-03, 204 participants from the pilot data collection phase.'
  - 'Version 2.0.0 (DOI 10.60775/fairhub.2): released 2024-11-08, 1,067 participants, covering all data collected through 31 July 2024.'
  - 'Version 3.0.0 (DOI 10.60775/fairhub.3): released 2025-11-17, 2,280 participants, covering data collected 2023-07-19 to 2025-05-01.'
  - Deidentified data are released approximately yearly in two datasets, a controlled-access set and a publicly accessible set with fewer requirements for access.

third_party_sharing:
- id: third_party_sharing
  name: Distribution to third parties
  is_shared: true
  description: >-
    The dataset is distributed and available for public use to third parties outside the AI-READI
    Consortium through the FAIRhub platform, subject to the access steps and license terms.

license_and_use_terms:
  id: license_and_use_terms
  name: AI-READI dataset license and access terms
  contact_person: https://orcid.org/0000-0002-7452-1648
  license_terms:
  - 'Current license for version 3.0.0: AI-READI custom license v2.0, recorded on FAIRhub with rights URI https://doi.org/10.5281/zenodo.17555036.'
  - The license is a custom license specifically tailored to enable reuse of the AI-READI dataset (and other clinical datasets) for commercial or research purposes while placing strong requirements around data usage, security and secondary sharing to protect study participants, especially when data is reused for AI and ML applications.
  - 'Text of the earlier AI-READI Data License Agreement v1.0 (University of Washington as Licensor, deposited at https://doi.org/10.5281/zenodo.10642459) is included in the source corpus and grants a non-exclusive, non-transferable license to download, reproduce and use the data and to create derivative works for research and commercial purposes, subject to: no onward conveyance except to other licensees bound by identical terms; permission to distribute models that do not contain the data, with reasonable efforts to minimise memorization or reconstruction of the data; no clinical treatment decisions; no re-identification or contact of data subjects; acknowledgement of the source and any funder in publications; compliance with NIH Genomic Data Sharing Policy security and privacy standards; automatic termination on breach with deletion of all copies; retention of title and all industrial and intellectual property rights by the Licensor; provision of the data on an "as is" basis without warranty of any kind; limitation of the Licensor aggregate liability to one US dollar except for death or personal injury caused by Licensor negligence where applicable law prohibits limitation; indemnification of the Licensor by the Licensee; and compliance with all applicable laws, regulations and restrictions.'
  - 'Accessing the dataset requires several steps: logging in through a verified ID system, agreeing to use the data only for type 2 diabetes related research, and agreeing to the license terms.'
  - The dataset documentation is shared under the CC-BY 4.0 license, so there are no restrictions on its use.
  - FAIRhub displays the license as "Health Data License" on the dataset landing page.
  data_use_permission:
  - disease_specific_research

ip_restrictions:
  id: ip_restrictions
  name: Intellectual property restrictions
  restrictions:
  - Title to the data and all industrial and intellectual property rights therein remain solely and exclusively with the Licensor and its suppliers; the licensee shall not take any action inconsistent with such ownership, and any rights not expressly granted are reserved.
  - The healthsheet records no third-party IP-based restrictions beyond the dataset license itself, referring users to https://doi.org/10.5281/zenodo.17555036.
  - There are no plans for the researchers involved in collecting the dataset to develop commercial products or file patents; however, the dataset is publicly available with a commercial-friendly license and products or patents may be developed from it in the future.
  - Some retinal imaging devices were loaned or discounted by their manufacturers for research purposes, and the dataset documentation notes the corresponding vendor documentation, but no vendor IP restrictions on the released data are recorded.

regulatory_restrictions:
  id: regulatory_restrictions
  name: Regulatory and compliance restrictions
  governance_committee_contact: https://orcid.org/0000-0002-7452-1648
  regulatory_restrictions:
  - The healthsheet records no export controls or other regulatory restrictions beyond the dataset license, referring users to https://doi.org/10.5281/zenodo.17555036.
  - Licensees must comply with all data security and privacy standards established by the US National Institutes of Health under its Genomic Data Sharing Policy, currently the NIH Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
  - Licensees agree to comply with all applicable laws, regulations and restrictions relating to the distribution and use of the data and of models derived from it.
  hipaa_compliant: compliant
  other_compliance:
  - The public dataset contains no protected health information; the Nature Metabolism comment states the public set is stripped of PHI as defined by the HIPAA Privacy Rule using the Safe Harbor method.
  - Results are returned to participants by HIPAA-compliant encrypted email.
  - Recruitment letters are produced by an SSAE16 SOC security-certified and HIPAA-compliant printing and fulfillment service.
  - FAIRhub records that the study is not an FDA-regulated drug study and not an FDA-regulated device study.
  confidentiality_level: restricted

maintainers:
- id: maintainer_ai_readi_team
  name: AI-READI team
  role: academic_institution
  maintainer_details:
  - The AI-READI team supports and maintains the dataset.
  - The dataset is hosted on FAIRhub through Microsoft Azure.
  - Each data collection site uploads data at regular intervals to FAIRhub; the Data Manager at each site is responsible for quality control of all data before upload.
  - For questions, suggestions or feedback related to the dataset, users are directed to https://aireadi.org/contact; the healthsheet refers users to the README file included with the dataset for contact information, and the study_description.json and dataset_description.json metadata files carry additional contact, author and contributor information.
  - The central study contact recorded on FAIRhub is Aaron Lee, MD, e-mail contact@aireadi.org.

updates:
  id: update_plan
  name: Versioned release plan
  frequency: Approximately annual static version releases.
  update_details:
  - The dataset gets released as static versions rather than being dynamically updated.
  - The dataset will not be updated in place; instead new versions will be released with additional instances as more study participants complete the study visit.
  - There are plans to release new versions approximately once a year with additional data from participants enrolled since the last version release.
  - Enrollment is ongoing, and future versions will include larger numbers of participants as enrollment increases.
  - Changes between versions are documented in detail in the CHANGELOG file included in the dataset and visible at docs.aireadi.org.

retention_limit:
  id: retention_limits
  name: Data retention
  retention_period: No limit.
  retention_details:
  - There are no limits on the retention of the data associated with the instances.
  - Raw data are expected to be preserved by the AI-READI project at least for the duration of the project.

version_access:
  id: version_access
  name: Version availability
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  versions_available:
  - 'Version 3.0.0 - DOI 10.60775/fairhub.3 - 2025-11-17 - current version.'
  - 'Version 2.0.0 - DOI 10.60775/fairhub.2 - 2024-11-08.'
  - 'Version 1.0.0 - DOI 10.60775/fairhub.1 - 2024-05-03.'
  version_details:
  - This is the third version of the dataset and consists of data collected up through the end of the second year of the study.
  - This datasheet was created for the third version of the dataset. Datasheets for earlier versions are published at https://docs.aireadi.org/docs/1/dataset/healthsheet and https://docs.aireadi.org/docs/2/dataset/healthsheet.
  - 'Participant counts by version: 204 in v1.0.0 (pilot), 1,067 in v2.0.0 (adding 863 participants of year-2 data), and 2,280 in v3.0.0 (adding 1,213 participants of year-3 data).'
  - 'Data-type coverage by version: 15+ data types in v1.0.0; one additional imaging device added with the year-2 data; three additional imaging devices added with the year-3 data.'
  - The data fields and types are largely the same as the prior version, except that the Snellen visual acuity variables were dropped in v3.0.0 so that only logMAR visual acuity measurements are available.
  - Version 2.0.0 comprised 2.01 TB across 165,051 files; the FAIRhub v2.0.0 landing page states that this version of the dataset is no longer accessible and refers users to the latest version.
  - Older versions will not continue to be maintained through in-place updates; the project instead releases new versions with additional instances.
  - Version-specific documentation is selectable from the dropdown at https://docs.aireadi.org, with one documentation version per dataset version.
  - The v3.0.0 documentation "About" page describes the documentation as associated with a version containing data from the pilot study phase; that sentence is carried over from the v2.0.0 page and is inconsistent with the v3.0.0 README and healthsheet, which describe v3.0.0 as the main-study release covering 2,280 participants.

extension_mechanism:
  id: extension_mechanism
  name: External contribution mechanism
  contribution_url: https://aireadi.org/contact
  extension_details:
  - There is currently no mechanism for others to extend or augment the AI-READI dataset outside of those involved in the project.
  - The project publishes its code and standards through the AI-READI GitHub organization at https://github.com/AI-READI and its Zenodo community at https://zenodo.org/communities/aireadi.

is_deidentified:
  id: deidentification
  name: De-identification status
  identifiable_elements_present: false
  method: >-
    FAIRhub records de-identification type "NoDeIdentification" with the explanation that no
    identifiers were collected so no active de-identification was necessary, but the team checked
    that no identifiable data per US HIPAA were present in the data. The Nature Metabolism comment
    describes the public set as stripped of Protected Health Information as defined by the HIPAA
    Privacy Rule via the Safe Harbor method.
  identifiers_removed:
  - Protected health information as defined by the HIPAA Privacy Rule
  - Sex
  - Race and ethnicity
  - Medications used
  deidentification_details:
  - The data in this dataset contain no protected health information.
  - Information related to the sex and race/ethnicity of participants, as well as medication used, has also been removed from the released dataset.
  - Sex and race/ethnicity were removed to prevent stigmatization of findings.
  - Elements held under controlled access rather than in the public release include 5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records, medications, and traffic and accident reports.
  - The healthsheet questions on preprocessing for de-identification and on measures taken to avoid re-identification are left unanswered in the published v3.0.0 healthsheet.

