    dataset_structure_description.json, healthsheet.md, LICENSE.txt, participants.json,
    participants.tsv, README.md and study_description.json. participants.tsv carries the
    recommended train/validation/test split assignment for each participant.
  collection_type:
  - metadata
  - documentation
  file_count: 9
  total_bytes: 419614
  conforms_to: Clinical Dataset Structure (CDS) v0.1.1

