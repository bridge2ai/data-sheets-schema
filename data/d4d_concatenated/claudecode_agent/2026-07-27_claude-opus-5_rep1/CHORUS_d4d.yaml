sensitive_elements:
- id: d4d:chorus_sensitive_elements
  name: Sensitive clinical and contextual elements
  sensitive_elements_present: true
  sensitivity_details:
  - >-
    Patient-level clinical records from acute and critical care admissions,
    including demographics, diagnoses, procedures, medication administration, and
    nursing flowsheets.
  - Unstructured clinical notes, held centrally only as tokens.
  - Medical imaging extracted from PACS.
  - Physiologic waveform telemetry and EEG waveforms.
  - Social determinants of health.
  - >-
    Geographic contextual factors, such as distance to the nearest hospital, which
    the project ensures data elements feature.

confidential_elements:
- id: d4d:chorus_confidentiality
  name: Confidentiality of patient clinical data
  confidential_elements_present: true
  confidentiality_details:
  - >-
    The dataset comprises patient data from critically ill patients across
    contributing hospitals.
  - >-
    Every data type listed in the Cohort 2 informational webinar - demographics,
    medication administration, procedures, nursing flowsheets, diagnoses, clinical
    notes, imaging, waveform telemetry, and waveform EEG - is designated Controlled
    for access control.
  - >-
    Clinical notes are stored locally at contributing sites; only tokens are held
    centrally in the enclave.
  - >-
    Community-facing ethics focus groups are conducted "to determine what data is
    appropriate for public sharing".

known_biases:
- id: d4d:chorus_bias_contributing_site_selection
  name: Selection scope of contributing sites and care settings
  bias_type: selection_bias
  bias_description: >-
    The dataset is assembled from 14 data-contributing hospitals within a
    collaboration spanning 20 academic centers, and covers intensive care admissions
    (ICU, PICU, NICU) rather than a general patient population. The composition of
    the dataset is therefore determined by which academic centers participate and
    which admissions they contribute.
  mitigation_strategy: >-
    The project states that it will "establish a legal framework for collecting data
    at scale, sampling to ensure comprehensive sets of patient conditions and clinical
    treatment strategies", that "Federated access will enable sampling methods to
    ensure a balanced and diverse cohort", and that data elements will "feature
    appropriate contextual factors such as geographic distance to the nearest
    hospital". Patient-focused efforts "will determine the ethical and legal
    approaches to manage privacy and bias, while accounting for Social Determinants of
    Health".
  description: >-
    Scope facts are taken directly from the current source bundle; the bias-type
    classification is an assessment applied to those facts. The current source bundle
    reports no quantitative bias analysis or representativeness verification.

known_limitations:
- id: d4d:chorus_limitation_modality_completeness
  name: Incomplete modality coverage in the released data
  limitation_type: coverage_limitation
  limitation_description: >-
    As of the September 2025 Cohort 2 informational webinar, OMOP and telemetry data
    are in the enclave, but clinical notes are "stored locally except tokens", imaging
    has "currently 1000 images available with de-id in process for larger cohort", and
    EEG "extraction in process at this point". Published metadata is listed as Planned
    for clinical notes, waveform telemetry, and waveform EEG.
  scope_impact: >-
    Analyses that depend on full-text clinical notes, large imaging cohorts, or EEG
    waveforms are constrained relative to the anticipated final dataset of 9 data
    modalities.
- id: d4d:chorus_limitation_critical_care_scope
  name: Restricted to acute and critical care admissions
  limitation_type: scope_limitation
  limitation_description: >-
    The dataset covers patients with acute or critical illness, with released
    admissions drawn from ICU, PICU, and NICU settings at participating hospitals. It
    is not a general-population or full-hospital dataset.
  scope_impact: >-
    Findings and models derived from the dataset apply to acute and critical care
    populations; the current source bundle makes no claim of generalization beyond
    them.
- id: d4d:chorus_limitation_academic_center_representativeness
  name: Contributing sites are US academic centers
  limitation_type: representativeness_limitation
  limitation_description: >-
    Data are contributed by 14 Data Acquisition centers drawn from a collaboration of
    20 academic centers; the CHoRUS organization lists its location as the United
    States of America. No representativeness verification against a broader hospital
    population is reported in the current source bundle.
  recommended_mitigation: >-
    The project describes federated access enabling sampling methods intended to
    ensure a balanced and diverse cohort, and the inclusion of contextual factors and
    social determinants of health.
- id: d4d:chorus_limitation_administrative_review
  name: Project resources under administrative review
  limitation_type: temporal_limitation
  limitation_description: >-
    The CHoRUS project website, as captured, carries the banner "This repoitory is
    under review for potential modification in compliance with Administration
    directives" (spelling as published). The scope and outcome of that review are not
    described in the current source bundle.
  scope_impact: >-
    The content and availability of project resources described here may change.

missing_data_documentation:
- id: d4d:chorus_missing_data_modality_availability
  name: Modality availability gaps in the current release
  missing_data_patterns:
  - >-
    Full-text clinical notes are not held centrally; only tokens are available in the
    enclave.
  - >-
    Imaging is limited to 1000 available images as of August/September 2025, against
    7,642 admissions reported with radiology data in the current released dataset.
  - EEG waveform data extraction was in process as of September 2025.
  - >-
    Published metadata is listed as Planned, rather than available, for clinical
    notes, waveform telemetry, and waveform EEG.
  missing_data_causes:
  - >-
    De-identification of imaging for a larger cohort was in process at the time of
    the source capture.
  - >-
    Clinical notes are retained locally at contributing sites, with only tokenized
    content transferred.
  - EEG extraction from hospital databases was still under way.
  description: >-
    The current source bundle documents modality-level availability gaps. It does not
    document instance-level missingness patterns, missingness rates, or a strategy for
    handling missing values.

acquisition_methods:
- id: d4d:chorus_acquisition_retrospective_clinical_extracts
  name: Retrospective extraction from operational clinical systems
  acquisition_details:
  - >-
    "Retrospective data collection" from data contributing hospitals, as stated in
    the Cohort 2 informational webinar.
  - >-
    Structured EHR content is documented by providers and clinical staff in the course
    of care: procedures and diagnoses are "documentation by providers", nursing
    flowsheets are "high-frequency documentation", and medication administration
    dosing is "time-stamped upon each infusion change or dose administration".
  - Imaging is extracted from PACS.
  - >-
    Waveform telemetry is acquired from bedside monitors and gateway/middleware
    systems.
  - EEG waveforms are acquired from the hospital database.
  - >-
    Clinical notes are extracted and tokenized using the OHNLP toolkit, so the
    centrally held representation is derived rather than raw.
  description: >-
    The current source bundle does not state whether any element was reported by
    subjects, nor does it describe validation or verification procedures for the
    acquisition mechanisms.

collection_mechanisms:
- id: d4d:chorus_collection_mechanism_site_extract_pipeline
  name: Site data extract, curation, and upload pipeline
  mechanism_details:
  - >-
    "Standard operating protocols (SOPs) to instruct data contributing sites about
    best practices for curating and delivering interoperable datasets" are maintained
    in the Chorus_SOP repository, which hosts "an interactive workflow diagram
    describing the step-by-step process for extracting and contributing clinical data
    to CHoRUS, with dynamic links to various SOP documents that have undergone an
    internal validation and review process".
  - >-
    The chorus-extract-upload repository provides "tools to create and upload a CHoRUS
    Data Extract".
  - >-
    A separate data_acq_SOP repository provides "an online documentation SOP for Data
    Acquisition Module".
  - >-
    "Validated semantic mappings for connecting clinical data in various source
    formats to international standards" are maintained in the chorus-mapping
    repository, with "documentation and pooled tabular mappings along with an
    associated clinical validation SOP".
  - >-
    The project develops capabilities across a multi-center network "to acquire,
    standardize, tokenize, store, visualize, and label data".
  - >-
    Site progress is tracked: data contributing sites "provide regular status updates
    with regard to their progress in creating and curating a CHoRUS-specific clinical
    data extract", submitted through GitHub or a Google Form wired to the GitHub API
    by a GoogleScript, and surfaced in the Standards Project or the Data Acquisition
    Project.
  used_software:
  - id: d4d:sw_chorus_extract_upload
    name: chorus-extract-upload
    description: Repository with tools to create and upload a CHoRUS Data Extract.
    license: MIT
  - id: d4d:sw_chorus_sop
    name: Chorus_SOP
    description: CHoRUS centralized SOP documentation site.
    license: Apache-2.0
  - id: d4d:sw_data_acq_sop
    name: data_acq_SOP
    description: An online documentation SOP for the Data Acquisition Module.

sampling_strategies:
- id: d4d:chorus_sampling_federated_balanced_cohort
  name: Federated sampling for a balanced and diverse cohort
  is_sample: true
  source_data:
  - >-
    Clinical records of patients with acute or critical illness at 14 data
    contributing hospitals.
  strategies:
  - >-
    "Federated access will enable sampling methods to ensure a balanced and diverse
    cohort."
  - >-
    The project will "establish a legal framework for collecting data at scale,
    sampling to ensure comprehensive sets of patient conditions and clinical treatment
    strategies".
  description: >-
    The dataset is a sample of critically ill patient admissions rather than all
    possible instances. The current source bundle does not state whether sampling is
    random, and reports no representativeness verification.

data_collectors:
- id: d4d:chorus_collector_data_site_managers
  name: Data site managers at contributing sites
  role: Data site manager
  collector_details:
  - >-
    "The starting reference for data managers at data contributing sites is the
    Chorus_SOP page", which describes the step-by-step process for extracting and
    contributing clinical data to CHoRUS.
  - >-
    Sites submit regular status updates on their progress creating and curating a
    CHoRUS-specific clinical data extract.
  - >-
    Issues arising in the creation or submission of a data extract are raised in
    Standards Discussions or Data Acquisition Discussions.
  description: >-
    Compensation arrangements for data collectors are not described in the current
    source bundle.
- id: d4d:chorus_collector_clinical_collaborators
  name: Clinical collaborators
  role: Clinical collaborator
  collector_details:
  - >-
    "Clinical expertise is invaluable to semantic mapping and validation within
    CHoRUS."
  - >-
    Clinical collaborators contribute to mapping efforts through the chorus-mapping
    repository and its associated clinical validation SOP.
- id: d4d:chorus_collector_subteams
  name: CHoRUS sub-teams
  role: Project sub-team
  collector_details:
  - >-
    Recordings and documentation are "compiled by the various sub-teams (Standards,
    Data Acquisition, and Tooling) within the CHoRUS DGP".

collection_timeframes:
- id: d4d:chorus_collection_timeframe
  name: Project period and reported data status
  timeframe_details:
  - >-
    NIH project 1OT2OD032701-01 runs from 2022-09-01 to 2026-11-30 (fiscal year 2022
    award). This is the award period, not a statement of the calendar range of the
    clinical records collected.
  - >-
    "As of August 2025, [the dataset] covers 14 different hospitals with over 45K
    unique admissions."
  description: >-
    The current source bundle does not state the calendar range over which the
    underlying clinical records were created, nor whether the collection timeframe
    matches the creation timeframe of the underlying data.

direct_collection:
- id: d4d:chorus_direct_collection
  name: Collection via contributing hospitals
  is_direct: false
  collection_details:
  - >-
    Data collection is retrospective and proceeds through data contributing sites,
    which extract, curate, and upload clinical data extracts under CHoRUS SOPs, rather
    than through direct collection from individuals.
  - >-
    Source content originates in operational clinical systems: EHR documentation by
    providers and nursing staff, PACS, bedside monitors and gateway/middleware, and
    hospital EEG databases.

raw_data_sources:
- id: d4d:chorus_raw_source_ehr
  name: Hospital electronic health record systems
  source_description: >-
    Structured electronic health record data at data contributing hospitals,
    supplying demographics, medication administration (dosing time-stamped upon each
    infusion change or dose administration), procedures documented by providers,
    high-frequency nursing flowsheet documentation, and diagnoses documented by
    providers.
  source_type:
  - electronic health record
  access_details: >-
    Controlled access; data reach CHoRUS through site-produced clinical data extracts
    governed by CHoRUS standard operating procedures.
  raw_data_format:
  - Standardized to the OMOP Common Data Model
- id: d4d:chorus_raw_source_clinical_notes
  name: Unstructured clinical notes
  source_description: >-
    Unstructured clinical note text in hospital EHR systems, extracted and tokenized
    using the OHNLP toolkit. The webinar states that clinical notes are stored locally
    at sites except for tokens.
  source_type:
  - electronic health record
  - unstructured text
  access_details: Controlled access; notes remain local to contributing sites except tokens.
  raw_data_format:
  - OHNLP open source schema
- id: d4d:chorus_raw_source_pacs
  name: Picture archiving and communication systems (PACS)
  source_description: >-
    Medical imaging extracted from hospital PACS at contributing sites.
  source_type:
  - imaging archive
  access_details: >-
    Controlled access; as of September 2025, 1000 images were available with
    de-identification in process for a larger cohort.
  raw_data_format:
  - DICOM
- id: d4d:chorus_raw_source_bedside_monitors
  name: Bedside monitors and gateway/middleware
  source_description: >-
    Physiologic waveform telemetry captured from bedside monitors via
    gateway/middleware systems at contributing hospitals.
  source_type:
  - bedside physiologic monitor
  access_details: Controlled access.
  raw_data_format:
  - WFDB
- id: d4d:chorus_raw_source_eeg_database
  name: Hospital EEG databases
  source_description: >-
    Electroencephalography waveform recordings held in hospital EEG databases at
    contributing sites.
  source_type:
  - clinical EEG database
  access_details: Controlled access; extraction was in process as of September 2025.
  raw_data_format:
  - EDF+
  - Persyst

raw_sources:
- id: d4d:chorus_raw_data_local_notes
  name: Locally retained raw clinical notes
  raw_data_details:
  - >-
    "Clinical notes - stored locally except tokens": raw note text is retained at
    contributing sites, and only tokenized content is held centrally.
  - >-
    The current source bundle provides no access point, link, or request procedure for
    the locally retained raw data.

preprocessing_strategies:
- id: d4d:chorus_preprocessing_omop_standardization
  name: Standardization to the OMOP Common Data Model
  preprocessing_details:
  - >-
    The project will "acquire data, standardize data to the OMOP Common Data Model,
    transform data using approaches that limit re-identification, and label data".
  - >-
    Demographics, medication administration, procedures, nursing flowsheets, and
    diagnoses each carry OMOP as their data standard; diagnoses use the OMOP schema
    with extensions.
  - >-
    "Validated semantic mappings for connecting clinical data in various source
    formats to international standards" are maintained and clinically validated
    through the chorus-mapping repository.
- id: d4d:chorus_preprocessing_note_tokenization
  name: Extraction and tokenization of clinical notes
  preprocessing_details:
  - >-
    Clinical notes are "extracted and tokenized using OHNLP toolkit" and carry the
    OHNLP data standard, with an OHNLP open source published metadata schema.
  - >-
    The project describes acquiring "tokenized unstructured electronic health record
    data" as one of its data types.
  used_software:
  - id: d4d:sw_ohnlp_toolkit
    name: OHNLP toolkit
    description: >-
      Toolkit used to extract and tokenize unstructured clinical notes; the resulting
      data carry the OHNLP open source schema.
- id: d4d:chorus_preprocessing_reidentification_limiting
  name: Transformation to limit re-identification
  preprocessing_details:
  - >-
    The project will "transform data using approaches that limit re-identification".
  - >-
    De-identification of imaging was in process for a larger cohort as of September
    2025.
  used_software:
  - id: d4d:sw_privacy_scan_tool
    name: privacy_scan_tool
    description: A privacy scan tool for medical records, written in Python.
  - id: d4d:sw_ctp_deid
    name: CTP-deid
    description: >-
      A repository in the chorus-ai GitHub organization; the captured overview lists
      it without a description.
- id: d4d:chorus_preprocessing_waveform_conversion
  name: Waveform conversion
  preprocessing_details:
  - >-
    Waveform telemetry carries the WFDB standard and a published metadata schema
    described as "PhysioNet schema extended"; EEG waveforms carry EDF+ and Persyst.
  - >-
    The chorus_waveform repository holds "CHoRUS waveform documentation and various
    waveform conversion scripts", and chorus_waveform_resources holds "Resources which
    support the preparation and release of waveforms".
  used_software:
  - id: d4d:sw_chorus_waveform
    name: chorus_waveform
    description: CHoRUS waveform documentation and various waveform conversion scripts.
    license: MIT
  - id: d4d:sw_chorus_waveform_resources
    name: chorus_waveform_resources
    description: Resources which support the preparation and release of waveforms.
- id: d4d:chorus_preprocessing_geocoding
  name: Geocoding of location entities and contextual enrichment
  preprocessing_details:
  - >-
    The UF-Geocoding repository provides "Open source code to geocode OMOP Location
    entities via DeGauss".
  - >-
    The project will "ensure that data elements feature appropriate contextual factors
    such as geographic distance to the nearest hospital".
  used_software:
  - id: d4d:sw_uf_geocoding
    name: UF-Geocoding
    description: >-
      Open source code to geocode OMOP Location entities via DeGauss; forked from
      bihorac-LAB/Exposome.
    license: MIT

cleaning_strategies:
- id: d4d:chorus_cleaning_site_characterization_feedback
  name: Site characterization report feedback loop
  cleaning_details:
  - >-
    The CHoRUSReports repository "is dedicated to producing characterization reports
    to return to sites following their data submissions".
  - >-
    SOPs instruct data contributing sites "about best practices for curating and
    delivering interoperable datasets", and SOP documents "have undergone an internal
    validation and review process".
  description: >-
    The current source bundle describes a curation and characterization feedback
    process but does not state specific cleaning operations such as instance removal
    or missing-value processing.
  used_software:
  - id: d4d:sw_chorus_reports
    name: CHoRUSReports
    description: >-
      Repository dedicated to producing characterization reports to return to sites
      following their data submissions, written in R.

labeling_strategies:
- id: d4d:chorus_labeling_annotation_environment
  name: Visualization and annotation environment
  data_annotation_platform:
  - CHoRUS visualization and annotation environment
  labeling_details:
  - >-
    "A visualization and annotation environment will label data with targets important
    for prediction."
  - >-
    The project develops capabilities across a multi-center network to "acquire,
    standardize, tokenize, store, visualize, and label data".
  description: >-
    The NIH RePORTER abstract's corresponding clause is truncated in the source ("and
    label data for ;"). The current source bundle names no annotation protocol,
    annotator pool, number of annotations per item, or inter-annotator agreement
    measure.

machine_annotation_tools:
- id: d4d:chorus_machine_annotation_tools
  name: Automated processing tools used in dataset creation
  tools:
  - OHNLP toolkit
  - privacy_scan_tool
  - DeGauss (via UF-Geocoding)
  tool_descriptions:
  - >-
    OHNLP toolkit: used to extract and tokenize unstructured clinical notes; outputs
    carry the OHNLP open source schema.
  - "privacy_scan_tool: a privacy scan tool for medical records."
  - >-
    DeGauss, invoked by the UF-Geocoding repository, geocodes OMOP Location entities.
  description: >-
    No accuracy figures are reported for these tools in the current source bundle.

ethical_reviews:
- id: d4d:chorus_ethics_focus_groups
  name: Community-facing ethics focus groups
  review_details:
  - >-
    The project will "perform community-facing ethics focus groups to determine what
    data is appropriate for public sharing".
  - >-
    "The CHoRUS consortium evaluates community perspectives on clinical care AI to
    find ways to increase trustworthiness of provenance and privacy in AI. New
    approaches are being created as existing legal and regulatory landscape is
    analyzed."
  - >-
    Ethics is one of the project's three pillars, described as "Ethics (Ethical and
    Trustworthy AI)".
  - >-
    The project will "establish a legal framework for collecting data at scale".
  description: >-
    The current source bundle does not name an institutional review board, an approval
    identifier, a review frequency, or a determination outcome.

human_subject_research:
  id: d4d:chorus_human_subject_research
  name: Human subjects scope
  involves_human_subjects: true
  special_populations:
  - Patients with acute or critical illness
  - Pediatric intensive care unit (PICU) patients
  - Neonatal intensive care unit (NICU) patients
  description: >-
    The dataset comprises clinical data from critically ill patients; the NIH
    RePORTER abstract describes acquiring an AI-ready data set "from more than 100,000
    critically ill patients", and the project website reports released admissions from
    ICU, PICU, and NICU. No IRB approval identifier, ethics review board name, or
    regulatory compliance determination appears in the current source bundle.

at_risk_populations:
  id: d4d:chorus_at_risk_populations
  name: At-risk populations in scope
  at_risk_groups_included: true
  description: >-
    The released dataset includes admissions from pediatric and neonatal intensive
    care units, and the underlying population consists of patients with acute or
    critical illness. The current source bundle describes no special protections,
    assent procedures, or guardian consent arrangements.

participant_privacy:
- id: d4d:chorus_participant_privacy
  name: Privacy protections
  anonymization_method:
  - >-
    Extraction and tokenization of unstructured clinical notes using the OHNLP
    toolkit, with raw notes retained locally at contributing sites.
  - >-
    De-identification of imaging, described as in process for a larger cohort as of
    September 2025.
  privacy_techniques:
  - >-
    The project will "transform data using approaches that limit re-identification".
  - >-
    Patient-focused efforts "will determine the ethical and legal approaches to manage
    privacy and bias, while accounting for Social Determinants of Health".
  - >-
    The consortium works "to find ways to increase trustworthiness of provenance and
    privacy in AI".
  - >-
    A privacy scan tool for medical records (privacy_scan_tool) is maintained in the
    CHoRUS GitHub organization.
  - All data types are held under controlled access in a cloud enclave.
  data_linkage:
  - >-
    OMOP Location entities are geocoded via DeGauss (UF-Geocoding), and data elements
    are enriched with contextual factors such as geographic distance to the nearest
    hospital and social determinants of health.
  description: >-
    The current source bundle reports no quantitative re-identification risk
    assessment.

is_deidentified:
  id: d4d:chorus_deidentification
  name: De-identification approach
  method: >-
    Tokenization of unstructured clinical notes using the OHNLP toolkit; transformation
    of data "using approaches that limit re-identification"; de-identification of
    imaging, in process for a larger cohort as of September 2025.
  deidentification_details:
  - >-
    Clinical notes are stored locally at contributing sites; only tokens are held
    centrally.
  - >-
    The chorus-ai GitHub organization maintains a privacy scan tool for medical
    records and a CTP-deid repository.
  - >-
    The current source bundle does not enumerate which identifiers are removed, nor
    state whether individuals remain identifiable directly or indirectly.

existing_uses:
- id: d4d:chorus_existing_use_training_and_publications
  name: Training activities and publications
  examples:
  - "Datasets are being used for training activities and publications."
  - >-
    The AIM-AHEAD Bridge2AI for Clinical Care Training Program "expands access to
    Bridge2AI CHoRUS data through engagement, AI training, and mentorship", equipping
    trainees "to apply AI/ML methods to big data analysis and conduct innovative
    research at the intersection of healthcare challenges and AI/ML using multi-modal
    datasets from a broad range of cohort participants".
  - >-
    Cohort 2 of that program ran from a November 17, 2025 start date to a July 31,
    2026 end date, selecting up to 30 trainees who receive hands-on training on the
    Bridge2AI AI/ML for Clinical Care Network and leverage the data and tools to
    create practical use cases.
  - >-
    Trainees prepare works-in-progress posters for the Bridge2AI Annual Meeting (May
    2026) and the AIM-AHEAD Annual Meeting (July 2026), and may submit abstracts to
    health informatics conferences or develop manuscripts for peer-reviewed journals.
  description: >-
    The current source bundle names no specific publication, model, or completed study
    using the dataset.

other_tasks:
- id: d4d:chorus_other_tasks_downstream_analytics
  name: Downstream analytics and trainee-developed use cases
  task_details:
  - >-
    The CHoRUS GitHub overview invites people "interested in getting involved in
    downstream analytics on the mapped and assembled dataset" to make contact.
  - >-
    Training-program trainees "develop and present use cases suitable to apply in
    Bridge2AI Data Topics" and "participate in collaborative research on the Bridge2AI
    Clinical Care Cloud platform".
  description: >-
    The current source bundle describes these as open avenues rather than enumerating
    specific additional tasks.

intended_uses:
- id: d4d:chorus_intended_uses
  name: Intended applications
  examples:
  - >-
    Developing ML/AI models that characterize acute and critical care illness, predict
    complications, and measure treatment response among patients with acute or
    critical illness.
  - >-
    Building "machine-learning (ML) and artificial intelligence (AI)-derived models to
    improve the care and outcomes of patients requiring critical care".
  - >-
    External validation of AI-developed models against the sequestered holdout test
    set, "to aid marketplace adoption of AI-developed models for implementation in
    acute and critical care".
  - >-
    Hands-on AI/ML training and education, including canonical Jupyter Notebooks for
    AI/ML for Clinical Care, workshops on the OHDSI/OMOP common data model and the
    OHDSI tool stack, and trainee-developed practical use cases on the Bridge2AI AI/ML
    for Clinical Care Collaborative Cloud.
  use_category:
  - clinical AI/ML model development
  - external model validation
  - AI/ML training and education

future_use_impacts:
- id: d4d:chorus_future_use_impacts
  name: Considerations affecting future use
  impact_details:
  - >-
    The project performs legal and ethical research and community-facing ethics focus
    groups "to determine what data is appropriate for public sharing", so the scope of
    shareable content is subject to those determinations.
  - >-
    Patient-focused efforts "will determine the ethical and legal approaches to manage
    privacy and bias, while accounting for Social Determinants of Health".
  - >-
    The project analyses the "existing legal and regulatory landscape" and creates new
    approaches as part of increasing trustworthiness of provenance and privacy in AI.
  - >-
    The CHoRUS project website, as captured, states that the repository "is under
    review for potential modification in compliance with Administration directives",
    which may affect the availability or content of project resources.

distribution_formats:
- id: d4d:chorus_distribution_cloud_enclave
  name: Controlled-access cloud enclave
  description: >-
    The dataset is distributed under controlled access through the Bridge2AI AI/ML for
    Clinical Care Collaborative Cloud. OMOP and telemetry data reside in the enclave;
    clinical notes remain local to contributing sites except for tokens. The
    chorus-container-apps repository holds a "Set of dockerized container applications
    and associated configurations to be deployed to support CHoRUS services on Azure".
    Access is provisioned per user: participants complete a registration form with
    name, email, and institution, and "Once access is granted and compute is
    provisioned, an email will be sent". Interaction with the data uses the OHDSI tool
    stack and Jupyter Notebooks.
  access_urls:
  - https://chorus4ai.org/
  used_software:
  - id: d4d:sw_chorus_container_apps
    name: chorus-container-apps
    description: >-
      Set of dockerized container applications and associated configurations to be
      deployed to support CHoRUS services on Azure.
  - id: d4d:sw_chorus_apps_internal
    name: chorus-apps-internal
    description: CHoRUS internally built web applications.

third_party_sharing:
- id: d4d:chorus_third_party_sharing
  name: Sharing beyond the generating consortium
  is_shared: true
  description: >-
    The project's overarching goal is "to develop a publicly available, AI-ready
    critical care dataset". Access is already extended outside the consortium: the
    AIM-AHEAD Bridge2AI for Clinical Care Training Program "expands access to
    Bridge2AI CHoRUS data", and the holdout test set is to be "accessible for model
    external validation". All access is controlled.

license_and_use_terms:
  id: d4d:chorus_license_and_use_terms
  name: Access terms and licensing
  license_terms:
  - >-
    "All participants must sign a licensing agreement included in the registration
    form before gaining access to the dataset." The terms of that agreement are not
    reproduced in the current source bundle.
  - >-
    Access requires registration: "Participants will fill out a registration form with
    name, email, and institution", after which "Once access is granted and compute is
    provisioned, an email will be sent".
  - >-
    "In order to gain access to the dataset, you will need to have a '.edu' email
    address." The source adds that this "requirement is not a barrier to acceptance
    into the program. Program administrators will assist with this access if needed."
  - >-
    Every listed data modality is designated Controlled for access control.
  - >-
    Software in the chorus-ai GitHub organization is separately licensed: "This project
    is licensed under the MIT License." Individual repositories list MIT (chorus_waveform,
    chorus-extract-upload, UF-Geocoding) and Apache-2.0 (Chorus_SOP). No license
    identifier is given for the dataset itself in the current source bundle.
  contact_person: Ciera McCrary, MGH, Program Manager
  description: >-
    The registration, licensing-agreement, and .edu-email conditions are stated in the
    context of the AIM-AHEAD Bridge2AI for Clinical Care Training Program. No fee is
    mentioned in the current source bundle.

regulatory_restrictions:
  id: d4d:chorus_regulatory_restrictions
  name: Access control and regulatory posture
  regulatory_restrictions:
  - >-
    All CHoRUS data modalities - demographics, medication administration, procedures,
    nursing flowsheets, diagnoses, clinical notes, imaging, waveform telemetry, and
    waveform EEG - are designated Controlled for access control.
  - >-
    The project will "establish a legal framework for collecting data at scale" and
    analyses the "existing legal and regulatory landscape".
  - >-
    The CHoRUS project website, as captured, carries the notice "This repoitory is
    under review for potential modification in compliance with Administration
    directives" (spelling as published).
  confidentiality_level: restricted
  description: >-
    The current source bundle does not state a HIPAA compliance determination, export
    control status, or governance committee contact for the dataset.

maintainers:
- id: d4d:chorus_maintainer_consortium
  name: CHoRUS Consortium, Massachusetts General Hospital
  role: academic_institution
  maintainer_details:
  - >-
    The CHoRUS project is led from Massachusetts General Hospital, the awardee
    organization for NIH project 1OT2OD032701-01.
  - >-
    Program contact: "Ciera McCrary, MGH, Program Manager, cmccrary@mgh.havard.edu"
    (address transcribed exactly as published on the project website, including the
    apparent misspelling of the domain).
  - >-
    Data access requests: "Request access: dbold@emory.edu or
    jared.houghtaling@tuftsmedicine.org".
  - "Website: www.bridge2ai.org/chorus"
- id: d4d:chorus_maintainer_github_org
  name: CHoRUS for Equitable AI GitHub organization (chorus-ai)
  role: academic_institution
  maintainer_details:
  - >-
    The chorus-ai GitHub organization hosts 28 repositories, 3 projects, and
    discussions, and lists its location as the United States of America and its
    website as https://chorus4ai.org/ (as captured 2025-11-14, with 37 followers).
  - >-
    The organization houses software and tooling, validated semantic mappings,
    standard operating protocols, and project management overviews.
  - >-
    "You can check the versions, maintainers, and other metadata about CHoRUS packages
    using our package status page." A web guide for contributors and users of the
    CHoRUS software packages compiles documentation in the chorus-developer repository.
  - >-
    Task tracking aggregates issues across repositories into a central project, with
    assigned users, anticipated delivery dates, and dependencies; per-repository
    projects are being phased out and migrated into that central space.

updates:
  id: d4d:chorus_update_plan
  name: Ongoing data growth and status tracking
  update_details:
  - >-
    The dataset is growing toward an anticipated final dataset of 100,000 patient
    admissions across 9 data modalities from 14 data contributing hospitals; the
    current released dataset stands at 50,000 admissions.
  - >-
    Modality coverage is still expanding: imaging de-identification was in process for
    a larger cohort and EEG extraction was in process as of September 2025, and
    published metadata is listed as Planned for clinical notes, waveform telemetry, and
    waveform EEG.
  - >-
    Data contributing sites "provide regular status updates with regard to their
    progress in creating and curating a CHoRUS-specific clinical data extract",
    tracked in the Standards Project or the Data Acquisition Project.
  - >-
    The NIH award period runs to 2026-11-30.
  description: >-
    The current source bundle does not state an update frequency, a versioning scheme,
    or how updates are communicated to dataset consumers.

extension_mechanism:
  id: d4d:chorus_extension_mechanism
  name: Contribution and extension routes
  contribution_url: https://github.com/chorus-ai
  extension_details:
  - >-
    "We have established a chorus-mapping repository with documentation and pooled
    tabular mappings along with an associated clinical validation SOP for contributing
    to mapping efforts."
  - >-
    Issues in creating or submitting a data extract are raised in context-specific
    discussion locations: Standards Discussions and Data Acquisition Discussions.
  - >-
    "We have created a web guide for both contributors and users of the CHoRUS software
    packages that compiles documentation in the chorus-developer repository."
  - >-
    Community users are invited to browse the listed resources and the public-facing
    webpage; people interested in downstream analytics on the mapped and assembled
    dataset are invited to make contact.
  description: >-
    Contributions to mappings are validated through the associated clinical validation
    SOP; SOP documents themselves "have undergone an internal validation and review
    process within the Chorus_SOP repository".

external_resources:
- id: d4d:chorus_external_standards_and_tooling
  name: External standards, platforms, and tooling relied upon
  external_resources:
  - >-
    OHDSI/OMOP Common Data Model, used to standardize demographics, medication
    administration, procedures, nursing flowsheets, and diagnoses.
  - OHNLP toolkit and its open source schema, used for clinical note tokenization.
  - DICOM, used for imaging.
  - WFDB, with a published metadata schema described as "PhysioNet schema extended".
  - EDF+ and Persyst open source schemas, used for EEG waveforms.
  - >-
    Microsoft Azure, on which dockerized CHoRUS container applications are deployed to
    support CHoRUS services.
  - >-
    DeGauss, invoked by the UF-Geocoding repository to geocode OMOP Location entities.
  - >-
    The chorus-ai GitHub organization (https://github.com/chorus-ai), which hosts
    CHoRUS software, mappings, SOPs, and project management resources.
  - The CHoRUS project website, https://chorus4ai.org/.
  restrictions:
