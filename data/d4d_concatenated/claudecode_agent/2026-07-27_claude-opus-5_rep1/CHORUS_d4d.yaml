id: d4d:CHORUS
name: CHoRUS for Equitable AI Dataset
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
description: >-
  A multi-center, multimodal, high-resolution critical care dataset generated by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for
  Equitable AI data generation project, one of four data generation projects in the
  NIH Common Fund Bridge2AI program. CHoRUS assembles retrospectively collected
  clinical data from intensive care admissions across 14 data-contributing hospitals
  within a collaboration spanning 20 academic centers, and standardizes it to the
  OMOP Common Data Model together with modality-specific standards for clinical
  notes, imaging, and physiologic waveforms. All data types are held under
  controlled access. The project website reports a current released dataset of
  50,000 patient admissions from ICU, PICU, and NICU, comprising 1.6 billion rows of
  EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data,
  against an anticipated final dataset of 100,000 patient admissions spanning 9 data
  modalities from 14 data contributing hospitals. The stated overarching goal is a
  publicly available, AI-ready critical care dataset supporting characterization of
  acute and critical care illness, prediction of complications, and measurement of
  treatment response, while ensuring the methods promote privacy, accountability,
  and clinical benefit. The project will additionally provision a holdout test set
  accessible for external model validation.
page: https://chorus4ai.org/
publisher: https://chorus4ai.org/
status: >-
  Ongoing data generation project. A current released dataset is available under
  controlled access and is smaller than the anticipated final dataset; imaging
  de-identification and EEG extraction were reported as still in process as of the
  September 2025 Cohort 2 informational webinar. The project website carries the
  notice "This repoitory is under review for potential modification in compliance
  with Administration directives" (spelling as published).
conforms_to: >-
  OMOP Common Data Model (OHDSI/OMOP CDM) for demographics, medication
  administration, procedures, nursing flowsheets, and diagnoses; OHNLP schema for
  extracted and tokenized clinical notes; DICOM for imaging; WFDB for waveform
  telemetry; EDF+ and Persyst for waveform EEG.
