addressing_gaps:
- id: d4d:chorus_gap_ai_infrastructure_critical_care
  name: Lack of infrastructure for AI/ML in critical care
  response: >-
    "There is an urgent need for infrastructure to support artificial intelligence
    and machine learning (AI/ML) in critical care. Developing high-resolution
    multi-center data sets is a critical first step towards actionable and
    trustworthy AI."
- id: d4d:chorus_gap_multicenter_acquisition_challenges
  name: Multi-center acquisition, standardization, and governance challenges
  response: >-
    The project addresses "multiple challenges relevant for acquiring an AI-ready
    data set from more than 100,000 critically ill patients" through three pillars:
    "1) Data (Standards, Tool Development and Optimization, and Data Acquistion) 2)
    Ethics (Ethical and Trustworthy AI) and 3) People (Team Science and Skill and
    Workforce Development)."
  description: >-
    Transcribed from the NIH RePORTER abstract, including its "Acquistion" spelling.
- id: d4d:chorus_gap_harmonized_multimodal_standards
  name: Absence of unified standards across multimodal clinical data
  response: >-
    "Unified standards will harmonize multi-modal EHR, waveform, imaging, and text
    data." The project develops capabilities across a multi-center network "to
    acquire, standardize, tokenize, store, visualize, and label data such as
    structured electronic health record data, tokenized unstructured electronic
    health record data, telemetry and EEG waveforms, imaging, and social determinants
    of health."
- id: d4d:chorus_gap_ai_workforce
  name: Insufficient AI literacy and workforce in clinical care
  response: >-
    The project will "cultivate expertise in the lay and scientific community to
    improve AI literacy nd utilization through multimodal educational approaches" and
    develop "the skills and workforce for a next generation of diverse academic and
    community AI scientists."
  description: >-
    Transcribed from the NIH RePORTER abstract, including its "literacy nd"
    typographical artifact.

