- Workforce Development
- social health determinants
- repository
- data acquisition
- treatment response
- trustworthiness

purposes:
- id: d4d:chorus_purpose_ai_ready_critical_care_data
  name: Generate an AI-ready critical care dataset
  response: >-
    "As part of the NIH Common Fund's Bridge2AI program, the CPatient-Focused
    Collaborative Hospital Repository Uniting Standards (CHoRUS) for Clinical Care
    AI data generation project will meet the need of generating data for ML/AI
    applications aimed at characterizing acute and critical care illness, predicting
    complications, and measuring treatment response among patients with acute or
    critical illness." The project's overarching goal is to develop a publicly
    available, AI-ready critical care dataset, while ensuring the methods promote
    privacy, accountability, and clinical benefit, and while promoting a new
    generation of AI clinicians and scientists.
  description: >-
    Primary motivation stated in the NIH RePORTER abstract for project
    1OT2OD032701-01. The project name is transcribed from the source, which contains
    the typographical artifact "CPatient-Focused".
- id: d4d:chorus_purpose_diverse_ethically_sourced_dataset
  name: Build the most diverse, high-resolution, ethically sourced AI-ready dataset
  response: >-
    "The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving
    recovery from acute illness."
  description: >-
    Stated goal from the CHoRUS GitHub organization overview (captured 2025-11-14).
- id: d4d:chorus_purpose_external_validation_holdout
  name: Provision a holdout test set for external model validation
  response: >-
    "The dataset will also provision a holdout test set, accessible for model
    external validation to aid marketplace adoption of AI-developed models for
    implementation in acute and critical care."
- id: d4d:chorus_purpose_ethical_best_practices
  name: Create ethically sourced datasets and best practices for AI in health
  response: >-
    "The CHoRUS project is one data generation project of four in the National
    Institute of Health (NIH) funded Bridge2AI consortium. The goal is to work with
    projects to create ethically sourced datasets and tools around Artificial
    Intelligence and to create best practices for AI in health."

