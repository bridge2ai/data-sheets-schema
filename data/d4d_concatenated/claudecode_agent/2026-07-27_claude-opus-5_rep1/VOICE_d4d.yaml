errata:
  - id: d4d:VOICE_errata
    name: Errata and changelog
    description: Healthsheet answer on errata together with the observed release corrections.
    erratum_details:
      - >-
        The healthsheet states that there is no erratum and that a changelog for each
        dataset version is published online with the dataset metadata.
      - >-
        Corrections recorded in the release notes include v2.0.1, which corrected the
        authorship list, and v3.1.0, which fixed broken parquet files from the previous
        release and updated validated diagnosis information with back-filled information.
      - >-
        v2.0 reprocessed spectrograms to fix minor issues identified in the previous
        release.

updates:
  id: d4d:VOICE_updates
  name: Update plan
  description: Healthsheet answer on dataset updates together with the observed cadence.
  frequency: Semi-annual (twice a year), per the dataset healthsheet.
  update_details:
    - >-
      Further versions of the dataset will be released on a semi-annual basis. These updates
      will be distributed as new versions of the dataset, and users will be notified through
      news items on the platform as well as through standard communication channels.
    - >-
      Updates correct labeling errors, add new instances, and reorganize files; observed
      updates have added participants (v2.0 and v3.0.0 of the adult line), added or
      reprocessed features, and added metadata files.
    - >-
      The dataset is released as static versions rather than being dynamically updated.
    - >-
      Further releases will contain additional data, including data addressing the currently
      unequal distribution of the five disease categories.

retention_limit:
  id: d4d:VOICE_retention_limit
  name: Retention limits
  description: Retention terms for released data, identifiable data, and study records.
  retention_period: >-
    Released data: retained as long as it is useful for research purposes, possibly
    indefinitely. Identifiable data: a maximum of 10 years after study completion. Consent
    documentation: a minimum of 5 years after study completion.
  retention_details:
    - >-
      Once data is contributed, the data will be retained as long as it is useful for
      research purposes, possibly indefinitely.
    - >-
      Identifiable data and datasheets linking participant numbers to participant
      information will be kept in each institution on local cloud storage for a maximum of
      10 years after study completion and will then be destroyed, under the responsibility
      of each local principal investigator.
    - >-
      The USF IRB requires de-identified study data and original consent forms to be stored
      for a minimum of five years after study completion; original paper consent documents
      cannot be destroyed until five years after study completion even if uploaded into the
      Florence platform.
    - >-
      Entries in the REDCap recruitment screening system are deleted once patients are
      enrolled, or within 90 days of submission, whichever comes first.
    - >-
      Under the data transfer and use agreement, recipients must dispose of the data two
      years after the start date, upon completion of the project, upon termination, or upon
      expiration of the applicable ethics approval, whichever occurs first, and must submit
      written certification of destruction within 30 days.

version_access:
  id: d4d:VOICE_version_access
  name: Version access across both release lines
  description: >-
    Program-level view of versioning. The adult and pediatric release lines are versioned
    independently and each has its own version-independent latest-version DOI, so no single
    latest-version DOI is asserted at this level; see the version_access of each resource.
  versions_available:
    - >-
      Adult line (PhysioNet project b2ai-voice): v1.1 (2025-01-17), v2.0.0 (2025-04-16),
      v2.0.1 (2025-08-18), v3.0.0 (2025-12-16), v3.1.0 (2026-05-01, current). v1.0 was
      published earlier on Health Data Nexus.
    - >-
      Pediatric line (PhysioNet project b2ai-voice-pediatric): v1.0.0 (2025-12-17), v1.1.0
      (2026-05-01, current).
  version_details:
    - >-
      Each version of the dataset has a unique DOI. By default, older versions of the
      dataset will continue to be supported, hosted, and made available to researchers, and
      the dataset publishers reserve the right to remove access to older versions.
    - >-
      The files for adult version 1.1 are no longer available from PhysioNet; the page
      directs users to the latest version.
    - >-
      The adult and pediatric version numbers refer to different datasets and different
      cohorts and must not be compared or merged; pediatric v1.1.0 is not an earlier version
      of adult v3.1.0.
    - >-
      A changelog for each dataset version is published online with the dataset metadata.

extension_mechanism:
  id: d4d:VOICE_extension_mechanism
  name: Extension and contribution mechanism
  description: Healthsheet answer on how others can extend or build on the dataset.
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
    - >-
      For dataset extensions and augmentations, it is possible for others to publish a
      derivative dataset on the Health Data Nexus which references the original source.
      These derivative datasets may be made available under the same conditions as the
      source data.
    - >-
      For augmentations to the code used to produce the data, the open-source repositories
      have discussion forums and issue pages which allow for public discussion of data
      preprocessing, and the repository has a pull request mechanism for contributing
      improvements to the data preprocessing code.
    - >-
      The data transfer and use agreement encourages recipients to make the results of their
      project publicly available in open-access journals or preprint servers where possible.

variables:
  - id: d4d:VOICE_variable_participant_id
    name: participant_id
    variable_name: participant_id
    description: >-
      Unique identifier for the participant, present in every Parquet feature record and
      used to join feature records to phenotype tables.
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    quality_notes:
      - >-
        Because participants may have repeated visits, there may be more than one row per
        participant in the phenotype data files.

  - id: d4d:VOICE_variable_session_id
    name: session_id
    variable_name: session_id
    description: >-
      Unique identifier for the recording session, present in every Parquet feature record.
      A subset of participants required multiple sessions to complete data collection, so
      there may be more than one session per participant.
    data_type: identifier
    is_identifier: false
    is_sensitive: false

  - id: d4d:VOICE_variable_task_name
    name: task_name
    variable_name: task_name
    description: >-
      The acoustic or speech task performed for the recording, present in every Parquet
      feature record and enumerated in the acoustic task protocol.
    data_type: categorical
    is_identifier: false

  - id: d4d:VOICE_variable_n_frames
    name: n_frames
    variable_name: n_frames
    description: >-
      The number of time frames associated with the feature for that recording, present in
      the v3.x adult and v1.x pediatric Parquet feature records.
    data_type: integer
    is_identifier: false

is_deidentified:
  id: d4d:VOICE_deidentification
  name: De-identification
  description: >-
    De-identification applied before release. The study metadata records the level of
    de-identification as: identifiable information under HIPAA and the Common Rule, as well
    as data considered sensitive, have been removed from this dataset.
  identifiable_elements_present: false
  method: >-
    Removal of HIPAA Safe Harbor direct identifiers, removal of indirect identifiers that
    created a significant re-identification risk, removal of highly sensitive non-identifying
    elements, removal of all raw audio, and removal of free-speech transcripts and of dense
    features derived from free speech.
  identifiers_removed:
    - Names
    - Civic addresses
    - Social security numbers
    - Geographic locators, including state and province (country of data collection retained)
    - Date information at a resolution finer than years; dates are rebased or replaced by integers
    - Phone and fax numbers
    - Email addresses
    - IP addresses
    - Medical record numbers
    - Health plan beneficiary numbers
    - Device identifiers
    - License numbers
    - Account numbers
    - Vehicle identifiers
    - Website URLs
    - Full face photos
    - Biometric identifiers and any other unique identifiers
    - Narrative text fields
    - All raw voice recordings
    - >-
      Select geographic or demographic identifiers and some information about household
      composition or cultural identity
    - >-
      Non-identifying elements revealing highly sensitive information, such as household
      income, mental health status, and traumatic life experiences
    - >-
      All fields encoded as sensitive in the "Identifier?" column of the REDCap data
      dictionary
  deidentification_details:
    - >-
      The dataset removes direct identifiers, applies the HIPAA de-identification rules,
      rebases or replaces dates by integers, removes or generalizes geographic information,
      and removes narrative text fields. It does not achieve k-anonymization with k greater
      than or equal to 2.
    - >-
      The data were extracted from the raw audio to limit re-identification, and only the
      extracted features are released with the dataset.
    - >-
      Raw audio transcripts were reviewed, and any audio recordings that contained
      potentially identifying information or external voices were removed from the release.
    - >-
      All spectrograms, MFCCs, Mel spectrograms, transcriptions, EMAs, and PPGs from
      open-response prompts are removed from the feature-only dataset; spectrograms and
      similar features were excluded if the audio contained free speech, while static and
      other features that do not encode the sensitive information were retained.
    - >-
      Sensitive fields were identified by a team of ethicists.
    - >-
      For the pediatric v1.1 release, audio features for all free-speech tasks were manually
      checked for the presence of unconsented speakers and personally identifiable
      information before being released.

