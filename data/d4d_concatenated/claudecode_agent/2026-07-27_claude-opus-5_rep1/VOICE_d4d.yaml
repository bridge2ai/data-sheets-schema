file_collections:
  - id: d4d:VOICE_files_adult_features
    name: Adult derived audio features
    title: Adult dataset features subfolder (v3.1.0)
    description: >-
      Derived audio features for the adult cohort, distributed as Parquet binary files
      plus plain-text tables. Each Parquet element carries a participant identifier
      (participant_id), a session identifier (session_id), the task performed
      (task_name), the number of time frames (n_frames), and the tensor data for the
      feature. In v3.1.0 the per-feature record counts are: torchaudio_spectrogram
      n=29278 (201xT, 25 ms window, 10 ms hop, 400-point FFT); torchaudio_mel_spectrogram
      n=29278 (60xT, 60 Mel bins); torchaudio_mfcc n=29278 (60xT); torchaudio_pitch
      n=32522 (min/max pitch 80 and 500); sparc_ema n=28640 (Tx12, X/Y positions of six
      articulators); sparc_loudness n=31855 (20 ms windows); sparc_periodicity n=31872
      (20 ms windows); sparc_pitch n=31872 (50-550 Hz); ppgs n=29289 (40 phoneme
      categories at 100 Hz). The folder also contains audio_quality_metrics.tsv (one
      quality-control feature set per audio recording) and static_features.tsv (one
      feature row per audio recording, derived with openSMILE, Praat, parselmouth, and
      torchaudio). Every file has a matching JSON data dictionary with the same file
      stem. Spectrograms, Mel spectrograms, MFC coefficients, PPGs, and EMAs for
      sensitive records and audio checks have been removed from v3.1; some files could
      not generate certain features and are therefore not included.
    path: features/
    collection_type:
      - processed_data
    version: 3.1.0
    download_url: https://physionet.org/content/b2ai-voice/3.1.0/

  - id: d4d:VOICE_files_adult_phenotype
    name: Adult phenotype tables
    title: Adult dataset phenotype subfolder (v3.1.0)
    description: >-
      Organized information collected from the participant or another individual during
      the encounter, distributed as tab-separated tables with matching JSON data
      dictionaries. Subfolders are confounders, demographics, diagnosis, enrollment,
      questionnaire, and task. The diagnosis subfolder holds per-condition tables
      including airway_stenosis, amyotrophic_lateral_sclerosis, anxiety, benign_lesions,
      bipolar_disorder, cognitive_impairment, control, copd_and_asthma, depression,
      glottic_insufficiency, laryngeal_cancer, laryngeal_dystonia, laryngitis,
      muscle_tension_dysphonia, parkinsons_disease, precancerous_lesions,
      unexplained_chronic_cough, and unilateral_vocal_fold_paralysis. The questionnaire
      subfolder holds adhd_adult, custom_affect_scale, dsm5_adult, dyspnea_index,
      gad7_anxiety, leicester_cough_questionnaire, panas, phq9, productive_vocabulary,
      psychiatric_history, ptsd_adult, vhi10, and voice_perception. The enrollment
      subfolder holds eligibility, enrollment_form, and participant. The task subfolder
      holds acoustic_task, harvard_sentences, random_item_generation, recording, session,
      stroop, and winograd. Phenotype data files only contain rows for a participant if
      at least one column is not missing, and a participant with repeated visits may have
      more than one row.
    path: phenotype/
    collection_type:
      - processed_data
      - metadata
    version: 3.1.0
    download_url: https://physionet.org/content/b2ai-voice/3.1.0/

