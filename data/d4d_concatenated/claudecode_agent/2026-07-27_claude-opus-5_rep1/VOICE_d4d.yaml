      America. Participants were selected based on known conditions which manifest within
      the voice waveform, including voice disorders, neurological disorders, mood
      disorders, and respiratory disorders. The release contains data considered low
      risk, including derivations such as spectrograms but not the original voice
      recordings; detailed demographic, clinical, and validated questionnaire data are
