  - id: d4d:VOICE_pediatric
    name: b2ai-voice-pediatric
    title: Bridge2AI-Voice Pediatric Dataset
    description: >-
      The Bridge2AI-Voice pediatric dataset, published as PhysioNet project
      b2ai-voice-pediatric. This is a separate PhysioNet project from the adult
      b2ai-voice dataset and a distinct participant cohort, not a version of the adult
      dataset. Release v1.1.0 contains derived audio features for 23,533 recordings
      collected from 300 participants aged 2 to 18. Patients and healthy volunteers at
      the Hospital for Sick Children were considered for enrollment; eligibility required
      an age of 2 to 18 years and English proficiency, and excluded participants over 18
      years of age and individuals who were non-verbal. Non-patients were recruited
      through research postings. All data was collected through customized software,
      reproschema-ui, on tablets, using a headset for most participants and the built-in
      tablet microphone for the remainder. All participants completed the recording and
      demographic data collection in one session; for participants without adequate
      comprehension or familiarity with their own medical history, parents or
      decision-makers completed the survey on a separate tablet during the recording.
      v1.1.0 is a minor update over v1.0.0 that released no new participants but added
      audio features for all free-speech tasks that were manually checked for the
      presence of unconsented speakers and personally identifiable information, plus new
      audio-quality metrics and per-recording metadata. Access requires being a
      credentialed PhysioNet user and signing the data use agreement. Raw pediatric audio
      is not on PhysioNet and is made available separately via Synapse (syn73617068)
      under controlled access.
