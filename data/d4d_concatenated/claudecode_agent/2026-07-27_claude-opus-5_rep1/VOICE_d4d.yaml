id: d4d:VOICE
name: bridge2ai_voice
title: 'Bridge2AI-Voice: Voice as a Biomarker of Health'
description: >-
  Bridge2AI-Voice is a Precision Public Health grand challenge data generation project
  funded by the NIH Common Fund Bridge2AI Program. It produces a large, ethically
  sourced, demographically diverse collection of voice, speech, and respiratory-sound
  recordings linked to multimodal health information, in order to fuel voice AI research
  and to support the development, benchmarking, and validation of clinically applicable
  machine-learning models. Data acquisition is organized around five disease cohort
  categories for which voice changes have documented associations and well-recognized
  unmet clinical needs: voice disorders, neurological and neurodegenerative disorders,
  mood and psychiatric disorders, respiratory disorders, and pediatric voice and speech
  disorders.

  The project has published TWO DISTINCT DATASETS on PhysioNet, which are separate
  PhysioNet projects and separate participant cohorts rather than versions of one
  another. (1) The adult dataset, "Bridge2AI-Voice: An ethically-sourced, diverse voice
  dataset linked to health information" (PhysioNet project b2ai-voice), whose current
  release is v3.1.0, published 2026-05-01, containing data for 833 adult participants
  collected across five sites in North America under the Bridge2AI-Voice adult protocol
  using the Bridge2AI-Voice smartphone/tablet application. (2) The pediatric dataset,
  "Bridge2AI-Voice Pediatric Dataset" (PhysioNet project b2ai-voice-pediatric), whose
  current release is v1.1.0, published 2026-05-01, containing 23,533 derived recordings
  from 300 participants aged 2 to 18, recruited at the Hospital for Sick Children
  (SickKids) in Toronto under a separate pediatric protocol and collected with
  reproschema-ui. The two cohorts have distinct participant counts, distinct recruitment
  sites and protocols, distinct ethics approvals, and distinct DOIs and access routes.

  Both PhysioNet releases distribute derived audio features (spectrograms, Mel
  spectrograms, MFCCs, pitch, articulatory and phonetic-posteriorgram features, and
  static acoustic features) together with phenotypic tables (demographics, confounders,
  validated questionnaires, clinical diagnosis, enrollment, and task/session metadata).
  Neither PhysioNet release contains the original raw audio waveforms. Raw audio is
  disseminated only through a controlled-access mechanism, via Synapse, after review by
  the Bridge2AI-Voice Data Access Compliance Office.
license: Bridge2AI Voice Registered Access License
language: en
page: https://docs.b2ai-voice.org/
publisher: https://physionet.org/
status: >-
  Static versioned releases with ongoing data collection under NIH award OT2OD032720
  (project period 2022-09-01 to 2026-11-30). The adult release line is at v3.1.0 and the
  pediatric release line is at v1.1.0, both published 2026-05-01.
conforms_to: >-
  Brain Imaging Data Structure (BIDS) v1.9.0. Raw audio files and questionnaire data
  retrieved from ReproSchema-UI or exported from REDCap were converted to be compliant
  with BIDS v1.9.0; pediatric data collected through ReproSchema-UI is extracted,
  transformed into REDCap format, and subsequently converted to BIDS.
