      - https://physionet.org/content/b2ai-voice/

  - id: d4d:VOICE_distribution_pediatric_physionet
    name: Pediatric dataset on PhysioNet
    description: >-
      Credentialed access distribution of the pediatric feature-only dataset, current
      release v1.1.0, published as a separate PhysioNet project from the adult dataset.
      Files are Parquet binaries, tab-separated tables including static features and audio
      quality metrics, per-recording metadata, and JSON data dictionaries. Only credentialed
