purposes:
  - id: d4d:VOICE_purpose_gap
    name: Address the shortage of large, diverse, well-documented clinical voice data
    description: Primary motivation stated in the dataset healthsheet.
    response: >-
      The Bridge2AI Voice dataset was created to address a gap in the availability of
      large-scale, diverse, and well-documented voice data for use in clinical
      machine-learning applications. Previous studies on machine-learning-based voice
      diagnosis produced promising results, but their sample sizes were too small, or
      they lacked the key metadata needed for training robust, clinically useful models.
      The dataset aims to bridge this gap by providing an ethically sourced, large, and
      diverse dataset to develop, benchmark, or validate clinically applicable AI/ML
      models. The goal is to facilitate the use of voice as a non-invasive,
      cost-effective biomarker for the screening, diagnosis, and monitoring of a wide
      range of health conditions.

  - id: d4d:VOICE_purpose_program_aims
    name: Integrate voice as a biomarker of health into clinical care
    description: Program-level objective stated in the NIH project record and the project documentation.
    response: >-
      The group aims to integrate the use of voice as a biomarker of health in clinical
      care by generating a substantial multi-institutional, ethically sourced, and
      diverse voice database linked to multimodal health biomarkers to fuel voice AI
      research and build predictive models to assist in screening, diagnosis, and
      treatment of a broad range of diseases. Data collection is made possible by
      software through a smartphone application linked to electronic health records and
      other health biomarkers such as radiomics and genomics, and supported by federated
      learning technology to protect data privacy. The award defines six specific aims: a
      Data Acquisition Module, a Standards Module introducing new standards of acoustic
      and voice data collection and analysis, a Tool Development and Optimization aim
      covering software, cloud infrastructure and federated learning, an Ethics Module, a
      Teaming Module, and a Skills and Workforce Development Module.

  - id: d4d:VOICE_purpose_scale_target
    name: Target scale of the voice database
    description: >-
      Stated targets differ across sources in the corpus and are reported here with their
      attributions rather than reconciled.
    response: >-
      The project documentation states that Bridge2AI-Voice seeks to create a flagship,
      standardized, and ethically sourced dataset of 10,000 voices linked to health
      information, and the study metadata gives an anticipated enrollment count of 10,000
      by 2027. The JAMA Otolaryngology viewpoint introducing audiomics describes the
      team's primary deliverable as building a publicly available database of 30,000
      human voices, and the IRB protocol states a sample size of 30,000 participants, of
      which up to 5,000 are to be enrolled through USF high-volume expert clinics and
      community outreach clinics with the remainder reached through collaboration with
      other participating institutions and existing cohorts.

  - id: d4d:VOICE_purpose_pediatric
    name: Enable study of pediatric voice and speech development
    description: Motivation specific to the pediatric dataset.
    response: >-
      Understanding voice and speech development in children is essential for identifying
      communication or speech disorders early in life and for supporting timely
      intervention. Pediatric and adult voice and speech production are fundamentally
      different because the respiratory system and larynx undergo rapid functional
      maturation throughout childhood, and these developmental changes influence acoustic
      features such as fundamental frequency, so normative evidence from adults cannot be
      generalized to pediatric populations. Despite the clinical importance of detecting
      pediatric communication disorders such as autism spectrum disorder and speech
      delays, the availability of large-scale pediatric datasets remains limited. The
      pediatric resource is intended to enable study of developmental norms, to support
      creation of AI-driven tools for early screening, and to support clinical insight.

  - id: d4d:VOICE_purpose_applications
    name: Intended application domain
    description: Healthsheet answer on the applications the dataset is meant to address.
    response: >-
      The Bridge2AI Voice dataset is primarily intended for research applications,
      specifically the development of AI and machine-learning models for healthcare. It
      aims to support clinical research in disease screening, diagnosis, and monitoring
      through voice biomarkers. The dataset can be used for AI model pretraining,
      fine-tuning, benchmarking, or validation.

tasks:
  - id: d4d:VOICE_task_disease_classification
    name: Disease detection and classification from voice
    description: Predefined tasks and labels shipped with the release.
    response: >-
      The current version of the dataset comes with predefined tasks and labeling. The
      tasks are primarily designed for training machine-learning models for disease
      detection and classification using voice data. Labels include diagnostic categories
      such as vocal pathologies, neurological disorders, psychiatric conditions, and
      respiratory disorders. There are no predefined recommended data splits for
      training, validation, or testing; researchers are encouraged to create their own
      data splits based on their specific requirements.

  - id: d4d:VOICE_task_disease_cohorts
    name: Five disease cohort categories
    description: The disease categories around which data acquisition is centered.
    response: >-
      Data acquisition is centered on five disease cohort categories for which voice
      changes have been associated with specific diseases and which have well-recognized
      unmet needs: voice disorders (including laryngeal cancer, laryngitis, precancerous
      lesions, benign lesions of the vocal cord, muscle tension dysphonia, spasmodic
      dysphonia and laryngeal tremor, unilateral vocal fold paralysis, and glottic
      insufficiency or presbyphonia); neurological and neurodegenerative disorders
      (including mild cognitive impairment, Alzheimer's disease, other dementias,
      amyotrophic lateral sclerosis, and Parkinson's disease); mood and psychiatric
      disorders (including alcohol or substance use disorder, anxiety disorder, ADHD,
      autism spectrum disorder, bipolar disorder, borderline personality disorder,
      depression or major depressive disorder, eating disorder, insomnia or sleep
      disorder, obsessive-compulsive disorder, panic disorder, PTSD, schizophrenia, and
      social anxiety disorder); respiratory disorders (including airway stenosis and
      chronic cough); and pediatric voice and speech disorders. Participants without the
      conditions of interest are also enrolled to serve as controls.

  - id: d4d:VOICE_task_acoustic_protocol
    name: Acoustic task protocol
    description: The recorded acoustic tasks that make up the protocol.
    response: >-
      Voice, breathing, cough, and speech data are recorded with the Bridge2AI-Voice app
      for adults and with reproschema-ui for pediatrics; the project documentation states
      that a total of 22 acoustic tasks are recorded through the app. Adult tasks span
      non-voice and non-speech tasks (respiration, voluntary cough, breath sounds),
      voice/non-speech tasks (prolonged vowel, maximum phonation time, glides, loudness,
      diadochokinesis), and speech tasks (Rainbow Passage, Caterpillar Passage, CAPE-V
      sentences, free speech, picture description, story recall, animal fluency, open
      response questions, word-color Stroop, productive vocabulary, random item
      generation, and the Cinderella story). Pediatric tasks include the ABCs, Ready For
      School, Favorite Show, Favorite Food, Outside of School, Months, Counting, Naming
      Animals, Naming Food, Identifying Pictures, Picture Description (Pediatrics), Long
      Sounds, Noisy Sounds, Caterpillar Passage (Pediatrics), Repeat Words, Role Naming,
      Repeat Sentences, and Silly Sounds.

addressing_gaps:
  - id: d4d:VOICE_gap_small_datasets
    name: Small, non-standardized, and private prior datasets
    description: Gaps identified across the project publications and documentation.
    response: >-
      Current literature on voice as a biomarker has been studied only on small- to
      medium-sized datasets with limited data outside acoustic measures and without
      linkage to multimodal health data. Comparing studies and pooling data is
      challenging because standards for how voice and other acoustics are measured and
      collected are lacking. Within industry, datasets are often private, limiting the
      ability to audit machine-learning models and the accuracy of training data labels;
      industry has access to vast amounts of voice data but lacks accurate clinical or
      demographic information, which prevents annotation for AI training, comparison with
      criterion-standard medical assessment, and external auditing for fair
      representation of diverse populations. When machine-learning applications for
      screening and diagnosis of laryngeal cancer were reviewed, most studies reported
      training datasets of fewer than 300 patients and only two studies used more than one
      data modality.

  - id: d4d:VOICE_gap_audiomics_agenda
    name: Tripartite agenda for audiomics
    description: The gaps the consortium set out to close in the field of audiomics.
    response: >-
      For audiomics to reach its full public health potential, three conditions must be
      met: standards for audiomics data acquisition, interoperability, and AI readiness
      must be defined; diverse teams including clinicians, engineers, bioethicists, and
      social scientists must collaborate; and the ethical and legal challenges linked to
      HIPAA, potential re-identification of patients by their voice, voice hacking, and
      data ownership require a new governance framework for diversity, data handling, and
      privacy safeguards. The consortium states six corresponding aims: ensuring quality
      and accuracy of acoustic and associated clinical data through clinical validation
      and evidence-based recording protocols; achieving interoperability by creating new
      bioinformatics standards for voice data; creating benchmarks of diversity metrics
      and minimizing risk of algorithmic bias; defining ethical and legal norms
      safeguarding patients' data while supporting data-sharing efforts; developing
      infrastructure for audiomics data storage and sharing within and across research
      institutions; and formulating training pathways for scientists, engineers,
      bioethicists, and clinicians.

  - id: d4d:VOICE_gap_pediatric_data
    name: Scarcity of pediatric voice and speech datasets
    description: Gap addressed specifically by the pediatric dataset.
    response: >-
      The literature on pediatric voice and speech analysis is sparser than the adult
      literature, partly because of ethical concerns and challenges in data acquisition
      for this cohort. Data collection in pediatric populations poses unique challenges
      including privacy issues, consent processes, and the need for developmentally
      appropriate tasks, and these factors have contributed to a lack of publicly
      accessible pediatric datasets that enable machine learning for pediatric voice
      analysis.

