third_party_sharing:
  - id: d4d:VOICE_third_party_sharing
    name: Distribution to third parties
    description: Healthsheet answer on third-party distribution.
    is_shared: true

license_and_use_terms:
  id: d4d:VOICE_license_and_use_terms
  name: License and terms of use
  description: >-
    Licensing and access terms for the feature-only releases and for the controlled-access
    raw audio.
  contact_person: Bridge2AI-Voice Data Access Compliance Office (DACO), DACO@b2ai-voice.org
  data_use_permission:
    - general_research_use
    - user_specific
  license_terms:
    - >-
      The license for the files of both PhysioNet projects is the Bridge2AI Voice Registered
      Access License, and the data use agreement is the Bridge2AI Voice Registered Access
      Agreement.
    - >-
      Registered access to the feature-only data requires registering on PhysioNet and
      confirming identity under the Registered Access License, and signing the
      Bridge2AI-Voice Registered Access Agreement, which outlines the terms and conditions
      for data use. The PhysioNet v3.x adult and v1.x pediatric access policies state that
      only credentialed users who sign the data use agreement can access the files; no
      training is required.
    - >-
      Controlled access to raw audio requires completing the Data Access Request Form,
      completing the Data Use Agreement, submitting the application to the Data Access
      Compliance Office for review, and, upon approval, ensuring a Data Use and Transfer
      Agreement is signed by an authorized official at the recipient institution.
    - >-
      The dataset is intended solely for commercial and non-commercial research purposes by
      Authorized Researchers. There are no fees associated with these restrictions.
    - >-
      Intellectual property terms of the registered access agreement: the data may be
      protected by copyright and other rights; duplication as reasonably required to carry
      out the research project is permitted; sale of all or part of the data on any media is
      not permitted; nothing in the agreement transfers intellectual property rights in or
      relating to the data; users agree not to make intellectual property claims on the
      data, not to use intellectual property protection in ways that would prevent or block
      access to or use of any element of the data or conclusions drawn directly from it, to
      implement licensing policies that will not obstruct further research, and to respect
      the Fort Lauderdale Agreement.
    - >-
      The data transfer and use agreement for raw data has a term ending two years after the
      start date, upon completion of the project, upon expiration of the applicable ethics
      approval, or upon termination by the provider institution, whichever occurs first. It
      restricts use to the named project and Authorized Persons, requires appropriate
      administrative, technical, and physical safeguards, requires attribution of the
      provider as the source of the data, encourages open-access publication of results,
      provides the data "AS IS" without warranties, assigns liability for use to the
      recipient, and requires written certification of data destruction within thirty days
      of termination or expiration, subject to retention of one archival copy where required
      by law or for research integrity and verification.
    - >-
      A memorandum on the ethical justification for controlled access to raw voice data
      samples is published with the documentation.
    - >-
      Supporting code and metadata carry their own licenses: the REDCap data dictionary and
      metadata repository is MIT licensed, the b2aiprep preprocessing library is Apache-2.0
      licensed, and the documentation and dashboard source is MIT licensed.

ip_restrictions:
  id: d4d:VOICE_ip_restrictions
  name: Intellectual property restrictions
  description: Healthsheet answers on IP-based restrictions.
  restrictions:
    - >-
      No IP-based restrictions have been imposed by third parties on the data associated
      with the instances.
    - >-
      Users must agree to the intellectual property terms of the registered access
      agreement, which permit duplication as reasonably required to carry out the research
      project, prohibit sale of the data, transfer no intellectual property rights, and
      require that any downstream intellectual property obtained on further research not
      obstruct access to the data or to conclusions drawn from it.
    - >-
      The data provider gives no guarantees that the data is free of third-party
      intellectual property rights, database rights, or other related rights.

regulatory_restrictions:
  id: d4d:VOICE_regulatory_restrictions
  name: Regulatory restrictions and compliance
  description: Export control, HIPAA, and confidentiality posture.
  governance_committee_contact: Bridge2AI-Voice Data Access Compliance Office (DACO), DACO@b2ai-voice.org
  hipaa_compliant: compliant
  confidentiality_level: restricted
  regulatory_restrictions:
    - No export controls apply to the dataset.
    - >-
      Access to the feature-only releases is restricted to credentialed users who sign the
      data use agreement; access to raw audio additionally requires institutional sign-off
      and review by the Data Access Compliance Office.
  other_compliance:
    - >-
      Identifiable information under HIPAA and the Common Rule, as well as data considered
      sensitive, have been removed from the released dataset; direct identifiers are removed,
      HIPAA de-identification rules are applied, dates are rebased or replaced by integers,
      geographic information is removed or generalized, and narrative text fields are
      removed. K-anonymization with k greater than or equal to 2 is not achieved.
    - >-
      The collection applications are HIPAA-compliant and transmit over secure HTTPS to
      HIPAA-compliant storage operated by NIH STRIDES partners.
    - >-
      The transferred data is Personally Identifiable Information as defined in OMB
      Memorandum M-07-16 and is covered under a Certificate of Confidentiality.
    - >-
      Recipients must adhere to the specific requirements of PhysioNet.Org, managed by the
      MIT Laboratory for Computational Physiology.

