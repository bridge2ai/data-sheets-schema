id: https://doi.org/10.60775/fairhub.3
name: AI-READI Flagship Dataset of Type 2 Diabetes, version 3.0.0
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights
  (AI-READI) flagship dataset is a multimodal, AI-ready dataset collected from
  individuals with and without type 2 diabetes mellitus (T2DM) and harmonised
  across three United States data collection sites: the University of Alabama at
  Birmingham, the University of California San Diego, and the University of
  Washington. Version 3.0.0 contains data from 2,280 participants collected
  between 19 July 2023 and 1 May 2025, comprising 356,343 files and approximately
  3.82 TB. The dataset spans more than ten health and behavioural domains,
  including self-reported surveys (screening, demographics, depression, diabetes
  distress and self-care, diet, smoking/alcohol/vaping/marijuana history, general
  health, social determinants of health, ophthalmic history, current medications),
  physical measurements and vitals, 12-lead electrocardiography, monofilament
  testing for peripheral neuropathy, Montreal Cognitive Assessment, photopic and
  mesopic visual acuity and contrast sensitivity, autorefraction, blood and urine
  clinical laboratory testing, multi-device retinal imaging (colour fundus
  photography, optical coherence tomography, optical coherence tomography
  angiography, and fluorescence lifetime imaging ophthalmoscopy), and ten days of
  at-home continuous glucose monitoring, wearable physical activity monitoring,
  and indoor environmental sensing. The study cohort was recruited to be
  triple-balanced by self-reported race/ethnicity (Asian, Black, Hispanic,
  White), T2DM presence and severity (no diabetes; pre-diabetes or
  lifestyle-controlled diabetes; diabetes controlled by oral or non-insulin
  injectable medication; insulin-controlled diabetes), and biological sex. The
  dataset is hypothesis-agnostic and was designed to enable downstream artificial
  intelligence and machine learning research into salutogenesis, the pathway from
  T2DM back to health. It is published on the FAIRhub platform under a custom
  AI-READI data licence and is organised following the Clinical Dataset Structure
  (CDS) v0.1.1 specification, with domain data mapped to the OMOP Common Data
  Model, DICOM, WaveForm DataBase (WFDB), Open mHealth, and NASA ESDS ASCII
  formats. The publicly released version contains no protected health information
  and has sex, race/ethnicity, and medication information removed; a
  controlled-access version containing more sensitive elements is made available
  under separate agreement.
