purposes:
- id: https://doi.org/10.60775/fairhub.3#purpose-salutogenesis
  name: Enable AI/ML research into type 2 diabetes salutogenesis
  description: >-
    The purpose for creating the dataset was to enable future generations of
    artificial intelligence and machine learning research to provide critical
    insights into type 2 diabetes mellitus, including salutogenic pathways to
    return to health. T2DM is a growing public health threat affecting more than
    6% of the world's population and 10.5% of the world's adult population, yet
    current understanding of T2DM, especially in the context of salutogenesis, is
    limited. Given the complexity of T2DM, AI-based approaches may improve
    understanding, but a key issue is the lack of data ready for training AI
    models. The AI-READI dataset is intended to fill this gap.
  response: >-
    The primary goal of AI-READI is to collect and publicly share a multimodal,
    AI-ready dataset for studying the pathogenesis and salutogenesis of type 2
    diabetes mellitus. The long-term objective is to develop a foundational
    dataset in T2DM, agnostic to existing classification criteria or biases,
    which can be used to reconstruct a temporal atlas of T2DM development and
    reversal towards health.
- id: https://doi.org/10.60775/fairhub.3#purpose-blueprint
  name: Establish a blueprint for AI-ready data generation projects
  description: >-
    AI-READI places special emphasis on establishing standards, best practices,
    and guidelines for the collection, preparation, and sharing of data that can
    be used for future efforts to develop other data sets targeted for AI/ML.
    Following FAIR principles, AI-READI can be viewed as a model for future
    efforts to develop other medical and health data sets targeted for AI/ML. The
    project is developing new standards such as the Clinical Dataset Structure
    (CDS) and a cloud-based data management, curation, and sharing platform
    called FAIRhub.
  response: >-
    Specific aims include: (1) collect and share the dataset for AI/ML research
    according to the Findable, Accessible, Interoperable, Reusable (FAIR) data
    principles, (2) create a model for developing large scalable datasets, and
    (3) increase access to and quality of AI/ML research by recruiting and
    training personnel.
- id: https://doi.org/10.60775/fairhub.3#purpose-applications
  name: Support downstream artificial intelligence applications
  description: >-
    The multi-modal dataset being collected is being gathered to facilitate
    downstream pseudotime manifolds and various applications in artificial
    intelligence.
  response: >-
    The applications the dataset is meant to address are research applications in
    artificial intelligence and machine learning, in particular pseudotime
    manifold analysis of disease trajectories.

tasks:
- id: https://doi.org/10.60775/fairhub.3#task-pseudotime
  name: Pseudotime manifold analysis of T2DM disease trajectories
  description: >-
    Data collection was specifically designed to permit downstream pseudotime
    manifold analysis, an approach used to predict disease trajectories by
    collecting and learning from complex, multimodal data from participants with
    differing disease severity, ranging from normal to insulin-dependent T2DM.
    The approach has been used successfully in developmental biology to identify
    differentiation pathways from complex gene expression datasets of individual
    cells; an expanded approach relies on dimensionality reduction, is agnostic
    to existing classification criteria or biases, and can be used to reconstruct
    a temporal atlas of pathogenesis and healing.
  response: >-
    The dataset is designed for reconstruction of a temporal atlas of T2DM
    development and reversal towards health.
- id: https://doi.org/10.60775/fairhub.3#task-multimodal-models
  name: Multimodal AI/ML model development on balanced clinical data
  description: >-
    The cohort is designed to be balanced in race/ethnicity, T2DM severity, and
    biological sex so that unbiased machine learning models can be developed.
    Building balanced datasets is critical for the development of unbiased
    machine learning models, so rather than targeting the demographic
    distribution of the US population, the study recruits four race/ethnic
    groups, four T2DM categories, and biological males and females in equal
    proportions.
  response: >-
    The dataset supports development and evaluation of multimodal AI/ML models
    across survey, clinical, laboratory, imaging, waveform, wearable, and
    environmental data types.
- id: https://doi.org/10.60775/fairhub.3#task-hypothesis-agnostic
  name: Hypothesis-agnostic exploration across health domains
  description: >-
    The AI-READI team, a multidisciplinary group of investigators including
    clinicians, data scientists, vision scientists, computer scientists,
    organisational scientists, and ethicists, designed the protocol such that it
    is agnostic to hypotheses. Rather than testing a specific hypothesis, the
    team assembled a data collection protocol composed of assessments from many
    health domains that are likely impacted by T2DM.
  response: >-
    No specific labels or predefined prediction targets are provided; the dataset
    is hypothesis-agnostic and aimed at facilitating multiple potential
    downstream AI/ML applications.

addressing_gaps:
- id: https://doi.org/10.60775/fairhub.3#gap-ai-ready-data
  name: Lack of AI-ready multimodal datasets for type 2 diabetes
  description: >-
    The ability to understand and affect the course of complex, multi-organ
    diseases such as T2DM has been limited by a lack of well-designed, high
    quality, large, and inclusive multimodal datasets. A major barrier to
    AI-based approaches has been the lack of diverse datasets that are AI ready
    for training AI models, which the AI-READI project is designed to address.
  response: >-
    AI-READI addresses this gap by producing a large, multimodal, harmonised,
    standards-conformant dataset that is stored and shared as AI-ready, enabling
    immediate AI/ML research without reformatting and preprocessing.
- id: https://doi.org/10.60775/fairhub.3#gap-demographic-diversity
  name: Under-representation of racialised groups in T2DM research
  description: >-
    The prevalence of T2DM is higher in certain racial and ethnic populations and
    the deleterious consequences are exacerbated in these populations. A
    meta-epidemiological review of T2DM studies published from 2000 to 2020
    indicated that samples lacked racial and ethnic diversity. AI-READI is
    designed to be approximately balanced with respect to Asian, Black, Hispanic,
    and White participants, a demographic improvement over many previous
    epidemiological studies and clinical trials on T2DM.
  response: >-
    The recruitment design intentionally recruits equal numbers of four
    racial/ethnic groups rather than mirroring the US demographic distribution,
    which is an important step forward in addressing demographic inequities in
    research.
- id: https://doi.org/10.60775/fairhub.3#gap-ethical-sourcing
  name: Ethical and equitable sourcing of AI training data
  description: >-
    Data used in developing AI systems are often a major source of downstream
    ethical issues. AI-READI addresses challenges that have compromised AI
    implementation in clinical research by including ethical and equitable data
    collection and management, guidance from bioethicists, and adherence to FAIR
    principles. Ethical, legal, and social implications are considered at every
    stage of the project cycle, and the project reviewed existing documentation
    approaches such as datasheets and healthsheets to identify the most suitable
    one for biomedical data.
  response: >-
    The project implements a robust data dissemination system, a strict licence
    agreement, and data watermarking for both public and controlled sets to
    prevent re-identification attempts, and engages the Native Biodata Consortium
    on challenges specific to American Indian and Alaska Native communities.

creators:
- id: https://doi.org/10.60775/fairhub.3#creator-consortium
  name: AI-READI Consortium
  description: >-
    The dataset was created by members of the AI-READI project, referred to as
    the AI-READI Consortium, and is registered on FAIRhub with an organizational
    creator name of "AI-READI Consortium". Details about each member and their
    institutions are available on the project website at https://aireadi.org.
    There is a wide range of experience within the project team, including
    senior, mid-career, and early career faculty members as well as clinical
    research coordinators, staff, and interns, collectively covering clinical
    research, data collection, data management, data standards, bioinformatics,
    team science, and ethics. Six cross-disciplinary project modules involving
    teams located across eight institutions worked together to develop the
    dataset. The funding institution is not creating or managing the dataset; the
    dataset is created and managed by the awardees of the grant. The affiliations
    listed here are those of the named study principal investigators recorded in
    the FAIRhub study description; they are not an exhaustive list of consortium
    member institutions, and the Nature Metabolism author list names further
    affiliations including Portland State University, Meharry Medical College, and
