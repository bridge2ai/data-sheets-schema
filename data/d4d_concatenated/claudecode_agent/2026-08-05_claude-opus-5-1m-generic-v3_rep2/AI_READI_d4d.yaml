purposes:
  - response: >-
      To create and publicly share a flagship, ethically-sourced, AI-ready multimodal dataset on
      type 2 diabetes mellitus (T2DM) that enables future generations of artificial intelligence and
      machine learning research to provide critical insights into T2DM, including salutogenic
      pathways to return to health.
  - response: >-
      To develop a foundational dataset in T2DM that is hypothesis agnostic and agnostic to existing
      classification criteria or biases, which can be used to reconstruct a temporal atlas of T2DM
      development and reversal towards health (salutogenesis).
  - response: >-
      To support downstream pseudotime manifold analysis, an approach used to predict disease
      trajectories by collecting and learning from complex multimodal data from participants with
      differing disease severity, from normal to insulin-dependent T2DM.
  - response: >-
      To establish standards, best practices and guidelines for the collection, preparation and
      sharing of data for the purposes of AI/ML — including guidance from bioethicists and adherence
      to the Findable, Accessible, Interoperable, Reusable (FAIR) principles — so that the project
      can serve as a model for future efforts to develop other medical and health datasets targeted
      for AI/ML.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel,
      including a year-long research internship programme at the nexus of biomedicine and AI.

addressing_gaps:
  - response: >-
      A major barrier to AI in healthcare research has been the lack of diverse datasets that are AI
      ready for training AI models; the ability to understand and affect the course of complex,
      multi-organ diseases such as T2DM has been limited by the absence of well-designed,
      high-quality, large and inclusive multimodal datasets. AI-READI is designed to fill this gap.
  - response: >-
      A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated that
      samples lacked racial and ethnic diversity. AI-READI recruits approximately balanced numbers of
      Asian, Black, Hispanic and White participants, a demographic improvement over many previous
      epidemiological studies and clinical trials on T2DM.
  - response: >-
      Existing data sources such as insurance claims or electronic health records do not support many
      downstream AI/ML analyses; AI-READI's acquisition protocol spans survey data, physical
      measurements, clinical data, imaging data and wearable device data to enable analyses that
      would not otherwise be feasible.
  - response: >-
      Existing large training datasets are typically unbalanced with respect to disease severity.
      AI-READI is triple-balanced by race/ethnicity, biological sex and T2DM severity (no diabetes,
      pre-diabetes/lifestyle controlled, non-insulin controlled, insulin controlled) to facilitate
      the development of unbiased machine learning models.

tasks:
  - response: >-
      Development and training of artificial intelligence and machine learning models, including
      multimodal models, to improve understanding of type 2 diabetes mellitus.
  - response: >-
      Pseudotime manifold analysis to predict disease trajectories and reconstruct a temporal atlas
      of T2DM pathogenesis and salutogenesis.
  - response: >-
      Research into salutogenesis in T2DM — the pathway from disease back to health — as opposed to
      the study of pathogenesis.

intended_uses:
  - use_category:
      - Type 2 diabetes related AI/ML research
    examples:
      - Training and validating multimodal AI/ML models across survey, clinical, laboratory, imaging, waveform, wearable and environmental data
      - Pseudotime manifold analysis of disease trajectories from no diabetes through insulin-dependent T2DM
      - Studies of salutogenesis and of adverse conditions associated with T2DM
    usage_notes: >-
      Accessing the dataset requires logging in through a verified ID system, agreeing to use the
      data only for type 2 diabetes related research, and agreeing to the license terms. The project
      team supplies recommended 70%/15%/15% train/validation/test splits in participants.tsv that are
      balanced as far as possible for sex, race/ethnicity, diabetes status and age.
  - use_category:
      - Methodological and data standards research
    examples:
      - Reuse of the dataset organization as a model for structuring AI-ready clinical research datasets following the Clinical Dataset Structure (CDS) specification
      - Evaluation of mappings to the OMOP Common Data Model, DICOM, WFDB and Open mHealth standards for multimodal clinical data
    usage_notes: >-
      The project disseminates its blueprint for collecting and sharing AI-ready datasets through the
      project website, Zenodo community and GitHub organization so that future data generation
      projects can follow it.
  - use_category:
      - Commercial reuse
    examples:
      - Development, training or adaptation of models, algorithms and programs using the data
    usage_notes: >-
      The license permits reuse for commercial as well as research purposes, but models, algorithms
      and programs may only be distributed if they do not themselves contain the data or a modified
      version of it, and the licensee must undertake all reasonable efforts to minimise the
      likelihood that data can be memorized, derived, reconstructed or reconstituted through the use
      or construction of such models.

discouraged_uses:
  - discouragement_details:
      - >-
        The data are intended solely as a research resource and are discouraged from being used as a
        basis for clinical treatment decisions.
  - discouragement_details:
      - >-
        Analyses that assume a nationally representative sample are discouraged: rather than
        targeting the demographic distribution of the US population, the study deliberately recruits
        four race/ethnicity groups, four diabetes severity groups and both sexes in approximately
        equal proportions.
  - discouragement_details:
      - >-
        Because enrollment was ongoing when this version was released, the pilot data release and
        periodic updates may not have achieved balanced distribution across groups, so analyses that
        depend on the intended balance should be undertaken with caution.

prohibited_uses:
  - prohibition_reason:
      - >-
        Making clinical treatment decisions based on the data is prohibited by the data license
        because the dataset is intended solely as a research resource.
  - prohibition_reason:
      - >-
        Using or attempting to use the data, alone or in concert with other information, to
        compromise or infringe the confidentiality of information on any data subject, to identify or
        contact any individual data subject or group of data subjects, to extract or extrapolate
        identifying information, to establish a data subject's membership in a particular group of
        persons, or otherwise to cause harm or injury to any data subject, is prohibited to protect
        participant privacy.
  - prohibition_reason:
      - >-
        Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or otherwise
        conveying any portion of the data or any derivative work to a third party that is not bound
        by an agreement on terms identical to the data license is prohibited in order to control
        secondary sharing.
  - prohibition_reason:
      - >-
        Disseminating models trained on the data without undertaking all reasonable efforts to
        minimise the likelihood that the data can be memorized, derived, reconstructed or
        reconstituted through the use or construction of those models is prohibited under the
        license.

future_use_impacts:
  - impact_details:
      - >-
        To the extent of the creators' knowledge, no uses of the dataset are currently anticipated
        that could result in unfair treatment or harm; however, there is a theoretical risk of future
        re-identification. AI algorithms can infer individual patient characteristics and could
        facilitate individual-level identification, so the project implements a robust data
        dissemination system, a strict licence agreement and data watermarking for both the public
        and controlled sets.
  - impact_details:
      - >-
        Because sex, race and ethnicity are not released with the public dataset, users cannot
        directly audit derived models for demographic disparity using the public release alone; the
        project team mitigates this by supplying recommended training, validation and test splits
        prepared so that the validation and test sets are balanced as well as possible for sex,
        race/ethnicity and diabetes status.
  - impact_details:
      - >-
        American Indians and Alaska Natives are unique and highly identifiable groups that could
        benefit from precision health AI studies. Through engagement with the Native BioData
        Consortium and a tribal consultation, the project is evaluating tools such as data usage
        agreements, contract negotiations, transparent access agreements, and forms of assured return
        of benefit with sustainable input, control and monitoring of Tribal data.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Recruitment is predominantly urban and hospital-based, drawing on patients aged 40 and older
      who had a medical encounter at one of three academic health systems, and may not fully capture
      diverse cultural and socioeconomic backgrounds.
    scope_impact: >-
      Limits the generalization of models derived from the dataset to non-urban populations and to
      people without regular contact with an academic health system.
    recommended_mitigation: >-
      Three geographically diverse recording sites were selected and individuals from all demographic
      backgrounds were recruited at all three sites.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The study cohort covers Asian, Black, Hispanic and White participants and does not include
      other racial or ethnic groups such as Pacific Islanders and Native Americans.
    scope_impact: >-
      Models derived from the dataset may not generalize to groups not represented in the cohort.
  - limitation_type: scope_limitation
    limitation_description: >-
      Eligibility is restricted to adults aged 40 and older (with an upper age limit of 85 years in
      the study eligibility metadata) who are able to provide consent and who speak and read English.
      Pregnancy, gestational diabetes and type 1 diabetes are exclusionary.
    scope_impact: >-
      Younger adults, non-English speakers, pregnant people and people with type 1 diabetes are
      absent from the dataset. Requiring that eligible participants speak, read and understand
      English may have created challenges in recruiting Hispanic and/or Asian persons.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The design is cross-sectional and there is currently only one study visit per participant in
      this release; longitudinal follow-up is planned for only a small subgroup (approximately 10% of
      the cohort invited, with approximately 4% of participants expected to undergo a follow-up
      examination in year 4).
    scope_impact: >-
      Disease trajectories must be inferred across participants of differing severity rather than
      observed within individuals.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The public release omits protected health information as well as sex, race/ethnicity and
      medication information, which are available only under controlled access together with 5-digit
      ZIP code, genetic sequencing data, past health records, and traffic and accident reports.
    scope_impact: >-
      Demographic subgroup analyses and medication-adjusted analyses cannot be performed with the
      public dataset alone.
    recommended_mitigation: >-
      Use the recommended data splits, which the project team balanced for sex, race/ethnicity and
      diabetes status, or enter into a data use agreement for the controlled-access dataset.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels or targets are provided with the dataset, and no formal guidelines exist for future
      researchers creating new labels or defining new tasks; the dataset is deliberately
      hypothesis-agnostic.
    scope_impact: >-
      Users must define and validate their own outcome definitions and labels.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, so there is selection bias known as volunteer bias, which may
      limit the generalisability of results to those who are not represented in the study population.
    mitigation_strategy: >-
      Recruitment proceeds in waves, with the composition of participants monitored for diversity and
      inclusion and adjusted by under- and oversampling groups as needed.
  - bias_type: sampling_bias
    bias_description: >-
      The study base is limited to patients aged 40 years and older who had a medical encounter
      within one of the three health systems between 2020 and 2025; participants with T2DM and
      pre-diabetes are identified by screening electronic health records for ICD-10 codes E11.X and
      R73.09. People without health-system encounters, and people whose diabetes status is not
      recorded in the health record, are not represented.
    affected_subsets:
      - >-
        The whole cohort; in particular the no-diabetes group, which is defined by the absence of
        these ICD-10 codes in the health record.
  - bias_type: representation_bias
    bias_description: >-
      It is a well-documented observation in health research that recruiting Black men into studies
      is more difficult than recruiting other populations, yet this population bears a
      disproportionate burden of T2DM; similar trends for under-recruitment and disease burden have
      been reported for Hispanic and Asian persons. Factors such as medical mistrust and fear for
      safety stem from historical events such as the Tuskegee syphilis study.
    affected_subsets:
      - Black, Hispanic and Asian participants, particularly Black men.
    mitigation_strategy: >-
      Tailoring printed materials and using a personalised, participatory approach to recruitment; a
      Community Advisory Board of 11 persons from the three sites, including diversity in race and
      ethnicity as represented in the sample, contributes to protocol development; new recruitment
      strategies will be implemented if sample balancing on race/ethnicity emerges as a challenge.
  - bias_type: representation_bias
    bias_description: >-
      While the cross-sectional database ultimately aims to achieve balance across race/ethnicity,
      biological sex and diabetes presence and severity, the pilot and interim releases are not
      balanced across these parameters because enrollment is ongoing.
    affected_subsets:
      - >-
        This version of the dataset: of 2280 participants, race/ethnicity counts are Hispanic 380,
        Asian 545, Black 519, White 836; sex counts are male 951, female 1329; diabetes status counts
        are no diabetes 776, lifestyle controlled 560, oral medication controlled 686, insulin
        controlled 258.
    mitigation_strategy: >-
      Recommended train/validation/test splits were constructed so that the validation and test sets
      are balanced across race/ethnicity (88 per group), sex (176 per group) and, as far as possible,
      diabetes status.
  - bias_type: measurement_bias
    bias_description: >-
      Image quality varies across devices and participants. Optomed Aurora images are acquired
      handheld and undilated, so quality varies from patient to patient and within the same patient;
      Heidelberg Spectralis imaging is operator-dependent and quality issues may lead to skipping the
      modality and missing data; FLIO takes longer and exposes participants to uncomfortable levels
      of light, so it is performed last, when participant compliance may be lower.
    affected_subsets:
      - Retinal photography, OCT/OCTA and FLIO modalities.
    mitigation_strategy: >-
      Devices with automated positioning (iCare EIDON, Topcon Triton and Maestro2) were operated in
      fully automated mode to minimise operator-induced noise, and multiple devices were included for
      one measure to enhance generalizability.

anomalies:
  - anomaly_details:
      - In survey data, skipped questions or incomplete responses are expected.
  - anomaly_details:
      - >-
        In wearable device data, improper use and technical failures such as battery failure or
        system malfunction are expected.
  - anomaly_details:
      - >-
        In imaging data, patient uncooperation, noise that may obscure the images, system malfunction
        and data transfer failures are expected.
  - anomaly_details:
      - >-
        In a few cases there may have been a data collision at some point in the process, resulting
        in lost data.
  - anomaly_details:
      - >-
        Some participants' devices had no stored results or were returned too late to retrieve the
        results, for example because the battery died or data were lost.

missing_data_documentation:
  - missing_data_patterns:
      - >-
        Not all modalities are available for all participants; the dataset is not complete across all
        data domains for every instance.
      - >-
        Not all modalities are available for all participants; some participants elected not to
        participate in some study elements, and in some cases device data could not be retrieved.
    missing_data_causes:
      - >-
        Some participants elected not to participate in some study elements. In a few cases the data
        collection device did not have any stored results or was returned too late to retrieve the
        results (for example the battery died or the data were lost). In a few cases a data collision
        occurred at some point in the process and data were lost. Survey respondents may skip
        questions or give incomplete responses.
    handling_strategy: >-
      Clinical data outside expected minimum/maximum ranges were flagged in REDCap and surfaced in
      reports reviewed by clinical research coordinators and data managers, who examined participant
      records to determine whether an error was likely. Data were checked for credibility, incorrect
      flow through prescribed skip patterns, missing data that could be directly filled from other
      portions of an individual's record, and omission or duplication of records. Editing was done
      only under the guidance and approval of the site principal investigator; where there was no
      logical or appropriate way to correct the data, the site principal investigator reviewed the
      values and decided whether they should be removed.

instances:
  - instance_type: Individual human participant
    counts: 2280
    data_substrate: >-
      Multimodal per-participant records comprising tabular survey and clinical data, clinical
      laboratory values, medical images (DICOM), physiological waveforms (WFDB) and time-series
      sensor data (Open mHealth and ASCII text).
    data_topic: >-
      Type 2 diabetes mellitus and associated health domains, including vitals, retinal imaging,
      electrocardiography, cognitive function, continuous glucose monitoring, physical activity, home
      air quality, blood and urine laboratory testing, and psychosocial variables including social
      determinants of health.

relationships:
  - relationship_details:
      - >-
        All instances are part of the same prospective data generation project (AI-READI). There is
        currently only one study visit per participant, so each participant contributes a single
        instance and no explicit relationships between individual participants are represented in the
        dataset.

subpopulations:
  - subpopulation_elements_present: false
    identification:
      - >-
        The public release of the dataset does not identify demographic sub-populations: information
        related to the sex and race/ethnicity of participants was removed from the public set to
        prevent stigmatization of findings. Sex, race and ethnicity are held under controlled access.
        No regulation prevented demographic data collection; the data were collected but are not
        released publicly.
    distribution:
      - >-
        Aggregate counts for the 2280 participants in version 3.0.0 are reported in the dataset
        README: race/ethnicity — Hispanic 380, Asian 545, Black 519, White 836; sex — male 951,
        female 1329; diabetes status — no diabetes 776, pre-diabetes/lifestyle controlled 560, oral
        or non-insulin injectable medication controlled 686, insulin controlled 258; mean age 60.8 ±
        11.3 years.

splits:
  - split_details:
      - >-
        The current version of the dataset comes with recommended data splits, provided in the
        participants.tsv file. Because sex, race and ethnicity are not released with the public
        version of the dataset, the project team prepared splits in proportions of 70% training (1576
        participants), 15% validation (352) and 15% test (352), where the validation and test sets
        are balanced as well as possible for sex, race/ethnicity and diabetes status (no diabetes,
        prediabetes/lifestyle controlled, oral medication controlled, and insulin controlled). Mean
        age is comparable across splits (train 61.1 ± 11.3 years, validation 60.3 ± 10.8, test 60.5 ±
        11.4).

