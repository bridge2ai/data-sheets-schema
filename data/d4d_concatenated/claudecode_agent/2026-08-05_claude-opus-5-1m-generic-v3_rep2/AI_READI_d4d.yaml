name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI dataset (Artificial Intelligence Ready and Equitable/Exploratory Atlas for Diabetes
  Insights) consists of data collected from individuals with and without type 2 diabetes mellitus
  (T2DM), harmonized across three data collection sites: the University of Alabama at Birmingham,
  the University of California San Diego, and the University of Washington. Version 3.0.0 contains
  data from 2280 participants collected between 19 July 2023 and 1 May 2025. Multiple modalities are
  included: survey and clinical data mapped to the OMOP Common Data Model, blood and urine
  laboratory results, 12-lead electrocardiography, retinal photography, optical coherence tomography
  (OCT), OCT angiography (OCTA) and fluorescence lifetime imaging ophthalmoscopy (FLIO), continuous
  glucose monitoring, wearable activity monitoring, and indoor environmental sensing from a
  custom-built sensor. Files are distributed in the formats recorded in the dataset metadata:
  application/dicom, text/csv, application/json and text/markdown. The composition of the dataset
  was designed with future AI/machine learning studies in mind, using recruitment sampling
  procedures aimed at an approximately equal distribution of participants across diabetes severity,
  sex and race/ethnicity, and a multi-domain acquisition protocol enabling downstream analyses not
  feasible with claims or electronic health record data. The stated goal is to better understand
  salutogenesis, the pathway from disease to health, in T2DM. The public version contains no
  protected health information; information on sex, race/ethnicity and medications has also been
  removed and is available only under controlled access.
