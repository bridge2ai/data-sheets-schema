purposes:
  - response: >-
      To meet the need for infrastructure supporting artificial intelligence and machine learning in
      critical care by generating a publicly available, AI-ready critical care dataset for
      applications that characterize acute and critical care illness, predict complications, and
      measure treatment response among patients with acute or critical illness.
  - response: >-
      To provision a sequestered holdout test set, accessible for model external validation, in
      order to aid marketplace adoption of AI-developed models for implementation in acute and
      critical care.
  - response: >-
      To create ethically sourced datasets and tools around artificial intelligence and to establish
      best practices for AI in health, ensuring that methods promote privacy, accountability, and
      clinical benefit.
  - response: >-
      To develop the network, tools, standards, and education needed to build ML/AI-derived models
      that improve the care and outcomes of patients requiring critical care, including cultivating
      expertise in the lay and scientific community to improve AI literacy and utilization.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support AI/ML in critical care, and developing
      high-resolution multi-center data sets is a critical first step toward actionable and
      trustworthy AI. CHoRUS aims to supply a data set of unprecedented diversity and high
      resolution for the grand challenge of improving recovery from acute illness.
  - response: >-
      Existing legal and regulatory approaches to collecting critical care data at scale are
      incomplete; the project establishes a legal framework for collecting data at scale and
      analyzes the existing legal and regulatory landscape.

tasks:
  - response: "Characterizing acute and critical care illness."
  - response: "Predicting complications and clinical deterioration among patients with acute or critical illness."
  - response: "Measuring treatment response among patients with acute or critical illness."
  - response: "External validation of AI/ML models against a sequestered holdout test set."

other_tasks:
  - task_details: >-
      Research on contextual and social determinants of health, supported by data elements such as
      geographic distance to the nearest hospital and by geocoding of OMOP Location entities.
  - task_details: >-
      Use as a teaching corpus for hands-on AI/ML instruction, including guided Jupyter notebooks,
      OHDSI tool stack workshops, and trainee-developed use cases.

intended_uses:
  - use_category: "AI/ML model development for acute and critical care"
    usage_notes: >-
      The dataset is intended for building machine learning and artificial intelligence derived
      models to improve the care and outcomes of patients requiring critical care.
  - use_category: "External model validation"
    usage_notes: >-
      A holdout test set is provisioned specifically for external validation of models developed
      elsewhere.
  - use_category: "Training and workforce development"
    examples:
      - >-
        The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI
        CHoRUS data through engagement, AI training, and mentorship, and equips trainees to apply
        AI/ML methods to big data analysis using multi-modal datasets on the Bridge2AI AI/ML for
        Clinical Care Collaborative Cloud.

existing_uses:
  - examples:
      - >-
        As of the cohort-2 webinar, CHoRUS datasets are being used for training activities and
        publications.
  - examples:
      - >-
        Trainees in the AIM-AHEAD Bridge2AI for Clinical Care Training Program (cohort 2, running
        November 2025 to July 2026, up to 30 trainees) use the data on the Bridge2AI AI/ML for
        Clinical Care Collaborative Cloud to create practical use cases and prepare posters,
        conference abstracts, and manuscripts.

future_use_impacts:
  - impact_details: >-
      Because the source records are hospital records of critically ill patients, the project
      transforms data using approaches that limit re-identification and performs community-facing
      ethics focus groups to determine what data is appropriate for public sharing.
  - impact_details: >-
      Provision of a holdout test set for external validation is expected to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care, and the
      project frames its methods as promoting privacy, accountability, and clinical benefit.

acquisition_methods:
  - acquisition_details: >-
      Clinical data are extracted retrospectively from hospital source systems at data acquisition
      centers and delivered to CHoRUS as site-specific data extracts, following standard operating
      procedures that have undergone internal validation and review; extraction and upload are
      supported by the chorus-extract-upload tooling.
    was_validated_verified: true
    notes: >-
      Validation includes clinically reviewed semantic mappings and characterization reports
      returned to sites following their data submissions.
    source_caveats: >-
      The bundle describes retrospective extraction of records documented in the course of clinical
      care and does not state whether the underlying observations count as directly observed for the
      purposes of this dataset, so that flag is left unset.
  - acquisition_details: >-
      Some elements are derived rather than transcribed: clinical notes are extracted and tokenized
      with the OHNLP toolkit, and OMOP Location entities are geocoded via DeGauss to supply
      contextual and social determinants of health elements.
    was_inferred_derived: true

collection_mechanisms:
  - mechanism_details: >-
      Structured electronic health record data are drawn from hospital EHR systems, covering
      demographics, diagnoses documented by providers, procedures documented by providers,
      medication administration with dosing time-stamped upon each infusion change or dose
      administration, and high-frequency nursing flowsheet documentation, and are mapped to the
      OMOP Common Data Model.
  - mechanism_details: "Imaging is acquired from hospital PACS and delivered in DICOM."
  - mechanism_details: "Waveform telemetry is captured from bedside monitors through gateway/middleware systems."
  - mechanism_details: "EEG waveforms are extracted from the hospital EEG database."
  - mechanism_details: "Clinical notes are extracted and tokenized using the OHNLP toolkit."
  - mechanism_details: >-
      Site extracts are created and uploaded with the chorus-extract-upload tools and served by
      dockerized container applications deployed to support CHoRUS services on Azure.

data_collectors:
  - collector_details: >-
      The CHoRUS collaboration spans 20 academic centers, of which 14 contribute as Data Acquisition
      centers; chorus4ai.org reports 14 data contributing hospitals and more than 60 consortium
      members across 20 different institutions.
    role: "data contributing centers"
  - collector_details: >-
      Data site managers at each contributing site follow the interactive workflow diagram in the
      Chorus_SOP documentation to extract, curate, and submit clinical data extracts, and provide
      regular status updates either through the GitHub interface or a Google Form that updates
      status and issue information through the GitHub API.
    role: "data site manager"
  - collector_details: >-
      Clinical collaborators contribute clinical expertise to semantic mapping and validation
      through the chorus-mapping repository and its associated clinical validation SOP.
    role: "clinical collaborator"
  - collector_details: >-
      Sub-teams for Standards, Data Acquisition, and Tooling within the CHoRUS data generation
      project compile documentation and recordings supporting the acquisition workflow.
    role: "coordinating sub-teams"

direct_collection:
  - is_direct: false
    collection_details: >-
      Data collection is retrospective: records are extracted from hospital source systems
      (EHR, PACS, bedside monitors and gateway/middleware, and the hospital EEG database) by
      participating data acquisition centers rather than gathered from individuals for this project.
    source_caveats: "The bundle describes the collection as retrospective and site-mediated but does not use the terms direct or indirect collection."

collection_timeframes:
  - timeframe_details: >-
      Collection is retrospective and ongoing across the OT2OD032701 award period, which runs from
      2022-09-01 to 2026-11-30. The cohort-2 webinar reports coverage of 14 hospitals as of August
      2025, with EEG extraction and imaging de-identification for a larger cohort still in process
      at that point.
    source_caveats: "Award start and end dates come from NIH RePORTER and describe the funded project period, not the calendar range of the patient encounters included; the bundle does not state the encounter date range."

sampling_strategies:
