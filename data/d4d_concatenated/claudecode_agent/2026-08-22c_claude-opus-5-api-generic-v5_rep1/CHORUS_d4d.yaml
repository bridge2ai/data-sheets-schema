sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset consists of hospital records of critically ill patients and includes demographics,
      diagnoses, procedures, medication administration, high-frequency nursing flowsheets, clinical
      note tokens, radiology imaging, telemetry and EEG waveforms, and social determinants of
      health, including geographic contextual factors such as distance to the nearest hospital.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Every listed data type (demographics, medication administration, procedures, nursing
      flowsheets, diagnoses, clinical notes, imaging, waveform telemetry, and waveform EEG) is under
      controlled access. Clinical notes are not centralized at all: they are stored locally at the
      contributing sites and only tokens are held in the enclave. Community-facing ethics focus
      groups are used to determine what data is appropriate for public sharing.

is_deidentified:
  method: >-
    Unstructured EHR text is tokenized with the OHNLP toolkit; imaging is de-identified before
    release; data are transformed using approaches that limit re-identification; a privacy scan tool
    for medical records and a CTP-based de-identification repository are maintained by the project.
  deidentification_details: >-
    De-identification is applied per modality rather than uniformly, and its completion is staged:
    at the time of the cohort-2 webinar around 1,000 images were available with de-identification in
    process for a larger cohort, and EEG extraction had not yet completed.
  source_caveats: "The bundle does not state which specific identifiers are removed, nor report a residual re-identification risk assessment."

human_subject_research:
  involves_human_subjects: true
  special_populations:
    - >-
      The released cohort includes admissions from pediatric intensive care units and neonatal
      intensive care units, so minors and neonates are represented.
  source_caveats: "The bundle does not name an IRB, an ethics review board of record, or a regulatory determination for the dataset."

at_risk_populations:
  at_risk_groups_included: true
  special_protections:
    - >-
      Access to all data types is controlled, transformations that limit re-identification are
      applied before release, and community-facing ethics focus groups determine what data is
      appropriate for public sharing.
  source_caveats: >-
    Inclusion of at-risk groups follows from the stated PICU and NICU admissions rather than from an
    explicit statement in the bundle; the bundle does not describe assent procedures, guardian
    consent, or protections specific to minors.

ethical_reviews:
  - review_details: >-
      Ethics is one of the project's three pillars (Ethical and Trustworthy AI). The consortium
      performs community-facing ethics focus groups to determine what data is appropriate for public
      sharing, evaluates community perspectives on clinical care AI to increase trustworthiness of
      provenance and privacy, and analyzes the existing legal and regulatory landscape while
      establishing a legal framework for collecting data at scale.
    source_caveats: "No institutional review board approval, protocol number, or ethics committee determination is stated anywhere in the bundle."

data_governance:
  accountable_organization:
    name: "Massachusetts General Hospital"
  access_review_process: >-
    Access is controlled. For the AIM-AHEAD Bridge2AI for Clinical Care Training Program,
    participants complete a registration form with name, email, and institution and must sign a
    licensing agreement included in the registration form before gaining access; once access is
    granted and compute is provisioned, an email is sent. A ".edu" email address is required to gain
    access to the dataset, and program administrators will assist with access where needed. General
    access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
  stewardship_roles:
    - >-
      Data site managers at contributing sites are responsible for extracting, curating, and
      submitting data extracts under the Chorus_SOP workflow and for providing regular status
      updates; Standards, Data Acquisition, and Tooling sub-teams maintain protocols, mappings, and
      software; clinical collaborators validate semantic mappings; software contributors maintain
      the CHoRUS package ecosystem, with versions and maintainers listed on a package status page.
  source_caveats: >-
    The bundle names no data access committee, membership, decision timeframe, or appeal process.
    Massachusetts General Hospital is recorded as accountable organization because NIH RePORTER
    names it as the awardee organization for OT2OD032701.

license_and_use_terms:
  license_terms: >-
    Access to the CHoRUS dataset is controlled and conditioned on signing a licensing agreement;
    for training program participants the agreement is included in the registration form and must be
    signed before access is granted, and a ".edu" email address is required. Separately, the
    chorus-ai GitHub organization states that its software project is licensed under the MIT
    License, with individual repositories also carrying MIT and Apache-2.0 licenses.
  source_caveats: >-
    The text of the dataset licensing agreement is not in the bundle, so permitted uses,
    redistribution terms, and publication conditions cannot be stated. The MIT and Apache-2.0
    licenses named on GitHub attach to CHoRUS software repositories, not to the data.

regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions:
    - >-
      The project establishes a legal framework for collecting data at scale and analyzes the
      existing legal and regulatory landscape; all data types are held under controlled access and
      released only after transformations that limit re-identification. The project website
      additionally carries a notice that the repository is under review for potential modification
      in compliance with Administration directives.
  source_caveats: >-
    HIPAA and GDPR appear in the bundle only as topics of a training workshop on navigating IRB,
    data compliance, and quality assurance, not as compliance determinations about this dataset, so
    no compliance status is asserted here.

distribution_formats:
  - format: "OMOP Common Data Model tables"
    notes: "Used for demographics, medication administration, procedures, nursing flowsheets, and diagnoses; published metadata schema is the OMOP schema, with extensions for nursing flowsheets."
  - format: "OHNLP tokenized clinical note output"
    notes: "Published against the OHNLP open-source schema; source notes remain at the contributing site."
  - format: "DICOM"
    notes: "Radiology imaging extracted from PACS, published against the DICOM schema."
  - format: "WFDB"
    notes: "Bedside telemetry waveforms, published against an extended PhysioNet schema."
  - format: "EDF+ and Persyst"
    notes: "EEG waveforms, published against the open-source EDF+ and Persyst schemas."

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is made available beyond the contributing institutions under controlled access,
      including to trainees in the AIM-AHEAD Bridge2AI for Clinical Care Training Program, who work
      with it on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud after signing a licensing
      agreement. The stated goal is a publicly available AI-ready critical care dataset.

maintainers:
  - maintainer_details: >-
      Ciera McCrary, Program Manager, Massachusetts General Hospital, listed as the contact on
      chorus4ai.org with the address cmccrary@mgh.havard.edu.
    source_caveats: >-
      The contact address is transcribed exactly as printed on chorus4ai.org, where the domain
      appears as mgh.havard.edu. No role enum value is recorded because the bundle describes an
      individual program manager rather than a maintaining organization type.
  - maintainer_details: >-
      Access requests are handled by dbold@emory.edu and jared.houghtaling@tuftsmedicine.org, the
      contacts given on the chorus-ai GitHub organization page.
    source_caveats: >-
      No role enum value is recorded because the bundle names individual access contacts rather
      than a maintaining organization type.
  - maintainer_details: >-
      CHoRUS software contributors maintain 28 repositories in the chorus-ai GitHub organization,
      including chorus-container-apps, Chorus_SOP, chorus_waveform, chorus-extract-upload,
      privacy_scan_tool, CTP-deid, UF-Geocoding, and CHoRUSReports; versions, maintainers, and other
      package metadata are published on a package status page and a web guide in the
      chorus-developer repository.
    role: academic_institution
    source_caveats: "Recorded as academic_institution because the CHoRUS Network is described as a collaboration spanning 20 academic centers."

updates:
  update_details: >-
    Acquisition and curation are ongoing toward an anticipated final dataset of 100,000 patient
    admissions across nine data modalities and 14 contributing hospitals. Contributing sites provide
    regular status updates on their progress in creating and curating CHoRUS-specific extracts, and
    modality coverage is being extended: imaging de-identification for a larger cohort and EEG
    extraction were both in process as of September 2025, and published dataset metadata was planned
    for clinical notes, imaging, and EEG.
  source_caveats: "No release cadence, version numbering scheme, or scheduled update dates are stated."

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Clinical collaborators can contribute to and validate semantic mappings through the
    chorus-mapping repository, which holds documentation, pooled tabular mappings, and an associated
    clinical validation SOP. Contributing sites that encounter issues creating or submitting a data
    extract can post them in the Standards or Data Acquisition discussion spaces, and site status
    updates can be submitted either through the GitHub interface or a Google Form. Software
    contributors and users are supported by a web guide compiled in the chorus-developer repository.

external_resources:
  - external_resources:
      - "https://chorus4ai.org/"
    notes: "Public-facing project website covering the team, project overview, tools, data acquisition, standards, community engagement, ethics, the dataset, and learning resources."
  - external_resources:
      - "https://github.com/chorus-ai"
    notes: >-
      CHoRUS for Equitable AI GitHub organization (28 repositories) housing software and tooling for
