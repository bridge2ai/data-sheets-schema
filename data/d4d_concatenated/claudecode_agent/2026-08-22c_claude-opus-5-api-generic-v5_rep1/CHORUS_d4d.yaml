notes: >-
  Every page of chorus4ai.org carries a site-wide banner reading "This repoitory is under review
  for potential modification in compliance with Administration directives." [sic]
source_caveats: >-
  The declared bundle contains four sources of differing rank. On the size of the current release
  the tier-2 project documentation (chorus4ai.org) and the tier-4 cohort-2 webinar differ: the
  website states 50,000 patient admissions in the current released dataset and 14 data contributing
  hospitals, while the webinar states that "as of August 2025" the dataset "covers 14 different
  hospitals with over 45K unique admissions". The higher-ranked website figure is stated here; the
  webinar figure is a dated snapshot and may simply be earlier. The two sources also report imaging
  availability in different units (admissions with radiology data versus images available), and
  that difference is recorded on the relevant instance rather than resolved. In
  `conforms_to_standard`, the enum value OTHER stands for the EDF+ and Persyst EEG formats and the
  OHNLP open-source note schema, which the enum does not name. The project is called the "CHoRUS
  Consortium" on chorus4ai.org and the "CHoRUS Network" on the chorus-ai GitHub organization page;
  `created_by` uses the former. The NIH RePORTER abstract contains a typographical error ("the
  CPatient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Clinical Care
  AI data generation project") and one truncated sentence ("label data for ;"); neither is
  reproduced here.

