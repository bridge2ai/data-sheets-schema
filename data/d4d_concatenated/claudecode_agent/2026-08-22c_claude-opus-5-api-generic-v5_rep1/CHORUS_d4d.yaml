    source_caveats: "The bundle does not give the distribution of admissions across ICU, PICU, and NICU, nor demographic breakdowns."

splits:
  - split_details: >-
      The project sequesters a holdout test set, accessible for model external validation, to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care.
    source_caveats: "The bundle does not state the size of the holdout set, how it is partitioned, or how external validators obtain access to it."

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      The cohort is assembled from 14 data acquisition centers drawn from the 20 academic centers of
      the CHoRUS Network, so representation depends on the case mix of those participating academic
      hospitals.
    mitigation_strategy: >-
      Federated access is intended to enable sampling methods that ensure a balanced and diverse
      cohort, and patient-focused efforts determine ethical and legal approaches to manage privacy
      and bias while accounting for social determinants of health.
    source_caveats: >-
      The bundle states that bias will be managed and that a diverse cohort is a design goal, but it
      does not enumerate measured biases or report representativeness statistics.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Modality coverage is incomplete in the current release: as of the cohort-2 webinar, imaging
      had roughly 1,000 images available with de-identification in process for a larger cohort, and
      EEG extraction was still in process.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Clinical notes are not held in the enclave; they are stored locally at contributing sites and
      only tokens extracted with the OHNLP toolkit are available centrally.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset is confined to patients with acute or critical illness admitted to ICU, PICU, and
      NICU settings at participating hospitals and is not a general hospital or ambulatory cohort.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Data collection is retrospective, so the dataset reflects historical documentation and care
      practices at the contributing hospitals rather than prospectively designed measurement.
  - limitation_type: methodological_limitation
    limitation_description: >-
      For clinical notes, imaging, and EEG waveforms the cohort-2 webinar records dataset metadata
      as planned rather than available, while OMOP-standardized data types and telemetry already
      have metadata.

preprocessing_strategies:
  - preprocessing_details: >-
      Structured EHR data are standardized to the OMOP Common Data Model, supported by validated
      semantic mappings that connect clinical data in various source formats to international
      standards; some data types use the OMOP schema with extensions.
  - preprocessing_details: >-
      Unstructured EHR text is extracted and tokenized using the OHNLP toolkit, which both makes
      note content usable and limits what leaves the contributing site.
  - preprocessing_details: >-
      Waveform data are converted for release using CHoRUS waveform conversion scripts and
      documentation; telemetry is delivered in WFDB against an extended PhysioNet schema, and EEG in
      EDF+ and Persyst.
  - preprocessing_details: >-
      Data are transformed using approaches that limit re-identification, including de-identification
      of imaging and a privacy scan tool for medical records.
  - preprocessing_details: >-
      OMOP Location entities are geocoded via DeGauss so that contextual factors such as geographic
      distance to the nearest hospital can be attached to records.

cleaning_strategies:
  - cleaning_details: >-
      Characterization reports are produced and returned to contributing sites following their data
      submissions, so that quality issues can be identified and resolved at source.
  - cleaning_details: >-
      Standard operating procedures for extracting, curating, and delivering interoperable datasets
      undergo an internal validation and review process, and semantic mappings are clinically
      validated under a dedicated clinical validation SOP.
  - cleaning_details: >-
      Site status tracking through GitHub projects and a Google Form pipeline is used to identify
      and resolve blocking issues in the creation and curation of site data extracts.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment is developed to label data with targets important
      for prediction; the multi-center network builds capabilities to acquire, standardize,
      tokenize, store, visualize, and label data.
    source_caveats: "The bundle does not identify the specific prediction targets labeled, annotator qualifications, or agreement procedures."

