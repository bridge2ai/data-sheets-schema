id: https://chorus4ai.org/
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multi-center, multi-modal, high-resolution critical care dataset produced by one of
  four data generation projects in the NIH Common Fund Bridge2AI program. It is assembled from
  retrospective hospital records of patients with acute and critical illness and is intended to
  support machine learning and artificial intelligence applications that characterize acute and
  critical care illness, predict complications, and measure treatment response. Structured
  electronic health record data are standardized to the OMOP Common Data Model; imaging is
  delivered in DICOM, bedside telemetry waveforms in WFDB, EEG waveforms in EDF+ and Persyst, and
  clinical notes are extracted and tokenized with the OHNLP toolkit. The anticipated final dataset
  covers 100,000 patient admissions, nine data modalities, and 14 data contributing hospitals,
  assembled by more than 60 CHoRUS consortium members across 20 different institutions. The
  currently released dataset comprises 50,000 patient admissions from ICU, PICU, and NICU settings,
  1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform
  data. Access is controlled and mediated through a cloud enclave, and a sequestered holdout test
  set is provisioned so that models can be externally validated. Alongside the data, the project
  develops semantic mappings, standard operating procedures, open-source tooling, community-facing
  ethics work, and workforce training.
page: https://chorus4ai.org/
language: en
status: "Partially released; a controlled-access current release is available while acquisition, de-identification, and curation continue toward the anticipated final dataset."
is_tabular: false
conforms_to: "Structured electronic health record data are standardized to the OMOP Common Data Model (OHDSI); imaging from PACS is delivered in DICOM; bedside telemetry waveforms use WFDB (published metadata schema described as the PhysioNet schema, extended); EEG waveforms use EDF+ and Persyst; extracted and tokenized clinical notes use the OHNLP open-source schema."
