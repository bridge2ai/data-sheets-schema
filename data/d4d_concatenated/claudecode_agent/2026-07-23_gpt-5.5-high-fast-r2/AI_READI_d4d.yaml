intended_uses:
  - id: https://fairhub.io/datasets/2#intended-ai-research
    name: AI/ML research in T2DM
    description: >
      Use the dataset as an AI-ready research resource for T2DM pathogenesis,
      salutogenesis, disease trajectories, biomarker discovery, and multimodal
      model development.
    examples:
      - Pseudotime manifold analysis of disease trajectories.
      - Multimodal modeling across retinal, clinical, environmental, wearable, and survey data.
      - Development of AI/ML methods using a balanced dataset.
    usage_notes: >
      Models developed from the data require appropriate validation before use
      outside research contexts.
    use_category:
      - research
      - machine learning
      - biomedical AI
  - id: https://fairhub.io/datasets/2#intended-fair-blueprint
    name: Blueprint for AI-ready data generation
    description: >
      Use AI-READI processes, standards, documentation, and FAIRhub tooling as a
      model for future data generation projects.
    examples:
      - FAIR data-type guidelines.
      - Clinical Dataset Structure development.
      - Datasheets and healthsheets for biomedical datasets.
    use_category:
      - standards development
      - data management
      - FAIRification
  - id: https://fairhub.io/datasets/2#intended-education
    name: Workforce training
    description: >
      Use the project and dataset in training activities for researchers working
      at the nexus of biomedicine and AI.
    examples:
      - AI-READI internship projects involving healthsheets.
      - Mapping data into common data models.
      - Analyses of equity and ethical issues.
    use_category:
      - education
      - workforce development

discouraged_uses:
  - id: https://fairhub.io/datasets/2#discouraged-clinical-treatment
    name: Clinical treatment decisions
    description: >
      The license agreement prohibits making clinical treatment decisions based
      on the data because the data are intended solely as a research resource.
    discouragement_details:
      - Do not use the dataset as a substitute for clinical evaluation or care.
  - id: https://fairhub.io/datasets/2#discouraged-reidentification
    name: Re-identification or privacy compromise
    description: >
      The license prohibits using or attempting to use the data alone or with
      other information to compromise confidentiality, identify or contact data
      subjects, infer identifying information, establish group membership, or
      cause harm or injury.
    discouragement_details:
      - Re-identification attempts violate the data license and participant privacy protections.
  - id: https://fairhub.io/datasets/2#discouraged-unauthorized-sharing
    name: Unauthorized data sharing
    description: >
      The license prohibits transferring, licensing, sublicensing, selling,
      assigning, displaying, sharing, or otherwise conveying data or derivatives
      to third parties except another licensee bound by identical terms.
    discouragement_details:
      - Models may be distributed only if they do not contain the data or modified data and reasonable efforts are made to minimize memorization or reconstruction.
  - id: https://fairhub.io/datasets/2#discouraged-unqualified-early-release
    name: Unqualified inference from interim releases
    description: >
      Pilot and periodic releases during ongoing enrollment may not be balanced
      across groups, so analyses that ignore release-specific composition are
      discouraged.
    discouragement_details:
      - Interpret each release in the context of version-specific documentation and recruitment status.

existing_uses:
  - id: https://fairhub.io/datasets/2#existing-publications
    name: Protocol and commentary publications
    description: >
      The source bundle includes a BMJ Open protocol publication and a Nature
      Metabolism commentary describing the dataset, study design, and AI-ready
      data-generation blueprint.
    examples:
      - BMJ Open 2025;15:e097449.
      - Nature Metabolism 2024;6:2210-2212.
  - id: https://fairhub.io/datasets/2#existing-fairhub
    name: FAIRhub publication
    description: >
      The FAIRhub landing page lists dataset versions, files, size, license,
      usage statistics, study dashboard, metadata, structure preview, quality
      dashboard, and dataset uses.
    examples:
      - Version 1.0.0 DOI 10.60775/fairhub.1.
      - Version 2.0.0 DOI 10.60775/fairhub.2.
      - Version 3.0.0 DOI 10.60775/fairhub.3.

use_repository:
  - id: https://fairhub.io/datasets/2#use-repository-fairhub
    name: FAIRhub
    description: >
      FAIRhub is a Microsoft Azure cloud-based data management, curation, and
      sharing platform developed for AI-READI and intended to simplify and
      automate implementation of AI-ready data guidelines.
    repository_url: https://fairhub.io/
    repository_details:
      - AI-READI data are uploaded at regular intervals.
      - Each annual release has public and controlled-access datasets.
      - FAIRhub provides dataset landing pages and documentation links.

license_and_use_terms:
  id: https://fairhub.io/datasets/2#license-terms
  name: AI-READI Health Data License and Data License Agreement
  description: >
    FAIRhub lists the dataset under a Health Data License. The AI-READI License
    Agreement v1.0 from the source bundle names the University of Washington as
    licensor and grants a non-exclusive, non-transferable license to download,
    reproduce, use, and create derivative works from the data for research and
    commercial purposes, subject to license compliance and additional use
    restrictions.
  license_terms:
    - Licensee must accept the agreement before downloading, installing, or using the data.
    - Licensee may download, reproduce, use, and create derivative works from the data.
    - Copies of the data remain subject to the agreement.
    - Data and derivatives may not be conveyed to third parties except another licensee bound by identical terms.
    - Models, algorithms, and programs may be disseminated if they do not contain the data or modified data.
    - Licensee must make reasonable efforts to minimize memorization, derivation, reconstruction, or reconstitution of the data from models.
    - Licensee must not make clinical treatment decisions based on the data.
    - Licensee must not attempt to identify, contact, or harm data subjects or groups.
    - Licensee must acknowledge the source and funder in publications reporting use of the data.
    - Licensee must comply with NIH Genomic Data Sharing security and privacy standards for controlled-access data.
    - The agreement terminates automatically upon breach and requires deletion of data copies and cessation of use.
    - Data are provided as-is without warranty.
    - Licensee must comply with applicable laws, regulations, and restrictions.

ip_restrictions:
  id: https://fairhub.io/datasets/2#ip-restrictions
  name: Proprietary rights and model distribution restrictions
  description: >
    The license agreement states that title to the data and all industrial and
    intellectual property rights remain solely and exclusively with the licensor
    and suppliers, and any rights not expressly granted are reserved.
  restrictions:
    - Licensee must not take actions inconsistent with licensor and supplier ownership.
    - Models may be distributed only if they do not themselves contain the data or modified data.
    - Licensee must minimize the likelihood that data can be memorized, derived, reconstructed, or reconstituted from models.

regulatory_restrictions:
  id: https://fairhub.io/datasets/2#regulatory-restrictions
  name: Regulatory, privacy, and compliance restrictions
  description: >
    The IRB and license sources describe HIPAA, NIH Genomic Data Sharing,
    institutional approval, privacy, confidentiality, and data-use agreement
    requirements.
  regulatory_restrictions:
    - UW IRB approval and reliance agreements apply to the human-subjects research.
    - Controlled-access data require legal and privacy use agreements.
    - Licensees must comply with NIH Genomic Data Sharing security best practices for controlled-access data.
    - UCSD health data sharing may require Health Data Oversight Committee approval for sharing with academic institutions.
    - Data sharing and release must comply with UW and UW Medicine policies requiring formal agreements.
  other_compliance:
    - HIPAA Safe Harbor deidentification is used for the public set.
    - CLIA-certified local laboratories perform CBC testing.
    - Human-subjects research compliance training is required for coordinators.

ethical_reviews:
  - id: https://fairhub.io/datasets/2#ethical-review-uw-irb
    name: University of Washington IRB approval
    description: >
      The BMJ protocol states that AI-READI was approved by the Institutional
      Review Board of the University of Washington, approval number
      STUDY00016228, including reliance agreements with the IRBs of UAB and
      UCSD.
    review_details:
      - Written informed consent is provided by all participants.
      - UW IRB provides review and oversight for the multisite study.
      - The IRB protocol title is AI Ready and Exploratory Atlas for Diabetes Insights.
  - id: https://fairhub.io/datasets/2#ethical-review-community-advisory-board
    name: Community Advisory Board involvement
    description: >
      A Community Advisory Board of 11 people from the three sites, with
      diversity in race and ethnicity represented in the AI-READI sample,
      contributes to protocol development and reviews consent forms and research
      protocols.
    review_details:
      - Patient and public involvement is reported in the BMJ publication.
      - Community feedback is considered in IRB modifications as needed.

human_subject_research:
  id: https://fairhub.io/datasets/2#human-subjects
  name: Human subjects research
  description: >
    AI-READI is human-subjects research involving adults aged 40 and older with
    and without T2DM, direct study procedures, medical records, biospecimens,
    wearable and environmental sensor data, and future sharing of data and
    specimens.
  involves_human_subjects: true
  irb_approval:
    - STUDY00016228
  ethics_review_board:
    - University of Washington Institutional Review Board
    - University of Alabama at Birmingham IRB reliance agreement
    - University of California San Diego IRB reliance agreement
  special_populations:
    - Adults aged 40 and older
    - Pregnant people excluded
    - Adults older than 85 excluded in the IRB source
    - Native American cohort tribal consultation is described in NIH RePORTER and Nature Metabolism sources
  regulatory_compliance:
    - HIPAA
    - NIH Genomic Data Sharing Policy
    - UW IRB human subjects requirements

informed_consent:
  - id: https://fairhub.io/datasets/2#consent-written
    name: Written informed consent
    description: >
      The BMJ protocol states that written informed consent is provided by all
      participants. The IRB source describes in-person consent in a private room
      with opportunities for questions before signing.
    consent_obtained: true
    consent_type:
      - written consent
      - in-person consent
    consent_documentation:
      - Signed consent form
      - Copy mailed or provided to participants when needed
    consent_scope:
      - Main study procedures
      - Future sharing and secondary use language in the informed consent form
  - id: https://fairhub.io/datasets/2#consent-electronic
    name: Electronic consent
    description: >
      The IRB source describes REDCap-based electronic consent, where subjects
      can read documentation, e-consent, request a call or video conference, or
      wait for in-person consent.
    consent_obtained: true
    consent_type:
      - electronic consent
    consent_documentation:
      - Signed electronic consent automatically emailed to subjects
      - Additional copy available from study coordinators
    consent_scope:
      - Recruitment and main study participation
      - HIPAA authorization through UW Medicine forms when applicable
  - id: https://fairhub.io/datasets/2#consent-withdrawal
    name: Withdrawal and consent revocation context
    description: >
      The IRB source states subjects will be reminded they have the right to
      change their mind about participation; future sharing language is included
      in the informed consent form.
    consent_obtained: true
    withdrawal_mechanism:
      - Participants can change their mind about study participation.
      - Future sharing and withdrawal information is included in consent materials.

collection_notifications:
  - id: https://fairhub.io/datasets/2#notification-recruitment
    name: Recruitment notification
    description: >
      Potential participants receive mailed hardcopy invitation letters and
      invitation emails directing them to the online REDCap recruitment
      interface. Letters and emails state how names and contact information were
      obtained.
    notification_details:
      - Recruitment letters and emails contain REDCap links, access codes, and QR codes.
      - Follow-up phone calls may be made by research coordinators.
      - Participants may also be directed to the AI-READI website.
  - id: https://fairhub.io/datasets/2#notification-results
    name: Results notification
    description: >
      Participants receive selected visit results, CGM reports, and laboratory
      results through cards, encrypted email, or secure database access.
    notification_details:
      - Heart rate, blood pressure, and visual acuity results are provided before participants leave the visit.
      - Dexcom reports are provided after the 10-day home monitoring period.
      - Laboratory test results are sent or made available at yearly data release with normative values or reference ranges.

collection_consents:
  - id: https://fairhub.io/datasets/2#collection-consent-main
    name: Main study consent
    description: >
      Consent is obtained before study-specific questionnaires, study visits,
      device use, biospecimen collection, medical record extraction, and data
      sharing activities.
    consent_details:
      - E-consent is preferred to reduce visit duration.
      - In-person consent is available and participants are not excluded if they prefer paper consent.
      - Participants confirm understanding of study activities and requirements.
      - The consent form includes a table clarifying which information is public and which requires an application and approval process.
  - id: https://fairhub.io/datasets/2#collection-consent-hipaa
    name: HIPAA authorization
    description: >
      The IRB source describes HIPAA authorization for PHI accessed, obtained,
      used, or disclosed after enrollment, and a waiver or related approach for
      PHI used in pre-screening activities.
    consent_details:
      - UW Medicine HIPAA Authorization form is confirmed for relevant PHI.
      - Minimum necessary PHI assurances apply where HIPAA authorization is not obtained.

consent_revocations:
  - id: https://fairhub.io/datasets/2#consent-revocation
    name: Change of mind and withdrawal
    description: >
      The IRB source states that subjects will be reminded that they have the
      right to change their mind about study participation.
    revocation_details:
      - Consent materials include information about secondary use, banking, future sharing, and withdrawal where applicable.
      - The license agreement handles licensee termination separately from participant withdrawal.

participant_privacy:
  - id: https://fairhub.io/datasets/2#privacy-public-safe-harbor
    name: HIPAA Safe Harbor public release
    description: >
      The Nature Metabolism source states that the public set is stripped of
      PHI as defined by HIPAA via the Safe Harbor method, as well as sex and
      race/ethnicity.
    anonymization_method:
      - HIPAA Safe Harbor
      - Removal of PHI from public set
      - Removal of sex and race/ethnicity from public set
    reidentification_risk:
      - AI algorithms can infer individual patient characteristics and could facilitate individual-level identification.
      - Controlled-access variables include genomic and demographic information.
    privacy_techniques:
      - Strict license agreement
      - Data watermarking for public and controlled sets
      - Public and controlled-access separation
      - Data use agreements for controlled access
    data_linkage:
      - Identifiers and study data may be linked through subject codes and keys under restricted access.
  - id: https://fairhub.io/datasets/2#privacy-storage
    name: Confidential storage
    description: >
      The IRB source states that study data and identifiable information are
      kept on encrypted servers or in locked cabinets or rooms with restricted
      access at all sites.
    anonymization_method:
      - Deidentification for public data release
    privacy_techniques:
      - Encrypted servers
      - Locked cabinets or rooms
      - Restricted access
      - Authorized research personnel access only

data_protection_impacts:
  - id: https://fairhub.io/datasets/2#data-protection-ai-risk
    name: Re-identification and stigmatization risk controls
    description: >
      The Nature Metabolism source identifies downstream ethical risks from AI
      datasets, including inference of individual patient characteristics and
      re-identification, and describes license agreements, data watermarking,
      and public-set removal of sex and race/ethnicity to prevent
      stigmatization.
    impact_details:
      - Ethical, legal, and social implications are considered at every stage of the project cycle.
      - Public and controlled datasets have different access requirements.
      - Controlled-access data require institutional legal and privacy agreements.

participant_compensation:
  - id: https://fairhub.io/datasets/2#compensation-stipend
    name: Participant stipend and travel cost coverage
    description: >
      The IRB source states that participants receive a $200 stipend after the
      study team receives final data and returned devices, typically at least 2
      weeks after the visit, and that the payment is not prorated. The study
      covers reasonable parking, public transit, or rideshare fees related to
      the study visit.
    compensation_provided: true
    compensation_type:
      - stipend
      - parking
      - public transit
      - rideshare fees
    compensation_amount:
      - $200 stipend
      - Transportation costs covered if reasonable; subjects may incur costs exceeding $25
    compensation_rationale:
      - Compensation for participation and completion of device return.
      - Same type and amount for year 4 follow-up participants.

at_risk_populations:
  id: https://fairhub.io/datasets/2#at-risk-populations
  name: At-risk and specially considered populations
  description: >
    AI-READI includes adults with and without T2DM and intentionally recruits
    groups historically under-represented in diabetes research. Pregnant people,
    people with gestational diabetes, type 1 diabetes, adults older than 85, and
    minors are excluded in the IRB source. The NIH RePORTER and Nature
    Metabolism sources describe tribal consultation and engagement with the
    Native Biodata Consortium related to possible Native American cohort data
    generation.
  at_risk_groups_included: true
  special_protections:
    - IRB approval and reliance agreements.
    - Community Advisory Board input.
    - Ethical and equitable data collection and management practices.
    - Tribal consultation and co-learning about AI/AN data governance challenges.
    - Non-English-speaking participants are not initially enrolled until adequate translated materials and procedures are available.

is_deidentified:
  id: https://fairhub.io/datasets/2#deidentification
  name: Public dataset deidentification
  description: >
    Public-access AI-READI data are deidentified; the public set is stripped of
    PHI through the HIPAA Safe Harbor method and omits sex and race/ethnicity.
  identifiable_elements_present: true
  method: HIPAA Safe Harbor for public dataset release
  identifiers_removed:
    - Protected Health Information from public data
    - Sex from public data
    - Race and ethnicity from public data
  deidentification_details:
    - Controlled-access data retain sensitive elements under data-use agreements.
    - Public data are available with fewer access requirements.
    - Controlled data include 5-digit ZIP code, sex, race, ethnicity, genetic sequencing data, health records, medications, and traffic and accident reports.

maintainers:
  - id: https://fairhub.io/datasets/2#maintainer-ai-readi
    name: AI-READI Consortium
    description: >
      The AI-READI Consortium maintains the dataset, documentation, FAIRhub
      releases, study procedures, data sharing, and related standards work.
    maintainer_details:
      - Documentation is version-specific.
      - FAIRhub hosts dataset versions and access workflows.
      - Data Access Committee requirements for controlled access are being developed in the BMJ source.
  - id: https://fairhub.io/datasets/2#maintainer-university-washington
    name: University of Washington
    description: >
      University of Washington is named as licensor in the AI-READI License
      Agreement and as the NIH RePORTER organization for the project.
    maintainer_details:
      - Aaron Lee is listed as principal investigator in NIH RePORTER.
      - UW IRB approved the study with reliance agreements.
  - id: https://fairhub.io/datasets/2#maintainer-fairhub
    name: FAIRhub
    description: >
      FAIRhub is the data management, curation, and sharing platform for
      AI-READI dataset releases.
    maintainer_details:
      - Platform is currently in beta according to the FAIRhub source.
      - The repository is under review for potential modification in compliance with Administration directives according to FAIRhub and docs sources.

updates:
  id: https://fairhub.io/datasets/2#updates
  name: Annual and periodic dataset releases
  description: >
    The Nature Metabolism source states that data are released annually and
    each version is accessible through FAIRhub. The BMJ protocol states
    deidentified data are released approximately yearly in controlled-access
    and publicly accessible sets. The FAIRhub source lists versions 1.0.0,
    2.0.0, and 3.0.0.
  frequency: Approximately yearly while enrollment progresses.
  update_details:
    - Version 1.0.0 was released May 3, 2024 with DOI 10.60775/fairhub.1.
    - Version 2.0.0 was released Nov 8, 2024 with DOI 10.60775/fairhub.2.
    - Version 3.0.0 was released Nov 17, 2025 with DOI 10.60775/fairhub.3.
    - Documentation is maintained by dataset version.
    - Enrollment is planned through 2026.

retention_limit:
  id: https://fairhub.io/datasets/2#retention
  name: Data and biospecimen retention
  description: >
    Digital data are maintained through FAIRhub and controlled-access workflows.
    Biospecimens are stored at UAB CCTS for future ancillary studies, but the
    source documents state that sample availability is finite and request
    procedures and policies are under development.
  retention_period: Not specified in the source bundle.
  retention_details:
    - Biobanked samples will eventually be available to scientists according to procedures and policies in development.
    - License termination requires licensees to delete all data copies in their possession and control and cease use.
    - Future contact information may be retained for follow-up visits, additional studies, additional samples, or community advisory board invitations.

version_access:
  id: https://fairhub.io/datasets/2#version-access
  name: FAIRhub version access
  description: >
    FAIRhub lists current and all versions for the AI-READI dataset. The
    documentation source states that v2.0.0 is no longer accessible and directs
    readers to latest dataset v3.0.0.
  latest_version_doi: 10.60775/fairhub.3
  versions_available:
    - Version 1.0.0, DOI 10.60775/fairhub.1, May 3, 2024.
    - Version 2.0.0, DOI 10.60775/fairhub.2, Nov 8, 2024.
    - Version 3.0.0, DOI 10.60775/fairhub.3, Nov 17, 2025.
  version_details:
    - Public data are available after license agreement.
    - Full data are accessible by data use agreement.
    - Controlled-access requirements are handled by project data access processes.

variables:
  - id: https://fairhub.io/datasets/2#variable-diabetes-status
    variable_name: diabetes_status
    name: Diabetes health status
    description: >
      Screening and study variable identifying no diabetes, pre-diabetes,
      lifestyle-controlled diabetes, medication-controlled T2DM, or
      insulin-controlled T2DM.
    categories:
      - no diabetes
      - pre-diabetes or lifestyle-controlled diabetes
      - oral medication or non-insulin injectable medication controlled T2DM
      - insulin-dependent T2DM
    is_sensitive: true
    measurement_technique: Screening questionnaire, self-report, and electronic health record ICD-10 codes.
    quality_notes:
      - ICD-10 code R73.09 is used for pre-diabetes screening.
      - ICD-10 code E11.X is used for T2DM screening.
