      for recruitment balance. They are controlled-access variables and omitted
      from the public set.
    categories:
      - Asian
      - Black
      - Hispanic
      - White
    is_sensitive: true
    measurement_technique: Screening questionnaire and enrollment self-report.
  - id: https://fairhub.io/datasets/2#variable-biological-sex
