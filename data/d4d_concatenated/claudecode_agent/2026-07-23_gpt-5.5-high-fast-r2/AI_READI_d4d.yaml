id: https://fairhub.io/datasets/2
name: AI-READI
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >
  Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights
  (AI-READI) is a Bridge2AI data generation project that creates and shares a
  multimodal, AI-ready dataset for studying type 2 diabetes mellitus (T2DM),
  including pathogenesis and salutogenesis, the pathway from disease to health.
  The project enrolls adults with and without T2DM at three US study sites:
  University of Alabama at Birmingham in Birmingham, Alabama; University of
  California San Diego in San Diego, California; and University of Washington in
  Seattle, Washington. Data are collected through pre-visit questionnaires,
  one in-person visit, and 10 days of at-home monitoring. The protocol includes
  survey data, physical measurements, clinical laboratory tests, ECG, cognitive
  testing, monofilament testing, visual function testing, retinal imaging,
  continuous glucose monitoring, physical activity monitoring, home
  environmental sensing, biospecimen collection, medical records, and selected
  driving and accident records. Data are harmonized across sites, uploaded to
  FAIRhub, and released in public and controlled-access forms. The public set is
  deidentified and stripped of protected health information, sex, and
  race/ethnicity; controlled access includes more sensitive variables under
  data-use agreements. The source bundle reports FAIRhub versions 1.0.0, 2.0.0,
  and 3.0.0 and lists version 3.0.0 as the latest version.
