    name: Insulin-dependent T2DM
    description: >
      Participants with insulin-controlled or insulin-dependent T2DM.
    subpopulation_elements_present: true
    distribution:
      - Target approximately 1,000 participants.
  - id: https://fairhub.io/datasets/2#subpopulation-follow-up
    name: Longitudinal follow-up subgroup
    description: >
      Approximately 10% of the study population, recruited during years 1 and 2,
      is intended to be invited for a second research visit in year 4.
    subpopulation_elements_present: true

collection_timeframes:
  - id: https://fairhub.io/datasets/2#timeframe-project
    name: NIH project period
    description: >
      NIH RePORTER lists project start 2022-09-01T00:00:00 and project end
      2025-08-31T00:00:00 for project 1OT2OD032644-01.
    start_date: "2022-09-01"
    end_date: "2025-08-31"
    timeframe_details:
      - NIH RePORTER fiscal year 2022 award amount is 5026499.
  - id: https://fairhub.io/datasets/2#timeframe-enrollment
    name: Enrollment period
    description: >
      The BMJ Open protocol states that enrollment began on 18 July 2023 and
      will continue until 30 November 2026.
    start_date: "2023-07-18"
    end_date: "2026-11-30"
    timeframe_details:
      - Pilot enrollment occurred from 2023-07-18 to 2023-11-30.
      - Formal data collection began on 2023-12-01.
  - id: https://fairhub.io/datasets/2#timeframe-home-monitoring
    name: At-home monitoring period
    description: >
      Participants use a continuous glucose monitor, fitness tracker, and home
      environmental sensor for 10 days after the study visit.
    timeframe_details:
      - Dexcom G6 collects glucose measurements every 5 minutes for 10 days.
      - Garmin VivoSmart 5 and the environmental sensor collect at-home data for 10 days.
      - Participants return devices by overnight mail or in person.

data_collectors:
  - id: https://fairhub.io/datasets/2#collector-uab
    name: University of Alabama at Birmingham
    description: >
      UAB is one of three data collection sites and provides ophthalmology,
      epidemiology, medicine, data management, local specimen processing,
      recruitment coordination, and central biorepository functions.
    role: Data collection site and biorepository site
    collector_details:
      - Birmingham, Alabama study site.
      - UAB CCTS stores and processes selected biospecimens.
      - UAB coordinates stratified sampling and recruitment datasets in the IRB source.
  - id: https://fairhub.io/datasets/2#collector-ucsd
    name: University of California San Diego
    description: >
      UCSD is one of three data collection sites and participates in ophthalmic
      data collection, recruitment, consent, and participant visits.
    role: Data collection site
    collector_details:
      - San Diego, California study site.
      - UCSD translation services and native Spanish-speaking staff are discussed in the IRB source.
  - id: https://fairhub.io/datasets/2#collector-uw
    name: University of Washington
    description: >
      UW is one of three data collection sites, the lead institution in the NIH
      RePORTER source, the IRB reviewing institution, and the location for UW
      NORC laboratory testing and FAIRhub-related work.
    role: Lead institution and data collection site
    collector_details:
      - Seattle, Washington study site.
      - UW IRB approval number STUDY00016228 is reported in the BMJ source.
      - UW Nutrition and Obesity Research Center performs central laboratory testing.
  - id: https://fairhub.io/datasets/2#collector-ohsu
    name: Oregon Health and Science University
    description: >
      OHSU is responsible in the IRB workflow for downloading the selected
      recruitment dataset to an OHSU server, uploading it to REDCap to create
      patient-specific survey links, and participating in software and data
      activities.
    role: Recruitment data handling and project collaborator
  - id: https://fairhub.io/datasets/2#collector-adapt
    name: Adapt Inc.
    description: >
      Adapt Inc. is described in the IRB source as an SSAE16 SOC
      SecurityCertified and HIPAA-compliant printing and fulfillment service
      used to send recruitment letters containing patient-specific REDCap links.
    role: Recruitment letter fulfillment service
  - id: https://fairhub.io/datasets/2#collector-research-coordinators
    name: Clinical research coordinators and study staff
    description: >
      Research coordinators recruit, consent, administer surveys, perform study
      visits, collect ophthalmologic images, train participants on CGM, fitness
      tracker, and environmental sensor use, ensure device return, and upload
      and manage visit data.
    role: Participant-facing data collection staff
  - id: https://fairhub.io/datasets/2#collector-data-managers
    name: Site data managers
    description: >
      Data managers at each site oversee quality control before upload to
      FAIRhub and train research personnel using the Manual of Procedures and
      certification processes.
    role: Data quality control and training

collection_mechanisms:
  - id: https://fairhub.io/datasets/2#mechanism-redcap
    name: REDCap recruitment and data collection
    description: >
      REDCap is used for online recruitment, consent, questionnaires, and
      collecting patient-reported data plus selected clinical data from the
      visit, including medications assessment, vitals, visual acuity, contrast
      sensitivity, monofilament test results, and CBC test results.
    mechanism_details:
      - Personalized REDCap links, access codes, and QR codes are used in mailed and emailed invitations.
      - Participants can read program information, complete screening, download consent, request contact, and sign e-consent.
      - No study-specific questionnaires except screening are available until consent has been given.
  - id: https://fairhub.io/datasets/2#mechanism-in-person-visit
    name: In-person study visit
    description: >
      Participants complete a single in-person study encounter lasting about 2.5
      to 4 hours in the BMJ source and about 3 to 4 hours in the IRB source.
      Visits include vitals, blood and urine collection, ECG, cognitive testing,
      monofilament testing, visual function testing, retinal imaging, device
      training, and return-of-results activities.
    mechanism_details:
      - Visits may be split over a couple of days if requested by subjects.
      - Participants do not need to be fasting.
      - Small snacks and drinks are available during or after the visit.
  - id: https://fairhub.io/datasets/2#mechanism-questionnaires
    name: Questionnaires
    description: >
      Questionnaires collect eligibility, demographics, depression symptoms,
      diabetes distress, self-care, diet, ophthalmic history, substance use,
      general health, social determinants of health, access to healthcare, and
      current medications with RxNorm codes.
    mechanism_details:
      - CES-D-10 is used to screen for depressive symptoms.
      - PAID-5 collects problem areas in diabetes.
      - PhenX-selected surveys collect social determinants of health.
      - Marijuana use is not assessed for Alabama participants because it is illegal in Alabama.
  - id: https://fairhub.io/datasets/2#mechanism-ecg
    name: Electrocardiogram collection
    description: >
      A 12-lead ECG is performed using a Philips Pagewriter TC30 Cardiograph
      while the participant sits in a reclining chair or lies supine.
    mechanism_details:
      - Participant position is recorded at 0, 30, 60, or 90 degrees relative to supine.
      - ECG data are exported in XML format.
  - id: https://fairhub.io/datasets/2#mechanism-cognitive
    name: Cognitive testing
    description: >
      Montreal Cognitive Assessment is administered electronically on an iPad
      using the MoCA Duo application. Total possible score is 30, with higher
      values representing better performance.
    mechanism_details:
      - Exported values include total score, section subscores, Memory Index Score, and task completion times.
  - id: https://fairhub.io/datasets/2#mechanism-neuropathy
    name: Monofilament peripheral neuropathy testing
    description: >
      Peripheral neuropathy is assessed using a 10 g filament at three locations
      on each foot, 10 times per location, with the participant's eyes closed
      while answering whether they feel the filament.
  - id: https://fairhub.io/datasets/2#mechanism-vision
    name: Visual function testing
    description: >
      Photopic and mesopic visual acuity and contrast sensitivity are measured
      for right and left eyes separately, with autorefraction data collected
      using Topcon KR 800.
    mechanism_details:
      - Electronic Visual Acuity tester is used for photopic visual acuity.
      - Mesopic acuity is measured through a 2.0 neutral density filter.
      - Mars chart is used for photopic letter contrast sensitivity.
  - id: https://fairhub.io/datasets/2#mechanism-retinal-imaging
    name: Retinal imaging
    description: >
      Multimodal retinal imaging captures both eyes using multiple devices and
      modalities, including fundus photography, OCT, OCTA, and FLIO.
    mechanism_details:
      - Aurora IQ collects undilated macula- and disc-centered color fundus photos.
      - EIDON widefield truecolor confocal fundus system collects central, nasal, temporal, infrared, autofluorescence, and mosaic images.
      - Spectralis HRA collects OCT and OCTA scans.
      - Topcon Maestro2 and Triton DRI OCT collect OCT and OCTA scans.
      - Cirrus 5000 collects optic disc and macula OCT and OCTA.
      - FLIO collects macula-centered fluorescence lifetime images.
  - id: https://fairhub.io/datasets/2#mechanism-cgm
    name: Continuous glucose monitoring
    description: >
      Dexcom G6 continuous glucose monitors collect blood glucose measurements
      in mg/dL every 5 minutes during a 10-day at-home monitoring period.
    mechanism_details:
      - Existing Dexcom G6 users may place an additional study sensor or share Dexcom Clarity data.
      - Participants may optionally share up to 90 days of prior glucose values, producing up to 100 days total.
      - Participants are masked to Dexcom CGM results during the monitoring period in the BMJ source.
  - id: https://fairhub.io/datasets/2#mechanism-fitness
    name: Physical activity monitoring
    description: >
      Garmin VivoSmart 5 fitness trackers collect steps, heart rate, sleep
      duration, oxygen saturation, and related activity measures during the
      10-day at-home monitoring period.
    mechanism_details:
      - The Nature Metabolism source also lists respiration rate, activity type, stress level, and sleep phases.
      - Garmin data are exported in FIT format and converted to mHealth standard.
  - id: https://fairhub.io/datasets/2#mechanism-environmental
    name: Home environmental sensing
    description: >
      A custom environmental sensor from the Karalis Johnson Retina Center at
      the University of Washington collects home environmental parameters for
      10 days.
    mechanism_details:
      - Variables include ambient temperature, relative humidity, NO and NO2, volatile organic compounds, PM1.0, PM2.5, PM4, PM10, and 11 multispectral light measurements.
      - The device does not capture video, audio, or GPS location and is not synced with participant-owned devices.
  - id: https://fairhub.io/datasets/2#mechanism-biospecimen
    name: Blood and urine specimen collection
    description: >
      Non-fasting blood and urine are collected during the study visit for
      laboratory testing, biobanking, and future studies. The BMJ source states
      53 mL of blood; the IRB source describes approximately 50-60 mL.
    mechanism_details:
      - CBC is performed on fresh whole blood at local CLIA-certified laboratories.
      - UW NORC tests stored frozen plasma, serum, whole blood, and urine samples.
      - UAB CCTS stores plasma, serum, buffy coats, PBMCs, PAXgene RNA samples, and related materials.
  - id: https://fairhub.io/datasets/2#mechanism-records
    name: Medical, driving, and accident records
    description: >
      Medical records are used for pre-screening and study data on general
      health, eye health, medical and surgical history, diabetes, medications,
      laboratory records, and previous relevant imaging. The IRB source also
      describes collecting car accident and traffic ticket information from the
      prior three years and Department of Licensing records.

acquisition_methods:
  - id: https://fairhub.io/datasets/2#acquisition-direct-subject
    name: Direct participant-reported data
    description: >
      Participants directly report demographic information, medical history,
      diabetes status and treatment, health behaviors, general health, social
      determinants of health, medications, and vision-related information
      through questionnaires.
    was_directly_observed: false
    was_reported_by_subjects: true
    was_inferred_derived: false
    was_validated_verified: false
    acquisition_details:
      - Questionnaires may be completed electronically or on paper before, during, or after the visit.
      - Paper questionnaires may be brought to the visit or mailed back with devices.
  - id: https://fairhub.io/datasets/2#acquisition-clinical-observation
    name: Direct clinical measurements
    description: >
      Study staff directly observe or measure vitals, physical measurements,
      vision testing, monofilament testing, ECG, cognitive testing, retinal
      imaging, and biospecimen collection during study visits.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details:
      - Blood pressure is measured twice separated by 2 minutes.
      - Height, weight, waist, and hip circumference support calculated waist-hip ratio and BMI.
      - Retinal imaging technicians are trained to detect selected life- or vision-threatening incidental findings.
  - id: https://fairhub.io/datasets/2#acquisition-device
    name: Device-generated data
    description: >
      Devices generate retinal imaging files, ECG XML, MoCA CSV, CGM CSV,
      Garmin FIT files converted to mHealth, and environmental sensor CSV data.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details:
      - Some retinal imaging files are converted from proprietary FDA or SDT formats to DICOM.
      - CGM data may be collected through study Dexcom sensors or Dexcom Clarity sharing for existing users.
  - id: https://fairhub.io/datasets/2#acquisition-record-derived
    name: Record-derived data
    description: >
      Electronic health records are used for recruitment, eligibility
      pre-screening, and data extraction, while driving and accident records are
      obtained from the Department of Licensing.
    was_directly_observed: false
    was_reported_by_subjects: false
    was_inferred_derived: true
    was_validated_verified: false
    acquisition_details:
      - ICD-10 codes R73.09 and E11.X identify pre-diabetes and T2DM candidates.
      - Names, addresses, age, sex, race/ethnicity, phone number, email, and diabetes status are used for recruitment workflows.

direct_collection:
  - id: https://fairhub.io/datasets/2#direct-collection-participants
    name: Direct participant collection
    description: >
      Most study data are collected directly from participants, their specimens,
      or devices they are asked to use.
    is_direct: true
    collection_details:
      - In-person visit data are collected directly at UAB, UCSD, and UW.
      - At-home CGM, fitness tracking, and environmental sensing are collected using study devices or optional device data sharing.
  - id: https://fairhub.io/datasets/2#direct-collection-records
    name: Indirect record collection
    description: >
      Electronic medical records and Department of Licensing data provide
      indirect data sources for pre-screening and selected study variables.
    is_direct: false
    collection_details:
      - Medical records support recruitment, eligibility, and study data extraction.
      - Driving and accident records are collected as part of the broader dataset.

raw_data_sources:
  - id: https://fairhub.io/datasets/2#raw-source-ehr
    name: Electronic health records
    description: >
      EHR systems at UAB, UCSD, and UW are screened to identify patients aged 40
      or older with relevant encounters between 2020 and 2025 and to extract
      selected medical history and clinical variables.
    source_description: Electronic health record data from participating health systems.
    source_type:
      - medical records
      - recruitment source
      - clinical source
    access_details: Accessed by study teams for recruitment, screening, and approved research data extraction.
    raw_data_format:
      - clinical record
  - id: https://fairhub.io/datasets/2#raw-source-redcap
    name: REDCap surveys and clinical forms
    description: >
      REDCap stores recruitment, consent, questionnaires, and selected visit
      data collected electronically.
    source_description: REDCap-based recruitment, consent, questionnaire, and visit data.
    source_type:
      - survey
      - clinical form
    access_details: Study-managed REDCap interfaces are used by participants and study staff.
    raw_data_format:
      - REDCap export
      - CSV
  - id: https://fairhub.io/datasets/2#raw-source-devices
    name: Medical and monitoring devices
    description: >
      ECG, MoCA, retinal imaging devices, Dexcom CGM, Garmin fitness trackers,
      and environmental sensors produce raw or exported study files.
    source_description: Device-generated study data from in-clinic and at-home collection.
    source_type:
      - device
      - imaging
      - sensor
    access_details: Data are exported by site staff and uploaded to FAIRhub after quality control and transformation when needed.
    raw_data_format:
      - XML
      - CSV
      - DICOM
      - FDA
      - SDT
      - FIT
  - id: https://fairhub.io/datasets/2#raw-source-labs
    name: Laboratory testing and biospecimens
    description: >
      Clinical laboratory tests and biobanked specimens originate from blood and
      urine collected during the visit.
    source_description: Blood, urine, and derivative clinical laboratory and biorepository sources.
    source_type:
      - biospecimen
      - laboratory
    access_details: Local CLIA laboratories, UW NORC, and UAB CCTS perform testing, processing, storage, or biobanking.
    raw_data_format:
      - CSV
      - biospecimen
  - id: https://fairhub.io/datasets/2#raw-source-driving
    name: Driving and accident records
    description: >
      The IRB source states that car accident and traffic ticket data from the
      prior three years are collected, including Department of Licensing data.
    source_description: Driving, accident, and traffic records.
    source_type:
      - administrative records
    access_details: Obtained from the Department of Licensing as described in the IRB source.
    raw_data_format:
      - record extract

raw_sources:
  - id: https://fairhub.io/datasets/2#raw-data-proprietary-retinal
    name: Proprietary retinal image exports
    description: >
      Some retinal imaging devices export proprietary FDA or SDT files that are
      converted to DICOM before upload or release.
    raw_data_details:
      - Maestro2 and Triton DRI OCT export FDA files converted to DICOM.
      - FLIO exports SDT files converted to DICOM.
  - id: https://fairhub.io/datasets/2#raw-data-fit
    name: Garmin FIT exports
    description: >
      Garmin VivoSmart 5 data are exported in FIT format and converted to the
      mHealth standard for the dataset.
    raw_data_details:
      - Variables include steps, heart rate, sleep duration, oxygen saturation, and related activity measures.
  - id: https://fairhub.io/datasets/2#raw-data-csv
    name: CSV exports
    description: >
      CSV exports include CGM data, environmental sensor data, MoCA Duo data,
      clinical laboratory data, and other tabular or time-series data.
    raw_data_details:
      - CGM records blood glucose every 5 minutes.
      - Environmental sensor records air quality, light, temperature, and humidity variables.
      - NORC laboratory testing is provided in CSV format.

preprocessing_strategies:
  - id: https://fairhub.io/datasets/2#preprocessing-harmonization
    name: Multi-site harmonization
    description: >
      AI-READI harmonizes data across UAB, UCSD, and UW through standardized
      operating procedures, common protocols, central data management, and
      FAIRhub upload workflows.
    preprocessing_details:
      - Research personnel are trained by the UAB data manager.
      - A detailed Manual of Procedures is used for reference.
      - Successful coordinator certification is required.
      - Coordinators administer all protocol elements to at least three volunteer practice subjects before participant enrollment.
  - id: https://fairhub.io/datasets/2#preprocessing-standards
    name: Mapping to standards
    description: >
      Data are mapped to applicable standards to support AI-readiness and
      interoperability.
    preprocessing_details:
      - Clinical data are mapped to the Observational Medical Outcomes Partnership Common Data Model.
      - Retinal imaging data are mapped to DICOM.
      - Garmin FIT files are converted to the mHealth standard.
      - Current medications use RxNorm codes.
      - Diabetes identification uses ICD-10 codes R73.09 and E11.X.
      - The Clinical Dataset Structure is being developed as a simple way to organize clinical research datasets and structured metadata.
  - id: https://fairhub.io/datasets/2#preprocessing-image-conversion
    name: Retinal image conversion
    description: >
      Retinal images are exported from imaging devices in raw formats and some
      images are converted to DICOM before upload to external AI-READI data
      storage or release.
    preprocessing_details:
      - FDA files are converted to DICOM.
      - SDT files are converted to DICOM.
      - DICOM is used for image standardization.
  - id: https://fairhub.io/datasets/2#preprocessing-biospecimen
    name: Biospecimen processing
    description: >
      Blood and urine samples undergo local and central processing for clinical
      testing, biobanking, and future research uses.
    preprocessing_details:
      - Plasma, serum, and buffy coats are processed locally using standardized operating procedures.
      - Whole blood, plasma, serum, and urine for central assays are batch-shipped to UW NORC.
      - Plasma, serum, and buffy coats from UW and UCSD are batch-shipped to UAB CCTS.
      - Genomic DNA extractions from stored buffy coats are performed at UAB CCTS.
      - CPT tubes for PBMC isolation are centrally processed at UAB CCTS.
      - PAXgene RNA vacutainers from UW and UCSD are shipped overnight to UAB CCTS.
  - id: https://fairhub.io/datasets/2#preprocessing-public-deidentification
    name: Public dataset deidentification
    description: >
      The public set is stripped of PHI using the HIPAA Safe Harbor method and
      also omits sex and race/ethnicity to reduce stigmatization risk.
    preprocessing_details:
      - Public-access data are separated from controlled-access variables.
      - Sensitive data remain under controlled access and data-use agreements.
      - Data watermarking is used for public and controlled sets according to the Nature Metabolism source.

cleaning_strategies:
  - id: https://fairhub.io/datasets/2#cleaning-site-qc
    name: Site quality control before FAIRhub upload
    description: >
      The data manager at each data site is responsible for quality control of
      all data before upload to FAIRhub.
    cleaning_details:
      - Practice subject procedures occur before enrollment.
      - Data validation checks occur in REDCap.
      - Duplicate measurements support quality assurance for measurements such as blood pressure.
      - Common protocols and equipment reduce cross-site variation.
  - id: https://fairhub.io/datasets/2#cleaning-pilot
    name: Pilot enrollment process refinement
    description: >
      Preliminary pilot enrollment occurred from 2023-07-18 to 2023-11-30 to
      ensure coordinator familiarity before formal data collection.
    cleaning_details:
      - Pilot data were included in the first released dataset made available in May 2024.
      - The protocol notes ongoing monitoring and adjustment of recruitment composition.

labeling_strategies:
  - id: https://fairhub.io/datasets/2#labeling-diabetes-severity
    name: Diabetes severity group assignment
    description: >
      Participants are labeled by diabetes severity group using medical record
      screening, diagnosis codes, and self-reported status and treatment.
    labeling_details:
      - No diabetes group lacks R73.09 or E11.X encounters in source population screening.
      - Pre-diabetes uses ICD-10 code R73.09.
      - T2DM uses ICD-10 code E11.X.
      - Treatment groups include lifestyle control, oral or non-insulin-injectable medication control, and insulin dependence.
  - id: https://fairhub.io/datasets/2#labeling-demographics
    name: Self-reported demographic groups
    description: >
      Race and ethnicity are self-reported at screening and enrollment and used
      for recruitment balance and controlled-access variables.
    labeling_details:
      - Target race/ethnicity categories in the protocol are Asian, Black, Hispanic, and White.
      - Biological sex categories in the protocol are male and female.

sensitive_elements:
  - id: https://fairhub.io/datasets/2#sensitive-phi
    name: Protected health information
    description: >
      PHI is used for recruitment, screening, and study data collection,
      including identifiable healthcare record information, direct identifiers,
      contact information, and clinical records.
    sensitive_elements_present: true
    sensitivity_details:
      - Name, MRN, DOB, age, sex, race/ethnicity, address, phone number, driver license number, and email are listed in the IRB source.
      - Public data are stripped of PHI using HIPAA Safe Harbor.
  - id: https://fairhub.io/datasets/2#sensitive-genomic
    name: Genomic and biospecimen data
    description: >
      Genomic sequencing data, buffy coats, genomic DNA, PBMCs, PAXgene RNA,
      and biospecimens are sensitive elements handled under controlled access
      and repository policies.
    sensitive_elements_present: true
    sensitivity_details:
      - Genomic data sharing is listed as an applicable supplement in the IRB protocol.
      - Whole genome sequencing is discussed as a possible biospecimen research activity.
  - id: https://fairhub.io/datasets/2#sensitive-demographics
    name: Sex, race, ethnicity, and ZIP code
    description: >
      Sex, race, ethnicity, and 5-digit ZIP code are controlled-access variables
      in the documentation source.
    sensitive_elements_present: true
    sensitivity_details:
      - The public set omits sex and race/ethnicity to prevent stigmatization of findings.
  - id: https://fairhub.io/datasets/2#sensitive-records
    name: Medical, medication, traffic, and accident records
    description: >
      Past health records, medications, traffic reports, and accident reports
      are controlled-access data elements described in the dataset
      documentation.
    sensitive_elements_present: true
  - id: https://fairhub.io/datasets/2#sensitive-home-sensor
    name: At-home device data
    description: >
      CGM, fitness tracker, and environmental sensor data are collected in the
      home; the selected fitness and environmental devices do not record video,
      audio, or GPS and are not synced with participant-owned devices.
    sensitive_elements_present: true

known_biases:
  - id: https://fairhub.io/datasets/2#bias-volunteer
    name: Volunteer selection bias
    description: >
      The BMJ protocol states that participants are volunteers, creating
      selection bias that may limit generalizability among people not
      represented in the study population.
    bias_description: Volunteer participation may not represent non-volunteer populations.
    mitigation_strategy: >
      Recruit across three geographically distinct sites and monitor group
      balance during recruitment.
  - id: https://fairhub.io/datasets/2#bias-language
    name: English-language participation constraint
    description: >
      Participants are required to speak, read, and understand English in the
      BMJ protocol. The IRB source notes that non-English-speaking participants
      will not initially be enrolled, with Spanish translation considered if
      Hispanic recruitment goals are not met.
    bias_description: English proficiency may affect Hispanic and Asian recruitment.
    mitigation_strategy: >
      The IRB source describes possible Spanish translation and native
      Spanish-speaking research staff at UCSD if recruitment goals require it.
  - id: https://fairhub.io/datasets/2#bias-site-demographics
    name: Regional recruitment variation
    description: >
      Each site is expected to recruit all groups but local demographics affect
      proportions; UW concentrates on Asian, Hispanic, and Black participants,
      UCSD on Hispanic, Asian, and Black participants, and UAB on Black,
      Hispanic, and Asian participants.
    bias_description: Geographic site composition may shape subgroup representation.
    mitigation_strategy: >
      The protocol uses wave-based recruitment and under- or over-sampling to
      adjust for observed participation characteristics.

known_limitations:
  - id: https://fairhub.io/datasets/2#limitation-ongoing-enrollment
    name: Ongoing enrollment and preliminary releases
    description: >
      Enrollment continues until 2026, and early or periodic releases may not
      have achieved balanced distribution across groups.
    limitation_description: Pilot and interim versions may not be fully balanced.
    scope_impact: >
      Analyses of early versions should consider incomplete recruitment and
      release-specific participant composition.
    recommended_mitigation: >
      Use version-specific documentation and consider controlled-access
      metadata and study dashboard information when assessing representativeness.
  - id: https://fairhub.io/datasets/2#limitation-biorepository-finite
    name: Finite biospecimen availability
    description: >
      The BMJ protocol states that the biorepository has a finite number of
      samples to share, and procedures for reviewing and prioritizing written
      requests will be developed before the biorepository is complete.
    limitation_description: Biospecimens cannot be distributed without limit.
    scope_impact: >
      Ancillary studies depending on biospecimens may require prioritization
      and may not all be feasible.
    recommended_mitigation: >
      Follow project biorepository request and prioritization procedures when
      available.
  - id: https://fairhub.io/datasets/2#limitation-pbmc-processing-time
    name: PBMC processing time variation
    description: >
      Centralized PBMC processing at UAB CCTS introduces an additional time
      variable for isolation and cryopreservation for participants recruited at
      UW and UCSD.
    limitation_description: PBMC processing timing differs by site.
    scope_impact: >
      Analyses using PBMC-derived data may need to consider processing and
      shipment timing.
    recommended_mitigation: >
      Account for collection site and specimen handling timelines in downstream
      analyses.
  - id: https://fairhub.io/datasets/2#limitation-lab-lag
    name: Laboratory result return lag
    description: >
      The IRB source states laboratory results may not be available within a
      clinically actionable timeline because data are uploaded yearly.
    limitation_description: Laboratory data return may lag participant visits.
    scope_impact: >
      Participant-facing return of lab results is delayed and not curated by the
      study team.
    recommended_mitigation: >
      Participants are directed to discuss results with primary care providers
      or specialists and reference ranges are provided.
  - id: https://fairhub.io/datasets/2#limitation-not-clinical-care
    name: Not for clinical treatment decisions
    description: >
      The license agreement states that licensees must not make clinical
      treatment decisions based on the data because it is intended solely as a
      research resource.
    limitation_description: Data are not validated as a clinical treatment tool.
    scope_impact: >
      AI/ML models or analyses produced from the data require independent
      clinical validation before clinical use.
    recommended_mitigation: >
      Restrict use to research unless separately validated and approved for
      clinical contexts.

anomalies:
  - id: https://fairhub.io/datasets/2#anomaly-version-access
    name: Version 2 documentation no longer accessible
    description: >
      The documentation source is for dataset v2.0.0 and states that this
      version is no longer accessible, directing readers to latest dataset
      v3.0.0. FAIRhub still lists v2.0.0 among all versions.
    anomaly_details:
      - Documentation content describes v2.0.0 while FAIRhub lists v3.0.0 as latest.
  - id: https://fairhub.io/datasets/2#anomaly-target-count
    name: Target enrollment count differs across sources
    description: >
      The BMJ, Nature Metabolism, documentation, and FAIRhub sources describe a
      target of 4,000 participants, while the NIH RePORTER abstract says
      4,000+ and the IRB protocol text describes 4,600 people in some passages.
    anomaly_details:
      - Use source-specific context when interpreting target counts.
  - id: https://fairhub.io/datasets/2#anomaly-name-variant
    name: AI-READI expansion variant
    description: >
      The NIH RePORTER and IRB sources use "Artificial Intelligence Ready and
      Exploratory Atlas for Diabetes Insights" while publication and
      documentation sources use "Artificial Intelligence Ready and Equitable
      Atlas for Diabetes Insights."
    anomaly_details:
      - Current publication and documentation title uses Equitable.

file_collections:
  - id: https://fairhub.io/datasets/2#files-all
    name: FAIRhub dataset files
    description: >
      FAIRhub lists the dataset as 2.01 TB with 165,051 files under the Health
      Data License.
    file_count: 165051
  - id: https://fairhub.io/datasets/2#files-survey
    name: Survey and questionnaire files
    description: >
      Files include screening, demographic, CES-D-10, PAID-5, diabetes
      self-care, diet, ophthalmic survey, substance use, general health, social
      determinants of health, and medication data.
  - id: https://fairhub.io/datasets/2#files-clinical
    name: Clinical measurement files
    description: >
      Files include height, weight, waist and hip circumference, BMI and
      waist-hip ratio derivations, blood pressure, heart rate, monofilament,
      visual acuity, contrast sensitivity, autorefraction, ECG, and cognitive
      testing data.
  - id: https://fairhub.io/datasets/2#files-retinal
    name: Retinal imaging files
    description: >
      Files include DICOM retinal imaging data from Aurora IQ, EIDON,
      Spectralis HRA OCT/OCTA, Maestro2, Triton DRI OCT, Cirrus 5000, and FLIO,
      with some proprietary FDA or SDT files converted to DICOM.
  - id: https://fairhub.io/datasets/2#files-cgm
    name: Continuous glucose monitoring files
    description: >
      Files include Dexcom G6 continuous glucose monitor readings collected
      every 5 minutes, exported in CSV format.
  - id: https://fairhub.io/datasets/2#files-wearable
    name: Wearable activity files
    description: >
      Files include Garmin VivoSmart 5 activity monitoring data exported as FIT
      files and converted to mHealth standard.
  - id: https://fairhub.io/datasets/2#files-environmental
    name: Home environmental sensor files
    description: >
      Files include CSV outputs from the custom environmental sensor recording
      temperature, humidity, air quality, particulate matter, volatile organic
      compounds, nitrogen oxides, and light measurements.
  - id: https://fairhub.io/datasets/2#files-lab
    name: Laboratory and biospecimen metadata files
    description: >
      Files include clinical lab results from blood and urine testing, CBC,
      EDTA plasma tests, serum tests, whole blood tests, urine creatinine and
