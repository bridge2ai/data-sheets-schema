  - id: https://fairhub.io/datasets/2#files-records
    name: Medical, medication, driving, and accident record files
    description: >
      Controlled-access files include past health records, medications, and
      traffic and accident reports, as described in the documentation and IRB
      source.

distribution_formats:
  - id: https://fairhub.io/datasets/2#format-dicom
