purposes:
  - id: https://fairhub.io/datasets/2#purpose-1
    name: Generate an AI-ready T2DM flagship dataset
    description: >
      Create and publicly share an ethically sourced, well-defined, multimodal,
      AI-ready dataset for T2DM research as part of the NIH Common Fund
      Bridge2AI program.
  - id: https://fairhub.io/datasets/2#purpose-2
    name: Study T2DM pathogenesis and salutogenesis
    description: >
      Enable AI/ML research into T2DM pathogenesis and salutogenesis, including
      disease trajectories and pathways from disease toward health resilience.
  - id: https://fairhub.io/datasets/2#purpose-3
    name: Support pseudotime manifold analysis
    description: >
      Collect complex, multimodal, cross-sectional data from participants with
      differing disease severity so downstream researchers can use
      dimensionality reduction and pseudotime manifold analysis to reconstruct
      temporal atlases of T2DM development and reversal toward health.
  - id: https://fairhub.io/datasets/2#purpose-4
    name: Establish standards for AI-ready health data
    description: >
      Establish standards, best practices, guidelines, and documentation for
      collecting, preparing, sharing, and maintaining medical and health
      datasets targeted for AI/ML applications.
  - id: https://fairhub.io/datasets/2#purpose-5
    name: Train a diverse AI and biomedical workforce
    description: >
      Increase access to and quality of AI/ML research by recruiting and
      training personnel, including through a year-long AI-READI research
      internship with data science training, didactic lectures, and mentored
      research.

tasks:
  - id: https://fairhub.io/datasets/2#task-1
    name: Multimodal AI/ML modeling for T2DM
    description: >
      Train and evaluate AI/ML models using harmonized survey, clinical,
      imaging, wearable, environmental, biospecimen, and record-derived data
      relevant to T2DM.
  - id: https://fairhub.io/datasets/2#task-2
    name: Disease trajectory analysis
    description: >
      Analyze disease trajectories across no diabetes, pre-diabetes or
      lifestyle-controlled diabetes, medication-controlled T2DM, and
      insulin-controlled T2DM.
  - id: https://fairhub.io/datasets/2#task-3
    name: Equitable model development
    description: >
      Support development of less biased models through recruitment balanced by
      race/ethnicity, biological sex, and diabetes severity rather than matching
      the demographic distribution of the US population.
  - id: https://fairhub.io/datasets/2#task-4
    name: Multidomain biomarker discovery
    description: >
      Support discovery of relationships among biomarkers, clinical measures,
      retinal imaging, CGM, activity, environmental exposures, and social
      determinants of health.
  - id: https://fairhub.io/datasets/2#task-5
    name: FAIRification and data standards development
    description: >
      Demonstrate approaches for mapping clinical data to the OMOP Common Data
      Model, retinal imaging to DICOM, wearable data to mHealth standards, and
      clinical research datasets to the Clinical Dataset Structure.

addressing_gaps:
  - id: https://fairhub.io/datasets/2#gap-1
    name: Lack of diverse AI-ready T2DM datasets
    description: >
      The source documents identify a major barrier to AI in T2DM research: a
      lack of diverse, well-characterized, high-quality, large, multimodal
      datasets that are ready for AI model training.
  - id: https://fairhub.io/datasets/2#gap-2
    name: Under-representation in diabetes research
    description: >
      AI-READI addresses under-representation in past T2DM research by planning
      equal recruitment across Asian, Black, Hispanic, and White participants
      and across diabetes severity groups.
  - id: https://fairhub.io/datasets/2#gap-3
    name: Limited data for salutogenesis
    description: >
      The dataset is designed around salutogenesis, enabling study of the
      pathway from T2DM to health rather than only the progression from health
      toward disease.
  - id: https://fairhub.io/datasets/2#gap-4
    name: Fragmented standards for AI-ready clinical data
    description: >
      AI-READI develops and applies standards, guidelines, and tooling to reduce
      the difficulty of preparing and sharing clinical research data for AI.
  - id: https://fairhub.io/datasets/2#gap-5
    name: Ethical risks in AI data reuse
    description: >
      The project integrates ethical, legal, and social implications throughout
      the data lifecycle and documents restrictions intended to prevent
      re-identification, stigmatization, and misuse.

