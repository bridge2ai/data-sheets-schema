sampling_strategies:
  - id: https://fairhub.io/datasets/2#sampling-triple-balanced
    name: Triple-balanced recruitment
    description: >
      Recruitment is designed to achieve approximately equal distribution by
      self-reported race/ethnicity, T2DM presence and severity, and biological
      sex. The IRB source describes dual balancing in an earlier framing, while
      the BMJ protocol describes triple balancing across race/ethnicity, T2DM
      severity, and biological sex.
    is_sample: true
    is_random: false
    source_data:
      - Electronic health records at UAB, UCSD, and UW
      - Self-reported race and ethnicity at screening and enrollment
      - ICD-10 diagnosis codes R73.09 and E11.X
    is_representative: false
    why_not_representative:
      - >
        The design intentionally recruits equal numbers in selected groups
        rather than mirroring the US population distribution.
      - >
        Participants are volunteers, producing volunteer selection bias that may
        limit generalizability to people not represented in the study
        population.
      - >
        English-language eligibility may create challenges for recruiting some
        Hispanic or Asian participants.
    strategies:
      - Recruit adults aged 40 and older from three health systems.
      - Use waves of invitations to manage staffing and sample balance.
      - Monitor diversity and inclusion during recruitment.
      - Under-sample and over-sample groups as needed to maintain balance.
      - Send personalized hardcopy letters and email invitations with REDCap links, access codes, and QR codes.
      - Use follow-up phone calls for people who do not respond or who initiate contact.
      - Consider clinics, community centers, clinician referrals, registries, databases, or self-reports if recruitment is difficult.
  - id: https://fairhub.io/datasets/2#sampling-race-ethnicity
    name: Race and ethnicity balancing
    description: >
      The target cohort includes approximately equal recruitment of Asian,
      Black, Hispanic, and White participants, with the IRB source describing a
      goal of about 1,000 subjects from each group.
    is_sample: true
    is_random: false
    is_representative: false
    strategies:
      - UW concentrates on Asian, Hispanic, and Black recruitment.
      - UCSD prioritizes Hispanic, Asian, and Black recruitment.
      - UAB prioritizes Black, Hispanic, and Asian recruitment.
      - All sites recruit White participants.
  - id: https://fairhub.io/datasets/2#sampling-diabetes-severity
    name: Diabetes severity balancing
    description: >
      The study recruits approximately 1,000 participants in each of four
      diabetes severity groups: no type 2 diabetes, pre-diabetes or
      lifestyle-controlled diabetes, oral or non-insulin-injectable medication
      controlled T2DM, and insulin-dependent T2DM.
    is_sample: true
    is_random: false
    is_representative: false
    strategies:
      - Use ICD-10 code R73.09 for pre-diabetes identification.
      - Use ICD-10 code E11.X for T2DM identification.
      - Use self-report and clinical data to support group assignment.

