name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: 'Bridge2AI-Voice is a Precision Public Health Grand Challenge project in the NIH Common Fund Bridge2AI Program. The dataset is a large, ethically sourced and demographically diverse voice dataset linked to health information. It includes derived voice-recording products, such as spectrograms and other acoustic features, plus participant metadata including clinical diagnoses, validated questionnaires, demographics, confounders, and other health information. The project aims to create a flagship, standardized dataset of 10,000 voices linked to health information to fuel research and discovery in voice biomarkers. The broader study protocol anticipates collection of up to 30,000 participants across phases, with adult and pediatric cohorts and disease categories covering voice disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders, and pediatric voice and speech disorders. Public/registered releases provide lower-risk derived
  features rather than raw audio. Raw audio is available only through controlled access because voice recordings can create re-identification and misuse risks.

  '
