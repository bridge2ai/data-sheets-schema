    '
third_party_sharing:
- id: voice:third_party_sharing:broad
  is_shared: true
  description: 'The dataset is distributed broadly to individuals outside the entity that created it through registered or credentialed access for lower-risk derived data and controlled access for raw audio.

    '
license_and_use_terms:
  id: voice:license:registered
  license_terms:
  - 'Users must agree to the Bridge2AI Voice Registered Access License and Bridge2AI Voice Registered Access Agreement. The PhysioNet v3.0.0 access policy says only credentialed users who sign the DUA can access the files, with no required training.

    '
  - 'The Data Transfer and Use Agreement states that the data may be used only for the authorized project by authorized persons with a need to use the data. It prohibits unauthorized disclosure or third-party access, requires administrative, technical, and physical safeguards, requires compliance with applicable laws and professional standards, encourages open-access publication of results, requires acknowledgement of the provider, provides the data as-is, disclaims warranties, requires secure destruction or return at termination except one archival copy for records retention/research integrity where needed, and requires adherence to PhysioNet or other data-distribution requirements.

    '
  data_use_permission:
  - general_research_use
  contact_person: DACO@b2ai-voice.org
ip_restrictions:
  id: voice:ip_restrictions:agreement
  restrictions:
  - 'Users acknowledge that the data may be protected by copyright and other rights. Duplication reasonably required for the research project is permitted, sale of all or part of the data is not permitted, no intellectual property rights in the data are transferred, users may not make intellectual-property claims on the data, and users may not use IP protection in ways that prevent or block access to any data element or conclusions drawn directly from the data.

    '
regulatory_restrictions:
  id: voice:regulatory:dua
  regulatory_restrictions:
  - 'The DUA states that the data are Personally Identifiable Information under the agreement terms, are covered under a Certificate of Confidentiality, and must be protected against unauthorized use, disclosure, contact with participants without appropriate approvals, and legally compelled disclosure where notice to the provider is allowed.

    '
  hipaa_compliant: compliant
  other_compliance:
  - 'The DUA references applicable laws, IRB approval where required, state and local laws, institutional policies, Certificate of Confidentiality obligations, and PhysioNet requirements. The documentation states no export controls apply.

    '
  confidentiality_level: restricted
  governance_committee_contact: DACO@b2ai-voice.org
maintainers:
- id: voice:maintainer:physionet
  role: academic_institution
  maintainer_details:
  - 'PhysioNet states that the dataset is maintained by the MIT Laboratory for Computational Physiology.

    '
- id: voice:maintainer:nih
  role: government_agency
  maintainer_details:
  - 'The healthsheet states that the dataset is supported by NIH through the Bridge2AI project.

    '
- id: voice:maintainer:healthdatanexus
  role: academic_institution
  maintainer_details:
  - 'The healthsheet states that Health Data Nexus is maintained by the Temerty Center for Artificial Intelligence Research and Education in Medicine at the University of Toronto and provides technical infrastructure and continued access for older releases.

    '
- id: voice:maintainer:curator-contact
  role: other
  maintainer_details:
  - 'Project documentation and healthsheet text provide email contacts for data access, platform support, and curation; the visible preprocessed bundle redacts some addresses as [email protected]. PhysioNet identifies DACO@b2ai-voice.org for raw audio access committee questions.

    '
errata:
- id: voice:erratum:none
  erratum_details:
  - 'The healthsheet states that there is no erratum and that a changelog for each dataset version is published online with dataset metadata.

    '
updates:
  id: voice:update_plan:semiannual
  frequency: semi-annual
  update_details:
  - 'The healthsheet states that further versions will be released twice per year, distributed as new versions on the data platform, with users notified through news items and standard communication channels. PhysioNet version history lists 1.1, 2.0.0, 2.0.1, 3.0.0, and 3.1.0.

    '
retention_limit:
  id: voice:retention:research
  retention_period: as long as useful for research purposes, possibly indefinitely
  retention_details:
  - 'The healthsheet states that once data are contributed, data will be retained as long as useful for research purposes, possibly indefinitely. The DUA requires recipients to destroy data at termination/expiration according to provider instructions, with written certification within 30 days, while permitting one archival copy where necessary for records retention and research integrity.

    '
version_access:
  id: voice:version_access:physionet
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
  - '1.1'
  - 2.0.0
  - 2.0.1
  - 3.0.0
  - 3.1.0
  version_details:
  - 'PhysioNet lists version 1.1 on Jan. 17, 2025, 2.0.0 on April 16, 2025, 2.0.1 on Aug. 18, 2025, 3.0.0 on Dec. 16, 2025, and 3.1.0 on May 1, 2026. The v1.1 page states files for that version are no longer available and points to the latest version. Each dataset version has a unique DOI, and older versions are generally supported though publishers reserve the right to remove access.

    '
extension_mechanism:
  id: voice:extension:derivative
  contribution_url: https://healthdatanexus.ai/
  extension_details:
  - 'Others may publish a derivative dataset on Health Data Nexus referencing the original source, under the same conditions as the source data.

    '
  - 'For augmentations to code used to produce the data, open-source repositories provide discussion forums, issue pages, and pull requests for public discussion and improvements to preprocessing code.

    '
  - 'Additional contribution URL: https://github.com/eipm/bridge2ai-docs'
file_collections:
- id: voice:file_collection:features
  name: Derived dense feature files
  title: v3.0.0 features subfolder
  description: 'Dense binary derived audio features are available in the features subfolder as Parquet files. Each file has an associated JSON dictionary with a matching stem describing the feature and processing. Parquet records include participant_id, session_id, task_name, n_frames, and tensor data.

    '
  collection_type:
  - processed_data
  path: features/
  page: https://physionet.org/content/b2ai-voice/3.0.0/
  license: Bridge2AI Voice Registered Access License
- id: voice:file_collection:static_features
  name: Static audio features
  description: 'static_features.tsv contains features derived from raw audio, with one feature row per unique recording, plus an associated JSON data dictionary.

    '
  collection_type:
  - processed_data
  path: features/static_features.tsv
  page: https://physionet.org/content/b2ai-voice/3.0.0/
- id: voice:file_collection:phenotype
  name: Phenotype files
  description: 'The phenotype subfolder contains TSV and JSON files organized under confounders, demographics, diagnosis, enrollment, questionnaire, and task folders. JSON dictionaries describe columns, questions, and response data types.

    '
  collection_type:
  - metadata
  path: phenotype/
  page: https://physionet.org/content/b2ai-voice/3.0.0/
- id: voice:file_collection:raw_audio_bids
  name: Raw audio BIDS structure
  description: 'The documentation shows a BIDS-style raw-audio structure with CHANGES.md, README.md, sub-<participant_id>/ses-<participant_id>/audio/, WAV files named sub<participant_id>_ses<participant_id>_task-<task_name>.wav, and JSON sidecars. Raw audio is controlled access only.

    '
  collection_type:
  - raw_data
  path: b2ai-voice-audio/
  page: https://www.synapse.org/Synapse:syn72370534/
- id: voice:file_collection:documentation
  name: Documentation and source code
  description: 'Documentation, dashboards, REDCap data dictionary/metadata, preprocessing code, SenseLab, and FHIR profiles are linked from the project documentation and GitHub repositories.

    '
  collection_type:
  - documentation
  path: https://docs.b2ai-voice.org/
  page: https://docs.b2ai-voice.org/
variables:
- id: voice:variable:participant_id
  variable_name: participant_id
  data_type: identifier
  is_identifier: true
  is_sensitive: false
  description: 'Parquet feature elements include a unique identifier for the participant.

    '
  quality_notes:
  - 'This is a dataset identifier after de-identification, not a direct personal identifier.

    '
- id: voice:variable:session_id
  variable_name: session_id
  data_type: identifier
  is_identifier: true
  is_sensitive: false
  description: 'Parquet feature elements include a unique identifier for the recording session.

    '
- id: voice:variable:task_name
  variable_name: task_name
  data_type: string
  is_identifier: false
  is_sensitive: false
  categories:
  - ABCs
  - Animal fluency
  - Cape V sentences
  - Caterpillar Passage
  - Cinderella Story
  - Counting
  - Diadochokinesis
  - Favorite Foods
  - Identifying Pictures
  - Months
  - Picture description
  - Productive Vocabulary
  - Prolonged vowel
  - Rainbow Passage
  - Random Item Generation
  - Ready For School
  - Repeat Words
  - Repeat Sentences
  - Role Naming
  - Story recall
  - Word-color Stroop
  description: 'Task name for each recording or task record. Source documentation lists adult and pediatric speech/acoustic tasks including speech, voice/non-speech, and non-voice/non-speech tasks.

    '
- id: voice:variable:n_frames
  variable_name: n_frames
  data_type: integer
  is_identifier: false
  is_sensitive: false
  description: 'Parquet elements in v3.0.0 include the number of time frames associated with the feature tensor.

    '
- id: voice:variable:diagnostic_category
  variable_name: diagnostic_category
  data_type: categorical
  is_identifier: false
  is_sensitive: true
  categories:
  - voice disorders
  - neurological and neurodegenerative disorders
  - mood and psychiatric disorders
  - respiratory disorders
  - pediatric voice and speech disorders
  - controls
  description: 'Diagnostic grouping or control status used for cohort selection and model tasks.

    '
  quality_notes:
  - 'Clinical diagnosis depends on disease cohort and may be based on clinician review, EHR records, medication prescriptions, imaging, or other gold-standard validation methods.

    '
- id: voice:variable:demographics
  variable_name: demographics
  data_type: object
  is_identifier: false
  is_sensitive: true
  description: 'Demographic files contain data such as age, gender, sex, ethnicity, socioeconomic status, language, education, employment, and disability-related responses, subject to de-identification and sensitive-field removal.

    '
- id: voice:variable:validated_questionnaires
  variable_name: validated_questionnaires
  data_type: object
  is_identifier: false
  is_sensitive: true
  categories:
  - VHI-10
  - PHQ-9
  - GAD-7
  - PANAS
  - PTSD Adult
  - ADHD Adult
  - DSM-5 Adult
  - Dyspnea Index
  - Leicester Cough Questionnaire
  - Winograd Questionnaire
  - MOCA
  - C-VHI-10
  - PVOS
  - PVRQOL
  - PHQ-A
  description: 'Validated questionnaires and patient-reported outcomes are integrated into the app or pediatric workflow and represented in phenotype/questionnaire files.

    '
- id: voice:variable:raw_audio
  variable_name: raw_audio
  data_type: object
  is_identifier: false
  is_sensitive: true
  measurement_technique: 'Voice, speech, cough, and breathing recordings are collected through app-based acoustic tasks with tablet/headset hardware or ReproSchema-UI workflows.

    '
  description: 'Raw audio is retained for controlled access, not distributed in the registered adult PhysioNet feature-only project.

    '
- id: voice:variable:spectrogram
  variable_name: torchaudio_spectrogram
  data_type: array
  is_identifier: false
  is_sensitive: false
  derivation: 'v3.0.0 spectrograms have dimension 201xT, generated with short-time FFT using 25 ms windows, 10 ms hop length, and a 400-point FFT.

    '
  quality_notes:
  - 'v3.0.0 reports n=29020 and removes spectrograms for sensitive records and audio checks.

    '
- id: voice:variable:mfcc
  variable_name: torchaudio_mfcc
  data_type: array
  is_identifier: false
  is_sensitive: false
  derivation: 'v3.0.0 MFCCs use the same parameters as mel spectrograms with 60 coefficients.

    '
  quality_notes:
  - 'v3.0.0 reports n=29020 and removes MFC coefficients for sensitive records and audio checks.

    '
- id: voice:variable:ppgs
  variable_name: ppgs
  data_type: array
  is_identifier: false
  is_sensitive: false
  derivation: 'Phonetic posteriorgram probabilities are generated across 40 phoneme categories at a 100 Hz frame rate.

    '
  quality_notes:
  - 'v3.0.0 reports n=29031 and removes PPGs for sensitive records and audio checks.

    '
