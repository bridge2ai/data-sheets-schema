known_biases:
- id: voice:bias:selection
  bias_type: selection_bias
  bias_description: 'Participants are recruited from high-volume expert clinics and participating institutions, and groups with less trust in the medical system or AI, or less proximity to collection sites, may be less likely to be recruited.

    '
  mitigation_strategy: 'The protocol anticipates community outreach clinics, remote collection, Spanish protocol development, and recruitment approaches that control for more variables.

    '
- id: voice:bias:representation
  bias_type: representation_bias
  bias_description: 'Public releases do not contain equal distributions across disease categories. The dataset has skews based on disorder category, site, and demographic factors.

    '
  mitigation_strategy: 'Users should consider multivariate distributions when assessing utility for specific questions and future releases are expected to add data.

    '
- id: voice:bias:measurement
  bias_type: measurement_bias
  bias_description: 'Different sites have different collection configurations. Distinct iPads were used at each site, and headset microphone distance may vary. Diagnostic practices may differ by disorder, clinician, EHR record, or prescription-based assessment.

    '
  mitigation_strategy: 'Dataset documentation includes device and collection-context metadata, audit protocols, quality control metrics, and protocol standards to support challenge tests and model evaluation.

    '
- id: voice:bias:annotation
  bias_type: annotation_bias
  bias_description: 'Diagnostic labels are generally provided by a single clinician or, for psychiatric cohorts, by EHR record or active prescription. Human-level performance varies widely across applications.

    '
  mitigation_strategy: 'New labels or tasks should document exact variables used for determination, and clinicians follow Bridge2AI protocols and ICD-10 codes.

    '
known_limitations:
- id: voice:limitation:representativeness
  limitation_type: representativeness_limitation
  limitation_description: 'The dataset is a sample from a larger ongoing collection and is not representative because collection occurred at a limited number of geographic locations.

    '
  scope_impact: 'Models trained from current data may generalize poorly to populations or sites underrepresented in the collection.

    '
  recommended_mitigation: 'Evaluate demographic, disorder-category, site, and device distributions before model development or deployment.

    '
- id: voice:limitation:release-scope
  limitation_type: scope_limitation
  limitation_description: 'Public/registered releases contain derived features and phenotype data, not raw audio waveforms. The PhysioNet v3.0.0 adult page states that the project does not contain raw audios.

    '
  scope_impact: 'Users needing raw waveform analysis must request controlled access and cannot perform every possible audio-processing workflow from the registered feature-only release.

    '
  recommended_mitigation: 'Use derived features for registered-access research or apply to DACO for raw audio access with institutional sign-off.

    '
- id: voice:limitation:missingness
  limitation_type: methodological_limitation
  limitation_description: 'Some questions are optional, participants answer a common set plus category-specific questions, data collection irregularities can cause missing information, and v3.0.0 feature files omit some records due to sensitivity, audio checks, length, or generation issues.

    '
  scope_impact: 'Missing data can affect cohort selection, comparisons across disease categories, and feature availability.

    '
  recommended_mitigation: 'Use the included missingness tables, JSON data dictionaries, and file-level metadata when constructing cohorts and reporting analyses.

    '
- id: voice:limitation:feasibility
  limitation_type: methodological_limitation
  limitation_description: 'In the initial feasibility study, overall task completion was 68%, acoustic tasks were successfully recorded in 41% of cases, 41.2% of tasks required assistance, and users reported instruction clarity and interface issues.

    '
  scope_impact: 'Remote or unsupervised collection may produce incomplete or lower-quality data without interface and instruction improvements.

    '
  recommended_mitigation: 'Apply the ongoing UX/UI improvements, quality-control metrics, and app validation work described by the consortium.

    '
- id: voice:limitation:transcription
  limitation_type: methodological_limitation
  limitation_description: 'The healthsheet states that certain aspects of the data, such as transcription, were generated using off-the-shelf models that have not been audited for correctness.

    '
  scope_impact: 'Transcription-derived analyses may inherit unverified model errors.

    '
  recommended_mitigation: 'Audit transcriptions or avoid treating generated transcription as ground truth.

    '
anomalies:
- id: voice:anomaly:collection-configuration
  anomaly_details:
  - 'Different sites have different collection configurations, and the collection protocol changed over the course of the study.

    '
  description: 'These differences can affect comparability across sites and time.

    '
- id: voice:anomaly:feature-exclusions
  anomaly_details:
  - 'In v3.0.0, spectrograms, Mel spectrograms, MFC coefficients, PPGs, and EMAs for sensitive records and audio checks were removed. Some files could not generate certain features due to length or other issues.

    '
  description: 'Feature availability is not uniform across all recordings.

    '
- id: voice:anomaly:free-speech
  anomaly_details:
  - 'The dataset includes transcription or open-response/free-speech tasks, and while harmful or sensitive language is unlikely, it cannot be completely avoided because research participants choose their own language.

    '
  description: 'This creates content-sensitivity and privacy considerations for downstream users.

    '
relationships:
- id: voice:relationships:instances
  relationship_details:
  - 'Dataset documentation states that individual participant instances are unrelated. However, participants may have repeated visits, and Parquet feature records include participant_id, session_id, task_name, n_frames, and tensor data to connect recordings with sessions and tasks.

    '
  description: 'The relationship structure is mainly participant-session-task linkage rather than explicit interpersonal relationships.

    '
splits:
- id: voice:splits:none
  split_details:
  - 'The dataset comes with predefined tasks and diagnostic labels, but no predefined recommended train, validation, or test splits. Researchers are encouraged to create their own splits based on their requirements.

    '
  description: 'Users should account for participant, site, device, disease category, and repeated visit structure when creating splits.

    '
sensitive_elements:
- id: voice:sensitive:health
  sensitive_elements_present: true
  sensitivity_details:
  - 'The dataset includes health information, clinical diagnoses, questionnaire responses, demographics, confounders, and EHR-derived validation information.

    '
- id: voice:sensitive:demographics
  sensitive_elements_present: true
  sensitivity_details:
  - 'The dataset includes race information, sexual orientation information, socioeconomic information, health information, and demographic variables such as age, gender, sex, and ethnicity.

    '
- id: voice:sensitive:voice
  sensitive_elements_present: true
  sensitivity_details:
  - 'Raw voice data can cause individual re-identification or be used for illicit or unauthorized purposes. Raw audio is therefore removed from the feature-only release and disseminated only through controlled access.

    '
- id: voice:sensitive:genomic
  sensitive_elements_present: true
  sensitivity_details:
  - 'The project protocol includes genomic information for a subset of the population, with genomic data collected and analyzed at University of Toronto and Mount Sinai Hospital in Canada under a separate protocol.

    '
confidential_elements:
- id: voice:confidentiality:feature-release
  confidential_elements_present: false
  confidentiality_details:
  - 'The healthsheet states that the registered feature-only dataset does not contain confidential data protected by doctor-patient confidentiality, while also documenting that sensitive elements were removed and access controls apply.

    '
- id: voice:confidentiality:raw-audio
  confidential_elements_present: true
  confidentiality_details:
  - 'The DUA treats the Data as Personally Identifiable Information under the stated terms, covered under a Certificate of Confidentiality, and requires administrative, physical, and technical safeguards plus restrictions on disclosure, access, and contacting participants.

    '
content_warnings:
- id: voice:content_warning:free_speech
  content_warnings_present: true
  warnings:
  - 'Free-speech tasks may contain participant-chosen language. The documentation says inclusion of offensive, insulting, threatening, or psychologically unsafe content is unlikely but cannot be completely avoided.

    '
acquisition_methods:
- id: voice:acquisition:direct
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - 'Data are directly observed through acoustic tasks and reported by participants through surveys/questionnaires. Derived audio features are computed from raw waveforms. Clinical diagnoses are verified by clinicians reviewing audio and/or imaging data, electronic health records, or medication prescriptions.

    '
- id: voice:acquisition:ehr
  was_directly_observed: false
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - 'Participants who consent permit investigators to access medical information through EHR platforms to perform gold-standard validation of diagnoses and symptoms. Other multimodal data include imaging, genomics for a subset, respiratory function tests, laryngoscopy imaging, and other EHR data, with no external data released in the v3.0.0 registered release.

    '
collection_mechanisms:
- id: voice:collection:adult-app
  mechanism_details:
  - 'Adult voice, breathing, cough, and speech data are recorded with the custom Bridge2AI-Voice app and Bridge2AI-Voice protocols. In-clinic collection uses iPads or iPad Air devices, an Avid AE-36 microphone, an Apple dongle, and a headset microphone where possible.

    '
- id: voice:collection:pediatric-reproschema
  mechanism_details:
  - 'Pediatric data are collected using ReproSchema-UI with the Bridge2AI-Voice pediatric protocol, then extracted and transformed into REDCap format and converted to BIDS.

    '
- id: voice:collection:remote
  mechanism_details:
  - 'The IRB protocol describes remote consent and remote collection through the Bridge2AI Voice Web app and iOS app. The Web app can run on a computer, tablet, or phone without installed software, stores data only during collection, sends data by secure HTTPS to HIPAA-compliant storage, and requires no login.

    '
- id: voice:collection:redcap
  mechanism_details:
  - 'Data are entered into REDCap as part of case report forms. Data exported from REDCap are converted using open-source tools developed by the team.

    '
- id: voice:collection:feasibility
  mechanism_details:
  - 'The feasibility study brought participants to a private clinic room at the USF Health Voice Center, introduced them to the app on a study iPad, asked them to complete one to three tasks, and collected timing, completion, assistance, and qualitative feedback metrics.

    '
sampling_strategies:
- id: voice:sampling:clinical
  is_sample: true
  is_random: false
  source_data:
  - patients presenting at specialty clinics and participating institutions
  is_representative: false
  representative_verification:
  - 'Documentation states the current data are not representative because they were collected at a limited number of geographic locations.

    '
  why_not_representative:
  - 'Recruitment is based on high-volume expert clinics, participating institutions, diagnosis-specific inclusion/exclusion criteria, and clinic/community access.

    '
  strategies:
  - 'Participants are selected based on membership in five predetermined groups: respiratory disorders, voice disorders, neurological disorders, mood disorders, and pediatric voice/speech disorders, with controls. Patients are screened for eligibility before visits and consent is sought if eligible.

    '
- id: voice:sampling:feasibility
  is_sample: true
  is_random: false
  source_data:
  - tertiary academic voice center
  is_representative: false
  representative_verification:
  - 'The feasibility study itself identifies single-site collection, small sample size, lack of geographic diversity, and demographic homogeneity as limitations.

    '
  why_not_representative:
  - 'The feasibility study enrolled 47 adults at one tertiary academic voice center in Tampa, Florida between June 5, 2023 and July 28, 2023.

    '
  strategies:
  - 'Adults at least 18 years old who could read English were eligible; inability to provide informed consent in English or read English was exclusionary.

    '
data_collectors:
- id: voice:collector:research-teams
  role: research staff and site study teams
  collector_details:
  - 'Research teams, including medical, graduate, or undergraduate students, coordinate with clinicians/doctors to identify participants. Clinicians and doctors are listed under the IRB as co-investigators and included in consortium-level publications. Hospital staff assist with logistics but are not involved in scheduling.

    '
- id: voice:collector:clinicians
  role: clinical diagnosis and validation
  collector_details:
  - 'Local clinicians provide diagnoses based on clinical interview and appropriate work-up. Psychiatric cohort assessment may be determined using EHR record or active prescription by an appropriately licensed clinician.

    '
- id: voice:collector:participant
  role: participant
  collector_details:
  - 'Participants perform speaking, coughing, breathing, reading, and other acoustic tasks and provide self-reported demographics, medical history, confounder data, and validated questionnaire responses.

    '
collection_timeframes:
- id: voice:timeframe:grant
  start_date: '2022-09-01'
  end_date: '2026-11-30'
  timeframe_details:
  - 'NIH RePORTER lists project start 2022-09-01T00:00:00 and project end 2026-11-30T00:00:00 for project number 3OT2OD032720-01S3.

    '
- id: voice:timeframe:feasibility
  start_date: '2023-06-05'
  end_date: '2023-07-28'
  timeframe_details:
  - 'The initial feasibility study was conducted at the University of South Florida Health Voice Center between June 5, 2023 and July 28, 2023.

    '
- id: voice:timeframe:healthsheet
  timeframe_details:
  - 'The healthsheet states that data for the then-current release were collected over a period of 12 months. The IRB protocol describes an individual participant study duration of up to 4 years and longitudinal at-home collection intervals of 1-6 months for certain progressive or degenerative disease cohorts for a maximum of 3 years total duration.

    '
direct_collection:
- id: voice:direct_collection:direct
  is_direct: true
  collection_details:
  - 'The dataset relates to people and is collected directly from individuals through an IRB-approved consent process, app-based acoustic tasks, questionnaires, and clinical workflows. EHR information is accessed with consent for validation.

    '
collection_notifications:
- id: voice:notification:consent
  notification_details:
  - 'Participants are informed during the consent process that the app was created by the Bridge2AI-Voice consortium, are told its purpose, and are explicitly informed about data collected, data security methods, and information used for the study.

    '
- id: voice:notification:voluntary
  notification_details:
  - 'The IRB protocol states that participants and/or parents/guardians are given time to ask questions, are made aware that participation is optional and voluntary, and are told that declining participation will not interfere with standard care.

    '
collection_consents:
- id: voice:consent:prospective
  consent_details:
  - 'Participants provide prospective informed consent for data collection and use. The feasibility study states all participants provided written informed consent. The protocol supports paper consent, electronic consent within the app, remote consent through REDCap survey forms, and video consent in which participants read a statement aloud for identity verification.

    '
- id: voice:consent:pediatric
  consent_details:
  - 'For children, parents or guardians provide consent and children provide verbal assent where appropriate. Young children who cannot reasonably assent due to age and development are not asked to assent.

    '
- id: voice:consent:data-sharing
  consent_details:
  - 'Consent details state that research data without direct identifiers will be shared with external researchers for future research through a secure database; low re-identification-risk data are shared in registered access, and data posing heightened re-identification risk are shared through controlled access with authorized researchers.

    '
consent_revocations:
- id: voice:revocation:withdrawal
  revocation_details:
  - 'Participants are informed that they may withdraw from the study at any point. If withdrawal occurs during or before voice data collection, their data will not be included in the database. Participants are informed that research data, including voice recordings, cannot be removed once voice data collection is completed.

    '
missing_data_documentation:
- id: voice:missing:optional
  missing_data_patterns:
  - 'Some questions are optional, and participants answer a common set of questions plus additional questions relevant to their primary diagnostic category.

    '
  missing_data_causes:
  - 'Optional questions, data collection irregularities, repeated visits, and category-specific protocols can produce missing information or varying values.

    '
  handling_strategy: 'The dataset has an internal missingness and consistency audit by the data release team, includes a missingness table, and provides JSON data dictionaries for TSV phenotype files.

    '
- id: voice:missing:feature-generation
  missing_data_patterns:
  - 'Some v3.0.0 derived feature files do not include every recording. Sensitive records, audio checks, open-response prompts, long files, or files with other issues may lack particular dense features.

    '
  missing_data_causes:
  - 'Privacy removal, audio-task type, sensitivity flags, and feature-generation failures.

    '
  handling_strategy: 'Users should check file-specific dictionaries, release notes, and feature counts before modeling.

    '
raw_data_sources:
- id: voice:raw_source:audio
  source_description: 'Raw audio waveforms are collected from acoustic tasks including voice, speech, breathing sounds, cough sounds, free speech prompts, sustained vowels, reading passages, picture descriptions, and other protocol tasks.

    '
  source_type:
  - raw audio
  access_details: 'Raw audio is saved but not publicly accessible. Raw audio access requires controlled access through DACO and institutional sign-off, and the PhysioNet page points to Synapse for adult raw audio.

    '
  raw_data_format:
  - WAV audio and task-level JSON sidecars in BIDS-style structure
- id: voice:raw_source:questionnaire
  source_description: 'Participants complete self-reported demographic, medical history, confounder, and disease-specific validated questionnaires and patient-reported outcomes.

    '
  source_type:
  - survey and questionnaire responses
  access_details: 'Registered/credentialed releases include phenotype TSV files with JSON data dictionaries; sensitive fields are removed.

    '
  raw_data_format:
  - REDCap and ReproSchema-UI exports converted to TSV and JSON
- id: voice:raw_source:ehr
  source_description: 'Consenting participants permit investigators to access medical information through EHR platforms to perform gold-standard validation of diagnoses and symptoms.

    '
  source_type:
  - electronic health record
  access_details: 'EHR-derived validation information is handled under IRB-approved study procedures and release-specific de-identification.

    '
  raw_data_format:
  - clinical validation data and phenotype fields
ethical_reviews:
- id: voice:ethical_review:usf-irb
  reviewing_organization: University of South Florida Institutional Review Board
  contact_person: Yael Bensoussan
  review_details:
  - 'The feasibility study was approved by the University of South Florida IRB (IRB number 004890). PhysioNet states that data collection and sharing was approved by the University of South Florida Institutional Review Board. The documentation states the clinical study was submitted and approved by the USF Single IRB and subsite IRBs through the Single IRB process.

    '
- id: voice:ethical_review:canadian
  reviewing_organization: Canadian REB processes for MSH, SickKids, and University of Toronto
  review_details:
  - 'The IRB protocol states that Canadian institutions, including MSH, SickKids, and UofT, do not abide by the USF Single IRB process and apply for separate research ethics board approvals to comply with Canadian regulations.

    '
data_protection_impacts:
- id: voice:data_protection:assessment
  impact_details:
  - 'The healthsheet states that no analysis of the potential impact of the dataset and its use on data subjects had been conducted. The project nevertheless documents ethical inquiry, controlled raw-audio access, de-identification, DUA restrictions, and privacy safeguards.

    '
human_subject_research:
  id: voice:human_subjects:study
  involves_human_subjects: true
  irb_approval:
  - 'true'
  ethics_review_board:
  - University of South Florida Institutional Review Board and applicable subsite IRBs/REBs
  special_populations:
  - 'Adult patients and controls are included. Pediatric participants are included at pediatric participating institutions, with guardian consent and child assent where appropriate. Genomic data for a subset are handled under a separate protocol at University of Toronto and Mount Sinai Hospital in Canada.

    '
  regulatory_compliance:
  - 'The DUA references applicable laws, professional standards, IRB review/approval where required, a Certificate of Confidentiality, and safeguards for Personally Identifiable Information.

    '
informed_consent:
- id: voice:informed_consent:prospective
  consent_obtained: true
  consent_type:
  - prospective informed consent
  consent_documentation:
  - 'Paper consent documents may be uploaded and stored electronically in REDCap; electronic consent may occur in the app or through REDCap surveys; video consent may be used to verify identity by recording a participant reading a statement. Paper and electronic consent versions are stored for a minimum of 5 years after study completion following USF procedure.

    '
  withdrawal_mechanism:
  - 'Participants may withdraw. Data are excluded if withdrawal happens during or before voice data collection, but research data cannot be removed from the database after voice data collection is completed.

    '
  consent_scope:
  - 'Consent covers collection and use of voice, speech, respiratory sounds, surveys, questionnaires, demographic and medical history data, EHR access for validation, and external sharing under secure registered or controlled access.

    '
participant_privacy:
- id: voice:privacy:deidentification
  anonymization_method:
  - 'Direct identifiers are removed, HIPAA Safe Harbor identifiers are removed, state and province are removed while country is retained, dates finer than year are removed or rebased/replaced by integers, geographic information is removed or generalized, narrative fields and raw free-speech transcripts are removed, and sensitive fields are removed from feature-only releases.

    '
  reidentification_risk:
  - 'Raw voice data has potential to cause individual re-identification or be used for illicit or unauthorized purposes. Indirect identifiers can create risk when combined with public data.

    '
  privacy_techniques:
  - 'Removal of direct identifiers, selected indirect identifiers, highly sensitive non-identifying fields, raw audio from feature-only releases, sensitive open-response derived features, and free-speech transcript content; controlled access and DUA safeguards are used for raw audio.

    '
  data_linkage:
  - 'The dataset links voice and speech data to health information, EHR-derived validation, imaging, genomics for a subset, respiratory function tests, and other clinical metadata under consent and access controls.

    '
participant_compensation:
- id: voice:compensation:participants
  compensation_provided: true
  compensation_type:
  - electronic gift cards
  compensation_amount:
  - $40 for a data collection session under 90 minutes; $80 for a session over 90 minutes; maximum total compensation $120 for no more than 3 sessions
  compensation_rationale:
  - 'The healthsheet describes compensation for participant time in current data collection. The earlier feasibility study reports no financial incentives for completion of that feasibility study.

    '
at_risk_populations:
  id: voice:at_risk:pediatric
  at_risk_groups_included: true
  special_protections:
  - 'Pediatric data collection occurs only at pediatric participating institutions. Parents or guardians provide consent, and children provide verbal assent where appropriate; young children who cannot reasonably assent are not asked.

    '
  assent_procedures:
  - 'Verbal assent is obtained where appropriate and documented in the assent form.

    '
  guardian_consent:
  - 'Parental permission is obtained from one or both parents; the protocol states the research is minimal risk and does not require permission from both parents or legal guardians.

    '
preprocessing_strategies:
- id: voice:preprocessing:audio-v3
  preprocessing_details:
  - 'For v3.0.0, raw audio was converted to monaural and resampled to 16 kHz with a Butterworth anti-aliasing filter. Spectrograms were computed using short-time FFT with 25 ms windows, 10 ms hop length, and 400-point FFT, then further downsampled by a factor of two in the time domain. MFCCs used 60 coefficients. Mel spectrograms used 25 ms windows, 10 ms hop length, 400-point FFT, and 60 Mels. Speech Articulatory Coding generated articulator kinematic traces and loudness, periodicity, and pitch measures at 50 Hz. PPGs were generated at 100 Hz. Transcriptions were generated using OpenAI Whisper Large.

    '
  used_software:
  - id: voice:software:b2aiprep-v3-0-0
    name: b2aiprep v3.0.0
  - id: voice:software:opensmile
    name: OpenSMILE
  - id: voice:software:praat
    name: Praat
  - id: voice:software:parselmouth
    name: Parselmouth
  - id: voice:software:torchaudio
    name: torchaudio
  - id: voice:software:speech-articulatory-coding
    name: Speech Articulatory Coding
  - id: voice:software:ppgs
    name: ppgs
  - id: voice:software:openai-whisper-large
    name: OpenAI Whisper Large
- id: voice:preprocessing:bids
  preprocessing_details:
  - 'Raw audio files and questionnaire data retrieved from ReproSchema-UI or exported from REDCap were converted to be compliant with Brain Imaging Data Structure v1.9.0. Pediatric data collected through ReproSchema-UI is extracted and transformed into REDCap format and subsequently converted to BIDS.

    '
  used_software:
  - id: voice:software:b2aiprep
    name: b2aiprep
  - id: voice:software:senselab
    name: SenseLab
cleaning_strategies:
- id: voice:cleaning:deidentification
  cleaning_details:
  - 'Direct identifiers, selected indirect identifiers, highly sensitive non-identifying fields, raw audio from feature-only releases, and sensitive open-response derived features are removed. Raw audio transcripts are reviewed, and audio recordings containing potentially identifying information and external voices are removed from the release.

    '
- id: voice:cleaning:audit
  cleaning_details:
  - 'The audit protocol generates missingness tables, checks distributions and outliers, checks categorical responses against schema, runs quality-control metrics for audio tasks, and checks waveform silence, duration, and produced speech relative to intended passages.

    '
labeling_strategies:
- id: voice:labeling:clinical
  data_annotation_protocol:
  - 'Diagnostic labels are generated through clinical assessment. At each site, a local clinician provides diagnosis based on clinical interview and appropriate work-up. Psychiatric cohort labels may use EHR records or active prescriptions.

    '
  annotations_per_item: 1
  inter_annotator_agreement: not reported
  annotator_demographics:
  - 'Typically the clinician at the data-collection site, or an external clinician for prior diagnostic assessment.

    '
  labeling_details:
  - 'Gold-standard labels are available in the data, diagnosed by clinicians using Bridge2AI protocols and ICD-10 codes. Future new labels should document the exact variables used for determination.

    '
raw_sources:
- id: voice:raw_data:audio
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details:
  - 'Controlled raw audio includes samples from conventional acoustic tasks, respiratory sounds, cough sounds, and free speech prompts. Raw audio is not included in the PhysioNet feature-only adult release.

    '
- id: voice:raw_data:redcap
  access_url: https://github.com/eipm/bridge2ai-redcap
  raw_data_details:
  - 'REDCap data dictionaries, metadata, and instrument PDFs support the source questionnaire and case-report data.

    '
imputation_protocols:
- id: voice:imputation:none_documented
  imputation_method:
  - not documented
  imputed_fields:
  - not documented
  imputation_rationale: 'The source bundle documents missingness tables and missing-data patterns but does not describe an imputation protocol.

    '
  imputation_validation:
  - not documented
annotation_analyses:
- id: voice:annotation_analysis:not_audited
  analysis_method: 'Dataset documentation reports internal missingness and consistency audits but states that certain off-the-shelf generated aspects, such as transcription, had not been audited for correctness.

    '
  disagreement_patterns:
  - not reported
  annotation_quality_details:
  - 'Human-level performance varies widely for intended applications, and diagnostic labels typically rely on a single clinician per data instance.

    '
machine_annotation_tools:
- id: voice:machine_tools:features
  tools:
  - OpenSMILE
  - Praat
  - Parselmouth
  - torchaudio
  - Speech Articulatory Coding
  - ppgs
  - OpenAI Whisper Large
  tool_descriptions:
  - 'OpenSMILE extracts temporal dynamics and acoustic characteristics; Praat and Parselmouth compute phonetic and prosodic measures; torchaudio generates spectrogram, mel spectrogram, MFCC, and pitch features; Speech Articulatory Coding estimates articulatory traces, loudness, periodicity, and pitch; ppgs generates phonetic posteriorgrams; Whisper Large generates transcriptions.

    '
  tool_accuracy:
  - 'The documentation states that transcription and some off-the-shelf generated aspects had not been audited for correctness.

    '
existing_uses:
- id: voice:existing_use:summer_school
  examples:
  - 'A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School and hackathon.

    '
- id: voice:existing_use:feasibility
  examples:
  - 'The Bridge2AI-Voice app feasibility study used task performance metrics and participant feedback to assess app viability in a clinical setting before broad data collection.

    '
use_repository:
- id: voice:use_repository:none
  repository_url: https://docs.b2ai-voice.org/
  repository_details:
  - 'The healthsheet states that there is no repository linking to papers or systems that use the dataset besides general scholarly search. Project documentation and dashboards provide dataset, protocol, and tool information.

    '
other_tasks:
- id: voice:other_task:training
  task_details:
  - 'The project includes skills and workforce development, a curriculum on voice biomarkers of health, competency assessment, mentorship, training resources, webinars, and the Voice AI Symposium.

    '
future_use_impacts:
- id: voice:future_impact:clinical
  impact_details:
  - 'The dataset is intended to support future screening, diagnosis, remote monitoring, treatment-response monitoring, clinical trials digital endpoints, and personalized treatment strategies through voice, speech, and respiratory-sound biomarkers.

    '
- id: voice:future_impact:fairness
  impact_details:
  - 'Users must consider site, disorder-category, demographic, device, and diagnostic practice skews to avoid unfair treatment, stereotyping, service-quality issues, and other harms.

    '
intended_uses:
- id: voice:intended_use:research
  examples:
  - 'Research uses include AI model pretraining, fine-tuning, benchmarking, validation, disease screening, diagnosis, monitoring, cohort selection, and evaluation of voice biomarkers in clinical research.

    '
  usage_notes: 'The dataset is intended for commercial and non-commercial research purposes by authorized researchers under access agreements.

    '
  use_category:
  - health and biomedical research
- id: voice:intended_use:standards
  examples:
  - 'The dataset and related protocols support standards for audiomics data collection, interoperability, BIDS conversion, data documentation, and AI readiness.

    '
  usage_notes: 'Users should cite the appropriate PhysioNet, protocol, REDCap, documentation, and PhysioNet platform references specified by the release.

    '
  use_category:
  - standards development
discouraged_uses:
- id: voice:discouraged_use:nonclinical
  discouragement_details:
  - 'Documentation discourages non-clinical applications such as hiring decisions, insurance premium adjustments, or surveillance that could lead to discrimination or harm.

    '
- id: voice:discouraged_use:stigmatizing
  discouragement_details:
  - 'The dataset should not be used for purposes that could foreseeably cause harm or stigmatization to participants, families, communities, or specific populations.

    '
prohibited_uses:
- id: voice:prohibited_use:reidentification
  prohibition_reason:
  - 'The Registered Data Access Agreement prohibits attempts to re-identify research participants and actions that could reasonably lead to re-identification.

    '
- id: voice:prohibited_use:unauthorized-sharing
  prohibition_reason:
  - 'The Data Transfer and Use Agreement prohibits unauthorized disclosure, release, sale, rental, lease, loan, or other third-party access except for authorized persons or with prior written provider consent.

    '
- id: voice:prohibited_use:ip-blocking
  prohibition_reason:
  - 'Recipients agree not to use intellectual property protection, database rights, or related rights in ways that prevent or limit access to or use of the Data or conclusions drawn directly from it.

    '
