purposes:
- id: voice:purpose:1
  response: 'Create a large, multi-institutional, ethically sourced and diverse database of human voice, speech, and respiratory sounds linked to multimodal health biomarkers to fuel voice AI research.

    '
- id: voice:purpose:2
  response: 'Integrate voice as a biomarker of health in clinical care by enabling predictive models for screening, diagnosis, treatment support, disease monitoring, and clinical discovery across a broad range of diseases.

    '
- id: voice:purpose:3
  response: 'Establish standards and best practices for audiomics data acquisition, interoperability, AI-readiness, and analysis, including evidence-based recording protocols and voice bioinformatics standards.

    '
- id: voice:purpose:4
  response: 'Develop software, cloud infrastructure, smartphone/web applications, and privacy-preserving federated learning infrastructure for non-invasive, user-friendly, high-quality voice data collection and analysis.

    '
- id: voice:purpose:5
  response: 'Address ethical, legal, and social challenges in voice AI, including voice re-identification, voice hacking, voice data sharing, privacy safeguards, ownership, diversity, gender and racial fairness, and trustworthy use from data generation to clinical adoption.

    '
- id: voice:purpose:6
  response: 'Build a community and training pathway for clinicians, speech-language pathologists, data scientists, AI engineers, acousticians, bioethicists, social scientists, and researchers from underserved communities who work on voice AI.

    '
tasks:
- id: voice:task:1
  response: 'Develop, pretrain, fine-tune, benchmark, and validate clinically applicable AI/ML models using voice, speech, cough, breathing, phenotype, and clinical metadata.

    '
- id: voice:task:2
  response: 'Support disease detection and classification for vocal pathologies, including laryngeal cancers, vocal fold paralysis, benign laryngeal lesions, laryngitis, pre-cancerous lesions, muscle tension dysphonia, laryngeal dystonia, glottic insufficiency, presbyphonia, and related conditions.

    '
- id: voice:task:3
  response: 'Support AI research on neurological and neurodegenerative disorders including Alzheimer''s disease, mild cognitive impairment, other dementias, Parkinson''s disease, stroke, ALS, and related conditions, using voice and speech changes and clinical validation sources such as CT, MRI, blood biomarkers, whole genome sequencing, EHR data, or clinician review where available.

    '
- id: voice:task:4
  response: 'Support AI research on mood and psychiatric disorders including depression, anxiety, bipolar disorder, schizophrenia, PTSD, ADHD, OCD, panic disorder, social anxiety disorder, autism spectrum disorder in the mood cohort context, substance use disorder, eating disorder, insomnia/sleep disorder, and other psychiatric history, with labels from clinical diagnosis, EHR, or medication history.

    '
- id: voice:task:5
  response: 'Support research on respiratory disorders using breathing sounds, cough sounds, and voice, including chronic cough, COPD/asthma, airway stenosis, pneumonia, heart failure, obstructive sleep apnea, and related respiratory conditions.

    '
- id: voice:task:6
  response: 'Support pediatric voice and speech disorder research, including autism and speech delay, with pediatric participants recruited strictly from the Hospital for Sick Children and protocols grouped by age.

    '
- id: voice:task:7
  response: 'Enable cohort selection and feature analysis using phenotype files, validated questionnaire responses, diagnosis files, acoustic-task records, and dense temporal features in Parquet.

    '
- id: voice:task:8
  response: 'Enable feasibility and usability assessment of the Bridge2AI-Voice app through task completion, recording completion, assistance requests, timing metrics, and participant feedback adapted from the Mobile App Rating Scale.

    '
addressing_gaps:
- id: voice:gap:1
  response: 'Existing voice biomarker studies often use small or medium-sized datasets, limited demographic diversity reporting, variable data acquisition methods, and voice-only data without linked multimodal health metadata, limiting generalizability and clinical usability.

    '
- id: voice:gap:2
  response: 'The field lacks harmonized, standardized, open or broadly accessible voice datasets that combine acoustic data with clinical, demographic, imaging, genomic, and other health information for reproducible AI development.

    '
- id: voice:gap:3
  response: 'Industry voice datasets are often private and difficult to audit, may lack accurate clinical labels and demographic information, and therefore limit transparent assessment of model fairness and label accuracy.

    '
- id: voice:gap:4
  response: 'Voice AI raises privacy and governance gaps because raw voice can re-identify participants or enable unauthorized uses; the project addresses this through de-identification, registered access, controlled raw-audio access, DUA terms, and ethical governance.

    '
- id: voice:gap:5
  response: 'Pediatric voice and speech data are sparse because of ethical and acquisition challenges; the project includes a pediatric cohort and age-group-specific protocols.

    '
- id: voice:gap:6
  response: 'Mobile and remote voice acquisition needs usability evidence. The feasibility study found promising acceptability but substantial task-completion and acoustic recording barriers requiring UX/UI and instruction improvements.

    '
