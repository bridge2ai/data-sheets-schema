id: https://chorus4ai.org/
name: CHoRUS Dataset
title: 'Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI'
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution, controlled-access critical care dataset
  generated by the Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI project, one of four data generation projects in the NIH-funded Bridge2AI
  consortium (NIH award OT2OD032701). Data are retrospectively collected across a collaboration
  spanning 20 academic centers, of which 14 contribute as Data Acquisition centers, and are
  standardized to the OMOP Common Data Model and delivered through a controlled-access cloud
  enclave. The anticipated final dataset covers 100,000 patient admissions and 9 different data
  modalities from 14 data-contributing hospitals, assembled by 60+ CHoRUS consortium members
  across 20 institutions. The project website describes the current released dataset as 50,000
  patient admissions from ICU, PICU and NICU, comprising 1.6 billion rows of EHR OMOP data,
  7,642 admissions with radiology data and 23 Tb of waveform data; a September 2025 program
  webinar states that, as of August 2025, the dataset covered 14 different hospitals with over
  45,000 unique admissions. Data types include demographics, medication administration,
  procedures, nursing flowsheets, diagnoses, clinical notes extracted and tokenized with the
  OHNLP toolkit, imaging from PACS, waveform telemetry from bedside monitors, and hospital EEG
  waveforms. The project states that the dataset will also provision a holdout test set,
  accessible for external validation of AI models.
page: https://chorus4ai.org/
status: >-
  Active NIH Bridge2AI data generation project (project period 2022-09-01 to 2026-11-30) with a
  released controlled-access dataset; the project website carries the notice "This repoitory is
  under review for potential modification in compliance with Administration directives."
conforms_to: OMOP Common Data Model (OHDSI), with additional modality-specific standards (OHNLP, DICOM, WFDB, EDF+ and Persyst)
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - artificial intelligence
  - machine learning
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - Bridge2AI
  - multimodal data
  - controlled access

creators:
  - description: >-
      Eric S. Rosenthal, Massachusetts General Hospital; principal investigator of NIH project
      1OT2OD032701-01 and member of the Bridge2AI CHoRUS leadership team.
  - description: Azra Bihorac, University of Florida; Bridge2AI CHoRUS leadership team.
  - description: Xiaoqian Jiang, UTHealth Houston; Bridge2AI CHoRUS leadership team.
  - description: Yulia Strekalova, University of Florida; Bridge2AI CHoRUS leadership team.
  - description: Parisa Rashidi, University of Florida; Bridge2AI CHoRUS leadership team.
  - description: Manlik Kwong, Tufts University; Bridge2AI CHoRUS leadership team.
  - description: >-
      The wider CHoRUS consortium, comprising 60+ members across 20 different institutions, of
      which 14 contribute as Data Acquisition centers.

funders:
  - description: >-
      NIH Common Fund Bridge2AI program. Core project number OT2OD032701; project number
      1OT2OD032701-01; application ID 10472824; awardee organization Massachusetts General
      Hospital; fiscal year 2022 award amount 5,880,300 USD; project start 2022-09-01, project
      end 2026-11-30. The project website states "This project is funded by the NIH under award
      number OT2OD032701. The content on this website is solely the responsibility of the
      authors and does not necessarily represent the official views of the NIH."

purposes:
  - description: >-
      To meet the need for generating data for ML/AI applications aimed at characterizing acute
      and critical care illness, predicting complications, and measuring treatment response
      among patients with acute or critical illness.
  - description: >-
      To develop a publicly available, AI-ready critical care dataset while ensuring the methods
      promote privacy, accountability and clinical benefit.
  - description: >-
      To provision a holdout test set, accessible for model external validation, to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care.
  - description: >-
      To cultivate expertise in the lay and scientific community and promote a new generation of
      AI clinicians and scientists through multimodal educational approaches, including
      hands-on training programs that use the CHoRUS dataset.
  - description: >-
      To develop the network, tools, standards and unified semantic mappings that harmonize
      multi-modal EHR, waveform, imaging and text data across a multi-center network.

addressing_gaps:
  - description: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning (AI/ML) in critical care.
  - description: >-
      Developing high-resolution multi-center data sets is a critical first step towards
      actionable and trustworthy AI; CHoRUS aims to acquire an AI-ready data set of
      unprecedented diversity and high resolution.
  - description: >-
      Lack of sequestered holdout datasets that allow external validation of critical care AI
      models prior to marketplace adoption.
  - description: >-
      Absence of an established legal and ethical framework for collecting acute and critical
      care data at scale and determining which data are appropriate for public sharing.

tasks:
  - description: Characterizing acute and critical care illness in patients requiring critical care.
  - description: Predicting complications and clinical deterioration among patients with acute or critical illness.
  - description: Measuring treatment response among patients with acute or critical illness.
  - description: >-
      External validation of AI/ML models on a sequestered holdout test set to support
      marketplace adoption of models for acute and critical care.
  - description: >-
      Accounting for Social Determinants of Health and contextual factors such as geographic
      distance to the nearest hospital in critical care AI models.

acquisition_methods:
  - description: >-
      Retrospective data collection from participating hospitals; clinical data are extracted at
      the contributing site and delivered to CHoRUS as a site-specific clinical data extract.
  - description: >-
      Multi-center acquisition across a network of 14 Data Acquisition centers within a
      collaboration spanning 20 academic centers, following standard operating protocols (SOPs)
      that instruct data contributing sites on best practices for curating and delivering
      interoperable datasets.
  - description: >-
      Planned as described by the project: federated access that will enable sampling methods to
      ensure a balanced and diverse cohort, supported by a legal framework the project will
      establish for collecting data at scale.

collection_mechanisms:
  - description: Hospital electronic health record systems, supplying demographics, medication administration, procedures, nursing flowsheets and diagnoses standardized to OMOP.
  - description: Picture Archiving and Communication Systems (PACS), supplying imaging data in DICOM format.
  - description: Bedside monitors with gateway/middleware, supplying waveform telemetry in WFDB format.
  - description: Hospital EEG database, supplying EEG waveforms in EDF+ and Persyst formats.
  - description: OHNLP toolkit, used to extract and tokenize clinical notes.
  - description: >-
      The chorus-extract-upload repository, providing tools to create and upload a CHoRUS Data
      Extract, together with the Chorus_SOP interactive workflow diagram describing the
      step-by-step process for extracting and contributing clinical data to CHoRUS.

data_collectors:
  - description: >-
      Data site managers at the 14 data-contributing hospitals, who create, curate and submit
      CHoRUS-specific clinical data extracts and provide regular status updates on their
      progress via the GitHub interface or a Google Form.
  - description: >-
      CHoRUS sub-teams for Standards, Data Acquisition and Tooling, which compile documentation
      and validate SOPs for data contribution.

collection_timeframes:
  - description: >-
      As of August 2025, the dataset covered 14 different hospitals with over 45,000 unique
      admissions. At that point, extraction of EEG data and de-identification of the larger
      imaging cohort were still in process. The bundle does not state the calendar coverage
      period of the retrospective clinical records.

direct_collection:
  - description: >-
      Collection is retrospective: clinical data are extracted from hospital source systems
      (electronic health records, PACS, bedside monitors with gateway/middleware, and hospital
      EEG databases) at the 14 data-contributing hospitals and delivered to CHoRUS as
      site-specific data extracts.

sampling_strategies:
  - description: >-
      Project design, stated prospectively: sampling to ensure comprehensive sets of patient
      conditions and clinical treatment strategies, underpinned by a legal framework the project
      will establish for collecting data at scale.
  - description: >-
      Project design, stated prospectively: federated access that will enable sampling methods to
      ensure a balanced and diverse cohort across the contributing centers.

raw_data_sources:
  - source_description: >-
      Structured electronic health record data from participating hospitals, including
      demographics, medication administration (dosing time-stamped upon each infusion change or
      dose administration), procedures documented by providers, high-frequency nursing
      flowsheets, and diagnoses documented by providers.
  - source_description: >-
      Unstructured clinical notes from hospital electronic health records; these are stored
      locally at the contributing site except for tokens, which are extracted and tokenized
      using the OHNLP toolkit.
  - source_description: Imaging studies retrieved from hospital PACS systems.
  - source_description: Waveform telemetry captured from bedside monitors via gateway/middleware systems.
  - source_description: EEG waveforms retrieved from hospital EEG databases.
  - source_description: >-
      Social determinants of health and contextual factors such as geographic distance to the
      nearest hospital.

preprocessing_strategies:
  - description: >-
      Standardization of acquired clinical data to the OMOP Common Data Model, with OMOP schema
      extensions used for high-frequency nursing flowsheet documentation.
  - description: >-
      Tokenization of unstructured electronic health record data; clinical notes are extracted
      and tokenized using the OHNLP toolkit and published against the OHNLP open source schema.
  - description: >-
      Transformation of data using approaches that limit re-identification, including
      de-identification of imaging (de-identification in process for the larger imaging cohort as
      of August 2025).
  - description: >-
      Conversion of waveform data into standardized formats, supported by the chorus_waveform
      repository of waveform documentation and waveform conversion scripts and the
      chorus_waveform_resources repository supporting preparation and release of waveforms.
  - description: >-
      Application of validated semantic mappings that connect clinical data in various source
      formats to international standards, pooled as tabular mappings in the chorus-mapping
      repository.

cleaning_strategies:
  - description: >-
      Characterization reports are produced and returned to contributing sites following their
      data submissions (CHoRUSReports repository), supporting review and remediation of
      submitted extracts.
  - description: >-
      SOP documents used for data extraction and contribution undergo an internal validation and
      review process within the Chorus_SOP repository, and semantic mappings undergo clinical
      validation under a dedicated clinical validation SOP.

labeling_strategies:
  - description: >-
      Project design, stated prospectively: a visualization and annotation environment will label
      data with targets important for prediction, and the project will develop capabilities
      across the multi-center network to acquire, standardize, tokenize, store, visualize and
      label data.

machine_annotation_tools:
  - description: OHNLP toolkit, used for automated extraction and tokenization of clinical notes prior to release.

instances:
  - description: >-
      Each instance is a hospital admission of a critically ill patient, linking multimodal
      records for that admission (demographics, medication administration events, procedures,
      nursing flowsheet entries, diagnoses, tokenized clinical notes, imaging studies, telemetry
      waveforms and EEG waveforms). The anticipated final dataset comprises 100,000 patient
      admissions; the current released dataset is described as 50,000 patient admissions from
      ICU, PICU and NICU, and a webinar snapshot reports over 45,000 unique admissions as of
      August 2025.

subsets:
  - id: https://chorus4ai.org/dataset#demographics
    description: Demographics, represented in the OMOP data standard under controlled access, with a published OMOP metadata schema.
  - id: https://chorus4ai.org/dataset#medication-administration
    description: >-
      Medication administration records, with dosing time-stamped upon each infusion change or
      dose administration; OMOP data standard, controlled access, published OMOP metadata schema.
  - id: https://chorus4ai.org/dataset#procedures
    description: Procedures documented by providers; OMOP data standard, controlled access, published OMOP metadata schema.
  - id: https://chorus4ai.org/dataset#nursing-flowsheets
    description: >-
      Nursing flowsheets containing high-frequency documentation; OMOP data standard, controlled
      access, published against the OMOP schema with extensions.
  - id: https://chorus4ai.org/dataset#diagnoses
    description: Diagnoses documented by providers; OMOP data standard, controlled access, published OMOP metadata schema.
  - id: https://chorus4ai.org/dataset#clinical-notes
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit; OHNLP data standard,
      controlled access, published against the OHNLP open source schema. Notes are stored locally
      at contributing sites except for tokens.
  - id: https://chorus4ai.org/dataset#imaging
    description: >-
      Imaging from PACS in DICOM format under controlled access, published against the DICOM
      schema. As of August 2025, 1,000 images were available with de-identification in process
      for a larger cohort; the released dataset is described as including 7,642 admissions with
      radiology data.
  - id: https://chorus4ai.org/dataset#waveform-telemetry
    description: >-
      Waveform telemetry from bedside monitors and gateway/middleware systems in WFDB format
      under controlled access, published against an extended PhysioNet schema. The released
      dataset is described as containing 23 Tb of waveform data.
  - id: https://chorus4ai.org/dataset#waveform-eeg
    description: >-
      EEG waveforms from hospital databases in EDF+ and Persyst formats under controlled access,
      published against the open source EDF+ and Persyst schemas. Extraction was in process as of
      August 2025.

splits:
  - description: >-
      The project states that the dataset will provision a holdout test set, sequestered and made
      accessible for external validation of models, in order to aid marketplace adoption of
      AI-developed models for implementation in acute and critical care.

subpopulations:
  - description: Adult intensive care unit (ICU) admissions.
  - description: Pediatric intensive care unit (PICU) admissions.
  - description: Neonatal intensive care unit (NICU) admissions.

sensitive_elements:
  - description: >-
      Unstructured clinical notes, which are retained locally at contributing sites and released
      only as tokens extracted with the OHNLP toolkit.
  - description: >-
      Medical imaging retrieved from PACS, which requires de-identification before release;
      de-identification was in process for the larger imaging cohort as of August 2025.
  - description: Patient demographics and diagnoses drawn from hospital electronic health records.
  - description: >-
      Social determinants of health and geographic contextual variables, for example distance to
      the nearest hospital.
  - description: >-
      High-resolution physiological waveform data (telemetry and EEG) linked to individual
      hospital admissions.

is_deidentified:
  description: >-
    The project acquires data, standardizes it to the OMOP Common Data Model, and transforms data
    using approaches that limit re-identification. Unstructured EHR data are tokenized and
    imaging is subject to de-identification, which was in process for the larger imaging cohort
    as of August 2025. Patient-focused efforts will determine the ethical and legal approaches
    used to manage privacy and bias.

confidential_elements:
  - description: >-
      All data modalities are designated controlled access. OMOP tables and telemetry reside in
      the CHoRUS cloud enclave; clinical notes are stored locally at contributing sites and only
      tokens leave the site.
  - description: >-
      Community-facing ethics focus groups are conducted to determine what data are appropriate
      for public sharing.

human_subject_research:
  description: >-
    The dataset is assembled from retrospective clinical data of critically ill patients — more
    than 100,000 patients in the anticipated dataset — treated at 14 data-contributing hospitals.
    The project will establish a legal framework for collecting data at scale, performs
    community-facing ethics focus groups to determine what data are appropriate for public
    sharing, and conducts legal and ethical research as one of its three pillars (Data, Ethics,
    People).

participant_privacy:
  - description: >-
      Privacy is managed by tokenizing unstructured EHR data, retaining clinical notes locally at
      contributing sites, de-identifying imaging, transforming data using approaches that limit
      re-identification, and restricting all modalities to controlled access within a cloud
      enclave. Patient-focused efforts will determine the ethical and legal approaches to manage
      privacy and bias while accounting for Social Determinants of Health.

known_limitations:
  - limitation_type: coverage_limitation
    description: >-
      Modality coverage is uneven and still expanding. As of August 2025 only 1,000 images were
      available with de-identification in process for a larger cohort, EEG extraction was still
      in process, and clinical notes were stored locally with only tokens shared.
  - limitation_type: scope_limitation
    description: >-
      The dataset is restricted to acute and critical care encounters (ICU, PICU and NICU
      admissions) at participating hospitals, and is designed for questions about characterizing
      critical illness, predicting complications and measuring treatment response.
  - limitation_type: temporal_limitation
    description: >-
      The dataset is built from retrospective data collection and is incomplete relative to the
      anticipated final dataset of 100,000 admissions across 9 modalities from 14 hospitals.

license_and_use_terms:
  description: >-
    The dataset is controlled access. Access is requested from the CHoRUS team (dbold@emory.edu
    or jared.houghtaling@tuftsmedicine.org). Participants accessing the data through the
    AIM-AHEAD Bridge2AI for Clinical Care Training Program must sign a licensing agreement
    included in the registration form before gaining access to the dataset, and a ".edu" email
    address is required to gain access. Separately, the CHoRUS software project in the chorus-ai
    GitHub organization is licensed under the MIT License, with individual repositories carrying
    MIT or Apache-2.0 licenses.

distribution_formats:
  - description: OMOP Common Data Model tables for demographics, medication administration, procedures, nursing flowsheets (OMOP schema with extensions) and diagnoses.
  - description: OHNLP-format tokenized clinical notes, published against the OHNLP open source schema.
  - description: DICOM imaging files, published against the DICOM schema.
  - description: WFDB waveform telemetry files, published against an extended PhysioNet schema.
  - description: EDF+ and Persyst EEG waveform files, published against the open source EDF+ and Persyst schemas.

third_party_sharing:
  - description: >-
      The dataset is shared outside the contributing hospitals under controlled access via a
      cloud enclave. Access is requested through the CHoRUS team (dbold@emory.edu or
      jared.houghtaling@tuftsmedicine.org). Within the AIM-AHEAD Bridge2AI for Clinical Care
      Training Program, participants complete a registration form with name, email and
      institution, sign a licensing agreement, and receive an email once access is granted and
      compute is provisioned; a ".edu" email address is required.

distribution_dates:
  - description: >-
      A controlled-access release was available as of August 2025, covering 14 different
      hospitals and over 45,000 unique admissions; the project website separately describes a
      current released dataset of 50,000 ICU, PICU and NICU admissions.

existing_uses:
  - description: >-
      The datasets are being used for training activities, including the AIM-AHEAD Bridge2AI for
      Clinical Care Training Program, which expands access to Bridge2AI CHoRUS data through
      engagement, AI training and mentorship, and trains up to 30 trainees per cohort using
      Jupyter notebooks, the OHDSI tool stack and the OHDSI/OMOP common data model on the
      Bridge2AI AI/ML for Clinical Care Collaborative Cloud.
  - description: The datasets are being used for publications.

intended_uses:
  - description: >-
      Building machine-learning and artificial-intelligence-derived models to improve the care
      and outcomes of patients requiring critical care, including characterizing illness,
      predicting complications and measuring treatment response.
  - description: >-
      External validation of AI/ML models against the sequestered holdout test set to support
      adoption of models for implementation in acute and critical care.
  - description: >-
      Hands-on AI/ML training, mentorship and use-case development for clinicians, engineers and
      data scientists, including trainee poster presentations, conference abstracts and
      peer-reviewed manuscripts.
  - description: >-
      Downstream analytics on the mapped and assembled dataset by clinical collaborators, and
      development of semantic mappings and open-source tooling for clinical data.

future_use_impacts:
  - description: >-
      Anticipated benefit: catalyzing biomedical research and expertise that promotes the
      patient-focused deployment of AI in acute and critical care, and improving recovery from
      acute illness.
  - description: >-
      Anticipated risk requiring mitigation: re-identification of patients from high-resolution
      multimodal clinical data. The project transforms data using approaches that limit
      re-identification, tokenizes notes, de-identifies imaging and restricts access.
  - description: >-
      Anticipated risk requiring mitigation: bias in derived models. Patient-focused efforts will
      determine ethical and legal approaches to manage privacy and bias while accounting for
      Social Determinants of Health, and federated access is intended to enable sampling that
      ensures a balanced and diverse cohort.

maintainers:
  - role: academic_institution
    description: >-
      Massachusetts General Hospital, awardee organization for NIH award OT2OD032701; Ciera
      McCrary, MGH, Program Manager is the listed website contact, given in the source as
      "cmccrary@mgh.havard.edu".
  - role: researcher
    description: >-
      Access and inquiry contacts listed by the chorus-ai GitHub organization: dbold@emory.edu
      (Emory) and jared.houghtaling@tuftsmedicine.org (Tufts Medicine).
  - role: academic_institution
    description: >-
      The CHoRUS consortium, 60+ members across 20 different institutions, organized into
      Standards, Data Acquisition and Tooling sub-teams that maintain SOPs, mappings and software
      packages.

updates:
  description: >-
    The dataset is being expanded from the current release toward an anticipated final dataset of
    100,000 patient admissions across 9 data modalities from 14 contributing hospitals. As of
    August 2025, de-identification of a larger imaging cohort and extraction of EEG data were in
    process. Data contributing sites provide regular status updates on their extract creation and
    curation via the GitHub interface or a Google Form, which a GoogleScript propagates to the
    Standards Project or Data Acquisition Project boards; task tracking is aggregated into a
    central GitHub project.

extension_mechanism:
  description: >-
    Clinical collaborators can contribute to semantic mapping efforts through the chorus-mapping
    repository, which holds documentation and pooled tabular mappings together with an associated
    clinical validation SOP. Issues encountered during creation or submission of a data extract
    can be posted in the Standards Discussions or Data Acquisition Discussions. Software
    developers can contribute to the open-source CHoRUS packages using the web guide compiled in
    the chorus-developer repository, and package versions, maintainers and other metadata are
    tracked on a package status page.

