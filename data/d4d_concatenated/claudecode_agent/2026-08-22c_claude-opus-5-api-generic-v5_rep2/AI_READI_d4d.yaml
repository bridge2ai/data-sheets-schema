        Clinical Dataset Structure (CDS) specification v0.1.1:
        https://cds-specification.readthedocs.io/en/v0.1.1/
    archival: false
    notes: >-
      A new standard developed by the project as a simple and intuitive way to organize
      clinical research datasets and include structured metadata; the dataset and each of
      its directories are named and organized according to it.
  - external_resources:
