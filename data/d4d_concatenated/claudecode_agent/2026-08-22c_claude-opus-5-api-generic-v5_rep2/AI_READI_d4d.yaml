      - 'AI-READI dataset documentation: https://docs.aireadi.org'
    archival: false
    restrictions:
      - >-
        Shared under the CC-BY 4.0 licence, so there are no restrictions associated with
        its use.
    future_guarantees: >-
      The dataset is described as self-contained, but relies on the documentation site for
      users needing additional information about its provenance.
    notes: >-
      Provides per-domain descriptions of clinical context, acquisition, individual
      variables, file formats, data standards, metadata and example outputs, together with
      the healthsheet, citation instructions, controlled variables and AI-readiness
      sections.
  - external_resources:
      - 'AI-READI project website: https://aireadi.org'
    archival: false
    notes: >-
      Carries team information, the goals and data sharing pages, and the project contact
      route.
  - external_resources:
      - 'Zenodo community of the AI-READI project: https://zenodo.org/communities/aireadi'
    archival: true
    notes: >-
      Holds project outputs including the licence terms; version 2.0 of the licence is
      deposited at https://doi.org/10.5281/zenodo.17555036.
  - external_resources:
      - 'GitHub organization of the AI-READI project: https://github.com/AI-READI'
    archival: false
    notes: Holds the project's software and guidelines for making data AI-ready.
  - external_resources:
