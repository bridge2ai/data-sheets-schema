conforms_to: >-
  The dataset is organized according to the Clinical Dataset Structure (CDS) v0.1.1.
  Within that structure, retinal photography, OCT, OCTA and FLIO data follow Digital
  Imaging and Communications in Medicine (DICOM); electrocardiogram data follow the
  WaveForm DataBase (WFDB) file standards; clinical data follow the Observational
  Medical Outcomes Partnership (OMOP) Common Data Model; wearable activity monitor and
  continuous glucose monitoring data follow Open mHealth; and environmental sensor data
  follow the NASA ASCII File Format Guidelines for Earth Science Data.
