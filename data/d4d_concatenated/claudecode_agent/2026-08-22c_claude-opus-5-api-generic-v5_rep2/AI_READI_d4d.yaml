purposes:
  - response: >-
      To create and openly share a flagship, ethically sourced, multimodal dataset that
      enables future artificial intelligence and machine learning research into type 2
      diabetes mellitus, including salutogenic pathways back to health.
  - response: >-
      To assemble a large multimodal dataset uniformly balanced for T2DM severity,
      self-reported race/ethnicity and sex, so that models trained on it are less
      subject to the imbalances of existing large datasets.
  - response: >-
      To permit downstream pseudo-time manifold analysis, reconstructing a temporal
      atlas of T2DM development and reversal toward health from cross-sectional data
      collected across a spectrum of disease severity, agnostic to existing
      classification criteria.
  - response: >-
      To establish and disseminate standards, best practices and guidelines for the
      collection, preparation and sharing of AI-ready biomedical data, as a blueprint
      that future data generation projects can follow.

addressing_gaps:
  - response: >-
      The lack of well-designed, high quality, large and inclusive multimodal datasets
      has limited the ability to understand and affect the course of complex,
      multi-organ diseases such as type 2 diabetes mellitus.
  - response: >-
      A major barrier to AI in health research is the absence of datasets that are
      AI-ready, that is, immediately usable for AI/ML research without reformatting and
      preprocessing.
  - response: >-
      A meta-epidemiological review of type 2 diabetes studies published between 2000
      and 2020 found that samples lacked racial and ethnic diversity; the dataset is
      designed as a step toward addressing that inequity.
  - response: >-
      Current understanding of salutogenesis in type 2 diabetes, that is, the pathway
      from disease back to health, is limited.

tasks:
  - response: >-
      Development of artificial intelligence and machine learning models on multimodal
      type 2 diabetes data, including multimodal model development.
  - response: >-
      Pseudo-time manifold analysis to predict disease trajectories by learning from
      complex multimodal data collected from participants with differing disease
      severity, from normal to insulin-dependent T2DM.
  - response: >-
      Research into salutogenesis, the pathway from type 2 diabetes back to health.
    notes: >-
      The dataset is deliberately hypothesis-agnostic and ships with no labels or
      targets; these are the analytic purposes the creators designed the collection
      protocol to serve rather than predefined machine learning tasks.

acquisition_methods:
  - acquisition_details: >-
      Clinical measurements, vital signs, blood and urine laboratory assays, retinal
      imaging and electrocardiography were observed and recorded directly during a
      single in-person study visit of 2.5 to 4 hours.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
  - acquisition_details: >-
      Questionnaire and survey content, including demographics, depression screening
      (CES-D-10), Problem Areas in Diabetes (PAID-5), diabetes self-care, diet,
      ophthalmic history, substance use, general health, social determinants of health
      and current medications, was reported by participants, mostly through the online
      REDCap interface before or after the visit.
    was_reported_by_subjects: true
    was_directly_observed: false
    was_validated_verified: true
    notes: >-
      Verification of data entry was performed where possible, for example by
      cross-referencing entered medications against medications physically brought in
      or photographed by the participant.
  - acquisition_details: >-
      Ten days of at-home device recording after the visit: continuous glucose
      measurements every five minutes from a Dexcom G6, physical activity, heart rate,
      respiratory rate, oxygen saturation, sleep and stress from a Garmin Vivosmart 5
      worn on the wrist, and indoor environmental parameters from a custom LeeLab Anura
      sensor placed in a frequently used area of the home.
    was_directly_observed: true
    was_reported_by_subjects: false
  - acquisition_details: >-
      A small number of variables are derived rather than measured, including body mass
      index and waist-hip ratio calculated from measured anthropometry, calculated
      low-density lipoprotein cholesterol, calculated total globulin and albumin/globulin
      ratio, and log contrast sensitivity computed from the Mars chart scoring rule.
    was_inferred_derived: true
    was_directly_observed: false

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used for the online recruitment interface, electronic consent,
      participant-reported questionnaires and for entry of clinical data from the visit
      including the medications assessment, vitals, visual acuity, contrast sensitivity,
      monofilament results and complete blood count results. Range checks in REDCap
      flagged values outside expected minima and maxima.
  - mechanism_details: >-
      Retinal imaging used six devices chosen for their different but partially
      overlapping modalities: Optomed Aurora IQ handheld fundus camera (undilated),
      iCare EIDON widefield TrueColor confocal fundus system, Heidelberg Spectralis HRA
      OCT/OCTA, Topcon Maestro2 3D OCT-1, Topcon Triton DRI OCT, Carl Zeiss Meditec
      Cirrus 5000, and Heidelberg fluorescence lifetime imaging ophthalmoscopy. Both
      eyes were imaged, under dilation except for the Optomed.
    notes: >-
      Topcon, Optomed, iCare and Carl Zeiss loaned devices for research at no cost, and
      Heidelberg Engineering, Dexcom and Garmin provided research discounts on study
      devices.
  - mechanism_details: >-
      A 12-lead electrocardiogram was recorded with a Philips PageWriter TC30
      Cardiograph while the participant sat reclined or lay supine, with the chair
      position recorded relative to supine (0, 30, 60 or 90 degrees).
  - mechanism_details: >-
      A Dexcom G6 real-time integrated continuous glucose monitoring system was worn for
      ten continuous days, recording glucose every five minutes. Participants were
      masked to the results during the monitoring period.
  - mechanism_details: >-
      A Garmin Vivosmart 5 fitness tracker was worn on the wrist for ten continuous days
      at a five-second sampling frequency; participants recorded which wrist was used
      and their dominant hand on a returned data sheet.
  - mechanism_details: >-
      A custom-designed environmental sensor unit (LeeLab Anura, Karalis Johnson Retina
      Center, University of Washington) was placed in the home for ten days, recording
      particulate matter counts (PM1.0, PM2.5, PM4, PM10), temperature, relative
      humidity, volatile organic compounds, nitrogen oxides and eleven multi-spectral
      light intensity measurements. Participants noted where in the home it was placed.
    notes: >-
      The environmental sensor and the fitness tracker were chosen with participant
      privacy as a primary concern: they capture no video or audio, have no GPS location
      monitoring, and are not synced with participant-owned devices.
  - mechanism_details: >-
      Blood (53 mL, non-fasting) and urine were collected during the visit. CLIA-certified
      laboratories local to each site performed complete blood counts on fresh whole
      blood; all other assays were performed by the University of Washington Nutrition
      and Obesity Research Center on stored frozen samples batch-shipped on dry ice
      approximately quarterly.
  - mechanism_details: >-
      Vision and neurological testing instruments: M&S Technologies Electronic Visual
      Acuity tester with a 2.0 neutral density filter for mesopic conditions, Mars
      Perceptrix letter contrast sensitivity chart, Topcon KR 800 autorefractor, NIDEK
      and Topcon lensometers, a 10 g monofilament applied at three plantar locations per
      foot, and the Montreal Cognitive Assessment administered on an iPad using the MoCA
      Duo application.
  - mechanism_details: >-
      Blood pressure and heart rate were measured twice, two minutes apart, with an
      automatic oscillometric medically approved device; devices in use across sites
      included the OMRON HEM 907XL, the Medline MDS4001 and the Welch Allyn 6000 series
      vital signs monitor.

