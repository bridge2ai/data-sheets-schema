related_datasets:
  - relationship_type: is_new_version_of
    target_dataset: doi:10.60775/fairhub.2
    notes: >-
      Version 3.0.0 succeeds version 2.0.0, which was released on 8 November 2024 with
      1,067 participants and is recorded on FAIRhub as no longer accessible.
  - relationship_type: is_new_version_of
    target_dataset: doi:10.60775/fairhub.1
    notes: >-
      Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024 with 204 participants from
      the pilot data collection phase, is the first version in the series and is recorded
      on FAIRhub as no longer accessible.
  - relationship_type: has_part
    target_dataset: https://fairhub.io/datasets/4
    description: >-
      A smaller mini-subset of the release, intended for pipeline development, referenced
      from the version 3.0.0 dataset page and from the documentation's preliminary
      information section.
    source_caveats: >-
      The FAIRhub API records the release as having a child dataset with the internal
      integer identifier 4 and a "mini" flag of false for the parent. No DOI or title for
      the child appears in any source; the target identifier here is constructed from that
      integer against the FAIRhub dataset URL pattern and should be treated as inferred
      rather than attested.
  - relationship_type: is_documented_by
    target_dataset: https://docs.aireadi.org/
    notes: >-
      Recorded as a related identifier of type URL with relation type IsDocumentedBy in the
      DataCite metadata for the release.
  - relationship_type: is_documented_by
    target_dataset: https://aireadi.org/
    notes: >-
      Recorded as a related identifier of type URL with relation type IsDocumentedBy in the
      DataCite metadata for the release.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    derivation: Study-assigned pseudonymous identifier.
    quality_notes: >-
      Used to name the per-participant directories beneath each device directory and so to
      link a participant's data across modalities; no direct identifiers were collected.
  - variable_name: HbA1c
    unit: '%'
    data_type: float
    measurement_technique: >-
      Whole blood assay performed by the University of Washington Nutrition and Obesity
      Research Center on stored frozen samples.
    notes: >-
      Included as a marker for diabetes; the testing laboratories give a reference range of
      4.0 to 6.0 percent, which describes clinical normality rather than the range of
      values present in the data.
  - variable_name: Glucose
    unit: mg/dL
    data_type: float
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Marker for diabetes; laboratory reference range 62 to 125 mg/dL, describing clinical
      normality rather than the observed range.
  - variable_name: Insulin
    unit: ng/mL
    data_type: float
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Marker for diabetes; laboratory reference range 0.0 to 24.9 ng/mL, describing
      clinical normality rather than the observed range.
  - variable_name: C peptide
    unit: ng/mL
    data_type: float
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Indicator of insulin production; laboratory reference range 1.1 to 4.4 ng/mL,
      describing clinical normality rather than the observed range.
  - variable_name: N-terminal pro-B-type natriuretic peptide
    unit: pg/mL
    data_type: float
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Severity and outcome predictor of heart failure; the laboratory reference range
      varies by age.
  - variable_name: Troponin-T
    unit: ng/L
    data_type: float
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Marker of myocardial injury; laboratory reference range female below 11, male below
      16, describing clinical normality rather than the observed range.
  - variable_name: C reactive protein, high sensitivity
    unit: mg/L
    data_type: float
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Inflammation marker and risk factor for type 2 diabetes; laboratory reference range
      0.0 to 10.0 mg/L, describing clinical normality rather than the observed range.
  - variable_name: Total cholesterol
    unit: mg/dL
    data_type: float
    measurement_technique: Serum lipid panel performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Cardiovascular disease risk factor; laboratory reference range below 200 mg/dL.
  - variable_name: Triglycerides
    unit: mg/dL
    data_type: float
    measurement_technique: Serum lipid panel performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Cardiovascular disease risk factor; laboratory reference range below 150 mg/dL.
  - variable_name: High-density lipoprotein cholesterol
    unit: mg/dL
    data_type: float
    measurement_technique: Serum lipid panel performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Cardiovascular disease risk factor; laboratory reference range above 39 mg/dL.
  - variable_name: Low-density lipoprotein cholesterol (calculated)
    unit: mg/dL
    data_type: float
    derivation: Calculated from the serum lipid panel rather than measured directly.
    notes: >-
      Cardiovascular disease risk factor; laboratory reference range below 130 mg/dL,
      describing clinical normality rather than the observed range.
  - variable_name: Creatinine
    unit: mg/dL
    data_type: float
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Marker for kidney function; laboratory reference range female 0.38 to 1.02, male 0.51
      to 1.18 mg/dL, describing clinical normality rather than the observed range.
  - variable_name: Blood urea nitrogen
    unit: mg/dL
    data_type: float
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Marker for kidney and liver function; laboratory reference range 8.0 to 21.0 mg/dL.
  - variable_name: Blood urea nitrogen/creatinine ratio
    data_type: float
    derivation: Calculated from the serum blood urea nitrogen and creatinine values.
    notes: Indicator of kidney function.
  - variable_name: Albumin
    unit: g/dL
    data_type: float
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Useful tool for overall health status; laboratory reference range 3.5 to 5.2 g/dL.
  - variable_name: Globulin, total (calculated)
    unit: g/dL
    data_type: float
    derivation: Calculated from the serum total protein and albumin values.
    notes: Useful tool for overall health status.
  - variable_name: A/G ratio (calculated)
    data_type: float
    derivation: Calculated as the ratio of serum albumin to calculated total globulin.
    notes: Useful tool for overall health status.
  - variable_name: Urine creatinine
    unit: mg/dL
    data_type: float
    measurement_technique: >-
      Urine assay performed by the UW Nutrition and Obesity Research Center on a sample
      processed locally at the data site on the day of collection.
    notes: >-
      Urinary biomarker for early diabetic nephropathy; no reference range is given by the
      testing laboratories.
  - variable_name: Urine albumin
    unit: mg/dL
    data_type: float
    measurement_technique: >-
      Urine assay performed by the UW Nutrition and Obesity Research Center on a sample
      processed locally at the data site on the day of collection.
    notes: >-
      Urinary biomarker for early diabetic nephropathy; no reference range is given by the
      testing laboratories.
  - variable_name: Systolic blood pressure
    unit: mm Hg
    data_type: integer
    measurement_technique: >-
      Measured twice, separated by two minutes, with an automatic oscillometric medically
      approved device.
    notes: >-
      Readings above 180 mm Hg or below 100 mm Hg with symptoms of haemodynamic instability
      triggered a recommendation for emergency care.
  - variable_name: Diastolic blood pressure
    unit: mm Hg
    data_type: integer
    measurement_technique: >-
      Measured twice, separated by two minutes, with an automatic oscillometric medically
      approved device.
    notes: >-
      Readings above 120 mm Hg or below 60 mm Hg with symptoms of haemodynamic instability
      triggered a recommendation for emergency care.
  - variable_name: Heart rate (clinic vital sign)
    unit: beats per minute
    data_type: integer
    measurement_technique: >-
      Measured twice, separated by two minutes, alongside blood pressure; can also be read
      from the electrocardiogram.
    notes: >-
      Readings above 100 or below 60 beats per minute, if not known to be usual for the
      participant and accompanied by symptoms of haemodynamic instability, triggered a
      recommendation for emergency care.
  - variable_name: Body mass index
    data_type: float
    derivation: Calculated from measured height and weight.
    notes: >-
      Height, weight and waist and hip circumference were measured, followed by calculation
      of the waist-hip ratio and body mass index.
  - variable_name: Waist-hip ratio
    data_type: float
    derivation: Calculated from measured waist and hip circumference.
  - variable_name: Photopic letter visual acuity (logMAR)
    unit: logMAR
    data_type: float
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres, right and left eyes
      tested separately under best-corrected conditions using the instrument's routine
      protocol.
    notes: >-
      Expressed as the logarithm of the minimum angle of resolution; lower numbers are
      better resolution. Snellen visual acuity variables were dropped in version 3.0.0.
  - variable_name: Mesopic letter visual acuity (logMAR)
    unit: logMAR
    data_type: float
    measurement_technique: >-
      As for photopic acuity, but with the participant viewing the display through a 2.0
      neutral density filter that reduces the test to a mesopic light level.
  - variable_name: Photopic letter contrast sensitivity (log CS)
    unit: log contrast sensitivity
    data_type: float
    measurement_technique: >-
      Mars Perceptrix letter contrast sensitivity chart, read monocularly with a general
      occluder, background luminance 60 to 120 cd/m2 (optimal 85), illuminance 189 to 377
      lux (optimal 267), viewing distance 40 to 59 cm (designed 50 cm), undilated, with
      appropriate near correction.
    derivation: >-
      Scored by multiplying the number of errors before the final correct letter by 0.04
      and subtracting the result from the log CS value at the final correct letter; testing
      stops after two consecutive errors or at the end of the chart.
    notes: Higher numbers mean better sensitivity.
  - variable_name: Mesopic letter contrast sensitivity (log CS)
    unit: log contrast sensitivity
    data_type: float
    measurement_technique: >-
      Mars Perceptrix chart read monocularly through a neutral density occluder with a low
      luminance filter lens; the standardized card order was photopic OD, photopic OS,
      mesopic OD, mesopic OS.
  - variable_name: Autorefraction spherical component
    unit: diopter
    data_type: float
    measurement_technique: >-
      Topcon KR 800 autorefractor, standard protocol, obtained for each eye alongside the
      cylindrical component and cylindrical axis.
  - variable_name: Montreal Cognitive Assessment (MoCA) total score
    data_type: integer
    measurement_technique: >-
      Administered electronically on an iPad using the MoCA Duo application; the export
      includes the total score, section subscores, Memory Index Score and task completion
      times.
    notes: >-
      The instrument's maximum possible score is 30; higher numbers represent better
      performance, a score of 26 and above is considered normal and anything below 24 is
      described as a sign of cognitive impairment. Educational level and socioeconomic
      factors may affect the score. The instrument ceiling is recorded here rather than in
      maximum_value, consistently with the treatment of laboratory reference ranges,
      because the sources do not state the range of values present in the released data.
  - variable_name: Monofilament test response
    data_type: categorical
    categories:
      - 'yes'
      - 'no'
    measurement_technique: >-
      A 10 g monofilament applied to three locations on each foot, ten times per location,
      with shoes and socks removed and the participant's eyes closed; insensate areas are
      retested for confirmation.
    notes: >-
      Standard clinical test for peripheral neuropathy in people with diabetes; results
      were entered directly into REDCap by the clinical research staff.
  - variable_name: Blood glucose measurement (continuous glucose monitoring)
    unit: mg/dL
    data_type: float
    measurement_technique: >-
      Dexcom G6 real-time integrated continuous glucose monitoring system, recording every
      five minutes over a ten-day wear period.
    notes: >-
      Participants were masked to the results during monitoring; a sensor lasts a maximum
      of ten days and the transmitter stores only thirty days of data, so data must be
      downloaded within thirty days of activation.
  - variable_name: Heart rate (Garmin Vivosmart 5)
    unit: beats per minute
    data_type: float
    measurement_technique: >-
      Garmin Vivosmart 5 worn on the wrist for ten continuous days at a five-second
      sampling frequency.
    notes: >-
      Gaps occur because the device battery had to be charged every two to three days.
  - variable_name: Number of steps
    data_type: integer
    measurement_technique: Garmin Vivosmart 5 physical activity monitoring.
  - variable_name: Oxygen saturation
    unit: '%'
    data_type: float
    measurement_technique: Garmin Vivosmart 5 pulse oximetry.
  - variable_name: Respiratory rate
    data_type: float
    measurement_technique: Garmin Vivosmart 5 respiratory rate monitoring.
  - variable_name: Stress level
    data_type: float
    measurement_technique: Garmin Vivosmart 5 stress tracking.
  - variable_name: Physical activity calorie
    data_type: float
    measurement_technique: Garmin Vivosmart 5 caloric burn estimation.
  - variable_name: Sleep duration
    data_type: float
    measurement_technique: >-
      Garmin Vivosmart 5 sleep tracking, capturing circadian and diurnal rhythm and sleep
      phases.
  - variable_name: Ambient temperature
    data_type: float
    measurement_technique: >-
      Custom LeeLab Anura home environmental sensor, placed by the participant in a
      frequently used area of the home for ten days.
  - variable_name: Relative humidity
    data_type: float
    measurement_technique: Custom LeeLab Anura home environmental sensor.
  - variable_name: Particulate matter concentration (PM2.5)
    data_type: float
    measurement_technique: >-
      Custom LeeLab Anura home environmental sensor, which records PM1.0, PM2.5, PM4 and
      PM10 counts.
  - variable_name: Nitrogen oxides (NO and NO2)
    data_type: float
    measurement_technique: >-
      Custom LeeLab Anura home environmental sensor; the underlying Sensirion sensor
      reports a NOx index.
  - variable_name: Volatile organic compounds
    data_type: float
    measurement_technique: Custom LeeLab Anura home environmental sensor.
  - variable_name: Multi-spectral light intensity
    data_type: float
    measurement_technique: >-
      Custom LeeLab Anura home environmental sensor, recording eleven multi-spectral light
      intensity measurements.

notes: >-
  Both the FAIRhub dataset pages and the AI-READI documentation site carry the banner
  "This repository is under review for potential modification in compliance with
  Administration directives" in the captured snapshots, alongside a note that the FAIRhub
  platform is in beta. Several results are returned to participants rather than only
  archived: heart rate, blood pressure and visual acuity results are given on an exam card
  before the participant leaves the visit, a Dexcom report of average blood glucose and a
  Glucose Management Indicator is emailed after the ten-day monitoring period, and
  laboratory test results with normative values are sent by HIPAA-compliant encrypted email
  at the time of the yearly data release. A biorepository of plasma, serum, buffy coats,
  genomic DNA, PAXgene-stabilized RNA and peripheral blood mononuclear cells is being
  assembled at the University of Alabama at Birmingham Center for Clinical and Translational
  Science for future ancillary studies; those specimens are governed separately from this
  dataset and procedures for reviewing and prioritizing written requests were still being
  developed at the time of the source snapshots. The project also runs a year-long research
  internship programme whose inaugural 2023-2024 cohort of ten interns was 70 percent women,
  30 percent Black and 50 percent from backgrounds under-represented by NIH criteria.

source_caveats: >-
  Institutional attribution is inconsistent across tier-1 sources. The FAIRhub API metadata
  names Washington University in St. Louis as managing organization, lead sponsor,
  responsible-party affiliation and central-contact affiliation, and the licence names
  Washington University in St. Louis as Licensor; the RO-Crate, also tier 1, gives the
  principal investigator as "Aaron Lee, Department of Ophthalmology, University of
  Washington", and the study protocol publication, the NIH RePORTER record and the IRB
  application all place the award, the IRB and the principal investigator at the University
  of Washington. Same-tier disagreement is represented rather than resolved.
  The expansion of the acronym also differs: the study protocol and Nature comment write
  "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights", while the
  FAIRhub study title, README and NIH RePORTER write "Artificial Intelligence Ready and
  Exploratory Atlas for Diabetes Insights"; the tier-1 form is used here.
  Target enrolment is given as 4,000 by the FAIRhub study metadata (anticipated enrolment
  count), the study protocol publication and NIH RePORTER, and as 4,600 by the IRB
  application form; the tier-1 figure of 4,000 is preferred.
  The start of data collection is 19 July 2023 in the FAIRhub metadata and 18 July 2023 in
  the study protocol publication; the tier-1 date is used for the release collection window,
  while the pilot enrolment period is recorded from the study protocol as beginning
  18 July 2023.
  The award identifier differs between tier-1 sources: the FAIRhub DataCite metadata links
  to NIH RePORTER application 10885481 while the README acknowledgement and the NIH
  RePORTER source document give application 10471118, both for core project OT2OD032644.
  The healthsheet describes version 3.0.0 as consisting of data collected "up through the
  end of the second year of the study" while the changelog in the same source labels the
  newly added participants "year 3 data"; both statements come from the FAIRhub API record.
  The healthsheet answers "No" to whether the dataset identifies demographic
  sub-populations, while the README in the same source reports race/ethnicity and sex
  counts for the suggested split; the reconciliation is that those variables are not
  released in the public data files but their aggregate distribution is documented.
  The study base is described as patients with an encounter between 2020 and 2025 in the
  study protocol publication and as patients with an encounter "within the past 2 years" in
  the healthsheet.
  Identifiers for the file collections and subsets defined here are minted as fragments on
  the dataset DOI, because these are labels for parts of this record with no referent
  outside it. The RO-Crate assigns ARK identifiers of the form
  ark:59853/rocrate-b2ai-ai-readi-* to nine subcrate documents; those ARKs name the
  packaging documents rather than the released directories, and are recorded as external
  resources on the corresponding file collections rather than reused as directory
  identifiers.
  RO_CRATE is not listed in conforms_to_standard: an RO-Crate metadata document describes
  the release, but no source states that the distributed dataset is itself packaged as an
  RO-Crate, and the released tree is organized per the Clinical Dataset Structure.
  Two enum values are interpretations rather than transcriptions and are flagged locally:
  confidentiality_level "restricted" against the RO-Crate's "HL7:2N (normal)", and
  hipaa_compliant "compliant", which no source states in those terms.
  The variable list recorded here covers the measured and derived domains named across the
  sources but is not the released column inventory: the sources give laboratory test names,
  units and laboratory reference ranges and device-level variable lists, but not the
  released column names or observed value ranges. Laboratory reference ranges and the MoCA
  instrument ceiling are recorded as notes rather than as minimum_value and maximum_value,
  because both describe clinical or instrument normality rather than the range of values
  present in the data.