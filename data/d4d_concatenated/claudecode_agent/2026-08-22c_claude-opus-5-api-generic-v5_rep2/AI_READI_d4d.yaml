data_collectors:
  - role: clinical research coordinator
    collector_details: >-
      Clinical research coordinators at the three sites recruited, consented and
      enrolled participants and performed the visit procedures. All research personnel
      underwent training by the data manager at the University of Alabama at Birmingham
      against a detailed Manual of Procedures, completed mandatory institutional
      compliance training for human subject research, and had to administer all protocol
      elements to at least three volunteer practice subjects before enrolling
      participants.
  - role: data manager
    collector_details: >-
      Data managers at each site oversaw the certification process, reviewed REDCap
      reports of flagged values with the coordinators, and were responsible for quality
      control of all data before upload to FAIRhub.
  - role: retinal imaging technician
    collector_details: >-
      Retinal imaging technicians acquired images on the six imaging devices and were
      trained to detect potentially life- or vision-threatening findings (retinal
      detachment, tumor, optic disc edema) for immediate referral.
  - role: laboratory personnel
    collector_details: >-
      CLIA-certified laboratories local to each site performed complete blood counts;
      the University of Washington Nutrition and Obesity Research Center performed the
      remaining blood and urine assays; the University of Alabama at Birmingham Center
      for Clinical and Translational Science performed biospecimen processing, genomic
      DNA extraction and biobanking.
  - role: central project team
    collector_details: >-
      The central project team received data from the sites and performed the additional
      processing, standardization and packaging steps before dissemination.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from participants at the three recruiting sites. This
      was active data collection rather than passive collection or secondary use of
      existing data. Recruitment pools were identified beforehand by screening electronic
      health records for diabetes and pre-diabetes ICD-10 codes among patients who had
      had an encounter with the sites' health systems.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      All patients aged 40 years or older who had a medical encounter within each health
      system site (University of Alabama at Birmingham, University of California San
      Diego, University of Washington). Patients with T2DM and pre-diabetes were
      identified by screening electronic health records for ICD-10 codes E11.X and
      R73.09 respectively; patients without diabetes have no encounters with these codes.
    strategies: >-
      Non-probability, triple-balanced sampling. Rather than targeting the demographic
      distribution of the US population, the study recruits four race/ethnic groups
      (Asian, Black, Hispanic, White), four T2DM categories (no diabetes;
      pre-diabetes/lifestyle-controlled; controlled by oral or non-insulin injectable
      medication; insulin-controlled) and both biological sexes in approximately equal
      proportions. Participants are recruited in waves; the composition and size of each
      wave is influenced by the observed participation characteristics of race/ethnicity,
      gender, T2DM severity and site, and is adjusted by under- and oversampling groups
      as needed. Contact pools are mailed a personalized hardcopy invitation letter and
      an invitation email directing them into an online REDCap recruitment interface.
    why_not_representative: >-
      The sample is deliberately balanced rather than demographically representative, so
      that machine learning models trained on it are not skewed by the population
      distribution. Recruitment is predominantly urban and hospital-based, may not
      capture the full range of cultural and socioeconomic backgrounds, and does not
      include other races and ethnicities such as Pacific Islanders and Native Americans.
      Participation is voluntary, introducing volunteer bias, and participants must speak
      and read English.
  - is_sample: false
    strategies: >-
      No further sampling was applied when assembling the release: the dataset contains
      all participants enrolled within the collection window rather than a subset of them.

instances:
  - instance_type: individual participant
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    label_description: >-
      No explicit label or target is associated with any instance. The dataset is
      hypothesis-agnostic and was assembled to support multiple potential downstream
      AI/ML applications rather than a single predefined task, so no gold-standard,
      proxy or human-assigned labels are provided and no labeling software was used.
    notes: >-
      Each instance consists of all data available for one individual participating in
      the study, spanning survey, clinical, retinal imaging, environmental sensor,
      continuous glucose monitor and wearable activity monitor modalities, that is,
      tabular data, imaging data and physiological signal or waveform data. No
      unstructured text data are included. Version 1.0.0 contained 204 instances and
      version 2.0.0 contained 1,067.

relationships:
  - relationship_details: >-
      All instances are part of the same prospective data generation project, and there
      is currently only one study visit per participant. Within the dataset, files for a
      given participant are grouped in per-participant directories named after the
      participant's study identifier beneath each datatype, modality and device
      directory, which is what links a participant's modalities to one another.
  - relationship_details: >-
      Approximately 10 percent of the study cohort is planned to return for a follow-up
      visit in year four of the project, which would create a longitudinal relationship
      between instances in a future release.

