splits:
  - split_details: >-
      The release includes a recommended split into training, validation and test sets
      in proportions of 70, 15 and 15 percent, recorded in the participants.tsv file:
      1,576 participants for training, 352 for validation and 352 for testing. Because
      sex, race and ethnicity are not released with the public version, the project team
      prepared the split themselves so that the validation and test sets are balanced as
      well as possible for sex, race/ethnicity and diabetes status; the stated rationale
      is to reduce disparities in models developed from the dataset when demographic
      labels are unavailable to the user. This is a new recommended split introduced with
      version 3.0.0; no new tasks or labels accompany it.

