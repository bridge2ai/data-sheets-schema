name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  The June 2026 Data Release (Beta) of Cell Maps for Artificial Intelligence (CM4AI),
  the Functional Genomics Grand Challenge in the U.S. National Institutes of Health
  Bridge2AI program. CM4AI generates multi-modal data including protein-protein
  interaction (PPI), spatial localization, and genetic perturbation data in MDA-MB-468
  breast cancer cells (with and without paclitaxel or vorinostat treatment) and
  KOLF2.1J induced pluripotent stem cells (with and without differentiation). The
  release record describes the Beta release as including: perturb-seq data for
  MDA-MB-468 breast cancer cells with and without treatment and undifferentiated
  (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast cancer cells with and
  without treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived neural
  progenitor cells (NPCs), neurons, and cardiomyocytes; AP-MS data for treated
  MDA-MB-468 breast cancer cells; and immunofluorescence images in MDA-MB-468 breast
  cancer cells with and without treatment. The ten-file inventory of this release
  contains perturb-seq archives for KOLF2.1J only; the external perturb-seq links for
  both KOLF2.1J iPSCs and MDA-MB-468 breast cancer cells are marked "Embargoed", so the
  MDA-MB-468 perturb-seq component named in the release prose is not represented among
  the deposited files. CM4AI output data are packaged with provenance graphs and rich
  metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework. CM4AI
  is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham,
  Simon Fraser University, and the Hastings Center.
