purposes:
  - name: Map the spatiotemporal architecture of human cells
    description: >-
      As part of the NIH Common Fund Bridge2AI program, the CM4AI data generation
      project seeks to map the spatiotemporal architecture of human cells and use these
      maps toward the grand challenge of interpretable genotype-phenotype learning.
  - name: Deliver ethical, AI-ready maps of cell architecture
    description: >-
      CM4AI's objective is to deliver machine-readable hierarchical maps of cell
      architecture as AI-Ready data produced from multimodal interrogation of chromatin
      modifiers and metabolic enzymes involved in cancer, neuropsychiatric, and cardiac
      disorders in disease-relevant cell lines under perturbed and unperturbed
      conditions, using mass spectrometry based proteomics, spatial proteomics / cell
      imaging, and genetic perturbations using CRISPR.
  - name: Enable "visible" machine learning systems
    description: >-
      The project aims to broadly stimulate research and development in "visible"
      machine learning systems informed by multi-scale cell and tissue architecture,
      which are built directly on knowledge maps of cell and tissue architecture rather
      than being difficult-to-interpret black boxes.
  - name: Establish FAIR, provenanced data management standards
    description: >-
      The project implements a standards data management approach based on FAIR access
      and software principles, with deep provenance and replication packages for
      representation of cell maps and their underlying datasets.
  - name: Initiate a research program in ethical AI
    description: >-
      The project initiates a research program in ethical AI, especially as it relates
      to how cell maps will be used in genomic medicine and model interpretation, and
      develops guidelines, a value repository, and a CM4AI Life Cycle governance
      framework.
  - name: Stimulate training in biomedical machine learning
    description: >-
      The project aims to stimulate a diverse portfolio of training opportunities in the
      emerging field of biomachine learning, recruiting and training a diverse group of
      participants in the scientific approach, data standards, and tools of CM4AI.

addressing_gaps:
  - name: Black-box machine learning in genomics and precision medicine
    description: >-
      In genomics and precision medicine, machine learning models are often "black
      boxes," predicting phenotypes from genotypes without understanding the mechanisms
      by which such translation occurs. CM4AI was created to address this deficiency by
      supplying knowledge maps of cell and tissue architecture on which interpretable
      models can be built.
  - name: Absence of ethical, AI-ready, provenanced cell architecture data
    description: >-
      The project addresses the need for fully characterized FAIR data of known
      provenance that can be ethically and reliably processed by AI applications, whose
      models and software are available and well-described for validation and re-use,
      and whose predictions may be fully explained and interpreted to the user.
  - name: Lack of matched multimodal coverage across cell types and conditions
    description: >-
      CM4AI generates deep multi-modal data for a shared list of proteins across all
      cell types and treatment conditions, described by the project as intended to
      achieve an unparalleled level of biological insight, in contrast to modality- and
      condition-specific efforts pursued separately.

tasks:
  - name: Interpretable genotype-phenotype learning
    description: >-
      The grand challenge toward which CM4AI maps are directed: learning that connects
      genotype to phenotype while exposing the cellular mechanisms by which translation
      occurs.
  - name: Visible machine learning / visible neural network development
    description: >-
      Cell maps have been used in AI tools for "visible machine learning" or "visible
      neural networks" (VNNs) to interrogate how protein assemblies in the cell affect
      cell-level phenotype predictions. Building a visible neural network using cell
      maps is a stated objective of the CM4AI in-person internship curriculum.
  - name: Construction of hierarchical cell maps from multimodal input streams
    description: >-
      Integration of protein localization and protein interaction data using
      self-supervised embedding approaches from deep learning, followed by algorithmic
      community detection at multiple resolutions to generate a hierarchy of protein
      assemblies.
  - name: Protein complex and protein-protein interaction mapping
    description: >-
      SEC-MS and AP-MS data support proteome-wide complex and interaction mapping,
      including detection of differential elution profiles between control and treated
      cells.
  - name: Spatial subcellular protein localization analysis
    description: >-
      Immunofluorescence confocal image data support mapping the spatial subcellular
      organization of proteins of interest in MDA-MB-468 cells under treated and
      untreated conditions.
  - name: Integrative structure modeling of protein assemblies
    description: >-
      Bioinformatic ranking of protein communities by available structural information
      followed by integrative structure modeling using the Integrative Modeling Platform,
      to increase understanding of the communities and help plan future experiments.

