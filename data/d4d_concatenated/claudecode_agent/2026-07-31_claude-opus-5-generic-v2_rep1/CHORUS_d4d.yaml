id: https://chorus4ai.org/dataset
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multi-center, multi-modal, high-resolution critical care dataset produced by one of four
  data generation projects of the NIH Common Fund Bridge2AI consortium. The dataset assembles
  retrospectively collected clinical data from intensive care admissions (ICU, PICU and NICU) at
  contributing hospitals in a 20-institution academic network, of which 14 serve as data acquisition
  centers. Modalities include structured electronic health record data standardized to the OMOP Common
  Data Model (demographics, diagnoses, procedures, time-stamped medication administration, nursing
  flowsheets), clinical notes extracted and tokenized with the OHNLP toolkit, radiology imaging from
  hospital PACS in DICOM, waveform telemetry from bedside monitors and gateway/middleware in WFDB,
  EEG waveforms in EDF+ and Persyst formats, and social determinants of health and contextual data.
  The project website reports a current released dataset of 50,000 patient admissions containing
  1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data and 23 Tb of waveform data,
  against an anticipated final dataset of 100,000 patient admissions and 9 data modalities from 14
  contributing hospitals. Access is controlled, and the data are hosted in a cloud enclave.
page: https://chorus4ai.org/
status: >-
  Active NIH-funded data generation project (award period 2022-09-01 to 2026-11-30) with a current
  controlled-access released dataset and further modalities in preparation. The project website
  carries the notice "This repoitory is under review for potential modification in compliance with
  Administration directives."
keywords:
  - critical care
  - intensive care
  - acute illness
  - artificial intelligence
  - machine learning
  - OMOP Common Data Model
  - electronic health records
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - Bridge2AI
  - multimodal data
  - equitable AI
  - controlled access
is_tabular: false
conforms_to: >-
  OMOP Common Data Model (OHDSI). Modality-specific standards used for individual data types are
  recorded on the corresponding file collections and distribution formats.
created_by: >-
  CHoRUS Network / CHoRUS consortium, comprising 60+ members across 20 different institutions;
  Massachusetts General Hospital is the awardee organization for NIH award 1OT2OD032701-01.
was_derived_from: >-
  Retrospective clinical records extracted from the electronic health record, PACS imaging archives,
  bedside monitor telemetry gateways and hospital EEG databases of 14 data acquisition hospitals in
  the CHoRUS network.

