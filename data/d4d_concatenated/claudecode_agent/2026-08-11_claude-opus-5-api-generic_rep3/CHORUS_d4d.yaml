subsets:
  - id: https://chorus4ai.org/dataset#structured-ehr-omop
    name: Structured EHR data (OMOP CDM)
    description: >-
      Demographics, medication administration (dosing time-stamped upon each infusion change or dose
      administration), provider-documented procedures, high-frequency nursing flowsheet documentation,
      and provider-documented diagnoses, standardized to the OMOP Common Data Model. Reported as 1.6
      billion rows in the current release. Held in the cloud enclave under controlled access. The
      webinar notes a published metadata schema based on the OMOP schema, with extensions for at least
      one modality.
    conforms_to: "OHDSI/OMOP Common Data Model"
  - id: https://chorus4ai.org/dataset#clinical-notes
    name: Clinical notes (tokenized)
    description: >-
      Unstructured clinical notes extracted and tokenized using the OHNLP toolkit. Notes are stored
      locally at contributing sites; only tokens are held centrally. Controlled access; the OHNLP open
      source schema is cited as the published metadata schema.
    conforms_to: "OHNLP open source schema"
  - id: https://chorus4ai.org/dataset#imaging
    name: Imaging (DICOM from PACS)
    description: >-
      Radiology imaging extracted from hospital PACS in DICOM format. 7,642 admissions have associated
      radiology data in the current release; as of September 2025, 1000 images were available with
      de-identification in process for a larger cohort. Controlled access.
    conforms_to: DICOM
  - id: https://chorus4ai.org/dataset#waveform-telemetry
    name: Waveform telemetry
    description: >-
      Physiologic waveform telemetry captured from bedside monitors via gateway/middleware, distributed
      in WFDB format (described as PhysioNet schema extended). The website reports 23 Tb of waveform
      data in the current release. Held in the enclave under controlled access.
    conforms_to: "WFDB (PhysioNet schema, extended)"
  - id: https://chorus4ai.org/dataset#eeg
    name: Waveform EEG
    description: >-
      Electroencephalography waveforms sourced from hospital EEG databases in EDF+ and Persyst formats.
      Extraction was described as in process as of September 2025. Controlled access.
    conforms_to: "EDF+ and Persyst"

splits:
  - split_details: >-
      The project will provision a sequestered holdout test set, accessible for external validation of
      models to aid marketplace adoption of AI-developed models in acute and critical care. The size,
      construction rule and access route for the holdout set are not specified in the available sources.

acquisition_methods:
  - acquisition_details: >-
      Retrospective extraction of data generated in the course of clinical care at 14 data-contributing
      hospitals: structured EHR data, unstructured EHR text (tokenized), telemetry and EEG waveforms,
      imaging from PACS, and social determinants of health. Sites follow validated standard operating
      procedures to create and submit a CHoRUS Data Extract, which is then standardized, tokenized,
      stored, visualized and labeled.

direct_collection:
  - collection_details: >-
      Data are obtained from hospital clinical systems at data-contributing sites rather than solicited
      directly from patients; the webinar characterizes the dataset as retrospective data collection.

collection_mechanisms:
  - mechanism_details: >-
      Site-side extraction and upload tooling (the chorus-extract-upload repository provides tools to
      create and upload a CHoRUS Data Extract); the OHNLP toolkit for extracting and tokenizing clinical
      notes; PACS export for DICOM imaging; bedside monitors with gateway/middleware for telemetry
      waveforms; hospital EEG databases for EDF+/Persyst EEG; DeGauss-based geocoding of OMOP Location
      entities; dockerized container applications deployed to support CHoRUS services on Azure.

data_collectors:
  - collector_details: >-
      Data site managers at the 14 Data Acquisition centers, drawn from the 20 academic centers of the
      CHoRUS Network, perform extraction and submission following the Chorus_SOP workflow. Clinical
      collaborators contribute to semantic mapping and validation under a clinical validation SOP.
      Sites provide regular status updates through the GitHub interface or a Google Form, which are
      routed into the Standards Project or the Data Acquisition Project boards.

collection_timeframes:
  - timeframe_details: >-
      Retrospective collection; the calendar interval of the clinical encounters included is not stated
      in any source. Dataset scale is reported as of August 2025 (14 hospitals, over 45K unique
      admissions). The funded project period runs 2022-09-01 to 2026-11-30.

sampling_strategies:
  - strategies:
      - "Sampling designed to ensure comprehensive sets of patient conditions and clinical treatment strategies"
      - "Federated access enabling sampling methods intended to ensure a balanced and diverse cohort"
    source_caveats: >-
      Inclusion and exclusion criteria, per-site quotas and the definition of a balanced cohort are not
      specified in the available sources; no verification of representativeness is reported.

raw_data_sources:
  - source_description: "Hospital electronic health record systems at data-contributing sites, supplying demographics, medication administration, procedures, diagnoses and nursing flowsheet documentation"
    source_type: "Clinical operational system"
    raw_data_format: "Site-native EHR extracts, transformed to the OMOP Common Data Model"
  - source_description: "Unstructured clinical notes from hospital EHR systems"
    source_type: "Clinical operational system"
    raw_data_format: "Free text, extracted and tokenized with the OHNLP toolkit; source notes remain stored locally at sites"
  - source_description: "Hospital picture archiving and communication systems (PACS)"
    source_type: "Clinical imaging archive"
    raw_data_format: DICOM
  - source_description: "Bedside physiologic monitors, accessed through gateway/middleware"
    source_type: "Medical device telemetry"
    raw_data_format: "Waveform telemetry, converted to WFDB"
  - source_description: "Hospital EEG database"
    source_type: "Clinical neurophysiology archive"
    raw_data_format: "EDF+ and Persyst"

raw_sources:
  - raw_data_details: >-
      Source clinical notes are retained locally at contributing sites; only tokenized representations
      are held centrally. Other raw extracts are transformed at or near the site before delivery into
      the enclave.

preprocessing_strategies:
  - preprocessing_details: >-
      Standardization of structured EHR data to the OMOP Common Data Model, with validated semantic
      mappings pooled and documented in the chorus-mapping repository and subject to a clinical
      validation SOP.
  - preprocessing_details: >-
      Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit.
  - preprocessing_details: >-
      Transformation of data using approaches that limit re-identification, and de-identification of
      imaging prior to release.
  - preprocessing_details: >-
      Conversion of waveform data into WFDB and preparation of waveforms for release, supported by
      dedicated waveform conversion scripts and documentation.
  - preprocessing_details: >-
      Geocoding of OMOP Location entities via DeGauss to derive contextual and social determinant
      variables such as geographic distance to the nearest hospital.

cleaning_strategies:
  - cleaning_details: >-
      Data-contributing sites follow standard operating procedures that have undergone internal
      validation and review; characterization reports are produced and returned to sites following each
      data submission to support quality review. Site status tracking is used to identify and resolve
      blocking issues in extract creation and curation.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment is being developed to label data with targets important
      for prediction; the NIH abstract lists capabilities to acquire, standardize, tokenize, store,
      visualize and label data across the multi-center network.
    source_caveats: >-
      Annotator qualifications, annotation protocol, number of annotations per item and inter-annotator
      agreement are not reported in any source.

machine_annotation_tools:
  - tools:
      - "OHNLP toolkit"
      - "DeGauss (via the UF-Geocoding repository)"
      - "privacy_scan_tool"
    tool_descriptions:
      - "Used to extract and tokenize unstructured clinical notes; an open source OHNLP schema is cited for the resulting data"
      - "Open source code to geocode OMOP Location entities"
      - "A privacy scan tool for medical records"

missing_data_documentation:
  - missing_data_patterns: >-
      Modality coverage is uneven across the release: clinical notes are stored locally at sites with
      only tokens available centrally; imaging was limited to 1000 de-identified images as of September
      2025 with de-identification in process for a larger cohort; EEG extraction was in process at that
      time. Published metadata was marked as planned rather than available for some modalities.
    handling_strategy: >-
      Remaining modalities are being extracted, de-identified and released incrementally toward the
      anticipated final dataset of 100,000 admissions across 9 modalities.
    source_caveats: >-
      Item-level missingness within OMOP tables, waveform gaps and note availability rates are not
      quantified in any source; the per-modality metadata availability column of the webinar table could
      not be read reliably.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Modality coverage is incomplete in the current release: imaging de-identification and EEG
      extraction were still in process as of September 2025, and full clinical note text is not
      centrally available — only OHNLP tokens.
    scope_impact: "Analyses requiring full-text notes, large imaging cohorts or EEG cannot yet be performed at full scale."
    recommended_mitigation: "Check current modality availability with the project before planning multimodal analyses."
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset covers admissions to intensive care settings (ICU, PICU, NICU) at 14 contributing
      hospitals within the CHoRUS Network; it is not a general-population or general-hospital dataset.
    scope_impact: "Findings may not transfer to non-critical-care populations or to care settings outside the contributing hospitals."
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Contributing sites are 14 hospitals drawn from 20 U.S. academic centers. No representativeness
      assessment, demographic distribution or site-level distribution is published in the available
      sources, despite explicit project goals of diversity and balance.
    recommended_mitigation: "Treat cohort composition as unverified; examine site and demographic distributions within the enclave before generalizing."
  - limitation_type: temporal_limitation
    limitation_description: >-
      Collection is retrospective and the release is a snapshot; the calendar period covered by the
      encounters is not stated, and the reported scale differs between the August 2025 webinar snapshot
      and the project website.
  - limitation_type: integration_limitation
    limitation_description: >-
      Data are distributed across heterogeneous standards (OMOP, OHNLP, DICOM, WFDB, EDF+/Persyst) with
      clinical notes physically separated from the enclave, so linking modalities requires working
      within the controlled-access environment and its tooling.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Instances arise from patients admitted to critical care units at 14 hospitals participating in a
      network of 20 U.S. academic centers, so the cohort reflects the referral patterns and patient
      populations of those institutions rather than a defined general population.
    mitigation_strategy: >-
      The project states that federated access will enable sampling methods to ensure a balanced and
      diverse cohort, that sampling is designed to cover comprehensive sets of patient conditions and
      treatment strategies, and that patient-focused efforts will determine ethical and legal approaches
      to manage privacy and bias while accounting for social determinants of health.
    source_caveats: >-
      No quantitative bias assessment, fairness audit or subgroup performance analysis is reported in
      any source; this entry records the structural source of bias described by the project design, not
      a measured effect.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset derives from protected clinical records of critically ill patients and includes
      demographics, diagnoses, procedures, medication administration, nursing flowsheets, clinical note
      content in tokenized form, radiology images, physiologic and EEG waveforms, and social
      determinants of health together with contextual geographic factors such as distance to the nearest
      hospital. All modalities are listed as controlled access.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Clinical notes are stored locally at contributing sites and are not placed in the shared enclave;
      only tokens derived with the OHNLP toolkit are made available. All data modalities are under
      controlled access, and community-facing ethics focus groups are used to determine what data is
      appropriate for public sharing.

is_deidentified:
  identifiable_elements_present: true
  identifiers_removed:
    - "Direct identifiers in clinical note text, replaced by OHNLP-derived tokens"
    - "Identifiers within imaging, removed by an in-process de-identification pipeline before release"
  deidentification_details: >-
    The project transforms data using approaches that limit re-identification, tokenizes unstructured
    EHR data, and de-identifies imaging before release (1000 images available as of September 2025 with
    de-identification in process for a larger cohort). A dedicated privacy scan tool for medical records
    is maintained in the GitHub organization, and a CTP-deid repository is present. Residual protection
    is provided by controlled access within a cloud enclave rather than by de-identification alone.
  source_caveats: >-
    No de-identification standard (for example HIPAA Safe Harbor or Expert Determination) is named, and
    no residual re-identification risk assessment is reported.

participant_privacy:
  - anonymization_method: >-
      Tokenization of unstructured EHR text with the OHNLP toolkit; de-identification of imaging;
      transformation of data using approaches that limit re-identification.
    privacy_techniques:
      - "Local retention of clinical notes at contributing sites, with only tokens shared"
      - "Controlled-access cloud enclave with provisioned compute rather than open download"
      - "Automated privacy scanning of medical records"
      - "Community ethics focus groups to determine what data is appropriate for public sharing"
    data_linkage: >-
      Modalities are linked at the level of the patient admission, so that OMOP records, notes tokens,
      imaging, telemetry and EEG can be associated with the same encounter.
    source_caveats: "Re-identification risk is not quantified in any source."

data_protection_impacts:
  - impact_details: >-
      The Ethics pillar of the project performs legal and ethical research to establish a framework for
      collecting data at scale, analyses the existing legal and regulatory landscape, evaluates community
      perspectives on clinical care AI, and runs community-facing ethics focus groups to determine what
      data is appropriate for public sharing, with the aim of increasing trustworthiness of provenance
      and privacy.
    source_caveats: "No formal data protection impact assessment document is cited."

ethical_reviews:
  - review_details: >-
      The project describes an Ethics pillar covering ethical and trustworthy AI, legal research on
      collecting data at scale, and community-facing ethics focus groups. Ethics of clinical AI is also
      taught within the associated training program.
    source_caveats: >-
      No institutional review board, ethics committee, protocol number or approval date is identified in
      any of the available sources.

human_subject_research:
  involves_human_subjects: true
  notes: >-
    The dataset consists of retrospective clinical data from more than 100,000 critically ill patients
    at target scale, including pediatric and neonatal intensive care admissions.
  source_caveats: >-
    No IRB approval, ethics review board name, waiver of consent, or explicit statement of regulatory
    compliance framework for the dataset is present in the available sources.

at_risk_populations:
  at_risk_groups_included:
    - "Critically ill adults unable to provide contemporaneous consent"
    - "Pediatric patients (PICU admissions)"
    - "Neonates (NICU admissions)"
  source_caveats: >-
    Special protections, guardian consent procedures and assent procedures for these groups are not
    described in any of the available sources.

license_and_use_terms:
  license_terms: >-
    Access to the CHoRUS dataset is controlled. In the AIM-AHEAD Bridge2AI for Clinical Care training
    pathway, participants complete a registration form giving name, email and institution, and all
    participants must sign a licensing agreement included in the registration form before gaining access
    to the dataset; access is granted together with provisioned compute, notified by email. A ".edu"
    email address is required to gain access to the dataset in that pathway, although program
    administrators state that this is not a barrier to acceptance and will assist with access if needed.
    Separately, the chorus-ai GitHub project code is licensed under the MIT License, with individual
    repositories carrying MIT or Apache-2.0 licenses.
  contact_person: "Request access: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org"
  source_caveats: >-
    The full text of the dataset licensing agreement is not included in any source, and the described
    registration route is documented specifically for the AIM-AHEAD training cohort; general-purpose
    request terms outside that program are not stated beyond the two request-access contacts.

ip_restrictions:
  restrictions: >-
    Software produced by the project is open source (MIT License for the chorus-ai project, with
    Apache-2.0 on at least one repository); the dataset itself is not openly licensed and requires a
    signed licensing agreement and controlled-access provisioning.

regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions: >-
    All listed data modalities — demographics, medication administration, procedures, nursing flowsheets,
    diagnoses, clinical notes, imaging, waveform telemetry and EEG — are marked as controlled access.
    Clinical notes may not leave contributing sites except as tokens.
  source_caveats: >-
    No explicit HIPAA, GDPR or export-control determination for the dataset is stated in the available
    sources; HIPAA and GDPR appear only as topics of a training-program workshop on IRB, data compliance
    and quality assurance, not as declarations about this dataset.

distribution_formats:
  - format: "OMOP Common Data Model tables"
    notes: "Demographics, medication administration, procedures, nursing flowsheets and diagnoses; held in the cloud enclave under controlled access; published metadata schema based on the OMOP schema, with extensions noted for at least one modality."
  - format: "OHNLP tokenized text"
    notes: "Clinical notes extracted and tokenized with the OHNLP toolkit; source notes remain stored locally at contributing sites; OHNLP open source schema cited."
  - format: DICOM
    media_type: application/dicom
    notes: "Imaging exported from hospital PACS; DICOM schema cited as the published metadata schema."
  - format: "WFDB"
    notes: "Waveform telemetry from bedside monitors and gateway/middleware; described as PhysioNet schema extended."
  - format: "EDF+ and Persyst"
    notes: "EEG waveforms from hospital databases; open source EDF+ and Persyst schemas cited."

third_party_sharing:
  - is_shared: true
    notes: >-
      Data are shared beyond the contributing institutions under controlled access, including to
      trainees of the AIM-AHEAD Bridge2AI for Clinical Care Training Program who work on the Bridge2AI
      AI/ML for Clinical Care Collaborative Cloud, and to external parties for holdout-set model
      validation. Extensive collaboration is described with the NIH Bridge2AI program and Bridge Center,
      external biomedical and clinical organizations, industry, and regulatory agencies.

maintainers:
  - maintainer_details: >-
      CHoRUS Network consortium, coordinated from Massachusetts General Hospital; program manager Ciera
      McCrary (MGH), listed contact cmccrary@mgh.havard.edu. Data access requests are directed to
      dbold@emory.edu or jared.houghtaling@tuftsmedicine.org. The chorus-ai GitHub organization
      publishes package versions, maintainers and other package metadata on a package status page.
    role: academic_institution

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    The chorus-ai GitHub organization hosts 28 repositories providing software and tooling for clinical
    data in diverse formats, validated semantic mappings to international standards, standard operating
    procedures instructing contributing sites on curating and delivering interoperable datasets, and
    project management overviews tracking data delivery status and task dependencies. Data site managers
    start from the Chorus_SOP interactive workflow diagram; issues can be raised in the Standards
    Discussions or Data Acquisition Discussions. Clinical collaborators can contribute to semantic
    mapping through the chorus-mapping repository and its clinical validation SOP. Sites submit status
    updates via GitHub or a Google Form connected to the GitHub API by a GoogleScript.

updates:
  update_details: >-
    The dataset is being expanded from the current release toward an anticipated final dataset of
    100,000 patient admissions across 9 data modalities from 14 contributing hospitals. Imaging
    de-identification for a larger cohort and EEG extraction were in process as of September 2025, and
    published metadata was marked as planned for some modalities. Repository activity in the chorus-ai
    organization was ongoing as of November 2025.
  source_caveats: "No release cadence, versioning policy or scheduled update dates are stated."

use_repository:
  - repository_url: https://github.com/chorus-ai
    repository_details: >-
      The chorus-ai GitHub organization (37 followers, 28 repositories, 3 projects) hosts tooling,
      mappings, SOPs and project boards. Notable repositories include chorus-container-apps (dockerized
      container applications supporting CHoRUS services on Azure), Chorus_SOP (centralized SOP
      documentation site), chorus_waveform and chorus_waveform_resources (waveform documentation and
      conversion scripts), chorus-extract-upload (tools to create and upload a CHoRUS Data Extract),
      CHoRUSReports (characterization reports returned to sites after submissions), privacy_scan_tool,
      CTP-deid, UF-Geocoding, CADA, data_acq_SOP, cloud_public and chorus-apps-internal.

external_resources:
  - external_resources:
      - "https://chorus4ai.org/ — project website with dataset snapshot, project components and contact details"
      - "https://github.com/chorus-ai — CHoRUS for Equitable AI GitHub organization"
      - "www.bridge2ai.org/chorus — Bridge2AI project page listed as the CHoRUS website in the GitHub README"
      - "https://reporter.nih.gov/project-details/10472824 — NIH RePORTER record for OT2OD032701"
      - "https://www.aim-ahead.net/media/jnzdnid3/bridge2ai-for-clinical-care-informational-webinar-cohort-2.pdf — AIM-AHEAD Bridge2AI for Clinical Care Training Program Cohort 2 informational webinar"
    restrictions: >-
      The project website carries a notice that the repository is under review for potential
      modification in compliance with Administration directives.
    source_caveats: >-
      No archival guarantees or persistent identifiers are stated for any of these resources.