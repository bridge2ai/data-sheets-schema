purposes:
  - response: >-
      To meet the need for infrastructure supporting artificial intelligence and machine learning in
      critical care by generating data for ML/AI applications aimed at characterizing acute and
      critical care illness, predicting complications, and measuring treatment response among patients
      with acute or critical illness.
  - response: >-
      To develop a publicly available, AI-ready critical care dataset while ensuring that the methods
      used promote privacy, accountability and clinical benefit.
  - response: >-
      To provision a holdout test set accessible for external validation of models, aiding marketplace
      adoption of AI-derived models for implementation in acute and critical care.
  - response: >-
      To develop the network, tools, standards, data and education needed to build ML/AI-derived models
      that improve the care and outcomes of patients requiring critical care, and to cultivate a new
      generation of AI clinicians and scientists.

addressing_gaps:
  - response: >-
      Developing high-resolution multi-center datasets is described as a critical first step toward
      actionable and trustworthy AI; the project addresses the absence of infrastructure to support
      AI/ML in critical care.
  - response: >-
      Existing datasets are described as lacking the diversity and resolution needed; CHoRUS aims to
      acquire and standardize a dataset of unprecedented diversity and high resolution across
      multi-modal EHR, waveform, imaging and text data.
  - response: >-
      The absence of sequestered holdout data for external validation of clinical AI models is
      addressed by sequestering holdout datasets.
  - response: >-
      A legal and ethical framework for collecting critical care data at scale, and community input on
      what data is appropriate for public sharing, are treated as gaps addressed through legal research
      and community-facing ethics focus groups.

tasks:
  - response: "Characterizing acute and critical care illness."
  - response: "Predicting complications and clinical deterioration among patients with acute or critical illness."
  - response: "Measuring treatment response in acute and critical care."
  - response: "External validation of AI/ML models against a sequestered holdout test set."

intended_uses:
  - use_category: "Biomedical and clinical AI/ML research on acute and critical care"
    examples:
      - "Development of machine learning and AI models to improve care and outcomes of patients requiring critical care"
      - "Prediction of complications and deterioration in critically ill patients"
      - "Measurement of treatment response"
      - "External validation of externally developed models using the sequestered holdout test set"
    usage_notes: >-
      Access is controlled: participants complete a registration form (name, email, institution), sign
      a licensing agreement, and are provisioned compute in the enclave. In the AIM-AHEAD training
      context, a ".edu" email address is required to gain access to the dataset.

existing_uses:
  - examples:
      - "Training activities and publications, as stated in the AIM-AHEAD cohort 2 webinar"
      - "The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2, program period November 2025 to July 2026), in which up to 30 trainees use CHoRUS data on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud to build practical use cases"
      - "Hands-on curriculum materials including Jupyter notebooks, OHDSI tool stack workshops and OMOP common data model workshops built around the dataset"
    source_caveats: >-
      The webinar states that datasets "are being used for training activities and publications" but
      names no specific publication; no bibliography or use registry is provided.

other_tasks:
  - task_details: >-
      The NIH abstract states that data elements will feature contextual factors such as geographic
      distance to the nearest hospital, and that social determinants of health are among the acquired
      data, supporting analyses beyond bedside prediction. A CHoRUS repository provides open-source
      code to geocode OMOP Location entities via DeGauss.

future_use_impacts:
  - impact_details: >-
      The project anticipates that a sequestered holdout test set accessible for external validation
      will aid marketplace adoption of AI-developed models for implementation in acute and critical
      care, and that the dataset will catalyze biomedical research promoting patient-focused
      deployment of AI. Ethical and legal work on privacy and bias, including community focus groups
      determining what data is appropriate for public sharing, is intended to mitigate risks of
      re-identification and inequitable model behavior.

