source_caveats: >-
  Values are drawn from four sources that describe the dataset at different moments and disagree on
  scale. The AIM-AHEAD cohort 2 webinar (September 2025) states that as of August 2025 the dataset
  covers 14 hospitals with "over 45K unique admissions"; the project website reports a current
  released dataset of 50,000 patient admissions. Both figures are retained where relevant rather than
  reconciled. The webinar's modality table was extracted from a PDF with column ordering scrambled;
  the mapping of modality to data standard and the statement that all modalities are controlled access
  are legible, but the per-modality assignment of the "Metadata: Yes/Planned" column cannot be
  reconstructed reliably and is therefore not asserted per modality. The NIH RePORTER abstract
  contains transcription artifacts ("CPatient-Focused", "label data for ;", "AI literacy nd
  utilization"). The project website lists a program-manager contact address, cmccrary@mgh.havard.edu,
  that appears to contain a typographic error in the domain. No DOI, formal citation, dataset version
  identifier or publication list is present in any source.

