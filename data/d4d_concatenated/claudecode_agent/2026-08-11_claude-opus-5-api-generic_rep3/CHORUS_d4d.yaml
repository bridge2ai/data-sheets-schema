id: https://chorus4ai.org/dataset
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution critical care dataset produced by one of four
  data generation projects in the NIH Common Fund Bridge2AI consortium. The CHoRUS Network spans 20
  academic centers, of which 14 contribute as Data Acquisition centers, and comprises 60+ consortium
  members. Its stated goal is to develop the most diverse, high-resolution, ethically sourced,
  AI-ready dataset to address the grand challenge of improving recovery from acute illness, covering
  patients with acute or critical illness. Data are collected retrospectively from participating
  hospitals and made available under controlled access within a cloud enclave. The dataset is
  multimodal: structured electronic health record data (demographics, medication administration with
  dosing time-stamped at each infusion change or dose administration, provider-documented procedures
  and diagnoses, and high-frequency nursing flowsheets) standardized to the OHDSI/OMOP Common Data
  Model; clinical notes extracted and tokenized with the OHNLP toolkit; imaging drawn from hospital
  PACS in DICOM; waveform telemetry from bedside monitors and gateway/middleware in WFDB; and
  hospital-database EEG waveforms in EDF+ and Persyst formats. Social determinants of health and
  contextual factors such as geographic distance to the nearest hospital are also targeted. As
  described on the project website, the currently released dataset comprises 50,000 patient
  admissions from ICU, PICU and NICU, 1.6 billion rows of EHR OMOP data, 7,642 admissions with
  radiology data and 23 Tb of waveform data; the anticipated final dataset is 100,000 patient
  admissions across 9 data modalities from 14 contributing hospitals. A holdout test set is to be
  sequestered and made accessible for external validation of models. The project is organized around
  three pillars — Data (standards, tool development and optimization, data acquisition), Ethics
  (ethical and trustworthy AI) and People (team science, skill and workforce development) — and
  develops open-source tooling, validated semantic mappings and standard operating procedures in the
  chorus-ai GitHub organization.
conforms_to: "OHDSI/OMOP Common Data Model (structured EHR); OHNLP schema (tokenized clinical notes); DICOM (imaging); WFDB, described as PhysioNet schema extended (waveform telemetry); EDF+ and Persyst (EEG)"
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset
created_by: "CHoRUS Network / Bridge2AI CHoRUS data generation project"
status: >-
  Active NIH data generation project with an award period of 2022-09-01 to 2026-11-30; a controlled-access
  dataset release exists while additional modalities are still being assembled. The project website
  carries the notice: "This repoitory is under review for potential modification in compliance with
  Administration directives."
page: https://chorus4ai.org/
license: "MIT License applies to the chorus-ai GitHub project code; access to the dataset itself is governed by a separate signed licensing agreement"
is_tabular: false
was_derived_from: "Hospital electronic health record systems, PACS imaging archives, bedside telemetry monitors with gateway/middleware, and hospital EEG databases at 14 data-contributing hospitals"
