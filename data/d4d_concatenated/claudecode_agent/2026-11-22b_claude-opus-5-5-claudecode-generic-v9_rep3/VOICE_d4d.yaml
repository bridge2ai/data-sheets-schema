id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: >-
  A large, ethically sourced, and demographically diverse voice dataset linked to
  health information, released by the NIH Bridge2AI initiative. Version 3.1.0
  contains data for 833 participants across five sites in North America; the
  healthsheet names the countries of data collection as the USA and Canada and
  states that five recording sites are included. The release contains data
  considered low risk, including derived audio features such as spectrograms but
  not the original voice recordings, together with detailed demographic, clinical,
  and validated questionnaire data and metadata related to the specific audio task
  and recording. The underlying samples come from conventional acoustic tasks
  including respiratory sounds, cough sounds, and free speech prompts.
