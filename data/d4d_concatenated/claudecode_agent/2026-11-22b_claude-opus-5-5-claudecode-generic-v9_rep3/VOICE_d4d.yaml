- description: >-
    Publication: The Bridge2AI-voice application: initial feasibility study of voice
    data acquisition through mobile health (Front Digit Health, 2025).
  external_resources:
  - 10.3389/fdgth.2025.1514971
- description: >-
    Publication describing protocol development: Developing Multi-Disorder Voice
    Protocols: A team science approach involving clinical expertise, bioethics,
    standards, and DEI (Proc. Interspeech 2024).
  external_resources:
  - https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html
