collection_mechanisms:
- name: Bridge2AI-Voice App
  description: >-
    A novel smartphone application created to collect standardized recordings of
    acoustic tasks, validated patient questionnaires, and validated patient
    reported outcomes; data collection is performed via the app, which is linked to
    electronic health records (EHR).
  mechanism_details: >-
    The app collects breathing sounds and voice, speech, and linguistic tasks, along
    with health information through surveys and validated questionnaires. A total
    of 22 acoustic tasks are recorded through the app. Detailed demographic data and
    surveys about confounding factors such as smoking and drinking history are
    collected through the app. The healthsheet states the data were collected using
    an iPad app; the PhysioNet release states data collection was conducted using a
    custom application on a tablet with a headset used when possible.
- name: Recording hardware
  mechanism_details: >-
    Data is collected on iPads (9th or 10th generation) and iPad Air (5th
    generation) using an Avid AE-36 microphone and an Apple dongle to connect it to
    the iPad.
data_collectors:
- description: >-
    Data is collected in the clinic with the assistance of a trained research
    assistant.
  collector_details: >-
    Research teams, which may include medical, graduate, or undergraduate students,
    coordinated with clinicians/doctors to identify appropriate participants.
direct_collection:
- is_direct: true
  collection_details: >-
    Voice samples are collected prospectively using a custom software application
    (the Bridge2AI-Voice App) with the Bridge2AI-Voice protocols; the healthsheet
    states the data were collected from the individuals directly.
collection_timeframes:
- timeframe_details: The healthsheet states the data was collected over a period of 12 months.
  source_caveats: >-
    The healthsheet answer is not tied to a named release, and no collection start
    or end date is stated for release 3.1.0.
acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: >-
    The data was directly observable and reported by subjects. Clinical validation
    is performed by a qualified physician or practitioner based on established gold
    standards for diagnosis; clinical diagnoses were verified by clinicians
    reviewing audio and/or imaging data, looking at electronic health records, or
    medication prescriptions.
sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  strategies: Non-probability sample
  why_not_representative: >-
    The data is not representative because it was collected at a limited number of
    geographic locations.
  description: >-
    A sample of a larger, ongoing collection. Participants were selected based on
    known conditions which manifest within the voice waveform, including voice
    disorders, neurological disorders, mood disorders, and respiratory disorders.
    Participants are recruited across different academic institutions from high
    volume expert clinics (outpatient clinics within hospital systems or academic
    institutions that have developed an expertise in a specific disease area and see
    more than 50 patients per month from the same disease category), based on
    diagnosis and inclusion/exclusion criteria. Patients presenting at the given
    clinic were screened for inclusion and exclusion criteria prior to their visit
    by the project investigators. The project documentation's study metadata state a
    minimum age of 18 years, a maximum age of 120 years, and that healthy volunteers
    are accepted; its exclusion criteria include not reading or speaking English,
    and its disease-cohort table and the IRB protocol exclude having had a surgical
    intervention significantly altering the symptoms of the disease studied.
  source_caveats: >-
    The English-only exclusion is from the project documentation; the IRB protocol
    revision of February 10, 2025 (V11) was updated to include data collection from
    Spanish language speakers, so the language criterion applied to release 3.1.0
    participants is not established.
instances:
- instance_type: person
  counts: 833
  label: true
  label_description: >-
    Labels include diagnostic categories such as vocal pathologies, neurological
    disorders, psychiatric conditions, and respiratory disorders.
  notes: >-
    A subset of participants required multiple sessions to complete the data
    collection, so there may be more than one session per participant; there is no
    requirement the participant provide the same response for each visit, so
    participant information for the same data element may vary across the data
    file.
subpopulations:
- identification: Age, Gender, Sex, Ethnicity, Socioeconomic status
missing_data_documentation:
- missing_data_causes: >-
    Some questions are optional, and data collection irregularities may have caused
    some information to be missing from individual instances.
  missing_data_patterns: >-
    Each individual answered a common set of questions and then responded to
    additional questions relevant to their primary diagnostic category.
  handling_strategy: >-
    Phenotype data files only contain rows for a participant if at least one column
    is not missing.
- missing_data_causes: >-
    Some files, whether due to length or other issues, could not generate certain
    features and so are not included in the bundled data.
anomalies:
- anomaly_details: >-
    Different sites have different collection configurations, and the collection
    protocol changed over the course of the study.
known_biases:
- bias_description: >-
    Groups that have less trust in the medical system, AI, or are less proximal to
    the collection sites would have been less likely to be recruited.
- bias_description: >-
    Participants were screened for different disorders based on site, so they also
    had their data collected with different devices.
- bias_description: >-
    The dataset has skews based on disorder category, site, and other demographic
    factors.
  mitigation_strategy: >-
    Users should consider the multivariate distribution when assessing utility for
    different questions.
known_limitations:
- limitation_description: >-
    The public data releases do not contain an equal distribution of the disease
    categories.
- limitation_description: >-
    Certain aspects of the data (e.g., transcription) were generated using
    off-the-shelf models that have not been audited for correctness.
- limitation_description: >-
    Distinct iPad devices were used at each site, and the data were recorded with a
    head-mounted headset with a microphone that could be at slightly different
    distances.
- limitation_description: >-
    Changes in diagnostic criteria or practices could be a source of distribution
    shift.
- limitation_description: >-
    Confounding factors that might be present in the data: noise artifacts,
    variations in diagnostic practices, inaccurate questionnaire responses, and
    underreporting.
content_warnings:
- warnings:
  - >-
    The healthsheet states the dataset includes the transcription of free speech
    tasks; while the inclusion of offensive, threatening, or otherwise unsafe
    content of that type is unlikely, it cannot be completely avoided, as research
    participants are responsible for their choice of language.
  source_caveats: >-
    The same project documentation states that transcriptions from open-response
    prompts are removed from the feature-only dataset, the v1.1 release notes state
    transcripts of free speech audio were removed, and the PhysioNet 3.1.0 file
    description names no transcript file; whether release 3.1.0 contains any
    transcriptions is not established by the sources.
sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The dataset includes race information.
- sensitive_elements_present: true
  sensitivity_details: The dataset includes sexual orientation information.
- sensitive_elements_present: true
  sensitivity_details: The dataset includes socioeconomic and health information.
is_deidentified:
  method: >-
    HIPAA Safe Harbor identifiers were removed; the project documentation states the
    dataset applies the HIPAA de-identification rules, and that it was de-identified
    through removal of all audio data and certain sensitive fields identified by a
    team of ethicists.
  identifiers_removed: >-
    All direct identifiers, including name, civic address, and social security
    numbers; state and province (country of data collection was retained).
  deidentification_details: >-
    Identifiable information (under HIPAA and the Common Rule), as well as data
    considered sensitive, have been removed. Indirect identifiers were removed where
    these created a significant risk of participant re-identification. All raw
    voice data was removed, as this data has the potential to cause individual
    re-identification or to be used for illicit or unauthorized purposes. Raw audio
    transcripts were reviewed, and any audio recordings that contained potentially
    identifying information and external voices were removed from the release.
    Spectrograms and similar features were excluded if the audio contained free
    speech; static and other features which do not encode the sensitive information
    were retained. Spectrograms, Mel spectrograms, MFC coefficients, PPGs, and EMAs
    for sensitive records and audio checks have been removed from v3.1. The
    documentation also states that spectrograms, MFCCs, Mel spectrograms,
    transcriptions, EMAs, and PPGs from open-response prompts are removed from the
    feature-only dataset.
participant_privacy:
- privacy_techniques: >-
    Dates rebased and/or replaced by integers; geographic information removed or
    generalized; narrative text fields removed (project documentation
    de-identification checklist).
  reidentification_risk: >-
    The project documentation states the dataset does not achieve
    K-anonymization (k>=2). The IRB protocol states that it is always possible, even
    if unlikely, that someone could recognize a participant's voice, since a voice
    can never be fully de-identified.
informed_consent:
- consent_obtained: true
  description: >-
    Patient consent was sought for the data collection initiative and to share the
    acquired research data; all participants were informed and agreed to the
    collection and the use of their data via prospective informed consent.
  consent_scope: >-
    Research data that does not contain direct identifiers will be shared with
    external researchers for future research through a secure database. Data that
    poses a low risk of re-identification will be shared in registered access, and
    data that would pose a heightened risk of re-identification if shared in full
    open access will be shared through a controlled access mechanism with
    authorized researchers.
  consent_documentation: >-
    Per the IRB protocol, participants may consent by signing a physical paper copy,
    by indicating electronic consent within the app or through REDCap surveys, or
    through video recording within the app.
collection_notifications:
- notification_details: Participants went through an IRB-approved consent process.
consent_revocations:
- revocation_details: >-
    Consenting participants are informed that they may withdraw from the study at
    any point. If a participant chooses to withdraw during or before the voice data
    collection, their data will not be included in the database. Research data
    (including voice recordings) cannot be removed from the database once the voice
    data collection process is completed.
participant_compensation:
- compensation_provided: true
  compensation_type: Electronic gift cards
  compensation_amount: >-
    $40 for a data collection session that takes less than 90 minutes and $80 for a
    session that takes over 90 minutes, for no more than a total of 3 sessions and
    maximum compensation of $120.
  notes: Per the IRB protocol, compensation is provided to the adult population only.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - Submitted and approved by the USF Single IRB and subsite IRBs through the Single IRB process.
  description: >-
    The IRB protocol describes a prospective cohort study; the project
    documentation's study metadata describe an observational study with a cohort
    observation model and a cross-sectional time perspective.
ethical_reviews:
- reviewing_organization: University of South Florida Institutional Review Board
  review_details: >-
    Data collection and sharing was approved by the University of South Florida
    Institutional Review Board; the project documentation states the study was
    submitted and approved by the USF Single IRB and subsite IRBs through the Single
    IRB process.
preprocessing_strategies:
- description: >-
    Features were extracted from the raw audio to limit re-identification, and only
    the extracted features are released with the dataset.
  preprocessing_details: >-
    Data were exported and converted from REDCap using an open source library
    developed by the team.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    url: https://github.com/sensein/b2aiprep
    version: 3.0.0
    description: >-
      Organizing and preprocessing the dataset; release 3.1.0 was generated with
      b2aiprep v3.0.0.
  - id: https://github.com/sensein/senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
    description: Processing audio files for research tasks.
- description: >-
    The feature-only dataset provides AI-ready derivations from the raw audio
    (project documentation).
  preprocessing_details: >-
    Features extracted include OpenSmile eGeMaps features per audio file;
    Parselmouth/Praat speech features for any speech tasks; Torchaudio-based pitch
    contour, spectrograms, mel spectrogram, and MFCCs; Speech Articulatory Coding
    (sparc)-based features including electromagnetic articulography (EMA)
    estimates, plus loudness, periodicity, and pitch measures; and phonetic
    posteriorgrams (PPGs). Waveform-derived features are stored in a fixed feature
    format of static features extracted from the entire waveform and a temporal
    format that varies for each audio file depending on the length of recording.
- description: >-
    Raw audio was preprocessed by converting to monaural and resampling to 16 kHz
    with a Butterworth anti-aliasing filter applied (PhysioNet release 3.1.0).
  preprocessing_details: >-
    Spectrograms were computed using the short-time Fast Fourier Transform with a
    25ms window size, 10ms hop length, and a 400-point FFT, and further downsampled
    by a factor of two in the time domain. 60 MFCCs were extracted from the
    spectrograms. Mel spectrograms were computed with the same parameters and 60
    Mels. Articulatory features were generated with the Speech Articulatory Coding
    (sparc) package at 50Hz. Acoustic features were extracted using OpenSMILE.
    Phonetic and prosodic features were computed using Parselmouth and Praat.
    Phonetic posteriorgrams at 100Hz were generated via the ppgs package.
cleaning_strategies:
- description: >-
    The dataset has been audited internally for missingness and consistency by the
    data release team; a missingness table is included with the dataset.
  cleaning_details: >-
    Audit protocol: generate missingness tables; check distributions and outliers;
    for categorical responses, check against schema; for audio tasks, run quality
    control metrics.
labeling_strategies:
- labeling_details: >-
    Diagnostic labels are the result of a clinical assessment of the participant. At
    each site, a local clinician provided the diagnosis based on a clinical
    interview and appropriate work-up. For the psychiatric disorders cohort, this
    assessment was determined by using the participant's EHR record or using an
    active prescription. A gold standard label is available in the data (diagnosed
    by a clinician).
  annotations_per_item: 1
  annotator_demographics:
  - Typically, the clinician at site of data collection, or external to (for prior diagnostic assessment)
  data_annotation_protocol: Per Bridge2AI Protocols and ICD-10 codes.
machine_annotation_tools:
- tools:
  - OpenAI Whisper Large unknown
  tool_descriptions: Transcriptions were generated using OpenAI's Whisper Large model.
raw_sources:
- name: Raw audio recordings
  description: >-
    The published Bridge2AI-Voice Adult Dataset contains derived features from the
    audio waveforms; the PhysioNet project does not contain raw audio. Raw audio is
    available under a controlled access mechanism.
  raw_data_details: >-
    Raw audio data is disseminated through controlled access only to protect
    participants' privacy. The healthsheet states the raw data is saved and is not
    accessible publicly. Accessing raw audio requires institutional sign off;
    requests go to the access committee (DACO@b2ai-voice.org), and data will be made
    available via Synapse. The raw audio files and questionnaire data were converted
    to be compliant with the Brain Imaging Data Structure v1.9.0.
  access_url: https://www.synapse.org/Synapse:syn72370534/
license_and_use_terms:
  license_terms: >-
    Only credentialed users who sign the DUA can access the files. Access requires
    registration on PhysioNet and signing the Bridge2AI Voice Registered Access
    Agreement, which outlines the terms and conditions for data use; no training is
    required. The dataset is intended solely for commercial and non-commercial
    research purposes by Authorized Researchers.
ip_restrictions:
  restrictions:
  - Intellectual property protections, database rights, or related rights may not be used in a manner that restricts or limits access to any part of the dataset or to any conclusions derived from it.
  - Sale of all or part of the Data on any media is not permitted.
  - Users agree not to make intellectual property claims on the Data.
  - Users agree to respect the Fort Lauderdale Agreement.
  notes: There are no fees associated with these restrictions.
data_governance:
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: >-
    The feature-only and raw audio datasets are available under distinct agreements
    appropriate for the sensitivity of their content. Controlled access to raw audio
    data: complete the Data Access Request Form (DARF) and the Data Use Agreement
    (DUA), submit the application to the Data Access Compliance Office for review, and upon
    approval ensure a Data Use and Transfer Agreement (DTUA) is signed by an
    authorized official at the requesting institution. Collaborators at other
    research organizations, and other research teams at the same organization, must
    apply independently and sign their own DTUA.
  notes: >-
    Per the DTUA template, the agreement ends two years after the start date, upon
    completion of the project, upon expiration of the applicable ethics approval, or
    on termination by the provider institution, whichever occurs first.
regulatory_restrictions:
  other_compliance: >-
    Certificate of Confidentiality (the DTUA template marks the data as covered
    under a Certificate of Confidentiality).
third_party_sharing:
- is_shared: true
  description: >-
    The dataset will be distributed broadly to individuals outside of the entity
    who created the dataset.
distribution_dates:
- release_dates:
  - '1.1: 2025-01-17'
  - '2.0.0: 2025-04-16'
  - '2.0.1: 2025-08-18'
  - '3.0.0: 2025-12-16'
  - '3.1.0: 2026-05-01'
updates:
  frequency: semi-annual (twice a year)
  update_details: >-
    The dataset is released as static versions rather than dynamically updated. The
    project documentation states further releases will contain additional data, and
    the healthsheet states further versions will be released on a semi-annual basis.
  source_caveats: >-
    The healthsheet states updates will be distributed as new versions on the Health
    Data Nexus platform, whereas releases 1.1 through 3.1.0 are on PhysioNet.
retention_limit:
  retention_details: >-
    Once data is contributed, the data will be retained as long as it is useful for
    research purposes, possibly indefinitely.
version_access:
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
  - '1.0: initial release, 12,523 recordings for 306 participants collected across five sites in North America; Health Data Nexus, https://doi.org/10.57764/qb6h-em84'
  - '1.1: https://doi.org/10.13026/249v-w155'
  - '3.0.0: 833 participants across five sites in North America; https://doi.org/10.13026/k81f-qr68'
  - '3.1.0: https://doi.org/10.13026/8xbn-nq66'
  version_details: >-
    Release notes: v1.1 added Mel-frequency cepstral coefficients (MFCCs); v2.0
    provided data for an additional 136 new participants; v2.0.1 made corrections in
    the authorship list; v3.0.0 was a major update with new data for an additional
    391 participants; v3.1.0 was a minor update with no new participants but some
    additional data released for certain participants, adding files related to
    audio quality metrics and per-audio metadata, updated validated diagnosis
    information with back-filled information, and some phenotypic files rearranged
    and gold standard variables renamed. An earlier version of the feature-only
    dataset is available on Health Data Nexus, which provides cloud compute
    alongside the dataset rather than allowing data downloads. The healthsheet,
    which describes distribution through the Health Data Nexus platform, states the
    data was published and made available at the end of November 2024. By default,
    older versions continue to be supported, hosted, and made available, each
    version has a unique DOI, and the publishers reserve the right to remove access
    to older versions. A changelog for each dataset version is published online with
    the dataset metadata.
errata:
- erratum_details: Release 3.1.0 fixed broken parquet files from the previous release.
extension_mechanism:
  description: >-
    Others may publish a derivative dataset on the Health Data Nexus which
    references the original source.
  extension_details: >-
    The open-source preprocessing repository has a pull-request mechanism for
    contributing improvements to the data preprocessing code.
existing_uses:
- description: >-
    A restricted version of the dataset containing raw audio has been used in the
    Bridge2AI Summer School and hackathon.
