related_datasets:
- relationship_type: references
  target_dataset: https://doi.org/10.13026/mf9s-5r03
  name: Bridge2AI-Voice Pediatric Dataset
  description: >-
    A separate PhysioNet project (version 1.1.0, https://doi.org/10.13026/h995-bt35)
    containing derived audio features for 23,533 recordings collected from 300
    participants aged 2-18 at the Hospital for Sick Children, with data collection
    and sharing approved by the Research Ethics Board at the Hospital for Sick
    Children.
  notes: >-
    The relation type records that the adult release page points readers to the
    pediatric dataset on PhysioNet; no source states a stronger relation between the
    two datasets.
file_collections:
- id: doi:10.13026/37yb-1t42#features
  name: features
  path: features
  description: >-
    Derived audio data features. Binary files are made available as Parquet, an
    open-source column-oriented data file format; each parquet element contains a
    participant identifier, a recording session identifier, the task performed, the
    number of time frames, and the tensor data for the feature. All files are
    associated with a data dictionary file which has the same file stem and a JSON
    suffix.
  source_caveats: >-
    The directory listing names torchaudio_spectrogram.parquet and
    torchaudio_mel_spectrogram.parquet, while the per-file descriptions name them
    torchaudio_spectrograms.parquet and torchaudio_mel_spectrograms.parquet; the
    listing names are recorded.
  resources:
  - id: doi:10.13026/37yb-1t42#file-ppgs.parquet
    name: ppgs.parquet
    description: >-
      Phonetic posteriorgram probabilities across 40 phoneme categories (40xT,
      100Hz frame rate); n=29289.
  - id: doi:10.13026/37yb-1t42#file-sparc_ema.parquet
    name: sparc_ema.parquet
    description: >-
      Estimated electromagnetic articulography (EMA) from a deep learning model,
      dimensions Tx12 (X/Y positions of six articulators); n=28640.
  - id: doi:10.13026/37yb-1t42#file-sparc_loudness.parquet
    name: sparc_loudness.parquet
    description: >-
      Estimated loudness based on the average absolute amplitude of the audio
      waveform, 20ms windows; n=31855.
  - id: doi:10.13026/37yb-1t42#file-sparc_periodicity.parquet
    name: sparc_periodicity.parquet
    description: >-
      Estimated periodicity (confidence of pitch presence), 20ms windows; n=31872.
  - id: doi:10.13026/37yb-1t42#file-sparc_pitch.parquet
    name: sparc_pitch.parquet
    description: Estimated fundamental frequency (F0), range 50-550Hz; n=31872.
  - id: doi:10.13026/37yb-1t42#file-torchaudio_spectrogram.parquet
    name: torchaudio_spectrogram.parquet
    description: >-
      Spectrograms of dimension 201xT (short-time FFT, 25ms window, 10ms hop,
      400-point FFT); n=29278.
  - id: doi:10.13026/37yb-1t42#file-torchaudio_mfcc.parquet
    name: torchaudio_mfcc.parquet
    description: Mel-frequency cepstrum coefficients of dimension 60xT; n=29278.
  - id: doi:10.13026/37yb-1t42#file-torchaudio_pitch.parquet
    name: torchaudio_pitch.parquet
    description: >-
      Detected pitch (fundamental frequency) over time, dimension T, min and max
      pitch of 80 and 500; n=32522.
  - id: doi:10.13026/37yb-1t42#file-torchaudio_mel_spectrogram.parquet
    name: torchaudio_mel_spectrogram.parquet
    description: >-
      Mel spectrograms of dimension 60xT (25ms window, 10ms hop, 400-point FFT, 60
      Mel bins); n=29278.
  - id: doi:10.13026/37yb-1t42#file-audio_quality_metrics.tsv
    name: audio_quality_metrics.tsv
    format: TSV
    media_type: text/tab-separated-values
    description: >-
      One feature per audio recording derived from the raw audio related to quality
      control metrics.
  - id: doi:10.13026/37yb-1t42#file-static_features.tsv
    name: static_features.tsv
    format: TSV
    media_type: text/tab-separated-values
    description: >-
      Features derived from the raw audio (openSMILE, Praat, parselmouth,
      torchaudio), with one row per unique recording.
- id: doi:10.13026/37yb-1t42#metadata
  name: metadata
  path: metadata
  collection_type: metadata
  description: >-
    A binary file made available as Parquet and its corresponding data dictionary,
    with specific information about each recording, including task instructions and
    prompts and information about the microphone used and its gain.
- id: doi:10.13026/37yb-1t42#phenotype
  name: phenotype
  path: phenotype
  description: >-
    Organized information collected from the participant or other individual during
    their encounter, in TSV data files with JSON data dictionaries, under the
    subfolders confounders, demographics, diagnosis, enrollment, questionnaire, and
    task. Dictionary entries give a one-sentence description of each column, the
    question (if any) that was asked the participant to prompt the answer, and the
    data type of the response.
