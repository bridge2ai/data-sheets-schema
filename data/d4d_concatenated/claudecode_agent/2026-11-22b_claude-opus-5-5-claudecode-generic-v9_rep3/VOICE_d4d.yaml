purposes:
- response: >-
    The Bridge2AI-Voice consortium aims to generate a large-scale, ethically
    sourced voice, speech, and cough database linked to health metadata in order
    to support AI-driven research.
- response: >-
    Bridge2AI-Voice seeks to create a flagship, standardized, and ethically sourced
    dataset of 10,000 voices linked to health information to fuel research and
    discovery in voice biomarkers (a stated target, not a count of the current
    release).
  source_caveats: >-
    Target sizes differ across sources. The project documentation (manifest tier 2)
    states a flagship dataset of 10,000 voices; the IRB protocol (also tier 2)
    states a sample size of 30 000 participants; the JAMA Otolaryngology viewpoint
    (tier 3) states a primary deliverable of a publicly available database of
    30 000 human voices. The two tier-2 sources share a rank and are targets stated
    at different times, so both are recorded rather than one selected. Version 3.1
    contains data for 833 participants.
- response: >-
    Specific Aim 1 of the NIH project: to build a multi-modal, multi-institutional,
    large scale, diverse and ethically sourced human voice database linked to other
    biomarkers of health that is AI/ML friendly to fuel voice AI research.
- response: >-
    To facilitate the use of voice as a non-invasive, cost-effective biomarker for
    the screening, diagnosis, and monitoring of a wide range of health conditions.
addressing_gaps:
- response: >-
    Existing literature has studied voice only in small- to medium-sized data sets
    with limited data outside of acoustic measures, not linked to multi-modal
    health data.
- response: >-
    Comparing studies and pooling data is challenging due to a lack of existing
    standards in how voice and other acoustics are measured and collected.
- response: >-
    The dataset was created to address a gap in the availability of large-scale,
    diverse, and well-documented voice data for use in clinical machine-learning
    applications; previous studies' sample sizes were too small, or they lacked the
    key metadata needed for training robust, clinically useful models.
tasks:
- response: >-
    The tasks are primarily designed for training machine-learning models for
    disease detection and classification using voice data.
intended_uses:
- description: >-
    Development, benchmarking, or validation of clinically applicable
    machine-learning models for diagnosing a wide range of health conditions using
    voice data.
  examples:
  - AI model pretraining
  - fine-tuning
  - benchmarking
  - validation
- description: >-
    Clinical research in disease screening, diagnosis, and monitoring through voice
    biomarkers.
prohibited_uses:
- description: >-
    Attempting to re-identify research participants, or any actions that could
    reasonably lead to re-identification (restriction of the Registered Data Access
    Agreement).
  prohibition_reason: >-
    The restrictions reflect the B2AI-Voice Consortium's commitment to advancing
    ethical and trustworthy research practices that respect and protect the rights
    and interests of research participants.
- description: >-
    Any purpose that could foreseeably cause harm or stigmatization to research
    participants, their families, communities, or specific populations
    (restriction of the Registered Data Access Agreement).
  prohibition_reason: >-
    The restrictions reflect the B2AI-Voice Consortium's commitment to advancing
    ethical and trustworthy research practices that respect and protect the rights
    and interests of research participants.
- description: >-
    Under the Data Transfer and Use Agreement template for controlled-access data,
    the recipient will not use the data, alone or with other information, to make
    any effort to contact individuals who are the subjects of the data without
    appropriate IRB approval, specific written approval from the provider, and
    informed consent from the individual where required.
discouraged_uses:
- description: >-
    Non-research applications such as hiring decisions, insurance premium
    adjustments, or any form of surveillance that could lead to discrimination or
    harm.
  notes: >-
    These limitations are intended to prevent unethical or biased outcomes that
    could negatively impact individuals based on their health conditions or voice
    characteristics.
  source_caveats: >-
    The healthsheet states this restriction twice with different wording: once as
    "non-research applications" and once as "non-clinical applications", with the
    same examples. Both statements come from the same documentation source.
