id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the AI-READI dataset, published on FAIRhub. It consists of
  data collected from individuals with and without type 2 diabetes mellitus
  (T2DM), harmonized across three data collection sites. FAIRhub states that it
  contains data from 2280 participants collected between July 19, 2023 and May
  1, 2025, across multiple modalities: survey data, clinical data, retinal
  imaging data, environmental sensor data, continuous glucose monitor data and
  wearable activity monitor data. These comprise tabular data, imaging data and
  physiological signal/waveform data; the healthsheet states that no
  unstructured text data are included. The dataset contains 356,343 files and
  is around 3.82 TB in size. It is organized following the Clinical Dataset
  Structure (CDS) v0.1.1: one directory per data type at the root level, then
  one folder per modality, one per device used to collect that modality, and
  one per participant. The AI-READI project seeks to create and share a
  flagship ethically sourced dataset of type 2 diabetes.
