purposes:
- name: Enable AI/ML research into T2DM salutogenesis
  description: >-
    The dataset was created to enable future generations of artificial
    intelligence/machine learning (AI/ML) research to provide critical insights
    into type 2 diabetes mellitus (T2DM), including salutogenic pathways to
    return to health. The primary goal of AI-READI is to collect and publicly
    share a multimodal, AI-ready dataset for studying the pathogenesis and
    salutogenesis (the pathway from disease to health) of T2DM; the
    documentation states the goal as better understanding salutogenesis in
    T2DM.
- name: Foundational dataset for a temporal atlas of T2DM
  description: >-
    The NIH RePORTER abstract states the project's long-term objective as
    developing a foundational dataset in diabetes, agnostic to existing
    classification criteria, which can be used to reconstruct a temporal atlas
    of T2DM development and reversal towards health.
tasks:
- name: Pseudotime manifold analysis
  description: >-
    Data collection was designed to permit downstream pseudotime manifold
    analysis, an approach used to predict disease trajectories. The healthsheet
    states that the multimodal dataset is gathered to facilitate downstream
    pseudotime manifolds and various applications in artificial intelligence.
addressing_gaps:
- description: >-
    A meta-epidemiological review of T2DM studies published from 2000 to 2020
    found that samples lacked racial and ethnic diversity; the BMJ Open
    protocol presents AI-READI's balanced cohort as a step toward addressing
    these demographic inequities in research.
- description: >-
    A major barrier to AI-based approaches in T2DM has been the lack of diverse
    datasets that are ready for training AI models; the AI-READI dataset is
    intended to fill this gap.
- description: >-
    The ability to understand and affect the course of complex, multi-organ
    diseases such as T2DM has been limited by a lack of well-designed, high
    quality and large multimodal datasets.
- description: >-
    The data acquisition protocol spans multiple domains to enable downstream
    AI/ML analyses that may not be feasible with existing data sources such as
    claims or electronic health records data.
