source_caveats: >-
  Referent: version 3.0.0 of the AI-READI dataset on FAIRhub (DOI
  10.60775/fairhub.3), the publicly accessible release; the controlled-access set
  is described by the sources as a separate set and its contents are not
  recorded as contents of this release. Source documents expand AI-READI both as
  "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights" (BMJ
  Open, Nature Metabolism) and "AI Ready and Exploratory Atlas for Diabetes
  Insights" (FAIRhub study description, healthsheet, NIH RePORTER, IRB
  protocol). Planned figures differ across sources and are not recorded as the
  dataset's state: target enrollment of 4,000 (protocols, FAIRhub) or 4,600 (IRB
  protocol), and a follow-up visit for about 10% (NIH RePORTER, IRB protocol) or
  about 4% (healthsheet) of participants. The healthsheet states that the public
  dataset does not contain data considered sensitive and that it contains no
  confidential data or personally identifiable information, while the
  controlled-access dataset contains racial and ethnic origins, 5-digit ZIP code
  and motor vehicle accident reports (the v3.0.0 documentation also lists sex,
  genetic sequencing data, past health records and medications). The healthsheet
  states that no labels are provided because the dataset is hypothesis-agnostic,
  that no data protection impact analysis was conducted, that there are no limits
  on data retention, that there is no mechanism for others to extend the dataset,
  and that the dataset has not been used for tasks and has no use repository.
  Access to the controlled-access set is governed separately: the
  documentation states that the full dataset is accessible by entering into a
  data use agreement, the BMJ Open protocol states that it is available only to
  scientists whose institutions have completed legal and privacy use agreements
  and that its requirements were being developed by the Data Access Committee,
  and the IRB protocol describes an approval process developed by the project
  committee. Driving and accident records (Department of Licensing) and
  extracted medical records, which the IRB protocol and the Nature Metabolism
  protocol figure list as collected data, correspond to content the sources
  place in the controlled-access set and are not recorded as sources of this
  release.
