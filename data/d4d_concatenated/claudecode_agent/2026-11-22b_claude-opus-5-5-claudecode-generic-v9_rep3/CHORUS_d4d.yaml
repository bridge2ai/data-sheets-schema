    AIM-AHEAD Bridge2AI for Clinical Care Training Program, the webinar
    describes registration through a form collecting name, email, and
    institution; an email is sent once access is granted and compute is
    provisioned; and gaining access to the dataset requires a ".edu" email
    address, a requirement the webinar says is not a barrier to acceptance
    into the program, with program administrators assisting with this access
    if needed. The GitHub organization overview (captured 2025-11-14) lists
    contacts for requesting access: dbold@emory.edu or
