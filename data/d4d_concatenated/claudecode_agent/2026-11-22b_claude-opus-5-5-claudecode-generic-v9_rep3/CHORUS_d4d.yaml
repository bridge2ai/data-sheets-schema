source_caveats: >-
  The project website carries the banner "This repoitory is under review for
  potential modification in compliance with Administration directives." The
  admission figures are treated as compatible rather than conflicting: the
  webinar reports over 45K unique admissions as of August 2025 and the
  undated project website (ranked higher in the source manifest) reports
  50,000 admissions in the current released dataset. The webinar's 1000
  available images and the website's 7,642 admissions with radiology data
  count different units and are not compared. The NIH RePORTER abstract
  describes plans (future tense), recorded here as plans. The GitHub
  organization overview is historical documentation captured 2025-11-14,
  ranked lowest in the source manifest. Its statement "This project is
  licensed under the MIT License" concerns the GitHub project; no document
  states a license for the dataset itself, so the dataset license is left
  empty. The people listed as creators are named in the documents as the
  Bridge2AI CHoRUS Leadership Team; the documents do not state individual
  dataset authorship or contributor roles. In the webinar's data table the
  extracted text interleaves columns, so access-control, metadata and
  "Planned" cells cannot be reliably attributed to rows; only data-standard
  pairings that sit beside their data type are recorded. "23 Tb" is the
  website's unit as written.
