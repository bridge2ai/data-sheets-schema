id: https://chorus4ai.org/
name: CHoRUS dataset
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution critical care dataset
  assembled by the Patient-Focused Collaborative Hospital Repository Uniting
  Standards for Equitable AI project, one of four data generation projects in the
  NIH-funded Bridge2AI consortium. Its stated overarching goal is to develop a
  publicly available, AI-ready critical care dataset while ensuring that the
  methods used promote privacy, accountability and clinical benefit.


  The data are collected retrospectively from patients with acute or critical
  illness at contributing hospitals and are held under controlled access. The
  project site describes a current released dataset of 50,000 patient admissions
  from intensive care, pediatric intensive care and neonatal intensive care
  units, comprising 1.6 billion rows of electronic health record data in the OMOP
  Common Data Model, 7,642 admissions with radiology data, and 23 Tb of waveform
  data. The anticipated final dataset is 100,000 patient admissions covering 9
  data modalities from 14 data contributing hospitals.


  Nine data types are described: demographics, medication administration with
  dosing time-stamped at each infusion change or dose administration, procedures
  documented by providers, high-frequency nursing flowsheet documentation,
  diagnoses documented by providers, clinical notes extracted and tokenized using
  the OHNLP toolkit, imaging from PACS, waveform telemetry from bedside monitors
  and gateway or middleware systems, and EEG waveforms from hospital databases.
  Structured records are standardized to the OMOP Common Data Model; imaging uses
  DICOM, waveform telemetry uses WFDB, and EEG uses EDF+ and Persyst. Every data
  type is listed as controlled access.


  The project is organized around three pillars — Data (standards, tool
  development and optimization, and data acquisition), Ethics (ethical and
  trustworthy AI) and People (team science, and skill and workforce development).
  The collaboration spans 20 academic centers, of which 14 contribute as data
  acquisition centers, with more than 60 consortium members across 20
  institutions. Beyond the assembled dataset, the project sequesters a holdout
  test set for external validation of models, develops unified standards to
  harmonize multimodal electronic health record, waveform, imaging and text data,
  and builds a visualization and annotation environment for labeling data with
  prediction targets.
page: https://chorus4ai.org/
keywords:
  - Artificial Intelligence
  - Machine Learning
  - Critical Care
  - Critical Illness
  - Electronic Health Record
  - Electroencephalography
  - Telemetry
  - data standards
  - social health determinants
  - acute care
  - Bridge to Artificial Intelligence
conforms_to: OMOP Common Data Model for structured electronic health record data;
  the OHNLP toolkit schema for extracted and tokenized clinical notes; DICOM for
  imaging; WFDB for waveform telemetry; EDF+ and Persyst for EEG waveforms
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset
notes: >-
  The CHoRUS project site carried the banner "This repoitory is under review for
  potential modification in compliance with Administration directives." at the
  head of the captured page; the spelling is the source's.
source_caveats: >-
  No dataset DOI, version identifier or formal release date appears in any source
  in the declared bundle, so the project site https://chorus4ai.org/ is used as
  the dataset identifier. The keywords are taken verbatim from the preferred-terms
  list on the NIH RePORTER record for award OT2OD032701; that list indexes the
  award rather than the dataset. The bundle's four sources were captured at
  different times — the informational webinar is dated September 2025 and states
  figures "as of August 2025", the GitHub organization overview was captured
  2025-11-14, and the project site capture is undated — and where their figures
  disagree the disagreement is recorded on the affected value rather than
  resolved silently.

purposes:
  - name: Develop a publicly available AI-ready critical care dataset
    response: To develop a publicly available, AI-ready critical care dataset drawn
      from more than 100,000 critically ill patients.
    description: >-
      The NIH RePORTER abstract states that the project's overarching goal is to
      develop a publicly available, AI-ready critical care dataset while ensuring
      the methods promote privacy, accountability and clinical benefit. The GitHub
      organization overview states the goal as developing the most diverse,
      high-resolution, ethically sourced, AI-ready data set to answer the grand
      challenge of improving recovery from acute illness.
  - name: Provision a holdout test set for external model validation
    response: To provision a holdout test set, accessible for external validation of
      models, to aid marketplace adoption of AI-developed models for acute and
      critical care.
    description: >-
      The abstract states that the dataset will provision a holdout test set
      accessible for model external validation, to aid marketplace adoption of
      AI-developed models for implementation in acute and critical care. The
      GitHub organization overview describes sequestering holdout datasets for
      external validation.
  - name: Establish infrastructure and standards for AI in critical care
    response: To develop the network, tools, standards, data and education needed to
      build machine learning and artificial intelligence models for critical care.
    description: >-
      The abstract describes developing capabilities across a multicenter network
      to acquire, standardize, tokenize, store, visualize and label data, and
      unified standards to harmonize multimodal electronic health record,
      waveform, imaging and text data.
  - name: Cultivate AI expertise and workforce in clinical care
    response: To cultivate expertise in the lay and scientific community and improve
      AI literacy and utilization through multimodal educational approaches.
    description: >-
      The abstract describes cultivating expertise in the lay and scientific
      community to improve AI literacy and utilization through multimodal
      educational approaches, and a comprehensive set of approaches to develop the
      skills and workforce for a next generation of diverse academic and community
      AI scientists.

tasks:
  - name: Characterize acute and critical care illness
    response: Characterizing acute and critical care illness among patients with
      acute or critical illness.
    description: >-
      Named in the NIH RePORTER abstract as one of three machine learning and
      artificial intelligence applications the dataset is generated to serve.
  - name: Predict complications
    response: Predicting complications among patients with acute or critical illness.
    description: >-
      Named in the NIH RePORTER abstract as one of three machine learning and
      artificial intelligence applications the dataset is generated to serve.
  - name: Measure treatment response
    response: Measuring treatment response among patients with acute or critical
      illness.
    description: >-
      Named in the NIH RePORTER abstract as one of three machine learning and
      artificial intelligence applications the dataset is generated to serve.
  - name: Improve recovery from acute illness
    response: Building machine learning and AI-derived models to improve the care and
      outcomes of patients requiring critical care.
    description: >-
      Stated in the NIH RePORTER project narrative and echoed in the GitHub
      organization overview, which frames improving recovery from acute illness as
      the grand challenge the dataset is built to answer.

addressing_gaps:
  - name: Absence of infrastructure for AI and ML in critical care
    response: There is an urgent need for infrastructure to support artificial
      intelligence and machine learning in critical care.
    description: >-
      The opening claim of the NIH RePORTER abstract, which frames the development
      of high-resolution multicenter data sets as a critical first step towards
      actionable and trustworthy AI.
  - name: Lack of high-resolution multicenter critical care data
    response: High-resolution, multicenter, ethically sourced and diverse critical
      care data sets do not exist at the scale needed for AI development.
    description: >-
      The abstract describes acquiring and standardizing a dataset of
      unprecedented diversity and high resolution across more than 100,000
      critically ill patients; the GitHub organization overview describes the aim
      as the most diverse, high-resolution, ethically sourced, AI-ready data set.
  - name: No sequestered test set for external validation of clinical AI models
    response: Models developed for acute and critical care lack a sequestered
      holdout set on which external validation can be performed.
    description: >-
      The abstract states that the holdout test set is intended to aid marketplace
      adoption of AI-developed models for implementation in acute and critical
      care.
  - name: Absent legal and ethical framework for data collection at scale
    response: There is no established legal framework for collecting critical care
      data at scale, nor an agreed account of which data are appropriate for
      public sharing.
    description: >-
      The abstract describes establishing a legal framework for collecting data at
      scale and performing community-facing ethics focus groups to determine what
      data is appropriate for public sharing. The project site adds that new
      approaches are being created as the existing legal and regulatory landscape
      is analyzed.

