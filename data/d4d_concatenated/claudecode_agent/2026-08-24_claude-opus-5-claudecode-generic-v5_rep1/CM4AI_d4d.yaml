purposes:
  - id: https://cm4ai.org/#purpose-cell-architecture
    name: Map the spatiotemporal architecture of human cells
    response: >-
      To map the spatiotemporal architecture of human cells and use these maps toward
      the grand challenge of interpretable genotype-phenotype learning.
  - id: https://cm4ai.org/#purpose-ai-ready
    name: Produce ethical, AI-ready datasets of cell architecture
    response: >-
      To produce ethical, AI-ready datasets of cell architecture, inferred from
      multimodal data collected for human cell lines, to enable transformative
      biomedical AI research.
  - id: https://cm4ai.org/#purpose-hierarchical-maps
    name: Deliver machine-readable hierarchical maps of cell architecture
    response: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready
      data, together with quarterly data releases of map-input data streams.
  - id: https://cm4ai.org/#purpose-visible-ml
    name: Enable visible machine learning systems
    response: >-
      To generate a resource of matched data and tools that enables the creation of
      "visible" machine learning systems, which are not black boxes but are built
      directly on knowledge maps of cell and tissue architecture.

tasks:
  - id: https://cm4ai.org/#task-cell-map-construction
    name: Construction of multiscale hierarchical cell maps
    response: >-
      Integration of protein-protein interaction and spatial imaging data into
      hierarchical directed acyclic graphs in which each node is an assembly of proteins
      in proximity at a given scale, using self-supervised embedding followed by
      community detection at multiple resolutions.
  - id: https://cm4ai.org/#task-visible-neural-networks
    name: Training and interpretation of visible neural networks
    response: >-
      Use of cell maps in AI tools for visible machine learning or visible neural
      networks, to interrogate how protein assemblies in the cell affect cell-level
      phenotype predictions.
  - id: https://cm4ai.org/#task-variant-interpretation
    name: Interpretation of genetic variants and mutations
    response: >-
      Downstream applications in human genomics, including the interpretation of genetic
      variants and mutations against a map of cellular structure and function.
  - id: https://cm4ai.org/#task-perturbation-response
    name: Analysis of cell architectural change under perturbation
    response: >-
      Analysis of cell architectural changes and interactions in the presence of specific
      disease processes, treatment conditions or genetic perturbations.

addressing_gaps:
  - id: https://cm4ai.org/#gap-black-box
    name: Machine learning models in genomics are difficult to interpret
    response: >-
      Machine learning models show great promise in analyzing the human genome to make
      predictions, but their inner workings are typically difficult-to-interpret black
      boxes that predict phenotypes from genotypes without revealing the mechanisms by
      which such translation occurs. The dataset supplies the matched data needed to
      build models on explicit maps of cell and tissue architecture instead.
  - id: https://cm4ai.org/#gap-ai-readiness
    name: Absence of provenanced, characterized, ethically prepared AI-ready data
    response: >-
      AI-ready biomedical data must be FAIR, provenanced, characterized, explainable and
      ethical, and these criteria are interdependent. CM4AI addresses the absence of
      cell-architecture datasets meeting them by attaching machine-readable provenance
      graphs, schemas, validation procedures and data sheets to every released component.
  - id: https://cm4ai.org/#gap-uncharted-cell-structure
    name: Much of human subcellular organization remains unmapped
    response: >-
      Knowledge of how the proteins of the human genome are organized within cells is
      still evolving, and mapping subcellular architecture systematically across cell
      types and disease states requires proteome-wide datasets tuned to complementary
      types of information.

creators:
  - id: https://cm4ai.org/#creator-ideker
    name: Trey Ideker
    description: >-
      Principal investigator of the CM4AI Data Generation Project under NIH core project
      OT2OD032742, and the Point of Contact recorded on each Dataverse data release. The
      project preprint gives tideker@health.ucsd.edu as the corresponding author address.
    principal_investigator: ORCID:0000-0002-1708-8454
    affiliations:
      - name: University of California San Diego
  - id: https://cm4ai.org/#creator-clark
    name: Timothy Clark
