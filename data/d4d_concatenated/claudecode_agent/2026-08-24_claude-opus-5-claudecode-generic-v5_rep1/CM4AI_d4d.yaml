source_caveats: >-
  Source disagreements resolved by the manifest ranking, which puts a data resource
  (the Dataverse release record) above project documentation, which in turn sits
  above a preprint and above an NIH project page. (1) Release date of the current
  release: the CM4AI data-releases page states "Released on: June 17, 2025" while the
  Dataverse record for the same release gives Publication Date 2026-06-17; the
  Dataverse value is stated here. (2) Collaborating institutions: the Dataverse
  release description lists UCSD, UCSF, Stanford, UVA, Yale, UA Birmingham, Simon
  Fraser University and the Hastings Center; the CM4AI data-releases page adds UT
  Austin; the project preprint's affiliation list also carries the University of Texas
  at Austin, the University of Alabama and the University of Montreal. The Dataverse
  list is stated here. (3) AP-MS availability: the CM4AI data-releases page marks
  "AP-MS interactomes (coming soon!)" while the June 2026 Dataverse release lists
  AP-MS archives for paclitaxel- and vorinostat-treated MDA-MB-468 cells; the
  Dataverse record is preferred. (4) Number of proteins imaged: the CM4AI
  data-releases page states "IF images for 523 proteins" while the June 2025, October
  2025 and June 2026 Dataverse releases state 464 proteins per condition (the March
  2025 release states 563); the Dataverse figures are stated here, per release. (5)
  End of project: the Dataverse maintenance plan says the dataset will be updated
  "through the end of the project in November 2026" while NIH RePORTER gives a project
  end of 2026-08-31; the Dataverse statement is preferred. (6) Version labels: each
  Dataverse page shows a page-level version (1.4, 2.1, 2.1 and 2.0) that differs from
  the version given in its own citation string (V1, V2, V2 and V2). Both come from the
  same source, so the ranking cannot decide between them; the page version is recorded
  in `version` and the citation string is recorded verbatim in `citation`. (7) All four
  Dataverse releases record the same Data Creation Date and Deposit Date of 2025-02-27,
  including the release published 2026-06-17. (8) Registry identifiers: the June 2026
  release records https://ror.org/0153tk833 in place of the affiliation string
  "University of Virginia" that the earlier releases use for the same five authors,
  which is the basis for the ROR CURIE used in `publisher` and in
  `data_governance.accountable_organization`. No other institution named in the input
  documents carries a registry identifier there, so none is supplied. (9) The Data
  Governance Committee contact is named as "Jillian Parker (jillianparker@health.ucsd.edu)";
  the release author lists separately carry an author "Parker J" with an ORCID. The
  input documents do not state that these are the same person, so the ORCID is not
  applied to the committee contact. (10) `Creator` declares no person-shaped slot other
  than `principal_investigator`, so only the individuals the input documents identify as
  leading a creating group are carried there; the full 46-name author list of each
  release is carried verbatim in that release's `citation`. (11) The Nature publication
  in the input documents reports a multiscale cell map of U2OS osteosarcoma cells and
  acknowledges Bridge2AI funding, but its data are deposited at NDEx, MassIVE and
  ProteomeXchange rather than in the CM4AI data releases; it is recorded as an external
  resource and none of its measurements are attributed to this dataset.

