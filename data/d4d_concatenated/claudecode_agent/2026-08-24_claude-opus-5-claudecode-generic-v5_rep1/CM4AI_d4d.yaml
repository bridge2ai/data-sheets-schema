missing_data_documentation:
  - id: https://cm4ai.org/#missing-data
    name: Incomplete and embargoed components
    missing_data_patterns: >-
      The protein-protein interaction (SEC-MS), protein localization (immunofluorescence
      imaging) and CRISPRi perturb-seq data interrogate sets of proteins which
      incompletely overlap, so a protein measured in one modality is not necessarily
      measured in the others. Computed cell maps are absent from every release to date.
    missing_data_causes: >-
      Some datasets are under temporary pre-publication embargo, and the releases are
      interim: content is added quarterly through the end of the project.
    handling_strategy: >-
      Missing content is added in subsequent quarterly releases rather than imputed.
    source_caveats: >-
      The CM4AI data-releases page marks immunofluorescence images for the iPSC datasets
      and AP-MS interactomes for the cancer cell datasets as "coming soon!", while the
      June 2026 Dataverse release lists AP-MS archives for both treatment conditions. The
      Dataverse record is preferred, and the discrepancy is recorded here.

