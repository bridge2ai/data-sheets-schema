id: https://cm4ai.org/
name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI)
description: >-
  CM4AI is the Functional Genomics Data Generation Project of the NIH Common Fund
  Bridge2AI program. It produces AI-ready datasets of human cell architecture from
  multimodal interrogation of chromatin modifiers, metabolic enzymes and other
  proteins involved in cancer, neuropsychiatric and cardiac disorders, measured in
  disease-relevant cell lines under treated and untreated conditions. Three
  complementary mapping approaches supply the input data streams: mass
  spectrometry based proteomics (affinity purification mass spectrometry, AP-MS,
  and size-exclusion chromatography mass spectrometry, SEC-MS) for protein-protein
  interactions; immunofluorescence confocal imaging for spatial proteomics; and
  single-cell CRISPR/Cas9 genetic perturbation screens. The cell lines under study
  are the triple-negative breast cancer line MDA-MB-468 with and without paclitaxel
  or vorinostat treatment, and the induced pluripotent stem cell line KOLF2.1J
  undifferentiated and differentiated into neural progenitor cells, neurons and
  cardiomyocytes. Input streams are integrated by the Multi-Scale Integrated Cell
  (MuSIC) software pipeline into hierarchical cell maps, and outputs are packaged
  with provenance graphs and rich metadata in RO-Crate format using the FAIRSCAPE
  framework. The data are released quarterly through the University of Virginia
  Dataverse (LibraData); each release is recorded here as a component resource. The
  project website reports 1,374 protein interactions, 53,788 immunofluorescent
  images, 7,023 total proteins investigated, 11,739 genes targeted and a data volume
  of 21.4 TB.
page: https://cm4ai.org/
