      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/K7TGEM
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
  - id: https://cm4ai.org/#distribution-ro-crate
    name: RO-Crate metadata (JSON)
    format: RO-Crate
    media_type: application/json
    description: >-
      Output data are packaged with provenance graphs and rich metadata as AI-ready
      datasets in RO-Crate format using the FAIRSCAPE framework. The March 2025 release
      distributes one RO-Crate metadata document per component; the June 2025 release
      adds a release-level RO-Crate with pointers to sub-crates; the October 2025 and
      June 2026 releases distribute the release metadata as a single archive.
  - id: https://cm4ai.org/#distribution-html
    name: HTML datasheet and provenance graphs
    format: HTML
    media_type: text/html
    description: >-
      The June 2025 release distributes an HTML datasheet summarizing key release
      information and per-component provenance graph documents. The release notes that
      the provenance graph files require download to view properly and do not display in
      the Dataverse preview.

distribution_dates:
  - id: https://cm4ai.org/#distribution-dates
    name: Release publication dates
    description: >-
      Publication dates recorded on the Dataverse record of each release, in order.
    release_dates:
      - "2025-03-03"
      - "2025-07-01"
      - "2025-10-31"
      - "2026-06-17"
    source_caveats: >-
      The CM4AI data-releases page dates the June 2026 release "June 17, 2025"; the
      Dataverse publication date of 2026-06-17 is stated here. The page also lists a May
      2024 Data Release in its archive without giving a date beyond the month.

third_party_sharing:
  - id: https://cm4ai.org/#third-party-sharing
    name: Public distribution beyond the producing institutions
    is_shared: true
    description: >-
      The datasets and software are stated to be available to the research community
      under minimally restrictive terms consistent with ethical guidelines, researcher
      attribution and research integrity. Releases are distributed publicly through
      LibraData, the University of Virginia's instance of Dataverse and an NIH-approved
      generalist repository, and components are additionally linked to MassIVE, NCBI
      BioProject and Figshare.

license_and_use_terms:
  id: https://cm4ai.org/#license-terms
  name: License and use terms
  license_terms: >-
    The data and metadata are licensed for reuse under the Creative Commons
    Attribution-NonCommercial-ShareAlike 4.0 International license
    (https://creativecommons.org/licenses/by-nc-sa/4.0/), recorded as the
    License/Data Use Agreement on every release. Under that license a reuser is free to
    share and adapt the material subject to attribution, a link to the license and an
    indication of changes; may not use the material for commercial purposes; must
    distribute contributions built on the material under the same license; and may not
    apply legal terms or technological measures that legally restrict others from doing
    anything the license permits. Attribution is required to the copyright holders and
    the authors, and publications referencing the data or derived products should cite
    both the Related Publication and the data collection itself. Commercial use requires
    a separate license negotiation with the copyright holder. The Dataverse terms add
    that community norms and good scientific practice expect proper credit through the
    data citation shown on the dataset page.
  data_use_permission: no_commercial_use

ip_restrictions:
  id: https://cm4ai.org/#ip-restrictions
  name: Copyright and commercial licensing restrictions
  restrictions:
    - >-
      Copyright (c) 2025 The Regents of the University of California, except where
      otherwise noted, as stated on the data releases.
    - >-
      Spatial proteomics raw image data is copyright (c) 2025 The Board of Trustees of
      the Leland Stanford Junior University.
    - >-
      Commercial use requires a separate license negotiation with the copyright holder,
      which is UCSD, Stanford and/or UCSF depending upon the specific data package in
      question.
    - >-
      Attribution is required to the copyright holders and the authors, and to the CM4AI
      project as referenced in the datasets.
  source_caveats: >-
    The project preprint states the equivalent copyright notices for the year 2024; the
    later release wording is stated here.

regulatory_restrictions:
  id: https://cm4ai.org/#regulatory
  name: Regulatory status and access classification
  confidentiality_level: unrestricted
  regulatory_restrictions:
    - >-
      Every release records "FDA Regulated: No" in its Data Governance and Ethics block.
    - >-
      Every release records "Human Subjects: No" and "De-identified Samples: Yes".
  description: >-
    Every file listed in the captured release file tables is marked File Access: Public.
    Some components are under temporary pre-publication embargo and are linked
    externally rather than distributed, which the releases record separately from file
    access.

data_governance:
  id: https://cm4ai.org/#data-governance
  name: CM4AI data governance
  committee_name: Data Governance Committee
  committee_contact: mailto:jillianparker@health.ucsd.edu
  description: >-
    Every data release names Jillian Parker (jillianparker@health.ucsd.edu) as the Data
    Governance Committee contact in its Data Governance and Ethics block.
  access_review_process: >-
    The project preprint states that the Ethics team, working with the Data Acquisition,
    Tools and Standards modules, developed a plan for ethical preparation, licensing,
    dissemination and data access supervision that balances openness with protection of
    intellectual property and supervision of potential efforts at commercialization, and
    that a Data Access Committee will supervise ethical matters related to dataset
    distribution and potential dual licensing for commercial use. It also records that
    the Bridge2AI Data Sharing and Dissemination Working Group developed a Code of
    Conduct outlining basic requirements for participants in the Bridge2AI Open House to
    access Bridge2AI data, including CM4AI datasets, and to attest and commit to it prior
    to accessing the data. Files distributed through the Dataverse releases are marked
    public and require no access request.
  stewardship_roles:
    - Data Governance Committee, named with a contact on every data release
    - >-
      Data Access Committee, stated in the project preprint as the body that will
      supervise ethical matters related to dataset distribution and potential dual
      licensing for commercial use
    - >-
      Ethical Review, named with two contacts in the Data Governance and Ethics block of
      every data release
  accountable_organization:
    id: ROR:0153tk833
    name: University of Virginia
    description: >-
      Host of LibraData, the University of Virginia's archival data repository and its
      instance of Dataverse, where the releases are stated to be preserved long term with
      committed institutional funds.

maintainers:
  - id: https://cm4ai.org/#maintainer-uab
    name: CM4AI program management, University of Alabama at Birmingham
    role: academic_institution
    maintainer_details: >-
      Project-related inquiries are directed to Swathi Thaker, PhD, Program Manager at
      the University of Alabama at Birmingham (snthaker@uab.edu). Website support and
      updates are handled by Zhandos Sembay at the same institution (zsembay8@uab.edu).
  - id: https://cm4ai.org/#maintainer-uva-dataverse
    name: University of Virginia Dataverse (LibraData)
    role: academic_institution
    maintainer_details: >-
      Each release states that long-term preservation is in the University of Virginia
      Dataverse, supported by committed institutional funds. LibraData is described as the
      University of Virginia's instance of Dataverse, an NIH-approved generalist
      repository.
  - id: https://cm4ai.org/#maintainer-point-of-contact
    name: Dataset point of contact
    role: researcher
    maintainer_details: >-
      Each Dataverse release records Trey Ideker (University of California San Diego) as
      the Point of Contact, reached through the contact button on the release page.

updates:
  id: https://cm4ai.org/#updates
  name: Quarterly release plan
  frequency: quarterly
  update_details: >-
    The project states that it releases data quarterly, ensuring continuous updates to
    the cell maps and input data streams, and that the dataset will be regularly updated
    and augmented through the end of the project in November 2026. The project preprint
    adds that data presented in a release will be augmented regularly through the end of
    the project and that software packages are versioned as the project progresses, with
    the version used to produce each dataset referenced in that dataset's metadata.
  source_caveats: >-
    NIH RePORTER gives the project end as 2026-08-31, against the November 2026 end
    stated in the release maintenance plan; the release statement is preferred as the
    higher-ranked source and the disagreement is recorded.

errata:
  - id: https://cm4ai.org/#erratum-june-2025-revision
    name: Revision of the June 2025 data release
    erratum_details: >-
      The June 2025 release record states that it is a revision of the June 2025 Data
      Release, and that the revision includes adding RGB immunofluorescent images,
      corrections to RO-Crate metadata, and changes to naming conventions.

retention_limit:
  id: https://cm4ai.org/#retention
  name: Long-term preservation
  retention_details: >-
    Each release states that long-term preservation is in the University of Virginia
    Dataverse, supported by committed institutional funds. No retention limit or end date
    is stated. Both the CM4AI website and the Dataverse collection display the notice
    "This repository is under review for potential modification in compliance with
    Administration directives."

version_access:
  id: https://cm4ai.org/#version-access
  name: Release history and current release
  latest_version_doi: doi:10.18130/V3/HIGT4C
  versions_available:
    - May 2024 Data Release (listed in the archive of the CM4AI data-releases page)
    - March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX, published 2025-03-03
    - June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R, published 2025-07-01
    - October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM, published 2025-10-31
    - >-
      June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C, published 2026-06-17,
      identified as the latest release
  version_details: >-
    Each release is a separately citable deposit with its own DOI and its own Dataverse
    version history, rather than a version of a single deposit. The CM4AI data-releases
    page presents the June 2026 release as the current one and the earlier releases as an
    archive. The March 2025 release record shows page version 1.4, the June 2025 and
    October 2025 records version 2.1 and the June 2026 record version 2.0, while their
    citation strings give V1, V2, V2 and V2 respectively.
