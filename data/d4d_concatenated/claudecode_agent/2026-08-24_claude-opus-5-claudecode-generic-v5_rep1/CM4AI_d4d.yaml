  - id: https://cm4ai.org/#prohibited-clinical-use
    name: Clinical decision-making or patient care without regulatory oversight
    description: >-
      Each release states that these laboratory data are not to be used in clinical
      decision-making or in any context involving patient care without appropriate
      regulatory oversight and approval.
    prohibition_reason: >-
      Stated prohibition in the Prohibited Uses section of every data release; the data
      are laboratory measurements on cell lines and are recorded as not FDA regulated.
  - id: https://cm4ai.org/#prohibited-commercial-use
    name: Commercial use under the release license
    description: >-
      The releases are licensed CC BY-NC-SA 4.0, whose NonCommercial term states that the
      material may not be used for commercial purposes, a commercial use being one
      primarily intended for commercial advantage or monetary compensation.
    prohibition_reason: >-
      License restriction. The project preprint states that commercial use requires a
      separate license negotiation with the copyright holder, which is UCSD, Stanford
      and/or UCSF depending upon the specific data package in question.

