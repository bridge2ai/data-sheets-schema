instances:
  - id: https://cm4ai.org/#instance-if-images
    name: Immunofluorescence confocal microscopy images
    data_topic: http://purl.obolibrary.org/obo/GO_0008104
    instance_type: >-
      Immunofluorescence confocal microscopy image of an MDA-MB-468 cell sample, with
      four channels: nuclei stained with DAPI (blue), endoplasmic reticulum with a
      calreticulin antibody (yellow), microtubules with a tubulin antibody (red), and an
      antibody against the protein of interest (green)
    counts: 53788
    description: >-
      Images are organized by treatment condition (untreated, paclitaxel, vorinostat).
      The count is the project-wide figure reported in the Data Insights panel of the
      CM4AI website. Per-condition protein coverage is stated on each release: 563
      proteins in the March 2025 release and 464 proteins in the June 2025, October 2025
      and June 2026 releases.
  - id: https://cm4ai.org/#instance-ppi
    name: Protein-protein interactions
    data_topic: http://purl.obolibrary.org/obo/NCIT_C18469
    instance_type: >-
      Protein-protein interaction measured by size-exclusion chromatography mass
      spectrometry (SEC-MS) or affinity purification mass spectrometry (AP-MS)
    counts: 1374
    description: >-
      The count is the project-wide figure reported in the Data Insights panel of the
      CM4AI website. The project preprint reports that SEC-MS identified 72 of 100
      chromatin modifiers in MDA-MB-468 cells, 52 of them integral components of protein
      complexes, and uncovered more than 700 protein complexes in both parental iPSCs
      and differentiated neurons.
  - id: https://cm4ai.org/#instance-perturbseq
    name: CRISPRi genetic perturbations profiled by single-cell RNA sequencing
    data_topic: http://www.ebi.ac.uk/efo/EFO_0008860
    instance_type: >-
      Gene-level CRISPRi perturbation profiled by single-cell RNA sequencing, mapping
      transcriptional and fitness phenotypes for one targeted gene
    counts: 11739
    description: >-
      The expressed genome-scale CRISPRi Perturbation Cell Atlas in undifferentiated
      KOLF2.1J human induced pluripotent stem cells maps transcriptional and fitness
      phenotypes associated with 11,739 targeted genes; the CM4AI website reports the
      same figure as genes targeted. The findings were validated by phenotypic,
      protein-interaction and metabolic tracing assays.

subpopulations:
  - id: https://cm4ai.org/#subpopulation-cell-lines
    name: Source cell lines and their donor backgrounds
    subpopulation_elements_present: true
    identification: >-
      Two ethically sourced human cell lines. MDA-MB-468 (RRID:CVCL_0419) is a triple
      negative breast cancer cell line established from a metastatic site pleural
      effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma,
      available from ATCC. KOLF2.1J (RRID:CVCL_B5P3) is an induced pluripotent stem cell
      line derived from a healthy male Northern European donor, available from the Human
      Induced Pluripotent Stem Cells Initiative (HipSci) resource.
    distribution: >-
      The releases carry MDA-MB-468 data under three conditions (untreated, paclitaxel,
      vorinostat) and KOLF2.1J data in the undifferentiated state and as iPSC-derived
      neural progenitor cells, neurons and cardiomyocytes. The input documents do not
      state counts or proportions per condition.

sensitive_elements:
  - id: https://cm4ai.org/#sensitive-elements
    name: Sensitivity of the released measurements
    sensitive_elements_present: false
    sensitivity_details: >-
      Every data release records "Human Subjects: No" and "De-identified Samples: Yes"
      in its Data Governance and Ethics block. The project preprint states that CM4AI
      data are distinctive within Bridge2AI in being non-clinical, coming from tissue
      cultures, and are considered to be de-identified as they cannot be matched, with
      current knowledge, to a human subject.

known_biases:
  - id: https://cm4ai.org/#bias-cell-line-representation
    name: Cell lines do not represent population-level biological variation
    bias_type: representation_bias
    bias_description: >-
      Each release states that the data were derived from commercially available
      de-identified human cell lines and do not represent all biological variants which
      may be seen in the population at large.
    affected_subsets:
      - All measurements, which derive from the MDA-MB-468 and KOLF2.1J cell lines

known_limitations:
  - id: https://cm4ai.org/#limitation-interim
    name: Interim release
    limitation_type: scope_limitation
    limitation_description: >-
      Each release states that it is an interim release and that the data are not yet in
      completed final form.
    scope_impact: >-
      Content added in later quarterly releases is absent from any single release.
  - id: https://cm4ai.org/#limitation-no-cell-maps
    name: Computed cell maps not included
    limitation_type: coverage_limitation
    limitation_description: >-
      Each release states that computed cell maps are not included and that predicted
      cell maps will be added in future releases, so the released content is the
      map-input data streams rather than the integrated maps.
    recommended_mitigation: >-
      Each release states that it is most suitable for bioinformatics analysis of the
      individual datasets.
  - id: https://cm4ai.org/#limitation-incomplete-overlap
    name: Incomplete overlap between modalities
    limitation_type: integration_limitation
    limitation_description: >-
      Each release states that the protein-protein interaction (SEC-MS), protein
      localization (immunofluorescence imaging) and CRISPRi perturb-seq data interrogate
      sets of proteins which incompletely overlap.
    scope_impact: >-
      Analyses requiring all three modalities for the same protein are restricted to the
      intersection of the three protein sets.
  - id: https://cm4ai.org/#limitation-embargo
    name: Components under temporary pre-publication embargo
    limitation_type: coverage_limitation
    limitation_description: >-
      Each release states under Completeness that some datasets are under temporary
      pre-publication embargo. The October 2025 and June 2026 releases mark the external
      perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468 cells as embargoed.
  - id: https://cm4ai.org/#limitation-domain-expertise
    name: Requires domain expertise
    limitation_type: methodological_limitation
    limitation_description: >-
      Each release states that meaningful analysis of the data requires domain expertise.

acquisition_methods:
  - id: https://cm4ai.org/#acquisition-apms
    name: Affinity purification mass spectrometry (AP-MS)
    was_directly_observed: true
    acquisition_details: >-
      AP-MS was performed on endogenously tagged cell lines to map protein-protein
      interactions of chromatin regulators under the study conditions. The project
      preprint reports that 17 genes had been endogenously tagged in MDA-MB-468 cells
      with AP-MS data acquired under three conditions (untreated, paclitaxel-treated and
      vorinostat-treated), and that 34 additional genes were being tagged. AP-MS
      archives for paclitaxel- and vorinostat-treated MDA-MB-468 cells appear in the
      June 2026 release.
  - id: https://cm4ai.org/#acquisition-secms
    name: Size-exclusion chromatography mass spectrometry (SEC-MS)
    was_directly_observed: true
    acquisition_details: >-
      SEC-MS was used for proteome-wide complex and interaction mapping, as an
      orthogonal mass spectrometry approach to AP-MS. It was performed on MDA-MB-468
      cells under three conditions and on KOLF2.1J iPSCs and their differentiated
      derivatives, in the Nevan Krogan laboratory at the University of California San
      Francisco.
  - id: https://cm4ai.org/#acquisition-if-imaging
    name: Immunofluorescence confocal imaging
    was_directly_observed: true
    acquisition_details: >-
      Spatial subcellular localization was mapped by immunofluorescence-based staining
      (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford University, using
      the Human Protein Atlas resource of antibodies. Nuclei were stained with DAPI,
      endoplasmic reticulum with a calreticulin antibody, microtubules with a tubulin
      antibody, and the protein of interest with its own antibody, giving four channels
      per image.
  - id: https://cm4ai.org/#acquisition-crispr
    name: Single-cell CRISPR perturbation screening
    was_directly_observed: true
    acquisition_details: >-
      Single-cell CRISPR screens perturbing 100 chromatin regulators were performed in
      MDA-MB-468 cells under three conditions (no treatment, paclitaxel, vorinostat) and
      in undifferentiated KOLF2.1J iPSCs. The released CRISPRi Perturbation Cell Atlas
      covers 11,739 targeted genes in undifferentiated KOLF2.1J cells.

collection_mechanisms:
  - id: https://cm4ai.org/#mechanism-imaging
    name: Automated staining and confocal imaging workflow
    mechanism_details: >-
      Automated fixation and permeabilization protocols were established for a pipetting
      robot for the MDA-MB-468 and KOLF2 cell lines, and spatial proteomics mapping of
      100 chromatin regulators was completed in MDA-MB-468 cells with and without
      paclitaxel or vorinostat, with a further 500 proteins pending significant hits from
      the genetic perturbation and protein-protein interaction results.
  - id: https://cm4ai.org/#mechanism-crispr
    name: CRISPRi screening platform
    mechanism_details: >-
      A CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per
      gene was designed, and MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9
      were generated and characterized. Single-cell CRISPR screens were run using the 10x
      Genomics 3’HT kit.

sampling_strategies:
  - id: https://cm4ai.org/#sampling-protein-panel
    name: Targeted selection of the protein panel and cell lines
    is_sample: true
    is_random: false
    source_data: >-
      The human proteome, and human cell lines relevant to cancer, neuropsychiatric and
      cardiac disorders.
    strategies: >-
      Targeted selection of 100 chromatin modifiers and 100 metabolic enzymes involved in
      cancer, neuropsychiatric and cardiac disorders, interrogated in disease-relevant
      cell lines under perturbed and unperturbed conditions. The two cell lines were
      chosen for being ethically sourced and well characterized.
    description: >-
      Spatial proteomics coverage in the releases extends beyond the core panel: the
      March 2025 imaging archives cover 563 proteins per condition and the later releases
      464.

