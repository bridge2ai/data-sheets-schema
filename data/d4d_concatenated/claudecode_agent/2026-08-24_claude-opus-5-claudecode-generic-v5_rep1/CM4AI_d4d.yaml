preprocessing_strategies:
  - id: https://cm4ai.org/#preprocessing-music
    name: MuSIC data integration and map production pipeline
    preprocessing_details: >-
      The Multi-Scale Integrated Cell (MuSIC) pipeline produces integrated cell maps from
      the multimodal input data streams in five steps. Protein-protein interaction
      networks and immunofluorescence images are downloaded from the respective
      laboratory deposition archives; interaction networks are embedded with the node2vec
      deep learning model and images with a Human Protein Atlas deep learning model, each
      reducing dimensionality; the two embeddings are integrated into a per-protein
      co-embedding by contrastive deep learning, learned so that the original embeddings
      can be reconstructed with minimal information loss and proteins with similar inputs
      have similar co-embeddings; community detection is performed on the all-by-all
      similarities of protein pairs in the co-embedding space, yielding a hierarchy of
      protein communities as the cell map; and the map is annotated.
    description: >-
      The pipeline is divided into segments, each of which calls the FAIRSCAPE client
      package to validate inputs and create the output RO-Crate package for that segment,
      which is then dispatched to the FAIRSCAPE server for persistent identifier creation
      and provenance graph entailment computation.
    source_caveats: >-
      These are the project's stated integration steps. The releases in the input
      documents state that computed cell maps are not included, so the pipeline outputs
      described here are not themselves among the released files.
  - id: https://cm4ai.org/#preprocessing-fairscape
    name: FAIRSCAPE AI-readiness packaging
    preprocessing_details: >-
      The FAIRSCAPE client, called when a computation or coherent set of computations in
      the pipeline completes, is passed metadata defining JSON-Schema schemas for the
      datasets in the computational unit along with its inputs, computations, software,
      models and outputs. It creates an RO-Crate package with the datasets, metadata and
      software, or resolvable references to them, and identifier stubs for each
      component. The crates are sent to the FAIRSCAPE server, registered and assigned
      persistent, resolvable, globally unique identifiers under the ARK scheme, then
      decomposed into their components, which are registered and assigned identifiers in
      turn. The server computes end-to-end entailments on each crate's provenance,
      expressed in the EVI Evidence Graph Ontology, and links them where possible.
      Identifiers resolve to machine- and human-readable landing pages carrying the
      metadata in JSON-LD using vocabularies from Schema.org, EVI and other public
      ontologies, with alternate JSON-LD and RDF-XML serializations.
    used_software:
      - id: https://fairscape.github.io
        name: FAIRSCAPE
        url: https://fairscape.github.io
        license: MIT
        description: >-
          Client-server framework for FAIR and reproducible biomedical analytics, used by
          CM4AI for AI-readiness packaging of data, software, metadata and provenance
          graphs. Both client-side and server-side packages are pip-installable and
          freely available.

labeling_strategies:
  - id: https://cm4ai.org/#labeling-hierarchy-evaluation
    name: Cell map hierarchy annotation
    data_annotation_protocol: >-
      Cell maps are annotated in a two-pronged approach. First, maps are aligned to known
      protein function and pathway resources, including the Gene Ontology and Reactome,
      to determine which protein assemblies overlap strongly with known cell biology.
      Second, assemblies are annotated using a large language model approach developed by
      the project to name sets of proteins and assign a name confidence score.
    source_caveats: >-
      This annotation applies to the computed cell maps, which the releases state are not
      included in the released files. The input documents do not name the annotation
      platform or model used for CM4AI maps.

