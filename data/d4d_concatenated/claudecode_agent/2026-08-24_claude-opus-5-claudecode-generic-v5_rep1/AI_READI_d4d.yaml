id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal dataset collected from individuals with and without type 2 diabetes
  mellitus (T2DM) and harmonized across three data collection sites, created by the
  AI-READI Consortium to enable artificial intelligence and machine learning research
  into salutogenesis — the pathway from disease to health — in T2DM. Version 3.0.0
  contains data from 2280 participants collected between July 19, 2023 and May 1,
  2025, comprising 356,343 files totaling approximately 3.82 TB. Each instance
  represents an individual participant and may include survey data, clinical
  measurements and laboratory results mapped to the OMOP Common Data Model,
  12-lead electrocardiography, retinal photography, optical coherence tomography,
  optical coherence tomography angiography, fluorescence lifetime imaging
  ophthalmoscopy, continuous glucose monitoring, wearable physical activity
  monitoring, and home environmental sensing. The dataset contains no protected
  health information; information on participant sex, race and ethnicity, and
  medications used has been removed from the public release and is held under
  controlled access. The dataset is organized following the Clinical Dataset
  Structure (CDS) specification and distributed through the FAIRhub platform under
  a custom license that permits commercial and non-commercial research reuse while
  imposing requirements on data usage, security, and secondary sharing.
