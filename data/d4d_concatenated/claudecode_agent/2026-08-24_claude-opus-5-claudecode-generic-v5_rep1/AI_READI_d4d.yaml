    datasets. It was developed as part of the project as a simple and intuitive way to
    organize clinical research datasets and include structured metadata.
  external_resources:
  - https://cds-specification.readthedocs.io/en/v0.1.1/
  - https://cds-specification.readthedocs.io
- name: Associated publications
  description: >-
    The publications the RO-Crate associates with the dataset: the Nature Metabolism
