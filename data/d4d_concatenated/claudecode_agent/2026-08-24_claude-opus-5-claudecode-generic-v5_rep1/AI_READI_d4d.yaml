  - https://doi.org/10.1136/bmjopen-2024-097449

variables:
- variable_name: blood glucose
  data_type: float
  unit: mg/dL
  description: >-
    Blood glucose measurements taken every 5 minutes by the continuous glucose monitor over
    the 10-day at-home monitoring period. Participants are masked to the results during the
    period. Participants already wearing a compatible monitor may opt to share up to 90
    days of prior readings, for up to 100 days of data in total.
  measurement_technique: Dexcom G6 continuous glucose monitor
- variable_name: MoCA total score
  data_type: integer
  maximum_value: 30.0
  description: >-
    Total score from the Montreal Cognitive Assessment, a screening tool for mild cognitive
    impairment and early onset dementia covering memory, executive functioning, attention,
    language, visuospatial, orientation, visuoconstructional skills, conceptual thinking and
    calculations. The total possible score is 30, with higher numbers representing better
    performance; a score below 24 is a sign of cognitive impairment and 26 or above is
    considered normal. Six domain-specific index scores, including a Memory Index Score, and
    task completion times are also recorded.
  measurement_technique: Montreal Cognitive Assessment administered on an iPad using the
    MoCA Duo application
  quality_notes: >-
    Scoring requires professional training, and a person's level of education, socioeconomic
    factors, and the presence of depression or other mental health conditions may affect the
    result.
- variable_name: best-corrected visual acuity
  data_type: float
  unit: logMAR
  description: >-
    Letter visual acuity measured separately for each eye under best-corrected conditions,
    expressed as the logarithm of the minimum angle of resolution, where lower numbers
    indicate better resolution. Measured under photopic conditions and, through a 2.0
    neutral density filter, under mesopic conditions. The Snellen visual acuity variables
    were dropped in version 3.0.0, leaving only logMAR measurements.
  measurement_technique: M&S Technologies Electronic Visual Acuity tester at four meters
- variable_name: letter contrast sensitivity
  data_type: float
  unit: log contrast sensitivity
  description: >-
    Letter contrast sensitivity measured monocularly under photopic conditions with a
    general occluder and under mesopic conditions with a neutral density occluder, in the
    standardized order photopic right eye, photopic left eye, mesopic right eye, mesopic
    left eye. Expressed as log sensitivity, with higher numbers meaning better sensitivity.
    Chart background luminance falls between 60 and 120 cd/m2, optimally 85; illuminance
    between 189 and 377 lux, optimally 267; viewing distance nominally 50 cm, varying
    between 40 and 59 cm. Testing is under undilated conditions with appropriate near
    correction. Testing terminates on two consecutive errors or at the end of the chart, and
    the log contrast sensitivity value is computed by multiplying the number of errors
    before the final correct letter by 0.04 and subtracting the result from the log contrast
    sensitivity value at that letter.
  measurement_technique: Mars letter contrast sensitivity chart (Mars Perceptrix)
- variable_name: steps
  data_type: integer
  description: Number of steps recorded by the wearable physical activity monitor.
  measurement_technique: Garmin Vivosmart 5 physical activity monitor
- variable_name: heart rate
  data_type: float
  description: >-
    Heart rate recorded by the wearable physical activity monitor during the at-home
    monitoring period. Heart rate is also measured at the study visit, twice two minutes
    apart, and can be read from the electrocardiogram or the blood pressure device.
  measurement_technique: Garmin Vivosmart 5 physical activity monitor; automatic
    oscillometric blood pressure monitor at the study visit
- variable_name: sleep duration
  data_type: float
  description: >-
    Sleep duration recorded by the wearable physical activity monitor, supporting circadian
    and diurnal rhythm analysis; sleep phases are also recorded.
  measurement_technique: Garmin Vivosmart 5 physical activity monitor
- variable_name: oxygen saturation
  data_type: float
  description: Oxygen saturation recorded by the wearable physical activity monitor.
  measurement_technique: Garmin Vivosmart 5 physical activity monitor
- variable_name: ambient temperature
  data_type: float
  description: Ambient temperature recorded in the participant's home by the environmental
    sensor over 10 continuous days.
  measurement_technique: LeeLab Anura custom environmental sensor
- variable_name: relative humidity
  data_type: float
  description: Relative humidity recorded in the participant's home by the environmental
    sensor.
  measurement_technique: LeeLab Anura custom environmental sensor
- variable_name: nitrogen oxides
  data_type: float
  description: Nitrogen oxide concentrations, covering NO and NO2, recorded in the
    participant's home by the environmental sensor.
  measurement_technique: LeeLab Anura custom environmental sensor
- variable_name: volatile organic compounds
  data_type: float
  description: Volatile organic compound levels recorded in the participant's home by the
    environmental sensor.
  measurement_technique: LeeLab Anura custom environmental sensor
- variable_name: particulate matter
  data_type: float
  description: >-
    Particulate matter concentrations recorded in the participant's home by the
    environmental sensor at four size fractions: PM1.0, PM2.5, PM4 and PM10.
  measurement_technique: LeeLab Anura custom environmental sensor
- variable_name: multi-spectral light intensity
  data_type: float
  description: >-
    Eleven multi-spectral light intensity measurements recorded in the participant's home by
    the environmental sensor.
  measurement_technique: LeeLab Anura custom environmental sensor
