    The validation portion of the recommended split for version 3.0.0, comprising 352
    participants, balanced as far as possible across demographic and diabetes status
    groups. Its published composition is 88 participants in each of the Hispanic, Asian,
    Black and White groups; 176 male and 176 female; and by diabetes status 88 with no
    diabetes, 88 lifestyle controlled, 109 oral medication controlled and 67 insulin
    controlled. Mean age is 60.3 years with a standard deviation of 10.8.
  is_data_split: true
  is_subpopulation: false
