  description: >-
    Version 1.0.0 was released on May 3, 2024 with data from the pilot data collection
    phase; version 2.0.0 on November 8, 2024 with data through the first full year of the
    study; and version 3.0.0 on November 17, 2025 with data through the end of the second
    year. The healthsheet describes these as May 2024, November 2024 and November 2025
    respectively. New versions are planned approximately once a year.

third_party_sharing:
- name: Public distribution through FAIRhub
  is_shared: true
  description: >-
    The dataset will be distributed and be available for public use, through the FAIRhub
    platform, and has a digital object identifier. Deidentified data are released
    approximately yearly in two datasets: a controlled access set and a publicly
    accessible set with fewer requirements for access. The controlled access set contains
    all data available in the publicly accessible set plus more sensitive data available
    only to scientists whose institutions have completed legal and privacy use agreements
    with the research program.

license_and_use_terms:
  name: AI-READI Data License Agreement, Version 2.0
  license_terms: >-
    The dataset is licensed under a custom license tailored to enable reuse of the
    AI-READI dataset, and other clinical datasets, for commercial or research purposes
    while imposing strong requirements around data usage, security and secondary sharing
    to protect study participants, especially when data is reused for artificial
    intelligence and machine learning applications. The licensor is Washington University
    in St. Louis. The license grants a non-exclusive, non-transferable license to
    download, reproduce and use the data and to create derivative works, for research and
    for commercial and non-commercial purposes. A licensee may enter the agreement
    individually, in which case no other person is authorized to access the data, or on
    behalf of an identified internal group, lab or business unit within their institution
    or employer, in which case legal members of that group are authorized users whose
    rights terminate automatically when their relationship with the group or institution
    ends. Derivative data — data modified, excerpted, encrypted, condensed, encoded,
    translated or otherwise altered such that it contains or permits derivation of the
    data — is itself considered data subject to all the restrictions, and synthetic data
    created using the data is considered derivative data. Licensees may make, reproduce and
    distribute models, algorithms and programs developed, trained or adapted using the
    data but not themselves containing it, provided that before dissemination they
    undertake all reasonable efforts to minimize the likelihood that data can be
    memorized, derived, reconstructed or reconstituted through the use or construction of
    such models. Licensees must acknowledge the licensor, the source and any funder of the
    data in any papers reporting its use, and must comply with the data security and
    privacy standards established by the National Institutes of Health under its Genomic
    Data Sharing Policy. Title to the data and all industrial and intellectual property
    rights in it remain solely with the licensor. The data is provided on an as-is basis
    without warranty of any kind, the licensor's aggregate liability is capped at one US
    dollar except where applicable law prohibits limitation, and the licensee indemnifies
    the licensor against claims arising from its use of the data or from any model. The
    agreement terminates automatically upon any breach, on which the licensee must delete
    all copies and cease all use. The license is published at
    https://doi.org/10.5281/zenodo.17555036.
  data_use_permission: disease_specific_research
  source_caveats: >-
    The license file in the bundle is version 2.0. The Nature Metabolism comment, written
    at the time of the first release, cites an earlier license at
    https://doi.org/10.5281/zenodo.10642459; that DOI names the superseded version 1.0 and
    is not the license this record states.

ip_restrictions:
  name: Intellectual property restrictions in the data license
  restrictions:
  - Title to the data, and all industrial and intellectual property rights in it, remain
    solely and exclusively with the licensor and its suppliers, and the licensee shall
    take no action inconsistent with that ownership; any rights not expressly granted are
    reserved.
  - The licensee shall not transfer, license, sublicense, sell, assign, display, share or
    otherwise convey any portion of the data or any derivative work to any third party
    other than another licensee bound by identical terms.
  - Data may not be reproduced in papers, articles, presentations, analyses, reports or
    publications, except that small representative samples may be reproduced in up to five
    images or figures per paper for illustrative purposes only; publishers and conference
    organizers seeking more must obtain a separate license from the licensor.
  - Derivative data and synthetic data created from the data remain subject to all the
    restrictions of the agreement.
  description: >-
    The dataset documentation is separately shared under the CC-BY 4.0 license, so no
    restrictions apply to its use.

regulatory_restrictions:
  name: Regulatory and compliance restrictions
  regulatory_restrictions:
  - Licensees must comply with the data security and privacy standards established by the
    US National Institutes of Health under its Genomic Data Sharing Policy, the current
    version of which is the NIH Security Best Practices for Controlled-Access Data Subject
    to the NIH GDS Policy.
  - The data may be statically watermarked to identify the licensee for security purposes,
    and the licensee agrees to take no action to remove, obscure, alter or mask the
    watermarking.
  - The data may be used and stored only on servers and devices maintained by and located
    within the licensee's institution or employer, or on cloud or remote storage and
    backup services covered by a HIPAA-approved business associate agreement with that
    institution or employer.
  - Licensees must comply with all applicable laws, regulations and restrictions relating
    to the distribution and use of the data and of models.
  hipaa_compliant: compliant
  other_compliance: >-
    The FAIRhub study description records that the study is not FDA-regulated as either a
    drug or a device study, and the RO-Crate records fdaRegulated as false. The healthsheet
    records that no export controls or other regulatory restrictions beyond the license
    apply.
  description: >-
    The released dataset contains no protected health information. No identifiers were
    collected, so no active de-identification was necessary, and the project verified that
    no data identifiable under US HIPAA were present. The RO-Crate records the dataset's
    confidentiality level as "HL7:2N (normal)".
  source_caveats: >-
    The confidentiality level the RO-Crate states, "HL7:2N (normal)", is on a scale the
    schema's confidentiality level enumeration does not cover, so that enumeration is left
    unpopulated rather than mapped to an approximate term.

data_governance:
  name: AI-READI data governance
  committee_name: AI-READI Consortium
  access_review_process: >-
    Accessing the dataset requires logging in through a verified ID system, agreeing to
    use the data only for type 2 diabetes related research, and agreeing to the license
    terms, which set restrictions and obligations on data usage. The FAIRhub metadata
    records the access type as "PublicDownloadSelfAttestationRequired". The controlled
    access dataset, which contains all the public data plus more sensitive data, is
    available only to scientists whose institutions have completed legal and privacy use
    agreements with the research program; the BMJ Open protocol records that the
    requirements for controlled access datasets are being developed by the Data Access
    Committee. The IRB protocol describes two databases for distribution: a deidentified
    one that is publicly available, and one holding some identifiable or sensitive
    information, including genomic data and race and ethnicity, requiring a data user
    agreement and an approval process developed by the project committee.
  stewardship_roles:
  - The AI-READI team supports and maintains the dataset, which is hosted on FAIRhub
    through Microsoft Azure.
  - Data managers at each collection site are responsible for quality control of all data
    before uploading it to FAIRhub.
  - Principal investigators and lead co-investigators at each participating institution
    have access to study data, and research staff have access under their supervision.
  - The biorepository at the University of Alabama at Birmingham Center for Clinical and
    Translational Science holds the study-wide biospecimen collection, and the project is
    creating an infrastructure to decide who may request and receive specimens for future
    research.
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
    description: >-
      The managing organization for the dataset, the lead sponsor of the study, and the
      licensor of the data license.
    source_caveats: >-
      The managing organization and lead sponsor roles are from the FAIRhub metadata; the
      licensor role is from the license file.
  description: >-
    The RO-Crate names the AI-READI Consortium as the data governance committee. The
    dataset is accessed through FAIRhub, an AI-READI-specific data management platform
    built on Microsoft Azure and developed for this project.
  source_caveats: >-
    Two distinct bodies appear in the bundle. The RO-Crate names the AI-READI Consortium
    as the data governance committee, which is the value recorded here; the BMJ Open
    protocol (tier 3) separately refers to a Data Access Committee that is developing the
    requirements for controlled access datasets, and the IRB protocol refers to an
    approval process developed by the project committee. The bundle does not state the
    Data Access Committee's membership or contact, so none is asserted.

ethical_reviews:
- name: University of Washington Institutional Review Board approval
  reviewing_organization: University of Washington Institutional Review Board
  review_details: >-
    The study was approved by the Institutional Review Board of the University of
    Washington under approval number STUDY00016228, including reliance agreements with the
    Institutional Review Boards of the University of Alabama at Birmingham and the
    University of California, San Diego. The initial approval was received on December 20,
    2022, and the initial approval letter is published in the dataset documentation. An
    annual renewal application to the Institutional Review Board reporting the status and
    progress of the study is required and is due within 90 days of expiration. The FAIRhub
    study description records the human subject review status as "Submitted, approved" and
    records that the study has no data monitoring committee. Contact for reliance runs
    through the University of Washington Human Subjects Division IRB Reliance Team at
    hsdrely@uw.edu, Human Subjects Division, University of Washington, 4333 Brooklyn Ave
    NE, Box 359470, Seattle, WA 98195-9470.
  source_caveats: >-
    The RO-Crate names the reviewing organization "Washington University IRB" while giving
    a University of Washington Human Subjects Division address, contact email and reliance
    team; the BMJ Open protocol, the healthsheet and the IRB protocol document all name the
    University of Washington Institutional Review Board, which is the name recorded here.
- name: Project ethics, legal and social implications review
  review_details: >-
    The RO-Crate records the ethical review as carried out by Camille Nebeker, Debra
    Mathews, Kadija Ferryman and Nicholas Evans. The project states that ethical, legal and
    social implications are considered at every stage of the project cycle, that the
    establishment of standards and best practices for collecting, preparing and sharing
    data includes guidance from bioethicists, and that a Community Advisory Board of 11
    persons from the three sites, with diversity in race and ethnicity as represented in
    the sample, contributes to the development of the protocol and evaluates the consent
    forms and research protocols. Through engagement with the Native Biodata Consortium the
    project pursues a co-learning opportunity on challenges specific to American Indian and
    Alaska Native communities, evaluating tools such as data usage agreements, contract
    negotiations, transparent access agreements and forms of assured return of benefit and
    sustainable input, control and monitoring of Tribal data.
  source_caveats: >-
    The RO-Crate records these four reviewers under an ethicalReview field but names no
    reviewing body, so none is asserted. This is a distinct activity from the
    Institutional Review Board approval recorded above.

data_protection_impacts:
- name: No data protection impact analysis conducted
  impact_details: >-
    No analysis of the potential impact of the dataset and its use on data subjects, such
    as a data protection impact analysis, has been conducted.

human_subject_research:
  name: Human subject research oversight
  involves_human_subjects: true
  irb_approval:
  - STUDY00016228
  ethics_review_board: University of Washington Institutional Review Board
  regulatory_compliance:
  - HIPAA Privacy Rule
  - NIH Genomic Data Sharing Policy
  description: >-
    The RO-Crate records human subject research as "Yes" and the IRB protocol identifier as
    STUDY00016228. Data are collected prospectively from consenting adult participants at
    three sites; the study is observational, is not FDA-regulated as a drug or device
    study, and has no data monitoring committee. The IRB protocol records the study's data
    security level as Level 3, with all study data and identifiable information kept on
    encrypted servers or in locked cabinets or rooms with restricted access at all sites,
    and all study procedures conducted in private rooms.

informed_consent:
- name: Informed consent for study participation
  consent_obtained: true
  consent_type: >-
    Written informed consent, obtained either electronically through REDCap with an
    electronic signature or in person at the start of the visit
  consent_documentation: >-
    The approved consent form for the principal project site, the University of Washington,
    is published with the version 3.0.0 dataset documentation as
    "AI-READI Consent_Form_Standard_Mod17May2023_useforpilot.pdf". The other clinical
    sites had Institutional Review Board reliance and used the same consent form, with
    minor institution-specific language incorporated according to individual institutional
    requirements; the IRB protocol notes that the State of California requires the Bill of
    Rights in the consent form used at the University of California, San Diego. The consent
    form includes a table at its beginning clarifying which information will be publicly
    available and which requires an application and approval process with privacy
    protection. Upon signing, the signed consent form is automatically emailed to the
    subject, who may request further copies from the study coordinator at any time during
    the study.
  consent_scope: >-
    Consent covers participation in the study protocol and the collection and use of the
    resulting data, including its placement in an open-source repository and the retention
    of biospecimens for future approved research. The FAIRhub metadata records the consent
    type as "ConsentSpecifiedNotElsewhereCategorised", with no non-commercial, geographic,
    research-type, genetic-only or methods restrictions flagged, and notes that the public
    version of the dataset can only be used for type 2 diabetes related research while a
    private version will allow more generic use.
  withdrawal_mechanism: >-
    Participants were permitted to withdraw consent at any time and cease study
    participation, and this is clearly communicated in the consent document. Any data that
    had been shared or used up to that point would stay in the dataset. Subjects are
    reminded throughout the study that they have the right to change their mind about
    participation.

participant_privacy:
- name: Privacy protections for released data
  anonymization_method: >-
    The FAIRhub metadata records that no identifiers were collected, so no active
    de-identification was necessary, and that the project checked that no data identifiable
    under US HIPAA were present. The Nature Metabolism comment describes the public set as
    stripped of protected health information as defined by the HIPAA Privacy Rule via the
    Safe Harbor method, as well as of sex and race or ethnicity information to prevent
    stigmatization of findings.
  privacy_techniques: >-
    A robust data dissemination system, a strict license agreement and data watermarking
    are applied to both the public and controlled sets. The at-home environmental sensor
    and fitness tracker were specifically chosen with participant privacy as a primary
    concern: they capture no video or audio, are not equipped with GPS location monitoring
    and are not synced with participant-owned devices. Sensitive fields — five-digit zip
    code, sex, race, ethnicity, genetic sequencing data, past health records, medications,
    and traffic and accident reports — are held under controlled access rather than
    released publicly. Identifiable information held by the study is kept on encrypted
    servers or in locked cabinets or rooms with restricted access at all sites, with access
    limited to authorized research personnel.
  reidentification_risk: >-
    The project does not currently anticipate uses that could result in unfair treatment or
    harm, but records a theoretical risk of future re-identification, noting that AI
    algorithms can infer individual patient characteristics and could facilitate
    individual-level identification. The IRB protocol assesses the risk of confidentiality
    breach as low given the storage and access controls in place.
  data_linkage: >-
    Data are linked across modalities within a participant by a study participant ID number
    that names the participant's directory within each device directory. Access to the
    controlled dataset, which holds the more sensitive fields, requires a data use
    agreement.

participant_compensation:
- name: Participant compensation and travel support
  compensation_provided: true
  compensation_type: Stipend for the study visit, paid from grant funding
  compensation_amount: $200
  compensation_rationale: >-
    The IRB protocol records a $200 stipend for participation, provided once the final data
    are received from the participant and the study devices are returned, typically at
    least two weeks after the study visit to allow for the 10 days of home-based data
    collection and the return of the devices by mail. The payment is not prorated. The same
    type and amount of compensation is given to participants asked to return in year 4 of
    the study, and the amount may change in future years depending on study funding.
  retention_incentives: >-
    The study covers reasonable costs for parking, public transit or rideshare fees related
    to the study visit, and transportation assistance through rideshare services was
    offered to participants who reported barriers to getting to study visits.
  description: >-
    Team members' effort was supported by NIH award OT2OD032644 in proportion to the
    percentage of effort contributed, with salaries aligned to the funding guidelines at
    each site.

is_deidentified:
  name: De-identification status
  identifiable_elements_present: false
  method: >-
    No active de-identification. No identifiers were collected, so the project verified that
    no data identifiable under US HIPAA were present rather than removing identifiers from
    collected data. Direct identifiers and HIPAA identifiers are flagged as addressed;
    date shifting, non-arrangement and k-anonymity methods were not applied.
  identifiers_removed: >-
    Protected health information; participant sex; race and ethnicity; medications used.
    Held under controlled access rather than in the public release: five-digit zip code,
    sex, race, ethnicity, genetic sequencing data, past health records, medications, and
    traffic and accident reports.
  deidentification_details: >-
    The dataset contains no protected health information. The RO-Crate records the dataset
    as deidentified. Measures to avoid re-identification are described at the level of the
    dissemination system rather than at the level of record suppression or date shifting:
    a strict license agreement, controlled access for sensitive fields, and static
    watermarking of the data to identify the licensee.
  source_caveats: >-
    The method above is the FAIRhub dataset description's datasetDeIdentLevel block, which
    records the de-identification type as "NoDeIdentification"; the RO-Crate separately
    records the dataset as deidentified. The Nature Metabolism comment (tier 3) instead
    describes the public set as stripped of protected health information via the HIPAA
    Safe Harbor method, which is a different claim about how the same outcome was reached;
    the tier-1 account is stated here and the tier-3 one is recorded rather than dropped.
    The healthsheet's composition question on measures taken to avoid re-identification is
    present but unanswered in the bundle, as is its preprocessing question on
    de-identification.

maintainers:
- name: AI-READI team
  role: academic_institution
  maintainer_details: >-
    The AI-READI team supports and maintains the dataset, which is hosted on FAIRhub
    through Microsoft Azure. The healthsheet directs users to the README file included with
    the dataset for contact information; the README directs questions, suggestions and
    feedback to https://aireadi.org/contact and refers users to the study_description.json
    and dataset_description.json metadata files included with the dataset for information
    about the contact person or entity, authors and contributors. The FAIRhub study
    description gives contact@aireadi.org as the central contact email, and the RO-Crate
    gives https://docs.aireadi.org/docs/3/contact as the contact point.

updates:
  name: Versioned release plan
  frequency: Approximately once a year
  update_details: >-
    The dataset is released as static versions and is not updated in place. Rather than
    correcting or extending an existing version, new versions are released with additional
    instances as more study participants complete the study visit. There are plans to
    release new versions approximately once a year with additional data from participants
    enrolled since the previous release, and further versions are expected because
    enrollment is ongoing. Changes between versions are documented in detail in the
    CHANGELOG file included with the dataset and visible in the documentation site.

retention_limit:
  name: Data retention
  retention_period: No limit
  retention_details: >-
    There are no limits on the retention of the data associated with the instances.
    Participants were not told that their data would be retained for a fixed period and
    then deleted. The raw data is expected to be preserved by the project at least for the
    duration of the project.

version_access:
  name: Version history and access
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - 1.0.0
  - 2.0.0
  - 3.0.0
  version_details: >-
    Three static versions have been released, each with its own DOI: version 1.0.0
    (10.60775/fairhub.1) on May 3, 2024, containing 204 participants from the pilot data
    collection phase; version 2.0.0 (10.60775/fairhub.2) on November 8, 2024, adding 863
    participants for a total of 1067 and covering the first full year of the study; and
    version 3.0.0 (10.60775/fairhub.3) on November 17, 2025, adding 1213 participants for a
    total of 2280 and covering data through the end of the second year. Each version is
    accessible through FAIRhub and has its own documentation, reachable from a version
    selector in the documentation site; healthsheets exist for versions 1 and 2 as well as
    for this one. The FAIRhub page for version 2.0.0 states that that version is no longer
    accessible and refers users to the latest version. Older versions will not be updated:
    new versions are released with additional instances instead. Across versions the data
    fields and types are largely unchanged, except that the Snellen visual acuity variables
    were dropped in version 3.0.0, leaving only logMAR measurements, and processing moved
    from custom and ad hoc handling in version 1.0.0 to a mix of automated and custom
    processing thereafter, with one additional imaging device added in the second year of
    data and three more in the third.

extension_mechanism:
  name: Contribution mechanism
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset
    outside those involved in the project.

external_resources:
- name: AI-READI dataset documentation
  id: https://docs.aireadi.org/
  description: >-
    The dataset documentation, which complements the information on the FAIRhub landing
    page and which the project recommends reading before accessing the dataset. It carries
    a Citation section, a Preliminary Information section covering access, the license,
    training prerequisites, the mini-subset version and Azure Storage access, a Dataset
    Documentation section giving an overall description in the Healthsheet template
    together with per-domain detail on clinical context, acquisition, individual variables
    and processing including file formats, data standards, metadata and example outputs, an
    AI-readiness section, an Additional Resources section, and a Changelog. One version of
    the documentation exists per version of the dataset, selectable from a dropdown. The
    healthsheet records the dataset as self-contained but reliant on this documentation for
    users who need additional information about its provenance.
  external_resources:
  - https://docs.aireadi.org/
  future_guarantees: >-
    The bundle states no guarantee that the documentation will remain available or
    unchanged. The v2.0.0 and v3.0.0 documentation pages both carry the notice "This
    repository is under review for potential modification in compliance with Administration
    directives."
  restrictions:
  - The documentation is shared under the CC-BY 4.0 license, so there are no restrictions
    associated with its use.
- name: AI-READI project website
  id: https://aireadi.org/
  description: >-
    The project website, which the healthsheet gives as the place where details of each
    consortium member and their institution are published, where the team page describes
    the distribution of backgrounds and expertise of the dataset curators, and which
    carries the project's contact page and its data sharing goals page.
  external_resources:
  - https://aireadi.org/
  - https://aireadi.org/team
  - https://aireadi.org/contact
  - https://aireadi.org/goals/data-sharing
- name: AI-READI GitHub organization
  id: https://github.com/AI-READI
  description: >-
    The project's GitHub organization, listed in the dataset README among the resources
    related to the dataset and cited in the Nature Metabolism comment as part of the
    project's shared blueprint for collecting and sharing AI-ready datasets.
  external_resources:
  - https://github.com/AI-READI
- name: AI-READI Zenodo community
  id: https://zenodo.org/communities/aireadi
  description: >-
    The project's Zenodo community, listed in the dataset README among the resources
    related to the dataset and cited in the Nature Metabolism comment as part of the
    project's shared blueprint. The dataset license is published on Zenodo, at
    https://doi.org/10.5281/zenodo.17555036.
  external_resources:
  - https://zenodo.org/communities/aireadi
- name: FAIRhub data platform
  id: https://fairhub.io/
  description: >-
    The AI-READI-specific data management, curation and sharing platform, a Microsoft
    Azure cloud-based platform developed for this project. Each collection site uploads
    data to it at regular intervals, all data are stored and shared through it as AI-ready,
    and each dataset version is accessible through it. The project anticipates making the
    platform available to future data generation projects that wish to manage and share
    AI-ready clinical research datasets.
  external_resources:
  - https://fairhub.io/
  - https://fairhub.io/datasets/3
  - https://fairhub.io/datasets/3/access
- name: Clinical Dataset Structure specification
  id: https://cds-specification.readthedocs.io/en/v0.1.1/
  description: >-
    The specification the dataset's directory organization and manifest files follow,
