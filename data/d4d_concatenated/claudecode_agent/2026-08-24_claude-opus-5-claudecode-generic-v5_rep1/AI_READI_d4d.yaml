    groups. Its published composition is 88 participants in each of the Hispanic, Asian,
    Black and White groups; 176 male and 176 female; and by diabetes status 88 with no
    diabetes, 88 lifestyle controlled, 90 oral medication controlled and 86 insulin
    controlled. Mean age is 60.5 years with a standard deviation of 11.4.
  is_data_split: true
  is_subpopulation: false

anomalies:
- name: Skipped or incomplete survey responses
  anomaly_details: >-
    In cases of survey data, skipped questions or incomplete responses are expected.
- name: Wearable device misuse and technical failure
  anomaly_details: >-
    In cases of using wearables, improper use and technical failure such as battery
    failure or system malfunction are expected.
- name: Imaging noise, non-cooperation and transfer failure
  anomaly_details: >-
    In cases of imaging data, patient uncooperation, noise that may obscure the images,
    technical failure such as system malfunction, and data transfer failures are
    expected.
- name: Variable image quality from operator-dependent and undilated acquisition
  anomaly_details: >-
    Image quality varies with the acquisition method. Optomed Aurora images are taken
    undilated and handheld, so quality varies from patient to patient and within the same
    patient. The Heidelberg Spectralis is operated by the imaging team and is not fully
    automated, so quality issues may arise that lead to skipping the modality and to
    missing data. Fluorescence lifetime imaging ophthalmoscopy takes longer than a usual
    Spectralis scan and exposes patients to uncomfortable levels of light, so it is
    performed last in a visit, when patient compliance may be lower; the device also
    cannot tolerate more than one centimeter of movement during acquisition.
- name: Data lost to collision during processing
  anomaly_details: >-
    In a few cases there may have been a data collision at some point in the process and
    data has been lost.

known_biases:
- name: Volunteer selection bias
  bias_type: selection_bias
  bias_description: >-
    Participants are volunteers, so there is selection bias known as volunteer bias,
    which may limit the generalizability of results to those not represented in the study
    population.
  affected_subsets:
  - the whole cohort
- name: Under-representation of groups not among the four target race/ethnicity groups
  bias_type: representation_bias
  bias_description: >-
    The study cohort may not provide a comprehensive representation of the population, as
    it does not include other races and ethnicities such as Pacific Islanders and Native
    Americans. Recruitment is also predominantly urban and hospital-based, which may not
    fully capture diverse cultural and socioeconomic backgrounds.
  mitigation_strategy: >-
    Three recording sites were strategically selected for geographic diversity across the
    United States and to ensure diverse representation across racial and ethnic groups,
    and individuals from all demographic backgrounds were recruited at all three sites.
  affected_subsets:
  - populations outside the four target race and ethnicity groups
- name: Imbalance across the balancing parameters in early releases
  bias_type: sampling_bias
  bias_description: >-
    While the cross-sectional database ultimately aims to achieve balance across race and
    ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
    balanced across these parameters, and because enrollment is ongoing the periodic
    updates to data releases may not have achieved balanced distribution across groups.
  mitigation_strategy: >-
    Recruitment proceeds in waves whose composition and size are adjusted by under- and
    oversampling groups as the observed participation characteristics are monitored, and
    uniform data collection protocols were implemented for all subjects irrespective of
    race and ethnicity, biological sex or diabetes severity across all study sites, with
    the site selection intended to minimize the potential for sampling bias.
- name: Under-recruitment of populations bearing higher disease burden
  bias_type: historical_bias
  bias_description: >-
    Recruiting Black men into health research is more difficult than recruiting other
    populations, yet this population represents a disproportionate share of the burden in
    type 2 diabetes; factors such as medical mistrust and fear for safety stem from
    historical events such as the Tuskegee syphilis study. Comparable trends for
    under-recruitment and disease burden have been reported for Hispanic and Asian
    persons.
  mitigation_strategy: >-
    If sample balancing on race and ethnicity emerges as a challenge, new recruitment
    strategies will be implemented; published strategies for encouraging participation
    include tailoring printed materials and using a personalized, participatory approach
    to recruitment.

known_limitations:
- name: English-language requirement restricts who can enroll
  limitation_type: representativeness_limitation
  limitation_description: >-
    Participants are required to speak, read and understand English. The protocol notes
    that this may have created challenges in recruiting Hispanic and Asian persons, and
    the IRB protocol records that non-English speaking participants will not initially be
    enrolled because enrolling them would require translating all study materials rather
    than the consent form alone.
  recommended_mitigation: >-
    The IRB protocol records that an NIH supplement was submitted to fund translation of
    all study materials, that native Spanish-speaking research staff at the University of
    California, San Diego can provide interpretation and instructions, and that the
    consent form will be translated into Spanish by UCSD translation services if
    recruitment goals for Hispanic participants are not met.
- name: Finite biorepository samples
  limitation_type: scope_limitation
  limitation_description: >-
    A limitation of the biorepository is that there are a finite number of samples to
    share with scientists interested in using them in research.
  recommended_mitigation: >-
    Procedures for reviewing and prioritizing written requests will be developed before
    the biorepository is complete.
- name: No labels or predefined tasks
  limitation_type: scope_limitation
  limitation_description: >-
    No explicit label or target is associated with any data instance, and no labeling was
    performed, because the dataset is hypothesis-agnostic and aimed at facilitating
    multiple potential downstream applications. No human-level performance figures are
    available for the applications the dataset is meant to address, and the project has
    no formal guidelines for researchers creating new labels or defining new tasks.
  scope_impact: >-
    Users intending supervised learning must define and derive their own labels.
- name: Incomplete modality coverage across participants
  limitation_type: coverage_limitation
  limitation_description: >-
    Not all modalities are available for all participants, because some participants
    elected not to take part in some study elements, some devices returned no stored
    results or were returned too late, and some data was lost.
- name: Device and site heterogeneity constrains model generalization
  limitation_type: methodological_limitation
  limitation_description: >-
    Factors that might limit the generalization of derived models include the number and
    diversity of devices included, recording specificities such as the particular scan
    modality used, the number and diversity of recording sites, and distribution shifts
    over time. Recruitment is predominantly urban and hospital-based.
  recommended_mitigation: >-
    Information on device make and model, including specific modalities such as macula
    scans or wide scans during optical coherence tomography, was documented to ensure
    repeatability, and the study deliberately included multiple devices for one measure
    to enhance generalizability and represent the range of equipment used in clinical
    settings.
- name: Cross-sectional design with limited longitudinal follow-up
  limitation_type: temporal_limitation
  limitation_description: >-
    The study is cross-sectional, with only one visit per participant in the current
    data. Approximately 4% to 10% of participants are expected to undergo a follow-up
    examination in year 4, and the follow-up visit will not collect all variables owing
    to budget constraints.
- name: Snellen visual acuity variables withdrawn in this version
  limitation_type: coverage_limitation
  limitation_description: >-
    The data fields and types are largely the same as in the previous version, but the
    Snellen visual acuity variables were dropped in version 3.0.0, so only logMAR visual
    acuity measurements are available.

confidential_elements:
- name: No confidential data in the dataset
  confidential_elements_present: false
  confidentiality_details: >-
    The dataset does not contain data that might be considered confidential, and no
    personally identifiable information is included.

content_warnings:
- name: No offensive or distressing content
  content_warnings_present: false
  description: >-
    The healthsheet records that the dataset contains no data that, if viewed directly,
    might be offensive, insulting, threatening or otherwise pose a safety risk.

subpopulations:
- name: Demographic subgroups withheld from the public release
  subpopulation_elements_present: false
  identification: >-
    The dataset does not identify demographic sub-populations. Sex, race and ethnicity
    are not released with the public version of the dataset; they are held under
    controlled access. No regulation prevents demographic data collection in the study.
  distribution: >-
    Race, ethnicity, sex and diabetes status are collected and are used to balance the
    recommended data splits, and their aggregate distribution across those splits is
    published in the dataset README: 380 Hispanic, 545 Asian, 519 Black and 836 White
    participants; 951 male and 1329 female; and by diabetes status 776 with no diabetes,
    560 lifestyle controlled, 686 oral medication controlled and 258 insulin controlled,
    with a mean age of 60.8 years and a standard deviation of 11.3.

sensitive_elements:
- name: Sensitive elements held under controlled access
  sensitive_elements_present: true
  sensitivity_details: >-
    The public dataset does not contain data considered sensitive. The controlled access
    dataset contains data on racial and ethnic origins, location in the form of a
    five-digit zip code, genetic sequencing data, past health records, medications, and
    motor vehicle accident and traffic reports. The RO-Crate additionally lists electronic
    health record data, wearable monitoring, electrocardiography, environmental sensor,
    continuous glucose monitor and wearable accelerometer data among the personal and
    sensitive information categories the dataset covers.

acquisition_methods:
- name: Direct observation, subject report and verification at the study visit
  was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: >-
    Acquisition varied by domain. Some data were directly observable, such as laboratory
    results, vitals and retinal imaging, while other data were reported by subjects, such
    as survey responses. Verification of data entry was performed where possible, for
    example by cross-referencing entered medications against medications physically
    brought in or photographed by the participant. All participant images are exported
    from the imaging devices in their raw format, and some required conversion to DICOM
    before upload.

collection_mechanisms:
- name: REDCap for participant-reported and clinical visit data
  mechanism_details: >-
    REDCap is used to collect participant-reported questionnaire data and the following
    clinical data from the visit: medications assessment, vitals, visual acuity, contrast
    sensitivity, monofilament test results and complete blood count results. Questionnaires
    may be completed electronically before or after the in-person visit, or on paper.
- name: Clinical instruments at the study visit
  mechanism_details: >-
    A 12-lead electrocardiogram is recorded on a Philips PageWriter TC30 Cardiograph with
    the participant's position noted relative to supine. Blood pressure and heart rate are
    measured twice, two minutes apart, with an automatic oscillometric device; devices in
    use across sites include the OMRON HEM 907XL, Medline MDS4001 and Welch Allyn 6000
    series monitors. Peripheral neuropathy is assessed with a standard 10 g monofilament
    at three locations on each foot. Cognitive screening uses the Montreal Cognitive
    Assessment administered on an iPad through the MoCA Duo application. Visual acuity is
    measured with an M&S Technologies Electronic Visual Acuity tester at four meters under
    photopic and, using a 2.0 neutral density filter, mesopic conditions; letter contrast
    sensitivity uses the Mars chart under the same two conditions; autorefraction uses a
    Topcon KR 800. Lensometers in use across sites are the NIDEK LM-600P and the Topcon
    CL-200 and CL-300.
- name: Retinal imaging devices
  mechanism_details: >-
    Retinal imaging captures both eyes on each participant across multiple devices chosen
    for their different but partially overlapping modalities: the Optomed Aurora IQ
    handheld non-mydriatic fundus camera (undilated), the iCare EIDON widefield truecolor
    confocal fundus system, the Heidelberg Spectralis HRA optical coherence tomography and
    angiography system, the Topcon Maestro2 3D OCT-1, the Topcon Triton DRI OCT, the Carl
    Zeiss Meditec Cirrus 5000, and Heidelberg fluorescence lifetime imaging
    ophthalmoscopy. All retinal images are collected under dilated conditions except those
    from the Optomed device. Files exported in the proprietary .fda and .sdt formats are
    converted to DICOM for the dataset.
- name: At-home wearable and environmental monitoring
  mechanism_details: >-
    At the end of the in-person visit participants are sent home with three devices to use
    continuously for 10 days: a custom-designed home environmental sensor (the LeeLab
    Anura, built at the Karalis Johnson Retina Center, University of Washington), a Garmin
    Vivosmart 5 physical activity monitor, and a Dexcom G6 continuous glucose monitor.
    Participants are masked to the continuous glucose monitor results during the
    monitoring period. Devices are returned by overnight mail or in person, together with
    a data sheet recording which wrist the tracker was worn on, the participant's dominant
    hand, and where the environmental sensor was placed. The environmental sensor and
    fitness tracker were chosen with participant privacy as a primary concern: they capture
    no video or audio, have no GPS location monitoring, and are not synced with
    participant-owned devices. Garmin data are exported in .FIT format and converted to the
    mHealth standard for the dataset.
- name: Biospecimen collection and central laboratory testing
  mechanism_details: >-
    Non-fasting blood and urine are collected during the visit; the BMJ Open protocol
    states 53 mL of blood and the IRB protocol states approximately 50 to 60 mL. One EDTA
    vacutainer goes to a local Clinical Laboratory Improvement Amendments-certified
    laboratory for complete blood count analysis on fresh whole blood. All other assays
    are run by the University of Washington Nutrition and Obesity Research Center on
    stored frozen samples, which are held locally at -70 degrees Celsius and batch-shipped
    on dry ice roughly quarterly. Plasma, serum and buffy coats are processed locally on
    the day of collection and batch-shipped to the University of Alabama at Birmingham
    Center for Clinical and Translational Science for the study-wide biobank, where
    genomic DNA is extracted from stored buffy coats. Peripheral blood mononuclear cell
    preparation tubes are pre-centrifuged locally and processed centrally at UAB, and
    PAXgene RNA vacutainers, stable for up to 72 hours, are shipped overnight from the
    Seattle and San Diego sites to UAB.
- name: Electronic health record screening and record extraction
  mechanism_details: >-
    Recruitment pools are identified by screening electronic health records at each site
    for ICD-10 diagnosis codes — R73.09 for prediabetes and E11.X for type 2 diabetes —
    among patients aged 40 or older with an encounter at the health system. The IRB
    protocol records that medical records are also extracted for data on general health,
    eye health, medical and surgical history, diabetes, medications, laboratory records
    and previous imaging, and that driving and accident records are obtained from the
    Department of Licensing.

sampling_strategies:
- name: Triple-balanced non-probability recruitment from health system populations
  is_sample: true
  is_random: false
  source_data: >-
    The study base is all patients aged 40 years or older who had a medical encounter
    within each of the three health system sites — the University of Alabama at
    Birmingham, the University of California San Diego and the University of Washington —
    between 2020 and 2025.
  strategies: >-
    Stratified, non-probability sampling. Rather than targeting the demographic
    distribution of the US population, the study recruits in equal proportions across
    four race and ethnicity groups (Asian, Black, White, Hispanic), four categories of
    type 2 diabetes (no diabetes; prediabetes or lifestyle-controlled; controlled by oral
    or non-insulin injectable medications; insulin-controlled) and biological males and
    females. Recruitment proceeds in waves; for each wave a contact pool is identified by
    electronic health record screening, and the University of Alabama at Birmingham
    selects a stratified sample from the combined three-site pool. Composition is
    monitored as recruitment progresses and adjusted by under- and oversampling groups.
    Sites concentrate on different groups according to local demographics: Seattle on
    Asian, then Hispanic, then Black participants; San Diego on Hispanic, then Asian, then
    Black; Birmingham on Black, then Hispanic, then Asian. All sites recruit White
    participants, and all race and ethnicity information is self-reported at screening and
    enrollment. The FAIRhub study description records the sampling method as
    "Non-Probability Sample".
  is_representative: false
  why_not_representative: >-
    The cohort is deliberately balanced rather than demographically representative, and it
    does not include other races and ethnicities such as Pacific Islanders and Native
    Americans. Recruitment is predominantly urban and hospital-based, which may not fully
    capture diverse cultural and socioeconomic backgrounds, and participants are
    volunteers.
  source_caveats: >-
    The healthsheet answers the question of whether the dataset is a sample by stating
    that "The dataset contains all possible instances", meaning all participants enrolled
    to the release cut-off, while the same source records the study's sampling method as
    non-probability sampling from the health system study base. Both statements are
    represented here: the released dataset withholds no enrolled participant, and the
    enrolled participants are a stratified, non-probability sample of the study base.

data_collectors:
- name: AI-READI study team
  role: study team
  collector_details: >-
    Data were collected by AI-READI team members at the three sites. All research
    personnel who recruited, enrolled and collected data underwent training by the data
    manager at the University of Alabama at Birmingham and worked from a detailed Manual
    of Procedures. Coordinators must complete a certification process, including mandatory
    institutional compliance training for human subject research, and must successfully
    administer all protocol elements to at least three volunteer practice subjects to the
    standards in the Manual of Procedures before enrolling and testing participants. Data
    managers at each site oversee the process and are responsible for quality control of
    all data before upload. Preliminary pilot enrollment ran from 18 July 2023 to 30
    November 2023 to secure sufficient familiarity for all coordinators, with formal data
    collection beginning 1 December 2023. Team members' effort was supported by NIH award
    OT2OD032644 in proportion to the percentage of effort contributed, with salaries
    aligned to the funding guidelines at each site. The IRB protocol additionally lists
    software engineers, cloud engineers, database managers, research and data scientists
    and domain experts among the roles supporting collection, curation and processing.
- name: Study participants
  role: study participants
  collector_details: >-
    Data were collected directly from participants across the three recruiting sites
    rather than obtained from third parties, other than the electronic health record and
    driving record extractions. Participants self-reported survey responses and operated
    the at-home monitoring devices. Study subjects received compensation of $200 for the
    study visit through the grant funding.

collection_timeframes:
- name: Collection period covered by version 3.0.0
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: >-
    Version 3.0.0 contains data collected between July 19, 2023 and May 1, 2025, which is
    data collected through the end of the second year of the study. The collection
    timeframe matches the creation timeframe of the data associated with the instances.
- name: Overall project timeline
  timeframe_details: >-
    The project timeline spans four years: one year dedicated to protocol development and
    training, with years 2 to 4 allocated to subject recruitment and data collection. The
    FAIRhub study description gives an actual start date of 2023-07-19 and an anticipated
    completion date of 2027-01-01, and reports the study status as "Enrolling by
    invitation". The BMJ Open protocol states that enrolment began on 18 July 2023 and
    will continue until 30 November 2026. Approximately 4% of participants are expected to
    undergo a follow-up examination in year 4.
  source_caveats: >-
    The BMJ Open protocol (tier 3) gives the enrolment start as 18 July 2023 and the end
    of recruitment as 30 November 2026, while the FAIRhub study description (tier 1) gives
    an actual start of 2023-07-19 and an anticipated completion of 2027-01-01. The
    tier-1 dates are the ones this record states.

direct_collection:
- name: Direct collection from participants
  is_direct: true
  collection_details: >-
    The data were collected directly from participants across the three recruiting sites.
    Recruitment pools were identified by screening electronic health records for diabetes
    and prediabetes ICD-10 codes among patients who had had an encounter with the sites'
    health systems.

collection_notifications:
- name: Participants aware of active collection
  notification_details: >-
    Each individual was aware of the data collection, as this was not passive collection
    or secondary use of existing data but active collection directly from participants.
    Individuals identified by record screening are sent a personalized hardcopy invitation
    letter and an invitation email directing them into an online REDCap recruitment
    interface, where they can read an overview of the research program, expectations for
    participation and answers to frequently asked questions, and can download the informed
    consent document, request a call back, complete a screening survey and enroll.
    Approximately 50,000 invitation letters from each site were planned to be sent by mail
    and email over the more than three years of recruitment.

collection_consents:
- name: Written informed consent before any protocol element
  consent_details: >-
    Informed consent to participate was required before participation in any part of the
    protocol, including questionnaires. Written informed consent is provided by all
    participants. Potential participants may read all consent documentation
    electronically and consent with an electronic signature without verbal communication
    with a clinical research coordinator, accessing the documentation in REDCap through a
    unique code and deciding at that point whether to participate or seek more
    information; those who do not consent electronically are consented in person at the
    start of the visit. In-person consent is obtained in a private room by a study team
    member with the opportunity to ask questions before signing. The approved consent form
    for the principal project site, the University of Washington, is published in the
    dataset documentation, and the other clinical sites had IRB reliance and used the same
    form with minor institution-specific language.

consent_revocations:
- name: Withdrawal at any time, without retraction of data already shared
  revocation_details: >-
    Participants were permitted to withdraw consent at any time and cease study
    participation. However, any data that had been shared or used up to that point would
    stay in the dataset. This is clearly communicated in the consent document.

missing_data_documentation:
- name: Missing modalities and survey items
  missing_data_patterns: >-
    Not all modalities are available for all participants, and survey data contain skipped
    questions and incomplete responses. Missing data occurs at the level of a whole
    modality for a participant as well as at the level of individual survey items.
  missing_data_causes: >-
    Some participants elected not to participate in some study elements. In a few cases
    the data collection device did not have any stored results or was returned too late to
    retrieve the results, for example because the battery died or the data was lost. In a
    few cases a data collision occurred at some point in the process and data has been
    lost. Imaging modalities may be skipped where quality issues arise with
    operator-dependent devices.
  handling_strategy: >-
    Missing data that could be directly filled from other portions of an individual's
    record was filled during data cleaning, under the guidance and approval of the site
    principal investigator; where there was no logical or appropriate way to correct the
    data, the site principal investigator reviewed the values and decided whether they
    should be removed. No imputation protocol is described.

raw_data_sources:
- name: Device-native and instrument-native raw data
  source_description: >-
    Raw data are exported from the collection instruments in their native formats before
    any standardization: electrocardiograms as .xml, MoCA Duo application output as .csv
    covering total score, section subscores, the Memory Index Score and task completion
    times, retinal images in DICOM or in the proprietary .fda and .sdt formats depending
    on the device, continuous glucose monitor readings as .csv, Garmin activity data as
    .FIT, environmental sensor readings as .csv, and blood and urine testing results from
    the University of Washington Nutrition and Obesity Research Center laboratory as .csv.
    Participant-reported and visit clinical data originate in REDCap, and screening and
    medical history data originate in each site's electronic health record.
  source_type: instrument and device exports, REDCap, electronic health records
  raw_data_format: XML, CSV, DICOM, FDA, SDT, FIT
  access_details: >-
    The raw data is saved and expected to be preserved by the project at least for the
    duration of the project, but is not anticipated to be shared outside the project team
    at present, because it has not been mapped to standardized terminologies and because
    it may accidentally include personal health information or personally identifiable
    information, for example in free text fields. There is a possibility that raw data may
    be included in future releases of the controlled access dataset.

raw_sources:
- name: Retained raw data, not currently distributed
  raw_data_details: >-
    The raw data, after de-identification, is saved in addition to the preprocessed and
    cleaned data and is expected to be preserved by the AI-READI project at least for the
    duration of the project. It is not anticipated to be shared outside the project team
    at present, because it has not been mapped to standardized terminologies and because
    it may accidentally include personal health information or personally identifiable
    information. There is a possibility that raw data may be included in future releases
    of the controlled access dataset, so no access point for it is published.

preprocessing_strategies:
- name: Mapping to standardized terminologies and formats
  preprocessing_details: >-
    Once data were sent from each study site to the central project team, additional
    processing steps were conducted in preparation for dissemination. All data were mapped
    to standardized terminologies where possible, such as the Observational Medical
    Outcomes Partnership Common Data Model for observational health data and the Digital
    Imaging and Communications in Medicine standard for medical imaging. Details of the
    processing approaches for each data domain and modality are given in the dataset
    documentation.
- name: Conversion of proprietary device formats
  preprocessing_details: >-
    For some devices the data are transformed from a proprietary state into a standard
    model format before upload to FAIRhub. Topcon Maestro2 and Triton images are exported
    in .fda format and converted to DICOM for the dataset, Heidelberg fluorescence
    lifetime imaging output is exported in .sdt format and converted to DICOM, and Garmin
    activity data are exported in .FIT format and converted to the mHealth standard.
- name: Organization to the Clinical Dataset Structure specification
  preprocessing_details: >-
    The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1
    specification. Data are organized at the root level into one directory per datatype;
    within each datatype directory there is one directory per modality, within each
    modality directory one per device used to collect it, and within each device directory
    one per participant, named after the participant's study ID number. Each datatype,
    modality and device directory is named with a name that best defines it, and each
    datatype directory carries a manifest.tsv metadata file based on the CDS
    specification. The Clinical Dataset Structure was developed as part of the project as
    a simple way to organize clinical research datasets and include structured metadata.
- name: Removal of protected health information and demographic fields for public release
  preprocessing_details: >-
    The released dataset contains no protected health information. Information related to
    the sex and race or ethnicity of participants, as well as medications used, has been
    removed from the public release. The Nature Metabolism comment states that the public
    set is stripped of protected health information as defined by the HIPAA Privacy Rule
    via the Safe Harbor method, as well as of sex and race/ethnicity information, to
    prevent stigmatization of findings.
  source_caveats: >-
    The healthsheet's preprocessing question on de-identification is present but
    unanswered in the bundle, so the account here is drawn from the dataset README, the
    FAIRhub dataset description and the Nature Metabolism comment rather than from that
    answer.

cleaning_strategies:
- name: Quality control at data entry and acquisition
  cleaning_details: >-
    Several quality control measures were used at the time of data entry and acquisition.
    Clinical data outside expected minimum and maximum ranges were flagged in REDCap and
    were visible in reports viewed by clinical research coordinators and data managers.
    Using those reports as guides, data managers and coordinators examined participant
    records and determined whether an error was likely. Data were checked, and edited if
    errors were detected, for credibility based on range checks that determine whether all
    responses fall within a prespecified reasonable range; for incorrect flow through
    prescribed skip patterns; for missing data that can be directly filled from other
    portions of an individual's record; and for the omission or duplication of records.
    Editing was done only under the guidance and approval of the site principal
    investigator: where corrected data were available elsewhere in the respondent's
    answers the error was corrected, and where there was no logical or appropriate way to
    correct the data the site principal investigator reviewed the values and decided
    whether they should be removed.
- name: No exclusion of instances at preprocessing
  cleaning_details: >-
    No data were excluded from the dataset at the time of preprocessing. Restrictions on
    who appears in the dataset arise from the study eligibility criteria rather than from
    preprocessing: participants must be able to provide consent, be at least 40 years old,
    be persons with or without type 2 diabetes, and speak and read English; and must not
    be pregnant, have gestational diabetes or have type 1 diabetes. The FAIRhub study
    description additionally records a maximum age of 85 years, with adults older than 85
    listed among the exclusion criteria.

intended_uses:
- name: Artificial intelligence and machine learning research on type 2 diabetes
  use_category: research
  description: >-
    The dataset is intended for AI and machine learning research into type 2 diabetes
    mellitus, including salutogenic pathways to return to health, and is described as
    optimized for downstream AI/ML research and made publicly available.
  examples:
  - reconstructing a temporal atlas of type 2 diabetes development and reversal towards
    health
  - defining disease trajectories and underlying genetic links across racial and ethnic
    cohorts
  - multimodal model development across survey, clinical, imaging, waveform and wearable
    modalities
  usage_notes: >-
    All data are stored and shared through FAIRhub as AI-ready, which the protocol
    describes as enabling immediate AI/ML research without reformatting and preprocessing.
    Access to the public version requires agreeing to use the data only for type 2
    diabetes related research.
- name: Pseudotime manifold analysis
  use_category: research
  description: >-
    Data collection was specifically designed to permit downstream pseudotime manifold
    analysis, an approach used to predict disease trajectories by collecting and learning
    from complex, multimodal data from participants with differing disease severity,
    ranging from normal to insulin-dependent type 2 diabetes.
- name: A model for future AI-ready data generation projects
  use_category: methodological and standards development
  description: >-
    The project's blueprint for collecting and sharing AI-ready datasets is intended for
    reuse by future data generation projects, including guidelines for project management
    and for data collection, management and sharing, and standards developed as part of
    the project such as the Clinical Dataset Structure.

prohibited_uses:
- name: Clinical treatment decisions
  prohibition_reason: >-
    The license states that the licensee shall not make clinical treatment decisions based
    on the data, as it is intended solely as a research resource.
- name: Re-identification or contacting data subjects
  prohibition_reason: >-
    The license states that the licensee shall not use or attempt to use the data, alone
    or in concert with other information, to compromise or otherwise infringe the
    confidentiality of information about an individual who is the source of any data, to
    invade or compromise the privacy of any data subject, to attempt to identify or
    contact any data subject or group of data subjects, to extract or extrapolate any
    identifying information about a data subject, to establish a data subject's membership
    in a particular group of persons, or otherwise to cause harm or injury to any data
    subject.
- name: Sharing data with third-party model vendors for training
  prohibition_reason: >-
    The license states that the licensee shall not share or distribute data with any third
    party model vendor or developer for training or development purposes, even if that
    vendor is party to a HIPAA business associate agreement with the licensee's
    institution, where training includes model weight modification and other adjustments
    to a model's logic or operation. A third party model may be used to analyze the data
    if the vendor is party to such an agreement and the model's interaction with the data
    is limited to short-term interaction such as prompting or querying rather than
    training.
- name: Transfer or sublicensing outside the licensed group
  prohibition_reason: >-
    The license states that the licensee shall not transfer, license, sublicense, sell,
    assign, display, share or otherwise convey any portion of the data or any derivative
    work to any third party other than another licensee bound by an agreement with the
    licensor on identical terms, in which case access may be given for the purpose of
    collaborating on projects involving the data.
- name: Bulk reproduction of data in publications
  prohibition_reason: >-
    The license states that data may not be reproduced in papers, articles, presentations,
    analyses, reports or publications, except that small representative samples may be
    reproduced in up to five images or figures per paper for illustrative purposes only,
    and that larger amounts shall not be published, posted or made available via
    supplemental files, zip archives, code packages or other means, notwithstanding journal
    or conference requirements.
- name: Use of the public version for research unrelated to type 2 diabetes
  prohibition_reason: >-
    Accessing the dataset requires agreeing to use the data only for type 2 diabetes
    related research. The FAIRhub consent metadata records that the public version of the
    dataset can only be used for type 2 diabetes related research, while a private version
    will allow more generic use.
- name: Removing or obscuring watermarking
  prohibition_reason: >-
    The license states that the data may be statically watermarked to identify the licensee
    for security purposes, and that the licensee will take no action to remove, obscure,
    alter or mask such watermarking.
- name: Storage outside approved institutional or covered cloud environments
  prohibition_reason: >-
    The license permits use and storage of the data only on servers and devices maintained
    by and located within the licensee's institution or employer, or on cloud or remote
    storage and backup services that have a HIPAA-approved business associate agreement in
    place with that institution or employer.

future_use_impacts:
- name: Theoretical re-identification risk
  impact_details: >-
    The project does not currently anticipate uses of the dataset that could result in
    unfair treatment or harm, to the extent of its knowledge. There is, however, a
    theoretical risk of future re-identification, which the project addresses through a
    robust data dissemination system, a strict license agreement and data watermarking for
    both the public and controlled sets, motivated by the observation that AI algorithms
    can infer individual patient characteristics and could facilitate individual-level
    identification.

