source_caveats: >-
  Sources in the declared bundle disagree on several points, and the input manifest's
  source_priority ranking was used to decide where it could.
  (1) Expanded name of the project: the BMJ Open protocol (tier 3) writes "Artificial
  Intelligence Ready and Equitable Atlas for Diabetes Insights", while the FAIRhub
  API metadata, the dataset README, the healthsheet, the RO-Crate and the NIH
  RePORTER page all write "Exploratory" in place of "Equitable". The tier-1 FAIRhub
  API value was preferred; the FAIRhub study description gives the official title as
  "AI Ready and Exploratory Atlas for Diabetes Insights".
  (2) Target enrollment: the UW IRB protocol (tier 2) states 4600 participants, while
  the FAIRhub study description (tier 1) gives an anticipated enrollment of 4000 and
  the BMJ Open protocol, the Nature Metabolism comment and NIH RePORTER all state
  4000. The tier-1 value of 4000 was preferred and is what this record states.
  (3) Enrollment start: the BMJ Open protocol (tier 3) gives 18 July 2023; the FAIRhub
  study description and healthsheet (tier 1) give 2023-07-19. The tier-1 date was
  preferred.
  (4) De-identification: the FAIRhub API metadata (tier 1) records deIdentType
  "NoDeIdentification" with the explanation that no identifiers were collected so no
  active de-identification was necessary, while the Nature Metabolism comment (tier 3)
  states the public set is stripped of protected health information via the HIPAA
  Safe Harbor method. The tier-1 statement is recorded in is_deidentified and the
  tier-3 statement is recorded alongside it rather than discarded.
  (5) Principal investigator affiliation: two tier-1 sources disagree and the ranking
  cannot decide between them, so both are represented. The FAIRhub API metadata gives
  Aaron Lee's affiliation, the responsible party, the lead sponsor and the central
  contact as Washington University in St. Louis (ROR 01yc7t268); the RO-Crate gives
  the principal investigator as "Aaron Lee, Department of Ophthalmology, University of
  Washington", and NIH RePORTER (tier 4) gives the awardee organization as University
  of Washington. Both organizations are listed as affiliations on his creator entry;
  the schema does not inline the principal_investigator reference, so that slot carries
  his ORCID and the descriptive detail sits on the creator entry naming him.
  (6) Publisher: the FAIRhub API metadata names the publisher as "FAIRhub" while the
  RO-Crate names it as "AI-READI Consortium". Both are tier 1, so the ranking cannot
  decide; because the publisher slot admits a single value, it is left unpopulated
  rather than resolved by choice.
  (7) Reviewing body for the IRB approval: the RO-Crate names the IRB organization
  "Washington University IRB" but gives its address, contact and reliance team as the
  University of Washington Human Subjects Division, and the BMJ Open protocol, the
  healthsheet and the IRB protocol document all name the University of Washington IRB.
  Both readings are recorded on the ethical review entry.
  Two further observations about the evidence, neither a disagreement.
  The FAIRhub record for version 2.0.0 is also in the bundle and reports 2.01 TB across
  165,051 files; those are the figures for the superseded 2.0.0 release, not a
  contradiction of the 3.0.0 figures this record states, and the FAIRhub page marks
  that version no longer accessible.
  Summing the nine datatype directories in the FAIRhub dataset structure metadata gives
  356,334 files and 3,815,969,360,064 bytes, which is 9 files and 419,614 bytes short
  of the declared totals of 356,343 files and 3,815,969,779,678 bytes; the bundle does
  not say what the remainder is, and no attribution has been invented.
  The bundle records a child FAIRhub dataset (id 4), described on the version 3.0.0
  page only as "A smaller version is available for pipeline development", but states
  no DOI or URL for it, so no related_datasets entry was created.
  The clinical laboratory test table in the BMJ Open protocol (Table 2) did not survive
  PDF-to-text extraction with its columns aligned — test names, units, reference ranges
  and rationales appear as separate runs — so per-test variable metadata was not
  transcribed, and only variables stated unambiguously in prose were recorded.
  The healthsheet answer to the composition question on sampling states that the dataset
  "contains data from all participants who have been enrolled during the first year of
  data collection", which is inconsistent with the same document's statement that this
  version covers July 19, 2023 to May 1, 2025; the answer appears to have been carried
  over from an earlier version of the healthsheet.
  Identifiers minted in this record are fragments on the dataset's own DOI CURIE and
  name file collections, recommended splits and distribution formats — parts of this
  dataset with no referent outside this record. Identifiers naming anything outside the
  dataset (people, organizations, grants) are taken from the bundle or omitted.

purposes:
- name: Enable AI/ML research into type 2 diabetes salutogenesis
  response: >-
    The purpose for creating the dataset was to enable future generations of artificial
    intelligence and machine learning research to provide critical insights into type 2
    diabetes mellitus, including salutogenic pathways to return to health. Type 2
    diabetes is a growing public health threat, yet current understanding of it —
    especially in the context of salutogenesis — is limited. Given the complexity of the
    disease, AI-based approaches may help improve that understanding, but a key issue is
    the lack of data ready for training AI models; the AI-READI dataset is intended to
    fill that gap.
- name: Build a foundational, hypothesis-agnostic temporal atlas of T2DM
  response: >-
    The long-term objective is to develop a foundational dataset in type 2 diabetes
    mellitus, agnostic to existing classification criteria or biases, which can be used
    to reconstruct a temporal atlas of the disease's development and its reversal
    towards health. Data collection was specifically designed to permit downstream
    pseudotime manifold analysis, an approach used to predict disease trajectories by
    learning from complex multimodal data drawn from participants across a range of
    disease severity, from normal to insulin-dependent type 2 diabetes.
- name: Serve as a model for future AI-ready data generation projects
  response: >-
    AI-READI places emphasis on establishing standards, best practices and guidelines
    for the collection, preparation and sharing of data for AI and machine learning
    purposes, following the Findable, Accessible, Interoperable and Reusable principles,
    so that the approach can be used as a model for future efforts to build other
    medical and health datasets targeted at AI/ML. A stated aim of the project is to
    share this blueprint with other data generation projects, including guidelines for
    project management and for data collection, management and sharing.

tasks:
- name: Pseudotime manifold analysis of disease trajectories
  response: >-
    The multimodal dataset was gathered to facilitate downstream pseudotime manifold
    analysis, an approach previously used in developmental biology to identify
    differentiation pathways from complex single-cell gene expression data and extended
    here to define disease trajectories from multimodal data collected across differing
    disease severity. The approach relies on dimensionality reduction and is agnostic to
    existing classification criteria.
- name: Development of multimodal AI/ML models for type 2 diabetes
  response: >-
    The dataset is intended to support the development of artificial intelligence and
    machine learning algorithms aimed at defining disease trajectories and underlying
    genetic links across racial and ethnic cohorts, and more generally to support
    multimodal model development that may improve understanding of a complex,
    multifactorial and multisystemic disease.
- name: Training and evaluation using the recommended balanced data splits
  response: >-
    Version 3.0.0 supplies a recommended split of the 2280 participants into training,
    validation and testing sets in 70/15/15 proportions, with the validation and test
    sets balanced as far as possible for sex, race and ethnicity, and diabetes status.
    The split is distributed in the participants.tsv file included with the dataset and
    is intended to reduce disparities in models developed from the data, given that sex,
    race and ethnicity are not released with the public version.

addressing_gaps:
- name: Absence of AI-ready multimodal datasets for type 2 diabetes
  response: >-
    The ability to understand and affect the course of complex, multi-organ diseases
    such as type 2 diabetes mellitus has been limited by a lack of well-designed, high
    quality, large and inclusive multimodal datasets. A major barrier to applying AI to
    the disease has been the absence of diverse datasets that are AI-ready for training
    models, and the project was designed to address it.
- name: Under-representation of racialized groups in type 2 diabetes research
  response: >-
    A meta-epidemiological review of type 2 diabetes studies published from 2000 to 2020
    found that samples lacked racial and ethnic diversity, while the prevalence of the
    disease and the severity of its consequences are higher in certain racial and ethnic
    populations. The cohort is designed to be approximately balanced across four
    race/ethnic groups rather than reflecting the demographic distribution of the US
    population, which the protocol describes as a demographic improvement over many
    previous epidemiological studies and clinical trials.
- name: Limits of claims and electronic health record data for AI/ML analysis
  response: >-
    The data acquisition protocol spans multiple domains — survey data, physical
    measurements, clinical data, imaging data and wearable device data — specifically to
    enable downstream AI and machine learning analyses that may not be feasible with
    existing data sources such as claims or electronic health records data.
- name: Difficulty of preparing and sharing AI-ready datasets
  response: >-
    Preparing and sharing AI-ready datasets can become time consuming and difficult for
    data-collecting researchers. To address this the project is developing FAIRhub, a
    cloud-based data management, curation and sharing platform with user interfaces and
    tooling intended to simplify and automate the implementation of its AI-readiness
    guidelines, with the intention of making the platform available to future data
    generation projects.

