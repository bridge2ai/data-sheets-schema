  name: Recommended training split
  description: >-
    The training portion of the recommended split for version 3.0.0, comprising 1576
    participants. Its published composition is 204 Hispanic, 369 Asian, 343 Black and
    660 White participants; 599 male and 977 female; and by diabetes status 600 with no
    diabetes, 384 lifestyle controlled, 487 oral medication controlled and 105 insulin
    controlled. Mean age is 61.1 years with a standard deviation of 11.3.
