instances:
- name: Participant record
  instance_type: individual study participant
  description: >-
    Each instance represents an individual patient. An instance consists of all of the
    data available for that individual, spanning survey data, clinical data, retinal
    imaging data, environmental sensor data, continuous glucose monitor data and wearable
    activity monitor data, which together encompass tabular data, imaging data and
    physiological signal or waveform data. There is no unstructured text data in the
    dataset. There is currently only one visit per participant.
  data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D003924
  counts: 2280
  label: false
  notes: >-
    No labels or targets are associated with the instances. The dataset is
    hypothesis-agnostic and aimed at facilitating multiple potential downstream AI and
    machine learning applications, so no labeling was performed and no gold-standard or
    proxy label definitions apply.
  missing_information:
  - name: Modalities absent for some participants
    missing:
    - one or more data modalities for a given participant
    - survey responses to skipped or incomplete questions
    - wearable device readings where the device returned no data
    why_missing:
    - some participants elected not to participate in some study elements
    - the data collection device did not have any stored results, or was returned too
      late to retrieve the results, for example because the battery died or the data was
      lost
    - a data collision occurred at some point in the process and data was lost

relationships:
- name: Shared project membership, one visit per participant
  relationship_details: >-
    All instances are part of the same prospective data generation project, AI-READI.
    There is currently only one visit per participant, so instances do not group into
    repeated visits. A subgroup of approximately 10% of participants recruited in the
    first two years is planned to be invited back for a follow-up visit in year 4 of the
    project, which would introduce longitudinal structure in a future release.

splits:
- name: Recommended training, validation and test split for version 3.0.0
  split_details: >-
    Version 3.0.0 comes with a recommended split of the 2280 participants into training,
    validation and testing sets in 70/15/15 proportions — 1576, 352 and 352 participants
    respectively — distributed in the participants.tsv file included with the dataset.
    Because sex, race and ethnicity are not released with the public version, the project
    team prepared the split so that the validation and test sets are balanced as well as
    possible for sex, race and ethnicity, and diabetes status across the four study
    groups (no diabetes; prediabetes or lifestyle-controlled; oral medication
    controlled; insulin controlled). The rationale given is to reduce disparities in
    models developed from the dataset when demographic labels are unavailable. This
    recommended split is new in version 3.0.0; the dataset introduces no new tasks or
    labeling.

