source_caveats: >-
  The record describes the adult Bridge2AI-Voice dataset, identified by the
  version-independent DOI 10.13026/37yb-1t42 that PhysioNet labels "DOI (latest
  version)" on every release page in the bundle, with release 3.1.0 as the current
  release. The bundle also contains the PhysioNet pages for releases 1.1 and 3.0.0
  and a page for the separate pediatric project; historical values from 1.1 and
  3.0.0 are recorded only where their release scope is stated explicitly, and the
  pediatric dataset is carried in related_datasets rather than merged in. Where the
  PhysioNet release pages (source_priority tier 1) and the project documentation at
  docs.b2ai-voice.org (tier 2) disagree, the PhysioNet value is stated and the
  disagreement recorded on the object concerned. The publisher is recorded as the
  origin https://physionet.org/, derived by truncating the PhysioNet release URLs the
  bundle states in full; the bundle supplies no registry identifier for PhysioNet and
  none is invented here.

file_collections:
  - id: doi:10.13026/37yb-1t42#files-features
    name: Derived audio features
    description: >-
      Dense binary feature files derived from the raw audio waveforms, distributed as
      Apache Parquet, together with plain-text feature tables. In release 3.1.0 the
      folder contains ppgs.parquet, sparc_ema.parquet, sparc_loudness.parquet,
      sparc_periodicity.parquet, sparc_pitch.parquet, torchaudio_spectrogram.parquet,
      torchaudio_mfcc.parquet, torchaudio_pitch.parquet and
      torchaudio_mel_spectrogram.parquet, plus audio_quality_metrics.tsv and
      static_features.tsv. Every file has a companion JSON data dictionary with the
      same file stem describing the feature and how it was prepared. Each Parquet
      element carries participant_id, session_id, task_name, n_frames and the tensor
      data for the feature.
    collection_type: processed_data
    path: features/
  - id: doi:10.13026/37yb-1t42#files-phenotype
    name: Phenotype tables
    description: >-
      Tab-delimited tables of information collected from the participant or another
      individual during the encounter, each with a JSON data dictionary of the same
      file stem. Release 3.1.0 organizes them as confounders, demographics, diagnosis
      (one file per condition, including airway_stenosis, amyotrophic_lateral_sclerosis,
      anxiety, benign_lesions, bipolar_disorder, cognitive_impairment, control,
      copd_and_asthma, depression, glottic_insufficiency, laryngeal_cancer,
      laryngeal_dystonia, laryngitis, muscle_tension_dysphonia, parkinsons_disease,
      precancerous_lesions, unexplained_chronic_cough and
      unilateral_vocal_fold_paralysis), enrollment, questionnaire and task. Rows are
      present for a participant only where at least one column is not missing, and a
      participant with repeated visits may have more than one row.
    collection_type: processed_data
    path: phenotype/
  - id: doi:10.13026/37yb-1t42#files-metadata
    name: Recording and task metadata
    description: >-
      A Parquet binary file and its data dictionary, added in release 3.1.0, holding
      information about each recording, including task instructions and prompts and
      information about the microphone used and its gain.
    collection_type: metadata
    path: metadata/
    source_caveats: >-
      Present in the release 3.1.0 page only; the release 3.0.0 page describes the
      dataset as features and phenotype without a metadata folder.

purposes:
  - name: Flagship ethically sourced voice dataset linked to health information
    response: >-
      To create a flagship, standardized and ethically sourced dataset of voices
      linked to health information, so that voice can be used as a biomarker of
      health in clinical care and so that voice AI research has a large,
      multi-institutional and diverse resource linked to multimodal health
      biomarkers.
  - name: Fill the gap in large, well-documented clinical voice data
    response: >-
      To address a gap in the availability of large-scale, diverse and
      well-documented voice data for clinical machine-learning applications, where
      previous studies produced promising results but used sample sizes that were
      too small or lacked the key metadata needed for training robust, clinically
      useful models.
  - name: Support development, benchmarking and validation of clinical AI models
    response: >-
      To provide a resource from which clinically applicable AI and machine-learning
      models can be developed, benchmarked or validated for the diagnosis of a wide
      range of health conditions from voice, including vocal pathologies and
      neurological, psychiatric and respiratory disorders.
  - name: Establish standards for audiomics data acquisition and AI readiness
    response: >-
      To introduce the field of acoustic biomarkers by defining standards for
      audiomics data acquisition, interoperability and AI readiness, so that voice
      and speech data collected by different groups can be compared and pooled.

tasks:
  - name: Disease detection and classification from voice
    response: >-
      Training machine-learning models for disease detection and classification using
      voice data, with labels covering diagnostic categories such as vocal
      pathologies, neurological disorders, psychiatric conditions and respiratory
      disorders.
  - name: Screening, diagnosis and monitoring through voice biomarkers
    response: >-
      Supporting clinical research into disease screening, diagnosis and monitoring
      through voice biomarkers, so that voice can serve as a non-invasive,
      cost-effective marker of health.
  - name: Model pretraining, fine-tuning, benchmarking and validation
    response: >-
      Serving as a resource for AI model pretraining, fine-tuning, benchmarking or
      validation.

addressing_gaps:
  - name: Small sample sizes in prior voice machine-learning studies
    response: >-
      Currently published AI and machine-learning models linking voice to the disease
      categories of interest use datasets ranging from 20 to 400 patients and report
      high diagnostic accuracies that do not generalize. In machine-learning
      applications for screening and diagnosis of laryngeal cancer, most studies
      reported training datasets of fewer than 300 patients and only two studies used
      more than one data modality.
  - name: Absence of standards for voice and speech data collection
    response: >-
      Comparing studies and pooling data is challenging because of the lack of
      standards in how voice and speech data are collected and measured, which
      precludes meta-analysis and limits external validity.
  - name: Industry voice data lacks clinical annotation and cannot be audited
    response: >-
      Industry holds vast amounts of voice data from users but lacks accurate clinical
      data or demographic information, which limits the ability to annotate data for
      AI training, to compare algorithmic outputs with criterion standard medical
      assessment, and to audit training datasets externally for fair representation of
      diverse populations.
  - name: Need for publicly available voice databases independent of the private sector
    response: >-
      As voice biomarkers continue to emerge it is crucial for the research community
      to have access to publicly available voice databases without reliance on the
      private sector, and to prospective validation of AI algorithms on external
      datasets.

