id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health
  information'
description: >-
  The adult Bridge2AI-Voice dataset is an ethically sourced, demographically diverse
  collection of data derived from voice, speech and respiratory-sound recordings,
  linked to clinical diagnoses, validated questionnaire responses and demographic
  metadata. It is produced by the Voice project, a Precision Public Health grand
  challenge funded by the NIH Common Fund Bridge2AI program. Release 3.1.0, published
  on PhysioNet on 1 May 2026, contains data for 833 adult participants collected at
  five sites in North America. Participants were selected on the basis of known
  conditions that manifest in the voice waveform, across voice disorders,
  neurological and neurodegenerative disorders, mood and psychiatric disorders and
  respiratory disorders, together with control participants without those
  conditions. The public release carries data considered low risk: derived
  representations of the audio such as spectrograms, mel spectrograms, MFCCs,
  articulatory and phonetic features, together with phenotype tables organized as
  demographics, confounders, per-condition diagnosis files, enrollment records,
  questionnaires and per-task metadata. The original voice recordings are not part
  of this release; raw audio is distributed separately under a controlled access
  mechanism.
