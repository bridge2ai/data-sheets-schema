id: https://chorus4ai.org/
name: CHoRUS Dataset
title: "Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution retrospective clinical
  dataset for acute and critical care AI. The project website's Current
  Released Dataset snapshot reports 50,000 patient admissions from ICU, PICU,
  and NICU, 1.6 Billion rows of EHR OMOP data, 7,642 admissions with radiology
  data, and 23 Tb of waveform data. Its Anticipated Final Dataset snapshot
  lists 100,000 patient admissions, 9 data modalities, and 14
  data-contributing hospitals. The August 2025 webinar describes access as
  controlled.
page: https://chorus4ai.org/
status: Current Released Dataset
keywords:
  - acute care
  - critical care
  - artificial intelligence
  - machine learning
  - electronic health record
  - OMOP
  - clinical notes
  - imaging
  - waveform telemetry
  - EEG

external_resources:
  - name: NIH RePORTER project record
    description: >-
      Official project record for application 10472824 and project number
      1OT2OD032701-01.
    external_resources:
      - https://reporter.nih.gov/project-details/10472824
  - name: AIM-AHEAD Bridge2AI for Clinical Care Cohort 2 webinar
    description: >-
      Tutorial dated September 9, 2025 that contains an explicitly dated
      August 2025 CHoRUS dataset and access snapshot.
    external_resources:
      - https://www.aim-ahead.net/media/jnzdnid3/bridge2ai-for-clinical-care-informational-webinar-cohort-2.pdf
  - name: CHoRUS project website
    description: >-
      Project documentation containing the Current Released Dataset and
      Anticipated Final Dataset snapshots.
    external_resources:
      - https://chorus4ai.org/
  - name: Historical CHoRUS GitHub organization overview
    description: >-
      Documentation captured on 2025-11-14 and retained by the current source
      manifest for repository, SOP, standards, contributor-role, and
      software-tooling detail.
    external_resources:
      - https://github.com/chorus-ai#table-of-contents

purposes:
  - name: Acute and critical care AI infrastructure
    response: >-
      Build the network, tools, standards, data, and education needed for
      machine-learning and artificial-intelligence models intended to improve
      the care, outcomes, and recovery of patients with acute or critical
      illness.
  - name: AI-ready critical care dataset
    response: >-
      Develop a publicly available, AI-ready critical care dataset as an
      ultimate project goal while promoting privacy, accountability, and
      clinical benefit.

tasks:
  - name: Acute and critical illness modeling
    response: >-
      Support AI/ML applications that characterize acute and critical illness,
      predict complications, and measure treatment response.
  - name: External model validation
    response: >-
      The funded project planned a holdout test set for external validation of
      AI-developed models.

addressing_gaps:
  - name: Multicenter critical care AI infrastructure gap
    response: >-
      Address the need for high-resolution multicenter data and infrastructure
      for actionable and trustworthy AI/ML in critical care.

creators:
  - name: Eric S. Rosenthal
    description: >-
      Principal investigator identified by NIH RePORTER; affiliated with
      Massachusetts General Hospital.

funders:
  - name: NIH Common Fund Bridge2AI
    description: >-
      NIH-funded Bridge2AI data-generation project. NIH RePORTER lists fiscal
      year 2022, award amount 5880300, project start
      2022-09-01T00:00:00, and project end 2026-11-30T00:00:00.
    grants:
      - id: https://reporter.nih.gov/project-details/10472824
        name: CHoRUS award
        grant_number: OT2OD032701
        description: >-
          Application ID 10472824; project number 1OT2OD032701-01; core
          project number OT2OD032701.

