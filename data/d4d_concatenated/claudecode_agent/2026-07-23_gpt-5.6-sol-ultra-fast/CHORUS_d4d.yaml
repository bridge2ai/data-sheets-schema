human_subject_research:
  involves_human_subjects: true
  description: >-
    The dataset contains retrospective clinical data from patient admissions
    involving acute and critical care. The source bundle does not provide an
    IRB identifier, IRB approval status, consent details, or a HIPAA
    determination.

participant_privacy:
  - name: Privacy and re-identification safeguards
    anonymization_method:
      - >-
        The funded project describes transforming data using approaches that
        limit re-identification.
      - >-
        As of August 2025, clinical notes were stored locally except for
        tokens, and imaging de-identification was in process for a larger
        cohort.

preprocessing_strategies:
  - name: Multimodal standardization and privacy transformation
    preprocessing_details:
      - Structured EHR data are standardized to the OMOP Common Data Model.
      - Clinical notes are extracted and tokenized using the OHNLP toolkit.
      - >-
        Data are transformed using approaches intended to limit
        re-identification.
      - >-
        Historical project documentation describes harmonization of EHR,
        waveform, imaging, and text data through unified standards.

labeling_strategies:
  - name: Planned prediction-target labeling
    labeling_details:
      - >-
        The funded project planned to acquire, standardize, store, visualize,
        and label data.
      - >-
        Historical project documentation describes a visualization and
        annotation environment intended to label data with targets important
        for prediction.

raw_sources:
  - name: Availability of source clinical data
    raw_data_details:
      - The August 2025 webinar describes the dataset as controlled access.
