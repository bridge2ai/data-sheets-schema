distribution_formats:
  - name: Structured EHR data
    description: >-
      EHR data standardized to the OMOP Common Data Model. The current website
      reports 1.6 Billion EHR OMOP rows; the August 2025 webinar describes
      access as controlled.
  - name: Tokenized clinical notes
    description: >-
      Clinical notes extracted and tokenized with the OHNLP toolkit. As of
      August 2025, notes were stored locally except for tokens and access was
      controlled.
  - name: Radiology imaging
    description: >-
      Imaging from PACS represented with DICOM. The current website reports
      7,642 admissions with radiology data; the August 2025 webinar describes
      access as controlled.
  - name: Waveform telemetry
    description: >-
      Bedside-monitor and gateway/middleware telemetry represented with WFDB
      and a PhysioNet-extended schema. The current website reports 23 Tb of
      waveform data; the August 2025 webinar describes access as controlled.
  - name: EEG waveforms
    description: >-
      EEG from hospital databases represented with EDF+ and Persyst. Extraction
      was in process and access was controlled as of August 2025.

