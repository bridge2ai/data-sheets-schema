known_limitations:
  - name: Historical clinical-note availability
    limitation_type: temporal_limitation
    limitation_description: >-
      As of August 2025, clinical notes were stored locally except for tokens.
    scope_impact: >-
      This is a dated statement about what was available in the enclave, not a
      claim about the current status of full clinical notes.
  - name: Historical imaging availability and de-identification
    limitation_type: temporal_limitation
    limitation_description: >-
      As of August 2025, 1000 images were available and de-identification was
      in process for a larger cohort.
    scope_impact: >-
      The current project website separately reports 7,642 admissions with
      radiology data; image count and admission count are different measures.
  - name: Historical EEG extraction status
    limitation_type: temporal_limitation
    limitation_description: >-
      EEG extraction was in process as of August 2025.
    scope_impact: >-
      The source bundle does not give a later current EEG extraction status.

subpopulations:
  - name: Critical care settings in the current release
    subpopulation_elements_present: true
    identification:
      - ICU admissions
      - PICU admissions
      - NICU admissions
    description: >-
      The Current Released Dataset snapshot identifies these three admission
      settings but does not provide a count for each setting.

acquisition_methods:
  - name: Retrospective multicenter clinical data acquisition
    acquisition_details:
      - >-
        The dataset uses retrospective data collection across 14 different
        hospitals.
      - >-
        The funded project describes acquisition of structured EHR data,
        tokenized unstructured EHR data, telemetry and EEG waveforms, imaging,
        and social determinants of health.

collection_mechanisms:
  - name: Electronic health records
    mechanism_details:
      - >-
        Structured EHR data include demographics, medication administration,
        provider-documented procedures and diagnoses, and high-frequency
        nursing flowsheets.
      - >-
        Clinical notes are extracted and tokenized using the OHNLP toolkit.
  - name: Radiology imaging
    mechanism_details:
      - Imaging is acquired from PACS and represented with DICOM.
  - name: Waveform telemetry
    mechanism_details:
      - >-
        Telemetry waveforms come from bedside monitors and
        gateway/middleware and use WFDB with a PhysioNet-extended schema.
  - name: EEG waveforms
    mechanism_details:
      - >-
        EEG waveforms come from hospital databases and use EDF+ and Persyst.

sampling_strategies:
  - name: Planned comprehensive and diverse sampling
    strategies:
      - >-
        The funded project planned sampling to cover comprehensive sets of
        patient conditions and clinical treatment strategies.
      - >-
        Historical project documentation describes federated access intended
        to support sampling for a balanced and diverse cohort.

data_collectors:
  - name: Data-contributing hospitals
    role: Clinical data contributing sites
    collector_details:
      - >-
        The Anticipated Final Dataset snapshot identifies 14
        data-contributing hospitals; the source bundle does not name all 14.

collection_timeframes:
  - name: Retrospective collection
    timeframe_details:
