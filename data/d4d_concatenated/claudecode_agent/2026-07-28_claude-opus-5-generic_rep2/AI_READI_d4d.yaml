file_collections:
- id: d4d:aireadi-fc-cardiac-ecg
  name: cardiac_ecg
  title: Cardiac electrocardiogram data
  description: >-
    Electrocardiogram data collected by a 12 lead protocol using the Philips PageWriter TC30
    cardiograph. Organized as one modality directory (ecg_12lead) containing one device
    directory (philips_tc30) and one directory per participant.
  path: cardiac_ecg
  collection_type:
  - processed_data
  conforms_to: WaveForm DataBase (WFDB), https://wfdb.readthedocs.io/en/latest/wfdb.html
- id: d4d:aireadi-fc-clinical-data
  name: clinical_data
  title: Clinical and survey data
  description: >-
    Clinical data collected through REDCap. Each CSV file in this directory is a one-to-one
    mapping to the OMOP Common Data Model tables.
  path: clinical_data
  collection_type:
  - processed_data
  conforms_to: >-
    Observational Medical Outcomes Partnership (OMOP) Common Data Model (CDM),
    https://ohdsi.github.io/TheBookOfOhdsi
- id: d4d:aireadi-fc-environment
  name: environment
  title: Home environmental sensor data
  description: >-
    Data collected through an environmental sensor device custom built for the AI-READI project
    (the LeeLab Anura), placed in the participant's home for 10 continuous days. Variables
    include ambient temperature, relative humidity, nitrogen oxides, volatile organic compounds,
    particulate matter (PM1.0, PM2.5, PM4, PM10) and multi-spectral light intensity.
  path: environment
  collection_type:
  - processed_data
  conforms_to: >-
    Earth Science Data Systems (ESDS) ASCII file format guidelines,
    https://www.earthdata.nasa.gov/esdis/esco/standards-and-practices/ascii-file-format-guidelines-for-earth-science-data
- id: d4d:aireadi-fc-retinal-flio
  name: retinal_flio
  title: Fluorescence lifetime imaging ophthalmoscopy
  description: >-
    Data collected through fluorescence lifetime imaging ophthalmoscopy (FLIO), an imaging
    modality for in vivo measurement of lifetimes of endogenous retinal fluorophores, acquired
    on Heidelberg Engineering equipment. Exported in .sdt file format and converted to DICOM for
    the dataset.
  path: retinal_flio
  collection_type:
  - processed_data
  conforms_to: Digital Imaging and Communications in Medicine (DICOM), http://medical.nema.org/
- id: d4d:aireadi-fc-retinal-oct
  name: retinal_oct
  title: Optical coherence tomography
  description: >-
    Data collected using optical coherence tomography (OCT). Device directories include
    heidelberg_spectralis, topcon_maestro2, topcon_triton and zeiss_cirrus.
  path: retinal_oct
  collection_type:
  - processed_data
  conforms_to: Digital Imaging and Communications in Medicine (DICOM), http://medical.nema.org/
- id: d4d:aireadi-fc-retinal-octa
  name: retinal_octa
  title: Optical coherence tomography angiography
  description: >-
    Data collected using optical coherence tomography angiography (OCTA), a non-invasive imaging
    technique that generates volumetric angiography images. Modality directories include enface,
    flow_cube and segmentation, each with heidelberg_spectralis, topcon_maestro2, topcon_triton
    and zeiss_cirrus device directories.
  path: retinal_octa
  collection_type:
  - processed_data
  conforms_to: Digital Imaging and Communications in Medicine (DICOM), http://medical.nema.org/
- id: d4d:aireadi-fc-retinal-photography
  name: retinal_photography
  title: Retinal photography
  description: >-
    Two-dimensional retinal photography (fundus photography). Modality directories include cfp
    (color fundus photography), faf (fundus autofluorescence) and ir (infrared), with device
    directories for icare_eidon, optomed_aurora, topcon_maestro2, topcon_triton,
    heidelberg_spectralis and zeiss_cirrus. Topcon images were exported in .fda file format and
    converted to DICOM for the dataset.
  path: retinal_photography
  collection_type:
  - processed_data
  conforms_to: Digital Imaging and Communications in Medicine (DICOM), http://medical.nema.org/
- id: d4d:aireadi-fc-wearable-activity-monitor
  name: wearable_activity_monitor
  title: Wearable physical activity monitor data
  description: >-
    Data collected through a wearable fitness tracker (Garmin Vivosmart 5) worn for 10 days,
    including number of steps, heart rate, sleep duration, oxygen saturation and related
    measures. Exported in .FIT file format and converted to the mHealth standard for the
    dataset.
  path: wearable_activity_monitor
  collection_type:
  - processed_data
  conforms_to: >-
    Open mHealth,
    https://www.openmhealth.org/documentation/#/schema-docs/schema-library
- id: d4d:aireadi-fc-wearable-blood-glucose
  name: wearable_blood_glucose
  title: Continuous glucose monitoring data
  description: >-
    Data collected through a continuous glucose monitoring device (Dexcom G6), which records
    blood glucose measurements in mg/dL every 5 minutes over a 10-day at-home monitoring period.
  path: wearable_blood_glucose
  collection_type:
  - processed_data
  conforms_to: >-
    Open mHealth,
    https://www.openmhealth.org/documentation/#/schema-docs/schema-library
- id: d4d:aireadi-fc-dataset-metadata
  name: dataset metadata and documentation files
  description: >-
    Metadata and documentation files distributed with the dataset, including per-datatype
    manifest.tsv files, a data quality file for the OMOP clinical data (dqd_omop.json),
    dataset_description.json, study_description.json, dataset_structure_description.json,
    a README file, a LICENSE file, a CHANGELOG file, and participants.tsv (which carries the
    suggested training/validation/testing split).
  collection_type:
  - metadata
  - documentation
  conforms_to: >-
    Clinical Dataset Structure (CDS) v0.1.1,
    https://cds-specification.readthedocs.io/en/v0.1.1/

purposes:
- id: d4d:aireadi-purpose-ai-ready-t2dm
  name: Enable AI/ML research into type 2 diabetes mellitus
  description: >-
    Purpose of the dataset as stated by the project.
  response: >-
    The purpose for creating the dataset was to enable future generations of artificial
    intelligence/machine learning (AI/ML) research to provide critical insights into type 2
    diabetes mellitus (T2DM), including salutogenic pathways to return to health. T2DM is a
    growing public health threat, yet current understanding of T2DM, especially in the context
    of salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches may improve
    understanding, but a key issue is the lack of data ready for training AI models; the
    AI-READI dataset is intended to fill this gap.
- id: d4d:aireadi-purpose-blueprint
  name: Establish a blueprint and standards for AI-ready dataset generation
  description: >-
    Secondary purpose stated across the project publications.
  response: >-
    AI-READI aims to establish standards, best practices and guidelines for collection,
    preparation and sharing of data for the purposes of AI/ML, including guidance from
    bioethicists, and to share this blueprint so that future data generation projects can
    follow it. Following FAIR (Findable, Accessible, Interoperable, Reusable) principles,
    AI-READI is presented as a model for future efforts to develop other medical/health
    datasets targeted for AI/ML. Deliverables of this aim include the Clinical Dataset Structure
    (CDS) specification and the FAIRhub data management, curation and sharing platform.
- id: d4d:aireadi-purpose-workforce
  name: Train a diverse AI research workforce
  description: >-
    Workforce development purpose associated with the data generation project.
  response: >-
    AI-READI hosts a year-long research internship programme to provide immersive training for
    individuals interested in working at the nexus of biomedicine and AI. The programme includes
    a two-week data science/programming bootcamp followed by a yearlong curriculum of didactic
    lectures and mentored research. The inaugural 2023-2024 cohort consisted of 10 interns, of
    whom 70% were women, 30% were Black, and 50% overall were from under-represented backgrounds
    based on NIH criteria.

tasks:
- id: d4d:aireadi-task-pseudotime
  name: Pseudotime manifold analysis of disease trajectories
  response: >-
    Data collection was specifically designed to permit downstream pseudotime manifold analysis,
    an approach used to predict disease trajectories by collecting and learning from complex,
    multimodal data from participants with differing disease severity (normal to
    insulin-dependent T2DM). The approach relies on dimensionality reduction, is agnostic to
    existing classification criteria or biases, and is intended to be used to reconstruct a
    temporal atlas of T2DM pathogenesis and reversal towards health.
- id: d4d:aireadi-task-hypothesis-agnostic
  name: Hypothesis-agnostic multimodal AI/ML model development
  response: >-
    The protocol was designed to be agnostic to hypotheses; the team assembled a data collection
    protocol composed of assessments from many health domains likely impacted by T2DM. The
    multi-modal dataset is gathered to facilitate downstream pseudotime manifolds and various
    applications in artificial intelligence. No specific labeling was performed, as the dataset
    is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML
    applications.

addressing_gaps:
- id: d4d:aireadi-gap-ai-ready-data
  name: Lack of large, high-quality, inclusive multimodal AI-ready datasets
  response: >-
    The ability to understand and affect the course of complex, multi-organ diseases such as
    T2DM has been limited by a lack of well-designed, high quality, large, and inclusive
    multimodal datasets. A major barrier to AI in this area has been the lack of diverse
    datasets that are AI ready for training AI models, which the AI-READI project is designed
    to address.
- id: d4d:aireadi-gap-demographic-diversity
  name: Under-representation of racialised groups in T2DM research
  response: >-
    The prevalence of T2DM is higher in certain racial and ethnic populations and the
    deleterious consequences are exacerbated in these populations. A meta-epidemiological review
    of T2DM studies published from 2000 to 2020 indicated that samples lacked racial and ethnic
    diversity. The AI-READI cohort is designed to be balanced in race/ethnicity, T2DM severity
    and biological sex, which the project describes as a demographic improvement over many
    previous epidemiological studies and clinical trials on T2DM.
- id: d4d:aireadi-gap-salutogenesis
  name: Limited understanding of salutogenesis in T2DM
  response: >-
    Salutogenesis in this context refers to the pathway from T2DM to health, the opposite of
    studying how healthy people proceed through pathogenesis resulting in T2DM. Current
    understanding of T2DM, especially in the context of salutogenesis, is limited; the long-term
    objective is a foundational dataset in T2DM, agnostic to existing classification criteria
    or biases, that can be used to reconstruct a temporal atlas of T2DM development and reversal
    towards health.

