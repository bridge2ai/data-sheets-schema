id: https://doi.org/10.60775/fairhub.3
name: AI-READI Flagship Dataset of Type 2 Diabetes
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal dataset collected by the Artificial Intelligence Ready and Equitable (also
  rendered "Exploratory") Atlas for Diabetes Insights (AI-READI) project, one of four data
  generation projects of the NIH Common Fund Bridge2AI program. The dataset consists of data
  collected from individuals with and without type 2 diabetes mellitus (T2DM), harmonized
  across three data collection sites (University of Alabama at Birmingham, University of
  California San Diego, University of Washington). Version 3.0.0 contains data from 2280
  participants collected between July 19, 2023 and May 1, 2025, comprising 356,343 files and
  approximately 3.82 TB. Modalities include survey/clinical data collected through REDCap and
  mapped to the OMOP Common Data Model, 12-lead electrocardiography, retinal photography, OCT,
  OCTA and fluorescence lifetime imaging ophthalmoscopy in DICOM, continuous glucose monitoring,
  wearable physical activity monitoring, and custom home environmental sensor data. The
  composition was designed for downstream AI/ML research on salutogenesis (the pathway from
  disease to health) in T2DM, with recruitment sampling aimed at approximately equal
  distribution across diabetes severity and, as an overall enrollment goal, across
  race/ethnicity and sex. The public release contains no protected health information;
  sex, race/ethnicity and medication information are removed from the public set and held
  under controlled access.
