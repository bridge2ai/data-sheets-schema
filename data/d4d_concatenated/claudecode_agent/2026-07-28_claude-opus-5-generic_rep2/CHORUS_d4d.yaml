relationships:
- name: Cross-modality harmonization and admission-level reporting
  description: >-
    What the source documents state about relationships across the dataset's
    modalities.
  relationship_details:
  - Unified standards harmonize multi-modal EHR, waveform, imaging, and text data,
    according to the CHoRUS GitHub organization overview.
  - Structured EHR data types (demographics, medication administration, procedures,
    nursing flowsheets, diagnoses) are standardized to the OMOP Common Data Model,
    with published metadata schemas based on OMOP and OMOP with extensions.
  - The CHoRUS project website reports counts at the admission level, including
    7,642 admissions with radiology data among 50,000 released patient admissions.

splits:
- name: Sequestered holdout test set
  description: >-
    Split described in the NIH RePORTER project abstract and the CHoRUS GitHub
    organization overview.
  split_details:
  - The dataset will provision a holdout test set, accessible for model external
    validation to aid marketplace adoption of AI-developed models for implementation
    in acute and critical care.
  - The CHoRUS Network describes sequestering holdout datasets for external
