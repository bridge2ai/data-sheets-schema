acquisition_methods:
- name: Retrospective acquisition from hospital clinical systems
  description: >-
    How the data associated with each instance was acquired, per the cohort 2
    informational webinar and the NIH RePORTER abstract.
  was_directly_observed: true
  was_inferred_derived: true
  acquisition_details:
  - Retrospective data collection from records generated during clinical care at
    contributing hospitals.
  - Structured electronic health record data, including provider documentation of
    procedures and diagnoses and high-frequency nursing flowsheet documentation.
  - Medication administration data with dosing time-stamped upon each infusion
    change or dose administration.
  - Imaging extracted from hospital PACS systems.
  - Waveform telemetry captured from bedside monitors via gateway/middleware.
  - Waveform EEG obtained from hospital EEG databases.
  - Clinical notes extracted and tokenized using the OHNLP toolkit, so the released
    note representation is derived rather than raw text.

collection_mechanisms:
- name: Site-based extraction under CHoRUS standard operating procedures
  description: >-
    Mechanisms and procedures used to acquire, standardize, and deliver data,
    described in the CHoRUS GitHub organization overview and the NIH RePORTER
    abstract.
  mechanism_details:
  - The project develops capabilities across a multi-center network to acquire,
    standardize, tokenize, store, visualize, and label data, including structured
    EHR data, tokenized unstructured EHR data, telemetry and EEG waveforms, imaging,
    and social determinants of health.
  - Data managers at contributing sites follow an interactive workflow diagram in
    the Chorus_SOP page describing the step-by-step process for extracting and
    contributing clinical data to CHoRUS, with links to SOP documents that have
    undergone internal validation and review.
  - Validated semantic mappings connect clinical data in various source formats to
    international standards; a chorus-mapping repository holds documentation, pooled
    tabular mappings, and an associated clinical validation SOP.
  - Sub-teams for Standards, Data Acquisition, and Tooling compile recordings and
    documentation, and issues arising during creation or submission of a data
    extract are posted to context-specific discussion locations.
  - Data contributing sites provide regular status updates on their progress
    creating and curating a CHoRUS-specific clinical data extract, either through
    the GitHub interface or through a Google Form whose submissions trigger a
    GoogleScript that calls the GitHub API to update status and issue information.
  used_software:
  - id: d4d:software_chorus_extract_upload
    name: chorus-extract-upload
    description: >-
      Repository with tools to create and upload a CHoRUS Data Extract. Public
      repository in the chorus-ai GitHub organization, written primarily in Python.
    license: MIT
  - id: d4d:software_chorus_sop
    name: Chorus_SOP
    description: >-
      CHoRUS centralized SOP documentation site, hosting the interactive workflow
      diagram and validated SOP documents for data contributing sites. Public
      repository in the chorus-ai GitHub organization, written primarily in MDX.
    license: Apache-2.0
  - id: d4d:software_data_acq_sop
    name: data_acq_SOP
    description: >-
      An online documentation SOP for the Data Acquisition Module. Public repository
      in the chorus-ai GitHub organization, written primarily in JavaScript.

sampling_strategies:
- name: Balanced and diverse cohort sampling across contributing sites
  description: >-
    Sampling approach described in the NIH RePORTER abstract and the CHoRUS GitHub
    organization overview. The source documents state sampling aims rather than
    reporting a completed representativeness assessment.
  is_sample: true
  source_data:
  - Structured electronic health record data from contributing hospitals
  - Tokenized unstructured electronic health record data
  - Telemetry and EEG waveforms
  - Imaging from hospital PACS
  - Social determinants of health
  strategies:
  - Establishing a legal framework for collecting data at scale, sampling to ensure
    comprehensive sets of patient conditions and clinical treatment strategies.
  - Federated access will enable sampling methods to ensure a balanced and diverse
    cohort.
  - Acquiring data of unprecedented diversity and high resolution across a
    multi-center network, with 14 of 20 academic centers contributing as Data
    Acquisition centers.
  - Ensuring that data elements feature appropriate contextual factors such as
    geographic distance to the nearest hospital.

