  confidential_elements_present: true
  confidentiality_details:
  - Structured electronic health record data from hospital admissions of critically
    ill patients
  - Clinical notes, which are stored locally at contributing sites except for tokens
  - Imaging drawn from hospital PACS, with de-identification in process for a larger
    cohort
  - Waveform telemetry from bedside monitors and waveform EEG from hospital databases
  - Access to all listed data types is controlled

