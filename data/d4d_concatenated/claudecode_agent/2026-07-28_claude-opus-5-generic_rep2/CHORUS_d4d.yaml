  - Standard operating protocols instruct data contributing sites about best
    practices for curating and delivering interoperable datasets.
  - 14 of the 20 academic centers in the collaboration contribute as Data
    Acquisition centers.
- name: Clinical collaborators
  description: >-
    Contributors to semantic mapping and validation, per the CHoRUS GitHub
    organization overview.
  role: Clinical collaborator contributing to semantic mapping and validation
  collector_details:
  - Clinical expertise is described as invaluable to semantic mapping and validation
    within CHoRUS.
  - A chorus-mapping repository holds documentation and pooled tabular mappings
    along with an associated clinical validation SOP for contributing to mapping
    efforts.
- name: Software developers and sub-teams
  description: >-
    Contributors producing the tooling used for acquisition and transformation, per
    the CHoRUS GitHub organization overview.
  role: Software contributor within CHoRUS
  collector_details:
  - Software contributors within CHoRUS have a broad range of expertise and have
    produced open-source tooling for transforming and interacting with clinical data.
  - A web guide for contributors and users of the CHoRUS software packages compiles
    documentation in the chorus-developer repository, and a package status page
    reports versions, maintainers, and other metadata about CHoRUS packages.

collection_timeframes:
- name: Retrospective collection within the award period
  description: >-
    What the source documents state about collection timing. The documents do not
