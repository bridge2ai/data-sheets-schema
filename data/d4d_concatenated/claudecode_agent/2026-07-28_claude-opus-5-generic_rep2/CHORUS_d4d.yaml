external_resources:
- name: CHoRUS cloud enclave and site-retained source data
  description: >-
    The dataset is not fully self-contained. OMOP and telemetry data are held in a
    controlled-access cloud enclave, while clinical notes remain stored locally at
    contributing sites except for tokens, according to the AIM-AHEAD Bridge2AI for
    Clinical Care cohort 2 informational webinar. Access to the enclave requires
    registration, a signed licensing agreement, and provisioned compute. The CHoRUS
    GitHub organization hosts the software and tooling used to interact with the
    data, together with standard operating procedures for contributing sites.
  external_resources:
  - Bridge2AI AI/ML for Clinical Care Collaborative Cloud (controlled-access enclave)
  - Clinical notes stored locally at data contributing sites, with only tokens held
    centrally
  - CHoRUS GitHub organization (https://github.com/chorus-ai), housing 28 repositories
    of software, semantic mappings, standard operating protocols, and project
    management overviews
  restrictions:
  - Controlled access to all data types
  - A signed licensing agreement is required before access to the dataset is granted
  used_software:
  - id: d4d:software_chorus_container_apps
    name: chorus-container-apps
    description: >-
      Set of dockerized container applications and associated configurations to be
      deployed to support CHoRUS services on Azure. Public repository in the
      chorus-ai GitHub organization, written primarily in JavaScript.

file_collections:
- id: d4d:CHoRUS_demographics
  name: Demographics
  description: >-
    Patient demographic data, one of the nine data types listed in the CHoRUS
    dataset table of the AIM-AHEAD Bridge2AI for Clinical Care cohort 2
    informational webinar. Standardized to OMOP and available under controlled
    access.
  conforms_to: OMOP
  collection_type:
  - processed_data
- id: d4d:CHoRUS_medication_administration
  name: Medication administration
  description: >-
    Medication administration records, with dosing time-stamped upon each infusion
    change or dose administration. Standardized to OMOP and available under
    controlled access.
  conforms_to: OMOP
  collection_type:
  - processed_data
- id: d4d:CHoRUS_procedures
  name: Procedures
  description: >-
    Procedure records documented by providers. Standardized to OMOP and available
    under controlled access.
  conforms_to: OMOP
  collection_type:
  - processed_data
- id: d4d:CHoRUS_nursing_flowsheets
  name: Nursing flowsheets
  description: >-
    High-frequency nursing flowsheet documentation. Standardized to OMOP and
    available under controlled access.
  conforms_to: OMOP
  collection_type:
  - processed_data
- id: d4d:CHoRUS_diagnoses
  name: Diagnoses
  description: >-
    Diagnosis records documented by providers. Standardized to OMOP and available
    under controlled access.
  conforms_to: OMOP
  collection_type:
  - processed_data
- id: d4d:CHoRUS_clinical_notes
  name: Clinical notes
  description: >-
    Clinical notes extracted and tokenized using the OHNLP toolkit. The webinar
    states that clinical notes are stored locally at contributing sites except for
    tokens, and that the published metadata schema for this data type is the OHNLP
    open source schema. Available under controlled access.
  conforms_to: OHNLP
  collection_type:
  - processed_data
- id: d4d:CHoRUS_imaging
  name: Imaging
  description: >-
    Imaging data extracted from hospital PACS systems. As of the September 2025
    AIM-AHEAD cohort 2 informational webinar, 1000 images were available, with
    de-identification in process for a larger cohort. The CHoRUS project website
    separately reports 7,642 admissions with radiology data in the current released
    dataset. Available under controlled access; published metadata schema is the
    DICOM schema.
  conforms_to: DICOM
  collection_type:
  - processed_data
- id: d4d:CHoRUS_waveform_telemetry
  name: Waveform telemetry
  description: >-
    Waveform telemetry acquired from bedside monitors via gateway/middleware.
    Available under controlled access; published metadata schema is the PhysioNet
    schema, extended. The CHoRUS project website reports 23 Tb of waveform data in
    the current released dataset.
  conforms_to: WFDB
  collection_type:
  - processed_data
- id: d4d:CHoRUS_waveform_eeg
  name: Waveform EEG
  description: >-
    Electroencephalography waveform data drawn from hospital EEG databases. The
    September 2025 webinar states that EEG extraction is in process. Available under
    controlled access; published metadata schemas are the open source EDF+ and
    Persyst schemas.
  conforms_to: EDF+ and Persyst
  collection_type:
  - processed_data

purposes:
- name: AI-ready critical care dataset for the NIH Bridge2AI program
  description: >-
    The purpose for which the dataset was created, as stated in the NIH RePORTER
    project abstract and the CHoRUS project website.
  response: >-
    The CHoRUS data generation project was created to meet the need for data
    supporting machine learning and artificial intelligence applications aimed at
    characterizing acute and critical care illness, predicting complications, and
    measuring treatment response among patients with acute or critical illness. Its
    overarching goal is to develop a publicly available, AI-ready critical care
    dataset while ensuring that the methods promote privacy, accountability, and
    clinical benefit, and while promoting a new generation of AI clinicians and
    scientists. The CHoRUS Network states its goal as developing the most diverse,
    high-resolution, ethically sourced, AI-ready data set to answer the grand
    challenge of improving recovery from acute illness.
- name: Provision of a holdout test set for external model validation
  description: >-
    A second stated purpose recorded in the NIH RePORTER project abstract.
  response: >-
    The dataset will also provision a holdout test set, accessible for model
    external validation to aid marketplace adoption of AI-developed models for
    implementation in acute and critical care.

tasks:
- name: Characterizing acute and critical care illness
  description: >-
    A machine learning and artificial intelligence application named in the NIH
    RePORTER project abstract as a target of the data generation project.
  response: >-
    Generating data for ML/AI applications aimed at characterizing acute and
    critical care illness among patients with acute or critical illness.
- name: Predicting complications
  description: >-
    A machine learning and artificial intelligence application named in the NIH
    RePORTER project abstract.
  response: >-
    Generating data for ML/AI applications aimed at predicting complications among
    patients with acute or critical illness. A visualization and annotation
    environment will label data with targets important for prediction.
- name: Measuring treatment response
  description: >-
    A machine learning and artificial intelligence application named in the NIH
    RePORTER project abstract.
  response: >-
    Generating data for ML/AI applications aimed at measuring treatment response
    among patients with acute or critical illness.
- name: External validation of AI models
  description: >-
    A task supported by the sequestered holdout data described in the NIH RePORTER
    project abstract and the CHoRUS GitHub organization overview.
  response: >-
    Sequestering holdout datasets for external validation, so that AI-developed
    models can be externally validated to aid marketplace adoption for
    implementation in acute and critical care.

addressing_gaps:
- name: Infrastructure for AI/ML in critical care
  description: >-
    The gap the dataset was created to fill, as stated in the NIH RePORTER project
    abstract.
  response: >-
    There is an urgent need for infrastructure to support artificial intelligence
    and machine learning in critical care. Developing high-resolution multi-center
    data sets is described as a critical first step towards actionable and
    trustworthy AI.
- name: Multi-center acquisition, standardization, and ethical sourcing at scale
  description: >-
    Challenges the project addresses in acquiring an AI-ready data set, as
    enumerated in the NIH RePORTER project abstract.
  response: >-
    The project addresses multiple challenges relevant for acquiring an AI-ready
    data set from more than 100,000 critically ill patients through three pillars:
    Data (standards, tool development and optimization, and data acquisition),
    Ethics (ethical and trustworthy AI), and People (team science, and skill and
    workforce development). Specific challenges named include establishing a legal
    framework for collecting data at scale, determining through community-facing
    ethics focus groups what data is appropriate for public sharing, ensuring data
    elements feature appropriate contextual factors such as geographic distance to
    the nearest hospital, developing multi-center capabilities to acquire,
    standardize, tokenize, store, visualize, and label data, and cultivating
    expertise in the lay and scientific community to improve AI literacy and
    utilization.

