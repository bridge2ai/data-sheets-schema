known_limitations:
- name: Imaging cohort limited pending de-identification
  description: >-
    Limitation reported in the AIM-AHEAD Bridge2AI for Clinical Care cohort 2
    informational webinar of September 9, 2025.
  limitation_type: coverage_limitation
  limitation_description: >-
    Imaging is currently limited to 1000 available images, with de-identification in
    process for a larger cohort.
- name: EEG waveform extraction incomplete
  description: >-
    Limitation reported in the AIM-AHEAD Bridge2AI for Clinical Care cohort 2
    informational webinar of September 9, 2025.
  limitation_type: coverage_limitation
  limitation_description: >-
    EEG waveform extraction is in process at this point and is therefore not yet
    fully available.
- name: Clinical notes retained at contributing sites
  description: >-
    Limitation reported in the AIM-AHEAD Bridge2AI for Clinical Care cohort 2
    informational webinar of September 9, 2025.
  limitation_type: integration_limitation
  limitation_description: >-
    OMOP and telemetry data are held in the enclave, but clinical notes are stored
    locally at contributing sites except for tokens, so full note text is not
    available alongside the other modalities in the enclave.
- name: Dataset smaller than the anticipated final dataset
  description: >-
    Difference between the released and anticipated dataset sizes reported on the
    CHoRUS project website, in the context of an award period ending 2026-11-30.
  limitation_type: temporal_limitation
  limitation_description: >-
    The current released dataset is reported as 50,000 patient admissions while the
    anticipated final dataset is reported as 100,000 patient admissions, so the
    dataset available at any given time is an in-progress subset of the planned
    resource.
- name: Acute and critical care scope
  description: >-
    Scope of the dataset as stated across the NIH RePORTER abstract, the project
    website, and the cohort 2 informational webinar.
  limitation_type: scope_limitation
  limitation_description: >-
    The dataset covers admissions of patients with acute or critical illness in ICU,
    PICU, and NICU settings, contributed by 14 hospitals within a collaboration of
    20 academic centers. Content outside acute and critical care and outside the
    contributing sites is out of scope.

