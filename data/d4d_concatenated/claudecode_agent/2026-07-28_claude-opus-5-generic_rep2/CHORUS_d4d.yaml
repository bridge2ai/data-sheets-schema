  timeframe_details:
  - The cohort 2 informational webinar describes the CHoRUS dataset as retrospective
    data collection.
  - NIH RePORTER records the project period as 2022-09-01 to 2026-11-30.
  - As of August 2025 the dataset covered 14 different hospitals with over 45,000
    unique admissions.

direct_collection:
- name: Collection from hospital records rather than from individuals
  description: >-
    Basis for the collection route, per the cohort 2 informational webinar and the
    NIH RePORTER abstract.
  is_direct: false
  collection_details:
  - The dataset is assembled by retrospective data collection from records held by
    contributing hospitals, including electronic health records, PACS imaging,
    bedside monitor telemetry, and hospital EEG databases.
  - Data are acquired and standardized by data contributing sites and delivered to
    CHoRUS rather than being collected from patients for this dataset.

missing_data_documentation:
- name: Modalities not yet fully present in the enclave
  description: >-
    What the cohort 2 informational webinar reports as absent or incomplete at the
    time of the September 2025 briefing. The source documents do not describe
    record-level missingness patterns or an imputation approach.
  missing_data_patterns:
  - Imaging limited to 1000 available images, with de-identification in process for
    a larger cohort.
  - EEG waveform extraction in process.
  - Clinical notes stored locally at contributing sites except for tokens.
  missing_data_causes:
  - De-identification of the larger imaging cohort is still in process.
  - Extraction of EEG waveform data is still in process.

raw_data_sources:
- name: Hospital clinical source systems at contributing sites
  description: >-
    Where the original data comes from before standardization, per the NIH RePORTER
    abstract and the cohort 2 informational webinar.
  source_description: >-
    Clinical records generated during care at 14 data contributing hospitals within
    a collaboration of 20 academic centers, comprising structured electronic health
    record data, unstructured clinical notes, imaging held in hospital PACS,
    waveform telemetry from bedside monitors and gateway/middleware, waveform EEG
    from hospital EEG databases, and social determinants of health.
  source_type:
  - Electronic health record systems
  - Picture archiving and communication systems (PACS)
  - Bedside monitors with gateway/middleware
  - Hospital EEG databases
  access_details: >-
    Access to all CHoRUS data types is controlled. Clinical notes remain stored
    locally at contributing sites except for tokens, so the underlying note text is
    not distributed with the enclave data.
  raw_data_format:
  - Structured EHR data prior to OMOP standardization
  - Unstructured clinical note text
  - Imaging in DICOM
  - Waveform telemetry
  - EEG waveforms in EDF+ and Persyst formats

ethical_reviews:
- name: CHoRUS Ethics pillar and community-facing ethics work
  description: >-
    Ethics and compliance activities described in the NIH RePORTER abstract and on
    the CHoRUS project website. The source documents do not report an institutional
    review board determination for the dataset.
  review_details:
  - Ethics is one of the project's three pillars, described as Ethical and
    Trustworthy AI.
  - The project performs community-facing ethics focus groups to determine what data
    is appropriate for public sharing.
  - The CHoRUS consortium evaluates community perspectives on clinical care AI to
    find ways to increase trustworthiness of provenance and privacy in AI, and new
    approaches are being created as the existing legal and regulatory landscape is
    analyzed.
  - Patient-focused efforts determine the ethical and legal approaches to manage
    privacy and bias while accounting for social determinants of health.
  - The project draws expertise from disciplines including team science, law,
    ethics, health services, biomedical science, engineering, and scientific journal
    publications.
  - The reviewing body identified in the source documents is the CHoRUS consortium,
    described on the project website as 60+ members across 20 different institutions.
  reviewing_organization: d4d:org_chorus_consortium

data_protection_impacts:
- name: Privacy and re-identification analysis
  description: >-
    Analyses of the impact of the dataset and its use on data subjects, as described
    in the NIH RePORTER abstract and the CHoRUS project website.
  impact_details:
  - The project transforms data using approaches that limit re-identification.
  - Community-facing ethics focus groups determine what data is appropriate for
    public sharing.
  - The consortium works to increase trustworthiness of provenance and privacy in
    AI, analyzing the existing legal and regulatory landscape.
  - The overarching goal includes ensuring that the methods promote privacy,
    accountability, and clinical benefit.

human_subject_research:
  name: Human subjects and special populations
  description: >-
    The dataset comprises clinical records of patients with acute or critical
    illness. The source documents do not state an IRB approval or name an ethics
    review board for the dataset.
  involves_human_subjects: true
  special_populations:
  - Patients with acute or critical illness
  - Patients admitted to intensive care units (ICU)
  - Patients admitted to pediatric intensive care units (PICU)
  - Patients admitted to neonatal intensive care units (NICU)

at_risk_populations:
  name: Critically ill, pediatric, and neonatal patients
  description: >-
    The released dataset includes admissions from PICU and NICU settings alongside
    adult intensive care, per the CHoRUS project website. The source documents do
    not describe assent procedures or guardian consent, and the protections listed
    below are project-wide access and de-identification measures rather than
    measures described as specific to pediatric, neonatal, or other at-risk groups.
  at_risk_groups_included: true
  special_protections:
  - Controlled access to all data types
  - A signed licensing agreement required before access is granted
  - Transformation of data using approaches that limit re-identification
  - Tokenization of unstructured clinical notes, with full note text retained
    locally at contributing sites
  - De-identification of imaging, in process for the larger cohort

participant_privacy:
- name: Privacy protections and de-identification
  description: >-
    Privacy handling described across the NIH RePORTER abstract, the cohort 2
    informational webinar, and the CHoRUS GitHub organization overview.
  anonymization_method:
  - Transforming data using approaches that limit re-identification
  - Extraction and tokenization of clinical notes using the OHNLP toolkit, with only
    tokens held centrally
  - De-identification of imaging, in process for a larger cohort
  privacy_techniques:
  - Controlled access to all data types through a cloud enclave
  - Privacy scanning tooling for medical records
  used_software:
  - id: d4d:software_privacy_scan_tool
    name: privacy_scan_tool
    description: >-
      A privacy scan tool for medical records. Public repository in the chorus-ai
      GitHub organization, written primarily in Python.
  - id: d4d:software_ctp_deid
    name: CTP-deid
    description: >-
      Public repository named CTP-deid in the chorus-ai GitHub organization. The
      organization overview captured 2025-11-14 lists the repository without a
      description.

preprocessing_strategies:
- name: Standardization, tokenization, and waveform conversion
  description: >-
    Preprocessing described in the NIH RePORTER abstract, the cohort 2 informational
    webinar, and the CHoRUS GitHub organization overview.
  preprocessing_details:
  - Acquired data are standardized to the OMOP Common Data Model.
  - Unstructured clinical notes are extracted and tokenized using the OHNLP toolkit.
  - Data are transformed using approaches that limit re-identification.
  - Waveform data are prepared and converted using CHoRUS waveform documentation and
    conversion scripts.
  - OMOP Location entities are geocoded, supporting contextual factors such as
    geographic distance to the nearest hospital.
  - Unified standards harmonize multi-modal EHR, waveform, imaging, and text data.
  used_software:
  - id: d4d:software_chorus_waveform
    name: chorus_waveform
    description: >-
      CHoRUS waveform documentation and various waveform conversion scripts. Public
      repository in the chorus-ai GitHub organization, written primarily in Jupyter
      Notebook. A companion repository, chorus_waveform_resources, holds resources
      which support the preparation and release of waveforms.
    license: MIT
  - id: d4d:software_uf_geocoding
    name: UF-Geocoding
    description: >-
      Open source code to geocode OMOP Location entities via DeGauss. Public
      repository in the chorus-ai GitHub organization, forked from
      bihorac-LAB/Exposome and written primarily in Python.
    license: MIT
  - id: d4d:software_ohnlp_toolkit
    name: OHNLP toolkit
    description: >-
      Toolkit used to extract and tokenize clinical notes. The cohort 2
      informational webinar lists the OHNLP open source schema as the published
      metadata schema for the clinical notes data type.

cleaning_strategies:
- name: Site characterization reports and mapping validation
  description: >-
    Quality review activities described in the CHoRUS GitHub organization overview.
    The source documents do not describe record-level cleaning rules or instance
    removal criteria.
  cleaning_details:
  - Characterization reports are produced and returned to sites following their data
    submissions.
  - Semantic mappings connecting clinical data in various source formats to
    international standards are validated, with a clinical validation SOP for
    contributing to mapping efforts.
  - Standard operating protocols instruct data contributing sites about best
    practices for curating and delivering interoperable datasets.
  used_software:
  - id: d4d:software_chorus_reports
    name: CHoRUSReports
    description: >-
      Repository dedicated to producing characterization reports to return to sites
      following their data submissions. Public repository in the chorus-ai GitHub
      organization, written primarily in R.

labeling_strategies:
- name: Visualization and annotation environment for prediction targets
  description: >-
    Labeling activity described in the NIH RePORTER abstract and the CHoRUS GitHub
    organization overview. The source documents do not report an annotation
    platform, protocol, annotator demographics, or inter-annotator agreement.
  labeling_details:
  - A visualization and annotation environment will label data with targets
    important for prediction.
  - The project develops capabilities across a multi-center network to acquire,
    standardize, tokenize, store, visualize, and label data.

raw_sources:
- name: Retention of source data at contributing sites
  description: >-
    What the source documents say about availability of data prior to
    standardization and tokenization.
  raw_data_details:
  - Clinical notes are stored locally at contributing sites except for tokens, so
    full note text is not distributed through the enclave.
  - Imaging originates in hospital PACS, with de-identification in process for a
    larger cohort beyond the 1000 images available as of September 2025.
  - The source documents do not describe a separate public access point for raw,
    pre-standardization data.

machine_annotation_tools:
- name: Automated extraction and transformation tooling
  description: >-
    Automated tooling named in the cohort 2 informational webinar and the CHoRUS
    GitHub organization overview. The source documents do not report accuracy
    metrics for these tools.
  tools:
  - OHNLP toolkit
  - privacy_scan_tool
  - UF-Geocoding with DeGauss
  tool_descriptions:
  - The OHNLP toolkit is used to extract and tokenize clinical notes; the OHNLP open
    source schema is listed as the published metadata schema for that data type.
  - privacy_scan_tool is a privacy scan tool for medical records, written primarily
    in Python.
  - UF-Geocoding is open source code to geocode OMOP Location entities via DeGauss.

existing_uses:
- name: Training activities and publications
  description: >-
    Existing uses reported in the AIM-AHEAD Bridge2AI for Clinical Care cohort 2
    informational webinar and the CHoRUS project website.
  examples:
  - Datasets are being used for training activities and publications.
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to
    Bridge2AI CHoRUS data through engagement, AI training, and mentorship, equipping
    trainees to apply AI/ML methods to big data analysis using multi-modal datasets
    from a broad range of cohort participants.
  - Cohort 2 of the training program ran on a schedule with a call for applications
    released September 2, 2025, an application deadline of September 26, 2025,
    notices of award on November 10, 2025, a program start of November 17, 2025, and
    a program end date of July 31, 2026, with up to 30 trainees selected.
  - Trainees receive hands-on training on the Bridge2AI AI/ML for Clinical Care
    Network and the Collaborative Cloud, including workshops on Jupyter Notebooks,
    the OHDSI tool stack, and the OHDSI/OMOP common data model.
  - The CHoRUS project website advertises hands-on training opportunities using the
    CHoRUS dataset to support the development of transnational AI in clinical care.

other_tasks:
- name: Trainee-developed use cases and downstream analytics
  description: >-
    Further applications described in the cohort 2 informational webinar and the
    CHoRUS GitHub organization overview.
  task_details:
  - Trainees develop and present use cases suitable to apply in Bridge2AI Data
    Topics, and participate in collaborative research on the Bridge2AI Clinical Care
    Cloud platform.
  - Trainees conduct innovative research at the intersection of healthcare
    challenges and AI/ML using multi-modal datasets from a broad range of cohort
    participants.
  - The GitHub organization overview invites those interested in downstream
    analytics on the mapped and assembled dataset to make contact.

future_use_impacts:
- name: Privacy, accountability, and validation considerations
  description: >-
    Considerations named in the NIH RePORTER abstract and the CHoRUS project
    website that bear on future uses of the dataset.
  impact_details:
  - The overarching goal includes ensuring the methods promote privacy,
    accountability, and clinical benefit.
  - Patient-focused efforts determine the ethical and legal approaches to manage
    privacy and bias while accounting for social determinants of health.
  - Community-facing ethics focus groups determine what data is appropriate for
    public sharing, so the scope of publicly shareable content is set by that
    process.
  - A holdout test set is provisioned for external validation of models, intended to
    aid marketplace adoption of AI-developed models for implementation in acute and
    critical care.
  - The CHoRUS project website displays a notice that the repository is under review
    for potential modification in compliance with Administration directives.

intended_uses:
- name: Model development and validation in acute and critical care
  description: >-
    Recommended applications stated in the NIH RePORTER abstract, the CHoRUS project
    website, and the cohort 2 informational webinar.
  examples:
  - Building machine-learning and artificial-intelligence-derived models to improve
    the care and outcomes of patients requiring critical care.
  - Characterizing acute and critical care illness, predicting complications, and
    measuring treatment response among patients with acute or critical illness.
  - External validation of AI models against the sequestered holdout test set.
  - Training and education in AI/ML for clinical care, including trainee use cases
    on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud.
  usage_notes: >-
    Access is controlled and requires registration and a signed licensing agreement;
    within the AIM-AHEAD training program, a ".edu" email address is required to
    gain access to the dataset.

distribution_formats:
- name: Controlled-access cloud enclave
  description: >-
    How the dataset is made available, per the cohort 2 informational webinar and
    the CHoRUS project website. The GitHub organization overview gives
    www.bridge2ai.org/chorus as the project website for inquiries. The chorus-ai
    GitHub organization distributes software and documentation rather than the
    clinical dataset itself.
  access_urls:
  - https://chorus4ai.org/
- name: Registration and access provisioning process
  description: >-
    The access route described in the cohort 2 informational webinar for the
    AIM-AHEAD Bridge2AI for Clinical Care training program: participants fill out a
    registration form with name, email, and institution and sign a licensing
    agreement included in the registration form; once access is granted and compute
    is provisioned, an email is sent. A ".edu" email address is required to gain
    access to the dataset.

third_party_sharing:
- name: Sharing beyond the contributing institutions
  description: >-
    The dataset is made available to parties outside the contributing institutions
    under controlled access, per the NIH RePORTER abstract and the cohort 2
    informational webinar.
  is_shared: true

license_and_use_terms:
  name: Controlled access under a signed licensing agreement
  description: >-
    Terms of use recorded in the cohort 2 informational webinar and the CHoRUS
    GitHub organization overview. No license is stated for the clinical dataset
    itself in the source documents.
  license_terms:
  - All CHoRUS data types are listed with controlled access control.
  - Participants fill out a registration form with name, email, and institution;
    once access is granted and compute is provisioned, an email is sent.
  - All participants must sign a licensing agreement included in the registration
    form before gaining access to the dataset.
  - Within the AIM-AHEAD Bridge2AI for Clinical Care training program, a ".edu"
    email address is required to gain access to the dataset; the webinar notes this
    is not a barrier to acceptance into the program and that program administrators
    will assist with access if needed.
  - The CHoRUS GitHub organization overview states that the project is licensed
    under the MIT License, referring to the code repositories of the chorus-ai
    organization; individual repositories also list Apache-2.0 (Chorus_SOP) and MIT
    (chorus_waveform, chorus-extract-upload, UF-Geocoding). The source documents do
    not state a license for the clinical dataset.
  - The CHoRUS project website states that the content on the website is solely the
    responsibility of the authors and does not necessarily represent the official
    views of the NIH.
  - The CHoRUS project website lists Ciera McCrary, MGH, Program Manager, as the
    contact (cmccrary@mgh.havard.edu, reproduced as published on the site).
  contact_person: mailto:cmccrary@mgh.havard.edu

regulatory_restrictions:
  name: Access control and compliance review status
  description: >-
    Regulatory and access restrictions stated in the source documents. The documents
    do not state a HIPAA compliance determination for the dataset; HIPAA and GDPR
    appear only as topics of a training curriculum workshop.
  regulatory_restrictions:
  - Access control for every listed data type is recorded as controlled in the
    cohort 2 informational webinar dataset table.
  - The CHoRUS project website displays the notice "This repoitory is under review
    for potential modification in compliance with Administration directives."
  confidentiality_level: restricted

maintainers:
- name: CHoRUS consortium and Massachusetts General Hospital program management
  description: >-
    Who supports, hosts, and maintains the dataset and its associated software, per
    the CHoRUS project website and the GitHub organization overview.
  role: academic_institution
  maintainer_details:
  - The CHoRUS consortium comprises 60+ members across 20 different institutions,
    with Massachusetts General Hospital as the NIH awardee organization.
  - Ciera McCrary, MGH, Program Manager, is listed as the website contact
    (cmccrary@mgh.havard.edu).
  - The GitHub organization overview lists access requests to dbold@emory.edu or
    jared.houghtaling@tuftsmedicine.org and gives www.bridge2ai.org/chorus as the
    project website.
  - Versions, maintainers, and other metadata about CHoRUS software packages are
    reported on a package status page, with documentation compiled in the
    chorus-developer repository.

updates:
  name: Ongoing expansion toward the anticipated final dataset
  description: >-
    Planned changes described across the CHoRUS project website, the cohort 2
    informational webinar, and the GitHub organization overview. The source documents
    do not state an update frequency.
  update_details:
  - The current released dataset of 50,000 patient admissions is reported alongside
    an anticipated final dataset of 100,000 patient admissions across 9 data
    modalities from 14 contributing hospitals.
  - De-identification of a larger imaging cohort beyond the 1000 currently available
    images is in process.
  - EEG waveform extraction is in process.
  - Data contributing sites provide regular status updates on their progress
    creating and curating a CHoRUS-specific clinical data extract; these statuses
    are tracked in the Standards Project or the Data Acquisition Project.
  - Task tracking aggregates issues across repositories into a central project
    space, with per-repository projects being phased out and migrated.
  - The NIH project period runs to 2026-11-30.

extension_mechanism:
  name: Contribution through the chorus-ai GitHub organization
  description: >-
    Mechanisms for others to contribute to the dataset and its tooling, per the
    CHoRUS GitHub organization overview.
  contribution_url: https://github.com/chorus-ai
  extension_details:
  - The chorus-ai GitHub organization houses active repositories providing software
    and tooling, validated semantic mappings, standard operating protocols, and
    project management overviews.
  - Clinical collaborators can contribute to mapping efforts through the
    chorus-mapping repository, which holds documentation, pooled tabular mappings,
    and an associated clinical validation SOP.
  - Issues encountered in creating or submitting a data extract can be posted in the
    Standards Discussions or Data Acquisition Discussions.
  - Sites can submit status updates through the GitHub interface directly or by
    submitting a Google Form.
  - Contributors and users of the CHoRUS software packages are directed to a web
    guide compiling documentation in the chorus-developer repository.
  - Those interested in downstream analytics on the mapped and assembled dataset are
    invited to reach out using the published contact details.

is_deidentified:
  name: De-identification status
  description: >-
    De-identification approach described in the NIH RePORTER abstract, the cohort 2
    informational webinar, and the GitHub organization overview. The source documents
    do not state whether identifiable elements remain in the released data.
  method: >-
    Transformation of data using approaches that limit re-identification, extraction
    and tokenization of clinical notes with the OHNLP toolkit so that only tokens are
    held centrally, and de-identification of imaging prior to release.
  deidentification_details:
  - The project transforms data using approaches that limit re-identification.
  - Clinical notes are stored locally at contributing sites except for tokens.
  - Imaging de-identification is in process for a cohort larger than the 1000 images
    available as of September 2025.
  - The chorus-ai GitHub organization includes a privacy scan tool for medical
    records and a CTP-deid repository.
