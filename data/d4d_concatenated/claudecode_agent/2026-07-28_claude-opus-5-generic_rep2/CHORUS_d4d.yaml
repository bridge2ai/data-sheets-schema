id: d4d:CHoRUS
name: CHoRUS
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
description: >-
  A multi-center, multi-modal, high-resolution clinical dataset of acute and critical
  care hospital admissions, generated by the CHoRUS (Patient-Focused Collaborative
  Hospital Repository Uniting Standards) for Equitable AI project, one of four data
  generation projects in the NIH-funded Bridge2AI consortium. The dataset combines
  structured electronic health record data standardized to the OMOP Common Data
  Model, tokenized unstructured clinical notes, imaging, waveform telemetry, and
  waveform EEG, together with social determinants of health and other contextual
  factors. The CHoRUS project website reports a current released dataset of 50,000
  patient admissions from ICU, PICU, and NICU settings, 1.6 billion rows of EHR
  OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data, and
  an anticipated final dataset of 100,000 patient admissions spanning 9 data
  modalities contributed by 14 hospitals. The AIM-AHEAD Bridge2AI for Clinical Care
  cohort 2 informational webinar (September 2025) reports that, as of August 2025,
  the dataset covered 14 different hospitals with over 45,000 unique admissions.
  Data collection is retrospective and access is controlled.
page: https://chorus4ai.org/
conforms_to: OMOP Common Data Model (OHDSI), with modality-specific standards for
  tokenized clinical notes (OHNLP), imaging (DICOM), waveform telemetry (WFDB), and
  waveform EEG (EDF+ and Persyst)
is_tabular: false
